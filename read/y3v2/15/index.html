e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T6606,"])</script><script>self.__next_f.push([1,"\u003ch1 class=\"heading_1\"\u003e\u003ca class=\"heading-link\" href=\"/read/y3v2/2\"\u003eChapter 2:\u003cbr/\u003eA Gentle Exam\u003c/a\u003e\u003c/h1\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIT WAS A Thursday, past the middle of May.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSome of the students who had become third-years were tackling their studies earnestly, at a pace unlike last year. Shimazaki, who I had gone to the bookstore with the other day, was one of them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was nothing surprising about it. It was the time of year when they began to seriously consider their desired schools and fields of study.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere were many other things to do besides studying. It would also be important to order college brochures and gather information for open campus events.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNormally, the opportunities for students at this school to go off-campus were limited, but third-years were permitted to visit open campuses during summer vacation, provided they applied. There, it became possible to attend mock classes, entrance exam information sessions, individual consultations, and hands-on events. To see and feel firsthand the atmosphere and compatibility that brochures and websites couldn\u0026apos;t convey was surely a very important factor.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis wasn\u0026apos;t limited to higher education; it was much the same for those who wished to find employment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs summer approached, they\u0026apos;d to begin preparing to enter the workforce from various angles, with things like company information sessions, workplace tours, and internships. Most students would decide between further education or employment, but some exceptions existed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor example, there were cases where their futures had already been decided by various factors.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt might have been unofficially decided that they would join a company run by their family or relatives, or they may have chosen to become a freelancer without pursuing further education or employment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOr perhaps there were also those who couldn\u0026apos;t choose either path yet, putting off their decision until the very last minute.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe one thing that could be said for all of them was that they were simply busier than they\u0026apos;d been in the past two years.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Have you gotten used to the class environment yet?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMorishita, who sat behind me, whispered as homeroom progressed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;More or less.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;More or less, is it? If you\u0026apos;re acting tough, you can be honest with me, you know?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m not acting tough.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Really? Perhaps you ought to think of me as a priest and confess the painful secrets of your heart?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wasn\u0026apos;t acting tough in the slightest, but I wondered why she was so concerned.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Could it be that you\u0026apos;re worried about me...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer words were so unexpected that I slightly turned around.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWas her sudden asking without any warning her own way of showing concern?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s right. I was thinking I\u0026apos;d have a good laugh at your expense if you\u0026apos;d said you hadn\u0026apos;t fit in.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s not \u0026apos;that\u0026apos;s right\u0026apos; at all. You don\u0026apos;t seem worried in the slightest.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eApparently, she just wanted to make fun of me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI never thought I would end up regretting even the simple act of turning around.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh? Did you want me to be worried about you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Not at all.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI answered from the bottom of my heart, but Morishita, far from believing me, only grew more suspicious.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Aww, so stubborn. This is why people whose names start with \u0026apos;A\u0026apos;, end with \u0026apos;Ka\u0026apos;, and are ten hiragana characters long are just hopeless. It\u0026apos;s no wonder the statistics show as much.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a rare case that seemed to hit on an incredibly specific person.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe were in the middle of homeroom, after all; it would be best not to engage with her any further.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Did you just think it would be better not to engage with me?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I won\u0026apos;t deny it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI decided to forget about the student behind me and turn back to the front.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2014;It has been decided that a new exam will begin tomorrow.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMashima-sensei said just as homeroom was about to end.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy classmates wore somewhat dubious expressions on their faces.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey seemed to feel that something was off about the suddenness of \u0026apos;tomorrow\u0026apos; and the timing of his announcement with only a minute or two left in homeroom. Normally, things that tended to require long explanations, like special exams, were discussed when there was plenty of time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDid he intend to continue his explanation even if it cut into our break time?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo, in the first place... was Mashima-sensei\u0026apos;s current way of speaking, his phrasing, just a coincidence?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlthough a certain turn of phrase caught my attention, I first waited for the teacher to continue.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The reward will be a change in Class Points: plus 50 points for the first-place class, plus 20 points for second place, no change for third place, and minus 25 points for fourth place. The details, including what will happen to the rewards in the unlikely event of a tie, will be announced in one week. Until then, try to conduct yourselves as befitting of students. And this time, I will not be taking any questions whatsoever.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe finished his explanation with just that, without displaying any rules or rewards on the monitor.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was all. Just as he added the last part, the chime sounded.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd then, without truly accepting any questions about the exam\u0026apos;s details or anything else, the teacher left the classroom.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThough it was brief, it was a memorable explanation that left me with a few lingering questions.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe wording could be taken in two ways, the remark about student-like conduct. And then\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe class fell silent for a moment, but Hashimoto pulled back his chair and stood up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Looks like this school just loves to dump one troublesome thing after another on us, huh? So, what\u0026apos;s the plan, leader? Wanna start the discussion now?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto said, as he turned to look at me, intending to get the discussion started.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If possible, I\u0026apos;d like to hear my classmates\u0026apos; opinions first. After that, I\u0026apos;ll organize the information and then give my own thoughts.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I said that to the whole class, Hashimoto gave a small laugh.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Whoops, my bad. I didn\u0026apos;t mean anything weird by that laugh. It\u0026apos;s just, I was thinking this is the complete opposite of how it was when Sakayanagi was our leader. Our former leader often made decisions on her own without asking for anyone\u0026apos;s input, you know.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSakayanagi was the type to figure out the essence of things all on her own. No, in that sense, I was the same as her, but as luck would have it, I was currently in the middle of gathering information on the class as well.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wanted to hear what kind of statements the students would make during the discussion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA brief silence fell over the room, but Sanada soon spoke up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;For sensei to not mention any details about the exam at all is, of course, a first. The only things revealed were the rewards and that it starts after one week\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs he brought up Mashima-sensei\u0026apos;s words again, Tamiya\u0026#xa0;raised her hand as if to chime in.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBarely five seconds passed since the discussion began. With just a few words spoken, things were set in motion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Wait. I thought the week starting tomorrow was the exam period.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAmong the scant information we\u0026apos;d been given, it quickly became apparent that there were people who interpreted the exam differently.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I agree with Tamiya. I took it to mean the exam period starts tomorrow, and the results will be announced in a week.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe next to speak in agreement was Shimizu. He joined the discussion without hesitation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Really? Didn\u0026apos;t Mashima-sensei say the details would be announced in a week? If that\u0026apos;s the case, wouldn\u0026apos;t it be more natural to think of the week starting tomorrow as a preparation period for it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eImmediately after, Motodoi raised her hand and refuted Shimizu, adding her reasoning.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn Mashima-sensei\u0026apos;s statement, there were two phrases that seemed related to the exam period: \u0026quot;It has been decided that a new exam will begin tomorrow,\u0026quot; and \u0026quot;The details will be announced in one week.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf one took the former literally, the exam would begin tomorrow.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eConversely, if one took only the latter literally, we would be told the details in a week, and the exam would take place then.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was an expression that could be interpreted in subtly different ways depending on the listener.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...I see. You\u0026apos;re right, what Mashima-sensei said earlier does seem like it could be taken either way. Alright then, let\u0026apos;s start by getting a quick poll of everyone\u0026apos;s opinions. For those who had a clear interpretation of sensei\u0026apos;s words, could you please raise your hand? Who thinks that starting tomorrow is a preparation period, and the special exam will be held in one week?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSanada efficiently called for a show of hands. Nineteen students, more than half the class, raised their hands.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Next, who thought that the special exam period starts tomorrow, and the details and results will be announced in a week?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis time, it was fewer than before, with twelve people.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe students who hadn\u0026apos;t raised their hands for either option were likely either undecided or simply didn\u0026apos;t want to answer. Since this wasn\u0026apos;t something to be decided by a majority vote, Sanada didn\u0026apos;t press the issue.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNext, Shimazaki lightly raised his hand. He was one of the students who believed the time from tomorrow was a preparation period for the exam.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What\u0026apos;s certain at this point is that, either way, the rules probably aren\u0026apos;t that complex. The lack of explanation supports that, and the rewards aren\u0026apos;t that big. Since the school is the one judging, it means we\u0026apos;ll be made to compete in some visible way. If we\u0026apos;re thinking in really simple terms, something like test scores. He also mentioned \u0026apos;student-like behavior,\u0026apos; which I took to mean studying, the fundamental duty of a student.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed Shimazaki had listened carefully to Mashima-sensei\u0026apos;s words, as he\u0026apos;d apparently picked up on and focused on the \u0026apos;student-like behavior\u0026apos; part.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Another test? You\u0026apos;re kidding me, back-to-back?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto voiced his skepticism. Shimazaki was considering the possibility of competing based on simple class averages or total scores, rather than something with special rules like the \u0026apos;\u0026apos;Comprehensive Academic Ability Exam\u0026apos; from a little while ago, but Hashimoto seemed to doubt whether the school would really make them compete with written tests back-to-back.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It does feel a bit weird to think of them being back-to-back, but on the other hand, it seems totally plausible, don\u0026apos;t you think? If you interpret it to mean that studying isn\u0026apos;t something you do because you\u0026apos;re told, but something you\u0026apos;re supposed to do on your own, then the lack of rules makes sense. The possibility of competing via a pop quiz... yeah, I could see that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTsukaji, a female student who\u0026apos;d been listening next to Shimazaki, also nodded as if in agreement.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf a test were to be held suddenly in one week, that was certainly a strong possibility.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, the term \u0026apos;pop quiz\u0026apos; was also something of a contradiction.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eInherently, a pop quiz was only meaningful because it came without any warning or prior sign.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOnce it\u0026apos;d been announced that an exam would take place, its effectiveness as a pop quiz was diminished.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, that didn\u0026apos;t mean one could definitively conclude that a written exam would not be held, which was what made it difficult.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith no information disclosed about which subjects were on it or their difficulty, the students were forced to either study a broad range, narrow the scope on their own, or pick and choose subjects. If that were the case, academic ability alone would not necessarily determine the winner, because if their luck-based predictions were to hit the mark, even Ryuuen\u0026apos;s class, with its lower overall academic ability, would have a slim chance of victory.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlthough opinions were split between the two sides, not a single person tried to forcefully push the view they supported. The only thing they all had in common was the desire to \u0026quot;win.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was precisely why they were all contributing their raw opinions, so that they would have no regrets.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince it was impossible to definitively determine which interpretation was correct at this stage, the discussion continued. I had to genuinely appreciate their proactive attitude as they tried to move forward by breaking down Mashima-sensei\u0026apos;s brief explanation as much as possible.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis exam, devoid of any explanation of the rules, contained a clear intent, regardless of its content.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat intent was to see how long they could maintain a state of tension.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePeople could brace themselves and be highly vigilant against a visible danger.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePeople could move forward with a clear objective, but it wasn\u0026apos;t easy to work toward a vague, undefined goal; it was just that difficult to maintain a state of tension for so long. In addition to not knowing whether the exam would take place \u003cem\u003eover \u003c/em\u003ea week or \u003cem\u003ein \u003c/em\u003ea week, even its content remained unknown.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was why people tried to establish a \u0026apos;provisional\u0026apos; goal, and in fact, they had to.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat was being discussed was the creation of a guidepost to move forward without getting stuck.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust having this discussion would be a good opportunity for growth for those involved.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I get what you\u0026apos;re trying to say, but our approach will be completely different depending on whether we prepare for this week or for a week from now. We should just commit and steer in one direction.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith about half of the break left, Shimazaki, who disliked that the discussion was going nowhere, made that proposal to decide on a course of action.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What do you think, Ayanokouji? It\u0026apos;s about time you gave us an answer.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThinking this was the leader\u0026apos;s time to step up, Shimazaki asked me for the class\u0026apos;s direction on behalf of everyone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;My opinion is mostly the same as the ones already brought up. The fact that the school deliberately didn\u0026apos;t explain the rules this time means it must be something that can be understood and established without explanation. Also, considering the short one-week period, the written exams and sports tests that have been discussed so far as extensions of our classes are naturally candidates.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So, you\u0026apos;re saying you think the same as me... that the special exam will be held a week from now?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, I\u0026apos;m just not ruling out the possibility. It\u0026apos;s entirely possible an exam could start covertly tomorrow. For example, the exam might be to present the conclusion we reached in this discussion.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI answered as if retracing everyone\u0026apos;s discussion, while also mixing in my own opinion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...What we prepared for. You mean the school will check that a week from now?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah. One class crammed for a test. One class predicted it would be physical and acted accordingly. One class came up with an answer that combined both. This could be the basis for judgment.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat said, no student was about to confidently give their seal of approval to that idea. What was important was to broaden their perspective and to keep in mind that there were numerous, albeit finite, options.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;A lot of different opinions have been thrown around, but one that I feel is a strong possibility is that our \u0026apos;attitude in daily life\u0026apos; will be observed for the next week, starting tomorrow.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere were various initiatives in daily life. Delinquency Prevention Week, Disaster Prevention Week, Reading Week, Greeting Campaign Month, Traffic Safety Month, Compassion Month. I could list more if I tried.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Attitude in daily life...? That\u0026apos;s an opinion I hadn\u0026apos;t even considered...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSanada, who\u0026apos;d been quiet since the beginning of the discussion, muttered with a hand on his chin, a hint of surprise in his voice.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe seemed to have doubts about this opinion being raised as a strong possibility.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So, you\u0026apos;re saying they\u0026apos;d do something similar to what happened in our first year?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s right. That time, the period was one month, but we weren\u0026apos;t even notified beforehand that it was an exam. As a result, the former Class D that I was in suffered a major defeat, losing all of its Class Points, but\u0026#x2014;this time, I think they\u0026apos;re trying to test whether all four classes can live upstanding and proper school lives on the assumption they\u0026apos;ve figured it out. Even if our daily attitudes are unrelated to this exam, there\u0026apos;s great significance in just keeping this in the back of our minds.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see. Our attitude is just our daily behavior; it doesn\u0026apos;t require us to be tied down to just that. It\u0026apos;s a given that we should take classes seriously, avoid being late or absent as much as possible, and be prudent in our actions before and after school.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince it wasn\u0026apos;t something that would take up extra time, there was no harm in keeping it as a candidate.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Still, if all the classes are careful about their attitudes and prepare for that, the judging criteria will become extremely strict. We\u0026apos;ll be required to act as role models not just on campus, but outside as well, all the way to Keyaki Mall and our routes to and from school.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe difference between victory and defeat might come down to a truly trivial matter. Walking past a single piece of trash on the ground without picking it up. Even something like that could lead to a one-point deduction and, consequently, defeat.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I, uh, also kind of thought there might be an exam about our private lives. I interpreted the teacher\u0026apos;s words, \u0026apos;try to act like a student,\u0026apos; that way.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNishi\u0026#xa0;also answered somewhat reservedly, as if to agree with my statement.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSeveral students who had the same idea but hadn\u0026apos;t voiced it nodded in agreement. However, there was still some information lacking to be certain of this.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor now, I deliberately didn\u0026apos;t touch on Mashima-sensei\u0026apos;s words, which no one else pointed out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was the fact that he had only said \u0026apos;exam,\u0026apos; not \u0026apos;special exam.\u0026apos; The month-long observation of their daily attitudes conducted behind the scenes after enrollment hadn\u0026apos;t been under the framework of a special exam, either.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eChabashira-sensei also had a history of omitting the \u0026apos;special\u0026apos; part when she spoke about the first-year sports festival.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, I couldn\u0026apos;t deny the possibility that it was a simple slip of the tongue, so I thought it wouldn\u0026apos;t be too late to act after gathering more information first.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s no need to be certain. Or rather, it doesn\u0026apos;t change the fact that we should spend the next week operating on the premise that some kind of exam will be held. This is just a proposal to add this to our considerations.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShimazaki also accepted the possibility of an exam based on their attitude in daily life without denying it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If it were something that took up our time, we\u0026apos;d have to choose carefully, but our private lives are an inseparable part of us. It doesn\u0026apos;t take much extra effort in and of itself.\u0026#x2014;I agree with that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was something that would have no adverse effects, even if their understanding of the exam was split in two.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd as something everyone could work on equally, all of them readily showed their approval.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 2: A Gentle Exam\",\"volumeId\":\"y3v2\",\"chapterIndex\":15,\"prevChapter\":{\"volumeId\":\"y3v2\",\"chapter\":14,\"title\":\"Part 3\"},\"nextChapter\":{\"volumeId\":\"y3v2\",\"chapter\":16,\"title\":\"Part 1\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 2\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration
