e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T2ea7,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 3\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAFTER THAT, I focused on Hashimoto and Shiraishi to get information about Class C.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI asked about personal matters that couldn\u0026apos;t be understood from the OAA or written exams alone, like who was on good terms with whom, and who wasn\u0026apos;t. Although Hashimoto knew a lot about the class, there seemed to be many things that only girls could see, and I was able to hear a few useful stories that made me nod in agreement.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAbout an hour passed since we started chatting, and the caf\u0026#xe9; gradually grew more crowded as evening approached.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as I started to consider wrapping things up\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Crap... Ayanokouji again...?!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA voice exclaimed, and the pair who arrived at the next table turned to us with a look of dismay.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was Ike and Hondou, whom I ran into at the school cafeteria yesterday afternoon.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We\u0026apos;re fated to meet.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt my reply, he narrowed his eyes, his displeasure obvious.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What do you mean, \u0026apos;fated to meet\u0026apos;?! Don\u0026apos;t act so familiar, you traitor.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDisgust oozed from his expression. I thought they would immediately move to another table, like at the cafeteria, but with few empty seats available, the two of them sat down reluctantly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSeeing the Class A students, Hashimoto deliberately chose to act casual.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We\u0026apos;re in different classes, but we\u0026apos;re still students at the same school, so let\u0026apos;s get along, eh? Or are you planning to complain every time you see his face?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not like I mean to... but you can see why I\u0026apos;m pissed, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIke and his friend, not wanting to direct their frustration at Hashimoto, glanced over and glared at me again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why\u0026apos;re you so bent out of shape about it? It\u0026apos;s not like Ayanokouji transferred from C to A. Just changing classes had no effect on your Class Points. It\u0026apos;s not like it cost you anything out of your own pockets. And besides, you guys are the almighty Class A, aren\u0026apos;t ya?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThough it was a struggle, he tried to flatter them to somehow reduce their pointless frustration.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah, we\u0026apos;re Class A, but Ayanokouji hid how smart he was. That\u0026apos;s pretty much like betraying the class from the start, ain\u0026apos;t it? And then the second he transferred, bam, a perfect score. I\u0026apos;ve never seen such a nasty move.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI produced proper results in the latter half of my time in Horikita\u0026apos;s class, but perhaps for Ike and the others, that was also part of the problem.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And besides\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSeemingly with more to complain about, Ike averted his gaze from Hashimoto and looked at me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m hearing all sorts of nasty rumors, y\u0026apos;know. That you intentionally set up both Sakura and Maezono to get expelled from the very beginning. Don\u0026apos;t tell me... You didn\u0026apos;t get Haruki expelled too, did you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA former friend of ours. The name of a student who\u0026apos;d been especially close to Ike and Sudou came up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Haruki? Who\u0026apos;s that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs if the name didn\u0026apos;t ring a bell, Hashimoto looked blankly and tilted his head a little to the left.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yamauchi Haruki!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe slammed his hand on the table and shot to his feet. The cup shook from the impact, but thankfully, it didn\u0026apos;t tip over.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIke had been complaining but remained calm until now, but it seemed that was an unexpected landmine.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yamauchi... Oh, ahh, right, there was a student with that name. My bad, my bad. He was in another class, so I totally forgot about him. But I remember now. Anyway, Sakayanagi was the one who did that, right? Ayanokouji had nothin\u0026apos; to do with it, man. It\u0026apos;s way outta line to blame him for every little thing.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eApologizing for having genuinely forgotten, Hashimoto hastily tried to calm him down.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll never let a guy like you get me expelled, you hear me!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hey, I said calm down, Ike. No need to go raising such a huge death flag for yourself. Nobody wins if we start trading barbs here.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSeeing Ike\u0026apos;s increasingly heated and uncontrollable attitude, even Hashimoto started to panic. He probably couldn\u0026apos;t care less about what Ike and Hondou were feeling, but he knew this commotion wasn\u0026apos;t good for his class.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe had to have heard about one of the possible rules for this special exam from Horikita, but I wondered if he really understood it. On the other hand, if this was all an act\u0026#x2014;a strategy to drag down Class C\u0026#x2014;then it might be worthy of praise, but it wasn\u0026apos;t a clever method, as it also increased the risk of their own defeat. If he raised his voice any further and continued his belligerent attitude, he would inevitably be noticed and without a doubt be subject to a penalty.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Okay... Maybe I was overreacting a bit, but we in Class A have the right to complain this much. Just how much did they pay you to betray our class?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTheir frustration built up considerably, partly due to their defeat in the last special exam.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat wasn\u0026apos;t a problem that could be easily resolved by trying to smooth it over like Hashimoto did.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed it would be better if I just took the brunt of it and let them vent their anger.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Who can say. It might be twenty million, it might be thirty million. Unfortunately, I have no intention of revealing the exact figure to you here.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was important for me to maintain a cold and detached response.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBy doing so, Ike and the other guy could direct their hatred toward me without any hesitation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd by bringing that back to their class, they could rally together, firmly united against a common enemy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAbove all, if I got worked up here, Class C would only be at a disadvantage. Even if the school was monitoring the situation with cameras or external observers, I wanted to paint a picture where Class A was the aggressor, and Class C was trying to settle things peacefully.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was unclear if the school was monitoring us that closely, but even if our daily behavior was unrelated to the exam, it was important to act with discipline like a proper student, as it had a small, yet not insignificant, effect on our monthly Class Points.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe teachers\u0026apos; words to each class would surely be a good opportunity to make our classmates re-evaluate the importance of sticking to the fundamentals.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t you come crying to us later, regretting your decision and wanting to come back to our class.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter voicing his complaints one last time, the pair slightly distanced themselves as they returned to their seats.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey just sat down. I didn\u0026apos;t want to make their caf\u0026#xe9; time uncomfortable.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Shouldn\u0026apos;t we head back soon?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI called out to the three of them, picked up my nearly empty cup, and stood up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah, good call. We\u0026apos;ve said what we needed to.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto replied in agreement, and Morishita and Shiraishi followed suit.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen, after we left the caf\u0026#xe9;, Hashimoto turned and glanced back toward Ike\u0026apos;s group.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;All that complaining... Ike\u0026apos;s completely getting worked up over nothing. The way he blames every little thing on Ayanokouji tells me the atmosphere in their class is still pretty damn heavy. They need to get their heads on straight already.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Logically speaking, that may be so, but I believe it would be better to cut them some slack. After all, if I were a student in Class A, I\u0026apos;m sure I would be on edge in their current situation as well.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Maybe so, but still. In the first place, Ayanokouji, was it really okay not to deny taking the money? That guy\u0026apos;s gonna go around spreading all kinds of rumors, true or not.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It doesn\u0026apos;t matter. It\u0026apos;s already being whispered about as a rumor, anyway. The situation won\u0026apos;t change just because it seems a little more plausible.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So you don\u0026apos;t care what other people think of you, huh? Still, connecting it to the Yamauchi incident... that\u0026apos;s a bit of a leap, to say the least.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs Hashimoto looked on, exasperated, Morishita turned a suspicious eye toward me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You never know. With a man like Ayanokouji Kiyotaka, you can never tell what he\u0026apos;s doing behind the scenes. It\u0026apos;s a long shot, I know, but he might have had a hand in it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Nah, that\u0026apos;s going too far. But if, on the off chance, it were true, that\u0026apos;d make him one hell of a reliable ally. The stronger your allies are, the better, after all.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo matter how things turned out, Hashimoto was determined to see it in a positive light.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you overestimate me, you\u0026apos;ll only be more disappointed later.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then I\u0026apos;ll gladly overestimate you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wanted to hedge my bets just in case, but it seemed he wasn\u0026apos;t going to let me.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 3\",\"volumeId\":\"y3v2\",\"chapterIndex\":31,\"prevChapter\":{\"volumeId\":\"y3v2\",\"chapter\":30,\"title\":\"Part 2\"},\"nextChapter\":{\"volumeId\":\"y3v2\",\"chapter\":32,\"title\":\"Part 4\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 2\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Nanase Tsubasa's Monologue\",\"href\":\"monologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Fitting In\",\"href\":\"ch-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"ch-1-p-1.xhtml\",\"index\":12},{\"label\":\"Part 2\",\"href\":\"ch-1-p-2.xhtml\",\"index\
