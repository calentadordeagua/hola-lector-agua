formed at all. The students of Ryuuen\u0026apos;s class also had an exemplary week, remaining calm and taking no action to entrap students from other classes. It seemed that the outcome would be decided by a truly trivial difference.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I waited in the classroom that morning for my classmates to arrive, a bewildered-looking Hashimoto came hurrying in.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This is a real pain, Ayanokouji. At the eleventh hour, it\u0026apos;s confirmed that Rokkaku\u0026#xa0;and Yano\u0026#xa0;will be absent.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ryuuen?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I suspected that right off the bat, too, but apparently there wasn\u0026apos;t any real contact. They\u0026apos;re saying they just got sick and have a fever.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAccording to Hashimoto\u0026apos;s explanation, the two of them had an idea what caused the fever; apparently, when Rokkaku and the others were shopping a few days ago, a sick-looking employee at the mall sneezed on them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom what I heard, it seemed like an unavoidable, unforeseen event.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRokkaku and the others also understood the cause of their poor health and moreover, they hadn\u0026apos;t done anything reckless like forcing themselves to come to school, so there was nothing to blame them for.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;d love it if today\u0026apos;s tardiness and absences don\u0026apos;t affect the exam... but things are never that simple, are they?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Probably.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePresumably, the scope of the exam extended right up to that morning\u0026apos;s attendance, covering the entire week.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf that was the case, the absences might have dealt a fatal blow in such a neck-and-neck competition.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;At this point, all we can do is hope your 90% prediction is wrong, Ayanokouji, and that this exam has nothing to do with it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto pinned his hopes on the few remaining unknown rules and details of the exam.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t think it\u0026apos;s a concern with this class, but make sure to tell everyone not to slander the two who are absent under any circumstances. Even if we lose because of it, it won\u0026apos;t affect the general state of the class.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I figured you\u0026apos;d say that, so I\u0026apos;ve already sent out the notice.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePhone in hand, Hashimoto showed me the screen, indicating he just sent the message.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter that, the classmates who arrived in the classroom seemed to have learned of the situation; though they appeared slightly disheartened and shaken, they quickly composed themselves and went to their seats with expressions of acceptance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey understood very well that panicking wouldn\u0026apos;t get the class points back.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFurthermore, not abandoning the hope Hashimoto had for an unrelated exam, I could see several students tackling their studies.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 7: The Observer\",\"volumeId\":\"y3v2\",\"chapterIndex\":43,\"prevChapter\":{\"volumeId\":\"y3v2\",\"chapter\":42,\"title\":\"Part 3\"},\"nextChapter\":{\"volumeId\":\"y3v2\",\"chapter\":44,\"title\":\"Part 1\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 2\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Nanase Tsubasa's Monologue\",\"href\":\"monologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Fitting In\",\"href\":\"ch-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"ch-1-p-1.xhtml\",\"index\":12},{\"label\":\"Part 2\",\"href\":\"ch-1-p-2.xhtml\",\"index\":13},{\"label\":\"Part 3\",\"href\":\"ch-1-p-3.xhtml\",\"index\":14},{\"label\":\"Chapter 2: A Gentle Exam\",\"href\":\"ch-2.xhtml\",\"index\":15},{\"label\":\"Part 1\",\"href\":\"ch-2-p-1.xhtml\",\"index\":16},{\"label\":\"Part 2\",\"href\":\"ch-2-p-2.xhtml\",\"index\":17},{\"label\":\"Chapter 3: Getting to Know the Opponent\",\"href\":\"ch-3.xhtml\",\"index\":18},{\"label\":\"Part 1\",\"href\":\"ch-3-p-1.xhtml\",\"index\":19},{\"label\":\"Part 2\",\"href\":\"ch-3-p-2.xhtml\",\"index\":20},{\"label\":\"Part 3\",\"href\":\"ch-3-p-3.xhtml\",\"index\":21},{\"label\":\"Part 4\",\"href\":\"ch-3-p-4.xhtml\",\"index\":22},{\"label\":\"Part 5\",\"href\":\"ch-3-p-5.xhtml\",\"index\":23},{\"label\":\"Part 6\",\"href\":\"ch-3-p-6.xhtml\",\"index\":24},{\"label\":\"Part 7\",\"href\":\"ch-3-p-7.xhtml\",\"index\":25},{\"label\":\"Part 8\",\"href\":\"ch-3-p-8.xhtml\",\"index
