ouncil President Horikita.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re quite early.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile exchanging pleasantries, we entered the still-empty Student Council room together. Then, as I took my seat at the president\u0026apos;s desk, Nanase-san stood beside me and showed me two printed sheets of paper.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I just received these materials from Mr. Houjou, the homeroom teacher for Class 1-A.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEach paper contained information on a single student.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOne was Kusanagi Minato-kun from Class 1-A. The other was Maki Yuuma-kun from Class 1-D.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And here is an overview of the incident.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter looking over their profiles, she handed me another sheet of paper.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t particularly complicated, and a quick glance was all I needed to grasp the contents.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;These two got into a big fight, is that it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe date was last Friday, and the location was behind the first-year dormitories.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMaki-kun from Class D called out Kusanagi-kun from Class A, and after a verbal dispute, it escalated into a fight.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBoth struck each other multiple times, including blows to the face. Maki-kun\u0026apos;s injuries would take about three weeks to heal, Kusanagi-kun\u0026apos;s about one. The fight came to light when a third party discovered them as they were returning from behind the dorms. Fortunately, they\u0026apos;ve been able to attend school since Monday\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If it was behind the dorms, then there\u0026apos;s no footage of them fighting, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s right. It was in a blind spot for the security cameras. It seems a third party who was also returning to the dorms discovered the two injured students as they were about to head back.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhere the cameras are, and where they aren\u0026apos;t.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seems even the first-years, who haven\u0026apos;t been here long, are getting a grasp of such things.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It seems we should ask the school to install more security cameras.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I agree. I did try to briefly ask Houjou-sensei\u0026#xa0;about it, but he told me to hear the details from the students and didn\u0026apos;t elaborate.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;To maintain fairness, I suppose. That\u0026apos;s likely the reason they\u0026apos;ve tossed the judgment of this case over to us in the student council.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNanase-san, who nodded firmly, seemed to have something on her mind, and began to speak.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Actually, last year, I was also called to the student council for a similar incident.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You, Nanase-san? Were you assaulted by someone?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, that\u0026apos;s not it. It was a problem caused by a classmate\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter a slight, wry smile, Nanase-san explained the details.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBefore last summer, when Housen Kazuomi-kun of Class D and Utomiya Riku-kun of Class C passed each other in the hallway, a trivial matter led to an argument, and a tense standoff ensued where they glared at each other from point-blank range. Just when it seemed a fight could break out at any moment, students from their respective classes who were nearby started to argue, and a Class C student, having reached their limit, struck a Class D student. Then, riding that momentum, they charged at Housen-kun and tried to punch him, only to be spectacularly countered.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Just as Utomiya-kun was about to throw a punch, the teachers happened to pass by and the commotion was somehow settled, but afterward, the problem was brought before the student council.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe student Housen-kun had struck, suffered injuries that took about three weeks to heal. However, the Class C student threw the first punch and also hit another student. Deciding who was at fault and how to judge the matter dragged on, requiring numerous discussions and taking two weeks to resolve. Nanase-san shared all of the details with me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Nagumo-senpai must have had a tough time.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I think so, too.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThough exasperated, I couldn\u0026apos;t help but laugh.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Was it that funny of a story?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, that\u0026apos;s not it. It\u0026apos;s just that the same kinds of trouble happen everywhere, and I had a similar experience in my first year.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is...that so?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It was similar to your situation. A classmate of mine got into a fight with one of Ryuuen-kun\u0026apos;s classmates.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt that time, my brother was sitting in the very seat I occupied.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSudou-kun struck a student in the special building and a discussion was held to determine responsibility, such as who threw the first punch. My brother didn\u0026apos;t unilaterally take anyone\u0026apos;s side, but fulfilled his duty as student council president with an impartial eye. I\u0026apos;m sure Nagumo-senpai did the same last year.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s almost become an annual tradition for the new students to cause trouble at least once, and when I imagined it like that, I found it kind of amusing.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hearing your story makes it feel more real. I can imagine something similar happening here again next year.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In that case, it will be your turn to pass judgment as student council president.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Eh, m-me?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If things proceed as they are, that\u0026apos;s what will happen. Will you do it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...I hope I\u0026apos;m up to the task... Besides, they say all the past student council presidents have graduated from Class A... and I\u0026apos;m currently in Class D.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNanase-san answered without much confidence, but she was without a doubt the leading candidate.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;d do best not to worry about precedents born from chance. Until now, the student council president could only come from Class A or B, yet here I am, serving in the position despite having started in Class D. And while this is a good example, there\u0026apos;s no guarantee that I will even be in Class A at graduation.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe current Class A was also a temporary position.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a position we wouldn\u0026apos;t have reached without Ayanokouji-kun\u0026apos;s help.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I believe you, at least, are more than qualified to become the student council president. Have some confidence.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Thank you very much. For now, I\u0026apos;d like to focus on producing solid results as a secretary.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThough hesitant, Nanase-san accepted my words earnestly, nodding and lowering her head.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The fact that their fight was brought to the student council is proof that this is a considerable dispute. I\u0026apos;m going to share a few of my thoughts before they arrive. I want you to lend a hand depending on the situation.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOne of them was a Class A student. I had the impression that students prone to this kind of violence tended to be concentrated in Class D or Class C, but this time was different. Kusanagi-kun not only had high physical ability of B+, but his academic ability was also a B+.\u0026#xa0;I wanted to consider the possibility that he was quick-witted and take the measures I could.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the time we had left, I verbally explained a few plans to Nanase-san.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSoon, when the scheduled time came, a dry knock sounded at the student council room door.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It seems they\u0026apos;ve arrived. Please, come in.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt Nanase-san\u0026apos;s reply, two male students appeared, glaring at each other.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBoth had unique hairstyles and an appearance that would make anyone think of them as delinquents.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey showed no signs of remorse whatsoever and seemed to think the other was entirely responsible.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut what caught my eye the most was not their hairstyles or attitudes, but their faces.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Those are some... pretty bad injuries.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe injuries were so bad that even Nanase-san couldn\u0026apos;t help but comment on them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe one standing to my left was the first-year Class D student, Maki-kun.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe one standing to my right was the first-year Class A student, Kusanagi-kun.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI\u0026apos;d heard that even minor injuries could be diagnosed as taking two or three weeks to fully heal, but they looked quite battered. They must have really gone at it, as both of their faces were swollen. Maki-kun\u0026apos;s injuries were particularly bad, making it clear who got the upper hand in the fight.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I assume you both know why you\u0026apos;ve been summoned to the student council room?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNanase-san coaxed them, as if guiding them to explain voluntarily.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Nah, I got no idea. Why the hell do I gotta get called in here? This guy\u0026apos;s the one at fault.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKusanagi-kun immediately retorted, turning to Maki-kun and baring his teeth.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? Don\u0026apos;t fuck with me! You\u0026apos;re the one who threw the first punch!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Bullshit! You\u0026apos;re the one who came at me first. Well, you missed, though!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA loud shouting match began over who made the first move and who threw the first punch.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNanase-san and I exchanged a quick glance and listened to the boys\u0026apos; argument for a while.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe judged that it would be easier later if they blew off some steam first.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt first, they just tried to pin the blame on each other for starting the fight, but it gradually devolved into unnecessary verbal abuse, and eventually escalated to irrelevant topics like height and appearance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;How childish.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Childish, indeed.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven though they were only just first-year high school students, they were starting to cross a line that couldn\u0026apos;t be ignored. What\u0026apos;s more, they showed no signs of calming down; on the contrary, they looked like they were about to start brawling right there in the student council room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s quite enough noise. I\u0026apos;m going to have to ask you both to be quiet for a moment.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNanase-san, unable to watch any longer, warned them as such, but they merely glanced at her and didn\u0026apos;t stop their tirade.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey were clearly underestimating her because she was a girl. That attitude was plain to see.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut as long as I knew Nanase-san\u0026apos;s words reached them, that was enough.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTheir complaining was simply a matter of mutual dissatisfaction.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn that case, all I had to do was prepare to hand down a ruling that would be most dissatisfying for them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI sent a look to Nanase-san.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOur eyes met, and she gave a small nod, having perfectly grasped my intentions.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you\u0026apos;re going to continue arguing as you please, then this meeting is unnecessary. We may have to impose a heavy penalty on both of you. Is that acceptable?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs Nanase-san spoke with a cold, dismissive tone, I silently pulled back my chair and stood up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? Hold on, there\u0026apos;s no way I\u0026apos;m gonna accept that!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This ain\u0026apos;t got nothing to do with the damn student council, especially not some girl buttin\u0026apos; in!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Please use formal language when you speak.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey glared back at my warning, their gazes filled with discontent.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI suppose they think I\u0026apos;ll back down because of that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This is ANHS, and the student council is vested with a certain amount of authority. This discussion is a precious opportunity to bring the truth to light. If you two insist on trampling all over it, then we have no intention of wasting any more time. Let us compile a report for the teachers, Student Council President.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t you dare end this on your own!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You two are quite welcome to leave. Or, if you wish to continue your argument, please do so in the hallway.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince they only just enrolled, trying to convince them that this wasn\u0026apos;t for the good of the class would have no effect.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor those two, the worst-case scenario was that neither of their claims would be accepted. I doubt their cheap pride would allow for that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut little by little, the two of them began to feel the strange atmosphere in the room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince they entered the Student Council Office, I hadn\u0026apos;t said a single word to them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Why is the Student Council President just staying quiet? Say something.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI guess because I gave a speech at the entrance ceremony, they do recognize that I\u0026apos;m the student council president.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;ve been watching this whole time, so you get which one of us is in the wrong, don\u0026apos;t you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEach of them pointed at the other, continuing to insist that they weren\u0026apos;t at fault, only the other was.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey\u0026apos;d likely intended to continue until I gave my answer.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut I continued my silence.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI conveyed to them with my silence that the situation was not worth speaking about.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEventually, my scheme began to bear fruit, and the noisy Student Council Office fell silent.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was proof they realized they were the only ones making a ruckus.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey still opened their mouths as if to protest, but their words were too quiet for me to hear, and eventually, their lips sealed shut. Both of them, at nearly the same time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What are we supposed to do...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd then, with a strained voice, he asked for my judgment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It seems they have the will to resolve this. What will you do, Student Council President?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI gave a quiet nod and signaled for Nanase-san to proceed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Alright then, first, Kusanagi-kun, would you please tell us your side of the story again? In the meantime, no matter how dissatisfied you may be, Maki-kun, I must ask that you absolutely refrain from speaking. I assure you that you will be given an equal opportunity to speak next. Is that understood?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUpon hearing Nanase-san\u0026apos;s admonition, Maki-kun bit his lip hard and gave a slight nod.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This guy... Maki was givin\u0026apos; me a nasty look. So when I asked him what his problem was, he just suddenly snapped. After that, he called me out to the back of the dorms. I wasn\u0026apos;t gonna back down, so I went, and he immediately came at me swinging. Well, I had a hunch I was stronger, y\u0026apos;know, so I dodged it easily and fed him a counter.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOne side of the story. Of course, for Maki-kun, who had to listen, it probably wasn\u0026apos;t a story he could accept.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe tried to speak, not hiding his irritation, but his eyes met mine and he stopped himself just in time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was a risk that if he interrupted, he would be unilaterally branded the bad guy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf he stayed quiet, he would be given a chance to explain himself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed he had instinctively sensed that this was how the proceedings worked.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor a while after that, Kusanagi-kun continued his complaint that Maki-kun was entirely at fault, and when we determined that no further testimony would be forthcoming, we passed the turn to the long-suffering Maki-kun.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;He can just run his mouth all he wants. This guy conveniently left out everything that makes him look bad. In the first place, it\u0026apos;s \u0026apos;cause that bastard Kusanagi called me \u0026apos;defective\u0026apos; or whatever! I just wanted to make him take it back! And a \u0026apos;hunch\u0026apos;? No way, I was clearly the stronger one! You think I didn\u0026apos;t notice your legs trembling when you took that shot to the gut?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe yelled near Kusanagi-kun\u0026apos;s ear, his voice carrying all the irritation he\u0026apos;d been bottling up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eLooking slightly uncomfortable at Maki-kun\u0026apos;s words, he feigned ignorance, turning to look off in another direction to ignore him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eDefective goods\u003c/em\u003e. Now that\u0026apos;s a rather nostalgic phrase, isn\u0026apos;t it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs first-years in Class D, we were called the exact same thing. I wonder if that part of it, like some vile tradition, had been passed down at the school this year too.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePutting their stories together without emotion\u0026#x2014;-\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFirst, Kusanagi-kun made a remark mocking Maki-kun, calling him defective. Hearing this, an enraged Maki-kun called him out, went behind the dorms and demanded he take it back. However, Kusanagi-kun refused, and Maki-kun, unable to stand his attitude, couldn\u0026apos;t hold back and threw the first punch. The first blow didn\u0026apos;t land; instead, Kusanagi-kun\u0026apos;s counter hit its mark. From there, it became a fistfight of grappling and punching. As for the outcome, it seemed from the extent of his injuries that Maki-kun lost to Kusanagi-kun, but Maki-kun refused to admit it. He insisted that he\u0026apos;d been the one with the upper hand. On the other hand, Kusanagi-kun said that he won and that he stopped fighting the moment the victor was decided\u0026#x2014;or so he claimed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBecause their claims were complete opposites, it was impossible to judge either way.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKusanagi-kun glared again at Maki-kun, who\u0026apos;d just finished speaking, then his expression changed and he looked at me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, how should I say this... Student Council President, you understand my side of things, right? I mean, we\u0026apos;re both in Class A, after all. It was perfect self-defense.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis was the first time he used proper polite language with me, but I wasn\u0026apos;t so soft as to let my impression of him improve over something so simple.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The title of Class A is meaningless on its own. A fool in Class A will be punished, just as someone in Class D will be rewarded for good deeds.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;W-What? But\u0026#x2014;!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs if mentally slapping himself for trying to suck up to me, Kusanagi-kun\u0026apos;s attitude instantly changed again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSo even Class A has such violent-tempered students this year, huh.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It may be true that Maki-kun called you out, but that doesn\u0026apos;t mean it was right for you to retaliate so thoughtlessly. Especially since you immediately intuited that you were the stronger one, correct?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That is...!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, for someone so convinced of his own strength, you seem to have sustained some rather nasty injuries yourself, haven\u0026apos;t you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if Kusanagi-kun had a slight edge, they looked to be on about the same level.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThough he looked displeased, Kusanagi-kun averted his gaze at the remark.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026apos;Course you can\u0026apos;t answer that. You didn\u0026apos;t even win.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Shut the hell up, Maki. No matter how you slice it, I\u0026apos;m the stronger one.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf they didn\u0026apos;t apologize and reconcile as things stood, I would have to assign penalties based on the severity of their injuries\u0026#x2014;a ratio of four for Maki-kun and six for Kusanagi-kun.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was just as I\u0026apos;d begun to think that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In the first place, I didn\u0026apos;t even hit Maki this bad... Shit.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a slip of the tongue that escaped his lips unintentionally, rather than something he\u0026apos;d meant for us to hear.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNormally, I would have taken it as an act just to save his own skin, but Maki-kun, standing beside him, didn\u0026apos;t object to the remark at all; in fact, he made a gesture as if to ignore it. Given how things had gone up to this point, he absolutely should have argued back.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt that baffling behavior, Nanase-san and I exchanged a brief glance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What do you mean by that? When you say you \u0026apos;didn\u0026apos;t hit him this bad\u0026apos;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Nah, it\u0026apos;s nothin\u0026apos;.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It can hardly be \u003cem\u003enothing\u003c/em\u003e. Violence is violence, but it\u0026apos;s clear that Maki-kun has sustained more severe injuries. Combined with the school\u0026apos;s judgment, you may be the one to receive a harsher punishment. If that\u0026apos;s the case, shouldn\u0026apos;t you explain yourself properly?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe two of them, who never made eye contact except to glare at each other, momentarily met gazes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt looked like the kind of eye contact Nanase-san and I occasionally exchanged.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s nothin\u0026apos; more to say... What I just said is everything. Right, Maki?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah... Still, you\u0026apos;re definitely the one who\u0026apos;s worse, Kusanagi.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? Are you seriously still saying that?!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI supposed this was what one would call being back to square one.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If no new testimony is forthcoming, we will have to conclude matters here. Are you two really okay with this?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I also felt, from what I\u0026apos;ve heard, that both of you are equally at fault.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I restated the student council\u0026apos;s opinion, both showed their dissatisfaction and retorted, but they gradually fell silent. It seemed they understood that without new information, there would be no progress.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Fine, I get it. We just have to take the same punishment, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Tch... Then fine. This was a complete waste of time...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFollowing Maki-kun\u0026apos;s lead, Kusanagi-kun also reached that conclusion, albeit with some reluctance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt the very least, when they first showed up in the Student Council Office, they\u0026apos;d been trying to pin the blame on the other.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was clear that both sides hoped for a lighter punishment for themselves.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had Nanase urge them once more to speak if they had anything to say, but their hardened attitudes didn\u0026apos;t soften. As the student council couldn\u0026apos;t hold them indefinitely, we dismissed them for the day, sent them home, and told them the results would be delivered later.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 2\",\"volumeId\":\"y3v2\",\"chapterIndex\":20,\"prevChapter\":{\"volumeId\":\"y3v2\",\"chapter\":19,\"title\":\"Part 1\"},\"nextChapter\":{\"volumeId\":\"y3v2\",\"chapter\":21,\"title\":\"Part 3\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 2\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Nanase Tsubasa's Monologue\",\"href\":\"monologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Fitting In\",\"href\":\"ch-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"ch-1-p-1.xhtml\",\"index\":12},{\"label\":\"Part 2\",\"href\":\"ch-1-p-2.xhtml\",\"index\":13},{\"label\":\"Part 3\",\"href\":\"ch-1-p-3.xhtml\",\"index\":14},{\"label\":\"Chapter 2: A Gentle Exam\",\"href\":\"ch-2.xhtml\",\"index\":15},{\"label\":\"Part 1\",\"href\":\"ch-2-p-1.xhtml\",\"index\":16},{\"label\":\"Part 2\",\"href\":\"ch-2-p-2.xhtml\",\"index\":17},{\"label\":\"Chapter 3: Getting to Know the Opponent\",\"href\":\"ch-3.xhtml\",\"index\":18},{\"label\":\"Part 1\",\"href\":\"ch-3-p-1.xhtml\",\"index\":19},{\"label\":\"Part 2\",\"href\":\"ch-3-p-2.xhtml\",\"index\":20},{\"label\":\"Part 3\",\"href\":\"ch-3-p-3.xhtml\",\"index\":21},{\"label\":\"Part 4\",\"href\":\"ch-3-p-4.xhtml\",\"index\":22},{\"label\":\"Part 5\",\"href\":\"ch-3-p-5.xhtml\",\"index\":23},{\"label\":\"Part 6\",\"href\":\"ch-3-p-6.xhtml\",\"index\":24},{\"label\":\"Part 7\",\"href\":\"ch-3-p-7.xhtml\",\"index\":25},{\"label\":\"Part 8\",\"href\":\"ch-3-p-8.xhtml\",\"index\":26},{\"label\":\"Part 9\",\"href\":\"ch-3-p-9.xhtml\",\"inde
