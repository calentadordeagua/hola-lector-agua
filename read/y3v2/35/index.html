e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T416e,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 2\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWE BOTH LOOKED around at the same time after exiting the south entrance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh? She isn\u0026apos;t here either.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Looks like it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince the dorms were a fair distance away and the area wasn\u0026apos;t very crowded to begin with, I thought we would find her right away, but we didn\u0026apos;t. I glanced toward the roadside trees, but there was still no sign of her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;She\u0026apos;s quite a handful, isn\u0026apos;t she? Leading people around like this.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Aren\u0026apos;t you one to talk?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe looked around here and there, but we couldn\u0026apos;t find a trace of Yamamura, let alone Yamamura herself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This is like a real-life \u003cem\u003eWhere\u0026apos;s Waldo\u003c/em\u003e. What a waste of time.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you one to talk\u0026#x2014;never mind.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo matter how many times I interjected, it was probably meaningless by now.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And yet, you\u0026apos;ll still interject next time. That\u0026apos;s what it means to be the straight man in a comedy duo.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t go making us a comedy duo without my permission.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf we headed straight for the south entrance, we would\u0026apos;ve arrived a good ten minutes earlier. Then Yamamura would\u0026apos;ve been standing there quietly, waiting for us\u0026#x2014;or maybe not.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the hushed space, the cell phone Morishita held in her hand vibrated faintly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026apos;If you can find me, then come and try\u0026apos;? How provocative of her!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYamamura sent a message like that? Thinking so, I peeked at her phone screen from the side, but it seemed she only received a notification for new economic news.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Please don\u0026apos;t peek at my phone without permission, you rude person.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy impulsive action might have indeed been a bit rude.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I suppose there\u0026apos;s no other choice. Shall we try contacting her?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not that there\u0026apos;s no other choice. Shouldn\u0026apos;t we have done that from the start?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Radio waves are bad for the brain. I try to avoid using my phone as much as possible.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had no idea what she was talking about, but for some reason, I felt it was better not to press the issue.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as Morishita put her phone to her ear and started to make a call, I felt a faint breeze from behind me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah, um...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Whoa, you appeared so suddenly, Yamamura Miki. Please don\u0026apos;t startle me like that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;S-Sorry.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYamamura, who had appeared without a sound, bowed her head slightly in apology for being scolded.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis probably included an apology for changing the meeting place as well.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Morishita told me you had something to talk to me about. Is that true?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was sad that I had to start by questioning that part, but it was unavoidable, thanks to the wonderful relationship of trust I built up with Morishita.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Y... Yes. Since you transferred classes, Ayanokouji-kun, we still... haven\u0026apos;t said a single word to each other... so...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAbout a month already passed, and if you included greetings on the way to and from school as conversation, it wouldn\u0026apos;t be an exaggeration to say she was the only student in the class I hadn\u0026apos;t spoken to.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Right. I was being considerate because you dislike standing out. Were you unhappy about it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;N-Not at all. I mean, I was grateful... for it...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe way Yamamura stammered out her words, she might have seemed even more fidgety than when we first met. To the untrained eye, it might look like she\u0026apos;d regressed, but in reality, that wasn\u0026apos;t the case.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUp until now, Yamamura had quietly erased her own presence and made herself inconspicuous.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI took that image of her desperately trying to speak as a sign of evolution, a phenomenon seen in the process of breaking away from her past self.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, given Yamamura\u0026apos;s life so far, it was a difficult task to ask a person who lived 99% of their life passively to suddenly become proactive.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe tried to somehow advance the conversation on her own but couldn\u0026apos;t make any headway.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMorishita probably didn\u0026apos;t know this flustered side of Yamamura either. A passive person has a passive way of speaking, and until now, she likely engaged in dialogue with that stance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Um... I-I, therefore...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSo I would just watch over her for now. If I anticipated her and said, \u0026apos;\u003cem\u003eIs this what you want to do?\u0026apos;\u003c/em\u003e\u0026#xa0;or \u003cem\u003e\u0026apos;Is that what you want me to do?\u0026apos;\u003c/em\u003e\u0026#xa0;it would only encourage her passivity.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah, and... so...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYes... watching over her was important\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd so, what felt like a minute passed with her fidgeting, unable to continue her sentence.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShould I prompt her a little to make it easier for her to talk?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo, for her own growth, I supposed I should wait as long as it took for Yamamura to speak of her own accord.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So... what I want to say is...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe conversation wasn\u0026apos;t progressing at all.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere were quite a few students who were bad at communicating and I couldn\u0026apos;t deny that I was one of them, but I was struck by how many different types there were.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere were people like me, who couldn\u0026apos;t think of what to say in the first place, and then there were people like Yamamura, who had things they wanted to say but had difficulty voicing them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile I was prepared to wait patiently, Morishita, next to me, apparently lost her patience and went to stand beside Yamamura.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor a moment, I thought she was going to subtly give her some support, but\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Fwooh!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen, quite forcefully, she puckered her lips and blew into Yamamura\u0026apos;s ear.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Wha-a-a-aah!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYamamura, who\u0026apos;d been looking in my direction, but not actually at me, hadn\u0026apos;t noticed Morishita approaching her face. A scream, louder than any she\u0026apos;d ever let out before, echoed all around.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Wh-wh-wh-what are you doing...!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hmph. That\u0026apos;s the \u003cem\u003eEar Gun\u003c/em\u003e. All those who\u0026apos;re caught unaware are startled, you see.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You probably based that on \u0026apos;air gun,\u0026apos; but isn\u0026#x2019;t that... still just an air gun?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Now that you mention it, that is true indeed. I shall praise you, Ayanokouji Kiyotaka.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat might have been the moment in my life I was most praised, yet felt the least happy about it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI worried that Yamamura\u0026apos;s tension might have broken, just as she\u0026apos;d been working up her resolve.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMorishita, showing no signs of remorse, wore a smug look on her face and lightly pinched Yamamura\u0026apos;s cheek.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Wh-What!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;How about it, Yamamura Miki? Don\u0026apos;t you feel a little less tense now?\u0026quot;\u003c/p\u003e\u003cimg src=\"/hola-lector-agua/images/books/y3v2/OEBPS/UyCcIzEuCmoMIOGduwfNa.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Eh? Ah... I suppose... that might be so.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In all things, tension and relief are essential. That\u0026apos;s the secret bestowed upon the masters of comedy.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;C-Comedy...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, that is of no consequence, so you would do well to tell Ayanokouji Kiyotaka at once.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer expression, which had been rigid, certainly relaxed and the redness in her cheeks subsided a little.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlthough it was rough and nonsensical, Morishita\u0026apos;s actions seemed to have had a positive effect on Yamamura.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer gaze, which had been fixed around my nose, finally met my eyes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut perhaps that hurdle had been too high, as her gaze immediately darted back down.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Today... I called you here because there\u0026apos;s something I wanted to tell you...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe was able to speak much more clearly than before and without faltering.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I want to change. I want to have more self-confidence, to be able to smile in front of others. I really, truly think so.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYamamura composed her breathing and did her best to string her words together to convey her feelings.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wondered how much courage she must have mustered to expose her innermost thoughts\u0026#x2014;the pathetic, embarrassing parts.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe couldn\u0026apos;t maintain eye contact, but it was a commendable effort.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe desire to change sprouted within her, and she approached me with resolve.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Please let me... help with getting to Class A, too.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You have good grades, Yamamura and you\u0026apos;re already helpful to the class.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I want to do more... much more. Because I believe... there\u0026apos;s something... that only I can do.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You understand, do you not, Ayanokouji Kiyotaka? It should be your role here to meet Yamamura Miki\u0026apos;s expectations.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I suppose so. Then there\u0026apos;s something I\u0026apos;d like you to do for me right away.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Y-Yes!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFirst was a task suitable as a starting point to see just how useful Yamamura could be.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I want you to find out about Shiraishi Asuka.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sh-... Shiraishi-san, you mean...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe was probably prepared to conduct any kind of espionage, but she would\u0026apos;ve assumed it would be against the other classes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe surely hadn\u0026apos;t expected to be told to investigate her own class.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So the man who came to save the class was just a common lecher... I see. What has the world come to.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s quite the imaginative interpretation, as always.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Am I wrong? Shiraishi Asuka is the class\u0026apos;s secret idol. Is it possible that you, Ayanokouji Kiyotaka, have also fallen into her trap? Why don\u0026apos;t you let your heart be as honest as your body? Well? May I have your answer?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSaying that, she made a fist and pressed it insistently against my cheek.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eApparently, she was pretending her hand was a microphone, but it hurt nonetheless.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m currently struggling to raise my understanding of the class. In the process, I feel I\u0026apos;m making progress understanding people like Yoshida and Shimazaki, but with Shiraishi, it feels like I\u0026apos;m getting nowhere. I can\u0026apos;t spend forever on my neighbor, which is precisely why I want to ask for your cooperation.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You certainly have a convincing way of putting things. However\u0026#x2014;I suppose I can feel a bit of sympathy for the part about you struggling to understand her.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is... that so?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I suppose you wouldn\u0026apos;t understand, Yamamura Miki. You always use your faint presence to investigate students from other classes, or untrustworthy students like Hashimoto Masayoshi; you wouldn\u0026apos;t watch a student like Shiraishi Asuka, who seems harmless on the surface.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes... If you\u0026apos;re okay with it, Ayanokouji-kun, I think I can... try to investigate Shiraishi-san in my own way... I can\u0026apos;t, um, promise at all that I\u0026apos;ll find any useful information, though...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course, I\u0026apos;m aware of that. Whether or not she has a side she doesn\u0026apos;t show to me or our classmates\u0026#x2014;anything you learn, no matter how trivial, will be fine. Look into it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eInvestigating students from other classes came with some trouble, but since this involved a classmate, the possibility of it developing into a major problem was likely low.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, if Shiraishi recognized Yamamura\u0026apos;s presence, it could become a source of conflict, but any dissatisfaction or anger would be directed not at Yamamura, but at the person presumed to be behind her. If she was the kind of student who would instead assume Yamamura was acting alone, then that was the extent of her abilities. Even if parts of her personality remained unclear, it was safe to end the analysis there.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI hadn\u0026apos;t had this much contact with Yamamura since transferring. Strictly within our class, our relationship wasn\u0026apos;t apparent to any student besides Morishita.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 2\",\"volumeId\":\"y3v2\",\"chapterIndex\":35,\"prevChapter\":{\"volumeId\":\"y3v2\",\"chapter\":34,\"title\":\"Part 1\"},\"nextChapter\":{\"volumeId\":\"y3v2\",\"chapter\":36,\"title\":\"Part 3\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 2\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Nanase Tsubasa's Monologue\",\"href\":\"monologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Fitting In\",\"href\":\"ch-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"ch-1-p-1.xhtml\",\"index\":12},{\"label\":\"Part 2\",\"href\":\"ch-1-p-2.xhtml\",\"index\":13},{\"label\":\"Part 3\",\"href\":\"ch-1-p-3.xhtml\",\"index\":14},{\"label\":\"Chapter 2: A Gentle Exam\",\"href\":\"ch-2.xhtml\",\"index\":15},{\"label\":\"Part 1\",\"href\":\"ch-2-p-1.xhtml\",\"index\":16},{\"label\":\"Part 2\",\"href\":\"ch-2-p-2.xhtml\",\"index\":17},{\"label\":\"Chapter 3: Getting to Know the Opponent\",\"href\":\"ch-3.xhtml\",\"index\":18},{\"label\":\"Part 1\",\"href\":\"ch-3-p-1.xhtml\",\"index\":19},{\"label\":\"Part 2\",\"href\":\"ch-3-p-2.xhtml\",\"index\":20},{\"label\":\"Part 3\",\"href\":\"ch-3-p-3.xhtml\",\"index\":21},{\"label\":\"Part 4\",\"href\":\"ch-3-p-4.xhtml\",\"index\":22},{\"label\":\"Part 5\",\"href\":\"ch-3-p-5.xhtml\",\"index\":23},{\"label\":\"Part 6\",\"href\":\"ch-3-p-6.xhtml\",\"index\":24},{\"label\":\"Part 7\",\"href\":\"ch-3-p-7.xhtml\",\"index\":25},{\"label\":\"Part 8\",\"href\":\"ch-3-p-8.xhtml\",\"index\":26},{\"label\":\"Part 9\",\"href\":\"ch-3-p-9.xhtml\",\"index\":27},{\"label\":\"Chapter 4: The Quest for Knowledge\",\"href\":\"ch-4.xhtml\",\"index\":28},{\"label\":\"Part 1\",\"href\":\"ch-4-p-1.xhtml\",\"index\":29},{\"label\":\"Part 2\",\"href\":\"ch-4-p-2.xhtml\",\"index\":30},{\"label\":\"Part 3\",\"href\":\"ch-4-p-3.xhtml\",\"index\":31},{\"label\":\"Part 4\",\"href\":\"ch-4-p-4.xhtml\",\"index\":32},{\"label\":\"Chapter 5: Yamamura's Courage\",\"href\":\"ch-5.xhtml\",\"index\":33},{\"label\":\"Part 1\",\"href\":\"ch-5-p-1.xhtml\",\"index\":34},{\"label\":\"Part 2\",\"href\":\"ch-5-p-2.xhtml\",\"index\":35},{\"label\":\"Part 3\",\"href\":\"ch-5-p-3.xhtml\",\"index\":36},{\"label\":\"Part 4\",\"href\":\"ch-5-p-4.xhtml\",\"index\":37},{\"label\":\"Part 5\",\"href\":\"ch-5-p-5.xhtml\",\"index\":38},{\"label\":\"Chapter 6: Fortune and Misfortune Are Intertwined\",\"href\":\"ch-6.xhtml\",\"index\":39},{\"label\":\"Part 1\",\"href\":\"ch-6-p-1.xhtml\",\"index\":40},{\"label\":\"Part 2\",\"href\":\"ch-6-p-2.xhtml\",\"index\":41},{\"label\":\"Part 3\",\"href\":\"ch-6-p-3.xhtml\",\"index\":42},{\"label\":\"Chapter 7: The Observer\",\"href\":\"ch-7.xhtml\",\"index\":43},{\"label\":\"Part 1\",\"href\":\"ch-7-p-1.xhtml\",\"index\":44},{\"label\":\"Part 2\",\"href\":\"ch-7-p-2.xhtml\",\"index\":45},{\"label\":\"Part 3\",\"href\":\"ch-7-p-3.xhtml\",\"index\":46},{\"label\":\"Epilogue: Another Story Begins\",\"href\":\"epilogue.xhtml\",\"index\":47},{\"label\":\"Part 1\",\"href\":\"epilogue-p-1.xhtml\",\"index\":48},{\"label\":\"Part 2\",\"href\":\"epilogue-p-2.xhtml\",\"index\":49},{\"label\":\"Author's Afterword\",\"href\":\"authors-afterword.xhtml\",\"index\":50}],\"volumeTitle\":\"Light Novel 3rd Year Volume 2\",\"detailsLink\":\"/select/year-3/y3v2\",\"returnLink\":\"/select\",\"currentSpineIndex\":35,\"nextVolumeLink\":\"/select/year-3/y3v3\",\"nextVolumeTitle\":\"Light Novel 3rd Year Volume 3\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\"
