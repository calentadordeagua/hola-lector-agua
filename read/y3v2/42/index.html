e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T390b,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 3\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWHEN I RETURNED to the dorm lobby, Hashimoto, who\u0026apos;d been sitting on a sofa, saw me and stood up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sorry, Shiina. I\u0026apos;m gonna borrow Ayanokouji.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThough he offered a light apology, Hashimoto gave her no room to refuse, but Hiyori showed no sign of displeasure and bowed cheerfully. Then she waved and got on the elevator first.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto watched her go with a broad grin, waving back.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We meet often. Were you waiting for me to come back?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah, something like that. Let\u0026apos;s take a walk.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe half-forcibly led me out of the lobby and we walked down a path off the school route.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re really tolerant of Shiina, or rather, you\u0026apos;re pretty close with her, aren\u0026apos;t you? You\u0026apos;re the one who gave her the flower, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why do you think that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was no one else around at the time, so there was no way Hashimoto could\u0026apos;ve seen me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s not a funny way to play dumb. There\u0026apos;s no way it\u0026apos;s nothing. Anyone could tell just by seeing how happy she looked holding that flower.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed Hashimoto felt that way after seeing Hiyori and I together.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re always going on about \u0026apos;Shiina, Shiina,\u0026apos; so there\u0026apos;s been something on my mind. I figured I had to confirm it today, no matter what.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter a short pause, Hashimoto looked me straight in the eye.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;d probably be hard for anyone else to ask, so as the designated bad guy, I\u0026apos;ll ask you straight up. Is Shiina someone especially close to you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHis expression clearly conveyed his seriousness.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is it a problem to have a specific person I\u0026apos;m close to?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, I wouldn\u0026apos;t go so far as to say it\u0026apos;s a problem. But I\u0026apos;m not exactly welcoming it, either.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto said, somewhat evasively. When I looked at him, he seemed a bit uncomfortable and averted his gaze.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not just me. Ichinose probably isn\u0026apos;t too happy about it either, is she? I\u0026apos;ve been hearing rumors that Ichinose likes you. The source of the rumor is Class D. In other words, she found out you broke up with Karuizawa and openly declared herself the next girlfriend candidate, right? I thought the way Ichinose looked at you wasn\u0026apos;t exactly normal ever since we heard about the alliance together, but...anyway, I was sure you were going to get together with her\u0026#x2014;or are you dating Ichinose?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We\u0026apos;re not dating.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis should\u0026apos;ve been the answer Hashimoto wanted, but instead of being pleased to hear it, he scowled.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...And why\u0026apos;s that? If it\u0026apos;s Ichinose, you couldn\u0026apos;t ask for a better person to date, right? Honestly, even I, who\u0026apos;ve barely had any contact with her, would say yes in a heartbeat if she confessed to me. She\u0026apos;s on that level, you know? There\u0026apos;s no reason to turn her down, is there?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sorry to burst your bubble while you\u0026apos;re getting all worked up, but I haven\u0026apos;t been confessed to.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even so, all you have to do is make a move, right? She already likes you, so you should just go for it without hesitation. Ah, I don\u0026apos;t mean that in a weird way.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe hurriedly denied it, but that was a trivial distinction.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ichinose and I have an alliance. Nothing more, nothing less.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So you\u0026apos;re saying you\u0026apos;re just pragmatic allies? For the foreseeable future, too?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter asking that, he continued without waiting for my reply.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So then... does that mean you\u0026apos;re going after Shiina right now?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m surprised. I didn\u0026apos;t think you cared so much about other people\u0026apos;s love lives.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;To be precise, I\u0026apos;m just worried that those feelings might affect the outcome of the class competition.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was my business who I dated, but he was worried I might let my personal feelings get in the way.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat seemed to be what he feared.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a very Hashimoto-like way of thinking.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Nah, I don\u0026apos;t even need to hear your answer; I already know. You cut ties with Horikita and the others you shared two years of hardship with to join us. I don\u0026apos;t doubt for a second that your actions would change just because you got involved with one or two girls like Ichinose or Shiina.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And yet, you seem awfully hung up on it. Especially when it comes to Hiyori.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto was clearly placing more weight on it versus the situation with Ichinose.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;From an outsider\u0026apos;s perspective, it\u0026apos;s always felt to me like you treat Shiina differently.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto concluded by saying that if it was just a needless worry, then that was great, but it was already certain that I was, in fact, treating Hiyori in an indescribable way.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat said, I wouldn\u0026apos;t let her existence affect the class\u0026apos;s performance. But speaking purely from personal feelings, I didn\u0026apos;t want to treat Hiyori carelessly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI see.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So that\u0026apos;s what it is.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What\u0026apos;s \u0026apos;what it is\u0026apos;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Perhaps I\u0026apos;m in love with Hiyori.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Huh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I can\u0026apos;t say for sure what this feeling is just yet. But I might at least be harboring, or starting to harbor, feelings for Hiyori that I don\u0026apos;t have for anyone else.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe unease and errors I\u0026apos;d felt up to that point and their cause.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe reason it hadn\u0026apos;t been easy to find was because it was something outside my empirical rules.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;W-Whoa, whoa, are you serious? Nah, what\u0026apos;re you talking about, like this is your first time feeling something? You were just dating Karuizawa a little while ago, weren\u0026apos;t you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf the emotion I just identified is truly budding within me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI\u0026apos;m even amazed by the strength of this thing called emotion and its unpredictable timing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA desire to know more began to overflow.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIf I traced it back, would I be able to see it?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWhen did I start to become conscious of Hiyori?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWhat was different about her compared to other people?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eI want to try digging as deep as I can.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026#x2014;No, for now, I should probably stop these unnecessary delusions.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eComing up with an answer right now, as if deducing a strategy, would\u0026apos;ve been far too hasty.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo matter how it turned out, that emotion was extremely fascinating as a subject for experimentation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then... depending on the situation, are you planning on dating Shiina?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Didn\u0026apos;t you believe that my actions wouldn\u0026apos;t change? So why are you sticking your nose so deep into someone else\u0026apos;s love life?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, just this once, y\u0026apos;know... It\u0026apos;s my view on love, I guess, but it\u0026apos;s screaming at me that I absolutely have to check.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Your view on love, huh? Do you have a corresponding amount of experience with it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI asked this while keeping the expelled Maezono in mind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Now you\u0026apos;re underestimatin\u0026apos; me a bit, Ayanokouji. It\u0026apos;s not like I can brag about it, but between middle and high school, I\u0026apos;ve dated two... no, to be precise, three people.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI surmised that the reason he was cagey about the last one was because he was referring to Maezono.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So? Are you planning to date Shiina? If you can\u0026apos;t answer, that\u0026apos;s fine too\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Whether we date or not involves the other person. It isn\u0026apos;t something I can answer.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hah, well, yeah. But from the sound of it... if this is really your first time feeling this way, that\u0026apos;d make it your first love, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Perhaps.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRight then, I possessed no way to deny it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No matter how many people you date, you only get one first love. And what\u0026apos;s more, you almost never end up with that person. My own first love was a classmate in elementary school, but I couldn\u0026apos;t even talk to her properly. If you treat your first love like that, it might feel romantic, or special, but in reality, it ain\u0026apos;t all that. Guys are especially simple, y\u0026apos;know, we\u0026apos;ve got a tendency to unconditionally fall for any cute girl.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI fully understood that regardless of whether the object of affection was a man or a woman, the majority of people tended to be attracted to those with superior looks. Even looking at TV or magazines, the proportion of handsome men and beautiful women who caught the eye and gathered attention was overwhelmingly high.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So just go ahead and ditch that first love stuff. If a reasonably cute girl falls for you, your tenth love or your twentieth love can start just like that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDespite his roundabout expressions, Hashimoto\u0026apos;s way of thinking remained consistent.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Whether it\u0026apos;s really your first love or whatever, stay away from Shiina. This is my strongest advice to you as your strategist, as your friend, and as a comrade aiming for Class A.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto was strongly wary of my relationship with Hiyori developing in an unexpected way.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not a difficult concept, is it? You can get back together with Karuizawa, you can date Ichinose. Heck, any other girl would be fine. Just, not Shiina.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was clear that by deliberately repeating himself, Hashimoto was watching my reaction. It was plain to see that he would take either excessive agreement or denial as an unfavorable sign.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I understand your concern very well. However, you\u0026apos;re counting your chickens before they hatch.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2014;I can trust you, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You probably wouldn\u0026apos;t believe me even if I answered, but you can trust me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor me, Hiyori\u0026apos;s existence was becoming indispensable.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAn existence that made me learn an unfamiliar emotion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI couldn\u0026apos;t help but want to find out whether or not I could be certain it was what Hashimoto called a first love.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wanted to experience being swallowed by the irresistible waves of emotion and see how I would be carried away.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wanted to take both myself and the other person apart and seek the answer to the very end.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was true that I would remember his warning as a warning, but I had no intention of stopping.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBecause I was already getting ready to dive in as deep as I could.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 3\",\"volumeId\":\"y3v2\",\"chapterIndex\":42,\"prevChapter\":{\"volumeId\":\"y3v2\",\"chapter\":41,\"title\":\"Part 2\"},\"nextChapter\":{\"volumeId\":\"y3v2\",\"chapter\":43,\"title\":\"Chapter 7: The Observer\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 2\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Nanase Tsubasa's Monologue\",\"href\":\"monologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Fitting In\",\"href\":\"ch-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"ch-1-p-1.xhtml\",\"index\":12},{\"label\":\"Part 2\",\"href\":\"ch-1-p-2.xhtml\",\"index\":13},{\"label\":\"Part 3\",\"href\":\"ch-1-p-3.xhtml\",\"index\":14},{\"label\":\"Chapter 2: A Gentle Exam\",\"href\":\"ch-2.xhtml\",\"index\":15},{\"label\":\"Part 1\",\"href\":\"ch-2-p-1.xhtml\",\"index\":16},{\"label\":\"Part 2\",\"href\":\"ch-2-p-2.xhtml\",\"index\":17},{\"label\":\"Chapter 3: Getting
