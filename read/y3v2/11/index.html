e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T2c62,"])</script><script>self.__next_f.push([1,"\u003ch1 class=\"heading_1\"\u003e\u003ca class=\"heading-link\" href=\"/read/y3v2/2\"\u003eChapter 1:\u003cbr/\u003eFitting In\u003c/a\u003e\u003c/h1\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eON SUNDAY MORNING\u003c/em\u003e, I looked out of my room\u0026apos;s window and saw that it was, unfortunately, going to be raining all day.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t a downpour, but the kind of weather that would make one hesitant to go out even with an umbrella. Despite that, after getting dressed before 10:00 a.m., I promptly grabbed an umbrella and decided to head down to the dorm lobby. When I stepped into the elevator, the wet floor caught my eye. It was evident that students had been coming in and out of the dorms since early morning.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yo, mornin\u0026apos;.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe moment I reached the first floor and the elevator doors opened, a male student in a hoodie, standing by the entrance, turned around, raising his hand as he greeted me. It was my classmate, Yoshida.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Morning.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter we exchanged brief greetings, Yoshida immediately looked toward the sofa.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Shimazaki came down a little while ago, too.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHaving likely heard him, the now-named Shimazaki stood up and removed a white wireless earbud from his right ear. He put it away in a small case he took from his bag\u0026#x2014;what I presumed to be a dedicated case for the wireless earbuds.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What were you listening to?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI asked as I followed Yoshida and walked over to Shimazaki.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;English listening practice for the entrance exams. Personally, English isn\u0026apos;t my strong suit, so I want to devote as much time as possible to it now, while I still can.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI supposed he didn\u0026apos;t want to waste even the short amount of time he spent waiting for his classmates.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? You\u0026apos;re bad at English? You get better scores than me, don\u0026apos;tcha?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYoshida grumbled, looking up at the ceiling as if recalling past test results.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s no point in comparing me to you. In reality, it\u0026apos;s my weakest subject.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah, yeah. My bad for comparing us.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYoshida apologized, albeit with a disgruntled look. Shimazaki possessed the academic ability and grades to naturally rank among the top of his year, but he likely achieved those results because he was aware of his weaknesses and took thorough measures to address them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe time for third-year students to take their entrance exams was approaching. This level of awareness was just what you\u0026apos;d expect from a former Class A student.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I thought that was a sarcastic remark, but you\u0026apos;re not getting angry at it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI thought Yoshida was pretty short-tempered, but he didn\u0026apos;t seem particularly angry at Shimazaki\u0026apos;s comment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, yeah, it\u0026apos;s a little annoying, but this guy\u0026apos;s always studying. I\u0026apos;m not that into studying, and it\u0026apos;s true there\u0026apos;s a gap between us.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was Yoshida\u0026apos;s answer, but it might have also been that the two of them were simply good friends.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;By the way, have you seriously been doing nothing but studying lately?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I wonder. I try to set aside at least five hours a day to study, but that\u0026apos;s about it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, that five-hour period didn\u0026apos;t include daily courses.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t know how much time the average third-year high school student devoted to self-study, but it was certainly not a small amount.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYoshida made an exaggerated gesture with his hands, as if to say there was no way he could do five hours.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The right to graduate from Class A is ultimately just a trump card. To get into a reasonably good university, this much is a given, and it doesn\u0026apos;t just apply to me. I\u0026apos;ll be stopping by the cram school at Keyaki Mall this evening as well.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Seriously? How much are you gonna study...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eCome to think of it, there was a cram school in the mall which was provided by ANHS. I had no use for that place, so I\u0026apos;d never stopped by. I\u0026apos;d heard that you could attend it for free, even without Private Points, if you met certain conditions, such as having no behavioral problems and a clear vision for your academic future, like a target university.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;A cram school, huh? How many students actually go there?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I asked Shimazaki that, simply out of curiosity, he glared at me for some reason.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You don\u0026apos;t know? Speaking only of third-years, there are twenty of us right now. Even so, the ratio should be quite low compared to a normal high school. But the numbers will probably grow as we head toward summer.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSo that was how many students were starting to prepare for the entrance exams.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Your grades aren\u0026apos;t bad either, so wouldn\u0026apos;t it be a good idea for you to at least show your face there?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was true that Yoshida was inferior compared to Shimazaki, but he still had high academic scores.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf he was considering university, it wouldn\u0026apos;t be strange for him to start attending.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShimazaki probably recommended it with the best intentions, but Yoshida immediately refused.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No way, not happening. I\u0026apos;m fine with just an average university, just average. I can\u0026apos;t stand the idea of being buried in my studies even on my days off when I could be hangin\u0026apos; out with friends. It\u0026apos;s suffocating, ain\u0026apos;t it? Nothin\u0026apos; but studying,\u0026quot; he said, turning down the offer as he glanced sideways at the serious Shimazaki.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If that\u0026apos;s the case, fine. I have no intention of forcing you to study. That\u0026apos;s precisely why it\u0026apos;s my own business what I do, when, and where, as long as it isn\u0026apos;t a nuisance to you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShimazaki knitted his brows and glared at Yoshida, perhaps feeling that his attitude toward studying had been criticized.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;O-Of course, it\u0026apos;s your own business. Don\u0026apos;t be so mad.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn response, Yoshida hurriedly held up both hands, palms open, and offered an apology.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;A-Ahem. So? What\u0026apos;s the reason you called me and Ayanokouji out on our day off?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe cleared his throat once, then asked Shimazaki for the reason, as if trying to change the subject.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a precious day off, an important day he would normally have spent studying on his own. Indeed, I was curious as to why someone like Shimazaki had invited us out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The truth is, my business is only with Ayanokouji, but we aren\u0026apos;t exactly on terms where we can just go out and talk. I figured things would proceed more smoothly if you were here.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eApparently, Yoshida had nothing to do with the matter itself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe word \u0026apos;talk\u0026apos; coming up in the conversation gave me a slightly clearer idea of his objective.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So that\u0026apos;s what this is about. Well, people naturally tend to rely on me, after all.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven though he expressed how much of a pain it was, he narrowed his eyes, looking somewhat pleased.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Anyway, since you asked, I\u0026apos;ll be sure to help you out. Ayanokouji, you better hear Shimazaki out properly.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs if passing the responsibility on to me, Yoshida placed a hand on my shoulder and said so.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That depends on the topic of discussion. What exactly did\u0026#xa0;you want to talk about?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as Shimazaki said, my relationship with him was by no means a deep one; there was still some distance between us.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere had to be a clear reason for him to go out of his way to approach someone like me for a talk.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnother thing that bothered me was that he\u0026apos;d asked me to bring an umbrella.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf it were just for a talk, there would\u0026apos;ve been no need to go out on a rainy day;\u0026#xa0;it wouldn\u0026apos;t have been difficult to just talk in someone\u0026apos;s room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShimazaki glanced around briefly before looking me straight in the eye.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Today, I\u0026apos;m going to make you confess all of your secrets.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Secrets?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Talking about it here won\u0026apos;t solve anything. You\u0026apos;ll understand if you just follow me for now.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith that, Shimazaki left the lobby, immediately opened his umbrella, and started walking at a rather brisk pace.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What the heck? I wonder where he\u0026apos;s headed.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Who knows. He said Keyaki Mall, but\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter briefly exchanging glances with Yoshida, we decided to follow Shimazaki as well.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 1: Fitting In\",\"volumeId\":\"y3v2\",\"chapterIndex\":11,\"prevChapter\":{\"volumeId\":\"y3v2\",\"chapter\":10,\"title\":\"Prologue: Nanase Tsubasa's Monologue\"},\"nextChapter\":{\"volumeId\":\"y3v2\",\"chapter\":12,\"title\":\"Part 1\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 2\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Nanase Tsubasa's Monologue\",\"href\":\"monologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Fitting In\",\"href\":\"ch-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"ch-1-p-1.xhtml\",\"index\":12},{\"label\":\"Part 2\",\"href\":\"ch-1-p-2.xhtml\",\"index\":13},{\"label\":\"Part 3\",\"href\":\"ch-1-p-3.xhtml\",\"index\":14},{\"label\":\"Chapter 2: A Gentle Exam\",\"href\":\"ch-2.xhtml\",\"index\":15},{\"label\":\"Part 1\",\"href\":\"ch-2-p-1.xhtml\",\"index\":16},{\"label\":\"Part 2\",\"href\":\"ch-2-p-2.xhtml\",\"index\":17},{\"label\":\"Chapter 3: Getting to Know the Opponent\",\"href\":\"ch-3.xhtml\",\"index\":18},{\"label\":\"Part 1\",\"href\":\"ch-3-p-1.xhtml\",\"index\":19},{\"label\":\"Part 2\",\"h
