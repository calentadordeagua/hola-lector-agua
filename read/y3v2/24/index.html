e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T8427,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 6\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTHE RICE COOKER, which I\u0026apos;d set ahead of time, beeped, announcing that the rice was cooked.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI immediately opened the lid, fluffed the rice with the paddle to release excess surface moisture, and evened it out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter that, I set the prepared meal down in front of Kushida-san and Ibuki-san.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;A hamburger steak made with domestic kuroge wagyu. Not just black-haired cattle, mind you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;K-Kuroge wagyu?! Th-This is pretty extravagant, isn\u0026apos;t it...!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThough bewildered, Ibuki-san spread her hands and gave the food an approving look.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You were the one who hoped to eat something nice, weren\u0026apos;t you? Also, your Japanese is a bit strange, so you should be more careful.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePointing this out with exasperation, I quickly resumed my preparations.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you\u0026apos;re gonna treat me this well, I wouldn\u0026apos;t mind stopping by every day, y\u0026apos;know?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I will have to firmly decline. Today is an exception.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So stingy, Horikita. Oh well, I\u0026apos;ll settle for a normal meal from tomorrow on.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t understand why she\u0026apos;d already decided that I would be treating her from tomorrow onward, but I ignored her, as engaging would only encourage her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt the very least, she seemed to have taken it as a genuine token of my gratitude and welcomed this elaborate meal.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA spread on the dining table, a cut above the usual.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI noticed that Kushida-san, too, had stopped fiddling with her phone and was now staring at the food.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It certainly is special, perhaps\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn contrast to the delighted Ibuki-san, Kushida-san grew more guarded.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There might be a catch to this. If you eat it carelessly, you might regret it\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed she\u0026apos;d tried to quickly warn Ibuki-san, but Ibuki-san was already in motion, lifting a side dish to her mouth with her fork.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So fast...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe ate with such vigor you could hear her wolfing it down.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was proof of how delicious it was\u0026#x2014;that once she started, she couldn\u0026apos;t stop\u0026#x2014;and a pleasant sight to behold. As the one who made it, it wasn\u0026apos;t a bad feeling at all.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Savage.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Who\u0026apos;re you calling a savage?!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThough her mouth was still full, she immediately retorted to Kushida-san\u0026apos;s jab.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I watched for a moment without touching my own food, a beaming Ibuki-san looked up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ve been flat broke lately, so a meal like this is an improvement.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was curious as to what kind of life she was leading, but I had more pressing matters at the moment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter all, Ibuki-san always left in a hurry as soon as she finished eating.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I want to hear both of your opinions.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;About the food?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No. Regarding Ayanokouji-kun, who has become quite the topic of conversation.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe moment she heard that name, Ibuki-san showed an overt, unconcealed look of disgust.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKushida-san, for her part, glanced at me once, her expression unchanging.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut her eyes seemed to say, \u0026apos;I knew it,\u0026apos; having already guessed the intent behind the special meal.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;About him transferring classes? If so, that\u0026apos;s old news by now, don\u0026apos;t you think?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs she spoke so nonchalantly, I wondered whether she felt no shock at Ayanokouji-kun\u0026apos;s departure, even though the guarantee that we could safely maintain our position in Class A had clearly vanished.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ayanokouji-kun is now our enemy... How can we defeat him?... Right now, I can\u0026apos;t see a way. I need a hint that will lead to a breakthrough.\u0026quot;\u003c/p\u003e\u003cimg src=\"/hola-lector-agua/images/books/y3v2/OEBPS/EGWpxXChgbpTWBkDPEcAf.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So it\u0026apos;s \u0026apos;three heads are better than one,\u0026apos; huh? If that\u0026apos;s the case, isn\u0026apos;t Ibuki-san a little out of her league?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I am perfectly aware of that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I replied to Kushida-san, Ibuki-san, who was still gripping her fork, lightly slammed her fist on the table.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I get that you\u0026apos;re making fun of me. You wanna get kicked?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I may be making fun of you, but I\u0026apos;m also trying to rely on you. With regard to this topic, at least, I\u0026apos;m hoping you might come up with some unexpected advice. After all, you\u0026apos;ve never seemed to like Ayanokouji-kun, have you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hmph. I get it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed she\u0026apos;d accepted my convoluted phrasing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, you totally don\u0026apos;t get it, Ibuki-san... Oh well, whatever.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIbuki-san picked up her fork again, shoveled a large amount of rice into her mouth, and after chewing thoroughly and swallowing, she snorted once more. Then she nodded while spinning her fork around impolitely.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Beat Ayanokouji, huh? That\u0026apos;s impossible.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Giving up so quickly? That\u0026apos;s rather unlike you. I do wish you\u0026apos;d put a little more thought into your words.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I am\u003cem\u003e\u0026#xa0;\u003c/em\u003ethinking. He\u0026apos;s as strong as a monster and surprise attacks don\u0026apos;t work on him. Sure, if he were an opponent I felt I could almost beat, I\u0026apos;d be fired up to get revenge next time, but he\u0026apos;s not on that level, and I get that now. That\u0026apos;s why I\u0026apos;ve already given up.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor Ibuki-san, who loved to fight, to say something like that was just what one would expect from Ayanokouji-kun\u0026#x2014;but that wasn\u0026apos;t the issue.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It seems that when you think of \u0026apos;defeating him,\u0026apos; you only consider it in a physical sense.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? Is there any other way?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNormally, one would assume I meant in terms of intellect, but I decided to positively accept this as another one of those ideas that only she could come up with.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Perhaps it might not be a bad idea to start by considering things from that angle.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was precisely because Ibuki-san was here that we could even have this kind of discussion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But I gotta ask, don\u0026apos;t you know the secret to his strength or something?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The secret to his strength...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Neither you nor I could even touch him. Even that Albert guy was like a kid in front of Ayanokouji. In terms of pure power, Ayanokouji shouldn\u0026apos;t have stood a chance, but it wasn\u0026apos;t even a contest.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe fork that\u0026apos;d been spinning on her fingertips stopped as she gripped it tightly in her hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe secret to his strength that Ibuki-san mentioned. When and where had he acquired that abnormal strength?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo, it wasn\u0026apos;t just his strength. I had a feeling his intelligence was also clearly different from that of an ordinary student.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Unfortunately, I don\u0026apos;t know anything... Because he never told me anything.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eAnd I was the one closest to him\u003c/em\u003e... I muttered such a self-deprecating thought to myself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re useless, aren\u0026apos;t ya. And here I was, thinkin\u0026apos; you and Ayanokouji were a package deal.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a painfully sharp remark that I couldn\u0026apos;t refute in the slightest.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf I could, I would\u0026apos;ve covered my ears with my hands to hide my pathetic self.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut even so, I was steeling myself for it. I was beginning to accept that it couldn\u0026apos;t be helped that similar feelings would be reawakened every time the conversation turned to Ayanokouji-kun.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t really get fighting and all that, but does that mean Ayanokouji-kun has something that makes him better than Yamada-kun, besides just muscle? \u0026apos;Cause, like, no matter how you look at it, Yamada-kun is way stronger.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, if you put it like that, I guess so, but...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIbuki-san trailed off and then looked at me. She was no doubt pawning off the tedious explanation onto me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In his case, it isn\u0026apos;t a matter of training or martial arts styles; he exists outside of such things.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe path to becoming strong was fundamentally the same for everyone. In a specific field, be it karate or judo, one had no choice but to accumulate training and hone their skills. I explained this to Kushida-san.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If we could only understand the foundation of his polished technique...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven for a genius with exceptional talent, it took many years to grow to the level of a master.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if I hadn\u0026apos;t seen as much as Ibuki-san, I had been shown a glimpse of his power when he confronted Housen-kun and during the training camp. It was precisely because I too had studied martial arts that my mind refused to comprehend it. I couldn\u0026apos;t believe it was something a high school student could achieve.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I wonder if he learned those skills after he came to this school, or maybe from before?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That guy was already a monster back in the winter of our first year. No way he got \u0026apos;em after he enrolled here. There\u0026apos;s no place to learn skills like that here, anyway. You\u0026apos;re an idiot, Kushida.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Listen, my brain isn\u0026apos;t made of muscle like you two, okay? It\u0026apos;s totally normal not to know about all that barbaric stuff. Get it? So, doesn\u0026apos;t that just mean he started taking lessons for that sort of thing before elementary school, or maybe around that time?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Martial arts are the same as academics, Kushida-san. Strength isn\u0026apos;t something one acquires simply based on the time invested. No matter how much you study, it\u0026apos;s difficult to come out on top of the pack, is it not? It isn\u0026apos;t as if one can become stronger than anyone else just by training.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI studied diligently through elementary and middle school in order to take first place.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn fact, in middle school, I was proud to say that I was, to put it modestly, in the top three of my grade.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut after enrolling at the ANHS, I was unceremoniously knocked from that perch. Even though I could maintain a high rank, taking first place was no longer easy. When I went to university, I would likely experience something similar. Excellent students from all over the country would gather, and my ranking would naturally drop. It was a cycle. A cruel reality that could not be overcome by effort alone awaited.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well then, doesn\u0026apos;t that mean there\u0026apos;s really only one answer? He\u0026apos;s the best at studying in this school, and he\u0026apos;s the strongest in this school, right? It\u0026apos;s just a simple case of Ayanokouji-kun having the natural talent of a genius, the kind that lets him be at the top.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYes. If one didn\u0026apos;t think too deeply about it, that was, in a sense, an answer in itself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA person with genuine talent, different from the handful of hard workers and honor students in our grade.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOne of the handful of talented individuals who could consistently take the top spot at Japan\u0026apos;s most prestigious high schools and universities.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWithout a doubt, Ayanokouji-kun was a person who held that qualification.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It may be blunt to say, but that might be the case. However, it still doesn\u0026apos;t feel real to me. I\u0026apos;ve seen many people more capable than myself, but even among them, Ayanokouji-kun feels... anomalous... as if he alone is clearly standing on a different plane.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026#x2014;Somehow, I felt as though I was arbitrarily evaluating him on a level close to deification.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor now, I decided to assume he was just such an exaggerated existence. If it turned out that upon getting to know him, he was merely an honor student in the top ten or twenty percent, then my peace of mind would be preserved.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter taking a breath, I recalled a recent event.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Wanting to know his roots, I actually went to the three-way conference hoping to meet his parents.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKushida-san, who up to this point seemed almost completely uninterested in our discussion of martial arts, opened her mouth eagerly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ayanokouji-kun\u0026apos;s? What were they like?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m curious about that, too. Did he look strong, like a gorilla?\u0026quot; As if she couldn\u0026apos;t wait to hear the rest, Ibuki-san leaned forward.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You might be disappointed to hear this. It was his father who came for the interview, and while he had a somewhat stern look, he was a calm, ordinary person. He also said he hadn\u0026apos;t done anything particularly special regarding his education.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No way, that\u0026apos;s gotta be a lie. It\u0026apos;s the only way to explain it, short of him being turned into a cyborg.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe said something outrageous while slurping her miso soup.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;He didn\u0026apos;t seem like he was lying, though.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But we\u0026apos;re talking about Ayanokouji-kun\u0026apos;s father, right? It\u0026apos;d be kinda weird to think he\u0026apos;d tell the whole truth.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Yes, that\u0026apos;s true.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt certainly wasn\u0026apos;t something that could be acquired through a normal education.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven with a considerably elite education, it still seemed a distant realm.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWas it simply a lie to avoid actions that would be considered bragging about his son?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Speaking of parents... I wonder if there are any students at this school from the same middle school as Ayanokouji-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I wonder about that. When I tried to get similar information out of him a few times before, he skillfully evaded my questions.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Usually, someone would tell you what school they went to, right? But the fact he won\u0026apos;t... maybe that means he really does have a little secret.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eComing from Kushida-san, who desperately wanted to keep her own middle school a secret, it was quite persuasive.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was certain that it wasn\u0026apos;t something one would hide unless there was an inconvenient reason.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So is Ayanokouji a beast at sports other than fighting, too? I mean, he was fast on his feet.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m not so sure; I don\u0026apos;t really know about that. Early on, I didn\u0026apos;t question it much, but considering he deliberately avoided high scores on the written exams, it\u0026apos;s quite plausible he was intentionally holding back in sports he excels at.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So even if we found out he was in a club in middle school, he might\u0026apos;ve been holding back then, too, huh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...That\u0026apos;s true. If he possessed outstanding talent in a particular sport, someone would\u0026apos;ve likely heard rumors, whether inside or outside the prefecture...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I just tried searching Ayanokouji-kun\u0026apos;s name, but nothing came up. I thought something would pop up since Ayanokouji is a rare last name, but I can\u0026apos;t find any trace of him setting records in elementary or middle school. The only other results are for celebrities or politicians who don\u0026apos;t seem related.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKushida-san explained this to us while scrolling on her phone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUntil he enrolled in high school, he wasn\u0026apos;t the kind of student who, for better or worse, would appear online.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat in itself was a clue, but we could hardly say we\u0026apos;d made any progress.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSomeone with a clue that connected to Ayanokouji-kun...\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That guy seemed like he knew something, didn\u0026apos;t he?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIbuki-san muttered quietly, as if recalling something.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt almost the same moment, I recalled the person she had called \u003cem\u003ethat guy \u003c/em\u003eas well.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What was his name again... uh, the one in the year below us...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yagami. Yagami Takuya-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah, yeah, Yagami. He was a pretty dangerous dude, went on a real rampage. Looked like he beat the crap outta Komiya and his friends on the deserted island, and wasn\u0026apos;t he screaming something about Ayanokouji?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs Ibuki-san and I reminisced about Yagami-kun, Kushida-san, who\u0026apos;d been listening quietly, tensed up at the mention of his name. Cornered in the student council room by Nagumo-senpai, Ryuuen-kun, and the teachers, Yagami-kun was expelled for instigating the assault on the deserted island.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, at the time, I had a fleeting thought that someone else might have been pulling the strings. A suspicion that Ayanokouji-kun had orchestrated the entire thing. But with no evidence, it was nothing more than a hunch. Now, however, that same suspicion was beginning to resurface.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Amasawa showed up at the end, too. And a bunch of weird adults stormed in.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s right... I believe they said they were mutual associates of Yagami-kun and Amasawa-san. My own memory has faded quite a bit, but I\u0026apos;m certain I heard that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYagami-kun and the others had been trying to get Ayanokouji-kun expelled.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed Ayanokouji-kun had summoned that very same Yagami-kun by setting a trap in a letter.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe connection between Yagami-kun and Amasawa-san was the only solid fact.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut any connection to Ayanokouji-kun remained unconfirmed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yagami, Amasawa, and Ayanokouji... maybe they were from the same middle school, or they\u0026apos;ve known each other for a long time? The possibility is definitely there, right? Why don\u0026apos;t you try searching for Yagami and Amasawa, too?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No luck, I\u0026apos;m afraid. I just tried.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed Kushida-san had already begun her search, as she turned her screen toward us to show the results.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt that moment, I remembered something I had forgotten until now.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Wait. Now that I think about it, Yagami-kun... he went to the same middle school as me\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? Seriously? Then doesn\u0026apos;t that mean he has nothing to do with Ayanokouji? How could you not remember something like that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It couldn\u0026apos;t be helped. I never knew him back in middle school. But you\u0026apos;re a different story, Kushida-san.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKushida-san, who\u0026apos;d been listening in silence up to this point, quietly placed her phone on the table.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Kushida-san, you\u0026apos;re from the same middle school as me, and you also knew Yagami-kun. Is that right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then it\u0026apos;s your fault, you idiot Kushida. Hurry up and say it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yagami... I see.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter murmuring quietly, Kushida-san continued.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, Ayanokouji-kun has transferred classes and there\u0026apos;s no point in hiding it here anymore, so I\u0026apos;ll tell you. Yagami-kun and I aren\u0026apos;t from the same middle school.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2014;Huh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? What\u0026apos;s that? What do you mean? I\u0026apos;m getting totally lost here.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIbuki-san was confused. At the same time, I also felt a sense of confusion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRight after last year\u0026apos;s first-years enrolled. I remembered that when Yagami-kun visited the second-year classrooms, they certainly had a conversation stating they were from the same middle school.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was something I believed unconditionally, without a shred of doubt. That fundamental premise was suddenly shattered.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd then, Kushida-san told us the reason why.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe students from her middle school days who knew her true nature. Although she had no memory of a kouhai named Yagami Takuya, he clearly acted as though he knew her. She was worried that if she acted like she didn\u0026apos;t know him, it would lead to a difficult situation where he might carelessly expose her past, so she impulsively lied that they were from the same middle school to go along with his story. She did it to probe and see for herself just how much Yagami-kun knew. And the result had been the worst possible one. Despite not being from the same middle school, Yagami-kun knew the details of Kushida-san\u0026apos;s past, and in exchange for not revealing it, he demanded various forms of cooperation from her. It seemed Amasawa-san had a hand in that affair as well.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;W-Wait a minute. That\u0026apos;s so much bombshell information, my head can\u0026apos;t keep up. You knew that Yagami-kun was smart, too... Was he really not your kouhai?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I only remembered a little because it was right after I saw the new students\u0026apos; OAA. He had an A in Academic Ability, so it stuck in a corner of my mind. It\u0026apos;d be a pain if a kouhai from my middle school showed up, like you did in my case, Horikita-san, right? That\u0026apos;s why I checked the faces and names of all the first-years the moment we got access.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe confessed that she\u0026apos;d skillfully used that \u0026apos;A in Academic Ability\u0026apos; part to pretend they were acquaintances.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t know how sure you guys were, Horikita-san, but the one who got Yagami-kun expelled was definitely Ayanokouji-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKushida-san cut into the one area where Ibuki-san and I had been unable to find a definitive answer.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I asked Ayanokouji-kun directly after Yagami-kun was expelled. He said he \u0026apos;took care of\u0026apos; Yagami-kun to save me from being used. It seems Yagami-kun and Ayanokouji-kun went to different schools, but he said they were acquaintances. Same for Amasawa-san; he said she lived nearby.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You should\u0026apos;ve said that sooner. Really, you idiot Kushida.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s my sealed-away past, you know. This is a story I really wouldn\u0026apos;t want anyone to hear.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Jeez, to think there was someone who knew what I wanted to know this close by.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Indeed... I sympathize with your circumstances, but this is a perfect example of it being darkest under the lighthouse.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt felt like the building blocks I\u0026apos;d painstakingly stacked on my own had been forcefully knocked over by a hand from the side.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ayanokouji-kun said he earned their resentment a long time ago. Did Amasawa-san forgive him? Was the misunderstanding cleared up? It seemed like something like that, but he said Yagami-kun wouldn\u0026apos;t forgive him. The story was that he probably dug up my past in order to get revenge on Ayanokouji-kun... I think.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKushida-san spoke, recalling that conversation from what was likely last year as best as she could.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I thought I\u0026apos;d never tell this story to anyone else, but you never know, I guess.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKushida-san, laughing self-deprecatingly, took a sip of water.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps her throat was dry from having spoken the truth she had hidden until now.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I may have made you recall unpleasant things, but this is a huge piece of information. Though we\u0026apos;ll need to reorganize everything from the beginning... you know.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe person known as Ayanokouji Kiyotaka, whose background was a mystery.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut it was a fact that even a person like Ayanokouji-kun had mutual acquaintances in Amasawa-san and Yagami-kun. Furthermore, both of them also possessed extraordinary abilities. What could be deduced from this was that their relationship was likely more than just being mere acquaintances.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe earned the resentment of his two kouhai somewhere\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Were they in the same environment since middle school, or perhaps even earlier, since childhood\u0026#x2014;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd there was some trouble... In my mind, I began to reconstruct everything from scratch.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t know anything about martial arts, but there are probably famous karate or judo dojos known nationwide, so isn\u0026apos;t it possible they attended a place like that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Idiot Kushida. Their strength isn\u0026apos;t something you can get that easily.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I did preface my statement by saying \u0026apos;I don\u0026apos;t know anything about martial arts,\u0026apos; didn\u0026apos;t I? Just because my idea is different from your perception, Ibuki-san, could you stop trying to attack people for it? You\u0026apos;re just embarrassing yourself. Also, could you stop calling me an idiot over and over? With our grades, it wouldn\u0026apos;t even be a contest between you and me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKushida-san added with exasperation that she\u0026apos;d merely offered one opinion from a layman\u0026apos;s point of view.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hmph. Knowing about martial arts is just common sense, isn\u0026apos;t it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t have that kind of common sense.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t fight. But it\u0026apos;s true that you can\u0026apos;t easily acquire skills like Ayanokouji-kun and the others just by attending a famous dojo... Conversely, yes, perhaps as a result of their skills, they were invited to a famous dojo or something, and that\u0026apos;s how they met... That line of thought might be possible.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe adults who came to pick up Yagami-kun when he went on a rampage in the student council room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf they were also people related to his origins, then the connections would gradually start to become visible.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I wonder if I should try asking Amasawa-san directly soon?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You think that little devil would tell you anything?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That may be true... What will you two do?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll pass.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If I see Amasawa\u0026apos;s face, I\u0026apos;ll want to punch her, so I\u0026apos;m not going.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe two of them showed their refusal almost simultaneously.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut it was true that making careless contact would likely yield no progress.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt might be better to start by just observing the situation.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 6\",\"volumeId\":\"y3v2\",\"chapterIndex\":24,\"prevChapter\":{\"volumeId\":\"y3v2\",\"chapter\":23,\"title\":\"Part 5\"},\"nextChapter\":{\"volumeId\":\"y3v2\",\"chapter\":25,\"title\":\"Part 7\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 2\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Nanase Tsubasa's Monologue\",\"href\":\"monologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Fitting In\",\"href\":\"ch-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"ch-1-p-1.xhtml\",\"index\":12},{\"label\":\"Part 2\",\"href\":\"ch-1-p-2.xhtml\",\"index\":13},{\"label\":\"Part 3\",\"href\":\"ch-1-p-3.xhtml\",\"index\":14},{\"label\":\"Chapter 2: A Gentle Exam\",\"href\":\"ch-2.xhtml\",\"index\":15},{\"label\":\"Part 1\",\"href\":\"ch-2-p-1.xhtml\",\"index\":16},{\"label\":\"Part 2\",\"href\":\"ch-2-p-2.xhtml\",\"index\":17},{\"label\":\"Chapter 3: Getting to Know the Opponent\",\"href\":\"ch-3.xhtml\",\"index\":18},{\"label\":\"Part 1\",\"href\":\"ch-3-p-1.xhtml\",\"index\":19},{\"label\":\"Part 2\",\"href\":\"ch-3-p-2.xhtml\",\"index\":20},{\"label\":\"Part 3\",\"href\":\"ch-3-p-3.xhtml\",\"index\":21},{\"label\":\"Part 4\",\"href\":\"ch-3-p-4.xhtml\",\"index\":22},{\"label\":\"Part 5\",\"href\":\"ch-3-p-5.xhtml\",\"index\":23},{\"label\":\"Part 6\",\"href\":\"ch-3-p-6.xhtml\",\"index\":24},{\"label\":\"Part 7\",\"href\":\"ch-3-p-7.xhtml\",\"index\":25},{\"label\":\"Part 8\",\"href\":\"ch-3-p-8.xhtml\",\"index\":26},{\"label\":\"Part 9\",\"href\":\"ch-3-p-9.xhtml\",\"index\":27},{\"label\":\"Chapter 4: The Quest for Knowledge\",\"href\":\"ch-4.xhtml\",\"index\":28},{\"label\":\"Part 1\",\"href\":\"ch-4-p-1.xhtml\",\"index\":29},{\"label\":\"Part 2\",\"href\":\"ch-4-p-2.xhtml\",\"index\":30},{\"label\":\"Part 3\",\"href\":\"ch-4-p-3.xhtml\",\"index\":31},{\"label\":\"Part 4\",\"href\":\"ch-4-p-4.xhtml\",\"index\":32},{\"label\":\"Chapter 5: Yamamura's Courage\",\"href\":\"ch-5.xhtml\",\"index\":33},{\"label\":\"Part 1\",\"href\":\"ch-5-p-1.xhtml\",\"index\":34},{\"label\":\"Part 2\",\"href\":\"ch-5-p-2.xhtml\",\"index\":35},{\"label\":\"Part 3\",\"href\":\"ch-5-p-3.xhtml\",\"index\":36},{\"label\":\"Part 4\",\"href\":\"ch-5-p-4.xhtml\",\"index\":37},{\"label\":\"Part 5\",\"href\":\"ch-5-p-5.xhtml\",\"index\":38},{\"label\":\"Chapter 6: Fortune and Misfortune Are Intertwined\",\"href\":\"ch-6.xhtml\",\"index\":39},{\"label\":\"Part 1\",\"href\":\"ch-6-p-1.xhtml\",\"index\":40},{\"label\":\"Part 2\",\"href\":\"ch-6-p-2.xhtml\",\"index\":41},{\"label\":\"Part 3\",\"href\":\"ch-6-p-3.xhtml\",\"index\":42},{\"label\":\"Chapter 7: The Observer\",\"href\":\"ch-7.xhtml\",\"index\":43},{\"label\":\"Part 1\",\"href\":\"ch-7-p-1.xhtml\",\"index\":44},{\"label\":\"Part 2\",\"href\":\"ch-7-p-2.xhtml\",\"index\":45},{\"label\":\"Part 3\",\"href\":\"ch-7-p-3.xhtml\",\"index\":46},{\"label\":\"Epilogue: Another Story Begins\",\"href\":\"epilogue.xhtml\",\"index\":47},{\"label\":\"Part 1\",\"href\":\"epilogue-p-1.xhtml\",\"index\":48},{\"label\":\"Part 2\",\"href\":\"epilogue-p-2.xhtml\",\"index\":49},{\"label\":\"Author's Afterword\",\"href\":\"authors-afterword.xhtml\",\"index\":50}],\"volumeTitle\":\"Light Novel 3rd Year Volume 2\",\"detailsLink\":\"/select/year-3/y3v2\",\"returnLink\":\"/select\",\"currentSpineIndex\":24,\"nextVolumeLink\":\"/select/year-3/y3v3\",\"nextVolumeTitle\":\"Light Novel 3rd Year Volume 3\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://classroom-of-the-elite-reader.vercel.app\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"COTE Reader\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"en_US\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:image:width\",\"content\":\"1200\"}],[\"$\",\"meta\",\"9\",{\"property\":\"og:image:height\",\"content\":\"630\"}],[\"$\",\"meta\",\"10\",{\"property\":\"og:image:alt\",\"content\":\"Classroom of the Elite Reader Preview\"}],[\"$\",\"meta\",\"11\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"12\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\"$\",\"meta\",\"13\",{\"name\":\"twitter:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"14\",{\"name\":\"twitter:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"15\",{\"name\":\"twitter:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"link\",\"16\",{\"rel\":\"icon\",\"href\":\"/hola-lector-agua/icon.svg?icon.ae5abf30.svg\",\"sizes\":\"any\",\"type\":\"image/svg+xml\"}],[\"$\",\"$L14\",\"17\",{}]]\n"])</script></body></html>
