e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T2244,"])</script><script>self.__next_f.push([1,"\u003ch1 class=\"heading_1\"\u003e\u003ca class=\"heading-link\" href=\"/read/y3v2/2\"\u003ePrologue:\u003cbr/\u003eNanase Tsubasa\u0026apos;s Monologue\u003c/a\u003e\u003c/h1\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;HOW DID IT come to this\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI quietly murmured beside him as he laid\u0026#xa0;unconsciously in his hospital room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;He suffers from a prolonged disturbance of consciousness. That\u0026apos;s the diagnosis I received.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe man stated\u0026#xa0;in an unreadable tone, gently stroking the \u0026apos;Matsuo Eiichirou\u0026apos; written on the name card attached to the bed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a prolonged disturbance of consciousness. To put it simply, a vegetative state.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt meant that although he could open his eyes and breathe, he wasn\u0026apos;t conscious and didn\u0026apos;t recognize or react to his surroundings.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe doctor said there was a chance he could regain consciousness within a few weeks or months of its onset, but... but... that hope was slim.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m told Matsuo-kun was a very kind-hearted person.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Yes... If I... If I\u0026apos;d noticed something was wrong with Eiichirou-kun, this wouldn\u0026apos;t have happened, no... I never would have let something like this happen...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFull of regret and sadness, my tears flowed endlessly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You cannot survive in this world on kindness alone. No, in fact, you\u0026apos;ll be preyed upon by fiends so wicked they are beyond salvation\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe man murmured and turned to face me, smiling.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The world works on give-and-take. You understand that, yes?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. I am grateful for your considerable support.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter visiting one hospital after another, he was the one who ultimately found a place that would accept Eiichirou.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf we\u0026apos;d arrived even thirty minutes late, he might not have survived.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What is it you want me to do?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I have brought you an opportunity to exact your revenge.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...An opportunity...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I will teach you how to get close to the person you should take revenge on.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSaying so, the man placed an \u0026apos;application form\u0026apos; and a photograph on the portable table.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What is this...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Attending ANHS is the only way to get close to your target\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...I realize I haven\u0026apos;t asked your name... Who are you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;My apologies. My name is Tsukishiro. I\u0026apos;ve been well acquainted with you and Matsuo-kun sleeping here, since you were children.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ve seen plenty of adults approach me, pretending to know things when they really know nothing.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is Shirogane-san doing well?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUpon hearing that name, my body reacted unconsciously, betraying my feigned composure.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe knew us since we were children.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd in an instant I understood that he was telling the truth.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So you know Shirogane-sensei.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;She took good care of me when I was young.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe looked to be about the same age as Shirogane-sensei. If that were the case, I could easily imagine that his definition of being \u0026apos;taken care of\u0026apos; was completely different from ours.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re not evil. But the inhabitants of the world I live in are nothing but evil, no matter where you look. They\u0026apos;re either evil cloaked in the guise of justice, or they\u0026apos;re simply pure evil. However, you\u0026apos;re different, Nanase Tsubasa-san. You\u0026apos;re ordinary, yet excellent. Ordinary, yet immature. Ordinary, yet talented. It\u0026apos;s precisely such a person who is sometimes capable of striking down evil. This is a personal philosophy of mine, as one who lives in this world.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re Tsukishiro-san, you said. Is this boy connected to that evil?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe one in the picture was a boy who looked to be about my age.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;He is Ayanokouji Kiyotaka, a key\u0026#xa0;figure who will lead you to the target of your revenge. He has already enrolled at ANHS and is living among the general student body.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You want me to get close to him?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. I will give you instructions as needed. Everything is for the sake of accomplishing your revenge. We shall act according to the circumstances. However, be careful. That boy, though inorganic, has outstanding, refined instincts. If you approach him carelessly, he will easily see through you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then, what should I do?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You must mix lies with the truth. It is, at the very least, an undeniable fact that you care for Matsuo Eiichirou and wish to fight a battle in his name to avenge him. Therefore, you should use that as a foundation to construct a new persona and maneuver in such a way that he cannot grasp your true intentions. He will naturally be suspicious of you, but he won\u0026apos;t delve too deeply. That is because he will recognize you as an insignificant being.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Let me ask one last thing. Why me?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It is because you are in a perfect position. Neither clearly on one side, nor the other. It\u0026apos;s precisely because it\u0026apos;s uncertain which way you will lean\u0026#xa0;that I\u0026apos;ve decided you\u0026apos;re the most suitable person for me to send.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then, what if I were to accept Ayanokouji\u0026#x2014;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s something we can consider when the time comes.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWhen he asked me if I would do it, I nodded without a pause.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eEven now, I sometimes remember that exchange as if it were a dream.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eAt that time, in that hospital room, my heart was at least set on revenge.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eI\u0026apos;d planned to drag out Ayanokouji Atsuomi, the one who cornered Eiichirou.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eBut now, things are a little different.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eI want to help Ayanokouji-senpai.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eI\u0026apos;ve come to think so from the bottom of my heart.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eBecause if he graduates from ANHS as he is\u0026#xa0;now, he will go down a path of pure evil.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eVictims, like Eiichirou, will end up being created by his hand.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eI don\u0026apos;t want that.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eThen\u0026#x2014;as the one who knows firsthand of that predicament, I must stop it.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eAnd even today, I continue to search for that small key in the deep forest...\u003c/em\u003e\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$1
