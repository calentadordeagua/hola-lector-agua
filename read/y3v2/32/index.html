e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T3152,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 4\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eBY THE TIME I left Keyaki Mall, it was past five in the afternoon.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe sky was still blue, but the evening sun would soon begin to peek through.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sorry, but I\u0026apos;m gonna take a little detour on my way back.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;A detour? Where to? I was thinkin\u0026apos; we\u0026apos;d all walk back together.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto asked, looking disappointed, as if he had assumed we would all return to the dorms together.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;To school. I was thinking I\u0026apos;d stop by the library.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah, Shiina, huh? Now that ya mention it, it seems like I interrupted you two talkin\u0026apos; this mornin\u0026apos;.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHaving prioritized his own plans, Hashimoto wore an expression that said he couldn\u0026apos;t argue with that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If that\u0026apos;s the case, I\u0026apos;ll gracefully see ya off today. Let\u0026apos;s head back, Morishita, Shiraishi.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;d rather not. Why should I have to walk home holding hands with Hashimoto Masayoshi?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No one said anythin\u0026apos; about holdin\u0026apos; hands. What kinda leap in logic is that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even if we weren\u0026apos;t holding hands, I still wouldn\u0026apos;t walk back with you. I\u0026apos;m going to browse around Keyaki Mall for a bit before I head back. So, if you\u0026apos;ll excuse me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith a graceful turn, Morishita went back inside the mall.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It seems Morishita-san dislikes you more than you imagined, Hashimoto-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t care if she hates me. It doesn\u0026apos;t bother me one bit if she does. Well then, Shiraishi, shall we go together\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m also going to take a small detour on my way back. Let\u0026apos;s walk home together some other time, Hashimoto-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Tch... I see. That\u0026apos;s a shame.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe seemed genuinely unconcerned when Morishita turned him down, but being rejected by Shiraishi as well must have been unexpected. Hashimoto\u0026apos;s shoulders slumped in disappointment as he walked back alone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Would you mind if I walked with you part of the way?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Do you have some business at the school?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No. I just thought I\u0026apos;d like to chat with you a little longer, Ayanokouji-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;With me? I\u0026apos;m not as interesting as Hashimoto, you know. Are you sure?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s just you being modest. You\u0026apos;re a very interesting person, Ayanokouji-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was hard to feel like I was being complimented, but even if it was just flattery, it didn\u0026apos;t feel bad to hear her say it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi fell into step beside me and we began to walk slowly toward the school.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt our pace, it would only be a few minutes before we reached the entrance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Come to think of it, this is only the second time we\u0026apos;ve been alone like this.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe first time was the day after I transferred to Class C. It\u0026#x2019;s been since that day that I came to school early in order to observe my classmates.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Fufu, that\u0026apos;s right. It hasn\u0026apos;t been that long since then, though.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...I suppose you\u0026apos;re right.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI made it a point of coming to school early ever since that day, but Shiraishi was no longer the first to arrive in the classroom. Now, my impression was that she tended to come in later. She\u0026apos;d mentioned she woke up unusually early that one time, so her habits were probably different from the start.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What kind of impression do you have of me, Shiraishi?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh my, that\u0026apos;s quite direct of you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Eh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I thought you were a more reserved person. I must say, that was a bold question.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No... Ah, I see, it could be taken that way. My apologies.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt might have sounded like a question related to romance, like whether she liked or disliked me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What I meant to ask was about me transferring into the class. I could tell you were welcoming from early on, but wouldn\u0026apos;t people normally be more suspicious?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why do you think that is?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe turned the question back on me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t know... I\u0026apos;d never even spoken to you during our first two years. I assumed that students who only saw me from the outside would have a rather negative impression.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter successfully navigating the first special exam, I managed to gain acceptance from my classmates, but Shiraishi seemed to place her trust in me even before that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was no sign that Hashimoto or Morishita gave her a special explanation early on.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re the person who transferred to Class C after Sakayanagi-san left, aren\u0026apos;t you? Moreover, Hashimoto-kun was certain you would be a great asset. While I\u0026apos;m not surprised some people were doubtful, I think there were actually quite a few who, like me, wanted to hold onto hope and believe in you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRather than give up on Class A, they would bet on that last chance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t difficult to say in words, but convincing one\u0026#x2019;s own heart was a different matter.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the future, for the sake of Yoshida and Shimazaki, I wanted to avoid creating opportunities to be alone with Shiraishi as much as possible. That was precisely why it might be okay to press a little further.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It may be conceited of me to say, but wasn\u0026apos;t Shiraishi watching me, to some extent, before I transferred classes?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was the same kind of observational gaze she\u0026apos;d shown in the karaoke room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed a bit excessive, going too far for someone she practically just met.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was also somehow different from the sense of distance she kept with Yoshida and the other boys.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer lips parted slightly, and an ambiguous sound, like a breathy word or a sigh, escaped them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd then Shiraishi, who stopped walking, looked directly at me from a few steps ahead and met my gaze.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ahh... that just won\u0026apos;t do.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026apos;Won\u0026apos;t do\u0026apos;? What\u0026apos;s wrong?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI asked quietly, but Shiraishi only continued to smile without answering.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter a few seconds of silence, in which it felt as if time had stopped\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m Shiraishi Asuka,\u0026quot; she said.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe already introduced ourselves long ago, and even spent time together during lunch breaks and on days off.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd yet, for some reason, Shiraishi now introduced herself all over again and held out her hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And you\u0026#x2014;who are you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wondered what the intention behind her words was.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOr perhaps, was she simply teasing me?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m Ayanokouji Kiyotaka.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePrepared to be laughed at, I accepted her words and her outstretched hand, grasping it in return.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI felt the touch of her slender fingertips, which were a little cold, but certainly held a gentle warmth.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;For some reason, you using your full name reminds me of Morishita-san.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;True...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed Shiraishi laughed, not because I was teasing her, but because of the resemblance to Morishita.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eComparing her to Hashimoto and Morishita, or Yoshida and Shimazaki, made it clear just how little my understanding of Shiraishi had progressed.\u003c/p\u003e\u003cimg src=\"/hola-lector-agua/images/books/y3v2/OEBPS/gdFtxkCshMjyAgqlHOGXR.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe Shiraishi that Yoshida saw and the Shiraishi that Shimazaki saw.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBy combining both of their impressions with my own, as her neighbor, I made some slight progress.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI thought I would be able to get a better grasp of her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn reality, however, the mystery only deepened.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer mysterious eyes couldn\u0026apos;t be confined to the simple label of \u0026apos;classmate and neighbor.\u0026apos;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOr perhaps this was simply her mysterious personality and atmosphere.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well then, I\u0026apos;ll be going. Please give my regards to Shiina-san.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the end, Shiraishi never answered my question.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWas there no reason, or was there one she simply didn\u0026apos;t want to give?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEither way, she didn\u0026apos;t seem harmful for the time being.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom there, I wanted to delve a little deeper to understand what kind of person she was.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter that, I made my way through the school and arrived at the library.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, that was just how things went; when the timing was off, it was completely off.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHiyori was nowhere to be seen in the spacious library and when I asked the familiar librarian, I was told she left before five o\u0026apos;clock.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince it was a Friday, it wouldn\u0026apos;t have been unusual for Hiyori to have a plan or two.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd so, day by day, my visit to Hiyori kept being pushed back\u0026#x2014;\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 4\",\"volumeId\":\"y3v2\",\"chapterIndex\":32,\"prevChapter\":{\"volumeId\":\"y3v2\",\"chapter\":31,\"title\":\"Part 3\"},\"nextChapter\":{\"volumeId\":\"y3v2\",\"chapter\":33,\"title\":\"Chapter 5: Yamamura's Courage\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 2\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Nanase Tsubasa's Monologue\",\"href\":\"monologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Fitting In\",\"href\":\"ch-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"ch-1-p-1.xhtml\",\"index\":12},{\"label\":\"Part 2\",\"href\":\"ch-1-p-2.xhtml\",\"index\":13},{\"label\":\"Part 3\",\"href\":\"ch-1-p-3.xhtml\",\"index\":14},{\"label\":\"Chapter 2: A Gentle Exam\",\"href\":\"ch-2.xhtml\",\"index\":15},{\"label\":\"Part 1\",\"href\":\"ch-2-p-1.xhtml\",\"index\":16},{\"label\":\"Part 2\",\"href\":\"ch-2-p-2.xhtml\",\"index\":17},{\"label\":\"Chapter 3: Getting to Know the Opponent\",\"href\":\"ch-3.xhtml\",\"index\":18},{\"label\":\"Part 1\",\"href\":\"ch-3-p-1.xhtml\",\"index\":19},{\"label\":\"Part 2\",\"href\":\"ch-3-p-2.xhtml\",\"index\":20},{\"label\":\"Part 3\",\"href\":\"ch-3-p-3.xhtml\",\"index\":21},{\"label\":\"Part 4\",\"href\":\"ch-3-p-4.xhtml\",\"
