hesitate to do without a second thought.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter the sound echoed in the surrounding area for a while, the door, which had long been silent, finally opened.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yo, Koenji. So you were in there after all.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh my, oh my. To think the fools at my door were none other than my own classmates.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I apologize for showing up unannounced so late at night. I have a simple request for you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you wished to make an appointment with me, I should think you would have used your cell phone.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Using a cell phone with no guarantee of reaching you would be a problem if this waited until tomorrow. Besides, I determined that you wouldn\u0026apos;t listen to my request unless I came to speak with you in person. It\u0026apos;s about the special exam.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I wondered what this request could be, but are you still not giving up, Horikita-girl? I was under the impression you\u0026apos;d seen the light during our discussion this afternoon.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You don\u0026apos;t have to participate in our discussions. And you don\u0026apos;t need to shoulder anything for the class by yourself. But that\u0026apos;s not it... If this were a request that would benefit you, wouldn\u0026apos;t you have room to consider it? If you hear me out, I\u0026apos;m sure it won\u0026apos;t be a bad deal for you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t want to overuse the tactic of dangling a carrot in front of an unmoving horse.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut it was also true that I couldn\u0026apos;t afford to say such things when dealing with Koenji-kun.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hmm. In that case, I suppose I shall hear you out.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs he said that, the door swung wide open before we could say anything else.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It would be difficult to talk with our voices echoing outside, wouldn\u0026apos;t it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps having realized something when he heard the words \u003cem\u003especial exam\u003c/em\u003e, he welcomed us into his entryway.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Never thought I\u0026apos;d see the day I\u0026apos;d be stepping into your room.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Fufufu. You should be purely delighted, red-hair-kun. You are the first man to have ever set foot in my room.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Not happy about it at all...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter making a gagging gesture, Sudou-kun crossed his arms and stood a half-step in front of me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Now then, shall you let me hear this story of yours? Something about it being beneficial to me?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. Starting tomorrow, I want you to simply come to school as usual, without being late or absent, and to refrain from idle chatter during class. On top of that, for one week only, I want you to correct all the behaviors that are considered problematic: your posture and habits in class, and any actions that disrupt discipline at Keyaki Mall and other places.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUp to this point, it was merely a request from our side. It was obvious that Koenji-kun would not nod his head in agreement for that alone. So I immediately got to the part that would benefit him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you exhibit no problematic behavior whatsoever, just like the other classmates, I will pay you 200,000 Private Points.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEssentially 200,000 yen just for being mindful of the rules for one week. This was undeniably an exceptional reward.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSudou-kun gave me a look that said I was paying too much. But without this level of impact, Koenji-kun wouldn\u0026apos;t budge. Besides, I was prepared to pay up to 300,000 points in the unlikely event he complained it was not enough.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So, you believe that following the rules is the basis of this exam, do you, Horikita-girl?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Coincidentally, that is precisely what I was thinking, myself.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That is... a coincidence. I would very much like you to tell me how you arrived at that conclusion.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Most likely the same way you did. From our teacher\u0026apos;s attitude.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUnlike me, who\u0026apos;d just had a flash of insight, Koenji-kun may have realized it at a much earlier stage. I wanted to ask for details, but I decided against it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;However, the world is full of various happenings. As it stands, the probability of this being an exam that requires discipline is about 70%. In the event that it is an entirely unrelated exam, or if we lose due to factors other than myself, I will still expect to be paid the full amount in Private Points. Is that acceptable?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hey, that ain\u0026apos;t fair!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There is nothing more expensive than something free, you know. If you cannot accept this, then I can offer no cooperation whatsoever.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I expected you would say that. I don\u0026apos;t mind accepting those terms, but you will have to avoid any action that could result in even a single point deduction.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Fufufu. Then our negotiations are complete. For one week, starting tomorrow\u0026#x2014;I shall sell you my discipline. For the exceptional price of 500,000 Private Points.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...You\u0026apos;re asking for quite a lot, aren\u0026apos;t you? I can hardly believe that\u0026apos;s an amount you\u0026apos;re willing to negotiate.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even this is me showing considerable kindness, you know? Not being able to check my bangs with a hand mirror during class when I am so concerned with them is painful for one such as myself who pursues beauty. Besides, I am the type who prefers to conclude negotiations in one fell swoop rather than probing each other\u0026apos;s true intentions.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat last remark was his way of saying he\u0026apos;d seen through the fact that I hadn\u0026apos;t set 200,000 Private Points as my upper limit. He hit me where it hurt, just like he did after school.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s way too much. Just because you\u0026apos;re takin\u0026apos; advantage of our weakness, you think you can get away with\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI stopped Sudou-kun, who was on the verge of grabbing him, cutting him off.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Forcing your own arbitrary sense of what\u0026apos;s normal is also out of the question, I trust you understand that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course. It will be a sad time from tomorrow, not being able to take in the sight of my beautiful, long legs upon my desk, but I suppose it can\u0026apos;t be helped.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Are you sure about this, Suzune? Five hundred thousand Private Points is just\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The deal is done. And don\u0026apos;t speak of this contract to anyone.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a gamble. Just as Koenji-kun said, there was no guarantee that obeying school regulations was part of the special exam rules, and a 70% chance would\u0026apos;ve been more than enough. But for now, I had to act with the belief that I could seize that probability; I wouldn\u0026apos;t be able to defeat the other classes without shouldering that much risk.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAbove all else, Koenji-kun would never act in an ordinary way. Had my request been something no one else could imitate, such as asking him to get a high score on an exam or take the top spot in sports, there would\u0026apos;ve been no room for negotiation at all.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut this time, it was the opposite kind of request: for him to simply do nothing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlthough it was a large sum, he accepted my proposal of Private Points.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well then, it is about time you took your leave. Today will be another long night for me. Or perhaps, Horikita Girl, would you care to accompany me for this long night? I promise you won\u0026apos;t regret it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Like hell! We\u0026apos;re leaving, Suzune.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSudou-kun took my arm and, as if he didn\u0026apos;t want me to linger for a second longer, opened the front door and stepped out into the hallway.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Damn that guy... Spouting such nonsense...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs we were leaving, Sudou-kun quietly cursed in front of the elevator.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It was a foolish joke, so pay it no mind. Besides, the negotiations were concluded successfully.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But still, isn\u0026apos;t five hundred thousand just for doing nothing way too steep?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If the other students heard about this, they\u0026apos;d no doubt complain. But rest assured. I have no intention of burdening anyone else in the class with the cost.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s not what I mean... Before we even get to whether you\u0026apos;re paying for it yourself, don\u0026apos;t you think there\u0026apos;ll be people who won\u0026apos;t be convinced if they find out about this proposal?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s right. That\u0026apos;s why I asked you to accompany me. You won\u0026apos;t tell anyone else about this negotiation, will you, Sudou-kun?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a request to keep it \u0026apos;confidential\u0026apos; while avoiding a direct statement.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSudou-kun looked a little bewildered, but he nodded firmly as he reached for the elevator\u0026apos;s up button.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;W-well... If you\u0026apos;re asking me to keep my mouth shut, then I won\u0026apos;t tell anyone.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Thank you. Oh, the down button is fine.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI reached past Sudou-kun\u0026apos;s slowly extending arm and pressed the down button.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m going to take the stairs back. Well then, you were a great help today for agreeing to my sudden request. Good night.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter thanking him, I turned toward the emergency exit door.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Suzune!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA voice called out, stopping me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What is it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026#x2014;I, um...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wondered if he hadn\u0026apos;t decided what to say, or if he had, but the words wouldn\u0026apos;t come out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSeeing him so flustered, his voice catching in his throat, I tilted my head slightly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you have something you want to say, you can tell me. Did you disapprove of my methods?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s not it. It\u0026apos;s not like that... I... I might not be a replacement for Ayanokouji, but...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAyanokouji. At his name, I found my eyes widening slightly in surprise.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m not strong like him, and I\u0026apos;m not smart either... But still, I\u0026apos;ll always be on your side, Suzune. So\u0026#x2014;whenever you\u0026apos;re in trouble, make sure you rely on me like you did today.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSudou-kun told me so, his eyes, filled with strong resolve, fixed on me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You held the class back quite a bit during our first year, so for this next year, I\u0026apos;ll need you to do your best until the very end.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ugh\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn response to my merciless words, Sudou-kun gave a wry smile, as if he\u0026apos;d broken out in a cold sweat.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The elevator is here. Say hello to Onodera-san for me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh, uh, yeah. Well... see you tomorrow...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes, see you tomorrow.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI watched Sudou-kun step into the elevator, then headed for the emergency stairwell.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Thank you, Sudou-kun. Your words made me very happy.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe reason I couldn\u0026apos;t thank him honestly was because I couldn\u0026apos;t help but feel a warmth spreading through my chest. I had allies. I had reliable classmates. I couldn\u0026apos;t remain in despair forever just because Ayanokouji-kun had left.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI knew I had to live up to the expectations of those who supported me, no matter what.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 9\",\"volumeId\":\"y3v2\",\"c :\"ch-4-p-3.xhtml\",\"index\":31},{\"label\":\"Part 4\",\"href\":\"ch-4-p-4.xhtml\",\"index\":32},{\"label\":\"Chapter 5: Yamamura's Courage\",\"href\":\"ch-5.xhtml\",\"index\":33},{\"label\":\"Part 1\",\"href\":\"ch-5-p-1.xhtml\",\"index\":34},{\"label\":\"Part 2\",\"href\":\"ch-5-p-2.xhtml\",\"index\":35},{\"label\":\"Part 3\",\"href\":\"ch-5-p-3.xhtml\",\"index\":36},{\"label\":\"Part 4\",\"href\":\"ch-5-p-4.xhtml\",\"index\":37},{\"label\":\"Part 5\",\"href\":\"ch-5-p-5.xhtml\",\"index\":38},{\"label\":\"Chapter 6: Fortune and Misfortune Are Intertwined\",\"href\":\"ch-6.xhtml\",\"index\":39},{\"label\":\"Part 1\",\"href\":\"ch-6-p-1.xhtml\",\"index\":40},{\"label\":\"Part 2\",\"href\":\"ch-6-p-2.xhtml\",\"index\":41},{\"label\":\"Part 3\",\"href\":\"ch-6-p-3.xhtml\",\"index\":42},{\"label\":\"Chapter 7: The Observer\",\"href\":\"ch-7.xhtml\",\"index\":43},{\"label\":\"Part 1\",\"href\":\"ch-7-p-1.xhtml\",\"index\":44},{\"label\":\"Part 2\",\"href\":\"ch-7-p-2.xhtml\",\"index\":45},{\"label\":\"Part 3\",\"href\":\"ch-7-p-3.xhtml\",\"index\":46},{\"label\":\"Epilogue: Another Story Begins\",\"href\":\"epilogue.xhtml\",\"index\":47},{\"label\":\"Part 1\",\"href\":\"epilogue-p-1.xhtml\",\"index\":48},{\"label\":\"Part 2\",\"href\":\"epilogue-p-2.xhtml\",\"index\":49},{\"label\":\"Author's Afterword\",\"href\":\"authors-afterword.xhtml\",\"index\":50}],\"volumeTitle\":\"Light Novel 3rd Year Volume 2\",\"detailsLink\":\"/select/year-3/y3v2\",\"returnLink\":\"/select\",\"currentSpineIndex\":27,\"nextVolumeLink\":\"/select/year-3/y3v3\",\"nextVolumeTitle\":\"Light Novel 3rd Year Volume 3\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec
