e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T4b72,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 5\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eAT 7:40 P.M. on Monday\u003c/em\u003e, Kaneda, having finished dinner in his dorm room, arrived in front of the karaoke parlor where they were to meet at 8:00, looking restless.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe occasionally looked around, let out small sighs and paced about the area.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat strange behavior came to an abrupt halt with the appearance of a certain person.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;T-Thank you for coming today, Shiina-shi.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith a nervous expression, Kaneda bowed his head, quickly adjusted his crooked glasses and offered a stiff smile. Then, he let out a long breath as he looked at Shiina in her casual clothes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The pleasure is all mine, Kaneda-kun. This feels somewhat refreshing, doesn\u0026apos;t it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes, it really is. I wonder what Ryuuen-shi\u0026#xa0;is thinking.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTogether, the two of them looked up at the karaoke parlor, which was brilliantly beckoning customers.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut Kaneda, out of the corner of his eye, burned the sight of Shiina into his memory.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe arrived much earlier than the meeting time because he anticipated that Shiina, who now stood beside him, might also arrive early. And that hunch was correct.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat meant they would have nearly twenty minutes alone together at most.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We still have a little time, what should we do? Personally, I think it would be best if we went inside to wait\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as he was about to suggest that, a loud voice echoed through the mall.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What the heck?! I thought I\u0026apos;d be the first one here, but you two already beat me to it!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith an exaggerated reaction to something not particularly surprising, Ishizaki arrived.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Hello, Ishizaki-shi.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhether he was put off by his attitude or for some other reason, Kaneda greeted him with a somewhat displeased look.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re here early. I had the impression you were the type to be late.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You look pretty bummed, Kaneda. Don\u0026apos;t tell me you\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs if he\u0026apos;d an inkling about Kaneda\u0026apos;s suspicious behavior, Ishizaki grinned slyly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;W-What is it...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s my job to greet Ryuuen-san, got it? I\u0026apos;m not gonna let you look cool!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see... So that\u0026apos;s why you arrived early, Ishizaki-shi.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The three of us got here at pretty much the same time. There\u0026apos;s no first or last place here, so remember that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Rest assured, I don\u0026apos;t place any importance on such things.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Man, I wonder what Ryuuen-san\u0026apos;s thinking. He said he\u0026apos;s not just callin\u0026apos; you, Kaneda, but that Tokitou guy too. They ain\u0026apos;t got the rank to be called to a meeting, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t know about Tokitou-shi, but I have regular meetings with Ryuuen-shi, so I would appreciate it if you didn\u0026apos;t lump us together.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKaneda pointed it out sharply, pushing up the bridge of his glasses with his middle finger.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn reality, Kaneda did have regular conversations with Ryuuen while the exams were underway, but a large portion of those cases involved them speaking one-on-one.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The strategy for the special exam\u0026apos;s already been decided, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. We haven\u0026apos;t received any additional orders as of now. Or, it\u0026apos;s also conceivable that this is a meeting to report on some other possibility he\u0026apos;s discovered...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Or maybe he needs our power. Like, we all get together and come up with some amazing ideas.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I understand what you\u0026apos;re trying to say, but that doesn\u0026apos;t mean just any talent will do... Don\u0026apos;t you agree, Shiina-shi?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was just a proverb, after all. Kaneda added that simply having more people wasn\u0026apos;t enough and was about to ask for Shiina\u0026apos;s opinion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt that moment, however, Ryuuen appeared and the atmosphere instantly grew heavy. Ishizaki also put on a tense expression, bowed his head deeply in greeting and immediately began to move inside the karaoke parlor.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe four of them were led to a room in the back that\u0026apos;d been reserved in advance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen slid a menu across the table and had the other three order food and drinks.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It seems Katsuragi-shi and Tokitou-shi haven\u0026apos;t arrived yet. Is that all right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;They let me know they\u0026apos;d be late. More importantly, Kaneda, have you heard anything from that Hashimoto guy?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWithout even looking at him, Ryuuen asked the question, and Kaneda slowly shook his head from side to side.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, I have not. We were in frequent contact until just before we became third-years, but since Ayanokouji-shi\u0026apos;s class transfer was finalized, he\u0026apos;s been ignoring my messages.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUpon hearing that report, Ryuuen closed his eyes and the left corner of his mouth curled up slightly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So he\u0026apos;s made up his mind, huh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It seems he holds Ayanokouji-shi\u0026apos;s abilities in very high regard. Of course, I\u0026apos;ve also been observing the recent developments objectively and have had to revise my own evaluation of him two or three times\u0026#x2014;but even so, I thought Hashimoto-shi would leave open the possibility of transferring to another class.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, Sakayanagi probably would\u0026apos;ve found Hashimoto\u0026apos;s two-timing diplomacy amusing, but with Ayanokouji, you never know how things will turn out. If he makes a clumsy move to secure his own escape route, he\u0026apos;ll be cut off without mercy. Even he doesn\u0026apos;t have the guts to cross that bridge.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEither risk it all and keep his ties to other classes, or commit fully and go down with Ayanokouji. Ryuuen answered that it was the decision he made after weighing those options.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...You truly do hold him in high esteem.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKaneda acknowledged his ability, but he still didn\u0026apos;t rate him as highly as Ryuuen did.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBecause he\u0026apos;d only ever seemed like an ordinary student, Kaneda perceived him as having some kind of weakness and failed to sense the sharpness\u0026#x2014;the kind that made one feel they would get hurt just by touching him, like with Sakayanagi or Ryuuen.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen turned his gaze to Shiina, who hadn\u0026apos;t said a word since entering the room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What\u0026apos;s your read on Ayanokouji right now?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Me?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;His actions since transferring classes. Including what the hell he\u0026apos;s aiming for.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA little surprised, Shiina recalled how he\u0026apos;d been when she ran into him in the elevator the other day.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I wonder... I can\u0026apos;t really give a good answer.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s impossible, Ryuuen-san. It\u0026apos;s \u0026apos;cause Shiina sees Ayanokouji through a filter.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;A filter? What do you mean by that, Ishizaki-shi?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKaneda retorted to the strange expression.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s a special filter, man. A special one. The kind ya call the Ayanokouji Filter.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt Ishizaki\u0026apos;s answer, Kaneda\u0026apos;s facial muscles tensed slightly and his expression grew grim.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven Shiina, who was dense about such things, understood what Ishizaki was trying to say and looked down awkwardly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen, on the other hand, didn\u0026apos;t change the way he looked at Shiina in the slightest.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t give a damn what kind of feelings you have for Ayanokouji. But as long as you\u0026apos;re a member of my class, you need to work to make us win. Got it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes, I understand.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Anyway, you managed to talk to Ayanokouji after he transferred, right? Tell us about that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No... Actually, I haven\u0026apos;t been able to speak with him properly yet.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? How come? I definitely told him to go see you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs Ishizaki tilted his head in confusion, Shiina\u0026apos;s spirits sank at the mention of Ayanokouji.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll get in touch with Ayanokouji right now and\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s enough out of you. Just sing.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs if to say there was no need for any more pointless talk, Ryuuen gripped the microphone and tossed it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;W-Whoa, r-roger that!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIshizaki, who caught the mic to keep it from falling, seemed to think he\u0026apos;d been appointed to liven things up, grinning determinedly as he psyched himself up. Then, after he selected a song, the introduction began to play.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as he began to sing, the door to the room opened, and Katsuragi and Tokitou appeared in the karaoke room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sorry for the wait.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eImmediately after Katsuragi spoke, Tokitou cut in and confronted Ryuuen.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What do you think you\u0026apos;re doing, calling even me out here?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I figured I\u0026apos;d listen to a useless guy\u0026apos;s opinion for once. It\u0026apos;s just a whim.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile Ishizaki belted out his song, sparks already flew between Ryuuen and Tokitou.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Now, calm down. First, why don\u0026apos;t you tell us why you\u0026apos;ve gathered us here today? I was under the impression our policy for the current special exam had already been decided.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Tearing down Ayanokouji and the next special exam. Figured I\u0026apos;d touch on that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Hoh. That sounds like a rather interesting topic.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Got any new information on Ayanokouji?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, I don\u0026apos;t. I haven\u0026apos;t really been able to speak with him lately. There\u0026apos;s always someone from Class C by his side, starting with Hashimoto. I\u0026apos;ve been avoiding any careless attempts at contact.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBeside Katsuragi as he answered, Tokitou also averted his gaze, responding with silence.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Um, Ryuuen-shi. If you would permit me, would you allow me to look into Ayanokouji-shi? Since I haven\u0026apos;t tried to get close to him before, I might be able to learn something new.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Do as you like.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen replied without expectation, and then, the moment Ishizaki finished his song, the conversation shifted to the next special exam.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In my opinion, the results of the current special exam aren\u0026apos;t that big of a deal. However, judging by the lackluster rewards, it wouldn\u0026apos;t be surprising if the next special exam causes a major shift in Class Points. We absolutely cannot afford to fail that one.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs if agreeing with Kaneda\u0026apos;s assessment, Katsuragi nodded firmly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;d say so. Even though we\u0026apos;re Class B and Horikita\u0026apos;s is Class A, that doesn\u0026apos;t mean we\u0026apos;re in a safe zone. Our last loss narrowed the gap and now we\u0026apos;re under heavy pressure from the classes below. If we suffer two or three consecutive losses, we\u0026apos;ll inevitably be neck-and-neck with them. And if that happens, many of our classmates will see it not as being on equal footing, but as falling into a disadvantage.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The outcome of that special exam is our class\u0026apos;s final line of defense, isn\u0026apos;t it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was still only May. Assuming the next major special exam would be held in either June or July, the worst-case scenario might await them before they even reached the halfway point of the year.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If there is any silver lining, I suppose it\u0026apos;s that we can assume the probability of an academics-centered special exam is not very high. While studying is an inseparable part of being a student, if we\u0026apos;re constantly forced to compete in that area, our class has no chance of victory from the outset. I\u0026apos;m sure the school wouldn\u0026apos;t be so consistently unfair.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt the time of class assignments upon enrollment, many honor students were placed in Class A.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile one could accept that as a large head start, if that alone were to decide everything, there would\u0026apos;ve been no need to make them compete from the very beginning, as it would\u0026apos;ve been entirely superfluous.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If the rewards are worth it, we should use anything at our disposal, including the Private Points we saved last time. I don\u0026apos;t want to recommend it, but that includes acts that border on breaking the rules.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So you\u0026apos;re finally starting to get it, Katsuragi. But I have no intention of fighting within the rules. Fouls, whatever, I\u0026apos;ll use any means necessary to win.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I understand. But I will stop you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKatsuragi didn\u0026apos;t change his stance of strictly adhering to the rules.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey continued their fruitless discussion, and a silence fell between them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a disconnected moment, especially as other students were getting rowdy in the next room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ryuuen-kun... you\u0026apos;re not trying to force me to talk about Ayanokouji-kun, it seems...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s just that I don\u0026apos;t think I\u0026apos;d get any useful information out of you anyway.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Is that really the only reason?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? What do you want me to say? Do you want me to order you to \u0026apos;find his weakness by any means necessary\u0026apos;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2014;That\u0026apos;s...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen already had the answer to that question.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat Shiina felt for Ayanokouji went beyond mere friendship.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll make damn sure you\u0026apos;re useful. Not for Ayanokouji, but for this class.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if it meant exploiting those feelings, Ryuuen envisioned a future where he defeated Ayanokouji.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. That resolve\u0026#x2014;I intend to form it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEver since the transfer, she hadn\u0026apos;t been able to have a proper conversation with Ayanokouji.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBecause of that, Shiina was trying to come to a certain resolution.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo Ayanokouji, she was just a friend, or perhaps even less than a friend.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf that were the case, even her faint feelings would become heavy shackles.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKaneda quietly continued to watch Shiina, whose sorrowful profile looked as if she might vanish.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was the first such experience for a man who\u0026apos;d lived his life devoid of any fighting spirit.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 5\",\"volumeId\":\"y3v2\",\"chapterIndex\":38,\"prevChapter\":{\"volumeId\":\"y3v2\",\"chapter\":37,\"title\":\"Part 4\"},\"nextChapter\":{\"volumeId\":\"y3v2\",\"chapter\":39,\"title\":\"Chapter 6: Fortune and Misfortune Are Intertwined\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 2\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Nanase Tsubasa's Monologue\",\"href\":\"monologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Fitting In\",\"href\":\"ch-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"ch-1-p-1.xhtml\",\"index\":12},{\"label\":\"Part 2\",\"href\":\"ch-1-p-2.xhtml\",\"index\":13},{\"label\":\"Part 3\",\"href\":\"ch-1-p-3.xhtml\",\"index\":14},{\"label\":\"Chapter 2: A Gentle Exam\",\"href\":\"ch-2.xhtml\",\"index\":15},{\"label\":\"Part 1\",\"href\":\"ch-2-p-1.xhtml\",\"index\":16},{\"label\":\"Part 2\",\"href\":\"ch-2-p-2.xhtml\",\"index\":17},{\"label\":\"Chapter 3: Getting to Know the Opponent\",\"href\":\"ch-3.xhtml\",\"index\":18},{\"label\":\"Part 1\",\"href\":\"ch-3-p-1.xhtml\",\"index\":19},{\"label\":\"Part 2\",\"href\":\"ch-3-p-2.xhtml\",\"index\":20},{\"label\":\"Part 3\",\"href\":\"ch-3-p-3.xhtml\",\"index\":21},{\"label\":\"Part 4\",\"href\":\"ch-3-p-4.xhtml\",\"index\":22},{\"label\":\"Part 5\
