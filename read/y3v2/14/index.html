e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T63e4,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 3\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA LITTLE WHILE later, Shimazaki said he was going to study and left ahead of us.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMeanwhile, Yoshida, perhaps still unable to sort out his feelings, remained sitting on the bench, his back hunched over as he clutched a half-full plastic bottle with both hands. All things considered, the 280 ml bottle might have been the better choice.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Shouldn\u0026apos;t we head home? It looks like the weather\u0026apos;s going to get even worse.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf the downpour got any stronger, our pants would likely get soaked even with an umbrella.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlthough I spoke to him, he didn\u0026apos;t react\u0026#x2014;his mind seemingly elsewhere. I watched over him from nearby for a while, but just as I was about to prompt him again, his hunched back straightened up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Yeah, you\u0026apos;re right...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe then gave a listless reply, stood up, and started to walk away sluggishly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You forgot your book.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I handed him the book, which had been left in a paper bag on the bench, he accepted it with another listless reply. Our earlier conversation was clearly weighing heavily on his mind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What am I supposed to do if Shiraishi likes girls...? I\u0026apos;m a guy, y\u0026apos;know, a guy!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That hasn\u0026apos;t been confirmed as the truth yet.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But still...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you\u0026apos;re this shocked at this point, you should probably give up on having feelings for Shiraishi. It\u0026apos;s possible the \u0026apos;100-man slayer\u0026apos; rumor is true, that she likes girls, and on top of that, something else you don\u0026apos;t want could come up, Yoshida. Am I wrong?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis wasn\u0026apos;t a story limited to just Shiraishi. When trying to get to know someone, discovering an unimaginable past was something one could experience many times in life. If he wasn\u0026apos;t prepared for that, then retreating was also a form of courage.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Something I don\u0026apos;t want, huh.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhether it was because of the shock or because he\u0026apos;d finally admitted his feelings for Shiraishi, he no longer showed any signs of refuting that point.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I... yeah, that\u0026apos;s right... Who cares about \u0026apos;100-man slayer,\u0026apos; who cares if she likes girls... I have to accept that, or I can\u0026apos;t move forward, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo carve out a possibility, he had to walk a thorny path.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe put strength into his arms, and as he hugged the book tightly, the light began to return to Yoshida\u0026apos;s eyes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Alright\u0026#x2014;I...!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Rather than worrying about the past, the thing you should be most down about right now is that Shimazaki likes Shiraishi. That\u0026apos;s an undeniable truth.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Guh!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYoshida, who\u0026apos;d just been getting fired up, made an exaggerated motion as if he were coughing up blood to show how hard he\u0026apos;d been hit.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hey, Ayanokouji, are you tryin\u0026apos; to cheer me up or get me down?! Which is it!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I suppose my timing was poor, but I only meant to inform you of the situation. It\u0026apos;s neither of those.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sayin\u0026apos; it\u0026apos;s neither is pretty harsh, ain\u0026apos;t it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNow that he mentioned it, he was certainly right.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I want to cheer you up.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t say it so artificially... You\u0026apos;re that kinda guy, aren\u0026apos;t you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as I was analyzing him in various ways, it seemed Yoshida was analyzing me in a similar fashion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I mean, that\u0026apos;s the reality of the situation. I can\u0026apos;t believe Shimazaki is a rival...\u003cem\u003esigh\u003c/em\u003e.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps because the area just outside the entrance to Keyaki Mall was deserted, Yoshida brought the subject up again. He likely couldn\u0026apos;t help but try to get it off his chest.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs we opened our umbrellas and started walking, a heavy rain immediately began to patter against the fabric.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Does it bother you that Shimazaki is a rival?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, yeah, of course. For this sorta thing, the fewer rivals the better. Shiraishi\u0026apos;s already super popular. Not a lot of guys are makin\u0026apos; a move on her \u0026apos;cause of the rumors, but if those turn out to be fake, they\u0026apos;ll probably all rush her at once.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf that happened, the problem would no longer be just about Shimazaki.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Still, it didn\u0026apos;t look like he was planning on confessing his feelings to Shiraishi for the time being.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust watching from a distance was enough for him. Depending on one\u0026apos;s perspective, it could be said that he lacked the courage to pursue romance, but that depended on how much importance he judged it to have in his future life. Despite his high academic ability, Shimazaki never grew complacent and studied even on his days off to achieve even the slightest improvement. That suggested that his target school was of a very high level. From that, there was no doubt that his first priority wasn\u0026apos;t romance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven so, with the appearance of an unexpected rival, someone who prioritized romance would naturally feel impatient.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Come on, people can have a sudden change of heart... If I start goin\u0026apos; after Shiraishi openly, all those feelings he\u0026apos;s\u0026#xa0;been holdin\u0026apos; back might just explode out. Ain\u0026apos;t that right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s possible.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps because he\u0026apos;d admitted his feelings in front of me and Shimazaki, Yoshida no longer tried to hide his true feelings.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRomantic feelings weren\u0026apos;t something that could be easily controlled.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if I hadn\u0026apos;t experienced it myself, I understood it as fact.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Just to be sure, you ain\u0026apos;t gonna say you\u0026apos;re after Shiraishi too, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I believe I already denied that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But if the rumors are fake, you might join in, right? Plus, you could have a change of heart, no, your feelings could wander. You do sit next to her, after all.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe seemed to want a verbal commitment, so he persistently sought confirmation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m not sure if you\u0026apos;ll be satisfied with me just saying it\u0026apos;s fine, but it is.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt that moment, I held no feelings for Shiraishi beyond that of a classmate.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYoshida, who\u0026apos;d been looking at me as if to ascertain my true intentions, soon nodded as if to show a certain degree of acceptance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was probably something he could only process by accepting it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, I guess she\u0026apos;s not at all like Karuizawa, who you dated. Hey, I don\u0026apos;t mean that in a bad way, y\u0026apos;know? There\u0026apos;s no doubt Karuizawa is cute.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile quite a few boys saw Karuizawa as a \u003cem\u003egyaru\u003c/em\u003e, a frivolous girl, in reality she also had a completely different side to her, and she was different from the type of person others imagined. That said, Yoshida\u0026apos;s current statement was, above all, proof that her appearance was at a level others envied.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I know what you\u0026apos;re trying to say.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as people had likes and dislikes when it came to food, preferences of all kinds existed for romantic interests.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn fact, Shiraishi and Karuizawa were probably not the same type.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat point seemed to have become a reason for Yoshida to feel a little relieved.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven so, it was hard to believe it was a coincidence that both Shimazaki and Yoshida, two people who\u0026apos;d closed the distance with her early on, were both interested in Shiraishi. Perhaps a fair number of students in the class were hiding feelings close to love for Shiraishi.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What I don\u0026apos;t quite understand is, is Shiraishi actually a popular student with the opposite sex? Well, of course, I\u0026apos;ll admit she has superior looks that draw more attention than the average female student, but\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile they were few in number when looking at the entire grade, it could be said that female students of a similar level still existed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;She\u0026apos;s undeniably cute. And also...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And also?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe seemed to be implicitly suggesting that it wasn\u0026apos;t just about her physical appeal.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut whether he was shy or just didn\u0026apos;t want to tell me, he didn\u0026apos;t finish his statement.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;May I ask what points you find attractive about her?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSo, I tried pressing him a step further.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Eh? Well... how do I put it...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile looking somewhat embarrassed, Yoshida continued his words.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s like, that mysterious part of her, y\u0026apos;know, it\u0026apos;s what\u0026apos;s so great about her.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMysterious. It was safe to say that Yoshida\u0026apos;s description was an accurate assessment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI also felt something elusive in Shiraishi\u0026apos;s way of thinking.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd hearing Shimazaki now declare that Shiraishi\u0026apos;s \u0026apos;100-hundred man slayer\u0026apos; moniker was a lie was a factor that contributed to that feeling.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Mysterious, huh. I sort of get what you mean, but when it comes to being mysterious, don\u0026apos;t you think Morishita might be on a higher level?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I asked if she was a romantic interest in the same way, Yoshida\u0026apos;s eyes immediately widened in irritation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t be stupid, Ayanokouji. That thing with Morishita isn\u0026apos;t mysterious, she\u0026apos;s just an incomprehensible weirdo. You\u0026apos;ve had eraser dust thrown at you from behind as well, haven\u0026apos;t you? That\u0026apos;s the work of a little devil, don\u0026apos;t you ever lump her in with Shiraishi. Shiraishi is full of kindness.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYoshida also seemed to have been a victim in the past, based on the \u0026quot;as well\u0026quot; and the strong tone he was speaking in.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps he\u0026apos;d been observing things during self-study, as it seemed he\u0026apos;d clearly witnessed that moment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;My apologies. Please allow me to offer a sincere apology for that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI immediately reflected on the fact that I shouldn\u0026apos;t have treated her as being in the same category as Morishita.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...As long as you get it. Hold on, don\u0026apos;t tell me you, of all people, are into Morishita?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why would you think that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, I thought it was weird when she said she wanted you in the seat in front of her. Plus, she never hangs out with anyone, but she talks to you an awful lot. She\u0026apos;d be cute if she didn\u0026apos;t talk, right? It\u0026apos;s a rare case where her internal evaluation cancels out her external one.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlthough, it was doubtful whether it merely ended at canceling each other out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat said, it was probably best to stop messing with him so carelessly any further.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter all, she probably wouldn\u0026apos;t feel good knowing she was being talked about so freely like this.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Unfortunately, that\u0026apos;s not it. If anything, she should be wary of me. She\u0026apos;s the one who\u0026apos;s most suspicious about whether I truly intend to help the class.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt could be said that she was the furthest thing from being a potential romantic interest.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So that\u0026apos;s why she\u0026apos;s keeping you close, huh. What you said was true, then.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I struggle every day with her behind me, saying all sorts of things to me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe expression \u0026apos;possessed by something evil\u0026apos; might have been a perfect fit.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see. At this rate, it doesn\u0026apos;t seem like Morishita will become a romantic interest for you. I mean, it\u0026apos;d take a real weirdo for that to happen anyway. Besides, you don\u0026apos;t need to bother with someone like Morishita, you\u0026apos;re popular with the girls anyway... Honestly, I\u0026apos;m super jealous.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Am I popular?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t say it in such a goddamn irritating way. You\u0026apos;re good-looking, and on top of that, you\u0026apos;re smarter and more athletic than Shimazaki. And then you even transferred from Class A to Class C and became the leader, you know? A normal girl wouldn\u0026apos;t just leave you alone, would she?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat\u0026apos;s what it meant to be popular. Apparently, that was how I looked to those around me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA coward who betrayed his class and hid his true abilities.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had been doing nothing but things that would make me disliked by boys and girls alike, but for the Class C students who had become my allies, that impression seemed to have faded.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I wanna go out with Shiraishi!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe seemed unable to hold back his emotions any longer, and his feelings exploded in a loud voice.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What if Shiraishi heard you from behind\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What, no way!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYoshida threw his open umbrella aside and jumped.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe even dropped his book, but I caught it just before it hit the ground.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2014;what would you do, is what I was going to ask.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What kind of feint was that!? I\u0026apos;m getting soaked!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe hurriedly picked up the umbrella, but his entire hoodie was instantly dotted with raindrops.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, it\u0026apos;ll dry soon enough.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Easy for you to say...!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI handed him the book and started walking again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYoshida\u0026apos;s expression changed constantly, showing his every emotion without reservation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe common thread in all of it was \u0026apos;romantic feelings.\u0026apos;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was an undeniable fact, acknowledged by himself and others, that the Yoshida in front of me was genuinely \u0026apos;in love\u0026apos; with Shiraishi. On the other hand, I still didn\u0026apos;t fundamentally understand that emotion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI dated Karuizawa to learn about \u0026apos;romantic feelings,\u0026apos; but we broke up and I still wasn\u0026apos;t able to understand them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAll I learned was the form of a romantic relationship between a boy and a girl, but I was unable to analyze it as an emotion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFalling in love with someone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eComing to hate someone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the truest sense, I still knew nothing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf not for my goal of bringing balance to the four classes, I could\u0026apos;ve pursued that for another year.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI might have been able to view Karuizawa with romantic feelings.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut it was too late for that. A meaningless fantasy now.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWatching Yoshida speak so earnestly, I decided to simply say what was on my mind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You said you envy me, but I\u0026apos;m the one who envies you, Yoshida.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? Me? Why?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You can honestly say that you\u0026apos;re in love with Shiraishi. Rather, I\u0026apos;m honestly envious that you\u0026apos;re able to feel that way, Yoshida.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYoshida naturally surrendered himself to a problem that couldn\u0026apos;t be expressed with a formula.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;N-no, it\u0026apos;s not like I like her\u0026#x2014;cut it out... It\u0026apos;s just a one-sided, pathetic crush, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe tried to deny it again, but perhaps realizing it was futile, he sighed once before continuing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s nothing to envy. You\u0026apos;re being sarcastic, aren\u0026apos;t you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wondered if the slight anger he showed, even as he laughed, was genuine.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, I, for my part, was also speaking honestly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not sarcasm. I still don\u0026apos;t understand romantic feelings. To genuinely fall in love with someone, to want that love to succeed, to not want to be rejected, to not want to be hated. Or conversely, to come to hate someone, to want to break up with them\u0026#x2014;I don\u0026apos;t understand those positive and negative emotions.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What the hell? You don\u0026apos;t sound like you\u0026apos;re messing around... but... I mean, you were actually dating Karuizawa, right? And for a pretty long time, too, wasn\u0026apos;t it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYoshida confronted me with an undeniable fact.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...It\u0026apos;s fine. Just forget it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if I put my feelings into words, he wouldn\u0026apos;t be able to understand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo Yoshida, I was someone who dated Karuizawa.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was only natural for him to conclude I experienced all the emotions that came with romance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, seeing my words and attitude, it seemed he sensed something, even if he didn\u0026apos;t fully understand the reason.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Well, I\u0026apos;ll drop it, since it\u0026apos;d be rude to push it any further.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter saying that and pausing for a moment, Yoshida peered at me and asked a question, as if there was still something he wanted to confirm.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So, you don\u0026apos;t have anyone you like right now?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see. So there are guys like that, huh.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s why I\u0026apos;m envious. Being able to fall for someone for real.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Hope you find someone you can really fall for, too.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA member of the opposite sex one could truly love.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy romantic experience with Karuizawa, and my relationship with Ichinose that others couldn\u0026apos;t understand\u0026#x2014;it was certain that I was, perhaps, getting close.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThinking the other person was cute, thinking they were beautiful.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePhysical contact with the opposite sex and my heart rate rising.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI\u0026apos;d gone through those kinds of experiences to some extent.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, romantic feelings still hadn\u0026apos;t sprouted within me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOr perhaps I simply hadn\u0026apos;t noticed, and had in fact already experienced it?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOur pleasant chat as we both gazed at the rain came to a lull.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Let\u0026apos;s just head back for now, Ayanokouji. Looks like the rain\u0026apos;s gonna get stronger after this.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was what I\u0026apos;d just said... but I decided to refrain from making a tactless jab.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe began to walk forward again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlthough it was for a short time, I was able to get a general grasp of their personalities from talking with Yoshida and Shimazaki.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor better or worse, they were straightforward and the type to say what was on their minds.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYoshida was stricter on the surface but quite caring underneath, while Shimazaki was a person who could interact with classmates and friends from an appropriate distance without getting too close or being biased; I also managed to obtain information about their romantic troubles.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed safe to conclude that my analysis of them as classmates was complete enough.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBoth of them were indispensable to the class, and they would continue to function as useful students; if they ever ran into trouble, I would have to support and protect them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe walked silently through the strengthening rain and returned to the dorms\u0026#x2014;\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 3\",\"volumeId\":\"y3v2\",\"chapterIndex\":14,\"prevChapter\":{\"volumeId\":\"y3v2\",\"chapter\":13,\"title\":\"Part 2\"},\"nextChapter\":{\"volumeId\":\"y3v2\",\"chapter\":15,\"title\":\"Chapter 2: A Gentle Exam\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 2\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Nanase Tsubasa's Monologue\",\"href\":\"monologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Fitting In\",\"href\":\"ch-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"ch-1-p-1.xhtml\",\"index\":12},{\"label\":\"Part 2\",\"href\":\"ch-1-p-2.xhtml\",\"index\":13},{\"label\":\"Part 3\",\"href\":\"ch-1-p-3.xhtml\",\"index\":14},{\"label\":\"Chapter 2: A Gentle Exam\",\"href\":\"ch-2.xhtml\",\"index\":15},{\"label\":\"Part 1\",\"href\":\"ch-2-p-1.xhtml\",\"index\":16},{\"label\":\"Part 2\",\"href\":\"ch-2-p-2.xhtml\",\"index\":17},{\"label\":\"Chapter 3: Getting to Know the Opponent\",\"href\":\"ch-3.xhtml\",\"index\":18},{\"label\":\"Part 1\",\"href\":\"ch-3-p-1.xhtml\",\"index\":19},{\"label\":\"Part 2\",\"href\":\"ch-3-p-2.xhtml\",\"index\":20},{\"label\":\"Part 3\",\"href\":\"ch-3-p-3.xhtml\",\"index\":21},{\"label\":\"Part 4\",\"href\":\"ch-3-p-4.xhtml\",\"index\":22},{\"label\":\"Part 5\",\"href\":\"ch-3-p-5.xhtml\",\"index\":23},{\"label\":\"Part 6\",\"href\":\"ch-3-p-6.xhtml\",\"index\":24},{\"label\":\"Part 7\",\"href\":\"ch-3-p-7.xhtml\",\"index\":25},{\"label\":\"Part 8\",\"href\":\"ch-3-p-8.xhtml\",\"index\":26},{\"label\":\"Part 9\",\"href\":\"ch-3-p-9.xhtml\",\"index\":27},{\"label\":\"Chapter 4: The Quest for Knowledge\",\"href\":\"ch-4.xhtml\",\"index\":28},{\"label\":\"Part 1\",
