e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T2e75,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 2\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAFTER WORKING UP a good sweat, I left the gym with Ichinose and Amikura.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Alright, I\u0026apos;m gonna make a little detour on my way home,\u0026quot; Amikura announced as soon as we stepped outside, then promptly put some distance between us, waving as she headed down the escalator.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;She was in quite a hurry. Is she meeting up with someone?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Mm, I think she was just being considerate. So that you and I could talk alone, Ayanokouji-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWas it out of concern for the leaders of allied classes to deepen their friendship? Or some other kind of consideration? It wasn\u0026apos;t particularly difficult to imagine the real reason.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you\u0026apos;d like, how about we walk home together? Ah... saying it like that makes it hard for you to say no, doesn\u0026apos;t it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, it\u0026apos;s fine. I was planning on heading straight home today anyway. Besides, we haven\u0026apos;t had a chance to talk about the exam.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Really? That\u0026apos;s great, I\u0026apos;m glad.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI left Keyaki Mall with Ichinose, who looked up at me and smiled, her eyes narrowing slightly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe time was past 6:30 p.m., but it wasn\u0026apos;t dark outside.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was proof that winter\u0026apos;s shadow had completely retreated and the daylight had begun to linger, one step at a time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The outcome this time was unfortunate, wasn\u0026apos;t it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even if you\u0026apos;re thorough about managing your health, some things are just out of your control. It can\u0026apos;t be helped.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as every class imagined, the recent exam took place over the course of one week.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe evaluation was based on how well we adhered to proper daily conduct and school rules, and although we weren\u0026apos;t told the detailed point distribution, we were informed that all four classes were more or less neck and neck.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe results were: Ichinose\u0026apos;s class in first place with 50 Class Points. Horikita\u0026apos;s and Ryuuen\u0026apos;s classes were in second place, each receiving 10 Class Points. My class, with two absentees, came in last with a deduction of 25 points. It was a relief that Hoshinomiya-sensei\u0026apos;s outburst didn\u0026apos;t have a negative impact.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHorikita Class 1240 points\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen Class 1081 points\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAyanokouji Class 867 points\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIchinose Class 864 points\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was no change in the class rankings, and the gap from Class A to Class D remained mostly unchanged.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not a problem in the grand scheme of things. It\u0026apos;s a gap we can close if we aim to win the next special exam.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see. That\u0026apos;s very reassuring. I\u0026apos;ll do my best to help out as much as I can, too.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course, I\u0026apos;m counting on you. More importantly, I have something else I\u0026apos;d like to discuss. I\u0026apos;m thinking of getting more people to join the gym. Is it alright if I invite them?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I think that\u0026apos;s a great idea! I was actually getting a little worried about things like sales, since the number of members is so low.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIchinose readily expressed her approval, agreeing it was a good plan.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But you don\u0026apos;t need my permission or anything.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s not quite right. The students I\u0026apos;m thinking of inviting are from your class, Ichinose.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh, really? Who are they?\u0026quot;\u003c/p\u003e\u003cimg src=\"/hola-lector-agua/images/books/y3v2/OEBPS/lVhZMayuhWwmBdFdcwpCW.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The three I\u0026apos;m thinking of asking are Watanabe, Kanzaki, and Himeno.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI consciously relayed the names in a natural flow, so as not to hint at any particular intention with the order or combination.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd I deliberately chose not to mention Hamaguchi\u0026apos;s name.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, it was a petty trick at best. Upon hearing the three names, Ichinose smiled.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s an interesting trio. Kanzaki-kun has seemed a little distant from me lately, and on the other hand, it seems he\u0026apos;s gotten closer with Himeno-san, as the two of them have apparently been seen talking together at times. I\u0026apos;m aware they were trying hard to do something when I was being so unreliable. If we\u0026apos;re at the gym together, we might be able to remove that unnecessary barrier, don\u0026apos;t you think? But in that case, wouldn\u0026apos;t it be better to invite Hamaguchi-kun as well?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed she completely read my intentions. And she had a magnificent grasp on the state of her own class.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And Watanabe-kun simply wants to get closer to Mako-chan\u0026#x2014;I guess that\u0026apos;s about it, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Impressive. I guess it was obvious.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile I was sincere about wanting to liven up the gym, she saw through the reasons for my choices all too easily.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I can figure that much out. But, yes, I\u0026apos;d totally welcome them. I think Watanabe-kun will be fine as long as we just pretend not to notice his true motives, but... I wonder if Kanzaki-kun and the others will agree to join?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;They\u0026apos;ll join. No, I believe they have to.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re right. It doesn\u0026apos;t have to be the gym later on, but I\u0026apos;ve been feeling that we really do need to unite the class in the truest sense, and sooner rather than later.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In that case, I\u0026apos;ll go ahead and ask them without hesitation.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Okay, thank you. I\u0026apos;m really happy for your support, Ayanokouji-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter Ichinose, standing to my right, gave me an unreserved smile, the back of her left hand brushed against the back of my right for an instant.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen her hand slowly drew near again and our fingertips touched and intertwined.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, she reflexively realized it was wrong and hastily pulled away.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer cheeks reddened, and she averted her gaze. But her eyes slowly returned to me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I-I\u0026apos;m sorry... I\u0026apos;m sorry. I just... couldn\u0026apos;t help wanting to touch you... even though we\u0026apos;re just friends, aren\u0026apos;t we.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven though we knew everything about each other, our relationship was that of friends.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven though I knew it was only a difference in a single expression, a large, insurmountable wall stood between us.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was easy enough to take her wavering hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was sure that Ichinose herself wouldn\u0026apos;t have minded the action.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t dislike her personality, her body, or her thoughts.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn fact, it was true that she seemed far more charming than some half-assed person.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I stared at her, Ichinose shyly met my gaze as well.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe also possessed the great capacity to accept me, even knowing a part of my darkness.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd yet\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI would have denied that my heart was being swayed by romance at that very moment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI recalled the other day: the library after school with Hiyori and the sight of her holding the flower.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA space enveloped in a sense of bliss, a feeling I never experienced before.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI clearly desired what I had felt on that day, at that time\u0026#x2014;an emotion I had no memory of experiencing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2014;Who are you thinking about?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs if she slipped into my thoughts through our meeting gaze, her lips moved to form those words.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What makes you think that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Because you looked so happy, I suppose.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIchinose had always been skilled at reading the atmosphere and understanding people, but since that night, her perception had sharpened dramatically.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m sorry, you don\u0026apos;t have to answer. It\u0026apos;s not something a friend should be prying into... right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe showed a slightly lonely expression but quickly returned to her usual self.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEventually, we arrived in front of the dorms, keeping a slight distance between us.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll be waiting for Kanzaki-kun and the others\u0026apos; reply, okay?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter watching her back as she hurried into the dorm ahead of me, I lifted my gaze slightly and stared at the sky, stained by the sunset.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe joy of learning a new emotion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd what kind of effect that emotion would have on myself, and on others.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWould what came next be prosperity, or ruin?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOr perhaps, something else entirely?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was, at that moment, living a very fulfilling\u0026#x2014;contented moment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor that, I had to be truly, deeply grateful.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 2\",\"volumeId\":\"y3v2\",\"chapterIndex\":45,\"prevChapter\":{\"volumeId\":\"y3v2\",\"chapter\":44,\"title\":\"Part 1\"},\"nextChapter\":{\"volumeId\":\"y3v2\",\"chapter\":46,\"title\":\"Part 3\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 2\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Synopsis\",\"href\":\"synopsis.xht
