e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T3ad8,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 4\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAFTER PARTING WITH Hashimoto, I returned to the school.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe time was just past five o\u0026apos;clock. Most students had already gone home and the majority of those remaining were in the middle of their club activities.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShouts could be heard from the fields and the sound of squeaking shoes from the gymnasium.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was heading to the library to meet Hiyori, something I\u0026apos;d been putting off for a while.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe exchanged greetings on Friday, but didn\u0026#x2019;t get to talk beyond that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe invitation to transfer to Class B.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI refused it and, for my own purposes, transferred to the unrelated Class C.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t that I regretted it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut the reason I still felt a lingering pull was probably because I, too, had wanted to transfer to Class B, where Hiyori was waiting.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs an ordinary male student of the Advanced Nurturing High School.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA year spent without being tied down by things like being a leader or a strategist.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA future that might have been.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA future I could\u0026apos;ve chosen.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI recalled the end of our second year, when Ishizaki led me to hold hands with Hiyori.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Am I regretting this?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSeeing my own faint reflection in the windowpane, I stopped walking.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy feet, which stayed away from the library under the pretext of personal matters.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was true that many things often overlapped at inconvenient times.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut it wasn\u0026apos;t as if I couldn\u0026apos;t go to the library at all.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI should\u0026apos;ve been able to find a gap in my schedule and make enough time to at least show my face.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDoes that mean I was unconsciously avoiding going there?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhy?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI probably already had the answer to that question.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBecause I didn\u0026apos;t want to see the sadness on Hiyori\u0026apos;s face, if at all possible.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBecause, even though I knew it was wrong, I betrayed the smile of the girl who invited me with all her heart.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut that wasn\u0026apos;t rational.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe more time that passed, the more the relationship deteriorated and the sadness grew. If I was the one at fault, I should\u0026apos;ve gone to see her immediately, apologized, and repaired the relationship.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKnowing it was pointless, I posed the question to myself once more.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo answer comes back. Of course not. The answer was already in my head. The act of asking myself questions while pretending not to know... it felt unsettling somehow.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI decided to move to Class C and rejected Hiyori\u0026apos;s invitation. Therefore, I would apologize for it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhy couldn\u0026apos;t I just get on with such a simple process?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI could also tell her via a call or a message, so why hadn\u0026apos;t I even considered that as an option?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the first place, Hiyori wasn\u0026apos;t the only one saddened by my transfer.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy classmates, like Horikita, who were aiming to graduate from Class A, were the prime victims of that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSo why am I\u0026#x2014;so concerned only about Hiyori...?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI averted my gaze from the windowpane and started my halted feet moving toward the library once more.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had no basis for it, but I felt like I\u0026apos;d understand if I went and saw her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was the feeling I had.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as I steeled my resolve and started moving again, Hasebe appeared from the hallway that led to my destination. There didn\u0026apos;t seem to be anyone else around right now, but I wondered what she was doing all by herself at this hour.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was a little curious, but we weren\u0026apos;t on the kind of terms that we could casually call out to one another. So, I figured we would just pass each other by and that would be the end of it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIndeed, Hasebe seemed to notice me right away, but she averted her gaze, her eyes downcast.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd so, we passed each other without exchanging a word.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hey... hey...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a faint, small voice, so much so that I thought I might have imagined it for a moment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut it definitely came from Hasebe.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I stopped and turned around, Hasebe did the same, though she kept her gaze averted.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I... I wanted to talk for a bit, if that\u0026apos;s... okay?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt would\u0026apos;ve been easy to refuse, but I could see a hint of resolve in Hasebe.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe\u0026apos;d approached me in the same way at the end of the school year, but Amasawa\u0026apos;s interference at the time meant I was ultimately unable to hear what she had to say.\u003c/p\u003e\u003cimg src=\"/hola-lector-agua/images/books/y3v2/OEBPS/fXQWGKCSlvjlEkSueEGIQ.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf I brushed her off again here, she might never approach me again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was before I changed classes. And now it was after I\u0026apos;d changed classes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat she wanted to talk about might have changed, but it seemed I needed to hear her out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah. I couldn\u0026apos;t hear you out when you came to talk to me before.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You remembered.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It was just the other day.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s true... In the meantime, you changed classes, Ayanokouji-kun... but... could that be my fault? Because I came to talk to you\u0026#x2014;and you got sick of it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s completely unrelated, so you can rest easy. I\u0026apos;d been getting offers from students in the current Class C since before the end-of-year special exam. Sakayanagi\u0026apos;s expulsion just made it a reality.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a lie I made up on the spot, but there was no problem with it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt didn\u0026apos;t matter whether there was one reason or a hundred for my transfer, for my betrayal.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh... I see.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhether she believed my words or not, she let out a breath as if relieved, or rather, as if she were a little happy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I would\u0026apos;ve thought resentment would come first.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Resentment...? It\u0026apos;s not like I have the right to feel something like that... It\u0026apos;s like, conversely, with you changing classes, Ayanokouji-kun, I feel like we\u0026apos;ve found a more appropriate distance between us. Of course, I\u0026apos;m going to be in my current class forever, so I think I understand that part.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA distance that was uncomfortable as an ally. A distance that was comfortable as an enemy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSo that was how Hasebe was taking it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So, if it\u0026apos;s not about resentment, what\u0026apos;d you want to talk to me about?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh, yeah, well, actually\u0026#x2014;it\u0026apos;s...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile answering my question, Hasebe hurriedly searched for something on the phone she was holding.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I just really wanted you, Ayanokouji-kun, to see how hard she\u0026apos;s been working\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom Hasebe\u0026apos;s flustered phone-fiddling and fragmented words, I figured out what she wanted to say.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe one who left the school. The student named Sakura Airi and what happened to her afterward. Hasebe must have some information about that. I\u0026apos;d briefly heard that she\u0026apos;d passed an audition, but that was just a piece of information I\u0026apos;d acquired. Until a short while ago, I wouldn\u0026apos;t have had any interest in it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, through my contact with Tsubaki, I had developed a slight curiosity about what happened to those who dropped out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eStill, that was only in comparison to before.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt certainly wasn\u0026apos;t something worth stopping and turning back for.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHasebe\u0026apos;s anxious eyes, staring at me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAll I would gain by refusing was the small amount of time that wouldn\u0026apos;t be wasted afterward.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is it... not okay?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I didn\u0026apos;t answer, Hasebe whispered, clutching her phone anxiously.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s not true. I\u0026apos;d like to hear it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Eh\u0026#x2014;r-really?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah. I didn\u0026apos;t have the courage to look into it myself, but to be honest, I\u0026apos;ve been wondering about her all this time.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe students of Horikita\u0026apos;s class were becoming more and more wary of me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlthough there were still some cracks, it would probably become difficult to extract information from them from now on.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn that case, I just needed to try a new angle of attack.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePrecisely because I put myself in a difficult position by abandoning everything and betraying my class, I couldn\u0026apos;t pass up an opportunity to test how to win them over, or how to create a breakthrough.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHasebe, her eyes sparkling, held out her phone to me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;She\u0026apos;s started to appear on TV bit by bit, though it\u0026apos;s in a late-night slot.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;On TV? That\u0026apos;s amazing.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSakura was expelled at the beginning of the second term last year. The fact that she made it onto TV in less than a year since then was genuinely surprising.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI imagined her simply starting a new school life as a student at some other school.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed she had actually wanted to invite Miyake and Yukimura to talk about Sakura at the end of the school year, and I confirmed that what she wanted to tell them was exactly the same.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOur standing conversation went on longer than expected and the scenery outside began to take on a reddish hue.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh...! Sorry, Ayanokouji-kun. I got carried away talking... Didn\u0026apos;t you have somewhere to be?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s fine. I enjoyed talking with you, Hasebe, it\u0026apos;s been a while. And I was happy to learn more about Sakura.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;R-Really? To be honest, I could talk about Airi forever... but I\u0026apos;m glad.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you don\u0026apos;t mind, let\u0026apos;s make some time to talk again somewhere. Or, if you\u0026apos;re worried about drawing resentment from Class A, we could talk on the phone.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course! I\u0026apos;ll make sure you become Airi\u0026apos;s number two fan, Kiyopon.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed she didn\u0026apos;t realize it herself, but she unconsciously called me by my old nickname.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter that, I parted ways with Hasebe and arrived at the library before six o\u0026apos;clock, but Hiyori was already gone; the same librarian from the other day told me that she left about ten minutes earlier.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere were two main routes from the library to the entrance, and it seemed I picked the wrong one, a fifty-percent chance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe librarian asked if I wanted them to pass on a message, but I declined the offer.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll try again another day.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was no need to rush; the time to know the answer would surely come soon enough.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 4\",\"volumeId\":\"y3v2\",\"chapterIndex\":37,\"prevChapter\":{\"volumeId\":\"y3v2\",\"chapter\":36,\"title\":\"Part 3\"},\"nextChapter\":{\"volumeId\":\"y3v2\",\"chapter\":38,\"title\":\"Part 5\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 2\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Nanase Tsubasa's Monologue\",\"href\":\"monologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Fitting In\",\"href\":\"ch-1. 0},{\"label\":\"Part 2\",\"href\":\"ch-6-p-2.xhtml\",\"index\":41},{\"label\":\"Part 3\",\"href\":\"ch-6-p-3.xhtml\",\"index\":42},{\"label\":\"Chapter 7: The Observer\",\"href\":\"ch-7.xhtml\",\"index\":43},{\"label\":\"Part 1\",\"href\":\"ch-7-p-1.xhtml\",\"index\":44},{\"label\":\"Part 2\",\"href\":\"ch-7-p-2.xhtml\",\"index\":45},{\"label\":\"Part 3\",\"href\":\"ch-7-p-3.xhtml\",\"index\":46},{\"label\":\"Epilogue: Another Story Begins\",\"href\":\"epilogue.xhtml\",\"index\":47},{\"label\":\"Part 1\",\"href\":\"epilogue-p-1.xhtml\",\"index\":48},{\"label\":\"Part 2\",\"href\":\"epilogue-p-2.xhtml\",\"index\":49},{\"label\":\"Author's Afterword\",\"href\":\"authors-afterword.xhtml\",\"index\":50}],\"volumeTitle\":\"Light Novel 3rd Year Volume 2\",\"detailsLink\":\"/select/year-3/y3v2\",\"returnLink\":\"/select\",\"currentSpineIndex\":37,\"nextVolumeLink\":\"/select/year-3/y3v3\",\"nextVolumeTitle\":\"Light Novel 3rd Year Volume 3\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://classroom-of-the-elite-reader.vercel.app\"}],[\"$\",\"meta\",
