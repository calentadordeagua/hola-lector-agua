e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T2748,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 1\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eONLY ABOUT THIRTY minutes had passed since school let out. I arrived at the library at a relatively early hour.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter many twists and turns, the time had finally come.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe start of a new special exam during Golden Week, repeated after-school invitations, and chance encounters. A considerable amount of time had passed since Ishizaki told me to meet with Hiyori.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I stepped into the library, its distinctive scent gently drifted into my nostrils.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wondered if Hiyori was there.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe library at ANHS was so vast that finding a person could be just as difficult as finding a book.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I happened to glance at the librarian at the entrance, she gave me a warm smile and then pointed a finger without a word.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat direction was the area where the mystery novels were shelved.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eApparently, the person I was looking for was there.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I slowly approached the spot, which was still some distance away, Hiyori appeared from behind a bookshelf.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBefore long, in the sparsely populated library, our eyes met.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut in the next instant, she averted her gaze and disappeared deeper into the shelves.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI thought our eyes met, but could it be that she hadn\u0026apos;t noticed me?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eCalling out from a distance would be a breach of etiquette, so I headed for the bookshelves.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe was no longer where I\u0026apos;d last seen her, so I began checking the aisles between the shelves.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOne, two, three...\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhere was she? I couldn\u0026apos;t imagine she had gone that far\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as I was thinking that, I finally found Hiyori at the end of the aisle, on the opposite side of the bookshelf where I stood.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd our eyes definitely met.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOr so I thought, but she immediately broke her gaze and vanished into another aisle.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe definitely noticed me. If so, does that mean she\u0026apos;s avoiding me?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWas it because I was late in coming to see her? Because I didn\u0026apos;t transfer to Ryuuen\u0026apos;s class?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I speculated on the reason, I closed the distance to talk to her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf she continued to run away from me inside the library, then I would have no choice but to give up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI couldn\u0026apos;t bring myself to forcibly corner someone who was clearly reluctant.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHoping that wouldn\u0026apos;t be the case, I walked toward the spot where I\u0026apos;d last seen Hiyori.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhere did she go from there...?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as I was thinking that, Hiyori, perhaps wanting to see where I\u0026apos;d gone, peeked out from behind a nearby bookshelf.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe distance was less than two meters. Close enough that if I stepped forward and reached out my arm, I could easily touch her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hiyo\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI tried to call her name, but she hid her face again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut she didn\u0026apos;t run away again; it seemed she\u0026apos;d only hidden her face.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs proof, her hand rested on the bookshelf and a part of her uniform was visible.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Was I bothering you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I spoke in a quiet tone, her face slowly emerged after a brief silence.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Did you come here to look for a book to read...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt least she replied. For now, I was relieved about that.\u003c/p\u003e\u003cimg src=\"/hola-lector-agua/images/books/y3v2/OEBPS/LlMgAFLkskDfsqQkPbLJr.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, I came to see you today, Hiyori.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe meaning of my words must have gotten through, but Hiyori still wouldn\u0026apos;t come out from behind the bookshelf, keeping half her body hidden. I was reminded of the words of Ishizaki from the other day.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026apos;Make sure you see Shiina soon. She was pretty down, even if not as much as I was.\u0026apos;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd then there was the somewhat awkward atmosphere from when we were in the elevator together a few days ago.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhy hadn\u0026apos;t I come to see her sooner?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI now regretted that I\u0026apos;d been running away from the guilt I felt over transferring classes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you still bothered by the fact that I rejected your class\u0026apos;s invitation and transferred to Class C?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI decided that we would not be able to have a satisfactory conversation without first eliminating any unnecessary distance between us, so I posed the question. Hiyori, who immediately showed her agitation, averted her eyes, which had been trying to meet mine and pressed her lips tightly together.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I suppose I can\u0026apos;t say... that I haven\u0026apos;t been concerned. I kept imagining that maybe my invitation was the reason you were keeping your distance, Ayanokouji-kun...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s quite unlike you. You of all people should know that\u0026apos;s not possible.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf anything, the Hiyori in my mind was always unhurried and did things at her own pace.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI saw her as a person who could look at matters calmly, with a discerning eye, without ever growing flustered.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI assumed she understood, without me needing to say a word, that my transfer from Class A to Class C had a purpose that could only be attained by joining that class.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was no way she\u0026apos;d distance herself just because her invitation was rejected.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, it was an undeniable fact that I\u0026apos;d delayed coming to see her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I apologize again for not being able to accept the transfer to Class B. And for taking so long to properly talk about it. That caused the misunderstanding.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the silence of the library, Hiyori took in my words, then shook her head.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No... You\u0026apos;ve done nothing wrong, Ayanokouji-kun. The class transfer... how should I put it... was just me getting my hopes up on my own... And even though I thought there might be a reason on my part for why you weren\u0026apos;t visiting, I couldn\u0026apos;t bring myself to come see you. Please allow me to apologize for that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter she said that, the rest of her body, which had been hidden, slowly came into view.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen she bowed her head, as deeply as she possibly could.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd yet, Hiyori didn\u0026apos;t have a single thing to apologize for.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat being said, continuing this apology contest wouldn\u0026apos;t lead to anything productive.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I thought I was prepared...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Prepared?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We\u0026apos;re in different classes now, Ayanokouji-kun. I thought that our relationship, where we could chat so familiarly, had to come to an end... But talking with you like this... I suppose...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSo she\u0026apos;d been trying to sever our friendly relationship and resolve herself to see me as an enemy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRealizing that, I felt a sense of relief that I made it in time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you don\u0026apos;t mind, Hiyori, why don\u0026apos;t we talk about this past month we\u0026apos;ve been apart? We have plenty of time today.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is it... really okay?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course. I came here today because I wanted to see you and talk with you, Hiyori.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I told her my honest feelings, a smile appeared on Hiyori\u0026apos;s face for the first time that day.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 1\",\"volumeId\":\"y3v2\",\"chapterIndex\":40,\"prevChapter\":{\"volumeId\":\"y3v2\",\"chapter\":39,\"title\":\"Chapter 6: Fortune and Misfortune Are Intertwined\"},\"nextChapter\":{\"volumeId\":\"y3v2\",\"chapter\":41,\"title\":\"Part 2\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 2\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Nanase Tsubasa's Monologue\",\"href\":\"monologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Fitting In\",\"href\":\"ch-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"ch-1-p-1.xhtml\",\"index\":12},{\"label\":\"Part 2\",\
