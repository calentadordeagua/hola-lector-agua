e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T1f97,"])</script><script>self.__next_f.push([1,"\u003ch1 class=\"heading_1\"\u003e\u003ca class=\"heading-link\" href=\"/read/y3v2/2\"\u003eChapter 3:\u003cbr/\u003eGetting to Know the Opponent\u003c/a\u003e\u003c/h1\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTHE STUDENTS OF Class A looked at each other as the bell signaling the end of morning homeroom rang.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was the announcement of an unheralded special exam, something that had become a regular occurrence, but this time they couldn\u0026apos;t hide their bewilderment at the slightly different development.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;W-wait, even if you say that\u0026apos;s all, that\u0026apos;s not nearly enough of an explanation!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIke-kun hastily called out to stop Chabashira-sensei, who\u0026apos;d moved to the door to leave the classroom.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I told you, didn\u0026apos;t I? I will not be accepting any questions this time.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah, but\u0026#x2014;!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith a conspicuous sigh, Chabashira-sensei turned only her head and looked at Ike-kun.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m not being intentionally cold. It\u0026apos;s simply a rule that we teachers cannot elaborate on the specific rules of this exam.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer harsh tone made the expressions of the classmates, including Ike-kun, stiffen even more.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I want you to stop acting so spoiled and show me you\u0026apos;ve grown. I\u0026apos;d like you to make me think you\u0026apos;re different from when you first enrolled.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eChabashira-sensei declared, as if to drive the point home.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe fact that it wasn\u0026apos;t harassment and that she never intended to spend time explaining the rules from the start was something we were supposed to infer from the unnatural timing of the announcement, right before the end of homeroom.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe swung the classroom door wide and left without fuss.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven after the door slammed shut, the classroom didn\u0026apos;t fall silent; rather, the teacher\u0026apos;s departure only made it grow noisier.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;She seriously left. How\u0026apos;re we supposed to take this on without even hearing the rules?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;She said she wasn\u0026apos;t being intentionally cold, but wasn\u0026apos;t she kinda cold?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah, she was super cold. Could it be because we lost the last special exam?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We did our best, though.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe classmates continued to grumble and complain as they pleased.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I get why you wanna say that, but calm down, will ya? Kickin\u0026apos; up a fuss ain\u0026apos;t gonna tell us the rules.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps to signal \u0026#x2018;you\u0026#x2019;re being loud\u0026#x2019;, Sudou-kun stuck his pinky into his left ear as he chided the restless students.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sudou-kun is right. The lack of a rules explanation isn\u0026apos;t something to get so worked up about. The other classes are fighting under the same conditions, so there\u0026apos;s no advantage or disadvantage at this stage.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn concert with Sudou-kun\u0026apos;s strong, resonant voice, Hirata-kun also said as much to soothe the students.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s easy for you to say, but we can\u0026apos;t do anything if we don\u0026apos;t know the rules. Wouldn\u0026apos;t it be better to just go in blind a week from now?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I think that would\u0026apos;ve been better, too. This feels like we\u0026apos;re just being strung along.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShinohara-san strongly agreed with the unceasingly complaining Ike-kun.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI could understand what they wanted to say, but the special exam had now been announced.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn that case, all we could do was face it seriously.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo begin with, it was a mistake to assume there were no hints before even thinking about it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI couldn\u0026apos;t just stand by and watch until things got out of hand, so I decided to speak up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The special exam doesn\u0026apos;t start until tomorrow, so just panicking here is a waste of time. First, we should calm down, brainstorm ideas, and discuss things.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You say \u0026apos;ideas,\u0026apos; but what can we do if the rules haven\u0026apos;t been explained?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHere, Hondou-kun, looking exasperated, stared at the large, powered-off monitor that served as a blackboard, re-emphasizing that things were different from usual.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If we pool our wisdom, it\u0026apos;s possible we can get closer to the rules. We just need to imagine what kind of special exam will be held and prepare our options.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah, well, maybe you\u0026apos;re right, but can we really overlook our teacher\u0026apos;s attitude? I\u0026apos;m talkin\u0026apos; about how cold she was, you know?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShinohara-san seemed to have really disliked Chabashira-sensei\u0026apos;s response, as she continued to fixate on that point.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd several other students agreed with her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI really didn\u0026apos;t think it should take priority over the content of the special exam, but...\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was true that Chabashira-sensei had become much softer in her demeanor compared to before. In fact, during the second half of our second year, the frequency with which she showed us a smile increased to the point where she was almost unrecognizable from her former self.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNow in our third year, Ayanokouji-kun transferred, and our teacher was hurt, too.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSometimes that showed in her attitude. But wasn\u0026apos;t that proof that she felt Class A would be forced into a difficult situation from now on...?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e...or perhaps she was limiting unnecessary kindness and smiles to a minimum, as a way to make us refocus.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAbove all, demanding kindness for free, for whatever reason, was simply out of line.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was how I took it, but they didn\u0026apos;t.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe frustrated gazes of some students were directed at me, Hirata-kun, and even Sudou-kun.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEveryone was suffering, burdened with an indescribable frustration.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I thought about our history, I felt no small amount of resistance to reprimanding them harshly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI can\u0026apos;t forget that everyone in the class was also a victim, caught up in the discord created by Ayanokouji-kun\u0026apos;s departure.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the end, no satisfactory discussion took place before the first period began, and only time passed.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 3: Getting to Know the Opponent\",\"volumeId\":\"y3v2\",\"chapterIndex\":18,\"prevChapter\":{\"volumeId\":\"y3v2\",\"chapter\":17,\"title\":\"Part 2\"},\"nextChapter\":{\"volumeId\":\"y3v2\",\"chapter\":19,\"title\":\"Part 1\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 2\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Nanase Tsubasa's Monologue\",\"href\":\"monologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Fitting In\",\"href\":\"ch-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"ch-1-p-1.xhtml\",\"index\":12},{\"label\":\"Part 2\",\"href\":\"ch-1-p-2.xhtml\",\"index\":13},{\"label\":\"Part 3\",\"href\":\"ch-1-p-3.xhtml\",\"index\":14},{\"label\":\"Chapter 2: A Gentle Exam\",\"href\":\"ch-2.xhtml\",\"index\":15},{\"label\":\"Part 1\",\"href\":\"ch-2-p-1.xhtml\",\"index\":16},{\"label\":\"Part 2\",\"href\":\"ch-2-p-2.xhtml\",\"index\":17},{\"label\":\"Chapter 3: Getting to Know the Opponent\",\"href\":\"ch-3.xhtml\",\"index\":18}
