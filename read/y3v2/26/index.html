e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T362d,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 8\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI RUSHED OUT of my room just after 8:00 p.m. and first headed downstairs in the elevator.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd then, standing in front of Sudou-kun\u0026apos;s room, I suppressed my impatience and knocked with some reservation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter hearing footsteps pattering toward the door, it opened a little roughly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Who the hell is it at this hour\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSudou-kun appeared, still in his school uniform with only his blazer removed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe sight of him wearing glasses, which I rarely saw, felt a little refreshing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I apologize for visiting without notice. I have something I\u0026apos;d like to talk about.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;S-S-S-Suzune!? Wh-what are you doing here? I mean, uh, it\u0026apos;s not a problem or anything!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA mechanical pencil was clutched in the hand of the flustered, gesticulating Sudou-kun.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh? Horikita-san?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom behind the bewildered Sudou-kun, Onodera-san poked her head out as she spoke.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI glanced at the entryway and saw two pairs of shoes. Even I had my suspicions, however slight.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Was I interrupting something?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;N-No, you\u0026apos;re not interrupting anything at all! We were just studying together, that\u0026apos;s it!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Studying?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIndeed, there were Sudou-kun\u0026apos;s glasses and the mechanical pencil in his hand. More importantly, both of them were still in their school uniforms.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs the student council president, there seemed to be no problems to point out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Well, y\u0026apos;see, about this special exam. They said we don\u0026apos;t gotta study yet, but it\u0026apos;d be bad if there was a written test, right? So I figured we should prepare, even just a little.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven though I hadn\u0026apos;t yet told them our plan for tomorrow, he\u0026apos;d already begun to prepare countermeasures. I doubt anyone could have predicted seeing him like this back when we first enrolled.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s admirable, but make sure you get Onodera-san back to her room safely before curfew, all right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;O-Obviously! So what do you want, showing up without any notice?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe tried to shoo Onodera-san toward the living room with his hand, but I stopped him. Since there was a guest, it would be faster to explain it to both of them at once.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;May I come in for just a moment? This is something I\u0026apos;d rather people from other classes not overhear.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah... of course you can.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI stepped into the entryway and closed the door.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen I beckoned Onodera-san, who was watching me with curiosity, over to the entryway.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The special exam that starts tomorrow. I can\u0026apos;t say for certain, but I have an idea about the kind of rules it might have.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI lowered my voice slightly and explained it to the two of them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Seriously? What kinda rules d\u0026apos;you think they are?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;When Chabashira-sensei announced the special exam, her attitude was colder than usual, wasn\u0026apos;t it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Kanji and the others were complaining about it, yeah. Sounded like they were trying to figure out why.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not that she was being cold because she couldn\u0026apos;t afford to be otherwise; I believe she was actually being curt on purpose.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? On purpose? What\u0026apos;s the point of doing that? She\u0026apos;ll just make people hate her, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I interpreted that attitude as the only hint the teacher could give us... I think she wanted to make us remember the time shortly after we enrolled.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You mean back in our first year, right? Yeah, she was pretty damn cold back when we enrolled.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSudou-kun glanced back to meet Onodera-san\u0026apos;s eyes, recalling the past, and they both nodded in understanding.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Do you remember the first special exam we took as first-year Class D?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hmm? The uninhabited island exam... wasn\u0026apos;t it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOnodera-san, who\u0026apos;d taken a few more steps forward to stand beside Sudou-kun, murmured as she tried to recall.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Your guess isn\u0026apos;t technically wrong, Onodera-san. However, right after we enrolled, we were put through a certain month-long test without any explanation of the rules\u0026#x2014;the root cause of all our struggles for the past two years.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs soon as I said that, Sudou-kun immediately remembered, and Onodera-san followed suit.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh, right. They were checkin\u0026apos; stuff like tardiness, absences, and our attitude in class. That\u0026apos;s how our Class Points went to zero, wasn\u0026apos;t it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA surprise from the school that gave the children who\u0026apos;d just become first-year high schoolers points equivalent to 100,000 yen every month. Repeated tardiness and private conversations. The teacher simply continued to watch over us quietly, without a word of warning.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eClass D, who enjoyed and reveled in it all without a single thought for what was behind it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe price for that was steep, and it led to the two years of hardship I just mentioned.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So it\u0026apos;s that exam again this time?... Come to think of it, she did say somethin\u0026apos; like, \u0026apos;show me you\u0026apos;ve grown.\u0026apos; Guess she meant for us not to make the same mistake again.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSudou-kun, who\u0026apos;d been properly listening to Chabashira-sensei\u0026apos;s words, picked up the pieces of her statement himself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s how I interpreted it. That\u0026apos;s why I thought it might be a special exam with the same rules.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That seems totally plausible. Actually, now that you mention it, it almost feels like that\u0026apos;s the only possibility.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOnodera-san heard my idea and I could tell from her expression that it clicked.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course, I can\u0026apos;t completely rule out the possibility of an exam with some kind of unrelated rules. But our classmates studied intensively for the last special exam, and a fair amount of frustration has built up. Continuing this way doesn\u0026apos;t guarantee we\u0026apos;ll get good results.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere couldn\u0026apos;t have been many students who could maintain such high motivation, like these two.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This whole \u0026apos;prepare for anything\u0026apos; approach, honestly, it\u0026apos;s not a good fit for our class.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s certainly easier just focusing on one thing.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course, it will be a gamble. If it\u0026apos;s announced on the day that it\u0026apos;s a written exam after all, our chances of winning might disappear. However...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t know what you think, Sudou-kun, but I\u0026apos;m on board with Horikita-san\u0026apos;s plan. Studying isn\u0026apos;t a bad thing, but you get less efficient if you overdo it. As a strategy for the class to win, I think a simple one is more effective and not a bad idea.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. I want to share this with the entire class today and have them lead a thoroughly disciplined life starting tomorrow. A single case of tardiness could be the difference between winning and losing.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAyanokouji-kun\u0026apos;s class and Ichinose-san\u0026apos;s class had many honor students to begin with.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey could maintain a high standard for their usual perfect attendance and general conduct without even trying.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA mistake on the first step meant we had absolutely no chance of winning.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then we gotta make damn sure no one finds out about this. If Kanji and his crew go blabbing to other classes, we\u0026apos;re screwed.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re absolutely right. Whether or not we can get a head start on the first day is a crucial factor.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, putting the other classes aside, there was no way Ayanokouji-kun couldn\u0026apos;t have figured out something of this level. Class C must have already factored this possibility into their plans. And that meant... just as Karuizawa-san feared, the information might be passed to and shared with Class D...\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Ayanokouji\u0026apos;s probably figured it out.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven without me voicing my thoughts, it seemed Sudou-kun had gotten the picture.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was proof that he now fully understood that Ayanokouji-kun was a formidable opponent.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even so, the other classes may not know. Will you cooperate?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah. I\u0026apos;ve even got an idea how to make those guys stick to the rules and keep their mouths shut.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe thumped his chest with his fist and puffed it out. He looked very dependable.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But just keeping Ike-kun and the others in line won\u0026apos;t be enough. Our class has one major obstacle.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;An obstacle?... Ah, I see. Is that why you came here, Horikita-san?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAn image of the problem child who never listened to anyone came to both Onodera-san\u0026apos;s and Sudou-kun\u0026apos;s minds.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;He isn\u0026apos;t a student who is normally late or absent without reason, but his classroom attitude and private life are highly problematic. If he alone were to drag us down, our class would have absolutely no chance of winning.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo win the special exam, getting his cooperation became our most important task.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But that\u0026apos;s impossible, ain\u0026apos;t it? Gettin\u0026apos; that guy to do what he\u0026apos;s told.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Simply asking him will likely be impossible. However, I have an idea. To that end, I am thinking of visiting Koenji-kun\u0026apos;s room, but I\u0026apos;ve never been there before. Therefore, I would like a classmate to accompany me, just in case.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Koenji\u0026apos;s room? Right now? Yeah, that does sound a little dicey. If that guy goes feral, even I wouldn\u0026apos;t be able to stop him easily. Nah, you made the right call not goin\u0026apos; alone.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat wasn\u0026apos;t the sort of thing I was worried about, but...\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t feel like pressing the issue, so I let it slide.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So, that\u0026apos;s the situation. Would you mind if I borrowed Sudou-kun for a bit? I believe I can have him back in ten or twenty minutes, at the earliest.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If that\u0026apos;s the case, be my guest. Well then, I\u0026apos;ll just hang around and wait.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSudou-kun readily agreed on the spot, and after he quickly put on his shoes, the two of us stepped out into the hallway.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 8\",\"volumeId\":\"y3v2\",\"chapterIndex\":26,\"prevChapter\":{\"volumeId\":\"y3v2\",\"chapter\":25,\"title\":\"Part 7\"},\"nextChapter\":{\"volumeId\":\"y3v2\",\"chapter\":27,\"title\":\"Part 9\"},\"toc\":[{\"label\":\"C
