e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T237a,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 5\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eQUITE SOME TIME had passed since Ayanokouji-kun transferred classes, but the wound in my heart hadn\u0026apos;t completely healed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe same must have been true for Karuizawa-san, whom I\u0026apos;d gone shopping with.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut we\u0026apos;d both become able to look forward and move on, more so than before.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI think I\u0026apos;d recovered enough to at least feign composure whenever I saw Ayanokouji-kun at school, at Keyaki Mall, or in the dorms.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKaruizawa-san had been the catalyst for my recovery, but another one was right in front of me\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;For a loser, your color\u0026apos;s looking a little better, Horikita.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It was just past 6:30 PM, and I had just returned from the supermarket. I heard a rough knock, and when I unlocked the door to my room,\u0026#xa0;Ibuki-san\u0026apos;s opening words were dripping with sarcasm.\u0026#xa0;It was hardly the attitude of someone about to come into another person\u0026apos;s room and be served a meal.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s thanks to your wonderful flying kick. I\u0026apos;m so very grateful.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn response to my sarcasm, Ibuki-san proudly puffed out her chest.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If it happens again, I\u0026apos;ll be sure to kick you then, too, so be grateful.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wondered if, in her head, she\u0026apos;d conveniently interpreted that as praise...\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe was making me regret ever having said that she\u0026apos;d helped, even a little, as a catalyst for my recovery.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo, more importantly, to prevent any future victims, it seemed better to explain that this was a real problem, rather than using sarcasm that wouldn\u0026apos;t get through to her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Kicking someone in the back from behind without warning is an extremely dangerous act, so don\u0026apos;t do that again. At the very least, you should never do it to anyone but me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was fortunate that I, the one who was kicked, had some knowledge of martial arts and that by chance the damage was kept to a minimum, but if the point of impact had been worse, I could\u0026apos;ve been seriously injured. I made sure to warn her firmly about that part.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, Ibuki-san didn\u0026apos;t take my words at face value and instead laughed mockingly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So it\u0026apos;s fine to do it to you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It is not fine. But I won\u0026apos;t be kicked by you again. After all, your prerequisite for kicking me was, \u0026apos;if it happens again,\u0026apos; wasn\u0026apos;t it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo think the precaution I\u0026apos;d taken would pay off so quickly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hmph. So you\u0026apos;re sayin\u0026apos; you\u0026apos;ve completely recovered, then.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I can say it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs if she found that completely unbelievable, Ibuki-san laughed as she kicked her shoes off messily and stepped inside. I picked up the disheveled shoes and rearranged them next to the two pairs that were already neatly lined up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOne pair belonged to me, the owner of this room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd the other pair\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What do you think, Kushida? About what Horikita just said.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIbuki-san called out, turning her gaze to the owner of the other pair of shoes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Unbelievable.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe answered instantly, without so much as a glance in my direction, her eyes fixed on her phone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s what she says.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Like you, she won\u0026apos;t readily agree with anything I say, so I pay it no mind.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI let out a soft sigh and moved from the entryway to the front of the kitchen.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen, while taking the groceries I bought at the Keyaki Mall supermarket out of my reusable bag, I turned back and called out to them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Just sit wherever and play on your phone like she is. I don\u0026apos;t mind if you watch TV, either.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t have to tell me twice.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIbuki-san plopped down in her usual spot and then glanced around the room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKushida-san, who was watching Ibuki-san out of the corner of her eye, muttered quietly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What\u0026apos;s with that look on your face? It\u0026apos;s disgusting.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? Whose face did you say is disgusting?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s only one other person nearby, so there\u0026apos;s no need to say a name, is there?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Could be Horikita. She\u0026apos;s got a gross face.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh, right. Yeah, that might be true. I guess that might\u0026apos;ve been misleading.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wondered if those two even realized whose room this was...\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But I was talking about you, Ibuki-san.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? What, what? Why are you trying to pick a fight all of a sudden? You want me to throw a pillow at you?\u0026quot; snapped the always-combative Ibuki-san.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s because you had this look on your face, like, \u0026apos;I\u0026apos;m so happy to be in Horikita-san\u0026apos;s room after so long~\u0026apos;.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Wha\u0026#x2014;? Wha\u0026#x2014;? I\u0026apos;m not happy! I just felt lucky I could get a free meal, that\u0026apos;s all.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Isn\u0026apos;t that what you call being happy?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Absolutely not!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eCasting a sideways glance at the living room, which had suddenly grown noisy with the addition of just one person, I began to cook with practiced hands. The ingredients I bought today cost twice my usual budget.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eStill, compared to when I had given up on cooking for myself for some time in favor of simple meals from convenience stores, the expense was low.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe noisy sound of their two voices, something I\u0026apos;d never found pleasant until just a little while ago.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut now, they reached my ears like strangely calming music.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA person\u0026apos;s state of mind changed drastically with just a small shift in their perspective and way of thinking.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven as I chopped the vegetables with a kitchen knife, I reflected once again on the situation I found myself in.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA little while ago, I told Ibuki-san a small lie.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy answer regarding my recovery. My assertion that I could say so with certainty.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was a clear lie.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI do believe I\u0026apos;d managed to crawl my way from the depths of despair to a much better place.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNevertheless, my wounded heart is far from fully healed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA lie told to prevent another victim of Ibuki-san\u0026apos;s kicks.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut the truth is, I wanted to lie to deceive myself into believing I was all right.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe reality that Ayanokouji-kun was gone was just that heavy\u0026#x2014;\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 5\",\"volumeId\":\"y3v2\",\"chapterIndex\":23,\"prevChapter\":{\"volumeId\":\"y3v2\",\"chapter\":22,\"title\":\"Part 4\"},\"nextChapter\":{\"volumeId\":\"y3v2\",\"chapter\":24,\"title\":\"Part 6\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 2\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Nanase Tsubasa's Monologue\",\"href\":\"monologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Fitting In\",\"href\":\"ch-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"ch-1-p-1.xhtml\",\"index\":12},{\"label\":\"Part 2\",\"href\":\"ch-1-p-2.xhtml\",\"index\":13},{\"label\":\"Part 3\",\"href\":\"ch-1-p-3.xhtml\",\"index\":14},{\"label\":\"Chapter 2: A Gentle Exam\",\"href\":\"ch-2.xhtml\",\"index\":15},{\"label\":\"Part 1\",\"href\":\"ch-2-p-1.xhtml\",\"index\":16},{\"label\":\"Part 2\",\"href\":\"ch-2-p-2.xhtml\",\"index\":17},{\"label\":\"Chapter 3: Getting to Know the Opponent\",\"href\":\"ch-3.xhtml\",\"index\":18},{\"label\":\"Part 1\",\"href\":\"ch-3-p-1.xhtml\",\"index\":19},{\"label\":\"Part 2\",\"href\":\"ch-3-p-2.xhtml\",\"index\":20},{\"label\":\"Part 3\",\"href\":\"ch-3-p-3.xhtml\",\"index\":21},{\"label\":\"Part 4\",\"href\":\"ch-3-p-4.xhtml\",\"index\":22},{\"label\":\"Part 5\",\"href\":\"ch-3-p-5.xhtml\",\"index\":23},{\"label\":\"Part 6\",\"href\":\"ch-3-p-6.xhtml\",\"index\":24},{\"label\":\"Part 7\",\"href\":\"ch-3-p-7.xhtml\",\"index\":25},{\"label\":\"Part 8\",\"href\":\"ch-3-p-8.xhtml\",\"index\":26},{\"label\":\"Part 9\",\"href\":\"ch-3-p-9.xhtml\",\"index\":27},{\"label\":\"Chapter 4: The Quest for Knowledge\",\"href\":\"ch-4.xhtml\",\"index\":28},{\"label\":\"Part 1\",\"href\":\"ch-4-p-1.xhtml\",\"index\":29},{\"label\":\"Part 2\",\"href\":\"ch-4-p-2.xhtml\",\"index\":30},{\"label\":\"Part 3\",\"href\":\"ch-4-p-3.xhtml\",\"index\":31},{\"label\":\"Part 4\",\"href\":\"ch-4-p-4.xhtml\",\"index\":32},{\"label\":\"Chapter 5: Yamamura's Courage\",\"href\":\"ch-5.xhtml\",\"index\":33},{\"label\":\"Part 1\",\"href\":\"ch-5-p-1.xhtml\",\"index\":34},{\"label\":\"Part 2\",\"href\":\"ch-5-p-2.xhtml\",\"index\":35},{\"label\":\"Part 3\",\"href\":\"ch-5-p-3.xhtml\",\"index\":36},{\"label\":\"Part 4\",\"href\":\"ch-5-p-4.xhtml\",\"index\":37},{\"label\":\"Part 5\",\"href\":\"ch-5-p-5.xhtml\",\"index\":38},{\"label\":\"Chapter 6: Fortune and Misfortune Are Intertwined\",\"href\":\"ch-6.xhtml\",\"index\":39},{\"label\":\"Part 1\",\"href\":\"ch-6-p-1.xhtml\",\"index\":40},{\"label\":\"Part 2\",\"href\":\"ch-6-p-2.xhtml\",\"index\":41},{\"label\":\"Part 3\",\"href\":\"ch-6-p-3.xhtml\",\"index\":42},{\"label\":\"Chapter 7: The Observer\",\"href\":\"ch-7.xhtml\",\"index\":43},{\"label\":\"Part 1\",\"href\":\"ch-7-p-1.xhtml\",\"index\":44},{\"label\":\"Part 2\",\"href\":\"ch-7-p-2.xhtml\",\"index\":45},{\"label\":\"Part 3\",\"href\":\"ch-7-p-3.xhtml\",\"index\":46},{\"label\":\"Epilogue: Another Story Begins\",\"href\":\"epilogue.xhtml\",\"index\":47},{\"label\":\"Part 1\",\"href\":\"epilogue-p-1.xhtml\",\"index\":48},{\"label\":\"Part 2\",\"href\":\"epilogue-p-2.xhtml\",\"index\":49},{\"label\":\"Author's Afterword\",\"href\":\"authors-afterword.xhtml\",\"index\":50}],\"volumeTitle\":\"Light Novel 3rd Year Volume 2\",\"detailsLink\":\"/select/year-3/y3v2\",\"returnLink\":\"/select\",\"currentSpineIndex\":23,\"nextVolumeLink\":\"/select/year-3/y3v3\",\"nextVolumeTitle\":\"Light Novel 3rd Year Volume 3\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-sca
