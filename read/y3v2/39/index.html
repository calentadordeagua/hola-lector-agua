e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T4a60,"])</script><script>self.__next_f.push([1,"\u003ch1 class=\"heading_1\"\u003e\u003ca class=\"heading-link\" href=\"/read/y3v2/2\"\u003eChapter 6:\u003cbr/\u003eFortune and Misfortune Are Intertwined\u003c/a\u003e\u003c/h1\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTHE DAY STEADILY drew to a close and before I knew it, school was over. It was almost the end of the fifth day since the exam was announced, but not a single major change had occurred. As far as my brief investigation showed, every class maintained a perfect record of no tardiness or absences and the student body was leading a quiet, more serious school life than usual. I also heard no rumors of any trouble over the weekend, a time when things tended to get lax. It seemed the students hadn\u0026apos;t forgotten to maintain a sense of tension.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs was evident from their diligence in their studies and sports, their avoidance of tardiness and absences, and their strict adherence to order and politeness, all four classes were acting with the consideration that their daily conduct would be key to the exam. It seemed Ryuuen\u0026apos;s class hadn\u0026apos;t been able to grasp that on the first day, but Kondou and the others\u0026apos; actions, while probing, had clearly taken daily conduct into account from the very beginning. I didn\u0026apos;t know which student in Ryuuen\u0026apos;s class proposed the idea, but in that class, the leader\u0026apos;s decision was everything.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe fact that he adopted it meant that, at the very least, Ryuuen himself came to the same conclusion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eThwip, thwip-thwip!\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as I was about to get up from my seat, a sharp pain shot through the back of my neck again and again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ow, ow, that hurts. What the...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTurning around in response to the unfamiliar sensation, I saw Morishita holding what looked like... a gun, made from disposable chopsticks.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;To think you\u0026apos;re still alive. You\u0026apos;re quite something.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Never mind \u0026apos;quite something\u0026apos;... What is that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It is a gun. A gun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eThwip!\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile I was turned around, she fired a rubber band into the palm of my hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe gun was formed from multiple layers of rubber bands wrapped around disposable chopsticks and it seemed to be designed so that pulling the part that resembled a trigger would launch a rubber band.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That hurts, you know?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s because I\u0026apos;m shooting you with the intent to cause pain.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why\u0026apos;d I have to be the one in pain...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eStill, it was well made... It wasn\u0026apos;t just haphazardly assembled into the shape of a gun; it was designed to shoot rubber bands.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;When\u0026apos;d you make something like that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s a secret weapon I diligently crafted during break time. It\u0026apos;s a wonderfully lethal weapon, capable of slipping past even the metal detector gates.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI decided to consider it a small mercy that she hadn\u0026apos;t been working on it during class.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Let\u0026apos;s take a drive to the ends of hell together. \u003cem\u003eBang.\u003c/em\u003e\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I absolutely don\u0026apos;t want to do that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs we were having this pointless exchange, Satonaka\u0026#xa0;approached us hesitantly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Do you have a moment?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah. What\u0026apos;s up?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile surprised to be addressed by someone so unexpected, part of me thought it would be funny if Morishita shot Satonaka with a rubber band.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I glanced over at Morishita, at some point she\u0026apos;d put the gun on her desk and was staring out the window, looking bored. Apparently, I was the only one she wanted to take a drive with to the ends of hell.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I was wondering if you\u0026apos;d like to hang out with our group this Sunday.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs he said that, Satonaka looked back and a group of a few boys and girls waved in our direction.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere were three of them in total: Yanagibashi and Tsukasaki, with whom I\u0026apos;d had almost no interaction, and a girl named Hoashi.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I won\u0026apos;t force you, but what do you think?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t have any particular plans, so if you guys don\u0026apos;t mind, I\u0026apos;d like to join.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I answered, Satonaka smiled happily. I wondered if the reason I felt inexplicably happy just seeing that was because of his handsome features, which even a guy could admire.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you\u0026apos;d like, how about you, Morishita-san?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll pass.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWithout so much as a glance at Satonaka, she gave her blunt refusal while continuing to stare out the window.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter that, Satonaka said he\u0026apos;d message me the details later and went back to his group.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why\u0026apos;d you refuse?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;For no reason other than I\u0026apos;m simply not interested.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt some point, she shifted her gaze from the window back to me and was now unabashedly gripping the gun in her right hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t tell me, Morishita, you have feelings for Satonaka\u0026#x2014;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eThwip!\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA rubber band shot mercilessly into my left cheek.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Too bad for you, Ayanokouji Kiyotaka. Did you think you would get to see me blush and become flustered?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The thought crossed my mind, but it seems I was wrong... Besides, that hurt, and it\u0026apos;s dangerous.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m simply not interested in him. Besides, faces that are too androgynous\u0026#xa0;are not to my liking. A face as hideously distorted as yours, Ayanokouji Kiyotaka, is better\u0026#x2014;at least it warrants pity. Are you happy to know that I\u0026apos;m fond of you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s no doubt that sadness far outweighs happiness. Sorry, but I\u0026apos;m heading home.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI hurried out into the hallway, escaping from Morishita, who kept firing rubber bands at me and asking if I was running away.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI took out my phone and checked the message from Ichinose one more time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e[\u0026apos;It looks like Hoshinomiya-sensei wants to see you, Ayanokouji-kun...\u0026apos;]\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter receiving that message, I headed for the special building she\u0026apos;d designated.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt the time, just after school let out, that special building was always quiet.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTwo years ago, there\u0026apos;d been an incident in that very place where Sudou fell into Ryuuen\u0026apos;s trap in a security camera blind spot, but since then, more cameras were installed there.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith the exception of spaces where privacy was a consideration, such as the changing rooms and restrooms, it could be said that most of the school was now covered by them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile a small number of students felt suffocated by the extensive surveillance, the majority likely welcomed it as a means of protecting themselves.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI arrived at the promised location, but Hoshinomiya-sensei was still nowhere in sight.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSo, I decided to kill some time by gazing out the window.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eConsidering I had to go see Hiyori, I didn\u0026apos;t want to linger for too long today. The figures of students heading home or off to their club activities began to trickle into view.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2014;Club activities, huh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the end, I never joined one, but my mindset changed enough that I thought if I could start over as a first-year, it might be good to try joining one.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEnough that if someone were to ask if I was satisfied with my student life, I could give a hesitant nod.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI averted my gaze from the window and looked down the hall.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNot long after, I heard the sound of high-pitched footsteps echoing all around.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs she came into view, our eyes met, and she approached with a light wave of her hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sorry for the wait, Ayanokouji-kun. Did you need something from me, calling me out to a place like this?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re the one who called me here, aren\u0026apos;t you, Sensei?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Whaaat are you talking about~? A teacher would never call a student out to a place like this, you know. I only came because Ichinose-san told me \u003cem\u003eyou \u003c/em\u003ewanted to see \u003cem\u003eme\u003c/em\u003e, Ayanokouji-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was in the exact same situation, but I figured it wasn\u0026apos;t even worth asking her about it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHoshinomiya-sensei\u0026apos;s eyes were clearly smiling.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I was trying to figure out her true intentions, she closed the distance even further, pressing herself against my body.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What do you think you\u0026apos;re doing?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What am I doing? Whatever do you mean~?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe played dumb, refusing to answer my question and instead brought herself closer as if to whisper.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd then, without so much as asking for my permission, she entwined her slender arm with mine.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I need you to do your best this year, Ayanokouji-kun, so it\u0026apos;s fine if I give you a little bit of service, right? Just like this.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo call such a blatant act \u0026apos;service\u0026apos; was just like her, but for a teacher, it could only be called unbecoming conduct.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat said, I had no intention of lecturing her about it here, nor did I intend to forcibly shake off her slender arm. Either way, the important thing was not to take any action myself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You leave no openings, do you, Hoshinomiya-sensei.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI stopped her objective, not with action, but with conversation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Eh? What\u0026apos;s that supposed to mean, \u0026apos;leave no openings\u0026apos;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I already had my predictions about the upcoming special exam, but your advances just now have confirmed them. What the school will judge over the course of one week is our \u0026apos;attitude in our daily school life.\u0026apos; The number of tardies and absences, our general conduct. The factors that usually only cause minor monthly fluctuations will be the main evaluation criteria. The school hallways are lined with countless security cameras, so they can easily assess the students by checking the recordings later. If they see me in close contact with a teacher of the opposite sex, it will inevitably affect my assessment.\u0026quot;\u003c/p\u003e\u003cimg src=\"/hola-lector-agua/images/books/y3v2/OEBPS/KGZwaOHTXhjgYMWagqXwo.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA little while ago, Hoshinomiya-sensei had been on the verge of running wild, determined to win even if it meant using her authority as a teacher to ensure her class\u0026apos;s victory. To prevent that, I told her the details of my alliance with Ichinose and the arrangements that came with it, so she was now somewhat under control. However, what she truly desired was to return to the upper classes as soon as possible and to see Chabashira-sensei\u0026apos;s class fall.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ayanokouji-kun, you\u0026apos;re being a little too suspicious. We\u0026apos;re in this together, aren\u0026apos;t we? So there\u0026apos;s no way I\u0026apos;d do anything to drag you down, right? Besides, we don\u0026apos;t even know if you\u0026apos;re right about the exam.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course, I don\u0026apos;t have any concrete proof. It\u0026apos;s just a feeling I have. But please, rest assured. Even if you were to intentionally act in a way that lowers my evaluation, Hoshinomiya-sensei, it won\u0026apos;t affect our alliance.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I continued to speak in a calm, business-like tone, Hoshinomiya-sensei\u0026apos;s smile deepened, perhaps because she understood.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh, that\u0026apos;s a relief. Well then, does this mean you\u0026apos;ll let my class have the win this time? You\u0026apos;ll let the class with fewer Class Points have the glory, won\u0026apos;t you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That would be the case if I could completely control the outcome. However, this is a competition between all four classes. If our class receives a negative assessment, we risk placing last. And there\u0026apos;s no guarantee that Ichinose\u0026apos;s class will be able to take first place.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But come on, that\u0026apos;s where you get to show off your skills, isn\u0026apos;t it, Ayanokouji-kun? You just have to arrange things so my class takes first and your class takes second.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Unfortunately, I have no intention of intervening to make adjustments.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...But why? Are you just going to ignore the risk of Class A and Class B winning?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Frankly, for this particular exam, I don\u0026apos;t believe that will be an issue.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even if we get them, it\u0026apos;s a mere fifty Class Points. Are you saying they\u0026apos;re not even worth bothering with? That\u0026apos;s\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s incorrect. It\u0026apos;s because I\u0026apos;ve judged that this isn\u0026apos;t an exam that warrants demonstrating the true value of our alliance. To begin with, isn\u0026apos;t it also necessary to believe in your own class?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor the past two years, the school saw Ichinose\u0026apos;s class as being just as disciplined as Sakayanagi\u0026apos;s, if not more so. However, unable to endure their current circumstances of having fallen to Class D, Hoshinomiya-sensei was always trying to forcibly change the situation by using every trick in the book.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, it would\u0026apos;ve been understandable if she were acting out of sheer desperation, but in a case like this, her actions could\u0026apos;ve ended up nullifying her class\u0026apos;s greatest strength.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Remember to watch over them. That\u0026apos;s something even Chabashira-sensei is capable of.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hk...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI finally brought up the name of her contemporary rival, Chabashira-sensei.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe moment I did, Hoshinomiya-sensei\u0026apos;s demeanor changed in an instant.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHoshinomiya-sensei stopped, and her arm slipped smoothly away from me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I can trust you, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe meaning behind those words was simple. It included the threat that if betrayed, she would go on a rampage at any time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Please consider our alliance from a long-term perspective, not a short-term one. That\u0026apos;s all I can say for now.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see. Well, you certainly did come through for me during the last special exam, so I suppose I\u0026apos;ll just wait and see for now.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a good thing that Hoshinomiya-sensei was wary and hadn\u0026apos;t let her guard down.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut in truth, it was also a fact that we didn\u0026apos;t need to force a win in this exam. If our daily conduct was indeed being assessed, intervening carelessly to control it would be a troublesome and high-risk endeavor. For my class and Ichinose\u0026apos;s, which had very few behavioral issues to begin with, employing unnecessary measures would only increase the danger. The best strategy was to let them act as they usually did.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 6: Fortune and Misfortune Are Intertwined\",\"volumeId\":\"y3v2\",\"chapterIndex\":39,\"prevChapter\":{\"volumeId\":\"y3v2\",\"chapter\":38,\"title\":\"Part 5\"},\"nextChapter\":{\"volumeId\":\"y3v2\",\"chapter\":40,\"title\":\"Part 1\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 2\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Nanase Tsubasa's Monologue\",\"href\":\"monologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Fitting In\",\"href\":\"ch-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"ch-1-p-1.xhtml\",\"index\":12},{\"label\":\"Part 2\",\"href\":\"ch-1-p-2.xhtml\",\"index\":13},{\"label\":\"Part 3\",\"href\":\"ch-1-p-3.xhtml\",\"index\":14},{\"label\":\"Chapter 2: A Gentle Exam\",\"href\":\"ch-2.xhtml\",\"index\":15},{\"label\":\"Part 1\",\"href\":\"ch-2-p-1.xhtml\",\"index\":16},{\"label\":\"Part 2\",\"href\":\"ch-2-p-2.xhtml\",\"index\":17},{\"label\":\"Chapter 3: Getting to Know the Opponent\",\"href\":\"ch-3.xhtml\",\"index\":18},{\"label\":\"Part 1\",\"href\":\"ch-3-p-1.xhtml\",\"index\":19},{\"label\":\"Part 2\",\"href\":\"ch-3-p-2.xhtml\",\"index\":20},{\"label\":\"Part 3\",\"href\":\"ch-3-p-3.xhtml\",\"index\":21},{\"label\":\"Part 4\",\"href\":\"ch-3-p-4.xhtml\",\"index\":22},{\"label\":\"Part 5\",\"href\":\"ch-3-p-5.xhtml\",\"index\":23},{\"label\":\"Part 6\",\"href\":\"ch-3-p-6.xhtml\",\"index\":24},{\"label\":\"Part 7\",\"href\":\"ch-3-p-7.xhtml\",\"index\":25},{\"label\":\"Part 8\",\"href\":\"ch-3-p-8.xhtml\",\"index\":26},{\"label\":\"Part 9\",\"href\":\"ch-3-p-9.xhtml\",\"index\":27},{\"label\":\"Chapter 4: The Quest for Knowledge\",\"href\":\"ch-4.xhtml\",\"index\":28},{\"label\":\"Part 1\",\"href\":\"ch-4-p-1.xhtml\",\"index\":29},{\"label\":\"Part 2\",\"href\":\"ch-4-p-2.xhtml\",\"index\":30},{\"label\":\"Part 3\",\"href\":\"ch-4-p-3.xhtml\",\"index\":31},{\"label\":\"Part 4\",\"href\":\"ch-4-p-4.xhtml\",\"index\":32},{\"label\":\"Chapter 5: Yamamura's Courage\",\"href\":\"ch-5.xhtml\",\"index\":33},{\"label\":\"Part 1\",\"href\":\"ch-5-p-1.xhtml\",\"index\":34},{\"label\":\"Part 2\",\"href\":\"ch-5-p-2.xhtml\",\"index\":35},{\"label\":\"Part 3\",\"href\":\"ch-5-p-3.xhtml\",\"index\":36},{\"label\":\"Part 4\",\"href\":\"ch-5-p-4.xhtml\",\"index\":37},{\"label\":\"Part 5\",\"href\":\"ch-5-p-5.xhtml\",\"index\":38},{\"label\":\"Chapter 6: Fortune and Misfortune Are Intertwined\",\"href\":\"ch-6.xhtml\",\"index\":39},{\"label\":\"Part 1\",\"href\":\"ch-6-p-1.xhtml\",\"index\":40},{\"label\":\"Part 2\",\"href\":\"ch-6-p-2.xhtml\",\"index\":41},{\"label\":\"Part 3\",\"href\":\"ch-6-p-3.xhtml\",\"index\":42},{\"label\":\"Chapter 7: The Observer\",\"href\":\"ch-7.xhtml\",\"index\":43},{\"label\":\"Part 1\",\"href\":\"ch-7-p-1.xhtml\",\"index\":44},{\"label\":\"Part 2\",\"href\":\"ch-7-p-2.xhtml\",\"index\":45},{\"label\":\"Part 3\",\"href\":\"ch-7-p-3.xhtml\",\"index\":46},{\"label\":\"Epilogue: Another Story Begins\",\"href\":\"epilogue.xhtml\",\"index\":47},{\"label\":\"Part 1\",\"href\":\"epilogue-p-1.xhtml\",\"index\":48},{\"label\":\"Part 2\",\"href\":\"epilogue-p-2.xhtml\",\"index\":49},{\"label\":\"Author's Afterword\",\"href\":\"authors-afterword.xhtml\",\"index\":50}],\"volumeTitle\":\"Light Novel 3rd Year Volume 2\",\"detailsLink\":\"/select/year-3/y3v2\",\"returnLink\":\"/select\",\"currentSpineIndex\":39,\"nextVolumeLink\":\"/select/year-3/y3v3\",\"nextVolumeTitle\":\"Light Novel 3rd Year Volume 3\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__
