e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T1eda,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 1\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWE ARRIVED AT Keyaki Mall. Continuing our conversation, we strolled idly through the mall. It was just as I was thinking of suggesting we get lunch in a little while.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Actually, there\u0026apos;s one more reason I called you here. And I was lucky enough to find her.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? Whaddya mean?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo the head-tilting Karuizawa-san, I simply directed my gaze in that direction and had her follow.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Amasawa-san?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe muttered the name upon spotting the back of a lone student with red twin-tails walking ahead of us.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Amasawa Ichika-san has a connection to Ayanokouji-kun\u0026apos;s past. That\u0026apos;s why I\u0026apos;m investigating her right now.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ahh... So that\u0026apos;s how it is.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNext to me, Karuizawa-san showed no surprise, but rather a look of understanding.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Did you perhaps know about their relationship?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Nah, not at all. But I\u0026apos;ve seen Ayanokouji-kun and Amasawa-san talking a little bit. I kinda had a feeling it wasn\u0026apos;t just some simple senpai-and-kouhai relationship they made at this school.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt didn\u0026apos;t seem like there was a difference in the information we had, but her opinion was reassuring.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe fact that we sensed the same thing gave me encouragement to continue with the tedious investigation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are we gonna tail her now? Hey, should we?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...You seem awfully excited about this.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t mind doing spy-like stuff. I mean, is there anyone who actually dislikes it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWell, if I thought of it as an extension of a game, perhaps it wouldn\u0026apos;t be so bad...\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOur target likely had a connection to Ayanokouji-kun and moreover, she was considerably skilled.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKnowing that there was a high probability of losing our only lead if we failed, I found it impossible to enjoy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;For now, I\u0026apos;ll tell you what I\u0026apos;ve gleaned from observing Amasawa-san lately.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was something I\u0026apos;d noticed from watching Amasawa-san after school over the past few days.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe usually acted alone most of the time, and I never saw her spending time with classmates or friends. Of course, she would respond with a smile if spoken to by anyone, boy or girl, but she would immediately return to being alone and would never join the group that had approached her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt appeared to be her stance not to form any particularly close relationships.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat preference for solitude seemed somewhat similar to Ayanokouji-kun\u0026apos;s, but perhaps that was a stretch. In his case, it wasn\u0026apos;t that he didn\u0026apos;t make friends; if anything, he was the type who couldn\u0026apos;t, even if he wanted to.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That was an act... No, it couldn\u0026apos;t have been, could it? Surely not.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t think that was an act. That similarity seems like another thing they have in common.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSetting aside how pathetic it was that I hadn\u0026apos;t known that about him, his way of interacting with people really wasn\u0026apos;t very skillful. That was probably his true self.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTime passed as we continued to follow Amasawa-san\u0026apos;s back from a distance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIdeally, I should\u0026apos;ve spoken with her directly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut the world wasn\u0026apos;t so kind that she would talk honestly just like that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnother person, this time a male student, called out to Amasawa-san.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey only spoke for about five seconds and it appeared to be little more than a greeting.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven so, I made a point to remember every student who was on speaking terms with her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eGathering information indirectly was the only thing I could do at the moment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as I was memorizing his face, the phone I held in my right hand vibrated.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What\u0026apos;s up?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hold on.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e[\u0026apos;I\u0026apos;m waiting in the Student Council room.\u0026apos;]\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI took out my phone, looked at the text on the screen and tilted my head in my mind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Who could this be?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSuch a short message, from an unregistered contact.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was no date or time specified, but did that mean right now...?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf my two o\u0026apos;clock appointment today had been moved up, it wouldn\u0026apos;t have been strange to get word from Nanase-san. Was this something else, then? Even as I was lost in thought, Amasawa-san continued to walk through Keyaki Mall.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThough I knew I had to follow her, I blanked my phone\u0026apos;s screen and closed my eyes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I suppose it can\u0026apos;t be helped...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs long as I\u0026apos;d been entrusted with the position of student council president, I couldn\u0026apos;t just act on personal feelings alone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf someone was waiting in the student council room, I had a duty to respond as best as I could.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOr, even if there was a 99% chance it wasn\u0026apos;t, it might have been from Ayanokouji-kun.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs a realistic possibility, it might also have been part of the next special exam.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m sorry. I know it\u0026apos;s sudden, but I have to go to the student council.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI apologized for having to cut things short before we could even have lunch, despite being the one who invited her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t worry about it at all. And hey, I won\u0026apos;t go tailing Amasawa-san on my own, so don\u0026apos;t you worry.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRealizing on her own what I was about to warn her against, Karuizawa-san replied accordingly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI apologized to her one more time and then decided to head for school.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 1\",\"volumeId\":\"y3v2\",\"chapterIndex\":48,\"prevChapter\":{\"volumeId\":\"y3v2\",\"chapter\":47,\"title\":\"Epilogue: Another Story Begins\"},\"nextChapter\":{\"volumeId\":\"y3v2\",\"chapter\":49,\"title\":\"Part 2\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 2\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Nanase Tsubasa's Monologue\",\"href\":\"monologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Fitting In\",\"href\":\"ch-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"ch-1-p-1.xhtml\",\"index\":12},{\"label\":\"Part 2\",\"href\":\"ch-1-p-2.xhtml\",\"index\":13},{\"label\":\"Part 3\",\"href\":\"ch-1-p-3.xhtml\",\"index\":14},{\"label\":\"Chapter 2: A Gentle Exam\",\"href\":\"ch-2.xhtml\",\"index\":15},{\"label\":\"Part 1\",\"href\":\"ch-2-p-1.xhtml\",\"index\":16},{\"label\":\"Part 2\",\"href\":\"ch-2-p-2.xhtml\",\"index\":17},{\"label\":\"Chapter 3: Getting to Know the Opponent\",\"href\":\"ch-3.xhtml\",\"index\":18},{\"label\":\"Part 1\",\"href\":\"ch-3-p-1.xhtml\",\"index\":19},{\"label\":\"Part 2\",\"href\":\"ch-3-p-2.
