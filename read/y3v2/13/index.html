e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T46d4,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 2\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI THOUGHT WE\u0026apos;D part ways after they finished picking out their reference books, but surprisingly, at Shimazaki\u0026apos;s suggestion, we ended up stopping by a rest area.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps neither of us wanted to leave the somewhat heavy atmosphere hanging between us.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI found myself naturally thinking and interpreting it that way, which was likely proof of my own growing understanding of emotions.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe atmosphere of a place was a difficult thing that could not be physically proven.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, one\u0026apos;s perception of it changed distinctly depending on whether or not one could sense the expressions and tension of those in that space.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn other words, the atmosphere existed for each individual, filtered through their own perspective.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere must have been many times I\u0026apos;d failed to notice and overlooked the atmosphere of a place back when I first enrolled.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven when I felt I understood, it was only ever on the surface. There must have been many times when I was uncertain.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was how little knowledge and experience I had with this thing called \u0026apos;emotion.\u0026apos;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut now, things were a little different.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was becoming able to clearly feel the emotions of others, as if by instinct.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd unconsciously, at that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter placing the books they purchased on a bench, Shimazaki started walking toward the vending machines.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What do you want? It\u0026apos;s to thank you for helping me pick out the reference books. Let me treat you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHis voice came from over his shoulder as he stood with his back to me, looking at the vending machines.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you sure?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course. Besides, from the looks of it back in the bookstore, you\u0026apos;re trying to save money, right? I know you used your Private Points to transfer classes.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince he\u0026apos;d made such a generous offer, I decided to accept it without reservation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You gonna treat me, too?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re paying for your own.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Stingy...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter muttering that under his breath, Yoshida stood in front of the vending machine next to Shimazaki\u0026apos;s with a look of resignation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I actually wanted to treat you to the caf\u0026#xe9;, but it\u0026apos;s too crowded right now.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps because of the rain, students with time on their hands on a day off were flocking to the caf\u0026#xe9;, forming a line. When we\u0026apos;d passed by earlier, a large crowd was already waiting to get in.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn that sense, this was probably a better place to talk, at least for today.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was handed the can of black coffee he bought for me from the vending machine, and I opened it with a \u003cem\u003epssh\u003c/em\u003e. I fiddled with the pull tab for a moment before quietly pushing it in. A faint, aromatic scent rose from the slightly warped aluminum opening.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Black coffee, huh? You\u0026apos;ve got good taste.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShimazaki, who said that, also had the same canned coffee.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You like it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;To be honest, it\u0026apos;s not really my favorite, but it\u0026apos;s perfect for when I need to focus. It\u0026apos;s a powerful stimulant.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed he was more interested in the effects of drinking black coffee than the taste.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMeanwhile, Yoshida was still groaning in front of the vending machine, apparently undecided on what to buy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re taking your sweet time. If you don\u0026apos;t want anything, you don\u0026apos;t have to force it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShimazaki jabbed, looking at Yoshida\u0026apos;s back as his fingers hovered before the buttons.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, like... I\u0026apos;m definitely thirsty. But I don\u0026apos;t wanna drink \u003cem\u003ethat\u003c/em\u003e\u0026#xa0;much. So, like, in times like that, don\u0026apos;t you have trouble choosing between this one and that one?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYoshida smoothly slid one step to the side of the vending machine, and turning to us, pointed alternately at two products. One was a 500 ml tea, and the other was a 280 ml tea; they were the exact same product other than the size.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The 280 ml is enough, but the price difference is only 20 points, ya know? So I really wrack my brain trying to figure out the right choice.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t limited to drinks; the same could be said for many products on sale. Even with snacks, buying the large bag was cheaper and gave you more, but it lacked the convenience of the smaller, individually wrapped packages.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;d normally go for cost-performance. If it\u0026apos;s only a 20-point difference, just buy the 500 ml one without thinking.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShimazaki answered instantly. He probably always did so himself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah, I guess... But I often end up not being able to finish it all. Still, you\u0026apos;re right, considering the cost-performance is probably\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;d go with the 280 ml one. If you\u0026apos;re not confident you can finish it from the start, the taste will degrade over time even if you take it home. Even if tea has antibacterial properties, once you open the bottle and drink from it, bacteria from your mouth will get in. You can\u0026apos;t ignore the hygiene aspect, either.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ugh...! Y-Yeah, that\u0026apos;s true... That happens too, so...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI thought my comment might have been unnecessary, but after I gave him my take on it, Yoshida began to waver again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd in the end, the choice Yoshida made was to press both buttons at the same time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe 500 ml one came out. The look on Yoshida\u0026apos;s face as he clutched the plastic bottle wasn\u0026apos;t one of satisfaction, but more of a self-questioning: \u003cem\u003eWas this the right one?\u003c/em\u003e\u0026#xa0;But he probably would\u0026apos;ve had the same expression even if the 280 ml one came out instead.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as Yoshida, who bought his drink after so much hesitation, had finished about a third of his tea on the spot, I noticed him looking restlessly at Shimazaki.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe likely wanted to continue the conversation from the bookstore but couldn\u0026apos;t bring himself to start it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Shimazaki. About that \u0026apos;100-man slayer\u0026apos; story\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI decided I should be the one to bring it up, so I asked him directly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYoshida immediately came closer and sat down next to Shimazaki.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You don\u0026apos;t actually believe a rumor like that, do you, Ayanokouji?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;When I first heard it from Nishikawa, I took it at face value, but listening to the story up to this point, parts of it started to feel unnatural. Even if she was in a different class, with a nickname like that, it wouldn\u0026apos;t be strange to have heard of it, yet I\u0026apos;d never heard a single rumor about Shiraishi.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is that... so? It\u0026apos;s true you didn\u0026apos;t seem to know...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, it could\u0026apos;ve just been that I was ignorant and uninterested in such things, but I\u0026apos;d never even heard Shiraishi\u0026apos;s name from another student, let alone her nickname.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But, even if everything Shimazaki\u0026apos;s saying is true, why would she do something so half-assed?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe idea that it was a pretext to keep the opposite sex away likely already occurred to Yoshida.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile a certain number of people would surely be repulsed by an extensive romantic history, it wasn\u0026apos;t a foolproof method, as evidenced by how Yoshida, sitting beside us, hadn\u0026apos;t lost his affection for Shiraishi even after hearing the rumor. Furthermore, the fact that they hadn\u0026apos;t forced the rumor to spread to other classes or grades also created a strange sense of incongruity.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This is just my speculation, but... I think Nishikawa has special feelings for Shiraishi. I figure that\u0026apos;s what started the rumor. Don\u0026apos;t you think she figured that a rumor about being a \u0026apos;100-man slayer\u0026apos; would be convenient for keeping boys away? Sure, there are more than a few guys who\u0026apos;d hear a rumor like that and be happy, thinking she\u0026apos;s an easy woman, but it\u0026apos;s more likely to make her an object of disgust, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShimazaki shared his thoughts as a possible answer to the questions floating in our minds.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYoshida made an awkward face for a moment, but I didn\u0026apos;t do something so tactless as to point it out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...What\u0026apos;re you talking about? Nishikawa\u0026apos;s a girl.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This isn\u0026apos;t an age where romance is limited by gender.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, yeah, maybe that\u0026apos;s true... but even so, there\u0026apos;s no upside for Shiraishi, is there?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is that really the case? Since Shiraishi has no interest in dating boys right now, she might have understood Nishikawa\u0026apos;s intentions and gone along with the proposal to keep them away.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter finishing his canned coffee to the last drop, Shimazaki nodded.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t something I could be certain of yet, but it seemed like a possibility worth considering.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But still, isn\u0026apos;t that going too far? Just to avoid dating guys, wouldn\u0026apos;t it be tough for everyone to think you\u0026apos;re an easy woman?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I think so, too. In which case, another hypothesis comes to mind, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShimazaki continued, speaking to Yoshida, who hadn\u0026apos;t yet formed the hypothesis himself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Shiraishi was never interested in boys to begin with. Just like Nishikawa, she\u0026apos;s interested in the same sex, and that\u0026apos;s precisely why she could make the choice not to be bothered by a rumor that would make her disliked by the opposite sex.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Wha\u0026#x2014; S-Seriously...!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo appropriately keep boys away, and to accept affection from girls.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis was perhaps the idea to achieve both.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhether Nishikawa knew of Shiraishi\u0026apos;s preferences was currently unknown, but the possibility couldn\u0026apos;t be dismissed as zero.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShimazaki\u0026apos;s slip of the tongue\u0026#x2014;\u0026quot;I\u0026apos;ve been watching Shiraishi since right after we enrolled, so I\u0026apos;m not mistaken\u0026quot;\u0026#x2014;also didn\u0026apos;t seem to be a complete exaggeration.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut at the same time, the flaws were also conspicuous. I\u0026apos;d heard this \u0026apos;100-man slayer\u0026apos; rumor from Nishikawa\u0026apos;s mouth; I hadn\u0026apos;t been told about the nickname from Shiraishi herself. That said, it was unlikely the rumor was spreading without her knowledge. As long as it was being whispered about in class, it should\u0026apos;ve reached her ears sooner or later. Since the first-year uninhabited island exam, it was almost a 100% probability.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd even if Shiraishi liked other girls, the rumor, while serving to keep boys away, also carried the risk of other girls keeping their distance. If the primary assumption was that Shiraishi liked boys, then other girls wouldn\u0026apos;t approach her so casually either.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Like I said earlier, this is all speculation. There\u0026apos;s no guarantee that anything is correct, apart from the lie about the \u0026apos;100-man slayer\u0026apos;\u0026#x2014;no, even that included. I\u0026apos;m just drawing my own conclusions from what I\u0026apos;ve seen. If you can\u0026apos;t believe me, you can check for yourself.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHaving finished speaking, Shimazaki took a breath, perhaps because his excitement had calmed down a bit.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe stood up, threw his coffee can into the trash, and came back.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So, why are you even telling us all this in so much detail?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You want to know why?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well... I kinda want to know, but I kinda don\u0026apos;t...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Relax, Yoshida. I was planning on answering even if you didn\u0026apos;t ask.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith that, Shimazaki stood not in front of Yoshida\u0026#x2014;but in front of me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This reference book was a big help. But there\u0026apos;s still a lot more I want you to teach me. I figure if I lend a hand here, maybe you\u0026apos;ll spill your secrets someday, Ayanokouji.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eApparently, what was important to Shimazaki was neither Shiraishi\u0026apos;s situation nor Yoshida\u0026apos;s true feelings.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMore than any of that, it seemed he wanted to prioritize studying efficiently for now.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s also fine if you just told me now, you know?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sorry, but I haven\u0026apos;t done anything special besides what I\u0026apos;ve already told you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I gave the same response again, Shimazaki let out a sigh.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026apos;Searching online and watching videos,\u0026apos; was it? I\u0026apos;m sorry, but such a mundane method doesn\u0026apos;t explain a perfect score.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I told you that chance was a big factor. In any case, I just like to look up extraneous things. I have a habit of looking up what students learn in their third year of high school, or what they learn in university. In the process, I just happened to learn how to solve a problem that appeared on the exam.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I rattled off my excuses, Shimazaki pressed his lips together firmly, but as if he realized how his own attitude appeared, he immediately relaxed and exhaled.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well... I suppose it\u0026apos;s not like you can just tell me everything so easily.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWithout persistently questioning me, it seemed Shimazaki gave up his pursuit for the time being.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHis sharp comprehension and judgment in that area made our interactions efficient and were a great help.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But information is information. I\u0026apos;ll have you pay me back in kind someday.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince it was a debt that money couldn\u0026apos;t settle, it seemed difficult to repay, but it couldn\u0026apos;t be helped.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was certain that the conversation not only eased the feelings of Yoshida, who harbored affection for Shiraishi, but was also meaningful for me, as I had doubts about Shiraishi\u0026apos;s way of thinking.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 2\",\"volumeId\":\"y3v2\",\"chapterIndex\":13,\"prevChapter\":{\"volumeId\":\"y3v2\",\"chapter\":12,\"title\":\"Part 1\"},\"nextChapter\":{\"volumeId\":\"y3v2\",\"chapter\":14,\"title\":\"Part 3\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 2\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Nanase Tsubasa's Monologue\",\"href\":\"monologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Fitting In\",\"href\":\"ch-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"ch-1-p-1.xhtml\",\"index\":12},{\"label\":\"Part 2\",\"href\":\"ch-1-p-2.xhtml\",\"index\":13},{\"label\":\"Part 3\",\"href\":\"ch-1-p-3.xhtml\",\"index\":14},{\"label\":\"Chapter 2: A Gentle Exam\",\"href\":\"ch-2.xhtml\",\"index\":15},{\"label\":\"Part 1\",\"href\":\"ch-2-p-1.xhtml\",\"index\":16},{\"label\":\"Part 2\",\"href\":\"ch-2-p-2.xhtml\",\"index\":17},{\"label\":\"Chapter 3: Getting to Know the Opponent\",\"href\":\"ch-3.xhtml\",\"index\":18},{\"label\":\"Part 1\",\"href\":\"ch-3-p-1.xhtml\",\"index\":19},{\"label\":\"Part 2\",\"href\":\"ch-3-p-2.xhtml\",\"index\":20},{\"label\":\"Part 3\",\"href\":\"ch-3-p-3.xhtml\",\"index\":21},{\"label\":\"Part 4\",\"href\":\"ch-3-p-4.xhtml\",\"index\":22},{\"label\":\"Part 5\",\"href\":\"ch-3-p-5.xhtml\",\"index\":23},{\"label\":\"Part 6\",\"href\":\"ch-3-p-6.xhtml\",\"index\":24},{\"label\":\"Part 7\",\"href\":\"ch-3-p-7.xhtml\",\"index\":25},{\"label\":\"Part 8\",\"href\":\"ch-3-p-8.xhtml\",\"index\":26},{\"label\":\"Part 9\",\"href\":\"ch-3-p-9.xhtml\",\"index\":27},{\"label\":\"Chapter 4: The Quest for Knowledge\",\"href\":\"ch-4.xhtml\",\"index\":28},{\"label\":\"Part 1\",\"href\":\"ch-4-p-1.xhtml\",\"index\":29},{\"label\":\"Part 2\",\"href\":\"ch-4-p-2.xhtml\",\"index\":30},{\"label\":\"Part 3\",\"href\":\"ch-4-p-3.xhtml\",\"index\":31},{\"label\":\"Part 4\",\"href\":\"ch-4-p-4.xhtml\",\"index\":32},{\"label\":\"Chapter 5: Yamamura's Courage\",\"href\":\"ch-5.xhtml\",\"index\":33},{\"label\":\"Part 1\",\"href\":\"ch-5-p-1.xhtml\",\"index\":34},{\"label\":\"Part 2\",\"href\":\"ch-5-p-2.xhtml\",\"index\":35},{\"label\":\"Part 3\",\"href\":\"ch-5-p-3.xhtml\",\"index\":36},{\"label\":\"Part 4\",\"href\":\"ch-5-p-4.xhtml\",\"index\":37},{\"label\":\"Part 5\",\"href\":\"ch-5-p-5.xhtml\",\"index\":38},{\"label\":\"Chapter 6: Fortune and Misfortune Are Intertwined\",\"href\":\"ch-6.xhtml\",\"index\":39},{\"label\":\"Part 1\",\"href\":\"ch-6-p-1.xhtml\",\"index\":40},{\"label\":\"Part 2\",\"href\":\"ch-6-p-2.xhtml\",\"index\":41},{\"label\":\"Part 3\",\"href\":\"ch-6-p-3.xhtml\",\"index\":42},{\"label\":\"Chapter 7: The Observer\",\"href\":\"ch-7.xhtml\",\"index\":43},{\"label\":\"Part 1\",\"href\":\"ch-7-p-1.xhtml\",\"index\":44},{\"label\":\"Part 2\",\"href\":\"ch-7-p-2.xhtml\",\"index\":45},{\"label\":\"Part 3\",\"href\":\"ch-7-p-3.xhtml\",\"index\":46},{\"label\":\"Epilogue: Another Story Begins\",\"href\":\"epilogue.xhtml\",\"index\":47},{\"label\":\"Part 1\",\"href\":\"epilogue-p-1.xhtml\",\"index\":48},{\"label\":\"Part 2\",\"href\":\"epilogue-p-2.xhtml\",\"index\":49},{\"label\":\"Author's Afterword\",\"href\":\"authors-afterword.xhtml\",\"index\":50}],\"volumeTitle\":\"Light Novel 3rd Year Volume 2\",\"detailsLink\":\"/select/year-3/y3v2\",\"returnLink\":\"/select\",\"currentSpineIndex\":13,\"nextVolumeLink\":\"/select/year-3/y3v3\",\"nextVolumeTitle\":\"Light Novel 3rd Year Volume 3\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://classroom-of-the-elite-reader.vercel.app\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"COTE Reader\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"en_US\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:image:width\",\"content\":\"1200\"}],[\"$\",\"meta\",\"9\",{\"property\":\"og:image:height\",\"content\":\"630\"}],[\"$\",\"meta\",\"10\",{\"property\":\"og:image:alt\",\"content\":\"Classroom of the Elite Reader Preview\"}],[\"$\",\"meta\",\"11\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"12\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\"$\",\"meta\",\"13\",{\"name\":\"twitter:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"14\",{\"name\":\"twitter:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"15\",{\"name\":\"twitter:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"link\",\"16\",{\"rel\":\"icon\",\"href\":\"/hola-lector-agua/icon.svg?icon.ae5abf30.svg\",\"sizes\":\"any\",\"type\":\"image/svg+xml\"}],[\"$\",\"$L14\",\"17\",{}]]\n"])</script></body></html>
