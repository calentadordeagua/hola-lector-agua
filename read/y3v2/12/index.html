e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T60a2,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 1\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSHIMAZAKI, WHO\u0026apos;D BEEN walking ahead, made his way straight to Keyaki Mall. Upon arriving, he headed towards the stand for plastic umbrella bags set up at the entrance, pulled a bag free and slipped his umbrella inside. We copied his actions before entering the mall. And when we reached the bookstore, he finally turned to face us.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;A bookstore, huh? Taking a detour?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWithout a word to Yoshida who muttered something, Shimazaki entered the store and headed without hesitation for the student reference section\u0026#x2014;in other words, the corner where the study guides were displayed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This is where I wanted to bring you, Ayanokouji.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed this wasn\u0026apos;t just a small detour, but our destination, the end of the line.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Tell me what kind of study guides you usually use, and how you study.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHearing those words, I finally began to see what Shimazaki wanted to consult me about.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So that\u0026apos;s what this is about.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;After seeing the results of the last special exam, I know you\u0026apos;re ranked higher than me. I don\u0026apos;t expect to catch up to your level today or tomorrow. But that doesn\u0026apos;t mean I\u0026apos;m going to give up trying.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe reason he\u0026apos;d glared at me when we talked about cram school was likely due to his subconscious sense of rivalry.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe wanted to adopt a more efficient learning style to get even a little closer to my academic ability.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShimazaki\u0026apos;s strong determination came through loud and clear.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Go on, tell him, Ayanokouji.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYoshida, acting as the go-between, urged me on, but I didn\u0026apos;t open my mouth.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOr rather, it was more accurate to say I couldn\u0026apos;t.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI very much wanted to grant his wish, but I didn\u0026apos;t have the answer he was looking for. While most high schoolers were currently in the process of tackling and learning new material, I\u0026apos;d completed that process in my childhood. The studying I was doing now wasn\u0026apos;t learning, but a complete review, so I couldn\u0026apos;t provide the answer he was hoping for.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hey, Ayanoko\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s fine, Yoshida. It\u0026apos;s only natural that he wouldn\u0026apos;t be so willing to teach me this easily,\u0026quot; Shimazaki said, furrowing his brows in response to my silence.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s a study method you developed on your own. I\u0026apos;m not expecting you to teach me for free. If you need Private Points, or if there\u0026apos;s something else you want\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI cut off Shimazaki, who, wanting to learn my secret one way or another, was trying to start negotiations.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If this was a problem I could solve, I would\u0026apos;ve been more than willing to cooperate.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2014;\u0026apos;Would\u0026apos;ve been,\u0026apos; huh? Is it a trade secret when it comes to studying? Or do you need a bigger reward?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, I don\u0026apos;t need any reward. In the first place, if your academic ability improves, Shimazaki, it will naturally lead to raising the class\u0026apos;s overall level and contributing to it. That\u0026apos;s more than enough of a reward for me. Besides, it\u0026apos;s not as if I\u0026apos;ll have any trouble no matter how much you improve your academics from now on.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI explained as best I could so he would understand, but it probably wouldn\u0026apos;t be so easy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see. I understand the logic, in theory. But the fact that you\u0026apos;re still not willing to teach me... is it because you want to prevent me from catching up to you, no matter what?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s not it, either. If you think I\u0026apos;m concerned about appearances, you\u0026apos;re mistaken. It\u0026apos;s not that I want to show off being number one, nor do I want to be.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn this school, there are definitely students who are better than me in various fields.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wanted it to be that way, and in fact, it had to be.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf someone were to be able to surpass me in the field of academics, I wanted to see it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you\u0026apos;re going to say all of that, then tell me what study guides you use. And I want you to tell me in detail about your usual study methods and how you manage your time.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe questioned me without reservation, with a spirit that showed he would analyze everything about me. Then he added a disclaimer.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course, I won\u0026apos;t blame you if it\u0026apos;s not effective. I\u0026apos;ll just accept that the method wasn\u0026apos;t right for me, so don\u0026apos;t worry.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHis sincere attitude toward studying seemed genuine.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd as if to jump on the bandwagon, Yoshida also stood next to Shimazaki.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh, uh, teach me too, just in case. If I can study more efficiently, I\u0026apos;ll copy it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat should I do? The general study method I used for Karuizawa, the sort of normal, student-like teaching style for classmates, probably wouldn\u0026apos;t be suitable for high-level students like Shimazaki and Yoshida.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNaturally, the advanced study method I was considering\u0026#x2014;which was modeled on the White Room training\u0026#x2014;wasn\u0026apos;t something I could realistically put into practice yet.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKnowing they probably wouldn\u0026apos;t trust what I was going to say, I figured I\u0026apos;d give them part of the truth\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;To be honest, I hardly ever use these kinds of study guides anymore.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...What? No, but you don\u0026apos;t go to cram school either. You were solving problems that were not only difficult, but also in areas we haven\u0026apos;t even been taught. How do you explain that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;To be honest, a lot of it is just coincidence. I usually pick up my knowledge from the internet. You know how nowadays, there are even sites where people post videos which solve and teach difficult problems, right? I just happened to have seen a similar problem like that in a video I was watching, so I was able to solve it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, I suppose things like that might happen sometimes, but...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps because he was good at studying himself, Shimazaki\u0026apos;s suspicion seemed to deepen in some regards, and he trailed off without showing any sign of being convinced. Even though they still had some doubts in me, I made sure to emphasize that I didn\u0026apos;t watch only specific sites or channels.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the end, he would probably take it as me being secretive, but that couldn\u0026apos;t be helped.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;However\u0026#x2014;there was a study guide that I felt was useful.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI visited bookstores quite often. During my visits, I had skimmed through several study guides to see what kind of things were written in them and to what extent. Relying on that memory, it was possible for me to tell Shimazaki and the others which was the most suitable for learning.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you\u0026apos;re still okay with it, I\u0026apos;d like to offer you some advice.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wasn\u0026apos;t going to teach him nothing; rather, I made it clear that I intended to tell him what I could, and that I wanted him to use whatever he found helpful.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter that, it was up to the recipient, Shimazaki, to decide on what to do next. The matter was in his hands.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWould he write me off as a jerk who wouldn\u0026apos;t tell him the truth, or would he choose to move forward from his current situation, using me for his own benefit even while having his doubts about that side of me?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith almost no time to hesitate, Shimazaki nodded in reply.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Alright. I\u0026apos;ll take your advice without any hesitation.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed he decided to start by trusting me, all for the sake of improving his own abilities.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn response to his request, I recommended a study guide that I had a good feeling about.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey both picked it up without hesitation, but Yoshida quickly gave up on buying it. This was because, naturally, the information required in a study guide varied greatly depending on the level and focus of the university one was aiming for. Even if it was a hit for Shimazaki, who was aiming for the top, it might be irrelevant to Yoshida.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd so, after that, we decided to ask Yoshida some questions, and the two of us, Shimazaki and I, would find a study guide that we thought would suit him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe wandered around the study guide section for about thirty minutes, looking at various books, discussing what would and wouldn\u0026apos;t work, and repeatedly picking them up and putting them back. Though some of our exchanges seemed pointless, it never felt like a waste of time; in fact, it was fulfilling and fun. Bit by bit, we started to gradually understand Yoshida\u0026apos;s preferences, and finally settled on a study guide for him to buy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a small thing, but I was able to get something close to a sense of accomplishment from working together to create something.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen, finally, the three of us split up for a bit, browsed to see if there were any other books we wanted to buy, and then regrouped inside the bookstore.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI found a few magazines and novels that caught my eye, but I still didn\u0026apos;t have many Private Points to spare, so I decided to pass on all of them for now.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What are those books?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShimazaki pointed out to Yoshida, who\u0026apos;d returned with an armful of books in addition to the study guides that Shimazaki and I recommended.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hm, these? It\u0026apos;s fine if I buy stuff other than study guides, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe books Yoshida was holding were men\u0026apos;s fashion magazines and manga. There were books about appearance and clothing to be popular with the opposite sex, and books about conversation skills and techniques.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Studying is important, but I wanna take romance seriously, too. We don\u0026apos;t even have a year of high school left, you know? You think I can waste my last chance to have a romance with a high school girl?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYoshida said as the three of us headed for the register.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t think it\u0026apos;s necessarily your last chance, but...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShimazaki retorted, a little taken aback, but he was certainly right.\u003c/p\u003e\u003cimg src=\"/hola-lector-agua/images/books/y3v2/OEBPS/azrkPpiLFPrQHUXifephw.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven as a college student or a working adult, the chance of dating a high school girl wasn\u0026apos;t zero.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo, if the age gap was too large, that would probably cause other problems.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was seriously considering this, but there was likely another, bigger reason.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is it because you\u0026apos;d feel uneasy if you couldn\u0026apos;t see Shiraishi anymore?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wouldn\u0026apos;t be an exaggeration to say that this was bound by the condition of \u0026apos;until we graduate from ANHS.\u0026apos;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t mean anything by it, I only wanted to confirm his true intentions, but hearing the name Shiraishi, Yoshida became extremely flustered and dropped one of the books he was holding.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;H-Hey, Ayanokouji, don\u0026apos;t say unnecessary stuff like that!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe looked like he was about to cover my mouth, but the words were already out and couldn\u0026apos;t be taken back.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I was just genuinely curious, so I asked... Was that bad?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;O-Of course it\u0026apos;s bad! I-It\u0026apos;s not like I like Shiraishi or anything! I told you that before, didn\u0026apos;t I!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was true that Yoshida himself denied it, but his attitude had been saying otherwise all along.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven Shiraishi was convinced that Yoshida had feelings for her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wouldn\u0026apos;t be an exaggeration to say he had feelings for her, 99 percent\u0026#x2014;no, 100 percent of the time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Shiraishi? You like Shiraishi...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShimazaki, who was walking a little ahead, turned back and muttered this as he watched Yoshida pick up his book.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I told you I don\u0026apos;t like her! I\u0026apos;m just... a little interested, that\u0026apos;s all...!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was an answer that one could safely say meant he did like her. Shimazaki, who registered the blatant reaction, seemed focused solely on his studies and uninterested in romance. Just as I was about to interpret it that way, his expression clouded over for an instant. I wondered if he had something on his mind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...I see...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSeeing Shimazaki\u0026apos;s heavy, different attitude from before, Yoshida\u0026apos;s expression suddenly became panicked.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn an instant, various thoughts seemed to race through his mind, and he arrived at a certain conclusion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;D-Don\u0026apos;t tell me... you\u0026apos;re one of the one hundred guys she\u0026apos;s shot down, are you!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? \u0026apos;Shot down a hundred guys\u0026apos;\u0026#x2014;of course not.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSighing in exasperation, Shimazaki immediately denied it. Right after, he showed an angry-looking face.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yoshida, do you really like Shiraishi?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I-I told you, I don\u0026apos;t like her, I\u0026apos;m just... just a tiny bit interested, that\u0026apos;s all.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe more he denied it, the more it sounded like he was declaring his love.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn fact, Shimazaki, who was watching his reaction, likely felt the same way.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Fine, whatever, just listen. That\u0026apos;s just a rumor. Don\u0026apos;t take something so stupid seriously.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;W-well, yeah, but... they say where there\u0026apos;s smoke, there\u0026apos;s fire, right...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It depends on how that fire was started. That was a lie Shiraishi intentionally spread herself.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe \u0026quot;100-man-slayer\u0026quot; nickname had been on my mind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was surprised to hear it so strongly denied from such an unexpected source.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYoshida\u0026apos;s surprise and agitation seemed even greater; his voice was caught in his throat as if frozen.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter a moment, however, his brain seemed to have processed it a little, and he asked back in a strained voice.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? A lie? H-how would you know something like that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn response to the question, Shimazaki quietly looked around. More cautiously than he had in the lobby.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFortunately, there seemed to be no other customers, and the inside of the store was quiet.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter confirming this, he came back to stand before Yoshida, lowered his voice, and spoke.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Do you remember when you first started hearing that stupid rumor?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Uhm, I think that was... around summertime our first year... wasn\u0026apos;t it? Something about a \u0026apos;20-man-slayer.\u0026apos;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo \u0026apos;slay\u0026apos; 100 men, one naturally had to start with one. Unless she\u0026apos;d accomplished it before high school, it was only natural for the rumor to start with a smaller number.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWell, not that it meant much coming from me, as I wasn\u0026apos;t too familiar with the nickname.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;To be precise, it was after the uninhabited island exam. At that time, Shiraishi startedgetting close with Nishikawa. It was then, from the second term onward, that such a stupid story suddenly started to surface.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA situation from the first year in Class A that I couldn\u0026apos;t have known.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRecalling the scene, Yoshida lightly tapped the corner of a magazine against his chin.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So you\u0026apos;re saying Nishikawa told her to spread that rumor?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s no solid proof, but it\u0026apos;s likely. Even if the \u0026apos;20 men\u0026apos; part were true, the \u0026apos;100 men\u0026apos; rumor is an absolute lie. Reaching 100 by adding 80 more people all at once inside this school isn\u0026apos;t the least bit realistic. Anyone could figure that out if they thought about it for a second.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI\u0026apos;d also heard the \u0026apos;100-man-slayer\u0026apos; story from Nishikawa. I\u0026apos;d asked out of curiosity if the nickname would become \u0026apos;200-man-slayer,\u0026apos; but the response was that 100 was prestigious enough.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps they\u0026apos;d spread rumors about how many she\u0026apos;d \u0026apos;slain\u0026apos; from an early stage, letting it take root little by little.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut for what purpose? That question naturally came to mind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;B-but, hey, can you... say that for sure? The 20 in middle school might be real, you know.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYoshida, on the other hand, seemed concerned about something else and pressed Shimazaki.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t know about that. And what if it were true? Is there some problem with you liking Shiraishi?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs Shimazaki retorted with a sharp, scolding tone, Yoshida seemed to be pushed back even farther than the distance he had closed, taking a spectacular step backward.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No... that\u0026apos;s not it... but...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In the first place, there\u0026apos;s no way I\u0026apos;d know, not having gone to the same middle school. But I can say with certainty that the current, embellished rumor is a lie. I\u0026apos;ve been watching Shiraishi since right after we enrolled, so there\u0026apos;s no mistake.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eImmediately after blurting that out, Shimazaki averted his gaze from us as if flustered, realizing what he\u0026apos;d said.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA slightly awkward silence fell over the already quiet bookstore.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...I observe all of my classmates, you know.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShimazaki belatedly added that as if to deflect, but there was no way one couldn\u0026apos;t guess the truth after seeing him act so out of character.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlthough he\u0026apos;d guessed the reason behind the confident denial and the circumstances behind it, he was probably hesitant to say it directly. I could read from Yoshida\u0026apos;s expression the clash between his desire to confirm it and his rationality telling him he shouldn\u0026apos;t.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t misunderstand, Yoshida... it\u0026apos;s not like that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not that I\u0026apos;m misunderstanding, or... well... if that\u0026apos;s the case, then fine. I mean, it\u0026apos;s not like I care about Shiraishi or anything either...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe two exchanged words while looking in completely different directions.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed that both of them held strong feelings for Shiraishi that they didn\u0026apos;t have for other girls. She herself seemed aware of her popularity with the opposite sex and that proved that it wasn\u0026apos;t just a facade of confidence.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Anyway, our business in the bookstore is finished. We\u0026apos;ll be in the way, so let\u0026apos;s get out of here.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShimazaki said this, avoiding Yoshida\u0026apos;s suspicious gaze.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIndeed, now that they\u0026apos;d decided what to buy, dawdling and chatting would only be a nuisance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBesides, it was probably best to avoid having other students overhear the conversation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Yeah.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter that, they quickly paid and we decided to leave the bookstore.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 1\",\"volumeId\":\"y3v2\",\"chapterIndex\":12,\"prevChapter\":{\"volumeId\":\"y3v2\",\"chapter\":11,\"title\":\"Chapter 1: Fitting In\"},\"nextChapter\":{\"volumeId\":\"y3v2\",\"chapter\":13,\"title\":\"Part 2\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 2\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Nanase Tsubasa's Monologue\",\"href\":\"monologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Fitting In\",\"href\":\"ch-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"ch-1-p-1.xhtml\",\"index\":12},{\"label\":\"Part 2\",\"href\":\"ch-1-p-2.xhtml\",\"index\":13},{\"label\":\"Part 3\",\"href\":\"ch-1-p-3.xhtml\",\"index\":14},{\"label\":\"Chapter 2: A Gentle Exam\",\"href\":\"ch-2.xhtml\",\"index\":15},{\"label\":\"Part 1\",\"href\":\"ch-2-p-1.xhtml\",\"index\":16},{\"label\":\"Part 2\",\"href\":\"ch-2-p-2.xhtml\",\"index\":17},{\"label\":\"Chapter 3: Getting to Know the Opponent\",\"href\":\"ch-3.xhtml\",\"index\":18},{\"label\":\"Part 1\",\"href\":\"ch-3-p-1.xhtml\",\"index\":19},{\"label\":\"Part 2\",\"href\":\"ch-3-p-2.xhtml\",\"index\":20},{\"label\":\"Part 3\",\"href\":\"ch-3-p-3.xhtml\",\"index\":21},{\"label\":\"Part 4\",\"href\":\"ch-3-p-4
