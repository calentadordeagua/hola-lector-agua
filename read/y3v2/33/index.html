\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe moment Mashima-sensei left the classroom, that listless voice came from the seat behind me, pulling me back to reality. Yes, just as if my hair were being forcefully pulled from behind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTug, tug...\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTug, tug...\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut, it wasn\u0026apos;t \u0026apos;as if,\u0026apos; it was actually being pulled with considerable force.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are your ears working properly?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I can hear you, so stop pulling my hair. And your choice of words is questionable.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eReluctantly, I turned around and asked what she wanted.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It appears Yamamura Miki wishes to see you now.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yamamura?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSchool had only just ended, but while I was gazing outside, Yamamura vanished.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe must have slipped out into the hallway in an instant, leaving behind neither sound nor presence.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd then delivered a message to Morishita.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I suppose she could have just told you herself, but for her to approach the current Ayanokouji Kiyotaka directly would make her stand out in a bad way, even with her presence being as faint as shrink wrap. Yes, I admit my magnificent metaphor may have missed the mark a little. Do you have a problem with that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I didn\u0026apos;t say anything, though...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe played the fool, acted as her own straight man, then quietly got defensive all by herself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI intended to go to the library today for sure, but I could probably make time to see Yamamura.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMore than anything, if I missed this chance, I didn\u0026apos;t know when she would reach out again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What should I do?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You would do well to follow me. I shall guide you. And you\u0026apos;ll owe me for this, you know?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe stood up smoothly and struck a pose with a thumbs-up, like a sidekick.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wouldn\u0026apos;t have minded going by myself if she\u0026apos;d just told me the location, but she unilaterally put me in her debt... Oh well, refusing would be a hassle, so I figured it was fine.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt might have been that Morishita wanted to come along as well.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI glanced around the classroom to see who was still there.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi and Nishikawa were chatting with a group of a few other girls, while Hashimoto and Kitou were already gone from the classroom.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 5: Yamamura's Courage\",\"volumeId\":\"y3v2\",\"chapterIndex\":33,\"prevChapter\":{\"volumeId\":\"y3v2\",\"chapter\":32,\"title\":\"Part 4\"},\"nextChapter\":{\"volumeId\":\"y3v2\",\"chapter\":34,\"title\":\"Part 1\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 2\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Nanase Tsubasa's Monologue\",\"href\":\"monologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Fitting In\",\"href\":\"ch-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"ch-1-p-1.xhtml\",\"index\":12},{\"label\":\"Part 2\",\"href\":\"ch-1-p-2.xhtml\",\"index\":13},{\"label\":\"Part 3\",\"href\":\"ch-1-p-3.xhtml\",\"index\":14},{\"label\":\"Chapter 2: A Gentle Exam\",\"href\":\"ch-2.xhtml\",\"index\":15},{\"label\":\"Part 1\",\"href\":\"ch-2-p-1.xhtml\",\"index\":16},{\"label\":\"Part 2\",\"href\":\"ch-2-p-2.xhtml\",\"index\":17},{\"label\":\"Chapter 3: Getting to Know the Opponent\",\"href\":\"ch-3.xhtml\",\"index\":18},{\"label\":\"Part 1\",\"href\":\"ch-3-p-1.xhtml\",\"index\":19},{\"label\":\"Part 2\",\"href\":\"ch-3-p-2.xhtml\",\"index\":20},{\"label\":\"Part 3\",\"href\":\"ch-3-p-3.xhtml\",\"index\":21},{\"label\":\"Part 4\",\"href\":\"ch-3-p-4.xhtml\",\"index\":22},{\"label\":\"Part 5\",\"href\":\"ch-3-p-5.xhtml\",\"index\":23},{\"label\":\"Part 6\",\"href\":\"ch-3-p-6.xhtml\",\"index\":24},{\"label\":\"Part 7\",\"href\":\"ch-3-p-7.xhtml\",\"index\":25},{\"label\":\"Part 8\",\"href\":\"ch-3-p-8.xhtml\",\"index\":26},{\"label\":\"Part 9\",\"href\":\"ch-3-p-9.xhtml\",\"index\":27},{\"label\":\"Chapter 4: The Quest for Knowledge\",\"href\":\"ch-4.xhtml\",\"index\":28},{\"l
