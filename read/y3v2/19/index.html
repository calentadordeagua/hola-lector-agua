e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T3f15,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 1\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDURING THE BREAKS and lunchtime, I meticulously used that time to speak individually with the anxious students of Class A, requesting a discussion after school and securing their permission.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wanted to let them blow off some steam, even if just a little, so the students who\u0026apos;d been complaining, led by Ike-kun and Shinohara-san, wouldn\u0026apos;t still be agitated when it was time for the after-school discussion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSudou-kun said it was an overreaction, but when I saw Chabashira-sensei, who was just as cold as she\u0026apos;d been that morning, I became convinced that I\u0026apos;d done the right thing by acting in advance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Horikita. As I told you during the lunch break, you have a matter in the Student Council room in one hour. I don\u0026apos;t mind you having a discussion, but don\u0026apos;t forget.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes, I understand.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd just as I\u0026apos;d expected, Sensei left the classroom after coming over to me and saying just that, without ever touching on the details of the special exam during the afternoon homeroom. After seeing her off, I made my move. I wanted to avoid a repeat of the morning\u0026apos;s complaint session.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I quickly stepped up to the teacher\u0026#x2019;s podium, another student began to move.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe was the one person I\u0026apos;d identified as a potential problem but hadn\u0026apos;t spoken to.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That guy...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSudou-kun, who muttered quietly nearby, clicked his tongue and turned around.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe student who drew a conspicuous amount of attention, Koenji-kun, stood up from his seat alone and quickly left the classroom.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hey, Koenji\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSudou-kun immediately called out to him in a reprimanding tone, but he walked away without turning back or even stopping for a moment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was normal. He wouldn\u0026apos;t interfere with the discussion, but at the same time, he wouldn\u0026apos;t cooperate either.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI knew that, so I didn\u0026apos;t even try to talk to him before school let out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI resigned myself to the fact that asking for his cooperation would be more trouble than it was worth and would likely just lead to a fight.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEssentially, Sudou-kun, the only one who called out to him, must have felt the same way.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs if to prove it, he too lost interest in Koenji-kun\u0026apos;s disappearing form.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was fine. We could just start the discussion as usual without him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe discussion would proceed more smoothly that way, and problems were less likely to arise.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever...\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wondered if it was really alright to keep letting this slide, dismissing it as \u003cem\u003enormal\u003c/em\u003e.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hirata-kun, I\u0026apos;m sorry, but could you get started without me? I\u0026apos;ll be right back.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah, I understand.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI entrusted the room to Hirata-kun, who readily agreed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven though I knew it was pointless to plead with him, I hurried out into the hallway to chase after Koenji-kun.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI followed him at a light jog down the hallway, where he was presumably heading for the shoe lockers.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd when I spotted the large back of the person I was after, I quickly closed the distance and fell in step beside him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Would you mind waiting a moment?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI called out, looking up at his tall figure from close by.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026#xa0;\u0026quot;Well, well, Horikita Girl. Is there something I can do for you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKoenji-kun glanced at me once, but he didn\u0026apos;t so much as turn his head, his face remaining pointed straight toward his destination.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI struggled to match my steps to his long strides as I continued to follow.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I just want you to at least hear me out.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t mind listening a bit, as long as we\u0026apos;re walking.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s not it. I want you to return to the classroom right now and listen to the discussion.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a modest request.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKoenji-kun didn\u0026apos;t react extravagantly, just flashed a smile that showed his white teeth.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Wouldn\u0026apos;t that simply be pointless? My time is quite priceless, you see. Besides, you and I have an established contract. I\u0026apos;m under no obligation to lend you a hand, am I?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes, I am aware of that. But all I\u0026apos;m asking is for you to listen to the discussion. I\u0026apos;m not asking for your cooperation to win the special exam. I won\u0026apos;t even ask you to say anything.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf I were to ask him to use his potential to contribute to our victory, he would obviously refuse. I recognized the fact that he had every right to do so.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;All you have to do is sit there until we\u0026apos;re dismissed. It\u0026apos;s simple, isn\u0026apos;t it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You seem to be making a passionate case, but I\u0026apos;m afraid I don\u0026apos;t follow. For what purpose, exactly?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s necessary for the class to unite once again. I don\u0026apos;t want you to disrupt that harmony. If even one person breaks the rules, it affects the entire class\u0026apos;s morale.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy justification and my appeal. Surely, at least some of it had to have gotten through to Koenji-kun.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe next expression to appear on the profile I\u0026apos;d been staring up at was a scornful laugh.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hmph. What a curious thing to say. If the class falls apart simply because I\u0026apos;ve left, that just goes to show the limits of your own abilities, Horikita Girl.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This has nothing to do with my abilities. If there\u0026apos;s even one student doing as they please, we can hardly be described as \u0026apos;united,\u0026apos; can we? If even a single piece is missing, the whole thing is incomplete.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see. It seems you\u0026apos;re capable of a somewhat amusing answer. However, you said \u0026apos;once again,\u0026apos; but has the class, excluding myself, ever truly been united as one?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy expression stiffened for a moment at his merciless words, and I stopped in my tracks.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut I knew I couldn\u0026apos;t let Koenji-kun walk away with a rebuttal like that, so I immediately resumed walking.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Saying we\u0026apos;ve never been united is a bit of an overstatement, don\u0026apos;t you think? Over the past two years, while not every time, there have been more than a few occasions when our class came together as one. That\u0026apos;s why we\u0026apos;re in Class A now.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe overcame hardships together. It might not have been something to boast about to others, but a fact was a fact.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You should add \u0026apos;in your mind\u0026apos; to that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And you should add, \u0026apos;not in yours.\u0026apos;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if it was just a tit-for-tat exchange, I couldn\u0026apos;t back down, so I pressed on even if I had to force it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Being in Class A is proof of unity? The only reason the class was lucky enough to win was because Ayanokouji-boy was making his moves. Surely you understand that without me having to tell you, don\u0026apos;t you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...It\u0026apos;s true that Ayanokouji-kun left our class. But we didn\u0026apos;t win through his power alone.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you truly believe that, then that\u0026apos;s quite the comical tale. You talk of unity, of being as one, but aren\u0026apos;t you just trying to convince yourself that you can win even without Ayanokouji-boy?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHis merciless words felt like a blade stabbing me in the back.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s no point in me returning to the classroom now. No matter how much you struggle, as long as you\u0026apos;re the leader, a victory against the other classes is impossible.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe pointed out my lack of ability without sugarcoating it in the slightest.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m... not good enough?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIchinose-san, who earned enough trust to unite her class. Ryuuen-kun, who brought his class together through fear and violence. And Sakayanagi-san, who produced results and earned recognition with her exceptional abilities.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAyanokouji-kun, who\u0026apos;d been accepted by the class in the blink of an eye with his overwhelming ability\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI couldn\u0026apos;t deny that there was a difference when I compared them to myself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes, that might be true. But that doesn\u0026apos;t mean it\u0026apos;s okay for me to just stand still here, does it? I have to start with what I can do. Precisely in order to strengthen our imperfect unity\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I won\u0026apos;t deny that, in itself. It is your freedom to do as you please. And, as I have neither reason nor obligation to follow the class\u0026apos;s instructions, I am also free to persist in my non-participation.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re an excellent student; I know that. But with Ayanokouji-kun now on the enemy\u0026apos;s side, our class\u0026apos;s position as Class A will be threatened before long. You\u0026apos;re fine with that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWithout his cooperation, we might not be able to graduate from Class A.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wanted to see if Koenji-kun was prepared for that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHis behavior... So as not to miss any sign that he was acting differently than usual, I focused my gaze from his head to toe.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut even under my testing gaze, Koenji-kun\u0026apos;s attitude didn\u0026apos;t change at all.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn fact, he just laughed back at me, amused.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In the end, it seems you\u0026apos;re the same.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWithout slowing his pace in the slightest, Koenji-kun continued to distance himself from the classroom.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...The same? What\u0026apos;s the same?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I speak of this cheap ploy to stoke my sense of crisis and desperately try to make me move.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Does that mean someone besides me has already tried to do the same thing?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWas there anyone in the class now who would blame Koenji-kun for his selfish behavior? Even Sudou-kun would only give him a light warning, and most students avoided even speaking to him. Hirata-kun might have tried to talk to him, but he would never resort to threats.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Now, who\u0026apos;s to say?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile I was trying to figure it out, I realized we were almost at the school entrance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Chasing after me any further is a waste of your time, so I suggest you stop.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...I\u0026apos;d like to take your advice, but I simply can\u0026apos;t.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI would pursue him to the very end.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUntil Koenji-kun admitted defeat and said he would return to the classroom.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI certainly felt a new resolve ignite within me, but that flame was extinguished in an instant.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Advice? What a misguided girl you are. Unfortunately, this isn\u0026apos;t advice. It\u0026apos;s a warning.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hk...!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI caught the look from Koenji-kun, and meeting his eyes, I gasped.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was an irritation from Koenji-kun that he rarely ever showed, tinged with a faint killing intent.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a particular glint in his eyes, different from what someone like Ryuuen-kun, who constantly relied on intimidation, would show.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you planning to make an enemy of me too, Horikita-girl?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe was not an ally, but he was neutral.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis was a warning that if I intended to make him abandon that stance, he would show me no mercy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...I have no such intention.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy resolve vanished in an instant, and I stopped. I had no other choice.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFailing to gain his cooperation was one thing, but making an enemy of him was pointless under any circumstances.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe was, for better or for worse, a troublemaker. If he felt like it, he probably wouldn\u0026apos;t think twice about letting the class fall apart.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Good. Well then, I shall be taking my leave.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI felt a gnawing frustration, but ultimately, I was still powerless to stop Koenji-kun from walking away.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 1\",\"volumeId\":\"y3v2\",\"chapterIndex\":19,\"prevChapter\":{\"volumeId\":\"y3v2\",\"chapter\":18,\"title\":\"Chapter 3: Getting to Know the Opponent\"},\"nextChapter\":{\"volumeId\":\"y3v2\",\"chapter\":20,\"title\":\"Part 2\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 2\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Nanase Tsubasa's Monologue\",\"href\":\"monologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Fitting In\",\"href\":\"ch-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"ch-1-p-1.xhtml\",\"index\":12},{\"label\":\"Part 2\",\"href\":\"ch-1-p-2.xhtml\",\"index\":13},{\"label\":\"Part 3\",\"href\":\"ch-1-p-3.xhtml\",\"index\":14},{\"label\":\"Chapter 2: A Gentle Exam\",\"href\":\"ch-2.xhtml\",\"index\":15},{\"label\":\"Part 1\",\"href\":\"ch-2-p-1.xhtml\",\"index\":16},{\"label\":\"Part 2\",\"href\":\"ch-2-p-2.xhtml\",\"index\":17},{\"label\":\"Chapter 3: Getting to Know the Opponent\",\"href\":\"ch-3.xhtml\",\"index\":18},{\"label\":\"Part 1\",\"href\":\"ch-3-p-1.xhtml\",\"index\":19},{\"label\":\"Part 2\",\"href\":\"ch-3-p-2.xhtml\",\"index\":20},{\"label\":\"Part 3\",\"href\":\"ch-3-p-3.xhtml\",\"index\":21},{\"label\":\"Part 4\",\"href\":\"ch-3-p-4.xhtml\",\"index\":22},{\"label\":\"Part 5\",\"href\":\"ch-3-p-5.xhtml\",\"index\":23},{\"label\":\"Part 6\",\"href\":\"ch-3-p-6.xhtml\",\"index\":24},{\"label\":\"Part 7\",\"href\":\"ch-3-p-7.xhtml\",\"index\":25},{\"label\":\"Part 8\",\"href\":\"ch-3-p-8.xhtml\",\"index\":26},{\"label\":\"Part 9\",\"href\":\"ch-3-p-9.xhtml\",\"index\":27},{\"label\":\"Chapter 4: The Quest for Knowledge\",\"href\":\"ch-4.xhtml\",\"index\":28},{\"label\":\"Part 1\",\"href\":\"ch-4-p-1.xhtml\",\"index\":29},{\"label\":\"Part 2\",\"href\":\"ch-4-p-2.xhtml\",\"index\":30},{\"label\":\"Part 3\",\"href\":\"ch-4-p-3.xhtml\",\"index\":31},{\"label\":\"Part 4\",\"href\":\"ch-4-p-4.xhtml\",\"index\":32},{\"label\":\"Chapter 5: Yamamura's Courage\",\"href\":\"ch-5.xhtml\",\"index\":33},{\"label\":\"Part 1\",\"href\":\"ch-5-p-1.xhtml\",\"index\":34},{\"label\":\"Part 2\",\"href\":\"ch-5-p-2.xhtml\",\"index\":35},{\"label\":\"Part 3\",\"href\":\"ch-5-p-3.xhtml\",\"index\":36},{\"label\":\"Part 4\",\"href\":\"ch-5-p-4.xhtml\",\"index\":37},{\"label\":\"Part 5\",\"href\":\"ch-5-p-5.xhtml\",\"index\":38},{\"label\":\"Chapter 6: Fortune and Misfortune Are Intertwined\",\"href\":\"ch-6.xhtml\",\"index\":39},{\"label\":\"Part 1\",\"href\":\"ch-6-p-1.xhtml\",\"index\":40},{\"label\":\"Part 2\",\"href\":\"ch-6-p-2.xhtml\",\"index\":41},{\"label\":\"Part 3\",\"href\":\"ch-6-p-3.xhtml\",\"index\":42},{\"label\":\"Chapter 7: The Observer\",\"href\":\"ch-7.xhtml\",\"index\":43},{\"label\":\"Part 1\",\"href\":\"ch-7-p-1.xhtml\",\"index\":44},{\"label\":\"Part 2\",\"href\":\"ch-7-p-2.xhtml\",\"index\":45},{\"label\":\"Part 3\",\"href\":\"ch-7-p-3.xhtml\",\"index\":46},{\"label\":\"Epilogue: Another Story Begins\",\"href\":\"epilogue.xhtml\",\"index\":47},{\"label\":\"Part 1\",\"href\":\"epilogue-p-1.xhtml\",\"index\":48},{\"label\":\"Part 2\",\"href\":\"epilogue-p-2.xhtml\",\"index\":49},{\"label\":\"Author's Afterword\",\"href\":\"authors-afterword.xhtml\",\"index\":50}],\"volumeTitle\":\"Light Novel 3rd Year Volume 2\",\"detailsLink\":\"/select/year-3/y3v2\",\"returnLink\":\"/select\",\"currentSpineIndex\":19,\"nextVolumeLink\":\"/select/year-3/y3v3\",\"nextVolumeTitle\":\"Light Novel 3rd Year Volume 3\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://classroom-of-the-elite-reader.vercel.app\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"COTE Reader\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"en_US\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:image:width\",\"content\":\"1200\"}],[\"$\",\"meta\",\"9\",{\"property\":\"og:image:height\",\"content\":\"630\"}],[\"$\",\"meta\",\"10\",{\"property\":\"og:image:alt\",\"content\":\"Classroom of the Elite Reader Preview\"}],[\"$\",\"meta\",\"11\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"12\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\"$\",\"meta\",\"13\",{\"name\"
