e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T281f,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 3\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIT WAS RIGHT after I received Yamamura\u0026apos;s agreement and finished telling her about Shiraishi.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA single student popped up at the south entrance, where we hadn\u0026apos;t seen anyone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe then spotted us, shook his head as if to say \u003cem\u003e\u0026apos;good grief\u0026apos;\u003c/em\u003e, and approached with a smirk.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Kinda cold, isn\u0026apos;t it? Not inviting me to what looks like a pretty important chat.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;How did you know we were here, Hashimoto Masayoshi?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMorishita, not even trying to hide her wariness, bluntly asked him for his reasoning.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Process of elimination. I had to run frantically around campus and Keyaki Mall. I was wonderin\u0026apos; where you and Ayanokouji were going and well, I imagined you two were in a relationship you couldn\u0026apos;t speak of.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Please limit your jokes to your face.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Now that\u0026apos;s just hurtful. I\u0026apos;m actually pretty confident about my looks, for your information.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was almost impressive that he hadn\u0026apos;t followed us immediately after we left the classroom.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe\u0026apos;d properly taken into account the risk of us spotting his tail.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m on your side, you know? You don\u0026apos;t have to be so guarded.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto said that as he closed the distance with Morishita, who frequently and openly avoided him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you so much as lay a finger on me, I\u0026apos;ll let out a maidenly scream that could tear silk, you brute.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had a feeling that \u0026apos;tearing silk\u0026apos; and \u0026apos;maidenly\u0026apos; didn\u0026apos;t really go together.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, since I couldn\u0026apos;t imagine what kind of scream Morishita would let out, my interest was piqued just a little.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, I guess I can kinda see why you wouldn\u0026apos;t want me involved this time, though.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSaying that, he shifted his gaze from Morishita, with whom he was making no progress, to Yamamura.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYamamura, now the subject of his gaze, looked uncomfortable, took a step back, and averted her eyes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you making Yamamura your aide, Ayanokouji?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s not what this is about. For me, this is still Class C, which I\u0026apos;ve only just entered. There aren\u0026apos;t many people I can rely on. However, Yamamura and I were together for the school trip and the training camp, and I believe we\u0026apos;ve formed something of a bond. And I\u0026apos;ve judged her to be a trustworthy person. It\u0026apos;s not a matter of me \u003cem\u003eadding \u003c/em\u003eYamamura; I\u0026apos;m hoping she\u0026apos;ll \u003cem\u003ejoin \u003c/em\u003eme.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis reversal of roles was an extremely important distinction.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, well, looks like you\u0026apos;ve really earned Ayanokouji\u0026apos;s trust, eh, Miki-chan?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Uh... Mi-Miki...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Calling a girl by her first name without permission is rather inappropriate, wouldn\u0026apos;t you say, Hashimoto Masayoshi?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hey, you\u0026apos;re one to talk, calling people by their full name. And while we\u0026apos;re at it, why don\u0026apos;t you try getting along with me too, Ai-chan?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I absolutely refuse.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Harsh. What\u0026apos;ll it take for you to trust me?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Trust isn\u0026apos;t built in a day. No, in your case, perhaps I should say: it takes years to build trust, but only a moment to lose it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMorishita sharply thrust her index finger right in front of Hashimoto\u0026apos;s face.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even if Ayanokouji won\u0026apos;t back me up, at least Miki-chan might\u0026#x2014;huh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the instant his gaze was stolen by Morishita, Yamamura once again silently departed from the scene.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;As expected of a ninja\u0026apos;s descendant. It seems the talent is passed down through the ages.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was pretty sure she didn\u0026apos;t have any ancestors like that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I will be leaving as well. Please don\u0026apos;t follow me again.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t worry, I won\u0026apos;t chase after anyone but Ayanokouji.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;My condolences,\u0026quot; she said to me as a parting shot and without heading back to Keyaki Mall, Morishita seemed to be walking home from outside.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOnce it was just the two of us, Hashimoto\u0026apos;s shoulders slumped in an exaggerated fashion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Am I really that untrustworthy?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Do you think you are?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...I don\u0026apos;t.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then you\u0026apos;ll have to be prepared for people to keep secrets from you or avoid you to some extent.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The truth hurts.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto wasn\u0026apos;t an idiot. He understood and accepted that his past actions made his classmates give him the cold shoulder. And yet, he\u0026apos;d gone out of his way to chase me down. It seemed like an action that could only bring him harm, not benefit.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is it strange? That I\u0026apos;d show up even when I\u0026apos;m being told to stay away.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;d be a lie to say I wasn\u0026apos;t wondering about it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hah... Of course I want to get to Class A. I\u0026apos;m the guy who was willing to betray his own class to make that happen. I tried every trick in the book to cozy up to the other classes. But now, I\u0026apos;ve decided this class can win. The fact that I threw away my Private Points is proof of that, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe\u0026apos;d actually lost a large sum of Private Points, making it nearly impossible to buy a ticket to escape should his class sink. For Hashimoto, that was proof of his resolve to go down with his current ship, even if it meant being swallowed by the raging waves.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re an amazing guy, you know. I feel like you\u0026apos;ll win to some extent even without my help. I know it\u0026apos;d be a smarter move not to show up like this and make myself disliked. And yet, the reason I can\u0026apos;t help but stick my nose in... is because I want to do everything I can to help get us to Class A.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter he said that with a serious face, he immediately reverted to a joking expression.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Not that I expect you to believe me, though. But I\u0026apos;m gonna keep pestering you anyway.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed he intended to stick to his guns, fully aware of the criticism he would receive for being unable to suppress his true nature.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Do as you like. Though I think you\u0026apos;ll be hearing endless complaints from Morishita...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s my one and only headache. She\u0026apos;s so loud. So? You heading somewhere now?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;d like to, but I\u0026apos;m stopping by the school.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The school? The library? Didn\u0026apos;t you get to see Shiina on Friday?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, she\u0026apos;d already left for the day, so I couldn\u0026apos;t meet her. So you could say this is me trying again.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...I see?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlthough he let me go without any issue on Friday, Hashimoto\u0026apos;s expression turned slightly suspicious, perhaps because he thought I was using the same line again as an excuse to turn him down.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Listen, you\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto started to speak, but then he let out a short laugh, exhaled, and shook his head.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s nothing. If you want to see Shiina, I\u0026apos;ll graciously step aside today, too. Well then, I\u0026apos;m off.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe turned his back and walked into Keyaki Mall.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was a little concerned about how Hashimoto was acting, but it was getting late again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI decided I should hurry to the library.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 3\",\"volumeId\":\"y3v2\",\"chapterIndex\":36,\"prevChapter\":{\"volumeId\":\"y3v2\",\"chapter\":35,\"title\":\"Part 2\"},\"nextChapter\":{\"volumeId\":\"y3v2\",\"chapter\":37,\"title\":\"Part 4\"},\"toc\":[{\"label\":\"Classroom of the Elite – Ye
