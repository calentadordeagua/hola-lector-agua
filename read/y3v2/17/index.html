graph\" style=\"text-align: left\"\u003e\u0026quot;Whoa...it\u0026apos;s Ayanokouji...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI heard a voice nearby, and when I looked, I saw Ike and Hondou holding trays and looking our way. It seemed they\u0026apos;d planned to sit in this area since it was empty, but after spotting me, they chose to steer clear and walked away.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Looks like you\u0026apos;ve become quite hated, Ayanokouji-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That can\u0026apos;t be helped. From their point of view, I\u0026apos;m a complete traitor.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was right. If I\u0026apos;d been the one avoiding Ike and the others, it would have been a gross overestimation of my own importance, but the reverse was a normal reaction. Anyone who talked to me in a friendly manner would likely be given strange looks.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The special exam\u0026apos;s about to start, so maybe they don\u0026apos;t want to carelessly give away any information?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Something like that, probably.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I listened to Nishikawa and Yoshida\u0026apos;s exchange, a similar thought ran through my own mind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo be honest, I wanted them to have at least that much of a defensive mindset, and if I were to ask for more, I would have wanted them to set aside their personal feelings and sit near an opponent they hated to steal information. Just by having Ike and the others sit nearby, the five of us would be unable to make any careless remarks, and it would simultaneously serve as a form of harassment toward me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, Ike and the others showed no such inclination; it was merely a coincidence that they almost took a table near us.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey didn\u0026apos;t turn back, and it seemed the two of them had settled at a table far away.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh, right, right. There was something I wanted to talk about. Have you guys seen this month\u0026apos;s OAA yet?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDespite the encounter with my former classmates, Yoshida changed the subject with that question, posing it to everyone at the table.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, I haven\u0026apos;t yet. Was there something different written on it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNishikawa and I both shook our heads, and Kitou didn\u0026apos;t even react.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter confirming that no one had seen it, Yoshida grinned and pointed at me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s this guy\u0026apos;s... Ayanokouji\u0026apos;s OAA.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe then took out his phone and showed the screen to Nishikawa and Shiraishi.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter that, he turned the screen toward me as well.\u003c/p\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAyanokouji Kiyotaka OAA\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAcademic Ability A+ (96)\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePhysical Ability A (81)\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAdaptability B (66)\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSocial Contribution B+ (77)\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOverall B+ (80)\u003c/p\u003e\u003c/div\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eApparently, it was my OAA, displaying the school\u0026apos;s latest evaluation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is there something wrong with this?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not \u0026apos;what\u0026apos;s wrong with this?\u0026apos;! Just look at this overall score. This B+ is top-class among the third-years, top-class! It\u0026apos;s proof that your class transfer and the process and results of the last special exam majorly affected your Academic Ability, Adaptability, and Social Contribution, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was true that I hadn\u0026apos;t explicitly held back since transferring to Class C.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI hadn\u0026apos;t slacked off on written exams, and I\u0026apos;d tackled assignments in P.E. and other subjects normally. It was probably inevitable that my scores would increase compared to my first and second years.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRegarding the class transfer, depending on one\u0026apos;s perspective, it could have negatively impacted my Social Contribution, but it was a rule and system approved by the school, and since I had, of course, transferred legally, it seemed safe to assume that the act itself hadn\u0026apos;t significantly affected my evaluation, for better or for worse.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re the acting leader of Class C now. Dude, you really were an amazing guy all along.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You seem awfully happy, Yosshii. Ayanokouji-kun might be amazing, that\u0026apos;s for sure, but in the end, it\u0026apos;s someone else\u0026apos;s grades, isn\u0026apos;t it? I\u0026apos;m surprised you can be so happy about something that\u0026apos;s not even your own score.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s \u0026apos;cause we\u0026apos;re comrades now, you know? Like with famous baseball or soccer players, even if it\u0026apos;s got nothing to do with you directly, you still root for them unconditionally like \u0026apos;awesome, awesome!\u0026apos; because you feel like you\u0026apos;re on the same team, right? It\u0026apos;s the same kinda thing. That home run the other day and that dramatic comeback goal were electrifying, man. The whole country was celebrating.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYoshida spoke passionately, but it seemed his fervor wasn\u0026apos;t getting through to Nishikawa.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is that so? I\u0026apos;m not a fan of sweaty sports like that, so I wouldn\u0026apos;t know.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps fed up with Nishikawa\u0026apos;s immediate negativity, Yoshida shifted his gaze to Shiraishi.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sh-Shiraishi...? You get what I\u0026apos;m trying to say, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes, of course I do. I am also one of the students who supports Ayanokouji-kun. I am very happy that we were able to welcome such a wonderful talent to our class.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;R-Right? I knew it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m more jealous than happy, though~. I mean, no matter how you look at it, those are scores anyone would be envious of.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re just narrow-minded, Nishikawa.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;d call it being realistic, you know? Besides, I think blind faith is a dangerous way of thinking. \u0026apos;Go with the flow,\u0026apos; \u0026apos;If everyone crosses on a red light, it\u0026apos;s not scary.\u0026apos; Unfortunately for you, I\u0026apos;m not the type to unconditionally root for those kinds of heroes. In fact, I\u0026apos;m the kind of person who gets fed up with one-sided media coverage.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYoshida\u0026apos;s assertion, however, was met with Nishikawa\u0026apos;s unabashed negativity.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;ve got a really great personality, you know that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Thanks.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn response to Yoshida\u0026apos;s undisguised sarcasm, Nishikawa seemed to happily narrow her eyes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What are your thoughts, Kitou-kun? Regarding Ayanokouji-kun\u0026apos;s OAA.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi addressed the boy who\u0026apos;d been silent the whole time, despite having followed them to the cafeteria. Kitou remained perfectly still, his gaze fixed on the lunch he\u0026apos;d chosen, a plate of curry rice.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWould he praise me like Yoshida and Shiraishi, or show disgust and caution like Nishikawa?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was still easy for me to aim higher given the standard level of this school, and for that very reason, I wanted to grasp in as much detail as possible the effect these fabricated grades had on the class.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf many students thought like Nishikawa and their dissatisfaction was building up, it might become necessary for me to change my pace.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s useless, useless. Just a waste of time asking. He\u0026apos;ll just say he\u0026apos;s not interested and that\u0026apos;ll be the end of it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I have no interest in other people\u0026apos;s OAA ratings.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKitou answered in a quiet, yet firm voice.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;See?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKitou\u0026apos;s sharp gaze swiftly shot over, glaring piercingly at me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...I am interested in the reason why you hid this much ability for two years. And also... why you\u0026apos;ve started to get serious now.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe OAA was introduced at the beginning of our second year, after Nagumo became student council president.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy stats at that time were certainly mediocre, to say the least.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Come to think of it, what were Ayanokouji\u0026apos;s old OAA stats like? I\u0026apos;ve looked through all the classes\u0026apos; stats before, but I don\u0026apos;t remember at all.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t remember either. Like, I barely even had an impression of you, Ayanokouji-kun. How about you, Asuka?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes, that\u0026apos;s right... I don\u0026apos;t recall either.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eApparently, none of the three had any recollection of what my OAA had been.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t answer, instead recalling the data from a year ago in my mind.\u003c/p\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAcademic Ability C (51)\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePhysical Ability C+ (60)\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAdaptability D+ (37)\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSocial Contribution C+ (60)\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOverall Ability C (51)\u003c/p\u003e\u003c/div\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey were unmistakably the epitome of mediocrity, with not a single noteworthy point.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was precisely why my overall growth compared to a year ago was undoubtedly among the top of our grade. It was for no other reason than that I\u0026apos;d been intentionally holding back my abilities, but it was only natural for others to find it strange.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, it was certainly not something to be proud of.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wouldn\u0026apos;t bring it up here, as it would be a topic about another class\u0026#x2014;moreover, my former one\u0026#x2014;but in terms of pure growth, Sudou\u0026apos;s OAA was the one truly worth bragging about.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I imagine your stats were quite average, which is precisely why your current OAA is so compelling. If you demonstrated your current potential from the very beginning, Ayanokouji-kun, Horikita-san\u0026apos;s Class A would have surely earned more Class Points by now and been in a higher position. I\u0026apos;ve digressed a bit, but why did you start to get serious?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs if intending to let Shiraishi continue her line of questioning, Kitou scooped up a large spoonful of curry and rice and shoveled it into his mouth.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t like to stand out. At first, I wasn\u0026apos;t even interested in graduating from Class A. That\u0026apos;s why I had no intention of getting heavily involved in the class\u0026apos;s ups and downs.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So you\u0026apos;re sayin\u0026apos; your thinking changed before we became third-years? Or after? That\u0026apos;s a huge change, if it\u0026apos;s true. \u003cem\u003eIf\u003c/em\u003e\u0026#xa0;it\u0026apos;s true.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNishikawa showed strong doubt toward my statement, just like the skepticism she directed at Yoshida.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m aware it\u0026apos;s hard to believe, but it\u0026apos;s the truth.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So then, why did someone like you, who doesn\u0026apos;t like to stand out and wasn\u0026apos;t motivated to be serious, suddenly feel like getting serious?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I believe I\u0026apos;ve already explained this, so it\u0026apos;s a bit late to ask. A major factor was that Hashimoto asked me for help, wanting me to do something about the situation where we could no longer win after Sakayanagi left. I decided that if my power could be useful, I wouldn\u0026apos;t mind becoming the class leader.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHere, I made sure to re-emphasize that the transfer was Hashimoto\u0026apos;s achievement. Hashimoto, who was the subject of great suspicion within the class, had become a figure to be avoided, if anything.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hmm. Somethin\u0026apos; about that doesn\u0026apos;t add up. You feel that way too, right, Asuka?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter thinking for a moment, Shiraishi also nodded in agreement.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even if your true feelings were a desire to be useful and become the leader, I find it hard to believe that \u0026#xa0;he alone would be enough to make you transfer to a lower-ranked class. If you remained in Class A, you could have led them, Ayanokouji-kun, and things might have proceeded more smoothly, don\u0026apos;t you think?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah, yeah. There\u0026apos;s no need to take a risk and betray your class, is there~.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hey, hold on. Don\u0026apos;t go blaming Ayanokouji like that. What\u0026apos;ll you do if he loses his motivation over this?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If he loses his motivation from a little questioning like this, then that\u0026apos;s all he\u0026apos;s got, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNishikawa laughed, lightly brushing aside Yoshida\u0026apos;s defense.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well... but still...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not that simple. Class A has established Horikita as their leader, and her position is secure. If I suddenly threw my hat in the ring, it would just cause confusion. Besides, if I\u0026apos;m going to be a leader for real, there\u0026apos;s no point unless I do something like rebuilding a class from the bottom up.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...So you\u0026apos;re sayin\u0026apos; you wanna get to Class A with your own two hands, even if it\u0026apos;s a pain?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I answered with a nod, Yoshida nodded back two or three times as if impressed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I respect that spirit of yours.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you, like, a glutton for punishment or something? Like, super masochistic? And are you forreal, forreal?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNishikawa continued to laugh, but she also kept voicing her lingering doubts without hesitation. My answer probably wouldn\u0026apos;t clear up her suspicions here, but it would be better to keep answering her anyway.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, before I could open my mouth, Yoshida, his expression hardened, spoke up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Maybe not all of it, but I think what he\u0026apos;s sayin\u0026apos; is true, for the most part.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The words of Ayanokouji-kun\u0026apos;s little follower don\u0026apos;t seem to hold much weight~.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Who\u0026apos;re you callin\u0026apos; a follower?!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then should I call you Hashimoto-kun Number 2?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Anything but that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA short, fast rally of words took place, and Nishikawa deftly spun the chopsticks in her right hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So then, what makes you say you think it\u0026apos;s true?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s like, you can just tell by lookin\u0026apos; at him. No matter how you slice it, he\u0026apos;s a weirdo on the same level as Morishita.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was grateful that he was defending me, but I was not pleased about being put in the same category as Morishita.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I haven\u0026apos;t been paying attention for a bit, and you\u0026apos;ve already earned this much of Yosshii\u0026apos;s trust, huh~.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh, Nishikawa-san. I also trust Ayanokouji-kun a great deal, you know?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi replied, a mysterious smile on her face just as Yoshida had described.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why, why? \u0026apos;Cause he got results in the special exam? Or... is it a personal preference?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNishikawa looked at Yoshida with what could be described as her biggest suggestive smile of the day.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;P-Personal preference...? What the hell is that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYoshida, who took the bait as expected, pressed Nishikawa as he questioned her again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You totally know what I mean~. The truth is, you just want Asuka to look at you that way, don\u0026apos;t you, Yosshii?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;W-Well... I mean... n-no, that can\u0026apos;t be true!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDuring my recent exchange with Shimazaki, the idea that the story of her \u0026quot;100-man slayer\u0026quot; title was a lie had come up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, I had to remember that it was strictly Shimazaki\u0026apos;s opinion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn fact, he\u0026apos;d warned me afterward not to tell anyone about his denial.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA careless student might have let it slip, but Yoshida didn\u0026apos;t show the slightest hint of it, instead framing his words on the premise that the rumor of her \u0026quot;100-man slayer\u0026quot; title was true.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOr perhaps, even while wanting to deny it, he still wasn\u0026apos;t completely convinced by Shimazaki\u0026apos;s statement.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m still holding on to my theory that you\u0026apos;re an assassin sent by Horikita-san, you know.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYoshida\u0026apos;s expression stiffened even more at Nishikawa, who continued to make such blunt remarks.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Knock it off, Nishikawa.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why? You want me to place my complete trust in him like you, Yosshii? I\u0026apos;m not that easy of a girl, you know.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Complete trust? Don\u0026apos;t be ridiculous. Such a relationship doesn\u0026apos;t exist between us in Class C and Ayanokouji yet. We\u0026apos;re still in the process of feeling each other out.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hmm? And yet, you no longer doubt Ayanokouji-kun\u0026apos;s transfer or his future contributions, do you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s not it. I\u0026apos;m trying to start from a place of trust. At the very least, Ayanokouji earned that right by getting us through the first special exam, didn\u0026apos;t he? Or are you going to say that the right thing to do is to constantly doubt him and keep asking, \u0026apos;Is he useful? Is he really on our side?\u0026apos;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo longer bothering to hide his irritation, Yoshida spoke heatedly and forcefully to the frivolously smiling Nishikawa.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s a bit too cool for you, Yosshii, but\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt this, Nishikawa, while still facing Yoshida, glanced over at Shiraishi.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah, well, maybe that\u0026apos;s the right way to think about it. I can\u0026apos;t do it right away, but I guess I do hope I can learn to trust Ayanokouji-kun as soon as possible.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNishikawa, who\u0026apos;d been so openly brandishing her suspicions about me, now took a step back.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I understand how both of you feel very well. So, how about we take this opportunity to dig a little deeper into each other? While visible achievements like the results of the special exam are important, you can\u0026apos;t truly know someone without seeing their private life.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi brought her hands together as she made the suggestion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That might be a good idea. It\u0026apos;s true I still don\u0026apos;t really know what kind of person Ayanokouji-kun is.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps because it was Shiraishi\u0026apos;s suggestion, Nishikawa readily agreed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Since we\u0026apos;re having lunch together like this, let\u0026apos;s reintroduce ourselves.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe irritated Yoshida had no choice but to accept Shiraishi\u0026apos;s proposal... no, the corners of his eyes were already drooping with delight.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well then, I shall start. On weekdays, when I\u0026apos;m alone, I usually go straight back to the dorms. When Nishikawa-san or my friends invite me out, I sometimes stop by Keyaki Mall, but that\u0026apos;s at most once or twice a week.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUnless they were short on cash, the vast majority of students went home via Keyaki Mall nearly every day. It was the only place where they could enjoy almost every aspect of their private lives, from daily shopping to having fun.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Asuka, you turn me down quite a lot when I invite you out, don\u0026apos;t you~?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m sorry. If I had to say, I prefer to spend my time alone. But that\u0026apos;s precisely why on my days off, I make a point of going out and increasing my opportunities to interact with people. Even so, I tend to take it easy in the morning and get more active in the afternoon. I often go to caf\u0026#xe9;s or general stores.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn order to let us get to know her, Shiraishi shared her behavioral patterns with me in more detail than I expected. As if to match her, Nishikawa also began to speak.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Okay, my turn~. I guess I\u0026apos;m usually at Keyaki Mall~. I\u0026apos;m there alone a lot, and I go with friends a lot, too~. Like Takanashi-san or Tsukaji-san, you know.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNishikawa, who began talking cheerfully, continued to speak eloquently even after mentioning her friends\u0026apos; names, going into great detail about what they talked about and what they did.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Alright, alright. We get it, that\u0026apos;s more than enough.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYoshida, who\u0026apos;d been listening in silence for a while, seemed to have finally reached his limit as her story stretched on for several minutes, and he forcibly cut in to stop her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNishikawa looked like she still had plenty more to say, but she reluctantly passed the baton to me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Honestly, I don\u0026apos;t think I\u0026apos;m that different from any other student. If I had to point out a difference, it would be that I\u0026apos;ve been showing my face at the gym recently whenever I have free time, regardless of whether it\u0026apos;s a weekday or a day off.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The gym? You mean the one on the second floor? I didn\u0026apos;t know any students actually went there.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNishikawa muttered as if she were looking at something rare.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are there any guys from our class who go?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hmm, probably not, don\u0026apos;t you think?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eApparently, no classmates immediately came to mind for Yoshida and the others.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt\u0026apos;s not like I go to the gym all that often myself, but I have no memory of any Class C students.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s true that it might not be very popular, but there should still be about thirty members from the entire school. I\u0026apos;m sure a few new students will be joining soon, too.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn addition, school staff could also use it, so the total number of members, including adults, was probably around forty to fifty people.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJudging from the gym\u0026apos;s floor space and the membership fees, it seemed it would almost certainly be operating at a loss if the rent was appropriate, but it was likely able to stay afloat because the school provided generous subsidies.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Does anyone want to join the gym?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ugh, that was a terrible pitch, Ayanokouji...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;A sudden invitation in the middle of this conversation? You\u0026apos;ve got no taste, you know~?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYoshida and Nishikawa looked at me, voicing similar thoughts almost simultaneously.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust then, Kitou stood up, pulling his chair back a little roughly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe\u0026apos;d apparently finished his curry, and he then picked up his tray.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...I\u0026apos;m going back to the classroom.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eLeaving only those words behind, he departed from the group.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In the end, he barely participated in the conversation... Seriously, why\u0026apos;d he even agree to eat with us?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Who knows? It\u0026apos;s hard to tell what Kitou-kun\u0026apos;s thinking. And his face is scary.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wouldn\u0026apos;t go so far as to say Nishikawa was wrong for just blurting out what she thought, but wasn\u0026apos;t that last part definitely an unnecessary comment?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn any case, it seemed the distance with Kitou was not going to be easily closed after all.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter that, I continued to eat while I considered what to do after school.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI\u0026apos;d been thinking about stopping by the library soon, but as luck would have it, the exam had been announced today. Since I still lacked the information to narrow down the rules, I wanted to devote my time after school to that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTomorrow\u0026#x2014;I would make time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was sure I\u0026apos;d be able to talk with Hiyori more leisurely that way, too.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 2\",\"volumeId\":\"y3v2\",\"chapterIndex\":17,\"prevChapter\":{\"volumeId\":\"y3v2\",\"chapter\":16,\"title\":\"Part 1\"},\"nextChapter\":{\"volumeId\":\"y3v2\",\"chapter\":18,\"title\":\"Chapter 3: Getting to Know the Opponent\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 2\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Nanase Tsubasa's Monologue\",\"href\":\"monologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Fitting In\",\"href\":\"ch-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"ch-1-p-1.xhtml\",\"index\":12},{\"label\":\"Part 2\",\"href\":\"ch-1-p-2.xhtml\",\"index\":13},{\"label\":\"Part 3\",\"href\":\"ch-1-p-3.xhtml\",\"index\":14},{\"label\":\"Chapter 2: A Gentle Exam\",\"href\":\"ch-2.xhtml\",\"index\":15},{\"label\":\"Part 1\",\"href\":\"ch-2-p-1.xhtml\",\"index\":16},{\"label\":\"Part 2\",\"href\":\"ch-2-p-2.xhtml\",\"index\":17},{\"label\":\"Chapter 3: Getting to Know the Opponent\",\"href\":\"ch-3.xhtml\",\"index\":18},{\"label\":\"Part 1\",\"href\":\"ch-3-p-1.xhtml\",\"index\":19},{\"label\":\"Part 2\",\"href\":\"ch-3-p-2.xhtml\",\"index\":20},{\"label\":\"Part 3\",\"href\":\"ch-3-p-3.xhtml\",\"index\":21},{\"label\":\"Part 4\",\"href\":\"ch-3-p-4.xhtml\",\"index\":22},{\"label\":\"Part 5\",\"href\":\"ch-3-p-5.xhtml\",\"index\":23},{\"label\":\"Part 6\",\"href\":\"ch-3-p-6.xhtml\",\"index\":24},{\"label\":\"Part 7\",\"href\":\"ch-3-p-7.xhtml\",\"index\":25},{\"label\":\"Part 8\",\"href\":\"ch-3-p-8.xhtml\",\"index\":26},{\"label\":\"Part 9\",\"href\":\"ch-3-p-9.xhtml\",\"index\":27},{\"label\":\"Chapter 4: Th
