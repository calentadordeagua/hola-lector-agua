e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T1ab4,"])</script><script>self.__next_f.push([1,"\u003ch1 class=\"heading_1\"\u003e\u003ca class=\"heading-link\" href=\"/read/y3v2/2\"\u003eEpilogue:\u003cbr/\u003eAnother Story Begins\u003c/a\u003e\u003c/h1\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIT WAS JUST before 11:00 a.m. on a Saturday in late May\u003c/em\u003e\u0026#xa0;when I left my room for a meeting.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd just as I left the dorm lobby, the person I was there to meet called out to me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Good morning, Horikita-san.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKaruizawa-san, who seemed to have arrived a little earlier than planned, was smiling.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Good morning. I apologize for contacting you so suddenly last night.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026#xa0;As I\u0026#x2019;d just mentioned, I had sent the message asking to see Karuizawa-san last night. It wouldn\u0026apos;t have been surprising if she had plans, given how many friends she had, but she readily agreed to meet.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s totally fine! I mean, getting an invitation from you, Horikita-san, was kinda new and exciting, so I was happy.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe was looking forward to it, she added with a smile.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But...why are you in your uniform?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I have a Student Council\u0026#xa0;matter I need to attend to, at two o\u0026apos;clock.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEntering school grounds in casual clothes was prohibited. I explained that it would be a hassle to go out before noon in casual wear, only to have to return to change into my uniform. On days off, some students came to school for club activities, so even though we were a minority, I wasn\u0026apos;t worried that I would be the only one standing out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Being student council president sounds like a lot of work. I could never do something like that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe said, \u0026quot;No way, no way,\u0026quot; while gazing toward Keyaki Mall.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So, what\u0026apos;s the plan? I\u0026apos;m actually kinda looking forward to you escorting me around, Horikita-san.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If that\u0026apos;s what you were expecting, then I\u0026apos;m afraid I\u0026apos;ll have to apologize. I didn\u0026apos;t invite you to hang out for fun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I offered my light apology, Karuizawa-san\u0026apos;s eyes widened, as if she\u0026apos;d just realized something.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Eh, ah... Don\u0026apos;t tell me... you have something you want to know about Ayanokouji-kun?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re sharp. That is one of my objectives.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, the special exam just ended smoothly and all, so I kinda figured that might be it. But even so, there\u0026apos;s no guarantee I can actually help, you know?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I understand that. But if it\u0026apos;s something even you don\u0026apos;t know, then I can give up.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter all, among everyone I knew, she was without a doubt the one who knew Ayanokouji-kun best.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Okay. Then ask me anything. If it\u0026apos;s something I know, I\u0026apos;ll answer whatever!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter saying that, she seemed to have second thoughts, scratching her head in a fluster.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sorry, maybe \u0026apos;anything\u0026apos; is a bit much. But I can talk about most things, so, yeah.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKaruizawa-san corrected herself, her face turning red.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a slightly curious reaction, but it would be more than enough if she simply told me what she could.\u003c/p\u003e\u003cimg src=\"/hola-lector-agua/images/books/y3v2/OEBPS/xFbJRJTHEXJEPINZREygZ.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Thank you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKaruizawa-san\u0026apos;s devoted\u0026#x2014;no, positive response put my heart at ease.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I have no intention of keeping secrets or telling you any clumsy lies, either. I\u0026apos;ll tell you everything about why I want to know about Ayanokouji-kun and what my thoughts are, so I\u0026apos;d like you to hear me out.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course. I might not look it, but I\u0026apos;m great at keeping secrets, so bring it on!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTrusting her, I told her that as a first step toward my goal of defeating Ayanokouji-kun, I planned to start by learning more about him, mentioning Kushida-san and Ibuki-san\u0026apos;s names as well.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd that to do so, I was also thinking of looking into his roots.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI explained all of this to Karuizawa-san.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see. I... Yeah, since before I started dating Kiyotaka, ah\u0026#x2014;I mean, Ayanokouji-kun, I used to wonder a lot about things like what he was like in middle school, so I get it. Oh, and sorry, I might still slip up and call him by his first name.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t mind that at all. If it\u0026apos;s difficult for you to use his surname, you\u0026apos;re welcome to do otherwise.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Nn-nn, this is about setting boundaries. For me... you know?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I was dating Ayanokouji-kun, but to be honest, I doubt I have much more information than you do. I tried asking him about his past a few times, but I don\u0026apos;t think he ever really gave me a straight answer.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Things like which prefecture he lived in, or where his middle school was?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah. I asked about things like what foods he likes and dislikes, or his taste in clothes, but\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs she made a gesture of recollection, Karuizawa-san began telling me what she saw and heard for herself.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Epilogue: Another Story Begins\",\"volumeId\":\"y3v2\",\"chapterIndex\":47,\"prevChapter\":{\"volumeId\":\"y3v2\",\"chapter\":46,\"title\":\"Part 3\"},\"nextChapter\":{\"volumeId\":\"y3v2\",\"chapter\":48,\"title\":\"Part 1\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 2\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Nanase Tsubasa's
