I couldn\u0026apos;t help but feel my heart being fulfilled.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI simultaneously recalled the sight of Ayanokouji-kun who\u0026apos;d come to see me in the library.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHow it happened immediately after I resolved and convinced myself that I\u0026apos;d come to hate him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHow he told me he wanted to see me again tomorrow.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy resolve to break away from him had already flown away somewhere.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026#x201c;It\u0026#x2019;s frightening to feel so fulfilled\u0026#x2026;\u0026#x201d;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA day that had thrown my heart into turmoil, yet one that turned into something truly wonderful.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven I am deeply shocked myself. That such a large and powerful emotion had been hiding within me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI understand it now.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat I see Ayanokouji-kun as a man, as a member of the opposite sex, and have fallen in love with him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: center\"\u003e\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSpinning the flower gently, I let out a small sigh.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s okay, right...? To keep on loving him like this...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI asked the poppy that would never answer me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAyanokouji-kun and Karuizawa-san have broken up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSo, I know that it\u0026apos;s not wrong for me to love him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut I don\u0026apos;t have the courage to tell him how I feel, and above all else, we still remain in different classes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs we continue to compete for Class A, these emotions surely won\u0026#x2019;t lead to anything good.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eCan I really fight against Ayanokouji-kun\u0026apos;s class while I\u0026apos;m still in love with him, I wonder\u0026#x2026;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt\u0026#x2019;d be best if I cast aside such covetous thoughts and be content to remain as his precious friend.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWanting anything more than that is wrong.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the first place, there is no guarantee that Ayanokouji-kun even sees me that way.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRemaining as we are right now.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRemaining like this.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNot too close, not too far.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt might be a happier fate for my first love to end while it remains faint and fleeting, I think.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Surely... that\u0026apos;s the correct answer, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI asked the poppy flower one last time.\u003c/p\u003e\u003ch1 class=\"heading_1\"\u003e\u003ca class=\"heading-link\" href=\"/read/y3v2/2\"\u003eShiraishi Asuka\u0026#x2019;s Short Story:\u003cbr/\u003eThe Voice Hidden Within\u003c/a\u003e\u003c/h1\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e(Original translation provided by \u003c/em\u003e\u003ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.google.com/url?q=https://www.reddit.com/user/AdventurousArt8711/\u0026amp;sa=D\u0026amp;source=editors\u0026amp;ust=1756121329617835\u0026amp;usg=AOvVaw1qgXx__99UemRNsrjLVeEk\"\u003e\u003cem\u003eDrago\u003c/em\u003e\u003c/a\u003e\u003cem\u003e, edited by LegacyEMTLs)\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOVER THE COURSE of more than two years of my school life.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI cannot deny that the feeling of \u003cem\u003eI mustn\u0026#x2019;t hear those words\u003c/em\u003e, and the feeling of \u003cem\u003eI want to hear those words\u003c/em\u003e, had jumbled up into a confusing mess inside me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It may be conceited of me to say, but hadn\u0026apos;t you been watching me, to some extent, before I transferred classes?\u0026#x201d;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHis gaze and his voice mercilessly pierced into me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was found out. He found me out.\u003csup id=\"fnref-1-fbd73bf2-885b-5850-984b-29ea3fc3d540\"\u003e\u003ca class=\"footnote-ref\" href=\"#fn-1-fbd73bf2-885b-5850-984b-29ea3fc3d540\" data-ref=\"1\" epub:type=\"noteref\"\u003e[1]\u003c/a\u003e\u003c/sup\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eConflicting feelings kept flooding my mind simultaneously.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt would be easy to line up excuses, but that would be unforgivable.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ahh... that just won\u0026apos;t do.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI have a noble cause. A duty as an observer.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo meet the expectations of Shirogane-sensei, I had continued to do the same thing every single day.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat day, when I was called into that room just before graduation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy mission began ever since the day I learnt about you, and yet\u0026#x2026;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026apos;Won\u0026apos;t do\u0026apos;? What\u0026apos;s wrong?\u0026#x201d;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was nothing different from usual in Ayanokouji-kun\u0026apos;s voice.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t that he had arrived at a firm conclusion; rather, my own irrepressible gazes and mannerisms must have given birth to his suspicion, I suppose.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePlease, forgive me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePlease, just for this moment, allow me to forget that duty.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I am Shiraishi Asuka.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOur conversations up until now had been a lie.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat\u0026apos;s why, for my self-introduction at the very least, I wanted to speak from the heart, you know...\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And you\u0026#x2014;who are you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWould he answer me, I wonder.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWould he answer this question of mine\u0026#x2014;the voice of my first true introduction, which I\u0026apos;d kept hidden deep within\u0026#x2014;.\u003c/p\u003e\u003chr class=\"footnote-rule\"/\u003e\u003col class=\"footnotes\"\u003e\u003cli data-id=\"fbd73bf2-885b-5850-984b-29ea3fc3d540\" data-ref=\"1\" class=\"footnote first-footnote\" id=\"fn-1-fbd73bf2-885b-5850-984b-29ea3fc3d540\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003ca class=\"footnote-backref\" href=\"#fnref-1-fbd73bf2-885b-5850-984b-29ea3fc3d540\"\u003e[1]: \u003c/a\u003eWhen Shiraishi says \u0026quot;He found me out\u0026quot; (\u0026#x77e5;\u0026#x3063;\u0026#x3066;\u0026#x3082;\u0026#x3089;\u0026#x3048;\u0026#x305f;, shittemoraeta), she expresses it with a sense of gratitude, as if he did her a favor by noticing or understanding her. It\u0026apos;s a nuance that\u0026apos;s quite difficult to fully capture in English, so I\u0026#x2019;m leaving this note for anyone reading to be aware of it.\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e\u003ch1 class=\"heading_1\"\u003e\u003ca class=\"heading-link\" href=\"/read/y3v2/2\"\u003eSpecial Short Story:\u003cbr/\u003eThe Six First-Year Students\u003c/a\u003e\u003c/h1\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTSUBAKI GAZED OUT the cafe window. Her expression is somewhat serious, somewhat delicate.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn her line of sight, the second-year Ayanokoji Kiyotaka was walking.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Tsubaki, do you want to move up to Class A?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Not really. They say that\u0026apos;s what the goal of the school is, then isn\u0026apos;t it something like a mission for the enrolled students to give it their all?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Not much time has passed since I met you, but you don\u0026apos;t seem like the type to act like she\u0026apos;s carrying a mission.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Maybe. But aren\u0026apos;t you the same, Utomiya-kun? You don\u0026apos;t seem interested in things like Class A or special privileges.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAverting her gaze from Ayanokouji, Tsubaki turns her eyes to Utomiya, who is sitting next to her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSeeing this, Utomiya looks somewhat awkward and turns his face away, towards the outside window.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s Housen and Nanase.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hm...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the line of sight of Utomiya, who was muttering to change the subject, were two first-year Class D students who were about to pass by Ayanokouji.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt looked like there might be some kind of contact, but there was no exchange of words, only Nanase giving a polite nod.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Coincidence? Or not?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I can\u0026apos;t say anything just from that. But the bandage on Ayanokouji\u0026apos;s left hand\u0026#x2014;it piques my interest a bit.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;He was wearing something like that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTsubaki, who hadn\u0026apos;t noticed, shifted her gaze to Utomiya once again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Maybe something had happened. Knowing Housen\u0026apos;s personality, it wouldn\u0026apos;t be surprising if he started it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You mean he injured his hand? Housen-kun looked unharmed, though.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If they clashed somewhere, Ayanokouji probably chose not to fight back. There\u0026apos;s a risk in carelessly injuring your opponent.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh? But for that to happen, wouldn\u0026apos;t Ayanokouji-senpai also need a certain level of skill?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;His actual fighting ability is unknown, but I can\u0026apos;t imagine him losing to someone at Housen\u0026apos;s level. I can tell that much just by watching his usual demeanor and presence.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026apos;Housen-kun\u0026apos;s level\u0026apos;... Are you serious? He seems to just rampage around as he pleases, though.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat surprised Tsubaki was not the high evaluation of Ayanokouji, but the low estimation of Housen.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s just because everyone around him is weak. \u0026#x2015;\u0026#x2015;Probably.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFeeling he had said too much, Utomiya trailed off.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMen are creatures who bluff. Most of them inwardly believe they are stronger than whoever they face.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was a good chance that Utomiya\u0026apos;s remark was just a bluff, or that he simply had an abnormally high self-assessment, but he wasn\u0026apos;t usually one to behave like that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor the first time, Tsubaki felt a slight interest in her classmate, Utomiya.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I think I\u0026apos;ve become a little interested in getting to know you, Utomiya-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Stop it. I don\u0026apos;t pry into anyone\u0026apos;s business, and I don\u0026apos;t want anyone prying into mine.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ahh~. What a nice atmosphere~. Could it be that you two are dating?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA shadow fell between the two, and a girl appeared as if to interrupt them. It was Amasawa from first-year Class A.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We are not dating.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUtomiya denied it instantly. Tsubaki also nodded in agreement, not seeming particularly interested.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You think so? For that, your sense of distance seemed pretty close, though~\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s your imagination. Did you approach us just to say something so stupid? Or did you come over because you wanted to extract some information from us?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen Utomiya retorted in a harsh\u0026#xa0;tone, Amasawa smiled, her lips curling in delight.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh, come on, I didn\u0026apos;t mean it like that. Even if our classes are different, we\u0026apos;re still first-years, so let\u0026apos;s get along. Right, Tsubaki-chan?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sorry, but I\u0026apos;ll pass. I\u0026apos;m not exactly looking for friends.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So harsh, meow~\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWithout looking particularly shocked, Amasawa gave a cute reply.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well then, I guess I\u0026apos;ll save deepening our friendship for next time. See you later, Tsubaki-chan, Utomiya-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSaying that, Amasawa left behind a blown kiss, turned her back, and walked away.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Amasawa doesn\u0026apos;t know about the special exam, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;She shouldn\u0026apos;t. In Class A, only Takahashi and Ishigami know. However, I can\u0026apos;t deny the possibility that they asked her to investigate even without knowing the details.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But in any case, it\u0026apos;s a baffling exam. To think it\u0026apos;s targeting a specific individual, only Ayanokouji.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It might be something that\u0026apos;s normal at this school, and we just don\u0026apos;t know about it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...If that\u0026apos;s the case, it makes the situation\u0026#xa0;even more unsettling.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hello, Utomiya-kun. And Tsubaki-san as well.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA voice calls out from a short distance away.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYagami from first-year Class B, who had come to the cafe, stopped and approached the two.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Now it\u0026apos;s Yagami... He\u0026apos;s the type to show up if you talk about the exam.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Can you blame him? The amount of private points you can get is on a whole other level.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you don\u0026apos;t mind, could I join your conversation as well?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We were just having a boring small talk, that\u0026apos;s all.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It didn\u0026apos;t look that way to me. It seemed you were watching Ayanokouji-senpai and Housen-kun\u0026apos;s group.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh... So you\u0026apos;ve been watching us from quite an early stage.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It was just a coincidence, though.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Either way, we\u0026apos;re enemies.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s precisely because we are enemies that there is meaning in talking to each other, don\u0026apos;t you think?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUtomiya, Tsubaki, Housen, Nanase, Yagami.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat they all had in common, Yagami included, was that they were all targeting Ayanokouji Kiyotaka.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTsubaki and Utomiya had no way of knowing, but Amasawa was also involved in a certain special exam for first-year students.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom this gathering, the story connects to the upcoming special exam on the uninhabited island\u0026#x2015;.\u003c/p\u003e\u003ch1 class=\"heading_1\"\u003e\u003ca class=\"heading-link\" href=\"/read/y3v2/2\"\u003eLegacyEMTLs Afterword\u003c/a\u003e\u003c/h1\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFirst off I would like to apologize for all the delays with releasing this volume. We certainly felt the impact of missing some staff. Anyways, I would like to thank everyone who helped with translating, editing, and typesetting this volume. It was certainly a beast. I would also like to thank you, the reader, for choosing our translation to read. We certainly wouldn\u0026apos;t be here without you. I hope you enjoyed this volume as much as I did. Anyways, peace \u0026#x270c;\u0026#xfe0f;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: right\"\u003e\u003cem\u003e- Colibri\u003c/em\u003e\u003c/p\u003e\u003ch1 class=\"heading_1\"\u003e\u003ca class=\"heading-link\" href=\"/read/y3v2/2\"\u003eLegacyEMTLs Credits\u003c/a\u003e\u003c/h1\u003e\u003chr/\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003eColibri - Lead / Dev\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\"\u003eI dead\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003eFS7 - JE Checker\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\"\u003eI miss Arisu\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003e1chi - English Editor\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\"\u003eAh yes, Kinu\u0026apos;s masterful baiting shenanigans never end. This time it\u0026apos;s Hiyori. Can\u0026apos;t wait for Kushida\u0026apos;s turn.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003eHiyori\u0026apos;s Only Lover - English Editor\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\"\u003eHmmmm, I don\u0026apos;t know what to say. This volume was decent. But I don\u0026apos;t what to feel regarding Hiyori\u0026apos;s situation, you never know what kinu will do. Soooo nasty, the King.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003eWriter - English Editor\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\"\u003eTeehee no clue what this is about but yay!!!!!\u003c/p\u003e\u003cp class=\"paragraph\"\u003eLife\u0026apos;s good teehee\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003eSky - English Editor\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\"\u003eStill waiting for Hiyori to carry the whole novel, any day now...\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003eAxcel - JE Checker\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\"\u003e\u0026quot;Farewell, My Lovely\u0026quot;\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003eStella - JE Checker\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\"\u003eI fear for Hiyori\u0026apos;s future. Many red flags... But I\u0026apos;m also curious to see Kiyotaka\u0026apos;s development!\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003eKall_tho - English Editor\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\"\u003eStill obsessed with Honami-chan iykyk :P\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003e3F - Illustrator\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\"\u003eFnck y3 illustrations and fnck every fncking character who\u0026apos;s illustrated as a spaghetti doodle.\u003c/p\u003e\u003c/div\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Author's Afterword\",\"volumeId\":\"y3v2\",\"chapterIndex\":53,\"prevChapter\":{\"volumeId\":\"y3v2\",\"chapter\":49,\"title\":\"Part 2\"},\"nextChapter\":\"$undefined\",\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 2\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Nanase Tsubasa's Monologue\",\"href\":\"monolog
