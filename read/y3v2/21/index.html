e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T28a0,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 3\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIN THE NOW completely silent student council room, I sighed without reservation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If we wanted to, we could end this incident with a fair ruling, but...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;They don\u0026apos;t seem to be denying that they hit each other, but it\u0026apos;s clearly strange that they both started to accept punishment after that apparent slip of the tongue, wouldn\u0026apos;t you agree?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKusanagi-kun said he had the upper hand on his opponent, Maki-kun, and admitted to hitting him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOn the other hand, Maki-kun also said that he had the upper hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, there was a considerable difference in the extent of their injuries, and from what I saw, Kusanagi-kun had the advantage.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut... regarding the damage to his face, which was the deciding factor, an unexpected statement slipped out\u0026#x2014;that he hadn\u0026apos;t attacked hard enough to cause such an injury.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFurthermore, even though it was the perfect opportunity for Maki-kun to claim\u0026#x2014;even as a lie\u0026#x2014;that Kusanagi-kun had attacked him excessively to lighten his own blame, he overlooked the slip of the tongue and pretended not to hear it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Student Council President, what was your take on it? To me, it looked like Maki-kun didn\u0026apos;t want to admit defeat and prioritized his pride.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I suppose so. That\u0026apos;s a possibility, but... at first, it definitely looked like he wanted to pin the heavier blame on Kusanagi-kun. So it\u0026apos;s strange that he didn\u0026apos;t pursue that slip of the tongue. He could have claimed that he deliberately held back, but Kusanagi-kun didn\u0026apos;t stop attacking. Couldn\u0026apos;t he have protected his pride that way, too?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I answered, Nanase-san closed her eyes as if deep in thought.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOr perhaps... I tried to think about it from another direction.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Maybe... there\u0026apos;s someone else involved in this assault case.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThinking that, as I recalled their testimonies, I felt as if I was beginning to see a glimpse of the truth.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But Kusanagi-kun was the one who won the fight, wasn\u0026apos;t he? If this was revenge, wouldn\u0026apos;t it only make sense if Kusanagi-kun was the one who got the worst of it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It doesn\u0026apos;t necessarily have to be revenge, does it? It\u0026apos;s possible a third party punished Maki-kun for starting a fight and losing. Not that such a thing should be condoned, of course.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...I see. That\u0026apos;s one way of looking at it. But then it doesn\u0026apos;t explain why Kusanagi-kun wouldn\u0026apos;t report it. Is it because he\u0026apos;s afraid of becoming a target for the person who punished him... perhaps?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What I was just imagining is something similar to that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was understandable that if Maki-kun had been punished by someone like Ryuuen-kun or Housen-kun, even the winner, Kusanagi-kun, would lack the courage to speak up. But it was hard to imagine that they would go all the way to the first-year dorms just for a trivial squabble between freshmen. Besides, if there\u0026apos;d been such a vicious intervention from an upperclassman, there was no way they would\u0026apos;ve so brazenly tried to blame each other in the student council room; they would\u0026apos;ve been instructed to act remorseful and get through the matter without further incident.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThose two showed no signs of anything like that, and what came across for certain was that they were both confident in their fighting skills and very proud. However, they were also unwilling to tell the whole story. I could surmise that much.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But Student Council President\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I know. As far as I\u0026apos;m aware, there aren\u0026apos;t any boys among this year\u0026apos;s first-years who rule their surroundings with violence and fear like Ryuuen-kun or Housen-kun. That\u0026apos;s what you were about to say, wasn\u0026apos;t it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. I can\u0026apos;t think of a single male student who stands out enough to be ruling his class through fear.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWere they just good at hiding, or was it something else...\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI looked through the documents I received from Nanase-san again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShould I try to hear from the first witness who found the two injured...?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOr should I call in Maki-kun and Kusanagi-kun again, after they\u0026apos;ve had more time to cool off?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was also the option of speaking to them individually, but I had a feeling that carelessly wounding their pride wouldn\u0026apos;t lead to a solution.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Say, Nanase-san. Boys can be a bit childish in the way they think, don\u0026apos;t you agree?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hm, yes, I suppose so. I do think they have that side to them, to some extent. In fact, the two of them acted like children the entire time they were in the student council room.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. The problem is, both Kusanagi-kun and Maki-kun think they\u0026apos;re strong. That\u0026apos;s exactly why they were only concerned about who won or lost the fight, refusing to back down an inch and trying to pin all the blame on each other, even in a place where they could be punished by the student council.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What if someone took on both of them at the same time, two boys who are confident in their fighting skills?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You mean their pride was wounded because they lost a two-on-one fight? It\u0026apos;s not out of the question, but would they really be that tight-lipped about it? Couldn\u0026apos;t they have worked together to pin the blame on that single person?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But what if their opponent wasn\u0026apos;t a boy... but a girl... and just one at that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNanase-san, who was listening beside me, looked at me with a startled expression.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That could be it. For two boys who are boasting and insisting they didn\u0026apos;t lose the fight, I can see why they\u0026apos;d be too embarrassed to admit they lost to a high school girl.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis matter could be closed, since the two boys were accepting of their punishment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, if a third party was involved in this fight, that was a clear act of assault.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eConsidering their future here at school, this was a problem I wanted to correct now.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Since neither of them is filing a complaint, we have no choice but to investigate. Nanase-san, if you\u0026apos;re willing, could you help me uncover the truth?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course, Student Council President. But being the president is a lot of work, isn\u0026apos;t it? You\u0026apos;re amazing, Horikita-senpai.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m nothing special. I was told I was exceptional quite often back in middle school, but... Ayanokouji-kun, my brother, Nagumo-senpai... no, Sakayanagi-san and Ichinose-san are the same. Watching them up close, I\u0026apos;m always made keenly aware of it. To people like them, I\u0026apos;m... undoubtedly just another mediocre person...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was pathetic self-deprecation, but I voiced what I honestly felt.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps it was because the way Koenji-kun so easily brushed me off after school was still weighing heavily on my mind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor some reason, Nanase-san\u0026apos;s eyes widened in slight surprise as she stared intently at me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No\u0026#x2014;mediocre. Even so, I think that\u0026apos;s fine. A mediocre Horikita-senpai isn\u0026apos;t bad at all.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hmph... You know, hearing that repeatedly is starting to get on my nerves.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo matter how I looked at it, it sounded as though she were making a fool of me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;W-Wha\u0026#x2014;!? I-I\u0026apos;m so sorry! I think Student Council President Horikita is very admirable!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNanase-san lost her composure, looking truly panicked.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s too late to try and smooth things over now.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter pretending to be angry, I smiled and gently placed my hand on her shoulder.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll need you to lend me your strength for a while.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Y-Yes. Of course.\u0026quot;\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 3\",\"volumeId\":\"y3v2\",\"chapterIndex\":21,\"prevChapter\":{\"volumeId\":\"y3v2\",\"chapter\":20,\"title\":\"Part 2\"},\"nextChapter\":{\"volumeId\":\"y3v2\",\"chapter\":22,\"title\":\"Part 4\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 2\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Nanase Tsubasa's Monologue\",\"href\":\"monologu
