d her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m joking. You can come in.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then you should\u0026apos;ve said so from the beginning.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIbuki returned and entered Horikita\u0026apos;s room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Let me guess\u0026#x2014;you\u0026apos;re planning to eat dinner here anyway, right? It\u0026apos;s the end of the month, after all.\u0026#x201d;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Quit arbitrarily jumping to conclusions.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then am I wrong?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;Well, not this time.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter letting Ibuki in, Horikita began preparing tea.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Your timing is still a little off for having dinner, so just relax for a while. I\u0026apos;ll call Kushida-san over later too.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Her too? Every time, she just keeps going on and on. It\u0026apos;s annoying.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDue to having lots of school information, Kushida had no shortage of topics, and she would go on talking for a lengthy period of time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re annoying too, you know.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlthough in a different way, Horikita pointed out that Ibuki was the same.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? Don\u0026apos;t lump me together with her.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDespite saying this, about an hour later, Kushida also arrived at Horikita\u0026apos;s room to join them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIbuki, Horikita, and Kushida.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRecently, these three had been spending more time together, even though it should\u0026apos;ve been an unpleasant time for Ibuki, or rather, for each of them here.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If it weren\u0026apos;t for the free meals, I wouldn\u0026#x2019;t have come to a place like this\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIbuki muttered quietly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Did you say something?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHorikita turned around from the kitchen, but Ibuki bluntly answered that it was nothing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen, she flopped down on the floor.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile staring at the ceiling of Horikita\u0026apos;s room, which she\u0026#x2019;d become quite familiar with, she thought\u0026#x2026;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat she shouldn\u0026#x2019;t keep living like this.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat she couldn\u0026apos;t keep hanging around here.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat\u0026#x2019;s right. Ibuki didn\u0026apos;t want to admit it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe fact that she was getting closer to Horikita and Kushida, whom she both detested.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe fact that she\u0026#x2019;d begun to understand that this was becoming a comfortable space for her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSo it would be better to distance herself before it was too late.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBeing alone would surely make her happier in the end, after all.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eThat\u0026apos;s the kind of person I am\u003c/em\u003e, she thought.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if she didn\u0026apos;t distance herself, Horikita and Kushida would eventually leave her anyway.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe understood this.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was only natural, given her difficult personality.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe should leave immediately.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe should never come back.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThough that was what she momentarily thought, as soon as the delicious smell of food began wafting through the air, she stopped thinking about it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince she was broke right now, it couldn\u0026apos;t be helped.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter all, she thought that distancing herself could wait until another time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIbuki\u0026apos;s irritation mysteriously disappeared along with the meal.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 45\",\"volumeId\":\"ss-y3-v1\",\"chapterIndex\":45,\"prevChapter\":\"$undefined\",\"nextChapter\":\"$undefined\",\"toc\":[{\"label\":\"Ibuki Mio's Short Story: Concern?\",\"href\":\"ss-5.xhtml\",\"index\":49},{\"label\":\"Shiraishi Asuka’s Short Story: The Secrets She Harbors\",\"href\":\"ss-2.xhtml\",\"index\":46},{\"label\":\"Morishita Ai’s Short Story: Gatling Gun\",\"href\":\"ss-3.xhtml\",\"index\":47},{\"label\":\"Shiraishi Asuka's Short Story: An Extra Pair of Ears\",\"href\":\"ss-4.xhtml\",\"index\":48},{\"label\":\"Haruka Hasebe's Short Story: A Pillar of Support\",\"href\":\"ss-6.xhtml\",\"index\":50},{\"label\":\"Guidebook Short Story: Mock Date\",\"href\":\"ss-7.xhtml\",\"index\":51},{\"label\":\"Guidebook Short Story: Ever Since That Time...\",\"href\":\"ss-8.xhtml\",\"index\":52}],\"volumeTitle\":\"Short Stories: Volume 1\",\"detailsLink\":\"/select/year-3/ss-y3-v1\",\"returnLink\":\"/select/year-3?contentType=shortStories\",\"currentSpineIndex\":45,\"nextVolumeLink\":\"/select/year-3/ss-y3-v2\",\"nextVolumeTitle\":\"Short Stories: Volume 2\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"met
