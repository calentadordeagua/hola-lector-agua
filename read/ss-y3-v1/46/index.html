u003eDid he decide to transfer to become a savior, or is there still a side to him we haven\u0026apos;t seen?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEither way, for Shiraishi, this was a matter beyond her expectations.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This is troubling, isn\u0026apos;t it?\u0026#x201c;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOnly after speaking these words did she realize she\u0026#x2019;d been troubled.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWhat do I want?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNow that she knew about Ayanokouji\u0026#x2019;s transfer, and that fact was seeping into reality, she needed to think.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAn inexpressible emotion\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo, that wasn\u0026apos;t accurate.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe understood, but pretended not to.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;There\u0026#x2019;s a\u0026#x2026; mountain of problems, isn\u0026#x2019;t there?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eStarting up her tablet, she grabbed the pen and began to draw a person.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe very person at the center of this commotion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat kind of expression, what kind of gesture would be better\u0026#x2014;she didn\u0026#x2019;t really know the answers to these questions yet.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom now on, throughout the upcoming school year, she\u0026apos;d surely become better and better at drawing him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe\u0026apos;d surely hear his voice, and come to know.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, but that\u0026apos;s\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe was thinking about it again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe had to avoid thinking about it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eThis secret\u0026#x2026; these feelings mustn\u0026apos;t be known to others.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi made a mental note of this.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEmotions she abandoned years ago.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWhy, now of all times, is this happening?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;I am\u0026#x2026; foolish, aren\u0026#x2019;t I?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eImmediately after she uttered these words of self-reproach to herself, she reacted to the sound of the door opening, and Shiraishi was surprised to see someone unexpected standing at the entrance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Good morning.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat person spotted Shiraishi and greeted her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Good morning to you, too.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter returning the greeting, Shiraishi calmed herself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe deleted the half-finished drawing on her tablet with natural motion and pretended to study.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I didn\u0026apos;t expect someone to be here already. You\u0026apos;re rather early.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;Yes, I woke up unusually early today. But you\u0026apos;re early too, Ayanokouji-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Since I\u0026apos;ve switched classes, it\u0026apos;s like I\u0026apos;m a transfer student from a different school. Rather than being welcomed, I thought it\u0026apos;d be better to be the one doing the welcoming.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s an interesting coincidence\u0026#x2014;two people who are early risers sitting next to each other in such a large, empty classroom.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Maybe.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe had a voice with little inflection.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven so, it wasn\u0026apos;t as though it was completely devoid of emotion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi listened intently, letting Ayanokouji\u0026#x2019;s voice seep into her body, familiarizing it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSilence fell upon them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWanting to hear more of his voice, Shiraishi spoke to him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why did you decide to transfer to this class, Ayanokouji-kun?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi continued after a short pause.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I can\u0026apos;t believe you\u0026apos;d choose to drop to a lower class after finally making it to Class A.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That might be true under normal circumstances.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe was ever so calm.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOr perhaps it was to hide his emotions.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt his voice, as elusive as clouds, Shiraishi almost wore her delight on her sleeves.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If it\u0026apos;s not normal, then\u0026#x2026; why did you decide to transfer?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBecause of that, she couldn\u0026apos;t help but continue.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven while knowing she shouldn\u0026apos;t overstep, she ended up doing so.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile faintly recalling her own bitter past.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile deeply reflecting that she must never repeat her mistakes.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Shiraishi Asuka’s Short Story: The Secrets She Harbors\",\"volumeId\":\"ss-y3-v1\",\"chapterIndex\":46,\"prevChapter\":{\"volumeId\":\"ss-y3-v1\",\"chapter\":49,\"title\":\"Ibuki Mio's Short Story: Concern?\"},\"nextChapter\":{\
