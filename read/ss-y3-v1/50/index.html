d about the transfer.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eCould it be\u0026#x2026;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;My fault?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI couldn\u0026apos;t help but think so.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI resented Ayanokouji-kun because Airi had been expelled.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI thought he had trampled on her feelings and those of our group.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t know Ayanokouji-kun\u0026apos;s true intentions.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut to survive in this school, sacrifices sometimes had to be made.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI thought I had learned that much.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wasn\u0026apos;t particularly surprised that Ayanokouji-kun had chosen to transfer.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;How arrogant of me, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t because I saw Ayanokouji-kun as an enemy or wanted to start over with the group.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t as if I got tired of such convenient excuses.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAyanokouji-kun wouldn\u0026apos;t transfer for such reasons.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSurely, it was beyond my understanding.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe must\u0026apos;ve had his own reasons.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt 1 AM, my computer screen automatically changed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA cheap title appeared, and two male hosts were shown amid the audience\u0026apos;s applause.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA comedy duo that was becoming a bit famous.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDespite having school in the morning, this was why I stayed up late.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe online show \u0026apos;Idol in the Making\u0026apos;\u0026#xa0;was broadcast every Thursday at this time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIdols were invited to the studio, where they tackled topics presented by the show while participating in an online popularity vote. Every two months, the top-ranked participant would graduate from the show and secure new work.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eConversely, the lowest-ranked would drop out and be replaced by a new candidate.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed to be a long-running show, having passed its third anniversary.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had only started watching it a few months ago.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo see the idol in the making who had joined the show.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTheir numbers were pinned on their chests in order of age.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy favorite idol was wearing the number nine.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026quot;Let\u0026apos;s get right to it and announce the first topic! Ta-da! The steaming hot oden reaction battle!\u0026quot;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA crudely written flip chart was turned over.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eLast time, when she first appeared on an online show, she was barely known. However, she had managed to secure sixth place in the popularity vote, which was a promising start.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer conversational skills were admittedly not great, but her earnestness and dedication to every challenge had captured some fans\u0026apos; hearts.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI watched the screen intently, waiting for her turn.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe nervously watched the previous idols\u0026apos; reactions.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is it okay if I talk a little?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI started muttering to myself and continued.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah, that\u0026apos;s right. He transferred.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis was also a monologue. Knowing it wouldn\u0026apos;t reach her, I spoke to the girl through the screen. A considerable amount of time had passed since we last met.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut her feelings on the other side of the screen hadn\u0026apos;t changed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI remembered last week\u0026apos;s topic.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026apos;Please confess who your first love was.\u0026apos;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe confessed her true feelings with a shy expression.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was about someone she met in her first year of high school, and whom she still had a crush on.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom the outside, it could\u0026apos;ve seemed like a painful event, a past she wouldn\u0026apos;t want to remember.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYet, instead of being gloomy, that girl had started walking forward.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI, who should\u0026apos;ve been leading and holding her hand, was left behind before I knew it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe was helping me. From afar, she waved and smiled at me, telling me to walk.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen I had to walk.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs a friend worthy of her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eStill, her impulsive remarks were risky and made everyone around her panic.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs an idol, admitting to having a crush was still immature.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut that was okay.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBecause she was still an idol in training.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd a crush is still safe, right?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Maybe you should\u0026apos;ve shown this side of yourself to Ayanokouji-kun sooner...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer striving figure.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer bright smile.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKnowing this, could it have changed Ayanokouji-kun\u0026apos;s feelings about his class?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;No.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eProbably not.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn Ayanokouji-kun\u0026apos;s heart, her presence must\u0026apos;ve vanished.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf it were to sprout again, it would be after zero turned into one.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNot the zero from Advanced Nurturing High School, when you couldn\u0026apos;t do anything.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut the idol who was fighting hard on the other side of this screen, transformed into one.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wish she could say this back then\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026apos;Thanks to that time, I\u0026apos;ve become stronger. I\u0026apos;m not interested in you anymore, though.\u0026apos;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen, even Ayanokouji-kun would be taken aback.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No\u0026#x2026; she wouldn\u0026apos;t say something like that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe would definitely show her sincere gratitude.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNot as a two-faced idol, but as a clumsy idol who only fought honestly and directly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Keep going\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI cheered her on through the screen.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eNow, I can only see her through the screen. She can\u0026apos;t hear my voice.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eMy voice won\u0026apos;t reach her.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eBut I won\u0026apos;t stop.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Keep going\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOver and over.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI\u0026apos;d keep cheering.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll also work hard for one more year\u0026#x2026; so you won\u0026apos;t laugh at me when we finally meet on the outside, okay?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had long been overtaken by her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSo, no matter what, I must not stop.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had to chase after her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNow wasn\u0026apos;t the time to be discouraged by Ayanokouji-kun\u0026apos;s actions.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eLet\u0026apos;s work hard together.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eAnd in one year, I\u0026apos;ll definitely go to meet you\u0026#x2014;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Keep going, Airi.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI called her name and smiled at her through the screen.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Haruka Hasebe's Short Story: A Pillar of Support\",\"volumeId\":\"ss-y3-v1\",\"chapterIndex\":50,\"prevChapter\":{\"volumeId\":\"ss-y3-v1\",\"chapter\":48,\"title\":\"Shiraishi Asuka's Short Story: An Extra Pair of Ears\"},\"nextChapter\":{\"volumeId\":\"ss-y3-v1\",\"chapter\":51,\"title\":\"Guidebook Short Story: Mock Date\"},\"toc\":[{\"label\":\"Ibuki Mio's Short Story: Concern?\",\"href\":\"ss-5.xhtml\",\"index\":49},{\"label\":\"Shiraishi Asuka’s Short Story: The Secrets She Harbors\",\"href\":\"ss-2.xhtml\",\"index\":46},{\"label\":\"Morishita Ai’s Short Story: Gatling Gun\",\"href\":\"ss-3.xhtml\",\"index\":47},{\"label\":\"Shiraishi Asuka's Short Story: An Extra Pair of Ears\",\"href\":\"ss-4.xhtml\",\"index\":48},{\"label\":\"Haruka Hasebe's Short Story: A Pillar of Support\",\"href\":\"ss-6.xhtml\",\"index\":50},{\"label\":\"Guidebook Short Story: Mock Date\",\"href\":\"ss-7.xhtml\",\"index\":51},{\"label\":\"Guidebook Short Story: Ever Since That Time...\",\"href\":\"ss-8.xhtml\",\"index\":52}],\"volumeTitle\":\"Short Stories: Volume 1\",\"detailsLink\":\"/select/year-3/ss-y3-v1\",\"returnLink\":\"/select/year-3?contentType=shortStories\",\"currentSpineIndex\":50,\"nextVolumeLink\":\"/select/year-3/ss-y3-v2\",\"nextVolumeTitle\":\"Short Stories: Volume 2\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>
