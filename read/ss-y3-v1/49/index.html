 last long, and gradually, she began to feel stressed. It was because Horikita had stopped cooking and abandoned her duty of supporting and maintaining her, the cash-strapped Ibuki\u0026apos;s, stomach\u0026apos;s peace and stability.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRegardless of whether Ibuki visited her room or called her, she received no proper response.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd today, Class A had been defeated in the special exam.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile this was good news for Ibuki\u0026apos;s class, personally, she couldn\u0026apos;t honestly be happy about it. Horikita would only become more dejected.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSo, who knew when Horikita would be able to provide meals for her again?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;Why do I have to act so considerate?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was after school. Growing irritated with Horikita, who hadn\u0026apos;t emerged from the school building, Ibuki paced back and forth near the entrance, waiting. Once she came out, she\u0026apos;d give her a sharp stimulus to cheer her up, and then make her cook.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSuch one-sided thoughts ran laps inside her mind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut no matter how long she waited, there was no sign of Horikita coming out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe\u0026apos;d gone to check the shoe lockers once, but Horikita\u0026apos;s shoes were still there, so she hadn\u0026apos;t gone home.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Come out already. How concerned do you plan to make\u0026#x2026; no, no, I\u0026apos;m not concerned.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen a strange emotion surfaced, she pushed it out of her mind. Her thoughts were getting weird because she hadn\u0026apos;t eaten anything delicious for a while. That was her conclusion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter that, perhaps another thirty minutes of going back and forth in the same place\u0026#x2026;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah\u0026#x2026; she\u0026apos;s coming out.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHorikita, whom she\u0026apos;d been waiting for, finally emerged from the school building.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe looked lifeless from behind, and as expected, Ibuki couldn\u0026apos;t feel a speck of spirit or vigor.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026apos;You shouldn\u0026apos;t kick anyone, but if you absolutely must kick someone, then I suppose there\u0026#x2019;s no other choice than to find someone who would enjoy being kicked or someone who would benefit from being kicked. If such an odd person exists, that is.\u0026apos;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs she stared at her back, Ibuki remembered what Katsuragi had once told her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBy the time she recalled it, she was already running on impulse.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe only thing she could do right now\u0026#x2014;that is, to deliver a merciless kick to Horikita\u0026apos;s back.\u003c/p\u003e"])</script><script>self.__next_f.p
