le=\"text-align: left\"\u003eThe monthly Private Points allowance was more than sufficient as pocket money for a second-year high school student. Because of this, normally, saving money shouldn\u0026#x2019;t be difficult.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, Ibuki had a tendency to spend everything she got without thinking of the consequences, and as a result, she was always tight on finances. That was precisely why, recalling how the time she\u0026#x2019;d been looking forward to was ruined, her irritation began to build up again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile Private Points would be replenished with each new month, naturally, it was always a struggle when she got to the end of each month.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eHow would I get through today, how would I get through tomorrow\u003c/em\u003e\u0026#x2014;she was forced to confront this sort of battle.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIf only the movie had been satisfying\u0026#x2014;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe emotions she tried to suppress started bubbling up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ahh, this is so annoying.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eHow should I alleviate my annoyance?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHarboring this sentiment, what Ibuki found was a certain object.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat being, a trash can placed in \u0026#xa0;Keyaki Mall.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe approached it without concern for the people around and kicked it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe thought kicking it would make her feel a little better after all.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever\u0026#x2026;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThough it wobbled, since it contained more trash than she\u0026#x2019;d expected, it didn\u0026#x2019;t fall over.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was also because it was somewhat of a half-hearted kick; it wasn\u0026apos;t weak, but it wasn\u0026apos;t strong either.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;Are you trying to irritate me too?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs if mocking her, the trash can only slightly shifted in position, standing there with a faux innocent look.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe action Ibuki thought would help her vent actually had the opposite effect.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat started as just wanting to kick it shifted to wanting to knock it over.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf she could dramatically spill its contents, she\u0026apos;d surely feel better.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You little\u0026#x2014;!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis time, stronger, faster than before.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe imagined the trash can as someone she disliked.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe was about to deliver a kick with enough force such that Ayanokouji would definitely be knocked over\u0026#x2026; or rather, knock the trash can over.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What are you doing, Ibuki?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust before she completed the motion, a somewhat angry male voice reached her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer body froze, and she turned toward the voice.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere stood Katsuragi with his arms crossed, frowning with a puzzled expression.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why are you here\u0026#x2026;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What do you mean, \u0026apos;why\u0026apos;? There\u0026apos;s nothing strange about me walking around Keyaki Mall on my day off, is there?\u0026#x201d;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, that\u0026apos;s true, but\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You seem pretty irritated from what I can see, but I can\u0026#x2019;t say kicking trash cans is very commendable. If you don\u0026#x2019;t strive to act with moderation, it won\u0026#x2019;t benefit our class.\u0026#x201d;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What do you mean \u0026apos;benefit our class\u0026apos;? What\u0026apos;s the big deal if I kick a trash can over a little?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe displayed an attitude indicating she didn\u0026apos;t think she did anything wrong.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn response, Katsuragi slightly closed the distance between them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you engage in behavior unbecoming of a student and the school discovers it, you\u0026#x2019;ll receive a negative evaluation. Whether it\u0026apos;s a weekday, weekend, or even spring break, the consequences remain the same. I thought you\u0026#x2019;d have more than sufficiently learned that during these two years.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Acting so high and mighty\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;High and mighty? I wasn\u0026apos;t being high and mighty. I merely stated common sense, decency expected of a student. Besides, Ibuki, you\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs Katsuragi began his lengthy lecture, Ibuki didn\u0026#x2019;t even try to conceal her tongue-clicking.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe feeling that she had been caught by a troublesome person began to dominate her thoughts.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSeeing how Katauragi continued to ramble on, Ibuki interrupted him with a wave of her hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes, yes. I was wrong, okay, okay. Then, bye\u0026#x2026; \u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs if to run away, Ibuki began walking and attempted to pass by Katsuragi, but then she was grabbed by the arm.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What are you doing?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The trash can didn\u0026apos;t fall over, but it\u0026apos;s out of position. You need to fix that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Haa? So what about its position? As if anyone cares about that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;At the very least, I care. And the fact that I care means the school might care as well.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSaying this, Katsuragi pointed at a surveillance camera.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re seriously such a stickler. The school isn\u0026apos;t watching us all the time, much less at a place like this. Or rather, who cares about the position of a trash can?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course, I would hope that\u0026apos;s the case. However, it\u0026apos;s better safe than sorry.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs Katsuragi spoke, he brought Ibuki back to the trash can.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;How ridiculous.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith the desire to be released quickly taking priority, Ibuki reluctantly picked up the trash can.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There, is this good enough?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, it\u0026apos;s not. The original position was about twenty centimeters more to the right.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Haaa?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;About twenty centimeters more to the right.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKatsuragi repeated what he said, instructing her to return the trash can to its proper place.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlthough Ibuki was getting irritated again, she lifted the trash can with an exasperated sigh and moved it about twenty centimeters.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is. This. Okay. Now!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. Well, this should be good enough.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSatisfied, Katsuragi turned toward the surveillance camera and gave a slight bow.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you stupid?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThough these words involuntarily escaped from her mouth at his overly courteous behavior, Katsuragi was unbothered and began walking away.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIbuki was about to watch him leave, but there was something she was caught up on.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Haven\u0026apos;t you already accomplished your goal?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Goal?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sakayanagi lost to Ryuuen and dropped out of school. There\u0026#x2019;s no need for you to be so eager anymore, is there?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;I see. Certainly, that was one of my goals. However, I would\u0026apos;ve preferred accomplishing it with my own hands though\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKatsuragi stopped, folded his arms, and reflected on the end-of-year special exam by himself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But that doesn\u0026apos;t mean my goals have disappeared. There\u0026#x2019;s also my goal to graduate from Class A.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So you want those privileges too, huh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Naturally. Those who don\u0026apos;t desire such privileges are probably in the minority. However, that isn\u0026apos;t the only important thing. Not just me on my own, but winning Class A with all of our classmates\u0026#x2014;that\u0026apos;s what\u0026apos;s critical.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKatsuragi wasn\u0026apos;t originally in Ryueen\u0026#x2019;s class.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn fact, the time they spent as adversaries was still slightly longer than their current relationship.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut right now, he answered without any embarrassment that he was thinking about his current class more than anyone else. At this demeanour, Ibuki felt it was a false goodwill, in other words, it was faux benevolence\u003csup id=\"fnref-1-0a7731ae-fa81-5a95-b377-0ef302a62099\"\u003e\u003ca class=\"footnote-ref\" href=\"#fn-1-0a7731ae-fa81-5a95-b377-0ef302a62099\" data-ref=\"1\" epub:type=\"noteref\"\u003e[1]\u003c/a\u003e\u003c/sup\u003e.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you serious?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course, I\u0026apos;m serious.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn other words, it wasn\u0026apos;t sanctimonious.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe firmly answered that he currently had the resolve to move forward with Ryueen and the class.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is that why you\u0026apos;re going around teaching those idiots how to study?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The expression, \u0026apos;Going around teaching,\u0026apos; isn\u0026apos;t quite accurate. I also respond to their requests for help; there\u0026apos;s that too. I can\u0026apos;t leave people like that alone. It\u0026apos;s in my nature, you see.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So if someone asks for help, you\u0026apos;ll help them?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well\u0026#x2026; I suppose there\u0026apos;s no harm in putting it that way.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then let me kick you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t understand what you mean.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s exactly what it sounds like. I\u0026apos;m feeling incredibly irritated right now, so I\u0026#x2019;m really itching to kick something, you see.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What a troublesome personality. However, unfortunately, I\u0026apos;m not inclined to let you kick me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then who should I kick?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You shouldn\u0026apos;t kick anyone, but if you absolutely must kick someone, then I suppose there\u0026#x2019;s no other choice than to find someone who would enjoy being kicked or someone who would benefit from being kicked. If such an odd person exists, that is.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see\u0026#x2026; well, that makes sense.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Apart from that, if there\u0026apos;s anything else I can help you with, I\u0026apos;m willing to lend a hand.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hmm\u0026#x2026;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSetting aside whether Katsuragi\u0026apos;s actions were benevolent or faux benevolent, it was unmistakable that he was considerate and looked after people.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHaving reached this peculiar conclusion, Ibuki made a proposal.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then buy me a meal.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;How did we go from kicking and not kicking to this?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You said you\u0026apos;d help me, right? I\u0026apos;m in trouble \u0026apos;cause I don\u0026apos;t have any money. Look.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe displayed her Private Points balance on her phone screen.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;You should have more than this even when you entered school.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026#x2019;m bragging, but I\u0026#x2019;m seriously broke.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t brag about that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So with that said, feed me something. Eating something delicious should help release my stress.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see, I understand.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKatsuragi folded his arms, gave a nod, then opened his eyes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I refuse.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Wait, why? Aren\u0026apos;t you supposed to extend a helping hand to troubled classmates?!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Only if they\u0026apos;re truly troubled.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Come on, I\u0026apos;m genuinely troubled. I have almost no Private Points left!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you\u0026apos;re broke, you can eat the wild plants set. The school provides proper relief measures. It\u0026apos;s not like you\u0026apos;re in a state where you can\u0026apos;t eat anything. Besides, your Private Points will be replenished in April. I don\u0026apos;t see any need for me to help at this point.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFaced with Katsuragi\u0026apos;s frank attitude, Ibuki glared at him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But I want to eat something better.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then from next month onward, you should straighten yourself up and learn how to save a little.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I already am saving here. It\u0026#x2019;s just that girls have various expenses\u0026#x2014;it can\u0026#x2019;t be helped.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe made an excuse that didn\u0026apos;t apply to her at all\u0026#xa0;to dodge the issue.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see. Then, as a man, there\u0026apos;s not much I can help with. You should seek advice from another woman who knows how to save money.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf she could ask such a person for advice, she wouldn\u0026apos;t be struggling in the first place.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe tried to argue back, but Katsuragi had already started walking away.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe regretted even momentarily thinking that he might\u0026apos;ve been considerate and looked after people.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What\u0026apos;s with him\u0026#x2026;? Ah jeez, getting angry made me hungry\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter glaring at him until his back disappeared from view, Ibuki held her stomach.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Gonna go home\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDeciding there was no point in staying at Keyaki Mall, she immediately returned to the dormitory.\u003c/p\u003e\u003chr class=\"footnote-rule\"/\u003e\u003col class=\"footnotes\"\u003e\u003cli data-id=\"0a7731ae-fa81-5a95-b377-0ef302a62099\" data-ref=\"1\" class=\"footnote first-footnote\" id=\"fn-1-0a7731ae-fa81-5a95-b377-0ef302a62099\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003ca class=\"footnote-backref\" href=\"#fnref-1-0a7731ae-fa81-5a95-b377-0ef302a62099\"\u003e[1]: \u003c/a\u003eThe raw is \u0026#x507d;\u0026#x308a;\u0026#x306e;\u0026#x5584;\u0026#x610f;\u0026#x3001;\u0026#x3064;\u0026#x307e;\u0026#x308a;\u0026#x507d;\u0026#x5584;, which is somewhat wordplay. The former, \u0026quot;\u0026#x507d;\u0026#x308a;\u0026#x306e;\u0026#x5584;\u0026#x610f;,\u0026quot; which is translated here as \u0026quot;false goodwill,\u0026quot; is literally just stating the definition of \u0026quot;\u0026#x507d;\u0026#x5584;\u0026quot; (notice how both these characters are in the former). \u0026quot;\u0026#x507d;\u0026#x5584;\u0026quot; also often gets translated as \u0026quot;hypocrisy,\u0026quot; but that\u0026apos;s not accurate, and it doesn\u0026apos;t capture the word\u0026apos;s meaning well, which is why it\u0026apos;s translated as \u0026quot;faux belevolence\u0026quot; here.\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e\u003ch2 class=\"heading_2\"\u003ePart 1\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eINSTEAD OF RETURNING to her own room, she visited a certain different room and firmly knocked on its door.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What business do you have here?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe one who came out looking annoyed was a student from another class, Horikita Suzune.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Can I come in for a bit?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What if I say no?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;Then fine.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIbuki immediately turned her back at her dissatisfied attitude, but Horikita quickly stopped her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m joking. You can come in.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then you should\u0026apos;ve said so from the beginning.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIbuki returned and entered Horikita\u0026apos;s room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Let me guess\u0026#x2014;you\u0026apos;re planning to eat dinner here anyway, right? It\u0026apos;s the end of the month, after all.\u0026#x201d;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Quit arbitrarily jumping to conclusions.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then am I wrong?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;Well, not this time.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter letting Ibuki in, Horikita began preparing tea.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Your timing is still a little off for having dinner, so just relax for a while. I\u0026apos;ll call Kushida-san over later too.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Her too? Every time, she just keeps going on and on. It\u0026apos;s annoying.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDue to having lots of school information, Kushida had no shortage of topics, and she would go on talking for a lengthy period of time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re annoying too, you know.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlthough in a different way, Horikita pointed out that Ibuki was the same.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? Don\u0026apos;t lump me together with her.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDespite saying this, about an hour later, Kushida also arrived at Horikita\u0026apos;s room to join them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIbuki, Horikita, and Kushida.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRecently, these three had been spending more time together, even though it should\u0026apos;ve been an unpleasant time for Ibuki, or rather, for each of them here.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If it weren\u0026apos;t for the free meals, I wouldn\u0026#x2019;t have come to a place like this\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIbuki muttered quietly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Did you say something?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHorikita turned around from the kitchen, but Ibuki bluntly answered that it was nothing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen, she flopped down on the floor.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile staring at the ceiling of Horikita\u0026apos;s room, which she\u0026#x2019;d become quite familiar with, she thought\u0026#x2026;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat she shouldn\u0026#x2019;t keep living like this.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat she couldn\u0026apos;t keep hanging around here.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat\u0026#x2019;s right. Ibuki didn\u0026apos;t want to admit it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe fact that she was getting closer to Horikita and Kushida, whom she both detested.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe fact that she\u0026#x2019;d begun to understand that this was becoming a comfortable space for her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSo it would be better to distance herself before it was too late.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBeing alone would surely make her happier in the end, after all.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eThat\u0026apos;s the kind of person I am\u003c/em\u003e, she thought.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if she didn\u0026apos;t distance herself, Horikita and Kushida would eventually leave her anyway.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe understood this.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was only natural, given her difficult personality.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe should leave immediately.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe should never come back.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThough that was what she momentarily thought, as soon as the delicious smell of food began wafting through the air, she stopped thinking about it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince she was broke right now, it couldn\u0026apos;t be helped.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter all, she thought that distancing herself could wait until another time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIbuki\u0026apos;s irritation mysteriously disappeared along with the meal.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 44\",\"volumeId\":\"ss-y3-v1\",\"chapterIndex\":44,\"prevChapter\":\"$undefined\",\"nextChapter\":\"$undefined\",\"toc\":[{\"label\":\"Ibuki Mio's Short Story: Concern?\",\"href\":\"ss-5.xhtml\",\"index\":49},{\"label\":\"Shiraishi Asuka’s Short Story: The Secrets She Harbors\",\"href\":\"ss-2.xhtml\",\"index\":46},{\"label\":\"Morishita Ai’s Short Story: Gatling Gun\",\"href\":\"ss-3.xhtml\",\"index\":47},{\"label\":\"Shiraishi Asuka's Short Story: An Extra Pair of Ears\",\"href\":\"ss-4.xhtml\",\"index\":48},{\"label\":\"Haruka Hasebe's Short Story: A Pillar of Support\",\"href\":\"ss-6.xhtml\",\"index\":50},{\"label\":\"Guidebook Short Story: Mock Date\",\"href\":\"ss-7.xhtml\",\"index\":51},{\"label\":\"Guidebook Short Story: Ever Since That Time...\",\"href\":\"ss-8.xhtml\",\"index\":52}],\"volumeTitle\":\"Short Stories: Volume 1\",\"detailsLink\":\"/select/year-3/ss-y3-v1\",\"returnLink\":\"/select/year-3?contentType=shortStories\",\"currentSpineIndex\":44,\"nextVolumeLink\":\"/select/year-3/ss-y3-v2\",\"nextVolumeTitle\":\"Short Stories: Volume 2\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:de
