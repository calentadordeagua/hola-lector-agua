: left\"\u003eI could only be convinced after looking at the article that came up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile admiring the photos in the article alone, I heard\u0026#x2026;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Good morning, Ayanokouji-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Morning.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe ones who appeared in the rest area were Ichinose and Amikura. They seemed to have come to the gym.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh, that\u0026apos;s a cute photo. It\u0026apos;s a red panda, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAmikura squinted and asked, having seen my phone screen.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah. I was just doing some research.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI turned off the screen as if to dodge the question, but Ichinose seemed to have some insight.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is it related to the exam question? Ayanokouji-kun, you got it wrong, didn\u0026apos;t you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was the special exam from the other day.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a memorable moment, so there was no way they would\u0026#x2019;ve forgotten, even if it was about another class.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Now that you mention it, you got the tapioca question wrong too. Are you surprisingly that ignorant of the world?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHearing Ichinose\u0026apos;s words, Amikura also seemed to understand and asked.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I can\u0026apos;t deny it. Probably because I hardly ever watch TV.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI offered the most common excuse, but both of them just smiled wryly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Honestly, I didn\u0026apos;t think not liking TV would backfire like that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is that really the problem? These things garnered quite a buzz on the internet too, didn\u0026apos;t they?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAmikura expressed her doubt; perhaps my not-watching-TV excuse wasn\u0026#x2019;t persuasive enough.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We\u0026apos;ve discovered an unexpected weakness, huh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIchinose chuckled at my confused expression.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRight after, Akiyama, a member of the gym staff, appeared and called out to Ichinose.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere seemed to be a mistake in some paperwork she had filled out, and she was asked to rewrite it, so they both headed toward the counter.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey\u0026#x2019;d probably be back soon, but for the moment, it was just me and Amikura left to ourselves.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFeeling it\u0026#x2019;d be strange to leave just then, I decided to either wait until Ichinose came back or leave on my own once Amikura left.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince we came to the gym together, Amikura probably intended to wait for Ichinose to return as well.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI sat down on a chair, leaving one empty next to me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Honami-chan\u0026#x2019;s really changed, huh? It\u0026apos;s like, unimaginable when you think about how she was like a few months ago\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is that so?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIndeed. Recently, Ichinose started showing a side of herself that she hadn\u0026apos;t before.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut to say it was achieved after only a few months was an exaggeration.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t surprising, as the changes in Ichinose that Amikura mentioned weren\u0026apos;t about the current situation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It was right after our second-year deserted island exam ended, and the second term had just started, I think.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAmikura began to speak, smiling as if recalling something funny.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Back then, Honami-chan seemed unstable, or rather, she was often lost in thought.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The deserted island exam, huh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHearing that, I caught up with Amikura\u0026apos;s story.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was when I received an unexpected confession from Ichinose and told her about Kei.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eConsidering Ichinose\u0026apos;s feelings, it wasn\u0026apos;t surprising that she seemed unstable to others.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Right around that time, a little incident happened in the class\u0026#x2026; Oh, but keep this story between us, okay? Don\u0026apos;t tell Honami-chan.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eI don\u0026apos;t intend to tell, but it felt like this might turn into something I\u0026apos;d have to bear a bit of responsibility for hearing.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t think he had any malicious intentions, but there was a time when a boy in the class accidentally overheard a rumor that Honami-chan might like you. Well, it all started with a message that Honami-chan sent by mistake\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eApps were convenient since you could send messages with just a press of a button. Therefore, it wasn\u0026#x2019;t uncommon to mistakenly send a message to someone other than the intended recipient due to a misclick. Even if you could delete your message, sometimes the message gets seen before it can be retracted.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor a while after the deserted island exam, Ichinose was going through a mentally unstable period.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wouldn\u0026apos;t be surprising if she made a small mistake.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I didn\u0026apos;t see the text myself, but I think it was something like, \u0026apos;I want to calm down and talk. Can we meet in person?\u0026apos; Taken out of context, it sounds quite meaningful, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah, that\u0026apos;s true. So, the classmate Ichinose mistakenly sent her message to was a boy?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Different class. Though, the problem lies in who she accidentally sent it to. That person was Ishizaki-kun, and during the break, he came to our class and boldly asked, \u0026apos;What does this message mean?\u0026apos; while showing the screen.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eApparently, that caused a stir. The fact that the misdirected recipient was Ishizaki meant the message wasn\u0026apos;t taken too seriously, which was a relief, but on the other hand, it was problematic that he thoughtlessly came to check the message with the person involved.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, it wasn\u0026#x2019;t unusual for Ichinose to be on casual messaging terms with Ishizaki.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Honami-chan was flustered but immediately corrected it, telling him it was a missent message. Ishizaki-kun was convinced and went back to his class, but the difficulties was what followed. The fact that it was a mistakenly sent message meant that she intended to send that important message to someone else.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat might\u0026#x2019;ve sparked the rumors among the boys in the class.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But why does that lead to me?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;d understand if you saw it, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor some reason, I was met with a somewhat forceful smile.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, that\u0026apos;s limited to those with sharp intuition\u0026#x2026; The boys started making noise for a different reason. Ayanokouji-kun, maybe it\u0026#x2019;s because your \u0026apos;A\u0026apos; and Ishizaki-kun\u0026apos;s \u0026apos;I\u0026apos; are close in the contact list\u003csup id=\"fnref-1-f822494b-d425-5685-aeba-590125f8ea5a\"\u003e\u003ca class=\"footnote-ref\" href=\"#fn-1-f822494b-d425-5685-aeba-590125f8ea5a\" data-ref=\"1\" epub:type=\"noteref\"\u003e[1]\u003c/a\u003e\u003c/sup\u003e, which is arranged in alphabetical order. There are other names close by, but you and Honami-chan are often seen together\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe accumulation of past events and the missent message to Ishizaki led to such speculation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Honami-chan is always bright and composed, but she gets quite flustered when it comes to matters concerning herself. Maybe she couldn\u0026apos;t come up with a good excuse at that time, and she turned pale with her eyes drawn to the floor.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed to be another difficult situation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSomehow, I could picture the scene at that time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eI can\u0026apos;t tell the truth.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eBut I can\u0026apos;t pin it on just anyone either.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eAnd since I just said it was sent to the wrong person, I can\u0026#x2019;t pretend it never happened.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eEven though I wandered into this myself, it feels like I\u0026#x2019;ve approached a dead end.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Catching sight of the scene, from our point of view, it was very rare to see Honami-chan like that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBasically, Ichinose was a very capable person.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe\u0026#x2019;d usually overcome most things and could resolve situations herself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, as Amikura described, this was a period when she was in poor condition.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We were watching over her for a while, but it gradually started to feel heavy. Boys who didn\u0026apos;t think it was you started to wonder if she was planning to confess to someone.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe couldn\u0026apos;t sort it out by herself, and the situation only worsened with her silence.\u003c/p\u003e\u003cimg src=\"/hola-lector-agua/images/books/ss-y3-v1/OEBPS/OcHlfvFSwpskpyHEKQacz.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cp class=\"paragraph after-image\" style=\"text-align: left\"\u003e\u0026quot;How did she get through that predicament?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026#x2019;t easy to imagine Ichinose pulling off a miraculous recovery from there.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Like me, the girls knew who Honami-chan intended to send it to. We secretly discussed how to help and stepped in to support her.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eApparently, they managed to get through the situation by working together.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was a girl who had sought love advice from Ichinose, and she had been thinking of a reply to her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe message was mistakenly sent during that exchange.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe silence was out of consideration for the possibility of it leading back to that girl.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a result of her trying to protect that girl\u0026apos;s privacy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith testimonies from several people, most of the boys immediately corrected their misunderstanding.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There was nothing to do but accept it, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt would be different if the girls were putting on a bad act, making it obvious they were covering for her, but judging from their tone, they must have handled it well.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you responsible for returning Honami-chan back to normal?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I didn\u0026apos;t do anything special. Ichinose just recovered with her own strength.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see\u0026#x2026; but still, thank you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re thanking someone who didn\u0026apos;t do anything?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I just assume you\u0026apos;re being modest. That\u0026apos;s why I\u0026apos;m grateful.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhether I admit it or not, the truth seemed irrelevant.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But why tell me this? Is it because you thought I was the one who helped?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, it\u0026apos;s a different matter.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAmikura had been calm throughout, but her expression stiffened slightly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You can tell if you look, but even now, Honami-chan sees you as someone very special. You\u0026#x2019;re the only one in this school who can have a strong influence on her, that\u0026apos;s why.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI realized that she wasn\u0026apos;t just standing idly by while being friends with Ichinose.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe understood her nature; she knew Ichinose Honami well.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m telling you this because\u0026#x2026; I don\u0026apos;t want you to make Honami-chan sad or hurt her.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe said this with a bit of difficulty, but her words were clear.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t intend to intentionally hurt her, but that\u0026apos;s quite a difficult request.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Right.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAmikura agreed without denying it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course, I understand your position. It\u0026apos;s not about whether you\u0026apos;re dating. I just don\u0026apos;t want her to be unnecessarily hurt.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUpon answering, Amikura chuckled wryly and continued, muttering.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s tough for Honami-chan, falling for a guy who has a girlfriend.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re pretty straightforward, aren\u0026apos;t you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I have a vague idea of you too. I figure you aren\u0026#x2019;t flustered, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Maybe.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if it wasn\u0026apos;t today, Amikura must\u0026apos;ve been planning to have this conversation with me sooner or later.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs gym buddies, a chance to be alone together would\u0026#x2019;ve come at some point.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I understand what you want to say. I\u0026apos;ll deal with it well.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI couldn\u0026apos;t say anything for certain, so I asked for her understanding.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m sorry, it\u0026apos;s not my place to tell you this as a third party.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAmikura knew this, so she didn\u0026apos;t press the issue too hard.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You can\u0026apos;t just abandon her as a friend. It\u0026apos;s not a bad thing.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI showed my understanding, and Ichinose returned.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sorry to keep you both waiting,\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, not at all.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eConsidering it was a conversation that was embarrassing for the person involved, Amikura was momentarily flustered.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIchinose, who had returned, didn\u0026apos;t change her expression at all, but it wouldn\u0026apos;t be surprising if she had realized something with her keen eyes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, she didn\u0026apos;t ask what we were talking about.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMaybe it was just speculation, but perhaps Ichinose didn\u0026apos;t want to make Amikura tell a clumsy lie.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well then, I\u0026apos;m going to head home soon. See you two later.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI said my goodbyes to Ichinose and Amikura and left the gym.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was unexpectedly told about a situation that occurred in Ichinose\u0026apos;s class, but as soon as I stepped outside, I received a message.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e[Were you having another private talk with Mako-chan? About me?]\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe only came to check with me to avoid negatively impacting Amikura.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMoreover, it seemed she was able to guess that we were talking about an issue concerning her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe was probably curious about what we talked about, but I couldn\u0026#x2019;t tell her because of the promise I made to Amikura.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e[Looks like you\u0026apos;ve got a good best friend.]\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSo, I decided to reply with that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was nothing to worry about, and it certainly wouldn\u0026apos;t lower Amikura\u0026apos;s position.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIchinose sent back a sticker with an illustration labeled \u0026apos;super happy\u0026apos; in response to my message.\u003c/p\u003e\u003chr class=\"footnote-rule\"/\u003e\u003col class=\"footnotes\"\u003e\u003cli data-id=\"f822494b-d425-5685-aeba-590125f8ea5a\" data-ref=\"1\" class=\"footnote first-footnote\" id=\"fn-1-f822494b-d425-5685-aeba-590125f8ea5a\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003ca class=\"footnote-backref\" href=\"#fnref-1-f822494b-d425-5685-aeba-590125f8ea5a\"\u003e[1]: \u003c/a\u003eThe Japanese \u0026#x201c;Alphabet\u0026#x201d; is ordered by the Gojuuon\u0026#x2014;this places the vowels \u0026#x3042;(a) and \u0026#x3044;(i) directly next to each other.\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e\u003ch1 class=\"heading_1\"\u003eLegacyEMTLs Afterword\u003c/h1\u003e\u003chr/\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003eHey there, Colibri here.\u003c/p\u003e\u003cp class=\"paragraph\"\u003eJust wanted to say thanks for reading our translation. Countless hours of work and effort went into it and I just wanna say thank you to everyone in the team for being a part of this, and thank you to the reader for supporting us by reading our translation. If you encounter any errors, feel free to report them on our \u003ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.legacyemtls.com/report-error\"\u003esite\u003c/a\u003e. And if you have any comments, you can add them to the comments section of the \u003ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.legacyemtls.com/volume/cote-y3-v1\"\u003eY3V1 page\u003c/a\u003e. Spread our name through word of mouth and feel free to share these files so long as you credit us.\u003c/p\u003e\u003cp class=\"paragraph\"\u003eAnyways, see you next time with Y3V2.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: right\"\u003e\u003cem\u003eColibri\u003c/em\u003e\u003c/p\u003e\u003c/div\u003e\u003cp class=\"paragraph\" style=\"text-align: center\"\u003e\u0026#x22c6;\u0026#x22c5;\u0026#x2606;\u0026#x22c5;\u0026#x22c6;\u003c/p\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003eHi, FS7 here.\u003c/p\u003e\u003cp class=\"paragraph\"\u003eThanks for reading our translation. This is our first new volume release as a TL group so we hope the quality is up to par. We\u0026apos;re planning to redesign some of the mechanisms for translation to make it even better for Y3V2. Also, just like Colibri said, please report any issues to us. We\u0026apos;re very particular about our translations so we\u0026apos;re more than happy to rectify any issues if made aware of them.\u003c/p\u003e\u003cp class=\"paragraph\"\u003eThanks.\u0026#xa0;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: right\"\u003e\u003cem\u003eFS7\u003c/em\u003e\u003c/p\u003e\u003c/div\u003e\u003cp class=\"paragraph\" style=\"text-align: center\"\u003e\u0026#x22c6;\u0026#x22c5;\u0026#x2606;\u0026#x22c5;\u0026#x22c6;\u003c/p\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003eOne more lead here, F2P2W.\u003c/p\u003e\u003cp class=\"paragraph\"\u003eWe spent a lot more effort on this volume compared to our translation of V0 since we\u0026apos;re on a much stricter deadline this time. I\u0026apos;ll say this again, the team is full of people taking on multiple things at once\u0026#x2014;whether that be school, jobs, or personal projects\u0026#x2014;all while working on LegacyEMTLs, so please be kind to the team~\u003c/p\u003e\u003cp class=\"paragraph\"\u003eAlso, you will see a lot of the team bashing Anime Anyway here. Please don\u0026apos;t take it too seriously\u0026#x2026; don\u0026apos;t send hate to anybody. Don\u0026apos;t take our other leads as examples.\u003c/p\u003e\u003cp class=\"paragraph\"\u003eThat being said, we hope to bring good quality reads for those patiently waiting for the Seven Seas official translations! And I hope you all win your 50/50s early pity.\u003c/p\u003e\u003cp class=\"paragraph\"\u003eSigning out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: right\"\u003e\u003cem\u003eF2P2W\u003c/em\u003e\u003c/p\u003e\u003c/div\u003e\u003ch1 class=\"heading_1\"\u003eLegacyEMTLs Credits\u003c/h1\u003e\u003chr/\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003eColibri - Lead / Dev\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\"\u003e\u0026quot;Spread your legs\u0026quot;\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003eFS7 - Lead / MTL Dev / Lazy JE Checker\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\"\u003e\u0026quot;I gotta be the biggest Anime Anyway hater in LegacyEMTLs\u0026quot;\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003eF2P2W - Lead / Head Editor\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\"\u003e\u0026quot;Please don\u0026apos;t actually send hate to anime anyway... Besides that, persimmons are bomb.\u0026quot;\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003eJ\u0026#xe9;ra - JE Checker / Editor\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\"\u003e\u0026#x300c;\u0026#x4eca;\u0026#x5bb5;\u0026#x306e;\u0026#x6050;\u0026#x6016;\u0026#x5287;\u0026#x3092;\u0026#x59cb;\u0026#x3081;\u0026#x3088;\u0026#x3046;\u0026#x300d;\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003eIchinose Honami - JE Checker\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\"\u003e\u0026quot;If anime anyway gets less than 1000 views by Y3V6 I\u0026apos;ll flash on a colored illustration\u0026quot; \u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003eKall - Editor\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\"\u003e\u0026quot;I don\u0026apos;t like expending more effort than I have to - Anime Anyway (Probably)\u0026quot;\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003eECA - Editor\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\"\u003e\u0026quot;skibidi toilet, skibidi toilet, ts pmo\u0026#x1f494; \u0026quot;\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003eMika - Editor\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\"\u003e\u0026quot;Quis ut Deus\u0026quot;\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003eSky - Editor\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\"\u003e\u0026quot;Shoutout to the team for the hard work, enjoy the read.\u0026quot;\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003eHiyori\u0026apos;s Only Lover - Editor\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\"\u003e\u0026quot;Why is Hiyori\u0026apos;s name only mentioned once??? Arcangel Pa\u0026quot;\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003eUnknown - Editor\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\"\u003e\u0026quot;Ayano the rizzler\u0026quot;\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003eBigFaulty - Illustrator\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\"\u003e\u0026quot;Inchinose\u0026gt;\u0026gt;\u0026gt;\u0026quot;\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003eFZ - Illustrator\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\"\u003e\u0026quot;CoMiC sAnS iS sUpErIoR\u0026quot;\u003c/p\u003e\u003c/div\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Guidebook Short Story: Ever Since That Time...\",\"volumeId\":\"ss-y3-v1\",\"chapterIndex\":52,\"prevChapter\":{\"volumeId\":\"ss-y3-v1\",\"chapter\":51,\"title\":\"Guidebook Short Story: Mock Date\"},\"nextChapter\":\"$undefined\",\"toc\":[{\"label\":\"Ibuki Mio's Short Story: Concern?\",\"href\":\"ss-5.xhtml\",\"index\":49},{\"label\":\"Shiraishi Asuka’s Short Story: The Secrets She Harbors\",\"href\":\"ss-2.xhtml\",\"index\":46},{\"label\":\"Morishita Ai’s Short Story: Gatling Gun\",\"href\":\"ss-3.xhtml\",\"index\":47},{\"label\":\"Shiraishi Asuka's Short Story: An Extra Pair of Ears\",\"href\":\"ss-4.xhtml\",\"index\":48},{\"label\":\"Haruka Hasebe's Short Story: A Pillar of Support\"
