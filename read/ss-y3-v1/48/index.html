s=\"paragraph\" style=\"text-align: left\"\u003eYoshida-kun\u0026apos;s voice\u0026#x2014;I didn\u0026apos;t dislike it, but it was flat and uninteresting.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It wasn\u0026#x2019;t a hundred friends?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the next moment, reacting to Ayanokouji-kun\u0026apos;s voice reaching my ears, I slowly opened my eyes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Aah\u0026#x2026; It\u0026apos;s this voice after all, isn\u0026apos;t it\u0026#x2026;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs if my body were shivering with excitement, it ran from my ears to my brain, then throughout my entire body.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA voice, clinical and colorless, devoid of emotion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA voice most unsuitable for observation, one impossible to analyze.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eYet, I wonder why it makes my heart race so much.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIs it because his true nature is so beyond conventional thought?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhether it be violence or domination, cunningness or vileness, he executed everything with that voice.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I-I already said I\u0026apos;m not interested!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSo much so that Yoshida-kun\u0026apos;s voice, which I shouldn\u0026apos;t have disliked, suddenly felt like a racket.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had become entranced by his voice.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Does that \u0026apos;Hundred-Man Slayer\u0026apos; expression change to the \u0026apos;Two-Hundred-Man Slayer\u0026apos; when it reaches two hundred?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat impression he had of me\u0026#x2014;I wanted to know his sentiments.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhether it was praise or condemnation, either was fine.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003ePlease tell me with that wonderful voice.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ve come to respect her. It\u0026apos;s honestly amazing for someone my age to be involved with a hundred people.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Eh? Is that what you really think\u0026#x2026;? It really does seem like you feel that way, huh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Isn\u0026apos;t a specialist in any field worthy of respect? Sorry to bring up my previous class, but it\u0026apos;s like Sudou in basketball, Onodera in swimming, or Inogashira in sewing.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;As expected, your way of thinking is wonderful, Ayanokouji-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile feeling it was a shame to temporarily part, I reluctantly removed the phone from my ear.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI couldn\u0026apos;t hold myself back anymore.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eFrom here on out, allow me to hear your voice not through the phone, but directly in person.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sakayanagi-san. Please leave the rest to me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eGetting up from the sofa, I decided to head outside where he waited.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Shiraishi Asuka's Short Story: An Extra Pair of Ears\",\"volumeId\":\"ss-y3-v1\",\"chapterIndex\":48,\"prevChapter\":{\"volumeId\":\"ss-y3-v1\",\"chapter\":47,\"title\":\"Morishita Ai’s Short Story: Gatling Gun\"},\"nextChapter\":{\"volumeId\":\"ss-y3-v1\",\"chapter\":50,\"title\":\"Haruka Hasebe's Short Story: A Pillar of Support\"},\"toc\":[{\"label\":\"Ibuki Mio's Short Story: Concern?\",\"href\":\"ss-5.xhtml\",\"index\":49},{\"label\":\"Shiraishi Asuka’s Short Story: The Secrets She Harbors\",\"href\":\"ss-2.xhtml\",\"index\":46},{\"label\":\"Morishita Ai’s Short Story: Gatling Gun\",\"href\":\"ss-3.xhtml\",\"index\":47},{\"label\":\"Shiraishi Asuka's Short Story: An Extra Pair of Ears\",\"href\":\"ss-4.xhtml\",\"index\":48},{\"label\":\"Haruka Hasebe's Short Story: A Pillar of Support\",\"href\":\"ss-6.xhtml\",\"index\":50},{\"label\":\"Guidebook Short Story: Mock Date\",\"href\":\"ss-7.xhtml\",\"index\":51},{\"label\":\"Guidebook Short Story: Ever Since That Time...\",\"href\":\"ss-8.xhtml\",\"index\":52}],\"volumeTitle\":\"Short Stories: Volume 1\",\"detailsLink\":\"/select/year-3/ss-y3-v1\",\"returnLink\":\"/select/year-3?contentType=shortStories\",\"currentSpineIndex\":48,\"nextVolumeLink\":\"/select/year-3/ss-y3-v2\",\"nextVolumeTitle\":\"Short Stories: Volume 2\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27
