g\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.46.1\"\u003e“But why, though? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.46.2\"\u003eWhy ask me to give myself up when you could have just said, ‘Show me your Private Point history’ the second I set foot in the classroom earlier and been done with it?”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.47.1\"\u003eSakayanagi had not immediately pressed Hashimoto for answers. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.47.2\"\u003eIf Sakayanagi hadn’t known, this questioning would have been natural, but she’d been convinced from the start. \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.48.1\"\u003e“Mercy for the traitor. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.48.2\"\u003eIncluding my silence during the exam,” said Sakayanagi.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.49.1\"\u003eShe was giving him time to reflect on what he’d done and confess.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.50.1\"\u003e“It is a shame that you did not realize that. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.50.2\"\u003eContacting other classes, working for your own selfish benefit, plotting to transfer. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.50.3\"\u003eIf it were only those things, I could overlook what you have done as careless. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.50.4\"\u003eHowever, in this case, your actions went beyond that.” \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.51.1\"\u003e“I guess so, yeah. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.51.2\"\u003eAs they say in many special exams, getting betrayed by your allies is fatal. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.51.3\"\u003eBein’ in class means that everyone’s got a shared destiny—we’re all in the same boat. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.51.4\"\u003eEven if you’re dissatisfied, and even if you don’t follow orders, you don’t go as far as betrayal. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.51.5\"\u003eIt’s a detriment to the class and to your own interests.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.52.1\"\u003eEven if a student were disgruntled, they would exercise self-control, even if they could barely stand it, day after day.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.53.1\"\u003e“You have crossed a line that should not have been crossed,” said Sakayanagi.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.54.1\"\u003e“I won’t deny that.” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.54.2\"\u003eHashimoto didn’t flinch. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.54.3\"\u003eHe admitted the truth.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.55.1\"\u003e“I’m sure other folks will say that they can’t possibly understand it. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.55.2\"\u003eThey’ll wonder what’s in it for me to hurt Class A. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.55.3\"\u003eWell, I say no, that’s not right, because this class didn’t have any chance of winning from the start. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.55.4\"\u003eEven if I didn’t betray you, this class is obviously going to fall to Class B or lower in the future. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.55.5\"\u003eIt’s inevitable. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.55.6\"\u003eWe need to come up with a path to victory, even if that means I have to betray you,” said Hashimoto.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.56.1\"\u003e“So you’re saying that you’re fighting in your own way.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.57.1\"\u003e“It hurt me too, y’know. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.57.2\"\u003eBut it was just too tempting. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.57.3\"\u003eI had to put out a warning. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.57.4\"\u003eLosing Class Points doesn’t mean despair. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.57.5\"\u003eThe only people who get cut are the ones without the talent to be here anyway. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.57.6\"\u003eI knew this was the perfect opportunity. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.57.7\"\u003eIt wasn’t to bring the class down; it was to make it stronger.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.58.1\"\u003e“You were prepared to be discovered. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.58.2\"\u003eNo—it sounds as though being discovered was part of your plan.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.59.1\"\u003e“Well, maybe not on the same day, though.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.60.1\"\u003eHashimoto had assumed that she would have gathered the whole class together for the dramatic reveal—something like that. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.60.2\"\u003eBeing cornered alone was something he would have rather avoided.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.61.1\"\u003e“When you realized I betrayed you, you already knew why, didn’t you? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.61.2\"\u003eWhy I took this gamble?”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.62.1\"\u003e“Of course. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.62.2\"\u003eThat’s why I arranged this meeting.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.63.1\"\u003e“I had to do things this way or I wouldn’t be able to get you to take me seriously. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.63.2\"\u003eI even pitched the proposal to you again at the end of winter break, Princess, over and over and over. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.63.3\"\u003eI want you to poach Ayanokouji for our class.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.64.1\"\u003e“Yes. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.64.2\"\u003eI have heard your impassioned speech so many times that I’m sick of it,” said Sakayanagi.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.65.1\"\u003eHeadhunting Ayanokouji and Hashimoto’s betrayal. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.65.2\"\u003eIf you asked another student how they were related, they’d cock their heads in confusion. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.65.3\"\u003eHowever, Hashimoto understood completely. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.65.4\"\u003eHe knew Sakayanagi Arisu’s character.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.66.1\"\u003e“Even if we lost Class Points this time, even if I had to betray you, even if someone had to be expelled…I didn’t care. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.66.2\"\u003eI was going to force you to listen. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.66.3\"\u003eI had set my mind to it.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.67.1\"\u003eThis wasn’t the end; it was the beginning. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.67.2\"\u003eThis was a threat. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.67.3\"\u003eUntil she said she was going to headhunt Ayanokouji for their class, he would betray her, no matter how many times it took.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.68.1\"\u003e“You really seem to think that we will not stay Class A under my guidance,” said Sakayanagi.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.69.1\"\u003e“I admit that you’re brilliant, Princess. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.69.2\"\u003eStill, I’m convinced that you won’t be able to stop Ayanokouji’s class’s onslaught in the near future. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.69.3\"\u003eThe positions for Classes A and B are going to be reversed sooner or later, and there won’t be any chance for us to overtake them afterward. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.69.4\"\u003eOur current position is an illusion. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.69.5\"\u003eThe strategy that gives us the highest chance of staying Class A is to have you and Ayanokouji in the same class. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.69.6\"\u003eIf we do that, we cannot lose.” \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.70.1\"\u003e“I was right not to let you say these things in front of an audience.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.71.1\"\u003e“You don’t agree? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.71.2\"\u003eI’m right, you know.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.72.1\"\u003e“I cannot approve,” said Sakayanagi.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.73.1\"\u003e“Sorry, but Ayanokouji is without a doubt, out of everyone in our grade, the best—”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.74.1\"\u003eTok!\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.75.1\"\u003e Sakayanagi struck the floor with the tip of her cane, forcefully. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.75.2\"\u003e“What do \u003c/span\u003e\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.76.1\"\u003eyou\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.77.1\"\u003e know about Ayanokouji-kun?!” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.77.2\"\u003eshe snapped.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.78.1\"\u003e“Guh…!”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.79.1\"\u003eSakayanagi had been calm until this point, but now, clear feelings of anger were seeping out from behind her mask.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.80.1\"\u003e“What is this blind faith in him? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.80.2\"\u003eWhere does this enthusiasm come from?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.80.3\"\u003eshe asked.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.81.1\"\u003eHashimoto felt intimidated by the petite Sakayanagi, whose temper roiled.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.82.1\"\u003e“What? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.82.2\"\u003eAngry you’re not the best?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.82.3\"\u003easked Hashimoto.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.83.1\"\u003eIt was certainly true that Sakayanagi was angry. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.83.2\"\u003eHowever, it wasn’t because Hashimoto had determined that Ayanokouji was superior to her. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.83.3\"\u003eIt was because she found Hashimoto’s selfish obsession with Ayanokouji unforgivable. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.83.4\"\u003eWhat right did an ordinary person, one who had no idea about Ayanokouji’s birth, have to speak about him?\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.84.1\"\u003e“Toss aside your pride and poach Ayanokouji. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.84.2\"\u003eIf Ryuuen does, that’d be the worst-case scenario,” said Hashimoto.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.85.1\"\u003e“There is zero chance that Ryuuen-kun will headhunt Ayanokouji-kun. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.85.2\"\u003eIf Ayanokouji-kun truly possesses the abilities you believe he does, that would be precisely why Ryuuen-kun would want him to remain as his enemy, so he can defeat him.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.86.1\"\u003e“That might be true for now, sure. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.86.2\"\u003eBut what if he’s in a situation where he can’t actually win? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.86.3\"\u003eIf he realizes that that he’ll miss his chance to reach Class A, then he might change h—”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.87.1\"\u003e“He will not change. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.87.2\"\u003eBoth Ryuuen-kun and I wish to defeat a worthy opponent. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.87.3\"\u003eWe are the same in that we in no way care about staying in Class A,” said Sakayanagi.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.88.1\"\u003eHashimoto closed his eyes and let out a sigh. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.88.2\"\u003eHis assumptions had been all wrong. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.88.3\"\u003eSakayanagi had held Ayanokouji in high esteem long before Hashimoto had noticed his ability. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.88.4\"\u003eIt was yet more confirmation Ayanokouji was extraordinary.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.89.1\"\u003e“Maybe that’s why you disgust me. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.89.2\"\u003eWhen I entered this school, I had a gut feeling that either you or Ryuuen would be the leader to graduate from Class A. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.89.3\"\u003eNo matter what I did, I couldn’t shake the feeling something wasn’t right. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.89.4\"\u003eBut I see it now. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.89.5\"\u003eBoth of you lack the drive to graduate from Class A.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.90.1\"\u003eThey would only be in Class A if it helped them beat their rivals. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.90.2\"\u003eIf they found something that took precedence over being in Class A, they would casually toss it aside, without hesitation.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.91.1\"\u003e“Horikita and Ichinose do have that enthusiasm. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.91.2\"\u003eStrange, huh? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.91.3\"\u003eThe classes with the fire to win don’t have the ability, and the ones without the ability have the drive. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.91.4\"\u003eBut if you and Ayanokouji team up, Princess, enthusiasm won’t matter for shit. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.91.5\"\u003eIt would be the birth of a class that can reach victory, without a doubt,” said Hashimoto.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.92.1\"\u003eHashimoto was convinced of it, on his own. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.92.2\"\u003eSakayanagi looked at Hashimoto with a cold stare and began to speak. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.92.3\"\u003e“I understand what you are trying to say, that you think bringing Ayanokouji-kun into our own class is an absolute prerequisite for victory. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.92.4\"\u003eHowever, wouldn’t the safest and simplest method for you to take be to win a Class Transfer Ticket and transfer into Horikita-san’s class, the class in which Ayanokouji-kun is currently enrolled? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.92.5\"\u003eSeeing as Horikita-san has demonstrated she has that drive to be in Class A and all.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.93.1\"\u003e“Do you really think I’m in a position to make that happen?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.93.2\"\u003easked Hashimoto.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.94.1\"\u003e“Of course it can happen. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.94.2\"\u003eIf you had begged me to give you a Class Transfer Ticket, saying that you wished to transfer classes, should the opportunity have arisen, I would have gladly given it to you.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.95.1\"\u003e“Man, I wish I’d asked. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.95.2\"\u003eOh, well.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.96.1\"\u003eHashimoto made a deliberate show of acting like he was regretful, but Sakayanagi quickly brushed him off.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.97.1\"\u003e“Be serious. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.97.2\"\u003eI am sure you would not have accepted the ticket.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.98.1\"\u003e“…Why’s that?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.98.2\"\u003easked Hashimoto.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.99.1\"\u003e“You are transparent. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.99.2\"\u003eYou do not want to abandon a class in the lead, even if the future is uncertain. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.99.3\"\u003eBut you are afraid of Ayanokouji-kun. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.99.4\"\u003eYou wish to transfer classes, but there are no guarantees of what would happen after you transfer to Class B. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.99.5\"\u003eEven with a ticket, you wouldn’t go. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.99.6\"\u003eIf you cannot move yourself, you have to move someone else,” said Sakayanagi.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.100.1\"\u003eStudents who lacked commitment to a class wouldn’t be seen as trustworthy, and the hurdle in getting another ticket would be much, much higher. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.100.2\"\u003eWorst-case scenario, he’d be stuck on a sinking ship.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.101.1\"\u003e“Don’t worry, traitor, you will get your wish: you won’t be here for long. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.101.2\"\u003eYou cannot escape now even if you wanted to, can you? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.101.3\"\u003eNegotiate all you want, wheedle, beg, but you’re not worth twenty million, Hashimoto-kun. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.101.4\"\u003eNo one will seriously try to pick you up. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.101.5\"\u003eIf you even try to acquire a Class Transfer Ticket, you won’t escape. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.101.6\"\u003eAnd, of course, I will never bring Ayanokouji-kun into my class either.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.102.1\"\u003eIn other words, Hashimoto was completely boxed in. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.102.2\"\u003eBut he didn’t shrink back from her anger. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.102.3\"\u003eFrom the moment he had decided to betray her, Hashimoto had been committed to this path.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.103.1\"\u003e“Well, I wanted you to listen to what I had to say, but I guess I’m outta luck. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.103.2\"\u003eI’m just gonna keep at it, then. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.103.3\"\u003eGonna have to twist your arm to get Ayanokouji into our class, Princess.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.104.1\"\u003eThis was Hashimoto’s big gamble. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.104.2\"\u003eIf there were another chance for the class to oust one person, he’d be gone. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.104.3\"\u003eWithout that opportunity, it’d be much more difficult.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.105.1\"\u003e“Special exams are not the only way to go about getting rid of you. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.105.2\"\u003eYou understand that, yes?”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.106.1\"\u003e“You’re really determined not to listen, huh? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.106.2\"\u003eWell, it cuts both ways, y’know. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.106.3\"\u003eI can get you expelled, Princess. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.106.4\"\u003eThen I’ll take control of Class A and bring Ayanokouji into the class.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.107.1\"\u003eSakayanagi applauded dryly in response to the final breakdown between them.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.108.1\"\u003e“Oh, well done. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.108.2\"\u003eWhat a luminary you are, Hashimoto-kun. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.108.3\"\u003eGo ahead. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.108.4\"\u003eTry to expel me. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.108.5\"\u003eI want to see you try.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.109.1\"\u003eA fault line opened between them that couldn’t be mended except by the others’ defeat.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003c/div\u003e\r\n\u003c/div\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 8: New Expulsion\",\"volumeId\":\"y2v10\",\"chapterIndex\":34,\"prevChapter\":{\"volumeId\":\"y2v10\",\"chapter\":32,\"title\":\"Chapter 8: New Expulsion\"},\"nextChapter\":{\"volumeId\":\"y2v10\",\"chapter\":39,\"title\":\"Chapter 9 - Epilogue : Harbinger of Awakening\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/section-0001.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0002.html\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0007.html\",\"index\":8},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0008.html\",\"index\":9},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0009.html\",\"index\":10},{\"label\":\"Chapter 1 - Prologue : Hashimoto Masayoshi’s Soliloquy\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_10\",\"index\":11},{\"label\":\"Chapter 2: The Curtain Rises on the Third Semester of the Second Year\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_11\",\"index\":12},{\"label\":\"Chapter 3: Survival and Elimination Special Exam\",\"href\":\"Text/section-0012.html#auto_bookmark_toc_12\",\"index\":13},{\"label\":\"Chapter 4: The Identity of the Sender\",\"href\":\"Text/section-0015.html#auto_bookmark_toc_15\",\
