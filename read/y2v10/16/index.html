e showed him. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.345.3\"\u003eThat’s what he was saying.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.346.1\"\u003e“I don’t remember anything at all… A-anyway, please accept this,” said Mii-chan.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.347.1\"\u003eWith that, she held out the paper bag containing the thank-you gift that she had purchased.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.348.1\"\u003e“That is not necessary,” said Kouenji.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.349.1\"\u003e“Uh… If you do not like it, then I suppose it’s understandable if you don’t accept it. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.349.2\"\u003eCould you at least allow me to pay you? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.349.3\"\u003eThe food you gave me wasn’t cheap,” said Mii-chan.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.350.1\"\u003e“I’m not hurting for money right now. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.350.2\"\u003eI don’t need it,” said Kouenji.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.351.1\"\u003eSomething was off about what he just said. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.351.2\"\u003eSure, Kouenji had a lot of money after making a large profit via the Uninhabited Island Special Exam. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.351.3\"\u003eHowever, Kouenji cultivated his image as a wasteful spender. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.351.4\"\u003eHe himself had said before that his philosophy was to be liberal with his cash.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.352.1\"\u003eIf he needed to be economical after all that spending, sure, that’d make sense. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.352.2\"\u003eBut he was seen buying a large TV the other day, so was what he said simply a lie to avoid receiving points from Mii-chan, then? \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.353.1\"\u003e“B-but that wouldn’t be right! \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.353.2\"\u003eBesides, I wouldn’t be able to get rid of this feeling of guilt over what you did for me. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.353.3\"\u003eCould you please at least tell me what it was that I did for you, Kouenji-kun?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.353.4\"\u003esaid Mii-chan.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.354.1\"\u003e“My goodness. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.354.2\"\u003eYou do have a difficult personality. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.354.3\"\u003eI already told you, didn’t I? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.354.4\"\u003eIt was something trivial and there is no need to remember it. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.354.5\"\u003eI have nothing further to say on the matter,” said Kouenji.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.355.1\"\u003eThe conversation ground to a halt. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.355.2\"\u003eMii-chan seemed somewhat dejected, but even so, she bowed her head.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.356.1\"\u003e“Am I free to go?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.356.2\"\u003esaid Kouenji.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.357.1\"\u003e“Y-yes,” replied Mii-chan.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.358.1\"\u003e“Sorry, but I have a question,” I said.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.359.1\"\u003e“I do not think I wish to be popular with men, but you do like to pry,” replied Kouenji.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.360.1\"\u003e“It’s important. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.360.2\"\u003eIf you feel indebted, would you cooperate with the class in the future?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.360.3\"\u003eI asked.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.361.1\"\u003e“Nonsense, Ayanokouji Boy. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.361.2\"\u003eYou need me for the class to win, and for that reason, you will show me goodwill. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.361.3\"\u003eBut that’s transactional, understand?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.361.4\"\u003esaid Kouenji.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.362.1\"\u003eHe wouldn’t interpret something done for something in exchange as honest, good intentions. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.362.2\"\u003eFair enough.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.363.1\"\u003e“Operating strictly within the rules of this school doesn’t allow for goodness. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.363.2\"\u003eAm I wrong?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.363.3\"\u003easked Kouenji.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.364.1\"\u003e“Maybe,” I replied.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.365.1\"\u003e“You cannot win me over as your ally, no matter what means you use,” said Kouenji.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.366.1\"\u003e“You’re right about that. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.366.2\"\u003eDespite my best efforts, you still resist full cooperation,” I replied.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.367.1\"\u003e“Exactly. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.367.2\"\u003eI will not change until graduation, nor will I change after graduation. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.367.3\"\u003eNo matter what kind of shallow manipulation my peers attempt, they will not reach my heart. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.367.4\"\u003eAnd that includes you, of course,” said Kouenji.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.368.1\"\u003e“In that case, what about special exams like this one we’re just about to take? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.368.2\"\u003eWhat if Horikita chooses a plan that involves not protecting you? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.368.3\"\u003eYou can’t say for certain she’ll keep her word. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.368.4\"\u003eEven if you cry unfairness, you wouldn’t be able to avoid expulsion,” I replied.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.369.1\"\u003eHorikita could change tactics and force Kouenji into helping by threatening him.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.370.1\"\u003e“I don’t rely on anyone,” said Kouenji.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.371.1\"\u003eIn other words, he was saying that he was confident he could get by even without protection.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.372.1\"\u003e“All right then, we’re done. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.372.2\"\u003eI’ll let Horikita know that there’s no need for her to protect you,” I replied.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.373.1\"\u003eWe’d be in a stronger position if we didn’t have to protect one person. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.373.2\"\u003eHorikita was a girl of her word, so getting her on board would be tough.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.374.1\"\u003e“Do as you like. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.374.2\"\u003eEither way, if you ingratiate yourself with me in the hopes of getting something in return, you won’t get it,” said Kouenji.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.375.1\"\u003eKouenji was determined to be useless. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.375.2\"\u003eCould I turn that to my advantage? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.375.3\"\u003eKouenji possessed exceptional abilities, but his presence was a double-edged sword. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.375.4\"\u003eThere was a risk that Horikita could be dragged down in the future, depending on the content of the special exam. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.375.5\"\u003eIf I were the class leader, then I could easily declare Kouenji a dead weight. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.375.6\"\u003eThe promise made on the deserted island was made between him and Horikita, so it had nothing to do with a third party. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.375.7\"\u003eOne option would be to get rid of him now, as a gift for Horikita, but—\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.376.1\"\u003e“However.” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.376.2\"\u003eKouenji’s gaze changed, sharpening, making a complete change from the easygoing aloofness that he showed earlier. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.376.3\"\u003e“If ‘someone’ were planning to eliminate me, then they’d have me to contend with.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.377.1\"\u003eHe’d read my mind. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.377.2\"\u003eNo, perhaps it was wild intuition on his part?\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.378.1\"\u003e“‘Contend with,’ huh? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.378.2\"\u003eHow do you mean?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.378.3\"\u003eI asked.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.379.1\"\u003e“That is something you’ll have to find out,” replied Kouenji.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.380.1\"\u003eI wagered he would do something to shake up the class’s standing.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.381.1\"\u003e“Would you care to open that box and see? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.381.2\"\u003eI would have to correct your overestimation of yourself\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"C_Current__And__Properties__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.382.1\"\u003e,\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.383.1\"\u003e” said Kouenji.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.384.1\"\u003e“I’ll pass. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.384.2\"\u003eThe class leader is Horikita,” I replied.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.385.1\"\u003e“I see. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.385.2\"\u003eWell then, I have more dates lined up after this, so I had better be on my way,” said Kouenji.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.386.1\"\u003eIt was curious phrasing, ‘dates’ plural, but the conversation was at an end. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.386.2\"\u003eKouenji was an eccentric. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.386.3\"\u003eAlso, although it would be an ordeal, we’d have to keep him around.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.387.1\"\u003e“U-um, excuse me… Ayanokouji-kun?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.387.2\"\u003esaid Mii-chan.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.388.1\"\u003e“Sorry. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.388.2\"\u003eI just wanted to get a few things out of Kouenji while I had the chance. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.388.3\"\u003eWe rarely speak,” I replied.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.389.1\"\u003e“It’s all right, but…well…” she began.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.390.1\"\u003e“What?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.390.2\"\u003eI asked.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.391.1\"\u003e“N-no, it’s nothing. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.391.2\"\u003eNever mind,” she replied.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.392.1\"\u003eMii-chan seemed uneasy. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.392.2\"\u003eI supposed my half-threats to Kouenji might have had that effect.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003c/div\u003e\r\n\u003c/div\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 4: The Identity of the Sender\",\"volumeId\":\"y2v10\",\"chapterIndex\":16,\"prevChapter\":{\"volumeId\":\"y2v10\",\"chapter\":13,\"title\":\"Chapter 3: Survival and Elimination Special Exam\"},\"nextChapter\":{\"volumeId\":\"y2v10\",\"chapter\":17,\"title\":\"Chapter 5: Advice\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/section-0001.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0002.html\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0007.html\",\"index\":8},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0008.html\",\"index\":9},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0009.html\",\"index\":10},{\"label\":\"Chapter 1 - Prologue : Hashimoto Masayoshi’s Soliloquy\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_10\",\"index\":11},{\"label\":\"Chapter 2: The Curtain Rises on the Third Semester of the Second Year\",\"href\":\"Text/section-0011.html#auto_bookma
