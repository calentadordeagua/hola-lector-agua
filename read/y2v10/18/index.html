/xhtml\" class=\"koboSpan\" id=\"kobo.5.1\"\u003eHURSDAY MORNING, \u003c/span\u003e\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.6.1\"\u003ethe day before the special exam. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.6.2\"\u003eToday was a special day off. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.6.3\"\u003eI was usually a good sleeper, but I had an unusually sleepless night.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.7.1\"\u003e“I guess it’s true what they say, a lack of sleep ain’t good for you… I’m so tired…” I groaned.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.8.1\"\u003eWhen I got up, I saw that I had gotten a message from Kitou on my phone.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.9.1\"\u003e“Looks like Princess has finally settled on a plan of action, apparently,” I thought aloud.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.10.1\"\u003eShe was finally going to gather the class executives to discuss their plans, and it was the day before the exam. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.10.2\"\u003eWell, I say “discussion,” but it’s not like she was going to go into detail about her strategy. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.10.3\"\u003eAs always, Sakayanagi acted on her own. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.10.4\"\u003eShe would only tell the students what is necessary for her to carry out that action, using them like extensions of herself. \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.11.1\"\u003e“Tch…”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.12.1\"\u003eIn addition to the message from Kitou, I had received dozens of others. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.12.2\"\u003eThey were from the girl I was currently dating. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.12.3\"\u003eEven though I remembered that we were together and chatting with each other just yesterday, and until pretty late at that, I had just dipped out of the conversation partway through, because it was just dragging on and on.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.13.1\"\u003eWhere are we gonna go next?\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.14.1\"\u003eI wanna eat that. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.14.2\"\u003eI want this.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.15.1\"\u003eWhat do you like? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.15.2\"\u003eWhat do you dislike?\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.16.1\"\u003eI wanna see you. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.16.2\"\u003eI’m lonely.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.17.1\"\u003eAll just pointless crap, all the time.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.18.1\"\u003e“Sorry, I fell asleep. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.18.2\"\u003eLemme make it up to you next time, OK?”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.19.1\"\u003eI sent her that text, along with a cute, illustrated sticker, without feeling. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.19.2\"\u003eI figured that would satisfy her for the time being. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.19.3\"\u003eIf she nagged at me, I could just throw her away, but there was still some information left for me to pick up. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.19.4\"\u003eNo matter what class it was about, no matter how trivial the info was, any info was good.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.20.1\"\u003eI put that girl out of my mind for now—there was the matter of Sakayanagi to deal with. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.20.2\"\u003eThat kept me up at night. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.20.3\"\u003eWhat was the strategy? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.20.4\"\u003eAnd even before we considered that, what should I do? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.20.5\"\u003eWith the final exam approaching, my anxiety was getting stronger by the day.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.21.1\"\u003eWe could lose to Ryuuen in a direct conformation and a large number of Class Points would move around. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.21.2\"\u003eThat had to be avoided at all costs. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.21.3\"\u003eI needed to do whatever I could, right?\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.22.1\"\u003e\u0026#160;\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.23.1\"\u003e6.1\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.24.1\"\u003e\u0026#160;\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.25.1\"\u003eS\u003c/span\u003e\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.26.1\"\u003eAKAYANAGI DIDN’T BOTHER \u003c/span\u003e\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.27.1\"\u003efretting over a meeting spot. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.27.2\"\u003eKaraoke, or a room in the dormitory, to avoid being seen was fine. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.27.3\"\u003eOr even in the special building or behind the gym. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.27.4\"\u003eAnywhere that was a good place to have a confidential conversation. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.27.5\"\u003eFrom Sakayanagi’s point of view, she probably didn’t care; she didn’t think she was spilling secrets.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.28.1\"\u003eToday, as always, we went to the most bustling cafe in Keyaki Mall. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.28.2\"\u003eSakayanagi seemed to be enjoying a moment of leisurely comfort together with Kamuro and Kitou, all of them seated together at a popular spot.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.29.1\"\u003e“Sorry for being a little late, Princess.” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.29.2\"\u003eI sat down on an empty seat, remembering to use my pet name for her.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.30.1\"\u003e“Oh, you have a girlfriend? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.30.2\"\u003eAnd one you’re especially fond of it seems,” said Sakayanagi.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.31.1\"\u003e“…Oh, I wonder if you saw us somewhere, then?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.31.2\"\u003eI asked.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.32.1\"\u003eLast year, all I had to do was keep an eye on the Class A students. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.32.2\"\u003eNow that I was a second-year student, I had to keep the other eye on my juniors. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.32.3\"\u003eI wondered if I had been too careless since I’d been seen. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.32.4\"\u003eNah, if a first-year were in the second-year student hallway, they’d definitely be noticed. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.32.5\"\u003eIf that was the case, then…\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.33.1\"\u003eWas there a pawn that Sakayanagi had been holding onto in my class? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.33.2\"\u003eIn the majority of cases, she used Kamuro, Kitou, or me, but Sakayanagi accepted information over her cell. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.33.3\"\u003eI had asked Sakayanagi about that before, keeping it light and casual, but I didn’t directly ask who. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.33.4\"\u003eIt was possible that, whoever it was, they were watching.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.34.1\"\u003eI decided that if it was a student in my class, then there wouldn’t be any need to rush to track them down. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.34.2\"\u003eHowever, if it turned out that this wasn’t a coincidence, and this person was intentionally spying on me, I would have a problem with that.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.35.1\"\u003e“I’m pretty private when it comes to my love life, so please keep that on the down-low,” I added.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.36.1\"\u003e“Heh heh, I will not say a word,” said Sakayanagi.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.37.1\"\u003e“Okay, so? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.37.2\"\u003eWhat are we talking about today?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.37.3\"\u003easked Kamuro.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.38.1\"\u003e“Do you even need to ask, Masumi-chan? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.38.2\"\u003eI’m sure you know already,” I replied.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.39.1\"\u003e“Back up. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.39.2\"\u003eWe’re not on a first-name basis,” snapped Kamuro.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.40.1\"\u003e“Sorry, sorry, my bad. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.40.2\"\u003eForce of habit,” I said.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.41.1\"\u003e“‘Habit’? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.41.2\"\u003eYou’ve only done it a few times,” argued Kamuro.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.42.1\"\u003e“In my heart, you’re always Masumi-chan.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.43.1\"\u003e“Gross.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.44.1\"\u003eMy familiarity repulsed Kamuro. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.44.2\"\u003eThat was just as well. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.44.3\"\u003eIf our positions were reversed, I bet I would’ve felt the same. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.44.4\"\u003eI was playing the clown, though, so I needed to affect the mannerisms.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.45.1\"\u003e“Okey doke, let’s get this show on the road, Princess. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.45.2\"\u003eWe’re talking about the special exam, right?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.45.3\"\u003eI asked.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.46.1\"\u003e“No, we are not. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.46.2\"\u003eToday is just a tea party,” replied Sakayanagi in a mocking tone of voice.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.47.1\"\u003eI forced a slight overreaction, sliding out of my chair.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.48.1\"\u003e“You didn’t hafta gather all your executives here for that, Princess,” I exclaimed.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.49.1\"\u003e“It’s an act for those outside our class,” said Sakayanagi.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.50.1\"\u003eAn act? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.50.2\"\u003eWhat? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.50.3\"\u003eDon’t make me laugh.\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.51.1\"\u003e“If Class A calls a strategy meeting, then students from other classes will inevitably whisper about it. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.51.2\"\u003eTensions will increase. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.51.3\"\u003eThey’ll put in every possible effort in order to win, won’t they?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.51.4\"\u003eI argued. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.51.5\"\u003eI’d been simpering in the hopes of being let in on her secrets, but after yesterday, I wasn’t in the mood. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.51.6\"\u003e“I don’t understand what we’d gain from doing something like that. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.51.7\"\u003eTell me.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.52.1\"\u003e“We do gain something. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.52.2\"\u003eIt draws out the spirit of the three other classes, wouldn’t you agree?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.52.3\"\u003ereplied Sakayanagi.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.53.1\"\u003e“…That’s supposed to be a benefit?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.53.2\"\u003easked Kamuro.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.54.1\"\u003eKuro and I were on the same page; that did not sound like a benefit. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.54.2\"\u003eFar from it. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.54.3\"\u003eWhat the hell was the point of getting people on edge when you instead wanted them to be proud and drop their guard?\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.55.1\"\u003e“We want to enjoy the competition, do we not? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.55.2\"\u003eWe have been engaged in quite a bit of play as of late, like the cultural festival and the school trip,” said Sakayanagi.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.56.1\"\u003eShe prioritized her own enjoyment, even if it meant lowering the odds of us winning or suffering some kind of disadvantage. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.56.2\"\u003eThat was how Sakayanagi had continued to play her cards during her reign, as the leader of our class. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.56.3\"\u003eOur classmates tolerated that because it led to good results—she had a history of steadily accumulating Class Points.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.57.1\"\u003eHowever, if that track record were to disappear, Sakayanagi’s value would suddenly plummet. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.57.2\"\u003eI didn’t know who else saw that possibility for her except me. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.57.3\"\u003eShould I say something? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.57.4\"\u003eProbably not.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.58.1\"\u003eAfter finishing what really was just a simple tea party, I went into the bathroom near the east exit. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.58.2\"\u003eI wasn’t going in there to do my business nor to have a secret chat with somebody; it was just a habit that I couldn’t shake. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.58.3\"\u003eI entered the stall furthest in and locked the door. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.58.4\"\u003eThe lid opened for me cheerfully, and I pulled down my pants to sit and think.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.59.1\"\u003eThe stalls in Keyaki Mall were always kept pristine, so it never felt uncomfortable here. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.59.2\"\u003eThere weren’t even any nasty odors. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.59.3\"\u003eTo be honest, I didn’t really mind places that had a certain amount of filth and stink anyway. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.59.4\"\u003eThe BGM playing throughout the mall amounted to nothing but empty noise, but I closed my eyes and leaned forward, placing my arms on my knees.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.60.1\"\u003eAt school, which had little privacy, it was an exceptionally useful place—a priceless treasure. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.60.2\"\u003eIt didn’t have to be a bathroom specifically for me to hide in, but habits really are tough to break. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.60.3\"\u003eI remained in the stall for the next thirty minutes or so, without even once taking my phone out.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.61.1\"\u003e“Guess I should head back,” I muttered.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.62.1\"\u003eWhen it felt like everyone in the bathroom was completely gone, even from the handwashing stations, I got up off the toilet, flushed, washed my hands, and then left the bathroom.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.63.1\"\u003e“Looks like you’re finally done with your shit.” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.63.2\"\u003eRyuuen leaned against the wall near the entrance to the restroom, phone in hand, sneering at me.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.64.1\"\u003e“How long have you been here?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.64.2\"\u003eI asked.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.65.1\"\u003e“I was just wonderin’ how things were goin’. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.65.2\"\u003eLet’s you and me have a chat,” said Ryuuen.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.66.1\"\u003e“Come on, man. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.66.2\"\u003eThe special exam’s tomorrow, remember? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.66.3\"\u003eIf people see me together with you in a place like this, who knows what people’ll think. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.66.4\"\u003eYou could’ve come to my room or something,” I replied.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.67.1\"\u003e“If yer innocent, then just act confident,” said Ryuuen.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.68.1\"\u003e“You’re being ridiculous. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.68.2\"\u003eMake it quick, will you?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.68.3\"\u003eI replied.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.69.1\"\u003eIt was one thing for me to do the contacting, that was fine, but I didn’t like being taken off guard. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.69.2\"\u003eThat was especially true in Ryuuen’s case because he was sloppy. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.69.3\"\u003eHowever, having a dialogue with him was unavoidable if I wanted access to the inner workings of his class. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.69.4\"\u003eThey were stormy seas, but the more I could see, the more I could ride those waves.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.70.1\"\u003e\u0026#160;\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.71.1\"\u003e6.2\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.72.1\"\u003e\u0026#160;\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.73.1\"\u003eI\u003c/span\u003e\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.74.1\"\u003e SPENT MY \u003c/span\u003e\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.75.1\"\u003ewhole day off, from the morning on, with Kei at Keyaki Mall. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.75.2\"\u003eI think she was able to enjoy herself well enough, though she occasionally expressed her anxiety about tomorrow’s special exam. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.75.3\"\u003eWe returned to the dormitory together, talking about trivial nonsense on the way.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.76.1\"\u003eWhile we were walking, my phone rang. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.76.2\"\u003eIt was Kanzaki. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.76.3\"\u003eKei peeked at my phone, wondering who I had gotten a call from but immediately lost interest once she saw the name and took out her own phone to play with. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.76.4\"\u003eWe stopped in place and I answered.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.77.1\"\u003e“What’s up?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.77.2\"\u003eI asked.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.78.1\"\u003e“Where are you right now? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.78.2\"\u003eI went directly to your room, but you aren’t back yet.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.79.1\"\u003e“I’m heading back right now. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.79.2\"\u003eWhat do you want?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.79.3\"\u003eI asked.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.80.1\"\u003e“Could we have a moment to talk? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.80.2\"\u003eI’m here, and so is Watanabe. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.80.3\"\u003eWould that be all right?”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.81.1\"\u003eI sometimes talked to them when we would meet up somewhere, but it was unusual for them to come directly to my room spontaneously.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.82.1\"\u003e“I’m on my way back right now,” I replied.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.83.1\"\u003e“May we continue to wait outside your room?”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.84.1\"\u003eI told him that was okay and then ended the call. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.84.2\"\u003eKei also put her phone back in her pocket at the same time.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.85.1\"\u003e“What did Kanzaki-kun want? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.85.2\"\u003eI heard Watanabe-kun’s name too,” said Kei.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.86.1\"\u003e“Dunno. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.86.2\"\u003eApparently, they want to talk to me, and they’re waiting outside my room. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.86.3\"\u003eSorry, but you and I are going to have to call it a day,” I replied.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.87.1\"\u003e“Okay. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.87.2\"\u003eAre you close with those two?”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.88.1\"\u003e“I was in a group together with Watanabe during the school trip, but we’ve only recently started talking.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.89.1\"\u003e“Oh? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.89.2\"\u003eSeems like you’ve been making a lot of friends, huh?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.89.3\"\u003eKei nodded her head a few times, sounding deeply impressed and proud of me. \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.90.1\"\u003eWe rode the elevator to the fourth floor. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.90.2\"\u003eWhen the doors opened, I saw them: Watanabe and Kanzaki. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.90.3\"\u003eWatanabe noticed us and waved.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.91.1\"\u003e“Okay, text me later! \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.91.2\"\u003eOh, but no rush, you can totally take your time,” said Kei.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.92.1\"\u003eKei spoke with a smile on her face, because if it was guy friends, then there was no problem. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.92.2\"\u003eShe welcomed me spending time with men anytime. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.92.3\"\u003eNow that Kei and I had made up, she had much less anxiety.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.93.1\"\u003e“I apologize for the unexpected visit. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.93.2\"\u003eWere you by any chance planning on spending time alone with her?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.93.3\"\u003easked Kanzaki as I approached.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.94.1\"\u003e“You don’t have to worry about it. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.94.2\"\u003eBesides, it’s not often that you two come to see me. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.94.3\"\u003eCome in,” I replied.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.95.1\"\u003eI unlocked the door and invited them inside. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.95.2\"\u003eThe two of them looked somewhat bewildered when they looked around the living room, probably because it was so colorful. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.95.3\"\u003eThe girlish presence was quite strong. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.95.4\"\u003eI directed them to sit down and asked them what they wanted to drink. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.95.5\"\u003eHowever, shortly after I headed into the kitchen, Kanzaki stood and followed me. \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.96.1\"\u003e“I was asked to keep this quiet because they weren’t sure if they could come earlier or not, but after I told them that I had just met up with you, two more people asked if they could come. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.96.2\"\u003eDo you mind?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.96.3\"\u003easked Kanzaki.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.97.1\"\u003e“Okay, well, I’ll have to get them refreshments too. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.97.2\"\u003eWho’s coming?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.97.3\"\u003eI asked.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.98.1\"\u003e“Ichinose and Amikura,” said Kanzaki.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.99.1\"\u003eI didn’t have any problem with adding more people, but I couldn’t guess what was going on based on this particular crew. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.99.2\"\u003eKanzaki was part of the reformist camp, so to speak, who was now making moves because he wanted Ichinose and the class to change. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.99.3\"\u003eOn the other hand, Ichinose was part of the conservative camp, who wanted to maintain the current situation. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.99.4\"\u003eIt seemed like Ichinose was keeping an eye on Kanzaki. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.99.5\"\u003eOr maybe I was just reading into things too deeply. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.99.6\"\u003eThere wasn’t any sign of Himeno or Hamaguchi—Kanzaki’s supporters—coming either.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.100.1\"\u003e“We have settled on a course of action for our class regarding the upcoming special exam, and Ichinose said that she wanted to have a final, brief check with you, Ayanokouji. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.100.2\"\u003eHowever, I don’t know if there will be any benefit to you in hearing what we have to say,” said Kanzaki. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.100.3\"\u003eHe was apologetic and not exactly thrilled about the topic of conversation.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.101.1\"\u003e“Nah, I don’t mind. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.101.2\"\u003eHow did Watanabe and Amikura end up being part of this, though?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.101.3\"\u003eI asked.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.102.1\"\u003e“Watanabe and I just happened to run into one another while I was on my way to your room, Ayanokouji,” said Kanzaki.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.103.1\"\u003e“Yep, coincidence,” added Watanabe.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.104.1\"\u003eI guessed that he probably caught wind that Amikura would be coming somehow and pretended it was a coincidence so he could tag along. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.104.2\"\u003eOr was I being too suspicious? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.104.3\"\u003eI didn’t really care either way, so I held back from asking him. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.104.4\"\u003eWe turned on the TV and passed the time for about fifteen minutes until my doorbell rang. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.104.5\"\u003eWhen I went to answer it, I found Ichinose and Amikura at my door. \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.105.1\"\u003eThey’d brought some snacks that they bought from Keyaki Mall as gifts. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.105.2\"\u003eAfter preparing drinks for everyone again, I adopted a listening posture.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.106.1\"\u003e“You might have already heard this from Kanzaki-kun, but I really wanted to talk to you about tomorrow’s special exam, Ayanokouji-kun. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.106.2\"\u003eI’ve been thinking about coming to you for a while. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.106.3\"\u003eI’m really sorry for the short notice,” said Ichinose.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.107.1\"\u003eOh, so this wasn’t spur of the moment, hm?\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.108.1\"\u003e“I don’t really mind, but I’m not the leader. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.108.2\"\u003eIf you want to know about our class’s internal affairs, or if you want to find out what our plans are for the exam, you’ll have to speak with Horikita directly,” I replied.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.109.1\"\u003e“Oh no, it’s okay. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.109.2\"\u003eActually, if anything, it’s more like something we wanted to tell you,” said Ichinose.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.110.1\"\u003e“Hold on a minute. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.110.2\"\u003eBefore you talk to Ayanokouji, there’s something I’d like to ask you first,” said Kanzaki.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.111.1\"\u003e“Hm? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.111.2\"\u003eWhat is it?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.111.3\"\u003easked Ichinose.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.112.1\"\u003e“If this is about collusion or something along those lines, I’d like to make it known that I am firmly against that,” said Kanzaki, preempting that conversation.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.113.1\"\u003eHe was only worried about cooperation between two classes, not four, so he meant something specific.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.114.1\"\u003e“You’re worried about the possibility of me having all four classes get the same score, right?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.114.2\"\u003esaid Ichinose.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.115.1\"\u003e“Bluntly, yes,” replied Kanzaki.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.116.1\"\u003e“Why didn’t you bring that up during the class meeting?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.116.2\"\u003easked Ichinose.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.117.1\"\u003e“If I voiced a statement saying that I was against colluding, but then you spoke up and were in favor of it, they would have supported you just to support you. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.117.2\"\u003eI wanted to avoid that. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.117.3\"\u003eI cannot do anything if there are talks going on behind the scenes without my knowledge of course, but I could not let talk of collusion happen right before my eyes,” said Kanzaki.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.118.1\"\u003eKanzaki had preferred to put a stop to the idea in a more private setting, like now. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.118.2\"\u003eWith me lending a helping hand in reforming his class, he could use me as an ally to thwart collusion. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.118.3\"\u003eI’m sure he must have factored that into his plans.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.119.1\"\u003e“The special exam is tomorrow though, right? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.119.2\"\u003eIsn’t it a bit late to propose having all four classes collude now?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.119.3\"\u003easked Amikura. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.119.4\"\u003eIt was common sense.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.120.1\"\u003e“Normally, yes, you’d be right. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.120.2\"\u003eHowever, Ichinose being Ichinose, I wouldn’t be surprised if she were thinking about it until the very last minute, to avoid the risk of expulsion. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.120.3\"\u003eShe could even change her mind to protect her friends,” said Kanzaki.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.121.1\"\u003e“If all four classes were clearly aligned on a plan like that ahead of time, and such a thing were solidly feasible, then yes, I would be open to considering a proposal like that. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.121.2\"\u003eEven if we lose Class Points, if all classes got the same result, it would be perfectly fair. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.121.3\"\u003eAnd as you said, Kanzaki-kun, I have been thinking about the feasibility of that, even now,” replied Ichinose.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.122.1\"\u003eKanzaki, hastily jumping to the conclusion that the development he had feared was happening, tried to argue back. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.122.2\"\u003e“Just as I thought… However, that would mean we would lose our chance to move up the rankings and—”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.123.1\"\u003e“Don’t worry. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.123.2\"\u003eI didn’t come here to ask Ayanokouji-kun to collude with us,” Ichinose cut in politely, gently putting a stop to Kanzaki’s protests. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.123.3\"\u003e“If that \u003c/span\u003e\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.124.1\"\u003ewere\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.125.1\"\u003e my intention, it would’ve made more sense to talk directly with Horikita-san,” he added reassuringly.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.126.1\"\u003eKanzaki most likely wasn’t comforted by Ichinose’s words. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.126.2\"\u003eEven if they weren’t talking about collusion, if she put forward a strategy that was meant to avoid expulsion, that would be a similar outcome. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.126.3\"\u003eIf she stuck with a stance of protecting her classmates even if it put her at a disadvantage, victory would likely move further out of their reach.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.127.1\"\u003eTo keep his anxiety from showing outwardly, Kanzaki clumsily made a show of being relieved. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.127.2\"\u003e“In that case, good. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.127.3\"\u003eI am sorry for derailing the conversation like that. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.127.4\"\u003eI guess I do that. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.127.5\"\u003eI’m a pretty bad conversationalist.” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.127.6\"\u003esaid Kanzaki.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.128.1\"\u003eWe assured him it wasn’t a problem.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.129.1\"\u003e“Kanzaki-kun, it seems like you’ve gotten to be really close with Ayanokouji-kun,” observed Ichinose.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.130.1\"\u003e“…Oh?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.130.2\"\u003ehe asked.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.131.1\"\u003e“Yeah. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.131.2\"\u003eI think that if you were the old Kanzaki-kun, even if you had something on your mind, you wouldn’t have said anything about our class in front of him. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.131.3\"\u003eI’m sure that if, for example, it was Hirata-kun or Kaneda-kun here, your response would’ve been totally different.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.132.1\"\u003eKanzaki cocked his head to the side, confused. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.132.2\"\u003eShortly after Kanzaki started making his move with Himeno and the others, Ichinose herself had already sensed that things were changing. \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.133.1\"\u003e“Enough about me. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.133.2\"\u003eContinue with your conversation,” said Kanzaki.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.134.1\"\u003eIchinose responded to him with a smile and a nod, and then turned to me.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.135.1\"\u003e“So, the reason I came to see you, Ayanokouji-kun, and not Horikita-san, is…”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.136.1\"\u003eI prepared myself, wondering what she was going to say, but when she finally came out with it, it wasn’t a big deal, honestly. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.136.2\"\u003eWhat she said was closer to a list of aspirations, like that she wanted to win together with her friends, and that she didn’t want to lose. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.136.3\"\u003eExpressing such notions didn’t require a big meeting. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.136.4\"\u003eEven Kanzaki, who had been listening along with a stiff expression at the start, relaxed his guard partway through.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.137.1\"\u003eOnce that was over, our get-together switched to being a casual chat—no more mention of the special exam at all. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.137.2\"\u003eThe presence of Watanabe, the life of the party, kept the conversation animated, and our meeting ended like a normal, friendly get-together. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.137.3\"\u003eIt was around six o’clock in the evening, and was already darkening outside, when Kanzaki suggested we wrap things up. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.137.4\"\u003eOur meeting had ended. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.137.5\"\u003eIchinose and Amikura left through the entranceway to my room first, followed by Kanzaki, and then finally Watanabe.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.138.1\"\u003e“Man! \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.138.2\"\u003eI wasn’t sure what was gonna happen today, but it ended up being lots of fun!” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.138.3\"\u003eexclaimed Watanabe.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.139.1\"\u003eI signaled Watanabe with my eyes, telling him, “\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.140.1\"\u003eThat’s because you could talk with Amikura without worry, right?”\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.141.1\"\u003e When he got my message, he responded with a big, bright smile.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.142.1\"\u003eAfter I shut the door on the final parting words of “Sorry to have bothered you! \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.142.2\"\u003eThanks for having us!” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.142.3\"\u003emy room immediately fell back into silence. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.142.4\"\u003eThe sounds coming from the TV hadn’t reached my ears until just now, and it was so harsh and annoying that I immediately turned it off. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.142.5\"\u003eThen, when I reached over to pick up the cups left on the table…\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.143.1\"\u003eDing dong\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.144.1\"\u003e. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.144.2\"\u003eMy doorbell rang.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.145.1\"\u003eI still hadn’t contacted Kei yet, so there was no way that she would’ve come back without checking. \u003c/span\u003e\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.146.1\"\u003eWho could it be?\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.147.1\"\u003e I wondered. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.147.2\"\u003eI opened the door while thinking that this was a little bit curious. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.147.3\"\u003eWhen I opened the door, I saw Ichinose standing there, who, for some reason, had returned alone.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.148.1\"\u003e“I’m sorry, Ayanokouji-kun. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.148.2\"\u003eI think I forgot my phone…” said Ichinose.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.149.1\"\u003eAh, was that all?\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.150.1\"\u003e“Your phone? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.150.2\"\u003eWhere was it? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.150.3\"\u003eI’ll go get it for you,” I replied.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.151.1\"\u003e“Um, I think it’s probably under the table. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.151.2\"\u003eI’m really sorry,” said Ichinose.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.152.1\"\u003eIt wasn’t unusual for people to forget their phones, and I supposed Ichinose was no exception. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.152.2\"\u003eOur cell phones were a necessity in our daily lives, and since we spent a lot of time with them, it was easy for people to accidentally forget them, only to quickly realize they were gone. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.152.3\"\u003eKei often forgot her phone in my room and would hurriedly come back and get it in a panic.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.153.1\"\u003e“Wait a minute,” I answered.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.154.1\"\u003eI had Ichinose wait in the entranceway of my dorm and I went to check under the table. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.154.2\"\u003eI immediately noticed that there was indeed a cell phone right next to where she’d been seated. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.154.3\"\u003eAfter ten or so seconds of searching under the table and walking back to the door, I handed the phone back to Ichinose.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.155.1\"\u003e“Thank you. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.155.2\"\u003eI’m sorry to have bothered you again,” said Ichinose.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.156.1\"\u003e“No worries. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.156.2\"\u003eSee ya later,” I replied.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.157.1\"\u003e“…Hey, um, would it be okay if I talked to you for a little while?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.157.2\"\u003easked Ichinose.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.158.1\"\u003eWe had already chatted quite a bit, but girls could jump from one conversation to the next. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.158.2\"\u003eI nodded in approval, feeling more understanding than surprised. \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.159.1\"\u003e“If people were to see the two of us alone though, they might get the wrong idea, so why don’t we lock the door?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.159.2\"\u003esaid Ichinose.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.160.1\"\u003eShe turned around and reached out for the front door, but then she quickly changed her mind, and refrained from doing so.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.161.1\"\u003e“Actually, no, wait, that’s probably not okay. \u003c/s
