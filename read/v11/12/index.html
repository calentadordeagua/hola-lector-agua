],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T28493,"])</script><script>self.__next_f.push([1,"\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 6:\u003cbr/\u003eTraps, Home Cooking, and a Favor\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eRATHER UNUSUAL INCIDENT\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e occurred the same day. It happened at the start of lunch break, when the Ayanokouji Group made their way to the cafeteria. As I walked with Akito and the others, we heard someone shout, somewhat aggressively.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, Ichinose. We should definitely say something about this! We gotta protest!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe person who shouted those words was none other than Shibata, from first-year Class B. He was accompanied by two other students form Class B: Ichinose and Kanzaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh, now \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethere’s\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e something you don’t see every day. It’s pretty unusual for Shibata-kun to get that angry,” said Haruka.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, that’s definitely not something I’d expect,” replied Akito.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTheir surprise was understandable.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really?” asked Airi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe didn’t seem to know anything about it at all, since she didn’t really involve herself with the other classes. Shibata was part of the soccer club. He was bright, cheerful, popular, though a little different from Hirata. As far as I knew, he wasn’t the kind of person to raise his voice like that.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But isn’t it possible that it was just a simple coincidence?” replied Ichinose calmly, trying to reason with the upset Shibata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Shibata seemed to be convinced otherwise, because he immediately denied the possibility.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not. That was the third time just today. Get it? They’re definitely trying to pick a fight!” he asserted.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKanzaki noticed us on our way to lunch, and gently gestured to Shibata, who looked over at us with an embarrassed expression on his face. He was trying to play it cool, but it was already too late. There was an awkward silence.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, were you guys just on your way to lunch?” asked Ichinose, calling out to us.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe wasn’t addressing a specific person, but rather our group as a whole. My friends hadn’t really interacted much with the leader of Class B, so they felt flustered, unsure of how to respond. Haruka, standing next to me, jabbed me in the side with her elbow. I decided to speak up on behalf of the group.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yeah. We’re headed to the café. What’s up?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter hearing my answer, Ichinose clapped her hands together happily.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, hey, what a coincidence. We’re headed there too,” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI noticed something a little strange. Normally, Ichinose always made eye contact with me when we talked. But today, she wasn’t.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, if you like, how about we all have lunch together?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone in the Ayanokouji group exchanged glances with one another, a bit bewildered at this unexpected invitation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you doing, Ichinose?” asked Kanzaki. He sounded a little flustered and confused, probably because he hadn’t expected Ichinose to offer us something like that.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What am I doing…? We’re not competing against Class C or anything, so it’s not a problem, is it?” she replied?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s true, it’s not, but…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKanzaki didn’t seem that open to the idea of inviting us to join them for lunch. But, if Ichinose had already settled on it, there was no way he could refuse her. We, on the other hand, were left a little unsure of what to do or how to answer… \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, time’s a-wastin’! Let’s go!” said Ichinose cheerfully.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen she smiled like that, there was no way anyone could refuse her.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e6.1\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eW\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eE JOINED TWO TABLES\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e in a corner of the café and ate lunch together. Not only was this group made up of Class B and Class C students, but it was just a generally odd combination of folks.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry for inviting you to join us out of the blue like that. It’s my treat though, so please, eat up!” Ichinose apologized, then announced happily.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you sure about that, Ichinose?” said Kanzaki, reacting strongly to her offering to treat us. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the last special exam, Ichinose had made a deal with Class D. She’d had her class cast their praise votes for Ryuuen to keep him from being expelled, and in return, she’d saved a Class B student from the same fate. Doing so should have used up all her private points. I\u0026#160;was sure she’d come up with some way to get by and make ends meet, but it wasn’t like she could afford to live lavishly. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We were already planning to eat here, like we usually do, so we can cover ourselves,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone in the group nodded in agreement.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I kind of strong-armed you into coming, though, so you don’t have to force yourself…” said Ichinose quietly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah, it’s all right. This way, we can all eat without feeling guilty.” I declined her offer, using the pretense of us then being able to enjoy our lunch as equals.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So…why \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e you invite us to join you, anyway?” asked Keisei, apparently unable to hold himself back any longer. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I guess it’s because you all just seemed so shocked at how Shibata-kun was acting earlier. I figured it might be less confusing for everyone if I told you the whole story up front, rather than letting wild speculation get around,” reasoned Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer judgment might be correct. If Ichinose hadn’t approached us, we’d probably have discussed what happened with Shibata among ourselves for a while, wondering why he was so angry. We might have talked to a third party and unintentionally gotten the word out,\u0026#160;too.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you sure it’s okay to tell them?” asked Kanzaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you really think this is something we need to keep on the down-low?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We can’t rule out the possibility that someone in Class C might be involved.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if there is, it wouldn’t really make much difference, would it?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, Ichinose’s got a point there. Honestly, we’re just grumbling,” said Shibata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs soon as Shibata spoke up, Kanzaki shot him a sharp glare.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what, Kanzaki?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nothing…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShibata didn’t seem to understand the true meaning of what Kanzaki was trying to tell him with that look. He was probably trying to rebuke Shibata for so carelessly using the word “grumbling,” but the other students didn’t seem to notice anyway, so it didn’t matter.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, now that they’ve heard this much, don’t you think it’d be best to just tell them?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I suppose.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShibata’s thoughtless comment had apparently been the deciding factor, causing Kanzaki to back down.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To put it simply, it seems like Class D has been, well, kind of harassing us lately,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Kind of?”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e replied Shibata, incredulous. “They’ve been messing with me, Nakanishi, and even Beppu. It’s like, I dunno. They’re messing with us for no reason at all or like, they’re just \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003efollowing\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e us around. I heard Beppu was nearly scared to death when Albert silently cornered him against a wall!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKanzaki must have decided it wouldn’t really matter at this point if he spoke up or not, since we’d already heard this much. So, he joined the conversation, too. “I\u0026#160;interviewed both Nakanishi and Beppu. Their stories check out.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhich meant Class D had been targeting some Class B students since the start of the special exam. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But it’s not like anyone’s actually gotten in a fistfight, have they?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For now, no.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo Class D students had just been intimidating kids and following them around. They hadn’t caused any physical damage so far. Of course, if they \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eend up crossing that line and resorting to physical violence, there’d be trouble.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess this is just their way of trying to put pressure on us. I suspect their plan is to keep this kind of harassment going until the big exam day, in order to wear us down and dull our judgment.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, gimme a break, man. Class D is just flat out scary, that’s who they are. I mean, even Class C has gotten caught up in their shenanigans before. I’m sure they know what we’re talking about, y’know?” said Shibata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShibata was probably referring to the time Sudou got in a fight with Ishizaki and Komiya. Keisei, who had been quietly listening to the conversation so far, now opened his mouth to speak.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know it’s probably weird to get advice from another class, but come to think of it, this isn’t unusual. It’s certainly true that Class D has a reputation for being the bad guys, but I think a certain degree of pressure is only to be expected from this exam. In fact, we’ve had people from Class A trying to spy on us, apparently,” said Keisei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh, really?” asked Shibata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKeisei responded with a nod before proceeding to tell them how a student from Class A hung around near our classroom and tried to eavesdrop on our conversations.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Class D is desperate, too. I wonder if they’re also trying to get their hands on whatever information they can get?” said Shibata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe seemed totally convinced, just based off of the meager information he’d gotten from Class C. That being said, it certainly seemed like Class B was the one suffering the most here.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, there’s no denying the fact that if we played it straight, our class would definitely have the advantage in this exam. We should expect the possibility that they’ll continue to harass us like this until they get to the very limit of what’s considered acceptable without violating school rules,” reasoned Kanzaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe only part of this theory that stuck out to me was the fact Class D was only harassing \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003esome\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e students. Was it possible they’d decided it was too risky to go after Ichinose and Kanzaki…? Or did they have another goal in mind?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t imagine this is a strategy that Kaneda-kun thought of, though. Maybe Ishizaki-kun?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, maybe.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know it worries you, but we need to just do the best we can. We’ll pick events that make good use of our class’s unity, so that we don’t let our teamwork get disrupted, and try our hardest on the day of the actual exam. Right?” asked Ichinose. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKanzaki and Shibata both nodded in agreement.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Meaning you’re not going to do anything in response to Class D, Ichinose-san? Not even reconnaissance?” asked Keisei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. We’re not going to do that. We’re going to focus on dealing with the ten events that come out next week,” said Ichinose. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBasically, that meant they intended to continue fighting as themselves, focusing on bettering themselves. They wouldn’t be sidetracked by the hunt for information, but would face things head-on, relying on the truth. A solid and reliable approach.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow. I don’t know what to say, except that you Class B folks really are incredible?” said Keisei, astonished. He continued, “But wouldn’t you normally do whatever it takes to beat a class above you? I mean, if things like spying and silent intimidation are effective, then you should probably use them. To be honest, focusing on yourself, not doing anything to your opponent, taking the high road—that’s not something our class could possibly do.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I don’t know if I’d put it like that. Maybe it’s just that we’re not clever enough to do that kind of stuff?” replied Ichinose, with a smile. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, I think I understand what you wanted to tell us. If we went around casually telling people about Shibata being all angry earlier, we’d basically be signaling to everyone that Class D’s strategy is working,” said Keisei, having unraveled the meaning behind why Ichinose had invited us all out to lunch.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Class D found out what kind of damage their harassment was doing to Class B, it would just encourage them to keep it up, meaning Class B would have even more to deal with than they already did. Class B wanted to hold their ground instead and maintain that Class D’s strategy was pointless.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Exactly. Which is why I’d like to ask you to please not spread it around too much, if at all possible,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It wouldn’t benefit us at all to do so. And we don’t want to make an enemy of Class B,” answered Keisei, accepting her request.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka, Akito, and then Airi all nodded in agreement, without hesitation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you so much, everyone!” exclaimed Ichinose. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs she did so, our eyes met for the first and only time that day. In that moment, she casually brushed her hair away from her face. As if carried on the wind, a faint citrusy scent tickled my nose. She quickly looked away, returning her gaze to our group as a whole. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose really was acting a little strange today. Not that I was going to point that out right now.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e6.2\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eW\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHEN LUNCH HAD ENDED\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e and we parted ways with Ichinose and the folks from Class B, Haruka spoke up.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, Ichinose-san sure is cute, isn’t she? Oh, and that last smile she gave us at the end there? Ugh, it’s like, not fair. Don’t you think so?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Me? Not really…” replied Keisei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Yukimuu, your face is turning red just thinking about it!” she teased.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is not!” he protested.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, there’s no point in denying it. I’m a girl, and even I think she’s cute. I bet guys are totally head over heels for her,” said Haruka.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAiri must have agreed, because she was nodding along vigorously.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You think so too, right? Miyachi? Ayanokouji-kun?” asked Haruka.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince Akito and I didn’t want to be targeted like Keisei, we just wore wry smiles and dodged the question.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know, I might have just been imagining it, but… Has Ichinose-san ever used perfume before?” asked Airi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, hey, I picked up on that too. She was wearing some kind of citrus-scented perfume, right?” said Haruka.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. That might have been what surprised me the most. Maybe she’s got something on her mind or something?” said Airi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, what do the three of you think?” Haruka asked, posing us guys a question we couldn’t possibly know the answer to.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, was she wearing perfume? I mean, even if she was, maybe it’s just because she felt like it or something?” replied Keisei, matter-of-factly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHis offhanded comment prompted an openly exasperated sigh from Haruka.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh, boys, really… They never really notice the small changes, do they?” sighed Haruka.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…More importantly, it looks like we’re not the only ones having trouble. It seems Class B has a tough road ahead of them, too.” Akito changed the subject, probably not wanting to deal with any more of Haruka’s teasing.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Class D probably can’t afford to care about appearances if they’re going to win against a higher-ranked class. It’s possible they might escalate their harassment even further, going forward,” said Keisei, taking this chance to bail on the previous conversation and hopping onto the topic Akito presented.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHis prediction was probably accurate. It seemed there were only three people being harassed so far, but it wouldn’t be surprising if the number of victims crept up. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And Ryuuen’s nowhere to be found, either. So they probably won’t stand a chance of winning if they \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edon’t\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e do at least that much.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even so, it feels to me like they’re pretty much following Ryuuen-kun’s example, anyway, and doing what he would’ve done.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTrue enough. Applying pressure like this was definitely the kind of strategy Ryuuen would come up with.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But it’s pointless, isn’t it? That’s not going to be enough to break Class B’s defenses. After talking with them today, I thought, maybe it’s a \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003egood \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ething that we’re up against Class A this time. Because I really don’t want to be fighting Class B,” said Keisei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? What makes you think that, Yukimuu?” asked Haruka.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, the depth of their solidarity and the fact that they approach things honestly, without overestimating themselves, is incredible. I don’t think any other class can even touch them in that area. It allows them to consistently produce good results, no matter the test. I don’t think we could beat them,” said Keisei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass B would pull through anything and everything, all while holding to a higher standard than the rest of us. At least, that was what Keisei seemed to be afraid of.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But like, even if they’re above average at, like, everything, it doesn’t really mean anything if they lose anyway,” said Haruka.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if they got eighty or ninety points in all seven events, if their opponents got a hundred, they’d still lose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How do you think we can keep winning when we don’t even know what the seven final events will be on the day of the exam? Sure, there might be some events that we Class C and Class D students specialize in and can win at. But we’re also the classes that could end up losing miserably and getting terrible results,” said Keisei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see… You might be right about that,” said Airi, nodding several times in response, convinced that what Keisei said was correct.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, hold up!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe were about to turn the corner in a hallway, with Keisei walking at the head of the group. Haruka shouted and grabbed his arm, getting him to stop.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wha—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKeisei tried to ask her what was up, but she placed her hand over his mouth and pointed in front of us. She was pointing at Ike and Shinohara, who were walking just a little ways in front of us.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-hey, Shinohara,” said Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What is it?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well… Umm.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, spit it out. What?” said Shinohara.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe all stood there silently, listening in on the conversation that was going on just a short distance away from us.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Hey, uh, on Sunday, are… y-you, y’know, f-free?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sunday? I don’t really have particular plans or anything on that day, no, but… Why?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why? Well, uh, it’s just, I dunno, I was wondering if maybe you’d wanna hang out. Or something. Like if we could go somewhere.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe could barely hear their conversation. Haruka and Airi exchanged looks, apparently really enjoying this. Keisei and Akito, on the other hand, were the exact opposite. They looked entirely exasperated. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sunday’s White Day, isn’t it? Do you think that maybe Shinohara-san gave Ike-kun chocolate on Valentine’s or something?” asked Airi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe,” replied Haruka.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough Shinohara had sounded skeptical of Ike’s invitation at first, she seemed to gradually understand what was going on here.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, you know, it’s just, like, since you gave me chocolate and all, I, uh…thought I’d, y’know, return the favor,” said Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re being so sincere, even though that was just obligation chocolate. I mean, do you even have the money to do something like that?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I do have a little saved up… B-But anyway, if you don’t want to, it’s okay, we can just forget about it,” said Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I never said I was against it, though,” said Shinohara.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Th-then…?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“D-Don’t get the wrong idea, okay? It’s just that our special exam is coming up soon and this is our last chance to relax a little. And if you’re offering to treat me, then I’d feel bad turning you down,” said Shinohara.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor some reason, this reminded me of the story I’d heard this morning, about the whole roommate thing. Various small seeds of love might have begun to take root in places I didn’t even know about.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s go.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-Huh? Hey, wait! It’s just getting juicy!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t stick your nose into other people’s relationships.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAkito grabbed Haruka by the nape of her neck and pulled her away, walking her in the opposite direction.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, what’s the harm in listening just a little bit longer? I’m getting butterflies!” she protested.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not,” he answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh, this is exactly why I say you boys are so clueless… Right, Airi?” huffed Haruka.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yeah. I kind of feel like I’m getting butterflies too, a little… But it’d be pretty embarrassing if they saw us, wouldn’t it?” said Airi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah, I guess, but I’m sure \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethey’d\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e feel more embarrassed if that happened.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed that if we were to get in the way here, we might interrupt the budding of this new relationship.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e6.3\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eW\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eE WERE STILL\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e in the phase when everyone was suggesting events that they were good at. The after-class gatherings become less and less frequent with every passing day. As that happened, though, the huge chat group for Class C discussion became more and more active. Kouenji and Hirata still hadn’t contributed to the chat, but the way it was structured, anyone could participate at any time of day. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs it turned out, this might have been a better fit for our class, judging from the active exchange of opinions in the chat, because people didn’t generally summon the courage to speak up out loud, in person. That was the sense I got at a glance, as an outside observer, anyway. I\u0026#160;was simply waiting for Horikita to finish everything that I’d trusted her to handle. It would be fine to think about our strategy and what part the commander would play later.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStill, there were a few things that remained worrisome. Kouenji and Hirata. Hirata in particular, at the moment. Horikita probably had no way to resolve that issue herself right now. Judging by the fact that the two of them hadn’t joined in the group chat, they probably weren’t actively preparing themselves for the special exam. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn Kouenji’s case, his absence was pretty much par for the course. Hirata’s absence, though, was painful.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata had changed almost completely. Even now, he continued acting as though he were an entirely different person. For lack of a better term, he was basically a tumor. An eyesore. Although he was an important person, no one could touch him. There was basically nothing anyone could do but just pray the swelling would go down. It was a real shame, since he’d be a jack of all trades if he were his usual self, the kind of ace up our sleeve that we could put in play no matter the event.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen, there was another concern.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Hirata-kun!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs Hirata headed back to the dorm, Mii-chan chased after him. How many times had this scene played out already? Even though more and more people continued to give up on Hirata, Mii-chan still hadn’t. Unfazed, she called out to Hirata yet again. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWas this what love could do to a person? No…even if it was love, I still had some doubts. She had to be afraid Hirata would come to hate her for pursuing him so persistently. But why did she keep doing it, then?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s like, really hard to watch Hirata-kun when he’s like this…” said Kei quietly, speaking to her group of girlfriends, who had remained behind in the classroom.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. Is it okay to just leave him alone like this, Karuizawa-san?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think it’ll make any difference even if I do say something to him, though. He’ll probably just resent me,” said Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe way Hirata had completely shut Kei down when she reached out to him the other day was probably still fresh in everyone’s minds. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. I mean, first Hirata-kun got dumped, and then Yamauchi-kun got kicked out, and…” said one of the girls.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI cast a sideways glance at the girls as they chatted, then left the classroom myself. All things considered, my goal today wasn’t Hirata. I was going to do some digging into how to deal with another thing that was worrying me. It involved another student who’d left the classroom after Mii-chan did.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, do you have a minute?” I asked, calling out to a girl. After a short pause, she turned around.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s up, Ayanokouji-kun?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had called out to none other than Kushida, who’d had no noteworthy input on this special exam so far. She wasn’t helping her classmates, but neither was she getting in anyone’s way, either. Instead, she was staying quiet, simply being part of the class. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNormally, Kushida would have taken something of a sub-leader position, supporting the rest of the class. This time, however, I saw no signs of that happening. There were probably two reasons for that. The first was probably because her position had been shaken during the last exam, the in-class voting. Even though you could say that she’d been used by Yamauchi, the fact that she was complicit in the attempt to get me expelled had come to light for all to see.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMany of our classmates seemed to have decided there was enough leeway there to be sympathetic to Kushida, but this still posed something of a problem for her. The incident had damaged the thing she took such pride in: her reputation as a truly good person. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe other reason was because Horikita was playing the part of leader. This was probably the main reason why Kushida was behaving the way she was now. She’d disliked Horikita from the very beginning, because Horikita knew all about her past. And on top of that, Horikita had strongly reprimanded her during the class vote.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhatever the reason, she’d been verbally attacked, blamed for trying to get someone unfairly expelled. That had to have been a death blow to her pride. Knowing this, I purposefully decided to talk to her anyway.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see you haven’t really been supporting Horikita this time,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter all, I wanted to understand what Kushida was planning to do in this special exam. The smiling mask she usually wore made it impossible to guess her true feelings, no matter how hard you looked. You’d have to see her real self—the one that lay beneath the mask—to understand.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shall we walk and talk?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_2\" src=\"/hola-lector-agua/images/books/v11/OEBPS/Images/INTERIORIMAGES_2.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNot wanting our conversation to be overheard by anyone nearby, Kushida suggested we take a walk.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you have any plans today?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. I’m going to hang out a bit with some girls from Class B. Do you think it’s wrong of me to spend this precious time before our exam hanging out with friends?” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, you gotta take time to relax. I think everyone in our grade would agree with that,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt would be silly to spend all of your time thinking solely about the exam, twenty-four hours a day. When it was time to focus, you should focus. When it was time to loosen up, you should loosen up.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You understand, don’t you? The reason why I’m not doing anything? I helped Yamauchi-kun. I even thought it’d be fine if you got expelled, Ayanokouji-kun. Now, because that fact has come to light, how could I possibly be seen leading the rest of the class?” she said, touching on the subject herself. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe had purposefully not mentioned Horikita being the main reason. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re making a face that says you’re not convinced,” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I guess I’m not.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let me just be clear about this. It’s not like I don’t want to help out just because Horikita-san is the leader. Okay?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really, really.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI nodded in response. She was lying, though.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t believe me,” said Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, of course I didn’t. But even though I wasn’t showing it on my face, Kushida had decided that was what I was thinking. She had already determined that I was suspicious of her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How do I look to you right now, Ayanokouji-kun? Give me your honest thoughts.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I guess…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOn the outside, she looked like a classmate with a cute smile. However… \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI tried to imagine what Kushida’s true personality looked like, that she kept hidden underneath her mask.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“That bitch! I’m going to totally kill her! She humiliated me in front of everyone in class?! I’m never, ever letting that go! I’ll kill her! Kill, kill, kill! I am going to completely destroy her!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA vein throbbing in her temple, hurling insults and abuse at Horikita. Shouting a series of words that you couldn’t bear to listen to.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_3\" src=\"/hola-lector-agua/images/books/v11/OEBPS/Images/INTERIORIMAGES_3.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…………”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t begin to describe what I’d just pictured.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You thought of something incredibly rude just now, didn’t you?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No… Not at all,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe extreme mental image had left me at a bit of a loss for words. I shook those thoughts out of my head and decided to cut right to the chase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you can’t help me out, then I’ll do my best to honor your wishes as much as I can.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And in exchange, you want information… Right?” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida was well aware of what this special exam meant.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Exactly,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is there no one else in class that you can rely on right now, Ayanokouji-kun?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough her smile never faltered, I knew she wasn’t going to agree to help me right off the bat. Even though we had a transactional relationship, Kushida was starting to grow intensely guarded once again. I suppose we were at the turning point where she’d finally determine whether I was an enemy or a friend.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No one as much as you,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s really nice of you to say that. But unfortunately, I\u0026#160;have a lot going on right now.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A lot?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re such a meanie, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe fact that her standing in class had been knocked down a few pegs was a huge setback for her. The character that Kushida Kikyou had spent a year building up had been tainted. There was no doubt in anyone’s mind that she still had a lot of support from her classmates, but even so, no one was about to say exactly what they thought of her right now. They might have doubts, deep down. I\u0026#160;suppose it just went to show how it was difficult to gain trust, but only took a moment to lose it. As was usually the case.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, then let me turn the question around, then. How can I get you to help me?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think I have to ask you to give up on that for the time being. I’m just going to lay low, spending my time in class peacefully, until I can feel like myself again. Is that too much to ask?” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was basically saying that she wasn’t going to help me, but she wasn’t going to get in my way, either. I supposed this also meant that if she were volunteered for an event, she’d put in the bare minimum required to succeed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you fine with doing that? Not just for me, but for Horikita, too?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose you could interpret it that way. I’ve come to realize that this school is a far more comfortable place for me, personally, than I’d initially thought.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe continued acting the part she wanted to play, all while continuing to wear her mask. I supposed presenting me with a favorable option was part of her strategy. It was a shame I couldn’t gain her cooperation, but it was probably best I just graciously accept what she was offering.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right. Sorry for asking something unreasonable of you.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, no, it’s all right. It honestly makes me happy that you wanted to come to me.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce we reached the school entrance, Kushida and I parted ways. She headed toward the Keyaki Mall without stopping even once. \u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e6.4\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE WEEKEND WAS OVER\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e and before any of us knew it, it was Sunday, March 14th. White Day. To be completely honest, I was grateful it had fallen on a Sunday. I’d prepared a few gifts, laying them out on my desk. If White Day had fallen on a regular weekday, I would have had a hard time figuring out when to hand them over. In the morning before class? Or after class? I had a lot to consider, such as the order in which I would give the gifts out, and what to do about students in other classes.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMore importantly, it wouldn’t be good for my image if people saw what I was doing. I understood it would be best if I just handed the gifts over without worrying about getting stares from people nearby, but I couldn’t \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003enot \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eworry about it. However, since we had the day off, I could simply drop them off in their respective mailboxes. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI left my room early to avoid running into anyone and headed toward the dormitory mailboxes. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s see…” I mumbled quietly to myself, while placing gifts in the mailboxes of each student who had given me chocolate on Valentine’s Day.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAll right, that’s all the chocolate. Guess I ought to head on back\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, I thought to myself. Just as I was thinking that, though, I bumped into Ichinose. She reacted as though she had just seen something she shouldn’t have.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“G-good morning, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-hey, morning.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t even 7 a.m. yet, and I’d just had a surprising encounter. Just like the last time we met, Ichinose seemed to be avoiding making eye contact with me today, too.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I happened to wake up kind of early today. I just got back from a walk,” she told me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed like she was looking at me when she spoke, but it was more like she was looking slightly away from me. She was probably planning to check her mailbox before heading back to her room.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, uh, excuse me,” I said, motioning her through.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI made way for her, so that she could see her mailbox. Ichinose responded with a grateful bow, and then checked the contents of her mailbox. When she did…she discovered the gift that I had placed there, of course.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure you can already tell just by looking at it. But it’s, well, a return gift,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaving removed the gift from her mailbox, she simply stood there with the box in her hands, unmoving, like she was frozen solid.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But you didn’t have to, I mean, a gift like this…” she stammered, apparently now having remembered how to speak after struggling for a bit.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, no, no, I had to.”.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Th-thank you. And, um, I’m sorry. I guess I’m not really used to this kind of thing, so I’m kind of nervous.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI felt the same way. I’d delivered the gifts early in the morning because I didn’t want to run into anyone, meaning I was feeling pretty flustered right now. This was beginning to get awkward, so I tried to change the subject.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Oh, hey, that reminds me. What happened after that whole incident on Thursday that we talked about? You know, the thing with Shibata?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, um, well… Were you worried?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A little, yeah.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose must have found it easier to talk now that I’d changed the subject, since things felt more like they normally did between us.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, right after it happened, I interviewed everyone. But the only victims we heard about were the three people that Shibata-kun had mentioned. But, well…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“On Friday, it seemed like the number of victims just suddenly shot up. Three girls and three more boys. Just yesterday, I got reports that they were being followed around and harassed in the same way,” said Shibata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMeaning there was a total of nine victims now. So, Class D limited their harassment to just three people for the three days after the exam was first announced, only to suddenly up their game and harass six more people on Friday?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you know which students from Class D have been doing the stalking?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose nodded and then proceeded to list some names. “As far as I know, it’s Ishizaki-kun, Komiya-kun, Yamada-kun, Kondou-kun, Ibuki-san, and Kinoshita-san.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA total of six people, huh? Students who were willing to get their hands dirty, to an extent. They didn’t seem to be conducting their business in secret or anything, because Ichinose had managed to put names to faces so easily.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder if those six are just planning to just randomly follow whoever they happen to bump into?” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMany of the people in Class D were entirely ordinary students, so I supposed it was only natural to think so.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I plan on doing some more interviews on Monday,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you going to do if the damage ends up being as extensive as you’re imagining it will be?” I asked. It was possible even Ichinose and Kanzaki might get dragged into it, eventually.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm. Well, I suppose there’s nothing I really can do. It’s not like they’ve actually gotten violent or anything… So I think we’ve decided to just put up with it until they actually end up causing some real harm. We’re planning to provide emotional support to the affected students, though, to ensure their well-being.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom the sound of it, they were ready to take action at a moment’s notice if someone really got hurt.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass D was acting strangely. I had to wonder if they really planned to go after every student in Class B. With only six students actually doing the harassing, it wasn’t like they were putting the screws to them \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ehard. Even if they kept going, when all was said and done, their behavior amounted to simple harassment and nothing more. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed it was possible Ishizaki simply didn’t think that far ahead when he came up with this strategy. Or\u0026#160;perhaps Class D was fine with the plan as long as they thought it inflicted at least a little bit of psychological damage? \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you think I’m handling this the wrong way?” Ichinose must have noticed that I was lost in thought, because she looked up at me with a somewhat anxious expression.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No… I think what you’re doing is good. In fact, Class D probably wouldn’t be punished even if you did complain to the school. And if you went to the school, you’d probably be doing exactly what they wanted.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I think you’re right,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat she needed to do was make sure that what Class D was actually after was what she thought it was. That being said, Ichinose didn’t seem like she intended to make a move, so telling her as much might be superfluous. Besides, if her way of doing things was to focus on a policy of nonaggressive self-defense, it was wrong of me to suggest anything else.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Have you settled on your ten events?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yep. We got to know each other’s strengths and weaknesses pretty early on. We finalized our list yesterday, mixing in some events that we thought Class D might have a hard time with, too. What about you, Ayanokouji-kun?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, I haven’t gotten involved in anything this time around. I’ve been leaving everything to do with the ten events to Horikita.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But what about the ways in which the commander can get involved?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I left that part to Horikita, too.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose was surprised. She must not have expected me to be so casual about my role as commander.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it sounds like you have quite a lot of faith in Horikita-san. Or maybe…you’re saying that you can handle any kind of event, or any kinds of rules, Ayanokouji-kun?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, it’s the former, one hundred percent. Unlike you, I only have a few classmates that I’m pretty close to, so I honestly don’t know much about most people. I just volunteered to become the commander so I could prevent anyone from getting expelled is all,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But why did you want to go up against Class A, then?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That was Horikita’s idea, too. Maybe she thought we’d have a chance of winning or something.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see,” replied Ichinose, not pressing the matter any further.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, our conversation was over, so we both just waited for the elevator to come. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah… I was so not prepared for this…” said Ichinose, muttering to herself quietly. She sounded like she’d just remembered something. As she stood next to me, she twirled her hair with her index finger.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Prepared?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“O-Oh, it’s nothing, don’t worry about it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe got on the elevator and soon arrived at the fourth floor, where my room was located.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, see ya later.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I got off the elevator, my eyes met Ichinose’s for just a moment, seeming to catch her off guard.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-Y-Y-Yeah! S-See you, later!” she stammered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSuddenly panicked, she hit the button to close the doors repeatedly. The doors closed moments after, hiding her from view. That sure was a strange way of saying goodbye. I supposed just making it through this White Day ordeal was good enough.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come to think of it, I didn’t catch a whiff of that citrus scent today,” I mused to myself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, it was early in the morning on a holiday. There was no reason for her to go out with perfume on.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e6.5\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT WAS MONDAY MORNING\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e—the day our opponent’s ten events would be announced. What kinds of events and rules would Class A come up with? And what kind of involvement would the commander have?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile on my way to school, I just so happened to bump into Horikita’s brother and Tachibana. It didn’t seem like they were waiting for me. If anything, it really seemed to just be a coincidence this time. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTachibana didn’t really say anything in particular, but quietly took a step back. Perhaps that was a show of consideration, saying that she wouldn’t get in the way of our conversation when the two of us started talking. Her responses to situations were quick and polite. I was sure she’d been a constant source of support for Horikita’s brother while they were on the student council.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is the special exam proceeding well?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI really had to hand it to him. He seemed to already have an understanding of the situation, without requiring any explanation from me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought that’s what I should be asking you. Are you going to be able to graduate from Class A?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_
