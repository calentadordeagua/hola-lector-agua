 true, I didn’t. I was prepared for you to refuse, but…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve compiled all this data through careful analysis for the upcoming exam. It’s crucial. I wouldn’t be able to demonstrate my ability as a commander if I didn’t take a look at it,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere wasn’t a single discrepancy between what she had recorded here and the things that I had happened to learn about myself. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The data you’ve collected here almost feels like it lays the entire class bare.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That data is the culmination of everything I’ve collected after a week of intense struggling. If it wasn’t accurate, I’d be in trouble.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs long as we had this, anyone could probably be the commander, if it came to that.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m going to continue refining the information included in the notes. Eventually, I’ll include who should be assigned to each of Class A’s ten events. I was thinking you could take a look, so you can use it in your role as commander,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Well, I suppose Sudou and Akito would both be a force to be reckoned with, even outside of a one-on-one event. In Onodera’s case, though, I think her chances of winning will probably diminish if she’s pitted against a guy. It would probably be wise to consider a third or fourth candidate ahead of time,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita quietly nodded. It would be a shame to jump the gun and commit a student to a certain event when there was a possibility that they might really shine in others. In any case, I had nothing to complain about so far. This was great work.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have no objections to anything in your notes. However, can I just add one thing?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What is it?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“One of the events that Class A chose was chess, if I recall, right?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI took a sip of water after bringing up the new topic. Since none of our classmates were good at chess, that space in the notebook was naturally left blank.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. I’ve been putting off deciding what to do about that event. I’ve never played it before, myself. The only person who knows the rules to the game in our class is you, the commander. So I thought that I might ask your advice about it,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, about that, I’d like you to be the one to play.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Me? I suppose it’s true that no matter who we went with, they’d have to practice anyway, but…why me?” she asked, before adding that she wouldn’t be able to get very good at the game, nor would she be able to win.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because I think that you’re the right person for me to teach,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You mean you’d have an easier time teaching me, since you wouldn’t have to build a relationship with someone new?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’d be lying if I said that that wasn’t part of it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose that I’m fine with accepting that role, but…I’m sure there are a few students who would be amenable to you, aren’t there? Besides, I think that there are other events where I would prove useful,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita was essentially good all around. Whether it was a written test or a sporting event, she’d produce results. I had no doubt about that.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What we’re looking for is pure skill. There’s a time limit on the commander’s involvement in the game. No matter how confident Sakayanagi is at chess, there’s just not enough time. I can’t imagine Class A will use the option to bring in the commander right away at the start of the match. If they do, though, then the opening moves will be crucial to winning the game.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf we were overwhelmed in those opening moves of the game, it would become extremely difficult for us to bounce back.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re not focusing on chess simply because you know the rules to it, are you? You think Class A is going to pick chess as one of the main five events?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m almost certain they will. The fact that chess is the only event where the commander has such strong influence does worry me,” I told her. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s certainly something that’s been bothering me too… Very well. I’ll defer to your judgment, then.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI showed that I was grateful for her consent, and then continued eating my meal.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“By the way, how are we going to practice playing chess?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This probably is going to be tough for you, but we’re going to have to practice online, in the middle of the night,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s certainly true that if we do it that way, we won’t be seen by anyone. And on top of that, no one will know what we’re doing.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnother advantage was that it wouldn’t get in the way of practicing for other events.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e6.11\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHAD BEEN HOPING\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e that our conversation would have been over right then and there, but unfortunately, things seldom go as one wishes.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have a favor to ask you, Ayanokouji-kun. You \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e eat my cooking after all, didn’t you?” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t you think it’s underhanded to pull the same thing on me over and over?” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust when we were about halfway through dinner, that demon reared her head once more. I supposed the notebook she showed me earlier wasn’t the end of it, then. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Underhanded? Considering what kinds of methods \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e employ, I would think it would be more accurate to describe you that way, hm?” she snapped.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you talking about?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The class vote exam. You were the one running around behind my back, weren’t you? Answer me.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait. I didn’t do any—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oniisan gave me advice. But you were the one behind it,” she snapped.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t imagine from the way she was speaking that she was just coming up with these ideas randomly. On the other hand, it was unlikely that her brother had leaked anything.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t notice at first. But after thinking about it for a while, I knew.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMeaning she had managed to arrive at this conclusion on her own.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You predicted everything I was going to do,” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if I denied that, it doesn’t seem like you’d believe me,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. Well, it goes without saying that I have no conclusive proof that you did anything. If I did ask oniisan about it, I’m sure he wouldn’t say anything to even imply you were involved. But it’s become a certainty in my mind,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLittle by little, Horikita had matured over this past year. That was something both her brother and I both recognized. But, as the antagonism she had with her brother had diminished, she began to blossom almost immediately. I was sure that her brother, who had been around her for much longer than I had, was aware of her high levels of latent potential. That was probably why he got so fed up with his little sister doing nothing but chasing after him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You seem awfully uncomfortable,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s because it feels like I’m in the middle of a hostile interrogation.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, whatever. Judging from your attitude, it’s clear I’m not going to break you, anyway,” said Horikita, bringing that subject to a close for the time being.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed I was going to have a harder time manipulating her from behind the scenes from now on.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have some more questions for you, but you’re free not to answer,” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer gaze was powerful. It seemed to grab hold of me and didn’t let go.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you think that we can win against Sakayanagi-san?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think it’s entirely impossible, at least. That’s the impression I get when I look at your notes.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Very well. I’ll contribute how I can, by bringing the class together.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve been doing a great job of that lately.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn Hirata’s absence, almost everyone in our class had been acting on Horikita’s instructions. She was prepared to take charge and guide our class to victory. Honestly, I wanted to thank her for taking the lead on things I couldn’t do.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll leave the rest to you. It’s your call.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Understood. Even so, wouldn’t it be better for you to make decisions related to the rules for the commander’s involvement?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah, it’s fine if you handle it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Are you saying you plan to do battle with just the information I prepare for you?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t really know that much about our class, anyway.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good lord… If you think you can beat Class A like this, then you’re naïve.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita walked me over to the entrance to her room, and then watched me go as I left.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll say thanks for the meal this time, but…don’t do this to me again,” I told her. I could imagine myself jumping at shadows every time someone invited me to share a meal.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right. I’ll come up with another scheme.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eNo, that’s not what I’m asking…\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e6.12\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eFEW DAYS BEFORE\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e our showdown with Class A, Keisei managed to successfully get in touch with Katsuragi. Shortly afterward, he called me, asking me to come out to a spot where no one else would be around. Since Katsuragi was essentially isolated and acting on his own right now, it probably wasn’t too hard to get hold of him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…So what can I do for you, Yukimura?” Katsuragi, who was probably burning with intense anger at Sakayanagi, had his sharp gaze fixed on Keisei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s something we’d like you to help us with, Katsuragi,” Keisei answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Considering you’re calling me out to talk right now, I suppose I don’t even need to ask what it is you’re suggesting.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom the looks of it, Katsuragi had already sensed what Keisei was about to propose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then, this will be quick. I was hoping that you could tell us which five events Class A plans on choosing officially. And one more thing. I’d like you to throw any events that you’re involved in, during the exam,” said Keisei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat last part was something he hadn’t previously mentioned to either Horikita or me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And what exactly would I be getting in return for doing so?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We would welcome you into our class.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s an interesting offer. You want me to betray Class A and drop to Class C?” he replied, letting out an amused sneer, dismissing Keisei’s proposal.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We will make it to Class A someday. We’re capable of doing so,” said Keisei, implying Katsuragi could choose to make the change once we became Class A.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut to Katsuragi, the words probably sounded like nothing more than nonsense.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ll make it to Class A someday, hm? If you ask any other class, they’d say the same thing,” replied Katsuragi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, but…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And if you really do possess the ability to do so, then why don’t you try to win against Class A without resorting to underhanded tactics like this? You can’t, so you’re trying to use me. Isn’t that right?” said Katsuragi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKeisei fell silent at this powerful reprimand. Katsuragi’s tone was close to scornful, and his words left Keisei unable to respond.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_4\" src=\"/hola-lector-agua/images/books/v11/OEBPS/Images/INTERIORIMAGES_4.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, all right. Let’s suppose that you really will make it up to Class A. Are you saying you’re going to offer me the twenty million points in exchange for that information right now? No, that’s probably unlikely. If you could provide that amount to me right now, then you could’ve used it to prevent Yamauchi from being expelled.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, Katsuragi also knew that we didn’t have such a vast number of points.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s…” sputtered Keisei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Were you planning on asking me to wait for two years for you to come up with twenty million points?” asked Katsuragi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yes.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You must understand what a ridiculous fantasy that is. Even if you do make it to Class A, there is no guarantee whatsoever that you’ll be able to come up with the twenty million points by then. We could draw up a contract, but that’s meaningless if you don’t have the points. You can’t give what you don’t have. Wait a minute. Did everyone in Class C even agree on this offer in the first place?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi was not an idiot by any stretch of the imagination. I was sure he understood the situation in our class quite well. If this was an offer that everyone in Class C had agreed upon, then the person who came to meet him would have been Horikita. Since Keisei and I were the ones talking to him right now, it was quite obvious this was all happening off the record.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand full well that you’re desperate, but you’re not even prepared to negotiate your deal. Were you planning to talk to the rest of your class after you got me to cooperate with you, and then get their permission? Did you really think I’d accept such an offer?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBetraying your classmates wasn’t something you did easily. Even more so for a man with a strong sense of duty, like Katsuragi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…S-So, you’re really just going to sit back and let Sakayanagi keep you quiet? Keep you down?” asked Keisei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you really want to stick with Class A, even though they got Totsuka expelled?” Keisei, having realized he wasn’t going to convince Katsuragi of anything, decided to go for broke and push ahead, even if that meant being shot down. “I can’t guarantee I could just sit around and wait in such a pathetic state until graduation. That’d be the coward’s way out.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So in the end, you resort to trying to get a rise out of me by telling me I’m pathetic. You get zero points for negotiation skills like that, Yukimura.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Gr!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi looked over at me where I stood next to Keisei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is there anything you’d like to say, Ayanokouji?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I think you’re exactly right, Katsuragi. There’s no room for argument from us.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRecognizing that as a white flag, Katsuragi directed his gaze back at Keisei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yukimura, it’s not like I want to criticize you or anything. But if you want me to betray my class, then you really need to be better prepared,” he said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi leaned against the wall and turned his gaze away from us, looking somewhere far into the distance. He wasn’t looking \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e something. It was more like he was looking at nothing at all.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That being said, you were right about one thing,” he added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Right about what?” Even though Keisei had already completely lost his will to fight, he looked up when he heard Katsuragi say that.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It is true that I am inexplicably angry with Sakayanagi. To me, that makes it worth taking action against her personally, even if you can’t offer me anything in return,” said Katsuragi, arms crossed, now fixing his gaze firmly on Keisei. “You might have already guessed this, but Sakayanagi has not shared what our official five events will be with anyone.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as I’d expected. Sakayanagi was keeping her plans secret, playing her cards close to the chest.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And I don’t like that, personally. That’s not how we should be doing things. In an exam like this, the entire class should be working together. We should share information with our allies, and adopt strategies that provide a sure path to victory,” said Katsuragi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe biggest advantage of not sharing information with your class was that the five events you were choosing wouldn’t be leaked. However, that also made it that much more difficult for anyone to practice for those events. Trying to prepare equally for all ten would naturally reduce class efficiency.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, if you have no issues with me simply telling you what my predictions are, I wouldn’t mind telling you that,” said Katsuragi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“R-really?!” exclaimed Keisei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as Keisei had determined there was no way he could win Katsuragi over, he unexpectedly caught a lucky break. I supposed it just went to show how strongly Katsuragi resented Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s…only so long as you promise you won’t tell anyone else what I’m about to you, however,” added Katsuragi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“O-of course. I’ll wait a bit and bring up the twenty million points with Horikita and the others later,” replied Keisei, nodding to signal his promise.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That won’t be necessary. Even if the information I provide you with proves to be beneficial, you probably won’t be able to save up twenty million points,” said Katsuragi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then what do you want in return?”.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nothing. If I had to name anything, it would simply be that I want you to defeat Sakayanagi,” said Katsuragi. “I’m absolutely certain that Chess, English Test, and Mathematics Test will be chosen as official events. Those three for sure. After that, I think Contemporary Literature Test and Flash Mental Arithmetic are most likely. Conversely, I would say it’s fair to assume events that require a large number of participants, such as XL Jump Rope and Dodgeball, are most likely meant to fake you out. From what I can tell, our class doesn’t seem to be practicing for those,” said Katsuragi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe wouldn’t know if he was correct until the day of the exam. If more than three of the events he mentioned as likely candidates for the official test ended up on there, then it would be fair to assume he was right.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you really okay with this? With not getting anything in return, I mean,” said Keisei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I already told you. Even if you don’t have enough bargaining power to convince me of anything, it’s still worth it for me to help you,” said Katsuragi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKeisei had managed to get information from Katsuragi that he’d thought would be difficult to obtain, albeit in an unexpected way. He was probably filled with joy right about now.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Th-this is awesome, Kiyotaka! Now we’ve got a chance to win this thing!” exclaimed Keisei, pumping his fist excitedly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“One more thing. You said you wanted me to throw any events that I’m in, didn’t you?” said Katsuragi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh, oh, well. You don’t have to—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmph. You came all this way to negotiate with me, and now you’re satisfied with just getting information?” replied Katsuragi, letting out a slight chuckle, as if he found Keisei’s flustered reaction amusing.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s not like that, it’s…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t go thinking that you can beat Sakayanagi half-cocked. It’s best for you to assume you’ll still barely be able to hold your own, even if I do slack off during the events. However, the only event I can really help you in is probably Flash Mental Arithmetic. Or, in the unlikely event that it’s chosen, XL Jump Rope,” said Katsuragi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI decided to ask Katsuragi just one question.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Will you even be allowed to participate, with Sakayanagi being so wary of you right now? I suppose you might have to participate at least once if the XL Jump Rope event is chosen. But in the end, since only one or two participants can make or break the Flash Mental Arithmetic event, what makes you think she’ll count on you?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s because the students in our class who are best at mental arithmetic are me and one other student, Tamiya. And Tamiya isn’t \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e good at it. With that in mind, leaving me out of the running for the event would simply lower our chances of winning. Sakayanagi probably thinks she’s completely subdued me by having Yahiko expelled. She’ll probably appoint me a role so she can use me like a pawn,” said Katsuragi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed that to Sakayanagi, the idea of making a pawn of Katsuragi, a force who resisted her, would be quite appealing. Katsuragi offered to help us by deliberately getting questions wrong in the event that the Flash Mental Arithmetic event was chosen or by jumping on the rope right away if the XL Jump Rope event was chosen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, I’d like to avoid Sakayanagi finding out that I’m losing on purpose. I could make it look as though I happened to mess up on accident for the XL Jump Rope event, but I can’t intentionally make mistakes on the easy questions for the Flash Mental Arithmetic event.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, even though we’d be pretending to compete on equal ground, we’d just barely come out on top.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If Flash Mental Arithmetic is chosen as one of the events, but I’m not selected to participate, then you’ll just have to recognize that luck wasn’t on your side and give up,” said Katsuragi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRegardless, we’d been provided with some very valuable information. We had no reason to complain. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter Katsuragi left, Keisei spoke excitedly. “Let’s hurry and tell Horikita about this right away.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No…I think it would be best if we don’t tell her we contacted Katsuragi today yet,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-why?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In retrospect, it only happened to play out well for us by chance. She’ll be ticked off if she finds out we arbitrarily took action on our own,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even so, we should be putting this information to good use, shouldn’t we?” said Keisei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I want to find the right time to tell her. I’ll make sure it goes well,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKeisei seemed a little bothered at first but eventually agreed, probably because he felt guilty for having met Katsuragi in secret like this.\u003c/span\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 6: Good and Evil\",\"volumeId\":\"v11\",\"chapterIndex\":12,\"prevChapter\":{\"volumeId\":\"v11\",\"chapter\":11,\"title\":\"Chapter 5: What the Class is Lacking\"},\"nextChapter\":{\"volumeId\":\"v11\",\"chapter\":13,\"title\":\"Chapter 7: A Man’s Tears\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Title Page\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0004.html#au
