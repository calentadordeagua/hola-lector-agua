Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t know. I suppose that depends on the results we see next week.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t tell if he was totally okay, or if he was\u0026#160;worried.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I can say your little sister really has been giving it her best effort. It seems you’ve had more of an effect on her than I thought,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That so?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita was incredibly full of energy right now. It was almost like she’d found and downed some magic elixir. In Hirata’s absence, she had taken the lead and brought the class together. And now, she was actively spending each day polishing our strategies so that we could win all ten events.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shouldn’t the third-years normally be on vacation around this time?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. I was surprised to find that out, too, after I enrolled here. This is the time of year when most high schools would already be on vacation, yes. But of course, the third-years are making favorable progress toward proceeding onto higher education or gaining employment. Things are in motion. You’re just not aware of it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom the sounds of it, the third-years had quite a lot to deal with between the special exams.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait. People are going on to higher education and finding jobs even though it hasn’t been decided whether or not you’re graduating from Class A?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ll understand eventually,” he replied, leaving it at that. He didn’t give me an in-depth answer.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed some things just couldn’t be revealed to the current students. From the sound of it, we’d have to wait until just before graduation to find out if being a Class A student was even worth it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If there’s anything you’d like to ask me about, feel free to do so. If it’s within the scope of things I can answer, I\u0026#160;will.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems the scope of what you can tell me about is pretty narrow, though.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen he heard my somewhat sarcastic remark, the corners of his mouth curved upward into a slight smile.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, you might be right about that. Think of it as the ties of obligation that come from being the former student council president,” he answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed that he couldn’t just casually talk about issues that affected the entire school. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, now that I’ve bumped into you, this is a good opportunity. There’s something I’ve been wondering about for a while now.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI decided to make use of this coincidence to ask Horikita’s brother a question.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s about Horikita… I mean, your little sister. I think she’s excellent. Neither her academic nor athletic abilities miss the mark. While I don’t think anyone would say she’s the best of the best, she’s had the talent to be the second- or third-best since the day she enrolled at this school. She might not be as good as you, someone who made it onto the student council, but I can’t imagine her being lacking enough that you’d want to disparage or drive her away.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was something else that seemed out of place to me. More than anything else.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In the first place, besides, you and your sister have a two-year age gap. Meaning you haven’t seen the last two years of her growth. And with the school’s system being what it is, there’s no way you’d be able to tell at a glance just how much she’s grown,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita Manabu hadn’t seen his little sister ever since she was in her second or third year of junior high. Even if he knew the kind of grades she was getting when she started here, I couldn’t imagine that being enough to make him this dissatisfied with her. But when I saw Horikita Manabu meet with his little sister outside the dorm a while ago, his behavior had been a far cry from what I’d call calm.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. It’s understandable you’d find it strange, after seeing what happened then.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat, I’d just remembered, was also the first time I came into contact with Horikita’s brother.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wasn’t disappointed in Suzune because of something superficial, like her grades. I was disappointed in her growth as a person. In her character.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Her character?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A long time ago, Suzune used to be completely different from how she is now. She was the kind of child who smiled a lot,” said Manabu.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWait, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eshe\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e smiled a lot?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e…It was useless. I honestly couldn’t picture it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re saying she’s pretending to be this cool, detached person because of your influence?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because she’s been trying to imitate me in every single way. A bad habit that started to show when she was in elementary school. But, now that I think about it, it was my fault for neglecting her. For many years, I thought I could make her better by treating her coldly, but in reality, it just had the opposite effect,” said Manabu.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs a result, Horikita kept chasing her brother’s shadow, leading to her becoming the person she was today.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, even though you look completely flawless from the outside, you failed to set up a proper dialogue with your little sister?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No one is perfect. Am I wrong?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, you’re right about that.” I couldn’t argue that point. “So basically, reuniting with her at this school and having that one conversation was enough to make you understand how things stood?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTo be honest, it didn’t seem like they’d even had a long conversation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I knew the moment I saw her. Before we even spoke. I\u0026#160;understood that Suzune hadn’t changed at all, these past two years,” said Manabu.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wondered if he’d seen something that only an older brother could understand. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe continued speaking.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She hung on every word I ever said. Go study. Exercise. Don’t do this. Don’t do that. Honestly, it would’ve been fine if she’d just stopped there…but she didn’t. She even copied other things. What I liked to eat, what I liked to drink. My taste in clothing and the colors I liked to wear. She was completely and utterly dependent on me.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe fact that she’d taken things that far was honestly kind of terrifying. Still, thinking back to how Horikita acted when she first enrolled here, it made sense.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So after being reunited with your little sister here, you sensed that she was still completely dependent on you?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnless he was psychic, that was still far too little information for him to assess everything she’d gone through in that two-year gap.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. Anyone who knew Suzune back when she was little could tell just by looking at her. She…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eManabu stopped speaking mid-sentence.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…No, this is probably something I should keep secret, even from you. I’d like to use it as my final metric to determine whether or not Suzune has really changed.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess it means it hasn’t happened yet.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe nodded. While she’d made a great deal of progress since the year started, based on what her brother was saying, it apparently still wasn’t enough.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She’s been trying her hardest to break free of the curse of her past, but she’s still only halfway there.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wondered if Horikita would be able to satisfy this final metric of her brother’s before he graduated. The graduation ceremony was in less than ten days.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But, if…” said Manabu, his words trailing off.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe stopped speaking and looked at me. For some reason, I stopped walking, finding myself trapped by his powerful gaze.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If Suzune can stop chasing after this illusion she has of me, break her dependence on me, and confront herself honestly, then…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA gust of spring wind blew past us.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She will probably surpass me and become someone even you can’t ignore,” said Manabu.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita Manabu wasn’t some idiotic, doting brother who fawned over his sister. He meant what he said. I was also impressed by the height of the potential that Horikita had, in many ways. Why, though? Was it because of what her brother said to me? \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSuddenly, a thought crossed my mind. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat was I supposed to do here at this school? No…rather, what did I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewant\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to do? I suddenly felt like I understood. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s only…if she can make the change herself, though.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She will change, though,” I told him. “Wait, let me rephrase that.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI amended my statement.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m going to try and change her. Not just expecting her to change, somehow, like I’ve been doing so far. But taking things seriously.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Oh ho. I never thought you’d say something like that.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d bumped into Horikita’s brother on accident, but our conversation would have a huge impact on my life. It\u0026#160;would be a long, long time before I knew whether or not my hunch was right. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, can I ask you just one more thing, before you graduate? It’s a completely personal question.” I didn’t know if we’d have the chance to talk like this in the future.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What is it?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you and Tachibana going out?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was well aware that it was a silly question, but I wanted to ask anyway. Even though they had left the student council, the two of them were often doing things together.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, that is not the case at all,” he replied, denying it straight out.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt didn’t seem like he was lying or trying to hide anything. However, a quick sideways glance at Tachibana’s face told me the situation was complicated. At the very least, I had no doubt that she had a certain kind of fondness for Horikita’s brother. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve spent the last three years thinking about nothing but school, for better or worse,” he added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh, okay.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But I have to say, I never thought I’d hear a question like that from you. Maybe you’re a normal high-schooler, after all?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMaybe I’d been influenced by that chat I had with Hoshinomiya-sensei. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think I’m the kind of high schooler who is as closest to normal as possible.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Well, then, Mr. Regular High School Kid, have you gotten yourself a girlfriend?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though I’d been the one to bring up this topic, I hadn’t expected it to be turned on me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not right now, no. But if someone comes along, I\u0026#160;think I’m open to putting myself out there,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I feel like I could rest easy if I left Suzune to you. But I can’t really see that happening at all,” said Manabu.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, definitely not.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no way.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Th-that’s not good. You do realize saying something like that pretty much jinxes you to make sure it happens, right?” Tachibana, flustered, suddenly cut into our conversation after having stood by listening quietly until now.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Jinxing himself?” asked Manabu. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, uh, well, I guess you could say it’s like, a rule that things do the opposite of what you say,” Tachibana hurriedly explained. “Like dramatic irony or something… It’s not entirely uncommon for two people who thought they’d never end up getting together to \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eactually\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e get together. That sort of thing.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita Manabu and I exchanged looks, neither of us understanding her explanation in the slightest. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“N-Never mind, just forget about it,” Tachibana stammered, apparently giving up on getting her point across and deciding to leave it at that.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e6.6\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eB\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eACK IN THE CLASSROOM\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e homeroom was already over. At the same time, the ten events chosen by our opponent, Class A, had just been announced via documents left for us in our classroom, which Horikita read aloud for everyone to hear. The events were listed in order by the number of people needed for the event.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eChess\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRequired Participants: 1 Person\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAllotted Time: 1 Hour (Going over time results in a loss)\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRules: Standard chess rules apply. However, the allotted time will not increase, even after the forty-first move.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCommander: The commander can give instructions to their respective player for up to a maximum of thirty minutes at any time. Time spent by the commander in this way will use up the allotted time.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eFlash Mental Arithmetic\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRequired Participants: 2 Persons\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAllotted Time: 30 Minutes\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRules: Victory will be awarded to the class of the student who places first in terms of both accuracy and speed, using abacus-style mental arithmetic. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCommander: The commander can change the answer for just one question of their choosing. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eGo\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRequired Participants: 3 Persons\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAllotted Duration: 1 Hour (Going over time results in a loss)\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRules: Three one-on-one games will be played simultaneously. Standard go rules apply.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCommander: The commander is allowed to provide advice for one single move, at any time. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eContemporary Literature Test\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRequired Participants: 4 Persons\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAllotted Time: 50 Minutes\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRules: Students will answer a set of questions within the scope of what they would find in the first-year curriculum. The winner will be decided based on total points.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCommander: The commander can answer one single question on behalf of a participant.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eSocial Studies Test\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRequired Participants: 5 Persons\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAllotted Time: 50 Minutes\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRules: Students will answer a set of questions within the scope of what they would find in the first-year curriculum for geography, history, and civics. The winner will be decided based on total points.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCommander: The commander can answer one single question on behalf of a participant.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eVolleyball\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRequired Participants: 6 Persons\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAllotted Time: First to 10 Points or Best of 3 Sets\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRules: Standard volleyball rules apply.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCommander: The commander can switch three players at any time.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eMathematics Test\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRequired Participants: 7 Persons\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAllotted Time: 50 Minutes\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRules: Students will solve a set of problems within the scope of what they would find in the first-year curriculum. The winner will be decided based on total points.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCommander: The commander can answer one single question on behalf of a participant.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eEnglish Test\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRequired Participants: 8 Persons\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAllotted Time: 50 Minutes\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRules: Students will answer a set of questions within the scope of what they would find in the first-year curriculum. The winner will be decided based on total points.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCommander: The commander can answer one single question on behalf of a participant.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eXL Jump Rope\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRequired Participants: 20 Persons\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAllotted Time: 30 Minutes\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRules: The class that can successfully jump the most times in two rounds wins. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCommander: The commander can change the order of the opposing team’s lineup however they wish, one time. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eDodgeball\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRequired Participants: 18 Persons\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAllotted Time: 10 Minutes Per Set, for 2 Sets\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRules: Standard dodgeball rules apply. In the event of a tie, a sudden death round will be held.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCommander: The commander can return one player who had been taken out of the game and put them back into play on the court, at any time of their choosing.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They included more sport events than I had expected. I’d expected these to all be written exams and tests of intellect. That being said, there’s a good chance that some of these events are meant to fake us out,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSuch were her first impressions. Keisei spoke up, apparently sharing her opinion.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Chess and Go are both well-known games, but it doesn’t seem many students have actually played them. So, I feel like those put us in a bit of a tight spot. Also, the sports they chose all involve a great deal of teamwork,” he said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was probably no one in class who hadn’t heard of chess or Go—but also probably not a lot of people who’d actually played them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have to say, I didn’t expect such a minimal level of involvement for the commander. Though I mostly welcome that. Especially in the academic-focused events, where their intervention wouldn’t have much of an effect on the outcome.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That probably just speaks to how confident they are in their abilities, though. Not only is Class A particularly skilled when it comes to academics, but they picked four events where that’s the focus. And the required number of participants is high. That’s pretty rough for us…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass A had always taken the top spot in every test in terms of overall performance. The large number of required participants for each of these events was probably a testament to their confidence. Add to that the fact that the commander couldn’t do much, and it made this their way of essentially forcing us into a pure showdown of academics. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlso, the fact that they hadn’t gone solely with written exams for their submissions was the right move on their part. If they put forward seven or eight written exams, we could’ve shifted our attention solely toward studying. I\u0026#160;was guessing they were probably trying to limit our ability to compete with them, while still setting up subjects for us to study that might just get tossed out later.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are six players in volleyball. Nine if you include the substitutes. For dodgeball, that’s eighteen players. The XL jump rope requires a maximum of twenty people. These events require so many people that we could easily end up having to make students compete a second time if any of them get chosen.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince we didn’t know which of the ten events would be adopted for now, we couldn’t afford to slack off in any way. Moreover, since many of the sports events required a large number of people, we’d need to invest a great deal of time and effort into assigning participants to those events and practicing for them. We couldn’t just boldly rent out the gym or something to practice, either—Class A would catch wind of what we were doing. Which meant we had to practice in secret. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, the fact remained that we didn’t know which of these were their official events. Even if we spent a great deal of time practicing, all of our hard work could be for nothing if the events we prepared for didn’t get chosen. It’d just be a waste of our time. On the other hand, if we assumed an event was there just to fake us out and didn’t practice for it, that lack of practice would be painfully obvious on the day of the exam. There was no way for us to win.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile it was important for us to find out what Class A was doing this week, that information was going to be hard to obtain if they practiced early in the morning or late at night. It was possible they might split up and practice in small groups, too.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe couldn’t afford to slack off for any of these ten events. No matter which ones got picked, they all spelled trouble. Not that there were ever going to be any events we’d be \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehappy\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to participate in, I supposed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Does anyone here have experience playing chess or Go?” asked Horikita, asking for a show of hands.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnly Miyamoto raised his hand.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve played go a few times with my family, but I’m not really good enough to recite the rules from memory or anything,” he said aloud.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom the looks of it, chess and Go were both lost causes for us, right off the bat. After a slight delay, I raised my hand, too.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know how to play chess, more or less. But I know nothing about Go. I’ve never played it before,” I announced.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough I was the commander, I figured it would be a good idea to let everyone know that I could teach people the rules for chess.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I suppose it’s a relief that we have some people familiar with the games here. Still, I have to say, this really is quite a ridiculous test. We absolutely cannot afford to not take any of these ten events seriously,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHow much could someone even master chess or Go in less than a week? If luck was skewed in our opponent’s favor, then only two of our events and five of theirs would be chosen. We had no choice but to rely on our classmates’ skills for parts of this exam. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eBut why…?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s the matter, Ayanokouji-kun?” asked Horikita, peering at my face with a puzzled look.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Nothing.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe degree to which the commanders could get involved in the chess match was \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehuge\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. It was almost like the match was actually between the commanders. I got a feeling Sakayanagi strongly desired to fight me directly through that event.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Horikita. Shouldn’t we be launching a full-scale information war of our own at this point?” said Keisei, sounding impatient about something.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You mean doing some investigating to…find out which of these Class A will choose as their official events, right?” replied Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. To be completely honest, it’s going to be fairly difficult for us to try and prepare for all ten events in the time we have left. If we don’t get our hands on some kind of intel, then our chances of winning get that much slimmer,” he argued.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But it’s not like Class A is just going to give up information that easily,” said another boy, stating something that pretty much everyone in class already understood.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even so, we have to try.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand how you feel. But I can’t make a decision about that right now. First, let me get an idea of how many people here have some experience with each of the events.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShelving the idea of gathering information for later, Horikita began by focusing on understanding all ten of the events on the list.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e6.7\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003e“H\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eORIKITA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e could I have a minute?” asked Keisei, during the break.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure, not a problem. What is it?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, probably shouldn’t talk about it right here… It’s about the special exam.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKeisei quietly urged Horikita to step out into the hall, not wanting others to hear their conversation. I had intended to just watch them go, but Horikita shot me a look.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you mind if Ayanokouji-kun accompanies us?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…No, I don’t mind.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile Keisei didn’t seem thrilled by the idea, he agreed. I wasn’t going to turn down the offer, so I followed the two of them out into the hallway.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Have you given any thought to what I said?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“About gathering information?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, I see… Well, I can’t imagine it’s going to be that simple for us to get information on Class A,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But it’d be a waste not to try. We should be using our time effectively,” said Keisei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe seemed to want to start both gathering information and taking action as soon as possible. The desire to exhaust every possible option in pursuit of victory was something I understood quite well.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you think we’ll figure something out if we just stick close to the students from Class A?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose not. It’s doubtful whether the average Class A student will know which of the ten events are going to be their official five.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was possible that only Sakayanagi knew. Or that she’d only told those closest to her. It wouldn’t be unusual for someone like her to strictly control the flow of information.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if Sakayanagi is the only one who knows what their five official events are, her classmates should have at least some idea of what’s going on, right? You agree with me, right, Kiyotaka?” said Keisei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I suppose her classmates would probably know something, yeah.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince the students of Class A had been together for about a year now, I was sure they knew each other’s strengths and weaknesses, to a certain extent. They could at least hazard a guess as to which events they thought would be chosen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Right. So, I’ve come up with a way to get information from Class A,” said Keisei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And what would that be?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’ll bring Katsuragi over to our side. Make him an ally of Class C,” said Keisei, speaking in a low voice, making sure no one else was around to hear.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi. The former leader of Class A and the one who stood in opposition to Sakayanagi. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Totsuka, someone who followed Katsuragi, ended up being expelled because of Sakayanagi. Don’t you think Katsuragi would hold a grudge over that? I’ve passed him several times over the last few days. He’s clearly not the same person he was before.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no doubt in anyone’s mind that he held a grudge against Sakayanagi. I remembered the conversation that had taken place between Katsuragi and Ryuuen on the day Yahiko was expelled.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you think he’d betray his class just to frustrate Sakayanagi-san and screw up her plans?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, we’d probably need a good bargaining chip, of course.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, Keisei had already considered that.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If he helps Class C attain victory, even if we end up winning four events and losing three, we’d still make out with one hundred and thirty class points. If you think about the class as a whole, that comes out to six million Private Points a year. If we set aside some points every month, it wouldn’t be impossible to accumulate close to twenty million,” reasoned Keisei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaving heard all that, I could see what Keisei was trying to get at.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then, when we reach Class A, we propose granting Katsuragi the right to transfer into our class. What do you think about that condition? Besides, by doing things this way, we make him an ally,” said Keisei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“First of all, there’s no way an ordinary student would accept a deal like this. No matter what we try to say to him, you do realize we’re still just Class C?” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But considering the situation Katsuragi is currently in, can you really say for sure he wouldn’t go for it?” argued Keisei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“While it may be true that Katsuragi feels like he doesn’t have a place in his class right now, if his classmates find out he betrayed them, he’ll definitely be the next student to get expelled. He can’t afford to sit pretty while we save up twenty million points. Even if we assume our class points will continue to steadily accumulate, and even if our entire class cooperates fully, it will probably take at least six months or more, at best,” I replied matter-of-factly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf we wanted to save the twenty million without straining ourselves, we should realistically expect it to take more like a year. On top of that, even though we’d be getting class points, twenty million points was by no means a small price to pay.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you think, Horikita?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Well, just as you’ve said Yukimura-kun, it is extremely important that we get our hands on some information,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case—” said Keisei, but she cut him off.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, regarding your proposal, I cannot say that I can agree with it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-why not?” stammered Keisei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s true Katsuragi-kun is being backed into a corner. That said, I can’t imagine he’d accept these conditions to betray his class. Our bargaining chip isn’t nearly appealing enough,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt’d be a different story if we could give him the points right away, but the fact that it’d probably be more than a year made it pretty doubtful that he’d go along with this.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But if we don’t make a move, we’re not going to get any information,” said Keisei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I find it difficult to imagine we’ll get any information even if we \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edo\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e make a move,” countered Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How can you know for sure if you don’t even try?” argued Keisei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was persistent, but Horikita refused to budge.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not shooting down the idea of gathering information, in and of itself. However, this plan of yours is simply no good. If you come up with another idea, come talk to me again,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe ended the conversation there, and returned to the classroom.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Damn it!” shouted Keisei, kicking the wall as a show of frustration. “…Hey Kiyotaka, will you help me out?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Convincing Horikita?” I asked in return.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No… Help me convince Katsuragi. Just the two of us.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was a bold request. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wouldn’t say Horikita has given up on winning. But I get the feeling that deep down, she doesn’t feel like we’re a match for Class A. You know? I mean, if she wasn’t, then she ought to at least give this a try. Even if people find out that we made contact with Katsuragi, it’s not like that puts Class C at a disadvantage,” he added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe way things were going, even if I told Keisei I disagreed with his idea, it probably wouldn’t stop him from going off on his own. I might be able to figure out a lot more about the situation if I tagged along.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay. How are we going to get in touch with Katsuragi, though?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s… I’ll have to think about it. There’s still some time before the exam.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right. Let me know what you decide, then.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d agreed to Keisei’s idea just to stop him from acting on his own. And for the time being, I decided to cooperate with him.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e6.8\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003e“H\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eEY. IF IT’S\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e all right with you, can we talk for a little while now?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a little past six o’clock in the evening, just before dinner. Horikita had asked me that question just as I was watching the burner heat up a pot. The water came to a boil, bubbling excitedly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Were you just in the middle of making dinner?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, but don’t worry about it.” All I had done so far was boil some water. I hadn’t really gotten started yet. “So, you wanted to talk? What about?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf she was planning to request I help her come up with events, then I was going to refuse. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry. I’m not asking you to decide what events we’re going with. I promise you that,” she told me, \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eapparently having guessed what I was thinking. “But, if it’s okay with you, I’d prefer we meet in person to talk. It should only take about an hour. That’s all.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWas it something difficult to talk about over the phone? Or maybe there was something she wanted to ascertain by meeting face-to-face? Well, an hour wasn’t that long. I wasn’t going to turn her down.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right. Are you coming here?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“While I’m fine with that, you’ve been in the middle of a lot of controversy lately. How about my room?” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe seemed to be wary of the possibility of an unexpected visitor. Well, I had gone to Horikita’s room before. There wasn’t really any particular reason for me to refuse her. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI turned off the burner, grabbed only my phone, and left my room. Then, I got onto the elevator and headed toward Horikita’s room. The sun was already down, but it was still actually pretty early in the evening, so it wasn’t a surprise to see boys walking around the upper floors, which was the girls’ area.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e6.9\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eS\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHORTLY AFTER RINGING\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Horikita’s doorbell, I heard the sound of her door being unlocked. I expected her to greet me with her usual serious look, but got a surprise when she opened the door.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Welcome,” she said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSurprisingly, she didn’t look in a bad mood. I, on the other hand, I felt a little uneasy at this surprising change. The scent of miso faintly wafted from further inside her room.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was just preparing dinner. Come in,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf she was in the middle of making her dinner, she could’ve just called me later…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I hesitated to enter, Horikita gave me a look, urging me to get a move on, so I decided to come in. Maybe she’d been reluctant to have me over later at night, or something like that. I figured I’d just leave it at that and not overthink things. But as soon as I set foot inside her room, I noticed something strange.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor some reason, places had been set for two people at her small table. I wondered if she was going to have dinner with someone after we were done talking?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then…” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as I was about to try confirm her plans were, Horikita interrupted me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please, don’t be shy. Have a seat.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWait. Hold on a second… \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was clearly a pair of chopsticks placed on the table at the spot she motioned me to sit at. My instincts were telling me this was a trap designed to force me into doing something.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what did you want to talk about?” Rather than sit down, I tried to start the conversation immediately.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you going to stand and talk? I still have some stuff to finish up, so could you please sit down and wait for me?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well… I just feel like I want to stand.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You feel like what now? Having you just stand there makes me uncomfortable. Sit.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer tone was growing harsher, so I decided to sit. It had been a surprisingly long time since I’d been subjected to her usual forceful, pushy and unreasonable attitude. Maybe I’d forgotten how Horikita typically behaved because I was starting to distance myself from her. And she was distancing herself from me. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt any rate, I figured I should probably just sit down and wait quietly. However, a quick glance showed me that dinner was still a work in progress. It seemed it would be quite some time before she was done cooking.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, you did say this would take an hour, right?” I\u0026#160;asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. The conversation itself shouldn’t take more than an hour,” said Horikita, speaking with her back turned to me. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t help but pick up on the way she worded that. It was certainly true that, when we spoke on the phone, she said the conversation would be over in an hour. Meaning anything \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eoutside\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the actual conversation didn’t count toward that estimate.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, and how long with everything else?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s see… I’d say we’ll be done in about an hour and a half to two hours or so,” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI knew it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Considering what time it is, I thought that I’d at least offer you dinner,” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo one wanted this. I felt like I was at the mercy of her absurd word games. That being said, I could see she’d already started cooking, and I didn’t really feel comfortable outright refusing to eat and then returning to my room. She had skillfully lured me into coming here.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though she had her back turned to me, I could see that Horikita’s cooking skills weren’t bad. If anything, she was fairly good for a first-year high school student.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Both of my parents worked, so I was often put in charge of making dinner,” muttered Horikita, as if she understood what I was thinking just from my gaze.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t think it’s a hassle or time-consuming?” I\u0026#160;asked. While cooking could be fun, there were more than a few annoying aspects to the process.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When I found out that oniichan got accepted into this school, I took the opportunity to cook more often.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In anticipation of coming to this school yourself and living on your own, I’m guessing?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Correct.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eChop\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. She got done chopping something with her kitchen knife and then moved to finish the miso soup. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wondered what she wanted to talk about, if we weren’t discussing the special exam? It was the only thing I couldn’t figure out yet.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e6.10\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eBOUT FIFTEEN MINUTES LATER\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Horikita had finished cooking and set out everything on the table. Everything looked better than I had expected. It was the kind of spread that you would sometimes see on TV shows. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita sat down across the table from me. If Sudou were to see this, he’d probably fly into a rage and punch my lights out. Even if I told him it was all a misunderstanding, he probably wouldn’t listen. I hoped he’d had already been treated to a feast like this himself…but, well, even if he had, he’d probably still feel jealous anyway.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Eat,” ordered Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn response to her demand, I picked up the chopsticks. The two of us sat facing each other, with the food between us. For some reason, this situation made me feel a strong sense of déjà vu. It reminded me of the time back when we first started school, when Horikita got me a meal from the school cafeteria and then used me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you feel suspicious of me?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, to be honest, I can’t help but feel uncomfortable about all this,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you start to doubt the kindness of others, that’s proof that you have issues, as a person.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That, coming from you?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Today is special,” she answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“………”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, if she’d made this out of consideration for me, it would rude of me to not even touch it. But it was in my nature to be doubtful. Well, no…rather, it was everything I’d experienced that taught me to be suspicious. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStill, I’d been completely trapped by her. The outcome of this little game had been decided the minute I carelessly set foot in her room.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor the time being, I decided to try the soup. The smell of miso tickled my nose. She seemed to use particularly healthy ingredients, with daikon radish being the main one.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Barley miso, huh?” Its characteristic intensely sweet flavor spread throughout my mouth when I took a sip of the soup.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know your stuff. It’s a type of miso that people prefer in Kyushu, but I wasn’t sure if it’d be to your liking,” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re a good cook.” I tried giving her a genuine compliment, but she didn’t look particularly pleased.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t need any particularly special skills to be able to cook, nowadays. It’s nothing to be proud of. If there’s something you want to make, all you have to do is go buy stuff at the supermarket or convenience store and then look up the recipe online. Right?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSure, it was easy to just throw \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003esomething\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e together. But you could still show off your skills in lots of other ways, like how you arranged everything on the plate or how you cut up the vegetables. Those weren’t exactly skills you could learn overnight.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Have you been cooking for Sudou like this, too?” I\u0026#160;asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe shot me a somewhat disgruntled look. “Why should I have to feed him my cooking?” she snapped.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well… you’ve been tutoring him pretty often.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. But that being said, that has nothing to do with me cooking for him, does it?” she answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI thought it was just a trivial question, but Horikita continued to assail me with her objections.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now, if \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehe\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e were the one tutoring me, then I suppose I could understand your question. It would make sense, as an act undertaken to show thanks for everything that he had done. But considering that I’m the one doing the tutoring, there’s no way I’d go to the trouble of doing all that for him,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was such impressive logic that I was entirely at a loss for words, but…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t tell if you’re clever or if you’re stupid,” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHonestly, she took the words right out of my mouth. Sudou had a crush on Horikita, and because of that, I thought she might have cooked for him sometime. But it seemed she had yet to come to terms with Sudou’s affection, probably because she didn’t place much importance on things like love. She hadn’t matured to the point where she could even really be aware of such things.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, then. How about we get down to business?” said Horikita, taking out a notebook. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe handed it over to me. I didn’t need to ask about the contents. This was what Horikita had been working on for a while lately. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve come up with a plan that I think is best for Class C. I’d like you to give me your opinion of it,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter saying that, she added one more thing.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e eat my cooking after all, didn’t you?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTalk about playing dirty. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eShe hands over the reward first, and then expects me to put in the work to earn it?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWithout batting an eye, I took the notebook and opened it up. It was packed full of information about the special exam. There were also notes on the ten events from Class A, but because those events had just been announced today, they seemed to be a work-in-progress.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIncidentally, the ten events chosen by Class C were: English, Basketball, Archery, Swimming, Tennis, Ping Pong, Typing Skills, Soccer, Piano, and Rock Paper Scissors. The last one seemed like it had just been tossed in as a secret, last-ditch measure for when we were really in trouble. Horikita had also noted who would be best for each event and what our chances of winning were. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEverything that we needed was collected in this notebook. I quietly scanned through the notes in great detail. Horikita made a face like she was surprised when she saw what I was doing. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Putting the fact you fed me dinner aside, you didn’t think that I was going to read this seriously, I’m guessing?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-Well, that’s
