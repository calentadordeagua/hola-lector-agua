[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:Td5ed,"])</script><script>self.__next_f.push([1,"\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 3:\u003cbr/\u003eThe Final Battle of The First Year\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT WAS\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e March 8. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn Class C, Chabashira was about to begin the final special exam of the first year of school. There were thirty-nine chairs and desks for each of the students in Class C. There had been forty chairs and desks just up until a little while ago, of course, but now one was missing. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi Haruki had been expelled. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t just Class C, either. Manabe from Class D and Yahiko from Class A had been expelled as well. There was no doubt the event had been a huge shock to the first-years. “There must be some way to save them,” everyone had thought, in the back of their minds. But now that thought had been shattered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe days continued to march forward without stopping, without the students recovering from their shock and heartbreak. At the same moment that the bell signaling the start of homeroom sounded, Chabashira strode into the room. There was no idle chit-chat in the classroom.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Well, then. Without further ado, I’ll announce the details of the final special exam for your first year,” said Chabashira, launching into her explanation for the exam.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d known things would end up this way, but I didn’t hear a single word about Yamauchi. Ike and Sudou, his best friends, were probably trying their absolute hardest to accept the reality of the situation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In the final special exam, you will be asked to show the culmination of everything you’ve learned over this past year. Intelligence, physical ability, cooperation, and luck. You’ll need to demonstrate your potential in every\u0026#160;field.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNormally, Ike would have immediately started peppering Chabashira with questions and expressing his doubts. But now, he was quietly listening to her explanation. He was probably feeling a sense of impending crisis—fearing that he might very well be the next to get expelled. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This special exam is called the ‘Event Selection Exam.’ The classes will compete with another, based on their overall performance. Which class you will be facing off against will be decided according to the rules. This will be just like the Paper Shuffle.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe Event Selection Exam, huh? I’d been wondering what kind of exam we were in for.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To make it easier for you to understand what I’m saying, I’m going to use these ten white cards and a number of yellow cards, which correspond to the number of people in class.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs Chabashira spoke, she started lining cards up on the blackboard. Each card was roughly the same size as a regular playing card. While the ten white cards seemed blanked, the yellow cards, on the other hand, had one student’s name on each of them. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA total of forty-eight cards had been placed up on the blackboard. If the number of yellow cards was meant to match the number of students in our class, though, then she was short one card. I wondered if that meant something.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“First, I’ll explain what these ten blank white cards are about. On these cards, you will be asked to list a total of ten separate ‘events’ that you have jointly discussed and decided upon.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs soon as she said that, everyone could see Ike develop a somewhat strained look. Chabashira, seeing him trying his hardest to keep his mouth shut, called out to him, sounding somewhat amused.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If there’s something bothering you, I don’t mind if you ask questions. Okay?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-well, but… it’s just, don’t you usually get mad if we talk too much when you’re explaining, sensei?” he asked in return.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was obvious he was feeling shaken.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I won’t be able to rest at ease until you go ahead and get your interruption over with.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira generally took questions at the end. But this time around, she was allowing Ike to speak up halfway through her explanation. Many of our classmates fixed their gazes upon Ike, who looked perplexed, but proceeded to go ahead and voice his concerns.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, um… It’s just…events? What’s that about?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A written exam. Shogi. Cards. Baseball. You can go ahead and write in whatever events you think you can win at. Also, you’ll have to establish rules for the events and how to decide who wins.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? So, we’re free to pick whatever?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though Chabashira had just told us we could write in anything we wanted, it seemed like the message hadn’t quite sunk in for Ike and some other students. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You are free to choose whatever you like, but there are some rules to follow when deciding which events you settle on. For instance, if you choose an obscure sport or some kind of game that not many people have heard of, then no one aside from the person who proposed the event stands much of a chance of winning. Moreover, the rules of the event must be fair and easy to understand. Therefore, after an event is submitted, the school will judge whether it is appropriate and will be implemented.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTrue enough. If we picked extremely niche events like obscure sports or peculiar games, or set bizarre rules, then not many people would stand a chance of winning said events. But did we get to decide all the rules of these events?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Also, you will need to fine-tune the rules to ensure there will be no draws. For example, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eGo \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eends in a draw if both sides have the same score at the end of the game. To avoid this outcome, you could specify that the white side gets an extra half point for going second, and thus wins,” explained Chabashira. “You might think at first glance that there’s no way a game like shogi could end in a draw, but there are rare instances in which both kings enter their respective promotion zones at the same time. In such a case, the result would be a draw, and the winner could be decided based on the number of pieces each player has on the board. You will be asked to draw up detailed rules to determine who wins and loses in advance. If you submit an event without such rules in place, then it will not be accepted.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, events where there would be a clear winner and loser, and nothing that was too obscure, huh? Even though you might say the students had countless choices at our disposal, this actually seemed to narrow down the events we could select.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, then. Let’s see if we can illustrate this with a real-life scenario. Something easy to understand. Ike, what are you good at? It can be anything, so just come out and say it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um… What \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eam\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I good at…?” said Ike, thinking to himself. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed nothing was coming immediately to his mind. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, uh, I guess I’m pretty good at stuff like Rock Paper Scissors?” he concluded, after giving it some thought.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHis classmates couldn’t hold back their laughter at such a ridiculous statement. However, Chabashira took his answer seriously, writing the words “Rock Paper Scissors” on one of the white cards.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then let’s say we choose Rock Paper Scissors as an event,” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke, who hadn’t imagined she would take his response seriously, looked dumbfounded, along with the rest of our classmates.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What about the rules?” asked Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um… First to get three wins?” replied Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira wrote Ike’s rule underneath the Rock Paper Scissors card.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This event is known to many, and the rules are simple and clear. There’s not a single reason why the school wouldn’t accept it,” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“S-she accepted it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though it was an event that Ike just randomly blurted out, from the school’s point of view, it was perfectly acceptable. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now we just repeat this process nine more times, and we’ll have our ten-event total,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe picked up a piece of chalk and began writing on the blackboard.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is the exam schedule. This is also quite important. The exam will be divided into three major stages.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eSpecial Exam\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em; text-transform: uppercase;\"\u003eMARCH 8:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Special exam announcement date. Class match-ups also decided on this day.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em; text-transform: uppercase;\"\u003eMARCH 15:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Confirmation of selection of ten events. The ten events chosen by the opposing class and their rules will be announced.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em; text-transform: uppercase;\"\u003eMARCH 22:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Day of Event Selection Exam\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-but sensei, if we’re doing twenty events, won’t that take a lot of time?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“On the day of the Event Selection Exam, each class will narrow their respective list of ten events down to five and submit those five as their main choices. So instead of twenty events, the choices will be narrowed down to ten,” explained Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter hearing that part, Horikita opened her mouth to speak.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Which means that five of the ten events are bluffs… They’re meant to mislead our opponents. Right?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I suppose that they can play that role, too. Of that narrowed-down list of ten events, the school will select seven at random via an automated system. That’s how this all works,” replied Chabashira, not disregarding but rather affirming Horikita’s suggestion.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed this special exam was going to be more drawn-out than the ones we’d had thus far. I imagined the school was going with seven events to ensure a clear winner. With no chance of a tie, whoever won four of the events would emerge victorious.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if the outcome is already decided before all seven events are complete, the test will continue until the final event. This is because the events will affect class points. So, regardless of whether your class might definitely win or definitely lose, you will be seeing these events through to the very end. Applications for the first list of ten events will be accepted until the end of the day on Sunday the 14th. Because your events will need to be evaluated for approval by the school, you’re better off finalizing each event as soon as possible,” explained Chabashira. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What happens if we don’t finalize ten events by the end of the 14th?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then the school will fill in the gaps with alternative events that they’ve had prepared. But don’t expect these to be the best events for your class. While you may not necessarily be at a disadvantage in them, you probably won’t be at an advantage, either,” replied Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed it would be wisest for us to work on finalizing our own ten selections, no matter what.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s also important to note that the same class cannot register the same event twice. Let’s suppose a class were to submit a soccer event, with a best-two-out-of-three rule. If you then tried to submit another soccer event where the outcome was decided via a penalty kick, it would be rejected. Please be mindful of this.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can we retract an event once it’s been finalized?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, you cannot.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then…can any student participate in the seven events? And is it possible for students to participate as many times as they wish?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Some of the rules regarding these events are difficult to communicate verbally. Therefore, the school has prepared this handout with more detailed information. Feel free to make copies of it later. The answers you’re looking for are printed on the handout, Horikita.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt would have been nice if the school had just made enough copies for everyone, but I supposed it was possible they’d intentionally done things this way. If we only had one copy of the handout, everyone in class would come together to read it over, which would make it easier to prompt discussion among our classmates.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just as I wrote on the blackboard, the ten events each class decides upon will be relayed to the opposing classes on the 15th. After all, it’s hard to call it a fair competition if you don’t know what events and rules your opponents have chosen.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat meant we had almost one week to study, practice, and come up with plans for these events. It was also likely that the day of the exam itself would become a battle for each class to figure out what events the opposing class preferred.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Once the exam has concluded on the 22nd, the 23rd will be a vacation day. After that, the graduation ceremony will be held on the 24th, and then the closing ceremony on the 25th. Once those events are out of the way, you’ll officially be on spring break.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed our levels of motivation would depend on whether we won or lost. At any rate, after hearing all of that, I felt I had a fairly good grasp on how the Event Selection Exam worked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe look on Chabashira’s face seemed to suggest she still had something major to explain to us.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s one other important piece of the puzzle here, aside from deciding upon the events. And that is the fact that you are going to need a ‘commander’ to manage this many people. Please keep in mind that this commander will not be able to participate in events directly.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A commander…?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat’s\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e why there were only thirty-eight student cards up on the board, huh?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s an important job, and one that requires adaptability. You can interpret this position as a supporting role—someone who assists with all the events and provides lifelines when necessary. They can, for example, substitute for another student, or solve a difficult problem. This isn’t limited to sports, either. Even in events like Go and Shogi, the commander will be allowed to intervene,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat meant this wasn’t simply a showdown between students based on their fundamental skills. The commanders played a role too, huh?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You must also decide how your commander will get ‘involved.’ Ah, yes. Say, for example, if we went with Rock Paper Scissors… You could come up with rules such as ‘The commander may volunteer to step in and participate once, when they wish,’ or ‘The commander can substitute for another student who is about to play.’ Determine the methods your commander may use to step in,” she explained.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt sounded like the commander’s involvement was generally accepted as long as it was fair. If we gave the commander the ability to swap out players in events like baseball and soccer, it would essentially be assigning them the role of coach. Although there were seven events, it was likely that the commander’s involvement was going to be a major point of consideration.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Commanders will be granted private points individually in the case that they help secure a victory. But they’ll also be held responsible for defeat. That’s right. If their class is defeated, the commander will be expelled,” explained Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, someone was going to be forcibly expelled this time around, too.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In this special exam, having a commander is absolutely essential. If the commander is not present, the test will not be allowed to proceed. If you have trouble trying to come to a decision on your own through discussion, come talk to me. I will appoint someone appropriate for the role.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd we had to nominate someone, just like before. It\u0026#160;seemed likely the Protection Point that I got from the last test would play a big role here. I could tell that a lot of people’s eyes and feelings were being directed at me. The Protection Point was the only feasible option we had for nullifying an expulsion. Since I had one, if they appointed me commander, that meant I could avoid getting expelled even if we lost.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was just that…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWas it okay for me to take on the role of commander to ensure no one got expelled? Or should we ask a talented student like Horikita to take the role, trying to increase our chances of winning, even if it was just by one percent? I was guessing my classmates would be fine with either choice. They probably wouldn’t object if someone other than me accepted the role, either. If no one wanted to volunteer for the role, on the other hand, their expectations would fall on me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How will our opponents be decided?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The students who have taken on the role of commander will all gather together in the multi-purpose room after class today. We’ll hold a lottery for those students to be able to choose their opponent. You’ll have to discuss among yourselves in advance about which class you’d choose if you win the lottery.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt sounded like the winner of the lottery would get to select the class they wanted to go up against, leaving the two remaining classes to be automatically matched up with one another.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then, we obviously gotta go with Class D, right? Our chances of winning against them will be higher.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s certainly true that going up against students currently languishing in Class D might increase your chances of winning, due to their overall inferiority. However, it’s not necessarily an advantage to fight against a lower-level class,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, if that were true, then the three other classes would inevitably want to pick Class D. Now that Ryuuen had fallen from power, Class D would be the easiest opponent to go up against. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Chemistry matters in this exam. It’s very important that you take each class’s distinctive characteristics into account.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe didn’t necessarily need to despair, even if we were competing against Class A or Class B. If we chose an event favorable to our class, we’d have a good chance of winning. But the unavoidable truth was that the higher the level of the class, the tougher of an opponent they’d be. Despite what Chabashira had just said, not a single person in class cracked a smile. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita’s imagination was running wild, too. She was wondering if we could beat Class A or Class B if we challenged them as we were now.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems what I said wasn’t much of a comfort. In that case, let’s look at some harsh truths. If you’re defeated, and Class D wins… That means you’ll fall into last place again.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira picked up a piece of chalk and wrote out the current Class Point totals.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eClass points as of March 1\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass A: 1001 Points\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass B: 640 Points\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass C: 377 Points\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass D: 318 Points\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass C and Class D were neck and neck in terms of class points. We had managed to make our way up to Class C over the course of this year, but if we lost at the very last minute, then we’d be sent back down to Class D. That meant, as students, we’d want to keep our position at all costs.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As for how these events will affect your class points… You’ll see an increase or decrease of thirty points per event. So if you win all seven events, that means you get two hundred and ten points. If you win five events and lose two, you’ll get ninety points. The points come from the opposing class’s total. In addition, the school will award you another one hunded points as a reward for overall victory,” explained Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhich meant we could earn a maximum of three hundred and ten points. The fact that we could snatch class points from our opponents through winning these events was another major upside. Until now, we’d had no way to make much of a dent in the class point totals of the upper-level classes, even if we wanted to. But now, it was possible for us to knock them down in one fell swoop. Depending on the match-up and the results, there was a sufficient chance of us either moving up to Class B or being knocked back down to Class D.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In the event that the opposing class lacks the sufficient number of class points, the school will temporarily make up the difference, but require the class to eventually reimburse them for those points. This means a class may appear to have zero points on the surface, but will actually have a negative class point total,” explained Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo it was possible for class points to drop below zero, albeit in an invisible manner. At any rate, since every class had over two hundred and ten points at present, that didn’t seem like something we needed to worry about.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e3.1\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eW\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHEN CHABASHIRA LEFT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e we had a little time left before class began. Some students went up and picked up the rules handout that had been left on the podium.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“May I have a moment?” asked Horikita, squeezing between them to take pictures of the rules with her cell phone. She was probably taking the initiative to do that so she could calmly look over the rules from her seat. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI remained seated at my own desk and watched everything.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can show you, too. Though you might not be interested,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I appreciate your thoughtfulness,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eImmediately after that, she sent me two pictures via text message. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em; text-transform: uppercase;\"\u003eEVENT SELECTION EXAM \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eRules for Selecting Events:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEvents that are too obscure, are too complex, or have exceedingly detailed rules may not be allowed. In the case of events with written questions, the school will provide the test questions to ensure fairness. Deviating from or altering the basic rules of the events is strictly prohibited.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eRegarding usable facilities:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOn the day of the special exam, the commanders will carry out their duties from the multi-purpose room. Additionally, school facilities such as the gymnasium, the sporting grounds, the music rooms, and the science labs may be used, though there are some exceptions.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eRegarding event restrictions and time restrictions:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDuplicate events will not be accepted. If an event is determined to have the same content as a previously submitted event, it will not be accepted. Also, if an event is determined to take too long to complete or has no time limit whatsoever, it may not be accepted.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eRegarding the number of participants:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe required number of participants for each of the ten submitted events must be different, excluding those acting as substitutes. The minimum required number of participants is one, while the maximum number of participants must not exceed twenty (including those acting as substitutes). Only a maximum of two events that require more than ten participants per class (including substitutes) may be submitted.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eRegarding conditions for participation:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEach student may only participate in one event. Students may not participate in two or more events. However, if every student from a class has already participated in an event, then a student will be allowed to participate in more than one event. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eRegarding the role of commander:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe commander has the right to be involved in all seven events. Exactly how the commander is involved will be determined by the class that proposed the event. The scope of this involvement must be approved by the school before the event is adopted. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe rules were roughly divided into six sections. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe number of participants could range from one person to twenty people per event. And while events that actually required twenty participants were probably quite limited, there were some options you could come up with, depending on your approach. If you managed to come up with two events that required close to forty people, then it was possible that some students would have to participate a second time, maybe even a third time.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if you tried to narrow your selections down to an elite few, though, that got tricky when you had to ensure that the required number of people for each event was different.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The school really has prepared quite a difficult special exam for us, haven’t they?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. But as something that’s supposed to be a culmination of everything we’ve learned over our first year, I guess this is pretty appropriate.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a system where many students had to participate and work together if they were going to win. It was similar to the sports festival, but this time around, it wasn’t like physical ability alone would give you an advantage. Depending on your approach, it was possible to turn this into a battle focused on only academic ability, or a test of intelligence or other mental faculties.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe key to the test likely wasn’t just being able to discern your own strengths and weaknesses, but also those of the other classes. After giving the event selection process some thought, I concluded that the amount of time the school had given us was adequate. We were going to have to engage in a considerable amount of discussion and be extremely careful with our selections if we wanted to do our absolute best.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFurthermore, there were some students I doubted would actually participate in the events. If we couldn’t get everyone in class to participate in an event at least once, we couldn’t get anyone to participate a second time, forcing us to adjust accordingly. Now that she understood everything, Horikita looked a little displeased. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks like you’ve got some issues with this special exam,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, several. The thing I’m most displeased about is the fact that the winner is largely determined by which class has more events chosen on the day of the exam. We’ll be at a significant disadvantage if the events that our opponents prepared are favored over ours,” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe’d only have absolute confidence in the events we prepared ourselves. Naturally, we’d want to compete in our own events rather than the other class’s. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wouldn’t it be much fairer if the school simply created ten events and presented them to each class, then narrowed them down to seven events on the day of the exam?” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed that if you looked at the situation from a fairness standpoint, Horikita was correct.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That only reduces the odds of the lower-level classes winning, though. We should probably be grateful for this test, since if we’re lucky, we’ll be able to beat the higher-level classes,” I reasoned. It was a reasonable assumption that the higher a class’s level, the better its prospects were.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s… Well, I suppose that’s one way you can look at it, but…I really don’t like this test, after all,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBe that as it may…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was the time for us to begin discussions and figure out our events. But Hirata kept his head hung low, not moving an inch, simply waiting for time to pass. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He was the person everyone rallied around until just the other day,” I observed aloud.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you saying that it’s my fault?” snapped Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dunno.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was Hirata’s personal problem, but it was unclear how much anyone understood what was wrong… including Hirata himself. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs Hirata remained completely motionless, it was Sudou who spoke up, right as the class was about to begin discussion.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey everyone. Before we get into discussion, there’s just one thing I wanna clear up.” He glanced briefly at me, then went back to looking out at the rest of the class. “Well, lots of people weren’t really all that happy with the results of the last test. Right, Kanji?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Well, I dunno if I’d say that I’m unhappy with what happened and all, but it’s just like, I don’t really get it. I\u0026#160;mean, I just wonder, how did Ayanokouji get the most praise votes? I think everyone’s wondering about that. And, like, why did he get forty-two votes?” said Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMany pairs of eyes had now fallen on me. Even the people in the Ayanokouji Group were looking my way. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You mean, like…he got a lot of praise votes from the other classes, right?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere had been no time for explanations or excuses at the end of February. I’d anticipated that I’d be inundated with these kinds of questions, but I couldn’t exactly hold forth at length on the subject. My social standing in the class was low. I wasn’t in a position to talk openly about anything.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“About that. I’ll explain what happened,” said Horikita, taking the lead.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait. We want to hear an explanation from Ayanokouji. We…lost a buddy, y’know?” said Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That might not be possible,” replied Horikita, standing up, beginning to cover for me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not… possible? What?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because this is probably something that even Ayanokouji-kun himself doesn’t fully understand,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Ayanokouji didn’t know?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Exactly. Put simply, everything was orchestrated by Sakayanagi-san. I have my own theory as to why she did it. I’ll explain that, too.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita continued to run through the situation, point by point, framing everything in an easy-to-understand manner.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“First, she targeted Yamauchi-kun, telling him to rest easy, because she’d be giving him praise votes. There can be no doubt about that part, since Yamauchi said it himself in the end. But secretly, she’d probably decided to give the votes to a different student,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, sure, I suppose that makes sense. But we’re asking about why she picked Ayanokouji,” answered Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Right. Why do you think she did, Sudou-kun?” replied Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s… Well, maybe, for instance, the truth is that Ayanokouji’s, like, this super amazing dude or something? So, she decided that he was worth giving praise votes to…or something?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Have you seen him do anything incredible, though? My impression is that he’s just a student who just so happens to be a fast runner is all.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well… I suppose you’re right.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He hasn’t gotten especially good grades on the written exams, and aside from being able to run fast, there hasn’t been a single time he really stood out in any sporting events. If anything, considering the fact that the rest of his skills aren’t up to par with his speed, it’s even possible that he’s not an all-around good athlete. Additionally, I have to say it doesn’t seem like conversational skills are his strong suit, either,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEverything she’d just said was something the others already knew to be true. There was no way they could deny any part of it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Which means it’s impossible she picked him for that reason,” she concluded definitely, without an ounce of hesitation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what, she just happened to pick him, and that’s it? I dunno. For some reason, that just doesn’t sound quite right,” replied Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Think about it. If Ayanokouji-kun were a remarkable person, why would Sakayanagi-san deliberately go out of her way to give him a Protection Point? There’s nothing more foolish than giving a praise vote to an opponent you consider formidable. If there was a single exception to that rule, it would probably be casting a praise vote for Ichinose-san, since she was expected to get the most praise votes all along,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose had gotten a total of ninety-eight praise votes, the result of the desire to concentrate praise votes on a single person rather than just casting them for someone at random.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I would certainly never give a Protection Point to a tough opponent.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Me either.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei and Sakura spoke out in agreement, convinced by Horikita’s explanation, followed by many of the boys.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t understand why Sakayanagi-san targeted Yamauchi-kun, but if we assume she wanted to get Yamauchi-kun expelled, then we can see everything lines up in a way that makes sense. And so, there was a one-on-one battle between Ayanokouji-kun and Yamauchi-kun in our class, just as she had calculated. Then, by concentrating the majority of praise votes on Ayanokouji-kun, she could ensure that Yamauchi-kun alone would be expelled,” reasoned Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So…you’re saying that Haruki getting expelled was all part of Sakayanagi’s strategy?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. And it follows that the fact Ayanokouji-kun was chosen—no, that he was used—was mere coincidence. He doesn’t stand out and he poses no harm to Class A. That’s just how things played out,” explained Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a sound theory. And the way she’d explained it to everyone, it couldn’t be used against me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is the only reason I can come up with for why Yamauchi-kun was targeted and Ayanokouji-kun was protected,” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter hearing that, Sudou and Ike had no choice but to concede. Even so, it seemed like Sudou was having a difficult time coming to grips with it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Does the fact I defended him upset you?” asked Horikita, looking at Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou didn’t give her a direct answer, but merely averted his gaze.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I defended him because I’m aware of the fact that I’m the main reason why Yamauchi-kun had gotten expelled. Not Ayanokouji-kun,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe’d been the one to expose Yamauchi’s scheme and back him into a corner.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If anyone’s at fault, it would be ridiculous to blame anyone but me.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But that’s…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou couldn’t possibly blame Horikita for what happened. He understood the truth. He knew it was inevitable that an unnecessary student would be discarded. Still, no matter how reasonable her explanation, not everyone could accept all this at face value…because the fact remained that I was the one who’d gotten the Protection Point. That meant only one person in this class would be able to watch this test from the sidelines, at a safe distance.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Would it be okay if I…volunteer to be the commander for this special exam?” I asked, jumping into the conversation after finding the right time to do so.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile I hadn’t heard from Sakayanagi, I was one hundred percent certain that she would be the commander of her class. Which meant we probably couldn’t have a proper showdown unless I was the commander of my\u0026#160;class.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s true that everyone feels suspicious of me because of what happened in the In-Class Voting exam. I want to dispel those doubts by offering to sacrifice myself in this test,” I reasoned.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji…” Sudou looked at me, seeming somewhat shocked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, that’s a great idea. This way, no one’ll get expelled, and Ayanokouji can clear everything up!” exclaimed Ike, supporting my bid for commander once he realized it meant we’d get through the exam without any expulsions.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, wait a minute. Well, I’m happy that Ayanokouji-kun is okay with accepting this position, but I think I’m a little opposed to him being our commander.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe student who cut in unexpectedly was none other than Shinohara.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s true that if we ask Ayanokouji-kun to do this, then no one will be expelled even if we lose, since he has the Protection Point. But doesn’t that feel like throwing away our chance at winning right off the bat? It’s like, we’re just preparing to lose. I mean, just like Horikita-san said, Ayanokouji-kun is average,” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBasically, she was saying that she couldn’t see us winning this thing if I were the one calling the shots. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we get matched up with Class A or Class B, that means we’ll probably be going up against Sakayanagi-san or Ichinose-san, right? The commander seems like an important job, and Ayanokouji-kun doesn’t seem to have much of a chance of winning. You guys know we’ll probably be sent back down to Class D if we lose, right?” said Shinohara.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSome of the students certainly agreed with Shinohara’s opinion.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wouldn’t it be better to at least see if anyone else might want to volunteer to be commander?” she concluded.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, the position came with the risk of expulsion. No one here was foolish enough to raise their hand without a second thought. If things were back to normal, we might have been able to count on Hirata coming forward, but it didn’t seem like that was going to happen. Right now, he simply sat alone, eyes cast downward, not even attempting to join in the discussion.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf there was a single student who wasn’t afraid of expulsion, who would step forward and volunteer to be the commander in this situation…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone turned to look at Horikita. But in a case like this, she likely…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I am terribly sorry, but I’d like to avoid the risk of expulsion myself, too. If Ayanokouji-kun is willing to step forward for the position, then I’d like to gratefully take him up on that offer. As Shinohara-san said, if we end up fighting against Class A or Class B, then honestly, there’s no definite guarantee that we’ll win at our current level anyway.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But Horikita-san, you were just covering for Ayanokouji-kun a second ago. Now you want him to be the commander?” said Kei, cutting into the conversation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I simply thought that if I spared him the trouble of having to prove he had nothing to do with Yamauchi-kun’s proposal, then he would be willing to step forward and help by assuming the role of commander in return,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe’d managed to cleverly cut off any chances I had of weaseling out of the role. It seemed Horikita had wanted all along to foist the role of commander on me, just as I’d thought she might. She thought much more highly of my abilities than the other students did, and she was probably convinced it would be better to leave the position of commander to me than to some other half-hearted student. Besides, even if we lost, I could always just use my Protection Point.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is anyone else willing to step forward?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf there was any room for rebuttal, it would be from someone willing to volunteer for the position of commander. However, there didn’t appear to be anyone willing to take the risk of getting expelled.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even though the position is called commander, we can make careful preparations for everything ahead of time, just in case. As long as the commander follows those directions on the day of the exam and keeps everyone in line, it shouldn’t really make much of a difference who is in the role,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe students who weren’t thinking too deeply about the matter seemed convinced, letting out sounds of agreement.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In any case, class is about to begin. The school isn’t going to set aside time for us to discuss this, so we should make plans to meet up,” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that Hirata wasn’t taking the initiative, it looked as though Horikita was the one to step forward and lead the class.\u003c/span\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 3: The Final Battle of The First Year\",\"volumeId\":\"v11\",\"chapterIndex\":9,\"prevChapter\":{\"volumeId\":\"v11\",\"chapter\":8,\"title\":\"Chapter 2: The Teachers’ Battle\"},\"nextChapter\":{\"volumeId\":\"v11\",\"chapter\":10,\"title\":\"Chapter 4: Opponents\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Title Page\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Sakayanagi Arisu’s Soliloquy\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: The Teachers’ Battle\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapt
