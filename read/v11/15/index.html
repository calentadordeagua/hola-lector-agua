],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:Tef1b,"])</script><script>self.__next_f.push([1,"\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 9:\u003cbr/\u003eClass B VS. Class D\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eS THE SCORES\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e for the English Test, Class A and Class C’s third event, were being tallied, Class B and Class D had already settled their fourth event.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“According to the results, Class B has six hundred and one points. Class D has four hundred and nine points. Class B wins the fourth event.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs Mashima announced the results, Ichinose let out a sigh of relief. This was an academic test that Class B had selected themselves, meaning it was something they absolutely couldn’t afford to lose. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whew, you sure were lucky, huh, Ichinose? I mean, we just keep drawing events that Class B came up with,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I suppose so,” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though Class B had won, Ichinose didn’t seem composed. Ryuuen, on the other hand, seemed cool as a cucumber despite having lost. This was understandable, though. Of the four events drawn so far, three had been events Class B had selected. But those four events hadn’t gone as expected at all, with Class D winning two and Class B winning two.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass B lost the third event, the Chemistry Test, which they had selected themselves. And it left them really rattled. The reason why they lost was clear, though.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sensei…have any of the students who went to the restroom with stomachaches returned?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt Ichinose’s request, Mashima checked how the students from Class B were doing.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, those two still haven’t returned from the restroom. Also, it seems several more students are now feeling unwell,” he replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe reason why Class B lost the Chemistry Test event was because the students they were counting on to compete had unexpectedly fallen ill. But that wasn’t the only reason. On the day before the exam, some students had gotten into a fight with Class D students. It had impacted the test today, but although an appeal had been made to the school, neither class had been penalized. The school deemed it as nothing more than a verbal argument.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThese underhanded actions were, without a doubt, carried out under the orders of the person sitting across from Ichinose. Ryuuen. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe took a few deep breaths to try and calm herself\u0026#160;down.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ePhew\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e… It’s okay. It’s okay.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t like Class B had handed over the lead yet. Ichinose had been rattled when they lost the Chemistry Test, but now things were slowly starting to return to normal. While it was certainly true that fresh problems seem to keep popping up, it wasn’t like Ryuuen could do anything as commander that Ichinose couldn’t.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose thought that as long as she fought the good fight, they weren’t going to lose. She desperately tried to hold onto that belief.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yo, teach. Hurry up and start the fifth event already. Those Class B slackers couldn’t even manage to keep themselves in shape for the day of the exam. Are you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ereally\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e gonna make concessions for a bunch of stupid, naïve losers like that?” said Ryuuen snidely.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Watch your mouth, Ryuuen.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite Chabashira’s warning about his language, Ryuuen didn’t seem to care. If anything, he got more extreme.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Look, I dunno if they’re in the bathroom or whatever, but seriously, they could be using this time to discuss strategy or something. And come \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eon\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, multiple students getting sick at the same time? Sounds fishy. What kind of underhanded BS are you trying to pull, Ichinose?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I didn’t…” she stammered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen cast suspicion on the fact that several students had reported that they were feeling unwell at the same time. Even though Ichinose knew for a fact that there was absolutely no wrongdoing on their part, she couldn’t refute what he’d said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, just hurry up and get on with it already,” said Ryuuen, looking at Chabashira with a big smile on his face.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, Ryuuen is right about that one point, at least. Mashima-sensei, please begin the fifth event.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe began the drawing.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eKarate\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRequired Participants: 3 Persons\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAllotted Time: 10 Minutes \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRules: Up to three minutes per match. Non-contact, knockout competition tournament rules apply.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCommander: The commander can call for a rematch one time.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, a Class D event this time. Bring it on. We’ll take whoever you throw at us,” said Ryuuen. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen chose Suzuki Hidetoshi, Oda Takumi, and Ishizaki Daichi as his three competitors. The commander intervention rules were just perfect for him too, as he could call for a rematch in the event that something unexpected happened and he lost. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose, on the other hand, chose Sumida Makoto, Watanabe Norihito, and Yonezu Haruto as her three competitors. She’d had the three of them practice for a week after they heard about the karate event, but they had their hands almost entirely full just remembering the rules. As a result, Class B suffered two staggering losses in a row. Even if she used her commander ability to intervene, it wouldn’t change the results.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe fifth event had been settled quicker than any event so far. So quickly that felt like it had been decided in the blink of an eye. Now that it had come to this, if Class B lost the next event, it would be all over for them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Pretty interestin’, huh, Ichinose?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile they waited for the machine to draw the next event, Ryuuen called out to Ichinose, who was now at a loss for words.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Back when they announced this special exam and we found out that you were going up against us, I bet you felt like you were at a definite advantage. But now it looks like all you can do is pray for a miracle. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eKu ku\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose’s strategies were by no means simple or stupid. If this were a normal competition, Class B would be sitting at three wins and two losses right now. But there had been a sudden accident. And because of that, things had gone entirely awry. If they didn’t get one of their own events drawn next, there was no way they’d win. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe drawing for the sixth event began.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eJudo\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRequired Participants: 1 Person\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAllotted Time: 4 Minutes Per Match (A Maximum of Three Matches, for Twelve Minutes Total)\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRules: Standard judo rules apply.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCommander: The commander can call for a rematch one time.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA one-on-one event. For Class B, it was the worst possible event that could’ve been chosen. This was the first time Ichinose felt like she had been plunged into total darkness.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eKu ku ku\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, judo, I see. Judo. Oh, man, getting \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eevent, guess you’re really in trouble, huh, Ichinose.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No way…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess if the final events had been ones Class B came up with, you might still have had a shot at winning this thing, huh?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen selected Yamada Albert without a second’s hesitation. Just like with the karate event, the commander rules were basically the ultimate insurance policy, which almost guaranteed there was no way for Class D to lose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t let going up against Albert get to you. Luck matters when it’s actually time to throw down, y’know. You never know how it’ll go until you give it a shot,” taunted Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was clear as day what the results would be. It would be extremely difficult for Class B to defeat an opponent who was on an entirely different level in both technique and physique. It was the one event that Class B had given up, and that they had no hope of winning, no matter what.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose had to select one person. She had only thirty seconds to choose, but now…she couldn’t even come to a decision. The clock mercilessly counted down to zero. As per the rules, a student would be selected at random if the commander didn’t select someone in time. But given the danger of this particular event, and the opponent that student would be facing, the teachers made a judgment call.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Class B is disqualified. Class D has won four events, making them the overall winner for this special exam,” declared Mashima mercilessly. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe battle between Class B and Class D had quickly come to an end.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e9.1\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT ALL BEGAN\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the day that the special exam was announced. Ryuuen headed off to lunch, and Ishizaki chased after him alone. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass D had already decided to make Kaneda their commander, but they were having unexpected trouble coming up with events. The reason was that no one in Class D was capable of coming up with original ideas. Ordinary events. Ordinary rules. Ordinary fighting styles. They could only imagine simple things, things anyone might think of. No matter who they went up against, their odds of victory were so low as to be practically nonexistent.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSubmitting such run-of-the-mill events was, basically, the simplest approach. The consensus in Class D was currently that they ought to avoid going up against the likes of Class A. Similarly, they decided they should be arguably even more wary of choosing Class B. Everyone settled on challenging Class C, who was on the rise. But Ishizaki railed against that idea.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, uh… you got a minute, Ryuuen-san?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough terrified of trying to talk to Ryuuen, he did so anyway…after making sure there were no other first-year students around.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA mere glare from Ryuuen made Ishizaki freeze, like a frog being eyed by a snake. But even so, after a desperate struggle, he managed to croak some words out.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please… Give me a minute of your time!!” he shouted.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh ho, so you’re a big shot now, huh?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“N-no, I ain’t sayin’ anything like that…!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eKu ku\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, yeah, whatever. You’re practically the leader of Class D right now.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen felt like he was merely prolonging his sentence. He’d gotten a little extra time until he was kicked out, that was all. It did mean that he had some time to\u0026#160;kill. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki and Ryuuen continued walking, with Ishizaki trailing behind. Even if someone saw them, it would probably just look like Ishizaki had called Ryuuen out to talk to him about something.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter they left the school building and made it to an area where there didn’t seem to be anyone around, Ishizaki immediately got down on his hands and knees.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ryuuen-san, please, help out Class D…for this special exam!” he begged.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen had had an inkling about what Ishizaki was going to say from the moment he first opened his mouth. But he didn’t make a single sound. He just looked down at Ishizaki, prostrating on the ground before him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re talkin’ nonsense, Ishizaki. I’ve already told you, I’m retired. You think I’m gonna help you?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Look, I know that. But right now, we don’t got what it takes. There’s no way we can win against any of the other classes!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, you’re probably right about that.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen wasn’t denying that point, either. He had already surmised that Class D was overwhelmingly inferior to the other classes when it came to their potential.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kaneda’s gonna be our commander, so no one’s gonna get expelled even if we lose…but if we lose this, our class points will pretty much be totally gone!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah, I guess there’s no avoidin’ that after losing seven times,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCurrently, Class D had three hundred and eighteen class points. If they lost all seven events in a row, they’d be down to only one hundred points. While that was just the worst-case scenario, it also wasn’t entirely unlikely if they continued bumbling forward without a plan.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what, you want me to be the commander? Who in our class would even agree to that?” asked Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn order to get Ryuuen expelled, they’d need to make him commander. And then they’d need to lose. But that would require the class to take a heavy blow just to get one person expelled. Nobody was thrilled by the prospect of such a tradeoff. If their class points were reduced to zero, then it would be next to impossible for them to ever reach Class A. What was more, it would impact their chances of leading comfortable, stable lives here at this school. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass D’s first preference was victory. Their second would be to lose by a slim margin and get Ryuuen expelled. They just had to avoid losing their Protection Point and getting thoroughly destroyed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki, however, didn’t want Ryuuen to get expelled. And at the same time, he wanted Class D to win. And if there was anyone in Class D who could make that happen, it was none other than Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…So, what should we do? Should we go after Class C after all?” asked Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNormally, he would’ve been gunning for Class C without hesitation. But Ayanokouji was in that class, which made him hesitate, precisely because he was one of the few students who knew Ayanokouji’s true nature. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t just ask me for my opinion without gettin’ my say-so. Who the hell said I’d help?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki was making a sink or swim plea here. He knew he was being reckless, but even so, he didn’t get up off his hands and knees. He was prepared to continue begging like this until the moment Ryuuen walked away. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, it’s certainly true that Class C ain’t exactly united. Sure, they’ve got a monster like Ayanokouji, but he’s just one guy. You might think that you have a chance, since this is a team competition…but you’d be wrong.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh…?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen, whom Ishizaki had begun to think he couldn’t convince to help him, started giving him advice.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now, if I were commander, I’d avoid going up against Class C. I dunno what method we’re going by choosing our opponents or whatever, but they ain’t one I’d choose myself.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-But, other than Ayanokouji—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That ain’t the reason why. Ugh, this is exactly why you’re a total moron.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even though Class D is chock-full of incompetent idiots, we’ve got the edge in \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eother\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e areas. Class C isn’t the opponent who’ll let us make use of those gifts. No, no, there’s only one class that is the optimal choice, as our opponent.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-Who is that? Is it—?!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Class B,” answered Ryuuen, without even looking at Ishizaki. “If you’re planning to win this time, then Class B is your only option.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA completely unexpected answer. Ryuuen had just proposed that they select Class B—the class everyone in Class D had said they definitely wanted to avoid.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even an idiot can be useful, depending on how you use ’em.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen turned his back on Ishizaki and started to walk away.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-Wait! How, though? How can we beat Class B?!” shouted Ishizaki, looking up at Ryuuen, still down on all fours. “Ryuuen-san! Ryuuen-saaaaan!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut his shouting did nothing to stop Ryuuen from walking away.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e9.2\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eSHIZAKI’S AUTHORITY\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e within Class D wasn’t exactly something to scoff at, considering that he was the one who defeated Ryuuen, even if only ostensibly. That being said, his control wasn’t iron-clad. The person who was supposed to have gotten expelled, Ryuuen, was still here. The class had focused their criticism votes on Manabe just to scare her a bit, but she’d gotten expelled instead. Naturally, this made many students suspicious.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, the first question everyone was asking was who cast this huge number of praise votes for Ryuuen. Were there people in class who’d cast praise votes for him? And if from other classes, who then? Several theories had been repeatedly floated and then promptly discarded. Due to the high degree of anonymity of the special exam, Class D would never know the exact answer.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn reality, Ryuuen and Ichinose from Class B had struck a deal, where she offered to give Ryuuen praise votes in exchange for private points. That was what had happened—not that Class B would ever reveal the truth, of course. Since Ichinose had asked that it be kept a secret, her classmates were inclined to obediently follow her wishes. They would probably have done as she asked even if without a reason behind it, but since this was part of their strategy to prevent one of their own from getting expelled, everyone was more than willing to help. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone in Class D, on the other hand, was thrust into a state of paranoia, jumping at shadows. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, there were a few students who knew the truth. That would be Ishizaki and Ibuki, who had acted to prevent Ryuuen’s expulsion, as well as Shiina Hiyori, their co-conspirator. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wouldn’t have been surprising if the class had wound up stagnating from there that point onward, though. As such, Shiina had a very important role to play. She had faithfully aided Ishizaki in implementing the only bit of advice he’d gotten from Ryuuen: that they go up against Class B in this exam.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShiina, in a private conversation with Kaneda, subtly guided him to the conclusion that they should do so. Of course, it wasn’t like that solved their problems. Shiina understood quite well that if Class D, which had no leadership, clashed with Class B as they were right now, their chances of winning were next to nil. She also knew that falling even slightly behind would lead to defeat.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd so, Shiina immediately put another plan into action on the day the match-ups were decided. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Damn it. Ugh, what do we do…?” muttered Ishizaki, at his wits end, sitting in a room at the karaoke parlor.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I dunno. Okay, hold up a sec, why did you call me here again? And what the hell is with this group?” Ibuki glared at Ishizaki for a moment and then turned her stern gaze on Shiina, who was sitting next to him. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re all Ishizaki-kun’s delightful band of friends. I\u0026#160;suppose that’s what you could call us?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki slouched her shoulders and glared at Shiina after hearing this silly, nonchalant response. “Ugh… My head hurts.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As the three people who best understand our current situation, I thought we would come up with some ideas. You know what they say, three heads are better than one,” said Shiina.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Three heads are better than one? What, are we gonna headbutt those Class B guys or something?” asked Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eserious\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e right now?” snapped Ibuki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ow! The hell, Ibuki, that hurt! Don’t pinch the skin on the back of my hand!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now we look quite lively. Meeting up in a karaoke room was definitely the right decision,” said Shiina, bringing her hands together happily as she watched Ibuki and Ishizaki go at it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, there’s no way we’re having a discussion with this group. I’m out of here,” huffed Ibuki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, um, that would be a problem, though. You see, I’ve called Ryuuen-kun, so he’s coming here, too.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?” replied Ibuki and Ishizaki in perfect unison.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ryuuen-kun is absolutely indispensable when it comes to winning this special exam. After all, he’s the one who figured out our only chance of victory lay in facing off against Class B, when everyone else wanted to avoid them.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShiina had just dropped a bomb on the two of them. She didn’t seem to understand the gravity of what she’d just said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What did you just say?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? I said, our only chance of victory in facing off against Class B, when—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not that part. Who did you call? Who is coming here?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ryuuen-kun.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki looked at Ishizaki. Ishizaki looked back at Ibuki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“S-seriously? Ryuuen-san’s comin’ here?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. I asked him to.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, this is gonna be the worst karaoke meet-up ever… Okay, did you tell him about us?” asked Ibuki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course I did.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, wait, he knows we’re here, and he’s still gonna come…?” Ishizaki had already tried to ask Ryuuen for his help, and been refused. His shock was understandable.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just out of curiosity, what time did he say that he was coming?” asked Ibuki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Four-thirty,” replied Shiina.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Huh?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki looked at the clock on the wall of the room they were in. It was already five past five.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would seem he’s just a little bit behind schedule,” said Shiina.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s been over thirty minutes, though! That’s not being ‘behind schedule;’ he’s just ignoring you completely!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now, now, calm down and enjoy some melon soda. Why don’t we just wait patiently?” asked Shiina, offering Ibuki a melon soda, which she promptly ignored.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Forget this…” huffed Ibuki, standing up to leave.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki blocked her path.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m gonna wait for him. Ryuuen-san’s definitely gonna come… Probably.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you an idiot? That guy hasn’t got a decent bone in his body. There’s no way he’d ever keep any promises, ever.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn fact, he was already quite late. Ibuki, done participating in this, started to walk away. But a slender, pale hand reached out and grabbed her arm.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s wait, shall we? You know, Ryuuen-kun is actually a more decent person than you might think. Hm?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…What do you even know about him?” huffed Ibuki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know anything about him. Honestly, I’ve only spoken to him a few times.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, then how can you know he’s decent?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I suppose it’s just a feeling.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, it’s not based in fact or anything. How sweet.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You might be right,” replied Shiina with a broad smile.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven Ibuki cooled off at the sight of that smile, which was free of any ill will.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides, it’s so much fun to hang out with everyone. Won’t you stay?” asked Shiina.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…You’re a moron,” replied Ibuki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eExasperated, she sat back down.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If he’s not here soon, I’m out of here.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right.”\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e9.3\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003e“I\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e’VE HAD ENOUGH!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough Ibuki had been more than patient, it was now past eight in the evening. You couldn’t even say Ryuuen was late anymore. They had been completely and utterly stood up, and Ibuki was seething.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I dunno, didn’t you sing, like, ten songs, though?” replied Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure you can be patient a little while longer, Ibuki-san.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No! My patience already ran out a long time ago!” shouted Ibuki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then, let’s do our best to give you more patience!” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not joking around!” snapped Ibuki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“God, you’re so pissy… Don’t you get, like, tired of being so pissed off all the time?” sighed Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“One look at your face would make anyone a million times more exhausted!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki tried to grab Ibuki to stop her, but she shook him off and headed for the door. But just before she reached for it, the door opened.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s this? Did you guys \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eseriously \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ewait around here thinking I’d show up eventually?” said Ryuuen, entering the room with a grin on his face.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki and Ibuki both froze up, almost on reflex. They hadn’t thought he’d actually show up anymore.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re late, Ryuuen-kun,” said Shiina.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, sure, but it looks like you’ve been havin’ fun.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. This is the first time I’ve ever gone to karaoke. I’ve been having a wonderful time,” said Shiina.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, guess I’ll get outta here. Have fun, Ibuki, knock yourself out.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen, still with a smirk plastered on his face, tried to leave and close the door behind him. But Ibuki stopped him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you leave me in this karaoke hell any longer, I’m gonna punch your lights out.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eKu ku\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. Oooh, I’m so scared.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen, having been pulled forcefully into the room by Ibuki, was then handed some sparkling water by Ishizaki. He sat down and began fiddling with his phone, saying nothing.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…So?” said Ibuki impatiently, pressuring him to speak.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what?” he replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You kept us waiting for this long and you’re not even going to say anything?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just came here to see if you were still waiting around for no reason, like a bunch of idiots.” He took a sip of his sparkling water. “No other reason.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shiina made me go along with this whole sideshow for hours. I am beyond pissed.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ain’t got nothin’ to do with me.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, it does!” she huffed, slamming her fist on the table forcefully, glaring at Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-hey, calm down, Ibuki. Look, snappin’ at Ryuuen-san’s not gonna do any good.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Christ, how long are you gonna be his stooge?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How long…? I… I’ve decided that I’m gonna keep followin’ Ryuuen-san.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, right. You completely and utterly \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehated\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e following him around at first, though.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-you didn’t have to go and say that!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile Ibuki and Ishizaki snapped at each other, Shiina went to pick a new song.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know that this moron over here totally fell for your smooth talk, and basically wasted his ability to nominate our opponent—which was a godsend, by the way—by selecting Class B?” sighed Ibuki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yep.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki seemed to shrink. If he’d gone along with the class’s consensus, then he would’ve chosen Class C. That was the only opponent that everyone felt like they had a chance of defeating. But Ishizaki had thrown a wrench into those plans, and now he didn’t have the slightest clue how they could win.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He’s stupidly devoted to you. Meaning you’re at least somewhat responsible, since you’re the one who put the ideas in his head.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eKu ku\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, guess there’s no arguing that. What I said was careless,” Ryuuen replied, still smiling. “Do you remember what I did to Class B at the start of the school year?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…If I remember right, you tried to split them up, to get them to stop being friends with each other?” said Shiina.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOn Ryuuen’s orders, Class D students had started fights with Class B students, trying to provoke the class into having a falling out. Ryuuen had started a number of such fires to verify the potential of each class, other examples being when he orchestrated the fight with Sudou, and the time he secretly made contact with Katsuragi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And what happened as a result?” replied Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There was no result. Class B quickly became extremely unified,” answered Shiina.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. They’re more united and better at cooperating than the other classes.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Isn’t that why we should avoid going up against them in a team competition like this?” said Ibuki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think so too. Goin’ up against Ichinose and her gang of admirers is gonna be a huge pain,” huffed Ishizaki. He and Ibuki shared the same opinion as the rest of Class D.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shiina, what’s your analysis? Of Class B.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm, let’s see… Well, as they’ve already said, Class B is quite strong. All their skills are above average. More than anything else, though, I’m rather envious of how close they are to one another, but… Well, that’s all I can really say about their class. They’re not particularly a threat or anything. They’re simply very close-knit.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve got a kind face, but your analysis is cold and brutal,” said Ibuki, after hearing Shiina’s opinion.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen, after hearing everyone else speak, offered his own evaluation of Class B. “If you ask me, Class B’s biggest flaw is Ichinose… No, it’s their \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003elack\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e of a leader.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-wait, hold up a second. I don’t get what you mean. Ichinose \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eis\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e their leader,” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Neither Ichinose nor Kanzaki are really natural-born leaders. They’re the kind of people who work to \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003esupport \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ea leader. Instead of putting someone like her in charge, they’d be way better off if they had someone like Suzune or Katsuragi. That’s exactly why even Class D, the bottom of the barrel, has a chance of beating them.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But that doesn’t change the fact that it’s a terrible match-up, does it? Class D is below average in practically every category. In that sense, you could say Class B is the one opponent we should absolutely never challenge,” said Shiina. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d argue that our chances are low no matter who we go against,” answered Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…D-do we really suck that hard?” said Ishizaki, dumbfounded. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNeither Ryuuen nor Shiina changed their stance at his reaction, though.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen picked up his now empty glass and looked at Ibuki and the others through it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“With a little bit of trickery, our chances can go from less than ten percent to closer to fifty. Depending on how it goes, maybe even higher than that,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe took out a folded sheet of paper and handed it to Shiina. When she unfolded it, she saw the names of ten events, with five of them marked as favorites. As Shiina read it, Ibuki and Ishizaki leaned over to take a peek from either side.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When the day comes, we’re gonna wreck ’em.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, these are all—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. They’re all events based on making your opponent submit through force.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKarate, judo, tae kwon do, kendo, wrestling, and so on. Ten physically grueling events. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hold on a sec. Yes, okay, there are definitely people like me in our class who can hold their own in a fight. Like, uh, me, Albert, Komiya, and Kondou. And then there’s Ibuki… but, uh, I don’t think the others in class can, though?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki was saying that even though they could carry through in one or two events with the students they had, he didn’t know if they’d be able to get through everything.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. Class B has no shortage of athletic kids, too. Sure, it’d be a different story if we could do all one-on-one events, but don’t the rules about required participants kind of throw a wrench in that idea?” asked Ibuki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if they left it all to the luck of the draw, there was no guarantee they’d get everything they wanted.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, so what?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re too hung up on that ‘required participants’ bull. It doesn’t matter.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile Ishizaki struggled to grasp Ryuuen’s intended meaning, Shiina understood right away.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. So, we should think of it that way, hm? It doesn’t really matter how many people are technically required for events—everything comes down to the rules. For example, if we use tournament knockout rules, we could get by with one person.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Exactly. Say, for example, we have a ten-man competition in judo. Even then, Albert alone would be enough to sweep the other team.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But… would the school authorize that? Tournament knockout rules, I mean?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. It’s probably impossible to put in knockout rules for stuff like written exams and or ball games or whatever. But in competitions like karate and judo, those rules are pretty par for the course. They couldn’t say we were going way off the norm. As long as we use a rule set like non-contact, to tone down the risk of injury, it shouldn’t be a problem. Even if the school rejects one or two of our events because they’re too dangerous, we’ll be fine as long as we get at least five,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, we can do this! With this plan, we can do it, Ryuuen-san!” shouted Ishizaki, a glimmer of his hope in his eyes as he finally understood what Ryuuen was getting at.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I suppose it’s certainly true that we might win every event that \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewe \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003esubmitted… But what happens if we’re not that lucky? What do we do if more Class B events get drawn?” said Ibuki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re not happy even with a fifty percent chance of winning?” asked Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…If I’m going to cooperate with you, I’m gonna have to demand that you make sure we win,” said Ibuki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eKu ku\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. Of course I’ve got a plan for that.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRight now, based on skill alone, Class D was in no position to win any events Class B came up with. Ryuuen was saying they needed another method to shorten the gap between them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…So, what are you telling us to do?” said Ibuki, who was now beginning to understand the situation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sometimes you gotta sin to win,” replied Ryuuen with a smile. “You’re gonna stalk those Class B idiots every day, day after day, until the exam. Just stick to ’em like glue, at first. Nothing else. Sooner or later, they’ll notice we’re following them around.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, what’s up with that? You think we’re going to stress them out just by doing that?” said Ibuki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They’ll probably laugh it off, saying what we’re doing is immature or whatever. As long as we don’t actually cause any harm, they’ll just choose to ignore it. That’s the kind of person Ichinose is. In the end, she won’t even notice what I’m after.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…What you’re after?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s just the plan for the first week. Once the ten events are announced, then we’ll really get things started. Any petty little thing will do. Take their seats, glare at ’em, tell ’em to shut up. Anything. Whatever. Have it at. Just don’t do more than what’s necessary. You guys know the perfect crew to handle this, right?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was saying that they should use people who could handle themselves in a fight, like Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So…are you telling me that I should throw punches, if it comes to it?” asked Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re just trying to mess with them, that’s all. Don’t do \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eanything\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e like threatening them or throwing punches at this point. We’ll save that as a trump card we can use right at the very end,” said Ryuuen, explaining that it was important they kept their actions vague and abstract.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf they went overboard and caused too much trouble, the school would have no choice but to get involved. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The most important part is information. Through our countless little scuffles with ’em, we’ll extract information on Class B, and get a head start on finding out what five events they wanna pick on the day of the exam. I’m sure a class like theirs will come to a consensus really early on. And then someone will talk about ’em over email or text or whatever. I’m sure you’ve been doing that too, right?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yes. We’ve also tried to find a good time to discuss which ten events would be good choices,” said Shiina.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There you have it. Even if their lips are sealed, their phones are defenseless. I’m sure they’d never imagine someone would take a look at their phones without permission. And as the exam day gets closer, their plans will get all the more set in stone. We might even find out stuff like who they wanna have participate in which event,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You make it sound so simple, but… Could things actually go that smoothly?” asked Ibuki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We ain’t gonna leave everything to Lady Luck. From here on out, it’ll be necessary for me to provide guidance on what you need to do. Anyway, the foundation for what we’re doing starts with you messing with them from tomorrow. And we’ll be doing things other than just stealing information. Like this, for example.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What is that…? Wait, is that a laxative?” asked Ibuki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. It’s a slow-acting one. The effects are delayed to start after forty-eight hours. If we can get some of them to ingest it, then we might be able to get one or two of ’em sick on the day of the test.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-hey. That’s against the rules, though. What if we get found out?!” shouted Ibuki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what?” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You really think I’m the sort of guy who cares about that?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, you… Yes, I guess not. You’re the kind of guy who would do anything to win,” said Ibuki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If there’s a problem, put all the blame on me when the time comes. Easy.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRegardless of whatever punishment the school might impose on him as an individual, Ryuuen didn’t seem to care at all. Even if the class did suffer as a result…well, they’d also suffer a crushing defeat if they did things the normal way.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you came up with this plan because you’ve already made peace with getting expelled…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Earlier, you said you wanted to hold onto resorting to fights as a trump card. Does that mean you’re thinking of using force, in the worst-case scenario?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. Kids get in fights over the most trivial bullshit every day. What if the people they’re planning to use in their five chosen events just so happen to get taken out alongside the most useless lumps in our class? We’d probably be at an advantage on test day, right?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that Ryuuen had set his mind on this plan, he was going to show no mercy. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll be the commander on test day. It’s important I make Ichinose lose her cool.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You really are…savage.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll take that as a compliment. Should we show ’em how Class D fights their battles?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-… Yes!” said Shiina.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What the hell was up with that ‘yes’?!” replied Ibuki, letting out an exasperated sigh in response to how ridiculous this had gotten.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd yet, she found she didn’t exactly \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehate\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e it. And she couldn’t help but hate herself for that.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But… Why are you doing all of this, Ryuuen-san? It’s not just because you feel sorry for us or anything, is it?” asked Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm, who knows?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen leaned back on the sofa and closed his eyes. He didn’t really have any attachment to this school. He wasn’t lying about that—at least not at first. But now that he’d gotten this far, something inside of him had started to change. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAyanokouji Kiyotaka. Ever since he lost to him, the thought of leaving this school left him feeling dissatisfied. By becoming the commander and putting himself into this situation from which there was no return, he hoped to confirm whether this frustration was really because he wanted a rematch with Ayanokouji. If he really had no lingering attachments, then he could just select people at random and lose things on purpose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut…if those feelings really existed within him—that desire for a rematch—then he would make sure he survived. Ryuuen was curious to find out for sure.\u003c/span\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 9: Class B VS. Class D\",\"volumeId\":\"v11\",\"chapterIndex\":15,\"prevChapter\":{\"volumeId\":\"v11\",\"chapter\":14,\"title\":\"Chapter 8: Ayanokouji VS. Sakayanagi\"},\"nextChapter\":{\"volumeId\":\"v11\",\"chapter\":16,\"title\":\"Chapter 10: The Line Between Winner and Loser\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Title Page\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Sakayanagi Arisu’s Soliloquy\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: The Teachers’ Battle\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: The Final Battle of The First Year\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: Opponents\",\"href\"
