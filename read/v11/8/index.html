[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T67f0,"])</script><script>self.__next_f.push([1,"\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 2:\u003cbr/\u003eThe Teachers’ Battle\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT WAS A CERTAIN DAY\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e in February, shortly before the in-class voting exam was officially decided upon, and the teachers at the Advanced Nurturing High School were keeping busy. They were preparing for their students to advance to the next grade level, to graduate, to go on to university. Additionally, there was a final special exam for all grade levels. It was a busy time, made all the more complex by a variety of factors.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNone of the teachers had the free time or wiggle room to do anything else. They were swamped, day in and day out. However, the teachers of the first-year students had a more complicated situation to deal with than those of the other grade levels.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And that, ladies and gentlemen, concludes what I have to say regarding the content of the final special exam for first-year students, as well as the new system that we’ll be introducing.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA man had just finished explaining the final special exam of the year to the entire faculty. What he’d outlined was just the same as it always had been for the second- and third-years, but things were different for just first-years. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If any instructors do have any questions, please, speak up,” he added, looking around at the teachers who were listening to his every word. The atmosphere in the room was tense and stiff.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe silence continued for several seconds.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I may, Acting Director Tsukishiro?” Mashima, first-year Class A’s instructor, raised his hand and broke through the stillness and silence that pervaded the faculty lounge.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira and Hoshinomiya both turned to look at Mashima at the same time. The man who’d just been referred to as Acting Director Tsukishiro had noticed the first-year homeroom instructors already had numerous doubts. Or rather, he knew there would be nothing to discuss if they had no doubts. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was assessing their value, as people. As members of society, adults, teachers working solely for a paycheck.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What is it, Mashima-sensei, homeroom instructor for first-year Class A?” Tsukishiro, anticipating questions, spoke with a broad and gentle smile.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“While the criteria for the special exams for the second- and third-year students remain the same as in previous years, those of the exam for the first-year students greatly exceeds the annual average. This in-class voting exam…carries a high risk of expulsion.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMashima addressed Tsukishiro as an instructor in charge of first-year students, and for the sake of the children of the future, undaunted by the man’s title of acting director. He continued speaking, even more sternly than before.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please pardon my rudeness, but you’ve only just been appointed to your position, Acting Director Tsukishiro. While I’m sure you’ve made your decision based on what you’ve seen so far, I think it is unwise to do something that would forcibly expel students simply because no one has been expelled from the first-year classes yet.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTsukishiro seemed somewhat pleased by Mashima’s question…or rather, by his protest. He flashed his white teeth.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Carries a strong risk of expulsion, you say. Haven’t the students already been in danger of expulsion in every special exam they’ve had up until this point? Isn’t there a rule at this institution that even a single failing grade results in expulsion? Surely no normal high school would have such a strict system.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I am pointing out how unreasonable this is. Though, yes, it is certainly true that students who fail to achieve a certain quality of results will be expelled. The system is not meant to be an easy one. In fact, we’ve had a number of students be expelled every year.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eVarious special exams were held every year at this school, all within the scope of certain set criteria. And, while working within those limits, the current first-years had made it through without anyone getting expelled. It\u0026#160;was unclear whether this was simply due to a difference in ability from the other grade levels, but there had to be a reason for why they’d managed to come this far without anyone being expelled.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMashima thought that it was important to make the most of this and carry it into the next year. However, Tsukishiro thought differently.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If it’s simply a matter of having some students be expelled, then what difference does it make to do it this way?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. This is very clearly different from what has been done in the past. I cannot support a system where students are forcibly expelled,” said Mashima.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe other teachers remained silent. Only Mashima persisted, and quite tenaciously so.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides, abruptly introducing a new system just before the final special exam of the school year? Never in this school’s history has such a thing been done. The reasons such a decision was made have not been explained to us.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe teachers knew all along that Mashima’s resistance was futile. There was no reversing this decision. There was no way to go back.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would seem your way of thinking is a little…shall we say ‘by the book,’ Mashima-sensei? Have you considered the possibility that the way things have been done so far wasn’t \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecorrect\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e? Rather, that it was \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewrong\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e?” asked Tsukishiro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe and Mashima continued to go back and forth in the faculty lounge. However, Mashima’s disadvantageous position was as clear as day. This wasn’t a situation a mere teacher could control.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Young children can really absorb more than adults think that they can. With that point in mind, I have decided not to administer the new test to the second- and third-years, but only to the first-years, who have yet to be fully immersed in this school’s methods. If the initiative is successful, it will make it easier to try it with next year’s first-year students.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The current first-year students have made it this far without any expulsions. Do you really want to put an end to that in this manner?” asked Mashima.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Current results mean nothing. This is about being future-oriented. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFuture\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e-oriented,” countered Tsukishiro, before continuing with his speech. “The government is expecting a great many things from this school—a newly established institution that employs a number of experimental ventures. The school’s short history is precisely why I think that we should try a variety of methods.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s all well and good to be future-oriented. However, this could also be interpreted as us using the current first-years as guinea pigs. As a homeroom instructor, I find this unacceptable.” Mashima continued to directly challenge Tsukishiro. He wanted to do \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003esomething\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to make the special exam change course. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut it was almost certainly impossible to undo Tsukishiro’s decision. The in-class voting exam was already a done deal.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Mashima-sensei, that’s enough.” Chabashira, fully aware the die was cast, stopped Mashima from saying any more. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMashima swallowed the words that were about to leave his mouth. However, none other than Tsukishiro himself urged him to speak again.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please, I don’t mind. If there’s something you wish to say, please, get it off your chest. After all, I well understand you teachers’ feelings of apprehension about this. Wouldn’t you agree, Mashima-sensei?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you saying that there is a possibility that you will reconsider?” said Mashima, asking if the special exam would be re-evaluated.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed as though Tsukishiro was dangling a lifeline for them to seize. But it wasn’t true. Unlike Director Sakayanagi, Acting Director Tsukishiro had not the slightest intention of listening to what anyone had to say.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Reconsider, hm? Well, that would be difficult. While my position, as the ‘acting’ part of my title suggests, is temporary, I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eam\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e still the director. But though the director bears the responsibility of steering the school and establishing its guiding principles, he is simultaneously a puppet. I am nothing more than an employee of a higher, government-backed corporate body,” replied Tsukishiro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd with that, Mashima’s resistance was rendered meaningless. All that mattered was the future of the Advanced Nurturing High School. The teachers’ feelings were secondary.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So you don’t mind if students are expelled in droves as a result of these strict rules?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Those who do not conform will be eliminated. That’s just how society—no, that’s just how the natural order works. Besides, we’ve already compromised by allowing the introduction of ‘Protection Points,’ have we not? I’m afraid you’re just going to have to be satisfied with\u0026#160;this.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe strained atmosphere gradually began to fade and become more relaxed. The prolonged morning meeting was nearing its end.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“More importantly, though, the current director, Sakayanagi-shi, is currently under house arrest due to allegations of fraud. If these allegations are found to be based in truth, we cannot inherit educational policies built by such a person, can we? Of course, I sincerely hope they will be cleared up as soon as possible, and that he will return,” said Tsukishiro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe brought his hands together. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eClap!\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e With that, Tsukishiro looked around at all of the instructors.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it would seem time is up. Why don’t we call things here? Oh, that reminds me. We’ve been looking into whether we can hold a cultural festival at this school next year. I’m sure we will be looking to you, the teachers, for your opinions on the matter once again, so please share your thoughts when the time comes.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Cultural festival? Anything that would open this school up to the general public should generally be dismissed on principle.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis time, even the second-year and third-year homeroom instructors started to voice their concerns.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That kind of old-fashioned thinking is quite problematic, too. I believe that this school must institute as many changes as are necessary for it to become more recognized by the nation. We’ll need to be very selective about who we invite, of course, but there’s no need to worry about that. We won’t be opening the school up to the general public, but rather, to a strictly controlled group of people who are well-acquainted with this institution, such as politicians. This way, we avoid any major leaks of information to the outside world. At any rate, I would like for you to consider this matter in a positive frame of mind.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eActing Director Tsukishiro noted that was all there was to say on the matter and brought the meeting to a close. The teachers’ battle had ended. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was nothing they could have done.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e2.1\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003e“M\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eASHIMA-SENSEI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Hoshinomiya-sensei. Do you have a minute?” asked Chabashira, calling to her colleagues in the faculty lounge, just after Tsukishiro left but before classes began.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe three of them were former rivals who’d both worked and studied hard at this school, mutually pushing each other to improve. They were also close friends. Since they’d known each other for a long time, Chabashira’s colleagues gathered their papers and followed her without asking questions. They exited into the hallway that led to the classrooms where their students waited for them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is so depressing. I can’t believe we have to tell our students that we’re having an exam where someone will definitely be expelled,” said Hoshinomiya, the first \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eto speak up. She looked down at her attendance records, letting out a heavy sigh. “I wonder who we’re going to lose…” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe didn’t sound at all like she was looking forward to finding out, but rather like she was just trying to face the reality of the situation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s not like it’s been decided someone will be leaving, right? While there aren’t many options available, there \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eis\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e something they can do.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You mean spending twenty million points to override the expulsion? Isn’t that the only way?” replied Hoshinomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite saying that, Hoshinomiya was already well aware of the truth. Right now, none of the classes had that many points saved up.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If there’s any saving grace here, it’s not having to pay up the three hundred class points. I suppose there’s no precedent for a forced expulsion like this. In that sense, it’s only natural.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNormally, twenty million Private Points and three hundred class points were required to override a student’s expulsion. This time, however, students were exempt from the Class Point requirement. Still, neither the teachers nor the students could just accept the forced expulsion as things were.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t help but feel dissatisfied with Acting Director Tsukishiro’s way of doing things,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s understandable that you’d feel that way, Sae-chan. He just came in out of nowhere and started doing whatever absurd thing he pleased,” said Hoshinomiya, snuggling up close to Chabashira, as if she was about to hug her. Chabashira pushed her away, annoyed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if we complain, though, it won’t change anything. If we say too much, it’s likely \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewe’ll\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e get axed,” said Mashima.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you for real, Mashima-kun? You were really going at it earlier with the acting director, weren’t you? I was feeling, like, super extra nervous. But despite that, now you’re all like, oh, we can’t say too much?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re right, Chie. The acting director probably doesn’t care if teachers get fired. He knows there are plenty of replacements out there. If anything, he might even see it as convenient.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe he’s planning to get rid of teachers who oppose him, like Mashima-kun, and replace them with ones more suited to his cause.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira and Hoshinomiya thought Tsukishiro’s speech back in the faculty lounge might have been part of a ploy to root out rebellious teachers. Mashima didn’t speak up to contradict that line of thinking.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You be careful too, Sae-chan. Now that you’ve gotten a big win by moving on up to Class C, don’t do anything reckless, okay?” said Hoshinomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You seem awfully relaxed, even though my class is moving on up.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No way! Sae-chan, wait. You’re not, like, under the illusion that you can move up to Class A, are you?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHoshinomiya’s big eyes peered at Chabashira, who averted her gaze. Although Hoshinomiya tended to say whatever came into her head, many of her actions were carefully calculated. Chabashira, having known her for a long time, understood that quite well.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…No. It’s not like I’m \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e foolish,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, that’s true. Whew, if you did say that you were aiming for Class A though…That would’ve just totally blown my mind!” said Hoshinomiya, waving her hands in front of her, showing how shocked she was.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though it was a silly, innocent conversation between girlfriends, Mashima couldn’t bring himself to just stand there and watch. It was like two apex predators facing off on the savannah. It was an eat-or-be-eaten battle.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you two still fighting over what happened back then? Even though years have pass—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Mashima-kun. It doesn’t matter how much time has passed.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. It has nothing to do with it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe’d tried to step in and mediate, but they forced him back down with a glare. Mashima had boldly stood up to Tsukishiro, but there were some opponents he couldn’t hope to defeat.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I see. Well, while it may not be my place to say anything here, don’t bring your personal feelings into this, okay?” said Mashima.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We won’t. Right, Chie?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, of course we won’t. Right, Sae-chan?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though they were trying to probe each other, to sense what the other was feeling, on the surface they both pretended nothing was wrong.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, what I wanted to say was that you should refrain from acting carelessly,” said Chabashira, quickly wrapping up their conversation before heading off toward Class C, clearly in a bad mood now.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You really aren’t going to bring personal feelings into this, are you?” asked Mashima as the two of them watched her leave.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t lump me in with her, Mashima-kun. I have no lingering regrets at all, personally. But honestly, that girl hasn’t changed, like, at all since then. She’s just the same as she was when we were students. That’s why she’s still clinging to that good-for-nothing first love of hers, holding it in her heart,” said Hoshinomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…You’re kind of making a scary face.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Ugh, no way, really? I am?” Hoshinomiya quickly pulled out a folding mirror and donned a smile. “All right! I look super-duper cute today, too. Don’t you think so?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t care.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Meanie. Well, it’s all right, though.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter she’d put her mirror away, Mashima gave Hoshinomiya a piece of advice.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just don’t let them pull the rug out from under you. This year’s Class D… no, Class C, I suppose, is different from years past.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile there was still a gap in class points between the classes, not even the teachers could predict how future special exams would go.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You might be right about that. But don’t worry. I’ve got Ichinose-san on my side. And besides…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If they do come up, then I’ll just crush them directly.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A teacher shouldn’t be meddling in a competition between students though, should she?” asked Mashima.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, no, I’d never do that. I’m just saying that I won’t show any mercy to Sae-chan,” said Hoshinomiya, adding that she wouldn’t go so far as to pick a fight with other teachers, either.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You seem pretty serious.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s because I can’t let myself lose against Sae-chan.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSuch had been the nature of their relationship, ever since their days as students. As friends and rivals both.\u003c/span\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 2: The Teachers’ Battle\",\"volumeId\":\"v11\",\"chapterIndex\":8,\"prevChapter\":{\"volumeId\":\"v11\",\"chapter\":7,\"title\":\"Chapter 1 - Prologue : Sakayanagi Arisu’s Soliloquy\"},\"nextChapter\":{\"volumeId\":\"v11\",\"chapter\":9,\"title\":\"Chapter 3: The Final Battle of The First Year\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Title Page\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Sakayanagi Arisu’s Soliloquy\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: The Teachers’ Battle\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: The Final Battle of The First Year\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: Opponents\",\"href\":\"Text/section-0008.html#auto_bookmark_toc_top\",\"index\":10},{\"label\":\"Chapter 5: What the Class is Lacking\",\"href\":\"Text/section-0009.html#auto_bookmark_toc_top\",\"index\":11},{\"label\":\"Chapter 6: Good and Evil\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_top\",\"index\":12},{\"label\":\"Chapter 7: A Man’s Tears\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_top\",\"index\":13},{\"label\":\"Chapter 8: Ayanokouji VS. Sakayanagi\",\"href\":\"Text/section-0012.html#auto_bookmark_toc_top\",\"index\":14},{\"label\":\"Chapter 9: Class B VS. Class D\",\"href\":\"Text/section-0013.html#auto_bookmark_toc_top\",\"index\":15},{\"label\":\"Chapter 10: The Line Between Winner and Loser\",\"href\":\"Text/section-0014.html#auto_bookmark_toc_top\",\"index\":16},{\"label\":\"Epilogue: Postscript\",\"href\":\"Text/section-0015.html#auto_bookmark_toc_top\",\"index\":17}],\"volumeTitle\":\"Light Novel Volume 11\",\"detailsLink\":\"/select/year-1/v11\",\"returnLink\":\"/select\",\"currentSpineIndex\":8,\"nextVolumeLink\":\"/select/year-1/v11.5\",\"nextVolumeTitle\":\"Light Novel Volume 11.5\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://classroom-of-the-elite-reader.vercel.app\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"COTE Reader\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"en_US\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:image:width\",\"content\":\"1200\"}],[
