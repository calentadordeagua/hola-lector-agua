],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:Te58,"])</script><script>self.__next_f.push([1,"\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003ePostscript\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT’S BEEN FOUR MONTHS.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e That’s almost customary now. Four months. Even in the Reiwa Era, nothing has changed. I’m still your Kinugasa. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eVolume 11 is done, and now, the first-year story arc has reached its conclusion. The students have safely made it to the closing ceremony, but we have a spring vacation story to tell before we get to the second-year. I’m planning for that book to be a story focused on the year in review, essentially, covering how the students have changed over the past year and how they’ll continue to change. Also… there might be some romantic developments. But \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewho\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e?!\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt any rate, now that I’ve finished the story arc for the first year, I just want to say, straight out…there ain’t enough pages! I originally planned for Volumes 10 and 11 to be combined into one book, but that just ended up being totally impossible, right? Once I started writing, the page count just kept increasing and increasing. There were so many things that I couldn’t even fit in two volumes!\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I start a new book, I’m always thinking to myself, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eUgh, maaaan, how in the heck do I get this started? And how do I fill three hundred pages?!\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e But, before I even know it, it’s like \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eThe heck?! There’s only a couple pages left?! \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI feel like this keeps happening more and more… Which is why I’m thinking I’ll carry over some of the extra things I wrote and put them in Volume 11.5. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnyhow, let’s have a little chat. On the rare occasions that I do meet someone who works in the industry, they usually tell me something like, “I have no idea what you’re usually up to! Please get on social media!” Years ago, I pretty much had no choice but to do some blogging and such related to my work. But I guess, well…it’s not that I\u0026#160;don’t \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003elike\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e it, it’s like I’m just really bad at it. So I thought that just giving updates in the postscripts of my books might be perfect for me. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs for what I usually do, well—I work, and I play golf once in a while. But I don’t actually go to the golf course or anything (I’m bad at golf, it’s not cheap, I have no endurance). I just hit balls at the driving range for about an hour or so and then I’m done. But that’s enough to leave me satisfied. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if I did use social media, I’m sure I’d just be posting super dull stuff like that. So I guess I’ll end my postscripts in a super boring way, too! See you again next time!\u003c/span\u003e\u003c/p\u003e\n\n\u003cdiv class=\"p.P_Centre\"\u003e\n\u003cp/\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Epilogue: Postscript\",\"volumeId\":\"v11\",\"chapterIndex\":17,\"prevChapter\":{\"volumeId\":\"v11\",\"chapter\":16,\"title\":\"Chapter 10: The Line Between Winner and Loser\"},\"nextChapter\":\"$undefined\",\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Title Page\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0004.html#auto_bo
