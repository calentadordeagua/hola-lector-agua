],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T1bf61,"])</script><script>self.__next_f.push([1,"\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 5:\u003cbr/\u003eWhat the Class is Lacking\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eW\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eE PLANNED\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to have another discussion session the day after the match-ups were decided. It would be held after class, just like yesterday, leaving us free during lunch. I gathered with the Ayanokouji Group in the classroom, as usual, and we headed toward the cafeteria.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How did yesterday’s discussion go?” I decided to ask my friends about what happened yesterday without hesitation. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMeeting up with the other commanders, deciding the class match-ups, and hearing the commander’s role explained in full had taken about an hour. By the time I returned to class, the students were already on their way back to the dorms.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You didn’t hear from Horikita-san…? Well, I suppose that’s understandable,” said Airi vaguely, her choice of words hard to follow. After a brief moment, she spoke up once more. “Well, you know how there’s an event manual, right? We all wound up really struggling to comprehend the rules…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We didn’t even have a real discussion. It was a complete waste of time,” said Keisei, letting out an exasperated sigh.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, reading the rules over lunch break hadn’t been long enough for everyone to really grasp them. It sounded like the discussion the other day had ended with people finally understanding the rules, and nothing more. I suppose you could say that was typical of Class C.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides, the problem wasn’t just with our class,” added Keisei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean by that, Yukimuu?” asked Haruka.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s a limited number of places on campus where a large crowd of students can gather, right?” said Keisei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah, I guess it’s pretty much impossible for forty people to meet up in a karaoke room or on the benches at the mall or something. What about it?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was the first person to leave the classroom after our discussion had ended yesterday, and… Well, there were some students from Class A out there. Standing out in the hallway outside Class C.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka and Airi exchanged puzzled looks, as if saying, “What’s the big deal with that?” Akito didn’t seem to understand at first, either, but he picked up on what Keisei was saying after giving it a little thought.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…So, you’re saying they were spying on us or something?” asked Akito.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Exactly. The decisions we make as a class for this exam are going to be spoken out loud \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ein\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e class, right? Even if they just happen to listen in on our discussions, they’ll pick up a certain amount of information,” said Keisei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eInformation such as what events we were going to choose or who was good at what, for instance. There was no doubt that getting your hands on such information would prove advantageous, even if you only got a little of it. Which meant that the battle had already begun.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you look at the situation from that perspective, that means Class C is already lagging.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Scary! Sakayanagi-san has already made her move!” Haruka rubbed her arms, shaking nervously. But he bounced back quickly and suggested we pay Class A back in kind. “Well then, wouldn’t it be a good idea for us to go get information on Class A? You know, like that one dude said, an eye for an eye and a tooth for a tooth or whatever.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Keisei wasn’t about to agree to that.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If it were that easy, then we wouldn’t be worrying about it in the first place,” said Keisei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m probably not the only one who thinks so, either. I’m sure Horikita and some of the others know it’d be pointless for us to try doing that, too. Do you really think that all forty members of Class A are going to gather and discuss this together?” asked Keisei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass C lacked unity, so the first thing we needed to do was get everyone in one place. This was not at all the case for Class A, where Sakayanagi and a number of other top students decided the entire class’s course of action. Who would be the commander? Who would come up with events? Who would gather information? Class A had already decided who would fill these roles the moment the exam began. Even if they did hold a discussion in the classroom, like Class C had done, they’d probably have two or three people stand watch outside to keep anyone from conducting reconnaissance. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But shouldn’t we at least \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003etry\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to probe for info? I mean, they might let their guard down. Maybe they’ll end up having an unplanned gathering in their classroom and discuss something openly?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If they did actually do that, I’d be terrified. I would doubt the authenticity of any information coming from a meeting like that,” said Keisei. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf the information we picked up from listening in on such a meeting turned out to be fake, we’d just be wasting our time. Keisei was right on the money. Information would be concealed, and we should be doubtful of any information that wasn’t.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose engaging in this kind of information warfare is necessary. The crucial part is how we do it…” he added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can we… even win?” squeaked an anxious Airi, probably already feeling like the walls were closing in around us.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As of this moment, it’d probably be a good idea for us to assume they’re one or two steps ahead.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, since Class C hadn’t decided on anything yet, we weren’t exactly leading the way.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Still, I never imagined that we’d be going up against Class A,” said Haruka.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry. It’s my fault for losing the drawing,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn reality, I would’ve chosen Class A myself even if I’d won the lottery, but I figured I should at least appear apologetic. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, no, I didn’t mean it like that! Sorry, sorry! I\u0026#160;wasn’t blaming you at all or anything, Kiyopon!” said Haruka. She must have taken my apology more seriously than I had imagined, because she sounded really flustered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, that’s pretty harsh, Haruka. Expecting him to draw the winner when there was only a one-in-four chance,” said Akito, causing Haruka to shrink back even more.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I already said that’s not what I meant though, jeez…” she huffed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe got lost in thought for a few moments before speaking up again, probably wanting to change the topic. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I hope they go a little easy on us. I mean, they’re only going up against Class C, after all. You think so too, right, Miyachi?” said Haruka.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Go easy on us…? Do you honestly think Sakayanagi is the type?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…No, not at all. She didn’t just totally crush Yamauchi-kun, she tortured everyone in Class C,” said Haruka, looking up at the ceiling, completely disheartened. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have to say, there’s just no end to your troubles, huh, Kiyotaka? I mean, with being the commander and all,” said Keisei, patting me on the shoulder to show appreciation for everything I was going through.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose I do have a Protection Point, though. I didn’t really have any choice but to step up and be the commander. I don’t want us to lose, but I am pretty grateful we don’t have to worry about anyone getting expelled,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was all I could say to my friends right now. Whatever the reason, the fact remained that I was the one selfishly leading us into a confrontation with Class A.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re going up against Class A. Even if we lose, it’s not like anyone can really blame you for it, Kiyotaka.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And Sakayanagi-san is their commander.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLooking at our odds, ninety-nine out of a hundred people would say Sakayanagi would be the one to win this. Even so, it wasn’t like losing would change my standing within the class. In fact, even if I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e win, I’d only be ensuring credit went to Horikita’s leadership and her meticulous strategizing.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well… winning is probably going to be difficult,” said Keisei, crossing his arms and letting out a defeated sigh.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAkito said something unexpected, then. “It’s not like we’re guaranteed to lose just because we’re up against Class A.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You…think so? Well, it’s not like I really want us to lose or anything, but…” said Haruka.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This isn’t some kind of secret conspiracy. There’s gotta be a way to wrestle victory from Class A, right?” said Akito, pausing briefly before continuing to explain. “When the exam was announced, I thought it was ridiculous to fight against the higher-level classes too. But something that blabbermouth Ike said made me think we might have a chance to win this thing.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Something Ike said? Wait, are you talking about when he brought up Rock Paper Scissors?” replied Haruka, thinking back to what had happened in class.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAkito nodded in response.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At first, I thought it was a stupid idea for an event. But then I realized that if we go with events that depend on luck, we always have a fifty percent chance of winning, no matter who we’re up against. It could be Old Maid or Daifugō, or whatever. I started to think that going with five events on the day of the exam where luck plays a big factor wouldn’t be such a bad idea,” said Akito.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter hearing Akito’s explanation, Haruka’s eyes lit up. “And with a plan like that, we could fight on even footing with anyone, even Class B or Class A!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right! I don’t think that’s a bad idea at all!” said Airi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well…it’s not that simple, actually.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile Airi, Haruka, and Akito rejoiced at the idea, Keisei stepped back and looked at it calmly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I won’t know the precise figures until I run some calculations, but with a strategy like that, our chances of winning would probably only be somewhere between five or ten percent,” he reasoned.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? That’s it? I mean, I’m not saying we’d have exactly a fifty percent chance of winning, but shouldn’t it be at least twenty or thirty percent? I mean, would getting five events chosen and winning four of them really be all that hard?” asked Haruka.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’d need to be \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003equite\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e lucky for things to work out that way,” replied Keisei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe’d have to gamble on the possibility that five of the seven events we’d be competing in would be the ones proposed by Class C, not to mention being lucky enough to win four or more of those events. If we assumed we had a fifty percent chance of winning each individual event, and used that assumption as a baseline to calculate the probability of winning overall, then…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI calculated the probability in my head. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe chances that the seven final events would include a full five events chosen by our class was 8.33 percent. And if our chances of winning each event was fifty percent, then our chances of winning four or more events overall would be 18.75 percent. If we wanted to fulfill both those conditions, then the end result was that we’d have a 1.56 percent chance of pulling everything off. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, it was actually a far cry from five percent. It was hard to call relying solely on luck a good plan. That being said, this was just me examining simple hypotheticals, calculating our chances of winning four or more games based solely on luck. In reality, those chances would fluctuate due to a variety of contributing factors. Still, there was no doubt you could hardly call it a strategy. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that in mind, we should choose events in fields that we excelled, even if that meant taking on the risk of losing. The fewer events where we had to rely on a fifty-fifty chance solely based on luck, the better. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, it’s a no-go, huh? I guess I just thought that \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003emaybe\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e it could work is all.” Akito scratched his cheek, having realized how overly optimistic his idea was.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSuddenly, I noticed Airi’s eyes on me. She wore a look of concern, and when I made eye contact with her, she looked even more worried.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kiyotaka-kun… Um, are you all right? I mean, being commander, and—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed the difficulty of us winning against Class A was weighing on her mind, just as it was becoming clearer for everyone to see.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, Kiyopon. You really don’t need to force yourself into this just because you have a Protection Point,” said Haruka, cutting in as if she was finishing Airi’s thought for her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Haruka’s right. At the very least, we never really imagined that you had any connection with Sakayanagi or anything. Right?” said Akito.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone nodded in response to that. Having people trust you certainly didn’t feel bad at all.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess it does seem like there are some people in class that suspect you, but I think most everyone’s pretty convinced, thanks to Horikita-san’s explanation. Come to think of it—I thought Protection Points were amazing at first, but now it kind of feels like they’re annoying to have, huh?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was pretty jealous of everyone who got a Protection Point, before. But looking at what’s happening with Kiyotaka-kun now, if I had one, I feel like I’d probably just end up using it right away if I was in his situation.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe truth was that only one person was safe. Everyone else was out there in the wilds. It wouldn’t be easy to continue maintaining your own safety without getting invested. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn contrast to the timid Airi, Keisei crossed his arms and took a different stance. “If I had a Protection Point, I wouldn’t use it at all, no matter what anyone else said.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if that resulted in animosity, jealousy, or resentment from your classmates, though?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, no, you’re not getting it. I wouldn’t allow something like that to bother me, especially for something that I won on my own merits. In fact, Kiyotaka should keep his at all costs, in order to protect himself,” said Keisei, crossing his arms defiantly, almost as if he were the one being sacrificed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAkito, who’d been silent so far, looked at me. “Fact is, fighting Class A is gonna be really tough, so we should probably be grateful Kiyotaka took on the job. If it had been someone else, we might have seen expulsion number two, right? Or are you saying you could’ve volunteered to be the commander, Keisei?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well… No, I suppose you’ve got a point.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t like I didn’t understand Keisei’s frustrations. He was probably trying to point out that putting a more capable student in the position of commander would give us a better chance at winning. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose it’s true we have to deal with the unpleasantness of potential expulsion in this exam, too. But if that wasn’t an issue, I wonder who would have been the best candidate for commander? Maybe Horikita-san, after all?” said Airi, cocking her head to the side. She seemed to be thinking of several candidates.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, that sounds like the right pick to me. Or maybe someone like Hirata-kun or Kushida-san? Yukimuu would have been a pretty good pick, too,” said Haruka, rattling off the names of students who’d probably produce solid results as commander.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hirata, huh… I have to wonder what his deal is,” said Akito. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe tried to change the subject, maybe feeling like continuing to talk about going up against Class A would just make us depressed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Keisei, how do you see Class D versus Class B playing out?” he asked, wondering about how things were for the other teams, even though we were all taking the same special exam.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In all likelihood, Class B is going to take the win. When it comes to their teamwork, they’re not remotely even. And Class B’s overall abilities are just overwhelmingly superior, too,” said Keisei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, that’s true. Plus, their commander isn’t Ryuuen-kun, after all. It’s Kaneda-kun.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey probably thought there was no need to be afraid of Class D without Ryuuen…and they were probably right to think that. But Ishizaki and the rest of the Class D students had wanted to fight Class B all along. While it was a surprising decision, it made sense. If I were in the position of leading Class D, I would have picked Class B as my opponent.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass A was led by Sakayanagi, and boasted some tough opponents who never let their guard down, like Katsuragi and Hashimoto. Plus, they had the most academic ability of any class in our grade level. And far as Class C was concerned, well, I was sure no one in Class D wanted to go up against me. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, they’d probably expect me to not to demonstrate my abilities out in the open. But when you got down to it, Class D’s area of superiority wasn’t academics but athleticism. And if they wanted to make the most of that, they had to pick Class B. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was willing to bet, however, that they hadn’t made that decision under the impression they’d definitely win, or even that they’d be on equal footing with Class B. At\u0026#160;best, this was a decision made to reduce their chances of losing. Whether or not Class D could actually win this would depend on the choices they made moving forward, and on luck. It was still nothing more than a small step in the right direction for them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, check it out,” muttered Haruka quietly, directing our attention to the cafeteria entrance, where Hirata was just walking in.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHis gait was slow, heavy, and wobbly. He moved like a zombie, or a ghost. His eyes looked empty, in stark contrast to his usual bright, cheery self.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He’s like…really sick, or something,” Haruka muttered quietly to herself, adding, “There’s no other way to describe it.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata did more for the class than anyone else. He always acted with the class’s best interests at heart. If we’d made it through our first year at this school without a single person falling by the wayside, it was undoubtedly due to Hirata’s efforts.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hirata is basically useless to us in this special exam. Going up against Class A is already tough. Now we have to shoulder a significant handicap from the get-go,” said Keisei. His words sounded cold.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s…nothing we can really do, is there?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata had already been frequently approached by other students. It seemed no one had managed to get through to him so far, because there’d been no change in him at all. If anything, it seemed they’d just deepened the wound by trying to broach the subject with him. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo one in the Ayanokouji Group was particularly close to Hirata. We had concluded, obviously, that our words couldn’t reach him. That was precisely why none of us reacted strongly to Keisei implying this wasn’t our problem to solve.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e5.1\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eW\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHEN CLASSES ENDED\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e for the day, a real discussion was finally poised to begin. Hirata immediately stood up and got ready to leave, however. He was the only one who did so.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hirata-kun!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-Hirata-kun!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSeveral of the girls in class all shouted at Hirata in unison, Mii-chan among them. However, Hirata didn’t stop moving. From the outside, it looked like he didn’t care what happened to the class anymore. But it also seemed like he didn’t want to bother the class, so he was just doing the bare minimum: coming to school, attending class, and then going back to the dorms right away. He was probably going to stay locked in that cycle.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, Hirata-kun!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think you’re the ones who should wait,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMii-chan and the others were about to chase after Hirata, but her words stopped them in their tracks.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re about to hold a discussion. Or do you plan to make even more people be absent?” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-But…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s nothing we can do for him right now. Go on, get back to your seats.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita, having squashed their desire to run after Hirata, urged everyone to take their seats. Right now, our top priority was to put our heads together and focus on solidifying our plans as a class. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And yet Kouenji of all people is still here, huh,” said Sudou, his voice tinged with surprise, considering how unexpected it was for Kouenji to participate.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFu fu fu\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. I am a member of this class, am I not? It is only natural that I participate,” replied Kouenji plainly, as if what he was saying was obvious. “However, I would like for us to settle everything today, making this our first and only discussion. I am quite busy, you see.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s a difficult ask. It’s not like we can make all the decisions necessary for this special exam in a single day. Even if we decide on all of our events today, we’ll still need further preparations so make sure we win those events,” Horikita, standing at the podium, shot his request down.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji didn’t object. Instead, he wore a wide grin. It seemed that at least for the time being, he was willing to listen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, I will only be participating in this particular discussion,” he replied, not budging an inch.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, no matter what strategy the class came up with, the thought of working with everyone never even crossed his mind. Sudou silently stood up, but quickly sat back down after Horikita shot him a look. If people continued to fight here, our discussion would never be able to move forward.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, I’ll just keep doing what I can to get you to participate in the next meeting,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji listened to Horikita’s comeback with a smile, and then crossed his arms and legs. That was his way of signaling to her, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eplease go ahead and start the discussion\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heya, um, Horikita. I’ve got some stuff I wanna ask. Some simple questions about the events we’ll participate in and stuff,” said Ike, raising his hand.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What is it, Ike-kun?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke, hand still raised, stood up.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They’re saying that we’re competing in seven events in total, right? But I mean, we’re not all gonna have a turn, right?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who do you mean by ‘we’? And what exactly are you talking about?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um, well, puttin’ it in simple terms, the students who are kinda, well, awful? I mean, I was just wondering…the students who aren’t particularly good at sports and aren’t exactly blessed with book smarts aren’t really going to take a turn, right? It’s not like all seven of these events are gonna be the kind where we need tons of people. If we pick events that only a few skilled people can win at, that means a bunch of us won’t be doing anything, right?” said Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were close to forty students in each class. Even if one or two events that required a lot of people were chosen, we’d probably have a total of twenty or thirty students competing across all seven events. Ike seemed like he was trying to say that depending on the match-ups we came up with, nearly half the students in class wouldn’t be participating.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t really know ’bout that, though. What if there’s an event that needs, like, twenty people?” asked Kei, inserting herself into the discussion after Ike gave his opinion.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dude, come on. That’s dumb, Karuizawa. You can only have like eleven people on a team in soccer, right? What events would need more people than that? I can’t even really think of one. Y’know?” said Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well… what about baseball?” she countered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Baseball has about ten people, I think. Fewer than soccer.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Baseball has nine people,” pointed out Horikita rather sharply, suddenly cutting into the conversation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Well, okay. But the point is, it’s not like we need \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eeveryone\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e,” said Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I dunno, you sure about that? American football requires eleven people, just like soccer. And rugby needs like fifteen people,” said Sudou, listing events that required over ten people.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, but like, are you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ereally\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e gonna go with stuff like ruby? I don’t even know the rules to rugby, man.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile rugby was by no means an obscure sport, it was completely unfamiliar territory to anyone who hadn’t had direct experience with it. It wasn’t exactly something you did in gym class. I was sure the students in Class A were no exception to this, either. I couldn’t really imagine a lot of scenarios that would have led to me starting to practice rugby. It was doubtful an application for rugby to be one of our events would get through, and there would probably be little benefit to anyone if it did. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s why I’m thinkin’ that we probably won’t really have a turn,” said Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what are you trying to say?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that… That we don’t really need to meet up like this or have practice sessions later or stuff like that, I guess.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand that you want to take it easy. It’s certainly true that it’s mentally taxing to be made to do something that you really don’t want to do. Plus, it cuts into your precious break and holiday time,” reasoned Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-well, I wouldn’t really go that far, but…” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But I’ve determined that we all need to work together.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d like to hear the reason why. If it sounds convincing, then I’ll support you with everythin’ I got,” said Sudou, speaking up.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The number of people we’ll need depends on the rules. For example, let’s say that our opponents propose volleyball as an event. Volleyball is typically a game of six-versus-six, but we do get to edit the rules to a certain extent. What if they decide to establish that the game has a thirty-minute time limit, and that all players have to be swapped out every ten minutes? What would the required number of participants be, then?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh… Let’s see, six people, changing every ten minutes, so…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEighteen people, going by those criteria alone. Meaning nearly half the students in class would have to participate. Moreover, having six students participate at any one time was an easy requirement for any class, in any grade level. It was likely the school would go ahead and approve such an event.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And what if there’s more than one event like that? If you follow that line of thought, then it’s obvious to see that everyone in class might be forced to participate in two or three events. We need to be prepared for that,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, this all depended on the events and rules that Class A came up with. It was entirely possible that they’d mix some fake events into their submissions, just to make things tougher for us.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure this hasn’t quite clicked for all of you yet, but this special exam is much more complex than you think,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf we went through each possible event in turn, I was sure we’d come up with some completely ridiculous options. Rock Paper Scissors, like Ike had suggested, or something like a game of cards. Since we needed to win four events at any cost, we couldn’t really afford to try and look cool. We needed to come up with events that we could definitely win at, no matter what the contents of those exams were. And we needed to pick the right people for the job.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t plan on keeping you here for too long today, either,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOr rather, even if she did keep everyone here, it didn’t necessarily mean we’d come up with any good ideas right away.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, for today, I’d like to give you all some homework. I want you to come up with an event that you’re good at and an event that you’re sure you’d never lose at by the end of class, tomorrow. It doesn’t matter whether it’s a solo event or a team event,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wanted us to make sure one of our five final choices was a one-on-one event. Chances were good that every class was putting an event like that in their line-up, with absolute confidence that they wouldn’t lose. On the other hand, if you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e end up losing such an event, the blowback would be immeasurable. That being said, students with special skills and talents, whose chances of victory were assured, would be in high demand. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But there’s no point unless they’re events that the school approves of, right? I don’t really get what the criteria are.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEvents and rules that are too obtuse would be rejected by the school. The lack of clarity in regard to that requirement was probably a problem that many students were grappling with. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t have to worry about that right now. We’ll figure out whether or not they’re events the school will accept after we’ve heard from everyone and come up with a full range of options. For the time being, you’re welcome to suggest any events you can think of,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re saying that stuff like fighting games, karaoke, and so on are all okay?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. Not a problem,” replied Horikita, once again emphasizing that no one needed to worry about that right now. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was probably the right way of handling things. It was important for us to start by asking ourselves what we were all good at.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do we do if there’s nothing we’re really good at, though?” asked Haruka, directing her question at Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If there are no events you feel particularly confident you can win, it’s fine to not submit a suggestion. It’s too risky to put forward suggestions for events that you aren’t absolutely confident in.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe probably wanted as many events as possible, but we didn’t really have the time to be selective, from the sounds of it. So far, it seemed Horikita’s decisions had been on the money, so I supposed I could sit back and watch.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is it really all right to end the discussion so soon?” asked Kouenji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If today’s discussion is this brief, it makes it easier for you to participate next time, doesn’t it, Kouenji-kun?” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I had said I’d participate this once, and that was it,” said Kouenji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…But it’ll be bad if you don’t finish the ‘homework’ I\u0026#160;had assigned to you today. If you don’t do that, you can’t really say you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eactually\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e participated, wouldn’t it?” countered Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come up with an event I’m good at, was it?” said Kouenji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe brought his hand to his chin, his smile never fading.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. If you want to say that you’ve really participated at least once, then you have to do that much,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita was probably trying to say that if he couldn’t do that, then he’d have to come to discussion a second time. Kouenji stood up gracefully, and then made a declaration aimed at Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There is nothing that I cannot do. Because, you see, I am a \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eperfect human\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, no matter what kind of opponent you’re up against and no matter what kind of event you’re competing in, you are absolutely sure that you’ll win? You’re sure of that?” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was saying it partly to provoke him, but I was sure part of her couldn’t help but wonder how Kouenji would answer.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Do you want me to make a promise to you, then? ‘I promise to attain victory in every event in which I participate.’ Like that?” said Kouenji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. If you promise me that, then I’m fine with you doing as you please during this special exam. You won’t have to participate in any future discussions, and I won’t ask you for your opinion on anything from here on out,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-Hey, Suzune,” said Sudou, flustered by the sound of her ridiculous proposal.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut Horikita continued speaking.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But just remember this. If you don’t participate, or if you lose in an event…then everything you say will be met with doubt, and your classmates’ distrust of you will skyrocket.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNot a bad idea, Horikita. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was trying to make full use of Kouenji’s abilities on the day of the exam. Kouenji was the cream of the crop in terms of both academic and physical ability. The sole concern was his personality. Her idea was to put up with his behavior for now, to ensure he wouldn’t be frivolously absent on the day of the exam itself. How would he respond to this? \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji, who’d been about to leave the classroom, stopped in his tracks.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I will leave you this: Don’t think you can tie me down with words like that. While it is true that I am a prodigy who will never lose to anyone, it is up to \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eme\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to decide whether or not I will use my talents for you.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, he was essentially saying “no.” It didn’t matter if people were going to question what he said, or if distrust in him would skyrocket. He was only going to do what he wanted to do. And with that, Kouenji resumed walking, and left the classroom.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I suppose ordinary methods aren’t going to work on him, after all,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh, that guy really does look down on the rest of us… Seriously, saying he’s a prodigy who wouldn’t lose to anyone? What? I’d wipe the floor with him in basketball if we ever played a game,” spat Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI understood how he felt quite well. No matter how brilliant someone might be, it didn’t make them all-powerful. In fact, I had my doubts about whether Kouenji could actually win against Sudou in a game of basketball. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If he’s willing to put in the work for us on the day of the exam, then we might see results, to a certain extent. I don’t know how much what I said resonated with him, but I suppose we’ll just have to wait and see. Right?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I guess…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was difficult to imagine Kouenji losing, for sure. Considering how big a game he talked and how much confidence he had, it was honestly hard to even imagine the possibility. I was sure even Sudou was aware of that.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But do you really think he’s actually gonna, y’know, get serious on the day of the exam?” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe could win if he took the exam seriously. We wouldn’t win if he didn’t.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e5.2\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eW\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHEN I ARRIVED\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e at school the next morning, Horikita informed me of something.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve decided not to count Hirata-kun as an asset in this exam,” she said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYesterday, Hirata had silently refused to attend an after school gathering that \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eKouenji\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e had attended. Considering his behavior, it was no wonder Horikita had come to this decision.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s a good call. There’s too much cause for concern for us to rely on him.” We could try and force him to participate, but it would probably just backfire.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s fine if it’s just for this exam. But it’s possible this behavior might continue for a long time,” said Horikita. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer concerns were by no means an exaggeration. We could all agree that everyone wanted him to recover, but right now, it was unclear how to get him back.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, if you think there’s nothing to be done about Hirata’s withdrawal, there’s always the option of having him expelled, right?” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile Horikita was clearly surprised by what I’d just said, she responded calmly. “That’s… Well, yes, there is that option. That might be something I’ll have to consider. I suppose at the very least, it’s a relief he didn’t get desperate enough to say he wanted to be the commander, or anything like that,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was easy to imagine Hirata volunteering to be the commander for this special exam. Then he could deliberately lose and get expelled. Simple. But even if he had no lingering attachments left to the school, he still didn’t want to inconvenience other people, which was precisely why he hadn’t volunteered for the position. If I had to guess, the reason he was quietly attending class each day was because the class would be penalized if he got expelled. He was probably looking for the right opportunity to make his exit, when it wouldn’t inconvenience anyone else. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut that logic only applied to his \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecurrent \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003estate.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not like he’ll necessarily stay a good person forever, right? He might give into despair and desperation, and then…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs Horikita had said, there was no way of knowing what Hirata would do if he grew desperate enough. We couldn’t rule out the possibility of him nearly destroying the class on his way out. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s exactly why I don’t want to have him participate right now. He’s a ticking bomb. I’d also like to keep the class together, so we don’t set him off,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eConflict within Class C was exactly what Hirata hated most of all. Horikita was being proactive, right off the bat, to keep such conflict from arising. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sounds rough,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, you’ve taken on the role of commander, so I’m afraid you’ve got it rough, too,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll leave everything to you. I’m sure you’ll be able to come up with good ideas, even for how the commander should be involved.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe glared sharply at me. “And you’re going to beat Sakayanagi-san like that?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dunno.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dunno? Well, I intend to win. Can I get you to be a little more involved here?” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t need her to tell me that. I already knew.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you asking me to get actively involved with the class? Deciding who will participate in what events and devising the rules dictating the commander’s involvement? Try and picture that, will you?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita’s face stiffened. “…I can’t picture that, actually. I can’t picture that at all. Terrifyingly so.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Right?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was, at best, someone who remained in the shadows. Even being the commander didn’t change that. People would get suspicious if I suddenly started issuing directions about this and that. I’d let Horikita devise a strategy, use that as my jumping off point, then put things into practice.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs we talked, I felt the vibe in the classroom suddenly change. Hirata had arrived. Most of the students were trying not to look directly at him, but they were clearly concerned. He was just barely on time to class today.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“G-good morning, Hirata-kun,” Mii-chan called out. She was being brave, not letting the awkwardness in the air deter her. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut Hirata didn’t respond to her bravery. He ignored her and quietly went to his seat, not responding to anyone. Still, Mii-chan’s smile didn’t falter.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who could have imagined things would turn out like this?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re telling me.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite Mii-chan’s best efforts, Hirata continued his self-imposed isolation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She’s the only one who hasn’t given up on trying to talk to Hirata-kun, isn’t she? I didn’t think she had that deep a connection with him…” Horikita had also noticed Mii-chan paying special attention to Hirata, and was beginning to wonder why she kept on trying.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Isn’t it just because she’s kind?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then she’d have to act the same way toward the other students. Otherwise, that theory doesn’t hold up,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s true.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf that was the case, Mii-chan would have reacted the same way when Yamauchi was about to get expelled. Which meant there was only one reason she kept trying to talk to Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She’s probably in love,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose that’s the remaining possibility… Good grief, what a stupid sentiment,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe crossed her arms in exasperation, shaking her head from side to side, as though she found the idea incomprehensible. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe we ought to limit the resources we expend on dealing with him… What do you think?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, have everyone in class leave Hirata alone for a set amount of time. “Won’t that be difficult?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not at all. There’s no one going out of their way to talk to him, except for her,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata had even decided to ignore Mii-chan, despite her clear devotion. There certainly weren’t many students who’d be willing to go much further than that. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, whatever her motives are, I hope she forgets about it soon,” said Horikita, apparently thinking about how she could get Mii-chan to give up. “If this is all there is to it, I won’t complain. But it’s clearly having a negative effect on her.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. I suppose it’s true that she hasn’t been herself.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOn top of that, the entire class’s mood turned sour whenever the Hirata situation came up. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMii-chan, undeterred by Hirata completely ignoring her, tried to approach him once again.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, um, Hirata-kun. For lunch today, I—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe must have been thinking of inviting him to lunch when she spoke to him, but…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Will you please leave me alone already?” said Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe harsh words resounded throughout the classroom. He’d struck down Mii-chan’s offer before she’d even finished making it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re bothering me.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was nothing but coldness in his voice.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-but, I… I just wanted to, well, have lunch, together with you, and…” she stammered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMii-chan tried her hardest to keep a smile on her face, but her emotions got the better of her. Her smile began to fade.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not eating. And definitely not with you.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe couldn’t have said “no” more firmly if he tried. Many of the girls averted their eyes, not wanting to see Hirata like this.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, hold on a second, Yousuke-kun. Don’t you think you’re taking this kind of far?” said Kei, deciding\u0026#160;to step\u0026#160;in. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo—given the situation, it might be more accurate to say that she’d been \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eforced\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to step in. I could easily picture Kei’s friend group asking her to please do something. If Hirata pulled back now, then Kei would save face, and the class would calm down for the time being. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Could you please not call me by my first name and act like we’re close? You and I have nothing to do with each other anymore,” said Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“F-Fine, okay. Well then, Hirata-kun, you’re being way too harsh on Mii-chan.” Kei corrected herself and addressed him by his last name, confident in her role as a leader who brought the girls together.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s hardly any different from how \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e usually treat everyone,” he countered, not backing down.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wha—I’m just, you know, for the class…!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Could you please be quiet already? If you don’t… You understand what I’m getting at, right?” said Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe threat forcibly shut her down before she could say anything else. Hirata was saying that if she kept going, he would expose her. At least, it was inevitable Kei would interpret it that way, given that she had shared her weakness with Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What the hell?! Whatever, forget it. I don’t even care anymore,” huffed Kei. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was nothing more she could do at this juncture. She had no choice but to withdraw, albeit reluctantly. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How long do you plan on standing next to me?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaving completely shut down Kei, Hirata set his sights back on Mii-chan, who remained motionless and on the verge of tears. Now completely and thoroughly rejected by him, she sat back down in her seat, downcast. Hirata probably thought this would ensure she didn’t try to speak to him again.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The class’s morale is taking a nosedive…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kouenji doesn’t seem to mind at all, though.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnly one man remained oblivious to the oppressive feeling hanging in the air. Even in the midst of Hirata’s spat with Mii-chan and then Kei, he seemed to be focused only on tending to himself. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why on earth are there so many problem children in our class?” said Kouenji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI considered telling him that he was a problem child himself, but thought better of it.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e5.3\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eN\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eO MATTER HOW BAD\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the atmosphere was, though, time continued to move forward. Once class ended for the day, our second class discussion was at hand. To be more precise, it was actually the third if I included the one I hadn’t attended, I supposed. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was also the third day since the exam had started. It\u0026#160;was about time we got things moving.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce again, Hirata stood up and immediately left the classroom after class. Mii-chan looked torn. She quickly stood up, as if something had roused her. But her legs didn’t budge, and she didn’t take a single step. Hirata’s rejection from this morning was likely playing on repeat in her mind. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer legs buckled, and she sat back down.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s for the best…” Horikita muttered quietly, her cruel yet kind words just barely reaching my ears.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was best not to get involved with Hirata right now. H
