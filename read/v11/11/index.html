orikita and the other students understood that was the safest bet. Occasionally, some jealous boys would complain about Hirata, but such complaints had been few and far between of late. Weren’t those complainers the sort to despise a guy because he’d fallen from grace, I wondered? Or was it precisely because this was \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHirata\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e that they couldn’t speak ill of him?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Mii-chan, do you want to walk back to the dorms with me after today’s discussion?” asked Kushida, having foreseen the issues that might arise with Mii-chan’s mental state.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She’s pretty reliable at times like this, isn’t she?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Guess so.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida wasn’t someone who’d neglect a friend in trouble. If she couldn’t save Hirata, then she was compelled to at least save Mii-chan. Even if her motive was just to score points and make herself look good, it was fine as long as she was helping others. Mii-chan accepted with a gentle nod.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, then, I suppose I will be going myself,” said Kouenji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSure enough, he had no intention of participating. Kouenji left the classroom right after Hirata did, moving proudly, as if to say he’d already been endorsed by Horikita and received her seal of approval. Ultimately, it seemed there would be thirty-seven people present for this discussion.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita watched Kouenji as he left, then rose to take her place behind the podium. Chabashira left the classroom, giving her a sidelong glance.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now, then, I hope you’ve all come up with things you’re good at,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please wait a minute. There’s something I’d like to bring to your attention before we started,” said Keisei, the first to raise his hand.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What is it, Yukimura-kun?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m worried about people eavesdropping on our class discussion.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven with the door closed, our voices would be audible to someone sticking around in the hallway outside. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose you’re right. It seems we can’t even have a proper discussion in this school, are we?” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shouldn’t we come up with some countermeasures? For example, we could have someone stand watch or something. Honestly, I think it’s bad for us to openly discuss the exam without taking some steps first,” replied Keisei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, you’re exactly right,” said Horikita, nodding her head. She must have understood this herself already. “But\u0026#160;I don’t think having someone stand watch would be an effective countermeasure.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Why?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you planning on having whoever’s on guard duty warn other students not to come close to our classroom? The hallway is a shared space that all students have equal access to. In fact, that applies to this classroom, too. We have no right to deny access to students from other classes,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe added that if we blocked students from trying to pass through, there might be complaints filed against us.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s why there’s no point in simply having someone stand watch,” she concluded.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then are you planning to let everything we discuss get out for anyone to hear? Freely giving away information about our strengths and weaknesses could be extremely damaging. That doesn’t help us at all.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have a solution to that. By using these, we’ll get around the issue,” said Horikita, taking something out of her pocket.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was talking about using our phones. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll create a group chat for the entire class, which we’ll use for discussion specifically for this special exam. We can state our opinions verbally, but we’ll restrict the sharing of important information to this group chat. This way, it’ll be fine even if other classes try to eavesdrop,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKeisei nodded, looking convinced. “I see… That sounds fine to me.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right then, may I go ahead and send over everyone’s contact info, and create the chat?” proposed Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita had no objections. It wasn’t an exaggeration to say Kushida was probably the only person in class who knew everyone’s contact information.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile Horikita and Keisei were still in the middle of their discussion, Mii-chan stood up. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry. There’s something… I, um, have to do today, so…” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And that something would be… chasing after Hirata-kun?” asked Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMii-chan nodded her head in response. Her footsteps were heavy as she moved to follow Hirata. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait. Even if you try and go after him now, there’s no point,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What… What do you mean?” asked Mii-chan, her tone surprisingly intense.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He’s useless right now. He’ll just drag you down with him.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t want to abandon Hirata-kun.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not talking about abandoning him. I’m just saying that he should be left alone right now,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, when are you going to help Hirata-kun?” asked Mii-chan.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…That’s up to him,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re wrong. That’s…it’s just plain wrong. I don’t think that’s the right way,” huffed Mii-chan. She walked away, clearly done listening to what Horikita had to say.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For crying out loud… We just need to leave him alone right now,” sighed Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, not a single person in class was getting up to go chase after Mii-chan.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m going to be gone for just a moment. Please don’t go home yet. Just wait here,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe left the classroom, signaling her intention to chase after Mii-chan and bring her back. She probably didn’t feel like she could leave the task to anyone else.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What a complete and utter mess… We can’t even have a proper discussion, thanks to Hirata,” spat Keisei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was understandable why he felt that way. After all, we were on the third day and still hadn’t made any progress. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI stood up from my seat.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Ayanokouji, are you thinkin’ of chasin’ after them, too? Suzune said to wait though,” said Sudou, giving me a word of caution.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was certainly true that things would just get worse and worse if people kept leaving like this.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know,” I replied, ignoring Sudou and walking out into the hallway.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know? Hey!” he shouted.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce I made it into the hall, I called out. “Horikita.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I believe I instructed you not to move,” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re planning on forcing Mii-chan to come back, you don’t have to be the one to do it. I’ll go. Your job is to the bring the class together,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re the commander. That’s not something you can push onto someone else, you understand? You won’t be able to demonstrate the full power of your position as commander if you don’t assess your class’s abilities,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can help me figure that part out later. Besides, there’s nothing I can do about it, anyway.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not the iss—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you think you can really fix Hirata’s problem?” I\u0026#160;asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Someone who thinks neglecting him is the best course of action isn’t someone who should be chasing after him.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita was one of the main reasons he was this broken. She shouldn’t be the one to approach him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, do you…think that \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e can?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It depends on the efforts of the people around him,” I\u0026#160;told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If that was the solution, this should have been fixed a long time ago.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMany students had reached out to Hirata in concern. Not just Mii-chan. Horikita was beginning to question Mii-chan’s actions precisely because nothing was proving to be effective.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, we’ll pick this up later. I’m gonna lose sight of Mii-chan and Hirata,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hurry on back,” she told me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe sounded like a mother sending their child off somewhere. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I began walking, I suddenly bumped into Hashimoto. A simple coincidence? Yeah, probably not. I\u0026#160;was guessing he was here to spy on Class C, and also that he’d overheard my conversation with Horikita just now. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto didn’t seem surprised. He called out to me with a smile, like he found something amusing. “Yo, Ayanokouji.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat being said, I didn’t have the time to stop for a casual chat right now. “Sorry, but I’m kind of in a hurry.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re going after your classmate, she ran that way.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI responded to him with a subtle nod, and then headed after Mii-chan. Hirata’s behavior had been the same these past two days. He’d likely gone straight back to his dorm room after class ended, so he wouldn’t run into anyone. \u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e5.4\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eS\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHORTLY AFTER LEAVING\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the school building, I spotted Mii-chan. And just ahead of her, I could see Hirata, on his way to the dorm. Even though Mii-chan had gathered the courage to leave the classroom and pursue Hirata, she didn’t seem brave enough to actually call out to him. His rejection of her from this morning was probably still playing on repeat in her brain.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re not gonna try and talk to him?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMii-chan noticed me. I caught up and walked alongside her, the two of us looking at Hirata’s back.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess I’m just feeling a little hesitant…” she said softly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat made sense, considering how he’d shot her down when she tried to talk to him that morning.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, why did you chase after him? Everyone else has given up on him,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s… I don’t know.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, she hadn’t given it that much thought. Mii-chan seemed to ponder, now, exactly why she’d chased after Hirata. It probably wasn’t just because she had a crush on him. She must have landed on something after a few moments of thought, because she spoke up.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Everyone’s saying that we should leave Hirata-kun alone right now. But…I think that’s wrong. I think it’s exactly when someone is suffering, when they’re in pain, that you have to help them. So…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So you don’t mind if he comes to hate you because of it, Mii-chan?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce was probably fine, but if she kept trying to talk to him, Hirata’s responses would become increasingly harsher. You couldn’t say for certain that he might not end up yelling at her angrily.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I don’t want that to happen, no,” said Mii-chan, shaking her head as she thought back to Hirata’s rejection from earlier. “I’d hate for that to happen, but…if hating me makes Hirata-kun feel like he’s not alone anymore, even just a little bit, then that would be a relief. I think…in that case, I’d be okay with him hating me!” she asserted strongly. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was acting tough. Acting tough so that her heart wouldn’t break. I found myself thinking, however, that the power in her eyes was undoubtedly the real deal. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Am I doing the wrong thing, Ayanokouji-kun?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. You’re right.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNeglecting Hirata right now definitely wouldn’t make things better. If we did that, we’d just be trapping him in a deep darkness that he wouldn’t be able to escape. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, are you going to talk to him?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMii-chan moved forward, taking one heavy step at a time. Then she ran, closing the distance between herself and Hirata. Hirata was probably going to be pretty angry with me later, but this was the best course of action right now. If we wanted to back Hirata into a corner, Mii-chan’s kindness was the most effective way to do that while also inflicting the most damage. And then, in the near future, his heart would break, and he’d probably be forced to choose to drop out of school.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I made my way back to the classroom, Hashimoto, fiddling with his phone, saw me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yo.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You manage to steal any information from Class C?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah, unfortunately. Can’t really get my hands on anything with all the important bits of info being communicated over text, y’know.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto shrugged his shoulders and put his phone away. It seemed he’d overheard Horikita’s idea to use our phones.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve been waitin’ for you to come back. So, how’d it go? After your chased after your classmate, I mean.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As you can see, I came back empty-handed.” I emphasized the fact that I hadn’t brought Mii-chan back with\u0026#160;me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Man, seems real tough and all. Bein’ the rock for your class, having everyone come to you.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Bringing the class together is Horikita’s job. She’s got the tough gig.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, did you have to become the commander because you have a Protection Point?” Hashimoto was being chattier than usual, probably trying to get as much information out of me as he could. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re up against Class A. Our class never stood a chance of winning. Since there’s no other way to avoid expulsion, I just think it was the only option we had,” I\u0026#160;replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. I suppose you’ve got a point. Welp—I came here to do a little light reconnaissance, even though our princess told me not to bother. Still, I thought I’d try to pick up whatever intel I could. But I guess you guys weren’t that stupid, after all.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto didn’t sound entirely convinced, but he patted me lightly on the shoulder and walked away, seemingly having given up. I watched him go and then returned to the classroom, where a discussion of which events to choose had just begun. I conveyed to Horikita with my eyes that I’d been unable to retrieve Mii-chan, and I took my seat. She didn’t press the matter.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDiscussion of everyone’s strengths and weaknesses seemed to be progressing reasonably well via the group chat, with answers from over half of the students in class. Things went pretty much how I imagined they would, based on what I already knew plus the supplementary information I’d gotten from Kei. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFirst, there were sports that some students were good at. For example, Sudou with basketball, Onodera with swimming, and Akito with archery. Then there were students confident in their academic skills, like Horikita and Keisei, who listed off subjects they felt they could score especially high marks in. However, unlike with sports, where you could just focus your talents on a specific field, tests of academic skill posed a significant challenge unless you excelled in nearly every subject.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun, were there students from the other classes in the hallway?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems someone was there until a little while ago, but whoever it was left once they realized that we were holding the discussion via our phones,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Well, I suppose that’s to be expected.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou, having understood from our conversation that no one was spying on us now, made his move.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Basketball! We \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edefinitely\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e gotta do basketball!” he shouted, appealing to Horikita directly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t doubt your ability. Are you sure that you won’t lose to anyone, no matter what class they’re from?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are lots of ways you can play basketball. If we choose a one-on-one match, I’ll definitely win. You’ll see.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBasketball was typically played five-on-five on the court, but there were several derivatives of the game. One of those was the one-on-one match Sudou had just proposed. If the rules were solid, then it should be a safe enough bet to qualify as an event in the school’s eyes. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose so. There’s no doubting your skill as a player. In a one-on-one match, I think you would most certainly score a win,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Definitely!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But it’s not that simple for this special exam,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-why?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because we can only choose a single one-on-one event,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOne of the rules dictating what events we could submit was that we couldn’t have two events with the same number of participants. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we were allowed to choose as many one-on-one events as we wanted, then we’d just use people who specialized in those kinds of events. Onodera-san is particularly good at swimming. If we’re just going after wins, we could also have her compete in a one-on-one swimming match,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat way, we could easily secure one win for our class. Of course, there was a risk Onodera might have to compete against a guy, but considering her times, she’d have a sufficiently high chance of winning.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we had a competition that tested English speaking skills, Wang-san consistently gets near-perfect scores. There are more than a few students in our class who stand a high chance of winning a one-on-one match in this manner, in a field they specialize in,” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou’s spirits looked a little dampened. He’d been banking on securing our class’s victory.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m a total beginner when it comes to basketball, so this is a genuine question. Let’s suppose you were to play a regular game of basketball, meaning a five-on-five match. And let’s say the other four people on your team were girls who aren’t particularly good at sports. Do you think you’d definitely be able to win, with a team like that?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To be completely honest, I’m pretty confident I could carry the team and win by myself, even if my teammates aren’t so hot. But if I’m up against experienced players on the other side, then… Well, I can’t say for sure,” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I appreciate your sincerity, and respect you for not pointlessly bragging about how you’d win no matter what. Which is why…” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita paused for a moment before making her suggestion.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d like you to think long and hard about this. It would certainly be a shame to discard basketball as one of our events. So, pick a team you think you can definitely win with in a five-on-five game, with minimal effort. If I’m suitably convinced, I promise to submit to the school as one of our events,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Got it,” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou nodded, accepting what Horikita said. Then he sat back in his seat and began simulating various scenarios in his head. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was the hard part. Sudou was quite athletic. While no one had any doubt that he’d be at his absolute best in a game of basketball, he was a student we could use in a variety of ways. In an exam like this, he was an ace up our sleeve. We had to keep in mind that it might be a waste to use him in a one-on-one event. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBesides, we should probably take as much time as we needed to rationally assess whether or not we really wanted basketball as one of our events. Even if we did have a chance of winning a five-on-five, our opponents weren’t stupid. If basketball was one of our ten events, then Class A could easily assume Sudou was going to be taking part. They might put five solid people on their team and manage to win, even against Sudou. Or, conversely, they could abandon the idea of winning that event, and focus their attention on the others. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita and the others continued to discuss matters such as these for quite a while. I exited the group chat, but pretended to be monitoring it still, looking down at my phone. After all, I was the commander. I wasn’t going to be asked about my strengths and weaknesses. I\u0026#160;was participating in these discussions simply as a formality. It didn’t change my plan to leave all of the details to Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter roughly an hour of discussion, Horikita had finished collecting everyone’s input. From this point on, she was probably going to shift her focus to holding individual meetings rather than having the entire class gather like this.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e5.5\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHURSDAY MORNING\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e arrived. It felt like it was going to be a colder day than usual while on my way to school, even though spring had come.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Gooood mooorning! It’s cold, isn’t it?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI heard a chipper voice behind me. I didn’t think they were calling out to me, so I ignored them and kept walking. But the person speaking got flustered and called out once more.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-hey, wait, wait a minute! Ayanokouji-kun?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, the greeting \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehad \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ebeen aimed at me, after all. When I turned around to look behind me, I saw Hoshinomiya-sensei, the homeroom teacher for Class\u0026#160;B.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hold on, wait up a minute!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe grabbed my hand with her cold ones. I couldn’t help but wonder just what kind of female teacher would just casually grab a male student by the hand like this.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry. I didn’t think that you were talking to me. Can I help you with something?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can’t I talk to you without needing anything?” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe looked up at me with upturned eyes, her hand still holding onto mine. Only someone who knew exactly how cute they were would act this way. Maybe it was because I had been watching Kushida’s every move, but I was beginning to understand these things.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’m not saying that, but…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI pulled my hand free from Hoshinomiya-sensei’s grip, somewhat forcefully. For some reason, she let out a little chuckle when I did. A wicked grin appeared on her face.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, did you manage to snag yourself a girlfriend?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nope, not at all. There are no signs I’m going to be able to, either.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh, really? Even though you’ve been blessed with such a wonderful environment? What a waste.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat kind of ‘wonderful environment’?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh my, you don’t get it, huh?” she teased. Her next words were whispered directly into my ear. “Well, that’s no fun. The students here are in the kind of environment where it’s suuuuper easy to fall in love.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why’s that?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I asked her that question, Hoshinomiya-sensei was slightly taken aback.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You really don’t get it?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, not at all,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I said that, she patted me lightly on the shoulder several times. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know, when I get a really good look at you, you are pretty cute, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHonestly, I had no clue what she was trying to say.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let me tell you a little something… I’m honestly not a fan of how things are right now. I’ve been thinking about this for a while now, and I think it’s a problem that the boys and girls are living in the same dormitory.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that so?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince all our rooms were separated, I didn’t really see the problem. I moved away from Hoshinomiya-sensei slightly, trying to get some personal space. But when I did, she moved in closer again.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is something I heard from a friend of mine, but it was apparently tradition for the kids who got jobs at a particular company to go through two months of training in the company dorms. There were two to a room, and of course, the genders were separated,” she said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEvery time I tried to put some distance between us, she’d just move in closer again, so I gave up and just listened to her story.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But it’s easy for trouble to start brewing when two people are staying in the same room. One guy hated natto, apparently. He couldn’t stand the smell of it. He even hated looking at it. So of course, the first thing he said to the guy he was sharing his room with was, ‘Don’t \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eever\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e eat natto in front of me,’ I guess. But get this, the roommate loved natto. So even though the guy said he hated it, the roommate figured it’d be fine as long as he didn’t force him to eat it. And so he ate natto in front of his roommate, who hated the stuff. And as a result, well, the guy who hated natto got super mad and stormed out of the dorm, I guess.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat on earth was this woman trying to say? It didn’t sound to me like it had much of anything to do with guys and girls living together in the dorms.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, I’m sure you’re thinking what I just said has nothing to do with guys and girls living together, but this is important,” she added, before continuing on. “Anyhow, the company found out what happened, and the room-sharing system was abolished that same year. Starting the next year, all new hires at the company were given their own single rooms. Just like what we have here at this school. And as a result, there was a huge change from years past. What do you think that was?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m guessing it was a problem with guys and girls, like you were getting at before?” I asked in return.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yep. When the company was using the shared-room system, there were only one or two instances where people started dating, at most. But the minute they switched over to the single room system, they had like seven or eight couples getting together. I mean, even if you meet a girl you like and you go over to her room to hang out, when you have roommates, that means there’s gonna be another person in the way, right? It makes it easier for rumors to get around, too, so of course everyone has their guard up, and people don’t want to fall in love. But…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith single-person rooms, guys and girls could meet up without hesitation. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAnd\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e in private.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The change caused the rate of romantic developments to shoot, like, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eway\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e up,” she concluded.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, that was why she was surprised that I hadn’t gotten a girlfriend yet, huh?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, then let me ask you this. Are there lots of students who actually have boyfriends or girlfriends right now?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, actually, it doesn’t seem like anyone’s really getting together this year.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHey. In that case, isn’t it wrong of you to be giving me a hard time about this? \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt would probably be pointless for me to actually say that to her, so I swallowed my words.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe your theory is wrong, sensei?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No way,” she replied, with total conviction. “You just don’t understand just how fortuitous an environment you’re in right now, as a student.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t tell if this was coming from positive thinking or something else.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ll regret it, if you don’t. Wouldn’t it be better to fall in love now, while you have this chance?” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat in the world was this person babbling about to a student—someone who should normally be devoting themselves to their studies? I was well aware of the fact that there were all kinds of teachers out there, but in some ways, she might be a kind I’d never seen before. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, can I ask you something?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm? Oh, you’re wondering what age range is acceptable to me? Sorry, but dating a first-year high school student is pretty much off the table—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not asking that at all.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know, I know. This is the point where you should be laughing, y’know?” she teased.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was supposed to be laughing? I felt like I was getting swept up in her incomprehensible but compelling vortex.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what is it? Come on, tell me, tell me!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite the fact that she’d taken us off topic herself, she forcefully pulled the conversation back on track. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re endorsing the idea of romantic relationships, but it seems like it’d be pretty difficult for students to have romantic relationships with students from other classes,” I reasoned.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why?” she asked in return.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because the classes are competing against one another. It’d just sow the seeds of discord, wouldn’t it?” I stated matter-of-factly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d said something I thought was perfectly reasonable, but I saw her eyes light up.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That just makes it even better, doesn’t it?” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…It does?” I replied, dumbfounded.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Normally, you’d do absolutely everything in your power to help out your class, right? But your boyfriend or girlfriend is in a rival class. And that causes so much anguish and conflict. And tada, you have \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edrama!”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e she exclaimed. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe nodded repeatedly after saying that, apparently deeply moved by her own words. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, it’s obvious the more complex the relationship you’re talking, the more intense the competition will become, right?” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah, I suppose that’s true.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHonestly, she was right about that. It wouldn’t be surprising for some people to turn traitor for the sake of their lover. And it would be virtually impossible to monitor and manage all such relationships.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you two talking about?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Speak of the devil, eh?” said Hoshinomiya-sensei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSpeak of the devil? \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eThat was an odd choice of words, Hoshinomiya-sensei. \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe person in question didn’t seem to understand what she was getting at either, at all.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHoshinomiya-sensei abruptly ended our conversation and put some distance between me and her. “We were just chit-chatting, Sae-chan. Come on, you don’t have to give me such a scary look.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He’s my student.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You do seem to be \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003every\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e concerned about Ayanokouji-kun. Well, I suppose we’ll find out whether he’s really capable or not in the special exam coming up soon, right? He’s going to be going up against Sakayanagi-san, who is rumored to be the very best the school has to offer.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, there’s really no need for you to force yourself to be involved.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, well, yes, that’s certainly true. You’re quite right, Sae-chan.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHoshinomiya-sensei smiled, teasing Chabashira. She didn’t look at all like she’d just reached out to talk to me for no reason at all. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter Hoshinomiya-sensei had left, Chabashira shot me a sidelong glance, for some reason. It seemed she was wondering what we were talking about.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you want to know what we were talking about?” Since we were on our way to school, I spoke up, taking notice of her curiosity. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe didn’t say anything, apparently waiting for me to continue.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We were talking about the roommate system.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Roommate? …Ugh, that stupid story.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira seemed to know the story already. In other words, I could assume the company Hoshinomiya-sensei had been talking about was actually this school. And I could interpret \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to mean the school had originally had a shared-room system, rather than giving students single rooms. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed it was a story I could corroborate pretty easily, if I wanted to. But I didn’t care.\u003c/span\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 5: What the Class is Lacking\",\"volumeId\":\"v11\",\"chapterIndex\":11,\"prevChapter\":{\"volumeId\":\"v11\",\"chapter\":10,\"title\":\"Chapter 4: Opponents\"},\"nextChapter\":{\"volumeId\":\"v11\",\"chapter\":12,\"title\":\"Chapter 6: Good and Evil\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Title Page\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Sakayanagi Arisu’s Soliloquy\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: The Teachers’ Battle\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: The Final Battle of The First Year\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: Opponents\",\"href\":\"Text/section-0008.html#auto_bookmark_toc_top\",\"index\":10},{\"label\":\"Chapter 5: What the Class is Lacking\",\"href\":\"Text/section-0009.html#auto_bookmark_toc_top\",\"index\":11},{\"label\":\"Chapter 6: Good and Evil\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_top\",\"index\":12},{\"label\":\"Chapter 7: A Man’s Tears\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_top\",\"index\":13},{\"label\":\"Chapter 8: Ayanokouji VS. Sakayanagi\",\"href\":\"Text/section-0012.html#auto_bookmark_toc_top\",\"index\":14},{\"label\":\"Chapter 9: Class B VS. Class D\",\"href\":\"Text/section-0013.html#auto_bookmark_toc_top\",\"index\":15},{\"label\":\"Chapter 10: The Line Between Winner and Loser\",\"href\":\"Text/section-0014.html#auto_bookmark_toc_top\",\"index\":16},{\"label\":\"Epilogue: Postscript\",\"href\":\"Text/section-0015.html#auto_bookmark_toc_top\",\"index\":17}],\"volumeTitle\":\"Light Novel Volume 11\",\"detailsLink\":\"/select/year-1/v11\",\"returnLink\":\"/select\",\"currentSpineIndex\":11,\"nextVolumeLink\":\"/select/year-1/v11.5\",\"nextVolumeTitle\":\"Light Novel Volume 11.5\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":
