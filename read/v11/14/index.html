],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T15c9c,"])</script><script>self.__next_f.push([1,"\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 8:\u003cbr/\u003eAyanokouji VS. Sakayanagi\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eFTER A LONG PERIOD\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e of preparation, the day of the final special exam for the first-year students was here. The commanders of the two losing classes would be expelled—or, more accurately, stripped of their Protection Points. While no one would be getting expelled, you might say the most important aspect of this exam was that class points could fluctuate significantly. Depending on the outcome, there was a significant possibility that the entire class hierarchy would be flipped.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Forget about all the data from the notebook I showed you yesterday and forget about everything I told you,” Horikita, my neighbor, said while we waited for our morning homeroom to begin. “Choose whatever five events you like and then select who will compete.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I take over and it messes with your plans, won’t the other students be unable to adapt, though?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I made no promises to anyone about what events we were going with, or if they’d be put in play or not. I\u0026#160;simply said that I would be playing things by ear, making decisions and reacting logically to our needs at the moment, depending on the ten events that come up and the order. So, it should be fine,” she answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMeaning she’d set everything up perfectly, and in such a way that I could fight without anything to bother me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not taking responsibility even if something goes wrong, though,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is a class-wide competition. Even if the commanders are able to intervene, this exam is basically testing Class C’s overall abilities. Our enemy is Class A, led by Sakayanagi-san. The most formidable opponent in our grade. Even if you lose, no one will blame you.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eGiving Horikita a sidelong glance, I checked the last message that she had sent me. It was a record of everything the students in Class C had done for the past two weeks to prepare for the special exam. Stuff like what everyone had discussed, what events students had practiced for, and how they’d practiced for those events.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll put your efforts to good use. All your efforts,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I got up from my seat and was about to walk away, Horikita gave me a few parting words. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The chances of chess being chosen are seven out of ten. That’s not low,” she told me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOver the past several days, Horikita and I had played several games of chess.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In the end, I hardly ever won against you, even when you were going easy on me,” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was certainly true that she had only beat me a few times. Few enough to count on my fingers. But there was no need to count her losses, really. The chess skills Horikita had picked up in such a short period of time were quite impressive.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No matter who I’m up against, there’s no one out there stronger than me, even when I’m slacking off. Don’t forget that,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You sure have a great deal of confidence in yourself.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaving finished my conversation with Horikita, I left to go fulfill my duties as commander. The remaining students were basically on standby, waiting for me to issue them instructions from the multi-purpose room. After the events were announced, the students would then go to the designated locations, get changed, and so on. Since finer details wouldn’t be shown on the monitors, information would probably be shared when they returned.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e8.1\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eENTERED THE SPECIAL BUILDING\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e and headed toward my destination. When I got there, I saw that Sakayanagi and Ichinose, who had arrived before me, were chatting. Apparently, the multi-purpose room hadn’t been opened to us yet.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good morning to you, Ayanokouji-kun,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good morning, Ayanokouji-kun!” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey both greeted me at the same time. I raised my hand to give them a relaxed wave in response.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seems like we’re not allowed in yet,” I remarked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They told us to let them know once all four of us had arrived here,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was probably to ensure that the exam was carried out as fairly as possible. If someone were allowed to go in the multi-purpose room before everyone else, they’d be able to get a feel for the test location, perhaps even use that to calm their mind. Considering this was a particularly unique special exam, I supposed there was no limit to how far they’d go to ensure it was fair.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seems like we’re only missing Kaneda then,” I observed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yep,” replied Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI looked around. While I still didn’t see any sign of Kaneda, I supposed it wasn’t like he would be late.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I must say, you really are quite lucky, aren’t you, Ichinose-san?” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Lucky?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As they are right now, Class D is essentially a bunch of infants. It’s not like they could beat Class B, even in a million years. I suppose the only question that remains is how many wins you can accumulate, hm? If you manage to win all seven events in a row, then it’s even possible that you’ll change places with us, depending on how Class A performs,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I don’t know about that. I don’t know what’s going to happen, but I’m sure they’ll fight us tooth and nail. We can’t be too careful,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUpon seeing Ichinose’s renewed determination, an amused smile appeared on Sakayanagi’s lips.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, did I say something weird or something?” said Ichinose, puzzled.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not at all. It’s just that you spoke as if you’re already on top, just waiting for a challenger to appear. If nothing else, it seems you don’t see Class D as an equal opponent. But I suppose that’s only to be expected from the leader who defended Class B for the entire year,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer words were a touch mean-spirited. But Ichinose didn’t let it get to her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We came here with a strategy to win this, too. We’re not going down that easily, especially in an exam where unity plays such a big part,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Please pardon my rudeness. You are most certainly correct, Ichinose-san,” replied Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI looked through the window while I listened to their conversation. April was almost here, and the weather was clear, with not a single cloud in the wide-open sky. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFive minutes passed, and we started to wonder if Class\u0026#160;D might be late. Then, finally, we heard the faint sound of approaching footsteps from the hallway. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seems he’s not late or he’s abstaining from the contest due to nerves, after all.” Sakayanagi sounded amused that Kaneda would be showing up at the last possible minute.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose seemed to be trying to regain her composure and focus, now that the test was finally about to begin. We’d meet up with Kaneda and all enter the multi-purpose room together. That was what the three of us had imagined would happen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSomeone unexpected showed up instead. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose looked the most shocked of everyone present when this newcomer entered our field of vision. While Sakayanagi was surprised as well, her eyes quickly changed to show amusement.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Ryuuen-kun? Why…are you here…?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA wave of uneasiness seemed to wash over Ichinose. Well, actually, neither Sakayanagi nor I had expected this to happen. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s the matter? What are you all upset for?” Ryuuen, the former leader of Class D, deliberately drew attention to the fact that Ichinose was upset.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see… Well, I hadn’t expected this. I had thoroughly convinced myself that the commanders for this special exam would be the students with Protection Points,” said Sakayanagi, the first of us to figure out what was going on. Kaneda was nowhere to be seen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The special exam can’t start without the commanders. Meaning, if the commander is absent, then obviously someone has to take their place. Isn’t that right?” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed an unexpected absence on the day of the exam was certainly a possibility. There was probably some kind of system the school had in place for such an event, like having one or two people ready as replacements for the commander. And of course, if that happened, the substitute commander would be the one to accept responsibility in the event of a loss.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Still, I never imagined that this would happen and that you’d be here, Ryuuen-kun,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah, I s’pose not. Especially you, Ichinose. Even if you sprung a fever or got injured on the day of the event, I guess you’d still come crawling along the floor to avoid letting other students run the risk of gettin’ expelled, huh,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no way to prevent the commander’s expulsion other than a Protection Point, in the event of a loss. Just as Sakayanagi had said, we’d all assumed that the students who had Protection Points would be the commanders for this special exam.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose cleared her throat. I was sure she’d been wary of this back when the special exam was first, but the possibility had vanished from her mind once Kaneda was determined to be the commander for Class D. If I had to guess, Ichinose had unconsciously gone through the options in her head and eliminated Ryuuen as a potential commander, without even realizing it. She’d assumed we’d all be facing off against students who had Protection Points.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, I’m guessing that there must be some kind of penalty for someone to participate as a substitute, right?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yep. Kaneda isn’t allowed to participate in any events. I mean, that’s pretty reasonable, all things considered,” answered Ryuuen, apparently having already factored in the penalty into his decision.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you do this to shock me? Even if you did, won’t it be bad for you guys if Kaneda-kun can’t participate?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile I didn’t know everything there was to know about Kaneda, he was at least an asset to Class D. So what was the point of this bizarre strategy, which required losing him? That part gnawed at me. When had it been decided that Ryuuen would be the commander? If it had been decided right away, did that mean that this was all part of the plan? \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe same questions were undoubtedly racing through Ichinose’s mind right now, making her feel terribly confused.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, come on, no need to keep your guard up around me. I’m just a human sacrifice. The commander from the losing class gets expelled, remember? This just means that those Class D knuckleheads can officially get rid of me. That’s all there is to it, right?” sneered Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, does that mean that you’ll take it easy on me?” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eKu ku.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Sure, I’ll ease up on ya. So, just relax and bring it,” said Ryuuen, spreading his arms out wide, like he was welcoming her to come at him. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut there was no way Ichinose was going to let her guard down.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When you want to win, you do so by any means necessary. That’s the way you do things, isn’t it?” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When I’ve decided that I’m gonna win, then yeah, it\u0026#160;is.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I wish you wouldn’t. You don’t have a Protection Point, Ryuuen-kun. You’re fighting with your back to the wall, making your last stand. I can’t help but have a sinking feeling Class B might end up losing this,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose was the kind of person who worked hard to build confidence, trust, and security from the ground up. She wasn’t good at dealing with sudden, unexpected developments. She would’ve been just fine up against a normal opponent, but Ryuuen was anything but normal. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe shock might not stop at Ichinose, either, but soon spread to the rest of the students in Class B. Everyone in her class would inevitably notice that Ryuuen had become the commander. And even if they didn’t, Ishizaki and the others would let them know. And if that happened, the Class B students wouldn’t be able to hide how flustered they were, just like Ichinose. For Ryuuen, who was supposed to have been neutralized, to have become the commander… The students of Class B couldn’t possibly predict what he’d instruct his classmates to do, and that would scare them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, well, it seems the showdown between Class B and Class D is…shaping up to be quite interesting,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis wasn’t exactly a laughing matter for Ichinose, though. She should have taken action back when Class D students were repeatedly stalking and harassing her classmates. If she’d been able to detect Ryuuen’s presence in the background at the time, then she might not have been so flustered right now.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, now that everyone is here, let’s be going, shall we?” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith Sakayanagi leading the way, we entered the multi-purpose room. When we got inside, we saw a newly constructed wall that hadn’t been there on the first\u0026#160;day. It\u0026#160;divided the room into two perfect halves. Though it was a temporary construction, it looked quite sturdy, and seemed to be quite soundproof, too. The four instructors in charge of the first-year classes were lined up, waiting for us. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Class B and Class D representatives, please move over to the other side,” said Mashima-sensei. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs per his instructions, Ichinose and Ryuuen went over to the other side of the wall, disappearing from view. Chabashira followed after them. We, the commanders of Class A and Class C, were guided by Class D’s Sakagami-sensei and Class B’s Hoshinomiya-sensei. It seemed the teachers had been put in charge of classes other than their\u0026#160;own.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The exam will begin in five minutes, so take this time to mentally prepare yourselves, okay?” Hoshinomiya-sensei advised us, before going off to have what looked like a final talk with Sakagami-sensei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi and I had a little bit of time alone before the exam started. Just the two of us.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Finally… The day has finally come. To be honest, I wasn’t able to sleep last night, and I almost overslept this morning,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t recall making you wait that long for this. Besides, it was just a coincidence that you and I met in the first place.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you saying that if you hadn’t come to this school, we wouldn’t have met?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI nodded in response. She laughed, rejecting my answer.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s certainly true that our reunion at this school was mere coincidence, yes. However, I was absolutely sure the day would come when we would meet again. It was fated to happen,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fate? Okay, now you’re saying some pretty abstract stuff,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I am but a young maiden, after all,” she answered, smiling, approaching me slowly while holding onto her cane. “If you hadn’t enrolled at this school, I suppose I would have postponed our meeting for another three years. I was confident I could rein in my excitement, hide it deep down, and avoid rushing things. But that quickly proved to be quite impossible. From the moment I knew you were this close to me, the days just seemed to get longer and longer. I wanted to fight you right away. It took an unbelievable degree of effort to restrain myself. That’s how much I dreamed of this day.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe words poured eloquently from her mouth. So, her wish was being granted, huh?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aren’t you afraid of waking up from this dream?” I\u0026#160;asked her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce we actually competed against each other, there’d be no going back from it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose everyone has to wake up at some point,” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe didn’t mind if she woke up. Or maybe, that was just how she felt today. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Normally, I would…ask you to please be gentle with me, but…” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer eyes didn’t look like that of a young maiden’s. They had the sharpness of a hunter stalking its prey.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please come at me with all your might,” she said.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_7\" src=\"/hola-lector-agua/images/books/v11/OEBPS/Images/INTERIORIMAGES_7.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I pulled my punches, she wouldn’t be happy. I wasn’t doing this to make her happy…but it would get annoying to stay involved with her any further. At the same time, I had my doubts about whether this special exam would really satisfy her. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs if she had sensed what I was thinking, Sakayanagi spoke up once more. “I’d be lying if I said I didn’t feel conflicted. The contents of this special exam are far too inadequate for both of us to sufficiently demonstrate our abilities. And even though we are the commanders, there is a limit to how much we can intervene.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe school would never implement an exam where the outcome depended on the efforts of a single person—the commander. Even so, Sakayanagi was saying that as long as the two of us could have our showdown, everything else was trivial. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That being said, I suppose it would give rise to other problems if the commanders had \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003etoo\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e much involvement in the exam. I’m trying to be considerate of you, Ayanokouji-kun. You don’t want your classmates to find out about your abilities, after all. Right?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was grateful for her consideration. If this test had been set up to let the commander’s involvement have a significant impact on the outcome of every event, then I probably wouldn’t have been able to use my abilities to their fullest. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right! The exam is just about to begin. Please take your seats!” said Hoshinomiya-sensei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn response to her instructions, Sakayanagi and I sat across from one another, with the computers and equipment between us. Naturally, this meant we couldn’t see each other’s faces. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDisplayed on my computer screen were pictures of the faces of everyone in Class C. Thirty-eight people, excluding me. These were the people I would be assigning as participants to the events that were selected. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNext, the ten events that we had prepared were displayed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I am Sakagami, and I will be in charge of proctoring this special exam for you. So, without further delay, let us begin the final special exam for the first-year students. We ask that the representatives from each class press select five events and then press the confirm button.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI selected the five events Horikita had her mind set on and pressed the button without hesitation. Sakayanagi must have finished making her choices for Class A not long after, because the results were displayed on the large monitor. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe five events I had chosen from our list were Archery, Basketball, Ping Pong, Typing Skills, and Tennis. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d racked my brain over whether or not to throw in an interesting event like “Rock Paper Scissors,” but decided against it. I threw out the idea of using the English event since Class A already had something involving that subject, and also decided against Soccer, Piano, and Swimming, because even though Hirata and Onodera were skilled in their respective fields, it was very likely that they’d be useful in other events. Furthermore, Class C’s strategy was to primarily focus on sports. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe five events that Sakayanagi had chosen from Class A’s list were Chess, English Test, Contemporary Literature, Mathematics Test, and Flash Mental Arithmetic. So, we had our total of ten. Three of the events Katsuragi had told us he thought were sure things had been selected, after all. So had both the events that he thought might be runners-up after the main three: Flash Mental Arithmetic and Contemporary Literature. He was exactly right.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat being said, nothing really changed in the end. Because I deliberately hadn’t told Horikita about it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now, we’ll be holding a completely randomized drawing to determine the seven events you’ll be competing in,” said Sakagami-sensei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know, Ayanokouji-kun, I feel pretty sorry for you, having to go up against Sakayanagi-san. You have my sympathy,” said Hoshinomiya-sensei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hoshinomiya-sensei, please be discreet,” said Sakagami-sensei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“O-okay. Sorry for speaking out of turn.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor some reason or another, Sakagami-sensei seemed to be upset with her. She responded with an apologetic pose. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The results of the drawing will be displayed on the large monitor in the center. Please take a look,” said Sakagami-sensei, urging us to look at the screen, which was now displaying something new.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA 3D image flashed on the screen, followed by the titles of the selected events displayed. The first event that came up on the screen was…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eBasketball\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRequired Participants: 5 Persons\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAllotted Time: 20 Minutes (Two 10-Minute Halves)\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRules: Standard basketball rules apply.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCommander: The commander can switch out one player at any point in the game.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a five-on-five sporting event. And it was an event that we had chosen. Meaning it was something we absolutely could not afford to lose. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sakagami-sensei, are students permitted to speak freely with one another?” asked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There aren’t any rules specifically forbidding it. Please feel free.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, we’re free to engage in a battle of words, then?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi had directly admitted what her intentions were. But Sakagami-sensei didn’t object. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Jeez, you’re so merciless, Sakagami-san!” said Hoshinomiya-sensei, probably seeing this as him giving Sakayanagi permission to launch into a merciless assault against me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hoshinomiya-sensei,” he replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, yes, sorry! Not another peep out of me!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, while the students were free to speak, the teachers were not. Hoshinomiya-sensei got chewed out each time she spoke up.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it seems Class C has chosen to compete in a fair number of sporting events, just as expected. Considering that you have few academically skilled students, I suppose that’s understandable. And I’m sure Sudou-kun is your key player for basketball, hm? He \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eis\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e one of the best basketball players at this school. I have a feeling we won’t stand a chance of winning, with our inferior team.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi offered me her analysis, apparently wanting to verbally spar with me, but I chose to remain silent for the time being. I wanted to avoid making too much of an impression on Hoshinomiya-sensei and Sakagami-sensei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did the true commander, Horikita-san…order you not to say too much?” asked Sakayanagi. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce she realized I wasn’t going to reply, she kept going. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If that’s the case, then whatever you say should have no effect on your selection process. Don’t you think so?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi knew that I was trying to say as little as possible when we were in front of the teachers. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita warned me not to say too much to you. She said if I carelessly let something slip, I’d just fall for one of your tricks and you’d turn the tables on me.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFu fu\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. Oh no, that’s no good, Ayanokouji-kun. Now you’ve gone and given me an advantage. You really should have kept the identity of whoever is controlling you from the shadows hidden. If you reveal that it’s Horikita-san, then I can make some inferences based on her personality and behavioral patterns,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that…doesn’t necessarily mean I’m getting instructions from Horikita, though,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Didn’t you just say that you did, though? You just said Horikita-san gave you instructions.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHoshinomiya-sensei, seeing Sakayanagi chuckling at me, held her hand up to her forehead, letting out an “Oh,\u0026#160;no…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakagami simply shook his head at seeing Sakayanagi extract information from me so quickly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I just said that Horikita warned me… The instructions might have been from someone else.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eMight\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e have? No, no, you really should definitely claim that it was someone else, even if it’s a lie,” said Sakayanagi, chiding me. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNot only had Sakayanagi seen through me, but she was going so far as to help me out. Our little back and forth was bound to have conveyed the overwhelming gap in power between us to the teachers. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that we’d worked together to fool the two teachers, I supposed, the special exam could begin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s the point, anyway? We carefully considered the kinds of things you might come up with, Sakayanagi. And we’re going to stick to that as we handle this test. You may have realized that Horikita was the one who came up with all of our plans, but all that does is put us on an equal footing.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My, oh, my, you just came right out and admitted it, hm? But when was it ever established that \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ewas the one who devised Class A’s strategies? Just like you, Ayanokouji-kun, I have as many heads to put together as I do classmates. Haven’t you considered the fact that we might \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ealso\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e have run a series of calculations in preparation for this test?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA few dozen seconds had passed since we had been given permission to engage in a battle of words. Sakagami-sensei, apparently unable to watch anymore, pushed the exam forward.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The clock is ticking. While I did tell you that you’re free to speak, please do not neglect the task at hand,” he stated.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, my conversation with Sakayanagi didn’t have the slightest impact on my mental state. The only ones who were worried were the teachers. To Sakayanagi and me, this was basically nothing more than idle chatter. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce we were both done making our team selections, the students who would be playing basketball from both classes were displayed on the screen at the same time. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe five students from my class were: Makida Susume, the ace player of our lineup; Minami Setsuya; Ike Kanji; Hondou Ryoutarou; and Onodera Kayano. Sudou was not included in the lineup. Also, I had included one girl. And, as mentioned earlier, our ace player was Makita. According to Sudou, if Makita practiced with the basketball team, then his skills should be up to par. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAdditionally, while Onodera’s forte was swimming, it seemed her basketball skills were nothing to scoff at. Apparently, it was decided that picking her would result in the team functioning better than if we just threw in another guy with little to no experience. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass A, on the other hand, chose Machida Kouji, Toba Shigeru, Kamuro Masumi, Shimizu Naoki, and Kitou Hayato as their five players. They had also included one girl in their lineup. According to the information I had from Hirata, Kei, and Kushida, our team should take the win.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t clearly see Sakagami-sensei’s face, as he was standing over on Class A’s side, but I could clearly see Hoshinomiya-sensei, who stood beside me. I could immediately tell that she was having doubts about my leadership. That was understandable, considering the fact that Sudou Ken, thought to be a shoo-in for basketball, was absent. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, that was part of the strategy that Horikita and everyone else in Class C had discussed, not something I’d decided on. Though it was only natural that Sakayanagi would see through such a strategy.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re deliberately withholding Sudou-kun from this event and hoping to win without him. I see. Well, considering Sudou-kun’s physical prowess, it wouldn’t be strange for him to be skilled at Ping Pong or Tennis, too. Everything is still as I anticipated.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf we’d played Sudou right away, we could’ve safely ensured Class C’s victory. On the other hand, Class A couldn’t have been happy about basketball being chosen in the first place, probably because they immediately assumed Sudou would be on our team. Honestly, if Class A went head-to-head with Class C in a game led by Sudou, their chances of winning were low. With that in mind, they would have wanted to avoid wasting their more athletic students on this event, knowing that if Sudou had already been put in play for basketball, they’d have an advantage over Class C in the events to come. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn light of that, Class C had deliberately avoided selecting Sudou for this event. If possible, we wanted to hold onto a valuable asset like Sudou, who could shine in any sporting events selected after this. If Tennis or Ping Pong were chosen after this, then Sudou’s availability would be a major factor.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, looking at Class A’s lineup, it seemed they’d seen right through our hastily concocted plans. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“By the way, who was it who decided on the rules for the commander’s involvement? That they may ‘switch one player’ at any time? Was it Horikita-san who thought of that, perhaps? You do realize it made your intentions quite clear to us, don’t you?” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, but I can’t answer that.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Well, if you cannot answer, then I suppose there’s no use asking.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOn the other side of the monitor, preparations were quickly underway. The game would be starting before long. In the meantime, all we could do was stand by and watch things unfold. The only thing we could do in this event was see how things were going and substitute one player. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat one decision, however, could mean the difference between victory and defeat.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce the whistle sounded, the nerve-wracking 10-minute first half of the game began. Even though we didn’t have Sudou on the team, Class C played on an almost equal footing with Class A at the outset. It was neck-and-neck. One side scored two points, then the other one scored two points, too. Even the teachers found themselves drawn to watching the game, unsure of who was going to win.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMakida, the one we’d picked to lead our team, wasn’t bad at all. Even though he was nowhere near as good as Sudou, his skills were above average, and he carried the team fairly well as our ace player. Class A, had selected Kitou as their ace player, and he was keeping up with Makida, competing on even ground.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce we got through the first period, the score was twelve to eleven. Just a one-point difference. Class C had just barely taken the lead with a single point.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Quite a fascinating game,” said Sakayanagi, expressing her thoughts.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was hard to tell which team would come out on top. The second half of the game would begin after a four-minute half-time break. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi didn’t move. Even though we had a one-point lead, she must have judged both teams evenly matched and decided to just wait things out. I, however, reached for the keyboard in front of me without delay. Deciding to swap Sudou in, I pulled Ike out.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was certainly true that the teams seemed evenly matched at first glance. There was no way to tell how the game would play out, and as a result, I’d been hesitating over whether or not to put Sudou in over the past ten minutes.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Fu fu.”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Sakayanagi let out a slight chuckle. It didn’t seem like she was going to let us try and hold Sudou in reserve. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOn the monitor, Sudou was warming up. It would have made sense for him to have some doubts about being swapped in at this juncture, but his expression was serious. Apparently, he’d sensed the same thing I had.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The game’s still an even match. No, actually, Class\u0026#160;C has a slight lead. Don’t you think it’s a bit premature, calling him in now?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just thought I should make absolutely certain we pick up this win,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, this first game is quite important, so I understand how you feel. And there’s no guarantee whatsoever that Tennis or Ping Pong will be selected after this. If there is no event where you can make use of Sudou-kun, there’s no point in trying to hold him in reserve,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shouldn’t you be swapping out a player, too?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no need. We went into this game with a winning line-up from the very beginning.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKitou, who had been marking Makita before, was now marking Sudou. Sudou had been watching the game from the other room since it started. He should have noticed the gap in their abilities already. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter the four minutes were past, the second half of the game started. Kitou stuck to Sudou closely, and his movements were now twice as sharp as they were before.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Damn, I knew it… You were holdin’ back before, weren’t ya?!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could hear Sudou shouting through the monitor. I’d known all along that Class A had been holding back to make us bring Sudou out. But there was no way for us to tell exactly \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehow\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e much they were holding back until I pitted Sudou against them. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKitou stuck to Sudou fiercely, but Sudou was still a cut above, weaving through their defense and making it to their side of the court. The students from Class A desperately fought back against Class C, led by Sudou, to stop his advance. Even though Sudou was clearly head-and-shoulders above them, it seemed the Class A players were better than the other people on our team. The score was now seventeen to thirteen. The gap had widened. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, rather than looking more ragged, our opponents were gradually playing smarter and better.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Hey, Kitou! You do play basketball, don’t you?!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“No. You’re simply being driven into a corner by a bunch of novices.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“You friggin’ liar!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“There’s no need for me to lie. My teammates and I have only been practicing for a little less than a week. It seems like you’re quite confident in your basketball skills, but you’re not all that impressive after all.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Screw you!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince there was no cheering, I could hear Sudou and Kitou’s exchange through the monitor, albeit only faintly. Sudou, riled up thanks to his opponent telling him that he was struggling against a bunch of amateur players, was beginning to lose a little bit of his luster, his game starting to suffer.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFu fu\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. He is lying, of course. Kitou-kun is an experienced basketball player,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eGetting Sudou all riled up was probably part of Sakayanagi’s plan. She had likely instructed Kitou to do\u0026#160;so. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we shake him up with psychological attacks, Sudou-kun will break down. No matter how skilled he might be, if his mind is immature, it leaves a weakness for us to exploit.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe student named Kitou was quite good at basketball. He’d deliberately held himself back and pretended to be on even ground with the students in Class C, aiming to delay Sudou’s entry into the game and stage a come-from-behind win. And, if that plan didn’t work, he was going to try to win by riling Sudou up and breaking his concentration. Sakayanagi’s two-part strategy had brilliantly countered our plans.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’ll be catching up with you soon,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKitou sank another shot, bringing the score to seventeen to fifteen. Class A was on our tail. It certainly seemed Sudou’s disordered mental state would give way to an even playing field. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You said that Sudou is mentally immature. When did you get that information?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou had shown significant growth over this past year. So much so that his spirit wouldn’t be shaken by something like this. He knew Horikita was never going to praise him for looking cool during the game—but that she would value him leading our team to victory.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Oraa!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Ngh?!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though he was shouting and grunting loudly, he was back in top form. Sudou slipped past Kitou and blazed down the court like a man on a mission. No one could stop him. He made a magnificent dunk, putting Class C further in the lead.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Heh… I got a little hot-headed back there but… Ain’t no way you’re beating me.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKitou was good, but Sudou, having regained his cool, was definitely one or two notches above him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. So, he’s matured too, has he?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou didn’t falter again for the rest of the game. Instead, he skillfully pulled his team to victory. Eventually, we heard the sound of the whistle, signaling the end of the game.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Oh, yeah! I did it, Suzune!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou pumped his fist in the air, striking a triumphant pose. He was so excited that you might think he’d just won a championship game or something. Still, I could say this win warranted being overjoyed, considering how much he put into it. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well. I thought we stood a chance, but it would seem his skills are superior, after all,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed she’d been seriously trying to score a win in that first game, regardless of whether or not Sudou was put in. The final score was twenty-four to sixteen. The first event had ended in a spectacular win for Class C.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, who would’ve thought Class C would get the first win? I guess you never can tell,” mumbled Hoshinomiya-sensei, as if she were speaking to herself. She sounded genuinely impressed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, though we won, we’d ended up playing our trump card already. The moment that Sudou was put in the game, it had become an event where victory was absolutely mandatory.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e8.2\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE SECOND EVENT\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e was about to begin. The result of the drawing was…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eTyping Skills\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRequired Participants: 1 Person\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAllotted Time: 30 Minutes \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRules: A competition of speed and accuracy, focused on three categories of Typing Skills: Vocabulary, Short Answer, and Long Answer.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCommander: The commander will be allowed to notify the participant of one mistake that they’ve made during the exam.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was also an event that Class C had submitted, a one-on-one competition. Apparently, luck was on our side. This event was suggested by the Professor, who was the best at all things related to computers in our class. In fact, he was in a league of his own in Class C when it came to typing speed. He seemed to be unquestionably fast, even compared to the national average. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat didn’t mean we were home safe. We had no way to ascertain how many students in Class A had good typing skills, and just how good those skills were. All we could do was trust in the Professor’s skills. Nothing more. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut there was a reason why we’d decided to go with this event.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My, another interesting event chosen by Class C. Although it might seem frivolous at first glance, typing is a fundamental skill in the world of information technology. You might even say it’s an \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eessential\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e skill. I suppose it’s understandable why the school would accept such an event,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass A had a fundamental advantage when it came to academics. Horikita had probably wanted to choose skill-based events where academics wouldn’t play as critical a role in determining the outcome. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose that everyone has one or two things that they’re good at. It’s difficult to conclusively say you’re better than others when it comes to actually competing in a field like this, though. You must have someone who claims to be quite confident in their typing skills,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eGenerally, students who were skilled enough to win in a one-on-one competition had a high chance of shining in other events, too. Like putting Onodera, who was a proficient swimmer, in play for basketball. At the other end of the spectrum, putting a student who was only good at one specific thing, like the Professor, in a one-on-one match gave us an advantage in future events. So, naturally, I chose the Professor… Sotomura Hideo.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOn the other hand, Sakayanagi chose Yoshida Kenta. Someone I had practically no information about. For this event, we’d tried to limit the commander’s intervention as much as possible. Our strategy was to prevent Sakayanagi from butting in to the extent we could. The scoring would be handled by a computer-based application prepared by the school. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd the results were…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Class C, Sotomura Hideo, ninety points. Class A, Yoshida Kenta, eighty-three points. Class C wins,” announced Sakagami after the exam was over.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA difference of a mere seven points. I honestly felt a bit of a shiver go up my spine when I heard those results, but I supposed a win was a win, even if it was only by one point.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, even though we were close, it would appear we fell short. I suppose things aren’t so simple for us, after all.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass A losing twice in succession was an unexpected development, but in some sense, it was unavoidable. Both of those events were chosen by Class C, so there was hardly anything Sakayanagi could have done.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e8.3\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eND SO\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Class C had won the first two battles. So far, in addition to having luck on our side, it looked like Horikita’s strategy was coming together brilliantly. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were eight events remaining. We would have loved to keep drawing from the ones our class had submitted, but…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eEnglish Test\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRequired Participants: 8 Persons\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAllotted Time: 50 Minutes\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRules: Students will answer a set of questions within the scope of what they would find in the first-year curriculum. The winner will be decided based on total points.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCommander: The commander can answer one single question on behalf of a participant.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe third event was a written test. Something I’d figured was coming sooner or later. The crux of this special exam was figuring out how to win the events that your opponent had selected. If we managed to win this one, we’d gain an even bigger advantage than simply racking up another win. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI put together a line-up of students who were good at English, starting with Mii-chan. That being said, it was frustrating that I couldn’t make use of trump cards like Horikita and Keisei here. Since there were three proposed written exams—English, Mathematics, and Contemporary Literature—distributing our limited number of academically skilled students got tricky. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita’s notes contained two strategies for the event that two written exams were chosen. The first strategy was to go for the win in both tests by taking a balanced approach with the participants. The other strategy was to lose one on purpose and to focus our efforts on the other. Sakayanagi had quickly settled on which eight students she’d be using, but I took a bit of time to think. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is the first time you’ve stopped to think at length. It would seem Horikita-san had left you with more than one option.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no guarantee that the mathematics test would be chosen later. But there was no guarantee that we’d win, either. What frustrated me the most, however, was that Class C tended to struggle more with English. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had to choose between these two strategies. Either go with a balanced approach for both or lose one on purpose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you going to give up on English? Or perhaps…will you fight with everything you have?” asked Sakayanagi, unable to rein in her excitement. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t like I was afraid of losing here though.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know what you’re thinking, Ayanokouji-kun. You’re afraid that Class A anticipated your idea to abandon the English test and is preserving our strength for later, too. It is true that Class C might win if we use secondary participants for this exam. Discarding that opportunity isn’t an easy choice to make, is it?” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter giving it some more thought, I decided to give up on the English Test. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In terms of global trends, girls seem to be more proficient in various subjects than boys, and they tend to score higher. English is one of those subjects. Of course, we’re just talking about trends, is all. Just for your reference,” she added, just as I was about to decide on which students to put in.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was trying to put pressure on me by giving me extraneous information. At any rate, Class A didn’t want to lose this test. They’d likely be coming into this with a capable roster. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter we both selected our rosters, they were displayed on the monitor. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass C’s eight students were: Okiya Kyousuke, Minami Hakuo, Karuizawa Kei, Satou Maya, Shinohara Satsuki, Inogashira Kokoro, Sonoda Chiyo, and Ichihashi Ruri.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass A’s eight students were: Satonaka Satoru, Sugio Hiroshi, Tsukaji Shihori, Tanihara Mao, Motodoi Chikako, Fukuyama Shinobu, Rokkaku Momoe, and Nakajima Riko. While they weren’t the best options Sakayanagi could have gone with, it was still a solid team. It seemed she was putting the information she’d mentioned to me earlier into practice, considering that six people in her lineup were girls.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would seem you’ve opted to give up on English and focus on the events to come. A passably accurate decision.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed it was safe to say that she had a detailed understanding of Class C’s academic abilities after all. Even though I had enough wiggle room to go in and influence one question, all I could really do was sit back and watch this battle unfold. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe were able to switch between viewing the students’ answer sheets in real-time during the test. I put my ability to intervene to use and helped with a problem that many students were struggling with. But the impact of my doing so was minimal at best. It would only influence the scores by a matter of a few points. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone’s tests were graded immediately, and shortly afterward, we were given the final results. The outcome of the test was based on the total score of all eight participants.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Class C, a total of four hundred and forty-three points. Class A, a total of six hundred and fifty-one points. Therefore, Class A is the winner.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was an overwhelming difference in our scores, just as I had expected.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We only managed an average score of eighty-one points per person. Had Class C gone all out in this text, you might have actually stood a chance at winning,” said
