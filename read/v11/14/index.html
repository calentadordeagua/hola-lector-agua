Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe made it sound like there was an opportunity there that we could’ve taken advantage of, but it wasn’t that simple. It was probably better for me to consider it a win that we’d gotten out of this how we had. The courage Sakayanagi displayed in holding back her best students even after losing three events in a row was impressive. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as Class A was presented with their first win, selection for the fourth event was immediately underway.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eMathematics Test\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRequired Participants: 7 Persons\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAllotted Time: 50 Minutes\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRules: Students will solve a set of problems within the scope of what they would find in the first-year curriculum. The winner will be decided based on total points.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCommander: The commander can answer one single question on behalf of a participant.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnother written test, right after the English Test.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would seem that your decision to hold people in reserve has borne fruit. I suppose you’ll be going all out, now. Or perhaps…you’ll wait for Contemporary Literature?” asked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wasn’t even thinking about Contemporary Literature. I was going to invest all of Class C’s academic ability in this exam.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Earlier, I had said that girls tend to score higher than boys, but for mathematics, it’s the opposite. Apparently, it would seem boys tend to surpass girls in that subject. Interesting, no?” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo matter what ideas she was trying to plant in my head, it wasn’t going to change my lineup. My seven picks were: Hirata Yousuke, Yukimura Teruhiko, Ishikura Kayoko, Wang Mei-Yu, Azuma Sana, Kushida Kikyou, and Nishimura Ryuuko. This was the best possible team that I could get out of Class C. I couldn’t use Horikita and Kouenji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOn the other hand, Class A’s lineup included Matoba Shinji, Shimazaki Ikkei, Morishige Takurou, Tsukasaki Taiga, Ishida Yuusuke, Yamamura Miki, and Nishikawa Ryouko. Her team was mostly made up of guys. It was also a lineup of students with just as much academic skill as her previous team, if not more. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBefore long, the Mathematics Test was underway. Unlike the English Test, which was a devastating loss, things went well. Yukimura Teruhiko—Keisei—took the top spot, with almost no incorrect answers. I gave Nishimura, the student I expected to get the lowest score, the headset. But it wasn’t like helping her with just one question would really change the outcome that much. And considering the fact that Sakayanagi would undoubtedly be answering correctly, that the commander getting an answer right was essentially a bare minimum requirement for this test. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter the test was finished, the teachers immediately began grading them. Since this was an event that Class A chose, if we managed to win this test, our chances would grow significantly. Then we’d be able to take on the fifth event with the possibility of going for a total shut out, winning the entire special exam.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, I will now announce the results for the Mathematics Test. Class C, Six hundred and thirty-one points.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOur average score was ninety points per student, then. More than satisfactory results. However, the test problems not being that difficult might also be cause for concern.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And the results for Class A… Six hundred and fifty-five points. Class A wins.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakagami-sensei reported the results. We had lost by a slim margin, a mere twenty-four-point difference. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That was a close one. Everyone in Class C must have studied quite a bit. If you had included Horikita-san and Kouenji-kun in your lineup, you would’ve won, don’t you think?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Maybe.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a shame we hadn’t won the Mathematics Test. It was certainly true that we might have, had I put in Horikita and Kouenji. But it also wasn’t guaranteed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis also meant that if the Contemporary Literature Test came up as the next event, we would lose almost automatically. There was no one left in Class C with the academic skill to surpass what Class A had to offer. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat brought us to two wins and two losses. We had lost the lead and things were even.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e8.4\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eND NOW\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the fifth event was drawn.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eFlash Mental Arithmetic\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRequired Participants: 2 Persons\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAllotted Time: 30 Minutes\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRules: Victory will be awarded to the class of the student who places first in terms of both accuracy and speed, using abacus-style mental arithmetic. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCommander: The commander can change the answer for just one question of their choosing. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnother event that Class A had proposed, the third in a row. Normally, this would’ve been an unfortunate development, but this particular event was a special case. Keisei was probably feeling happy enough to start doing a little jig. This was the event in which Katsuragi had promised to take it easy on us. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, it was still far too early to celebrate. If Katsuragi wasn’t put in, then our chances of victory would go up in smoke, never to be anything more than a mere fantasy.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Another Class A event. We absolutely cannot afford to lose this one,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI followed Horikita’s strategy and put in Kouenji Rokusuke and Matsushita Chiaki. I had Matsushita wear the headset. Even if Kouenji had it, there wasn’t any guarantee that he’d actually listen. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita’s idea to put Kouenji in for the Flash Mental Arithmetic event was probably the right call. Victory wasn’t determined by overall score in this event, but by who placed first. It was possible that Kouenji would rise to meet our expectations and give us the win, but in the event that he didn’t take it seriously, we could use Matsushita as a backup. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was a quick thinker, so we had planned to use her in the Mathematics Test or the Flash Mental Arithmetic event. But even if we’d used her in the previous test, there was no guarantee we would’ve won. I supposed you could say it was a blessing in disguise that we hadn’t, since it meant we could use her here. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe students Sakayanagi chose were Katsuragi Kouhei and Tamiya Emi. According to what Katsuragi had told us in secret, Tamiya’s abilities weren’t all that impressive, apparently. Katsuragi was the one wearing the headset, almost as proof of that fact.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There will be ten questions in total. The questions will progressively become harder and harder, but they’ll also be worth more points. In the event that there’s a tie for first place, the test will be extended into overtime until someone gets a question wrong.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNumbers would be displayed on the monitor in the multi-purpose room. Since the commander could only step in for one question, we would inevitably do so toward the end. Even though the test was just about to begin, Kouenji folded his arms and closed his eyes. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I guess the plan backfired, huh,” I muttered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHis attitude hadn’t changed at all since the special exam began. Single-digit numbers flashed three times, for five seconds. It was a difficulty level of ten. The numbers that showed up were: six, nine, and one. The answer was sixteen. It was a problem anyone could solve. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe students wrote down their answers. Matsushita got it right without trouble, but Kouenji didn’t answer, leaving his paper blank. Considering he hadn’t even looked at the problem, that was unsurprising. It looked as though we could only hope that Katsuragi would make a mistake, just as he promised he would.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFu fu\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. He certainly seems like an odd one,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though she couldn’t see his answer, she could tell that Kouenji hadn’t written anything down.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But, since Matsushita-san is your actual contender, I suppose there isn’t really a problem, hm?” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs she spoke, the test continued. By the third and fourth questions, they were dealing with two-digit numbers, flashing six times. Matsushita was still unfazed and continued to answer questions correctly. But as they got to the halfway point, the difficulty level jumped. In the fifth question, three-digit numbers flashed six times, for five seconds. In the sixth question, three-digit numbers flashed eight times, for five seconds.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMatsushita looked like she was at her wits’ end, frantically trying to make the calculations in her head. She had managed to get all the right answers so far, and she hung on somehow, getting the sixth question right too. But that was as far as she went. For the seventh question, three-digit numbers flashed twelve times, for four and a half seconds. For the eighth question, three-digit numbers flashed fifteen times, for three and a half seconds. And the ninth question had fifteen three-digit questions for two and a half seconds.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“J-jeez, these are impossible!” wailed Hoshinomiya-sensei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could definitely understand how she might feel at her wits’ end looking at these questions, just as a student would. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“These seem like they might be far too difficult…” agreed Sakagami-sensei, not finding the answers himself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMatsushita had gotten everything correct up until and including the sixth question. Unfortunately, she didn’t get the right answers to the seventh question onward. Kouenji hadn’t answered any of the nine questions so far. At this point, even if he answered the last question correctly, it wouldn’t matter at all. He had already gotten to the point of no return.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNaturally, I had memorized the answers to all nine of the questions. I was sure Sakayanagi had done the same. The commander had the right to change the answer to only one question. My plan was that if I couldn’t solve the tenth problem, I’d fill in the ninth. If I couldn’t solve the ninth, then I would solve the eighth. How much Katsuragi had purposefully gotten wrong for us would greatly impact whether we’d win or lose this event.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe tenth and final question was now displayed. Several three-digit numbers were displayed for 1.6 seconds, flashing fifteen times. The numbers flashed and disappeared in an instant, repeatedly, fifteen times. For a moment, everything went silent. No one picked up their pens—not Katsuragi, Matsushita, and not even Tamiya. They sat in mute amazement, letting the question pass.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi signaled to the teachers that she wanted to intervene. Of course, I did the same.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh…? Oh, in that case, commanders, please provide the answer for one question. Of course, the later problems are worth more points.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNaturally, the question I thought I ought to answer was the last one. Matsushita obediently wrote down the answer that I had given her over the headset. She didn’t know the answer herself, so she didn’t have any reason to doubt me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Fu fu fu. Flash Mental Arithmetic. Quite an interesting game. This is the first time I’ve done it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji, the person that Sakayanagi and I had already put out of our minds by this point, had apparently opened his eyes at some point. An amused smirk on his face, he cast his gaze toward the surveillance camera that we were seeing the event through.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun, what question did you provide an answer for? I chose the tenth question, with an answer of seven thousand six hundred and nineteen,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe answer I gave to Matsushita was…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The same. I gave the same answer.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, Sakayanagi had gotten the last question correct, too.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would seem that in terms of what the commanders can do, we’re evenly matched here. Meaning this all comes down to how Katsuragi-kun and Matsushita-san perform.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs everyone’s answer sheets were being collected, the man who had left all ten questions on his sheet blank opened his mouth to speak.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“The answer to the last problem was seven thousand six hundred and nineteen, was it not?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, well. That’s quite a surprise. Kouenji-kun is correct,” said Sakayanagi, offering him words of praise after hearing him give the correct answer.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe teachers hurriedly started calculating all four participants’ scores. If Katsuragi had gotten questions seven, eight, or nine correct, we would lose. But if he had gotten fewer than six questions right, we would win. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“After tallying the results, we’ve found that the student with the highest score, with eight out of ten questions answered correctly, is Katsuragi Kouhei. Class A wins.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe’d hoped to take the win in our fifth round and gain the advantage. But in the end, Katsuragi was the one waving the victory banner. So, with Sakagami-sensei’s declaration, the fifth event had come to an end.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Quite unfortunate, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Was trying to win against Katsuragi a mistake?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It is most certainly true that he harbors much resentment toward me. It wasn’t wrong to try and take advantage of that fact. However, do you really think that I would carelessly overlook such a weak point?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though I couldn’t see her, I knew that Sakayanagi was smiling.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I gave him a message ahead of time. I told him that if he were to betray me, I would randomly expel some of the students who were earnestly trying their hardest in our class. He does seem to care quite a bit about his fellow students. He would never let more people be sacrificed to serve his grudge,” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi had been around Katsuragi for far longer than I had. She was all too familiar with his strengths and his weaknesses. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My, being defeated after you thought you would win must be extremely taxing, mentally. Are you feeling anxious about the final event?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Couldn’t say.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Still, Katsuragi-kun not taking your side wasn’t the only problem. Had Kouenji-kun taken things seriously from the very beginning, it’s possible he could’ve gotten a perfect score. Meaning, you might have won this round, yes?” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s all a big ‘if’, though. Having power you can’t control is as good as having no power at all.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was functionally no different from not being able to count on students who lacked academic skill, physical prowess, or other special skills to really contribute to your efforts. Students who took nothing had nothing to contribute. They might seem different, but it came to the same result. At least in this exam. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, we had to assume some of the blame for this, too. We’d failed to persuade Kouenji to do anything.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd so, we were now at two wins and three losses. Class C was teetering at the edge of the cliff.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Two more events and this special exam will be over. It truly is a shame,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could hear her let out a sigh. She must have wanted to enjoy this moment as much as possible.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now that it’s come to this, winning, losing, it all feels so trivial,” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, I’d love it if you could give us the win,” I\u0026#160;told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unfortunately, I cannot do that. This is a serious competition, after all.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakagami-sensei kept things moving. The drawing for the sixth event had begun. If another Class A event was drawn, there was no way we would win.\u003c/span\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 8: Ayanokouji VS. Sakayanagi\",\"volumeId\":\"v11\",\"chapterIndex\":14,\"prevChapter\":{\"volumeId\":\"v11\",\"chapter\":13,\"title\":\"Chapter 7: A Man’s Tears\"},\"nextChapter\":{\"volumeId\":\"v11\",\"chapter\":15,\"title\":\"Chapter 9: Class B VS. Class D\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Title Page\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Sakayanagi Arisu’s Soliloquy\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: The Teachers’ Battle\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: The Final Battle of The First Year\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: Opponents\",\"href\":\"Text/section-0008.html#auto_bookmark_toc_top\",\"index\":10},{\"label\":\"Chapter 5: What the Class is Lacking\",\"href\":\"Text/section-0009.html#auto_bookmark_toc_top\",\"index\":11},{\"label\":\"Chapter 6: Good and Evil\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_top\",\"index\":12},{\"label\":\"Chapter 7: A Man’s Tears\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_top\",\"index\":13},{\"label\":\"Chapter 8: Ayanokouji VS. Sakayanagi\",\"href\":\"Text/section-0012.html#auto_bookmark_toc_top\",\"index\":14},{\"label\":\"Chapter 9: Class B VS. Class D\",\"href\":\"Text/section-0013.html#auto_bookmark_toc_top\",\"index\":15},{\"label\":\"Chapter 10: The Line Between Winner and Loser\",\"href\":\"Text/section-0014.html#auto_bookm
