],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T17c72,"])</script><script>self.__next_f.push([1,"\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 10:\u003cbr/\u003eThe Line Between Winner and Loser\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE SIXTH EVENT\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e that was chosen was archery, a two-on-one event. Another one of ours. Class C had won thanks to Akito’s efforts, making our score now three wins and three losses. Sakayanagi made no particular comments about this, but quietly watched the event play out. It was almost like she\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e wanted \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eus to get to three wins and three losses.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUp next was the long-awaited seventh and final event. And, through a mischievous twist of fate, that event was…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eChess\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRequired Participants: 1 Person\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAllotted Time: 1 Hour (Going over time results in a loss)\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRules: Standard chess rules apply. However, the allotted time will not increase, even after the forty-first move.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCommander: The commander can give instructions to their respective player for up to a maximum of thirty minutes at any time. Time spent by the commander in this way will use up the allotted time.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were no provisions to add time, such as Fischer Rules. This was probably a concession Sakayanagi had made to get the school to approve adding the event to the roster, as chess tends to take a while. A single match could take two hours or more, so I assumed the time limit was set to one hour for this same reason. That made sense.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Three wins and three losses each, and now we’re going into the seventh and final event. I couldn’t possibly be any happier. I can’t believe that \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethis\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e event was chosen as the final one… My, it seems that good things do come to those who wait, after all,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe probably intended to intervene at a critical moment in the game and provide instructions to her player. Actually, we were most likely going to intervene at roughly the same time. Considering the rules for commander intervention, I didn’t see myself beating Sakayanagi without giving it my best effort.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Doesn’t the fact we drove you this far into a corner mean that Class A miscalculated?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would seem so. I must admit you put quite a bit of pressure on us in the sports events,” she replied, thinking back to the six we’d had so far. “However, the seventh event will be a little different. The commander’s abilities will have a significant impact on how this battle plays out.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m afraid I happen to be pretty good at chess.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom this point onward, Sakagami-sensei and Hoshinomiya-sensei would witness our match. It was probably smart to take some precautions. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My, oh, my… What a coincidence! Perhaps choosing chess was a mistake on my part, then,” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut first, the preliminary match was about to begin. A\u0026#160;battle between the students we’d picked from our classes. I chose Horikita Suzune from the list of students who hadn’t yet participated in any events. Sakayanagi, on the other hand, chose…Hashimoto Masayoshi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh ho, so Horikita-san makes an appearance, after all. Even though she’s an exceptional student, you didn’t use her until now because you wanted to hold her in reserve until the final event, hm?” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no need for me to hold onto my trump card anymore.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe informed the teachers of our selections so that they could get the match started.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you sure you don’t need to get a drink of water or anything?” said Hoshinomiya-sensei, worried that we hadn’t left our seats once during the entire exam.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you for your concern. However, there’s no need to worry.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m all right, too,” I added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that so? Well, all right then…” replied Hoshinomiya-sensei, letting out a sigh. The tense, strained atmosphere must be getting to her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems like preparations are complete. Let us now begin the seventh event: chess.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt Sakagami-sensei’s instruction, Sakayanagi and I stopped our idle chatter at once. The stage they had prepared seemed to be in a corner of the lecture halls. A chessboard had been set there.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Hello.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBoth Horikita and Hashimoto slowly bowed to one another. The final battle was about to begin.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e10.1\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eC\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHESSBOARD SAT\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e in front of me. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA week ago, I didn’t even know the rules. And here I was, right now, touching an actual chess piece for the first time in my life. Training with \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehim\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e online had made me come to understand the fascination and complexity of chess. If Ayanokouji-kun or Sakayanagi-san were my opponent, then my chances of winning would probably be one in a million.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, the student I was squaring off against wasn’t either of those two people. I had no idea how skilled Hashimoto-kun was, of course, but I couldn’t imagine he held a candle to either of those two.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good luck, Horikita.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy opponent addressed me casually. Based on what I’d heard, even the students in Class A considered him something of a charlatan. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, come now, don’t make such a grim face. Why not try to enjoy this?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Someone who spent the last year in Class A couldn’t understand how important this battle is to us, in Class\u0026#160;C,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it sure would suck to have a ton of class points deducted if we lose this. That much is the same for us as it is for you.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe class that won this chess game would get one hundred and thirty points. This really was a monumental battle. One that would decide whether we could secure those points to finish out our first year.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“By the way, do you remember my name?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve never spoken with you before, but it’s Hashimoto-kun, I believe.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh ho, what an honor. I mean, they say Horikita from Class C is a bit of a celebrity, y’know? If I remember right, I think I first heard your name back when you really pulled the rug out from under Ryuuen during the uninhabited island exam.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI hadn’t done anything back then. It was all part of Ayanokouji-kun’s strategy, which he had carried out from behind the scenes. Well, no…I supposed he might not have considered that a strategy at all.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, I’ve only been playing chess for a couple months. Go easy on me, okay?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unfortunately, I should be asking you that. I’ve only been playing for about a week.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh ho…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe battle had already begun. Even though my experience with the game consisted of just practice matches, I knew anything said during this match could be a mixture of truth and lies. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChess was a game where you and your opponent tried to keep each other in check while simultaneously exploiting any cracks you found in their mentality. The school was quite lenient about students talking to one another during this exam, with the exception of the written tests, where answers could be said out loud. Ayanokouji-kun and Sakayanagi-san, the commanders, had almost certainly been sparring verbally just like this. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd now that the score was three wins and three losses, everything came down to the seventh event. All thanks to Hirata-kun’s return, Sudou-kun keeping his wits about him, and the collective efforts of a number of our classmates. The issue of Kouenji-kun was certainly something I needed to reflect on, but that could wait for another day. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI absolutely could not afford to squander this chance and lose this battle. I recalled what Ayanokouji-kun had said to me before the exam this morning. A statement so arrogant it left me stunned. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“No matter who I’m up against, there’s no one out there stronger than me, even when I’m slacking off.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile it was certainly irritating, for some reason, I felt like I could put faith in what he said. If Hashimoto-kun was no match for him at all, then I had a chance to win. For some reason, I felt like there was no way I could lose. I wonder why?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven before the battle started, all I could think about was how it felt like I had the upper hand.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_8\" src=\"/hola-lector-agua/images/books/v11/OEBPS/Images/INTERIORIMAGES_8.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We will now begin the seventh event, Chess. Both players, please take your seats.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFollowing the teacher’s instructions, I took my seat. The smile never left Hashimoto’s face, but it didn’t reach his eyes. The outcome of this game would directly decide the fate of our classes. It seemed that Hashimoto-kun was feeling the pressure in this situation, too.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Welp, let’s get started, yeah?” said Hashimoto-kun, picking up two pawns, one black and one white. “You know how to decide who goes first, right?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter I told him I understood, he closed his hands, the pieces hidden, and presented both hands to me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Left,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUpon hearing my answer, he opened his hand, revealing the white piece.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat meant that I was going first.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m lookin’ forward to seeing what kinda opening move you’ll make.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not sure I can match your expectations.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI took the white chess piece. This was the first time I’d touched one, and it felt nice and cool. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd so, the seventh event—the battle between Hashimoto-kun and I—had begun.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy first move: pawn to E4. Just as the game officially started, Hashimoto-kun’s smile had briefly faded. He moved a black piece: pawn to E5. I quickly moved my knight, planning to take his pawn. Through all of the games I had played with Ayanokouji-kun, this was the playstyle that I had the most confidence in. I would control the flow of the game based on how my opponent reacted as they tried to defend their black pawn. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y’know, I learned a lot from Sakayanagi, too. You think I’m gonna let you start the game off by putting black at a disadvantage?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter those first moves, we both proceeded to make our next ones without spending too long thinking about them. The time limit was one hour. But Ayanokouji-kun had said to use thirty minutes, meaning that was all I had. I had no time to waste.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs we played, I realized something. My opponent was refusing to play defensively. Sakayanagi-san must have taught Hashimoto-kun to play this way, as it didn’t seem like a conventional playstyle at all. He was making offensive move after offensive move.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Pretty screwed-up playstyle, huh?” said Hashimoto-kun.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. Did you inherit this playstyle from your instructor?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yep. Sakayanagi played this way against me. I guess it’s like, when she taught me, this one just clicked for me the most, y’know? But, well, yours is different from mine. Seems pretty solid… You self-taught?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was probing me for information. What was he hoping to get from my response, I wondered?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve been single-mindedly focused on playing chess over this past week. I pushed everything else aside.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh… Wait, so were you confident that chess would get chosen as an event?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re free to think that.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe position of the pieces changed at a dizzying pace with each move we made. At first glance, it seemed he was trying to keep me in check and box me in. But each of my moves was focused on encroaching on Hashimoto-kun. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you really only start playing this last week?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You seem to love talking.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Talking is the only thing I’m good at.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs long as he said nothing inappropriate, he could talk all he wanted, as per the rules. I had no right to stop\u0026#160;him. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. Just one week. Of course, there’s always the possibility that I’m lying,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, if you really only have been playing for a week, then I can’t imagine you’re self-taught. You must have been drilled quite thoroughly by a confident chess player, just like how I was by our princess. Hm?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder. I can’t say, either way.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had no intention of carelessly giving him unnecessary information.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, whatever. Hey, more importantly, can we talk about Ayanokouji a little?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWas that okay? It seemed he had no real interest in my history with the game or whether or not I had a teacher. He’d just used it as a conversation starter, and his real interest was Ayanokouji-kun. So even Hashimoto-kun was starting to pay attention to him, hm?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What did you want to ask?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ever since everything that happened on the uninhabited island, I’ve been wondering if Ayanokouji’s really the one secretly pulling strings behind the scenes.” he replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was trying to rattle me. This was probably one of the reasons why he’d been chosen to play against me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why do you think that?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just intuition is all. So, gimme an answer, Horikita.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Answer what? I don’t have the faintest idea what you’re talking about.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That a fact? You look pretty shaken up, though.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When I learned you were going to be my opponent, I anticipated you would try to rattle me like this,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Heh.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No matter what you do to try and shake me up, you’re not going to break me.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI moved the white bishop in to check Hashimoto-kun’s king. His broad grin disappeared momentarily again.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you really have the luxury of continuing this conversation?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow after, after keeping quiet for so long, I would begin launching my counterattack.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Things are gettin’ interesting…” muttered Hashimoto-kun.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNext thing I knew, the tide had started to turn in my favor. He was by no means a weak opponent, but I’d seen through every move he made. Every single one was as I expected. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNot even ten minutes had passed since the game began, but his hands had stopped. For the first time since the game began, Hashimoto-kun stopped to ponder his moves. The look on his face—the one so full of confidence that nothing fazed him—had vanished entirely.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whew. Man, you’re good, Horikita. You’ve got such a cute face, but you’re crazy tough.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re quite good yourself, despite your outward appearance.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aww, come on now, no need to flatter me. I mean, it’s like they say, there’s always someone out there better than you, right?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf the game continued like this, my victory was assured. That was how things were going. There was no way a skilled player like Hashimoto-kun hadn’t picked up on it, too. But…there was no way this match would be settled that easily, either.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e10.2\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eH\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eORIKITA AND HASHIMOTO’S\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e game was displayed on the monitor. He’d repeatedly made offensive moves at the outset, but Horikita had handled them calmly. She kept her cool, calmly avoiding being backed into corners that might make you reflexively want to use your pieces to defend yourself. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs the game steadily progressed, she gained the upper hand. They were approaching the midpoint, and Horikita’s victory was beginning to look like a reality. Yes—Horikita had the advantage in this game. She was demonstrating a level of skill that far surpassed what I’d seen when we were practicing.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Quite an interesting match. It makes me want to watch it all the way to the end,” observed Sakayanagi casually, no sense of panic in her voice.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I agree. Let’s watch the game all the way to the end,” I\u0026#160;told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFu fu\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, yes, all right… Well, that’s what I’d \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003elike\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to say, but I’m afraid I cannot. It’s not as though I lack faith in Hashimoto-kun, but rather that Horikita-san seems quite calm and collected. His specialty, his conversational skills, don’t seem to be having an effect on her,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, she was going in now, huh? A message saying Sakayanagi was exercising her commander’s ability to involve herself in the game was displayed on the commander. She’d probably decided Hashimoto’s defeat would become a certainty if she let this go on any longer. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIntervening before they even got to the halfway point was probably contrary to her plans. But her decision was the correct one. If she’d simply stood by and watched the game even a little longer, it would’ve progressed to a point where the outcome was pretty much decided.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt all spoke to how terrifyingly skilled Horikita was right now. I did feel tempted to just wait and watch her. I wanted to see how much she had grown. I was curious to see what kind of moves she’d make, playing against Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re not going to enter the game, Ayanokouji-kun?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’ll probably have a better chance of winning if I leave things to Horikita right now, rather than carelessly jumping in myself.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. In that case, I trust you have no objections if I go in and turn the tides in our favor, hm?” she answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe tapped the keys on her keyboard. Hashimoto, who had been lost in thought for a while now, sprang back to life like a fish that had just been returned to the water. The commander’s thirty-minute timer paused the moment that they pressed the Enter key on their keyboard, probably out of consideration for the time lag before transmissions. The countdown would restart the moment their opponent made a move.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita versus Sakayanagi. I was hoping they’d be evenly matched. If they were, it was possible Horikita might be able to ensure that her advantage didn’t slip away from her. But I doubted things would go that smoothly. Sakayanagi had entered the match with absolute confidence. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could tell Horikita was beginning to feel flustered after seeing Hashimoto make a move she hadn’t expected, based on how the game was going so far. She stopped to think, pondering how to fight this battle when her opponent had been replaced with someone far more capable than she was. Carefully making use of the time she’d saved during the game’s onset, she made her move. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Perhaps you didn’t provide her with enough time as a handicap?” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEvery time Horikita made a move, Sakayanagi took less than five seconds to counter it. She responded immediately, her moves targeting the chinks in Horikita’s armor. Any chance at victory that Horikita had secured was erased in the blink of an eye. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow, only a faint glimmer of Horikita’s lead still remained. Her hands stopped moving. Even though she was a beginner, she could probably see what was happening. She was feeling despair, playing against an opponent she was no match for. She was being manipulated, backed into a corner. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTwo minutes. Three minutes. Horikita couldn’t even move anymore.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was the line. The line that separated the winner and the loser. Horikita was starting to feel the pressure. I\u0026#160;gave her the signal that I was going to jump in and take the baton from her. I gave Horikita instructions via the headset, with text-to-speech.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita looked up at the camera for a brief moment. Then, she nodded, expressing that she would leave all the thinking to me. This was no longer a battle between Horikita and Sakayanagi. It was me against Sakayanagi. One on one.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now then, at long last…our match finally begins,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks that way,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI only had thirty minutes, but that was more than enough time to see this through. Sakayanagi and I continued talking while our hands flew across our keyboards, never stopping. We both spent from ten to at most twenty seconds on each move. Each time we pressed the Enter key and sent our instructions, the timer would stop counting down for a while.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaving watched the game to roughly its midpoint, I could already see how things were going to go from here. Our pieces continued to glide across the board smoothly, without hesitation. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Whoa, hey, what kinda of otherworldly playstyle are you even using…?!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could hear Hashimoto’s voice over the monitor, as he cried out in response to the instructions he was given.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Now it seems like our match was just pathetic\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e…” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“…You got that right.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTheir shock was understandable. The difference between them and us was the difference between an amateur and a professional. They might not even be able to tell which side had the advantage or disadvantage by looking at the board. No… It was more than that.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs soon as I started playing, I was forced to understand something that made me gasp. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi’s chess skills were \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eincredible\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. Enough to be genuinely worthy of my respect. I wouldn’t be surprised if she went on to make a name for herself as a professional chess player. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had learned how to play chess in the White Room when I was very young. I had played against a number of instructors considered to be professionals. But she was better than any of them. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what do you think, Ayanokouji-kun? Have my moves touched you?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. Painfully so.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven after the game passed the midpoint and entered its second half, rather than widening the gap between us, I was working as hard as I possibly could just to stop her from closing in on me. If I made even a single mistake, she would probably rush me all at once.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry. There’s absolutely no way you would ever make a trivial mistake, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If that’s the case, it’d help if you just gave up.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m afraid that’s something I cannot do. If you aren’t going to make a mistake, I’ll just have to use my skills to break through by force.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita and Hashimoto had been rendered speechless some time ago. They were nothing more than the vessels through which Sakayanagi and I moved our pieces. Eventually, well into the final stages of the game…Sakayanagi’s hands stopped moving. Normally, I would’ve been able to intuit what move she was going to make. But…she was mysteriously lost in thought.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince we’d been issuing directions so quickly until now, Hashimoto looked shaken. Sakayanagi wasn’t saying anything, but her silence might be precisely what made him suspect she was in trouble. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter a few minutes of silence, she made her move. And the move that she made after that long period of thought was an incredibly good one. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d made no mistakes. And I had no intention of giving her any openings to take advantage of. However, even so…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis time, my hands stopped.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, my, what a wonderfully fun time this has been! I\u0026#160;don’t even care about the spectators anymore. I just want to make this the best game of my entire life. That’s all I wish for in this moment,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t know how familiar Hoshinomiya-sensei and Sakagami-sensei were with chess. Even so, they could both probably sense what an incredible game this was. One minute. Two minutes. Time continued marching on. I was burning through a frustrating amount of the time I’d been saving up. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“What… What are you doing, Ayanokouji-kun\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e?” wailed Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI heard her voice come through the monitor. She had been quietly observing the game.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“You only have about five minutes left…!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI knew that. This was a complex game, where the thoughts of four people were intertwined in a single match. Horikita and I undoubtedly had the advantage before, but now, things were completely even. My next move would be the difference between life and death. No matter how much time I took to ponder this situation, it wouldn’t go to waste.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re not the kind of person who would stop right here, at this level, are you, Ayanokouji-kun? Please show me.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRather than winning, Sakayanagi was only interested in drawing out the full extent of my skill. Things like winning or losing this exam probably didn’t matter to her anymore, as long as she could enjoy this game. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had less than three minutes left. The pattern I’d envisioned for the game’s end was wiped clean, returning me to a blank slate. I started building a new path toward victory. Just before the two-minute mark…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy fingers tapped the keyboard, and I gave instructions to Horikita, who sprang into action like she had been waiting for me. The piece flew about the board with intense energy. Hashimoto looked flustered once again. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThings had been going smoothly for Sakayanagi so far, but she now took longer to make her moves. The next one took thirty seconds. So did the one after that. The one after that took one minute. On the other hand, I was only taking one or two seconds to respond. Sakayanagi and I were now walking, hand in hand, down a path that ended in victory for us. The endgame was approaching. The outcome would be decided before long.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSoon, it would be a checkmate. There was still a chance to escape it, but the options to do so were few. Soon, the escape route would be gone.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Magnificent…” Sakayanagi praised me. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOne minute. Two minutes. Three minutes. Sakayanagi was lost in thought for the second time. Her time was running out. Each precious second being lost, one by one. She’d been addressing me quite often until now, but now she was silent.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Hey! Hey! Come on, come on!”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e shouted Hashimoto.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi had less than two minutes remaining. She finally had less time now than I did. Once she spent her full thirty minutes, she would have no choice but to leave the rest of the game to Hashimoto. Which would essentially make her defeat a certainty. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Sakayanagi! Are we really just gonna lose right here?!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto probably couldn’t see any way to get out of this. Sakayanagi had less than a minute now.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Truly magnificent, Ayanokouji-kun. You have given me exactly what I wished for,” said Sakayanagi. As her time continued to count down, she offered me a compliment once again. “Thanks to you, I’ve experienced what it’s like to break out in a cold sweat for the first time. You are a formidable opponent.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as she finished saying that, she quickly added something else.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…This is the end.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe muttered words of defeat. But Hashimoto wasn’t able to hear them. The commander didn’t have the authority to end the game. When the commander’s time was up, control would be returned to the player, and they would be the one to give up. Or Hashimoto could continue playing until the final checkmate. In any case, the battle was over the moment Sakayanagi expressed a willingness to admit defeat.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That was a fun battle. It really is such a shame to end it…” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe had less than forty seconds. She spoke calmly. At the same time, I heard the sound of her keys clacking on her keyboard. Her words hadn’t been an admission of defeat, but a declaration of victory. And they were followed by an intense move.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“…Knew you’d pull through…princess!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto—no, Sakayanagi, the one standing behind him—made a move that brought them back from the brink of death. When I saw the move that she had made, I felt the sensation of a shiver going up my spine, like electricity. Black had returned from the edge. They were living and breathing again.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThrough the next two, three moves that I made, I felt the game veer off from the path I had envisioned. Then…before I knew it, I’d been cornered. I had been lured into walking down Sakayanagi’s path to victory, without even realizing it. The tides had turned so many times during this game, but now, I fell silent once again.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith less than a minute and a half left to go, I was facing my greatest challenge. I had no doubt Horikita felt it too, as the one moving the pieces. She’d seen her opponent’s defeat until moments ago. She’d seen Class C’s victory within reach. And now, she was probably feeling those things slip away. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was less than a minute left.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Ayanokouji-kun…” \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita called out to me, without looking up. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I don’t want to lose.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe simply stated what she was feeling.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita was saying the things she wanted to say.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I… I don’t want to admit defeat… I want to win…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe raised her voice. The emotionally charged cry that emerged was completely unlike her. It was a cry that came from the very bottom of her heart.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Even now, I’m desperately trying to think of a move to win. I’m trying to think of anything I can. But I can’t come up with anything that’ll work against Sakayanagi-san… Only you can do that!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI closed my eyes. I had less than a minute. This was the end of the line. The final minute. When I considered the fact that the match would keep going after the commanders ran out of time, it was fair to say that our defeat would be decided within the next thirty seconds. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were no safe plays anymore. I had to gamble on a final chance at winning this battle. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI came up with my move. I quickly typed my instructions on the keyboard and hit Enter. The counter stopped. Horikita waited for my message, like she was praying. About thirty seconds after I had sent my instructions, Horikita’s eyes widened. The long-awaited signal had apparently reached her via her headset. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI briefly looked over at the teachers. Their eyes were glued to the monitor, both of them watching the game.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“So, you’re still in it, huh… Ayanokouji.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto looked up at the camera with a conflicted look on his face. It was hard to tell if he was smiling or not. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita made her move and Sakayanagi’s timer began counting down again.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Magnificent, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter seeing what I had done, Sakayanagi expressed her respect for the third time.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve never played against such a devious, formidable opponent before. You managed to match each and every one of my moves, and sometimes even surpass them.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe must have been able to see the end of the game after seeing my move.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That move you just made, Ayanokouji-kun. It’s flawless. There’s no doubt in my mind that you possess a level of skill no ordinary person could ever hope to reach.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer words were filled with deep emotion. Her voice trembled.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…However.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer words quietly echoed throughout the room.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“With this, my victory has been set in stone.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe typed her instructions on her keyboard. Hashimoto, who had been waiting, immediately made a move, following her orders. I responded by giving instructions to Horikita. The end was near. There was no more talk. Only the sound of the pieces moving across the board echoed throughout the room.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFive… four… three… and then, finally…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCheckmate, via sacrificing the queen. It was what you could call the ultimate last resort, where you sacrificed your queen, the strongest piece. When pulled off successfully, it was an exceptional play that led to victory. But it was risky, and if it failed, your defeat would be imminent. It was the move I had decided to make at the eleventh hour, when I had been completely backed into a corner.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita’s hands stopped moving. In that instant, even though she clung to the faint hope she’d hear me say something over the headset, she must have realized there was no way to avoid checkmate now. The match had been decided.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Ayanokouji-kun…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven so, there was something in Horikita that just couldn’t give up.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Answer me, Ayanokouji-un… Isn’t there anything else I can do…?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI moved my hands away from the keyboard.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Ayanokouji-kun…!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita ached to beat Class A more than anyone else. She had entrusted me with everything, thinking that if she did, she might win. This was the seventh and final event. I wanted to praise her for standing up against a formidable opponent like Hashimoto and getting the upper hand on him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita had done nothing wrong. She’d followed the instructions that I had given her over the headset. It just so happened that her opponent had made an even better move, was all. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe commanders’ time ticked all the way down to zero, and communications were cut.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“…I’ve lost.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita bowed to Hashimoto, but it looked more like she was hanging her head rather than bowing.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Thank you.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto bowed to her in response.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Well, that settles it,” said Sakagami-sensei, who had been quietly watching the event.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe seventh event had come to a conclusion.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The winner of this event is Class A. Therefore, the overall winner for this special exam, with four wins and three losses, is Class A. Class C, you put forward an exceptional performance, too,” he added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe chess game, the final event, was over. I would need to come up with an excuse later. I had intervened in the match as the commander, and we lost the game. I’m sure there was no escaping the fact that some people would complain, wondering why I didn’t just leave everything to Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That was an incredible battle… Wasn’t it? Anyway, you did an incredible job, Class C,” said Hoshinomiya-sensei, trying to comfort me, as usual. “If you want, you can go ahead and cry on my chest, okay?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hoshinomiya-sensei,” said Sakagami-sensei, snapping his colleague’s name in obvious irritation after hearing her say something so ridiculous.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-it was a joke! Just a joke!” she replied with a start, her shoulders recoiling a bit, before hurriedly bowing to her colleague. “Still, Ayanokouji-kun, I have to say you’re a much more talented boy than I thought! You got that ridiculous tenth question correct in the Flash Mental Arithmetic event \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eand\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e played an even game with Sakayanagi-san in the chess event. Also, you got the questions worth a lot of points correct on the written exam, too. Oh, and on top of that, you’re a really fast runner, if I remember…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter saying all that, Hoshinomiya-sensei stopped and pondered for a bit.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm, what’s \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eup\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e with that, anyway? Does that mean you’ve been hiding your abilities until now?” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Things just happened to work out well this time, is all.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. It just so happened, hm? Well, I suppose it’s true that things do just happen like that sometimes… Yeah, right! Yeah. I think I’m starting to understand the reason why Sae-chan has been keeping a close eye on you. Aww, this is so unfair.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo matter how much I tried to conceal, there were some parts of myself I couldn’t help but reveal to the teachers.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry, okay? I’m not going to go around spilling everything I saw and heard here to the other students,” she added, rubbing my shoulder gently.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen she leaned in close, bringing her face near my ear.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know, I don’t dislike kids like you, Ayanokouji-kun. But if I see you as an enemy, then I might come to hate you.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLeaving me with those words, she walked away, the smile gone from her face. It seemed I might inadvertently have gotten myself labeled an enemy of Class B.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The exam is now over. Students, please leave straight away.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sakagami-sensei, should we return to our classrooms first?” asked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, you’re all done for the day. You may return to the dormitories if you wish,” he replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, there was no need for us to assemble in class again. Consider me grateful. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aren’t your teachers so nice? Letting you head back to the dorms already,” said Hoshinomiya-sensei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hoshinomiya-sensei, let’s get ready to tidy up.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right,” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe teachers started getting ready to take down everything that had been set up in the multi-purpose room. The atmosphere in the room was so relaxed that you could scarcely believe such a tense, nail-biting battle had just transpired. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi slowly emerged from the other side of the computer. She had probably been waiting for the teachers to put some distance between themselves and\u0026#160;us.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Excellent work, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thanks. You too.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe first thing we did was exchange pleasantries about the seventh event. We had only spent thirty minutes on it, but we’d both been at full intensity the whole time. She was probably quite exhausted.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Chess requires a kind of endurance. First, there was Horikita-san’s spectacular play at the onset of the game. And then there was your incredible playstyle, which surpassed even that. Truly magnificent.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi had a look of satisfaction on her face. It seemed I had managed to bring out her best.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To be honest, you were far better than I imagined,” I said. “You crushed the advantage Horikita had built up, and then beat us completely and entirely. Fair and square.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh no, no, it was quite an excellent match. It wouldn’t have been strange at all if it had ended with the opposite result. It could’ve gone either way, right up until the end. That being said, I suppose there’s no arguing the fact it was that one particular move I made at the end which decided things.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, that queen sacrifice move was incredible,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt the end of the day, what had happened on the other side of the monitor was reality. I gave instructions, as did Sakayanagi. Those instructions clashed, and as a result, Sakayanagi’s had surpassed mine. Victory and defeat were judged and determined at the school’s discretion. Even though we’d put up a good fight, Class C had lost to Class A, and we lost thirty class points. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLooking at those results alone, it seemed like a minor setback. But I had to wonder how the other classes fared…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is there something you want from me?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Something I want? No, not particularly.” Sakayanagi, smiling gently, gave a satisfied nod. “I was simply looking forward to doing battle with you. And that wish has been granted. I am content.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed it was a good thing I’d been able to satisfy her, then. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakagami-sensei\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003emight start watching us closely if we stuck around too long, and that would be bad. I\u0026#160;rose from my seat. Just as I was about to open the door and leave, Acting Director Tsukishiro appeared in the multi-purpose room.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whew,” he said. “You really went and gave me quite the show.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My, my, if it isn’t Acting Director Tsukishiro. Did you happen to watch the special exam?” asked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I did. It’s our duty as school officials to make sure there’s no unfairness, you know. I was watching you from another room. I saw your involvement as commanders and how the events unfolded.” He clapped his hands together and proceeded to praise us. “Really, that was the exact definition of an evenly matched battle. Neither side gave a single inch, and we, the school officials, got some great data out of it all. We’re confident this competition will be an incredible asset in years to come.”\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_9\" src=\"/hola-lector-agua/images/books/v11/OEBPS/Images/INTERIORIMAGES_9.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen my eyes met Acting Director Tsukishiro’s, I noticed him looking at me with amusement. That was enough. I understood everything without the need for a single word.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m glad we were able to satisfy you, Acting Director Tsukishiro,” said Sakayanagi, bowing. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMore than anything else, she felt a sense of fulfillment now that our battle had been settled. “That reminds me, has the competition between Class B and Class D reached its conclusion?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. They finished about an hour ago,” he replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA fairly quick resolution.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Which class won?” It seemed Sakayanagi was interested in hearing the results, too.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Class D, with five wins and two losses. It was a real surprise victory.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen had defeated Ichinose, huh? That meant a change of 190 points. Which meant that Class D—or rather, the original Class C—had come back to life. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd that, in turn, meant that we were now starting over again as Class D.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It sounds like Ichinose-san has suffered a painful defeat. Well, it’s understandable,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Ryuuen hadn’t been here, Class B would’ve won. Did he act for his own sake? Or for that of his class? \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhatever the case, this meant something was changing within him—and that a looming threat had returned to hang over Ichinose’s head.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, everyone, let’s clear out of here, please. The special exam is now over. Teachers, I’d like to ask you to leave, too,” Acting Director Tsukishiro urged.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But we still need to take care of—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We will handle that on our end,” said Tsukishiro, interrupting him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt his signal, a number of workers poured into the room.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who are these people? They aren’t affiliated with the school, are they?” asked Sakagami-sensei, sounding doubtful.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would seem that the government wishes to get their hands on this exam data as soon as possible. To that end, they have dispatched these fine fellows. Please, rest easy.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince this was coming from the acting director, Sakagami-sensei, an instructor, had no choice but to back off. The two teachers hurriedly finished up their tasks and left the multi-purpose room together with Sakayanagi and I. They left for the faculty lounge, walking away without paying us any mind.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi, on the other hand, glanced suspiciously at the workers. But the door to the multi-purpose room was promptly shut, followed by the sound of someone carefully locking it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is something bothering you?” asked Acting Director Tsukishiro, aiming his question at Sakayanagi. He hadn’t stayed back in the multi-purpose room with the workers.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, it’s nothing.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell then… Guess I should be heading back. When I checked my phone, I saw a message from Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Good work.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat a short message. I was probably going to hear some discontented grumbling from her later.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“See you, Sakayanagi.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI made to go, leaving her with those casual parting words, but…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Would you mind waiting for just a moment, Ayanokouji-kun?” she asked, calling out to me as I was walking down the hallway, stopping me in my tracks.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s up?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe should have been basking in the afterglow of her victory. Instead, it looked like a cloud had come over her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Do you really think the last move you made was the best option available to you?” she asked me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"
