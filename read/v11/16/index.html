\u003eThe tail end of our game. She seemed to have some doubts about the conclusion I’d come to after much thought.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The truth is you won. What else is there?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No… I’m sorry. I suppose I was just imagining something silly.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aren’t you glad that you beat me?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not like that. It’s just…well, deep down, I might have been hoping I would lose to you.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNot for the first time, I thought her mind really worked in unusual ways.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just for the record, I didn’t go easy on you,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. I know.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven so, Sakayanagi didn’t seem entirely convinced. Maybe the image she had of me in her mind was greater than what I saw when I looked at myself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You are a cruel person, Ayanokouji-kun,” said Acting Director Tsukishiro, inserting himself into our conversation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe’d been standing near the door to the multi-purpose room. Sakayanagi turned around, and moments after, I had no choice but to turn and look, too. He started to walk toward us with a gentle smile on his face.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You are a cruel person,” he repeated.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean by that, Acting Director Tsukishiro?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t me who asked that, but Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How about you answer that one?” he replied, directing attention back to me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you talking about?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why don’t you just answer her honestly?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe must have had some free time after finishing up his “business” in the multi-purpose room. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The truth is, Ayanokouji-kun should have won that competition,” he added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI really wished he hadn’t said that. But now that he had, there was no way Sakayanagi wouldn’t bite. Why would this man deliberately risk bringing something on me to say that?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you talking about? The truth is that I just lost,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. That’s true. You certainly did.” Acting Director Tsukishiro chose his words in a way that communicated his personality. “But I suppose the way in which you did it was different… Right?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi, who had been listening in silence, began to understand. Then, she realized what happened.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How foolish… Did the school forcibly intervene in a students’ exam?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe didn’t sound disheartened or discouraged, but rather, indignant. Sakayanagi was, without a doubt, furious. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You really are useless, Sakayanagi-san. You didn’t follow my instructions, and ended up giving Ayanokouji-kun a Protection Point. I had no choice but to use somewhat \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eforceful\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e methods in order to take that away from him, didn’t I? This is still a ‘school,’ more or less, no?” he replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo this had been nothing more than a pointless diversion. All for the purpose of purging the current administration. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh, for crying out loud. If everything had gone according to plan, we would’ve gotten Ayanokouji-kun expelled this time around. But it seems there’re quite a few overzealous teachers at this school, and they’re giving me quite a bit of trouble.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDuring our game, there had been a number of instructions I’d issued to Horikita after a lengthy period of consideration. But even after inputting everything on the keyboard and pressing enter, there was almost a thirty-second delay before the instructions were received. Up until that point, the time lag before my instructions were received had only been about ten seconds. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was because my instructions were tampered with. They were manipulated in the computer, so what I inputted and what came out were different. The automated voice played the tampered instructions over the intercom to Horikita instead.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He was planning to use a different move, at the time. An even better move than the best one we could’ve come up with. I had a significant number of personnel and even a dedicated machine in place, and we were still forced into making an extremely difficult decision.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf they’d made an overtly careless move, it would’ve been obvious to anyone watching that something was off. To avoid that happening, he’d been forced to come up with a complex move.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that sense, Sakayanagi-san did a marvelous job seeing through the move we came up with,” he added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was hardly praise, at this point.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why didn’t you say anything, Ayanokouji-kun?” asked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if he did, it would’ve been pointless. No—it’s more that he \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecouldn’t\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e say anything at all,” Tsukishiro explained. “It’s simple, really. As a former inhabitant of the White Room, and moreover, as someone who forcibly inserted himself into this school, he doesn’t want to draw attention to himself.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf word got out that Tsukishiro had interfered with me, it would cause me some major headaches down the line. Frustrating as it was, I had no choice but to grin and bear it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Pathetic as it might be, a victory is still a victory. Shouldn’t you be happy?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…You are quite good at provocation, Acting Director. However…you do realize that you’ll pay dearly for this, yes?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eActing Director Tsukishiro merely applauded once more at the sight of upon seeing Sakayanagi’s anger-filled smile.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You do say some \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003every\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e amusing things for a mere child, someone in her first year of high school. Have you gotten a big head simply because you’re, as they say, the queen bee here?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA student sharing a ring with Sakayanagi really wouldn’t want to make an enemy of her. But to this man, she probably just looked like a child who talked big. Nothing more. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you wish to make me pay dearly, then please go ahead and do something about it now. Quickly now, come on.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no way that was happening. A brief silence had passed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, then, I suppose it’s time I make my exit. Adults do have quite a few responsibilities to keep us busy, after\u0026#160;all.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eActing Director Tsukishiro then walked forward, deliberately wedging his way between Sakayanagi and me as he went past.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, and if possible, please do choose to drop out voluntarily. That way, we can settle things without getting any other students getting caught up in this,” he added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe kept going down the hall, leaving me with that parting shot. Sakayanagi slowly started to walk away, too.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now everything’s been completely ruined. How incredibly unpleasant.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You have nothing to apologize for, Ayanokouji-kun. I’m just disappointed by what happened when an adult interfered with the affairs of children, is all. He just trampled on my most wonderful memory.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe didn’t seem to care that her victory had been tainted, only that our competition had been interfered with.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But…don’t you think it unreasonable to expect me to be satisfied with this?” she asked, stopping in her tracks and looking up at me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose so. Yeah, you’re probably right about that.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had intended to be quiet about Acting Director Tsukishiro’s interference, but in the end, it might actually be a good thing that Sakayanagi had found out. Deep down, I was also bothered by what had happened. Even if only a little. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So please, let us continue our competition. Let us pick back up from before the acting director screwed everything up,” said Sakayanagi. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt would be easy for me to refuse her request. But I felt like it would break something inside her if I did that. And maybe something in me, too.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have no reason to refuse, I guess. But where should we do this?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you know that there’s a chessboard in the library?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nope… First time I’ve heard about it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I occasionally play on it. Let’s use that for our game.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe headed over to the library. There was no one there today, most likely because the special exam had ended and all classes were done for the day. Inside that entirely still, quiet library, I took the chessboard in my hands and placed it on a small table that two people could fit at. Sakayanagi adeptly arranged the pieces to match how they’d been near the end of our game.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now, then, we’re in the same position as we were then. Please show me the move that you were really going to make.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI picked up my piece and placed it where it was supposed to have gone.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e10.3\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eO\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eUR GAME RESUMED\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e and time marched on, with neither of us saying a word to the other. It was evening now, and only the clacking sounds of the white and black chess pieces could be heard in the library. It didn’t last long, though. There was no need to spend too much time on a game we’d picked up from a point when it was nearly over. Before long, the match came to an end. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi let out a quiet sigh while looking at the board. There was no longer any way for her to avoid being put in check.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just as I’d expect of you, Ayanokouji-kun. It seems I’ve lost this game.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was the kind of game where every single move we made was the difference between life and death. Sakayanagi didn’t seem displeased at all. In fact, she acknowledged her defeat with an air of satisfaction.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re pretty upfront about how you feel.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do I look like a woman too proud to admit her own defeat?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHonestly, I’d probably be lying if I said I couldn’t see it…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wanted to know which of us stood on top. I would never do something like whine and complain about the result.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But even though I might have won, this is just a replay of that game, at best. There’s no guarantee it would have gone the same way back then.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t dismiss the possibility that the moves I’d ultimately come up with were things I’d thought of in the extra time I had been given. But more importantly…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This outcome was a result of the advantage Horikita created when she was playing against Hashimoto. The way I see it, that means I held that advantage when I took over for her. So I don’t think we were really playing on even ground.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe game had unfolded the way it did precisely because Horikita had pulled our side ahead and then passed that advantage to me. Sakayanagi’s ability to turn the tide when handed a disadvantageous situation was testament to her skill. If we were to play again, there was no guarantee that I’d win. She was skilled enough that if she \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e propose we play again, I’d be tempted to turn her down and run away for real.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you trying to console me?” Sakayanagi giggled. She must have found what I said strange.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, it’s not like that. I was just stating the facts, objectively.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m satisfied with these results. Isn’t that enough?” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf she was satisfied, then I supposed it was fine. But it didn’t make me feel better.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When the special exam was announced, you could’ve focused on getting me to compete directly with you in a one-on-one event. If you’d suggested something like that, I would have had no choice but to accept. But you didn’t. Why not?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, the seven events that were chosen from the ten possibilities were randomly selected. There was no guarantee such an event would have been chosen. But even so, if we’d both come to an agreement about a one-on-one event, then such an event would have had a higher chance of coming to fruition. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The reason is simple,” she replied. “As I’m sure you’ve already surmised, Ayanokouji-kun, there was no guarantee such an event would be drawn. And if you carelessly competed against me one-on-one, it would undoubtedly cause the people around you to grow suspicious. I wanted to avoid that. Though the acting director took advantage of it all, in the end…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi had done her best to consider and accommodate my circumstances when she made her plans for this special exam. That was probably exactly why she was so irritated by Tsukishiro’s interference. I could go so far as to guess that the seven events chosen today, and the order in which they were chosen, were most likely not random at all. There was no way we could’ve had a fair fight.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides, Hashimoto-kun is regarded as the most talented chess player in Class A, and he was losing to Horikita-san, who was taught by you. Which means I lost in that regard, as well.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi slowly bowed to me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun. I’m glad I was able to do battle with you. The answer is clear to me now. You are, without a doubt, a genius. You are by no means a fake.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re not thinking about a rematch?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you want me to?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…No, I don’t.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFu fu\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, you’re an honest one.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe’d only been able to have this quiet game because we were in the midst of an extremely rare moment. It was precisely because the special exam was over now and the long vacation was starting tomorrow that we could find an empty space with no one else around. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As for the reason why I’m not going to seek a rematch… To be honest, it’s because I’ve determined that our chess skills are about even. If we played ten games for fun, it wouldn’t be surprising if we each ended up with five wins and five losses. Am I wrong in making this assessment?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah, it’s accurate.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf we were to compete against each other again and again, things would play out just as Sakayanagi said they would. We were evenly matched in ability, which was interesting.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, I have a feeling you had the upper hand in our first game. Now that I think back to it…I might have been losing. Well, I suppose you’ve been playing chess a little bit longer than me, Ayanokouji-kun. I’m sure that made a difference.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJudging from the look on her face, she had a bit of a competitive streak. It sounded like winning was important to her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides, if I sought a chess rematch to try and win against you, I’d no longer be playing for the fun of it. Chess is a fun pastime for me. I wish to keep it that way,” she added, picking up a knight.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You mentioned my history with the game. I’m guessing that means you did see me before, after all.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. I was watching you, Ayanokouji-kun, while you overwhelmed your opponents in the White Room. Ever since then, I became fond of playing chess. I believed that a day would come when I would get to play against you.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo the feeling I had when I saw the list of proposed events from Class A had been right. It wasn’t mere coincidence that chess had been chosen as one of their events.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now then… I suppose it’s about time for us to be going, yes?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll tidy things up. Sit tight for a minute.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you very much. I will gladly accept your kind offer.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI put the board and pieces back where they originally belonged.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unfortunately, I will be keeping some distance from you from now on, Ayanokouji-kun. Our classmates may become suspicious if I continue to fixate on you forever. But more importantly…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“More importantly?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve been dying to get to know you. I feel like you’re a childhood friend whom I’ve been chasing for the longest time but haven’t had the chance to actually meet. If we can compete against one another so easily, then I feel like the value of doing so will be diminished,” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe looked at me and smiled sweetly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Though when you factor in Acting Director Tsukishiro, I suppose we don’t have time for students to be fighting with one another.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTalk about getting your priorities backward. Normally, this school \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewanted\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e students to compete with each other. But even if Sakayanagi and I did compete in a similar fashion again, we couldn’t say for certain that he wouldn’t interfere once more. In fact, he’d probably do anything he could to sabotage me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn that respect, I supposed I was grateful I didn’t have to be on alert for other things, aside from him. It would be incredibly exhausting to be surrounded by enemies on all sides. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi and I left the library.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come to think of it, this is the first time the two of us have walked back to the dormitories together like this, isn’t it?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now that you mention it, yeah.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi always had people with her. On top of that, the thought of us walking side by side was normally unimaginable. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry, I’m quite a slow walker.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t have to apologize for that.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was certainly slow. It was because of her disability, though. And oddly enough, I was grateful for that today. If I walked at my usual pace, I would’ve reached the dorms in no time.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What will you do now?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait and see what Tsukishiro does, I guess. Even if he’s just the ‘acting’ director, I probably can’t slip just anything by him.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose you’re right. Given the current state of things, it doesn’t seem like getting my father reinstated will be easy.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What about you? What are you planning to do?” I\u0026#160;asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I asked her that question, she stopped to think for a moment.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose I’ll continue to enjoy myself for now, as I’ve been doing so far. If Katsuragi-kun tries to rebel against me, I will take care of him. And if Ichinose tries to close in on Class A, it’ll be fun to crush her and toy with her. If she got expelled, I could watch Class B collapse.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe smiled innocently, like a girl playing with dolls.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I honestly didn’t foresee Ryuuen-kun making a move, but…if he does come seeking a fight, then I’d like to do battle with him, too. Surprisingly enough, I might not be bored at this school after all.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s nice.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you going to do, Ayanokouji-kun?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If possible, I’d like to avoid anything that might make me stand out. I’ll just let Horikita continue to work hard.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And I’m sure she’ll astonish everyone with how much she grows. I am quite looking forward to it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSomeday, Sakayanagi might be able to list Horikita’s name alongside Ichinose and Ryuuen’s as an opponent she would be wary of. If that day came, I was sure Sakayanagi would enjoy her time at this school all the more.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…There is one thing I’d like to apologize for.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Apologize?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Earlier, when I talked about the reason why I avoided a one-on-one match with you, I lied.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe’d said she avoided it out of consideration for me, to keep attention from being focused on me. Now, she retracted that answer.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To be honest, it’s because I wanted to be with you, Ayanokouji-kun, even if for just one second longer,” said Sakayanagi, offering her right hand to me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI took it, thinking that she was going for a handshake. But she put her left hand over mine, enveloping it. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“People can come to know warmth by touch. And that is precious. The warmth of another’s skin is by no means a bad thing. Please remember that.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s a belated message from me.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI stood there, still unable to understand what she meant. Sakayanagi slowly let go of my hand and started walking away.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now, then, shall we be going?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed she didn’t intent to tell me anything else. As the two of us walked back to the dorms, we gazed at the setting sun.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That reminds me, have you heard? Yoshida-kun from Class A, he…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe didn’t have the kind of relationship where you might reminisce about the old days. But we had no objectives in this moment, either. We were just talking about ordinary, everyday things. Just until the moment we arrived at the dorms.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_10\" src=\"/hola-lector-agua/images/books/v11/OEBPS/Images/INTERIORIMAGES_10.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 10: The Line Between Winner and Loser\",\"volumeId\":\"v11\",\"chapterIndex\":16,\"prevChapter\":{\"volumeId\":\"v11\",\"chapter\":15,\"title\":\"Chapter 9: Class B VS. Class D\"},\"nextChapter\":{\"volumeId\":\"v11\",\"chapter\":17,\"title\":\"Epilo
