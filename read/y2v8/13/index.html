e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T7af7,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 7:\u003cbr/\u003eA Light Shining at the End of the Darkness\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT WAS NEARLY NINE O’CLOCK\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e and an intensely chilly wind was blowing outside. The lights at the edge of each step faintly illuminated the area by my feet, but it was hard to say that it was still sufficiently safe, due to the snowfall. I trudged up the few dozen steps, taking take care to avoid slipping and falling on the snow underfoot. I was sure that few people would fancy the idea of coming up here at a time like this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOut in the darkness, where I couldn’t even see my own breath, I continued up the steps and arrived at the somewhat open platform. And on that wooden deck…I saw a lone small figure from behind. She must have been gazing out at the scenery, but because of the darkness, she looked awfully melancholy. There was no one else around, of course. I had seen her at mealtime earlier, but I had to wonder, how long had she been here, in this place? \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe sound of the wind was so strong that she didn’t seem to notice me approaching. I decided to announce my arrival by stomping my feet as I walked, so as not to startle her. It seemed like the sound reached her ears, albeit faintly. When she reacted with a start, I decided to call out to her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is it okay if I stand next to you?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh—?! A-Ayanokouji-k-kun?!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Quite a coincidence, huh?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yes, a coincidence indeed.” Ichinose awkwardly looked away, gazing out at the nighttime scenery.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, but actually, it’s not a coincidence. Amikura and some others were in a panic because they couldn’t find you. They said something about how they wanted to get together and talk until lights out.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, really? O-oh, jeez. I ended up making a mess, didn’t I?” said Ichinose, feeling awkward.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A little, yeah,” I said. “We should send a text message, just to be safe. I’m sure if we do that, Amikura will feel relieved, too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Have you…exchanged contact info with Mako-chan?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, since we’re in the same group for the school trip. We’ve messaged each other a lot about stuff.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI sent Amikura a message telling her that I had found Ichinose, and not to worry, as Ichinose would be back by nine o’clock. I noticed that the message was immediately read as soon as I sent it. When Amikura found out where Ichinose was, she replied with two stickers, relieved.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, the message has been passed on,” I said. “At any rate, this should quiet things down.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I’m sorry,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s fine, honestly. It’s not like you’re breaking curfew, since you’re on the grounds still. We’re allowed to enter the rear garden until nine, so as long as you head back before then, that’s fine. It’s up to the individual what they want to do.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay… Thank you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose didn’t immediately respond with something like how she was going to head back so as to not make anyone worry, though, so there must have been something on her mind. School trips were a fun time, but we had to share that time with a lot of other students.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Everyone wants to be alone sometimes,” I said. “With that in mind, I figure I’m probably bothering you now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose didn’t say anything in response to that. She simply kept looking out at the nighttime view.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure is cold,” I added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yeah, it is cold, isn’t it?” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe howling wind assailed us, piercing cold shooting through even though we were wearing gloves.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How long have you been here?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not sure… I think maybe about five minutes,” said Ichinose. She must have realized that I had immediately seen right through her, though, because she corrected herself apologetically. “I’m sorry. It might actually have been more like thirty or forty minutes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I figured. I couldn’t see any footsteps at all; they were completely gone.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUntil I came up here, there had been practically no evidence that Ichinose had gone this way at all. If I had come a few minutes earlier, then I might have been able to see faint footsteps, even though it was dark out. The snow was gradually starting to ease up, but the wind was still howling.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure this doesn’t need to be said, but if you stay out here for long, you’ll catch cold,” I added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, you’re right…” mumbled Ichinose. It sounded like she understood it in the academic sense, but it hadn’t really sunk in, and she showed no signs of heeding my warning.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBefore long, the snow had almost completely stopped. But that would most likely just be temporary. According to the forecast, we were supposed to have a strong snowstorm soon. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m going to ask an insensitive question,” I said. “But what are you thinking about, staring out at the night sky, all by yourself?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had some idea of what to expect, but I still couldn’t know until I heard it come from her mouth. Although I had asked her a question, Ichinose didn’t answer right away. She didn’t even look at me; she just continued staring out at the scenery.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think I…I want to be alone right now,” she replied softly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA gentle refusal. She wasn’t looking for someone to talk to, and she was urging me to leave. Or perhaps\u0026#160;she might have been saying it was me specifically who she\u0026#160;didn’t want to be near her right now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess I just don’t feel like leaving you alone right now, though,” I said. “It’s especially dangerous on the way down.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you for being worried about me. But it would make Karuizawa-san sad if she knew we were alone here like this, just the two of us. I really wouldn’t want to do that to her.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo one was coming all this way, so I didn’t think that was going to be a problem. Apparently, Ichinose still cared deeply about other people, even at times like this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, it’s definitely true that Kei would get the wrong idea if she saw us, for sure,” I agreed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You really sure you’re okay?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah.” After giving me that same short answer once more, Ichinose continued looking ahead, not averting her eyes from the scenery. Right away, I turned my back to her and started moving away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, then I’ll head on back,” I said. “But get back before nine. They’re going to lock the doors.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you. I’ll be careful,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter I took one step, the snow that had briefly stopped started falling again, coming back even stronger than before. I turned to take a quick look at Ichinose’s back, and saw that it didn’t look any different from when I first saw her on the school trip. It had gotten much smaller, much weaker—when was the last time I had seen the lively, animated Ichinose Honami from when we started school in our first year?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t like something had happened on the school trip. Rather, it was like a buildup of things. The water that had continued to accumulate in the cracked cup was now about to spill out. From what I could tell, Ichinose’s emotional well-being, which had been gnawed at and undermined, had now gotten to be in a very precarious state. If it were just that the water was going to spill out, that would be fine. But if the cracks widened and the cup broke apart, it might be impossible to put it back together like it was before. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat is to say, it might be the end of Ichinose’s class. The path to Class A would be closed off to them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRight now was not the moment for her class to fall into ruin. If that happened, it would be a hindrance to my plans.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll wait here,” I announced, sitting down on the steps leading back to the ryokan.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Why?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But someone like me shouldn’t matter to you at all, Ayanokouji-kun. So, why…are you waiting?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dunno,” I answered evasively. I decided that I shouldn’t say anything to her. I knew she wanted me to leave, but since she didn’t have the ability to compel me to do so, she had no other choice but to give up. If she really hated the idea of being with me, then the best thing she could do would be to walk away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA few minutes passed. Nothing happened at all; time passed in silence. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, do you…want to chat?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wondered if she simply couldn’t stand the silence when it was just the two of us here alone, or if she decided that she might as well say something. She had mumbled her words in such a quiet voice that I might have missed them if I had been lost in thought.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To tell you the truth, there’s actually something I’ve been wanting to ask you for a long time now, Ayanokouji-kun,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was far, far better than just sitting in silence for the time we had left. It’d also serve as a distraction from the intense cold of the snow, which was making my butt go numb.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you…know about something called the White Room?” Ichinose asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had wondered what she was going to talk to me about in this situation, but what she said turned out to be something entirely unexpected. I’d been entertaining all kinds of possibilities, but this was completely different from any of them. Why were the words “White Room” coming from Ichinose’s mouth? \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor an instant, the image of Sakayanagi flashed in the back of my mind. Recently, there’d been some times when the class leaders had gotten friendly with one another, like cooperation between classes. But I couldn’t imagine that Sakayanagi would talk about such a thing so casually. In that case…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps Ichinose had been threatened by Tsukishiro or someone on his side during the special exam on the uninhabited island. It would make sense if she had remembered hearing the name of the White Room from one of them saying it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not really sure what you’re talking about,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see… Well, if you don’t know what it is, Ayanokouji-kun, then please don’t worry about it. I might have misheard.” After saying as much, Ichinose suddenly stopped talking, just standing there under the cold sky. Then, she exhaled deeply, her breath a white cloud.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had my doubts as to whether she completely believed my answer. It would probably be best for me to press her a bit on it, just to be safe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Where did you hear about it?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI decided to question her, to make her think that the words were completely unfamiliar to me. If she didn’t answer me honestly, then all I needed to do was stop her from pursuing it any further.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I heard about it from Shiba-sensei and the acting director during the Uninhabited Island Exam. They mentioned it in their conversation,” said Ichinose. “I couldn’t make out very much of what they were saying, but I overheard the part about how they wanted to get you expelled, Ayanokouji-kun, and the words ‘White Room.’ I was curious, so I tried to do some investigating, but I didn’t find anything, so I probably just heard them wrong after all. Don’t you think?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have to wonder,” I said. “At the very least, nothing that sounds like that comes to mind, anyway.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom the sounds of it, she had done some searching on her own, and she was doubting the credibility of her own memories.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But still, why were they trying to get you expelled, Ayanokouji-kun?” she asked, worried. “Are you okay now?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed she had probably been wanting to ask me that for a long time, too. But it seemed that, thanks to the matter of Kei, Ichinose had pushed those questions to the back of her mind.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That matter is settled now,” I told her. “I can’t go into the details, but there aren’t any problems anymore.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI decided to steer her away from the matter of the White Room, and deliberately make her think that I had another secret. It would be much more troublesome later if information about the White Room leaked to the outside world.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe might have been a little bothered by me not being able to tell her about it. Depending on how she interpreted it, as either I couldn’t tell \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eanyone\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e about it, or I couldn’t tell \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eher specifically\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, the meaning would change a lot. I could imagine her being shocked by the fact that it sounded like I considered her someone with whom I couldn’t share a secret. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince there was no benefit to Ichinose in continuing this topic any further, I decided to steer the conversation in another direction.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have a question for you, too,” I said. “The Ichinose that I know isn’t the type of person who’d be all alone in a place like this, shivering in the cold. She’s the kind of student who would be surrounded by friends, and she and her friends would be smiling and encouraging one another.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWithin that statement, I had implied the question: \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHow much longer do you plan to stay here?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve been having plenty of fun, though,” she replied. “I’m enjoying the trip.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It didn’t look that way to me when I saw your side profile just a little while ago. It didn’t look like the kind of face someone should be making on a school trip that was all about having fun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA conversation like this was probably necessary for Ichinose right now, in order to lay bare the part of her that she couldn’t talk about with anyone, that she normally kept buried deep down in her heart. The things that Ichinose, who bore heavy pressure as the leader of her class, continued to carry. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you really going to wait for me?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. I’ll be with you when you come down the stairs,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I see. Okay, well, in that case, at least come over here by me. You’ll freeze your butt off over there.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m grateful for the invitation. I think I already froze my butt off, though, actually.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI hurriedly got to my feet, brushed the snow off my backside, and went back to stand beside Ichinose. I looked at her side profile once again, seeing that it hadn’t changed from before. When I’d checked my phone just moments ago, I saw that it was about 8:40\u0026#160;p.m. If I factored in the time it’d take to get back, then I’d say we should be able to stay here for another ten minutes or so. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf she wanted to pass the time we had left in silence, that’d be fine, I figured. I decided to wait for Ichinose to do something, with the intention of staying with her until the last minute. Every time the wind blew, snow fluttered. After about half a minute had passed, Ichinose opened her mouth. A puff of white breath dispersed into the air.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“With the way I do things…I can’t win against any of the other classes. That’s what I’ve been thinking about.” She probably hadn’t meant to let it happen, but tears started trickling down Ichinose’s cheeks.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can’t win, huh? Weren’t you going to continue pressing forward, though, being yourself, without hesitation, as you have been?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But, thanks to me, we’re—” Ichinose hesitated for a moment, and then found her words and started again. “Yes, you’re right. But…I’m just not getting results. Our class is definitely getting further and further away from Class A. That much is obvious to anyone.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And you’re saying that the cause lies in your approach,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t help but think things like… If only I could give my classmates direction like Sakayanagi-san, or if only I could have a strong pull like Ryuuen-kun, or if only I could bring everyone together like Horikita-san, then…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s just asking for the impossible,” I said. “All we are is ourselves. We can’t be somebody else.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI knew that I didn’t need to even tell her that. But although she already knew it, there were times when it needed to be said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Asking for the impossible. Yeah, you’re right about that. Right now, I…want something I can’t have,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if it means changing who you are to get it?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I could win…then I wouldn’t mind.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_010\" src=\"/hola-lector-agua/images/books/y2v8/OEBPS/Images/INTERIORIMAGES_010.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose was looking for a change. Whether it was right or wrong was a secondary concern; right now, she was desperate for some kind of breakthrough. Normally, this would not have been an occasion when I would have reached out to her. However, the course of events that followed after Ichinose had told me that she had feelings for me back on the uninhabited island had included a number of unexpected incidents, even for me, which might have been why she had broken down so much. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was still a little over three months to go until my promised meeting with Ichinose. I wondered if she’d really be able to make it until then without any help. Well, on second thought, no, this wasn’t the sort of situation where speculating was appropriate. Right at this very moment, Ichinose’s heart was on the verge of breaking. The effects of the poison were starting to manifest and circulate through her faster than I had anticipated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer love for me, and the presence of Karuizawa Kei. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer class was in a downward spiral, and she couldn’t see any chances for them to make their way back up. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough Kanzaki and Himeno were making moves, she couldn’t see her peers as having developed as much as they should have by this point.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd she wasn’t able to see what kind of future awaited her as a member of the student council, either.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eProspects were grim, with many difficulties in store. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was surrounded by enemies on all sides, forsaken by everybody.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was completely lost, trapped in a maze.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s just so frustrating… It’s really frustrating…” she said softly. Her own powerlessness. That was what was hitting Ichinose hard, resulting in strong feelings of guilt. “It’s just so hard…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf this were just a problem that affected her alone, then it would be fine for her to be depressed. But Ichinose was leading her class; she couldn’t allow that. Any failure in her class was also her personal responsibility. It was precisely because that’s what she thought that this sort of thing was happening.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry, Ayanokouji-kun…” Her feelings of frustration were conveyed very clearly in her trembling voice.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you apologizing for?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For all sorts of things… Me crying like this is just going to make you feel uncomfortable, and yet…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose was supposed to be smarter, more sensible. That hidden potential of hers was fading away completely. Her heart was far too fragile. That was her fatal weakness. Neither Horikita nor Ryuuen, nor even Sakayanagi, who was far and away in the lead, would stop for her. I was sure it must have been an unbearably painful struggle for her; she was in agony, about to fall. If I gently told her that she didn’t have to work so hard anymore, then she’d be relieved of her burdens. At the same time, however, doing so would cut off Ichinose’s legs. It was still too early for that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eYou will fall a little later,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I thought to myself\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e. I can’t let you stop until you reach the final exams for our second year of school, the time that will decide the fate of the second-years. I won’t allow you to break. It is you, but not “you,” who will decide the time and place where you will either live or die as a student.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs Ichinose tried to endure her misery, I moved closer to her and extended my arm, reaching around her back. Then, I placed my hand on her right shoulder and pulled her in close, embracing her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh—?! A-Ayanokouji-kun?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s okay to cry when times are hard,” I told her. “It’s okay to ask for help when you’re in pain. Everyone has times of weakness.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…B-but…” Ichinose bit her lip, which was already beginning to turn pale blue, and swallowed what she was about to say. She tried to pull away and move her body in the opposite direction, but her strength was fleeting.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Isn’t there something you want?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…It’s hopeless. What I wanted, it’s…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Something you can’t have anymore?” I finished her sentence.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe struggled desperately hard to suppress the words that were stuck in the back of her throat—no, rather, the words that were about to pour out of her, from the depths of her heart. Even so, Ichinose simply nodded slightly in response, although she probably hadn’t actually intended to affirm what I had asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Things can still work out in the end,” I said. “That’s what I think.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you don’t have the courage to take that first step, I can lend you a hand,” I added, cutting her off.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I wiped the tears from her cheeks with my fingertips, I noticed that they had almost frozen. She no longer had the strength to run away. Instead, she relaxed, leaning against me, as though she were entrusting me with everything. All the while, she continued to gaze into the distant landscape, the snow still falling into the night. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat day, underneath that cold sky, the two of us huddled close together and felt each other’s warmth.\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 7: A Light Shining at the End of the Darkness\",\"volumeId\":\"y2v8\",\"chapterIndex\":13,\"prevChapter\":{\"volumeId\":\"y2v8\",\"chapter\":12,\"title\":\"Chapter 6: School Trip Day Four\"},\"nextChapter\":{\"volumeId\":\"y2v8\",\"chapter\":14,\"title\":\"Epilogue: Postscript\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Kanzaki Ryuuji’s Soliloquy\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: Know Your Enemy, Know Yourself, and You Need Not Fear a Hundred Battles\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: Self-Explanatory School Trip\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: School Trip Day Two\",\"href\":\"Text/section-0008.html#auto_bookmark_toc_top\",\"index\":10},{\"label\":\"Chapter 5: School Trip Day Three\",\"href\":\"Text/section-0009.html#auto_bookmark_toc_top\",\"index\":11},{\"label\":\"Chapter 6: School Trip Day Four\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_top\",\"index\":12},{\"label\":\"Chapter 7: A Light Shining at the End of the Darkness\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_top\",\"index\":13},{\"label\":\"Epilogue: Postscript\",\"href\":\"Text/section-0012.html#auto_bookmark_toc_top\",\"index\":14}],\"volumeTitle\":\"Light Novel 2nd Year Volume 8\",\"detailsLink\":\"/select/year-2/y2v8\",\"ret "14\",{\"name\":\"twitter:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"15\",{\"name\":\"twitter:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"link\",\"16\",{\"rel\":\"icon\",\"href\":\"/hola-lector-agua/icon.svg?icon.ae5abf30.svg\",\"sizes\":\"any\",\"type\":\"image/svg+xml\"}],[\"$\",\"$L14\",\"17\",{}]]\n"])</script></body></html>
