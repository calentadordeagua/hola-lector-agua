e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T1df62,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 5:\u003cbr/\u003eSchool Trip Day Three\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE BUS HAD DEPARTED\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the ryokan at nine o’clock that morning. Just under fifty minutes later, it stopped near Sapporo Station, and thus we arrived at our destination, marking the beginning of our day. The Sapporo Clock Tower was nearby, and this area was lined with various other spots that were perfect for sightseeing. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe were supposed to go around in our individual groups yet again, but there was one difference from how things were yesterday: a little test implemented by the school. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWithin a time limit, before 5 p.m., we were to visit a total of six spots, in any order, out of a predetermined list of fifteen destinations. For a group to have their visit recognized as official, they had to take a commemorative photograph with the entire group present at a designated photography location at each spot. We had to repeat that process six times. So, groups that allowed their members to split up in an effort to get more points, as well as groups comprised of students who didn’t bring along their phones and selfishly did their own thing, wouldn’t be able to complete the task.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYou would only fail this test if you visited fewer than six spots before the time limit was up. In that case, you would be deprived of your free time on the fourth day of the trip, and you’d attend a study hall which was going to be held at the ryokan until 4 p.m. on that day. Each spot was also assigned a point value. Groups that achieved a total of twenty points or more would be rewarded, with each individual member winning 30,000 Private Points. However, since scores didn’t have an impact on whether we actually passed the test, it was up to the groups to decide whether or not to shoot for the reward.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf the photo wasn’t clear, and you couldn’t identify the people in the shot, it wouldn’t be counted. Whether students wanted to go for the reward was another matter, but if students wanted to enjoy their free time tomorrow to the fullest, they needed to take this test seriously and cooperate with one another to visit the destinations. There were no restrictions on things like the number of times we could use public transportation, but we were prohibited from using taxis. It was also necessary for us to keep a record of how we got to each spot.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was sure that the students would have been happier to have received free time on our third day, but personally, I didn’t think walking around Hokkaido under the conditions set by the school was so bad. If the students were simply given free time to do whatever they wanted, the school trip would’ve likely ended with only limited sightseeing and skiing. I was genuinely looking forward to exploring Hokkaido within the restrictions the school had set. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce we got off the bus, we were handed a pamphlet. This pamphlet, which was a unique one designed by our school, described the spots that we were to visit. Sapporo Clock Tower, Sapporo TV Tower, and the Hokkaido Museum of Modern Art were each worth one point. Nakajima Park and Hokkaido Jingu were worth two points. Sapporo Maruyama Zoo, the Hokkaido Museum, and the Sapporo Central Wholesale Market Curb Market were worth three points each. Moerenuma Park and Shiroi Koibito Park were both worth four points. Mount Moiwa was worth five points. Sunpiazza Aquarium was worth six points. Jozankei Onsen was worth seven points. And finally, Lake Shikotsu and Lake Utonai were both worth eight points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was necessary to remember that just getting to a spot wasn’t enough. For instance, in the case of Sapporo Maruyama Zoo, we needed to enter the zoo and take a photograph with the polar bears, or take a picture with the polar bear pavilion in the background, to mark the location as complete.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is kind of a surprise,” Kushida said to me after we got off the bus. “Well, I suppose it is fitting for this school, but…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor some reason, though, she was gazing far off into the distance.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m over here,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, sorry. I had no idea.” There was no way that should’ve been possible, and she wasn’t even looking at me when she said that, either. Perhaps she herself was keenly aware of how unnatural it all was, because now she turned her head and smiled at me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’d really hurt to lose an entire day to studying if we don’t do this properly,” she said. “I guess the reason they let us have a whole day of free time yesterday without any restrictions probably has something to do with the sightseeing tour today.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You might be right about that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow, the question was, what choices would our group—group six—make? The fact that we’d be going around sightseeing itself had been explained to us before we left for the school trip, but it was only on the bus on the way over that we had been told about how this was set up a little like an exam, with free time at stake and Private Points as a reward. Meaning, in other words, that we still hadn’t had the opportunity to establish what our group’s policy would be. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was conceivable that groups who aimed for the Private Point reward might not finish the test in time, so risks were unavoidable. While some groups seemed to stay put and discuss, most started walking, and in the same direction.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It looks like a lot of groups are heading to Sapporo Clock Tower first, since it’s just a stone’s throw from here,” observed Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe could consider focusing on places with high point values, like Lake Shikotsu and Lake Utonai, but that would be a high-risk strategy. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And because it’s more efficient to discuss while walking, too,” I added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust like Kushida had said, the safest bet would be to go from Sapporo Station to the clock tower, and then, after taking a picture at the designated spot, heading over to the TV tower via Odori Park. You could hit two spots in a short amount of time, and without spending any money. However, it was unclear at the moment whether that would be the ideal scenario if you were shooting for twenty or more points. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBy now, all eight people from group six had finished getting off the bus.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I did a quick search on the map app just now,” Amikura said, “and even if we were able to use a taxi, it seems like it’d take several hours for us to hit six locations with high point values.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was sure that Amikura hadn’t taken things like the time needed to reach the designated photo spot for each of the locations into account in her calculations, either. Even if we were to make full use of public transportation, it would likely be impossible for us to hit only high-scoring locations within the time limit.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anybody here familiar with Hokkaido?” Watanabe posed his question to the entirety of group six, but he didn’t get any favorable responses.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI, like the other students, had no knowledge of things like how to get around Hokkaido or the most efficient means to do so, which meant we’d have to do some research to find out the answer to those questions. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hrmm. Even if I try and make a route with the map app, I don’t really know where to go, so the order gets all jumbled up.” It seemed like Amikura was struggling with the map app, trying to enter the appropriate locations. Since the spots were scattered in all directions, to the east, west, south, and north of our current location, you would need to start by having an understanding of the relationship of the positions. On top of that, there was no guarantee that public transportation would necessarily be available at each spot, nor that the school hadn’t been mean-spirited, including some very difficult-to-reach spots in the list of places marked in our pamphlets.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, even if we \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecan\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e get Private Points, it’s just thirty thousand,” Watanabe said. “Since we’re here and have the chance to do some sightseeing, why don’t we just forget about the reward and enjoy ourselves?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWatanabe’s suggestion was one correct answer. If we focused only on scoring twenty points within the time limit, our enjoyment of our sightseeing tour would be cut in half. We wouldn’t have the time to take it easy, relax, and enjoy what each location had to offer.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Basically, I guess I’m firmly in the camp of ‘Let’s not push ourselves too hard on this,’” added Watanabe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I agree. I think it’d be better if we just go to places we each actually want to go to. Like, I want to go to the zoo and stuff\u003c/span\u003e\u003cspan style=\" font-size: 1.00em; letter-spacing: 0.60mm;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e” said Amikura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe students spent our day-to-day lives on campus, so we didn’t normally get the opportunity to visit zoos, aquariums, and the like. It was only natural not to want to waste the opportunity, since we were here.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s hear everyone’s opinions on where they’d like to go and work from there.” Amikura suggested. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSix of us, me included, quickly agreed with the idea of giving up the points and instead focusing on leisurely hitting the minimum number of spots. However, this was a matter that needed to be discussed by everyone in the group to reach a decision. Kitou and Ryuuen were the only two remaining who hadn’t yet said if they agreed or disagreed with the idea.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kitou, what do you think?” Watanabe turned to check with Kitou, who had been completely silent this whole time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No objections,” said Kitou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter getting a favorable response upon asking Kitou, a wave of relief seemed to wash over Watanabe and the others—for the time being, anyway. That made seven. And the final person, Ryuuen… His answer…still had not come.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um… Hey, uh…” Watanabe seemed to be struggling to ask, so I decided to speak up and get Ryuuen’s answer.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Me and everyone else here share the same opinion,” I said. “Can we take your silence to mean you also agree with us?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Ryuuen had declared to me that he was going to save up eight hundred million points, so his answer was obvious.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re going for the points,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a simple response. Ryuuen was going to stand against the seven of us, in other words. Of course, we as individuals were each free to think about how we were going to visit these locations. Some groups were likely going to prioritize certain locations for the Private Points. However, additional discussion was going to be needed if opinions were split like this. Watanabe was even more frightened than before, so I followed up on my previous question and asked Ryuuen another.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can I ask the reason why?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ain’t it obvious? Private Points. I can’t think of\u003c/span\u003e\u003cspan style=\" font-size: 1.00em; letter-spacing: 0.60mm;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e’em as ‘just’ 30,000 points,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith two people from each class in the group, each class could get 60,000 Private Points. It might’ve sounded like nothing but dust if you compared that to eight hundred million, but the truth was it was still one steady step forward.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There ain’t no reason not to grab the points that are right in front of your face,” Ryuuen snarled. “So, just shut up and follow me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough there was a risk of not visiting enough sightseeing locations in time, or not getting enough points due to mismanagement, fundamentally speaking, there weren’t any downsides to the idea of going for the reward; there were only positives. If you followed the\u0026#160;rules and successfully hit enough locations, you would receive Private Points from the school. And it was\u0026#160;also true that doing something that meant not getting points you could have earned would, in itself, be a loss. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, there was no way that Kitou was just going to stay silent and ignore Ryuuen’s heavy-handed behavior overruling the opinion of the seven of us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re telling all of us to follow you, to satisfy you?” asked Kitou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. Got a problem with that?” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your way of doing things ignores democracy,” Kitou said. “I think this is an issue that should be decided by majority vote.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Like I care,” Ryuuen snorted. “When the hell did this group become a democracy or whatever?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not convinced that you could be this fixated on such a paltry sum in the first place. In fact, there’s no way I can believe that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, what do \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e think it is, huh?” asked Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had lost count of how many times this sort of thing had happened by now. As Ryuuen and Kitou clashed, no one else could interject.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can only think that you don’t like how the group came to an agreement, so you said something just to stir things up,” said Kitou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see,” Ryuuen said. “That might be true, yeah. I mean, seein’ that disgruntled look on your face ain’t bad.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf we let these two continue to talk on their own, we’d soon be heading into dangerous territory.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We need some Private Points to even use public transportation anyway,” Kitou pointed out. “If you subtract those from your winnings, you won’t be left with thirty thousand Private Points per person in the end. Even so, you still want to do it?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe didn’t know the precise cost at this point, but we would need to spend some money on transit.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even so, yeah. Hypothetically, even if the reward’s closer to twenty thou, I ain’t planning on givin’ it up.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI realized now that we were the only group still near the bus.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And while we’re debatin’ like this, your precious time’s bein’ wasted. You know that, don’t ya, Kitou?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen was exerting pressure, essentially telling Kitou and the rest, “Get on with it already, and find me a good route to do this.” Of course, there was no way that Kitou was going to just quietly stand back and listen to Ryuuen’s incendiary comments, which were akin to pouring oil on a fire.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I refuse to let you have your way,” Kitou snapped. “If\u0026#160;you’re planning to stubbornly persist in going after the Private Points and ignore everyone else’s opinion on the matter, then I have no intention of helping you go to the locations. Meaning, in other words, that not only will you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003enot\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e be getting any Private Points, your free time tomorrow will inevitably be taken away from you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom the sounds of it, Kitou intended to oppose him completely, assuring Ryuuen that he had no intention of accepting his wishes. Thus, he’d protested strongly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh heh. You’re gonna be the one in the minority here, Kitou. Everyone else’ll have no choice but to follow me anyway, once the clock starts ticking,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDid this mean we were about to start a battle of wills between these two, which wasn’t going to do anyone any good anyway? The easiest way of getting the unyielding Ryuuen to act would be to steer the group toward collecting Private Points. For six of the people here, getting 30,000 points wouldn’t be a bad deal, and it wasn’t as though the idea of going for the points only came with disadvantages. Besides, if everyone was guaranteed to get their free time tomorrow, they could make up for the lack of sightseeing today. If six people in our group, excluding Kitou, leaned toward going with Ryuuen, then that would be the majority opinion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if you force everyone to go along with your plan, I will not,” stated Kitou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf that happened, then it would make Kitou into the bad guy, standing one against seven.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re sayin’ that if you threaten me with ruinin’ this whole group by yourself, that might be enough to get me to give up on the money?” asked Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I certainly hope so.” Kitou showed no signs of faltering, as though he were saying that he was accustomed to playing the part of the villain.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven Watanabe, who had been shivering in fear up until this point, had no other choice but to interject. “H-hey, calm down, Kitou. If it’s gonna mean wasting our free time, then I’m sure even you’d…!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, talk Ryuuen out of it,” said Kitou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh…” Watanabe looked like he was at his wits’ end, unsure of what to do here. “I-I’ve got it! Nishino! You’re his classmate—why don’t you tell Ryuuen off?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, telling him off would be simple enough, but there’s no way that’ll get him to change his mind,” Nishino sighed. “I’m not going to do anything pointless.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had supposed that Nishino, having been around Ryuuen for a long time now, could tell what the outcome would be if she tried something like that. Now that it had come to this, there was a feeling in the air that we should all just give in already, since there was nothing we could do anyway. Just then, Kushida tugged my arm, pulling me aside.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Hey, do you have a second…? What do you think we should do?” she whispered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d thought that going along with Ryuuen would be acceptable, but it looks like Kitou’s not budging an inch,” I said. “But if we stand with Kitou, Ryuuen won’t back down either. They’re really a selfish pair, the both of them.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBoth of their worst sides were showing—or rather, the two of them were each bringing out the worst in each other.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not like we don’t have a solution at all, though,” I added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really?” asked Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s just that I wouldn’t recommend it, if at all possible.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can you at least tell me what it is?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What Ryuuen wants are Private Points, so to him, sightseeing is unnecessary. On the other hand, the seven of us want to go to places we want to visit and enjoy the\u0026#160;sights. Kitou is included among us seven, naturally, since his opinion is similar to ours.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. We do have a conflict of interests, then.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, the seven of us can just use our own money to solve things. Kitou will likely oppose that, though, so realistically, probably just six of us. If us six each scrape together five thousand Private Points individually and offer those to Ryuuen, he won’t have any complaints then, will he?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, I see, so there’s that solution…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut this was Ryuuen we were talking about, so he might not be satisfied with us just paying him 30,000 points ourselves. I continued whispering to Kushida, explaining the risks to her. If our group received the reward, that would mean each class would effectively gain 60,000 Private Points. Which meant that he would, at the very least, demand to collect the 30,000 points that Nishino would get, as someone from the same class as him. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Nishino refused to give up her points, though, Ryuuen would continue to demand them from everyone else, so that he would get the equivalent of her share. If that happened, it meant that the five of us would be losing 60,000 Private Points collectively, or 12,000 points per person from all five together. There would likely be resistance to the idea of paying that much just to enjoy sightseeing.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah,” said Kushida, “that’s certainly not cheap…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOriginally this was supposed to be a sightseeing tour where we’d only be gaining something, but now, it looked like it would be nothing but a loss. I was starting to doubt whether we’d actually be able to enjoy sightseeing at all anymore. We would only be setting ourselves up as a bad example as a group if the majority were to give in to a loud, forceful minority.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And, in the worst-case scenario, we’d have to consider the risk of him asking for even more beyond that,” I added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?” said Kushida. “That’s so incredibly ridicul… Actually, yeah, knowing him, he would…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s what I mean.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand what you’re trying to say, Ayanokouji-kun. That’s why you don’t recommend it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s best that we get everyone to come together without any cheap trickery,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not that easy for us to just have a peaceful discussion, though. Or rather, it’s impossible, isn’t it?” said Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIndeed, it was difficult to imagine either Ryuuen or Kitou backing down that easily, and it was inevitable that we’d be forced to do nothing.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve got it,” Kushida said. “How about we tell them that it’s basically a test of patience at this point? We’d have to push ourselves pretty hard to collect twenty or more points, right? If we spend another thirty minutes or an hour here, it’ll be even more difficult to justify.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, a strategy to get them to use up the extra time that Ryuuen would need to score points at the locations? Still, even that choice was fraught with issues.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if Ryuuen decides that he won’t have enough time to go for the points, there’s no guarantee that he’ll just quietly, obediently go along with visiting the locations and enjoy sightseeing with us afterward,” I replied. “In the end, everything will come crashing down. Tomorrow’s free time will be taken away from us.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah… Yeah, I see. I suppose that’s the obvious conclusion, yes,” she conceded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were many options that we couldn’t choose here. We had no choice but to be prepared for some degree of risk and somehow try to get everyone to come together.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t want to throw away this precious day, either,” I said. “We have no choice but to bear some pain if we’re going to get things moving.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…What are you going to do?” Kushida asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had come to a conclusion…but before getting to that, I’d noticed something else important. Even though we were standing here together to avoid being overheard by the others, I had been close to Kushida alone for far too long. The fact that Kushida and I had clearly been engaging in a secret conversation, just the two of us, was becoming even more blatantly apparent. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, you, uh…you’re going out with Karuizawa, right?” Watanabe was glaring a bit. Even Amikura had a not-so-pleased look on her face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We were having a strategy meeting,” I explained. “Right, Kushida?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course,” agreed Kushida. “Ayanokouji-kun and I had just come to an agreement. Right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, Kushida quickly put a great deal of distance between us. It was an exaggerated action, like a blatant show of wanting to get away from someone she despised, and it certainly didn’t feel very pleasant to me. But it seemed to convince Watanabe and Amikura, so I supposed it was the correct thing to do. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter gathering my bearings, I walked on over to Kitou, who had been glaring this whole time, and Ryuuen, who had been looking down at his phone without a care in the world. Then, I turned my back to them and faced the five others.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d like to confirm something with everyone in our group, with the exception of Ryuuen and Kitou,” I announced. “I want to double-check what our opinions are at this point in time. Do we prioritize sightseeing, or do we prioritize Private Points? If anyone here has changed their mind and now wants the latter option, please raise your hand. You don’t need to worry about everyone else right now, just indicate what your personal intention is.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWatanabe and the rest looked at each other, but no one seemed to be raising their hands. I could tell from their demeanor that none of them were keeping their hands down just because they felt like they had to. In other words, no one agreed with the idea of prioritizing the spots that had high point values.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So what?” Ryuuen scoffed. “No matter what you say, Ayanokouji, I ain’t changin’ my mind here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI know you don’t care, even if you don’t have any allies to support you,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I thought to myself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI briefly looked back at Ryuuen. “Sorry, but I want to talk to the other five people now,” I told him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI immediately looked away from him, continuing my conversation with the five others in the group. “Now that we’re in this situation, I’ve come to the conclusion that there’s no way the eight of us can come together on this, and discussing it would be a waste of time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what are you saying we do, then? Go with Ryuuen?” Speaking as one of the people who wanted to go sightseeing, even Nishino made no attempt to hide her discontent. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I’m not saying that. Individual opinions should be respected to the greatest extent possible, but as a member of this group, his voice is only one-eighth. So, that’s how it must be. Kitou, who opposes Ryuuen, is also just one-eighth. Even if we’re not factoring my opinion into the mix here, the five of you make up five-eighths; therefore, you are the majority.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, we know that,” said Nishino. “But aren’t we still in trouble if we can’t talk it out and come to an agreement? Whether we’re talking one-eighth, or five-eighths, or whatever, we all have to make the same choice, and we all have to move forward.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re right,” I said. “It’s just that it is, without a doubt, the five of you who have the right to decide what to do in this situation. If you can’t agree with Ryuuen’s methods or his way of thinking, you don’t have to obey him. In other words, you can make him abandon the choice to go for the Private Points. We can all throw out the idea of going to spots for points right now and just go sightseeing on our own, at our leisure,” I announced.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…So, you’re saying that we throw away our free time tomorrow?” asked Nishino.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s correct. Besides, even if we do what Ryuuen wants now, there’s no guarantee that we’ll be able to go to the places we want to go as a group during our free time tomorrow anyway. If someone says that they won’t leave the ryokan, then at that point, our group won’t be able to go out anywhere. On the other hand, our freedom today is guaranteed.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But just until five o’clock, right?” said Nishino.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not so,” I said. “We only have to be done with our sightseeing by five if we’re planning on having free time tomorrow. Technically, we have the right to do as we please until nine o’clock, our curfew, when we have to be back at the ryokan. Moreover, we can do whatever we like individually, too. We could even go around and each go and hang out with other groups that our friends are in. The school can’t even criticize us over it if we do that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe would be giving up our fourth day in exchange for making the third day one of complete freedom, which was something no one else could do. That was the absolute right only given to these five.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just want you to keep in mind that it’s not Ryuuen or Kitou who decides what we’re going to do,” I added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yes, you’re right,” said Kushida. She looked into the eyes of our group mates and was certain that they all shared the same opinion, without the need for any extraneous conversation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ryuuen-kun, we are not going to go for the Private Points after all,” she said. “Today, we want to talk about where we want to go, and we want to have an enjoyable day. If you can’t agree to that, then we’ll probably just split up here and go our separate ways. As for what happens after that, well, it will go exactly as Ayanokouji-kun said. Maybe we can all get along during the study hall tomorrow, in that case.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNishino smiled at hearing those words, and then Amikura, Watanabe, and even Yamamura nodded, prepared for whatever might come. Almost as if in response, the corners of Kitou’s lips curved up ever so slightly into a smile.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A good proposal. Count me in,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUp until this point, Kitou had just been rebelling against Ryuuen out of defiance toward him, but now he sided with the five other students, as an ally. Now that everyone had come to this conclusion, the ball was officially in Ryuuen’s court for the first time. Would he agree with Kushida and the others and give up on the Private Points? Or would he resist, causing the group to disband? In any case, he wouldn’t get the Private Points he wanted. On the contrary, he’d even get stuck with study hall tomorrow as an added bonus.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You went and did somethin’ unnecessary there, Ayanokouji,” said Ryuuen. He had verbally expressed his dissatisfaction, but he didn’t look like he was actually unhappy with this. To everyone around him, it just looked like he was simply putting up a tough front. “Yeah, I don’t wanna study after comin’ all this way for a trip. I’ll play along.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had considered that there might be some degree of resistance, but Ryuuen backed down. If he could still have gotten Private Points even if we were acting separately, then he would’ve split off without hesitation, but he avoided trouble when he knew there was nothing to gain from it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo decided, we—group six—followed the school’s instructions and went on a proper sightseeing trip, visiting different spots around the city and stopping by the zoo, which we had wanted to go to. In the end, we collected fewer than twenty points, but it was a meaningful trip, and one that left us all satisfied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e5.1\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eD\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eAY THREE, DINNER\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e We’d had Japanese-style cuisine for breakfast and dinner for the previous two days, traditional meals that were brought out in courses, but starting this evening and until breakfast the day after tomorrow, when we’d be returning to the school, the menu changed, instead featuring an all-you-can-eat buffet. This was, of course, the first time I had ever experienced an all-you-can-eat meal in my life. As for the meals, just like how things went yesterday, we could freely eat anywhere we wanted, taking any available seat, without having to worry about being all together as a group. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMany students were already crowded together, trays in hand, walking around. Kei was hanging out with a bunch of girls today, and they were so loud that I could hear their laughter from across the dining hall at times. Since I was allowed to be on my own without worry right now, I decided to watch the students around me, to learn the rules of how this all worked. The process seemed to be that you’d take one of the trays from the stack and move along a predetermined route where you’d freely choose whatever assortment of dishes you wished, placing any combination of things on your tray.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFirst, I would take a salad bowl, and put in lettuce, tomato, onion, pickles, and so on. There were five types of dressing available that you could choose from, so I decided to go with the onion dressing.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Interesting,” I muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnlike meals that were already predetermined, making your own specific choices on what you had heightened the sense of individuality. Without realizing it, I ended up reaching for foods based on striking up a nutritional balance. On the other hand, the other students around me really varied in what they were taking, with some students loading up their trays based on what others in their group had, and some students loading up on lots of different kinds of foods in small quantities. As I followed the line down, continuing on to the side dishes, more students began to queue up behind me, one after another. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had thought that, since it was still somewhat early in the dinner hour, there might not be that many students here quite yet, but it was the opposite. Apparently, there were more students who wanted to get in around the time that the buffet opened. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough the buffet was mainly stocked with Japanese food, there were things like steak, shumai, corn soup, and so on.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as I was trying to find a seat after I had gotten everything I wanted from the buffet, I was approached by Ishizaki, who appeared empty-handed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yo, Ayanokouji. Hey, you plannin’ on eatin’ alone or somethin’?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s what I was planning, yes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Mmkay, then come eat with me,” he said. “I told Nishino to come over too just a minute ago, since she was on her own. It’s lonely eatin’ by yourself, ain’t it?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, it’s… Well, I suppose you’re right.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t have any particular reason to turn him down, so I figured it’d probably be better to just take Ishizaki up on his act of kindness. As I followed Ishizaki to our seats, Nishino spotted us and waved us over. Albert was there, too, and I had the feeling he was looking at me through his sunglasses. I sat down next to a tray loaded up with a mountain of food, which seemed to belong to Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, there’s still somethin’ I gotta go get real quick,” Ishizaki said. “You guys go ahead and start eatin’.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, that must have been the reason why he was empty-handed when he called out to me, then. He was on his way to get something. Ishizaki, humming, went back to the buffet.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You got brought over thanks to Ishizaki’s meddling too, huh?” I remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I refused, but he was insistent,” said Nishino.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess he’s the type of person who can’t leave his friends alone,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess,” Nishino said. “He was kind of down in the dumps and broody when we started school, though, and a lot touchier.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was true that, these days, I envisioned him as this cheerful guy, but I supposed he might not have been the same when he started school. I had hardly ever interacted with him, though, so if I was being honest, he hadn’t really left a major impression on me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He seemed to hate Ryuuen at the start, too, so maybe he had a rebellious attitude,” said Nishino.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d never seen Ishizaki like that, because he’d suppressed it now, but I guessed that was how he’d originally been. If you wanted to talk about someone who gave me the impression that they’d sort of remained the same all this time, though, that would have to be Albert, who was eating in silence. He held his chopsticks dexterously in his big hands.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, my dudes!” Ishizaki announced. “I brought crab! Tons and tons of crab!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that he’d returned, Ishizaki set down his tray with a heaping plate on it, and on that plate was an overflowing mountain of crab. Some crab legs fell off onto the tray due to the sheer momentum as he slammed the plate down.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…That’s an incredible amount,” I remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dude, someone says ‘Hokkaido,’ you think, ‘crab,’ am I right?” he said. “I’ve been dyin’ to get some crab, so I scooped ’em up in a hurry.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You really are totally crude, aren’t you?” said Nishino.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_05\" src=\"/hola-lector-agua/images/books/y2v8/OEBPS/Images/INTERIORIMAGES_05.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was certainly true that, among the various dishes offered on the buffet menu, many students flocked to the crab. I didn’t want to get mixed up in the crowd, so I gave up on trying to get any during my first pass.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whaddya mean, crude? It’s a smorgasbord, dude! That means we can take all we want!” Ishizaki’s personal opinion seemed to be that, if you didn’t take it, you’d lose it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“First of all, the word ‘smorgasbord’ is the lamest thing ever, so could you stop?” said Nishino.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Well what else am I s’posed to call it?” asked Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You say ‘buffet,’” Nishino said. “It’s a buffet.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Boo-fay?” he repeated. “Nah, come on, now \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e sounds lame, don’tcha think? Seriously, what’s that even s’posed to mean?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere did seem to be differences in the terminology, and, well, if one was to be precise, it seemed like there were differences in the rules between how a smorgasbord and a buffet worked, but it looked like Nishino was more bothered by the heaping plate of crab than that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Well, anyway, who cares about the details?” Ishizaki said. “I’ve totally been lookin’ forward to the smorgasbord.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Have you considered other people? Crab is one of the main dishes, y’know,” said Nishino.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Say what? If I worried about that, then other people’d snatch it all up. Besides, it’s all-you-can-eat, so I’m sure they got plenty.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, I had to admit there was at least some degree of truth to that. Ishizaki, having just come back from the buffet line, pointed over to where a chef was hurriedly replenishing the supply of boiled crab. Even in the worst-case scenario, if Ishizaki were to say he was going to eat it all, we had no right to stop him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh, you’re impossible.” Nishino averted her eyes from Ishizaki, scooping up some chawanmushi and bringing the spoon to her mouth.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs for Albert, eating in silence next to us… It looked like his chosen lineup included boiled eggplant with bonito-flavored soy sauce, spinach with sesame sauce, various pieces of sashimi, miso soup, rice, and so on. Any way you looked at it, he’d chosen an assortment of definitively Japanese-style foods.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You like Japanese food, huh?” I remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn response, Albert gently set his chopsticks down for a moment, placing them side by side, and silently gave me a thumbs-up. Then, he immediately went back to enjoying his dinner. He had far, far better table manners than Ishizaki, who was gobbling everything down in big gulps.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Ayanokouji,” Ishizaki said. “You’re in a group together with Ryuuen-san, right? Stuff goin’ good?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not really doing anything special,” I said. “The other people in the group are supportive, so thanks to them, I think we’re hanging in there.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re talking like you don’t know about that fight at the ski resort.” Nishino had been one of the people involved in the affair. She sounded nonplussed as she reminded me about what happened. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I heard there was a fight with some dudes from another school or sumthin’?” said Ishizaki. “Damn, man, I wish I coulda been there too!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would’ve been way, way worse if you were,” Nishino huffed. “Why are so men so hotheaded?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite what she said, Nishino had looked pretty brave to me back there. She talked back to those guys without fear while shielding Yamamura from their harassment. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re a pretty hotheaded chick yourself, though.” Ishizaki guffawed loudly with his cheeks stuffed with crab.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Gawd, shut up,” said Nishino. “Also, stop spraying food everywhere when you eat; it’s disgusting.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You ain’t makin’ trouble for Ryuuen-san either, are ya?” Ishizaki said to her. “Make sure ya listen to his orders good, ’kay?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re free to put your blind faith in him, you do you or whatever, but why do \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e have to follow that guy?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough Nishino was taking an argumentative tone with Ishizaki, she was engaging in conversation with him properly, each of them taking turns. I supposed they were classmates who knew one another really well, then. I could only go on what I’d seen of Nishino while we’d been in a group together, but though she didn’t talk very much, she didn’t seem to make trouble for others, and she did seem to have a kind side, as she cared for Yamamura in her own way.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know, Nishino, I’ve been wondering about this for a long time,” I said, “but are you not scared of Ryuuen?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah, I guess I do get the feeling that things could get crazy whenever he gets serious, sure,” she replied. “But my idiot older brother used to be a delinquent too, so I guess I might have a little more experience with that kind of thing.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, she had someone like Ryuuen in her family, then? If that was true, then it made sense that she was able to talk back to those guys so confidently during that fight.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s so obvious that if you don’t do what you’re supposed to do properly when you’re in school, you’ll have a tough time,” Nishino went on. “But my older brother was such a massive idiot during high school, he got all carried away and ended up getting kicked out, and then he had a hard time finding a job. He had a really tough time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNishino let out several heavy sighs when she recounted what happened, as though she didn’t want to remember.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What happened to him?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, he got picked up by a local construction company, basically, and he’s been working himself practically to death at the site every day. For a really low monthly salary.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was precisely because she could see the impending reality that loomed ahead, then, that she could only sigh when she thought about Ryuuen and Ishizaki’s futures. Selfishly doing whatever you wanted now would mean suffering for it later. That should be common sense throughout all of society, whether or not you were a delinquent. Putting aside the entertainment and creative industries, where talent was key, and the sports industry, where physical ability was most important, the higher your level of education, the better. The harder you\u0026#160;worked in your studies, and the more knowledge you accumulated, the more likely you were to start from an easier position later in the working world.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y’know, despite how ya look, you’re pretty smart, huh?” Ishizaki said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You really didn’t need to say the ‘despite how I look’ part,” snapped Nishino. “And besides, anybody would look smart from your point of view.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wah ha ha! Yeah, you might be right about that!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYes, I supposed that from Ishizaki’s perspective, almost everyone here could be considered an honor student. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I had finished my meal and was about to leave, I happened to spot a particular young man: Katsuragi. I saw that he was eating alone at a table in the corner, silently scooping food into his mouth. I was curious about how he was doing, so I thought I’d observe him for a little while, but then I saw something strange. When Oda, from Ryuuen’s class, spotted Katsuragi and tried to go over and talk to him, Matoba from Class A candidly strolled up to talk to Oda, stopping him in his tracks. Then, after something Matoba said to him, Oda headed toward a different student while still keeping an eye on Katsuragi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was almost as though Matoba had done that deliberately, to keep Oda from making contact with Katsuragi. It\u0026#160;wasn’t just once, either; this happened two or three times in a row. Matoba was a member of group two, along with Katsuragi. It wouldn’t have been surprising if Matoba had been sitting down at a table together with Katsuragi, but it was actually the opposite. It seemed that there were some people in Class A who did rather spiteful things. I would’ve been fine just leaving things be, but I decided to try making contact with Katsuragi at least once. Just then, Matoba, sensing that I was going to approach him, came up to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re in the middle of a little group event with Katsuragi right now,” he said. “Would you leave him alone for the time being, please?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI see.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e If Matoba said that it was a problem for group two, which they were both a part of, then even Katsuragi’s classmates would have no other choice but to back down. That was why Oda understood right away and left. So, was this the collective will of Class A at work, or was this an action taken by Matoba alone? And was there an agenda to defeat Ryuuen’s class behind this, or not? In any case, from a third party’s perspective, what Matoba was doing could only been seen as an act of malicious bullying. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen, while Matoba was still on alert, a new visitor appeared. Matoba turned to stop this person, just as he had stopped me earlier, but it appeared that this visitor wasn’t what he had expected.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh…” Matoba gulped loudly and turned away, as though he hadn’t had any intention of interfering in the first place.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yo, Katsuragi. You’re eatin’ your food with a pretty depressing look on yer face there, huh?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was no wonder Matoba couldn’t say anything, because the visitor was none other than Ryuuen. Matoba quietly clicked his tongue at the unexpected appearance of such a big player and immediately scuttled away. Without so much as even a glance at Matoba’s back as he left, Ryuuen took a seat in front of Katsuragi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m eating,” Katsuragi said. “What do you want?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just thought I’d get a closer look at your miserable face,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t understand what that’s supposed to mean.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh heh. This is what it means to betray your class. Too late to regret it now, Katsuragi.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t have any regrets. I might not have a clue how to deal with a leader who can’t be contained, but I am prepared to go down fighting with my current class.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps Katsuragi had phrased it that way to hide his embarrassment, but even though he used a somewhat roundabout way of expressing it, I could tell that he was firmly aware of his position as a member of Ryuuen’s class. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That so?” Then, with a \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethud\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, Ryuuen plopped down on the chair that he pulled out and slid an empty glass over to me. “Get me some water, Ayanokouji.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Me?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ain’t no need for me to be afraid of you in the slightest when we’re out in public like this,” he said. “Makes it easy.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeesh, I already figured you’d be a slave-driver when I found out we were in a group together, but… Good grief.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry. I’ll go.” Katsuragi, unable to let something like that slide, offered to help, but I politely refused.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m thirsty anyway, so it’s perfect timing,” I told him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBesides, I had been able to catch a glimpse of Ryuuen expressing his concern for Katsuragi in his own way, as he was unable to sit around and watch Katsuragi eat his meal all alone. So, I figured I’d play along for the time being.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e5.2\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eR\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eYUUEN AND I\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003estayed with Katsuragi until he finished his meal, and then we left the dining area. I spotted Kushida sitting perfectly still on a chair near the entrance, waiting for someone. She stood up when she saw Ryuuen, Katsuragi, and me, and approached without hesitation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ryuuen-kun, could I talk to you for a moment?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, she had been waiting patiently for Ryuuen to come out. Considering how quickly we had eaten, it was difficult to imagine that Kushida, a girl, had finished her meal before us. It was probably safe to assume that she had something she wanted to talk to Ryuuen about, so she had prepared in advance for it. Katsuragi must have figured out what was going on, because he quickly went on back to his room alone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Whaddya want?” asked Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not here, it’s… Is it okay if we go somewhere else?” Kushida was in her usual public-self mode because of all the people around, but she seemed to be acting a little strange.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, but I ain’t interested in you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah ha ha, no, no, it’s nothing like that. Or rather, you don’t need to worry about that. I mean, I would rather die than go out with you, Ryuuen-kun.” Though Kushida was being mindful of her surroundings, she directed her murderous intent square at Ryuuen, sparks flying.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, sure, whatever, if you wanna talk, I’ll listen,” Ryuuen said. “We can get rid of the third wheel over there, though, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBy third wheel, he meant me, of course. Kushida put her palms together in an apology to me, and so I figured that I should get out of here. The two of them walked side by side over to an area where there weren’t any people around. It seemed like if I just left them as they were, things would start heading in a not-so-great direction. Completely concealing my presence, I decided to follow them. I exercised the utmost caution, though, of course. It turned out I was right to be cautious, because Ryuuen seemed like he was worried there was something behind him, looking over his shoulder while they walked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So?” he said. “What did you wanna tell me so bad that you’d get me all alone to talk?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wanted to talk about our relationship, Ryuuen-kun,” Kushida told him. “Even when we’re acting as a group, you sometimes say things that aren’t necessary. I’d like you to stop doing that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom what I knew, Ryuuen had threatened to expose Kushida twice now, practically lighting the fuse himself to blow everything up. It was obvious that Kushida wouldn’t take very kindly to that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you want with me?” she demanded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do I want?” Ryuuen repeated. “I ain’t planning to do nothin’ to you right now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Meaning that you’re going to do something to me someday?” I could hear a slight lack of composure in Kushida’s voice.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You sold your soul to the devil to get Suzune expelled, remember?” said Ryuuen. “Naturally, that came with risks. You can’t just pretend it never happened after all this time, y’know?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, you’re right. I think so, too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Still, I gotta say, you sure have changed a lot, Kikyou. I’m sure the old you wouldn’t have even thought
