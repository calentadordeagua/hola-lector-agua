 about tryin’ to press me like this right now, even if I provoked you. Wouldn’t ya agree?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen shouldn’t have known anything about what happened during the Unanimous Special Exam—but he did have a sharp nose, so I supposed he must have sensed that something was strange.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe, just maybe, somebody came along who accepts your true nature?” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can heap whatever suspicions you want on me, but they’re misguided,” said Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh heh. In any case, you’re one of the all-too-important keys to my class strategy. When the time comes for me to deal with Suzune’s class, I’m gonna use this weapon without mercy.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen had intentionally avoided mentioning anything about Kushida all this time. From the sounds of it, he was keeping that in his pocket as one of the measures he could take to effectively cause damage in more important situations in the future. That was an obstacle for Kushida, who, after recovering, had decided to serve the class, albeit for her own sake. It wasn’t something that she could remove easily, and she would continue to be made to suffer. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’re ya gonna do?” he taunted her. “You gonna get down on your hands and knees and beg me not to tell anyone? Or perhaps you’re gonna try and get rid of me, get me expelled? Either way, it’ll be difficult for you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t let Kushida choose either of those options. Even if, hypothetically speaking, there were a third choice, I couldn’t let that happen either.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI stopped hiding, deciding to show myself to the two of them. “Sorry, Ryuuen, but you’re going to have to back down on the matter of Kushida,” I declared.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tch. You followed us after all, huh?” sneered Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A-Ayanokouji-kun?!” Kushida exclaimed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You being on your guard was something I had already taken into account,” I explained.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, whatever,” said Ryuuen. “So? Whaddya mean, I gotta back down on the Kikyou thing?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It means exactly what it sounds like. I know you probably intend to tell everyone about Kushida, but I’d like you to stop.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen laughed in amusement at my warning, clapping. “Ha ha ha! What, you tellin’ me that you’re involved in this too? And on top of that, you’re sayin’ that she’s not the cancer of her class like she used to be anymore, huh?” Having received an answer that removed any of his doubts, he smiled happily.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right,” I agreed. “Right now, Kushida is taking a new step forward as Horikita’s classmate. I have no intention of letting you interfere and ruin that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, but this sounds like it just got even more fascinatin’. Let’s put our interests aside for a minute and have some fun here, huh?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No one will believe anything you say, Ryuuen-kun.” Kushida, unable to take it any longer, tried standing up to Ryuuen, but he wasn’t going to stop at just those words.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm. I have to wonder about that, though,” he said. “You never know till you try, after all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat we needed now wasn’t some half-hearted attempt at getting him to stop what he was doing with words, but rather, a complete shutdown of his actions.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you do decide that you’re going to expose her, no one can stop you,” I admitted. Kushida couldn’t hide her anxiety and humiliation at my words, but I lightly tapped her on the shoulder and told her not to worry. “But if you do that, you won’t be able to achieve your goal of fighting against Sakayanagi in the final exam.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What? How can you know that for sure?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because I’ll deal with the situation in a way that you wouldn’t want.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn an instant, Ryuuen’s smile was replaced with a look of suspicion. It was just like the look he’d had when he had abducted Kei in the past, when he hadn’t known what fear was—or actually, perhaps even more suspicious than then. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hah,” he scoffed. “What’s this? Now, that’s a look you haven’t shown me in quite a long time, eh?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI moved in closer to Ryuuen, inserting myself between him and Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on. Even if I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edo \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003echoose to stay silent right here and now…there ain’t no guarantee that I won’t expose her later, right?” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen looked like he had fight in him, but eventually, he backed down, throwing his hands up. “I’ll let it go,” he conceded. “I didn’t even feel like attackin’ your class with the whole Kikyou thing in the first place anyway. Well, actually, I guess I should I say that I don’t feel like it \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eanymore\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?” asked Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If it ain’t somethin’ I can get Ayanokouji with, then it ain’t a weapon I can use.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh…?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I dunno if you know this, Kikyou, but yesterday, this guy over here told me somethin’. He said that he doesn’t want to expel you anymore. So, even if I attacked your class usin’ your story, it wouldn’t affect \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e anymore, would it, Ayanokouji?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right,” I replied. “I’ve already thought of countermeasures.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It don’t make any sense to use a strategy that won’t work and only have it comin’ back to bite me in the ass. Right? I’ve learned the hard way that I ain’t gonna defeat ya with half-assed plans.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t at all that Ryuuen was giving in and turning servile, of course; I was sure that he was going to come back and challenge Horikita’s class with some elaborate scheme that even I hadn’t considered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m headin’ back to my room now,” he said. “Bye, Kushida. Enjoy the rest of your time here at this school as much as ya can.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen headed back to the room, his attitude seemingly saying, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eDon’t try and stop me again.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e He’d even gone from calling her Kikyou to calling her Kushida. Was that the flip side of what happened when Ryuuen completely lost interest in someone? \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnly Kushida and I remained, standing there in silence.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why…did you come to my rescue?” said Kushida. “There’s no benefit in it for you, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There is a benefit for me, though,” I argued. “It’s that you are an indispensable asset to the class. I don’t think that Ryuuen would have actually gone through with exposing you, even if I hadn’t come, but I wasn’t sure what you were going to do. You were probably wondering if there was anything you could do to get him to keep his mouth shut, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Well, yes, I…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ryuuen isn’t an opponent that you can compete with. You would’ve found yourself in trouble if you rushed into a battle that you didn’t start and got yourself blown up. That’s why I decided to say something.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re saying that you could do something, then, Ayanokouji-kun? Well, yes… The truth is that it seems like you did.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At the very least, I think that at this point in time, Ryuuen isn’t a big enough deal for me to see him as a formidable opponent.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-huh? What is that supposed to…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, you don’t need to cross that dangerous bridge anymore. Just take care of yourself for now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When you say something like that, it really makes me uncomfortable. You need my help with the class that badly?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s that too, yes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That ‘too’?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I feel like I can work together well with you, Kushida, now that we speak frankly with each other,” I explained.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBeing able to see her hidden side had also made it easier for me to infer what she was thinking.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just stop,” she protested. “There’s no way that anyone could seriously think something like that after finding out what I’m really like.” She herself was painfully aware that she had a personality that wasn’t well-liked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not true,” I replied. “To be honest, I like you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What is… I don’t know how serious you’re being about this. I can’t trust you, Ayanokouji-kun.” Normally Kushida would’ve thought it sounded like a joke and laughed at me, but right now, her expression was stiff.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s the truth. There are some people out there in the world who are more comfortable with the real you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s—” Kushida looked at me like she was about to say something, her mouth open. But she stopped moving. Then, she suddenly started walking toward the wall.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…What?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSuddenly, she thrust out both arms in front of her, hands open wide, pushing the wall as hard as she could with both palms. “I’m okay, I’m okay…” she mumbled to herself, her movements coming to a complete stop.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI watched her, wondering what was going on. After Kushida caught her breath, she turned back around to look at me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just got a little dizzy! But I’m okay-A! I mean, A! Okay!” she sputtered. Despite her attempts to tell me I didn’t need to worry about her, her voice shot up in volume in a very strange way.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Are you really okay?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida showed me the face she usually wore out in public, though she really didn’t appear to be okay to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. I’m fine!” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“O-okay.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn Kushida’s case, it was honestly very difficult to read her emotions.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I kind of feel like I’ve been saved by you, Ayanokouji-kun… Thanks,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I feel like you’ve been thanking me more these days, Kushida,” I remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, you might be right about that… Anyway, I won’t be getting involved with Ryuuen-kun anymore from now on.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s good.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, I’m going to head back to my room. See you tomorrow.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, tomorrow.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida walked down the hallway. From the look on her face, she seemed like she made a complete recovery. However, she stumbled while on her way down the hall, and she took a massive spill, causing one of her wooden sandals to go flying in spectacular fashion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you okay?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fine! Perfectly! Fine!” She gestured to me not to come over with a wave of her hand, then staggered back to her feet and put her wooden sandal back on.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e5.3\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eS\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eINCE I HAD A MEETING\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e with Horikita, I waited in the hallway to the guest rooms with my back against the wall.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry for being a little late.” Though Horikita apologized as soon as she appeared, she hadn’t actually been especially late, so there wasn’t really an issue. “Getting straight down to business, let’s—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you really plan on having a long conversation out here?” I asked, interrupting her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe were near the guest accommodations, so students were constantly coming and going from their rooms. This was one of the least appropriate places to talk about things you didn’t want to be overheard.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, this definitely isn’t a good place to talk,” Horikita agreed. “Let’s see, somewhere appropriate. Let’s head over to the vending machines to get a drink. We can talk while we walk, so that’s perfect, no?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI figured that was fine, and didn’t really have any objections, so I agreed. You were more or less guaranteed to attract attention when you stood around and talked. But if you chatted while walking, you didn’t have to worry about it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They sell fruit milk in the vending machines out in front of the large bathhouse,” I suggested. “It’s delicious.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had been told that it was the thing to drink after taking a dip in the bath, and after trying it for myself, I really felt like it was true.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you for your childish commentary,” said Horikita. “But that’s not something you drink in the middle of the night, is it?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWas time an issue? Well, actually, I supposed that maybe fruit milk just wasn’t that special from a girl’s point of a view.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even so, the vending machines at the main bath are some distance away, so sure, let’s walk over that way,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe began to walk slowly, showing me that she was prioritizing talking for the time being.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“About what happened at the Cultural Festival,” she began. “I’ve been wanting to talk to you about that, but I haven’t had the opportunity to. It’s been bothering me for a long time now, and I couldn’t find a suitable time to bring it up until today.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You must have been extremely exhausted back then,” I said. “You let me see your sleeping face, completely unprotected.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Do you want to get kicked?” said Horikita. She got into a stance that demonstrated that she was more than willing to do it, and I immediately raised the white flag and surrendered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Forgive me,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh, talk about negligence on my part,” she sighed. “A\u0026#160;blunder. To think, I let a boy see me sleeping. You have sullied me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you really that bothered by it?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It is something to be bothered about… But it doesn’t matter right now. I want to ask you about something that happened that day.” Horikita tried to brush her embarrassment aside with a wave of her hand, and her\u0026#160;expression turned serious. “That incident that took place in the student council office that day. You had something to do with it, didn’t you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat happened at the Cultural Festival that day in the student council office… There was only one thing she could be referring to.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you get Yagami-kun expelled?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why do you think I had something to do with it?” I wasn’t exactly dodging the question, but I was interested in hearing the reason she had concluded that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know whether you knew this or not, but it’s possible that Yagami-kun was trying to get you expelled,” she said. “In fact, the things he said and did in the student council office support that idea.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt sounded like Horikita had come by several pieces of information in her own way, without my knowledge. It made sense that, in the process of putting those pieces down and trying to fit them together, she had figured some things out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t know about Yagami, no,” I replied, “but it doesn’t sound like it should come as that much of a surprise. You already knew firsthand that Housen tried to get me expelled, after all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For the twenty million Private Point reward, yes,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, Yagami was participating in that test too, and keeping an eye out for an opportunity. Right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I considered that, too. But there are too many things that seem unnatural. More than anything else, I didn’t get the impression that he was trying to get to you in order to obtain money.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom the sounds of it, as someone who was present at the scene, Horikita understood the situation in more detail.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are lots of questions that I’ve been curious about the answers to,” she added. “But those aren’t what I want to know most.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then, what do you want to know?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your true identity. I can’t possibly imagine that you’re a normal student, like everyone else.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s a rather troubling question. If I’m not normal, then what kind of student am I?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I don’t know. It’s not about whether you’re exceptionally talented. It’s just, I can’t even begin to imagine what sort of person you are. It’s impossible for me to decipher.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, she wanted to know the answer to the question of who the person called Ayanokouji Kiyotaka was, hm?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s really nothing all that special to say about me,” I told her. “Honestly, I just don’t have anything to even talk about.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, if I were to ask you questions, would you give me answers?” she said. “Where you’re from, what elementary school you graduated from, your junior high school. Have you participated in any competitions or anything like that in the past? Did you study on your own? Did\u0026#160;you go to cram school, or did you have a private tutor?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI bet that people didn’t even ask you such detailed questions when you went to a formal marriage interview.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand what you’re trying to get at here, but I don’t feel like responding to so many tedious questions,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita pursed her lips in a blatant show of dissatisfaction.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Which is why I’m going to disclose some information,” I added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…What kind of information?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For example… Ah, okay, I’ve got it. Things like how I was involved in what happened with Yagami, just as you guessed.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re not joking, are you? So, was it because Yagami-kun was trying to get you expelled?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Technically, I didn’t know Yagami was the one who was trying to get me expelled,” I explained. “It would be more accurate to say that I’d set a trap for the student who was after me, and Yagami happened to be the one who fell for it. President Nagumo, Ryuuen, and the others being there in the student council room—I had orchestrated all of that. My goal was to fence Yagami in, so that he wouldn’t be able to weasel his way out of it with any half-cocked excuses.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUp until this point, there would have been no point in me telling Horikita all of this. However, by giving her this data, I could indirectly show her what kind of person I was. I did so to create the possibility that she could make use of this information, when the time eventually came for us to face one another.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no connection between President Nagumo and Ryuuen,” I added. “I talked to them separately, that was all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, that feeling I had back then, that something was off… I think I understand what that was coming from,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“By the way,” I said, “we’re almost at our destination.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe had arrived at the rest area on the second floor of the large bathhouse where the vending machines were located. There were two female teachers monopolizing the massage chairs there, sitting back in the chairs with looks of total contentment and relaxation on their faces; they didn’t seem to notice us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_06\" src=\"/hola-lector-agua/images/books/y2v8/OEBPS/Images/INTERIORIMAGES_06.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita and I briefly exchanged looks. We could have just ignored them, but Horikita chose to call out to them instead.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You certainly seem very relaxed,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Oh. Why, if it isn’t Horikita-san.” Hoshinomiya-sensei responded with a light wave, fluttering her hand at the wrist.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The students are just about to go to bed, but the teachers are still on duty?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, unfortunately,” Hoshinomiya-sensei replied. “It’s like we only had half a day off today. Right, Sae-chan?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, it certainly is like that.” Leaning into the rattling massage chair, Chabashira-sensei looked comfortable, her eyes shut.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Does the chair feel that good?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was interested in trying it out for myself, but I was wary of being seen by the students who were incessantly coming and going in and out of the bathhouse.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Massage chairs really become indispensable as you get on in years,” Chabashira-sensei said. “There are a lot of hardships that you young people wouldn’t understand.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom the sounds of it, with the decline of their physical bodies, they needed equipment for support.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Especially in your case, Sae-chan, since your shoulders get awfully stiff\u003c/span\u003e\u003cspan style=\" font-size: 1.00em; letter-spacing: 0.60mm;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e” added Hoshinomiya-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You didn’t need to chime in with that unnecessary addendum,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was only for a brief instant, but the teachers exchanged sharp, angry looks, sparks flying.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, Horikita-san, it really seems like you’ve become a true, proper leader,” Hoshinomiya-sensei said. “Are you feeling comfortable in Class B now? I just wanted to ask, speaking as the teacher of the former Class B.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not particularly, no,” Horikita replied. “What I’m aiming for is Class A. Where I’m at now is nothing more than a checkpoint.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That goes without saying, yes,” replied Hoshinomiya-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDisregarding their conversation, I reached for the remote control that connected to Chabashira-sensei’s massage chair. It seemed like there were five levels of intensity, and right now, it was set on level three. Obviously, the stronger the intensity, the more effective it would be. For some reason, I found myself feeling curious about how powerful the fifth level would be, so I decided to test it out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Mm! Eeek! Mmmph?!” Chabashira-sensei practically leapt out of the seat in surprise, and the machine started to let out loud rattling sounds. I had thought it would only be about a 40 percent increase in functionality, but it might’ve been more than that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A-Ayanokouji, wh-what are you, mm, doing?! T-turn it back!” she shouted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe reached for the remote, clearly flustered, and forcefully tugged on the cord it was connected to, causing it to fall out of my hands.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“U-ughh! Eek! Ah… H-hurry, get it!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, please don’t yank it out of my hands,” I said. I picked up the remote control and turned it back down from level five to level three.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huff, huff…h-huff… What the hell did you think you were doing…?!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well… I was just curious, I suppose. I figured that the stronger the intensity, the better.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course not!” she snapped. “The right level of intensity depends on the person!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe looked really angry now, her face bright red, more demonic than I had ever seen her before. Apparently, that had been much more stimulating than I had expected it would be.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you doing?” asked Horikita, exasperated. Apparently, my loud exchange with Chabashira-sensei had attracted her notice. “Sorry for interrupting your break,” she said to the teachers. “Let’s go, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you two going into the baths?” Hoshinomiya-sensei asked. “You can’t go in together, you know.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita ignored the nonsense the teacher was talking and motioned that she was going to keep walking.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, Horikita-san.” Hoshinomiya had been joking around just moments ago, but all of a sudden she had a serious look on her face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I certainly do think that your class is growing at a remarkable rate, Horikita-san,” she said. “And you’re right, Class B is a checkpoint that you need to reach in getting to Class A. That much is obvious, but still, I also think what you’ve done is wonderful, and very admirable, too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt sounded like she was praising Horikita, but her words were loaded with meaning.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Chie, don’t say anything unnecessary,” snapped Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, what’s the harm?” Hoshinomiya-sensei said. “I’m just trying to tell her what I think, is all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know what you’re trying to say, but it’s not like we can freely say whatever we think,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please tell me.” Horikita cut in, urging her to speak. She must have been curious about what Hoshinomiya-sensei was going to say next.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, in that case, I’ll continue,” said Hoshinomiya-sensei. “So, yes, speaking as a homeroom instructor in charge of a class, I do have a lot of thoughts. The teachers too, from Class A to Class D, are also competing against one another like you are. If I were to use an analogy here, you could say that it’s like we teachers are playing the card game daifugou against each other.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Playing…daifugou?” echoed Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you know the rules?” Hoshinomiya-sensei asked her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, kind of.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that sense, we use the cards we’re dealt to fight and decide who comes in first through fourth place, and in this school, we spread that fight over three years,” Hoshinomiya-sensei explained. “In daifugou, you use cards numbered one through thirteen… Putting aside regional differences in rules or special rulesets for the time being, essentially, cards with higher numbers are stronger, and cards with lower numbers are weaker, right? So, if a\u0026#160;student who only has a value of three clashes against a student with a value of six, the student with six will win, of course. Mashima-kun’s Class A, for example, would tend to have a certain range of cards. He’d be dealt more tens and elevens. On the other hand, going further down, like to Class D, you’ll see more lower-value cards, like threes and fours. Well, that’s the way it has historically been at this school, anyway.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHoshinomiya-sensei reached for the remote control for her massage chair and raised the intensity one level to level three. I was reminded again of just how intense level five was.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course, students are changing every day,” she continued. “I think that there are cases where kids who were threes or fours grow into twelves or thirteens, or in rare instances, become the most powerful number, twos. So, class fluctuations do happen, and sometimes, Class\u0026#160;D can become Class B. Of course, that is extremely rare, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat meant that what Horikita’s class had accomplished was unprecedented.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But what’s important is that everyone is fighting on equal footing,” said Hoshinomiya-sensei. “Namely, that every class is always fighting within the same boundaries, with numbers one through thirteen. We can’t have any unfairness or misalignments in a particular class, can we?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, you’re right,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But don’t you think that one card that shouldn’t have been added to the deck was mixed into your class, Horikita-san?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A card that…shouldn’t have been added?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHoshinomiya-sensei was smiling, but she was directing her gaze toward me. “That’s right. It’s unfair. Sae-chan’s class is the only one that has the Joker.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita also noticed Hoshinomiya-sensei looking at me, as though her gaze was naming me aloud.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Chie. Cut it out already,” snapped Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, I’m entitled to grumble a bit,” Hoshinomiya-sensei complained. “Even if we fight smart, fight desperately hard, a single Joker can turn the whole situation upside down. Actually, wait. It’s much, much worse than just playing daifugō. In cards, after you play the Joker once, it goes away. In this case, you can keep playing it repeatedly. There’s no way we can win.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat she had just said, as a homeroom teacher, could have been interpreted as her declaring that her own class had already lost.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Putting aside whether what you’ve said is right or wrong, what would you do if a student from Class D heard what you just said?” asked Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAn admission of defeat. If students from Ichinose’s class heard it, they’d inevitably be shocked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yes, you’re right. Sorry about that. The massage chair’s probably just making the alcohol hit me harder.” So saying, Hoshinomiya-sensei switched the power off. “You got the Joker because of luck, Sae-chan, Horikita-san. If you use that to get into Class A, well, that’s just plain unfair, isn’t it?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt would be obvious to anyone that it was meant as a snide remark.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s enough, Chie.” Chabashira-sensei had raised her voice, coming awfully close to sounding threatening. I’d never heard that tone of voice from her before. Hoshinomiya-sensei must have sobered in an instant, because she hurriedly jumped out of the chair.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Welp, I’m heading back to my room! Farewell!” she exclaimed. Clearly slightly peeved, she waved to us and walked down the hall with long, exaggerated strides.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry about all that.” Chabashira-sensei got up from her own massage chair and spoke on her colleague’s behalf. “I know she already said as much herself, but it was likely just the alcohol talking.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t mind. I just disregarded it as nonsensical drunken ramblings,” said Horikita flatly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn response to Horikita’s sudden, biting comment, Chabashira-sensei was a little shaken, and coughed. “You’re pretty harsh,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seemed like you were a little concerned about what she was saying before, sensei,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not as though I don’t have any thoughts on the matter, to be honest,” Chabashira-sensei admitted. “Things are vastly different now than they were with the class I oversaw three years ago.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was certainly true that there were powerful cards in Horikita’s class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know whether Ayanokouji-kun is a Joker or not,” Horikita said, “but I won’t deny that he is a powerful classmate. However, I’m not going to hold anything back because of that.” She didn’t even so much as look at me as she offered her thoughts to Chabashira-sensei. “I will fight with everything I have, using the cards that have been dealt to me in your class, Chabashira-sensei. Because I am aiming for Class A.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. Of course, that’s the goal,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, I was sure that Chabashira-sensei herself likely thought that Horikita wasn’t sufficiently prepared for it. Class A, led by Sakayanagi, also had a lot of great cards. Even if you won one game, there was no telling what would happen in the next ten or twenty.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well… I’m going to go after Chie,” Chabashira-sensei said. “If I leave her alone, I’m afraid she might drink herself silly until morning.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, Chabashira-sensei set out after Hoshinomiya-sensei. It sounded like she couldn’t abandon a friend and former classmate.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI turned to Horikita. “Well, guess that’s it for today, Horikita.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s still a mountain of questions I want to ask you, though, Joker-san,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Since we’ve come all this way, I want to hop in the bath again,” I said. “Besides, there are more people here now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was starting to catch glimpses of students who wanted to enjoy a bath before going to bed, as they trickled in.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, can I assume this means that you’ll talk to me later?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI nodded in response, and then went through the curtain leading to the men’s bath.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e5.4\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eE\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eLEVEN P.M\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e was drawing near, and it was about time for lights out. Kitou stood up without a word, heading out into the hall carrying several magazines that he had borrowed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He’s been reading in the room almost this whole time, huh?” I mused.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe must’ve liked reading. Unlike me or Hiyori, though, Kitou didn’t look to be the type to read books from the library. When he returned a few minutes later, he had a new magazine in his hand, maybe so that he could read it as soon as he woke up in the morning. The magazines that Kitou read strongly reflected his personal tastes, and most of them were what you’d call fashion magazines.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Would you let me read that for a sec?” I asked him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was expecting him to tell me to get one myself, but Kitou silently placed the magazine on the table. I supposed I could take that to mean it was okay for me to read it if I wanted. I decided to give the magazine a brief read, for the just over ten minutes we had until lights out. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt featured things like trendy clothing and accessories. To be honest, I couldn’t really understand the meaning of the pictures in the magazine, or the articles, either. However, I could tell that Kitou had a strong emotional attachment to these magazines. Kitou’s outfits, which to me seemed like eccentric fashions, were filled with his own sense of style and his feelings. It would have been interesting if Ryuuen, who often quarreled with Kitou, said that his interest in fashion was stupid; however, Ryuuen hadn’t made any such heckling remarks.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSoon, it was time for lights out, so we shut them off and lay down in bed. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI quietly stared up at the ceiling for a while, my vision gradually adjusting to the darkness. It didn’t seem like everyone was asleep yet, and I wondered what they were thinking about. Just as I did, Watanabe spoke up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know, we’re going to be third-years in just half a year,” he said. “Even while we’re competing to get into Class A, we’ve still got to think about our future, like if we’re going to college, going into the workforce, all that stuff. I still can’t imagine what I’m gonna be after graduating high school. And there’s nothing in particular that I really want to do. What about you, Ayanokouji?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Higher education…I suppose,” I answered. I figured I’d say the goal that sounded the safest. “Though I haven’t decided on what specific university.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What about you, Kitou?” asked Watanabe. He probably wasn’t confident that he’d be able to get an answer from Kitou, but he asked outright anyway, not afraid.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I’m going to be a fashion designer,” said Kitou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?!” Watanabe was doubly surprised, as not only did he not think he would get an answer, he was also shocked by the answer he got.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure you’re surprised,” Kitou said. “I can understand that. I don’t think anyone would expect it, judging from my appearance.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-well, no, it’s… It kinda hurts to admit it, but I suppose not, no…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, it was easy to understand once you considered Kitou’s personal fashion sense and the contents of the magazines he often read.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh heh. I think if you said that you were gonna become a killer for hire, Watanabe’d find that easier to swallow,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was worried that Ryuuen butting in with that comment might make Kitou angry, but I didn’t see him move.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“D-don’t worry about it, Kitou. I mean, Ryuuen’s always sayin’ stuff like that.” Watanabe tried to smooth things over, but Kitou really didn’t seem like he cared.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m used to it,” he said. “Most people are surprised when I tell them about my dreams. They find them hard to swallow. Even if I’m heading straight ahead on that path, I can’t imagine that people will accept me readily.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere should be no such thing as prejudice, but it certainly did exist in this world. For someone who looked as tough and frightening as Kitou, I was sure that the hurdle to some professions would naturally be quite high. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But that won’t matter if I graduate from Class A,” Kitou went on. “I can still leap into that world, no question about it. Once I jump in, all I have to do is silence everyone around me with my skill.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt sounded like, for Kitou, just getting his foot in the door, achieving that first part, was the most challenging task.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, you’re really giving a lot of thought to the future… I mean, that’s awesome. You’ve got a real dream,” said Watanabe. He was surprised, but he was impressed by how much thought Kitou had given his future compared to himself, and he offered him genuine praise. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChildren grow older whether they like it or not, and they are faced with the necessity of entering society. It was the same even for Watanabe, who didn’t have a goal right now, and for Ryuuen, who wasn’t talking about his.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know, I just kind of asked without thinking, and…now that I know, it kind of makes things harder,” mumbled Watanabe, forcing a laugh as he looked up at the ceiling. “I mean, all of us here, we’re in different classes, right? So, if you think about it, only one of the four of us can graduate from Class A. I bet everyone here’s got a dream that they want to achieve, but, like, if you take that spot in Class A, that means someone else isn’t getting it… It’s complicated.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf you were classmates, you could share dreams. But if you were rivals, you couldn’t. That was how this school worked. Some students would be smiling, while others would weep. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wondered if spending the night together with students your age normally led to this kind of conversation. It reminded me of the night that I’d spent talking with Keisei and the other guys at camp last year.\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 5: School Trip Day Three\",\"volumeId\":\"y2v8\",\"chapterIndex\":11,\"prevChapter\":{\"volumeId\":\"y2v8\",\"chapter\":10,\"title\":\"Chapter 4: School Trip Day Two\"},\"nextChapter\":{\"volumeId\":\"y2v8\",\"chapter\":12,\"title\":\"Chapter 6: School Trip Day Four\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Kanzaki Ryuuji’s Soliloquy\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: Know Your Enemy, Know Yourself, and You Need Not Fear a Hundred Battles\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: Self-Explanatory School Trip\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: School Trip Day Two\",\"href\":\"Text/section-0008.html#auto_bookmark_toc_top\",\"index\":10},{\"label\":\"Chapter 5: School Trip Day Three\",\"href\":\"Text/section-0009.html#auto_bookmark_toc_top\",\"index\":11},{\"label\":\"Chapter 6: School Trip Day Four\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_top\",\"index\":12},{\"label\":\"Chapter 7: A Light Shining at the End of the Darkness\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_top\",\"index\":13},{\"label\":\"Epilogue: Postscript\",\"href\":\"Text/section-0012.html#auto_bookmark_toc_top\",\"index\":14}],\"volumeTitle\":\"Light Novel 2nd Year Volume 8\",\"detailsLink\":\"/select/year-2/y2v8\",\"returnLink\":\"/select\",\"currentSpineIndex\":11,\"nextVolumeLink\":\"/select/year-2/v0\",\"nextVolumeTitle\":\"Li mmersive experience.\"}],[\"$\",\"meta\",\"15\",{\"name\":\"twitter:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"link\",\"16\",{\"rel\":\"icon\",\"href\":\"/hola-lector-agua/icon.svg?icon.ae5abf30.svg\",\"sizes\":\"any\",\"type\":\"image/svg+xml\"}],[\"$\",\"$L14\",\"17\",{}]]\n"])</script></body></html>
