],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T169c,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 1 - Prologue:\u003cbr/\u003eKanzaki Ryuuji’s Soliloquy\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em; letter-spacing: 0.60mm;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eWISE MAN\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e keeps away from danger.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’ve always kept my distance from other people, ever since I was a kid. Why did I make that choice, you ask? Because it was easier, and, more importantly, it kept me from getting mixed up in any kind of trouble. I didn’t make any close friends, but I didn’t make any enemies, either. When you keep people at arm’s length, neither too close nor too distant, relationships are easy.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut one day I got wrapped up in a silly fight between children, simply because I happened to be close by. Apart from me, there were four of them. Three of the kids were relentlessly laying into the fourth. Those three were being arrogant, but it wasn’t as though it was for no reason. It\u0026#160;all started with a lie. The one child who was being verbally accosted was clearly upset. That child had been lying to the\u0026#160;others.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHonestly, it was something entirely trivial. If I remember correctly, it was about whether or not the child had actually gotten an autograph from a famous celebrity. The three others had wanted the fourth to admit to the lie and apologize. But the fourth refused, continuing to insist that it wasn’t a lie. I happened to be there by chance, and after analyzing the situation objectively, I urged the child who lied to admit to it. But ultimately, the child stubbornly clung to the lie until the end.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA flimsy lie. Pointless stubbornness. I thought the situation might escalate to the point of physical harm, but I didn’t do anything. Besides, in the first place, the issue was that someone told a meaningless lie. I didn’t know why that child did it, if it was to look good in front of their friends or what, but it was honestly so stupid. There was no need for me to step in and help.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt had nothing to do with me. That’s how I truly felt, from the bottom of my heart.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI mean, if anything, I thought that kid should’ve gotten punched at least once, so they’d learn something from the situation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut…in the end, the kid who told the lie got away with it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as the situation was turning dire, a third party suddenly swooped in and, employing some quick thinking, saved the child. That person protected the child without accusing them of lying, simply because they were friends. I couldn’t accept that. That wasn’t justice. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe right thing would have been for the child to have never lied to the other three in the first place. My uncertain feelings over the situation hadn’t gone away. Who was in the right? Was it the three who had told the truth, but were acting high-handed and violent? Or was it the one who had clearly been lying? Or was it the third party, who knew it was a lie, but still stepped in to save their friend?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was one adult there, who had watched the entire ordeal from start to finish. That person placed their hand on my head and told me something.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you don’t have the power to help, you might as well just give up and run away. But if you do have the power and don’t use it, then you’re a fool.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t understand, at the time. I wondered if that person meant, ultimately, that I was supposed to help the liar. But as I grew into an adult, I came to understand. When that person talked about helping, they didn’t necessarily just mean helping the child who’d lied. I think that adult meant that, if I had the power to control the situation, I could resolve things, no matter what point of view I was coming from. That was when something stirred within me. Something hot and smoldering, something I didn’t think I had inside me. Even now, I still can’t forget those words I heard from an adult I had never met before.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I started attending the Advanced Nurturing High School, I reluctantly chose to socialize with people, which wasn’t my forte. I learned how to help those in need, even if only a little. I had hoped to support Ichinose, who I recognized as the leader of our class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, ultimately, things didn’t go so well, and my heart was broken.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen…Ayanokouji Kiyotaka’s words saved me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAyanokouji… Fate truly is a strange thing.\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 1 - Prologue : Kanzaki Ryuuji’s Soliloquy\",\"volumeId\":\"y2v8\",\"chapterIndex\":7,\"prevChapter\":\"$undefined\",\"nextChapter\":{\"volumeId\":\"y2v8\",\"chapter\":8,\"title\":\"Chapter 2: Know Your Enemy, Know Yourself, and You Need Not Fear a Hun
