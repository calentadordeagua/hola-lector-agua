e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T22cdc,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 4:\u003cbr/\u003eSchool Trip Day Two\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT WAS NOW THE MORNING\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e of the second day of our school trip. After we finished eating breakfast and getting dressed, we killed time in our room relaxing, waiting until the bus bound for the ski resort was set to depart. Watanabe and I were innocently watching TV. On the other side of the television screen, celebrities were reading off summaries of the morning news and providing their own innocuous, tepid commentary. After a while, the vibe of the programming suddenly changed rather dramatically as they entered a segment of the program that was a special feature on kittens.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMeanwhile, Ryuuen was in the same room, sitting in the armchair as though it was his own personal seat, while Kitou was staring fixatedly at a magazine, reading one by one through a stack of them that were available to borrow for free from the ryokan. They all appeared to be fashion magazines.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He looks so unsettling like that. It’s hard to imagine that he’s just reading… It feels like he’s studying a manual on how to murder people,” Watanabe whispered into my ear. He had spoken in a quiet murmur so as not to be overheard, but in an instant, Kitou shot him a penetrating glare. That must have terrified Watanabe, because he averted his gaze, hiding in my shadow.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, he’s definitely done \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to somebody, don’t you think?” he squeaked, terrified.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI felt my shoulders being shaken, but I wanted to concentrate on this kitten segment on TV, if possible.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Kitou. Things ain’t clear for you either yet, right? With how yesterday’s pillow fight turned out? Have a throwdown with me today.” As though he were attempting to call forth a storm to raze this peaceful morning, Ryuuen approached Kitou and proposed they fight.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNeedless to say, this was not a welcome development for me and Watanabe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fool,” said Kitou. “Do you intend to jump straight into the jaws of death yourself? If you wish to feel regret, then I shan’t stop you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh heh. In that case, do yer worst,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What kind of competition do you want?” asked Kitou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, ain’t that obvious? We’re gonna go skiin’ soon, so that’ll be it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom the sounds of it, Ryuuen was proposing a simple time trial, to see who could finish faster. Kitou might not have been a beginner, but it was clear based on what I’d seen yesterday that Ryuuen was highly skilled, at the very least. There was no need for Kitou to willingly go along with a proposal that would essentially drag him onto Ryuuen’s playing field. However, Kitou forcefully shut his magazine, the look on his face unchanging.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You think you can beat me in skiing?” he said. “I will crush your hubris.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, he was going to accept the challenge, not showing any sign of running from it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 0.83em;\"\u003e“Hey, you guys shouldn’t fight, y’know? Hey, you two listening?”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e said Watanabe in a tiny voice.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m pretty sure they didn’t hear your words of warning,” I remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWatanabe had spoken so incredibly quietly that if a child heard him just now, they would probably have said something like, “Wow! An ant is talking!” I had been sitting next to him and had only just barely, ever-so-slightly managed to make out what he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m just picturin’ you lookin’ pathetic, crawlin’ down the slopes on all fours,” sneered Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Laughable,” Kitou scoffed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs Ryuuen and Kitou traded verbal jabs, I could tell that they were both heating up. Kitou stood, rolled up the magazine that he had borrowed, and drew closer to Ryuuen while holding the magazine out as if it were the blade of a sword.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When you lose, you’re going to be as quiet as a little kitten for the rest of this trip,” said Kitou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wondered if Kitou had unknowingly been influenced by the segment on cats on the TV, but that’s what he was demanding from Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Well, if ya ask me, I’ve been plenty quiet already,” said Ryuuen, batting away the magazine forcefully with a \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eslap\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can’t you just leave it at that for the time being, please? I’d like to watch this segment on cats,” I said, urging the two of them to keep their distance from one another and not to fight.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-wow, you’ve sure got guts, Ayanokouji. They might turn around and make you their target, though, don’tcha think?” said Watanabe, worried.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah, I don’t think so. There’s no benefit to either of them in going up against someone like me,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBesides, the general Ryuuen-versus-Kitou schema was going to remain unchanged, unless someone made a big show of butting in.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, now that you two have calmed down, I can keep watching this special on—” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBefore I could even finish that sentence, the cats had already disappeared from the TV. I guessed that that these things called special features didn’t last for very long, because it was over in just a few minutes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, that’s too bad, Ayanokouji,” Watanabe said. “You like cats?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah, not really,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, you don’t?!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had just wanted to watch, more or less. I didn’t hold any particular fondness for the animal known as the cat. I would likely have felt the same way if it had been a special feature on dogs or even hippopotamuses. The people on the program had been talking about topics cheerfully, in a friendly fashion, for quite a while, but then there was a news flash.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Now for some breaking news. Former Secretary-General Naoe, who had been undergoing medical treatment for some time, has passed away at a hospital in the Tokyo metropolitan area. Here is a comment from Prime Minister Kijima’s office—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were flashes of lights going off, and at the same time, a very stern-faced man was speaking.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“‘Judge a man by living with him, and try a horse by riding him.’ Those are words Naoe-sensei said to me shortly after we met.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust when the Prime Minster began speaking about the deceased, the screen suddenly went black.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Time to get on the bus,” said Kitou, remote control in his hand, his finger on the off button.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Awright, Ayanokouji, let’s get this show on the road,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was a little concerned about their contest, but I figured I’d still try and enjoy skiing in my own way.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e4.1\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eW\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHEN WE HEADED OUTSIDE\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e we found a slight problem waiting for us. Apparently, the bus had gotten stuck in traffic and would be arriving about ten minutes late. There were a lot of students waiting for the bus heading to the ski resort, but if you looked back, you’d see that people were flooding the entrance, trying to head back inside.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s cold, but I guess it’s safer waiting outside,” said Watanabe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe let out a deep sigh, exhaling a cloud of white, as he looked gloomily up at the sky. It was unfortunate that we’d gotten outside a little earlier than the other students, but there was nothing we could do about that now. Even if we did try and head back to our room, we couldn’t exactly relax with only five minutes to spare. We—that\u0026#160;is, group six—decided to wait outside the building, just under the eaves.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, since we’re waiting out here anyway, why don’t we try making a snowman?” asked Amikura, suggesting to the rest of the group that we could spend the time efficiently.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That sounds like fun,” Kushida said. “Nishino-san, Yamamura-san, would you like to join in?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Sure, I guess,” replied Nishino.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had expected her to refuse the offer, but surprisingly enough, she seemed okay with it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And what about you, Yamamura-san?” asked Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, thank you… I’ll pass,” said Yamamura. She’d turned down the offer like I thought she would, albeit somewhat modestly. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe other three girls moved to an out-of-the-way spot and started scooping up fallen snow. From the looks of things, they weren’t planning to make a small snowman. They were hoping to make a fairly large one.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Ryuuen-kun, why don’t you come over and make a snowman together with us?” Kushida called. “I think it’d be fun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida had to know that there was absolutely no way Ryuuen would take her up on that offer, but she invited him anyway to show off the good-natured heart of her public-facing persona. Even the other students nearby were watching the situation with concern, perhaps because they couldn’t imagine Ryuuen working hard to build a snowman. What Kushida said just now was almost certainly payback for yesterday. It was a show of confidence, telling him that if he said something careless, she wouldn’t back down, she’d fight.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I figured if I tried to rein her in a bit, that’d make her sit there quietly, but I guess I had the wrong idea, huh?” Ryuuen muttered quietly to himself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was certainly true that if this had happened before her classmates had learned the truth about her, Kushida might just have sat there and put up with whatever he said. Ryuuen must have been able to feel that there was something strange about that, but there was no way I could unravel this mystery for him. I couldn’t give out information the other classes didn’t know, like what happened in our class during the Unanimous Special Exam.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNeedless to say, there was no way Ryuuen would accept Kushida’s invitation. He didn’t even react to the snowman, instead just looking far off into the distance. Meanwhile, though, a certain someone continued to gaze quietly at the snowman as it was being constructed. That certain someone was none other than Yamamura, who had been distancing herself from us bit by bit without being noticed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Phew…” Yamamura exhaled deeply into her cold hands while she observed Kushida and the others making the snowman. “Phew…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida and the rest building the snowman were, naturally, wearing warm-looking gloves. Even after taking a glance around the surrounding area, I noticed that none of the students outside except for Yamamura were going around without gloves. Well, that made sense. In this wintry weather, no one would go bare-handed for a long period of time unless they had a special reason. I remembered that Yamamura had been wearing gloves before, during yesterday’s skiing lessons. Even if she could rent gloves for skiing once we got there, why wouldn’t she bring gloves along to wear on the way?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf she simply forgot, it’d be fine to just go back and get them, so maybe there was some kind of reason for it. She looked dazed, staring out into space while exhaling deeply over and over. Although I was curious about Yamamura, more and more students started coming outside to wait for the bus. Then, I heard a familiar voice.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s like everything is covered in a blanket of snow.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe owner of that familiar-sounding voice was none other than Sakayanagi Arisu. She was in group four. If\u0026#160;I recalled, Hondou and Onodera from Horikita’s class should also be in that group… And almost as if they’d been summoned, those two showed up just as that thought crossed my mind. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi and the rest of her group all gathered without really interacting with any of the members of group six. Since Sakayanagi couldn’t ski, she was probably going to do some sightseeing.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNot too long afterward, the bus bound for the city arrived, although the bus headed to the ski resort was still on its way. The teacher leading the students instructed them to board, and the students began to get onto the bus one by one. Cane in hand, Sakayanagi walked alone on the snow-covered path, which she wasn’t accustomed to. As I watched her, I felt a little uncertain, like it was risky… And my prediction proved to be on the mark, because Sakayanagi slipped and fell, landing gently on her backside. Fortunately, the gentle cushion of snow protected her from the impact, and she didn’t seem to be hurt.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you okay…?!” Tokitou from Class C, who was also part of group four, had been walking a little behind Sakayanagi when she fell, and he rushed over to her. He seemed to hesitate for a moment over what to do, but then he offered her his hand.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you very much, Tokitou-kun,” Sakayanagi said, a little bashfully, as she took hold of his hand.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_02\" src=\"/hola-lector-agua/images/books/y2v8/OEBPS/Images/INTERIORIMAGES_02.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt would’ve been easy for him to just forcefully yank the diminutive Sakayanagi to her feet, but Tokitou helped her up slowly and carefully. Despite his stern face, it turned out he could be surprisingly delicate and considerate.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You gotta be careful,” he told her. “Your legs don’t work great, after all…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry,” she said. “However, fortunately enough, the snow is nice and soft, so I wasn’t hurt.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that really the issue here…?” he muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs the leader of her class, Sakayanagi normally enacted strategies without mercy. But the people in her group who were from other classes were likely getting a vastly different impression of her. Sakayanagi, still holding her cane, got back onto her feet and politely thanked him once more.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I sincerely appreciate your help,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No big deal… Um, I mean, I’m glad that it wasn’t anything serious.” Perhaps Tokitou was feeling embarrassed, because he couldn’t seem to look directly at Sakayanagi, and averted his eyes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The impression I had of you was that you were a rather scarier person, Tokitou-kun,” Sakayanagi remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Me? …Well, I dunno about that, I guess.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi stopped walking to talk to him. The exchange they were having now almost looked like a display meant to show off the change in their relationship.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean that normally, when I pass by you in the hall, you tend to have a rather frightening look on your face,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-why would you notice that?” he sputtered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi answered without a moment’s pause, a smile on her face. “Because we’re in the same grade. I know quite a lot, even about you, Tokitou-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf we were in a normal high school, and they were a normal boy and girl, then a scene like this would likely lead to a misunderstanding. However, behind that smile of Sakayanagi’s, there was always the possibility of some ingenious scheme in play. Depending on the situation, even the fall she had taken might have been calculated. Though the only students present here who would think like that were probably myself and… \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSomeone like Ryuuen, who was staring at them, although apparently with disinterest. Sakayanagi and Tokitou walked side by side over to the bus passenger door, and Tokitou let Sakayanagi get on first—probably so he could support her in case of an emergency, like if she were to fall backward. Whether or not there was some ulterior motive at play here, it was clear that people who didn’t normally have any contact were gradually beginning to close the distance between one another.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust then, the bus bound for the ski resort, which had been delayed, finally arrived, taking the place of the bus that left for the city.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e4.2\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eW\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHEN WE DISEMBARKED\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e from the bus that took us directly to the ski resort, the eight of us decided not to go into the resort right away, but to explore the nearby area first. Although we hadn’t planned on it, Amikura had noticed that there were several souvenir shops and such in the area around the bus, and that was how the idea got started. It wasn’t like the ski slopes would be gone after a twenty- or thirty-minute detour.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ooh, Hokkaido mornings sure are freezing, aren’t they?” said Kushida, rubbing her gloves together and shivering. “It was nice and warm inside the bus, so you can really feel the huge change in temperature.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. I can’t believe it’s this cold when it’s still November,” said Amikura. “And there’s snow on the ground and everything; it’s so weird.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen the rest of the group had stopped moving, Ryuuen called over to them. “If you wanna take a look around, just go do it. I bet everythin’s closed, though.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was still just after 9:15 a.m. The ski slopes opened at 9:30, but most of the shops in the area appeared to still be closed. It looked like Ryuuen’s only plan for today was to enjoy skiing, and he was going to just stick around and wait for us. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAmong the scant handful of stores that were open at this hour was a somewhat unusual apparel store. For\u0026#160;some reason, Kitou walked over and stared intently at the clothing in the shop. There was a lineup of rather flashy and unusual clothes on display, for sure. I wondered if he’d found something he liked. Just as I was thinking about that, though, he put back the clothes he had picked out and started looking for something else.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Man, Kitou’s got some huge feet, huh? Those are like yeti footprints.” Watanabe compared the size of his own shoes to the footprints Kitou had left on his way to the apparel store, deeply impressed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKitou was tall, for sure. But even taking that into account, his footprints definitely did seem quite large.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, everybody, let’s all walk around together,” suggested Amikura, the person who had originally proposed the idea, and she started walking on ahead as though there was no time to spare.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida quickly went along with Amikura’s invitation, but Yamamura apparently declined, remaining where she was. It looked like Watanabe and Nishino had both decided that they’d each go walking around on their own.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yamamura-san? You’re not coming?” asked Amikura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Oh, I’ll stay here… Please don’t mind me. Go on ahead.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were only three people left here: myself, Ryuuen, and Yamamura. I did honestly want to go check things out with Amikura and Kushida, but since they hadn’t called out to ask me to come along, I guessed that meant I’d missed my chance. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWhat should I do now?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I wondered. I could walk around and check stuff out on my own, like Watanabe and Nishino, but…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince Yamamura had declined the invitation, she was going to wait here until our group mates returned. If I left, she’d be all alone with Ryuuen. That would’ve been fine if those two were just okay being around each other, but they had practically never even met before. I couldn’t envision a scenario where they’d try to get to know each other through conversation, so I felt like leaving her with him would be a terrible idea. Therefore, even though it was frustrating, I decided that the correct answer would be to stay here, unless Yamamura or Ryuuen decided to go ahead and do something on their own.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamamura trembled as she watched Amikura and the others walk off, their backs appearing smaller and\u0026#160;smaller as they disappeared into the distance. The cause of Yamamura’s shivering was her hands, which she was hiding inside her coat. I was almost completely certain that she had come here without a pair of gloves. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eIn that case, should I lend her mine?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I wondered. If she refused and told me she didn’t need them, though, that would make things a little awkward. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKitou and the rest of our group were already gone, so it was just the three of us now, Yamamura, Ryuuen, and I, and all was quiet. Yamamura seemed like she was putting up with the cold as much as she possibly could, but she couldn’t completely hide it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile I continued to hesitate over saying something, though, Ryuuen spoke up in a harsh tone. “Hey, Yamamura. Take your hands outta your pockets.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh…?!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, he had also noticed how cold Yamamura seemed, and how unnatural she looked with both hands thrust into her coat. I thought she’d show her cold hands, but she averted her gaze, and then…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No.” Her voice was very small, but her response was a flat refusal. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I won’t. It’s cold.” Yamamura gave the reason, but\u0026#160;she didn’t mention whether or not she had gloves. You could feel the cold even if you were wearing gloves out in Hokkaido, so it would be warmer to keep your hands inside your coat. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI assumed the conversation would end right there, but Ryuuen trudged over the snow-covered path to Yamamura, grabbed her right arm, and forcefully pulled her hand out of her pocket.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah—!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter he had confirmed firsthand that she wasn’t wearing any gloves, Ryuuen let go of her arm, and Yamamura hurriedly stuffed her hands back inside her coat, as though she were trying to escape from him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah, course it’s cold,” he scoffed. “Where are your gloves?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen had proved that Yamamura was going out without gloves thanks to his power play, but she didn’t answer him. She turned her back to him, as if telling him, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Please leave me alone.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re not even good at handlin’ yourself on the slopes in the best of circumstances, and now you want to mess yourself up by letting your hands go numb?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a valid point. Yamamura was still a beginner. If\u0026#160;her hands went numb because of the cold, she wouldn’t be able to improve her skiing. On the contrary, it would only increase the risk of her taking a fall.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you get seriously hurt and cause a scene, that means my ski trip’s gettin’ canceled. You gonna take responsibility for that?” To my ear, Ryuuen’s emphasis on his own skiing sounded like a mixture of typical Ryuuen selfishness and awkward kindness on his part.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I…” Yamamura seemed unable to respond, like it was an issue that wasn’t simply a matter of feeling.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, where are your gloves?” he repeated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I forgot them,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Pft, I can’t believe someone could be this stupid,” huffed Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was true that not many people would forget to bring gloves in this cold weather. Ryuuen, snickering, looked down at his own gloves. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHe couldn’t possibly be planning to lend her his own gloves, could—\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Ayanokouji. Lend her your gloves,” he snapped.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Me?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe hadn’t shown that much development in the kindness department after all, instead throwing everything onto me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even though I’m a beginner at skiing too?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ain’t gonna be a problem if \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e get hurt,” Ryuuen replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had no idea what kind of logic he was using there, but… Well, the store that sold gloves in the area didn’t appear to be open yet, unfortunately. In that case, I supposed I had no other choice but to let Yamamura borrow my gloves. There might be specialized gloves available in the ski resort, but even so, I was sure getting just ten to fifteen minutes’ worth of extra warmth now would make a difference.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-it’s all right. I’m fine,” said Yamamura, distancing herself from us, and already exhaling into her hands.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You really should stop protesting and take them,” I told her. “The cold causes vasoconstriction—your blood vessels are constricting. Your body is shaking because of a reaction in your muscles, which are trying to raise your body temperature. It might be dangerous for you to go skiing in your condition. Wouldn’t it be most frustrating for you if things turned out exactly like Ryuuen said they would?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well…” she trailed off.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI took my gloves off and practically shoved them into her arms. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But…what about you, Ayanokouji-kun?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll be fine,” I said. “More importantly, don’t do anything rash, so you won’t injure yourself when you go skiing.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t like I had a special tolerance for the cold or anything, but like Ryuuen had implied earlier, if you handled yourself well, then there shouldn’t be any problems.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I’m sorry…” Yamamura, though sounding very obliged and sorry for the trouble, put my large gloves on, her hands trembling slightly. Then, she thrust her hands back inside her coat pockets. They’d likely still be cold for a while, but they’d start feeling better after a few minutes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Go and buy a new pair of gloves in your size later,” I added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I will. Um, please allow me to compensate you for the gloves, Ayanokouji-kun, when we arrive at the ski resort,” said Yamamura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Compensate?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m wearing them now, so…I’ll feel bad when I return them to you. I’ll dirty them.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure they won’t get that dirty,” I said. “Don’t worry about falling and messing them up or anything; you can just return them however they are, that’s fine.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not what I’m saying. Me wearing them has made them dirty, so…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWas she a clean freak or something? Was that how she thought? Wait, but no, Yamamura had still accepted the gloves without fighting it, albeit with some reservations. I didn’t quite understand her way of thinking here.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d like for you to let me compensate you,” she insisted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t imagine that she would just openly choose some cheap pair and give me those when it came time to reimburse me for the gloves. That would force her into a great expense for something that didn’t require reimbursement.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’d just be a waste of Private Points,” I said. “There’s no need for something like that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Won’t you feel disgusted?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI really didn’t understand what she was saying. Why would I feel disgusted by Yamamura having worn my gloves? I was sure I’d feel the same way no matter who wore them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s all right. I’d feel more uncomfortable with making a big fuss over this and having you pay me back for it.” I stated my feelings somewhat firmly, expressing my bewilderment. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Th-then please allow me to at least express my thanks in another way.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t think that thanks were necessary, but maybe something had to be done for Yamamura to feel better about this. If she was going to be this insistent about it, then maybe I should provide her with an option that was acceptable to her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Could I ask you one question to let you express your thanks?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yes?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Was there any reason why you weren’t wearing your gloves this morning while we were waiting for the bus?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just forgot.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI understood that it wasn’t like she was going around without gloves on purpose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But you had plenty of time to go back and get them,” I pointed out. “Or did that slip your mind too?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was curious about that point as well, so I thought I’d take this one step further and ask her about it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I had that kind of feeling, I guess…” she answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Feeling?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Like a feeling that it’d be difficult to get back.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was true that there’d been a huge crowd of students jamming the lobby, but it was difficult to say whether it would’ve really seemed all that difficult to get through them. Well, no, that was just my perspective; I needed to consider that how I felt about it would be different from the way Yamamura felt. Although we had only talked for a few minutes, I was able to see a little bit about the student known as Yamamura. It also made me more interested in her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who do you usually hang out with, Yamamura?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat kinds of students did a person like her have as friends? Did she make friends like herself, who were the quiet type? Or was she a part of a popular student’s social circle, like how Kushida was welcoming of anyone? Or was she the type of person who pulled away from others altogether? \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamamura, however, didn’t answer my question immediately. Her facial expression didn’t change very much, but her eyes narrowed slightly, and she looked away, like she was feeling a little uncomfortable.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No one in particular,” she replied. “I generally spend all my time alone.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Alone?” I repeated. “I didn’t get the impression that people in Class A would just neglect someone and leave them all by themselves.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s because I don’t have much presence… They don’t even notice that I’m by myself. It’s an everyday thing, so I’m not particularly bothered.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was true that some people just didn’t have much presence. If I had to classify myself, I would have to say that I was that same type of person, too. Comparing Yamamura and me, though, chances were high that we had completely different dispositions. Now that I thought about it, if Kushida had noticed Yamamura was so cold, there was no way she could have ignored it. But Yamamura’s almost shadowlike presence seemed to have dulled the sensitivity of even someone like Kushida, who was always concerned with other people’s reactions. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, truthfully, since she was so lacking in presence, I didn’t think anyone would have even noticed if she had gone back inside to get her gloves before. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHer lack of presence, hm?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e If I analyzed that objectively, I could also see some of her true nature.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yamamura, do you like yourself?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, of course not. That’s absolutely unthinkable.” She answered honestly, perhaps out of weakness at having had to borrow gloves from me. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, the thing she wanted to hide most was herself, and that was one of the reasons why she shied away so much. If you didn’t want to show yourself, if you didn’t want to be noticed, then inevitably, you would tailor your behavior to avoid drawing attention to yourself. Even in discussions, she would hide behind someone, so as not to let others acknowledge her. It was like wearing black clothes in the middle of the night; of course you wouldn’t stand out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe also didn’t move around unnecessarily, so it was rare for a movement she’d made to catch someone’s eye. As a result, her presence had become as scant as possible. Furthermore, based on what I’d seen, Yamamura seemed to be twice as wary of others as most people. In other words, she was afraid of other people, and refrained from asserting herself as much as possible.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was beginning to see that this combination of factors had resulted in the creation of the student known as Yamamura, who was lacking in presence and difficult to stay aware of. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe problem, though, was that even if I could understand the cause, there was nothing I could do to immediately solve the problem. If someone like me, who didn’t normally interact with Yamamura, said something about it, all I’d achieve would be making her even more wary than she already was. It would be easier to say something if there was someone she was close to, whom she could trust. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUltimately, my conversation with Yamamura ended there, and we both fell silent. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAbout ten minutes later, just before the slopes opened, everyone had returned.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, how are we going to divide ourselves?” Kushida said. “We don’t necessarily all have to ski together as one big group, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though it was mandatory that we acted as a group, that didn’t necessarily mean that we had to do every single little thing together as one. With a group comprised of experienced skiers and beginners, it would be difficult or even regrettable if we were to make everyone conform one way or the other when we went skiing. What was important was balance; whether the people around us could judge it as reasonable when they saw it. We would probably need to consider splitting up the group into teams, starting with the least skilled of the eight of us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yamamura and I are set for the beginner course, so what should we do? The two of us could ski together,” suggested Watanabe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was a gentle course for beginners at the bottom of the ski slopes, so it was a given that that the group would let Yamamura and Watanabe go there. Yamamura immediately agreed to Watanabe’s offer.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think it would be a good idea if someone who knows how to ski well tags along with you and Yamamura-san, though,” Kushida said. “If you don’t mind, I could—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, it’s all right, Kushida-san,” Nishino cut in. “I’m a beginner, so I’ll do it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh? Are you sure?” asked Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, it’s okay, you can go ahead and ski without worrying about it. I know how to ski, but the advanced course is a little scary for me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps Amikura had planned on doing the same thing from the start, because she chimed in right after Nishino. “I’m not confident enough to tackle the advanced course myself either…so I think I’ll join you, too.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd so, as it turned out, we split into two groups of four, and agreed to ski on separate courses.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, if you do want to go skiing on the intermediate or advanced courses, feel free to let me know anytime,” Kushida said, just in case Nishino or Amikura were purposefully holding themselves back to go on the beginner course. “I’ll be happy to help.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Also, lunch is at noon,” Watanabe added. “So, let’s all meet back up at the food court at that time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe moved as a group toward the entrance to the slopes. I thought I heard an unfamiliar sound, almost like the sound of a horse galloping, and just then a horse indeed galloped by us, dashing quickly through the snow. While I was wondering what was going on, I realized that Kouenji was the one riding the horse. The students from the other classes appeared genuinely shocked, and even Kitou seemed somewhat taken aback. From the perspective of students who hadn’t been around Kouenji for long, this was an understandable reaction.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Excuse me, sir—! That’s not the course—!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the wake of Kouenji’s hoofbeats, several panicked staff members were shouting from a distance, attempting to give chase.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What the hell…?” Nishino gaped.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s incredible…” murmured Yamamura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe two of them simply stared at Kouenji, stunned, as he got smaller and smaller, becoming a tiny speck in the distance.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Funnily enough, even though I’ve never seen anything like that before, I don’t feel that surprised,” mused Kushida, quietly enough so that only I could hear it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess that’s because, as his classmates, we’ve gotten used to seeing Kouenji’s bizarre behavior…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStrangely, I felt like it wasn’t that odd for things like that to happen now, knowing Kouenji. If I were to put it bluntly, I was used to it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e4.3\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eW\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eE BRIEFLY SPLIT UP\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e so that we could get changed. Once we had finished getting ready, we gathered at the meeting place. Kushida, Ryuuen, Kitou, and I went over to the front of the lift. Since two people could ride per lift carriage, we decided that it would be me with Ryuuen, and Kushida with Kitou. We’d determined that that combination would make it the most difficult for anyone to fight. Just to be on the safe side, I let Kushida and Kitou go first and then let a few other pairs on after them. That way, Kitou and Ryuuen couldn’t glare at each other during the ride.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can’t you try and get along with Kitou a little better?” I asked Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s an impossible ask, my guy,” he replied, looking out at the snow-covered mountains. “Now if it was Kitou who was askin’, that’d be a different story.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, there’s not much hope there, huh?” I sighed. “In\u0026#160;that case, I guess there’s nothing we can do about it. But really, this might be a good chance, you know. Kitou seems to hold some degree of trust from Sakayanagi, from the looks of things. I would’ve thought that someone like you would see this as an opportunity to get Kitou in your pocket. Depending on how things play out, you might even be able to make him into an ally.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen, sitting beside me on the lift, seemed to think that this school trip was mainly about gathering information, and he certainly wasn’t wrong on that point. In fact, I could tell that Sakayanagi was doing something similar.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kitou might not even fully look like a human bein’ on the outside, but the guy’s definitely got a lot of loyalty,” Ryuuen replied. “Anyway, don’t you think Sakayanagi was already on alert from the moment that Kitou got put in the same group as me? If I started tryin’ to negotiate without thinkin’, I’d just be shootin’ myself in the dick.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s rather realistic.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen had little contact with Kitou up until this point, and he still didn’t know very much about him. However, judging from how thoroughly he seemed to dislike Ryuuen, I had a good sense of his willingness to protect Class A together with Sakayanagi. I hadn’t heard about any problematic behavior from him, either. If\u0026#160;Ryuuen carelessly attempted to negotiate with him and bring him over to his side, it would be like asking for information to be leaked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides, the only talent I needed from Class A was Katsuragi,” Ryuuen added. “Kitou and Hashimoto are good enough as her little dogs, but they ain’t good enough to be my pawns. It ain’t worth the risk of tryin’ to nab ’em.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, that was the reason Ryuuen didn’t act friendly toward Kitou, and instead continued to antagonize him. While Ryuuen did appreciate what Kitou and the other Class A students were capable of, he seemed to see Katsuragi as the only one who stood out. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust then, the lift carriage arrived at its destination, and we got off at the advanced course. Kitou, who was waiting there already, called Ryuuen over to the starting point with nothing but a glance. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFirst, we’d take our time and enjoy the… Oh, who was I kidding? We weren’t going to follow such a laid-back plan of action.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, give us the signal,” barked Ryuuen to Kushida, ordering her to count them down.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Be careful as you go down the slopes, you two,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida raised her hand and began the starting countdown. Ryuuen and Kitou placed themselves a few meters apart from one another and got in position, ready to start skiing. I wondered who the winner of this competition would be.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Start!” shouted Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe instant that she lowered her hand, the two of them took off at almost the exact same time, getting off to a good start.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s follow after them,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?” said Kushida. “Will you be okay with that, though? Actually, I’m not sure that I can catch them myself…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, let’s just go after them slowly.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd with that, Kushida and I started heading down the slope, just a few seconds after Ryuuen and Kitou. The two of them were in a dead heat as they rocketed down the course, with one taking the lead and then the other, back and forth. They flew down the slope at incredible speed, drawing beautiful arcs to the right and left. My own technique, which was still incomplete as of yesterday, was now beginning to improve thanks to the examples I had in front of me right now. Here, on the\u0026#160;longer advanced course, I could deepen my knowledge and study more carefully. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe battle between Ryuuen and Kitou was almost completely even. I’d expected that one of them would pull ahead right away, but they were pretty much neck and neck. As far as I could tell, there didn’t seem to be much difference between them in technique, and their competitive spirits were about equal in intensity. Even after they passed the halfway mark, there was still no sign of either one seizing a decisive victory. As the racers finally reached the endgame of their competition, the two gradually got closer and closer together, no longer keeping a wide space between them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThings were about to take a turn for the worse. The two skiers were now so close that they were at risk of colliding into each other due to their positions overlapping. That wasn’t an accident, for either of them. This was a dangerous sign; either of them would try to win even if it meant tackling their opponent and trying to make them tumble down the slope. Copying both of their moves, I accelerated while absorbing almost all their techniques.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Die, Kitou!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To hell with you, Ryuuen!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI thought I sensed some voices, after a delay. Just a second before I heard their voices, though, I forced myself into the small gap between Ryuuen and Kitou. The sudden intrusion of a third party caused the two of them to hurriedly swerve to the left and right. Although both were glaring at me, I had succeeded in forcing them to keep their distance from each other. After I finished skiing down the advanced course, Ryuuen and Kitou came to a stop slightly afterward. They immediately turned around and walked up to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKitou approached me with such intensity that it felt like he was going to grab me. “Why did you get in the way?” he demanded angrily.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because I judged that it was dangerous,” I replied. “You two were getting overzealous and trying to win through methods other than skiing.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No matter what form it takes, a competition is still a competition,” said Kitou. “Ryuuen understands that, too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whether your opponent understands that or not is irrelevant. You couldn’t call what you were doing a skiing competition.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKitou muttered some words of dissatisfaction, glaring at Ryuuen, before skiing away. He seemed to feel that the mood wasn’t right to ask for one more round. Around that same time, Kushida also came down the slope, arriving where I had stopped.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, the three of you are just way too fast,” she said. “Or, rather, Ayanokouji-kun, what you did was totally out of the ordinary…!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen, a disgruntled look on his face, trudged through the snow and pressed up to me. “Hey, are you really a beginner, asshole? Or were you just pretendin’?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Pretending?” I repeated. “No, yesterday was my first time going skiing.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen must not have believed me, because he spat on the ground and then headed toward the lift, alone. Well, at least we’d have some peace of mind for the time being. Probably.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s kind of understandable that he’s angry, I think,” said Kushida. “Your skiing was incredible. You were kind of like the protagonist straight out of a manga, who has the sort of talent to do everything perfectly without even trying. I know Ryuuen already asked, but was this really only your second time skiing?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnfortunately, I was no such manga protagonist. Over the course of my life thus far, I had accumulated countless experiences in my body. Even though skiing specifically was new to me, sports in general were connected by broad strokes. I just linked those points together and skied using the information that I had gained, both verbally and\u0026#160;visually.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can’t believe it’s only my second time?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, it’s not like that. I do believe you. But I might not have, if I hadn’t seen the way you moved to grab Amasawa that one time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, she was saying that she believed because back then, even if it had only been for an instant, I’d shown her a fight between White Room students. Did the doubts and apprehension she’d had then in turn make my improvement at skiing seem more believable?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re amazing.” She complimented me once again, but I didn’t feel ready to accept it honestly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah, not really.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This again, huh?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe must have thought I was just being humble, but I couldn’t help it. Anyway, the fact was that Ryuuen and Kushida were advanced skiers, and so, in this field, they were true role models for me. They likely hadn’t accumulated as many experiences as I had, either. Looking at it that way, they had more of a knack for this than I did.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How about we head over to the lift, too?” I suggested. “There’s no more trouble here, and I want to enjoy skiing.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure, let’s,” Kushida agreed. “Honestly, though, this might be a challenging time for the people who can’t ski.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYou could say that for any activity, generally. It would be nice if everyone could have fun, even if they were bad at it, but that wasn’t how things worked. Whether video games or sports or whatever, people who aren’t good at an activity oftentimes don’t enjoy it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e4.4\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT NOON\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e all of us in group six gathered at the food court attached to the ski resort. We each ordered what we wanted, and then went to our seats. I was given a pager marked 32 and was told that it would ring once my order was ready; that was my signal to come get it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How did things go for you and the others, Watanabe-kun?” asked Kushida. “Did you improve your skiing?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaving spent all day on the advanced course, she’d had no chance to see how things went for those four on the beginner course, so she was asking about the fruits of their labors.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think I can ski okay now, I’d say,” Watanabe replied. “Not as good as Nishino or Amikura yet, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a humble reply, but I could see some self-confidence poking through, even if only a little. Yamamura, on the other hand, whose name was not mentioned, wore a dark expression and seemed lacking in spirit… So, the same as usual. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWatanabe leaned over to whisper just to me. “As for Yamamura, well… She’s not there yet.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe hadn’t improved, then. The person in question was giving off strong “don’t talk to me” vibes, so I decided against saying anything to her. My pager started beeping, so I went and got my food. My piping hot curry soup with rice was placed on a tray, and I brought it to the table. Then, once the eight of us all had our meals, we started eating our lunch.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen, who had ordered a smaller meal, just a hamburger, was the first to finish eating. He thrust the wrapper and tray at Watanabe. Watanabe forced a smile and then loaded Ryuuen’s empty trap on top of his own.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Lemme talk to you in private for a minute, Ayanokouji,” Ryuuen said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um… But I’m still in the middle of eating.” I had about a third of my curry soup with rice left. By the time I was finished with whatever Ryuuen wanted, my food would have gone cold.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hurry it up,” snapped Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWatanabe gave me a pitying look, bidding me farewell without a word. As for Kitou, he… Well, he hadn’t been looking at me in the first place.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003csp
