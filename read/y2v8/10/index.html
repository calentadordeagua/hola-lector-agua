m a distance, could not.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It ain’t a question of, like, if I’m givin’ up or not. I still love her, those feelin’s haven’t changed, but it’s just, I dunno, I feel like she’s this beautiful flower I long for that’s out of my reach.” Sudou couldn’t seem to sum up how he felt very well; after saying that, he laughed a bit.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you going to do about Onodera?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Man, how should I know? Even you don’t know how she really feels. You don’t really gotta me ask me that, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s true.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I guess it is what it is. Stuff will happen as it should,” he said. “Onodera’s good people, and we got the same kinda interests. Now that I’m not gonna be droolin’ over Suzune all the time, I feel like I can hang out with Onodera fairly, y’know?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhether or not that developed into love was a secondary concern.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m just tellin’ you this now,” Sudou added, “but I’m gonna keep workin’ hard on my studies from here on out. I was doing it for someone else before, but starting now, I’m givin’ it my best for myself. My goal is to get to around Hirata’s level.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’d be another pretty huge jump,” I remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Sudou did manage to get over that wall, then he’d eventually reach the top level in our grade, alongside the likes of Horikita and Keisei. It seemed like he wasn’t going to stay discouraged after being rejected, but instead, he was able to look to higher goals.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e4.8\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em; letter-spacing: 0.60mm;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHURRIEDLY RETURNED\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to my room, where I saw that Horikita was standing in front of my door.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you doing?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Waiting for you,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For me?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had a bad feeling about this, so I tried playing dumb, but Horikita’s expression stiffened.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You are a mean one, Ayanokouji-kun. You were watching, weren’t you?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Watching what?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You were in the souvenir shop earlier, weren’t you? If\u0026#160;it was anyone else, it might have been just a coincidence that you were nearby, but with you, I can’t imagine that’s it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWhat a high-handed way of thinking. She’s right, but still. If I need to take similar measures against Horikita in the future, I’ll have to take care not to be seen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re thinking about how you’ll have to be careful not to be discovered next time,” said Horikita. “Aren’t you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Impressive.” I clapped my hands out of earnest admiration, praising her perceptiveness. “Sudou asked me to. He said he wanted me to watch him tell you how he felt.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even so, don’t you think that shows a lack of consideration for the girl involved, i.e., me?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose I can see that,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see Sudou-kun still has a way to go,” she sighed. “He loses points for asking you to watch him.” Though she sounded exasperated, she didn’t seem that angry.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So? Did you come all the way here just to complain that I was a spectator?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes,” she replied, clearly and without hesitation. Then she added, “I’m half-joking. Actually, there is something I wanted to talk to you about. But it looks like you’re in a hurry to get inside.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, not exactly, but…if possible, could we talk tomorrow?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why’s that?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A certain someone came to me before you did and is very demanding,” I explained. “I haven’t seen her at all in two days, and she has taken great offense.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Karuizawa-san.” Horikita pondered for a moment. I wondered if she was thinking of telling me to put off seeing Kei until later, if this was an important matter. But she said, “All right, tomorrow night, then. I’ll forgive you if you can promise to meet me then.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right. I promise.” I had no other choice at this point.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter leaving the key with Kitou, who was already in the room, I went to meet Kei. Though we were already recognized as an official couple by many, we couldn’t just go out and about anywhere we pleased, like Ike and Shinohara. We decided to meet up in the area that had multiple reservable private baths. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs soon as we met up, Kei scolded me harshly, but she immediately switched to sweet mode. After I embraced her and got her into a better mood, we spent some time relaxing together for a while.\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 4: School Trip Day Two\",\"volumeId\":\"y2v8\",\"chapterIndex\":10,\"prevChapter\":{\"volumeId\":\"y2v8\",\"chapter\":9,\"title\":\"Chapter 3: Self-Explanatory School Trip\"},\"nextChapter\":{\"volumeId\":\"y2v8\",\"chapter\":11,\"title\":\"Chapter 5: School Trip Day Three\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Kanzaki Ryuuji’s Soliloquy\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: Know Your Enemy, Know Yourself, and You Need Not Fear a Hundred Battles\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: Self-Explanatory School Trip\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: School Trip Day Two\",\"href\":\"Text/section-0008.html#auto_bookmark_toc_top\",\"in
