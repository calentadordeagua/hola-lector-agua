an style=\" font-size: 1.00em;\"\u003e“I’ll be stepping away from my seat for a minute,” I announced.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay. We’ll keep eating and wait for you to get back,” said Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI left Kushida to handle things there, and I walked through the food court with Ryuuen. We finally stopped somewhere around the edge of the food court, and he took out his cell phone. He unlocked his phone with a touch of his finger, and he stared at the screen for a while. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I knew it,” he said. “Just like I thought, that bitch Sakayanagi is usin’ her minions as spies.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt looked like he’d gotten a report from a classmate that had confirmed his suspicions.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just like you, huh?” I replied. I wasn’t asking Ryuuen straight out, but I figured that he had been giving his people the same sort of instructions. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah. This school trip ain’t for makin’ friends. What’s important here is me rippin’ the arms and legs off first, so I can crush the head. And it sounds like Sakayanagi knows that too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNeither Sakayanagi nor Ryuuen could fight a class battle all on their own. So, how did you beat your opponents in a team competition where your class acted together as a unit? Improving your allies’ abilities was important, but it was also important to reduce your opponents’ strength. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi had particularly bad legs, so her normal range of motion was extremely limited. She generally compensated for that through Kamuro and Hashimoto. If Ryuuen was able to get a hold of their weaknesses, and held something over Kamuro and Hashimoto that would make them submit to him, Sakayanagi lost her valuable legs. Her information-gathering abilities would be dramatically reduced.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, so let’s hear the reason you deliberately called me over like this,” I said. “It wasn’t just to give me an update on this reconnaissance contest you and Sakayanagi have going on, was it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Starting now, I’m gonna be issuing orders to the rest of my class to start preppin’ for all-out war against Sakayanagi,” he said. “Whether we’re doing a written test or whatever for the end-of-year exam, I’m gonna crush her by any means necessary.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You said something similar back on the bus. About how the fight’s already begun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. But before I make my move, there’s somethin’ I\u0026#160;gotta double-check with you first.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as Ryuuen said that, my phone vibrated. I told him to hold on a minute, and then I looked down at my phone. I had gotten a short message from Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Yamamura-san is heading your way.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWas she heading over here to see how I was doing because she was worried about me, since I had been called out by Ryuuen? In all likelihood, Yamamura was acting on orders from Sakayanagi. It was possible that she would eavesdrop on my conversation with Ryuuen once she was nearby, but I decided to keep that information from Ryuuen. After all, that was yet another part of the battle between Sakayanagi and Ryuuen. If I did anything to help Ryuuen here, that would be to Sakayanagi’s disadvantage.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed as if Ryuuen had gotten another message from someone himself, though, because he looked down at his phone. Then he put it back in his pocket, his expression unchanging, and began speaking once more.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure you remember what I said a year ago, about me getting eight hundred million points,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I still don’t think that’s feasible, even now,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. I’m sure the rest of my class would react pretty much the same way, if they found out.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you trying to say?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki was probably the only person in his class who knew about Ryuuen’s strategy to accumulate eight hundred million points. And Ibuki had probably only learned about it by chance, and didn’t actually know the specifics.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re talking about a shitload of money here. It’s way more than I could hope to get if I was doin’ it in absolute secret. I’ve only got about a year left at this school, and it’s gettin’ a little late for me to make a move.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was certainly true that the cooperation of his classmates would be essential if he was serious about raising the viability of that strategy. Just like Ichinose had gradually pooled Private Points from her classmates bit by bit, with their trust, Ryuuen also needed to work with his classmates if he was going to reach that target. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When you say that you want to double-check something, are you asking me if I’ll help you with getting to eight hundred million points?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You realize I’ve been showin’ your class a whole lotta kindness, in my own way, right? For a while now, too, like with the Sports Festival and the Cultural Festival. And I’m even takin’ Sakayanagi on in the final exam. I got that all taken care of for you. You ain’t dissatisfied with that, are ya?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIndeed, since we had that discussion with Ryuuen last year, Horikita’s class had been able to move about so freely that they had almost forgotten that Ryuuen was even here. If Ryuuen had remained as belligerent as he had been in our first year, things would not have gone as smoothly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And you sure seem to be gettin’ along good with Kushida, huh?” Ryuuen added. “Even though you were so enthusiastic about gettin’ her expelled.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry,” I said simply. “Sometimes you have to change your policies.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps Ryuuen really liked what I’d said, or maybe it just resonated with him, because he laughed and clapped several times.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I wanted to, I could destroy Kushida, no problem,” he said. “You know that, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen was one of the few students outside of our class who knew the truth about Kushida. He could have done something anytime, but he didn’t, which was likely the result of that promise.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re asking me to fulfill that promise,” I said. “And you’re going as far as using threats. Aren’t you being pushy?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t give a damn if I’m bein’ pushy. So, are you gonna do it? Or not?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe had only made a verbal agreement back then, but Ryuuen was making it clear that he’d show me no mercy if I violated it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Before I give you my answer on that, let me ask you, what happens after you defeat Sakayanagi?” I inquired.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Isn’t it obvious? After I defeat Class A in the finals, it’ll be a one-on-one battle with my class against yours. The way I see it, it’s all part of the story I got laid out, leading up to where I beat you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, that’s what he was thinking, huh? Looking at everything so far, though, I didn’t really have any doubts.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This sounds a little too convenient,” I said. “You stepped off the stage once before—you were supposed to have taken on the role of laying the groundwork for Kaneda and Hiyori. But now, you’re back at center stage. The point is, if you wanted me to fulfill my promise to you, you were supposed to back off. If we get to a situation where we become Class A and you become Class B, Ryuuen, then I’d be inevitably handing the win over to you if I helped you. Wouldn’t I?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnly then could we create a situation where we could talk about working together toward the eight hundred million points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t like it?” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Obviously not. If your class and Horikita’s class seriously do clash, and as a result you win and move up to Class A, then we’ll be the only ones to look like fools. Or are you saying that you promise to bring the students from Horikita’s class into Class A if your eight hundred million points plan works?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen’s smile vanished and he shot me a sharp side-eyed look. “Absolutely not. The extra Private Points belong to me and my people, obviously.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThose points were currency that could live on even after graduation as money, so he had no intention of using them for saving students he had no business with.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, if you lose, we bail you out, and if you win, you abandon us… Hm,” I said. “Yeah, that’s a proposition I don’t need to bother considering. Therefore, I can’t cooperate with you on the plan to save up eight hundred million. However, you are free to attack whatever class you want from this point onward; I have no right to stop you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh. Guess you ain’t such a naïve moron after all, eh, Ayanokouji?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s because this issue doesn’t affect me alone.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Suppose I can’t argue with ya on that, then. Just have to pretend that conversation never happened and drop it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe had backed off much more easily than I expected. He seemed to have already known that I’d turn him down.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even though our negotiations have broken down, do you still plan on saving up the eight hundred million points?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not plannin’ to change my strategy at this point in the game,” he replied. “My main goal is to save up the eight hundred million. After that, I’ll defeat both you and Sakayanagi. And if I don’t spend any of it and get to Class A, I can graduate with tons of cash. Ain’t that right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHis plan, which could only be described as a pipe dream even in the best of circumstances, had now been replaced by another ideal scenario. All the same, Ryuuen boldly proclaimed that from here on out, he was going to try and accumulate eight hundred million points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve been throwin’ money around so far, pullin’ Katsuragi out of his class and into mine, and usin’ those first-years, but now’s the time I start collectin’. I’m switchin’ things up to a strict Private Point system.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf he was that eager to collect Private Points, there was going to be some risk involved. Ryuuen’s irregular, incoherent thoughts and behavior here were casting a strange shadow over my own thoughts.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t give me that look, like you’re so surprised that I let you get away without fulfillin’ your promise to me, without even pushin’ for a compromise.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah, of course I’m surprised. I’m not seeing the true nature of this conversation,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s simple. It’s just that you breakin’ our contract was a foregone conclusion. I can’t crush you if I’m still partially connected to you. But if you break things off like this, well, that’s a different story. Now I can thoroughly wreck you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, in other words, he was choosing a resurrected obsession with victory against me over aligning our mutual interests. He’d said something similar on the bus before; once again, he was declaring war. Even so, I wasn’t completely convinced. There was some kind of agenda in this story, though I likely wasn’t going to get an answer even if I pressed him on it here and now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s fine to look ahead to the future,” I told him, “but you’ll have to beat Sakayanagi first before thinking about a rematch with me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ha. I know that chick is clever, but that’s all she is,” Ryuuen scoffed. Clearly, he had absolute confidence in the final exam’s battle.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eRyuuen, you were defeated, and then you were resurrected. I’ll also admit that your talents have surpassed my expectations.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was true that the success story of Ryuuen Kakeru remained steadily on track.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhether or not he could overcome the barriers at the very end was another matter. I had wondered if this discrepancy, his failure to recognize obstacles as obstacles, might eventually have an effect in the arena of battle. Of course, those omens and signs would change again, depending on how Sakayanagi perceived Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You head on back first, Ayanokouji,” ordered Ryuuen, and with that, he walked toward the restrooms.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHiyori, who had been watching us from a seat somewhat far away, noticed me and waved. Apparently her group had also come to ski. I gently raised my hand in response, and then returned to my group’s table. Yamamura had already returned as well, and she was silently fiddling on her phone with a blank, nonchalant look on her face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Where’s Ryuuen?” asked Watanabe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seems like he’ll be coming back after stopping by the bathroom,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Are you okay?” Watanabe worriedly looked me over, examining my body carefully.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He didn’t smack you or anything, did he?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry. We just talked a little, is all,” I assured him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I sure hope that was all…” said Watanabe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamamura had finished her meal after slowly picking at it here and there; she and Nishino both grabbed their trays.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll…go put my tray away,” announced Yamamura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe and Nishino had ordered food from the same place, so they were apparently heading back there together.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKitou gave me a penetrating look. “Ayanokouji, if Ryuuen has something over you, don’t hesitate to talk to me about it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps he felt like Watanabe’s way of addressing the matter was too lax. I kind of wished he could have said that before Ryuuen had called me away, though, if at all possible. When Ryuuen returned shortly after, Kitou turned his gaze away from me to look at him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve run away from me and decided to intimidate people from other classes now?” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?” said Ryuuen. “Heh heh, don’t worry, Kitou. I’m gonna bring you Class A bastards down, just you wait. Sakayanagi ain’t nothin’ more than a steppin’ stone for me. I’ll show you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can never defeat Class A,” huffed Kitou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh. I wonder about that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen appeared calm—or perhaps it was better to say that he was putting on a show to appear calm and confident. He might have sincerely believed he was going to win, but there was no actual evidence to back that up. Of course, it was possible he had some information that I didn’t, but in a simple comparison of their abilities, Sakayanagi was a cut above Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It doesn’t have to be the final exam,” Kitou said. “Come at us anytime.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kitou, you son of a bitch, you ain’t got that kinda authority,” snorted Ryuuen. “All you got goin’ for you is that you’re a loyal dog. You’ll be causin’ trouble for your master if you make careless remarks like that, y’know?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt being called a dog, Kitou placed his large palms on the table and stood up. “I alone am more than enough to defeat you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh? So, what, you’re sayin’ you wanna go for round three?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTheir pillow fight had resulted in my pillow getting damaged. And thanks to me interfering on the slopes before, they hadn’t been able to settle things by skiing. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, you two, get along,” Kushida cut in. “There are already rumors floating around that our group is pretty dangerous.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven some members of the general public in the vicinity had begun watching the standoff between Ryuuen and Kitou with curiosity. If they continued to be so showy, I supposed it was only a matter of time before the teachers heard about it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come to think of it, aren’t Nishino-san and Yamamura-san taking a while?” said Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now that you mention it, yeah,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAll they were doing was returning their trays; it shouldn’t have taken them more than a minute. But there was no sign of them. Kushida looked around for them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, there they are,” she said. “But it looks like they’re talking with some boys I don’t know.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida pointed toward Nishino and Yamamura across the crowded food court. They were surrounded by five guys who, judging from their age, appeared to be students. And they had a threatening air about them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey now, what’s this?” Ryuuen said. “Looks like Nishino is in trouble. Let’s go help her.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’d be better not to do anything when there’s a large crowd of people around,” I told him. “If you recklessly start a fight, there’ll be trouble.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn spite of my warning, Ryuuen and Kitou had already gotten up from their seats. Those two, who would never listen to anything resembling caution in the first place, headed over to where Nishino and Yamamura were standing. They didn’t even bother to communicate their intent to each other. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kushida, you and the others wait here.” I instructed her, Amikura, and Watanabe to stay put.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I caught up to Ryuuen and Kitou, who had rushed off to Nishino and Yamamura with strong, fast footfalls, I could overhear the conversation at the scene.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re not gonna apologize for bumpin’ into my shoulder?” said one of the guys. “You got ramen broth all over my clothes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, it wasn’t Nishino who had started the trouble here. Instead, it began with Yamamura, who had bumped into these guys.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aren’t \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e guys the ones at fault here, for not even noticing Yamamura-san standing there while you were walking?” replied Nishino.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe guys just laughed unkindly in response, mockingly touching their shoulders as if Yamamura had hurt them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah, I mean, she’s practically a ghost,” another guy said, “so of course we couldn’t see her. Right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I am really…sorry.” said Yamamura, in a tiny voice.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMost likely, she hadn’t apologized just once or twice. But the guys carried on, acting as though they hadn’t heard her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, we’re here on a school trip from Gifu,” one of them said. “Let’s hang out. We’ll forgive you if you hang out with us.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNishino was standing in front of Yamamura to protect her, blocking their way. But then one of the guys forcefully grabbed hold of her arm.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? You’ve got to be joking,” she said. “Who’d wanna hang out with people like you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe shook her arm free from her attacker’s grasp, swinging wide, and ended up lightly slapping one guy’s cheek.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That hurt.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe guys had been smirking and chuckling crudely throughout this whole conversation so far, but now, the looks on their faces had suddenly changed. Immediately afterward, one of the five flew forward with great force.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what the hell, dude?!” exclaimed one of the others.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You took the words right outta my mouth, moron,” said Ryuuen. “What business do you got with my people?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was none other than Ryuuen who had driven his foot straight into that guy’s back in spectacular fashion. He quickly grabbed hold of another one by the collar.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t squawk in front of women like some stupid little bird,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_03\" src=\"/hola-lector-agua/images/books/y2v8/OEBPS/Images/INTERIORIMAGES_03.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh—? We’ll kill you!” one of them shouted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Go ahead and try,” Ryuuen sneered. “Hey, if you want, I’ll let you get one shot in. How about it? You want a souvenir from your school trip, don’tcha?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen, Ryuuen presented his own left cheek, tapping it lightly with his finger—\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003etap tap\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e—as though he were offering it up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh! In that case, don’t mind if I do!” shouted the guy he’d provoked. “I’ll sure as shit take a swing at you!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe drew his arm back, swinging wide.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, that’s—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eDon’t think that Ryuuen will actually let you punch him,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I thought to myself. But I couldn’t give him that advice in time. Ryuuen watched his opponent’s grand, but ultimately futile, wind up—then grabbed hold of him by the shoulders and drove his knee straight into his stomach with furious intensity. The student from the other school doubled over, rolling on the ground in agony.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh. Looks like some slightly interestin’ stuff can happen even on boring school trips like this,” Ryuuen said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe’d started to find enjoyment in an inevitable situation. To think, I’d encountered people from another school for the first time in my life, and it ended up turning into a disturbing display of violence. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOne of the guys balled his hands into fists, taking swings with his left and right. There was no way that this was going to be a one-on-one fight. It looked like they were hoping to win by outnumbering their opponent. But just then, Kitou slowly stepped in. The guys from the other school were clearly panicked and flustered by Kitou’s face and intimidating presence, which made it hard to imagine he was a high schooler.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It looks like…he’s going to help us,” said Nishino quietly. She’d walked over to me, still holding onto Yamamura’s shoulders, protecting her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kitou is Yamamura’s classmate,” I replied. “It’s only natural that he wouldn’t be able to just stand by quietly if he saw she was in trouble.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFortunately, both sides seemed to understand that further fighting inside the food court wasn’t a good idea, so Ryuuen and the others all walked outside, single file.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Should we call an adult?” asked Nishino.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah. Now that they’ve gotten to this point, there’s no stopping it. It’s best to just get them out of the public eye and go at it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom what I saw, the other side had superior numbers, but none of them looked like that much of a threat. If\u0026#160;Ryuuen and Kitou teamed up and fought together, it shouldn’t take them much time to clean up. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAbout ten minutes later, Ryuuen and Kitou had returned. And they brought their defeated opponents with them. Then, they made them get down on their knees in front of Yamamura and Nishino and beg their forgiveness. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom the looks of things, they had thoroughly beaten their opponents until they broke their rebellious spirits… Well, if you looked at it that way, then it was a problem, but maybe it was necessary, for Yamamura and Nishino’s sake. The students from the other school were made to promise to never show themselves to Yamamura and Nishino again, and then they scattered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s definitely not a boring group,” said Kushida, in a whisper. Hearing her impression, I could only agree.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e4.5\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eFTER SKIING FOR AS LONG\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e as time permitted, we returned to the ryokan just before seven o’clock in the evening. I hadn’t had my fill of skiing yet, but perhaps it was better to leave things there, with some reluctance to part from the activity. Our second day was nearing its end, and time continued to march steadily on through the evening. Sudou had invited me out during dinner, so we headed over to the baths together afterward and, after washing up, were enjoying a soak in the hot spring.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoo! Man, this hits the spot!” exclaimed Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe hot bath might’ve been especially effective for Sudou, who worked up a sweat just about every day at basketball. Using both hands, I repeatedly scooped up the hot water and splashed my face, feeling my fatigue melt away. After we’d spent some time just lazing about in the pool, Hashimoto from Class A arrived and got in next to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“’Sup?” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI responded with a gentle wave of my hand, and Sudou did the same.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto looked thoroughly exhausted, rolling his shoulders and letting out a deep sigh.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Man… I am completely, totally beat after today.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did something happen?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If only it were ‘something,’” he replied. “It’s more like I’m rackin’ my brains over what to do about one specific problem in my group.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI hadn’t said anything out loud, but I had been very curious about Hashimoto’s group from the start.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because Kouenji’s in your group, you mean?” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Exactly. You know how it’s like, in our free time, we’re supposed to be together as a group? Well, if this was a sane person we were talking about, we’d be having discussions as a group, right? But we’re basically being forced to go along with him to every place he wants to go.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji obviously wasn’t the type of person to obediently follow along with what other people wanted, and it sounded like that hadn’t changed even when he was together with a group comprised of students from all the classes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It looked like your group was at a ranch today, so you could experience horseback riding,” I said. “I’m guessing that’s what Kouenji wanted, then.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait. How do you know that? Oh, hang on… Yeah, you saw \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e happen, so I guess it’s not surprising that you know.” Looking like he was at his wits’ end, Hashimoto submerged half of his face in the water.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just saw him gallop past,” I said. “Did he actually come back after that, like he was supposed to?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto stayed submerged for about ten seconds; then he shrugged his shoulders and surfaced.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“After about an hour or so, yeah,” he said. “The rest of us didn’t have the mental and emotional capacity to handle horseback riding, so we just stood around, waiting.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHearing about how Hashimoto’s group had spent their free time, it sounded like they had suffered through hellish experiences one after another since this trip had started. Sudou brought his hands together in prayer, offering his condolences.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, I was trying to put together plans to have lunch at this famous place that I happened to see on TV, at least,” Hashimoto said, “but Kouenji seriously had the nerve to just say, ‘I’m going skiing’ and take off. That selfish jerk just up and left before we could even argue. Now I’m so completely exhausted that I don’t even have the energy to have fun anymore. And that is how our second day has come to an end.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf the group had ignored Kouenji and gone ahead to have lunch at that famous restaurant, or anything else, then they would’ve been in violation of the rules. What an incredibly tragic story.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You guys are his classmates,” said Hashimoto. “I was wondering if you might know some way of dealing with him.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe had already passed the halfway point of this trip; there were only two days left. At the very least, I was sure that his group would want to choose something they’d all like to do during their free time on the fourth day.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He’s just uncontrollable, dude. There ain’t nothin’ you can do,” said Sudou, offering his honest thoughts. It sounded cold, but after having spent a long time with Kouenji, Sudou had given up on him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What about you, Ayanokouji?” asked Hashimoto.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not realistic to try and convince Kouenji,” I agreed. “Honestly, I don’t think there’s anything you can do.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…What a cruel reality,” said Hashimoto.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But there might be one way, in an emergency,” I added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What is it? Tell me!” Thrilled by the prospect of having some hope, no matter how small, Hashimoto begged me for a way he could free himself from his situation. There was one way he could guarantee that he’d get some free time, provided he could tolerate the disadvantages that came with it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter I finished telling him, Hashimoto nodded, seemingly convinced. “Well, I guess that’s probably the only thing left I could do.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You should discuss what to do with the rest of your group,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll do that. I’m seriously considering it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto, lost in thought, disappeared into the water once more.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e4.6\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eFTER TAKING OUR TIME\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e and enjoying ourselves in the bath for about an hour or so, Sudou and I put on our yukatas. We each took a bottle of the free mineral water from the cooler and chugged while holding our hands on our hips. I felt the water cool my flushed body as it went down my throat.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay… I’m…ready for this, Ayanokouji,” said Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, it’s finally time, eh?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps it was because we had spent so much time in the bath, but Sudou’s face was a little red. Or perhaps it was because he was nervous from imagining what was going to happen next. The time had come for him to formally tell Horikita how he felt about her. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe drank down about half of his remaining water in one gulp. “Urp! Okay! Let’s go!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe slapped both of his cheeks with a \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003esmack\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to get himself fired up, as though he were heading off to a basketball game after this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what are you planning to do, specifically?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was just after nine thirty at night now. Horikita probably wasn’t asleep yet, but I was sure that many students were relaxing with their friends in their rooms. I couldn’t imagine her having fun and making noise with others, but it wouldn’t have been unusual for her to just be watching over others warmly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, first things first, I guess… I’ll try givin’ her a call.” Phone in hand, Sudou brushed past the curtain and exited the men’s bath. Immediately after exiting, he made the call. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe phone didn’t ring that many times before Horikita picked up, causing Sudou to panic a bit.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…H-h-hey, it’s me. Where are you right now?” he asked, sounding flustered. “Oh, in the lobby? Okay, can you wait there for a sec? I’m, uh, heading there right now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou hung up, breathing hard. He looked at me as he walked away. “So, y’know how there’s a part of the lobby in the ryokan where they sell small souvenirs and stuff? She says she’s there.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t just tell her how you feel right away the second you see her there, okay?” I suggested. “People would probably be watching in the lobby. And that’d make Horikita feel awkward, too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yeah, I know that, dude.” Telling someone how you felt about them was a major event, one that required not only consideration for the person expressing their feelings, but for the recipient, too. “But I dunno where should I do it…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nobody should be going through the corridor leading into the rear garden at this hour,” I told him. “That could be a good place, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf you went from the rear garden up the stairs to the higher level, there was a little wooden deck with a pleasant view. However, since you couldn’t head out into the rear garden after 9 p.m., there shouldn’t be people around.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Man, I knew I could count on you, Ayanokouji. You’re a good pal to have.” Sudou flashed a smile and gave me a big thumbs-up. It was a rigid, nervous smile, though. “Nice.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStill anxious, Sudou rushed over to the lobby. Once we arrived, I noticed that Horikita was already waiting nearby, checking out the souvenirs. I moved some distance away and found a blind spot to stand in. There was one employee in the lobby, as well as several students, some of whom were browsing the souvenirs and some sitting in the chairs, chatting happily. Seeing that, I felt affirmed in my prediction that this wouldn’t be a suitable place for a romantic confession.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSomehow, albeit through the added use of gestures, Sudou successfully managed to call Horikita to come to the corridor leading to the rear garden. The two of them walked over side by side. Normally, it probably would’ve been better if I stopped following them at this point, but getting told off by Sudou would be annoying. I masked the sound of my footsteps as much as possible as I followed them in order to bear witness to his heroic spectacle. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as I’d expected, there didn’t seem to be any people in this corridor anymore, and both Sudou and Horikita stopped in the middle of the empty hallway.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita turned back toward Sudou with a curious look. “What’s up?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wondered if she had just been in the bath up until a little while ago, like Sudou and I had. Her hair had a glamorous shine to it, even in the dim lighting.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, here is good.” Normally, Sudou’s confident attitude was his main selling point, but now he spoke quietly, perhaps because he was too nervous to speak up in front of the person he liked. There was only the subdued, gentle background music that played over the speakers and the quiet chatter of people at night in the ryokan, so he most likely wanted to avoid carelessly shouting in a loud voice, even in a place without anyone around. That was the right amount of consideration.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I, uh… Um…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSeeing Sudou act so hesitantly, Horikita cocked her head to the side, puzzled. Right now, though, she didn’t seem particularly irritated, or press Sudou to get on with it. I supposed that also demonstrated the trusting relationship that the two of them had built. Back when they had first met, Horikita would have rushed Sudou along, telling him to spit it out already, no questions asked. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust then, my phone vibrated. Even though I had put it on silent mode, in this quiet stillness, it was still possible that someone might hear it. Therefore, I immediately powered my phone off without even looking at the screen. And it…didn’t seem like they noticed me. I was safe, for the time being.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Suzune.” I had expected Sudou would launch straight into his romantic confession, but instead, practically squeezing the words out, he asked, “I, um… I’ve changed, right? I was just curious about…how different I am now from when we first met.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you still worried about what people think of you?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, there’s that too, yeah.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI figured he must be trying to stall until he could build up the courage to tell Horikita how he felt about her. At\u0026#160;the same time, though, it seemed like Sudou himself remained aware of what he was doing.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, let’s see,” Horikita said. “Taking an objective view, you’ve changed greatly, more than anyone. And not in a bad way; in a good way. I’ve been by your side for a long time, watching you, so no one can guarantee that more than I.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThose were Horikita’s honest feelings. Well, no, it probably wasn’t just Horikita who felt that; I was sure most people living on campus shared that same opinion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Th-that so?” asked Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But don’t be conceited. If I were to speak frankly, you started off in a negative position, compared to the people around you. Don’t think that just because I’m telling you that you’ve moved to a positive one since then, that makes you better than other people.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe negative effects Sudou’s behavior and attitude had originally had on the people around him could bias them when they saw how he was now, making them more impressed by how he’d changed. However, just as Horikita had said, those negatives that Sudou had accumulated over time hadn’t necessarily just disappeared, either. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. I mean, that sounds totally right to me.” Those harsh words had Sudou feeling dejected, but he nodded, accepting them completely. “God, it’s so embarrassin’. All the stupid stuff I’ve done, I mean.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTardiness, missing class, coming in last place on written tests, using all kinds of foul language and insults, carelessly getting physically violent—no matter how much Sudou reflected on those things, the past wouldn’t change, and he was ashamed of the path he had trod before.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita nodded, and then smiled warmly, eyes creasing. “You really do have a humble heart, don’t you?” She herself might not have realized this, but she had also changed quite a lot. Her change wasn’t nearly as great as Sudou’s, though. “You don’t carelessly hurt others or cause trouble anymore. It’s okay.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, Horikita had misinterpreted the situation, thinking that Sudou was uncertain about his past and how much he’d grown, and that he had come to her seeking advice. Sudou seemed to realize that Horikita had misunderstood as well, because he shook his head from side to side, flustered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Th-that ain’t what I wanted to talk to you about, Suzune.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I…I, uh… Well…” He must have remembered what he had declared to me earlier, because he suddenly thrust out his right hand. But his words didn’t follow; his outstretched, open hand remained in front of him, and that was it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What? What are— ” Horikita, unable to comprehend what was going on, tried to question the meaning behind Sudou offering his right hand, but just then…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I like you! Please go out with me!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou had freed himself from the feelings of embarrassment that kept the words stuck in the back of his throat. He shouted too loudly, but… Well, I supposed we’d just overlook that part. In any case, even if someone did overhear, I could stand watch and protect him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wha—” Horikita, who hadn’t had even the slightest expectation that someone would express their romantic feelings to her, froze on the spot, completely taken aback.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you do want to go out with me, I’d like you to take my right hand!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, hold on… Are you seri…?” Horikita immediately swallowed her words. She could sense Sudou’s passion and enthusiasm, and she could tell his feelings were genuine; she knew that it would’ve been rude to ask him something like, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“This is some kind of joke, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe stared at Sudou’s right hand, closing her mouth. I had expected her to reply to him immediately, but she just silently stared at his hand.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter the confession he’d made, I was sure that the longer this silence continued, the faster Sudou’s heart rate would climb. This moment right now was by no means a pleasant one; it was probably painful. But even someone like Horikita should be given as much time to think as she needed. When telling someone you had romantic feelings for them, it didn’t come down to the emotions of just one person or the other. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita must have eventually sorted out how she felt, because she slowly started to speak, choosing her words very carefully. “Never once in my life did I think that someone would tell me they had a romantic interest in me,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that Horikita had heard and acknowledged Sudou’s passionate feelings, how would she respond? Would she return those feelings? Or would she reject him? Or would she choose to put it off until later? As the silence dragged on, Sudou’s right arm gradually started trembling. It wasn’t due to his arm getting numb; it was because of nervousness and fear. And the frustration of not getting a response, whether Horikita would reciprocate or not. Sudou, believing that Horikita would take his outstretched hand, kept his head down.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sudou-kun. Thank you for liking someone like me.” Horikita offered her gratitude. However, she wasn’t showing any signs of taking Sudou’s outstretched hand. “But I’m sorry. I…cannot reciprocate your feelings.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was the conclusion that Horikita’s thoughts had led her to.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I see… Um, if it’s okay, could you…maybe tell me the reason why?” asked Sudou hesitantly, his right hand frozen in the air. He still couldn’t lift his face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The reason… Okay. It’s not as though I’m particularly dissatisfied with you, Sudou-kun. It’s—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita stopped for a moment.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To be honest, I must confess that I’ve never fallen in love with another person in my life so far,” she said. “Even now, I still haven’t had that feeling, and I have no idea what it’s like. I think that even if I went out with you, Sudou-kun, now that you’ve told me your feelings, there could be a possibility that I’d fall in love with you in time. But…I think that I’m probably waiting for that moment that I fall in love with someone naturally, by instinct, rather than trying to trigger romantic feelings to happen that way.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was expressing her thoughts to Sudou, but it seemed like she was also confirming them for herself. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was the reason she had turned him down. She wanted to keep waiting for her first love. I was sure that was a hidden feeling that Horikita wouldn’t let strangers hear about.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see… Thank you,” said Sudou. “For telling me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps it was because Horikita had told him so much, expressed her stance so clearly, but he didn’t persist.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve really shown me your courage and your feelings very strongly,” said Horikita. With that, she hurriedly grabbed hold of Sudou’s right hand, which was right on the verge of going limp. “I’ve heard your feelings. Thank you for liking me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou’s trembling right hand said it all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThinking that it was about time to go, I decided to head back. I figured that I’d hang out and look around the souvenir shop while I waited for Sudou to collect himself and return.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" id=\"INTERIORIMAGES_04\" src=\"/hola-lector-agua/images/books/y2v8/OEBPS/Images/INTERIORIMAGES_04.jpg\" loading=\"lazy\" decoding=\"async\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e4.7\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT WAS THE FIRST TIME\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I’d visited the shop. Various Hokkaido souvenirs were lined up on the shelves.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That reminds me,” I thought aloud. “Nanase said something about chocolate-covered fries, I think.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI tried doing some searching, but they must not have been carried at this ryokan, because I couldn’t find any. I guessed I’d need to look for them either during our visit to the various tourist destinations tomorrow, or during our final day of free time. In the meantime, I figured I’d check on my phone and see if there was a store nearby that carried them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoops…” I muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I turned on my cell phone, thinking I’d check the local stores, I saw that I had many messages and missed calls. They were all from Kei, of course.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Where are you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I didn’t get to see you at all yesterday or today.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Are you busy?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I wanna see you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I wanna see youuuuuuuu.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd so on. When I opened the app, the messages, which had been sent seconds apart from each other, were marked as read. Then, immediately afterward, my phone rang.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Grr—!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wondered if a cat’s snarl would be an appropriate metaphor to describe what that sounded like.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you mad?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI’m not mad, \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ebut\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e—!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI see.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e The only thing I was certain of was that she did in fact seem extremely angry.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Can’t we be together for even just a little bit?!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry,” I said. “We’re on a school trip, and there are lots of things I have to do.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I know that, but still!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve already gotten information about group eleven from Kushida, so I know for certain that you’ve been handling yourself well, Kei. That’s why I wasn’t worried about you at all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHmmmm? You certainly sound like you’re having fun with Kushida-san! She \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eis\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e cute, you know! You cheater!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re in the same group, so of course we’re going to talk. Besides, you already know what kind of person Kushida is, don’t you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“That doesn’t matter. She’s got big boobs, too! …Kiyotaka…you’re… Ahh!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I get it, I get it. I can take some time now, so let’s meet up somewhere.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Really?! Well then, I’ll come visit you!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was an extremely calculated act on her part, and once I offered to meet, her voice immediately turned cheerful.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Actually, it’s probably better that we don’t meet in my room, don’t you think?” I said. “Ryuuen’s in my room, too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eOh… I see.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Where are you right now?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“In my room, but the three other girls are probably still in the bath. I was with them until just a little bit ago. But I wanted to talk to you, so I left before they did, Kiyotaka-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei used to be very self-conscious about her scars, but apparently, she had managed to completely move past that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have the key to my room, so I’m going to stop by there first and drop it off\u003c/span\u003e\u003cspan style=\" font-size: 1.00em; letter-spacing: 0.60mm;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e” I told her. “I’ll contact you afterward, so wait for me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Okay!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had been waiting for Sudou at the souvenir shop for a little under five minutes now. Since there was still no sign of him coming back this way, I got curious, and decided to check the corridor leading to the rear garden. When I got there, I saw Sudou standing there alone, in the same spot where he’d stood when he told Horikita how he felt about her. There was no sign of Horikita, though, so I figured that she had already headed back.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sudou?” I felt bad, since Kei was waiting for me, but I drew closer to Sudou and called out his name.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, damn it!” he shouted. From what I could tell from the sound of his voice, he probably had a look of frustration on his face. “I knew it was hopeless, but…!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could tell that there was vexation in Sudou’s face when he turned around to look at me, but he had a bright smile. “I’m sorry,” he said to me. “I just couldn’t forget the feeling of Suzune’s hand, and I was spacin’ out.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, that’s what happened.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You saw, right? It was a spectacular failure.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even so, it was an honorable defeat that you should be proud of.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat I saw was a truly manly expression of romantic love, from start to finish.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y’know, before, I thought, like, ‘Even if she rejects me, I’m not gonna give up. I’ll become an even better me next year and try again,’” he said. “Stuff like that. But I ain’t gonna do that. It’s pointless. At the very least, I realized that I just can’t reach her.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou seemed to have sensed something that I, who had been watching fro
