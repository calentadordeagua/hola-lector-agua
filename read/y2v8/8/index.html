em;\"\u003eIf I were in the same group as Kei, then naturally, that would mean I’d probably end up spending all the hours of the day with her. I wouldn’t say that’d be a bad way to spend my time, but I did feel like it would be a little bit of a waste. We already had plenty of chances to spend time together, just like we were doing right now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I kind of get the feeling that you don’t want to be in a group with me,” said Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not like that,” I said. “I’m just saying that it’d be better for you to try and enjoy yourself, even if we’re not in the same group.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was sure that Kei already understood that, but she didn’t seem like she was honestly willing to accept it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But…” She pouted, puffing out her cheeks, and hugged my shoulder. “I might die from loneliness if you’re not there, Kiyotaka.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re exaggerating.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But, but…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI got the feeling that some ingenuity might be needed here to motivate her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s a reason I think it’ll be a good thing if you and I are in separate groups, Kei,” I said. “We’re getting to the point where we need information on each class if we’re going to move up to Class A. And I’m sure that many of the students are going to be completely open and defenseless, so to speak, during the school trip.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei still seemed disgruntled. I went on, “When I heard about the school trip schedule, and the groups, I did a little research online about other schools. I came to understand that it’s quite unusual to have almost two full days of free time. With that in mind, I figured the school’s goal may be to introduce change in the relationships between classes while they can.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why would they want to do that?” asked Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I still don’t know, but it’s possible that the information gained from the school trip could come into play in the near future. Perhaps by the end of the second semester or the third.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re saying that you want me to gather information that we could use as a weapon?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because I’m amazed by your talents,” I said, patting her head. “I figured that since we’re being presented with this opportunity, I’d like to put them to effective use.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer dissatisfaction wasn’t completely gone, but now she appeared not entirely displeased. “W-well, sure, I guess I can understand you wanting to rely on me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course, I’d plan to have a lot of fun together if we were in the same group,” I added. “But if that doesn’t happen, try to have fun without losing your motivation—and take the opportunity to be useful to the class, too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Okay. If you say I should, Kiyotaka, I’ll try my best.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I repeatedly stroked her head, I decided to go ahead and change the subject. “So, about that thing with Sudou earlier—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, you mean your conversation with Sudou-kun about how he’s going to tell Horikita-san how he feels?” she said. “Yeah, I have to say, I’m a little curious.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wasn’t confident that Kei was going to bite, but she appeared more interested than I had thought. “Girls seem to like hearing stories about people confessing their love,” I remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, sure, yeah. I think he’s definitely going to get rejected, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Kiyotaka, you think it’ll go well?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I feel like there’s a possibility. If the two of them deciding to start off with being just a little more than friends still counts as success, then I’m betting he’ll succeed.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No way, seriously? In that case, I’ll take that bet. We’ll wager on whether he’ll succeed or fail.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are the stakes?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm,” Kei mused, already starting to fantasize about the possibilities. “Okay, how about if I win, I ask you to get me something kind of expensive as a Christmas gift?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, that’s easy enough to understand,” I agreed. “So, what if I win?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If that happens, I’ll do whatever you say,” said Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You sure? You’re making an awfully big bet there.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because it’s totally impossible it’ll work out,” she insisted. “It’s not really about whether Sudou-kun is a good or bad guy. It comes down to the person he’s asking, Horikita-san. She has no interest in things like romance.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have to wonder about that,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was certainly true that, at first glance, Horikita didn’t seem to be the type to fall in love. And if you were to ask if she liked anyone in particular at this point in her life, well, I’d have some serious doubts about that. However, I didn’t think you could say definitively that Sudou’s confession of romance would fail just because she didn’t have feelings for him. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRight now, Horikita was also at the stage where she was learning from a lot of new experiences. I couldn’t deny the possibility that she might decide to step up to the challenge, so to speak, just as I had. And if the person reaching out to her was Sudou, she’d probably feel like he wasn’t a bad choice. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, I’m looking forward to Christmas!” said Kei. “I wonder what I’ll have you buy for me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, I’ll think long and hard about what I’ll have you do for me, Kei,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoa, that feels a little naughty!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was nothing more than Kei’s own imagination.\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 2: Know Your Enemy, Know Yourself, and You Need Not Fear a Hundred Battles\",\"volumeId\":\"y2v8\",\"chapterIndex\":8,\"prevChapter\":{\"volumeId\":\"y2v8\",\"chapter\":7,\"title\":\"Chapter 1 - Prologue : Kanzaki Ryuuji’s Soliloquy\"},\"nextChapter\":{\"volumeId\":\"y2v8\",\"chapter\":9,\"title\":\"Chapter 3: Self-Explanatory School Trip\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Kanzaki Ryuuji’s Soliloquy\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: Know Your Enemy, Know Yourself, and You Need Not Fear a Hundred Battles\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: Self-Explanatory School Trip\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: School Trip Day Two\",\"href\":\"Text/section-0008.html#auto_bookmark_toc_top\",\"index\":10},{\"label\":\"Chapter 5: School Trip Day Three\",\"href\":\"Text/section-0009.html#auto_bookmark_toc_top\",\"index\":11},{\"label\":\"Chapter 6: School Trip Day Four\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_top\",\"index\":12},{\"label\":\"Chapter 7: A Light Shining at the End of the Darkness\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_top\",\"index\":13},{\"label\":\"Epilogue: Postscript\",\"href\":\"Text/section-0012.html#auto_bookmark_toc_top\",\"index\":14}],\"volumeTitle\":\"Light Novel 2nd Year Volume 8\",\"detailsLink\":\"/select/year-2/y2v8\",\"returnLink\":\"/select\",\"currentSpineIndex\":8,\"nextVolumeLink\":\"/select/year-2/v0\",\"nextVolumeTitle\":\"Light Novel Volume 0\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-s
