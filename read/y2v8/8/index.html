],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T23cbb,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 2:\u003cbr/\u003eKnow Your Enemy, Know Yourself, and You Need Not Fear a Hundred Battles\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT WAS LATE NOVEMBER\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e and the day we were due to set out on our long-awaited school trip was finally drawing near. I was on my way to school on a bright but chilly morning when I happened to spot a group of three people walking along ahead of me, with Haruka in the middle. They weren’t laughing out loud or smiling broadly or anything, but they did seem to be enthusiastically engaged in some topic of conversation, as though they were making up for lost time, filling the void of the recent past.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You sure you don’t need to go talk to them?” asked Kei, as she walked beside me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah, it’s fine,” I replied. “This is just how things have ended up, ever since Airi got expelled.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was no longer needed in that group—or rather, that was the way it had to be.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, I won’t bring it up again. I understand that if you say it’s okay, then that’s the right answer.” Kei didn’t seem to care too deeply about this; she probably figured that this whole issue with the former Ayanokouji Group was none of her business anyway. “Besides, you know what? This just means that I get to keep you all to myself, Kiyotaka. Right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe flashed me a sincere, earnest smile, with no hesitation. There was no doubt in my mind that I had become an emotional pillar for Kei over all the time we’d spent together.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m super excited about our upcoming school trip,” she added. “Where do you think we’ll go?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not giving up on my dream of Kyoto,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, you did talk about wanting to go there, huh? Well, for me personally, Kyoto’s the only place I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edon’t\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e want to go.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor some reason, Kyoto, the place that I was passionately longing for, was the only one that she was dismissing. And right out of hand, too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You hate Kyoto that much?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, it just seems like it’s all, like, cultural stuff, like temples and junk. It doesn’t sound fun at all, does it?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut that was one of the best things about it, if you asked me… Well, it sounded like visiting temples and shrines might not be enjoyable to Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s exactly what’s on my mind right now, for sure,” she said. “Yep.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, sure, our trip destination is important too, but aren’t you concerned about the results of the finals?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s not like worrying about them now is going to raise my test scores, is it? Besides, I feel like I did pretty well, actually. Thanks to you, Kiyotaka.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough that overconfident part of her was a little problematic, what she said was true. Although it was unlikely that we could expect to see her get a high score, it was also safe to say that the bottom range of her scores had been rising. Realistically, I could only make an iffy declaration at this point, but I could sense some growth in her after seeing her scores. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder if I should spend even more time studying with you, Kiyotaka, like Sudou-kun with Horikita-san,” murmured Kei, the tip of her index finger pressed against her lips.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe probably didn’t understand that just studying for the same length of time as Sudou wouldn’t improve her academic performance like his. Personal motivation was very important, but the skill of the tutor was just as important. The reason Sudou had developed so remarkably well was, without a doubt, Horikita’s talent as a tutor. That was probably an advantage that Horikita held over even someone like Keisei, who had the same level of academic ability as her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn my case, though, my education wasn’t built on that kind of foundation. It would be simple enough for me to raise Kei’s academic ability forcefully, by educating her thoroughly, but that wasn’t my role. I had to entrust that matter to another student in the class. All I should do was the bare minimum necessary. I also needed to instill in her the kind of attitude that would enable her to study. That way, when another student who was right for the job eventually came along, they’d be able to take things over smoothly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e2.1\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eWO \u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHOURS\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e were going to be set aside later this morning to talk about the school trip. I supposed that at a normal school, we might have gotten those details at a slightly earlier stage, but for the students at this school, the end-of-term exam we just had beforehand was more important. So, first, we needed to find out what our results were. Learning about the plans for the school trip and then immediately finding out you were being expelled for your test scores would’ve been like a bad joke.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now then, I’ll be giving you your results from your second-semester finals,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was a feeling of tension in the air, like everyone was standing on pins and needles. But despite the nervousness and anxiety, none of the students in the class were in despair. Around this time last year, the school had conducted a unique final exam called the Paper Shuffle. Kushida had schemed, and Ryuuen’s shadow loomed. Horikita’s characteristic strategies had been formidable back then, too, but this year, things were different.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe rules had been standard: students took the test that the school had produced, and if they scored below the clear pass/fail line, then they’d be expelled. It was also a competition between classes, with the class coming in first place earning fifty Class Points, and second place earning twenty-five Class Points. Third place, however, lost twenty-five Class Points, and fourth place lost fifty Class Points. It was, simply put, a scramble for Class Points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA failing grade was an average score of thirty-nine or less in all subjects. Having carefully examined the exam contents, though, I concluded that a failing grade in any given subject could be avoided without much difficulty as long as a student took their classes seriously.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“First, for this exam’s results, I’ll start with the students at the bottom,” said Chabashira-sensei. Her expression was stiff; she didn’t show any sign of relaxation. I got the sense she was doing it to wind the students up, but I supposed that a modicum of tension was necessary. “First, the student with the lowest score—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe lowest grade was thought to be even more important than the highest.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s you, Hondou, with an average score of fifty-three,” Chabashira-sensei announced.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Agh! Me? Oh, but wait, fifty-three isn’t so bad, is it?! Wait, should I be happy about this?!” he cried out strangely. There was joy in his voice at hearing he’d avoided a failing grade, but he must have been conflicted over having gotten the lowest score in class. Hondou had always placed near the bottom, though; this probably wasn’t the first time that his score had been the lowest. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei continued announcing the results in ascending order, and eventually, she started calling the names of the higher-ranking students.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe bottom range for the lower-scoring group was definitely getting higher. Even my girlfriend, Kei, didn’t have as bad a score as I had expected, with an average of fifty-six points. It was undoubtedly Airi’s expulsion during the Unanimous Special Exam that had led to this development. Ever since that exam, the students who ranked lowest in OAA had developed a constant sense of urgency, knowing that they could be next on the chopping block, so they couldn’t slack off. No matter what kind of exam they faced, they had to tackle it to the best of their ability. Even Kei was steadily improving her grades, although she didn’t want to study unless it was with me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, I supposed I’d need to solve that problem as soon as possible. Since I was only teaching her the bare minimum, there was a risk that she’d be separated from the other students due to a gap in growth potential. I needed to ask someone else to take over tutoring her who could come up with a solid teaching plan, like Horikita, or Keisei, or even Yousuke. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs our names were called, each student’s score per subject, total score, and average score were displayed on the monitor at the front of the class. I came in twelfth place. I was slowly but steadily rising in the rankings.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFinally, Chabashira-sensei got to announcing the top ten scores. In tenth place was Sudou. Although I’d been a little concerned about him, his results were similar to what he’d gotten in the last exam. He had earned a solid score and cracked the top bracket, going up by one place in the rankings and setting a new personal best. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd first place was, unusually enough, a tie. Horikita and Keisei were tied for first with an average score of 93.5 points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As for your overall placement in your grade level,” Chabashira-sensei added, “you surpassed Ichinose’s class’s average score and took second place. Excellent work.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi’s Class A took first place, Horikita’s Class B took second, Ichinose’s Class D took third, and Ryuuen’s Class C took fourth—so our class was getting an additional twenty-five Class Points. However, even the lower-ranked students in Sakayanagi’s Class A generally scored well, so we couldn’t take first place this time. As a result, the gap between our classes had widened, just a little.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now then,” Chabashira-sensei said, “I understand quite well that you’ve been looking forward to this school trip, as evidenced by how much effort you put into the end-of-semester exam. But first, before we get into talking about the trip, there’s one thing I’d like for you to do.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt that, a chart with the names of our classmates, which we all knew quite well, was displayed on each of our tablets. It was also displayed on the monitor in front of us. There were three fields: name, gender, and number. Two of those fields, name and gender, were already filled in. Just as Chabashira-sensei had suggested, information was given for everyone in class. Only the field for numbers was blank, so it was clear that some kind of number was going to be entered in that field.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe table was generally understandable at first glance, but it was unclear what criteria the number field was supposed to be based on. Although I was limited to what I could see from my seat, it appeared as though no other students understood, either.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This chart shows a list of students in Class 2-B, i.e., this class,” said Chabashira-sensei. “You can see that there’s a field header labeled ‘Numbers’ next to ‘Name’ and ‘Gender,’ written in a small font size, and that the field is blank, yes? The numbers start from one and go up to thirty-seven, which is the number of students in this class—thirty-eight, minus you yourself. You cannot use the same number twice. First, please enter ‘Self’ in the number field next to your own name, so that it’s easy for us to understand that it’s you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWithout Yamauchi and Airi, who had been expelled, there were thirty-eight students in Class 2-B. So, from the sounds of things, we were supposed to assign a number to each student excluding ourselves, going up to thirty-seven. The problem was what these numbers were supposed to mean. I couldn’t possibly imagine that we’d just be assigning numbers randomly, with no meaning behind them. We all did as instructed, typing on our tablets and entering “Self” by our respective names. After confirming that we had all done that, Chabashira-sensei began to explain what the numbers meant.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now then, regarding the numbers that I’m about to have you assign. You can basically see them as your evaluation of your peers, from your own personal perspective. You could rank someone as number one simply because you respect their skills the most, or because you are best friends, or because they’re the funniest one in class. What’s important is that whoever it is you rank as first, you’re making a positive evaluation according to your own set criteria.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, we were basically ranking our classmates, then. Actually, wait… It seemed that if you slid the table over, it wasn’t just our own classmates in there. There were fields for students in the other three classes, too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure that some of you might have already noticed this,” added Chabashira-sensei, “but I’m going to ask you to do this ranking for the entire grade level, class by class. When it comes to students from other classes, there may be some people who you’ve never even spoken to before, but you’re going to have to rank them based on your own criteria as well. I’d like for you to assign them a number based on what you know of them.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStudents evaluating students. We did something somewhat similar last year, but I suppose you could also say that this was very different. But what in the world was the point of having students do something like this, anyway? Making some kind of superficial hierarchy?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We will absolutely not be divulging what numbers you’ve assigned to other students, of course,” Chabashira-sensei assured us. “Not even we, your homeroom instructors, will know what kind of evaluations you’ve given, so please rest easy.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, this chart was going to be managed by the school administrators.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You are forbidden from talking privately amongst yourselves whilst filling out the chart, and you are also forbidden from looking at OAA. Putting aside whatever you happen to remember, it would be defeating\u0026#160;the purpose of this exercise if you were to simply use the\u0026#160;school’s evaluation as your hierarchy without giving it any thought or reasoning of your own.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, there were also restrictions against just assigning numbers mechanically based on an existing metric.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are tons of girls I’ve never even talked to or anything, though, and I have no idea what people’s OAA scores are, so all my scores are gonna be pretty random,” muttered Hondou, uncertain. “Is that gonna be okay…?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSome students had a wide circle of friendships, but Hondou, who lacked self-confidence, wasn’t one of them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, that’s fine,” Chabashira-sensei replied. “There’d be no problem even if you assigned numbers at random to people you have little connection with. However, the school will be using these lists for a certain purpose, and you will be responsible for whatever consequences there are.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, essentially, we were supposed to be ordering students based on some kind of general criteria, but in the end, what to actually put was up to the discretion of the person filling out the form. Accordingly, Chabashira-sensei was saying, we shouldn’t complain about whatever effects might come about in the future as a result of our rankings. We should be able to grade each student appropriately as a result of the cumulative interactions we had with each other thus far, I supposed. If we did it without thinking, we could regret it later, so we needed to take this challenge seriously. That’s what Chabashira-sensei was telling us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You have one hour to finish, starting now,” she said. “In the unlikely event that you do not finish within the time limit, we’ll be reducing the time spent on explaining the school trip to you and continuing the time spent on this, so please focus on the task at hand.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSurely no one had thought that we would be forced to do something like this before the school trip. Though the students were puzzled, Chabashira-sensei instructed them to go ahead and begin immediately. No one had fully wrapped their mind around the task yet, but even so, they got started.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStill… \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eCriteria, hm?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I decided to hold off ranking my own class, since that would take the longest amount of time, and started with organizing Class A. If I were simply going on ability alone, I would have placed Sakayanagi as number one, but what I was looking for right now was a comprehensive evaluation. I could simply judge everyone based on like or dislike and wrap up everything that way. It was up to the individual’s own discretion if they wanted to rank the person they most wanted to date or the person they liked as their number one, after all. Regardless, the numbers should be assigned based on clear criteria. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI intended to start filling out the form right away, but I found it was surprisingly difficult. The safest option would have been to use an overall evaluation of the students’ abilities at this point in time as seen from my perspective. It wasn’t likely to be an issue for me to make calculations based on what I remembered from OAA for the students I’d never interacted with. Once I settled on a course of action, I was going to start with number one and work my way down.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI figured many other students would make the same decision, but it was safe to say that Sakayanagi would be taking number one for Class A. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce I got started, it took me about twenty minutes to finish entering evaluations for everyone from the other three classes. All that was left was the class I was currently enrolled in: Class B. I wasn’t going to be assigning numbers so simply with this class, because for these students, I’d obtained much more information than OAA accounted for.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was going to factor in hidden potential, communication skills, and growth. I figured there might be some overlapping similarities with OAA, but at this point, I decided that Yousuke would take number one. If I took into account not only his simple overall value, but also the number of ways that he’d contributed thus far, he was the best choice. Without Yousuke, there would be no cooperation in this class. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen, I chose Kouenji as number two. His hidden potential and the tangible benefits that he had brought to the class, such as his contribution in the second-year Uninhabited Island Special Exam, and even his unintentional contributions, like in the Sports Festival and so on, were extremely significant. Even if I were to count his personality quirks and his lack of cooperativeness against him, second place would still be a fair assessment. It was an undeniable fact that Kouenji’s achievements had paved the way for our current position as Class B.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita, Keisei, and Mii-chan, along with other students who always performed well academically, also rated quite highly. Then there was Sudou, who possessed outstanding physical ability, and whose academic prowess was not to be underestimated either. I put him down as number nine. If I’d only been taking into account what had happened since the start of our second year, then I definitely would’ve rated Sudou as third or fourth, after Kouenji. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter I’d finished entering my evaluations for all of the students, I looked up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI took close to forty minutes in total to fill everything in, but none of the students aside from me have finished y— \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as that thought was going through my head, though, my eyes met with Chabashira-sensei’s as she observed the students, and I realized that Kouenji, sitting to my side, had finished before I did. I couldn’t be certain, but I expected he had simply filled in numbers randomly without giving it any thought. He was gently blowing on his nails without even giving his tablet a second glance.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf we considered the possibility that these numbers could be used for some special exam, for some purpose other than group building, then what kinds of arrangements could we envision? Was it possible that, when the school took a comprehensive view, they could, for example, hold an exam where only the students selected as number one and number two overall in each class would participate? On the other hand, the school could do the opposite instead. They could gather only the students with low overall ability together, and in the end, they’d have a balanced group to face the challenge.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, if either of those possibilities were true, then they should have told us beforehand to consider the merits of students’ respective abilities more carefully before we assigned numbers. It wouldn’t even have been necessary to have students do these evaluations in the first place. The risk of distorting the competition by assigning numbers based on like or dislike would have been significantly higher if that were the goal.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e2.2\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eW\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHEN THERE WERE ONLY\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e a few minutes remaining, Chabashira-sensei addressed the class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay. It seems like everyone is finished, so we’ll bring the list-making process to an end right here,” she said. Apparently, everyone had managed to finish their evaluations within the time limit without incident. “This is a little sooner than I expected, but let’s start talking about the school trip.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve been waiting for this!” Thrilled to have been released from the tedium of list-making, Ike clapped loudly. Some of the other students joined him. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnlike in the past, Chabashira-sensei didn’t issue Ike a warning this time, and instead started pushing buttons on her tablet. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe’d heard that there was going to be a school trip, but we still didn’t know what our destination would be. There were three options in the Unanimous Special Exam: Hokkaido, Kyoto, and Okinawa. Each class had cast its vote for one of those three choices, and whichever one got the most votes would be chosen as the destination for the school trip.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIncidentally, I was part of the minority faction that wanted to go to Kyoto, along with Horikita and Keisei. This class had ended up casting a vote for Hokkaido in the end, but that didn’t mean hope was gone. If two of the remaining three classes voted for Kyoto, then my wish would be granted. And the results were…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“First, I’ll tell you the results of the vote from the Unanimous Special Exam,” announced Chabashira-sensei. She paused for a few seconds, with a pompous air, for dramatic effect. “After tallying up the results from each class, the winner, with a total of three votes, has been decided. Our school trip will be to Hokkaido.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were mixed reactions as soon as we heard the results, with people expressing both joy and disappointment. Horikita’s class had allocated its vote to Hokkaido, but that didn’t necessarily mean the majority were happy about this. Anyway, we were going to Hokkaido, huh? Horikita didn’t appear to be disappointed, from what I could tell by looking at her back. Even Keisei didn’t seem especially unhappy with the announcement.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMeanwhile, Sudou and the other people who were in the pro-Okinawa group had shown absolutely no sign of even really reacting to the news from the start. Classes weren’t allowed to share what they had voted for, but it was possible that some rumors had been going around anyway. I felt like it was a little disappointing, but hey—Kyoto was Kyoto, Hokkaido was Hokkaido. Each was its own thing. From my perspective, it was still an unknown world out there, and the vote didn’t change the fact that I was looking forward to the trip.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure that you’re already aware of this, but don’t forget that a school trip, just as its name implies, is an excursion meant for learning and acquiring knowledge. Unlike in a regular high school, there are many rules you’ll need to follow,” Chabashira-sensei warned lightly, so that the exuberant students wouldn’t confuse this trip with a vacation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re not telling us that there’s going to be a special exam or something…are you?” asked Hondou fearfully.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no way we could be sure, and it was understandable that someone would want to speak up to rule it out. In response, Chabashira-sensei chuckled softly as she looked at the students. “Relax. There will not be a special exam where you’ll be competing over Class Points.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHearing her clear, definitive answer, the class collectively let out a sigh of relief.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, before we go into the details of the trip, let’s first touch on the schedule for the four nights and five days,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em; text-transform: uppercase;\"\u003eSCHOOL TRIP SCHEDULE\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em; text-transform: uppercase;\"\u003eDAY 1\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDepart from school -\u0026gt; Haneda Airport -\u0026gt; New Chitose Airport -\u0026gt; Arrival at ski resort, lesson -\u0026gt; Skiing -\u0026gt; To ryokan \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em; text-transform: uppercase;\"\u003eDAY 2\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFree day\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em; text-transform: uppercase;\"\u003eDAY 3\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eVisiting tourist spots around Sapporo -\u0026gt; Back to ryokan\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em; text-transform: uppercase;\"\u003eDAY 4\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFree day (with some conditions)\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em; text-transform: uppercase;\"\u003eDAY 5\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eReturn\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, we were going to be free to do whatever we wanted all day on the second day, and again on the fourth day, albeit with some conditions.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, I was all worried, but that looks totally normal!” exclaimed Hondou. “Actually, hold on, it’s even better than normal! Yeah, free days!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, almost all of the students in class had a positive impression of a normal school trip schedule. It\u0026#160;sounded like this one was somewhat comparable to what you would find at most schools, and people appeared to be unusually excited about that fact. It was true that it wouldn’t have been unexpected for this school to come up with a more complicated or involved schedule.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s fine to get excited, but have you already forgotten what I said earlier?” Chabashira-sensei said. “Yes, you are promised free days, but there will be no shortage of activities that you’ll need to be doing as students at the Advanced Nurturing High School.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere wasn’t going to be a special exam, though. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSo, what in the world is going to be expected of us? \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wondered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“‘Know your enemy, know yourself, and you need not fear a hundred battles.’ That is the theme of this school trip,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Wait, what? What does that mean?” Hondou cocked his head to the side in apparent confusion. He must not have understood the quote Chabashira-sensei had referenced, from Sun Tzu’s \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eThe Art of War\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was Sudou who spoke up first to explain the proverb in an easy-to-understand manner. “It means to actually understand the enemies that you’re fighting, and their situation, and to understand yer own situation properly, too,” he said. “Basically, if you make sure you know that stuff, then you’ll never lose.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“O-oh, wow, dude… So, like, you even get that kinda stuff?” asked Hondou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah, it ain’t really anything amazing. Besides, you can figure out what it means literally from what the quote says in the first place.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was starting to like how he wasn’t being arrogant about having one piece of knowledge. That left a good impression.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Normally, several groups are formed on school trips, as people are out and about,” Chabashira-sensei said. “Things will be no different for you in that regard, but there is one aspect that is clearly different from how other schools do it. Namely, groups will be formed not just from students within your own class, but with students from your entire grade.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Wait, what? What?!” one student wailed. “So, like, doesn’t that mean there’s a super-high chance that we could get paired up with people we’re not even friends with?!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe students, who were all excited over the still-as-yet-unseen Hokkaido, were suddenly snapped back to reality. As if to demonstrate this, Chabashira-sensei began giving us the details. “That’s exactly right. Depending on your social circle and what combinations there are, it’s possible that almost everyone could be with people they’ve never spoken to before.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if I was being charitable, I couldn’t say that I had a wide circle of friends in other classes. Depending on the size of the groups, it was entirely possible that things could turn out just as Chabashira-sensei had said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If this were a normal school, with the same maximum of just 160 students in your grade level, there would be a good chance that you’d be able to widen your circle of friends beyond your own class,” Chabashira-sensei continued. “However, the way this school is structured is a detriment, and hinders you in that regard.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was true that you’d expect your number of friends to increase if you were studying together in the same environment for more than a year and a half. At this point, it wasn’t difficult to imagine how the way this school was structured got in the way of that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The most important thing for you is whether you can graduate from Class A,” she went on. “Which means that it’s a battle between classes. That structure is going to remain the same from this point onward. Naturally, as a result of that, you’ll perceive other students as rivals more often than you have opportunities to engage with each other as friends.” That kind of environment wasn’t conducive to making a wide circle of friendships, was basically what she was saying. “Thus, opportunities for you to learn about other students’ situations, and how they spend their time, are limited too, of course.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was certainly true that we’d learned more about our own classmates over the past year and a half or so, while when it came to other classes, many people naturally only knew what was going on at the surface level. If you carelessly showed any weakness, there was a chance that others could take advantage of that. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd, considering this issue from a completely different angle, friendships might also make you feel hesitant to defeat the other classes. Someone might even end up thinking, “I want my best friend from another class\u0026#160;to graduate from Class A.” If something like that were to\u0026#160;develop, there could be substantial hesitation when the time came to fight. There were probably more than a few students who intentionally wanted to keep themselves from knowing too much about people from other classes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The purpose of this school trip is to deliberately remove that obstacle,” Chabashira-sensei told us. “It will be a great opportunity for you to get to know each other as fellow students at this school, and simply as human beings, person to person, rather than as students from other classes as you have until now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFour nights and five days might seem short, but it was a lengthy period of time. The more time people spent on group activities during that period, the more likely it was that the distance between them would be shortened. On\u0026#160;the other hand, though, there could be cases where the distance wouldn’t shorten at all. Even if the school removed some obstacles, it wouldn’t matter if the students themselves put up walls.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I dunno,” lamented Ike. “It’s… I can only imagine that this school trip is gonna be a pain. Like, we’re gonna have to worry about stuff, and I really don’t think I’m gonna be able to have fun!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough they knew that there was no way they could change the rules that had been set by the school, there were apparently several students who opposed the idea, like Ike. I guessed that spending time with trusted, like-minded friends was one thing they did not want to give up. Especially Ike, who got himself a girlfriend only a short time ago. It was understandable that he was upset; depending on how the groups were formed, he might not have the chance to spend the trip with Shinohara. The tumultuousness became infectious, spreading to others, but in the midst of it, one young man stood up from his seat to put a stop to it: Yousuke.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I agree with the school’s thinking.” While the classroom was filled with a flurry of objections to the idea, Yousuke declared his agreement, as though he were trying to spearhead support.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s great for you, Hirata,” someone else replied. “I’m sure there are lots of people even in the other classes that you’re friends with, but we’re good, we don’t need to hear you bragging.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt certainly seemed like Yousuke, who had a wide circle of friends, wouldn’t have many problems regardless of who he was partnered up with. However, there was no way that Yousuke would make an announcement just to boast about something like that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not what I’m saying. There’s no one in any other class who I understand better than my own classmates,” he said, pointing out that he was still essentially on the same side as Ike and the other students. “I’m saying that I don’t think it’s a good idea to rush into things carelessly.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay then, in that case, why do you agree with the school on this?” asked Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess because I feel like there’s a kind of significance to this,” Yousuke replied. “Everything we do in this school is very disconnected between classes in our grade level, except for club activities. There’s been hardly any opportunity to make friends with students from other classes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd that was obvious, as well. Although there had been a few special exams where we’d temporarily allied together, the fundamentally competitive nature of the classes meant that, just as Yousuke suggested, we would avoid carelessly getting too deeply involved with other students. It would likely be even more difficult for a kind-hearted person to go through that. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But, I mean, wouldn’t it still be weird to agree to this, then?” one girl said. “I think it’s easier for rivals to work together when they’re at, like, arm’s length from each other, like a reasonable distance, y’know?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm… But I consider friends to be friends, regardless of the class,” said another.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOpinions appeared to be divided, even amongst the girls in class. It was an issue of perspective. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess this conversation is kind of headed into chicken-and-egg territory,” said Yousuke. “Are other students rivals first and friends second, or are they friends first, rivals second? I’m sure that both are correct. Just as Chabashira-sensei said, this school trip is a wonderful opportunity for us to learn about that. We don’t just have one choice. The more choices we have, the more possibilities open up. That’s what I think.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I kinda get what you’re sayin’, Hirata,” Sudou said. “Besides, even if we fight the school on this, it ain’t like they’re gonna change the rules, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf the school were willing to listen to our complaints and accommodate us, then it would be worth resisting. But the students in this class understood quite well that wasn’t how things worked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s nothing wrong with you engaging in a little heated debate, but first, let me continue, okay?” Chabashira-sensei cut in. “I think it’ll be easier for you to talk about this after you hear the specifics.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd with that, the itinerary was displayed on our tablets.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s been decided that students will be divided into groups as equally as possible over the four nights and five days of the school trip,” she told us. “Each group will consist of eight students. You can generally assume that there will be two students from each class, a boy and a girl, per group. However, at the current point in time, there are 156 students in your grade level. Since it’s not possible to divide you all up equally into groups of eight, there will be eighteen groups of eight students and two groups of six students. We’ve also taken care to ensure that the gender ratio will be as equal as possible.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was an even split of boys and girls amongst the four students who had been expelled thus far, with two boys and two girls, but the issue of what classes they’d belonged to introduced another problem. Because of that, the school couldn’t divide everyone neatly into groups of eight, and there was going to be some offset, with a couple of groups of six. Still, that was completely understandable, since it couldn’t be avoided. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, that was riding on the assumption that there wouldn’t be any more expulsions before the first day of the school trip, or any absences due to health issues.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As for the question of how much you’ll be doing together with your group and where you’ll go, that’ll be determined after we reach Hokkaido,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs Chabashira-sensei told us the rules for our groups, they were also displayed on the monitor.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eSituations where it is necessary to stick together as a group:\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen instructed by the school on location\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDuring free time\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eSituations where it is not necessary to stick together as a group:\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen you are inside lodging facilities\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe were going to depart from the school on board buses separated by class, which would take us to Haneda Airport. Then, we’d board the plane and land at New Chitose Airport. Afterward, students would be divided into their groups at the airport. From that point onward, the general rule was the groups would be sticking together until we headed back to school by bus. There was a lot of bus travel in our itinerary, between the bus ride to the airport and being taken by bus to our group activities once we arrived in Hokkaido. And, including time spent sleeping, it sounded like we would be spending almost all our time with the people in our group.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even when you’re on free time, individuals are not permitted to just do whatever they please,” Chabashira-sensei added. “Discussion within the group is necessary, and it is absolutely essential that you act together as a group. If a group cannot come to a consensus on a destination, then they will not be allowed to leave the ryokan.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt would be simple enough to come to a compromise if you were with students who you were close to, but that could get tricky. If highly assertive students were partnered up together, they wouldn’t readily agree on anything. It was possible people could end up not going anywhere as a result.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When inside lodging facilities, you’ll generally be free from group activity restrictions. You can go to the bathing area whenever you wish, you can relax in the lobby, and you can go eat whenever you want, as long as you’re within the curfew.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe ryokan where we would stay was the only exception to the rule about sticking together as a group. We’d be staying together as groups in our rooms, albeit with girls and boys separated, but we were apparently free to have breakfast or dinner, take a bath, or engage with the other activities available in our lodging as we wished on our own.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ll be staying at the same ryokan for all four nights. Even among places in Hokkaido, it’s an extremely famous and respectable place to stay. I’m sure that you won’t get bored, and you’ll be able to spend your time there in comfort.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh, I guess the ryokan’s gonna be the only time we can relax, then…” muttered one student.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m just going to say this once more, but this trip really is an excellent opportunity for you to get to know students from the other classes on a deeper level,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter hearing her explanation, though, Yousuke seemed to have a question of a different nature.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If the idea is to have us interact with a larger number of people, isn’t it a little strange that we’re going to be with the same group of people for the entire trip?” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You make an excellent point, Hirata,” said Chabashira-sensei. “We did also consider changing groups in a daily rotation. However, if we just randomly put you in touch with lots of different people, you wouldn’t really get to know your group mates. If you were together for less than a day, it wouldn’t be difficult to just pass the time superficially as acquaintances. However, it’s a different story if you’re together for four nights. If you cannot open up honestly and spend time with your group as your true selves, then you won’t be able to enjoy this valuable trip.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was true that if a group were together for only a day, then you could just stick it out no matter who you were with. Even if you were put together with a group you didn’t like, it would change the next day, so you could just put up with it until you eventually got put into a more comfortable situation. On the other hand, if you knew that your group was fixed, then you’d have to make things work.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Someone like Hirata or Kushida, who have a lot of friends in other classes, might get along with whoever they’re paired up with, no matter what kind of group they’re in,” Chabashira-sensei went on. “And on the flip side, for someone with few friends, it’s true that they might have a tough time no matter what group they are placed in. Those are definite possibilities. However, don’t look at this negatively; think of it as a good opportunity.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eObviously, relationships weren’t quite that simple. If\u0026#160;you were the type of person who wanted to make friends but couldn’t, then yes, you might be able to take a proactive approach like Chabashira-sensei said and see results. But for those who considered friends unnecessary, this was going to be a somewhat burdensome school trip. Well, I supposed that if you thought like that, the very idea of a school trip might be depressing anyway.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Also, if it’s proven that a group is not acting together as a unit, that may lead to free time being revoked,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf something like that were to happen, then it would be like more than half of the school trip was rendered meaningless. In other words, it was imperative to stick with our established groups. Most of the students tended to follow the rules, but there were some students who didn’t… In unison, the students’ eyes all turned to Kouenji at the far back of the class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What is it, ladies and gentlemen?” he said. “You’re all looking upon me with such envy in your eyes. I don’t mind—you may gaze upon me all you wish.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji hadn’t been listening to a word that Chabashira-sensei or anyone else had said. He looked at everyone with a beaming smile as he spoke. In many ways, he was the sort of young man who couldn’t read the room, but he still came to school reliably, and he wasn’t a rulebreaker. He might be unexpectedly obedient in his group on the school trip… Maybe. It really wasn’t clear what the future might hold, so I was sure that many students were hoping not to be paired up with Kouenji if at all possible.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The group assignments are not going to be determined randomly,” Chabashira-sensei continued. “Groups will be assigned based on the tables you made earlier.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, that was why she’d specifically had us carry out that task before explaining the details of the school trip.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Also, about your phones—I know you use them every day, and you can still use them during the school trip. That won’t be a problem. Restrictions on who you’re allowed to call will not change on the trip. Calls to other second-years, or other enrolled students, will be permitted, as will calls to police or emergency services in the event of an emergency, but calls to family or anyone else outside of the school will remain prohibited. The school will keep track of your call history, so please exercise caution.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei had laid out the theme for this school trip. It was hard to believe that it was simply to get the students to become friends. It could be interpreted as one of the milestones for our school life in the days to come. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfterward, Chabashira-sensei continued to tell us more about the school trip, but really, the most striking and unusual point was the matter of the groups being made up of students from across our entire grade level. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAside from that, I supposed that another thing we needed to be somewhat mindful of was handling our cash. Since we only had Private Points, we had no way of shopping off campus. Therefore, we would need to put in an application with the school to exchange our Private Points for cash in advance, and the school would provide us with currency. If we ended up short of funds on-site during the trip, the school could exchange up to a maximum of ten thousand yen there. Once the school trip was over and the students returned, then we could go back to using Private Points. It’d probably be better to convert a lot of points into currency ahead of time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e2.3\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eW\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHEN IT WAS TIME\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e for lunch, I headed out with Kei to eat together, which had become routine as of late. However, this time, we had some guests with us, which was unusual: Yousuke and Satou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, this kinda seems like a double date, doesn’t it, Ayanokouji-kun?” said Satou somewhat shyly, standing near me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, pump the brakes there, Maya-chan,” teased Kei. “That’s not the kind of thing you say to \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eKiyotaka\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe girls were having a friendly chat that sounded like fighting, which I didn’t understand much at all. They continued their conversation as we walked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is my first time ever going to Hokkaido,” said Kei. “Have you ever been there before, Kiyotaka?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nope, never,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs someone who came from the White Room, pretty much everything was new territory for me. I’d had simulated experiences in various environments over the course of the curriculum, but I hadn’t experienced Hokkaido before. All I knew of the world came from television and books; I was only aware of the fact that Hokkaido was a cold region that covered a vast expanse of land. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed that the main focus of our conversation was going to be the school trip, after all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seriously, though, they’re gonna give us that much free time for a high school trip?” Satou said. “Like, don’t we get too much free time?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was surprised by that, too,” said Yousuke. “I was expecting something like one or two hours of free time per day, at most.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Isn’t it good to have a lot of free time, though?” said Kei. “I think it’s a lot better than having to sit there for a long time doing nothing, like being stuck at some museum or having to listen to the locals yammering on.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYousuke laughed, and Satou nodded vigorously in agreement. As for me, personally… Well, that kind of orthodox schedule didn’t sound so bad. The more freedom you had, the more the trip would deviate from the purpose of school.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I am a bit worried about the groups, though, I think,” Yousuke said. “I do like the idea of making friends with people from other classes, but I can’t help but feel like there’s something more going on.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Something more?” asked Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYousuke nodded and glanced over at me, as though he were looking for an answer to that question.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As long as we’re competing to get into Class A, feelings like compassion are a liability,” I told him. “There can only be one Class A.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose a lot of people think that way, yeah,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was sure Yousuke was conflicted, since he already had strong feelings on this issue. While he did want to become friends with others, on the other hand, getting to be \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003etoo\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e close with others had its downsides.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m a little scared,” he went on. “I’m afraid that if I make friends with someone from another class, I could get too close to them—or find out about their circumstances, how they absolutely have to graduate from Class\u0026#160;A, or something.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm… Yeah, I see what you’re saying,” said Satou. It\u0026#160;sounded like she must be imagining what it might be like, too. “I think I get what you mean, Hirata-kun. Like you’ll feel too sympathetic.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t really think that way, though, personally.” Kei rejected that sentiment. “I mean, the important thing for me is that \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e get into Class A, not anyone else… Am I a cold person?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t being cold, though; it was the honest, true feeling most people shared.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No one can know the true nature of other people’s feelings,” I replied. “However, if you want my personal opinion on the matter, I’d say that, by nature, it’s easy for humans to become kind on the surface in certain circumstances, if only for a moment. And when that happens, they don’t want others to see that they have unpleasant feelings underneath.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFeelings like love and hate were extremely annoying.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For the sake of argument, let’s say there’s a student in another class who must graduate from Class A, like Yousuke said,” I continued. “If that student doesn’t make it into Class A, there’s a risk they could end up taking their own life down the road.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?” said Kei. “Isn’t that, like, a huge exaggeration?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, it’s an extreme example, for sure,” I conceded. “But we can’t say with 100 percent certainty that it wouldn’t happen.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo one knew where a person’s emotional boundaries really lay except for the person in question.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Suppose that you knew that person’s situation, and you yourself had over twenty million Private Points on hand,” I went on. “However, you needed to use those Private Points to protect yourself and others in your own class. You could fight without those points, but they were an important insurance policy. What if someone in your class, such as Yousuke, said that they wanted to save just the student who would take their own life in the future?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh… Well, I…” Kei stammered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And what if the class ends up sending the message that it’d be okay to help, but deep down, everyone thinks it’s ridiculous? Wouldn’t that open up the possibility that some students might feel obliged to put up a front, just pretending that they’re okay with lending a hand?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf someone objected, they would probably be met with scorn for taking the matter of someone ending their own life so lightly. And in truth, there’d be no way to know what the people giving those scornful looks would really be thinking, deep down.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m still exaggerating here somewhat,” I said, “but knowing your enemy isn’t all positive.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then, why is the school making us get along with each—” Kei must have figured it out partway through, because she suddenly stopped mid-sentence. “Do you think it might be something like… You know, like, do you think it might have something to do with a special exam down the road or something…?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We can’t rule out that possibility.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt the very least, right now, there was basically no one in any of the other classes who we’d be upset to see expelled. Anytime someone we weren’t close to was removed from the playing field, we gained a vital advantage and came a step closer to Class A. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Those tables we made, this school trip—they might just be setting the stage for something,” I said. “If so, then it might be the final exam that’s the real challenge.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If that’s true, then things could get messy… I’m genuinely scared,” said Yousuke.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Same, me too,” Satou said. “I have a bad feeling about this.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOver the course of this conversation, both of them had gained a better understanding of their anxieties about the future. At the current point in time, we didn’t know if expulsion would be a factor, but it was looking certain that this year’s final exam was going to be harder than the last one.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e2.4\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE STUDENTS’ FEVERISH ANTICIPATION\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e of the school trip didn’t wane after class ended. I received a succession of messages from a certain someone, who apparently wanted to meet with me at a bench near Keyaki Mall. I could’ve ignored the mes
