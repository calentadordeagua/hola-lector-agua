sages, of course, or changed the date of our meeting, but Kei had plans to hang out with Satou and some other girls at the dorms today, so the timing was perfect for me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was curious about what was going on with the person who’d messaged me, so I figured it was a good idea to meet. I immediately replied to the texts saying I could meet today, and I headed to the agreed location. Since I arrived about ten minutes earlier than planned, I decided to sit down on the bench and wait. Classes had just ended for the day, so students were walking past the bench where I was sitting, heading toward Keyaki Mall. I had to say, somewhere this conspicuous was a curious choice of meeting place. Was it out of the fear that I’d be on my guard and refuse to meet up? No, that seemed out of character.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eActually, the fact that I’d been deliberately contacted in advance was also out of the ordinary. Was this simply some kind of emotional or psychological problem, or were there other forces at work? \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI spent some time sitting there watching the crowd of students heading toward Keyaki Mall, and then…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe appointed time came and went, but there was still no sign of the person I was supposed to meet. I figured the meeting time was probably supposed to be approximate, so I decided to carry on browsing the internet without worrying about it. Just as I was killing time scrolling on my phone, I heard a girl’s voice from somewhere close by.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hello!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I looked up, I saw that it was Amasawa Ichika, the one who’d been messaging me earlier. She was with Nanase, though, who was in a different class from her. In contrast to Amasawa, who was all smiles, Nanase appeared a bit surprised. They waved as they approached, stopping about ten centimeters in front of me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry to have kept ya waiting!” said Amasawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see that Nanase is with you, too,” I said. I couldn’t just ignore Nanase while she was standing right in front of me, so I decided to go ahead and acknowledge that she was there, as a formality.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes,” Nanase said. “I’m sorry. Please excuse me for tagging along without telling you.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah, no need to apologize,” I told her. “It was just a little unexpected, is all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had gone into today’s meeting with the assumption that I was going to be talking one-on-one with Amasawa. But any question as to why Nanase was here was quickly dispelled by what Amasawa said next.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nanase-chan held me up. That’s why I’m late to our meeting.” Amasawa pointed her finger at Nanase, indicating that she was the one responsible. “And on top of that, she insisted on taggin’ along.” She turned to Nanase. “You wanted to see Ayanokouji-senpai that badly, huh?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Really?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, no, I—” Nanase got a little flustered, but she regained her composure and immediately corrected Amasawa. “I was curious about what Amasawa-san\u0026#160;was up to, so I followed her, but I didn’t know that she was\u0026#160;meeting with you, Ayanokouji-senpai.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?” said Amasawa. “Did I not say anything about that? I was pretty sure I did.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You only said something once we saw Ayanokouji-senpai.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah ha ha ha, you might be right!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, that was why Nanase had looked so flustered when our eyes met. I listened to the two first-year students as they explained the situation to each other. Still, seeing as how Nanase showed no sign of leaving, I figured she must have had her own reasons for being here. Putting that aside for a moment, though, I turned my attention to Amasawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I heard you’ve been absent from school for a while,” I commented.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re well-informed,” she said. “You investigated me, huh? So, you were interested in me after all. You know, I’d welcome anything from you, Ayanokouji-senpai, even stalking.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter the Cultural Festival was over, and the holiday had passed, Amasawa hadn’t been seen in class. I had figured it was unlikely it was due to illness.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-senpai knew because I reported it to him,” said Nanase.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, so you’re my stalker, Nanase-chan?!” Amasawa exclaimed, raising both hands in the air in a deliberate overreaction. “Hm, a girl, huh? Well, we do live in an age of diversity, right? And you’re cute, you know? So, maybe.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please stop making self-serving assumptions.” Nanase remained calm in the face of Amasawa’s high energy. “That’s actually exactly why I spoke to Amasawa-san today,” she said to me. “She’s been absent ever since Yagami-kun was expelled. It was obvious her absence wasn’t due to poor physical health, but some kind of psychological condition, and so it was only natural for me to feel distrustful when she suddenly came back to class.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, it was a natural course of action to watch the movements of a White Room student after they’d suddenly returned to class? Hm. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYagami Takuya. He’d meddled in my business a few times, but after everything that led to his expulsion, it was clear beyond doubt that he was a student of the White Room—which made Amasawa his fellow student. What had happened must have shaken her up. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And now that I know that she’s meeting with you, Ayanokouji-kun, I’ve decided I can’t just leave,” Nanase added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aw, you’re like a knight, protecting your senpai,” teased Amasawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, it’s nothing as grandiose as that. It’s just that I determined that I couldn’t know what you might do, Amasawa-san, in your current state of mind.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt might have seemed like a series of coincidences that brought Nanase here, but she must have been making her own speculations. It was difficult to imagine Amasawa deciding to come to school now, after the vacation had ended, simply because she wanted to go back to class. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I guess it’s something like that,” said Amasawa. The bright, chipper attitude she had exuded up until this point was gone. I couldn’t feel the usual energy radiating from her. “I know I’m kind of butting in, but I figured it’d be okay.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re still here at this school, then that means you’ve found the answer on your own, right?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlmost instantly, Amasawa’s smile quietly faded. Judging by the wavering I saw in her eyes, she must not have found it after all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why didn’t you tell them to take me back too, senpai?” she said. “I think you could’ve gotten me expelled along with Takuya.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because you’ve been more concerned with enjoying yourself at this school than with getting me expelled,” I replied simply. “That’s how I see it, anyway. You had no intention of forcing me out of school.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt would’ve been the same for Yagami, too. Although I had never had any direct, heart-to-heart conversations with him, I likely wouldn’t have needed to get him expelled if he had prioritized staying in school.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not what you think, senpai,” said Amasawa. “I still haven’t found my answer yet. It’s because, well… I was wondering, even if I did go back, if there would be a place for me anymore… I just kind of lost track of time, thinking about all that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe let out a soft, self-deprecating chuckle. In other words, she hadn’t yet decided whether she was going to stay here or move on. Or, I supposed, she could still choose to turn on me, too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But you have found some direction,” I said. “That’s why you called me, isn’t it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah, I guess,” she said. “I’m beginning to think that, since I’m still here, maybe it’s okay for me to stick around after all. I can’t go back to the White Room, can I? And even if I did leave school, it’s not like I know where my parents are or anything. I’d hate it if I just ended up doing shady part-time jobs or something because I didn’t have a purpose. Like, what a stereotype, am I right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf she were on the streets, she would need to take any means necessary in order to survive. But as long as she stayed in this school, provided she neither dropped out nor got herself expelled, she was guaranteed room and board until graduation. Furthermore, the school had a system set up to purchase back a student’s Private Points on graduation. From what I’d heard, it wasn’t exactly an equal-value exchange, but even as low as half value, you could still get a considerable amount of money. It would be possible for her to get some money that way and find a decent job somewhere.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was also a third path. Amasawa didn’t seem to be thinking about that, because she didn’t know where her real parents were, but there was always the option of trying to find them and returning to them. Still, if she were to officially drop out from the White Room, there essentially wasn’t any guarantee about how she’d be dealt with—it would be up to Amasawa’s parents whether there was anything for her on the third path. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFirst, her parents would need to be powerful in some way, either wealthy or prominent. If the White Room knew that she was the child of an influential family, then they were more likely to treat her hospitably. Secondly, her parents would need to want their daughter Ichika back. If those two conditions were met, it was possible that she could start a new life as a normal girl. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven so, there wasn’t any need to force that choice now. Perhaps Amasawa was bothered by my silence, because she spoke up once more, her voice subdued.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll stay here at this school. Only…if you don’t mind it, Ayanokouji-senpai.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And if I told you to drop out?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d drop out,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had wondered what kind of reaction she would have to that: pleading, angry, or sad. But she responded immediately and definitively.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not hearing any hesitation,” I said. “You’re not thinking of trying to get revenge for Yagami?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t feel like causing any more trouble.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhich meant that she came to this meeting with that much resolve—fitting for her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Those words don’t really sound like something a belligerent person like you would say, Amasawa,” said Nanase.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re right,” Amasawa said. “Only Ayanokouji-senpai gets this kind of special treatment from me. As for everyone else, though, don’t think I’ll be holding off in the future.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThose must have been her true intentions, without any degree of falsehood. Amasawa seemed to value Yagami more than I’d thought, as a compatriot from the White Room; as a brother-in-arms, so to speak. It was quite possible that anyone involved in Yagami’s expulsion from this school could become one of Amasawa’s targets in the future.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no reason for me to be against you staying here,” I told her. “If you want to stay, you can do whatever you want, Amasawa.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t know how much encouragement to give her, but her face relaxed a bit into a happy smile. “So, you mean that my abilities are so far behind yours that I’m not even a threat?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not what I meant. I’m nothing more than one person who plans to remain here in this school, and it would only be natural for me to want to support you if you wished to make that same choice, Amasawa.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhether she was an ally or an enemy was a trivial problem. Of course, if she tried to interfere with my plans, then I wouldn’t be able to just leave things be, but I’d hope she already understood that, after what happened with Yagami.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I see,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If what you’re saying is how you truly feel, Amasawa-san, then I will support you, too,” added Nanase—though the look on her face made it clear that she hadn’t completely dropped her guard.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s this?” Amasawa said. “There’s like, water coming from my eyes… What is this…? I’ve never felt this before…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh, no matter how hard I look, I’m not seeing any tears flowing,” I pointed out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah ha ha, that’s \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eso\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e weird!” she laughed. “I’m so moved, though!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was back to acting how she usually did, but it looked to me like she was putting on an act to try and force herself to cheer up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m guessing you may not want to hear this question, but what sort of person was Yagami, anyway?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m curious, too,” Nanase said. “I still don’t quite understand why he kept doing such roundabout things, even before trying to get you expelled, Ayanokouji-senpai.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhy had he hurt those two students in Shinohara’s group even though he knew it was risky? Why had he driven an unrelated student from Class 1-C to expulsion? His scandals had drawn so much attention that the school even made an announcement about it. Nanase must have been wondering about a great many things as well.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s see…” Amasawa posed like she was lost in thought for a moment, but she immediately started speaking again, if slightly stiltedly. “I think Takuya was scared. I think he was scared to fight you, Ayanokouji-senpai. But I think he kept those feelings buried so far deep down in his heart that not even he was aware they were there.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, that was her analysis. Amasawa had likely known Yagami better than anyone else. I was sure that I didn’t need to interject or ask her for additional details. What she told us was likely the correct answer.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, in order to escape from those feelings of terror,” she went on, “he kept making long detours, over and over, without even realizing it…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd that had ultimately led to him digging his own grave.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think it might take me a little bit longer to get back to my usual self\u003c/span\u003e\u003cspan style=\" font-size: 1.00em; letter-spacing: 0.60mm;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e” Amasawa said. “But I’m sure that…I’ll be fine again soon.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere wasn’t any need for her to rush things. It hadn’t even been a full year since Amasawa had started her life here at this school. It’d be fine for her to take her time and think about the path she wanted to take from here on.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s all I wanted to tell you today,” she concluded. “So, I think I’m going to head on back for now. What about you, Nanase-chan?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt sounded as though Amasawa was inviting Nanase to come along with her, but Nanase shook her head. “I’m sorry, but I’d like to speak with senpai a little. Do you mind?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Well, I’ll lend him to you for today, as a special occasion,” said Amasawa magnanimously.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI’m not your property,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I thought to myself, but I figured that was just Amasawa putting on a brave face, trying her hardest to make it look like she was okay. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe didn’t stick around for too long; she started walking toward the dormitory. Nanase and I both watched her in silence until she disappeared from view. Looking at Nanase’s side profile, she had a grim expression on her face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“From what you’ve observed,” she said, “what do you think about the things Amasawa-san said, her behavior, and her mannerisms?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m still a little worried about her actions causing problems in the future.” So, Nanase was anxious about that. No wonder she kept looking at me so intensely.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can’t trust her?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not saying that I don’t want to trust Amasawa-san,” Nanase said. “But I don’t think we can let our guard down.” It was a rather diplomatically phrased response, but it was obvious that she didn’t trust Amasawa. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not going to drop my guard,” I assured her. “Or rather, I’m just going to carry on the way I always have.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was here at this school so that I could live an ordinary school life. I wasn’t going to allow myself to be swayed by adversaries, near or far. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose that’s just…me being needlessly overanxious, huh?” said Nanase.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I appreciate your concern. Even if it’s just one person on my side, it’s great to have allies.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough Nanase seemed somewhat satisfied with how I was approaching this, she still had more to say. “At the risk of coming off as obstinate, please allow me to say this once more. While I do understand your abilities, Ayanokouji-senpai, as well as the possibility that Amasawa-san has truly had a change of heart, please be careful. It is an undeniable fact that Amasawa-san is a student from the White Room. We don’t know what kinds of methods they’ll use.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was pleading with me strongly, desperate that I be prepared in the event something might happen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I want you to remain at this school and graduate, Ayanokouji-senpai.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t that I thought we should have nothing to do with each other, but it did seem like Nanase was more concerned about me than herself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you are ever in trouble, no matter how trivial, you can always come talk to me,” she added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand what you’re trying to say,” I said. “I’ll keep that in mind.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven Nanase finally seemed to be satisfied with that response. “In that case, I’ll leave it at that,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps she thought that she would be a bother if she hung around any longer, because now she turned away from me and started back toward the dormitory. But despite all her warnings to watch out for Amasawa, something struck me as strange. I decided to pry a little.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, I forgot to mention this, but I guess we’re going on our school trip this week,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, I see,” she said. “Yes, that’s right, that is this week. Senpai, please enjoy yourself to the fullest. School trips truly are the highlight of one’s school experience, after all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I intend to.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYeah, something really did feel off. Whether Nanase had known about this school trip or not, she should have had something to say to me about it. But she didn’t even show the slightest sign of doing so. It was almost as though she had completely forgotten about it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is there anything you want as a souvenir?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d decided to try and stop Nanase from leaving and dig a little deeper into the subject of the school trip.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, speaking of your trip, where are you going, anyway?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hokkaido.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, Hokkaido, that sounds nice. When you think of Hokkaido, you think of… What was it? Butter, and things like that, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Getting butter by itself as a souvenir might be a little weird,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wasn’t going to deny her request or anything if that was really what she wanted most of all, but I didn’t get the sense that it actually was.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, I think that I would like chocolate-covered fries,” she said. “They’re famous, aren’t they?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I have no idea.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOur conversation was getting kind of mutually incoherent.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, chocolate fries,” I said. “I’ll look into that a bit later. If I find any over there, I’ll buy some.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you very much.” With that said, Nanase turned to leave again, but before she could, I spoke up once more, in a firm tone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nanase. Is it okay if I ask you one more question?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes? What is it?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe matter of Amasawa and the school trip. Even if an ordinary student couldn’t see the link between the two, Nanase would be able to. Honestly, it would’ve been strange if she couldn’t.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For someone who worries about me so much, you didn’t mention anything about worrying about me on the school trip.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh…?” Nanase cocked her head to the side, as if she didn’t understand what I was talking about.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t understand what I’m getting at?” I pressed, urging her to think harder.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt once, Nanase’s soft smile hardened for a moment.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This school has tight security,” I said. “It’s more or less protected from the outside world twenty-four hours a day. In fact, Tsukishiro had to try to get inside in order to get me expelled. However, school trips are quite a different matter. The teachers can’t see everywhere, and there are more opportunities for someone to do something, so you must be vigilant, even more so than back on the uninhabited island.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYes, the risks in a situation like that would be much greater than anything Amasawa could accomplish by baring her fangs at me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you know the people we’re dealing with, then you can imagine that they could go with more aggressive methods, like forcing me into their car or something like that,” I went on. “If you’re so wary of Amasawa, then you should have at least offered a word of caution about that. Something like, ‘Please be careful.’ Am I wrong?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase had been checking in on Amasawa up until she came back to class, not knowing what kind of action she’d take. And when she’d figured that Amasawa was going to try and contact me, she even came all the way here. There was no way that Nanase, who did all that, would not have sensed the dangers presented by the school trip.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve defeated Yagami-kun and Amasawa-san, Ayanokouji-senpai,” she protested. “For someone like me to worry about you, that’d be—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI cut her off. “That’s peculiar, though. If you really believed that, then there wouldn’t have been any need for you to stick by Amasawa’s side today and stand watch. The fact that you’ve been warning me so persistently itself is also a contradiction. Unlike out there in the outside world, where it was possible that a large group of adults could come after me at once, Amasawa is just one person, even if she is a White Room student. When it comes to how dangerous those two scenarios are, there’s no comparison.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase was bewildered, and immediately opened her mouth to speak…but no words came out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can’t think of an excuse?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you saying? It seems like there’s some kind of misunderstanding, Ayanokouji-senpai.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase had very obviously been shaken just moments ago, but right now, she was completely calm again.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure, it might be a misunderstanding on my part,” I said. “In that case, go ahead and tell me your opinion on the school trip again. You were worried about Amasawa, who might do something reckless out of desperation, and kept an eye on her. So, why didn’t you have a single word to say about your concerns about the school trip?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m ashamed to say this, but I think that I was naïvely unaware of the dangers. Now that I think about it, yes, I suppose the outside world would be full of dangers, as you’ve said, Ayanokouji-senpai, and yet…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was trying to claim that she was simply unaware. Indeed, if that were the case, it wouldn’t be difficult for me to understand how the conversation got here. But unfortunately, drawing a conclusion based on that was out of the question for me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s been a nagging question in the back of my mind ever since I met you,” I said. “About the relationship between Tsukishiro, the White Room students, and you, Nanase. I’m sure you were given a lot of instructions by Tsukishiro, but why weren’t you told anything concrete?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTsukishiro had taken advantage of Nanase Tsubasa’s desire to avenge Matsuo Eiichirou to make her obey his orders. But on the other hand, Tsukishiro had never revealed anything about the identities of the White Room students to her. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think it’s…because I’m a normal person, wouldn’t you agree?” she replied. “Since I’m not as capable as a White Room student, it’s no wonder that I couldn’t be trusted with that information.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At first, I didn’t see the man known as Tsukishiro as someone of particularly high value,” I said. “That was because I thought there was a more efficient way for him to get me expelled from school than what he was doing. However, as I got to know him, I changed my mind. I started to think that someone like him really could push me out of this school.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was so good that it made me think that he was holding back on purpose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But in the end, you weren’t expelled,” Nanase said. “Isn’t that because your abilities exceeded Acting Director Tsukishiro’s expectations?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If the story simply ended there, then yes, you might be right about that,” I answered. In other words, there was a possibility that this sequence of events wasn’t as simple as it appeared. “Getting back to the topic at hand, I think there’s another reason why you’re wary of Amasawa, but made no attempt to alert me to the dangers of the outside world.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The truth is that it was just due to a lack of awareness on my part,” she insisted. “What other reason do you think there could be?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wasn’t it because you couldn’t guess what Amasawa was going to do today? And you didn’t warn me of the dangers of being out on the school trip because you already knew that the White Room had no plans to try anything?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf there was no chance whatsoever that they would try and come after me, then it was understandable that Nanase wouldn’t be worried.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m afraid I don’t understand,” she said. “How could I say with such certainty that there was no possibility of them trying anything on the school trip?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s what I want to ask you,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Our conversation has given me a keen understanding of the risks involved with the school trip. I’d like to ask you to be even more vigilant regarding Amasawa-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, no matter how many times I repeated the question, Nanase was going to stick to her story that it was just a lack of awareness.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is nothing more than a theory, but would you mind hearing me out?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t mind at all. Go ahead,” said Nanase.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tsukishiro never had any intention of getting me expelled from the very beginning. That’s my theory.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough that theory overturned a lot of the assumptions I’d made up until this point, it did suggest that quite a few things were connected. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But wouldn’t that be odd?” Nanase said. “How would you explain the existence of people like Amasawa-san and Yagami-kun, then? Yagami-kun was specifically working to get you expelled, Ayanokouji-senpai. That much was clear from our conversation with Amasawa-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If Amasawa and Yagami were only serious about getting me expelled because they weren’t informed of the true goal by their superiors, then it makes sense,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But what about Acting Director Tsukishiro? He took advantage of his position of significant power to employ several aggressive measures.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If he was really trying, I would have been expelled.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHonestly, before even talking about how my abilities might’ve played into it, he should have taken advantage of any one of the countless options at his disposal to bury me completely.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand your thinking, senpai. Perhaps such intentions really were hidden, as you’ve suggested. But I have to say…the fact I’m being included in this is a little upsetting. I don’t want to be thought of as an enemy just because I failed to mention the dangers of the school trip.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay then, while we’re on the subject, what about the Cultural Festival?” I pressed her. “Someone affiliated with the White Room even came close to me, and yet you never appeared. Was that another instance of you simply being unaware?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…That was…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Was it just that you were too busy with your class’s offerings for the festival, and you weren’t able to get around to it? Meaning that your worries about me were secondary?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Th-that’s not it,” she sputtered. “Of course I was worried about you. And I was still watching over you from time to time then, senpai, and—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you sure about that? Can you say for certain that you’ve actually been watching out for me? If so, then next, I’d like to ask you when and from where you were watching me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhatever kind of person Nanase was, no matter her position, she should have understood very well what kind of person I was. If she carelessly gave me some false testimony, there was no escaping the fact that I would quickly expose her. I still remembered every minute detail of what happened on the day of the Cultural Festival. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even at the Cultural Festival, they didn’t try anything to force me out of school,” I added. “They urged me to come out willingly, but I’m sure that they already understood that I wouldn’t drop out of school just for something like that. That was why you didn’t show up then, Nanase.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase gasped silently as she tried to suppress her emotions.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The White Room had no intention of expelling me,” I went on, “not during the Cultural Festival before, and not now, during this school trip, either. In fact, it was never their plan from the very beginning. If my theory is correct, Nanase, then your presence here is extremely curious.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…………”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did Matsuo really commit suicide? And did his son Eiichirou die? I always assumed you were a third party, Nanase, and I thought that increased the likelihood of what you told me about Matsuo’s death. But if you being here was part of a calculated plan from the very beginning, then all that credibility is lost.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat meant I would lose the assurance of what she said on the uninhabited island, about how she had formerly stood before me as an enemy and then turned into my ally.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s all true, Ayanokouji-senpai,” she insisted. “However, even if you’ve presented your thoughts as hypothetical, I’m sure that I can’t dispel your doubts easily just by saying so.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe only way to find out whether it was true was to look up the information in the family register, or something similar—but of course, if the White Room was involved, then even that would be suspect.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And if we’re following your theory, what would be the reason for me coming to this school?” Nanase said. “It\u0026#160;doesn’t explain anything.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, that can be explained. If we assume that you were sent here to aid me, then it makes sense. Your role is to provide support if a White Room student such as Yagami or Amasawa tries to get me expelled. Even that one instance of us fighting over the matter of Matsuo was simply to get me to drop my guard around you. If you think about it that way, it fits.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSomeone who once fought against me as an enemy who then turned into my ally. Depending on the time, conditions, and circumstances, trust could be built over a brief period.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s exactly what Amasawa meant, about you being given the role of knight,” I added. “That’s what it all means.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTsukishiro had assigned Nanase, as well as Yagami and Amasawa, the job of getting me expelled. But he gave Nanase the role of first pretending to be my enemy, to see what I was capable of, and then becoming my ally. By performing that role, it was possible for her to make accurate, truthful deductions as she stood by my side, while intentionally not giving me any information about the White Room students.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s just a theory,” I said. “There’s still a good chance that Tsukishiro and the White Room are serious about getting me expelled. Either way, there’s no harm to me. If my theory is correct, then that means you’re a genuine ally, Nanase. And even if my theory isn’t correct, that doesn’t change the fact that you’ve been my ally all this time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis scenario wasn’t like a coin with two different sides; rather, it was like both sides had the same pattern. But I figured I’d keep that tucked away in the back of my mind for now. There was the possibility that \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehe\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e might really not be working to get me expelled. Then, what was he after? At what point had he started all of this? Was Matsuo dead or alive? Was his son dead or alive? Whether it was true, or it was all a lie, it didn’t affect my situation very much.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf everything up until this point were turned on its head, then… Maybe it had already been decided from the very beginning that I would enroll at this school.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It doesn’t seem like you’ll accept anything I tell you right now, Ayanokouji-senpai, no matter what I say,” Nanase said. “I think I have no other choice but to take my time to dispel your doubts.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know if there’s any way for you to dispel my doubts, but I guess that’s just the way it is. As far as I’m concerned, though, you can keep treating me as you have until now, I don’t mind.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I cannot do that. I…I cannot accept that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe quickly bowed and then briskly walked back to her dormitory. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase wasn’t physically capable enough to stand toe-to-toe with the White Room students. And while I couldn’t see exactly what her academic abilities were, she was still a step behind the likes of Amasawa and Yagami as of now. However… \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was still something about Nanase Tsubasa. Maybe it was just a hunch, but I felt certain of it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e2.5\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eFTER SEVEN O’CLOCK\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e in the evening, around the time that the sun had completely set, Sudou dropped by my room.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey man, sorry for suddenly stoppin’ by without callin’ and junk…” He sniffed. “Havin’ curry today?” He must have picked up a whiff of my supper after the scent wafted all the way to the entrance. He then suddenly looked down and noticed there were two pairs of shoes lined up near the entryway. “Someone else here?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I was just in the middle of making dinner. I was thinking of having curry with Kei,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, Karuizawa…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust then, the door to the living room opened and Kei peeked out, clad in her street clothes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And is it a problem if I’m here?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“N-no, not at all, ain’t a problem. Dude, are you guys like always together or somethin’…?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBased on his reaction, he had clearly come by on the assumption that no one was here but me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course we’re always together, duh,” Kei said. “We’re a couple.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A couple bein’ together twenty-four hours a day, that’s… Well, I guess it ain’t tough to imagine it’s like that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou was about to argue, but then he accepted Kei’s statement dejectedly. I guess he must have visualized various scenarios with couples he knew personally. Ike and Shinohara, for example—recently they’d started holding hands in public and things like that, and Shinohara had even been sitting in Ike’s lap. The two of them didn’t seem to care about other people seeing them, or what they might think. I was pretty sure I’d heard Ike say the two of them were going to karaoke right after classes were over today, too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m guessing you just got back from your club activities,” I said. I had the impression that Sudou generally came back to the dorms around this time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I ain’t got a girlfriend,” he said. “Basketball’s pretty much all I have.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was… I had no idea what to say to that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Look, I’m real sorry to interrupt you before you eat, but do you got a second? It won’t take very long.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wondered if it was something confidential; the first thing Sudou had done when he arrived was checking to see if there were other shoes at my door.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI turned to Kei. “Go ahead and get started eating dinner without me,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? I’ll wait. Besides, you’ll be done right away, right? He said it wouldn’t take long.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou stopped to think for a minute, and then assured her it would take less than five minutes. Kei must have been satisfied with that, because she closed the door. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI slipped my shoes on and stepped out into the hallway with Sudou. No matter what this conversation was about, I couldn’t imagine that Kei would divulge it to a third party, so I could rest easy on that point. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, uh,” Sudou mumbled, “Ayanokouji, you… No, I mean, um, like, y’know… Have you and Karuizawa…already…?” He was trying to confirm something with me using incredibly vague expressions.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll leave that to your imagination,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh… Wait, isn’t that, like, uh, practically the same as saying you have…?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHow my answer was interpreted was up to the listener.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So? What did you want to talk about?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“O-oh, yeah. I mean, it’s no wonder, since you’re so popular, and it ain’t like I’m in any position to be worrying about your business.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou shook his head as if to clear his mind of wicked thoughts, and then proceeded to check to see if anyone was around. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, to tell you the truth,” he said, “lately, it’s like, Onodera’s been, y’know, givin’ off some vibes. And like, pretty strongly, too. It’s got me all confused.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe sounded…well, not exactly happy, but rather puzzled, as he spoke. I knew that what I’d said to Sudou at the Cultural Festival had been weighing on him heavily every day since. As the person responsible, I needed to listen to what he had to say now with the utmost seriousness. Despite that, though, I figured I should correct him on something that needed to be amended.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You said that Onodera’s been ‘giving off vibes,’” I repeated, “but, looking at it from an outsider’s point of view, not much has changed since the Sports Festival. Perhaps you’re just feeling this way because it’s your perception that’s changed, Sudou.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs for Onodera, I didn’t think she was even aware that she had feelings for Sudou. On the surface, I was sure that she felt like she was just a friend inviting another friend to eat together or to hang out, like normal.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yeah, maybe you’re right about that.” Sudou scratched his head briskly. He seemed restless. “After that stuff you told me about her, though, I can’t stop thinkin’ about it. I can’t calm down—or like, I just feel uncomfortable, I guess. Even when I’m talkin’ to her, I keep wonderin’ what she really thinks about me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBefore, Sudou had only seen her as a good friend, someone on the same wavelength as him, who’d made an impression on him as an athlete. Now that he’d been told Onodera might have taken a liking to him, it wasn’t difficult to see how that would change how he saw her. The conversation stopped there. There were about ten seconds of silence.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI urged him to continue. “So? What did you want to talk to me about? I think there’s more you want to tell me.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat seemed to get Sudou to make up his mind, because he started speaking again.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s just, when I’m with Onodera…there’s all these messy feelings that start wellin’ up inside of me. I think, hey, if I started datin’ her, I’d be able to say I’d got my first girlfriend, and if Suzune ain’t gonna ever look my way anyway, then that’d be just fine. I don’t know if I’m really lookin’ at things, like, objectively right now or whatever, but Onodera is pretty damn cute.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNot only that, but she and Sudou talked about the same things, and they were both self-disciplined athletes. Strictly going by their compatibility, they’d probably be the best-suited people for each other out of everyone immediately available.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not really bad at all for you to think so, though,” I said. “Besides, even if you like someone that way, it doesn’t mean the other person will reciprocate. Often, it’s one-sided.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, it wasn’t like everyone could just take that kind of situation in stride. Sudou was struggling with just that, right here and now. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe… But there’s somethin’ else I’ve been thinkin’ about, too. I mean, you might have been wrong about how she feels in the first place, and she might only think of me as a friend, right? If that’s true, then that means I’m bein’ full of myself thinkin’ this stuff, and it makes me embarrassed, and my head just gets all jumbled up.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was basically zero doubt in my mind that Onodera liked Sudou. However, it was true that there was no ironclad guarantee that was how she actually felt. And anyway, tomorrow, she could have someone else in her sights instead.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve had a lot of worries too, though, yeah?” Sudou said. “I mean, Karuizawa used to date Hirata.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s true, yeah,” I replied. The reality was actually completely different, but I figured that I’d just keep the conversation going.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Man, i-if Onodera were to come up to me and tell me how she feels, then… I’m scared about what’d happen.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What would you plan to do if she told you how she felt about you, right now?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I dunno, dude… Well, no, that’s not true… Yeah. I mean, probably, I’d tell her that I couldn’t reciprocate.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, he’d waste his chance to grab hold of happiness.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I really do like her, after all,” he added. “Suzune, I mean.” That was one of the certainties that Sudou had as of now. “Just imagining how hurt Onodera’d be if I turned her down is pretty upsetting, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you came to me because you don’t know what path you should take?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah, that’s not it… I didn’t come here for advice from ya. This issue is about how \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e feel, ain’t it? It wouldn’t be right for me to get someone else to figure out the answer for me.” It seemed like he hadn’t come here seeking help, then. “I came up with an answer myself. I wanted you to hear me out.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s hear it, then,” I said. “What kind of answer is it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m…I’m gonna officially tell Suzune how I feel about her on the school trip. I’m gonna ask her to go out with me. For real.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom what he was saying, it sounded like, right now, it didn’t matter whether she’d actually say yes. He had come to this decision because he needed to do something to break out of the situation he was in.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m gonna do it because I still like Suzune, and I just can’t even imagine datin’ anybody else right now. No matter how it turns out, I just want to make things clear.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou had demonstrated rapid growth so far. And I was sure Horikita herself appreciated that very highly too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The odds are probably low,” he admitted. “I might just embarrass myself. But still…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe clearly felt that if he didn’t convey his feelings, he wouldn’t be able to move forward. That was why he was expressing his determination like this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I do get turned down, though, it ain’t like I can turn around and decide, ‘Oh, I’ll just go see Onodera now,’ right? If anything, I might get this strong feelin’ like, ‘I\u0026#160;can’t give up…’” He clenched one hand into a tight fist. “But the reason I came to see ya today is ’cause I want ya to witness my determination, Ayanokouji.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Witness?” I repeated. “You mean, like, the moment you tell her how you feel?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know, like, normally when you do that with somebody, you don’t do it out in the open for everyone to see, but I feel like maybe I need someone there.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMaybe he just needed that to help him muster the courage, to give him the necessary push. By cutting off any retreat, Sudou would be able to vocalize his feelings for Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m gonna hold out my hand and ask her to go out with me. And if she accepts, she’ll take my hand, and…” said Sudou, proceeding to hold out his right hand, as though he were rehearsing that moment.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe weren’t close to that stage yet, but I could already clearly see that he was putting quite a bit of passion into this. And when he was standing before Horikita, he’d put all of those feelings into words and bare his heart to her. If I were to evaluate his chances at present, I certainly couldn’t say that he had a high probability of success. But… Well, perhaps the strength and passion of his feelings, and his determination, would get through to her. For Horikita’s part, she might not immediately respond to him, agreeing to become lovers right then and there. But it was possible that she could say that they’d start out slow, beginning as friends.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand,” I said. “It’ll depend on the time and place, I think, but I’ll try my best to be there to witness it. That okay?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou must have been relieved to hear that, because he patted his chest and sighed. “Yeah. Sorry again, dude, for askin’ ya for somethin’ like this. Welp, that’s pretty much it, so, uh… I’ll get in touch with ya later. Sorry for interruptin’ yer time with Karuizawa.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, not wanting to take up any more of my time, he returned to his own room. I watched him go and then went back inside, where I saw Kei sitting down on a cushion by the table. It looked like she was waiting for me; she hadn’t even dished up the curry.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Welcome back! What did you guys talk about?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Lots of stuff\u003c/span\u003e\u003cspan style=\" font-size: 1.00em; letter-spacing: 0.60mm;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Lots of stuff? Now I’m kinda curious! Come on, tell me. I can keep it a secret.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t mind telling you, but would you mind standing up for a second first?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay.” She cocked her head to the side, puzzled, as I asked her to stand.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI touched the cushion she had been sitting on. It was cool. “So, you were listening after all,” I observed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…You found me out, huh?” she said with a smirk.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf she had been sitting down the whole time while waiting for me, then the cushion would have been warm. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Was my acting bad?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your acting was perfect. I just figured that you would’ve been listening in, is all, knowing you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, I… Yeah, okay.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And also, if you were going to trick me, you should’ve come up with some excuse about the cushion. Like you had gotten up earlier because you went over to the fridge to get a drink. There’s stuff besides water in there, like milk and tea.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really? But wouldn’t that have been strange, when I haven’t even eaten any of the curry yet? And there’s still water in my cup. Plus, knowing you, Kiyotaka, you probably would’ve checked, right? Like, you would’ve looked inside the fridge to see how much there was left.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you want to eavesdrop without being found out, you need to do at least that much. You could have just drunk the water, in that case—or, if you couldn’t drink it, you could’ve just poured it in the sink in the kitchen. There was already a lot of water in the sink anyway, because I’d been cooking.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt would have been impossible for me to discern water that she had poured into the sink from water that was already in there. But if there hadn’t already been water in the sink, then she could’ve poured it down the toilet, too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-well, enough about that. Come on, let’s talk about the school trip,” Kei said hastily, pitching forward as though she were physically trying to run away from that topic.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere wasn’t any point in pursuing that topic any further anyway, so I decided to just go with the flow.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, speaking of that, what did you think of the school trip itinerary, Kei?” I asked. “A lot of people in class were talking about how much free time we had.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, for sure,” she said. “But personally, I feel like it’s a downside. I mean, we have to spend all that time with the people in our groups, right? And my chances of being together with you seem low. Right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe chances that we’d be placed in the same group were about five percent…but only if you were determining the probability assuming the selection would be completely random. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugggh. Please, God, please let me and Kiyotaka be together!” Kei brought her hands together, fingers interlaced, as though she were praying to heaven.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if we can’t be together during free time, there aren’t any restrictions when we’re at the ryokan,” I pointed out. “Still, personally, I consider this a fantastic opportunity to get to know the students from the other classes better.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00
