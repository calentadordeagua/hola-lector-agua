[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T1488e,"])</script><script>self.__next_f.push([1,"\r\n\u003cp id=\"auto_bookmark_toc_top\" class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 5:\u003cbr/\u003eTime to Settle Things\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003e“T\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHIS BRINGS US\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to the end of homeroom,” said Sakagami-sensei, Class C’s teacher. “I’d like to remind everyone to please be on your best behavior, even during winter vacation, and to make good use of your time. That’s all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI took out my phone as I listened to his gracious, meaningless words. Today was the day of the closing ceremony—the final day of the second semester. Our classes finished early, leaving us free by afternoon. There were no club activities today, either. The school encouraged students to head back early, so hardly anyone would be left in the building.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, it was finally time to strike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I eliminated everyone I can, but that still leaves about ten possible candidates,” I muttered to myself. Some were people I’d never even spoken to, but it couldn’t be helped. I would’ve preferred to do this without using Karuizawa, but X had eluded me so far.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I guess this just means I get to have some more fun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTo be honest, there was a particular person I’d had my eye on all along, but I couldn’t jump to conclusions yet. If anything, it would be all the more fun to be able to confront X with a clear head and no doubts.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d taken certain steps after the Paper Shuffle. I mobilized every Class C student and assigned them targets to spy on. Of course, it wasn’t like tailing people was likely to get me much closer to discovering X’s identity. I excluded the weaklings, narrowing my list of suspects to delinquents like Sudou and Miyake, and conservative people like Hirata. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe Class D punks had noticed they were being tailed—except for Sudou, who was so dumb and oblivious I’d had to have my people provoke him directly. But being noticed was fine by me. I wanted them constantly aware that I was watching. I wanted X to spend their days trembling with fear, terrified of having their identity discovered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYet they’d continued to use Suzune as a cover, stubbornly keeping themselves hidden. Which meant I had to tighten the noose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOne more thing. Though I’d all but told X I’d target Karuizawa, I had yet to make a move. I was sure they’d been on edge these past two weeks or so, probably wondering how and when I’d contact Karuizawa, how I’d extract information from her. Chances were, they were asking her daily whether anything out of the ordinary had happened. The uncertainty would take it out of them. It would confuse them. They’d be exhausted, paranoid, and jumping at shadows, constantly imagining me breathing down their neck. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhich made today the best day for me to strike. Now, I was ready to corner them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though it’d only been a few minutes since dismissal, more than half the class had left. The clock on the wall seemed as if it was ticking slower than normal. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh heh…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy heart raced. It’d been years since I felt this kind of exhilaration. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki had asked why I risked so much just to identify X. She called it meaningless. She was right that I didn’t care about anything past discovering X’s identity, at least. Ibuki thought I’d feel disappointed once I found out who\u0026#160;X was. That might be true of normal people, but fighting Class D had led me to understand that X thought and moved like me. I’d never met another person like myself before. That fascination drove me onward. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wondered how I would feel when I came face-to-face with X, and what my next goal would be. X had entertained me for so long. The thought of meeting them made my pulse quicken, almost like first love.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI would do anything, use any means, to find them. The text I’d sent to X this morning was already marked as read. They knew what was going to happen today. What would they do, then? What kind of plan would they devise?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ryuuen-kun,” said Shiina Hiyori, who sat right beside\u0026#160;me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Everyone seems really restless today, don’t they?” she asked, surveying the room. The remaining students all drew nearer to me. “What are you planning?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m going to confront my entertaining quarry of these past several months. You wanna come?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I must decline. I don’t quite see how that would be fun.” Shiina paused, then said, “Do you really need to hunt them down?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nothing. I suppose that’s for you to decide, Ryuuen-kun, as our class’s leader.” She stood. “I’ll be in the library. If there’s any trouble, please contact me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not like you’ll be of any use, though, is it?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose you’re right. Well, have a nice winter\u0026#160;vacation.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe said that calmly, without a trace of fear, then left. Hiyori was clever, but she hated conflict, which made her useless as a pawn. People who obediently followed me around were much easier to use.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI finished my final preparations, then gathered my people.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s time, isn’t it, Ryuuen-san?” said Ishizaki, looking restless.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s make the most of today,” I told him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI handed Ishizaki a bag with certain indispensable items in it. Ibuki and Albert stood up, too. I didn’t need large numbers for this. I needed people who were tight-lipped, because we were about to do something that would shock this proper, well-behaved school to its core.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e5.1\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHIRTY MINUTES AFTER\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e homeroom ended, winter vacation had begun. The campus was practically deserted. As with summer vacation, the students stampeded back to their dorms, leaving barely anyone to witness our bold movements. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, where are we going? Cut the crap and tell us,” said Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d said nothing of my current strategy to anyone, to eliminate the possibility of spies like Manabe and her friends. Ibuki and the rest only knew that I’d ordered Ishizaki and the other guys to keep an eye on Miyake and a few more people. Therefore, they didn’t know the real reason I’d pressed Kouenji. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had no doubt that X would do whatever necessary to keep their identity hidden. So, I’d hidden my plans as much as possible to improve my chances of cornering them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Concerned, Ibuki?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You make me nervous, dragging me into all your stupid schemes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki might have been curious about my true intentions as well, because he drew in closer, too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You remember Karuizawa, right?” I said. “She’s the reason Manabe and her friends were strong-armed into spying on us for Class D.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That loud girl from Class D, right?” Ibuki had infiltrated Class D on the deserted island, so she knew its students quite well.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I sent Karuizawa a message today, asking her to come to the rooftop. Karuizawa knows I was the one who sent it, too. I got her email address from another girl in her class.” I avoided saying the traitor’s name. It wasn’t necessary for me to reveal Kushida Kikyou’s part in this yet.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? The rooftop? No way Karuizawa will come if \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e ask her.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She’ll definitely show. I told her that, if she doesn’t, I’ll expose her past.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf that pathetic bullying story went public, it would cause an uproar. Her social life would be dead in the water. She had no choice but to bite the bullet and turn up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if Karuizawa \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edoes\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e show, do you think she’d tell you X’s identity?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose she wouldn’t let that slip, normally…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Normally? No.” X had almost certainly promised to protect Karuizawa from all her enemies. “But I sent X a message, too. I told them I was meeting Karuizawa today, and that I was going to learn their identity from her. That I’d use any means necessary to get what I wanted. That way, I’m not just threatening Karuizawa, but also threatening X at the same time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But…you sent a threatening message to Karuizawa, right? What if she tattles to the school? If X puts the idea in her head, she might.” Ibuki glared at me, as if demanding to know why I hadn’t thought that far ahead.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She won’t do that. If she does, I’ll expose her right away. No matter what she tries, Karuizawa can’t turn the tables on us.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe only countermeasure at their disposal would be if X showed up to confront me directly instead of Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The worst-case scenario,” I said, “will be if X shows up instead of Karuizawa. Regardless, it’s going to be fun to see what Karuizawa does.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t imagine it’s worth the risk.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not true at all. Crushing Karuizawa means taking one of X’s most valuable pawns off the board. It seems they’ve been using her in various ingenious ways.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How do you know that? I mean, I understand that X threatened Manabe and her friends to protect Karuizawa, but…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven I had only recently realized that Karuizawa was one of X’s pawn. I had arrived at that conclusion precisely because of several incomprehensible things that happened during the Paper Shuffle. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh. Well, eyes forward, Ibuki. X aside, you’ll definitely get to see Karuizawa terrified by the threat of me exposing how she was bullied in the past,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If Karuizawa \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edoes \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eshow…what are you going to do if you can’t extract X’s identity from her?” asked Ishizaki. Both he and Ibuki seemed concerned.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“According to Manabe and her friends, Karuizawa was bullied quite viciously in the past. People who’ve been through such traumatic experiences tend to lose control of themselves when placed in a similar scenario. Why don’t we go ahead and reproduce those memories for her? Let’s put on a show. We’ll reenact her past until she tells us X’s identity.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No way. This is insane!” said Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is extreme, Ryuuen-san. A bunch of us ganging up on and bullying a girl? I mean, there are cameras on the rooftop!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m fully aware of that. I have a plan.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI began ascending the stairs to the roof. Halfway up, I stopped and looked back at Ibuki and Ishizaki, who were lagging a couple steps behind.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you don’t like it, run,” I told them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I won’t run. I’ll follow you, Ryuuen-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What about you, Ibuki?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It all depends on your plan. If I think it’s dangerous, I’ll leave.” She’d been curious about X’s identity for some time now, too. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had Ibuki, Albert, and Ishizaki wait near the rooftop door, taking the bag from Ishizaki. I removed the necessary tools, then handed the bag back.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI opened the door. It was rare for a school rooftop to be accessible year-round. The reason this one did was because it had both proper fencing and a surveillance camera. Any dangerous activities would be recorded. Students knew this, which was why they behaved themselves up here. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, the roof was also a secluded spot. With its cafes and mall, the campus had many much more popular hangouts. I was probably the only one eccentric enough to often come all the way up here.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was also a limit to the number of cameras the school could install. There was only one surveillance camera on this particular roof, positioned above the door, which was the only real place a camera could be installed here. The one camera was more than enough to capture nearly the entire rooftop in its field of view, leaving almost no blind spots. The flipside of this, of course, was that if that one camera stopped functioning, the rooftop would be unmonitored.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was the same kind of camera as the ones in the school building: vandalism-proof, with a strong polycarbonate lens and tough steel body that would be tough to break. But violence wasn’t the only way to disable a camera.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI stood directly underneath it and looked into the lens. I took the can of black spray paint I’d brought with me, pointed it at the lens, and sprayed. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There. Safe from prying eyes,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d done my research. Of the hundreds of cameras installed throughout the school, only a limited number displayed footage in real time, and this wasn’t one of them. The school authorities wouldn’t notice what was happening up here in time to stop it. I’d painted a different surveillance camera before, to test my theory, and my only punishment when I reported what I’d done to Sakagami was paying to have it cleaned.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe school was bound to be on low alert today, when most of the students had left. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Albert, remain on standby down the stairs. When Karuizawa comes, let her pass. If anyone unexpected pays us a visit, like one of the teachers, call me right away.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlbert nodded and went back downstairs. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You painted over the camera?” asked Ibuki. “Isn’t that a punishable offense?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just a simple prank. Nothing to get worked up over.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’d better hope Karuizawa shows up.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She’ll come. This is a matter of life and death for her.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAll that remained was to wait.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e5.2\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT WAS ALMOST TWO\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e in the afternoon, just shy of the time I’d set for Karuizawa, when the rooftop door opened to admit a lone student. The leading lady of today’s show appeared, stiffening in the cold air. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh. I knew you’d come, Karuizawa.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI turned off my phone and slipped it into my pocket. Ibuki and Ishizaki faced Karuizawa, both looking a little nervous.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The message you sent,” said Karuizawa. “What’s it supposed to mean?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s really no need to ask me that. You’re here precisely because you understand what it meant.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy message had read, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eManabe and her friends told me everything about your past. Come to the rooftop after class, alone. If you talk to anyone, word of your past will spread through the entire school.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust mentioning Manabe and her friends was enough to guarantee Karuizawa would understand what the message meant. She had no choice \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ebut\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to understand it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m guessing you told no one, as I instructed? Well, it’s not like you had a choice. You can hardly let just \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eanyone\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e know about your past, after all.” Karuizawa might’ve panicked and alerted X, considering that X alone probably knew her secret, but I didn’t really care. As I told Ibuki and the others, I’d sent X a message myself. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eToday, I’d pass judgment on Karuizawa. And then, I’d hound her for X’s identity. Whether or not she’d asked for help, it didn’t matter. The end result would be the\u0026#160;same.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You came alone after all, huh?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You told me to, didn’t you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh. Suppose so.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t like X, who’d done so much to hide their identity in the first place, was going to carelessly show up here. And Karuizawa couldn’t ask for help from anyone other than X, because if she did, then her past would be exposed. The same applied to X, who wanted to keep their identity hidden. In other words, both of their options were severely limited.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Look. I really don’t, like, have a single clue what you’re talking about, but it’s cold out. I wanna finish this quick.” Karuizawa rubbed her arms, as if she had a chance of pretending she didn’t know what was going on. She was a poor actress.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, why come here? You should’ve just ignored me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s…because I didn’t want any lies spreading around.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was trying her hardest to appear calm, but I easily called her bluff. “Lies, huh? Everyone here knows the truth… that you were bullied before you started high school.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah…” When confronted with that, her behavior changed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It was a stroke of luck that Manabe and her friends found out. If you want to blame anyone, blame yourself for not handling them better.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you want? What do you gain by threatening me?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What would you do if I told you I’m just killing time?” Though I still had plenty of leverage, Karuizawa was already out of options.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you do anything to me…I-I’ll tell the school,” she stammered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You came here alone because you know you can’t do\u0026#160;that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aren’t you getting carried away, Ryuuen? She might still have something up her sleeve,” Ibuki said. She still seemed to suspect something was up, since Karuizawa had come to the rooftop alone. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Karuizawa’s powerless to do anything but rely on X. No need to be so cautious. Even if she records this conversation, it’s not like she can do anything with it. Having her past exposed is her greatest fear. As long as we hold that card, she’s at our mercy.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But—” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Enough. Shut up.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI already knew what Ibuki wanted to say. She was going to say that Manabe and her friends had been threatened with evidence of them bullying Karuizawa. They’d been forced to lay off her, made to promise they wouldn’t speak a word of it to anyone, and then strongarmed into digging their own graves by giving away information about Class C. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki was anxious that evidence of what we were doing up here might be used to blackmail us the same way, but that wasn’t going to happen. I would make sure of it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa’s past was our weapon. As long as I made good use of that weapon, we had nothing to fear. Anyone trying to drive us into a corner would be doing the same to Karuizawa. And the danger there went both ways, of course. It was a double-edged sword. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had to use the information at my disposal to cause enough disruption to be effective, but if I went ahead and entirely exposed Karuizawa’s past to the school, I’d have nothing left to threaten her with. I’d crush Karuizawa, but X would get away. I had to find the person hiding behind Karuizawa. I had to learn X’s true identity here and now, and to do that, I needed to gauge the strength of the connection between Karuizawa and X.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s stop going in circles. You want me to let you off, right? Tell me the identity of the person hiding behind you. If you do, I’ll keep quiet about your past,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t, like, get what you mean.” Karuizawa looked upset. She’d known that I was looking for the Class D mastermind, but until now, probably hadn’t realized that we’d figured out her connection to them. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“X saved you from Manabe and her friends, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-huh? You’re wrong.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s pointless to hide. I’ve got evidence.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Evidence?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed X had kept more details from Karuizawa than I’d thought. I would slowly and methodically exert more pressure on her until her back was up against the wall.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How do you think X protected you from them?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have no idea. Besides, they weren’t bullying me. Even if you say this stuff about X, or whatever—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, okay. I get it. If you’re not going to fess up, I’ll just tell you.” Looked like she wasn’t going to spill the beans unless she had the facts laid out for her. “X threatened to expose Manabe and her friends for bullying you if they didn’t do as they said. That’s how they got them to keep their mouths shut.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa didn’t answer. All she did was glare at me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh heh. I see… So, you did know how X kept Manabe and her friends quiet, then.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I didn’t say anything.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, you didn’t. But your eyes told me the truth quite well on their own.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI continued speaking.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If that was all X did, I wouldn’t care. But that wasn’t enough for them. You see, X forced Manabe and her friends to betray me during the sports festival, too. They made them be their spies and leak information to them by threatening to expose the fact that they’d been bullying you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you talking about? Seriously, I have no\u0026#160;clue—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your eyes are shifty, aren’t they? Seems like this is the first time you heard about the sports festival.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eThere’s no way, \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI thought. Perhaps Karuizawa actually didn’t know who X was? If X always contacted her with an anonymous email address, then… \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo. I didn’t think Karuizawa would follow orders from someone she couldn’t see and didn’t know. If she really had no idea who they were, why not just admit she’d worked with them to an extent but knew nothing more? If she was denying that she knew \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eanything, \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ethere had to be a reason for it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All I want is X’s name. The name of the person who’s been attacking me. I honestly couldn’t care less about your past. Wouldn’t it be wisest to comply?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No matter how many times you ask, my answer’s the same. I don’t know anything. Seriously, it’s cold out here…” She was wearing extremely thin clothing. Perhaps she hadn’t intended on being out here very long.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, it sure \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eis \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ecold, isn’t it? Don’t you want to finish our little chat quickly and head back inside?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have nothing to say.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. If you insist on covering for X, then I have no choice. You’re okay with me exposing your entire past?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa was truly up a creek without a paddle. No matter what I did to attack her, she’d have no choice to keep her mouth shut. Whatever she chose, she’d be making an enemy. She could think about it all she wanted, but all that would do was waste time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no point fighting me,” I said. “You can’t brainstorm your way out of this situation. You know your options are limited. If you want to save yourself, you know the correct choice is to tell me their name.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-If there really \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eis\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e someone hiding in the shadows like that, you have no way of knowing whether the name I give you is actually the person you’re looking for, right?” asked Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki, perhaps because he was also hung up on that point, cut into our conversation without permission. “Ryuuen-san, she’s right. We have no way to know if she’s telling us the truth.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe idiot was just giving Karuizawa an escape route. I shot Ishizaki a look to tell him to be quiet. Realizing his mistake, he shut his mouth.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I find out you lied to me, I’ll expose you later,” I told Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The only way you can save yourself is to tell me everything you know.” I laughed at her, but Karuizawa just looked at me sideways and countered my words.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not that stupid,” she shot back. “It doesn’t matter if I tell you the truth now, or lie. Either way, you’ll just try to use this against me again down the line. Sorry, I’m not going to be a pawn you can use whenever you want.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh. Yes, I suppose you’re right. There’s no guarantee I won’t keep using this against you, like X used Manabe and her friends. Even so, what choice do you have?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can neither confirm nor deny that there’s someone hiding behind me. I’m not going to just blurt out a name to you, either. In other words, I have no answer for you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, Karuizawa had determined that silence was the only correct answer. It wasn’t a bad option, but I could hardly say it was the best one. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And if I expose you as a result?” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You think that someone’s controlling Class D from the shadows, but you wouldn’t have contacted me unless you’d failed to discover their identity so far. In which case, I’m the only lead you have, and you can’t afford to throw me away.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. So, if I expose your past before I get anything out of you, I’m screwed, eh? You won’t tell me anything, and my hunt for X’s identity will be delayed even further,” I reasoned.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa averted her eyes, as if to say, “Yes, that’s exactly what I meant.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Honestly, I don’t really care if I don’t learn X’s identity from your lips. I’m happy to take my time figuring out who they are. You think that I won’t have plenty of opportunities to catch X in the future?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s assuming X comes at you again. If they notice that you’re trying to figure out their identity, won’t they be extra careful from now on?” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was smarter than I thought. A clever, sharp-tongued woman. If X’s mind really worked the same way mine did, they’d probably chosen her because they felt her social clout within Class D made her a valuable tool. X had no qualms about using people, which meant they probably had no qualms about abandoning her, either.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no doubt X was moving to advance Class D’s prospects. What I couldn’t rule out, however, was the possibility that if forced to choose, X would prioritize keeping their identity hidden over advancing Class D. If I went ahead and exposed Karuizawa, I might never find out who they were. That would really spoil my fun, huh? \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You really came up with some good self-defense measures, huh? All on your own, too?” I asked Karuizawa. I\u0026#160;was guessing she’d racked her brains to get here. It was possible X had fed her some ideas… but the chances of that seemed slim.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Get the picture? Don’t you think the best option would be to just quietly let me go?” she shot back in return.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI checked my phone. No texts from anyone. Had my attempt to contact X gone south?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, it wasn’t like I hadn’t known it wouldn’t be easy to pin X down. I decided it was time to take things to the next level.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Look, all you need to do is tell me who X is,” I told Karuizawa. “If you know, I’m going to extract it from you one way or another.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eThis is your fault, X. This is the result of you trying to have your cake and eat it too; both saving Karuizawa and hiding your identity. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If your threats don’t work, how do you intend to make me talk?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s obvious, isn’t it? Torture is a time-honored tradition.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ryuuen-san, are you serious?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ibuki, hold Karuizawa down.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why me? You can do it yourself, can’t you?” Ibuki didn’t seem very willing to join in.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do it,” I commanded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I won’t be complicit in this. It’s too risky,” said Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Pathetic. You’re wimping out after failing me so many times in a row?” I grabbed the rebellious Ibuki’s arm and pulled her close. “This is how you earn back my trust. I’ll take responsibility for what happens here. Don’t hold back.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tch…” Ibuki clicked her tongue, but approached Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what?” Karuizawa squeaked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Look, I’ve got problems of my own. Sorry,” said Ibuki. She moved behind Karuizawa and grabbed her hands.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ow!” shrieked Karuizawa. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite Ibuki’s initial reluctance, she held Karuizawa easily in place. There was nothing Karuizawa could do against someone with martial arts training.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ishizaki, go fill some buckets with water. Let’s start with two. There are two cleaning buckets in the men’s bathroom one floor below. No one should be using it right now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Water? What for?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you going to defy me, too?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“N-no. I’ll get them!” Ishizaki panicked and ran past Ibuki, looking as if he was about to trip over his own feet.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now, let’s enjoy a nice little chat until Ishizaki returns,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No! Let me go!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa thrashed desperately, but couldn’t break free of Ibuki’s grip. She probably guessed what was going to happen, which was precisely why I was having Ibuki restrain her in the first place—not to prevent her from escaping, but to amplify her fear of what was to come.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you lay one finger on me, I’ll tell everyone!” Karuizawa shouted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg height=\"100%\" style=\" top: 0px; vertical-align: top; height: 100%;\" alt=\"\" id=\"ClassroomElite-Vol7_INTERIORIMAGES_10\" src=\"/hola-lector-agua/images/books/v7/OEBPS/Images/ClassroomElite-Vol7_INTERIORIMAGES_10.jpg\" loading=\"lazy\" decoding=\"async\"/\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh heh. It was pretty cocky of you to show up here. Did you think X would protect you this time, too?” I\u0026#160;asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo matter how many times I asked her, the answer was the same. She stubbornly refused to admit whether this X person really existed. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m gonna go out on a limb and guess X, Class D’s hidden puppet master, promised to protect you from things like this. Right?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa’s eyes darted around. She might have thought she was hiding her thoughts, but they were plain for all to see.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If not, this doesn’t add up. If your past became known, your headstrong, bossy attitude would work to turn people against you, even girls from other classes. Manabe and her friends wouldn’t be the only ones targeting you,” I\u0026#160;said. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki took her eyes off Karuizawa and looked over at\u0026#160;me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You must spend every day racked with fear that they’ll all learn the truth. But you managed to get this far without your secret getting out. Why? There’s only one possible explanation. It’s because of the person who saved you and supported you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And you think that person’s X?” asked Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For now. But that’s only been the case recently, right?” I asked Karuizawa. “X only learned the truth about your past after your spat with Manabe and her friends. You made Hirata pretend to be your boyfriend to protect yourself, didn’t you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa’s pupils dilated. “Y-you’re wrong…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But I’m not, am I? Don’t lie to me, Karuizawa.” I peered deep into her eyes, as if I could see all the way to the darkness buried within. X must’ve done the same.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah…?!” She was really panicking now. It was cute.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How could you know that, Ryuuen?” Ibuki sounded shocked, too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Chalk it up to experience. I’ve dealt with tons of rotten people in my life,” I told them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh…oof. S-sorry to have kept you waiting.” Ishizaki returned, carrying two buckets almost completely full of water. Their contents splashed violently. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki barraged me with questions again on seeing the buckets. “You said that there were two buckets. How did you know? Did you investigate this all beforehand”? \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you know how many surveillance cameras this school has? I bet you don’t even know that much.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Of course not.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You won’t know if you don’t investigate. But if you do your research, you’ll begin to comprehend everything that you see around us,” I told them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEvery day, little by little, I’d scoped out all the locations where surveillance cameras were installed throughout the school. As a result, I’d also learned about the buckets stored in that particular bathroom for cleaning purposes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“One of the experiments I used to ascertain all this was the time I had Ishizaki and the other guys attack Sudou,” I said. “Because they’re idiots, it seems there was a witness from Class D there at the time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs a result of the witness’s presence, Ishizaki and the others had been tricked into confessing by a fake surveillance camera. Ishizaki wore a look of shame on his face as I mentioned the incident. If not for the witness, C Class could have gained quite a bit that time. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I told you before, Ishizaki, didn’t I? Never admit any wrongdoing.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-Yes… I was j-just, well, that just shook me a bit…” he stammered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The school might appear to strictly enforce a code of behavior, but that’s not entirely true. There are loopholes that allow the use of forceful methods, if you play your cards right,” I continued. There were clues scattered all through our normal, everyday lives to hint at that. “I’m sure you guys don’t get it, but the cleverest members of the student body are the ones constantly testing the boundaries of what the school allows.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe very first thing I’d done after enrolling at this mysterious school was look for its “rules,” and how to beat them. The second thing I’d done was something vital to understanding the system: test the importance of private points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For instance,” I said, “have you ever noticed one particular thing that’s strange about all these tests? The uninhabited island test, the cruise ship test, the Paper Shuffle—whatever the test, you’d think the senior students would be able to give us some advice, wouldn’t you? But if you try and ask them, not a single one will give you a satisfactory answer. Why do you think that is?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Maybe the exams are conducted differently each year? Like, it’s possible the rules are different.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. I don’t think the exams are exactly\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ethe same each year. Strictly speaking, though, it’s probably more accurate to say the rules \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003efor every grade level \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eare different.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean, Ryuuen-san?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf you could clear exams by with from senior students, then they’d hardly be exams at all. Everything would just turn into stupid competitions to see who could butter up the seniors more. There had to be rules put in place to prevent that from happening.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What if there was a supplementary rule that stated ‘any second- or third-year students will be expelled immediately if they leak exam contents’?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s… They would never talk.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. Even if a freshman asked them, they wouldn’t say a word. No way would people who fought to avoid expulsion for a whole year risk getting expelled over making a careless comment. In fact, I tried and utterly failed to negotiate in second-year Class-D students by offering them private points. Proof that talking carries considerable risk.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But… Well, I suppose you might be right. Komiya and Kondou said something like that a while ago, too. They said they tried to ask some upperclassmen for hints and got nothing. If anything, it kind of felt like they weren’t even allowed to ask.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhich was precisely what gave rise to the feeling that it had been forbidden for generations. It was very likely the actual rules were more detailed, but we’d learn them\u0026#160;eventually.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve always tried to push the boundaries between what’s acceptable and what’s considered a violation of school rules,” I explained. Researching the surveillance cameras, bribing the senior students, and making the back-alley deal with Class A were all part of my experiments to ascertain what I could and couldn’t do. “What we’re about to do to Karuizawa is one such experiment, too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa started to shiver in the cold. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Trauma can be awakened more strongly through the senses than through words,” I added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBased to what Manabe and her friends had told me, the fierce Karuizawa would quickly buckle when subjected to this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI signaled Ishizaki with one glance. Ibuki pushed Karuizawa forward and then stepped away. In accordance with my orders, Ishizaki dumped a bucket of water on Karuizawa’s head.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBeing doused outdoors, in the middle of winter, would chill anyone to the bone. Karuizawa collapsed, shivering, and hugged herself tight. Her bravado was gone, washed away by just one bucket of water.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you remember the baptism you received at your previous school?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“N-no!” She covered her ears and sat there, her whole body trembling, as if she were a little girl afraid of ghosts.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, we’re just getting started.” I took out my phone and began recording. I pushed Karuizawa’s wet bangs from her eyes, watching her spirit begin to break. She was probably flashing back to being bullied right now. “If you won’t talk, then I’ll circulate this video throughout the school.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was a lie, but Karuizawa was no longer in any state to tell. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, scream. Beg me to have mercy.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“N-no!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe deeper the scars, the more they hurt when you uncovered them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t watch this. I knew I shouldn’t have helped you,” said Ibuki, averting her eyes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Bullying the weak is pretty fun though, right? It really gets you going.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI thought back to a particular occasion when some people had attacked me, long ago. There was one guy who started out all cocky, but then wound up bawling like a baby when I turned the tables on him. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa’s case was a little different.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even though you were so persistently bullied, you stood tall in D Class. I’m impressed,” I told her. “That’s not easily achieved. In a way, you might be a girl with the spirit to stand up to me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite being so weak, she’d held her head high. She’d created a new identity for herself, then maintained that position by using Hirata and through X’s protection. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut bullying makes people servile. Once experienced, the trauma is easily reawakened. That’s just the way it is.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI crouched beside Karuizawa’s trembling form and continued to mock her. “Here’s the thing about human nature. People don’t change. You were designed to be bullied, not to bully. Remember that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI picked up the other bucket and dumped the water over Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…!” Letting out a silent scream, she curled into a ball, shrinking in fear.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ishizaki. Get more.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yes.” Ishizaki picked up the two empty buckets and headed downstairs.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who’s protecting you and keeping Manabe and her friends quiet?” I demanded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s…no one… No one, no one, no one!” Karuizawa screamed. She shook her head fervently.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh. Still trying to hide it? I guess you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edo\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e have spirit. Or maybe it’s just that you’re so used to being bullied? Maybe this doesn’t even qualify as bullying for you.” I grabbed Karuizawa’s arm and yanked her to her feet.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t watch this,” Ibuki said again.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is where the fun begins,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re evil. This is disgusting.” But Ibuki didn’t leave. She leaned up against the door instead. “I’ll leave after you get a name out of her,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fine by me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wasn’t doing this to entertain Ibuki. I was breaking Karuizawa for my own pleasure.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e5.3\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eWAS FREEZING.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Icy water dripped from my hair. They’d dumped water over me four times now. My uniform was soaked right through; even my underwear was wet. But what scared me wasn’t the way my body violently trembling from the cold. What scared me was the ice in my heart.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was facing down a deep darkness, so intense and bitter that it made me hate the entire world. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWhy am I being bullied?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Slowly, my feelings changed to, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWhy am I alive? What did I do wrong? \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI started blaming myself. My heart was frozen and my body was being devoured. The deep scars etched into my being started to throb again, like they were hot. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on. That’s enough, Karuizawa. Make things easier on yourself. There’s no need to suffer any further,” Ryuuen sneered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was a dead end, though. If I told him about Kiyotaka, it might reprieve me temporarily, but there was no guarantee that Ryuuen wouldn’t try to blackmail me again. He might even command me to betray Class D. Like the tragic finales you saw on television, misery was all that awaited people who continued to betray others. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI would hold on to hope until the very end. I’d believe in Kiyotaka’s words, and his promise that he’d protect me. That was my final defense against my heart being swallowed up by the darkness.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know what you’re thinking. If you give up X, you’ll lose their protection. All hope will be lost,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy teeth loudly chattered from the cold, making my terror audible to all. I struggled desperately to stop, but my mind had already abandoned me. Repulsive memories thrashed around in my brain. The past and present overlapped.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg height=\"100%\" style=\" top: 0px; vertical-align: top; height: 100%;\" alt=\"\" id=\"ClassroomElite-Vol7_INTERIORIMAGES_11\" src=\"/hola-lector-agua/images/books/v7/OEBPS/Images/ClassroomElite-Vol7_INTERIORIMAGES_11.jpg\" loading=\"lazy\" decoding=\"async\"/\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you want to die holding onto hope? Are you okay with going back to the way things were?” Ryuuen’s vicious words cut me. “X can’t save you. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ecan, if you give me their name.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was scared.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you won’t cooperate, though, I have no choice but to destroy you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSave me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m going to list everything there is to know about you, everything you pretend to be, and circulate it to the whole school.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI’m scared.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When that happens, will you be able to keep your position in your class? Will you still be a leader?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSave me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. You’ll just go back to being what you were before. You’ll be back to the real you, that pathetic girl who was always bullied.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe cruel memories of the bullying I’d endured long ago continued to play in my head on loop. I never wanted to return to that dark, miserable world where all I could think about was how much I wanted to die.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, no, no no no! No no no no!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then make things easier. Protect yourself.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please, forgive me! Please, forgive me!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy pride had already shattered. No, that wasn’t true. It’d shattered before, and I’d clumsily pieced it back together with tape. The Karuizawa Kei who made a new life for herself was dying. I could feel my second chance at a happy school life crumbling into dust.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not merciful like Manabe and her friends,” said Ryuuen. “We know your secret. Even if you get me expelled, it’s not just me who knows. I’ll spread rumors of your past. Your own classmates will smell blood in the water and turn on you!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, no, no…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then remember. Remember how painful it’ll be to go back to how you used to be.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though I hated it, I remembered. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor a moment, my mind went completely blank. All I saw was endless white. And then immediately after, there was darkness. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite myself, I remembered. I remembered junior high and the hell I’d created for myself over the most trivial of things. I was stubborn, headstrong, and right after starting school, I made enemies of the other girls for no reason. What followed was a completely nightmare.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=
