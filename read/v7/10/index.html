[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:Te3b7,"])</script><script>self.__next_f.push([1,"\r\n\u003cp id=\"auto_bookmark_toc_top\" class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 4:\u003cbr/\u003eInsanity\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eO\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eNE DAY,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e shortly before winter vacation, a storm hit Class D. It happened just after the end of homeroom. Our classroom door swung open, and Ryuuen and his fellow Class C students strode inside. The entire class immediately erupted into chaos.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei glanced at Ryuuen and the others, but left without a word. It would’ve been one thing if a brawl broke out right then and there, but there was no issue with students from another class coming to visit. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen and his classmates had observed Class D from a distance so far. Since they hadn’t gotten the answers they’d been looking for, they’d finally decided to take a direct approach. Or perhaps they were acting on a strategy I couldn’t yet understand. In any case, they’d clearly decided to confront us. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita, who was packing up her things to leave, stopped and stared at the Class C group consisting of Ryuuen, Ishizaki, and Yamada Albert. Komiya and Kondou were there, too. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith all these opponents gathered together in force, the mood was tense.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, what’s goin’ on? This is Class D.” Sudou was the first to react. He was usually quick to pick a fight, but seemed more defensive this time. More importantly, he probably felt he needed to protect Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe stood and approached Ryuuen; Hirata panicked and hurried to stand between them, probably afraid that they were about to get violent. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you have some business with our class, Ryuuen-kun?” Hirata asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn response, Ryuuen exaggeratedly raised his hands. “Is there any reason I can’t visit my classmates? That \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edoes\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e happen at this school, doesn’t it? Visiting a pal. Why’re you all shaking?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe statement sounded like a provocation, but Hirata remained cool and composed. “That’s normally true, yes. But this school isn’t normal, is it? Besides, you’ve never visited Class D before.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’ve been too estranged. I thought we should be a little more assertive about buddying up,” said Ryuuen. He placed his hand on a nearby girl’s desk, showing off his white teeth in a grin. “Man, you guys sure did great in the Paper Shuffle. Class C lost because of your brilliance. Well, the results still aren’t out, but word is you guys might be Class C next semester. That’s huge.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh. Guess the only thing big about you is your head, you incompetent monkey. Time for \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eto get a taste of being Class D,” said Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata grabbed Sudou by the shoulder to reign him in, clearly panicked. “It’s because we’ve been working hard.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Working hard, huh?” said Ryuuen. “I mean, the concept of hard work seems completely foreign to Sudou, yet he’s still here. I thought he’d be the first to get kicked out.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edo\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e remember my name,” said Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen and Sudou stared each other down. The air between them was electric. Several classmates who’d been heading out stood frozen in place. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Could you tell us why you’re really here?” asked Hirata. Perhaps he wanted to bring the situation under control as soon as possible, and was therefore trying to keep Ryuuen from dragging it out. Or perhaps he was just being as straightforward as always.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m giving you a fair warning, Class D,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Warning? What do you mean?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have no intention of explaining things to an idiot. Or are you just pretending not to understand?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt might’ve seemed as if he was trying to provoke Hirata, but in fact, Ryuuen barely even looked at him. He was busy scanning the entire classroom. He might have aimed his statement at me, or Keisei, or even Akito. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUltimately, his gaze landed on a rather unexpected person. The individual in question didn’t even realize Ryuuen was staring at him—or perhaps he just didn’t care. In fact, he was heading back to the dorms.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji got up and nonchalantly left the classroom, apparently unaffected by Ryuuen’s presence. Ryuuen gave a quiet chuckle and signaled his comrades to follow him. They left immediately, and as the door closed behind them, the tension in our classroom dissipated at once and was replaced by an uproar. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, hey, that Ryuuen dude looked like he was gonna do something crazy! This is unreal!” Ike exclaimed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They’re plannin’ to do something to Kouenji,” said Yamauchi. “Right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIndeed. Kouenji Rokusuke, Class D’s resident enfant terrible. Conspiracy theories flew every which way, starting with Ike and Yamauchi. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnusually, Kushida stayed out of it. She’d stopped getting as actively involved with class issues, perhaps due to her defeat at Horikita’s hand. Even now, though she was murmuring to some other girls about Ryuuen and his crew, she wasn’t actively contributing to the conversation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is really bad, isn’t it?” asked Horikita, while I was deep in thought. Even she, who wanted to avoid entanglement with Class C as far as possible, couldn’t leave this situation alone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt did seem as though Ryuuen had some business with Kouenji, but that puzzled me. me think. Kouenji was weird, sure, but even to an outside observer, the possibility of him being a big mover and shaker in Class D had to be low. There had to be a reason why Ryuuen was trying to make contact with him in such a blatant way, while simultaneously scoping out a number of other people.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Should we go check it out, Kiyotaka?” asked Akito.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So many people are around, though. There’s not much Class C can try.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They may have something planned.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose… I guess even though lots of people are watching, that’s no guarantee Ryuuen won’t try something.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was odd. Even from an outside perspective, the probability that Kouenji was Class D’s secret savior was low. In the unlikely event that Class C assaulted Kouenji, other members of Class D might get in trouble for jumping into the fray. Then again, if we held back when we could’ve helped, we’d regret it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I went into the hallway with Akito, Keisei trailed me. “I’ll come, too. Safety in numbers,” he reasoned.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita lagged slightly behind us, and Sudou followed her. Hirata also came along, looking worried. This was shaping up to be a real storm. I asked Keisei and Akito to wait, then went to talk to Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wouldn’t it be better if you stayed behind, Hirata? If you come, other students might follow. If people like Ike and Yamauchi join in, it’ll add fuel to the fire,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s true…but will Kouenji-kun be all right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita’s coming. Keisei and Akito are too. In the worst-case scenario, if it looks like things are getting violent, I’ll call you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Keisei? Huh. Okay. Just don’t do anything rash, sound good?” Hirata looked puzzled at the way I referred to Yukimura, but went back inside the classroom.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That was the right decision, Kiyotaka.” Keisei nodded. “Besides, Hirata’s better suited to calming the rest of the class down.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe next problem was figuring out where Kouenji and the others went. Even Ryuuen and his goons couldn’t start trouble in the school building. If they were going to try something, it would probably be outside, but I had no idea where Kouenji might’ve gone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Where does Kouenji normally go after class?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No idea.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know, either.” Akito and Keisei tilted their heads to the side, apparently clueless. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Does anyone know anything about Kouenji?” Practically none of us ever spoke to him at length.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He usually heads straight back to the dorms.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How do you know?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see him fairly often. Let’s head to the entrance for now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf his shoes were still there, we could confirm that he was still in the school building. In that case, we probably still had enough time to deal with this. We hurried there, keeping pace with one another.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Could be a serious fight,” said Sudou to Horikita, clenching his fists.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t be funny. Violence between Classes D and C is nothing to laugh about. More importantly, why are you following me?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, ’cuz I’m worried about you, Suzune, you know? There are rumors that Ryuuen will even hit girls.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not so soft that I need your protection,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t say that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita was as bullish as ever, and Sudou’s chivalry was misguided. A girl could easily take down a boy if she had the requisite martial arts skill. However, Sudou was Sudou, and the idea that Horikita was strong enough to hold her own probably hadn’t occurred to him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides, though I may be worrying needlessly, what about your club?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not to worry. Still got a little time left until practice. Let’s hurry up and find Kouenji.” Sudou was going nowhere.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For crying out loud. I don’t want a troublemaker tailing me around,” she muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStill, if Horikita got hurt taking these Class C guys on by herself, Sudou would go nuclear. If the school caught him picking fights again, he was done for. Letting him come along might’ve been the best way for us to keep an eye on him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e4.1\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eL\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eEAVING THE SCHOOL BUILDING,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e we took the tree-lined path back to the dormitories. Since class had just ended, barely anyone was around, but we saw a bunch of Class C guys on the path ahead. Ibuki was with them, though she hadn’t accompanied Ryuuen when he visited our classroom. Some distance in front was Kouenji, walking alone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed Class C really planned to attack him. As Ryuuen drew closer, he ordered Ishizaki to block Kouenji’s path.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s just like Suzune predicted. Let’s stop ’em,” said Sudou, looking to Horikita for orders.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s wait and see what happens. We still don’t know what Ryuuen-kun’s after,” reasoned Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs Ryuuen himself said, it was well within the rules to simply talk to someone from another class. We approached slowly, observing the situation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Kouenji. Lemme pick your brain, eh?” Ryuuen called.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’re you doing? I don’t recall behaving in any way that’d warrant you flagging me down.” Because Ishizaki was in the way, I couldn’t see Kouenji’s face. But his tone of voice was arrogant as usual.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t get to decide that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmph. You certainly don’t, either,” replied Kouenji. He looked at Ryuuen and his goons without the slightest hint of anxiety. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You remember me, don’t you?” asked Ryuuen. Both hands still in his pockets, he walked up to Kouenji.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course. You’re Class C’s obnoxious dictator, aren’t you?” said Kouenji.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I missed you last time, but now you’re coming with me, freak,” spat Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My apologies. I’m afraid I must’ve been busy, whenever you missed me,” said Kouenji, smoothing his hair back. It didn’t seem like much of an apology. “However, you just said something I’m afraid I cannot overlook. When you said ‘freak,’ were you referring to me?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg height=\"100%\" style=\" top: 0px; vertical-align: top; height: 100%;\" alt=\"\" id=\"ClassroomElite-Vol7_INTERIORIMAGES_8\" src=\"/hola-lector-agua/images/books/v7/OEBPS/Images/ClassroomElite-Vol7_INTERIORIMAGES_8.jpg\" loading=\"lazy\" decoding=\"async\"/\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who else could I be referring to?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, even though I find your statement entirely baffling, I suppose I’ll just let it go. I’m quite a magnanimous fellow, you see. I have a date, so let’s wrap things up quickly, shall we?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, but you’re going to have to postpone your date.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’ve no intention of backing down?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’ll you do if we don’t leave?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji crossed his arms and appeared deep in thought for a moment.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I suppose we’ll discuss your business over there,” he said eventually, pointing to a rest area up ahead. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t care where we go,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then follow me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey trailed Kouenji to the rest area up the path, threatening to leave our sightline.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seems like we’d better go over there, too,” said Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita stopped him at once. “Don’t say or do anything reckless. Understand?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yeah.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou took the lead, with Horikita in hot pursuit. The rest of us followed slightly behind, and we headed over. “Ryuuen-kun,” Horikita called to Ryuuen. “What are you planning? If you try anything, we’re going to have trouble.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh. So, you took the bait, huh?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen looked over his shoulder as if he’d known someone would follow him from the very beginning. He scanned our entire group. Though Kouenji likely interested him, this was a trap designed to narrow down Class\u0026#160;C’s list of suspects. That was why Ryuuen deliberately marched his fighters into Class D. His aim had been to smoke us all out, and he had.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji, Miyake, and Yukimura, huh? Well, that’s acceptable.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m here too, Ryuuen,” said Sudou, smashing his fists together.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What happened to Hirata?” Ryuuen added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who knows? Haven’t got a clue. You aren’t interested in him anyway, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, spare me. That guy’s sense of justice is so strong, it wouldn’t be strange if he showed up here,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This isn’t going to go the way you think,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s fine. For now, anyway.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen lifted his chin in a signal. On his command, Ishizaki and the others surrounded Kouenji. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAkito, watching the situation unfold, couldn’t hide his disgust. “It’s like he thinks he’s a king. Bossing his classmates around just by moving his chin,” he spat.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, Miyake, but I was born this way,” replied Ryuuen. Hands still in his pockets, he drew closer to Kouenji.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Stop,” Horikita said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Stop? What should I stop? As you can plainly see, I’m not doing anything.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo one had laid a single finger on Kouenji yet.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t particularly mind playing around, but it seems that my presence here isn’t a necessity. Would you agree?” asked Kouenji.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen faced him once again, ignoring Horikita’s warning. “That reminds me. You’ve got the lead role today, Kouenji. You owe me a debt.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A debt? I haven’t the foggiest notion of what you mean.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The zodiac test. Thanks to you, I lost the chance to capitalize on more points,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah. If I impeded you, you have my apologies.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo Kouenji said, but he sure didn’t look the least bit apologetic. In a brazen gesture, he took his hand mirror from his breast pocket. The Class C goons eyed him suspiciously, and he responded in a courteous manner. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s quite windy today. I’m making sure my debonair hairdo isn’t mussed up.” Turning his face left and right, he checked his reflection. “Hmm. I’m looking tragically disheveled. Sorry, but would you mind holding this?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji presented Ryuuen with his hand mirror. Ryuuen took it, smiling.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You may aim the mirror toward me,” said Kouenji. Retrieving a small container of hair wax from his bag, he scooped a glob onto his finger and started styling his hair with both hands.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass C, taken aback, couldn’t do nothing to respond…until a shattering sound cut through the air. Ryuuen had thrown the mirror to the ground, cracking it. Still wearing that smile, he grabbed Kouenji’s arm.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder how long you can keep up this freakshow?” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji, still arranging his hair, sighed gently. “You really are quite the scoundrel. That mirror was rather expensive, you know.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry. My hand slipped,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tch. In that case, will you kindly release my arm so I may finish styling my hair? Of course, I’m the kind of man who’d look good even with disheveled hair,” said Kouenji.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe were on pins and needles as the tension grew. Ryuuen slowly let go of Kouenji’s arm. Doing this in public was risky behavior, but in keeping with his usual style of trying to push his enemies to their limits.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Knock it off, Ryuuen-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Quiet, Suzune. I’m playing with Kouenji.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aren’t you just attacking him? This seems one-sided. He doesn’t want this.” Carefully picking up fragments of the broken hand mirror, Horikita glared at Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll do it. You might hurt your hands,” said Sudou to Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t mind. It’d be more of a problem if the glass cut you, because you have your club.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t say stupid stuff like that. I can’t let a girl get hurt.” Sudou moved Horikita aside and began picking up the fragments.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not doctoring you if you get cut,” said Horikita. Sudou ignored that and kept picking up the pieces.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My, this is quite an interesting collection of people, isn’t it?” someone said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs if summoned to the rest area by some unseen cue, Sakayanagi and her coterie strolled up to us. I saw Kamuro Masumi among her followers, but knew nothing about the two other guys, though I remembered their\u0026#160;faces. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sakayanagi, huh? What suspiciously perfect timing.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi stopped and lightly tapped her cane on the concrete. This was turning into quite the crowd. Including Kouenji, six of us were gathered here from Class D, five from Class C, and now four from Class A, making a total of fifteen people.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m here purely by coincidence,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t make me laugh,” Ryuuen said. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To think I’d stumble on Class C’s major players having it out with some Class D students. Are you planning a Christmas party?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Back off. I don’t have any business with you,” snapped Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come now, there’s no need to say that. If you’re party-planning, the more the merrier. Wouldn’t you agree? May I join you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you plan on sticking around, don’t get in my way.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course. I wouldn’t dream of embarrassing the party organizer,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe took a seat on a nearby bench. The three other Class A students sat around her, as if shielding her with their bodies. There were no surveillance cameras in this rest area, after all, though we were surrounded by students walking back to the dorms. There was no telling how many people might walk by.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji Rokusuke, still wearing that bold, fearless smile, spoke once more. “I don’t mind that our audience has grown, but isn’t it about time that we end this? If we aren’t going to talk, I’ll be on my way.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, Kouenji. Ryuuen-san said not to let you run away this time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji wore a thin smile. “My apologies that our conversation was delayed. I think we should get to the heart of the matter. I surmise that you’re fixated on defeating whomever gets in Class C’s way, or whomever forms an alliance with another class to do exactly that. Am I wrong?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll crush every such insect in my way, yeah,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And now, such an obstreperous person has appeared within Class D. So, you’re searching for this hindrance,” said Kouenji. He seemed to understand the situation very well for someone who showed no interest in anything around him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Exactly.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, I’m afraid I don’t fit the profile. I have absolutely no interest whatsoever in Class D’s future, nor in any of the other classes. I’ve contributed nothing noteworthy to any exam thus far, and I have no intention of doing so. Tell me, are you truly fixated on making such a person your enemy?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, how would you explain the zodiac exam, then? Talk’s gotten around,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eho.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e You seem to be quite the knowledgeable fellow.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDuring the zodiac exam, Kouenji had rather brilliantly discovered the identity of the Monkey Group’s VIP. Even understanding that Class D won after seeing the results, however, it should’ve been difficult for Ryuuen to pinpoint any specific student as the one who figured that out. He really \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehad\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e done his homework. Or perhaps he guessed that Kouenji was assigned to the Monkey Group?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, that. I was simply saving time. I didn’t really feel like participating in those bothersome meetings, so I decided to end it and enjoy my freedom again. Nothing more,” said Kouenji. He got his phone and used the camera to appraise his face. It was sufficient as a makeshift hand mirror, apparently.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We can’t rule out the possibility that you helped with other tests,” said Ryuuen. “That means there’s no guarantee that you aren’t controlling Class D.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose that’s possible. But if it’s the conclusion you’ve settled on, it must mean you’re a moron with a paltry intellect,” said Kouenji.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki looked ready to charge, but Ryuuen smiled and stopped him. I had to admit that I admired Kouenji’s comeback. If Ryuuen \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewas\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e harassing the wrong person, he’d come off looking pretty stupid.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh. You’re certainly right. If you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eare \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003etelling the truth, then you’re completely and utterly harmless.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. You’re quite perceptive, Dragon Boy.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi started laughing at the nickname “Dragon Boy.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen changed the topic entirely. “What if I tell these guys to pummel you unconscious as payback for the zodiac exam? What’ll you do if I come at you with senseless violence?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita tried to reply to that disturbing question, but Kouenji cut her off with a laugh. “Now \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat’s\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e just nonsensical. You wouldn’t do that here, with this large of an audience. It wouldn’t benefit you at all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m quite capable of going on a rampage even in this rather inconvenient place, benefits aside,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. I suppose that if you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e choose that option, I’d defend by pride and knock down everyone who came at me,” said Kouenji.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You could do that by yourself?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I find it harder to imagine why I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecouldn’t\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi, still listening, merely grinned.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks like my reasoning was off,” said Ryuuen. “Kouenji doesn’t seem to be X. He \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eis \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ecompletely nuts, though in a different way from me. Seems that’s all there is to it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So glad to have cleared up this misunderstanding,” replied Kouenji.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But let me ask you one thing, Kouenji. Class D’s points are steadily increasing. Someone has to be responsible for that. If it’s not you, who is it? One of the people who followed us here like a flock of slack-jawed sheep?” asked Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor the first time, Kouenji glanced at us. Then he sneered and shrugged, having immediately lost interest. “I’m happy to tell you, but—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“May I have a moment?” Sakayanagi seemed as if she was trying to keep Kouenji from speaking. “This is a fascinating conversation. Someone in Class D is getting in Class C’s way, are they? I heard rumors that Dragon Boy-san was searching for such a person, but is that really\u0026#160;true?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I told you to shut up already, Sakayanagi. And if you call me that again, I’ll kill you. Got it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My, my, you don’t like it? I think it’s a \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewonderful\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e nickname. Sorry. Anyway, there’s something here that I don’t quite understand.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen laughed in response, but Sakayanagi paid him no mind. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Someone in Class D saw through your plans and defeated you,” she continued. “Is that all there is to it? This school is fundamentally designed to pit classes against each other. You and I have clashed numerous times in this manner. I don’t know who this Class D student is, but they’re employing excellent strategy by remaining anonymous while waging war on you. Are you really going to expend all this energy on interrogating an unrelated student? Honestly, I can’t see your actions as anything but rather pathetic.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll admit that X screwed up my plans,” replied Ryuuen, “but that’s not the problem here. I’m doing this to draw out the person acting behind the scenes. I’m going to drag him kicking and screaming to the forefront.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. So, you intend to resort to extortion and blackmail if you must?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yep. I’m prepared to use violence, too, if necessary. I rather enjoy my way of doing things.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you do that, not only will you appear pathetic, but you’ll also reveal your own incompetence. I heard quite a bit already from Masumi-san and Hashimoto-kun about the strategy you used on the island, and how your tricks failed. If you regard the situation objectively, it’s clear that Kouenji wasn’t involved, isn’t it? Besides, I heard that the mastermind was Horikita Suzune-san, the girl standing right over there. I wonder—does this person you’re searching for even exist in the first place?” Sakayanagi asked, excoriating Ryuuen with her sharp gaze and words.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you sure you’re not just trying to cover up your own failure, Ryuuen-kun?” muttered one Class A student.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s going too far, Kitou. Ryuuen isn’t \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003emuch of an idiot,” replied another. I think it was Hashimoto, or whatever his name was. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen showed no sign of agitation at Class A’s provocations. He understood that type of strategy better than anyone, after all. Rather than argue about what Sakayanagi said, he switched tracks. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eYou’re\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the idiot, Sakayanagi. I used Katsuragi. I made him sign a contract with me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A contract? Ah. ‘In exchange for assistance provided to Class A by Class C, private points will be paid as compensation,’ or something to that effect, yes? Specifically, there was a clause that said ‘twenty thousand private points will be paid per person per month until graduation,’ right?” Sakayanagi rattled off smoothly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? What?! Are you really okay with that?” cried Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not against the rules,” said Sakayanagi. “It’s a contract both classes mutually agreed upon. We’d receive the class points that Class C should’ve received, and compensate them with private points in exchange.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI knew that classes A and C formed an alliance during the island exam, but the exact nature of the deal had been unclear to me. Apparently, after using up all their points and leaving their 270 remaining points (minus the thirty deducted due to Sakayanagi’s absence) to Class A, Class C had requested twenty thousand private points in exchange. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt first glance, it might seem like Class C came out on the better end of the deal. However, what was most important was whether you could lead in \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eclass \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003epoints at the end of the exam. Class points determined the class rankings, after all. You might even say the private points were only awarded as a bonus. If Katsuragi hadn’t taken the deal, the island test could’ve gone much worse for Class A. They would have had barely any class points remaining now, and the gap between them and Class B would be much narrower. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, why bring this up now, after keeping it quiet all this time? It looked like Sakayanagi was trying to show up Ryuuen. He’d accused her of being stupid, and she’d made a fool of him in response by showing she’d known about the contract all along. Maybe?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’m not the one who’s gonna be in trouble if those details leak. You will,” said Ryuuen. “Other classes will find out we’ve been getting twenty thousand monthly points from you, won’t they?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you wanted to tell everyone, you would’ve done so already. Besides, it was Katsuragi-kun who suggested the contract in the first place,” Sakayanagi replied definitively. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe hadn’t been present on the island, and could avoid taking responsibility for the decision. It was even possible that she instructed her followers in Class A to let Katsuragi go ahead, but we couldn’t know. What mattered was that Katsuragi was keeping a low profile right now, while Sakayanagi appeared to be in control of the class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh. So, Class C’s basically got a guaranteed monthly allowance?” grumbled Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t let them fool you, Sudou-kun. Class C could’ve obtained those class points themselves, but they wasted them. They gained nothing,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that really true, Suzune?” asked Ryuuen. “It’s no different than getting two hundred class points the real way, back on the island. Besides, our private point income is going to continue indefinitely. We’ll keep earning those points until Class A loses their standing.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wrong. It seems similar, but it’s not. All you’re getting is private points. They have nothing to do with class points.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn that regard, Horikita was correct. However, eight hundred thousand private points flowing from Class A to Class C every month was significant. Even if Class C continued to lose class points from here on, they were guaranteed an allowance. Though Sakayanagi’s faction was coming for them, Katsuragi’s faction had given Class C a free ride.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are we finished here? I have no intention of denying you your fun, but I’d like for you to get out of my way. I’ve wasted enough time listening to your meaningless drivel,” said Kouenji.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, Kouenji. You haven’t answered yet.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji looked at the sky, as if trying to remember. “Something about a clever person in Class D, was it? To be honest, I hadn’t even considered it. At any rate, it’s probably better if I don’t tell you, right? You’re doing whatever it takes to hunt this person down, even if it means putting yourself at risk. I don’t wish to rob you of your fun. As for me, I don’t care for anyone in this school. I’m simply enjoying the halcyon days of my youth, romancing beautiful women and basking in my own\u0026#160;beauty.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re saying you won’t help your own class?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I haven’t, and I won’t. I said that all along. From my perspective, Class A and Class D are the same. All of you people are so dreadfully boring.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ryuuen-san, this jerk’s looked down on us for the last time! Let’s teach him a lesson!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki raised his fists, but the person who spoke up to stop him wasn’t Ryuuen. It was Sakayanagi, who had simply sat on the sidelines and smiled at us so far. Kouenji had said something she couldn’t overlook.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s something you said that interests me,” she began. “Dragon Boy-san aside—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoa!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen rushed Sakayanagi and launched a kick. Hashimoto hurried between them in a panic, blocking Ryuuen’s foot with his left arm. He went flying, landing hard on the concrete, but if he hadn’t intervened, Ryuuen probably would’ve kicked Sakayanagi in the face. A white-gloved Class A boy, Kitou, immediately took a fighting stance.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, did I hurt your feelings?” asked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I told you I’d kill you if you called me that again.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Stop this at once. What you just did is horrible,” Horikita started, but Sakayanagi stopped her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is there a problem with what just happened, Hashimoto-kun?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. I fell over.” Hashimoto slowly got back up, dusting himself off. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There you have it, Horikita-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tch. Both you and Ryuuen-kun are lunatics,” Horikita said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven in the face of a deliberate act of violence, the Class A students led by Sakayanagi showed no signs of discontent. If anything, they looked entirely ready to trade blows.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry, Ryuuen-kun. I’ve teased you too much,” said Sakayanagi. She focused back on Kouenji. “To return to my original question—what do you mean when you say that everyone here, myself included, is boring?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For crying out loud…” muttered Horikita. Her exasperation was understandable. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did I really hurt your feelings that much, little girl?” Kouenji pointed at Sakayanagi, approaching the bench where she sat.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tsk. Little girl, hmm? That’s a \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewonderful\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e nickname,” Sakayanagi replied. Ryuuen snorted in amusement, as if that was payback for Kouenji calling him Dragon Boy. “Kouenji-san, was it? Your English could use some work. I’m not a little girl.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not for you to decide. Calling you a little girl is appropriate, considering your age and physique,” replied Kouenji.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That is precisely where you’re mistaken. The appropriate usage of the words ‘little girl’ would be to describe girls of elementary school age. You cannot alter the rules of the world at will,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Being a slave to common practice isn’t my style,” said Kouenji. He brushed his fingers through his hair.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Knock it off, Kouenji,” said Kitou, stepping forward. He motioned as if to remove his white gloves, which I initially thought he wore to protect his hands from the cold. Apparently, that wasn’t it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The heck is \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewith\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e that guy? Will a demon appear if he takes those gloves off or something?” Sudou muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?” I asked, surprised.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t know? It’s from this old manga that used to be real popular. There’s this dude, and when he takes off his white glove, a demon shows up to fight devils,” said Sudou. I’d never heard of it in my life, but then again, I’d never read any manga.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have no business with Class A. Leave now,” commanded Kouenji.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Allow me to correct this boy’s behavior,” said Kitou to Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ha ha! Well, I don’t mind you fighting over me. Unfortunately, my tastes in both men and women run toward older people,” said Kouenji. He was toying with both Sakayanagi and Ryuuen, the representatives of their respective classes. Maybe lunacy was a kind of power after all, much like both violence and lies.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’ve concluded our business. Now get lost,” snapped Ryuuen. Dealing with something like Kouenji had to be exhausting, even for him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Very well, then. See you,” said Kouenji. He turned on his heel and walked away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe storm we’d feared would break might just have been Kouenji, not Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that source of controversy gone, everyone grew quiet. Sudou had collected most of the broken mirror’s shards, and it seemed that the tension had dissipated for\u0026#160;now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, show’s over,” said Sakayanagi. “Shall we head back?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Better be on your guard for the third semester, Sakayanagi,” warned Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course. If you’re so certain you’ve defeated Class D, I’ll be your opponent anytime,” Sakayanagi shot back as she left with her entourage in tow.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Should we head back too, Horikita?” I asked. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. I can’t stand being here a moment longer. Although…I must say, Ryuuen-kun seemed less interested in Kouenji-kun than I anticipated,” mused Horikita. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen’s actions clearly still puzzled her, and it seemed Class C shared some of the same doubts. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Should we really let him go that easily?” asked one of Ryuuen’s flunkies.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If he were the one, I wouldn’t have let him leave,” answered Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He seems super suspicious to me, though. He could’ve been lying.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“His way of thinking doesn’t match mine. Whoever X is, he and I think the same way. Besides, does he even look like the type to join forces with Horikita?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s hard to imagine, true. But then why’d you target Kouenji?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen stopped watching Kouenji’s retreating back and turned a creepy grin on us. “Yo. What do \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eguys think about Kouenji?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve been muttering a bunch of crap for a while now,” grumbled Sudou, clenching his fists. “I don’t get what you’re sayin’ at all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Idiots should stay out of this,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What—?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita stopped Sudou in his tracks with a look and a wave of her hand. “Your actions are bizarre and incomprehensible, Ryuuen-kun,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen seemed to take that as a compliment. “In that case, I must be doing something right. I narrowed down my suspect list quite a bit today, Suzune. Down to that weird creep lurking behind you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not listening to anything you have to say. This is a waste of time. In future, stop approaching my classmates,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m free to approach or not approach whomever I want. It’s not against the rules.” Ironic, considering how often he broke the rules. “Anyway, the show will be over soon. Can’t wait for the grand finale.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen glanced briefly at Sakayanagi’s retreating form in the distance, then left.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Finally. Let’s go. We should tell Hirata-kun about this,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s Ryuuen’s deal? You think he’s up to something?” Sudou groused.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who knows? I doubt anyone truly understands how his mind works.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eIt sounds like Ryuuen’s preparations are nearly complete,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I decided as I watched him and his goons walk off. It wasn’t a pleasant thought.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg height=\"100%\" style=\" top: 0px; vertical-align: top; height: 100%;\" alt=\"\" id=\"ClassroomElite-Vol7_INTERIORIMAGES_9\" src=\"/hola-lector-agua/images/books/v7/OEBPS/Images/ClassroomElite-Vol7_INTERIORIMAGES_9.jpg\" loading=\"lazy\" decoding=\"async\"/\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 4: Insanity\",\"volumeId\":\"v7\",\"chapterIndex\":10,\"prevChapter\":{\"volumeId\":\"v7\",\"chapter\":9,\"title\":\"Chapter 3: Reunions and Farewells\"},\"nextChapter\":{\"volumeId\":\"v7\",\"chapter\":11,\"title\":\"Chapter 5: Time to Settle Things\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Title Page\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Ryuuen Kakeru’s Soliloquy\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: The Sound of Footsteps in the Middle of Winter\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: Reunions and Farewells\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: Insanity\",\"href\":\"Text/section-0008.html#auto_bookmark_toc_top\",\"index\":10},{\"label\":\"Chapter 5: Time to Settle Things\",\"href\":\"Text/section-0009.html#auto_bookmark_toc_top\",\"index\":11},{\"label\":\"Chapter 6: Intersecting Thoughts\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_top\",\"index\":12},{\"label\":\"Chapter 7: What Ryuuen Wins and Loses\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_top\",\"index\":13},{\"label\":\"Epilogue: Postscript\",\"href\":\"Text/section-0012.html#auto_bookmark_toc_top\",\"index\":14}],\"volumeTitle\":\"Light Novel Volume 7\",\"detailsLink\":\"/select/year-1/v7\",\"returnLink\":\"/select\",\"currentSpineIndex\":10,\"nextVolumeLink\":\"/select/year-1/v7.5\",\"nextVolumeTitle\":\"Light Novel Volume 7.5\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://classroom-of-the-elite-reader.vercel.app\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"COTE Reader\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"en_US\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:image:width\",\"content\":\"1200\"}],[\"$\",\"meta\",\"9\",{\"property\":\"og:image:height\",\"content\":\"630\"}],[\"$\",\"meta\",\"10\",{\"property\":\"og:image:alt\",\"content\":\"Classroom of the Elite Reader Preview\"}],[\"$\",\"meta\",\"11\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"12\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\"$\",\"meta\",\"13\",{\"name\":\"twitter:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"14\",{\"name\":\"twitter:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"15\",{\"name\":\"twitter:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"link\",\"16\",{\"rel\":\"icon\",\"href\":\"/hola-lector-agua/icon.svg?icon.ae5abf30.svg\",\"sizes\":\"any\",\"type\":\"image/svg+xml\"}],[\"$\",\"$L14\",\"17\",{}]]\n"])</script></body></html>
