[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T1e475,"])</script><script>self.__next_f.push([1,"\r\n\u003cp id=\"auto_bookmark_toc_top\" class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 6:\u003cbr/\u003eIntersecting Thoughts\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eR\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eOUGHLY TWO HOURS\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e before Karuizawa left to see Ryuuen, Chabashira-sensei lectured us about important things to remember during the upcoming winter vacation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Parts of the school will undergo renovations, so those areas will be off-limits. Also, all clubs will take the day off after the closing ceremony. Be sure to head back as soon as you can.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor some reason, our teacher gazed soundlessly around the classroom after she was done speaking. We waited, but she showed no sign of dismissing us. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke, clearly itching to leave, raised his hand. “What’s the matter, Sensei?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure that many of you are already aware of this, but your promotion to Class C is almost guaranteed. Well done.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-wow. Sensei just praised us. This is rare.” Ike wasn’t the only one who felt that way. I was sure the rest of the class was equally amazed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, don’t get sloppy. If you get in trouble over the break, it might affect your class points. Don’t forget, even during the holidays, you represent this school.” With that, Chabashira-sensei dismissed us, bringing the second semester to a close.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This really is unusual,” said Ike. “Chabashira-sensei being nice and giving us a warning, I mean.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, you might be right,” I replied. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I put my textbooks in my bag, I glanced over at Karuizawa, who was talking with some other girls. She turned and looked back at me. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat morning, I’d received a text from Karuizawa at the email address I reserved for emergencies. The message said that Ryuuen had asked to meet her on the roof at two o’clock today, and that it had something to do with Manabe and her friends. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaving already gotten a message from Ryuuen about the meeting, I was unsurprised. Ryuuen didn’t care if Karuizawa tattled on him. His only goal was to lure me\u0026#160;in. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t reply to Karuizawa’s text. And yet, she left the room with her friends looking satisfied, perhaps because she felt confident that I’d gotten her message. Maybe she intended to leave the classroom and then come back. An hour later, though, almost all the students had left the school building.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, we were talking about going over to Keyaki Mall. What do you think? Want to come?” asked Keisei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure,” I said. “I don’t have anything planned. I’ll head over after I finish getting ready.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’ll wait in the hall.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMaybe I should take some textbooks back to the dorm with me, just in case? I might need them over break.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey. Are you busy today, by any chance?” Satou called, sounding rather sheepish.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. I just promised Yukimura and the others I’d go hang out with them,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I see. Bad luck, I guess,” said Satou, her shoulders slumping. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Today’s no good, but are you free over the winter break?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, I feel bad for turning you down twice now. If you’re okay with it, Satou, I just thought…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“R-really?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yeah.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSatou hugged me without warning, leaving me a little overwhelmed. “I-It’s a date!” she said, hopping up and down while blushing.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhy in the world was she so interested in me? I wasn’t complaining, exactly, but there were still people in the classroom. This was kind of embarrassing. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anytime tomorrow or after is good,” I said. “I’ll send you a message with more details.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Got it! See you later, Ayanokouji-kun!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBeaming, Satou rejoined Shinohara and her group, who eyed me suspiciously before leaving. I went over to Keisei and the others, who were gathered in the hallway, chatting among themselves. I could guess what they were discussing, based on Haruka’s creepy grin and Airi’s downhearted expression. Haruka seemed ready to start trouble as we began walking, so I beat her to the punch.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nothing’s going on,” I told them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I haven’t even asked you anything,” said Haruka. “What’s up?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nothing’s up. You were about to ask something, that’s\u0026#160;all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, yeah. Just looking at Satou-san, it’s not hard to imagine that \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003esomething’s\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e going on, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re such a playboy, Kiyotaka. First Horikita, now Satou?” said Keisei. For some reason, he sounded kind of angry. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI decided I’d better offer some clarification. “She just invited me to hang out with her, that’s all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A girl inviting a boy out is rare, though. There must be something to it, don’t you think?” asked Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-y-you don’t think that S-Satou-san is interested in Kiyotaka-kun, do you?!” asked Airi frantically. We’d already been through this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know how to answer that…” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A last-ditch effort to find romance just in time for Christmas? Oh, my,” added Haruka. “What an \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eamazing \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eturn of events!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At any rate, where are we going? The mall’s probably pretty crowded today. Since break starts tomorrow, there should be quite a few students hanging out until late tonight,” said Keisei, pressing us to make a decision.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, can’t we just kinda wander? We don’t have to rush,” replied Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs we talked, Akito walked along silently, his expression stern. He seemed to be concentrating on whatever was behind us, as if searching for someone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No sign of anyone tailing us,” he mumbled, sounding relieved.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed that Ryuuen planned on settling things once and for all today. He must’ve decided that following us was no longer necessary.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, you know, even though Keyaki Mall’s got pretty much everything, I think I wanna go off campus after all,” said Haruka, looking into the distance at the main entrance. “I really want to go to Shibuya or Harajuku, or see the lights in Omotesando, you know?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose campus isn’t a good substitute for either of those places, other than the inside of Keyaki Mall…” The school hadn’t really decorated the campus roads for the occasion, so everything looked the same as usual. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m okay with staying here…” said Airi. “Plus, the campus has almost everything we need. Do you feel the same as Haruka, Kiyotaka-kun? About going off campus?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnlike Haruka, Airi definitely didn’t strike me as the kind of person who liked to hit the town at night. I\u0026#160;supposed it would be okay if I didn’t force myself to be carried along for once.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m happy to stay here, Airi. But I get why people want to go off campus,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know that it’s in the school rules, but isn’t saying that we can’t contact our families for three years kind of extreme? I mean, you’d think people would be concerned about their kids, right?” Maybe this was a tender subject for Akito, because he was glowering. “My mom’s a worrywart. She’s probably really anxious,” he added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve heard that the school takes care of that. Apparently, they regularly send out report cards and stuff.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That…might worry her even more. Guess I should study a little harder,” Akito said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Parents probably worry more about girls than boys, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, no worries. That’s not the case with me. My family’s fine,” said Haruka, smoothly dodging the topic. It seemed there might be something that she didn’t want to touch on. “So, are we heading over to karaoke? It might be a bit crowded.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re not going to play that punishment game again, are we?” asked Keisei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course we are. So Yukimuu can have his revenge.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs everyone chatted about where we were going next, I stopped in my tracks.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s the matter, Kiyotaka-kun?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry,” I said. “I’m heading back.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But it’s only two,” Akito said, checking the time on his phone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To tell you the truth, I pulled an all-nighter, and I’m kind of beat. Let’s hang out again over the winter break,” I told them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAiri looked disappointed, but I trusted Haruka to make sure that she had a good time, even without me around. I said my goodbyes to the group and left, pulling out my phone to call Chabashira-sensei once I was a safe distance away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hello. I need to talk to you about something. Do you have a moment?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you planning? Didn’t you wash your hands of me?” replied Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, but there’re still a few loose ends that need tying up. I’d like to discuss this in person. Can we meet at school?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll wait in the classroom,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Understood. I’ll be there in a few minutes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI returned to our classroom, which was now empty of students. Chabashira-sensei stood near my seat, looking out the window.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If this is like previous years, it’ll probably snow,” she\u0026#160;said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you like snow?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I used to. Then I grew up and came to hate it.” Chabashira-sensei pulled the curtains shut and turned around. “You said that you have something to discuss. What do you want with me?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was just wondering. Why do you want to make it to Class A so badly that you’d go so far as to use me to do it?” You’d think a teacher might hesitate to lie and manipulate a student unless she had good reason for it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This school’s designed to make teachers, as well as students, compete with one another. It’s only natural that everyone wants to rise up the ranks.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t imagine that’s all there is to it. If you really aimed for Class A from the very beginning, you’d never have put Class D at a disadvantage the way you did.” During our first midterm exam, Chabashira-sensei had deliberately withheld critical information from us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s different. It was personal. I have nothing to say to you,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You hesitated, right? You weren’t sure this class really had the ability to aim for Class A. You weren’t sure it was even worth trying.” I didn’t really care what her secret feelings were. The important thing was whether she could be of use to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems that this is a waste of time. I’m going back to work.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI spoke up again as Chabashira-sensei turned to leave. “If you won’t answer, then you might as well give up on trying to use me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that what this is about? I thought you already wriggled free of my grasp, didn’t you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is crucial. If you don’t take action now, Class D will never make it to Class A. If anything, it’s unlikely we’ll even reach Class C.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you talking about?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI looked at the clock on the wall, making it obvious that I was checking the time. “It’s already two p.m. Ryuuen is putting on a very interesting show right about now, after calling Karuizawa to the roof.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ryuuen called Karuizawa?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, even you don’t know, Sensei? Karuizawa was horribly bullied in the past.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is the first I’m hearing of it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That information will probably be all over the school tomorrow. When that happens, Karuizawa will retreat into her shell, and maybe even voluntarily drop out of school. If we can prove Class C was responsible, we might be able to retaliate, but the damage done to each class will be unfathomable,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t know what the penalty to Class D would be for someone dropping out, but it was probably bad. I could tell that much just from looking at Chabashira-sensei’s face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, she immediately regained her composure and fixed me with her usual intense gaze. “I see your ulterior motive. You can’t resolve this situation on your own, but a teacher has powers you don’t, and I could help conceal your involvement. A perfect resolution, yes?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’ll help me?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t get carried away, Ayanokouji. I have no intention of cooperating with you,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Naturally.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The school doesn’t exactly look kindly on teachers intervening in problems between students.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTrue enough. A teacher going up to the rooftop alone, not just to stop Ryuuen from bullying Karuizawa, but also to prevent word of Karuizawa’s past from getting out…it was a dream scenario, too perfect to ever come\u0026#160;true. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can you really afford to turn me down?” I replied. “There’s no guarantee that I won’t do anything to sabotage Class D in the future, is there? I’m more than capable of ensuring we never rise through the ranks.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To think that a student would threaten a teacher. The tables have certainly turned.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you do this for me, I promise I’ll do nothing to hinder or sabotage Class D going forward. I think that’s significant, don’t you?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If refusing to help you with this means that we never make it to Class A, then so be it.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, then. It looked like Chabashira-sensei wasn’t going to budge. Fortunately, relying on a teacher for help never once factored into my calculations.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Relax,” I said. “I had no intention of recruiting your assistance.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was just testing you, that’s all. So, why not come observe this little drama’s conclusion?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e6.1\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eF ALL WAS GOING\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e in accordance with my predictions, about thirty minutes should’ve passed since Karuizawa went to the roof. Chabashira-sensei and I waited a safe distance from where Yamada Albert stood guard, watching as Ishizaki came downstairs looking panicked and went back up with buckets of water. Judging by the amount of water spilled on the floor, he must’ve done this several times. Probably part of Ryuuen’s scheme to force Karuizawa to relive her past trauma in order to get her to confess.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Karuizawa must not have spilled the beans right away, because neither she nor the Class C students showed any sin of coming back down. It was possible things were going slightly differently from how I’d envisioned. Still, putting my initial assumptions aside, this was a change for the better.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you planning, Ayanokouji? How long do you intend to wait?” asked Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust a little longer. I’d come this far; I didn’t need to rush to take action. The further I let the situation on the roof develop, the more likely it became that things would go my way. Being late carried its own risk, but a necessary one.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s chat,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Right now?” Chabashira-sensei asked, incredulous.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI ignored her response. “I’d like to discuss something that happened shortly after we started school, back when we wanted you to sell us one point for Sudou’s test.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I remember. You and Horikita together paid a hundred thousand points for that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt’d been over six months since then. Time sure did fly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s nothing you cannot buy with private points. That’s what you said, right?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s true. Sudou wasn’t expelled, was he?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If purchasing points was permissible, there would never be any expulsions, would there? Any time someone got a failing grade, someone else could cover for them the way we did.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not that easy to get private points. This year’s Class D has managed to accumulate a decent number, but that’s a departure from normal. Most years, Class D has about half that amount. Besides, not every student in the class gets along. At least not enough to use their private points to save a classmate, even if that means accepting a drop in class points,” she countered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“True. But that’s a flaw in the system, isn’t it? If salvation through private points is always an option, it dramatically lowers the danger of expulsion based on test performance,” I reasoned.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That might be true.” Chabashira-sensei didn’t deny it, but she didn’t look me in the eye, either.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Back when I asked you to sell us that single point, you added a value to it, Chabashira-sensei.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you think it was too expensive?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, that’s not what I mean. I’m asking whether exchanging one test point for one hundred thousand private points was something you came up with on the spot, or if you had some basis for attaching that price to it. At the time, I thought you sounded like you came up with it off the top of your head, but since then, I’ve come to doubt you arbitrarily decided that on your own without consulting the school.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you trying to say, Ayanokouji?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This school has taken great care to legislate, in writing, all matters related to points, hasn’t it? It’s not far-fetched to think that it might’ve anticipated someone trying to purchase a test score increase. I would believe it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In other words, you’re asking whether the price I named you and Horikita was something that the school decided on in advance?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. If you can answer, please do.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was a pause. Chabashira-sensei, who’d had a ready reply to my every query thus far, was silent.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not like I can answer any question you ask of me,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Should I interpret that to mean you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecan’t\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e answer?” I\u0026#160;asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Think whatever you want.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Very well. I’ll happily draw my own conclusions. The school prepared a manual to consult in every conceivable situation. It was determined in advance that it cost one hundred thousand private points to purchase one test point. If we go from there, it begs the question: can we can purchase one test point for a hundred thousand private points on more than one occasion?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Speculate as you wish, but this is an odd conversation, given the circumstances. Karuizawa is—” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI cut Chabashira-sensei off. “Is the hundred thousand points per test point rate only available for a limited time after we’ve enrolled? Does the price go up every time we make a purchase? Or are we only allowed to make such a purchase once? The more I think about it, the more questions I have. Please tell me if I’m correct.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Enough. Do you think I can answer those questions? Even if I were able to, there’s no way you could confirm the truth.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There is. I just need to ask you directly, Sensei.” She tried to avert her eyes, but I wasn’t budging. “How many points would I need to buy one test point on the next midterm right now?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“………” Chabashira-sensei went completely silent.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As a teacher, you’re obligated to answer that question, right? If you won’t, I’ll go ahead and ask another teacher. And if they answer me, I’ll report to the school that Class\u0026#160;D’s homeroom teacher is discriminating against us. Don’t forget that I can do that,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, it was possible that the other teachers would be similarly prevented from answering, in which case I could imagine several possibilities. There might be a rule that stated they could only sell us points once, or that they could only do so if someone would otherwise get a failing grade. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven so, her inability to answer was an answer in and of itself. It told me there was established procedure to be followed in situations like these.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you trying to find a gap in the rules?” Chabashira-sensei asked me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A few students are already doing just that, aren’t they? Look at Ichinose and Ryuuen, both accumulating private points.” They were each trying to find a strategy that benefited their respective classes, undergoing a process of trial and error every day.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Understood. Very well, I’ll answer your question. It’s true that the key to beating the system lies in understanding the actual rules surrounding private point use. Students from previous years have approached the problem from various perspectives, as you’re doing now. Even Class D, the collection of ‘defective products’, is no exception. Some students have been quicker than others on the uptake, though. Additionally, the school has established thousands of detailed rules to cover every possible scenario. Buying and selling points, sweeping violent incidents under the rug, preventing expulsion—there’s a point value attached to every single one of those. However, teachers are very limited in what we’re allowed to reveal or allude to. In fact, we’re prohibited from revealing most of this information. There might even be rules the teachers aren’t aware of yet.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you truly can’t answer my question?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Correct.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOne mystery solved. Our teachers could only reveal the private points’ special uses to us when certain conditions were met. In other words, the price of buying a point for the next midterm had already been set; I just hadn’t met the conditions necessary for Chabashira-sensei to disclose that information to me. Now that I knew that, I could begin to devise countermeasures, though the ambiguity would keep us from being too reckless.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Does this conversation have anything to do with what’s happening now?” asked Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not at all. I was just having a friendly chat,” I replied. Chabashira-sensei had no idea what my real intentions were. “I suppose it’s time, wouldn’t you say? Time for this game to be over.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI checked my phone and saw that it was past 2:40 p.m. I sent a certain person a message instructing them to come here immediately.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t fully understand what’s happening, but I do know that Karuizawa is suffering terribly at Class C’s hands. If you have no intention of stepping up, you should call someone else,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m heading to the roof,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei couldn’t hide her surprise. “Are you insane? If you do, the entire school will know your identity.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It doesn’t matter. Even if Ryuuen learns that I orchestrated all Class D’s strategies so far, he now gains nothing. If anything, he might assume I’m involved next time, and end up sabotaging himself.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you do this, you’ll be the talk of the school. You’ll destroy all possibility of leading a quiet life here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could guess at the thought smoldering within her mind. Chabashira-sensei was probably thinking that as long as my identity remained hidden, she had leverage to make me cooperate. But if I revealed myself to Class C, Ryuuen would know for certain that I was X. Even if he didn’t know for sure, it would all be over as soon as he decided I was his prime suspect.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei looked away. “Perhaps I was mistaken,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Mistaken?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Chairman Sakayanagi told me about you before you enrolled. He said that you were an extremely special student. A superior one. And that you were a student we must protect. That you were raised in an environment that was far from loving. The chairman and I concluded, after much discussion, that we wanted you to feel attached to this school, and to want to stay here. Then I told you that your father wanted you expelled. It wasn’t true at the time, but it appears to be now,” she explained.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Well, you were certainly correct that it’s easier for people to become attached to something if they have a goal to strive for. But you needn’t worry. I choose to stay here. I have no intention of going back to being under that man’s control.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, my mistake was in trying to use you so carelessly, hmm? I suppose I got carried away, chasing my pipe dream of Class D overtaking Class A.” Chabashira-sensei spat those words with resignation. Ironic how quickly she was giving up on her ambitions.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not a pipe dream. Class D is about to rise to Class C. Soon, Horikita will unite our class. I’m sure of it,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose. You’ve already achieved what past classes haven’t. Do you really think Horikita can do that, though?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Such skepticism is unbecoming of a teacher. Horikita is more than capable of leading Class D.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed Chabashira-sensei only saw Horikita as a means to manipulate me, no more. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ultimately,” I said. “Horikita is starting to mature. The same goes for many of our classmates. Continue to guide them as their teacher, and our position as Class C will be secure…and so might our path to Class A.” Of course, we’d need some very different skills to get that far.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you really planning to step back?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTeachers were almost certainly forbidden from trying to manipulate students’ emotions to gratify their own. Chabashira-sensei had to be well aware of that. I hadn’t brought her here to act as insurance; I’d done it so I could prove to her once and for all that I was stepping back from actively participating in inter-class competition.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Back to the topic at hand. You’re free to make your grand entrance and expose your identity. But will that really resolve the problem?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t guarantee it. At most, I can say I’ll deal with the situation based on my evaluation of Ryuuen’s personality and behavior.” I caught sight of the person I’d texted approaching us. Chabashira-sensei was free to leave if she wanted, now. It would no longer hinder me. “Well then, thank you very much for accompanying me this far.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I said that, the person I’d texted joined us. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry to have kept you waiting, Ayanokouji,” said Horikita Manabu, the former student council president.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei looked shocked to see him. “What’s going on?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He’s here as a witness. After all, Ryuuen will try to win by any means necessary, and I’d like to avoid this becoming violent.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaving a teacher stand witness was the ultimate trump card, of course, but not as feasible to implement. I’d chosen to use the next best thing.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you planning to have Horikita go to the rooftop in your place?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Does the former student council president look like someone who’d ever do that sort of thing?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei looked over the elder Horikita for a moment, and immediately arrived at the conclusion that it was impossible.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There will be a person on the rooftop who will witness what happens there. As long as that holds true, then we’ll be fine,” I concluded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was for that purpose that I’d come to an agreement with Horikita’s brother. Not that that was relevant right now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI turned to the elder Horikita. “A few minutes after I head up, I’d like you to stop halfway up the stairs. There’s no need for you to talk to the students who come back down from the roof, nor is it necessary to punish them. Just make sure they see you on their way down. I need them to be aware you were here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s fine, but don’t forget our arrangement, Ayanokouji,” he replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course. If I go back on my word, you may choose to forget what happens here today,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As long as you understand. Try to wrap this up quickly.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, Ayanokouji. What would you have done if Horikita didn’t agree to help?” asked Chabashira-sensei as I started down the hallway that led to the rooftop.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm. Who knows?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI probably would’ve used Sakayanagi instead, since she knew about me. And if that weren’t possible, then… Well, there was no point in thinking about plans I no longer needed to be.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll be back in ten or twenty minutes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e6.2\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eCLIMBED THE STAIRS\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e step by step. A shadow loomed in front of me, blocking the path to the roof. It was Yamada Albert, the perfect gatekeeper for the task. I didn’t know much about him, other than the fact that he was one of Ryuuen’s underlings.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe looked me over as if sizing me up. “May I pass?” I\u0026#160;asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe continued watching me, not moving a muscle. Did his silence imply refusal, or did he not understand? His large hands swiftly withdrew his phone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t panic. I’m the one you want,” I said to him in English. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlbert stopped moving, but said nothing,\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m ending this today. No one else will interfere,” I\u0026#160;added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlbert seemed to give this some thought. He stood aside and silently signaled me to pass, apparently having acknowledged me, but I needed him on the roof for what was to come.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I intend to crush Ryuuen. He doesn’t stand a chance without your help,” I told him, switching back to Japanese.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlbert looked downstairs once more. After he confirmed that there wasn’t anyone else around, he followed me to the roof, stopping by the door and watching me from behind.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe gray clouds hanging in the sky threatened rain. I\u0026#160;saw Karuizawa near the fence, cowering away from the door. Having noticed the door open and close, Ishizaki and Ibuki looked over at me, as did Ryuuen. I checked the area for surveillance cameras, noting that the sole camera’s lens was painted black. He’d covered it with spray paint, huh? \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI turned my gaze back toward Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayano…kouji?” asked Ibuki incredulously. She was the first to speak.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa had noticed me. She said nothing, but I could tell that she was shocked and wondering why I’d\u0026#160;come.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry I’m late,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why…why did you come?” asked Karuizawa, barely squeezing out the words.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean, ‘why’? I made a promise, didn’t I? I promised that I’d save you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“R-Ryuuen-san, does this mean Ayanokouji is X?!” Ishizaki panicked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no way. It definitely can’t be him,” Ibuki denied before Ryuuen could say anything. “X is just using Ayanokouji. Don’t be fooled, Ryuuen. X probably told Karuizawa in advance that he’d send someone to come and save her!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shut up, Ibuki.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen laughed, putting distance between himself and Karuizawa as he drew closer to me. He stopped about five meters away, clearly wary. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, well. Who do we have here? It’s that guy who clings to Suzune all the time. Ayanokouji, huh? What brings you all alone to the rooftop on this fine first day of winter vacation?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Karuizawa emailed me. She said she wanted me to save her.” I deliberately failed to mention that Ryuuen himself also contacted me. As for why I was here…it was because Ryuuen, thinking himself the hunter, had foolishly invited me to the hunting ground to turn him into prey instead.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s obviously a lie,” said Ibuki. “You came here on someone else’s orders, Ayanokouji.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s the matter, Ibuki?” asked Ryuuen. “It seems you want to believe that Ayanokouji isn’t X.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not about what I want to believe. I’m telling you; he \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecan’t\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e be. He’s… This guy’s stupidly good-natured. He’s a softie. Besides, he probably doesn’t even know about Karuizawa, and X, and everything—don’t you think?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good-natured? What makes you say that?” asked Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When we were on the island, I hid Karuizawa’s underwear in a boy’s bag to sabotage Class D. Everyone went straight to suspecting me, since I’m from Class C—except Ayanokouji. He even told me straight out that he didn’t think I’d done it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did that make you happy?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Quit joking around. Of course it didn’t make me happy; I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewas \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eactually guilty of the crime. It just told me that he’s an incompetent student who doesn’t know how to doubt someone clearly suspicious.” In other words, she couldn’t imagine someone like that being able to manipulate Class D from the shadows.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg height=\"100%\" style=\" top: 0px; vertical-align: top; height: 100%;\" alt=\"\" id=\"ClassroomElite-Vol7_INTERIORIMAGES_13\" src=\"/hola-lector-agua/images/books/v7/OEBPS/Images/ClassroomElite-Vol7_INTERIORIMAGES_13.jpg\" loading=\"lazy\" decoding=\"async\"/\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e believe it, Ryuuen-san? That Ayanokouji’s X?” asked Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve had my eye on Ayanokouji from the start. He’s always clinging to Horikita, who’s reputed to be quite exceptional herself.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But that’s so obvious… isn’t that way too out in the open for someone trying to hide their identity?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Certainly. I understand what you’re trying to say, Ishizaki. That’s why I made sure to very carefully narrow down my list of suspects. After I learned about the incident with Manabe and her friends, certain candidates resurfaced as my primary suspects. When I considered the speed and means by which Karuizawa’s bullying incident had been dealt with, I thought it had to be either Ayanokouji or Hirata.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Stop trying to make yourself look cool. You didn’t even target Ayanokouji or Hirata until well after that, did you?” demanded Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, this was a strange situation. I’d admitted to being X, but Class C was divided on whether they believed me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s precisely because I was the most suspicious that I did things that way. Or perhaps it was because I had no other method available to me other than using Horikita?” I told them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But—!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI decided to throw out a vague yet helpful statement to stir them up. “I’m the person you’ve been searching for.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hah! Isn’t that suspicious?” Ibuki added. “Would X really just come right out and say that?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAn understandable response. It made sense they wouldn’t jump to believe me, considering that I had been keeping my identity hidden until now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think this is fishy, too. He might’ve been told to step forward and claim he’s the mastermind as part of a ploy,” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You predicted that X wouldn’t show up, right?” continued Ibuki, joining Ishizaki in urging Ryuuen to question the certainty he exhibited moments ago.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I certainly did,” replied Ryuuen. “This looks like a bad move on your part, Ayanokouji. Your best option would’ve been to abandon Karuizawa Kei, not walk into an obvious trap. I suppose I understand why Ibuki and Ishizaki don’t believe you. If you’re really X, tell me how you plan on getting out of this dilemma.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAm\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I in a dilemma?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen and his lackeys looked completely unamused by my foolish question.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I only came here because Karuizawa asked for help. If you want proof that I’m X, you could just wait until the next exam and see what I do,” I added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not true. We know your identity. We also know Karuizawa’s secret. Awful things will happen tomorrow if you leave here without doing as we say,” replied Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Awful things?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Enough already. Stop playing dumb and show me what you’ll do.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What I’ll do? There’s nothing I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecan\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e do.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I bet Sudou and those other guys are waiting nearby,” said Ishizaki, glancing at the half-open door.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nope,” Ryuuen said flatly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-Is that so?” Ishizaki asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If her classmates knew about Karuizawa’s miserable past, her social life would be dead without me having to say a word. Try and use your head a little.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I see.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Still, I gotta say, you must think you’re a real big deal if you’re still trying to play dumb.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s enough, Ryuuen. There’s absolutely no way X would just stroll up here alone,” said Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Man, oh man. Now this is a problem. Ibuki and Ishizaki don’t seem to believe that you’re X,” said Ryuuen. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe shrugged, appearing exasperated, as he looked over at Ibuki and Ishizaki. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You say there’s nothing you can do, Ayanokouji? But I need to ascertain the truth of the matter here. For that to happen, I think you need to let these two know what’s going on and make everything clear. Is that all right with you?” he asked, looking over at me with a broad smile on his face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve already admitted to it. But if you won’t believe me, then allow me to explain, Ibuki,” I said, turning my gaze on the person who wouldn’t stop doubting me. “The island exam. You were instructed to take pictures of our leader’s keycard, but your digital camera got damaged somehow. Am I wrong?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-how did you know that?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It was me. I used water to short-circuit the camera without causing visible damage. When I met you in the forest, Ibuki, your fingers were covered in dirt. There were signs that you were digging nearby. When I returned to the spot later that night, I found a wireless transceiver. That was so you could communicate with Ryuuen, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven within Class C, not many people could have known they had a digital camera. The only people who could have seen Ibuki’s hands covered in dirt at the time were me, Yamauchi, and Airi. In other words, this was definitive proof of my claims. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You have to admit it now, Ibuki,” said Ryuuen. “Ayanokouji is X.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait—wait a second. Yeah, he might be really clever, but that isn’t enough to say for sure that he’s X, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seriously, is there any reason to debate this further?” Ryuuen looked even more exasperated than before.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It just doesn’t make sense! If Ayanokouji really is X, the mastermind, why would he just show up here?! He wrecked all your plans so far, didn’t he?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He probably has a trick up his sleeve. A miracle beyond our imagination. If he doesn’t, then…well, he’s an idiot.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Trick?” I said. “There’s no trick I can pull in a situation like this. You already know Karuizawa’s big secret. I understand what’ll happen if I get careless here. You took plenty of precautions to corner me. Right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Exactly. So, what’re you gonna do about it? I can reveal your identity whenever I want. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAnd \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI still have the threat of exposing Karuizawa’s past to use against you. You’re powerless.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Indeed. I can’t exactly report what you just did to Karuizawa to the school, either,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eInstances of violence between students during exams were punished by expulsion, but the same wasn’t necessarily true of spats that occurred at other times. Even if I could give the school real proof of what they’d done, it was unlikely I’d be able to deal Ryuuen and Class C any real damage.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And if you try to tell the school what we did up here, we’ll leave Karuizawa high and dry in retaliation,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, we’d both go down in flames if I tried anything, and Class D would probably be the one going down hardest. Ryuuen had switched from using his knowledge of Karuizawa’s past to attack her, to using it to defend against me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No matter how you slice it, I win,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay. Well, are you satisfied? If so, I’ll be taking Karuizawa back with me,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come now, don’t be so anticlimactic. You came all the way here. We might as well take our time.” Ryuuen grabbed Karuizawa’s arm and yanked her up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ack!” she squealed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You wouldn’t expose your identity without a reason. What’re you planning?” Ryuuen extended his hand to me, as if challenging me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, Ryuuen. I can’t fulfil your expectations.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was just dancing in the palm of your hand. That’s all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo one present could’ve imagined that X would say something like that. They’d anticipated either a cruel man who would abandon Karuizawa to protect his identity, or a clever student who would swoop in and save her while keeping his identity secret. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor the first time since I stepped onto the rooftop, Ryuuen’s smile began to fade.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All this time spent hyping up the mysterious ‘X,’ and he’s nothing but talk. What a disappointment. Maybe the digital-camera thing was just dumb luck,” said Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though they were allies, Ibuki had always distrusted Ryuuen, which was precisely why she dared question him so openly. Seeing an opportunity, I made my next move.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I may have revealed myself to you, but that doesn’t mean I’m in trouble. Only Horikita and Karuizawa from Class D know who I am, so if this information makes its way to other classes, I’ll know one of you leaked it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So what?” Ibuki demanded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you spread word of my actions, I’ll report everything that happened here to the school,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We just established that we have you cornered because you can’t do that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can. All I have to do is sacrifice Karuizawa.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You assumed from the start that I’d abandon Karuizawa. But when I showed up here, you started talking as though you thought I wasn’t going to. Am I wrong?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now, hold on, that doesn’t make sense,” said Ryuuen. “You could’ve kept yourself hidden if you sacrificed her to start with. You came all the way here precisely \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ebecause\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e you couldn’t sacrifice her. Don’t try to trick me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fine. If they already know about you, Kiyotaka, they can go ahead and tell everyone they like about my past,” said Karuizawa, looking over at me as she slowly picked herself off the floor. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI kept my eyes fixed on Ryuuen. “You heard her. Believe what you like, but if you spill the beans about me to the other classes, it’ll be war,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um…” stuttered Ishizaki. “Well, we know X’s identity now. Maybe that’s enough?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I agree. Ayanokouji might actually sacrifice her,” Ibuki said. Clearly, neither of them wanted to pursue things any further. They’d smoked X out, and were content with\u0026#160;that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh heh heh!” Ryuuen suddenly clutched his head and laughed. “Well, you’ve got that right. If either side spills the beans, it’ll be open war.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBoth classes would be wounded in the ensuing conflict, whether those wounds were shallow or deep. Further, there was no guarantee Karuizawa would be destroyed by it. The image of a girl who held her head high despite being bullied was a compelling one. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Ryuuen declared this to be the end, we’d be done. But he’d never choose that option.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Man, this is anticlimactic. Not only did you give up your identity so easily, but you have no choice but to leave the decision up to me, your opponent! Even then, there’s no doubt in my mind that Ayanokouji is X, the one who’s been keeping me entertained. Which means I’d be missing out if I don’t have you entertain me to the very end. Isn’t that right, Ishizaki?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“See, everything is a game to me. Not just getting to Class A, but crushing Ichinose; crushing Suzune; crushing classes D and B; even finally crushing Sakayanagi, whom I’ve been saving as a special treat for last… It’s all just my way of staving off boredom.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStill chuckling, Ryuuen grabbed Karuizawa’s hair. Her\u0026#160;face twisted in agony, but there was no fear in her eyes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh. You were so full of despair moments ago, but now your eyes tell me that you have absolute faith in Ayanokouji. I bet you’d tell everyone about your past yourself if it’d protect him, wouldn’t you? Relax. You
