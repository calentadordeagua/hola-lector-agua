r role here has ended,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSeeming to lose interest in Karuizawa, he let go of her hair and shoved her away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You really have entertained me, Ayanokouji. You might be just another Class D defect, but you saw through my plans time and time again. Even more than that, you think like me. How could I help but want to draw you out of hiding? I didn’t think about what would come next. I thought I’d choose that once I met you.” His tone was almost pleasant. “Now I’ve decided.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…What are you planning to do, Ayanokouji?” asked Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why do you sound so irritated, Ibuki?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki drew level with Ryuuen, and looked him right in the eyes, without fear. “What you’re about to do puts Class C at risk,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh. You, the eternal lone wolf who never tried to cooperate with her classmates, talking about risk to Class C? Don’t make me laugh,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I cooperated with you because I thought you were acting for the class’s sake. But this is a step too far. Ayanokouji clearly has nothing up his sleeve.” Ibuki sounded as if she was releasing months of pent-up anger and frustration. “Iwon’t be a part of what you’re about to do.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You think you know what I’m going to do?” asked Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, because I’ve watched you since April. You’re going to hurt him, aren’t you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs Ibuki said those words, Ishizaki’s body went rigid.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ishizaki. Komiya. Kondou. Even Albert. You beat every single one of them until they were ready to obey you at all times,” Ibuki continued.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Violence best demonstrates the power difference between us.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Isn’t that difference already plain to see?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji has been a thorn in our side. We have to return the favor.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m telling you, that kind of thinking is going to endanger our class!” Ibuki cried.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSmack!\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Ryuuen struck her across the face, and she fell silent immediately.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As long as I’m having fun, I don’t care,” he said. “Violence is easy to understand.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs illustrated by what he’d just done. So, that was his answer, huh? I supposed the outcome was inevitable once we passed the point where we could continue to delude ourselves.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Listen, what matters right now is what each side will do with the information they’ve gained. Ayanokouji wants to wrap things up here without anyone else finding out what happened, including his identity and Karuizawa’s past. It’s also true that we blackmailed Karuizawa and dumped freezing water on her. If that gets out, we’ll be punished. To put it simply, as long as both sides keep what happened here secret, no one needs to know.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA logical conclusion, considering what had happened so far.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No matter what happens, both sides have no choice but to grit our teeth and accept it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd yet, not everyone C Class thought so.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think I understand why you revealed your identity so late in the game,” Ryuuen told me. “It’s so we can’t take this fight somewhere else. Shut the door, Albert.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlbert closed the door that led from the stairwell to the roof.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But, in the end, it was still a bad move,” continued Ryuuen. “You might’ve thought that fight would end here, but I’m not letting things go.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone present could feel in their bones what was about to happen. Ryuuen wasn’t about to change his methods.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My escape route’s gone, huh? Well, I guess you got what you wanted,” I told him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“First, I’m going to wipe that calm look off your face and replace it with fear. You’re underestimating me, aren’t you? You think I won’t do it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you really going to resort to violence?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“War isn’t just a battle of wits, you know. You can win just as well by assassinating an army’s leader as by outsmarting its tactician. Violence is the most powerful force in the world. It doesn’t matter how crafty you are—violence will bring you to heel.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven now, with a brawl moments from breaking out, I momentarily glanced over at Ryuuen, Ibuki, Ishizaki, and then Albert.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m going to burn the image of your gangly, beaten body into my eyes. Then, starting next semester, I’ll take a bite out of Ichinose,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Violence is a powerful tool. I can’t argue with that. However, you have to be stronger than your opponent for that to work to your advantage. Understand?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The four of you won’t be enough to stop me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wha…?” Ibuki raised an incredulous eyebrow.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh heh heh. Ha ha ha ha ha!” Ryuuen clutched his sides in raucous laughter. “Oh? I think Ayanokouji’s saying he’s not to yield to violence from the likes of us. Then show me what you’ve got. Ishizaki.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A-are you sure?” Ishizaki hesitated. It would’ve been one thing if his opponent were someone like Sudou, who was known for getting into fights, but I was a regular student. His resistance was understandable.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t hold back. Take him out.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we give Ayanokouji a thorough beating, there won’t be anything more to worry about.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait!” cried Karuizawa as Ishizaki approached me. “Why are you doing something so stupid?! You have nothing to gain by beating up Kiyotaka!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, hey. Stay out of this, Karuizawa. You served your purpose here. Thanks to Ayanokouji’s sacrifice, your secret is safe. Show some gratitude.” Ryuuen grabbed Karuizawa’s hair once again.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Guh!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe shoved her away. “Stay out of it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven so, Karuizawa bared her teeth at Ryuuen for my sake. She got back up and tried to leap at him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry, Karuizawa,” I said, stopping her in her tracks.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-but—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s nothing to be anxious about.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eYou’re\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the one who oughta worry,” Ishizaki told me, stepping forward. “I’m not a bad guy, Ayanokouji. I’m just following Ryuuen-san’s orders.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t really care,” I told him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was all going according to plan. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki casually threw a punch at me—no, it was more like the swat you might give a naughty child. A\u0026#160;slow, monotonous motion that even a junior high or elementary school student could have avoided. His right fist came at me in a wide arc, and I caught it with my hand.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh…?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re going to do this, you better take it seriously,” I warned him. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe didn’t seem to take the hint, even though I’d completely blocked his blow, perhaps because it had been such a lazy blow to start. So, I squeezed his fist. My right hand still clamped down on his, I applied more and more pressure.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Ah…ugh…huh?!” Ishizaki’s face went taut, and his knees trembled. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s the matter, Ishizaki?” asked Ibuki, sensing something was wrong.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah…ngh…ah! T-time out… Stop!” Ishizaki buckled at the knees and fell. Unable to take it any longer, he grabbed my arm and tried to free himself, but it was futile. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlbert was the first to grasp the reality of the situation. He didn’t wait for Ryuuen’s order, but swung at me with his thick arm, which was the width of an electrical pole. He attacked from my left even though I was free on that side, probably anticipating that I would take a defensive stance after Ishizaki freed himself. He was wrong. I\u0026#160;could’ve dodged the attack, but instead, I steeled myself and caught Albert’s punch with my left hand, prepared to take a little damage. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSMACK!\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e An almost-electric jolt traveled from my elbow all the way to my shoulder.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just as I thought. That hurts,” I mumbled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was difficult to read Albert’s expression behind his sunglasses, but he was probably catching on.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No way. Y-you’re not messing around, are you? Albert? Ishizaki?” Ibuki asked incredulously. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMaybe she couldn’t tell Albert really had swung at me with all his might, or that Ishizaki was in pain. Or maybe she just didn’t want to believe her eyes. I released Ishizaki, who crouched and clutched his arm.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do it, Albert,” Ryuuen ordered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlbert charged at me, his powerful fists swinging. I’d intentionally let him land the first blow, but I couldn’t take too many more hits of that caliber, so I dodged under his swing and went in for a frontal attack, punching him in the gut. I didn’t hold back, either. It wouldn’t be wise to underestimate an opponent whose abilities were still largely unknown to me. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBased on the slight change in Albert’s flat expression, and how hard his body had felt against my fist, I judged that I’d dealt minimal damage. He’d clearly trained his body well—but it still had all the weaknesses human bodies did. All this meant was that I would have to work a bit harder to crush him. The human body had numerous weaknesses—the solar plexus, for instance, was a part you couldn’t strengthen through training. At best, you could accustom yourself to pain so it was easier to endure.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe must’ve realized that I was going for his solar plexus with my next strike, because he twisted away to evade it. However, I’d been feinting in anticipation of just that, and quickly jabbed his throat with my palm like a sword.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ghh!” Albert gurgled in pain.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji!” shouted Ishizaki, charging at me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re going to come at me, don’t shout,” I said exasperatedly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt least he’d saved me some trouble. I kicked Ishizaki’s left knee, sending him to the ground. He was so easy to read. Albert had also fallen to his knees, so I spun and delivered a kick to his face, using my momentum to punch Ishizaki in the jaw on the return. He collapsed, and all was silent on the rooftop.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen, Ibuki, and Karuizawa stared, burning that unbelievable spectacle into their eyes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I guess we underestimated him. He acted so tough because he was confident in his skills, huh? I didn’t expect this,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“S-so, you’re saying that Ayanokouji turned the tables on you?” Ibuki stammered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you serious, Ibuki?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ryuuen’s always been the sort to use violence. Do you think I’d voluntarily allow him to engineer a situation where he could rampage without repercussion?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm?” Ibuki tilted her head in confusion. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen seemed to have doubts as well. “Wait a minute, Ayanokouji. Now even \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI’m \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003enot following. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eset up this meeting.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You still don’t get it, do you?” I sighed deeply. “Our confrontation here was determined long in advance. I\u0026#160;knew that, when faced with a stalemate, Ryuuen Kakeru would resort to violence to settle things.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen thought that everything that had happened so far was his doing. He couldn’t have been more wrong.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I never intended to reveal my identity, I wouldn’t have used Manabe during the sports festival. I knew you’d identify her as the obvious culprit once you heard that recording. That is what led you here, right? I anticipated that you’d question them, and learn that I was blackmailing them for bullying Karuizawa,” I explained.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen couldn’t deny a single thing I’d said so far, naturally.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You were convinced that a link existed between Karuizawa and me. You had Ishizaki, Komiya, and the others tail Class D students, and moved openly against Kouenji yourself, thinking that it would put pressure on X. I imagine you genuinely enjoyed yourself, but you actually gave me some time to think.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh. My, now you’re saying some pretty interesting stuff. So, you purposefully made it look like I had you in the palm of my hand?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To be more precise, you were dancing in mine,” I\u0026#160;replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Allow me to apologize, Ayanokouji. You really \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eare\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e clever. The advantage I thought I had is gone, and now I’m in trouble. What should we do, Ibuki?” Ryuuen smiled happily.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seriously, what’s the deal with you two?!” Ibuki seethed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSomething seemed to snap within her, leaving her frustration free to spill forth. She launched a kick at me, apparently unconcerned that I could see her underwear. Well, it was probably more than it hadn’t even occurred to her in her fury. I took a step back and calmly evaded her kick.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was like a switch had been flipped inside of her. Ibuki took a couple steps toward me, closing the distance between us, then kicked again, leaving me little room to dodge. She was good. Even if Horikita had been in the pink of health during their fight on the island, Ibuki would’ve beaten her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd yet, I evaded all her kicks. Ibuki stopped attacking and clicked her tongue in apparent frustration. “Seriously, what are you…?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You really don’t know?” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You honestly make me mad. I’m not sure why, but you piss me off!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe leapt at me once more. This time, rather than dodge, I immediately closed the distance between us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wasn’t averse to playing with Ibuki, but I didn’t want to drag this out much further, either. I grabbed her by the neck and slammed her to the ground, giving her no chance to dodge or guard. Her eyes went wide, and she stopped moving entirely. Slamming her head would’ve been even more effective, but this wasn’t a fight to the death.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Violence isn’t a tool only you and your goons possess,” I said to Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki, Ishizaki, and Albert—all of Ryuuen’s right-hand men—lay collapsed on the ground. Karuizawa was unable to utter a word.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m impressed you’re still keeping your cool after seeing that play out,” I added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re not just clever, but also capable of dishing out violence when called upon. I underestimated you.” Ryuuen clapped in genuine respect as he walked up to me. “Do you know what I’d like to say now, Ayanokouji?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nope.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe sounded calm, as if he didn’t register the weight of his predicament at all. It probably wasn’t a bluff. This was something characteristic of Ryuuen; something he excelled at. It was what had enabled him to move so confidently for so long. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Physical strength alone doesn’t determine victory or defeat. You gotta be tough on the inside, too!” said\u0026#160;Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe adjusted his stance so that he was lower to the ground, then thrust his left fist toward me, aiming not for my face but my abdomen. I leapt backward to evade, and he followed in hot pursuit, jabbing with his right arm.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, but I won’t let you hit me,” I told him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI evaded him once more, then grabbed his hair with my left hand. He reacted instantly, pushing my arm away. The moment I had his attention focused on my arm—I kicked him hard in the side.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Gah!” Ryuuen immediately put some distance between us to avoid my follow-up attacks.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not bad, Ryuuen.” He far surpassed Ishizaki in overall strength. I was honestly impressed. He’d taken a serious hit, but showed no sign of being about to collapse. I still had trouble picturing him being a match for Albert, though.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is so much fun!” Ryuuen laughed louder than before. “Turning the tables even after being brought to the pits of despair! This isn’t enough for me. I need more, Ayanokouji.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe charged at me once more, holding nothing back. His movements weren’t those of a trained martial artist, but clearly self-taught, a style shaped by countless brawls. I couldn’t dodge all his attacks forever. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why don’t you show off your fighting skills more often?” Ryuuen demanded. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have my reasons.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That so? After I beat you, how about you tell me\u0026#160;them?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you think you’re going to win?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you think you can’t lose?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can’t really imagine it, sorry.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure, you might win this time. But what about tomorrow? The day after?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re saying if we keep doing this over and over, you’ll win eventually?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What about when you’re in the middle of pissing? When you’re taking a shit? I’ll come after you when you least expect it,” Ryuuen said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aren’t you afraid of losing?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t get afraid. Never felt fear once in my life.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No fear, huh?” Now that was interesting. This was probably the source of his confidence.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ll understand once you know pain,” Ryuuen said. “Pain gives way to fear for ordinary people.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Teach me about pain, then.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“With pleasure!” Ryuuen grabbed my shoulders and kneed me in the stomach. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kiyotaka!” Karuizawa screamed. But I’d taken the attack head-on on purpose. Nothing to worry about.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just a few more hits and you’ll get it!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen moved forward to kick me, aiming for the same spot he’d just hit. He closed the distance between us, and I guarded my face with my left hand. He lashed out with his right arm, and when he pulled it back, struck me again with his right knee. It was his strongest blow yet. I staggered back, feeling pain shoot through my entire body.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How about it? You get it now?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unfortunately, I don’t ‘get’ anything,” I said. “This is just pain.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you trying to say you’re the same as me? That you don’t feel fear?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not it, Ryuuen. That’s not what I’m saying.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI knew all about fear born through pain. I knew the terror and misery of being a loser. I’d seen people destroyed by it before my eyes, time and time again. But eventually, I stopped feeling fear. Instead, I just felt cold, because I’d come to realize that no matter how much suffering or despair others experienced, the same would never happen to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf you have the means to protect yourself, that’s all you need. If you can keep yourself safe from all harm, you win. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then let’s play some more!” Ryuuen showered me with blows, concentrating attacks on my abdomen. I lowered my hips, intercepting his kick. “Tch! Saw through that, huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI would deal with this by dodging his attacks and keeping my cool. I absolutely would not take any critical injuries.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s the matter? Aren’t you gonna play, Ayanokouji? Why didn’t you dodge those easy blows at first, huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was testing a hypothesis. I wanted to see whether I could feel that fear you talked about,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve got some nerve with that condescension, you freak!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe’d sensed the gulf in power between us, but he was unfazed. Usually, the more confident a fighter was in their skill, the deeper the despair that overcame them when they discovered themselves outmatched. But I didn’t get that feeling from Ryuuen. He wasn’t in a reckless rage that blinded him to the truth, either. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d let him think he held all the cards, then flipped the table in an attempt to break his spirit, but I’d underestimated his resilience. That was a miscalculation on my part. Of course, misreading his upper limits was a trivial error. It just meant this would take longer than anticipated. Ryuuen would just have to suffer that much more pain.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Where’d you get this kind of strength? This isn’t normal, Ayanokouji.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTrue enough. You didn’t get skills like mine just through brawling. I said nothing, but closed the distance to Ryuuen, who was clearly waiting to strike back, his sharp gaze fixed on me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve got all this power, but you keep it hidden?” he asked. “Do you get off on looking down on mere mortals? Does that turn you on? Make you feel good?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve never looked down on anyone. Whether other people succeed or fail has nothing to do with me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen didn’t seem to like that answer. He pushed his hair back and laughed, as if rejecting the very notion that a person could be that apathetic. “Impossible. Humans are made of greed.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course I experienced greed, among many other things. But that was beside the point. Indulging Ryuuen’s games wasn’t going to change his mind. I readied my stance again, getting in position.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, then. I’ll just keep pounding you until you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edo\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e feel fear!” he barked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eThat’s enough, Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs he shifted, preparing to drive his knee into my head, I grabbed his left arm and forcefully pulled him in close. Then I delivered a vicious right hook directly to his face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Gah!” he cried.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe blow would have rendered another person unconscious, but Ryuuen just went flying backward. I had no intention of knocking him out with a single blow, anyway. He hit the concrete and I was on top of him in a moment, raining punches on his unprotected torso. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You said you’ve never felt fear, didn’t you, Ryuuen?” I\u0026#160;asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah…ah…heh, that’s right. I don’t know fear. I’ve never known it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHis face bruised, his eyes nearly swollen shut, Ryuuen still fought back. But his strength was all but gone, and it was all he could do to swing weakly at the air. I responded with a powerful but precise blow to his solar plexus, and his expression turned rigid. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh…ugh! I’m a confident fighter, but it’s not like I’ve never lost before. No, it’s precisely \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ebecause \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’ve been beaten more times than other people that—gah!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI punched him again and again, alternating left and right fists in quick succession. Blood trickled from Ryuuen’s mouth.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Gah! …Ah, damn it, it’s getting hard to talk again.”\u003cbr/\u003eAnd yet, he showed no signs of fear.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Violence shows you who people really are. The ones doing the beating, and the ones being beaten.” He closed his eyes and chuckled weakly. It was like he was provoking me, daring me to hit him as much as I wanted. “Ah, ahh…heh. Ha…this is probably fun, huh, Ayanokouji? You can afford to be cocky, with strength like that. You’re free. You can do whatever you want. Show me, Ayanokouji…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe opened his eyes. I hit him again, aiming for his already-swollen face. He was bleeding freely now, both internally and externally, and yet, I saw no fear in him. What should’ve been an intrinsic emotion was nowhere to be seen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Isn’t this enough, Ryuuen?” I proposed. But he wouldn’t accept that, of course.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh. What’s the matter, Ayanokouji? I haven’t given up yet. Come on, choke the life out of me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was goading me. All but handing his life to me on a silver platter. I took another swing, and his face contorted into an expression of pain for an instant.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ow…that hurts. But that’s all…just pain.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHis eyes hadn’t changed. He believed in losing the battle but winning the war. He had no doubts. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if you win today, I’ll keep coming at you, no matter how times it takes,” he taunted. “No matter where you are at school, I’ll find an opening and attack. And eventually, I’ll win.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe’d probably survived this long by making those sorts of comebacks. Even the strongest opponent wasn’t invincible. Ryuuen’s self-confidence seemed to be rooted in his ability to strike back at his opponents and find openings to hit them where it hurt. He used violence to fill their hearts with fear.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe fear that, once you’d made him your enemy, you’d never know when he’d attack again or how badly he might hurt you.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Go ahead. Enjoy this temporary delight. Your victory’s right in front of you, Ayanokouji,” he taunted. “This feels good, doesn’t it? It feels good to face off against a weaker opponent, doesn’t it? And lurking underneath that pleasure is…fear!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFear? Lurking underneath?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you want to win? Do you want to lose? What are you feeling, Ayanokouji?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eDo I want to win? \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eDo I want to lose?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you laughing at me now that you’re on top? Are you angry? Excited, overjoyed? Maybe frustrated? Tell\u0026#160;me!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had no idea what he was talking about. I couldn’t see my own face or read my own expression, but I was certain of one thing. Something this insignificant would never shake me. I felt no emotions, and definitely not fear. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI hit Ryuuen in the face again. I’d lost count of how many times I’d struck him at this point, but I kept going, punching him over and over as his face twisted in pain. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eYes, that’s it, Ryuuen. Now you see, don’t you?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe had to see, now, that the feeling known as fear certainly existed within him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI landed one last blow, more powerful than any before, and Ryuuen finally lost consciousness. He wanted to toy with my emotions. Unfortunately for him, there was nothing there. I had no heart for him to manipulate. \u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg width=\"100%\" style=\" top: 0px; vertical-align: top; height: 100%;\" alt=\"\" id=\"ClassroomElite-Vol7_INTERIORIMAGES_14_spread\" src=\"/hola-lector-agua/images/books/v7/OEBPS/Images/ClassroomElite-Vol7_INTERIORIMAGES_14_spread.jpg\" loading=\"lazy\" decoding=\"async\"/\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI slowly got off his limp body and stood. I couldn’t afford to leave Karuizawa out in the cold any longer.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry. I put you in a really difficult situation. Are you hurt?” I asked her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m…fine. I’m just cold. I’ve kind of lost feeling in some places…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI extended my hand toward Karuizawa, who’d sat there the whole time, watching the scene from beginning to end. When she took it, her fingers felt like ice.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you disillusioned with me now?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course I am. You betrayed me from the very beginning.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I suppose you’re right. So why didn’t you sell me out to Ryuuen?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For my own sake. That’s all there is to it,” she replied before collapsing into my arms, trembling. “I was scared. I was so scared!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t think about it anymore. What happened today, what’s happened so far. You can think about that stuff later. The only thing that’s for certain right now, in this moment, is that your curse has been lifted. Manabe…no, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eno one \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ewill dig up your past again. As for what’s to come, well, you can just keep going the way you always have,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa was depending on me to hold her body upright, perhaps because she lacked the strength to support herself right now. If I looked at things from her perspective, these had been a disastrous few months. She’d been bullied by Manabe and her friend through a stroke of bad luck, then been intentionally targeted for bullying as well. Finally, Ryuuen had dug up the scars of her past, and she’d realized it was all because of me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer spirit had to be shattered. She must be emotionally unstable, exhausted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve managed to overcome your past and create an identity as the person you are now,” I told her. “Starting tomorrow, you can just pick up where you left off.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was Karuizawa Kei we were talking. She could do it. I’d been sure of that from the moment I met her on the rooftop.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I hurt you. I won’t ask you to forgive me. But please remember just one thing. If something like what happened today happens again, I will come save you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kiyo…taka…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite everything she’d been through, Karuizawa couldn’t bring herself to stop clinging to me like a parasite. She’d reached a point where she couldn’t survive at this school without me around. No matter what happened, as long as I was here, she would endure.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wondered what would have happened if I’d showed up to save her earlier. I felt quite certain that if I’d fulfilled my promise more speedily, her dependency on me would only have grown stronger. Conversely, if I had never showed up at all, abandoning her to being bullied once more like she had in the past, it would have intensified her despair. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBy delaying my arrival and still ultimately showing up, though, I’d strengthened her belief that she could hold onto her faith in me till that last possible moment. At the same time, it had allowed me to ascertain that she wouldn’t easily betray me. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, if she \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehad \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003egiven Ryuuen my name, she would feel guilty, and I could manipulate that guilt in my favor. After getting my hands on a pawn like Karuizawa, letting her go would be a waste. How necessary she was to my plans was secondary; what mattered most was ensuring she stayed under my control.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A few steps below us, the student council president—well, the former student council president—and Chabashira-sensei are waiting. They know the circumstances to a certain degree, so they should be able to handle things, including taking care of your soaked uniform,” I told Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“O-okay. What about you, Kiyotaka?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve still got a few things to tidy up here. Besides, we don’t want to be seen together. It’s best if you go first.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI lightly pushed her back. Karuizawa left the roof, heading back down the stairs, and I assessed my next move.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right then…” I muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t just leave the four unconscious people spread across the rooftop where they were. Chabashira-sensei aside, it’d be bad if another teacher found them. Starting with Ishizaki, I gently slapped their cheeks to wake them up, saving Ryuuen for last.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tch…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Awake, huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you think this…is over, Ayanokouji?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s over,” I said. No matter how you looked at it, this fight had been decided. “Surely you’re not about to say you want to keep going?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll use any means necessary…to win,” said Ryuuen, slowly sitting up. “Even if it means…all-out war.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you going to report me to the school?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh. That would be really, really lame…but it \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eis \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ean option. What if I made it look like you set a trap for us?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let me give you some advice. I don’t recommend it. The former student council president is waiting on the stairs as we speak. He may not know all the details of what happened here, but it’s obvious you were the one setting a trap, Ryuuen…especially since you were caught on video spray-painting the surveillance camera. I, on the other hand, was at Keyaki Mall when you did that. I can produce many alibis as I need to prove it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was smart to have as much insurance as possible, after all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you could’ve had a third-party witness everything…but you didn’t?” Ryuuen demanded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. I knew you wouldn’t stop attacking me until I struck you at least once.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You seriously think I’m just gonna lay down and accept defeat?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I do. There’s a reason I defeated you, Ryuuen. You made a mistake choosing the order of your foes. If you’d cut your teeth fighting Ichinose, and then Katsuragi and Sakayanagi, you might’ve been closer to my level by the time you chose to challenge me. But your curiosity got the better of you. You overplayed your hand.” I didn’t sugarcoat my words.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen wore a bitter smile. “You sure are direct.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d like to say I’d be happy to have a rematch, but I’m done drawing attention from here on out. Target someone else,” I told him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d expected him to lash back at that, but instead, Ryuuen silently contemplated what I’d said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Since you deliberately had a witness keep his distance, that means you’re keeping that card in play to use against us in the future if you have to,” he said. “Even if it means admitting your identity and Karuizawa’s past.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d like to avoid that, but yes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And I wouldn’t be the only one going down if that happened. So would Ishizaki, Ibuki, and Albert, huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eProbably so. I wasn’t sure exactly what would happen to them, but it was safe to say it would involve a suitably harsh punishment.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your overconfidence in relying on my identity and Karuizawa’s past was your undoing. If you’d been less reckless, you would’ve either mounted a larger-scale attack or posted more lookouts,” I told him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In other words, Class C’s in trouble as long as I’m in charge, huh?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not necessarily. As long as you make no further attempts to attack us, I won’t use this incident to advance myself.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not naïve enough to take you at your word on that. If Class C ever corners you again, you’ll report what happened today to the school. Am I right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe,” I said. It was certainly true that I couldn’t promise him that. Who knew if Class C was even capable of functioning normally if they were forced to keep their heads down? “But what are you going to do? You can’t undo what happened, Ryuuen.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shut up. My fight with you is finished. My own battle’s over, too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen looked at Ibuki and the others, then took out his phone and typed something. He slid the phone across the roof, where it stopped by Ibuki’s feet.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?” Ibuki, who had been listening quietly to our conversation, glared at both of us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I take responsibility for everything,” said Ryuuen. “Before I do, I’m transferring all my points to you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Ryuuen, what are you saying? Are you nuts?” Ibuki cried.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yeah, Ryuuen-san! It’s not like anyone’s gonna blab about this,” Ishizaki babbled. “You don’t have to take responsibility!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNeither side could talk publicly about what’d happened here today, but Class D held an overwhelmingly advantageous position. Ryuuen realized that. There was only one way to cut his losses.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji, I’m the sole perpetrator of this incident. My expulsion should be enough, don’t you think?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh? That sounds serious. Taking responsibility and all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t be dumb,” snapped Ryuuen, wiping some more blood from his mouth. “A tyrant can only reign as long as his power holds meaning. If I’ve lost after coming this far, no one’s gonna follow me anymore.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass C had permitted his tyrannical behavior so far because he produced results. Ryuuen’s methods were aggressive and heavy-handed, but once beaten, he realized that he was no longer qualified to rule. I had to give him credit for that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt would seem I’d made the right decision by choosing to set this stage and let him go on a rampage.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Stop screwing around! Why would you entrust your points to me?!” demanded Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because you hate me. Divide the remaining points among everyone. Once the school expels me, I bet Katsuragi and Sakayanagi will void our contract, but there’s nothing to be done about that,” replied Ryuuen. If the person named in the contract dropped out of school, that was probably exactly what would happen, too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ryuuen-san, are you serious?!” exclaimed Ishizaki sorrowfully.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shut it. No need to shout, I can hear you just fine.” Ryuuen chuckled. “I’ll leave the rest to you. Later.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed his mind was made up. He stood, and approached the stairs, deaf to both Ibuki and Ishizaki’s final words to him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you sure? I think you’ll come to regret this,” I said, stopping him in his tracks.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why do you care?” he shot back.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you leave without knowing why you lost, you won’t grow,” I told him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you really fine with not knowing why you lost to\u0026#160;me?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let it go. There’s no point trying to save me. You’ve got nothing to gain by sparing me now that I know about you and Karuizawa. I could expose you at any time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“True enough. If I must name a reason for sparing you…it’ll work to Class D’s advantage to have you crush Sakayanagi and Ichinose for us. Besides, if your contract with Katsuragi remains in place, Class A will continue to hemorrhage points. Most importantly, though, if you suddenly drop out of school, Sakayanagi and Ichinose will assume that X beat you. That spells trouble for me down the line,” I said to Ryuuen. “So, trust me, this is to my benefit. Even if word of what happened up here gets out, I took no noticeable injuries. It would just look like you guys fought among yourselves, wouldn’t it?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen ignored me. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is what happened here,” he told Ibuki, instead. “I tried to punish the four of you for your failings, but you turned the tables and beat me up instead, then forced me to withdraw. I’ll leave it at that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are…are you really okay with that?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Allow me to add just one thing,” I said. “You are free to drop out of school of your own volition and you’re free to doubt me. But I have absolutely no intention of telling anyone about today unless you force my hand. The former student council president has similarly promised to keep it to himself. Nothing about this situation is forcing you to withdraw—but if you do, I won’t stop you.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then don’t stop me. I don’t trust you,” snapped Ryuuen. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith those words, he opened the door and vanished from sight. Ishizaki and Ibuki, left behind, looked like they didn’t agree with his actions in the slightest.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg height=\"100%\" style=\" top: 0px; vertical-align: top; height: 100%;\" alt=\"\" id=\"ClassroomElite-Vol7_INTERIORIMAGES_15\" src=\"/hola-lector-agua/images/books/v7/OEBPS/Images/ClassroomElite-Vol7_INTERIORIMAGES_15.jpg\" loading=\"lazy\" decoding=\"async\"/\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 6: Intersecting Thoughts\",\"volumeId\":\"v7\",\"chapterIndex\":12,\"prevChapter\":{\"volumeId\":\"v7\",\"chapter\":11,\"title\":\"Chapter 5: Time to Settle Things\"},\"nextChapter\":{\"volumeId\":\"v7\",\"chapter\":13,\"title\":\"Chapter 7: What Ryuuen Wins and Loses\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Title Page\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Ryuuen Kakeru’s Soliloquy\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: The Sound of Footsteps in the Middle of Winter\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: Reunions and Farewells\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: Insanity\",\"href\":\"Text/section-0008.html#auto_bookmark_toc_top\",\"index\":10},{\"label\":\"Chapter 5: Time to Settle Things\",\"href\":\"Text/section-0009.html#auto_bookmark_toc_top\",\"index\":11},{\"label\":\"Chapter 6: Intersecting Thoughts\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_top\",\"index\":12},{\"label\":\"Chapter 7: What Ryuuen Wins and Loses\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_top\",\"index\":13},{\"label\":\"Epilogue: Postscript\",\"href\":\"Text/section-0012.html#auto_bookmark_toc_top\",\"index\":14}],\"volumeTitle\":\"Light Novel Volume 7\",\"detailsLink\":\"/select/year-1/v7\",\"returnLink\":\"/select\",\"currentSpineIndex\":12,\"nextVolumeLink\":\"/select/year-1/v7.5\",\"nextVolumeTitle\":\"Light Novel Volume 7.5\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://classroom-of-the-elite-reader.vercel.app\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"COTE Reader\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"
