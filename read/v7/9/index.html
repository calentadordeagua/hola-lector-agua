style=\" font-size: 1.00em;\"\u003eIf I hadn’t gotten involved in Manabe and her friends’ bullying of Karuizawa, we would probably never have spoken. A gloomy loner like me and a popular girl like her were as different as night and day.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You hated being used by me, didn’t you?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yes, but…” Karuizawa was stumbling over her words more and more. The stretches of silence were getting longer. Best not to drag this out much longer.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think we’re done. Did you have anything you wanted to say?” I asked, pressing her to speak.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand.” She sounded unenthusiastic, but any response was good. Perhaps she’d accepted there was nothing she could do. “So, this is the last time I can talk to you like this, Kiyotaka?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you reluctant to stop?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course not.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then there’s no problem.” I said it flatly, without the slightest bit of emotion. Emotion had no place here. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess I’ll hang up then…” Even over the phone, I could tell Karuizawa was in the grip of some strong emotion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“See you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah…” Karuizawa seemed ready to say something, but only silence followed. After a few seconds, I hung up, erased my call history, and put my phone back in my pocket.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAttaching herself to me like a parasite must’ve given Karuizawa some peace of mind. Coldly pushing her away like this had undoubtedly left her very shaken. The anxiety and loneliness I sensed from her on the phone would probably continue to intensify. If Ryuuen came after her when she was like this, then… \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was almost guaranteed that she would crumble.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well. I took a few detours, but I’m finally back where I was when I started school, huh?” I said to myself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita, Karuizawa, Ryuuen, and Sakayanagi were now irrelevant to me. I didn’t care about them. I probably wouldn’t push myself in any tests going forward, either. If there were any loose ends left to tie up, they didn’t matter, though they might require my collaboration. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI gave the red charm to the second-year students’ dorm manager and went home.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e3.7\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003ePICKED UP THE DAMP CLOTH\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I’d been using to mop up dirt and dust, and threw it in the garbage bag. After washing my hands, I sat on my bed, listening to the creak of the springs. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince it was December, I decided to use the weekend for some end-of-year cleaning. I wasn’t much of a packrat, so it only took about half a day to finish everything. Had I managed to return my room to the pristine condition it was in when I first moved in? \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A clean room’s such a great thing,” I muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI turned on my teakettle, thinking that I would take a little breather. I was somewhat hesitant about using the sparkling cup I’d just cleaned, but there was no other option. Deciding to sort out my future while the kettle boiled, I took out my phone and accessed the school app, scrolling aimlessly through things like class points and personal balances.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLet’s start at the beginning.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhy had I enrolled at this school in the first place? So, I wouldn’t have to return to my old environment. It wasn’t that I was particularly dissatisfied with the White Room, though it was quite problematic from a human-rights perspective. Still, you could receive the best possible education there, and it was that education that had shaped my personality and abilities. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, even after my father praised me as his greatest masterpiece, I’d felt a discontentment that I couldn’t put into words. Even if I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewas \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ethe most superior human specimen that existed… was that really something to be proud of?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was because I’d lived my life believing there was always something more to learn that I considered learning to be meaningful. So, what happened when there was finally nothing left to learn? Life would be horribly boring, wouldn’t it? \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, to tell the truth, I didn’t care about all that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI needed to consider what I should do from here on out. I had always known that my father would contact me someday. I’d been prepared for it from the moment Chabashira-sensei insinuated that she would get me expelled, though even then, I’d had my doubts about whether she spoke the truth. If my father really came for me, Chabashira-sensei couldn’t stop him. He wasn’t the kind of foe someone like a class teacher could thwart. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut, knowing my father, I couldn’t be sure. So, I did as she said, putting on the appearance of cooperation, devising strategies to help us rise to Class A.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe kettle started to whistle. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaving come this far, I’d established that Chabashira-sensei’s words to me had been full of lies. Ironically, given that it had all revolved around my father, she turned out to have no connection to my father at all. Whatever history or trauma she carried with her had left her transfixed by the idea of making it to Class A, just like Horikita or Keisei… no, if anything, Chabashira Sae was even \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003emore \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eobsessed with the idea. She would never have the courage to actually expel me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eInitially, I might have thought her actions proof of her willingness to be self-destructive if necessary. Until we closed the gap with the test on the uninhabited island, Class D had been in a pretty bad place. A place that made it hard to cling to hope. Chabashira had mixed lies with the truth to manipulate me, but now, I’d seen through the lies hidden within the truth. With her true colors revealed, she had no power to order me around anymore.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf my goal was to spend three ordinary years at this school—whether that be in Class D or Class A—I had no reason to dig myself in deeper by trying to help the class. People like Ichinose and Sakayanagi had started to take an interest in me, but if I stepped back now, that interest would fade.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe one remaining problem was Ryuuen Kakeru. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf he did figure out that I was Class D’s secret mastermind, he might create an uproar by circulating that information. It would have been ideal for my identity to remain completely concealed, though that seemed impossible now. Even if I cut all ties to Karuizawa Kei, we were still bound by an invisible thread. If I left things the way they were now, someday, beyond a shadow of a doubt, Ryuuen would find that thread. Would it take a week? A month? A year?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat uncertainty was what troubled me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe kettle whistled and shut itself off. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Guess I’ll have some tea.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy cabinets overflowed with teabags, since I used to have all kinds of visitors stopping by. I’d amassed an extensive range of supplies, from coffee to black tea to green and roasted tea. Just as I put a black tea bag into my cup, someone buzzed me from the first floor. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA classmate would just have rung my doorbell. Who could this be? I went to check the screen and found myself looking at a surprising face. I could’ve pretended not to be home, but I opted for honesty. After all, this was someone I’d been thinking about going to see myself, and he’d come all the way out here.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d like a moment of your time. Or should I come back later?” my visitor asked through the intercom.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah, now’s a good time,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was Horikita’s older brother, who’d been student council president until recently. What an unusual visitor. I buzzed him into the building, and poured boiling water into my cup while I waited. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSoon after, the doorbell rang.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d prefer to speak privately, so please come in,” I told\u0026#160;him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I agree.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Horikita saw her brother and I chatting in the hallway, she’d cause a fuss. Besides, I wanted to avoid being seen with the former student council president as much as possible. I let Horikita’s older brother into my room.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe older Horikita noticed my tea as soon as he entered. “I just thought I’d make myself something to drink,” I told him. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For a first year, you keep your room quite clean,” he\u0026#160;said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just don’t have that much stuff.” I decided not to tell him that I’d cleaned my room today. Of course, he probably deduced as much from the garbage bag full of damp paper towels. “To come all the way to the first years’ dorm… Do you have business with me, former student council president?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The second semester ends next week. My time at this school is running out.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTrue. He had a little over two months left. It’d be over in the blink of an eye.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s something I wanted to tell you before I leave. About Nagumo Miyabi.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo Miyabi was a second-year Class A, and the current student council president. I’d only exchanged pleasantries with him at the sports festival, but he seemed like an intense person. Whatever he was, though, it had nothing to do with me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t imagine what you have to say to me,” I replied. “I’m not part of the student council like Ichinose.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t intend to discuss this with anyone. However, circumstances have changed. I’ve adhered to this school’s traditions because I believe in its system and rules. Nagumo wants to uproot those foundations. Most likely, an unprecedented number of students will be expelled next year.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo had yet to take any overt actions, but I supposed it was just a matter of time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You were already student council president when Nagumo was a first year, right? Doesn’t that make you responsible for bringing him in?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You might say that.” Horikita’s brother made no attempt to deny it. “I made one mistake after joining the student council. I failed in training my successor. Nagumo was the only one I believed had potential, but his ideologies differed from mine. Now, he’s managed to bring almost all the other second-year students under his\u0026#160;sway.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s odd. I understand Nagumo controlling everyone in the second-year Class A, but to the other classes he’d be an enemy, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He’s already won over the entire school.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHuh. I didn’t know what this guy was doing, but apparently it was pretty crazy.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Two first years applied for student council positions this year: Katsuragi and Ichinose. They’re both talented students with a lot of promise, but I decided not to admit them, precisely because of their talent. I was concerned Nagumo would snatch them up. However, Nagumo worked behind my back to establish contact with Ichinose, eventually forcibly adding her to the student council.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why are you giving me all this insider information?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you don’t want to draw attention to yourself, use Suzune as you’ve done in the past. It’ll be fine. I’ll be the bridge between you and the student council,” he told\u0026#160;me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is a pretty absurd request. If you were on the student council, your little sister would happily join, but she’s probably not interested now that you’ve stepped down. Besides, irrespective of what Horikita does, I have no wish to get involved.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI waited a few moments, then took a sip of my tea.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Traditions change, even the ones you staunchly uphold. That’s just how the passage of time works, isn’t it?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was a lot about this conversation that I still couldn’t grasp, but a picture was beginning to form. Horikita Manabu, now reduced to an ordinary student, wanted to derail the student council’s plans. And he wanted to use me to do it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You might be right.” He must’ve known he couldn’t cajole me into helping him, but perhaps the elder Horikita was so desperate he’d swallowed his pride and come here. “Forgive me for bothering you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Would you mind at least giving me your contact information?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI unplugged my phone from its charger. “I’d like time to think about putting your little sister on the student council and manipulating her behind the scenes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’ll consider it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You came here despite the assumption that I’d refuse, huh? It’d be rude if I didn’t at least think it over,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy unexpected reversal must’ve surprised the elder Horikita, but he gave me his phone number without asking for anything in return. That alone was proof of how closely he intended to watch Nagumo Miyabi’s student council.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I decide to cooperate, I’ll contact you,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I expect nothing, but I’ll be waiting.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita’s brother left my room without taking tea or even sitting down.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I really don’t think there’s any need to be that hung up on the student council, though,” I said out loud to myself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if I put myself in the shoes of someone who was about to graduate in a couple months…there wasn’t much I could do about the situation, here. Still, I was now slightly concerned.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e3.8\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE FIRST SNOW\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e of the season arrived late Saturday night. It was just a dusting, and melted at dawn, leaving puddles of water on the concrete. Despite the fact that it’d snowed the day before, the high temperature for the day was seventy-five degrees, close to summer. It was so mild you could even go out in short sleeves.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, the second semester’s finally going to be over next week, huh? Wow, it’s barely felt like any time at all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOn Sunday morning, I went to check how Akito was doing with his club. Then we hung out at Keyaki Mall with the rest of the Ayanokouji Group until evening. We shopped, chatted at the café, got some lunch and hit up a karaoke room. It was a good day, and I enjoyed it doing ordinary things that ordinary students did.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“By the way…ahem. Ah, my throat hurts.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Singing five songs in a row is really overdoing it, Yukimuu. Still, you’re surprisingly good. I was shocked,” said Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My throat hurts because of the punishment game, not the singing.” Keisei scowled at her. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was a variety of food at the karaoke place, some of which was designed to use in games of chance. For example, the takoyaki came as six pieces, one of which was extremely spicy. Whoever got the spicy one had to sing immediately after eating the whole piece, and additionally, wasn’t allowed to drink water until they were done singing. I didn’t quite get the point of it, but we all had a blast, so it clearly fulfilled some kind of purpose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHilariously, Keisei drew the spicy takoyaki a couple times in a row. We decided to see just how long his streak of bad luck could go, which turned out to be \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003efive\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e times. The exact probability of that happening was one in 7776.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So unlucky…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“On the contrary, doesn’t that mean you’re really lucky?” asked Haruka. “Think of it like you used up all this year’s bad luck at once. You’ve probably got lots of good stuff awaiting you for the rest of the year.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’re only two weeks until the year ends! You did this on purpose, Haruka.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, sorry.” Haruka clutched her stomach and laughed out loud, but still apologized. “They were really that spicy?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought I might start breathing fire. I know they said ‘spicy,’ but there has to be a limit. Come on.” Keisei was still sticking his tongue out from the lingering heat. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, I saved you from the last one. It \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewas\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e seriously spicy,” said Akito. He’d ended that particular hot streak.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s do this again next time we go to karaoke,” said Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone, Airi included, looked aghast at her proposal. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, but you might draw the spicy takoyaki, too,” I\u0026#160;said. “You know that, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know, I know. I’m not gonna wimp out after suggesting we all do it again,” said Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You sound pretty confident in your spice tolerance,” I\u0026#160;said, trying to probe the apparent confidence she always had on show.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, have I been found out?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t think you were hiding anything…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can even eat super-ultra-spicy ramen without breaking a sweat. I actually kinda like it, you know?” she said. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, now I felt like we didn’t have a level playing field for this game.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder whether I can eat that stuff at all?” said Airi, who’d been anxious even before the game started.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry, don’t worry. If it’s too spicy, you can just spit it out. We’re not gonna force you to eat anything,” said Haruka. Certainly right. Akito and Keisei probably wouldn’t force Airi to do anything she didn’t want to, either. “Anyway, I already said this about Yukimuu, but you’re a good singer, Airi. Was that really your first time at karaoke?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yeah. It, um, was really embarrassing, though.” Even though she’d been painfully shy, Airi had given it her all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you gave it a little more oomph, it’d be perfect.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg height=\"100%\" style=\" top: 0px; vertical-align: top; height: 100%;\" alt=\"\" id=\"ClassroomElite-Vol7_INTERIORIMAGES_6\" src=\"/hola-lector-agua/images/books/v7/OEBPS/Images/ClassroomElite-Vol7_INTERIORIMAGES_6.jpg\" loading=\"lazy\" decoding=\"async\"/\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe headed back to the dorms. It wasn’t even five o’clock yet, but the sun was already setting.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It was really warm today,” said Airi. “Everyone’s out in pretty light clothing, huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You could even walk around in short sleeves this afternoon, so that makes sense.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not good with the cold,” said Haruka, sounding melancholy as she looked up at the sky.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t handle it well, either.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, a little chilliness is good for me. It means I don’t sweat during club, which makes practicing easy,” said Akito, making him the only member of the group to prefer the cold.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks like it’s going to get cold again tomorrow.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Guess that means I need to buy some stuff to prepare…that’s going to cost me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOur pace gradually slowed to a stroll as we walked and chatted. Then, we heard a voice.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you for going out with me today, Sakayanagi-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, no, no. The pleasure’s mine.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTurning, I spotted a rather unusual pair: Ichinose and Sakayanagi. Ichinose, noticing our group, raised her hand and waved. Sakayanagi didn’t look in my direction, but rather, gave our entire group a cursory glance as we went past. Even though she’d made what amounted to a declaration of war against me, she’d done nothing since the sports festival. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s unusual to see you in this group, Ayanokouji-kun,” Ichinose said. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really?” She thought \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e was behaving unusually? The strange sight was the Class A and B leaders hanging out together like friends on a day off.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, based on what I’ve seen, you’re with Horikita-san a lot of the time. This is different,” said Ichinose, taking a long look at our group’s members. “That reminds me. I heard that you won against Class C in the exam. Congrats! We lost to Class A, unfortunately.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Only by a slim margin. Two points. I think we were just about evenly matched,” said Sakayanagi. The battle had been close, and it seemed Class B was just barely lagging behind Class A by the end. “With this win under your belt, Class D might actually become Class C next semester, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow! Class B’s going to have to be really careful, or we might get overtaken ourselves!” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We do intend to overtake you,” Keisei interjected, overtly serious as always. “We’ll make it to Class A eventually.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi closed her eyes and chuckled. Keisei seemed to find that insulting, but he had to remember that we were still Class D for now. No one in our group was especially close to Ichinose, and since we weren’t really the type to force smiles or engage in small talk, the conversation ground to a halt. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, sorry. Guess we’re bothering you guys. See you later,” said Ichinose graciously.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi neither spoke to me nor made eye contact, just followed Ichinose away. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They’re rivals, right? Those two?” asked Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no doubt they’re enemies.” Keisei eyed them both suspiciously, pushing his glasses up. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s just like Ichinose, though, right?” It was a well-known fact that Ichinose could make friends with\u0026#160;anyone. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s just, like, how do I put this?” muttered Airi. “It’s like Ichinose-san lives in a different world from us or something.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As a fellow woman, I kinda don’t like her.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What? Do you dislike Ichinose, Haruka?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edislike\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e her, it’s just…she’s way too perfect at everything. You can’t be human without at least a couple flaws, right? I sorta almost hope that she’s actually rotten on the inside.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You have a point. She’s so flawless it’s almost creepy. Saying you hope she’s rotten inside is going a bit too far, though,” said Akito.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s true. I’m just saying that being flawless and totally sweet is boring, even in a manga,” said Haruka. She thrust her hands inside her pockets as she watched Ichinose walk away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I…I think it’s good that she’s like that, though. If Ichinose-san really was a bad person like Haruka-chan said, no one would believe it,” said Airi. She sounded anxious, as if she really didn’t want that to be true.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess so. Maybe there really are unbelievably kind, perfect people in the world. We may just not even know them when we see them,” said Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re going to make it to Class A. When that happens, Ichinose will be our enemy. I think it’s best if we don’t get too close,” said Keisei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe had a point. If Ichinose \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewas \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eas kind and benevolent as she seemed, it would make her a tougher opponent to oppose. Someone as awful as Ryuuen inspired no sympathy, but I wondered whether our class would have the heart to crush Ichinose if it came to it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf our class was promoted, more conflict down the road was inevitable. We’d be attacked from below by Ryuuen and the newly demoted Class C, who’d be raring for revenge. It was unclear what would happen to Horikita and Ichinose’s currently cooperative relationship in the future, too. In an ideal world, we’d work together with Ichinose to attack Class A. Then, once Classes B and D were promoted to Classes A and B respectively, we’d end our alliance and turn on each other. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, I doubted that things would be that simple.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks like the road ahead is strewn with pitfalls, huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg height=\"100%\" style=\" top: 0px; vertical-align: top; height: 100%;\" alt=\"\" id=\"ClassroomElite-Vol7_INTERIORIMAGES_7\" src=\"/hola-lector-agua/images/books/v7/OEBPS/Images/ClassroomElite-Vol7_INTERIORIMAGES_7.jpg\" loading=\"lazy\" decoding=\"async\"/\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 3: Reunions and Farewells\",\"volumeId\":\"v7\",\"chapterIndex\":9,\"prevChapter\":{\"volumeId\":\"v7\",\"chapter\":8,\"title\":\"Chapter 2: The Sound of Footsteps in the Middle of Winter\"},\"nextChapter\":{\"volumeId\":\"v7\",\"chapter\":10,\"title\":\"Chapter 4: Insanity\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Title Page\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Ryuuen Kakeru’s Soliloquy\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: The Sound of Footsteps in the Middle of Winter\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: Reunions and Farewells\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: Insanity\",\"href\":\"Text/section-0008.html#auto_bookmark_toc_top\",\"index\":10},{\"label\":\"Chapter 5: Time to Settle Things\",\"href\":\"Text/section-0009.html#auto_bookmark_toc_top\",\"index\":11},{\"label\":\"Chapter 6: Intersecting Thoughts\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_top\",\"index\":12},{\"label\":\"Chapter 7: What Ryuuen Wins and Loses\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_top\",\"index\":13},{\"label\":\"Epilogue: Postscript\",\"href\":\"Text/section-0012.html#auto_bookmark_toc_top\",\"index\":14}],\"volumeTitle\":\"Light Novel Volume 7\",\"detailsLink\":\"/select/year-1/v7\",\"returnLink\":\"/select\",\"currentSpineIndex\":9,\"nextVolumeLink\":\"/select/year-1/v7.5\",\"nextVolumeTitle\":\"Light Novel Volume 7.5\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom
