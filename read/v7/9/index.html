"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T28e8b,"])</script><script>self.__next_f.push([1,"\r\n\u003cp id=\"auto_bookmark_toc_top\" class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 3:\u003cbr/\u003eReunions and Farewells\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003e“W\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHAT’S UP\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e with those guys?!” Sudou grumbled irritably as he walked into our classroom the next day, bypassing his seat and approaching Horikita. The look on his face made it immediately clear that he was extremely pissed off. “Hey. You got a sec, Suzune?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s the matter?” Horikita couldn’t exactly ignore him when he cornered her at her desk.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Those jerks from Class C! That Ryuuen guy and his lackeys. They’ve been followin’ me since this mornin’, trying to pick a fight. They even blocked my way in the hall. They’re seriously getting on my nerves!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You haven’t shouted insults or taken swings at them, have you?” asked Horikita. She gave Sudou a slight glare, prompting his immediate answer.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t, no way. I completely ignored ’em.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. It seems you followed my instructions perfectly, then,” replied Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s she talking about? What instructions?” I asked Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, Suzune told me that whenever I run into something I can’t deal with properly, I should just ignore it,” said Sudou. That was certainly sound advice. If Sudou rebuked the Class C students, it would probably only add fuel to the fire, so to speak. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I guess I did bump their shoulders a little when I forced my way through,” he added. “The students from the other classes knew I was boxed in, so there shouldn’t be anything to worry about, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think they’d try anything, no,” said Horikita. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey’d already gotten the school and student council involved once before, and it had caused an uproar. If Sudou punched someone, that would be bad, but if he just pushed his way through, it should be fine.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what did they say to you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They called me a monkey, an idiot, childish stuff like that. They were tryin’ to start a fight.” \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSmack!\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Sudou pounded his fist into his palm. I wondered whether this was a continuation of Class C’s plans, like when they’d appeared at the archery club yesterday.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Some Class C guys also tailed Akito—I mean, Miyake,” I told Sudou and Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Miyake-kun? It seems Class C’s quite active these days,” Horikita replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you think they’re plannin’ on staging another fight, like that time they tried to get me in trouble?” asked Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who knows? I can’t say at this point. But I’ll consider countermeasures, just in case. If they happen to approach you again, make sure you don’t get physical,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand. I ain’t gonna break my promise to you. Even if they start throwin’ punches, I’ll stay calm,” said Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe sounded much more mature now, and Horikita seemed to believe what he said. After Sudou finished giving his report, he returned satisfied to his seat and casually started a conversation with Ike and Yamauchi. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWatching him, Horikita spoke up. “I wonder if Sudou-kun’s finally become a normal, well-adjusted person,” she\u0026#160;mused.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah,” I replied. “His speech is still a little crude, but that’s fine.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It looks like it’s time for him to take the next step.” With that cryptic comment, Horikita got a notebook and started scribbling something down.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you talking about? What next step?” I asked. When I tried to sneak a peek at her writing, Horikita quickly closed the notebook.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s a topic for another time. Besides, we have more problems than just Sudou-kun right now,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t know what she meant, and honestly didn’t care. Lately, Horikita had thought and acted independently of me with increasing frequency. She’d gotten better at communicating with Sudou, Hirata, and the others, too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At any rate, Ryuuen-kun’s been a busy bee—we only just got done with the Paper Shuffle,” she continued. “I wonder what he’s plotting now?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There aren’t any exams in the immediate future,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Think back to the time they attacked Sudou-kun. Now, it seems as if Ryuuen-kun’s plotting against Ichinose-san and Class B. He apparently likes challenging his enemies when no exams are involved,” said Horikita. She shot me a withering look, as if to say, “Don’t you already know that?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI pretended not to notice and shrugged the look off. “I wonder what he’s after this time?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you really not know? Or are you just pretending?” Horikita asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He’s looking for the person controlling Class D from behind the scenes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In other words, he’s looking for you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita pinned me with an intense glare. “You can’t use me to hide from Ryuuen anymore.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What makes you say that?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If he thought I was the puppet master, so to speak, he would approach me directly. But he hasn’t done anything of the sort,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Perhaps your strategy during the Paper Shuffle was more effective than he expected? He might be moving more carefully this time. Taking a while to remove the obstacles in his way first,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder. I don’t think that’s it, though. It’s more like he lost interest in me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Does this mean you miss Ryuuen’s attention?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Does that mean you want me to kick you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I do \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003enot\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e want to be kicked.” She was definitely the kind of person who would actually kick me, too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe our class’s clandestine leader foolishly called attention to himself? Play dumb if you like, but do you really want to discuss this here and now?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was just before homeroom, and all our classmates, Kushida included, sat at their desks. It didn’t seem as if anyone was listening in, but this wasn’t a conversation we could risk having overheard. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At any rate, you apparently understand Ryuuen quite well. I’m not teasing. I mean it,” I added quickly, because Horikita glared at me again.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“His modus operandi has remained essentially the same. If he plays the same tricks over and over, I’m going to learn from it, even if I don’t like it. That’s how I predicted that he’d use Kushida-san during the Paper Shuffle. Of course, it goes without saying that I would’ve preferred that \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003enot\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e happen, but…” Horikita trailed off. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo one liked a traitor. Horikita was probably thinking that we wouldn’t have had to struggle quite so hard if Kushida hadn’t betrayed us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Ryuuen had felt secure precisely because of the internal threat Kushida posed. For better or for worse, Kushida allowed us to see our enemy’s attack patterns.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That wasn’t Ryuuen-kun’s only miscalculation. I intended to pull the rug out from under him during the Paper Shuffle,” Horikita continued.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Isn’t that what actually happened, though?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. Honestly, some of Class C’s lowest-scoring students should’ve been expelled, but that doesn’t seem to be the case.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf you could get your hands on a complete set of questions and answers, then there was no need to study. Horikita was saying it wouldn’t have been surprising for some students from Class C to be kicked out of school after having let their guard down. Keisei and the others seemed to think the same thing.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Class C must have some smart people, right? Students acting in support roles for their classmates, unlike Ryuuen,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose so. If they’re putting in that much effort, they’re doing a good job,” said Horikita. “At any rate, I imagine his tricks will only escalate from here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not my problem. It’s yours.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know that. Being your decoy seems to be my fate in\u0026#160;life.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You sound surprisingly accepting.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because I have no choice but to accept it. It’s not like you’re going to quit now, are you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis optimism wasn’t a bad thing. Horikita was perceptive. She had quite a lot of potential. If she improved her communication skills to Hirata’s level, she could stand among the ranks of the elite.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what’s your plan?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For what?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you have a strategy to counter Ryuuen-kun’s hunt to expose you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nope.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There you go again.” She huffed, looking irritated. “Let’s change the topic. Are you still participating in those meetings?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Meetings? You mean, with Keisei and the others? Is there some kind of problem?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t imagine there’s much benefit to being in \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e clique. That study group formed specifically to help Hasebe-san and Miyake-kun in certain subjects, correct? Now that the exam’s over, it’s no longer necessary.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not about necessity. I just feel at ease when I’m with them,” I answered. Horikita’s life revolved around her quest to ascend to Class A. It was all she ever talked about. Since I didn’t share her enthusiasm on that front, I had little reason to hang out with her the way I did with Keisei and the others. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Horikita ever came to talk to me about something that wasn’t a class problem, then maybe, I could engage with her the same way I did with Keisei and the others.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Will you cooperate with me?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I will. As much as I can,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe didn’t look very convinced.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e3.1\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eO\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eUR LAST MORNING CLASS\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e ended, and it was lunchtime. As I pondered meeting up with Akito and Keisei, Horikita stared at me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What? Did you want to continue our talk from this morning?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. I have a request.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If it’s a hassle, I’m going to pass.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It shouldn’t take much time.” Horikita reached into her bag and took out a library book. “Didn’t you say last week that you wanted to read this?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFarewell, My Lovely\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, huh?” A masterpiece by Raymond Chandler. I’d been interested in it for a while now, but the book seemed strangely popular, because it was always checked out. I’d given up on borrowing it. “I’m impressed that you managed to snag it from the library. Are you offering to lend it to me?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTechnically, Horikita should’ve returned it so it could go to the next person on the waiting list. But this seemed like the most reliable method of getting my hands on it, underhanded though it may have been.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’d like. It’s also due back today. I was hoping you could take it to the library for me, then check it out for yourself,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is this because you don’t want to go to the trouble of returning it?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if I returned it myself, you’d still need to go to the library to borrow it. From a purely efficient standpoint, this is the correct course of action,” she replied. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTrue enough. This just saved Horikita the time and effort of having to return the book herself. You needed a student ID card when you wanted to check out a book, so trying to check out a book in someone else’s name would be impossible. On the other hand, you didn’t need to present anything if you were simply returning a book.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you refuse, I’ll just head over to the library. I don’t know when you’ll be able to get your hands on this incredibly popular book that’s in such short supply, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wondered whether this was Horikita’s warped way of showing kindness, since she knew I wanted to read the\u0026#160;book.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fine. I’ll take it,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you.” Horikita handed it to me. “I don’t care when you return it, as long as it’s sometime today. If I hear that it’s overdue, I’ll be coming for you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know.” I hadn’t borrowed a book from the library before, but I understood the process. If a book was overdue, private points were deducted from your account. “Well, there’s no time like the present. I’ll just go now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e3.2\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE LIBRARY WAS\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e surprisingly empty at lunch, like a cozy little hideaway. Students weren’t allowed to eat in here, so only a few people were around, guaranteeing that the return process would go smoothly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Since I’m already here, I might as well check out another book,” I muttered to myself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFarewell, My Lovely\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e in one hand, I walked over to the mystery section, hoping to find another of Raymond Chandler’s works. As I arrived there, I saw a lone female student struggling to grab a book on a high shelf. It was \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWuthering Heights,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e by Emily Brontë. A masterpiece penned by the middle of the three Brontë sisters, all of whom were literary legends. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA conventional blurb could make that book sound like a mystery, but wouldn’t it have fit better in the romance section? \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWuthering Heights\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e was perched at a strange angle, just barely within reach, which might be why the girl wasn’t using the stepstool. I stood in front of her and grabbed the book.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, I don’t mean to butt in, but…” I looked at her and trailed off. “Wait a minute. You’re from Class C. You’re…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShiina Hiyori. I’d seen her with Ryuuen a short while ago. It seemed that she recognized me, too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re Ayanokouji-kun, right?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. Uh, here you go,” I said, handing her the book.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you very much.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg height=\"100%\" style=\" top: 0px; vertical-align: top; height: 100%;\" alt=\"\" id=\"ClassroomElite-Vol7_INTERIORIMAGES_3\" src=\"/hola-lector-agua/images/books/v7/OEBPS/Images/ClassroomElite-Vol7_INTERIORIMAGES_3.jpg\" loading=\"lazy\" decoding=\"async\"/\u003e\u003cspan style=\" font-size: 1.09em;\"\u003e \u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you like her work? Brontë?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t really like or dislike the book. It was in the wrong section, so I thought I’d return it to its proper place,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“By the way, that book you have—\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFarewell, My Lovely\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, right? It’s wonderful,” said Shiina. Her eyes started to sparkle.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I managed to borrow it from a friend of mine today.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, that’s lucky. It seems as though Raymond Chandler’s quite popular among the second-year students. I’ve been wanting to reread it myself, but I wasn’t able to find a copy today.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess it was bad of me to borrow it from a friend,” I\u0026#160;said apologetically.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s all right. I’ve already read it. Besides, I was fortunate enough to find another good book while I searched for that one. The school library’s quite large. If I tried to read everything on its shelves, I’d probably graduate before I could finish,” said Shiina. She clutched Brontë’s book, a small smile on her face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. You’re probably right. Sorry for disturbing you, by the way.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe’d come here during the lunch break instead of eating, so she probably didn’t want to waste time chatting to a student from another class. I decided to leave her be.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you just came to return \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFarewell, My Lovely\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e and then borrow it for yourself, you could’ve done that at the service desk. Are you looking for another book to check out?” Shiina asked, stopping me in my tracks.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought I’d come back and try another time, so…” I replied. Shiina was already scanning the mystery section. “Hey, what are you doing?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Have you already read Dorothy L. Sayers?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. I’ve read Christie, but not Sayers.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, I would most definitely recommend \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWhose Body? \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat’s the first book in the series featuring Lord Peter. If you read that book, you’ll inevitably want to read the rest.” She pulled several books from the shelves and handed them to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh…” Her behavior left me puzzled. I struggled to figure out how to respond.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry, I was rambling. Am I bothering you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No,” I told her. “I was just a little surprised. Since I’m already here, I might as well grab some more books.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure.” Shiina looked extraordinarily happy. She smiled so widely that her eyes scrunched up. “The lunch break isn’t over, right? Would you like to eat with me?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was even more bizarre than a book recommendation. It was probably safe to assume that Ryuuen had told Shiina to ask me this. Still, whether I accepted her invitation or not, her impression of me was unlikely to change. I’d make sure that she saw me as neutral and unreadable.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No one in Class C likes reading, so I don’t really have anyone to talk to,” she added. Perhaps the silence was getting awkward. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Won’t this cause trouble?” I asked. “Class C is currently hunting someone in Class D, right? I feel like I’m on the list of suspects.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShiina had probably heard that either Keisei or I were likely candidates for the person pulling Horikita’s strings. It was very likely that was why she was trying to talk to me now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn some ways, Shiina Hiyori was even creepier than Ryuuen. She was a completely unknown quantity. I might be able to extract some information about her by using Karuizawa, but that was too risky, now that Karuizawa was Ryuuen’s target. Keisei, Haruka, and Horikita, of course, were all poor spies. I could try to use Hirata, but he was fundamentally neutral. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please don’t worry. I just play along so that Ryuuen doesn’t bother me. I’ve never been interested in conflict. Or is it that you think talking with me will be a problem on its own?” Shiina asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, not really. I have no personal issues with you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m glad. I wouldn’t want our classes to clash over something so trivial. I’d prefer we all get along,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Clash,” huh? Considering that this school was designed to foster competition, her hopes were doomed to failure. Still, most students acted as if this were a normal high school. Hirata and Kushida, for instance, were popular because they showed no favoritism in how they interacted with classmates. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, should we go? Time is wasting,” said Shiina.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let me head to the service desk and take care of these first,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWho could’ve predicted this would all result from a simple library visit?\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e3.3\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 3.00em;\"\u003eS\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHIINA AND I\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e made our way to the cafeteria. It was twenty minutes into our lunch break, and the room was packed. Most students were eating, though, so hardly anyone was in line to get a meal ticket. I chose the daily special, but Shiina seemed unable to come to a decision. Her finger hovered over the buttons, and she looked at all the options carefully.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, sorry…” she said. I waited another two minutes. Finally, she ended up choosing the same meal I had. “Sorry. I’m so indecisive.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No worries. It’s not like there was anyone in line behind us.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter we turned in our tickets, two meals were placed on the counter. Shiina struggled to adjust her schoolbag to take her tray. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your bag’s in the way,” I said. “Here, let me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh no, I couldn’t bother you with it…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry about it. You don’t want to fall and drop your tray.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry.” She handed over her bag, which turned out to be quite heavy. Did she carry all her textbooks in it? “It’s a lot, isn’t it? Thank you very much.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe avoided the crowds, found some empty seats, and sat across from one another, slowly tucking into our late\u0026#160;lunch.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you usually eat in the cafeteria?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. I usually buy lunch from the convenience store in the morning and then eat in the classroom. Do you come here often, Ayanokouji-kun?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Convenience store food isn’t my favorite. Food tastes best when it’s freshly made.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShiina used her chopsticks to elegantly raise a morsel of food to her mouth. I watched her in admiration. She handled her chopsticks with such grace.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm, I see. The cafeteria food certainly is delicious, isn’t it? I’ll keep that in mind,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This isn’t your first time eating here, is it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks like I’ve been found out.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was thinking that that might be the case, since you struggled to choose at the ticket machine.” We were at the end of our second semester. It was rare to see a student who’d never used the cafeteria.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve always wanted to try it, but if you miss out on your initial chance to do something, you kind of drag your feet, don’t you? I figured this was a good chance to go,” Shiina said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI understood those feelings. You didn’t want to let people see that you didn’t know how to do something they could do, after all. Pride made you cautious, like when I was reluctant to buy drip coffee at the convenience store. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Does that mean you’ll come here again?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShiina and I continued to talk while we finished our lunches. Since we’d come in late, most other students finished and left before us. A few hung back to chat idly, or to take their time savoring their food. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShiina placed her bag on the table with a \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethunk.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e “I\u0026#160;think I’ll head back to the library. Have you read any of these before, Ayanokouji-kun?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWilliam Irish, Ellery Queen, Lawrence Block, and Isaac Asimov. “Wow. You’ve got good taste.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know them?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. I like mystery novels.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that so?” Shiina laughed and clapped her hands. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI suddenly realized that there was something off about the books. “Wait. These aren’t from the library, are they?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They’re from my personal collection. I’ve been walking around with them, hoping I’d meet someone who shared my tastes and would want to borrow them. I\u0026#160;started out just carrying one, but I suppose I accumulated more and more books while waiting to find that certain someone,” Shiina explained.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that so?” This girl was definitely…odd.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please, don’t hold back. Take whichever you’d like.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well… I suppose I’ll check out Ellery Queen, since I haven’t read any of his.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Go ahead.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Shiina was acting, this was quite the performance. I\u0026#160;got the feeling she just genuinely loved books. I’d made a strange connection in a rather strange place. I would remain wary, of course, just in case this was a Class C plot, but it really felt like a coincidence. After I promised to return the books, the bell rang, signaling the end of our lunch break.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e3.4\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eFTER CLASSES FINISHED,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I got the customary ping from my group chat. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eCome to Keyaki Mall if you can. Usual spot.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e A casual, chatty message from Haruka. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe moment I started typing a response, Horikita aimed some sharp words at me. “That grin’s really creeping me out.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whose?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yours. You do have \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003esome\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e degree of self-awareness without me having to deliberately point it out to you, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I absolutely wasn’t grinning.” I had no memory of the corners of my mouth curling up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you playing dumb again? I’m talking about your \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003einner\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e self,” said Horikita. Apparently, she smelled my joy like a bloodhound. “You’ve found a cozy little nook, haven’t you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, she grabbed her bag and stormed off to the dorms by herself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was grinning, huh?” I muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, it felt good to be contacted by a friend. Still, shouldn’t Horikita be glad about that?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDid she really want us to continue being loners? \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI got ready and left the classroom. Most groups would’ve met up there and then headed over to Keyaki Mall together, but we were all too lackadaisical for that. When I arrived at our usual hangout, the rest of the group was already there.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Akito, don’t you have club stuff?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m skipping today.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks like those Class C dudes showed up at archery again. It doesn’t seem like they threw punches or got into any fights, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I told the seniors I felt distracted, so I was going to take today off. The club’s pretty lenient,” Akito explained. That was pretty blunt. I supposed that he wouldn’t have been able to come meet us here if he’d lied and said he was feeling ill.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What if we tried talking to the teacher?” Haruka suggested. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAkito simply shook his head. “There’s nothing the teacher can really do. If Class C trespassed in our private places, that’d be one thing, but they’re free to observe the archery club,” he explained.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh. Class C really are annoying, aren’t they? Oh, speaking of. I saw it. I saw it. How \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edeplorable \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eof you, good sir,” said Haruka, speaking like some old-timey aristocrat as she jabbed me with her elbow.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Saw what?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean, ‘what’? I’m saying that I saw you eating with Shiina-san from Class C, Kiyopon! Airi’s so worried about it, she’s been spilling rice all over herself.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wah! You promised that you wouldn’t say anything, Haruka-chan!” Airi wailed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, did I?” said Haruka. “Then, Kiyopon, pretend I never said anything.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, that wasn’t exactly possible, but now I understood what was really going on. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t tell me you’re about to rush into a last-minute romance right before Christmas?” Haruka demanded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really, Kiyotaka? I didn’t think you were that kind of guy,” said Keisei, sounding slightly annoyed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Naïve. Much too naïve, Yukimuu. All roads lead to romance in the end. Young people these days live life at a much faster pace,” said Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Faster? What do you mean, faster?” replied Keisei. “We’re in our first year of high school.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Look, if you experience your first love or whatever in high school, you’re already behind the curve. Back in elementary school, some of my classmates were already dating junior high or high school students.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKeisei’s mouth hung open. “I-I’ve never heard of anything like that before.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That just means you never paid attention, Yukimuu. I\u0026#160;mean, most girls aren’t interested in childish boys,” said Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWasn’t it normal for elementary school kids to be childish? At any rate, I had to correct this immediately. “Sorry to rain on your parade, but there’s nothing going on,” I told them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really? You’re not just saying that to hide your embarrassment?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“S-see?” said Airi. “I told you, but you wouldn’t believe me, Haruka-chan.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I had some business to take care of at the library, so I went during lunch. I just happened to run into Shiina there. I think she was spying on me, like Ishizaki and those guys at Akito’s club. She asked me a bunch of questions. If I flat-out turned her down, it would’ve attracted extra attention,” I told them, trying to lend my story more credibility. Besides, it wasn’t really a lie. Even though Shiina and I met by accident, it was likely that she’d been scoping me out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’ve been marked too, Ayanokouji. Does that Ryuuen dude hate the thought of losing to Class D that much?” asked Akito. He sounded a bit resentful, like it made him less special that he wasn’t the only person Class C targeted. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Keisei considered things from another point of view. “That might not be the case. You heard the rumor going around that we’ve got a master schemer hiding in Class D, right? Maybe that’s why Ryuuen’s been tailing us. Ayanokouji, what kind of questions did Shiina ask you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A bunch of different things, but she did ask about the mastermind,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I see. So, it wasn’t a date or anything.” Airi patted her chest and sighed in relief.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I couldn’t really think of anything to say, so I didn’t answer. To be honest, it wasn’t a lot of fun,” I added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even so, it looked like you had a pretty good time,” said Haruka. “Hmm.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I couldn’t just let her see me looking disgusted, right? She’s still a Class C student.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka seemed suspicious, but Keisei changed the topic. “Putting aside Haruka’s imaginary romance, Class C is becoming a problem. I feel bad for eavesdropping, but apparently Sudou got wrapped up in something and went to Horikita for advice.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAh, so Keisei overheard their conversation this morning. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you all right, Keisei?” Akito asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKeisei looked deep in thought. “Nothing’s happened to me so far, but I’m still worried. I’ve seen Class C students around a lot lately, and they’re all Ryuuen’s lackeys. I’m probably being targeted as well.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. They haven’t done anything to me, though,” said Airi, raising her hand timidly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Me neither,” said Haruka, raising her hand like Airi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, maybe someone’s been watching us, and we just haven’t noticed it yet,” Airi replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Eh? What, like a stalker? Creepy.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, a guy tailing girls might lead to various problems. Ryuuen might be using girls to act on his behalf. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Watching us, huh? Maybe…” Akito brought his hand to his mouth, as if he’d just thought of something. “I\u0026#160;usually finish up with club stuff and meet you guys kind of late, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. Generally after six or seven, I think.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’re usually an awful lot of Class C students around, considering the time. When I met up with you guys the other day at Keyaki Mall, Komiya was there. He’s here today, too,” said Akito.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAkito was the quick-witted one in our group. His observational skills were sharp. Haruka tried to look around, being extremely obvious about it, but he stopped\u0026#160;her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t. We don’t know what they’re after. It’s better not to react,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Akito hadn’t stopped Haruka, I would’ve. It’d be best to avoid adding fuel to the fire right now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Gross,” spat Haruka, looking at Komiya and not disguising her disgust at all. “So, it’s really true about there being a secret Class D mastermind?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We don’t know whether or not that person exists,” said Akito. “Ryuuen spews lies as easily as breathing.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Keisei thought in a different way. “Ryuuen has people following us precisely because he believes that there \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eis\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e such a person. But if Class D contains a master manipulator, like Ryuuen says, who could it be?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What? You think this person exists?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If they don’t, then what Class C is doing makes no\u0026#160;sense.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAkito didn’t seem entirely convinced. “That’s assuming that there’s any rhyme or reason to Ryuuen’s thinking,” he countered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you think, Kiyopon?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Putting aside whether or not the Class D mastermind exists, that’s probably why Class C is tailing us,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka crossed her arms. “So, we’re talking about someone who isn’t Horikita-san, and who’s helped us through all the exams so far? Like Yukimuu, maybe? He’s smart. As a matter of fact, he’s always top of the class on our tests.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not me. All I did was help out during the island test and the zodiac game.” Keisei let out a deep sigh, as if he found the subject irritating.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, how about Kouenji-kun?” Haruka suggested. “I mean, his personality’s, well…off. He’s brilliant, he’s athletic, he’s perfect in every way.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Impossible,” replied Keisei. “Like you said, he’s a jerk. Do you really think he’d do anything for our class?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe it’s an act?” asked Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You mean, his ridiculous personality’s just a front?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe he’s really a cold, calculating schemer. You think?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone shook their heads.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Absolutely not,” said Akito. “He’s nuts.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides, Kouenji retired on the very first day of the island test,” added Keisei confidently. “He wouldn’t have known what was going on with us. If there was another mastermind on that island aside from Horikita, it couldn’t have been him.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh ho, I see. You’re pretty persuasive, Yukimuu.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But this is all conjecture based on the assumption that there really \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eis\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e a mastermind, like Ryuuen believes. Even if there is, we’re not sure they were involved in \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eall\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the tests.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Yeah, you’re right.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edo\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e think the mastermind exists,” Keisei added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why do you say that?” Akito asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just a feeling. I guess it’s because of Class D’s rapid progress.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But how could Ryuuen-kun know for sure that the mastermind isn’t Horikita-san?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe Hirata-kun’s the mastermind?” suggested Keisei. “Back when we were on the island, he got some advice from Horikita-san, I think.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, Hirata’s the one giving the orders?” Akito asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t see him as the type, but it’s not impossible.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It definitely sounds like he’s on Ryuuen’s list.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think Ryuuen’s got his eyes on about ten people.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSomeone from Class C was probably tailing Hirata, too. But he was bound to remain neutral and abstain from conflict, and I barely spoke to him lately. I wouldn’t risk it while Ryuuen and his goons were on the hunt.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-hey, Kiyotaka-kun?” Airi timidly spoke up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please don’t be upset, but I wanted to ask you something,” she said. “Is it possible that maybe \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou’re\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the mastermind?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe other group members all looked at me simultaneously.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why do you think that?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-well, it’s just…you’re calm, and smart, and…reliable, so… I thought that you gave Horikita-san all kinds of helpful advice, so…” Airi stammered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Does Kiyopon get good test scores?” asked Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I recall, not great, not bad,” said Keisei, pushing his glasses up. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“S-sorry. It’s just, well, I kind of thought that, for some reason or another. Maybe because of the advice you gave, that Ryuuen-kun might be after you. I felt bad for you…” Airi continued.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed it was just her nature to ask an honest question. I doubted she meant ill. “Unfortunately, I’m the one always \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003egetting\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e advice from Horikita.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I guess Kiyopon does have a mysterious quality, you know? Also, since he’s close to Horikita-san, it’s\u0026#160;reasonable that you’d suspect something,” Haruka told Airi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come to think of it, that might be right. It might be why Shiina directly confronted him,” offered Akito.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It certainly seems reasonable to be suspicious of Ayanokouji. Even if there isn’t really a mastermind, just being close to Horikita might make people think that he’s the one.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If that’s true, it’s bad news for you, Kiyopon,” said Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, it really is.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What a drag. Hey, if they give you trouble, feel free to talk to us about it,” said Akito, placing his hand on my shoulder.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. I’ll do that,” I told him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis surveillance couldn’t continue forever. When he saw his opportunity, Ryuuen would definitely choose to attack.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e3.5\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eN UNEXPECTED PERSON\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e approached me after class the next day: Satou from Class D. Her skirt fluttered slightly in the breeze as she stopped in front of me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Ayanokouji-kun. Are you free today? If so, would you like to have some tea or something before going back to the dorms?” She twirled her hair on her finger, as if it were pasta on a fork. She was bold—and obviously looking for a date. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita, who sat next to me, didn’t seem to care at all. After gathering her things, she left the classroom. However, I felt the other members of the Ayanokouji Group observing. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWhy’s a popular girl like Satou talking to Ayanokouji?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e they likely wondered. Haruka seemed deeply interested.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t really have any plans. Hanging out with our group wasn’t mandatory, so they wouldn’t mind. I was a little worried about the way they were staring, though.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is this a bad time?” Satou sounded slightly anxious.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, Satou. Today’s not so good for me,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a tough decision, but I turned her down—mainly due to the source of my discomfort all day. My shoulders were tense thanks to that person constantly staring at me. Her eyes remained fixed on me even now, as I talked to Satou. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei was still in the classroom. She pretended to deal with paperwork, but she was faking. She was undoubtedly waiting to approach me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I see,” said Satou. “Well, talk to you later, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI felt bad for making Satou sad, but this was just terrible timing. I exited the classroom as if I was walking her out, and as soon as I did, Chabashira-sensei followed me into the hall. Clearly, I was correct to think that she had some business with me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI took care to avoid the main hallway, instead heading over to the stairs.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce we had privacy, Chabashira-sensei called out to me. “Ayanokouji.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you want something?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. Follow me. We need to talk.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s going to be difficult. I promised Horikita I’d meet her,” I answered, coming up with an appropriate-sounding lie.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As a teacher, I don’t want to be careless. But circumstances being what they are, this is necessary.” Chabashira-sensei, who was usually inhumanly composed, wore a strangely vulnerable expression.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have a bad feeling about this,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unfortunately, you can’t refuse. This is extremely urgent,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eResistance was futile. I decided to follow her, and we moved from the student area to an even more private location.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why are we headed over here?” I asked. “It’s too early to counsel me on my post-high school career, isn’t it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ll understand soon.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI tried to lighten things up with a joke, but it didn’t seem like she was going to answer a student’s question. However, rather than what was on the other side of the door, what I was worried about right now was Chabashira-sensei. She sounded almost flustered, and that worried me. She was normally so composed. Whoever she was taking me to see—even if it was the person I imagined—this wasn’t normal behavior for her. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe knocked on an office door. “Principal, I’ve brought Ayanokouji Kiyotaka-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI heard a gentle voice that carried the dignity of age. “Enter.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei opened the door. A man of about sixty sat on the sofa. He was certainly the school’s principal; I’d seen him multiple times before, at the entrance ceremony and during the end-of-the-semester ceremony. He didn’t look calm, either. In fact, sweat trickled down his forehead. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOne other person was there, sitting opposite the principal.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI now knew the reason I’d been called here.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You two may talk now,” said the principal. “I trust this is acceptable?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Very well. I’ll take my leave now. Excuse me,” the principal said. He bowed out humbly, despite the fact that the person sitting opposite him was only in his forties. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll excuse myself as well.” Chabashira-sensei bowed graciously to the man and left with the principal. The final look she gave me was visibly nervous. As the door closed, the only sound I heard was the heating system’s faint whirring. \u003c/spa
