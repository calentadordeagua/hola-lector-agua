n\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I stood completely still and silent, the man spat out his first words. “How about you take a seat? I came all the way here to meet with you, after all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt had been one year—no, a year and a half since I’d heard this man’s voice. His way of speaking and tone hadn’t changed at all. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not planning to have a long conversation. I promised some friends I’d meet them.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Friends? Don’t make me laugh. There’s no way you’re capable of making friends,” the man sneered. Typical. He just assumed that was true, even though he hadn’t seen me in so long. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whether we talk or not, it won’t change anything.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then I assume you’re going to do as I say. No need to discuss anything; I’m busy anyway.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know what you want from me,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe cut straight to the heart of the matter. “I’ve prepared the documents necessary for you to drop out. I spoke to the principal about it. All I need is for you to say yes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have no reason to drop out,” I told him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For you, that might be true. But I have my own reasons.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe looked right at me for the first time. The sharp gleam in his eye hadn’t faded. If anything, it’d only grown sharper. His gaze was a blade, threatening to slice to the very heart of you. I was sure that gaze had wounded many people.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Does a parent have the right to ruin their child’s life for the sake of their own selfishness?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Parent? You’ve never recognized me as your parent before,” he countered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re certainly right.” I doubted that this man had ever regarded me as his own child. In truth, we only recognized each other as father and son in the most technical way possible. \u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg height=\"100%\" style=\" top: 0px; vertical-align: top; height: 100%;\" alt=\"\" id=\"ClassroomElite-Vol7_INTERIORIMAGES_4\" src=\"/hola-lector-agua/images/books/v7/OEBPS/Images/ClassroomElite-Vol7_INTERIORIMAGES_4.jpg\" loading=\"lazy\" decoding=\"async\"/\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The fact is that you’ve been behaving selfishly. I ordered you to remain on standby,” the man declared, no longer urging me to sit. “You defied me and enrolled at this school. It’s only natural that I tell you to drop out immediately.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your orders are absolute inside the White Room. But outside it, there’s no need for me to do as you say. Right?” I countered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was simple logic. Of course, he wasn’t convinced.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve become quite talkative in the short time since we last met. I suppose that’s due to this absurd school’s influence, hmm?” The man rested his chin on his hand, looking at me as if I were less than filth.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Answer my previous question, hmm?” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You mean the pointless query about no longer needing to obey my orders? You’re my property. A man may do as he wishes with his property. Whether I keep you alive or kill you is up to me,” he answered coldly. That he could say such things in a law-abiding country, and mean them, spoke to what a fearsome force he was. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Badger me all you like. I’m not dropping out,” I told\u0026#160;him. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe could keep going back and forth on this, but it didn’t matter. We weren’t going to agree. He knew that, and hated wasting his time on pointless conversations. So, what would he do? \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, he prepared his next attack.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t you wonder how Matsuo’s doing? The person who told you about this school and gave you the idea to enroll?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not especially.” I remembered Matsuo. His face immediately popped up in my mind.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I hired him to manage you for a year in his capacity as a butler, but he chose to go against his employer.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe said it in one breath, without pausing, then stopped cold after the word “employer,” a pause designed to etch that final word into the listener’s heart. The tone of his voice and the dramatic pause indicated that a conversation of grave importance was about to begin. His dark look was designed to make me fearful. To cause me to wonder just how bad things were about to get.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He told you about this school as a way for you to escape my control. You ignored your real father’s wishes and selfishly enrolled without my permission. Truly foolish.” He picked up his tea and took a sip. “An outrageous, unforgiveable act. Naturally, Matsuo had to be punished.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t a threat. He was merely stating the truth.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can probably guess what I’m about to say,” he continued, “but he was disciplined and dismissed.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If he went against his employer, that’s an appropriate punishment,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy butler, Matsuo, was nearly sixty years old. He was exceptionally good at taking care of people, and quite amicable. Any child would’ve liked him. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMatsuo married young, but hadn’t been blessed with children right away. He was over forty when he had his first baby, but sadly lost his wife in childbirth. His son was about my age, and Matsuo’s pride and joy. I’d never met the boy myself, but Matsuo said his son studied diligently every day so that he could achieve great things and repay his father’s sacrifices. His smile as he said those words still burned in my memory.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know about him, I assume. Matsuo’s son, his pride and joy.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe’d predicted my train of thought. He saw right through me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When you enrolled at this school, Matsuo’s son also managed to pass the difficult entrance exam for a wonderful, prestigious private high school. He worked exceptionally hard, and achieved it all on his own.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe paused.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But now he’s been expelled.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHis meaning was plain. He’d forced the school to rescind the boy’s acceptance as a form of payback. That was the sort of power he wielded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So? For a man like you, that’s a mild punishment,” I replied sarcastically. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Matsuo’s son was strong. Even though he was expelled from the school on which he’d pinned his hopes, his determination didn’t fade. He bounced back and immediately tried to enroll in other schools. I did whatever was necessary to crush his attempts to advance. I\u0026#160;made him give up. I did the same to Matsuo, too. I tarnished his reputation, leaving him unable to find a job. His son also lost his way, and is now unemployed,” said the man.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMatsuo and his son had lost everything because of my selfishness. The man before me wasn’t making this up. Every word he said was almost certainly true. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf he came all this way to spout this nonsense at me, then he was in for a disappointment.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I imagine you’re not surprised by any of this. Because Matsuo acted against me, it was necessary that I repay him in kind. However, it seemed that this was more than he could bear. He was always a nice, conscientious man, who lost his wife young and raised his son alone. Racked with guilt for having robbed his child of a future, Matsuo concluded that there was only one way to save him. He begged me to leave the boy alone, and committed suicide last month by self-immolation.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, that was what he came here to say. That my selfish actions led to a man’s death.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Right now, his son’s working part-time, earning enough to live on and nothing else, with no guarantee of a future. No dreams. No hope. His family’s tragedy is your fault. The boy must surely bear a deep grudge against you. Even in death, he won’t forgive you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe corners of the man’s mouth curved slightly upward in a despicable grin.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The man who took care of you, who saved you, has died. And you show no reaction whatsoever. If Matsuo could see you now, he’d be full of regret.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat kind of joke was this?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDead people felt no regret. The man before me was the reason why Matsuo and his son lost everything—why Matsuo killed himself—and he wasn’t even trying to make me feel guilty. He was simply stating the fact that he had no mercy for those who angered him. That was what he wanted to convey to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“First of all, there’s no evidence that what you say is the truth,” I argued.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Matsuo’s death has already been recorded. If necessary, I can send for the papers confirming it.” He was basically daring me to ask for them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If he really is dead, then that’s all the more reason for me to stay in school. Matsuo helped me enroll, even though he knew you’d punish him. I must honor his wishes.” A ridiculous reply for a ridiculous story.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve changed quite a bit, Kiyotaka.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d always followed his orders before. Well, I followed the White Room’s orders. It had been my entire world. This man’s sole failure was the one year he left me with Matsuo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What happened that year? What made you so determined to go to this school?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s certainly true that you supplied me with the best possible education,” I told him. “Even though you used methods that must be kept from the public, I can’t deny what the White Room offered. I don’t plan on revealing my past to anyone, nor will I do anything that would endanger you. However, I’m the result of your absolute pursuit of an ideal. That was your mistake.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was a first-year high school student. I was only sixteen years old, and already, my knowledge far exceeded what a normal person could learn in a lifetime. That was precisely what allowed me to recognize the infinite bounds of human curiosity.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You taught us all kinds of things. Not just the liberal arts and sciences, but martial arts and self-defense techniques, and bits of worldly wisdom too numerous to mention. Learning fascinated me. I wanted to learn about the common, everyday world that you deemed worthless and turned your back on,” I continued.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that what led you to run away?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you think I could learn what I have at this school if I stayed with you? What’s freedom? What does it mean to be unconstrained? I couldn’t have learned that in the White Room,” I replied. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat part alone was something even he couldn’t deny. The White Room might have been the most efficient facility for nurturing and training someone in the entire world, but you couldn’t learn everything about the world there. It was a facility that cut away anything it deemed unnecessary. To the extreme. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Matsuo told me that this school was the only place in Japan where you couldn’t reach me.” If I hadn’t chosen this school, but just waited as instructed, or chosen another option, I would probably have been put back in the White Room again. I was absolutely not going to drop out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t entirely understand, but it seems that I have no choice but to accept. I suppose that temporarily suspending the facility’s activity was a mistake. To think that a plan sixteen years in the making could be ruined in just a year…” he replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe White Room’s temporary shutdown would be a hard blow to this man. But if he was finally contacting me after more than six months, something else was likely happening behind the scenes. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand why you’re here,” he continued. “But if you think the matter is settled, you’re naïve. As with Matsuo’s son, I can force you to quit.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t imagine you’ll be able to do anything, considering that the government backs this school,” I told him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s a statement made without proof.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Firstly, I don’t see any of the bodyguards who normally follow you everywhere. You shouldn’t be without them, since so many people hold grudges against you. But your bodyguards aren’t in this room, nor are they in the hallway,” I countered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe man swallowed his remaining lukewarm tea. “There’s no need to bring a bodyguard along to visit a high school.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’d be sloppy, considering that you’re the sort who has guards escort him to the bathroom. No, you couldn’t bring them here even if you wanted to. The authorities didn’t allow it.” If he hadn’t obeyed, they wouldn’t have permitted him to enter.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You still lack proof.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Secondly, if you had the power to simply force my expulsion, you would’ve done so immediately. But you didn’t. You came all the way here to try to convince me to drop out. Something’s off.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe hadn’t met directly with Matsuo’s son. He just brought the hammer down on him, so to speak. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“One more thing. You could easily consider this school enemy territory. If you took aggressive action here, and the public found out, your dreams of making a comeback would disappear forever, wouldn’t they?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did Matsuo put that idea in your head? Even in death, he’s still impeding me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I couldn’t possibly deduce all that from things Matsuo said.” I’d heard no details from Matsuo, but I could easily guess what was going on. “Putting aside the facility’s temporary suspension, there’s another problem you never considered. No matter how perfectly you train someone, sooner or later, a rebellious phase occurs.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA mere fifteen years of education couldn’t possibly go against the ancient traditions in our DNA. Adolescent rebellion was ingrained in us all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why would someone like you veer off your path? You were taught from the very beginning that there was no point learning unnecessary things.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because of my insatiable curiosity, my inquisitive spirit. And also, because I want to decide my path for myself. It’s that simple,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Utter nonsense. The only path in this world is the one I prepared for you. You will one day surpass me, and become the person who guides Japan into the future. Why can’t you understand that?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s just a story you tell yourself.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems I can’t get through to you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks like we agree on that point.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOur statements only went in circles, not intersecting. We’d never see eye to eye. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The White Room has resumed operations. This time, my plans are perfect. Nothing will get in the way. I’m prepared to make up for lost time,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, you must have quite a few candidates to succeed you. Why fixate on me?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s certainly true that things are going well. However, there’s no one who exhibits the talent level you do.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Am I to assume a parent can’t lie to their own child?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is the last thing I’ll say to you, Kiyotaka. Consider very carefully before answering me. Which would you prefer? To run away from this school of your own free will, or to have your parent force you to leave?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis man was determined to drag me back there. I didn’t know what measures he expected to take, but I didn’t want to listen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You have no plans to return?” he concluded after a long, deadly silence.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know if there’s any help for a man like you, but I have no intention of giving up. This school \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eis \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003edeveloping its students’ talents, even if it goes about it differently from you. I expect to learn a lot here,” I told\u0026#160;him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How foolish. This school’s nothing more than a barn full of common rabble. I’m sure that your own class holds many such worthless bottom-feeders with no hope of salvation.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Worthless bottom-feeders? Not at all. This is a place where I may discover whether human beings are made equal or not. I find that quite interesting.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You think that even incompetent morons can stand toe-to-toe with geniuses?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s what I hope.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You want to destroy my ideals, then.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We should end this. We know that, no matter how long we talk, we’ll never agree.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust then, someone knocked at the door. “Please excuse me.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA man in his forties slowly opened the door. His expression was grim at the sight of our unexpected visitor.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s been quite some time, Ayanokouji-sensei,” he said, bowing low like a subordinate addressing a superior.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sakayanagi. Seeing you gives me a rush of nostalgia. It’s been, what—seven, eight years?” the man asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose it’s been that long since I succeeded my father as school board chairman. Time flies,” replied the visitor. Sakayanagi? Like Sakayanagi Arisu, from Class A. “You must be Ayanokouji-sensei’s… You’re Kiyotaka-kun, are you not? It’s nice to meet you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We finished speaking, so I’ll be heading back.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, would you mind waiting just a moment longer? I was hoping to speak to you both, Ayanokouji-sensei. Please, have a seat.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t refuse that request from a third-party, let alone the board chairman of the school. I sat down. The chairman sat beside me. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I already heard from the principal. You intend to make him withdraw from the school, hmm?” Sakayanagi asked the man.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. Since it’s what his parent wishes, the school must immediately take appropriate action.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChairman Sakayanagi’s eyes met my father’s. “I’m afraid that’s incorrect. It’s certainly true that parents have a significant say in a student’s attendance here, but we must examine the reasons they might wish for their child to drop out. For example, if a student were subject to terrible bullying, we’d certainly take that into account. Are you being bullied, Kiyotaka-kun?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Absolutely not.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is a farce. I want him to quit attending a school he enrolled at without his parent’s permission.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“High school isn’t considered compulsory education, and attendance isn’t mandatory. Students are free to attend any high school of their choosing. If parents paid tuition, it might be a different story, but the government covers all this school’s fees. Our students’ autonomy is our top priority,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI finally understood what Matsuo meant when he told me, “If you go to this school, you can escape from the White Room.” He’d said that because of Sakayanagi, who now spoke to my father without a hint of cowardice or\u0026#160;fear.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnlike the principal, who groveled before people in positions of authority, Sakayanagi held firm.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve changed, too. Where did the old, agreeable you go?” my father asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I still respect you, Ayanokouji-sensei. However, it’s precisely because I share my father’s vision for this school that I intend to follow in his footsteps. I’m sure you understand that well. None of these policies have changed since my father’s time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re free to succeed your father and carry on his wishes. However, if that’s your intention, then why did you allow Kiyotaka to enter this school?” the man inquired.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why, you ask? Because we determined that he qualified for admission based on his interview and exam results.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t dodge the question. This school’s fundamentally unlike ordinary schools. Kiyotaka should never have been a suitable candidate for admission. I know that the interviews and exam are just for show,” the man\u0026#160;countered. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChairman Sakayanagi had worn a pleasant smile so far. However, after hearing those words, his expression changed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even though you could say you’ve retired, you remain an impressive figure, Ayanokouji-sensei. You’re quite well-informed,” said Sakayanagi. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He was recommended to this school in secret. The moment that happened, his acceptance was decided. To\u0026#160;put it in other words, it’s strange that any and all students, no matter who they are, would be disqualified if they don’t have a recommendation. Am I wrong?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt certainly seemed they were discussing some things a student like myself should never have been privy to.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kiyotaka never should’ve been among the possible candidates in the first place. It’s abnormal that you didn’t disqualify him.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re correct that he wasn’t originally on the list of students we planned to admit. We normally reject unexpected applications from students not on our list, and we have an interview and exam to camouflage that fact. He’s the only student I’ve approved for admission based solely on my own judgment. You may be here because you wish to take him back, but he’s one of our valued students now, and in our care. I have a responsibility to protect this school’s students. Even if this request comes from you, I’m afraid I must refuse. As long as Kiyotaka himself doesn’t wish to quit, that is,” said Sakayanagi, looking in my direction.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t screw with me,” spat the man. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, the chairman continued speaking. “If you still wish us to dismiss him, we’ll arrange a three-way discussion with you, Kiyotaka-kun, and a school representative until we reach an agreement.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe chairman had essentially rejected my expulsion. The man had no cards left to play. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If that’s how things stand, I’ll find another way.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you intend to do? If it’s anything extreme, then—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand. I haven’t the slightest intention of putting any pressure on you,” said the man. “You should have no complaints if Kiyotaka’s expelled in accordance with school rules, correct?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. I can assure you that the school won’t give him special treatment just because he’s your son,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, we’re done talking. If you’ll please excuse me.” The man got up from the sofa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When will we meet again?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Certainly not here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll see you off.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No need.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI spoke up. “If you call yourself a parent, why not come by the school now and again?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Coming to a place like this once is quite enough.” With those cutting words, the man left the office.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whew,” said Sakayanagi. “It sure feels like you’re on pins and needles when Ayanokouji-sensei’s around, doesn’t it? You must’ve had a tough time of it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah, not really,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was now just the two of us. Chairman Sakayanagi looked at me with kind eyes. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In truth, I’ve known about you for a long time now,” he said. “I never spoke with you directly, but I had my eye on you. Sensei always spoke highly of you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, so that’s how that mechanism was removed.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Mechanism? What do you mean?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nothing. More importantly, Chairman Sakayanagi, do you know a Class A student who—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Arisu, right? She’s my daughter.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, but she’s not in Class A just because she’s my daughter. Our assessments are fair.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No doubt. I just wanted to ask you something.” At least now I understood how she knew me. “I’m curious about what that man—that is, what my father—said\u0026#160;earlier.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“About your admittance to this school?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Exactly.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Well, it’s as Ayanokouji-sensei said. We only admit students we believe deserve placement. We contact and work with junior high administrators to conduct preliminary nationwide surveys and determine who’s qualified. The interview and exam are for appearances’ sake. A student might screw around in the interview, or get a zero on the exam, while their admission was already decided. Of course, students from all over the country do apply here, so the tests are a convenient smokescreen,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo even if someone scored a perfect 100 points or performed perfectly in the interview, they’d still be turned away, huh? There was no way a student who got rejected would be able to ascertain the truth, either. That made sense. Poor students like Sudou and Ike, and ones with troubled pasts like Karuizawa and Hirata, had been able to enroll despite their issues. Shining records and academic ability were clearly not all that mattered to this school.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The moment I decided to admit you, your acceptance was guaranteed. Scoring exactly fifty points on all your written tests had no effect on your success or failure,” he continued.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was an exceptionally peculiar school. I doubted that there was another like it in all of Japan. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure both you and Ayanokouji-sensei have questions. You’ll come to understand with time. You’ll see the nurturing policy we strive for, and the effect we hope it will produce,” said Sakayanagi. His voice brimmed with confidence. “I can’t tell you more than that. You’re a student, and I’m the one running the school, after all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe probably only told me this much because that man was targeting me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As the person in charge, I’ll protect my students according to the rules. Do you understand?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, if I didn’t follow the rules, Sakayanagi couldn’t help me. “Of course. I also understand what that man’s going to try to do now. Please excuse me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Very well. Keep doing your best.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, I left the reception office. As I stepped out, I saw Chabashira-sensei some distance away. She’d clearly been waiting for our conversation to end. I gave her a slight bow and tried to walk past, but she walked alongside me, matching my stride.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How did it go with your father?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s pointless to probe me so clumsily. I understand everything,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You understand what, exactly?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Almost everything you’ve told me has been a lie, Chabashira-sensei.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you talking about?” She wasn’t looking me in the eye.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Chabashira-sensei. Almost everything you’ve told me has been a lie.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you talking about?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re trying to hide how shaken you are, but it’s obvious just from looking at you,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe fact she wasn’t looking me in the eye. Her choice of words. She was trying to conceal her emotions from any outside observer to the best of her ability, but even so, she couldn’t hide her unrest completely.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That man never contacted you. And he didn’t push you to expel me, either.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Umm…no. Your father wanted my cooperation. I’ve been trying to get you expelled.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was certainly true that my father was pushing for me to drop out. However, judging from his behavior, and that this was the first time he set foot on school grounds, I was fairly sure he’d never been in contact with a teacher. I didn’t have any solid proof, though.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Look, stop lying to me. Chairman Sakayanagi told me everything. He informed you about me the minute the school admitted me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The chairman told you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI chuckled wryly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn that moment, Chabashira-sensei understood her mistake. “Ayanokouji, did you trick me?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. The chairman said nothing about you, Chabashira-sensei. But your involvement in this matter has become clear.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg height=\"100%\" style=\" top: 0px; vertical-align: top; height: 100%;\" alt=\"\" id=\"ClassroomElite-Vol7_INTERIORIMAGES_5\" src=\"/hola-lector-agua/images/books/v7/OEBPS/Images/ClassroomElite-Vol7_INTERIORIMAGES_5.jpg\" loading=\"lazy\" decoding=\"async\"/\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe second Sakayanagi said he was aware that I deliberately scored fifty points on all my tests, I’d known for\u0026#160;sure.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Allow me to explain,” I continued. “First, I wanted to come to this school. Chairman Sakayanagi knew of me, and acted independently to confirm my enrollment, as well as my assignment to Class D. He put me in Class D because you, Chabashira-sensei, have shown no real drive to rise through the class ranks. At least on the surface. Every other teacher desperately wants to have their class promoted.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d attract attention in a high-performing class. Sakayanagi had wanted to put me somewhere I could lay\u0026#160;low.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But Sakayanagi made one mistake. You, a teacher who shows no affection for her class and appears apathetic, secretly desire to reach Class A more than anyone else.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“………” Chabashira-sensei remained silent, probably because she knew she’d lose the argument if she responded carelessly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was one more thing I wanted to be certain of. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re obsessed with Class A. However, the students the school’s assigned you so far have been subpar. That’s why you act indifferent, concealing your feelings. Am I\u0026#160;wrong?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was now totally unable to look me in the eye. “That’s just speculation, Ayanokouji.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer denial had no force behind it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your situation changed because of my arrival. Although many Class D students have various character defects, you did luck out on a few fronts. Horikita, Kouenji, Hirata, and Kushida are all students who, if guided well, have a chance of being promoted to the upper classes. They gave you hope. Your concealed desires began to burn brightly once again… It all makes sense when I think back to Hoshinomiya’s comment to you around the time I started school here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHoshinomiya, who was an old friend of Chabashira-sensei’s, knew her hidden desire to rise to Class A. I remembered her teasing Chabashira-sensei about wanting to “be dominated by a younger man,” and how that wasn’t possible for her. Maybe she’d actually been implying that Chabashira-sensei was incapable of submitting to authority. That she desired for a lower class to supplant a higher one; the inferiors overthrowing their superiors.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You want me to be your ticket to Class A. And now the chairman has said he’ll watch over me. Put it all together, and you’re at my mercy. All you can do is stand there and pretend not to hear any the abuse I’m throwing at you right now,” I added. “You’ve been stuck with Class D for an eternity, all the while hankering to rise u to Class A. You can’t pass up on this opportunity. You even decided to lie about being in contact with my father in order to use me. That was the reason why you contacted me, and Horikita was nothing more than a pawn for you to use to that end. However, things aren’t so simple.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d had no desire to excel when I first started at this school. I never intended to aim for Class A. Even though she hadn’t yet known what to do with me, Chabashira-sensei made her first move during the test on the island.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You knew we had to win when the special exams started, or we’d never catch up to the other classes. You panicked and made up a story to tell me. Desperate times call for desperate measures, I suppose.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass D had done pretty well, ever since. But Chabashira-sensei had miscalculated. And now my father had finally contacted the school directly, and all her lies had been laid bare.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You probably intended to corner me,” I said. “Instead, you’re the one with your back to the wall.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see,” she said. “Your abilities certainly aren’t those of an ordinary first-year high school student. ‘Wise beyond your years’—isn’t that how the saying goes? I guess that describes you pretty well.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe took a deep breath and nodded. Her shoulders slumped.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re right,” she continued. The composure she’d so struggled to maintain had collapsed. “I never met your father before today. But I really could have you expelled if I wanted to. I could claim you committed a serious violation of the rules. Expulsion is the one thing you absolutely want to avoid, no?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eReally, to do all this and now threaten me more? “So, you’re not giving up on your ambitions?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Exactly.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unfortunately for you, you can’t get me expelled.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“May I ask why you’re so certain?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d allowed myself to appear to grow agitated to ascertain her true intentions. Now, I calmed down, returning to my usual tone of voice. “The current situation. This year’s Class D is unusual. Compared to years past, we’re doing well. Horikita and the others are getting stronger. They might still reach Class A, even without my help.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass D had risen for months. We were on the cusp of overtaking Class C, and if the school expelled one of us now, it would ruin that. This meant Chabashira-sensei’s hands were tied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if I step down, the fight will continue. You still have reason to hope, Chabashira-sensei, and that means you’re going to leave me be.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So even though you know everything now, you’re still done trying to reach Class A?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course. The teacher who’d tried to manipulate me into aiming for Class A had turned out to have no secret connection to my father at all. I had nothing to fear from her now. Still, I didn’t completely shoot her down. People will cling to the tiniest ember of hope, given the chance. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At the very least, I think I’m done taking my turn onstage,” I said. “Now, please stay back, stay quiet, and watch me. If you try to manipulate me to the tune of your personal desires again, it’ll only hurt the other students.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And if I keep after you? What then?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ll never see your dream come true. Not a smart choice.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Allow me to rephrase the question. Are you so certain that I won’t take you down with me when I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edo\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e lose hope?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not at all. It’s certainly possible that something in the future will devastate our class points. If that happens, and you lose all hope, feel free to come at me.” She wouldn’t stop even if I asked her to. Better to let her do as she pleased. “Just remember that your position as a teacher isn’t rock-solid, either.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was an empty threat for now, but it should be at least somewhat effective against Chabashira-sensei, given what she knew. As I walked away, she said nothing, so it seemed as she was out of ammo. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eReuniting with my father wasn’t pleasant, but I’d made some significant progress today. I no longer needed to help reach Class A. No matter what Ryuuen did from here, I didn’t have to get involved for Class D’s sake. And no matter what happened to Karuizawa, it wouldn’t hurt Class D.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, my identity would be revealed if Karuizawa were caught or betrayed me, but so what? Even if Ryuuen hunted me down, provided I did nothing else for Class D from this point on, we’d probably still end up winning narrowly. He would achieve nothing. \u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e3.6\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT DUSK,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I walked a path lined with trees. I looked up and exhaled. White steam curled from my mouth and vanished into the night sky.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Cold,” I muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEvery time I breathed out, that white steam rose into the air. I exhaled and inhaled, over and over again. I\u0026#160;tended to forget because of the extremely temperature fluctuations from day to day, but winter was here. Last year around this time, I’d always been indoors.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA girl passed me, shivering in the cold. She chatted happily with someone on her phone. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seriously, right when you became student council president, our relationship flatlined, Miyabi. Ah ha ha! Come on. I’m joking, I’m joking. Besides, it’s not like I’m angry or anything. But I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eam\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e going to ask you to treat me in celebration, so be prepared!” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer thighs peeked out from beneath her skirt. Exposed to the winter air, they were probably really cold. I caught the fragrant scent of shampoo on her shoulder-length hair.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Student council? Sorry, but I’ll pass. I’m not interested. Besides, you still haven’t settled things with the former student council president, have you, Miyabi? Wait, what? Why are you suddenly confessing your feelings for me? Come on, I know you’ve made passes at lots of other girls. Well, if you win against President Horikita, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethen\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I’ll consider it, okay? Talk to you later.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewant\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to eavesdrop, but if she was going to talk that loudly, then I couldn’t help but overhear to. Based on the contents of her conversation, she was probably a second-year student.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe girl finished her phone call and exhaled deeply, steam escaping her mouth. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Jeez, that Miyabi. Getting all cocky. Still, that student council president was pretty useless. In the end, Miyabi will win,” she said to no one in particular.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wondered whether she’d noticed me, but she continued walking. However, when she reached the fork in the road where the path split off toward the dormitories for each grade level, her foot slipped and she took a truly impressive tumble to the ground.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wah!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe girl immediately got up and looked around, her face red. That was when she noticed me for the first time, and forced a slightly embarrassed smile. She didn’t seem injured at all, and she took off in the direction of the second-year students’ dorm.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, she really was a second year, huh?” I said to myself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed students didn’t really mingle with those from different grade levels very much at this school, outside of student council or club activities. That was why I hadn’t really had any opportunity to commit their faces to memory.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Must be hard to be a girl in winter,” I muttered. Apparently, the school prohibited them from wearing leggings underneath their uniform skirts, which made no sense to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was the first “winter” I’d experienced. It was so chilly. There was a song about a dog that got super excited after seeing snow for the first time, and I understood that feeling now. Was it going to be this exciting every time it snowed? \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI let out a deep breath, and thought back on the events of the day. I spoke directly with my father, met Chairman Sakayanagi, and ascertained which of the school’s policies were meaningless. Seeing through Chabashira-sensei’s lies was a huge gain. This should allow me to make quite a bit of progress.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Should I stop?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d been careful to remain behind the scenes so far, but if Class D continued to flourish, I wouldn’t be able to avoid attracting attention. Ryuuen’s scrutiny would intensify, and eventually, his investigation would bear fruit. Though I’d tried to prop Horikita up as the class mastermind, he’d seen through it. Sakayanagi knew about my past, and Ichinose probably had her doubts, too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I wanted to turn back, this was my last chance.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHasty decisions led to ruin, so I needed to consider both options: push forward or retreat. Right now, Ryuuen was my main problem. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI took out my phone and texted a particular person, asking her to contact me as soon as she could. The read receipt showed up immediately after I sent the text, so she must’ve been back in her dorm already. That was odd. She was usually out with friends at this time of night. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI manually entered the 11-digit phone number and called her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hello?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe owner of that somewhat listless voice was first-year Class-D student Karuizawa Kei. Unbeknownst to her, she was one of the people Ryuuen had his eye. She also knew that I was the one manipulating Class D from behind the scenes, far more so than Horikita. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, there were plenty of things she didn’t know, such as precisely how involved I was or what exactly I’d been doing. If anything, Karuizawa probably considered me an intensely creepy person right now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just wondering what you’re up to,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re joking, right? You wouldn’t call without a reason,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d planned to start off with some small talk, but Karuizawa wasn’t having it. “You don’t enjoy our conversations?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you don’t enjoy them either, that’s a dumb question.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose you’re right.” She wasn’t the Class D girls’ leader for no reason. She understood people. “Did Manabe and her friends contact you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. That’s not a problem right now. Is that why you called?” she asked. Rather than surprised, she sounded exasperated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s been quite some time, huh? Guess there’s nothing to worry about anymore,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe wind howled, turning my bare face raw from the chill. “You’re still outside,” said Karuizawa. She probably heard the wind over the phone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m on my way back to the dorms. Seems like you turned in pretty early today yourself. You’re normally out much later than this, aren’t you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even I feel like heading back early sometimes.” She sounded a little standoffish. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah!” I cried, noticing something.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?” Karuizawa demanded, thinking that it was directed at her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s nothing,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt the fork in the road, a red charm lay on the ground where that girl had fallen a little earlier. I wondered whether she dropped it. It might’ve been better to just leave it, but it would likely snow this evening, soaking the charm. There were no signs that the girl was coming back for it, so I decided to pick it up so I could hand it over to the dorm manager.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey,” Karuizawa said. “There’s something I wanted to confirm with you, since we’re already talking.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Something you wanted to confirm?” I asked. I picked up the charm and walked toward the second-year students’ dormitory. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re smart and all, but why don’t you let people know? I mean, Class D’s pretty much full of morons. If\u0026#160;you came forward like Yousuke-kun, people would like you more, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m smart, huh? What makes you think that?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s nothing for you to base that evaluation on, is there? My test scores are pretty average. I don’t contribute much in class, either.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not what I’m talking about.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, I knew what Karuizawa wanted to say. I’d recruited her help many times at this point, like while stopping the Idiot Trio from sneaking photos and peeping, and during the incident with Kushida in the Paper Shuffle. It was obvious to Karuizawa that I was more than I seemed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s just that you were open about the things you did, your reputation would improve, wouldn’t it? You’d probably even draw the school’s attention, just like during the sports festival,” she continued, sounding almost excited even though this should have had nothing to do with her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know I’m not the kind of person who wants that,\u0026#160;right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then why are you doing all this? If you didn’t want attention, you could’ve just hung back.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s a very good question.” I hadn’t \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewanted\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to do any of this. “Something came up that forced my hand, so I helped Class D. That’s all there is to it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNormally, I’d never reveal that much. But today was special. I was in a good mood.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I kind of feel like that’s a waste,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I never intended to take control. Never have and never will,” I told her. I needed to make sure Karuizawa was clear on that point. I didn’t want people coming to me for help if Class D ran into problems in the future.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s you, isn’t it? You’re the one that Ryuuen’s searching for.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass C’s surveillance increased day after day—it wasn’t just Sudou and Akito—and rumors had spread well beyond Class D’s walls. Talk was going around about how Ryuuen had been defeated by someone in Class D and was now out for revenge. Karuizawa had probably known it was me right away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s kind of related to what I wanted to talk to you about. I wanted to apologize,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Apologize?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve been helping Class D so it could earn points. I\u0026#160;did so because something compelled me to. But that’s no longer the case.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So what? You’re just going to stop helping?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. I’ll leave it all to Horikita and Hirata. I don’t want the hassle of Ryuuen discovering my identity; I’m done. You’ve been a great help to me—for instance, that time at karaoke, and getting in touch with Kushida. I’ve imposed on you quite a lot.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. So, that means I’m finally free, huh? I won’t be working with you anymore?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s about right.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa had served me better than I could’ve anticipated. That was also why I could cut her off without hesitation. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This will probably be the last time I call you,” I told her clearly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?” Her response was delayed. Maybe she hadn’t heard me? \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is the last time I’ll call you,” I repeated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe had to have heard me this time. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s only natural, since I don’t need anything from you now. Besides, no one knows that we’ve been talking. It’ll be suspicious if we continue to make pointless contact,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. I guess. I suppose you’re right,” replied Karuizawa, though it sounded like she was struggling with the words. Something seemed to be bothering her, but I just kept going, selfishly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course, I’ll help you if you ever need me to. I made a promise, and I’ll honor it. You can contact me if there’s an emergency, but please delete all traces of our conversations. I already deleted your contact information.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-wait a minute. Why are you doing this?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s just…very cold.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, our relationship has always been cold, hasn’t it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan
