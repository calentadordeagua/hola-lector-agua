"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:Tcaa,"])</script><script>self.__next_f.push([1,"\r\n\u003cp id=\"auto_bookmark_toc_top\" class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 1 - Prologue:\u003cbr/\u003eRyuuen Kakeru’s Soliloquy\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT WAS SOON AFTER STARTING\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e elementary school that I realized I was abnormal. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI found a large snake on a class field trip. I wasn’t afraid of being bitten. Some students watched with great interest from a safe distance, some were scared, and still others couldn’t care less. Most, however, wanted the snake to die. Even the adults panicked, crying out for someone to help.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, I grabbed a big rock and bashed in the snake’s head. I might have gotten bit, but I wasn’t afraid of that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy classmates screamed, and the teachers were in a panic. I didn’t really care. I wasn’t trying to be a hero by destroying the snake everyone feared; I just didn’t see the need to be afraid of it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI learned something about myself that day. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe moment an enemy succumbs, I feel a huge rush of adrenaline. Fear and pleasure are two sides of the same coin to me; violence rules the world, and the effectiveness of your own particular brand of violence determines what you accomplish. The snake’s death was my first unshakeable victory, and the sight of its flattened corpse gave me such pleasure. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe fact remains, however, that people are hostile toward those they sense are different from them. I’ve had many enemies since that day, both internal and external. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven so, I was never afraid. All I thought about was how to get revenge, and how to turn the tables on my enemies. Eventually, they would all bow to me. Those who possess an unparalleled capacity for violence are truly the elite. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was just one problem, and it grew as I did. It became increasingly difficult for me to feel pleasure. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was bored. Bored because no one could fulfill my dearest wish—to be overthrown.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps I’d only meet my match in death.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg height=\"100%\" style=\" top: 0px; vertical-align: top; height: 100%;\" alt=\"\" id=\"ClassroomElite-Vol7_INTERIORIMAGES_\" src=\"/hola-lector-agua/images/books/v7/OEBPS/Images/ClassroomElite-Vol7_INTERIORIMAGES_.jpg\" loading=\"lazy\" decoding=\"async\"/\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 1 - Prologue : Ryuuen Kakeru’s Soliloquy\",\"volumeId\":\"v7\",\"chapterIndex\":7,\"prevChapter\":\"$undefined\",\"nextChapter\":{\"volumeId\":\"v7\",\"chapter\":8,\"title\":\"Chapter 2: The Sound of Footsteps in the Middle of Winter\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Title Page\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Ryuuen Kakeru’s Soliloquy\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: The Sound of Footsteps in the Middle of Winter\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\
