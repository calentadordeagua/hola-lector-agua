pan style=\" font-size: 1.00em;\"\u003e“He’s a good guy,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even so, I don’t want to get too close to him,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki was similar to Sudou in the sense that they were hotheaded, passionate guys, but Ishizaki was also different in his own way.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What in the hell is going on? Why are Ayanokouji and Horikita here?” snapped Ibuki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, Ishizaki hadn’t told her anything after all, huh? Horikita and I exchanged glances. It felt like letting Ishizaki handle the talking here might lead to problems.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Actually, there’s something we wanted to discuss, so we asked Ishizaki to get in touch with you, Ibuki,” I said, starting to explain our situation, since I figured that we didn’t really have any other choice.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And?” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you planning on taking on this upcoming special exam by yourself?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s my choice,” said Ibuki flatly, as if she were saying that there was no point in talking about this.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I told ya a buncha times already though, it’s better to have a group,” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t need a group,” snapped Ibuki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, ’kay, you say that you don’t need a group, but the truth is there ain’t anybody who wants to partner up with you,” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki threw in some unnecessary comments. Was he trying to help? Or just throw a wrench into things? I\u0026#160;shot him a look, trying to tell him with my eyes to keep quiet.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? What’s up, Ayanokouji?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut…Ishizaki apparently didn’t get the message because he responded by asking me a question instead.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nothing. By the way, Horikita’s in the same boat. She hasn’t found a group either, Ibuki,” I said, turning back to Ibuki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So?” she huffed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you don’t make a group for the upcoming exam, you’ll be at a pretty big disadvantage. Even if you don’t make a group of three, if you at least form a group of two people, in the worst-case scenario that one of you gets eliminated, the other person can still keep going,” I told\u0026#160;her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat should be enough to make her understand what I was trying to get at.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And we don’t have much time left to make groups,” I\u0026#160;added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So what? Are you saying you want me to partner up with Horikita?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah, that’s the gist of it,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Who do you think you are, asking me to partner up with her?!” she snapped.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, your physical abilities are nothing to scoff off… But aside from that, there’s a laundry list of issues,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey! Where do you get off, thinking you can say whatever you want to me too?!” said Ibuki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki rudely barreled straight towards us, closing the distance between us. She then turned to glare at Ishizaki, who had been standing behind her with a vacant, happy-go-lucky look on his face.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And you! You want me and Horikita to be in a group so you tried to put this together? You asked them for help?” said Ibuki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I didn’t know it’d be with Horikita or nothin’, but ain’t this a good thing? Getting’ a group, I mean,” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I absolutely hate that guy, but I hate Horikita even more,” huffed Ibuki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’m guessing “that guy” was meant to refer to me. Ibuki was rather politely pointing her finger right at me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, Ayanokouji-kun. She seems to hate you quite a lot,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And I didn’t even know it, huh. But it seems like she hates you even more than me,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What an honor,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe fact that Horikita and I were whispering to one another must have upset her, because she didn’t even try to hide how aggravated she was.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know if Horikita asked you to do this, or whatever the reason was, but I am never pairing up with her!” shouted Ibuki, refusing the notion outright.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed she\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e really\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e didn’t like Horikita at all. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh my, but I don’t remember ever saying that I wanted to team up with you myself, did I?” Horikita, seeing Ibuki’s behavior, said something to try and provoke her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? What is that supposed to mean?” asked Ibuki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would appear you’ve misunderstood something here. You’re on your own because no one wants to be with you. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eYou’re\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the leftovers. I’m alone because I want to fight on my own. We’re both acting solo, but our situations are different,” said Horikita, sounding somewhat exasperated.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat Horikita just said seemed to have lit a fire under Ibuki though.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, I’m on my own because I want to be! Anyway, if you say that you’re handling this exam solo too, then that’s just perfect. Let’s make this a contest, Horikita!” she shouted, with a sharp glare, shifting her attention from me to Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_9\" src=\"/hola-lector-agua/images/books/y2v2/OEBPS/Images/INTERIORIMAGES_9.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can I ask you just one question? Why do you want to compete with me so badly? I mean, sure, we had our moments of rivalry on the island last year and during the sports festival, but that was nothing special,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re the only one who sees it that way,” said Ibuki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs far as I knew, Ibuki had come out of their fight on the island last year the winner. Then Horikita had won when they competed in the 180-meter race in the sports festival. They each had one win and one loss. However, you couldn’t really say either of them had been at their absolute best in both instances. During the island test, Horikita was forced to fight while running a high fever. Then, during the sports festival, Ibuki was so fixated on Horikita that it undoubtedly caused her to mess up when she ran. That meant that if you were to ask me which of them was better, I couldn’t decide at this point in time.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki, whom I had beaten along with Ryuuen on the rooftop that last year, had even gone on to challenge me personally to try and settle the score. In short, she had the kind of personality where she wouldn’t be satisfied unless she was absolutely certain who was better—her or Horikita. Considering all of that, I supposed there was no way she would partner with Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems like this is just a waste of time,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait right there. Do you accept my challenge or not?” said Ibuki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not like I’m choosing to go it alone at the start because I want to selfishly make some kind of heroic solo effort. When the special exam begins, I will respond to the situation as things develop and join up with another group. That’s what I’ve chosen to do,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf they had established that they would be going one-on-one throughout the exam, then this might be a viable opportunity for them to have a contest. But if Horikita teamed up with people later, it wouldn’t be a fair fight.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Lame!” shouted Ibuki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whether something is lame or not won’t determine how I’ll handle a special exam,” said Horikita matter-of-factly, responding to Ibuki’s provocations by telling her that this was a waste of effort. “If you’re so determined to go it alone, then how about this? Try not to lose against me, even if you and I are in a group together. If you can manage to beat me in that situation, I’ll give you at least some credit.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Not good enough,” snapped Ibuki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no way the two of them were going to form a group. Negotiations had broken down. However, I was sure deliberately provoking her all through the conversation like that would strengthen Ibuki’s motivations. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI offered Ishizaki a small apology and then decided to head back to the classroom with Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You knew from the beginning that there was no way Ibuki was going to accept that last offer you made, right? You’re too kind,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My intention was to provoke her so she’d do something reckless and get disqualified,” answered Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t an honest answer. But, I thought, it did sound very much like her.\u003c/span\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 6: Invitation\",\"volumeId\":\"y2v2\",\"chapterIndex\":12,\"prevChapter\":{\"volumeId\":\"y2v2\",\"chapter\":11,\"title\":\"Chapter 5: Battle of the First-Years and Third-Years\"},\"nextChapter\":{\"volumeId\":\"y2v2\",\"chapter\":13,\"title\":\"Chapter 7: The Calm Before the Storm\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : The White Room Student's So
