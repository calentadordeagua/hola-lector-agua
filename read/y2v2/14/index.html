, so I have started to devote more time to writing again. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlso, it’s precisely because we’re in the midst of such challenging times right now that I’ve realized once again that I must not forget that there are people who really look forward to these works as a source of entertainment. I hope to make up for the delay in the release of this volume at some point in the future. For the time being, I\u0026#160;humbly ask that you please be patient.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOkay, so anyway…yeah. Syougo Kinugasa here. Are you doing all right, everyone? I am a total mess right now. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSeriously, because of everything I’ve been through, I\u0026#160;am utterly exhausted. I’ve got a lot of stuff I’ve got to vent about. Usually when I have a lot of free time on my hands, I feel like I get totally disheartened and discouraged about writing, but this time, I experienced the total opposite. “LET ME WRITE!!!” I was shouting that from the depths of my heart. When you don’t have the time to do so, you truly realize just how grateful you are to be able to work.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, there are a lot of depressing events going on in the world right now, but I think there are some small things that have happened that weren’t all bad. Since people haven’t been going out and have been encouraged to stay at home, many restaurants have started selling bento boxes to go. This has given me a chance to experience flavors from restaurants that I normally used to just pass right by. When businesses are back to running like normal, there are definitely a few restaurants that I’m going to visit.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnyhow, this particular volume, which is the second volume of the year two arc, is on sale now. It acts as a prelude to the story in volumes three and beyond. It was basically my idea to try to write about one special exam per each book, but I can’t really say that’s the case this time around. Students from each grade level are fighting hard to achieve victory. That alone makes the story much\u0026#160;longer. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis volume, more than any before it, really has that “To be continued” feeling. So, in that sense, I think I’d really like to get the next volume out as soon as possible. I\u0026#160;think I’d like to get…two more books out before the end of the year. Can I do it? Or not…? Anyway, please pay attention to that kind of stuff sometimes too. You can’t get your hopes up too high though, okay? ☆\u003c/span\u003e\u003c/p\u003e\n\n\u003cdiv class=\"p.P_Centre\"\u003e\n\u003cp/\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Epilogue: Postscript\",\"volumeId\":\"y2v2\",\"chapterIndex\":14,\"prevChapter\":{\"volumeId\":\"y2v2\",\"chapter\":13,\"title\":\"Chapter 7: The Calm Before the Storm\"},\"nextChapter\":\"$undefined\",\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"la
