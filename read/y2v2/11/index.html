ut way too, saying that I understood what you meant,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, you’re swearing to me right here and now that you are not going to do anything. Can I interpret what you said as such?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can interpret what I said however you like, but I’m not saying anything,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs this pointless back-and-forth continued, the typically calm, collected Kiriyama now started to raise his tone a bit in anger.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nagumo had known, more or less, that I had been working with Horikita-senpai. But because I’ve been Nagumo’s yes-man and doing everything he asks, he’s just been keeping a low profile, quietly watching. Even something as simple as Horikita-senpai’s little sister joining the council could be troublesome. And if she were to do something unnecessary—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then it would put you in danger, Vice President Kiriyama?” I asked, finishing his sentence for him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yes, that’s right.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, that was the reason he had specifically called me up and giving me this stern warning. On the face of it, what he was doing out of concern for us. But in reality, it seemed to be coming more from a place of self-preservation. Of course, I wasn’t saying that was a bad thing. I had no intention of voicing any complaints about the relationship between Nagumo and Kiriyama, a relationship in which a winner and a loser had already been decided.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you want that chance for anyone to graduate from Class A? What Nagumo had proposed?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I…” he stammered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe former student council president, Horikita Manabu, held onto a policy based on the premise that students would win as an entire class. Well, no, that was actually the school’s policy as a whole, until just this year. Going with that policy though makes it impossible to win against the third-year Class A, led by Nagumo. In truth, it was basically as though it had already been decided that Kiriyama would be graduating from Class B.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, if he followed Nagumo and won based on his own personal strengths, then this situation might change. If Kiriyama was an exceptionally talented individual, then there was a possibility that he could rise to Class A. He said that he wanted to have a personal battle with Nagumo on the island, but in the end, he just wants to get to the top so that he can collect Private Points. He was just using this whole thing as a pretext so that Horikita and I wouldn’t get in his way. That was all. In fact, he probably wasn’t planning to do anything like throwing down the gauntlet at Nagumo’s feet and issuing him a challenge.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is it so strange…to want to graduate from a Class?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was nothing strange about it. Kiriyama continued speaking. I supposed he was saying this for the sake of protecting his own pride.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What is the point of even coming to this school if you’re going to graduate from a class other than A? I don’t want to end up like those who had the talent but gave up the fight. I don’t want to go down that road. And I absolutely do not want to go down with the rest of the incompetent losers and freaks in Class B,” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wondered if Manabu would have been disappointed if he heard what Kiriyama was saying right now. Or would Manabu simply say that he had already known that Kiriyama had this weak side all along, from the beginning?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At any rate, I think you understand what I’m trying to get at,” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I do, very well. I also understand why only you were present aside from Nagumo, Vice President, when Horikita had joined the student council, while the other student council members were introduced to her later,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe had been worried that I or Horikita might have said something unnecessary.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can say anything you—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kiriyama.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile we were in the midst of our conversation, a voice called to Vice President Kiriyama from nearby. Although Kiriyama’s name was called specifically, he didn’t seem to react to it right away.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kiriyama. Don’t you hear me?” said the voice, slightly louder than before.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh, speak of the devil…” muttered Kiriyama in a faint voice before turning to who had been calling him, somewhat begrudgingly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat I looked myself, I saw that there was a female third-year student sitting down on the bench. She seemed to be relaxing, sitting with back against the bench, legs crossed, and arms outstretched. I compared the face of the person I saw there against the records in OAA, to see what her name and abilities were. So, looks like this was…Kiryuuin, from third-year Class B.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you want?” asked Kiriyama.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey were supposed to be classmates, but Kiriyama’s disgruntled look on his face wasn’t changing when he turned towards her. These two didn’t seem to be very compatible, from the looks of things.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fu fu. Well, it just looks like you’re together with an interesting kouhai, so I thought I’d say hello,” said Kiryuuin, directing her gaze over at me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your name’s Ayanokouji Kiyotaka, right? I’ve heard that you’ve become a bit of a celebrity after you got a perfect score on that tough math test,” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBefore I could respond to her though, Kiriyama butted in, speaking in a raised tone.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This has nothing to do with you, Kiryuuin,” snapped Kiriyama. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe started to walk away, seemingly trying to put some distance between us and Kiryuuin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you doing, Ayanokouji? Let’s go,” he said, calling out to me when he noticed that I wasn’t moving.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know, you’re not going to get anything from spending time with a guy like him,” said Kiryuuin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was like I was stuck between a rock and a hard place. With the rock and a hard place being two third-year students. Which side was the correct one to listen to? Well, to be completely honest, I didn’t want to listen to either of them…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s far more meaningful for him to spend time with me rather than you,” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s for Ayanokouji to decide, isn’t it? Kiriyama, won’t you please just hurry up and get out of here?” she replied with a scornful chuckle, as she still sat comfortably.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why don’t you and I have a more meaningful conversation? Just the two of us,” she added, turning to me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Gr,” huffed Kiriyama, through clenched teeth.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKiriyama seemed to dislike the fact that she was interrupting our conversation more so than the fact that she was teasing him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can ignore that girl,” said Kiriyama, issuing me a warning, his tone aggressive.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She’s a third-year student, though. Just like you, Vice President Kiriyama. So, I can’t do that.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…That’s Kiryuuin. She’s in Class B, same as me.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I saw in the OAA app. She’s a highly rated student, isn’t she?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In terms of grades, yes. But Kiryuuin doesn’t have anyone backing her up, like Nagumo does. She doesn’t even have a single real friend.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKiriyama was basically saying that there was nothing to worry about if we were to ignore her then.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey now, don’t compliment me so much. You’re going to make me blush.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though he certainly wasn’t complimenting her at all, Kiryuuin wore an audacious smile.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we were to compare her to somebody from your grade level, I’d say she’s like Kouenji. Whatever you say, whatever you do, it’s just a waste of time to try and engage with her,” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, that was a name that I never expected to be heard as a point of comparison for someone. Kouenji had a peculiar personality, the likes of which you could say was one-in-a-million, but here was someone else just like him. Anyway, she did certainly seem to have a unique personality too. My curiosity had been piqued, but at the same time, I felt like it would be better for me to not get involved.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI did notice, however, that Kiryuuin’s grades of academic ability and physical ability were both A+. She was the only student in our entire school, male or female, who had an A+ in both of those categories. Her societal contribution score wasn’t necessarily that low at a C+. Her sole flaw was her adaptability score, which was rated D. If you simply looked at the scores, then you could say she was the best in our school.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s up? Aren’t you coming?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you talking to me?” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you don’t come with me, I’ll just go with you instead. But are you okay with that, Kiriyama?” asked Kiryuuin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…This is exactly why I’m cursed to be stuck in Class B, because of people like you,” said Kiriyama in a low voice.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“With exceptional classmates like her though, aren’t you able to resist President Nagumo?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just told you that she’s exactly like Kouenji, didn’t I? As a human being, she’s a lost cause. She has not contributed to the class in the past three years in any way, other than focusing on her own performance. She’s always only ever acted alone. She’s like some foreign contamination in our class who just selfishly butts in when she wants to,” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was certainly true that looking solely at OAA, she had maintained an outstanding record. But I had never once heard her name from a third-party before. If she were someone that Nagumo or the recently graduated Horikita Manabu had been keeping an eye on, it wouldn’t have been surprising if I had heard about her from them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aw, thank you for the compliments, Kiriyama,” said Kiryuuin, whispering directly into Kiriyama’s ear.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ack?!” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that she had gotten up from the bench and was standing, I saw that she was unexpectedly tall. I think she was over 170 centimeters tall. Her extreme athleticism was also evident from her graceful, well-built body. Icouldn’t believe that there was a third-year student who gave off this sort of impression. It reminded me of something that Kiriyama had said in our conversation earlier. Something about how he was not wanting to go down with the rest of Class B, which was full of incompetent losers and freaks. I supposed that Kiryuuin was one of those freaks that he had referred to earlier.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’ve got something to say, come out and say it,” snapped Kiriyama.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I intend to, of course. But you’re in the way, Kiriyama,” said Kiryuuin. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Fine, do whatever you want. I’m leaving,” he replied in a huff.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed like he had no intention of being around Kiryuuin, so Kiriyama decided to make his exit.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t forget what I was just telling you, Ayanokouji. Depending on how this plays out, I might become your enemy too,” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI received some friendly words of advice from the Vice President. Normally, I would have been leaving at this point myself, but this other person, Kiryuuin, was also from third-year Class B.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s not stand while we have our little chat. Why not sit down?” said Kiryuuin, urging me to take a seat on the bench.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure…” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was hoping that I could be let go from here as soon as possible. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what did you want to talk to me about?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anything. If I can find out what kind of person you are, then that’s plenty” said Kiryuuin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Find out what kind of person I am? Vice President Kiriyama said that you didn’t really contribute to your class though, Kiryuuin-senpai. Doesn’t that mean that you’re not interested in what your classmates are like?” I\u0026#160;asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Being interested and cooperating are completely separate things, aren’t they? There are some interesting people among my classmates, and sometimes I want to have a friendly conversation with someone, like what we’re doing right now,” said Kiryuuin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI see. That’s certainly true, I supposed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not interested in the system here at this school of trying to reach Class A. It seems like the biggest selling point of it all is that if you graduate from Class A, you can go on to higher education anywhere you like or get a job anywhere, but I’m convinced that I can already down that with my own abilities anyway. I chose to go to this school on a simple whim,” said Kiryuuin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJudging from what she was saying, she certainly did give off a similar impression to Kouenji. She had absolute, overwhelming confidence in herself. And she did receive an A+ in academic ability and physical ability, which supported that confidence.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Would you have not chosen to come here, if you had known beforehand that this school’s curriculum is designed around the assumption that you’d cooperate with other students?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I wouldn’t say that. I like this school. In fact, I’ve never once felt dissatisfied about anything here, even once. The point system is also very pleasant,” said Kiryuuin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji seemed to be enjoying himself fully too, so I’m guessing he must also like this school, as well. Students who could manage to do anything on their own after graduation didn’t need to cling to Class A.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems like you don’t mind being disliked by other people,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Other people’s evaluations don’t mean anything to me,” she answered, boldly and confidently, followed by a strange smile.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I had wanted to as you some questions, but it seems like you’re the one asking me all the questions,” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKiryuuin, as if she were switching from being on the defensive to going on the offensive, immediately went ahead and prompted me to speak.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think it’s about time you tell me about yourself\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e” said Kiryuuin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why me, though? There are lots of academically gifted students here,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A hunch. My intuition is telling me that this student who was passing by is no ordinary person,” said Kiryuuin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, she was asking because of her instincts, with no real basis for anything whatsoever. I had already thought she and Kouenji might be similar, but now they seemed like the same exact person.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you planning to get first place on the uninhabited island survival exam?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There aren’t any students who don’t want to be first, are there? Except for people like you, Kiryuuin-senpai, I suppose,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Putting aside first place, I am one of the people shooting for one of the top spots. If I get a high score, I can get Private Points. I’m the type of person who spends whatever she has on hand, so I’m always short on money,” said Kiryuuin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, Class Points and Protection Points were secondary to her. In the end, it seemed like Kiryuuin was only participating in this exam to get Private Points.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nagumo and Kiriyama and the others are naturally hoping to get first. And I’m sure there are some quite competent underclassmen lined up as well, right? This upcoming special exam will be a battle to determine who gets first place in the school,” said Kiryuuin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It certainly might be, yes,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe abilities needed in this exam weren’t limited strictly to academic ability or physical ability. If this was a battle of overall ability, then you could say that was exactly what you needed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whether or not my interest in you fades will depend on what you do on the island,” said Kiryuuin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I had to say anything in response to that, it’s that I’d rather that you lose interest in me, senpai,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. You say some intriguing things. I’m looking forward to fighting you, Ayanokouji,” said Kiryuuin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd with that, Kiriyama waved me away like she was trying to shoo away some small animal, signaling that I should leave.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’ll please excuse me,” I stated, before walking away.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough I had a meeting with a rather bizarre third-year student just now, one thing was for certain. If I wanted to get one of the top spots in this upcoming exam, I was going to have to defeat Kiryuuin as well. And it looked as though she’d be just as troublesome as Nagumo and Kiriyama, or perhaps even more so.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e5.6\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eE\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eVEN AFTER\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Ayanokouji had left, Kiryuuin continued to stay put. Her daily routine was to simply relax and enjoy the day at her leisure, according to her own whims. In her line of sight, she saw a familiar head of blonde hair swaying about. Next to the owner of that blonde hair was Student Council Vice President Kiriyama, who had walked off just moments ago.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, well, well! It looks the faithful dog has returned, and he’s brought his master with him,” said Kiryuuin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What…?” huffed Kiriyama.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, if what I’ve said there is making you angry, it seems that it’s because you had interpreted it a certain way, Kiriyama. I don’t remember stating exactly who the faithful dog and master are between the two of you right here. I’m just saying this as a third-party, someone who doesn’t know your situation. Why do I say this? Because you’re the one who walked away earlier Kiriyama, and thus, you’re the only one who fits the description of a faithful dog,” she replied, as Kiriyama approached her with Nagumo standing beside him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What an irritating chick…” mumbled Kiriyama.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s a rather unpleasant thing to say, Kiriyama. It certainly doesn’t sound like something a serious vice president should say,” replied Kiryuuin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nagumo, engaging with her is a waste of time. You already know this quite well,” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I’m of the same opinion. Can the both of you please get out of my sight, immediately? This is just a waste of my precious time,” said Kiryuuin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who do you think you are? First of all, you—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo cut in, gently tapping Kiriyama on the shoulder to cut him off.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kiryuuin, please don’t wound my precious colleague like that,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo then forced Kiriyama to back off and he stood in front of Kiryuuin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, a precious colleague, hm? I didn’t feel any kind of emotion from you when you said that, though,” said Kiryuuin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s just your imagination,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now then, I wonder what business the student council president has with me? I had thought we wouldn’t ever be speaking with one another again,” said Kiryuuin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t want to stay around you for too long, if at all possible,” said Nagumo, aggressively taking a seat on the bench right next to Kiryuuin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re beautiful, but you’re utterly lacking in charm. I’m only interested in women with charm, after all,” added Nagumo, expressing that as the reason he didn’t want to stick around.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I do have charm. It’s just that I haven’t found the right gentleman that can draw it out,” said Kiryuuin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If there’s a man out there who can bring out your charm, I’d like to see him,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Me too. However, your tastes aside, why is it that I am not popular, hm?” asked Kiryuuin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s because a woman who is too capable and too talented is difficult to handle. Unfortunately, I can’t bring myself to like that kind of woman either,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Well, in that case, I suppose that I’ll never pass your standards. If the reason I haven’t gotten a boyfriend yet at my age is because I’m just too good, then yes, I guess that does make sense,” said Kiryuuin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter enjoying a bit of meaningless conversation with Kiryuuin, Nagumo cut to the chase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I heard something from Kiriyama. I would have never imagined that you, who didn’t show any admiration for neither Horikita-senpai nor myself, would have been interested in in Ayanokouji. I was shocked when I heard about this,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And that’s why you’ve come all the way over to talk to me? You must have a lot of free time on your hands, President,” said Kiryuuin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve finished my administrative work. I have some extra time right now,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would appear that you’ve misunderstood something here. I’m not entirely indifferent to people, Nagumo. I\u0026#160;make it a point to talk to people who rouse my interest at least once. You and Horikita Manabu had caught my interest before,” said Kiryuuin, gently stroking Nagumo’s bangs.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems like you never slack off when it comes to taking excellent care of your hair. I can tell that you take better care of it than I, a woman, do mine. It’s no wonder you’re popular, President. Say, has your love life been fruitful over these past three years?” said Kiryuuin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve never been with a man before. How would you know anything about love?” countered Nagumo.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“While it’s certainly true that I don’t have any experience in that arena, it’s nothing to be ashamed of. In fact, some could say that it actually makes me more valuable, don’t you agree?” said Kiryuuin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seems like you still have absurd ideas, as always,” replied Nagumo.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKiryuuin and Nagumo once again veered off into a bizarre tangent, but Nagumo proceeded to steer the conversation back towards the topic at hand.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what did you think of Ayanokouji? Is he someone deserving of holding your attention?” asked Nagumo.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just paid him some lip service because he’s a cute underclassman. But that was all,” said Kiryuuin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That was all? Does that mean that you don’t feel impressed with him?” asked Nagumo.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m putting that question on hold for the time being. We did have a brief face-to-face conversation, but I didn’t get a grasp on his true abilities. Though you could say that in itself is a type of skill, I suppose. Anyway, he is more entertaining to me than you, President, who I’ve lost interest in,” said Kiryuuin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re the only person in our grade level who can talk to me with that much sass,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo then drew in close, with his mouth near Kiryuuin’s ear, and lowered his voice to a whisper.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you think that you’re better than me, I’m more than happy to correct that vain idea you seem to have in your head. Understand?” he threatened quietly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo issued her a challenge, effectively issuing a challenge for the upcoming special exam on the island.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When you lose, what you lose is incalculable, President. It seems like you’re misunderstanding something here. But it’s not as though I’m underestimating you. I don’t have the outstanding leadership skills that you and Horikita Manabu possess, nor do I have any talent for making friends. In fact, I’ve never even had anyone that I could truly call a friend. Right?” said Kiryuuin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo moved his face away from Kiryuuin’s ear, seeming somewhat bored.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, in other matters, it’s different,” said Kiryuuin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough Nagumo had started to pull back from Kiryuuin, their faces were less than forty centimeters apart. Nagumo shot Kiryuuin a sharp glare.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you saying that I’m inferior to you in some respects?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well now, can you state with absolute certainty that there are no areas in which you are inferior?” countered Kiryuuin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have given you several chances to test that, and you have done nothing. And the result is that you’ve ended up in B,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUp until this point, Nagumo had competed against Kiriyama and Kiryuuin’s class via the numerous special exams. But never once did Kiryuuin actually take part and cooperate with her class. And as a result, her class was demoted from A to B.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s certainly true that if you only look at those results, I have been thoroughly crushed,” said Kiryuuin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKiriyama continued to glare at Kiryuuin, who was pleasantly enjoying the conversation, but Kiriyama didn’t interrupt at all.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I know that you’re not the kind of person who really cares about A or B though,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo then got up from the bench, signaling that this was the end of their conversation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry for bothering you, Kiryuuin. Enjoy the remainder of your time here at this school,” said Nagumo, preparing himself to leave.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I had said earlier that I was going to put the question of whether or not Ayanokouji was someone I’m impressed with on hold. I do think he’s an interesting student,” said Kiryuuin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?” asked Nagumo.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That was the answer you were hoping to hear from me about Ayanokouji, wasn’t it?” asked Kiryuuin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOne of the reasons why Nagumo had come over to talk with Kiryuuin was because he wanted to find out what she thought about Ayanokouji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Interesting? I would think that this personality is far from interesting. Don’t you think?” said Nagumo.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKiryuuin smiled, as if she were saying, “See, you’ve taken the bait, after all.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, you know how the proverb goes, ‘a skilled hawk hides its talons.’ Isn’t that right? I had heard he had gotten a perfect score on a rather difficult mathematics test,” said Kiryuuin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure, there are people out there who hide their talents because they don’t want to stand out. I’ve beaten all of them though. And I don’t think that they were all that interesting,” said Nagumo, then directing his gaze over at Kiriyama, who had been waiting for him while standing some distance away.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I had to say anything, it’s his vibe, I suppose. He has a different vibe that you and Horikita Manabu,” said Kiryuuin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s rather abstract,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, why don’t you test him and see?” asked Kiryuuin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course, I intend to. Maybe I’ll get to see what he’s capable of during the uninhabited island survival exam,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You seem like you’ve been bored ever since Horikita Manabu graduated. Will this underclassman be a good playmate for you? If you’re serious about this challenge, you’ll most definitely get first place in the island text, Nagumo,” said Kiryuuin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Obviously, I’m going to take first. Or perhaps Kiriyama will, since he’s been dying to compete with me. But we’re going to need one more group if we’re going to take all three top spots in the exam, aren’t we? You are going to take on that role, Kiryuuin. I will provide you with some useful companions, if necessary,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd then, Nagumo touched on the main reason he had reached out to Kiryuuin today. Kiryuuin smiled, as if to say that she understood what he was asking.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. So, you met up with me because you’re seeking my help,” said Kiryuuin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You might think that I’d let the younger students at least take third place, but I’m not that nice,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You have countless pawns at your disposal that you can move about the board, don’t you? You don’t need to rely on me,” said Kiryuuin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Meaning that you’re not willing to do this?” asked Nagumo.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Somewhere in the top fifty percent is fine for now. Sorry for wasting your time,” said Kiryuuin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo, as if he had already known that she was going to answer like that, had turned his head to look off far into the distance.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You really are that kind of person, I suppose. I thought I’d try talking to you, as someone from my grade, but it seems like it was a waste of my time,” said Nagumo, his statement suggesting that he was going to leave now.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe walked over to where Kiriyama stood.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Since you came all the way here to talk to me, I’ll give you one piece of advice,” said Kiryuuin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re going to give me advice? Sorry, but I don’t need that from someone beneath me,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“By that logic, you wouldn’t be able to get advice from anyone,” said Kiryuuin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo, with his back turned to Kiryuuin, let out a scornful chuckle. Kiryuuin continued speaking.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, just thinking of what I’m about to say as me speaking to myself. You should be looking ahead, not paying attention to the younger students. If you focus on the younger students behind you, you’ll going to be in for a lot of pain,” said Kiryuuin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What a boring monologue,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo seemed to have decided that standing around any longer would’ve been a waste, so he left.\u003c/span\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 5: Battle of the First-Years and Third-Years\",\"volumeId\":\"y2v2\",\"chapterIndex\":11,\"prevChapter\":{\"volumeId\":\"y2v2\",\"chapter\":10,\"title\":\"Chapter 4: Approaching Summer, Premonition of a Fierce Battle\"},\"nextChapter\":{\"volumeId\":\"y2v2\",\"chapter\":12,\"title\":\"Chapter 6: Invitation\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : The White Room Student's Soliloquy\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: Changing School Life\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: Days Passing By\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: Approaching Summer, Premonition of a Fierce Battle\",\"href\":\"Text/section-0008.html#auto_bookmark_toc_top\",\"index\":10},{\"label\":\"Chapter 5: Battle of the First-Years and Third-Years\",\"href\":\"Text/section-0009.html#auto_bookmark_toc_top\",\"index\":11},{\"label\":\"Chapter 6: Invitation\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_top\",\"index\":12},{\"label\":\"Chapter 7: The Calm Before the Storm\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_top\",\"index\":13},{\"label\":\"Epilogue: Postscript\",\"href\":\"Text/section-0012.html#auto_bookmark_toc_top\",\"index\":14}],\"volumeTitle\":\"Light Novel 2nd Year Volume 2\",\"detailsLink\":\"/select/year-2/y2v2\",\"returnLink\":\"/select\",\"currentSpineIndex\":11,\"nextVolumeLink\":\"/select/year-2/y2v3\",\"nextVolumeTitle\":\"Light Novel 2nd Year Volume 3\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"t
