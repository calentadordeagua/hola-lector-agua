e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T2b7a0,"])</script><script>self.__next_f.push([1,"\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 5:\u003cbr/\u003eBattle of the First-Years and Third-Years\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT HAD BEEN ALMOST\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e three months since the new students first started here at the Advanced Nurturing High School, and they had begun to understand the state of things at this institution. The first-year students were also right in the midst of forming groups for big upcoming special exam. However, it wasn’t long after the school gave the students permission to start forming groups that things already started to not go so smoothly. The students in Class 1-D, led by Housen Kazuomi, stubbornly refused to join any groups and rejected offers to trade cards. If a student from another class came to them wanting them to be in a group, the Class D students demanded points in exchange, or otherwise they wouldn’t join.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBecause of that, the new students were put into a situation where they couldn’t freely form groups. Although representatives from each of the other three classes had been hoping that Housen would have changed his mind sometime in June, even today, on the first of July, the situation still hadn’t changed. There were classes within their grade level who tried to ignore Class D, but Yagami Takuya from Class 1-B put a stop to them. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile it was easy for the other students to ignore Class D and to create groups just from their own three classes, competition with the other grade levels was an important part of this special exam. Yagami had voiced the need that, in the event that issue was to be prioritized, they would absolutely need to handpick the best of the best from each and every class to make optimal groups. At about the exact same time, with the support of students who shared Yagami’s views, the three other classes had agreed to take a wait-and-see approach until\u0026#160;July.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Housen’s continued deliberate ignoring of the situation meant that those previous talks wound up becoming meaningless. And today, now that the deadline had arrived, the representatives of the four classes from their grade were supposed to gather to resolve the situation. Yagami had proposed that the gathering be done in a simple manner so as not to intentionally raise the level of confidentiality of the meeting. It was agreed that the leader of the class or someone close to the leader would attend. But as the time came after class ended that day, there was no response from Class D, the class that was at the center of all these issues.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn a hallway lined with rather unsurprising, nondescript first-year classrooms, the first person to show up to the meeting was Yagami from Class 1-B. That was because he thought it necessary that he show up before anyone else as the original advocate of the proposal. Not long afterward, Utomiya Riku from Class 1-C had shown up as well.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seems like it’s still just you here, Yagami.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, hey Utomiya-kun. I was kind of expecting it would’ve been you participating in this talk,” replied Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Although it’s not really like me to be a leader or anything, I came because no one else wanted to. While the kids in my class kinda like to go ahead and say whatever they want, they seem to not like these kinds of headache-inducing things,” said Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think it’s because they know that you’re such a dependable person that they asked you to come. I saw the updated OAA values this month. It says that your Societal Contribution score got bumped up to a B, didn’t it?” said Yagami, with a bright and chipper smile.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUtomiya, despite the fact he was being complimented, responded by wrinkling his brow. The person he was talking with, Yagami, had a C in Physical Ability, but an A in Academic Ability. In addition to that, his Adaptability and Societal Contribution scores had gone up to A thanks to his repeated contributions to Class B. In terms of overall ability, he was certainly a cut above. More importantly though, Class C wasn’t exactly in a situation that they could be happy about. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’ve lost somebody. To be honest, I think it’s a pretty big loss,” said Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t think that Hatano-kun would’ve gotten expelled either. It is really unfortunate,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yeah.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHatano was a male student from Class 1-C. He was a valuable student too, with an A in Academic Ability. However, he had been dealt a fatal blow as a result of him being involved in actions that, once discovered, resulted in a penalty of immediate expulsion. The somewhat relaxed first-year students were once again reminded of this school’s harshness. Though at this point, it had already been a month since Hatano had been expelled.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUtomiya, his classmate, didn’t even have the time to regret his loss, unfortunately. Now that he had lost one of his best students, he needed to get definite results on the upcoming special exam.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seemed like you and Hatano were pretty close,” said Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He said he wanted to join the student council together. He wanted to make the school a more fun place to be,” replied Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUtomiya nodded lightly and then directed his gaze towards the Class 1-D classroom.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you think that Housen’s gonna come?” asked Utomiya, wondering about the very person about which this discussion was taking place over.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess I’d say it’s about a fifty-fifty chance,” replied Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fifty-fifty? Wow, you sure put a lot of faith in Housen, huh. I’m betting he won’t show,” said Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If he doesn’t show up to this meeting, then the matter is settled. We’ll go ahead and form groups with students from our three classes. If that happens, then Class D and Class D alone, which has been trying to push for getting a lot of points out of us, will be left out in the cold. Then any chance they have to win will disappear,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If he thinks that he can make us fork over our Private Points, then he really has a massive ego. He objected to the idea of trying to smoothly form groups with people from all classes together. Since the second- and third-years are our enemies here, we really ought to work together. Yet Housen still refused anyway,” said Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though they were all in the same grade level, Housen wanted to compete in areas where they didn’t even have to. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems that way, at least on the surface. But I can’t imagine that’s what Housen-kun actually planning, deep down.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can understand that it’s a bargaining tactic on his part. But it’s one that’s not going to pay off for him.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If he really intends on playing that game though, then I have to wonder if that might actually be a blessing in disguise for us. Because that means that Housen-kun isn’t that much of a threat to us then,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yeah, you’re right,” replied Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYagami explained that he had arranged this meeting to gauge what Housen was thinking. As the two of them were in the midst of their debate, a third person showed\u0026#160;up.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, hey! Riku, Takuya. I figured it’d be you two!” shouted Takahashi Osamu, from Class 1-A, greeting them in a loud voice and waving as he came closer.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough he had a low Academic Ability ranking, just a C+, he was particularly good at getting to know people no matter who they were. He was often called up to participate in discussions. He had many friends in other classes and other grade levels too.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Osamu-kun, did you come because you were forced into handling things for your class again?” asked Takuya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, the leader of our class is the kind of person who hates dealing with this sort of hassle, y’know? So that’s where I come in,” replied Takahashi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, this discussion is going to move a lot more smoothly now that you’re here, Osamu,” added Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust like in Utomiya’s case, the leader of the class didn’t have to come to this discussion. On the contrary, it would have been more appreciated by the other classes if the students who came for these talks were the ones who excelled in conversation. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All that’s left is Kazuomi, huh?” said Takahashi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was only about three minutes left until the appointed meeting time. If he didn’t show up, the three other speakers would proceed with their meeting without hesitation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t you all think it’d be better if we teamed up right at this stage? Because honestly, I really want to isolate Class D so we can crush them as soon as possible,” said Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’ve been told that the exam on the uninhabited island is going to assess more than our academic abilities though. If you’re looking at academic ability alone, then Class D is at the bottom of the rankings, but in terms of physical ability, they’re a close second. It’s possible that they could play a key role in group-building,” said Takuya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Look, I get what you’re tryin’ to say here Riku. My class is feeling pretty darn frustrated with the situation too. But don’t you think it’s a little too early to just give up on Class D? I mean, we can’t say for sure that there aren’t going to be more exams like this in the future where all the classes in our grade have gotta work together, right?” said Takahashi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile Utomiya had advocated for ostracizing Class D, Yagami had continued to maintain that they needed to support Class D. Takahashi, meanwhile, didn’t really take a firm stance on either side, remaining in the middle. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we just need to work together to tackle this exam, then we’ll be fine if it’s just us our three classes. I’ll admit that yes, there certainly are some capable people in Class D that we could use, but they’re not worth enough to the point where I want to make a request to Housen and try to get in his good graces. Besides, it’s just about time for our meeting to start. I’d like our three classes to start talking about reaching an agreement between ourselves,” said Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust then, almost as if he had anticipated how their conversation was going to go, the person in question appeared, with a relaxed attitude.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“’Fraid that things aren’t gonna work out that way, Riku,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems like you came after all then, eh, Housen-kun?” replied Yagami, greeting Housen with a smile on his face. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOn the other hand, Housen approached the three of them while bearing his white teeth in an unnerving manner, like he usually did. Utomiya shot a quick glance over at Housen, and then averted his eyes, looking out the window.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey Kazuomi, who showed up at a great time!” exclaimed Takahashi in a friendly manner, without fear of Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTakahashi’s feeling was that he wanted everyone to get along. That’s all that he wanted.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t say my name like we’re all buddy-buddy. I’ll kill you,” snapped Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHousen, after trying to intimidate Takahashi, turned his eyes back to Yagami and Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, decided to pay up?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t make lame jokes. We’re not paying you a single point,” replied Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now, now, let’s calm down, okay? We can’t hold a discussion if you’re fixing for a fight right from the get-go,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, now that everyone’s here, I guess we can get this thing started. For the groups, we—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t just start yammerin’ outta nowhere,” snapped Housen, shoving Takahashi by his shoulder, causing him to fall down hard on his bottom.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUtomiya, displeased by Housen’s actions, shot him an intense glare.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Housen. Don’t bring your violent attitude here.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh? What, you plannin’ on gettin’ in my way?” replied Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If necessary, yeah,” said Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmph, ain’t that interestin’. If you feel like you can bring it, then go ahead and try,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen Housen raised his left hand in the air, Takahashi scrambled back to his feet.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, wait, hold on! Look, I just slipped and fell, that’s all, man. Come on, calm down, Riku,” shouted Takahashi, in a panic.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“See, that’s all it was, yeah?” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unfortunately for you, I’m not as nice as Takahashi,” replied Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, why don’t ya show me what ya got?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust when Housen made a fist, Utomiya reached out and grabbed his arm.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh…?”\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_6\" src=\"/hola-lector-agua/images/books/y2v2/OEBPS/Images/INTERIORIMAGES_6.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHousen smiled happily upon feeling the strength of Utomiya’s grip being applied to his arm. The look in Utomiya’s eyes showed that what he was doing wasn’t just for show. He had the determination to fight right then and there if necessary. Housen had thought it’d be fun to have a fistfight right there, but then he reconsidered it. Housen certainly craved fighting against the other grade levels more than anyone else, although he did things in a unique way.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, seems like I’m gonna have fun playin’ with you. I’ll save the fun for later, though,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You think violence is a game, do you?” replied Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure it is,” answered Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How stupid. But if that’s what you want, then I’ll give it to you right now. You don’t have to wait until next time. But only on the condition that you never lay a hand on any of my classmates ever again.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDuring this situation where things seemed like they could go off at any moment, both sides glared at each other, unyieldingly. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, hey, whaddya mean by that, huh?” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It means that I’m guessing you were the one who got Hatano expelled. He wasn’t the kind of student who would have broken school rules so easily,” said Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, that little small fry just got all scared of getting’ expelled, and he blew himself up. That’s all it was, right?” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I clearly remember the look on Hatano’s face after he got expelled. He got screwed over by somebody.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And yer sayin’ that’s me?” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who else could it be but you, jerk?” snapped Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough Housen had backed off a little earlier, sparks started flying once again.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, come on, calm down, both of you. Riku, if you just start throwing down right here, you’ll just be doing exactly what Kazuomi wants, man,” said Takahashi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Takahashi-kun is exactly right. The important thing right now is focusing our efforts on the upcoming uninhabited island survival exam,” added Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, right, right, we can make groups with peeps from other classes. That upcoming special exam,” said Housen, speaking as though the thought hadn’t occurred to him at all until just now. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So what? You refused to work with the other classes. This is none of your business then, isn’t it?” said Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey now, if you really insist, and I mean like, really insist, I’ll work with ya. See?” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Enough jokes. I wouldn’t team up with you even if you were the last person standing,” replied Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Talk about ice cold,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUtomiya slowly released his grip on Housen’s arm. Yagami, who had been watching the situation unfold, cut in right then, determining this moment to be the right time.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re wasting time. Shall we get started?” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, who said I’m joinin’ your little conversation here? I ain’t startin’ anything,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then why did you even come here? Just to kill time?” said Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And if I said yeah?” replied Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wouldn’t believe you. You’re not that stupid,” mocked Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though he was speaking with Housen, Yagami smiled unabashedly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This whole uninhabited island survival thing certainly sounds like a far-fetched idea, but the second- and third-year students have already experienced it before. We first-years have to take this test while at a significant disadvantage,” explained Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But we’re also gonna get a handicap in our favor too though, right?” said Takahashi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the face of the optimistic Takahashi’s comment, Yagami continued to explain his stance in a calm and gentle manner.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The second- and third-year students have an advance in both academic ability and physical ability because they’re older. That fact remains unchanged. If we can’t work together, the upperclassmen might eat us alive. You see?” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was exactly why Yagami was stressing that cooperation amongst their four classes was essential.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Spare me your weak sauce nonsense, Yagami. Second-year or third-year, I’m confident I can crush ’em,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, there are some students who are more exceptionally talented than others, of course. But there’s no hiding the fact that in terms of overall ability, our grade level is inferior. Not everyone is as blessed as you are, Housen-kun,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYagami’s constant gentleness and the fact that he demonstrated he highly valued Housen’s abilities were what kept the conversation from falling apart.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Which is why I think it’s necessary that we need to band together, and form one optimal group with students from our grade level. One strong group made up of four people. We need to bring together a group of students who can we definitely say, similar to what Housen-kun himself had said earlier, won’t be defeated even if they take on second- or third-year students,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Meaning that we’re not going to be competing with each other over Class Points in this special exam?” said Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The rules make it difficult to cooperate within your grade level, which is why the second- and third-year students who have less time left here are having a harder time accepting the lost opportunity for Class Points that comes with this particular special exam. But we still over two whole years left here. That’s why we should so deliberately forego the Class Points this time around,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe difference in Class Points between Class A and Class D in their grade level was still only 300 at most. While Yagami had suggested that there was no need for them to panic, Utomiya seemed to have different thoughts on the matter and wrinkled his brow in response.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The benefits from cooperating with the other classes are too slight, though. Just throwing away Class Points would be a waste,” said Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we get eaten alive by the upperclassmen though, losing Class Points isn’t the only thing we’ll have to worry about,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But it means no one is going to pull ahead in our grade level, though,” argued Utomiya, stressing that if problems arise like Yagami suggested after their battle, then that was simply inevitable.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, hey, hold on a second. I’m kind of curious about one thing you said earlier, Takuya. Why just one team? The groups who place in the top three will all get Class Points, right? Also, if we consider the fact that we can form up into bigger groups during the actual island part of the exam, then wouldn’t it be better for us to make lots of strong groups?” said Takahashi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You are absolutely right. However, if we try to make a lot of strong groups from the get-go, we’re going to have to think about the balance of each group. We’re going against the older students. They aren’t going to be easy opponents for us to beat. In that case, it’s important that we focus on making our strongest possible four-person group, to reliably ensure that we can take first place. Besides, it sounds like it will be difficult to freely form into larger groups during the main exam part, and even if the upperclassmen really do their best to work together, they can still only form three-person groups, representing three classes,” responded Takahashi quickly, in an effort to quell Takahashi’s doubts.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter Takahashi heard Yagami’s response, he understood what he was getting at.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, if we get first place, the rest doesn’t matter. Even in the worst-case scenario and we throw everything else away,” said Takahashi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I do think that yes, we could make a strong enough group if we were to ignore Housen-kun and just work with our own three classes. However, then we’d be essentially playing by the same rules as the other grade levels. The reason I’d like all four classes to work together is not just so that we can hand pick the best possible people. It’s also because I think it will help unify our will to fight together, as one, across our entire grade. We first-year students were the only ones given the option to create groups of up to four people. It would be a waste for us to throw away that valuable handicap we were given,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Class D alone were left out of the equation, it would naturally lead to a situation where they would try to hinder everyone else in their attempts to get first place. And if that happened, it was clear that Class D would do anything and everything in order to prevent the other classes from winning. Yagami was saying that if the four classes can cooperate fully, they should shoot for that ideal structure. Then, Yagami turned to Housen once more.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand that you and you alone can hold your own in a fight against the older students. So, I hope that you’ll lend us a hand,” said Yagami, appealing to Housen that they needed all four classes.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUtomiya though, eyed Housen suspiciously. He didn’t think that the person who had refused to even discuss the matter for more than two weeks would agree to such a thing.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right. I’ll work with ya,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Housen had readily accepted Yagami’s proposal.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…What are you plotting, Housen?” asked Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whaddya mean, what am I plottin’? You said you wanted my help. And how can I not listen to such an adorable little request?” replied Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right then, let’s hear your conditions,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter considering how quickly Housen changed his stance on the matter, Yagami quickly urged him to speak as not to waste any time.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Two spots in the main big group gotta be reserved for Class D students. That is an ironclad requirement,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?” balked Utomiya, naturally disgusted by Housen’s proposal, which had the possibility of benefitting only his own class.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But what happens if we can’t form the kind of big groups we want on the island? What then?” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I already told you. My conditions are that Class D students are included in the main group. No buts,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. If we can’t bring two Class D students into the group on the island, then we’ll clear it with just the initial four students,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“’Sides, if we got the four best o’ the best in a group to begin with, it shouldn’t really matter, right? Ain’t gonna mess with our chances of winnin’.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s enough of your crap, Housen,” said Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I ain’t bullshittin’. If ya don’t like it, then you can screw off.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Look here, jerk…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUtomiya was about to get up in Housen’s face because of the absurd demands he was making, but Yagami quickly slid in between them, separating them from each other. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please calm down, Utomiya-kun. I’m okay with his condition,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re just going to hand them the chance to get all the benefits on a silver platter?” asked Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Our priority right now is for our grade level to come together as a unified front. We absolutely cannot lose to the other grades,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we just let Housen get what he wants right now by acting this way, he’s gonna do it again,” said Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we abandon Housen-kun’s class right here and now, will anything be any different?” asked Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What matters is that our grade wins the upcoming exam. Anything else isn’t that big a deal,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I gotta say, I agree with him on this one, Riku. I understand how you feel, but first we have to work together as a grade,” said Takahashi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUtomiya clicked his tongue defiantly but gave in thanks to Yagami and Takahashi’s efforts to persuade him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fine then. No other demands on top of that, though. You get that, Housen?” said Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHousen didn’t respond to Utomiya’s statement though. He simply turned his back to him as if to say that this was the end of the conversation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s one last thing that I wanted to mention that I think that our grade needs to be together on. I think that the item cards should be carefully re-distributed throughout our entire grade level to avoid any in-fighting, and so that we can use them to their maximum effectiveness. It’s also important to make sure that the students lacking in ability and in the groups that are more likely to sink towards the bottom of the ranking have the Half Off card. I assume that you will agree to that as well, Housen-kun?” asked Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do whatever you want,” replied Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHousen then immediately left without any signs of reluctance. While the three others watched him go, Takahashi leaned over to speak to Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, by the way Takumi, who are you plannin’ on pickin’ from Class B?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Suffice to say, I think that the four of us who came to this meeting here today would be the best people for making our strongest group. That includes Housen-kun, of course. Do you think I’m wrong about that?” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYagami looked at Takahashi, Utomiya, and then at Housen as he walked away, with his gentle but piercing gaze. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if we admit that Housen is capable, it’s wrong to bring him into the fold. He’s—” said Utomiya, before getting cut off.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, we can take our time and carefully decide who will be in the group later. Don’t you feel like it’s enough that we manage to find a unified direction for the time being?” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…All right,” said Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we work together, we can get first place. Let’s shoot for that, for right now,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough Utomiya was reluctant, he still found himself convinced and agreed to what Yagami had suggested. Afterward, they each went their separate ways.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e5.1\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eFTER CLASS THE NEXT DAY\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e at the café in Keyaki Mall.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I hate that kind of watch. The way the second hand on the clock moves is so irritating, like tick-tock, tick-tock,” said Amasawa, expressing her dislike for the wristwatch that Housen had on his left arm as he sat directly across from her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh, shut the hell up. Do you even have any clue how much this thing is worth?” he snapped.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Worth? Is that like a premium one or something? I don’t have time to learn about stuff I hate,” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Pft, this is why chicks’re so stupid,” said Housen with a smile, briefly stroking his watch.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, look here you… Well, whatever, forget it. So, what did you want?” asked Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I called you here to talk ’bout the upcoming island exam thing. Team up with me, Amasawa,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, you want my help again, huh? And on the island too, hm. You thinking about something naughty?” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?” replied Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though Housen furrowed his brow and glared at Amasawa, she responded by flashing him a devilish grin, without an ounce of fear. Then, after slowly lowering her crossed legs, Amasawa quietly spread them wide.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You wanna see my panties? You can peek from under the table if you want. Okay?” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf he crawled under the table, he could see right between her spread legs. In the face of this temptation though, Housen leaned forward, placing his right elbow on the table.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You seriously think I won’t raise my hand against a girl?” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh no, I do think you would, absolutely. Don’t worry. I figure you’re the type who would have no problem beating on a girl without a second thought,” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, stop spoutin’ stupid crap. It’s a waste of time,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, a waste of time, hm? Well, all right then, let’s hear it. Your plan. Why are you inviting me?” asked Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“’Cause you got the kinda guts not to hesitate when it comes to gettin’ Ayanokouji expelled,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, sure? I mean, there are lots of people who know about the bounty and aren’t doing anything about it, or they’re willing to take a shot but only half-heartedly. I\u0026#160;figure that if there’s two million at stake, you would do everything in your power to crush it. Isn’t that normal?” said Amasawa, without showing any signs of shame or guilt whatsoever. “So, what am I gonna get in return for helping you? I’m not cheap, you know.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust then, after Amasawa had asked Housen what she could get for this, a stern voice came from behind her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We will all be equal. I believe I said as much before.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat voice belonged to none other than Nanase, who had arrived at this gathering slightly late. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Equal? Wow, you’ve got such a cute face, but your words sure aren’t that sweet. You just came right out and said it. So, does Housen-kun appreciate the fact that you’re not timid at all?” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe three of them were now seated around the table.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right. So, Housen-kun was thinking of having us three together in a group. Who’s the fourth person though?” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t need a fourth. The winner o’ this island exam thing ain’t gonna be anyone from the second-years or third-years. It’s gonna be us three,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, aren’t you the confident one? But it does seem like there are lots of senior students who’re tougher than the first-years, don’t you think?” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Doesn’t matter. I’m gonna crush ’em all,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, supposing even if you’re number one in terms of ability, Housen-kun… Didn’t we first-years talk about cooperating? You know, all four classes together? If we’re talking about the heavy hitters in Class D, then I’m pretty sure that you two would be the top picks for that, right?” Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m the one in charge of Class D. That’s for me to decide. You get what I mean?” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, you mean that you’re going to unashamedly send in a couple of small fries from Class D to represent us as our main forces, for the group. You’re gonna be making enemies in all directions,” teased Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That all depends on what you consider the criteria for our ‘main forces’ to be. If we send in students who have high academic or physical ability at the very least, then there won’t be that much risk. Besides, if we place Housen-kun in that supposed strongest group, there will be problems,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, sure seems like he doesn’t exactly play well with others, that’s for sure. In that sense, it’s safer that we leave him out of that group. Anyway, back to the topic at hand, how much are you gonna give me?” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There aren’t any points for us to give you. As I had just said earlier, we will be equals in this partnership. Of course, we will give you an equal share of the Private Points that Class D receives,” replied Nanase, implicating adding, “Is that not enough to satisfy you?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But it’s not like our level of contribution is necessarily equal though, is it? After all, I’m confident that I can contribute more than anyone else, on the uninhabited island or wherever. Seems like this exam is gonna take an awful lot of stamina. Nanase-chan, you’re a little cutie. Can you keep up with me?” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shall we test that?” replied Nanase, responding to Amasawa’s provocations with one of her own.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAmasawa turned her gaze onto Housen for a moment, but then without warning, Amasawa extended her arm, reaching for Nanase’s face. She was intending to catch Nanase off guard and surprise her with a slap to the face to rattle her. However, Nanase didn’t show any hesitation either and quickly grabbed hold of Amasawa’s arm as she extended it towards her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re pretty bold, aren’t you? Thinking you can test me right here,” snapped Nanase, in a harsh tone.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh wow. You can hold your own pretty good, huh? I\u0026#160;just love strong girls,” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re not exactly normal either,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm, maybe? Wanna test things a little more?” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile one of them was smiling, the other was stone-faced. It was as if they were spending that time assessing each other’s strength.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You, me, and Nanase are gonna make a group of three. Got it?” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I get that Nanase-chan can hold her own more or less, but I still can’t think that we’re really on equal terms, y’know.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why? Is that because the two of us are from Class D?” asked Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t care about that. I mean, sure, it seems like the Private Points will be evenly split between everyone, sure. It’s just… Well, since you’re asking me to help you, I think need something extra for it,” said Amasawa, putting her left hand into a fist, and then making the gesture of asking for a tip by pinching her thumb and index finger together and then rubbing them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, it’s only natural you’d wanna sell yourself for a high price if someone comes along and wants to pay you for your services, right?” added Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You sure got a hell of an ego. Man, you chicks, both you and Nanase, have more guts than Yagami and Takahashi,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, don’t you know? Girls these days are stronger than boys,” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right then, fine. I’ll hear you out. What do you want, aside from the group rewards?” asked Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Getting first place, of course. But that’s not the only important thing here,” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen, Amasawa stopped making the tip gesture with her left hand, and brought her hand up to her neck with her thumb raised and pressed against her neck. Then she slowly slid her thumb from the right side of her neck to her left, in an execution gesture.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I get everything. All the points from getting Ayanokouji-senpai expelled. That’s my condition for helping you,” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Pfft. Now you’re really makin’ some unreasonable demands. Those are terms I can’t just sit back and agree to so easily,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, so are you gonna turn me down then? But what are you going to do without me? If you don’t have any allies you can trust aside from Nanase-chan, you’re going to have a pretty tough time in this special exam, aren’t you?” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust like Amasawa had suggested earlier, Housen had already been making enemies on all sides. Moreover, since the four classes were planning to work together, if Housen went ahead and just formed his own group aside from them, there was no way other students would be willing to give him a hand. At least no one besides an odd duck like Amasawa, that is.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And besides, if I team up with Housen-kun, I’ll be even more isolated in Class A than I already am. Isn’t it only natural that I’d ask for appropriate compensation in exchange before I could say yes to you?” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHousen and Amasawa exchanged long, hard looks.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s true that if you hand over the entire bounty to me for getting him expelled, that means you won’t be getting a single point yourself. But you’ll get all the credit for being the one who got Ayanokouji-senpai expelled, Housen-kun. Isn’t that good enough?” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no need to accept her conditions. If you think about our future, if Class A were to get an extra twenty million points, then—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shut up, Nanase,” said Housen, cutting Nanase off before she could finish giving her advice, as he continued to stare intently into Amasawa’s eyes.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll give you the bounty,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thanks. You know, I think the fact you’re not a stingy tightwad is actually pretty lovely,” said Amasawa, getting up from her seat in a smooth motion.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looking forward to the exam!” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that negotiations had been concluded, Amasawa had decided there wasn’t any reason to stick around much longer and she left without batting an eye.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you really okay with this?” asked Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s fine,” replied Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand. It is your decision to make. But are you sure it’s okay to trust Amasawa-san? I think she’s the type of person who would betray her partners without losing any sleep over it,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Trust? Don’t just assume I’m trusting her. I don’t trust her or you,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then why did you decided to make a group with her?” asked Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“’Cause she’s different than the rest of the trash out there. There are parts of her I can’t figure out. Just like with you,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. I suppose you might be right about that. But even so, twenty million points is an absurd condition,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It was just a verbal agreement. I don’t give a damn about it. As long as the fact remains clear that I’m the one who got Ayanokouji expelled, then I’ll be gettin’ those points, of course. Doesn’t matter to me if she comes cryin’ about it later,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHousen was saying that he never had any intention of honoring his promise from the beginning.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You really are a terrible person,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t matter if it’s Ayanokouji, Ryuuen, or anybody else. Anybody comes barin’ their fangs at me, I’ll crush ’em. I’m gettin’ fed up, bein’ all caught up in the crazy stupid rules at this school,” said Housen, looking like he was having so much fun that he could hardly contain his laughter.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e5.2\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eS\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eUMMER VACATION\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e was approaching. It was now July 6. With the exception of Akito, who was on headed over to his club activities, everyone in our group was gathered around my seat near the entrance to the classroom. That was because we had promised to meet up at Keisei’s room later. As soon as we had left the classroom though, I was approached by Kushida, who called out to me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun, may I have a moment?” asked Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s up?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was a bit unusual though, as I had been approached by Kushida less and less frequently as of late. Even though I sent her points once a month as per our agreement, all we did was make an exchange. We didn’t engage in conversation. And since the number of Private Points each person in class received would normally be the same, there wasn’t any need for students to thoroughly check every person’s account for anything.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To tell you the truth, a first-year student says that they want to meet with you, Ayanokouji-kun… Would right now be a bad time?” asked Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida gave an apologetic glance to the Haruka and the others in the group, and then continued speaking.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think that it’ll probably take about an hour or so. They asked me to help set up a meeting between you,” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s up, Kiyopon? Maybe some first-year girl is gonna tell you she’s got the hots for you or something?” teased Haruka, her joke causing Airi to panic.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-huh whaaat?! R-really?!” wailed Airi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If it is true, then I feel like we can’t allow him to go,” concluded Haruka.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was the one who arbitrarily suggested it was about a girl, and now she was arbitrarily telling me that she was not giving me permission.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Is that true?” I asked, deciding that I ought to check with Kushida if it actually was the case, just to be on the safe side.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? U-uh, well… It was a boy who said that he wanted to meet with you… Sorry,” said Kushida, apologizing to me with a somewhat uncomfortable look on her face.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, she really didn’t need to apologize to me for that at all though. Even though I didn’t think it was something like what Haruka suggested in the first place anyway, I was relieved to her Kushida tell me that.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s fine for you to go, don’cha think? I mean, I think it’s a good thing to have a little tête-à-tête with the new kids, right?” said Haruka.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I agree. Our circle of friends isn’t particularly good at relationships with people, so it wouldn’t be a bad idea for Kiyotaka to get to know some more first-years,” replied Keisei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePutting aside whatever this student’s intentions were, Haruka and Keisei were saying it would be a good thing to at least have some face time, if only a little. Airi felt relieved that it wasn’t anything romantic and appeared happy and willing to send me off. In that case, I supposed there wasn’t any reason for me to refuse the offer.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay. What am I supposed to do?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, thank you! Um, well, I’ll go ahead and tell him that you said it was okay, Ayanokouji-kun,” replied Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida then took out her phone and started dialing someone’s number. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Welp, we’ll be heading out then already. We’ll meet up with you later,” said Haruka.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd with that brief exchange, the other members of the Ayanokouji Group went on back to the dormitory ahead of me. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry about that,” said Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’m guessing that the call must not have connected yet, because Kushida had apologized to me, with the phone still up against her ear.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s no big deal. Nobody in my group is going to complain about something like this anyway,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShortly afterward, the first-year boy seemed to have answered the call, and it connected.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, hello? Yes, Ayanokouji-kun says he’ll meet up with you now. Okay. Yeah, okay. Oh, really? Well, we’ll just wait here, then,” said Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida had finished her call in less than ten seconds.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems like he’s already headed this way. Let’s just wait here so that we don’t miss him then, okay?” said Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, this new student who wanted to meet with me had already set his signs on the second-year classrooms.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems like you’re already on pretty good terms with the new students, Kushida,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Oh, well, it is already July, right? I think that’s already plenty of time…” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yeah, I suppose so,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt had already been more than three months since the new students had arrived at this school. As I gazed out the hallway window, I saw the sun shining high in the sky, with its shining, scorching hot rays hitting the ground down below. It was just about time for the first great chorus of the year of the cicadas to begin. So, I supposed that from my perspective as someone who has trouble communicating with others, it’s “only” been three months, but for Kushida, that was more than enough time to connect with people, huh?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun, have you made any friends out of the new students?” asked Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe had said that in such a way that it sounded like it was only natural that I should or would have, but no, that wasn’t the case.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I still haven’t met anyone I could call a friend, no,” I\u0026#160;replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I see. Well… There’s no need to rush. There’s still lots of time,” said Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida had offered me kind, considerate words, but her assurance seemed somewhat hollow. There were certainly several first-year students that I’ve started talking to, sure. However, we hadn’t developed any kind of relationship where we’d be contacting each other privately. My conversation with Kushida came to a sudden stop once the mood got awkward. Just when I was wondering about what I should talk to Kushida about next as we stood here in the hallway, the first-year student in question showed up.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kushida-senpai.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe student who appeared after just turning the corner was none other than Yagami Takuya, who had attended the same junior high as both Horikita and Kushida. Seeing Yagami’s appearance as a chance for her to dispel the awkwardness hanging in the air, Kushida flashed a smile.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yagami-kun is the boy who said that he wanted to meet with you, Ayanokouji-kun,” said Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hello, it’s nice to meet you, Ayanokouji-senpai. Thank you for making the time to meet with me today,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBecause he was a first-year student who was reaching out to me via Kushida, I had a certain idea of what he was like in mind.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I remember right… You’re in Class 1-B, right?” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, that’s exactly right. My name is Yagami Takuya.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs one of the bystanders who saw what happened during that fiasco before with the new students, I remember that I saw Yagami there, but I didn’t end up speaking with him at all. This was the first time we had actually had a conversation, right now, before the start of summer. It was said that he had emerged as the leader of Class 1-B, but I had to wonder how far his influence has reached. He was affable, friendly, and had a cute look. That, combined with his prominent level of academic ability, made it seem like he was quite popular.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I suppose it might not be appropriate for us to have our conversation standing around here, but how would you feel about heading to my room? I actually have just gotten my hands on some rather rare black tea leaves that I had ordered. It takes a while to brew, but it is quite delicious,” said Yagami, adding that if I would like some, he would love for me to partake.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t normally drink black tea, so I was a little curious. But if we did that, then we might not be able to get this meeting completely wrapped up within the hour.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, sorry Yagami-kun. To tell you the truth, Ayanokouji-kun is supposed to be meeting up with some friends later. I think it would be better if the meeting could be kept under an hour, if possible…” said Kushida. \u003c/span\
