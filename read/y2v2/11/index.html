u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida had guessed that Yagami’s proposal would take some time, so she went ahead and gracefully rejected his offer on my behalf.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. That’s all right. Well then, how about we have our talk in the café at Keyaki Mall?” he suggested.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough he seemed a bit disappointed, Yagami readily went along with it, having understood my situation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, let’s be going then. Shall we, Ayanokouji-kun?” said Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI nodded in response, deciding to head over to Keyaki Mall together with Kushida and Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh yes, that reminds me. The special exam on the uninhabited island is about to begin, right? Kushida-senpai, Ayanokouji-senpai, you had experienced a similar exam last year, right?” asked Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. It was a tough time,” said Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Could you possibly tell me what rules there were in that exam? And about what had happened then? We first-year students don’t have the benefit of that experience, so we’d like to least gather some information,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I don’t mind sharing that with you, but…I’m not too sure if it’ll be useful. It does seem like the rules this year are completely different from what they were last year,” said Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I understand. I’ve also heard that the exam that you had taken was different from the island exam that the third-year students had before as well,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh yes, now that you mention it, the third-year students did have an uninhabited island exam too, didn’t they?” said Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“From the sounds of it, they had also taken it in their first year, like you. It seems that before, this uninhabited island special exam had only been conducted once during a student’s educational career at this school… Is this year an exception? Or has the rule changed starting this year?” asked Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, Yagami had a lot more information than we did.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you find it strange? That I have information about the third-year students?” asked Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYagami had directed his comment at me. I had been quietly listening up until that point.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s because I joined the student council. In doing so, I was able to ask President Nagumo, and he gave me new insights into the uninhabited island survival exam that had been held the year before last. At the time, students were divided into groups of four within their classes, and a total of twelve groups had competed with each other, apparently,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_7\" src=\"/hola-lector-agua/images/books/y2v2/OEBPS/Images/INTERIORIMAGES_7.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe rules for their uninhabited island survival exam were different from the rules that we had in ours before. It was basically safe to assume that, with few exceptions, no special exams would be the same as ones that came before. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How did you spend your time on the island before? I\u0026#160;was thinking that I might be able to get some clues from that,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if Kushida and I kept quiet about it and deliberately didn’t tell Yagami, it was obvious that someone else was going to tell him anyway. There probably wasn’t any need to pointlessly try and hide it from him. And besides, there was no way that Kushida wasn’t going to answer, anyway. Then, just as expected, Kushida started to politely explain what happened during last year’s island exam. I continued to listen in silence as I followed behind the two of them.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e5.3\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eB\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eY THE TIME\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e that Kushida had finished telling Yagami about the island survival exam that we had before, the Keyaki Mall café was now just around the corner. We had expected that it would’ve been easy for us to have gotten seats at the café, but an unexpected situation had arisen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s quite crowded, isn’t it?” remarked Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe café was completely booked up. There were even students already waiting near the entrance, hoping for seats to open up.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What should we do? Do you want to try looking at the second floor for a place to chat?” asked Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please just wait a moment,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe took out his phone with his left hand and started fiddling with it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just checked with my friend. It seems like the café on the second floor is crowded too. Since we have to wait in either case, and there only are two parties in front of us, why not just sit tight here?” he suggested.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, his friend was already at the other café, and Yagami had just contacted him via text. He had made a quick decision to avoid wasting time. At the same time that we had told Yagami that we agreed with his decision, he noticed a student approaching from behind. Maybe it was because he figured that if we dawdled too much in putting our reservation down that another group would get in front of us, but he grabbed a pen with his free hand while his other was still clutching his phone and wrote down both the number of people in our group and his last name on the board at the café entrance, with rather nice penmanship. It was quite noticeable when compared to the scrawls of the other students who had written down their reservations above ours.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow Yagami-kun, you have such nice handwriting!” exclaimed Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was only natural for Kushida to compliment him like that, after seeing his penmanship. Yagami smiled, seemingly pleased about it. Then, the three of us sat down on chairs that were placed outside near the café, to wait our turn.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, my grandfather taught me that even if I’m not capable in my studies, that I should at least write neatly,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your grandpa?” asked Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. My grandfather is a calligraphy instructor, you see,” he replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s amazing. My handwriting isn’t particularly neat,” replied Kushida, humbly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida was being modest. As far as I could remember from the few times that I had seen her writing, I wouldn’t say that it was bad at all. Though her handwriting wasn’t as sophisticated as Yagami’s, I remembered that she had neat penmanship and used rounded, girlish characters. Even so, this student Yagami didn’t seem to be boastful about his own abilities. Even though he said something about not being capable academically earlier, his academic ability ranking in OAA was currently rated A, which was exceptionally high. He was an honors student without a hint of nastiness about him. That impression made me think that he was practically Yousuke’s double. After a while, a table for four became available, so we put in our orders and took our seats.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To tell you the truth… Well, you might be thinking that it’s rather late for me to be mentioning this, but there’s something I wanted to tell you, Ayanokouji-senpai. You already know about the special exam that had been given only to an extremely limited number of first-year students, right?” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida listened to what Yagami was saying with a puzzled look on her face, probably because she hadn’t received any explanation about this prior. This special exam that Yagami was talking about, which was limited to very few people, was where the school would pay out twenty million points to anyone who manages to get me expelled, of course. Considering the way that Yagami had said that though, it seemed like it wasn’t just a rumor he heard about. He seemed to know about it as a real thing. However, just to be sure, I decided to wait and see what he was going to say next. Without confirming nor denying what Yagami had said, I instead waited for him to continue speaking. In response to that, Yagami nodded.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I had heard about it myself back in April. However, since I wasn’t interested in setting someone up to fall like that to receive a reward, I didn’t want to participate at all,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was true that Yagami hadn’t done anything to me at all. If he had been interested in getting the bounty, then it wouldn’t have been surprising if we exchanged glances once or twice. However, Yagami never seemed to have even looked in my direction until recently.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why are you talking to me about this now?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I had recently heard that Housen-kun made a pre-emptive strike which ended in failure. And that his attempt was the cause of the wound on your left hand, Ayanokouji-senpai. I don’t find the idea of him doing something inhumane unbelievable at all, but it seems like what he actually ended up doing went far beyond what I could even imagine,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’m not going to deny that,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida’s gaze flickered back and forth between Yagami and me as she listened to our incomprehensible conversation, trying to make sense of what she was hearing. At the rate things were going, Yagami was likely going to spell everything out loud anyway.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There is also…one more reason why I decided to talk to you, senpai,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Yagami didn’t get into telling me about that one other reason right away.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I had intended to simply stay on the sidelines as a bystander, for the sake of protecting the first-year students. However, if I leave things as they are, then Ayanokouji-senpai will… Well, I had determined that, depending on how this situation played out, there was a possibility that the damage could even extend to your classmates, Kushida-senpai. That’s why I had asked Kushida-senpai to set up this meeting so that I could tell you everything that I know,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida, who had been listening to the conversation, raised her left hand apologetically, hoping to find out what was going on.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um, I’m sorry, but I really don’t understand what you’re talking about…” said Kushida, sheepishly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Would it be all right if I continued?” asked Yagami, turning to me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t have any right to stop you,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed that Yagami had Kushida sit with us during this meeting because he was worried about her. Even if I told Yagami no, that it wouldn’t be okay for him to talk about this here, if he ended up talking with Kushida later about it, without my knowledge, it wouldn’t make a difference.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, I’ll explain everything, starting from the beginning, so that you can understand the full story. It started with a call from the Student Council President Nagumo. We were instructed to choose one or two representatives from each class and to gather in the student council office in secret. In truth, it wasn’t long after we had started school that we had been called in,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe key words “student council” stuck out in Yagami’s story.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The first-year students who had gathered there included Takahashi Osamu-kun and Ishigami Kyou-kun from Class A, me from Class B, Utomiya Riku-kun from Class C, and finally, Housen Kazuomi-kun and Nanase Tsubasa-san from Class D. A total of six people participated,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf that was true, then what he said was valuable information. It wasn’t mere coincidence that those two people from Class 1-C came up and talked to me then. However, what concerned me most of all was that Amasawa’s name wasn’t on the list.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The special exam that we were given was to get the second-year student Ayanokouji-senpai expelled,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?! Getting Ayanokouji-kun expelled?!” exclaimed Kushida, surprised, but still speaking in a quiet voice.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYagami nodded and then continued speaking. As far as I could tell, Kushida wasn’t acting suspicious or in any way that indicated she knew about this beforehand. She didn’t seem to know anything.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We were told to get it done by the start of the second semester at the latest, by any means necessary. We were also warned to not let anyone aside from the six of us find out about the contents of this special exam. Since Utomiya-kun and I were representing our classes alone though, we were each allowed to choose one classmate from our respective classes to talk to, to make things fair, but I still hadn’t talked to anyone. There is still a possibility that Utomiya-kun may have talked to someone, though,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMeaning that at this point in time, six or seven of the first-year students were aware of this particular special exam.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It was Nagumo-senpai, the student council president, who told the six of us that he would pay out twenty million points to the student who got Ayanokouji-senpai expelled,” added Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Th-that’s an incredible number of points… H-how could the school approve something like that?” exclaimed Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, I supposed that anyone would have been shocked to have heard about this exam. The question of how much I could actually trust Yagami was something that was going to bother me for a while yet, but for the time being, it didn’t seem like he’s lying. On the other hand, if he was lying and those lies were exposed later, then the relationship that Yagami and I would turn sour. If the second-year D class were disadvantaged in some way, Kushida would probably be harmed as well. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s perfectly understandable why you’d be so surprised to hear this, Kushida-senpai. We didn’t know much about this school ourselves back in April, but now we know much better. We understand that this special exam is certainly highly unusual. It was only because I had been able to make that determination that I had asked you to help me arrange this meeting,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter he had gotten through that much of his explanation, Yagami brought his cup close to his mouth, looking like he was taking a moment to pause and catch his breath. Now that Kushida had come to learn about the connection between the twenty million points and getting me expelled, Kushida asked Yagami a question.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Isn’t it kind of strange though, that the student council president would hold his own special exam…?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I suppose so. Well, I think it’s better to say that it’s a matter of how I expressed the idea that is causing the confusion here. Although this has been called a ‘special exam’ for simplicity’s sake, when you get down to it, I think it might be easier to think of this as a sort of challenge issued by Student Council President Nagumo to the first-year students,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was a chance that Nagumo was involved in this matter. Horikita had the job of exploring that possibility. However, just when I thought that Nagumo himself wouldn’t reveal his involvement so easily, the truth came out from an unexpected party, Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-why Ayanokouji-kun, though? Are there any other students that are being targeted like he is?” asked Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just Ayanokouji-senpai, as far as I have heard. As for the question of why him, I don’t think there’s any significant reason for it. President Nagumo said that he chose randomly from the second-year students. Which means that he simply drew one person out of 157 names,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed that Yagami wouldn’t have a way of understanding the full story as he didn’t know about Nagumo’s background. He didn’t seem to even doubt the idea that I had been randomly selected. Of course, it wasn’t like there was a zero percent chance that Nagumo had gone through the trouble of setting up some kind of lottery system and I had just been chosen by completely chance, but given the circumstances, I didn’t think that was likely. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had to wonder if Nagumo would go through the trouble of preparing twenty million points to deal with me. From what I had seen of him through now, I couldn’t imagine that he was the type of guy to go that far. Well, no, to be more precise, I’m sure that he would do anything if he decided he’d do it, but I wasn’t sure that his opinion of me was high enough to warrant it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Assuming that this is a special exam initiated by the student council president personally, how could he have gotten the twenty million points?” I asked, prodding Yagami a little to find out what hidden possibilities could still be in store.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, that’s a good question. I’m sorry to say this, but couldn’t this all be a lie or a joke? I can’t believe that he would put up twenty million points for such a puzzling exam,” said Kushida, incredulous.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had expected her to react that way. Twenty million points was just far too large a sum. If the student council president suddenly told you that he was going to pay out such a high amount, anyone would normally be suspicious.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It certainly is a hefty sum, for sure. I can see now how difficult it would be to accumulate that many Private Points. But at that time, we first-year students had only just started here, and with him being a third-year student, student council president, and someone from Class A, we naturally trusted him more than any regular student. More importantly though, I suppose we naively thought that of course he would have that many points,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough the amount of points the students got this year was lower than what we started with last year, the new students still all received 80,000 points upon entering the school. And that amount was deposited into their accounts every month. The dormitory was clean and well-equipped, and the Keyaki Mall was almost exclusively for the students’ use. There was a wide variety of stores. For students coming here, it was like being tossed into a dream world. We had experienced firsthand the sensation of losing our idea of what money was worth ourselves, after first coming here last year.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And the truth of the matter is, I had confirmed with my own eyes that he does have the twenty million points,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t strange at all that a man like Nagumo would have amassed such a vast sum. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But didn’t you find the idea of participating in a special that wasn’t sanctioned by the school to be a little, well, uncomfortable?” asked Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Putting aside the unpleasant nature of the assignment itself, no one really felt uncomfortable about the whole thing. I think that all the students aside from me were very open to it. They said that it was a legitimate special exam,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve never heard of the student council president issuing a special exam, though,” said Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it wasn’t because he trusted President Nagumo that we accepted the idea of the exam, though,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh…?” replied Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When the student council president told us about the exam, the Acting Director was present, as a witness,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd so, Tsukishiro, the person who had suspected was most likely to have been involved in this matter, had now come into play. The fact that Tsukishiro and Nagumo were working together and behind the twenty million points being put up had now been confirmed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In a situation like that, it would be entirely reasonable to accept what was said as a special exam without question, don’t you think?” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, if the Acting Director was there… Yes, you’re absolutely right,” said Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA special exam to get a student expelled. Some students would find that idea outrageous and suspect something was up after hearing something like that. However, the fact that the Acting Director was present had drowned out those suspicions. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That is all the information I have on the matter,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Although I’m grateful that you told me all of this, you might have brought some danger on yourself by telling me,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was immensely helpful advice for me, but there wasn’t any benefit for Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Will you be all right, Yagami-kun? If the fact you told us about this happened to get out, then…” said Kushida, trailing off.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll be all right, Kushida-senpai. I didn’t hear anything about any sort of penalty for telling other people about it,” said Yagami, flashing a smile, ignoring the concerns.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides, I’m already prepared for the hate that I’ll be getting from the other first-years. We were destined to clash with each other sooner or later anyway,” he added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed like he was fully prepared to meet the challenge, from the sound of it. Yagami Takuya of Class 1-B was most likely, fundamentally speaking, the type of person who adopted a nonaggressive defense policy. However, he might also make a pre-emptive strike out based on the principle of self-defense if the situation called for it. However, the extent to which Yagami was able to see the situation was unclear.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn a corner of the café, among the many students there, a female student occasionally glanced over in my direction repeatedly. She was seated directly behind Yagami, so he probably hadn’t noticed her there. It was Tsubaki Sakurako, from Class 1-C. Not too long after we started our conversation, she showed up at the café and positioned herself perfectly amongst the crowd, observing us from her seat. She had her cell phone in her hand and appeared to be talking to someone. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWas she after me…? Or perhaps her intention was to monitor Yagami, who had been casually chatting with me, at length? In any case, Tsubaki now knew that Yagami and I had been in contact. Whether this was coincidence or an inevitability, this was not a desirable situation for Yagami. In the relatively small confines of this campus, it was difficult to avoid being watched, no matter what you did. Even if a student couldn’t track a person on their own, they could cover a large area if their entire class were working together. This was also proof that the first-year students were engaged in their own battles. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please be careful, Ayanokouji-senpai. It’s quite possible that there are other students who, like me, broke the rules by telling their friends about this special exam,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, with that in mind, who do you think I should watch out for then, Yagami?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s see. I suppose that if you really think about it, Housen-kun from Class 1-D is definitely someone you should be wary of. An opponent who completely disregards the rules when he comes after you can be quite troubling,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, it sounded like Housen was perceived to be a dangerous person, even among the first-year students after all.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, if I had to name just one person to watch out for, then—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYagami was just about to say someone’s name, but he seemed hesitant to finish his sentence. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I think I’ll stop here, actually,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Why? I’m kind of curious,” said Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYagami let out a slight chuckle, and then responded.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I feel like this isn’t something I should talk about with you or the other students in your grade. If I mention the name of the name of the person that I’m wary of, then you’ll naturally take notice of that person, right? I think that it is important, but I don’t think it’s fair. I am sorry that I had said that about Housen-kun earlier though,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was true that Kushida and I would be wary if we were told that someone in one of the classes was a danger. We could also warn our class about whoever it was and prepare.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Also, I’m not entirely sure yet still. I only have something of a hunch that this person is dangerous,” admitted Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYagami seemed to think that even rivals should fight fairly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll look into the matter during the next special exam, for the time being. If I find that this person really is a danger, then I will tell you about it then, Ayanokouji-senpai,” said Yagami, promising to warn me after he confirmed the facts with his own two eyes.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please take care, Yagami-kun,” said Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I will. Oh, and also… I don’t mind if it’s after the uninhabited island exam is over, but I would like to make some time to meet with you again, Kushida-senpai, just the two of us. There is something that I have to talk to you about,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“O-okay. Sure. What about, though…?” said Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida had pretended like she didn’t know what was going on by responding like that, but even someone like me, who was a bit slow on the uptake when it came to these kinds of things guessed that there was something. The way that Yagami looked at Kushida was different from how a student would normally look at an older student. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In any case, the information you gave was very helpful, Yagami. I appreciate it,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s all right. I felt like it was it was ridiculous for you to be the only one at a disadvantage, Ayanokouji-senpai,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d like to say thank you too, Yagami-kun. Really, you’ve been a major help,” said Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just hearing you say that is reward enough for me. If Ayanokouji-senpai were to be expelled, it would inevitably cause your class to suffer a great deal of damage. And I really do want you to graduate from Class A too, Kushida-senpai,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere weren’t many first-year students that I had spent a long time talking to like this. Out of all of them, Yagami seemed to be an exceptionally ordinary honors student, and nothing more. I had always been on my guard as I had interacted with various students, thinking that someone might be the White Room agent, but so far, he seemed to the least unnatural first-year student with which I had interacted.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe hadn’t really done anything in particular to me so far. Far from it. He has been quite generous in giving me helpful information. Of course, that didn’t mean he was innocent. I wasn’t going to rule him out, but if Yagami was the White Room agent, then I felt like he was an opponent that I really didn’t want to deal with. I\u0026#160;did have my doubts that someone raised in that facility could become so natural in such a brief period of time. Anyway, for the time being, I’d just make the most of the information that Yagami had graciously given to me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It looks like there are even more people here now. I’ve finished my piece, so if it’s all right with you, I’ll be going on ahead now. Please excuse me,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you have something else going on?” asked Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh no, I just want to avoid letting the other kids from my grade see me,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough it was too late now, it was still the right idea. I\u0026#160;thanked him once again, and then Yagami made his exit. After he left, I stayed behind with Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seems like you’ve got yourself a good kouhai there, Kushida,” I remarked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. He’s almost too good for me, really… But this really isn’t the sort of development I was hoping for,” said Kushida, tracing the rim of her cup with her index finger. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t say anything aloud, but I already knew what Kushida was thinking about without really having to give it any thought. If Yagami had attended the same junior high that she went to, there was a possibility that he had known about her past.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yagami-kun knows,” said Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida simply came out and told me the answer to the question that I was curious about.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that okay? For you to just come out and tell me that, I mean,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if he didn’t know, it wouldn’t make a difference,” said Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Meaning—” I replied, before getting cut off.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It means that I’ll have to make him disappear as soon as possible,” said Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen Kushida muttered those words, looking at me as she spoke, I saw that there was a kind of intense determination in her eyes. Yagami clearly seemed to adore Kushida, but despite that, she still viewed him as an enemy? It seemed like Kushida would never, ever look favorably upon anyone who knew about her past. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’ll be harder to eliminate an underclassman compared to Horikita or me,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose that all depends on how you go about it,” replied Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJudging from the way she said that, it sounded as though she already had a plan in mind.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s the people who think that they’re so good, those who are so boastful of their excellence, who are the ones who get done in so easily. You and Horikita-san are no exception, Ayanokouji-kun,” said Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought we had agreed to a truce?” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For now,” said Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI hadn’t really been planning to let my guard down to begin with, but Kushida seemed like she was especially motivated. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At the moment I’ve been on something of a losing streak right though, so I’m going to just sit quietly. For now,” said Kushida, pushing her chair back, showing me that she was ready to leave.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“See you later, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince there was no reason for me to stop her, I simply watched Kushida go. What I had just learned now was that Kushida was working on some kind of strategy from behind the scenes.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e5.4\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eFTER PARTING WAYS\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e with Yagami and Kushida, I\u0026#160;headed over to the convenience store since I thought that I’d bring a little something with me for Keisei and the others when we met up. I also wanted to give the person who had been following me a at a safe distance a chance to make contact. I decided to buy some random snacks and several drinks.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um…” said a voice.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was long and drawn-out. Just as I was about to pay for my items, Tsubaki from Class 1-C approached me from behind. I saw that she was holding some kind of lollipop in her hand, probably meant as some slapdash way of appearing like she had simply come into the store to buy something. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, Tsubaki. You need something from me?” I asked, without mentioning the fact that she was at the café.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I want to talk to you about something. Could you wait outside for me?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTsubaki, looking somewhat listless, went ahead and paid for her candy. It was truly that we couldn’t exactly have a conversation right at the register, so I decided to quietly wait outside the store. I had waited for a while, but there wasn’t any sign of her coming out. When I turned around though, I saw that Tsubaki was simply looking at me while holding onto her phone and talking with someone. Wow, that was a pretty bold thing for her to do, making someone wait for her like that. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry I made you wait,” said Tsubaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTsubaki peeled the candy wrapper off with her delicate fingers as she started walking. She was headed in the direction of the dorms.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what did you want to talk about?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There was something I wanted to tell you, Ayanokouji-senpai, the next time I saw you,” said Tsubaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOkay, so she had been thinking there was something she wanted to tell me. What, though? I thought she would’ve stared getting into it right away, but she just kept licking her lollipop, not saying anything. Rather than being interested in me, it seemed like she was just paying attention to what was in front of her. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is it about Utomiya?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I said the name of the student I could think of just then, Tsubaki stopped licking her candy.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seems like I was right,” I added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He said that he’d be right over,” said Tsubaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, the person she had been speaking to on the phone back in the café was her classmate Utomiya after all, huh? A brief time after Tsubaki had called him, Utomiya came walking this way. Utomiya gave a gentle nod as he met up with us. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry for calling you out to talk like this,” said Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What in the world is this about?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWas this about Yagami? Or was this perhaps about the special exam I’ve heard about?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s about Housen Kazuomi,” said Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat came out of his mouth though was the name of a student that I hadn’t been expecting.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-senpai, you had partnered up with Housen during the special exam in April, right?” said Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBack then, Tsubaki had been looking for a second-year student to partner up with. Utomiya had approached me to ask if I could partner up with her, but I had turned them down.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I never imagined that your prior engagement was Housen,” said Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is it that surprising?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure that you’re already well aware that Class D doesn’t cooperate with others that easily. Even in this uninhabited island survival exam we have now, they’ve been entirely uncooperative, even up until the last minute,” said Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHousen should already know that there’s no advantage in being isolated. Housen seemed like he was going to keep acting bullheadedly without backing down. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We want to catch him off guard and hit him with a surprise attack in this exam,” said Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHis previously polite tone had become more aggressive, and his lips tightened.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, we don’t understand what the exam is going to be about. And the rules aren’t very clear either,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well… Yes, it’s certainly true that there’s no guarantee that we can lay any traps for the other groups or anything. But as long as the fact we’re competing with one another is a definite, I’m sure that something along those lines is going to be involved,” said Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat interpretation of the situation was most definitely correct. The idea that groups would be fighting against other groups was a given. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Housen doesn’t have that many Private Points right now. Meaning, if he were to be eliminated during this exam, even considering the lighter penalties that first-year students get, Housen won’t be able to pay up,” said Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn which case, Housen Kazuomi would unavoidably be expelled from Class 1-D. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you saying that you want to get him expelled?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You bet your… I mean, yes, I do,” said Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough he kept dropping his more polite tone and his word choices got more casual throughout our conversation, he answered without hesitation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can I start by asking why?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A boy from Class 1-C got expelled. His name was Hatano. I’m guessing that Housen had something to do with it,” said Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed if he was willing to throw out a name, then that meant he had collected a fair number of clues.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, this is payback then?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d be lying if I said that I didn’t hold a grudge, of course. But the important thing is to make sure that no one else gets inadvertently expelled,” said Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. Thanks to that, we lost a hundred Class Points,” mumbled Tsubaki dryly, popping her candy back into her mouth.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, I get the reason why, but what does this have to do with me?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Housen, fundamentally speaking, does not work together with anyone outside of his group. However, he worked with you, Ayanokouji-senpai,” said Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, he thought that by reaching out and contacting me, he might find some kind of weakness of Housen’s that he could exploit. Judging from Utomiya’s attitude, it seemed like he really did want to defeat Housen. Tsubaki didn’t seem to feel the same way, but I supposed that she was willing to cooperate with Utomiya. Otherwise, she wouldn’t have functioned as a go-between to connect me with Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please help me,” said Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t really just say yes to that when I don’t know what exactly we’re going to be evaluated on in this exam,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, would you please at least consider the offer and keep it in mind? If you do help us to eliminate Housen at an early stage of the test and manage to get him expelled, then… When that happens, we will pay you reward you handsomely,” said Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe seemed to be offering to buy my services, but there more than a few things about this that I found difficult to swallow. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Didn’t you consider the possibility that maybe I’m on Housen’s side? We might even have a decent relationship, considering that we were partners before. Didn’t you think that there could have been a risk in telling me what you just did?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn any case, he was divulging way too much information, without trying to protect himself at all.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s—” said Utomiya, before suddenly stopping.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUtomiya then directed his attention over to Tsubaki for the first time during the course of our conversation. I\u0026#160;followed suit, looking over in her direction as well. Her lollipop was starting to get smaller, and Tsubaki looked somewhat forlorn. Perhaps she hadn’t realized that she had attracted the attention of both of us, but she just stared at her candy. Not too long afterward though, she opened her mouth to speak.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Didn’t you get the injury on your left hand during your altercation with Housen-kun though?” she remarked, proceeding to lick her candy again with the tip of her tongue.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What makes you think that?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because we were after the twenty-million-point reward, too,” she replied, openly admitting to it without seeming to feel any guilt over it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. So, you were taking part in that special exam too then? I’m guessing that means when you approached me before, you were pretending to look for a partner?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though Yagami had already given me information about their involvement, I pretended that I didn’t know they had taken part. On the other hand, though, Tsubaki didn’t mention anything at all about the fact that I had been in contact with Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yep, exactly,” she answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But even if I had partnered up with Tsubaki back then, there wasn’t anything you could have done to have forced me to be expelled, right?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile it was true that they could have gotten me expelled if Tsubaki had given up on the exam herself, that would’ve meant she would’ve been expelled, too.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Probably can’t answer that,” said Tsubaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUp until this point, I had thought that out of the two of them, Utomiya had been the brains of the operation. However, judging from how things looked now, I could see something that suggested that wasn’t the case.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I do apologize for that. However, we’re no longer participating in that exam,” said Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if we were able to get you expelled, Ayanokouji-senpai, word about it would spread throughout the school in the blink of an eye. And it would obviously make us and Class 2-D enemies then. It’s only natural that your classmates would resent us for having pushed you out of the school,” said Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was essentially saying that he had realized that fact now, precisely because his own ally was expelled due to Housen’s actions.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay then, in that case, wouldn’t it be the same thing if you got Housen expelled?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t believe so. Housen’s own class is afraid of him. In fact, I believe that many of his own classmates would rather see him gone,” said Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf you weren’t worried about people holding a grudge against you, you could do whatever you wanted without hesitation, I supposed. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, please keep my offer in mind. All we want is to defeat Housen,” said Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter he had reiterated that part specifically, Utomiya and Tsubaki left, heading towards the first-year students’ dormitory. These students from Class 1-C didn’t let me on to what they were thinking, neither this time they had reached out to me nor the last time. Even so, the question of their relevance to the White Room agent was still unclear. For the time being, I would stay on my guard, and keep in mind what they had told me about Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e5.5\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eH\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eORIKITA HAD JOINED\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the student council, but even after officially becoming a member, I wasn’t getting any new information. Personal opinions about Nagumo aside, it seemed like the student council operated smoothly. Things got set in motion over the weekend, when we were about to finish with task of forming groups after the first week. I had gotten a call from Vice President Kiriyama. That was how this got started.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKiriyama had originally supported the previous student council president, Horikita Manabu, who had graduated last year. He had intended to stop Nagumo from running amok. But in the end, time had passed without the situation taking a turn for the better. Perhaps Kiriyama had given up too. At least that’s what I had thought, but then he came up and said he wanted to meet with me personally, setting up an appointment. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStill, what in the world was he thinking, calling me out to talk in broad daylight after class on a weekday? If he wanted to keep this meeting a secret from Nagumo, he could have chosen to meet late at night or early in the morning. That wouldn’t have been out of the ordinary. If he had been planning to act with caution, then he should have done that. I didn’t bother to point that out to him though. I just agreed to his request. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter class, I went over to Keyaki Mall to meet up with Kiriyama.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you came,” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What on Earth does the Vice President want with me?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t be in such a hurry to wrap this up. I’m going to ask you to stick around for a little while today,” said Kiriyama, urging me to walk with him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI proceeded to walk alongside him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The large-scale uninhabited island survival special exam is going to start at the end of this month. Are you prepared for it?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was expecting him to talk about the student council, but what he brought up instead was the special exam.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just intend to do what I can. What about you, Vice President Kiriyama?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve formed a group of three people, representing the three classes other than A,” he replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, he was trying to avoid a tough battle to shorten the gap between Class A and the rest. In the case of the third-year students, the gap in Class Points between Class A and the rest was even greater than what it was like in our grade. If the lower-level classes wanted to hold onto the possibility of turning the tables on Class A, it was necessary for them to snag the top spots in this exam with groups made up of their own respective classes.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know what you’re thinking. You’re thinking that if we, that is to say, third-year Class B, were going to make a comeback, we would absolutely need to take first place in this exam with a group made up students from our own class and only our own class. And that the only way we’ll be able to make a win possible is if we continue to win the special exams that follow by an overwhelming margin. But that’s just far too unrealistic,” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed that if miracles could happen so easily, then he wouldn’t have been put into this predicament in this first place.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m hoping to use this particular special exam to stage a personal battle with Nagumo,” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A personal battle?” I repeated.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It has been quite a while since we had lost our battle with Nagumo and were demoted down to Class B. And now he’s the student council president and has control of not just our entire grade, but of the entire school. It’s safe to say that things have already been settled as a class,” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I suppose you’re right. I think so, too,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe majority of the third-year students were following Nagumo now simply because they had given up on trying to get to Class A. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But speaking personally, I don’t think that I’m inferior to Nagumo,” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe third-year Class B student known as Kiriyama did have high scores in OAA. He had scores of B+ or better all around, and no apparent deficiencies. It was no wonder that he’d be so confident in himself. However, Nagumo Miyabi was even better in terms of overall ability. You could say that Nagumo’s cocksure attitude was actually commensurate with his abilities. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut it was also true that OAA wasn’t everything. There were some students who didn’t demonstrate their full potential, and there were other students who had unique talents, like quick-wittedness or insight, which are difficult to express as numerical values and thus are not reflected in OAA. If Kiriyama personally believed that he can beat Nagumo though, then he must have some chance of success. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can form groups of up to a maximum of six people, regardless of class. And in order to win, you need an eye for talented people that you need on your team, as well as the ability to actually bring them onto your team—In that respect, I don’t think I’ll lose to Nagumo,” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was a special exam that had two distinct aspects. While you could also compete with other grade levels, you could also use this test as a way to fight people within your own grade. It seemed that this island survival exam was one of the few remaining chances that Kiriyama had\u0026#160;left.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand where you’re going with all this, but this really isn’t something that you specifically needed to report to me about, is it?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t imagine that there was any benefit for him in telling me all of this.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t want you to get in the way,” he replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not interested in your fight with the Student Council President,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand that. What I’m trying to say is, I don’t want any outsiders to do something that would hamper me.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Outsiders?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m talking about Horikita Suzune. The person who just joined the student council,” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. It seems like you’re seeing her as a hindrance, but just for your information, I sent her to join the student council based on the wishes of her older brother, the former Student Council President,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMaybe that no longer mattered in Kiriyama’s mind anymore. Still, I decided to point that outright though, just to make sure.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s meaningless now. He only has a few months remaining as President, anyway. If there’s anything that I can do from this point onward, it’s not trying to remove him from his position, it’s just to trying to settle the score, as individuals,” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, if that’s what you want, Vice President Kiriyama, then why not just go ahead and do it?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t odd at all for him to want to settle things properly, as individuals. The only question here was what this all had to do with me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The reason why you had Horikita-senpai’s little sister to join the council was to keep an eye on Nagumo, right?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d be lying if I said that wasn’t part of it at all, but the main reason for it was something else entirely. Just as Horikita herself said in front of President Nagumo before, it’s so she could follow the same path that her older brother took,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, she’s not going to try and get in Nagumo’s way?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As long as Horikita doesn’t think that Nagumo is an obstacle, no,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not good enough. I want her to abandon any and all thoughts of trying to deal with Nagumo. Anything more will only lead to unnecessary conflict,” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, he was basically taking back what he said to me before and asking that things go back to how they were. Originally, I couldn’t have cared less. But now, I just had a desire to see what Nagumo was going to do up close. If Horikita determined that what Nagumo was doing was wrong, she would most likely stand up to him. But it was a bit odd that Kiriyama was telling me not to let her do that, saying that it would be meaningless. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI listened to his warning and thought I’d give him a vague response just to keep things moving.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll keep what you said in mind, Vice President Kiriyama,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps Kiriyama didn’t like hearing such a non-committal answer because there were signs of disapproval in his eyes.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I meant that as a polite, indirect way of saying, ‘Don’t do anything,’” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought I was responding in a roundabo
