3e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was right, of course. Komiya had the unassailable right to tell her how he felt. Besides, even though Ike and Shinohara both liked each other, neither one of them had taken that first step in the first place. So if someone else were to cut in before Ike were to get there himself, well, that just meant that was the way things were meant to be. Or maybe after Komiya told her how he felt, Ike could eventually win her back…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, thanks for the help. I think I’ll talk to Horikita about all this. Oh, and if Nishino seems to be having a tough time getting a group, come talk to me. I\u0026#160;might be able to help in some way,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I told ya I didn’t need anythin’ in return though,” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s just like you told me. If you’re in trouble,\u0026#160;I’ll help you out, too. As long as it’s something I can do, I’ll\u0026#160;help,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thanks. I know you’ve got a lot you’re dealin’ with too, so hang in there,” said Ishizaki, offering me some words of appreciation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI decided to go ahead and report back to Horikita on the matter.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e4.9\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHAT EVENING\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I called Horikita to the cafeteria. Since there were so many people around, it would be difficult for anyone to pick up on our specific conversation, even if they were trying to listen in. I told Horikita about how Ike had a crush on Shinohara but was unable to take that first step. I also told her that Komiya had a crush on her as well, and that he was planning to tell her how he felt. I also told Horikita about how deeply I think it might affect the upcoming exam. And Horikita’s reaction to all of that was…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wouldn’t it be fine to just leave them alone?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had halfway expected as much, but her reaction was one of cold indifference. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You said you wanted to talk to me about something, and I was wondering what it could have been about. But this really isn’t something that other people should get involved in. Besides, I do value Ike’s camping skills as well. We should place him in a group to make the best use of his abilities, leaving personal feelings out of the equation,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not so sure about that. It seems like Ike can’t get his mind off Shinohara. Depending on how things play out, it’s possible that he might not be able to perform as well as he did last year. If that’s all there is to it, then\u0026#160;that would be fine, but we should consider the possibility that\u0026#160;he’ll be so preoccupied thinking about Shinohara\u0026#160;that he’ll drag his group down,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re saying that he’ll get all weird about it and end up getting expelled?” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I can’t say for sure that it’s \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eimpossible\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…In that case, that could be a problem. This is absolutely stupid,” replied Horikita, letting out a bitter sigh, seeming to be at her wits’ end.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems like Komiya and Shinohara have promised to be in a group together, but they haven’t made it official yet because of your instructions. But if you do give them your permission, it is almost a guarantee that they will form a group together. You are the leader of Class D now. If you tell Shinohara that teaming up with Komiya is, strategically speaking, a bad move, then Shinohara couldn’t go against it,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re saying that we need to stop them. But if we prevent them from being in a group together, wouldn’t Komiya-kun just pick a different time to tell her how he feels? Depending on how things play out, he might even decide to tell her that very same day,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We can’t discount that possibility,” I conceded.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This issue is more trouble than it’s worth. It’s impossible for us to see what’s going on before they officially become boyfriend and girlfriend,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, what do you think we should do?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why don’t we just make Ike-kun come out with it and tell Shinohara-san how he feels about her? If she responds well to it, then Ike-kun will give his utmost so that he won’t be expelled, no matter what group he’s placed in, right? On the other hand, if she turns him down, Ike-kun can forget about her and concentrate on the exam,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile I agreed that the former scenario was likely, I wasn’t sure if the latter would happen that way if Ike did get rejected. There was a possibility that he’d fall into despair and just give up. But we could keep talking back and forth about this topic all day long. It was certainly true that getting Ike make his feelings with Shinohara clear at this stage would be the simplest, least time-consuming solution.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re good at quite a lot of things, but when it comes to love, you’re really hopeless, aren’t you?” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m studying hard right now,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For the love of… All right. I’ll see what I can do. In the meantime, should I go ahead and lead Ike-kun and Shinohara-san to try and form a group together?” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though we were still in the middle of eating, Horikita took out her phone and launched the OAA app. However, when she did so, an unexpected fact came to light.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unfortunately, it seems like we’re too late,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita slid her phone across the table over to me and showed me the screen. In the OAA app, I could see that groups had been formed. I saw both Shinohara and Komiya’s names listed together already, as two people in the same group. They were in a group of three people, together with Kinoshita Minori from Class B.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Since it’s come to this, we’re going to need to take steps to make sure that Ike-kun doesn’t lose motivation,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s talk about this with Yousuke too. He’s been thinking about ideas for the best group to put Ike into right now,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCompleting the task of forming groups for the uninhabited island special exam was fraught with difficulties.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e4.10\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHAT EVENING\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e my stay-home date with Kei started, something that had become a regular happening for us. The topic of our conversation today mostly centered around groups, starting with Ike and Shinohara’s break up due to their fight earlier. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, um, hey… Kiyotaka, who are you planning to group with for this exam?” asked Kei, looking up at me as she asked that question with a somewhat bashful look on her face.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not planning on joining a group with anyone right now,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Wh-why?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could sense that Kei had wanted to be in a group with me, but even if we did team up, it wouldn’t work out in my favor. It wasn’t like she was lacking in ability or anything. It was more that, considering we would be going up against Tsukishiro, she’d be unfit for the task. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are definitely advantages in forming a group. However, that doesn’t necessarily mean that you can’t win on your own. In fact, if anything, there are advantages in being able to stand freely without being influenced by others. In addition, depending on how things go, you might be able to save other groups. If a group is about to get eliminated, you could step in and cover for them,” I\u0026#160;told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re saying that in general, you could be more resourceful and adaptable if you’re going it alone,” answered Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhether you were a boy or a girl, you were still allowed to take part in this exam by yourself. In other words, there was a chance for students who prided themselves on their versatility to be able to win on their own.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If a student were to take first place and they were acting alone, that would mean only their class would be getting 300 Class Points,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you think you could get first place, Kiyotaka? I\u0026#160;mean, considering the fact it’s you.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you think?” I asked. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter I turned the question back at her, our eyes had met. We stared at each other for a while, as Kei stiffened, lost in thought.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I feel like…you would get first place without even breaking a sweat. Huh? But wait, hold on. If you get first place, it’ll get even harder for me to tell people that we’re going out, won’t it?!” she wailed, immediately starting to imagine what the future would be like, panicking.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you get first place all by yourself Kiyotaka, I think I’d be so happy that I’d swoon. I would think that you’re super cool. But, but… Ah! I don’t know what the best thing to do is!” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re getting overly excited. Don’t worry about it. It’s not like getting first place is that easy,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“S-so hold on, does that mean that you don’t think you can win?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s just say my chances are about fifty-fifty,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just saying that you have a fifty percent chance is still absolutely incredible though…” said Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, the thing you should be concerned with right now isn’t who you’ll be partnering with, Kei.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Wait, isn’t that really important though? If I slip up, I might get expelled,” said Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. There is the threat of expulsion in this special exam. If you slip into the bottom five, then you’ll get penalized. However, you can’t just freely choose someone to partner up with,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay. To be honest though, I wanted to partner with you, Kiyotaka… I want you to protect me,” said Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei had basically asked me as much before, albeit in an indirect way. But now she had come out and honestly said how she felt.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are ways to save you without me having to protect you though, right? By that I mean you can hold onto the number of Private Points that you need to save yourself.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah, that’s true, but…” said Kei, trailing off and pausing for a moment.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough it required a substantial number of Private Points, if you put it another way, that meant that as long as you held onto that number of points, you’d never get expelled.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, yes, it is true. But even if you form a group of six people during the exam, you’d still need a million points to avoid getting expelled, right? I don’t have that many,” said Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How many points do you have left now?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s see… 240,000, I think. A-Anyway though, I have been saving points pretty well lately though!” said Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t really say anything that indicated I was blaming her for her lack of points though. Since I was in a comparable situation financially, I couldn’t really criticize her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re short 760,000 then,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had about 250,000 points on hand. Even if I handed them all over to her, she would only have a total of around 500,000. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kei, you’ve got the Free Ride card, right?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. What’s it worth, in terms of value?” she asked in return.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I couldn’t say it’s a good card, to be honest. For better or worse, it seems the be the card that has the least impact on the holder. It’s not the sort of card that will add to your efforts or help you when you make a mistake,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYou could basically only bet on whatever group was likely to win. In terms of simple value, you could say that her card had the least value.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah…you’re right,” replied Kei, letting out a dejected sigh. She had already known that was the case, more or less. “You have the Trials and Tribulations card if I remember right, Kiyotaka. Yeah? It has some powerful effects if you win, but if you lose, it would be really traumatic… Oh, well, I know that you’re not going to have any problems at all of course, Kiyotaka. I was really hoping I would have gotten the Half Off or Nullify card.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI suppose that from Kei’s point of view, it was natural that she would feel more appreciative of a card that could save her in this exam. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not like there aren’t any hopes for your card, though. Chances are there are many students who feel like the Half Off or Nullify cards are worthless. In those students’ eyes, there may be value in the Free Ride card,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnlike the Head Start and Bonus cards, her card might not really resonate with students who were confident in themselves. On the other hand, though this card was targeted for the middle-of-the-road students who didn’t think they could win. Furthermore, the middle-of-the-road category was likely to be comprised of the greatest number of students, making it easier to find someone who would want to trade.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, cards like Half Off were greatly desired by some students both in that middle range category and in the lower range category. They’d want it so badly that they could taste it. Depending on who was holding the card, some cards might seem worthless, while others might shine like they were solid gold.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll take care of the points,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? You’ll take care of… But how?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are several ways to do so. Selling off the Trials and Tribulations card to get the funds we need is one way,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But that means you might have to give up your card… Are you sure?” asked Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s more important to make sure that you don’t get expelled,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“O-okay… Th-thank you,” she replied, blushing.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfterwards, we went on to talk about summer vacation, which was exciting, but new developments in our relationship were being put off for later.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e4.11\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE SCHOOL\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e had allowed us to form groups of up to three people up until the summer special exam started in earnest. However, there was a conversation happening that didn’t cover just that. It was also about looking ahead to the future.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m glad that you’ve come, Ichinose-san.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry to have kept you waiting, Sakayanagi-san.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was after school on the first Friday after we were given permission to start forming groups. Sakayanagi had called Ichinose and asked her to come to the café. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is this a good time? I was thinking that you might have turned down my offer since I had made this request so suddenly,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s a perfectly good time, no problem at all. Though to be honest, I was a little surprised since I didn’t think that you’d contact me, Sakayanagi-san.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat day, just an hour before they had met up with one another at the café, Sakayanagi had suddenly contacted Ichinose and asked her to come out. If Ichinose’s schedule had been packed, it wouldn’t have been surprising if she had turned down the offer, of course.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I really wanted to meet you today and talk with you, Ichinose-san.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was a lie on Sakayanagi’s part. Inviting Ichinose so suddenly and without any advance notice was part of her strategy. It was meant to give Ichinose no time to think. If they had arranged in advance to meet in a few days, Ichinose would have thought about what would be discussed. And depending on how things went, she might have even sought help from her classmates, like Kanzaki. This was a precautionary measure on Sakayanagi’s part to prevent that from happening. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At any rate, why did you accept my sudden request to meet, anyway?” asked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why? Well, I didn’t really have any plans today,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That isn’t what I meant. I have done some terrible things to you before, Ichinose-san. I thought it wouldn’t be surprising if you hated me,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi had secretly gotten details about Ichinose’s past out of her in their conversations as part of a plot to bring Ichinose down. Sakayanagi had tormented Ichinose by taking something from her past that she didn’t want other to know and revealing it to a great number of people. If someone you trusted and talked to betrayed you, many people would end up hating that person. Or even if they didn’t come to hate that person, they should feel an intense sense of distrust, and want to keep their distance.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, not only did Ichinose immediately respond to Sakayanagi’s sudden request, but she didn’t give the slightest impression that she held anything resembling a grudge. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, actually, I don’t think you’ve done anything particularly horrible to me, Sakayanagi-san. It’s true that what I did in junior high was something that I needed to reflect on anyway, and I’m ashamed of what I did. But it’s not like I had explicitly asked you to keep a secret from everyone, so it would be wrong of me to blame you for what happened,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat Ichinose was saying was that in the end, she herself was the one who revealed her past, so she was the one to blame for what happened. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You are, without a doubt, a truly good person, Ichinose-san,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not so sure about that. I don’t really know, myself\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e” said Ichinose somewhat sheepishly, lightly scratching her cheek. She seemed to be embarrassed, averting her eyes away from Sakayanagi like she couldn’t bear her gentle gaze.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So then… What did you want to talk about?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps Ichinose felt like it would’ve been awkward if they continued discussing that topic any further, because she urged Sakayanagi to start talking about the matter at hand.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As you wish then, I’ll get down to business. However, I suspect that you might feel uncomfortable about what I wish to discuss with you,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter Sakayanagi had prefaced what she was going to say with that warning, Ichinose quietly muttered to herself. “I hope she goes easy on me.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please pardon my bluntness, but I’m not so sure that you’ll even be able to make it back to Class B, let alone Class A. I would like to know your thoughts on the matter. Would you care to share them with me?” said Sakayanagi, pointing out the current situation that Ichinose was in without an ounce of hesitation or restraint.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah ha ha… Well, that really was honest,” Ichinose replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor a brief moment, Ichinose’s mind went blank. Then, with a bitter smile on her face, she started to fan herself with her hand. Sakayanagi, with a deliberate smile plastered on her face, simply watched, and waited for an answer.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s certainly true that the situation we’re in now isn’t good, by any means,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs of the first of May, there was only a twenty-six-point gap in Class Points between Ichinose’s class and Ryuuen’s class, with Ichinose trying to play catch-up. Since those points fluctuated based on things like tardiness and absences every month, she thought that her class might be able to catch up if there weren’t any special exams. In fact, the Class Points that her class had accumulated over the past year had largely come from smaller amounts of points being gained from those kinds of daily activities and evaluations building up over time. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, after their positions in the rankings had been reversed and Ryuuen’s class became Class B, they didn’t show a single weakness to exploit. In June, the gap between the two classes had narrowed slightly, but only by a mere two points. Ichinose could feel Ryuuen’s and his followers’ strong will to never let her pass them. That was something that Sakayanagi, who was now being pursued by Ryuuen, could sense without even needing to say anything about it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I am well aware that they’re very formidable opponents,” added Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even though you’re aware of that fact, there are still some things that you just can’t seem to do anything about, aren’t there? Ryuuen-kun’s boisterous, excessive class hasn’t been causing any problems lately with their behavior, which is so surprising that it’s practically unthinkable. If you cannot catch up to them from daily activities, then you have no other option but to put your heart and soul into future special exams,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose nodded meekly. Sakayanagi was by no means intending to answer with sweet, gentle words in response, though.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He’s not the sort you can defeat so easily. It is no exaggeration to say that he would be the most difficult kind of opponent for you, Ichinose-san, as someone who takes a very honest, straightforward approach,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat point was something that Ichinose understood quite well herself, having faced Ryuuen directly at the year-end special exam. Ryuuen was coercive, abnormal, and certainly wasn’t loath to break the rules. Ichinose’s true intention was probably to avoid fighting him, if possible.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But, well, that’s something that I can’t avoid running into on the path to get to the top. And while it’s true that Ryuuen-kun is a difficult opponent to face, it’s not as though you’re someone who could be defeated so easily either, Sakayanagi-san,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven there had been a brief struggle with Katsuragi, who was also in Class A, they had nearly double the points that Ryuuen’s class had, creating a strong lead. Class A was undeniably far, far ahead of everyone else in the running. Even if Class A were to be defeated once or twice, it would be difficult to shake them out of first place.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even though there is more than two-hundred-point gap between your class and Class D, what do you think might happen, considering their momentum? Are you confident that they won’t overtake you?” asked Sakayanagi. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita-san’s class is also rapidly gaining strength, by leaps and bounds. In terms of individual abilities, they have people who can stand toe-to-toe with those from any other class… When I look at things that way, I can say that I definitely do not have that much room for error,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Indeed, there are certainly several interesting and exceptionally gifted individuals in Class D. First, you have Hirata-kun and Kushida-san, both of whom have excellent communication skills and well-balanced grades. Then there’s Sudou-kun, who is the sole student to have earned an A+ rating in physical ability. And you have Ayanokouji-kun, who made a surprise attack like a soldier lying in wait by getting a perfect score on the mathematics section of the exam, which was an exceptionally difficult subject. And then we have Kouenji-kun, someone whose true abilities still can’t be discerned fully, making him yet another dangerous person,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi had made Ichinose once again feel the depths of what Class 2-D had to offer by deliberately making mention of their strengths.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Lastly, there’s the leader that they rally around, Horikita-san. She is quite gifted both academically and physically, and I even heard that she had joined the student council the other day,” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi had once again confirmed the situation that Ichinose was in.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I am terribly sorry to keep saying such harsh things, but I think that it’s only a matter of time before your class is demoted to being Class D, Ichinose-san.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I think there’s no arguing that we do warrant that kind of evaluation right now. But—” said Ichinose, before being interrupted.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you going to say something abstract, like you’ll make it through hard work and friendship?” said Sakayanagi, cutting her off.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose had been made to swallow her words when Sakayanagi had precisely taken them right out of her mouth beforehand.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It is impossible for you to win with such vague ideas. Every class has clearly grown in power over the past year, but I don’t see any significant growth coming from your class, Ichinose-san.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s… That’s not true, though. Everyone has been really coming along.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t see that you haven’t grown. The problem is by how much,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You might not believe this, but I don’t think we’ll lose, Sakayanagi-san,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi, with a faint smile on her lips, simply shook her head from side to side, slowly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you look at OAA, the answer is obvious. If you compare the overall ability that all four classes have this year versus where we were at last year, you can see that your class is undoubtedly the one that has demonstrated the smallest degree of growth among them. I had thought you would have at least checked into it that much, Ichinose-san… But perhaps you already knew that and pretended not to notice anything or maybe you were too afraid to afraid to check for yourself…” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose firmly recalled a time before when she had been alone with Sakayanagi. It was almost like an adult with a child. It was only natural that Ichinose felt like she was being talked down to, driven further and further into a corner. She was unable to say anything back to Sakayanagi, who was accurately exploiting her weakness.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You are a smart student. In an honest and equal tête-à-tête, I don’t think you would fall behind me by any means. However, you’re unable to demonstrate your abilities when put in a disadvantageous position. Both then and now, you could only stay silent as your weakness was exploited. However, both I and Ryuuen-kun, who you are facing off against now, are able to bare our fangs when placed at a disadvantage. Do you understand?” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ye… Yes, I do.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThose two would not doubt their strength, regardless of whatever situation they were in.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think it’s safe to say that as you are now, Ichinose-san, you have no chance of winning.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that what you called me here to talk about?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I were simply trying to harass you, I could do that anytime, anywhere. I wouldn’t waste precious time,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen, Sakayanagi decided to tell Ichinose the real reason she had called her here today.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why not join forces with me, Ichinose-san?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh…?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi’s shocking proposal came as such a surprise to Ichinose that she was at a loss for words.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, but that’s—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A cooperative relationship between classes isn’t a terrible thing. In fact, if I remember correctly, you had a similar relationship with Horikita-san from Class D during our first year, didn’t you?” asked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t strange that Sakayanagi had heard about their alliance. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now, this is merely speculation on my part, but I believe that Class D might have already nullified their partnership with you. Even though they are at the bottom of the class rankings, they have accumulated more Class Points than any other class has in one year, and they are gaining momentum. In comparison, Ichinose-san, your class has fallen a step behind and has been demoted to Class C. From the perspective of Horikita-san and her peers, continuing to collaborate with you would have no benefit whatsoever,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi had perfectly and succinctly summed up what had happened, almost as if she had witnessed the conversation that Ichinose and Horikita had firsthand. Ichinose couldn’t deny any of that. She responded in a way that halfway sounded like she was openly admitting to it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I suppose so… Partnerships can’t last forever,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. For a collaborative partnership to be maintained, a certain condition must be met. Your class and Horikita-san’s class had fulfilled that condition last year. And it was precisely because of that that you were able to successfully establish a good relationship without fighting each other in vain,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose nodded meekly in agreement.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And that certain condition was…the difference in Class Points,” added Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn fact, that was exactly it. The truth of the matter was that the reason Ichinose and Horikita’s classes made a ceasefire agreement was because of the difference in Class Points they held.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Although I don’t think this was intentional, there is now quite a substantial difference between my Class A and your Class C, Ichinose-san. In other words, I think that it wouldn’t be impossible for us to join forces,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The sad thing is though; I can’t really think of this as a happy proposal. Because it implies that our class is insignificant to you, we’re not even worth being cautious about, Sakayanagi-san.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I may be so bold, that’s because that’s exactly true.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe merciless reality of what Sakayanagi was saying struck Ichinose. But Ichinose didn’t stop smiling. Although emotional denial would’ve been easy, she couldn’t turn away from the reality that her class was in a crisis. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t imagine that there are any benefits for you in partnering with us though, Sakayanagi-san.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, that’s not quite true. If we look at things purely in terms of power, then yes, it is true that you come up short. However, you possess a powerful weapon that no other class has,” said Sakayanagi, with a smile.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And that weapon is…trust. I can say with absolute certainty that during the time in which our classes are allied with each other, you will not betray me, no matter what happens. That is of foremost importance in looking for an ally,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA partner that you could rest easy about and trust to watch your back. Sakayanagi was saying that alone was worth an alliance. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“While I’m happy that you think so highly of me, we’re in a situation now where we can’t really care for appearances, right?” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, that is true. However, I cannot imagine that you would abandon that weapon called trust, which you have built up so much so far, Ichinose-san. If you do abandon that trust and betray me, then the blame would fall squarely on me for having judged incorrectly,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if this were a trap that Sakayanagi had laid for her, Ichinose couldn’t help but feel that being trusted wasn’t a bad thing. However, she already taken into consideration the fact that Sakayanagi was someone she couldn’t drop her guard around.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Could I ask that you please give me some more details about what you’re thinking?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can I take this to mean that you wish to move forward with this partnership?” replied Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yes, that’s right.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, let’s discuss.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi started to act, to take Class 2-C, led by Ichinose, under her banner.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The upcoming special exam, where we need to survive on an uninhabited island has some rather troublesome rules. We can only form groups with students from our grade level and the rewards are distributed equally. This means that even if you were to bring together the best of the best from each class, it wouldn’t create any gap in Class Points whatsoever,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, you’re right about that. Which is why it’s inevitable that we’ll have to make a group that’s capable of winning from within our own classes,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_5\" src=\"/hola-lector-agua/images/books/y2v2/OEBPS/Images/INTERIORIMAGES_5.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But in that scenario, you couldn’t say that you’re able to handpick the best of the best in forming your group, no? There would inevitably be certain areas that each class won’t be able to cover on their own… However, what if two classes were to work together? I would say it’d be a different story if we could freely choose between a total of seventy-nine people,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, if your class and our class worked together…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Although you wouldn’t be able to chip away at the lead that Class A has, you would be able to overtake Ryuuen-kun’s class and widen the gap with Class D as well,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But… If we do this, that means we’ll be losing an opportunity to catch up to your class then, Sakayanagi-san.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As we head into the second and third semesters, isn’t your first priority to return to a stable position? Even if you refuse to join forces with me here, that doesn’t necessarily mean that you’re going to win. Am I wrong?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“On the other hand, if you lose to the other classes, you will be demoted to Class D, Ichinose-san. You will lose out on a lot of Class Points, thereby putting you in an extremely tricky situation. If that were to happen, it would be close to impossible for you to aim for Class A, wouldn’t it?” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose had once again fallen silent, unable to respond to what Sakayanagi had said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think that you still harbor some doubts about me. But I don’t think there are going to be many chances for the other classes to team up with each other. Neither Class B nor Class D would ever join forces with me, as they are intending to catch up to Class A. Their only option would be for D, C, and Class B to form a clique and to challenge Class A together. That way, they could form strong groups,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo matter how strong Class A was, if B, C, and D worked together, Class A’s chances of winning would be slim.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d be lying if I said that I haven’t thought about that myself already,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, quite. However, D, C, and B working together isn’t a realistic strategy. Ichinose-san, have you received word from anyone about that yet, in the few days since we’ve been notified that we’re allowed to create groups?” asked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose, eyes cast downward, slowly shook her head from side to side. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If three classes joined forces, that would mean the Class Point rewards would be divided equally amongst them. Even if you did your utmost and were able to take first place, you would only close the gap between us by a mere one hundred points. If you placed second, then sixty-seven points. And if you got third, that would be thirty-three points,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if Classes 2-B, 2-C, and 2-D had managed to secure all of the top positions, that would still only decrease Class A’s lead by a mere 200 points. Although that was by no means a small amount, it would be difficult to monopolize the top spots in this special exam in the first place.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s natural to want to win on your own, and to close the gap by 300 or 400 points,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But, if we enter a partnership, Sakayanagi-san, then Horikita-san and Ryuuen-kun might make a partnership, to… And besides, there are people who have already formed their own groups in our own classes already, aren’t there?” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. Rather, I’ve been waiting for the group-building to begin. So, while we are currently seeing a trend where the individual classes want to join forces and instead compete on their own, I propose that we team up, and focus on a main fighting force,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And what would this main fighting force be?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just like last year, I am unable to move around on the island, because of my legs. However, I am allowed to participate. Albeit in a somewhat special position, though.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Special?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Students who are unable to participate due to reasons like illness or injury are eliminated from the beginning, yes? However, I will be participating in this exam as a ‘partially-eliminated’ student.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Partially eliminated?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I cannot walk around freely on the island because of the state of my legs. However, I have the right to remain at the starting point and compete just like everyone else, while adhering to the same rules. Meaning that if you come seeking my opinion, I can give it to you, and if there’s a difficult problem, we can solve it together. However, if the point comes where I am the sole remaining person in my group, then my group will be eliminated from the exam,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So that’s what you mean when you say you’re participating via a special position then,” replied Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough there would be a need to be a way to remain in contact, Ichinose immediately understood that having Sakayanagi function as the brain of a group could be a major factor in the exam.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can freely choose anyone out of myself, Hashimoto-kun, Kitou-kun, or Masumi-san. We are undeniably the main fighting force of Class A. And from Class B, I suppose that would be you, Ichinose-san, Kanzaki-kun, and then Shibata-kun.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAll the students that Sakayanagi had just listed then had not yet formed a group and were monitoring the situation. At this current stage, there were no inconveniences for either side.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. If you consider that physical strength will be required on the island, I think that’s true. However, there’s no guarantee that we’ll be able to merge groups as we’d wish once the actual special exam begins, right?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Although it will be difficult to merge groups, it’s not exactly impossible,” replied Sakayanagi, smiling broadly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer smile showed that she was confident that they could form groups no matter what difficulties there were.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sakayanagi-san, may I tell you my honest thoughts?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sakayanagi-san, you really don’t want B, C, and D to fight together. Even more so than I had originally thought. Actually, if anything, you’re afraid of that happening, aren’t you?” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What makes you say that?” asked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You said that I and my class are partners that you can trust, and I think that you really do mean that. However, the most important thing for you is that you want to avoid a situation where B, C, and Class D were to work together and get on Class A’s tail. It’s certainly true that the amount of Class Points we could earn if we won would decrease, but there’s no guarantee that the three classes below you won’t continue to work together in the future, should that happen,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose, who had been relentlessly pushed around during this whole conversation so far by Sakayanagi, struck back with the feelings she had been holding onto.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we successfully managed to pull it off, the idea of the three classes banding together and chasing after Class A, then that would mean you’d be forced into fighting an uphill battle from this point onward, Sakayanagi-san… Am I wrong about that?” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi looked surprised, albeit only a little, after witnessing Ichinose’s counterattack, since she had only been on the defensive this whole time.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Apparently, it looks as though I’ve underestimated you a little, Ichinose-san.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi didn’t care at all if any of the classes below her happened to win this particular special exam on their own and gain the 300 Class Points. The most important thing to Sakayanagi, whose Class A was so substantially far ahead, the thing that she wanted to avoid the most, was the three lower classes banding together and gaining a sense of solidarity. What Sakayanagi was doing here was making a preemptive move in anticipation of more tests like this that may come in the future.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf there were someone who could rally the three other classes together, it was highly likely that person was Ichinose Honami. Which is exactly why Sakayanagi had decided to take Ichinose into her hands first.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, regarding my proposal to form a partnership, does this mean you will not accept? Or will you?” asked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter acknowledging what Ichinose had said, Sakayanagi had come out and pressed for Ichinose’s cooperation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you do collaborate with me, I don’t mind giving you a pledge for three person’s worth of deposits. I will loan you a total of three million points, for the students who are at a considerable risk of expulsion. In the unlikely event that you are to be penalized, you may use those points to save those students. I would think this is quite a helpful proposal to you, Ichinose-san, since you wish to avoid letting anyone get expelled more strongly than anyone from any other class,” said Sakayanagi. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi, fearing that her offer would be rejected, held out her hand.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Would you mind giving me enough for five people? That way, I would feel totally reassured, I think,” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My, my, quite greedy, aren’t we? Although I had been planning to distribute a similar number of points in the near future, I will offer you a special loan,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass A had been continuously receiving the highest number of Private Points out of any class for over an entire year. As a result, the amount of funding that each of their students had accumulated was far beyond what any of the other classes had.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, I suppose we have a deal then. But to be honest, I would have chosen to work with you even if you hadn’t mentioned the financial help, Sakayanagi-san. Our ultimate goal is to get to Class A, of course. But as you said, I’ve been demoted to Class C, and we really have our backs against the wall now. If we were to be demoted to Class D, I’m sure that the class’s motivation would drop significantly. I don’t want that to happen,” said Ichinose, offering her hand to Sakayanagi, for a handshake.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, regarding your proposal that Class 2-C and Class 2-A fight this battle together… I accept,” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that the two of them had shook hands on it, both classes had mutually entered an alliance.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And now I’ll be able to fight without worry. I apologize for how sudden this might be, but I do have one request,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m guessing that it’s about how to maximize our chances of winning, that it’ll be necessary to start things off by handing over the ‘One More’ card to Class A’s main fighting force… Right?” replied Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that Ichinose was their ally, she had already started to think about the best path forward for their battle, as an allied force. By using the “One More” card, of which there was only one of in their grade level, you could form a group of up to seven people. This was also one of the reasons why Sakayanagi had decided to fight together with Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I sincerely appreciate that you understood what I meant so quickly,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But even still, Ryuuen-kun and Horikita-san are both formidable opponents,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi also was absolutely not going to underestimate those two, by any means. It wasn’t going to be an easy fight, considering the lingering shadow of Ayanokouji looming behind Horikita. However, Sakayanagi had chosen to fight together with Ichinose because she was sure that she would definitely win.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“First place is ours to take. Thus, I do not intend to skimp on the efforts necessary for that goal,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith their forces consolidated, Sakayanagi was going to challenge Ryuuen and Horikita’s respective classes, as well as both the first- and third-years.\u003c/span\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 4: Approaching Summer, Premonition of a Fierce Battle\",\"volumeId\":\"y2v2\",\"chapterIndex\":10,\"prevChapter\":{\"volumeId\":\"y2v2\",\"chapter\":9,\"title\":\"Chapter 3: Days Passing By\"},\"nextChapter\":{\"volumeId\":\"y2v2\",\"chapter\":11,\"title\":\"Chapter 5: Battle of the First-Years and Third-Years\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : The White Room Student's Soliloquy\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: Changing School Life\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: Days Passing By\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: Approaching Summer, Premonition of a Fierce Battle\",\"href\":\"Text/section-0008.html#auto_bookmark_toc_top\",\"index\
