03c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not what I’m saying. If we’re talking strictly in terms of the number of points, then yes, it is an exceptional amount. However, in reality, all we’re really offering to him is the right to move into our class, correct?” said Hiyori.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-but, we can’t just like, hand over twenty million and let him transfer to Sakayanagi’s class or somethin’.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Ishizaki and company said I was free to use the points they gave me however I wanted, then of course I’d go to the class that was sure to be Class A in the end. Obviously. Ishizaki’s class wouldn’t be able to bulk up their own power by bringing me into the fold, then.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“On top of that, you told Ayanokouji-kun it was fine for him to team up with anyone from Class B, Ishizaki-kun. But that’s a problem, too. Surviving on an uninhabited island isn’t a task for a single person. If you really intend to strive for first place, your chances of successfully doing so are much higher with capable teammates.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHiyori, who had simply sat back and listened to Ishizaki lay out his proposal so far, now viciously pointed out each flaw in his plan in turn. And every time she pointed something out, Ishizaki started to panic, sweating bullets.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-well, then anyone would be fine” he exclaimed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If it were up to me to choose a group right now… Yes, all right. I would choose Ryuuen-kun, Kaneda-kun, and then Ayanokouji-kun to make up a group of three. I\u0026#160;would be fine with replacing Kaneda-kun with Yamada-kun, but Ryuuen-kun is indispensable,” said Hiyori.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn terms of leadership capability, he was one of the best in our grade, and he had the guts to break the rules with his schemes. Last year, he’d been the only person left standing in his class on the uninhabited island. He even had the physical and mental fortitude to endure on said island without anyone noticing he was still around until the very last minute. The other two people she mentioned were Kaneda, the best student in their class, and Albert, a student who boasted immense physical strength. It was true that having two of those three would be essential to maximize the odds of winning.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t talk crazy! Do you seriously think Ryuuen-san will agree to my plan?!” wailed Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think he’ll immediately reject it,” said Hiyori.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Obviously!” shouted Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure that Kaneda-kun would, as well. He wouldn’t ignore Ryuuen-kun’s orders and endorse such a careless strategy,” said Hiyori.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, in that case, what the heck should we do?” wailed Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s nothing we can do, really. At the very least, not at this current moment,” said Hiyori.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Urgh… Well, that’s a bummer…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki crossed his arms, racking his brain in a desperate attempt to produce an idea, but it didn’t seem like anything was coming to him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At any rate, we were able to convey Ishizaki-kun’s and our wishes, and I think we should be satisfied with that,” said Hiyori.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed like that had been Hiyori’s objective all along, apparently. She’d known all along that they couldn’t easily persuade me to join their group, and so she’d determined the most important thing was to just show me that they desired to work with me. Perhaps Albert had understood that this was a foolhardy attempt on Ishizaki’s part, too, because he patted his shoulder gently.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…All right, I get it. In that case, guess there ain’t anythin’ I can really do…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough reluctant, Ishizaki seemed convinced, at least superficially, after hearing the response to his plan.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know if I can meet your expectations. Let me think about it for now,” I told them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had judged that was the best answer I could give them in this situation. That being said, I wasn’t planning to group up with anyone at the moment because of Tsukishiro and the agent from the White Room that was hiding among the first-year students. The first semester was already almost over. There was no way they would let things continue as they were, allowing me to keep living my life here at this school.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe upcoming special exam was most likely going to the final battlefield on which Tsukishiro and I met. In other words, it was very likely he was going to launch an attack on me without any concern for appearances. If I did form a group, I’d be getting dragging those people into it. And if that happened, I’d need to make sure I was the only one who got expelled. That would be the least I could do, as a courtesy if nothing else. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThus, I reaffirmed the situation in my mind.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e4.6\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eW\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHEN I WAS DONE\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e getting ready to head to school the next morning, I turned on my phone. I got a notification telling me that I’d received a private e-mail from the school. In the message, it was stated that I had been given the card designated “Trials and Tribulations.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Never thought that I’d end up getting one of the special cards…” I muttered to myself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust when I’d thought the infamy I gained after getting that perfect score in math had finally died down…this happened. The Trials and Tribulations card was powerful, although it was a double-edged sword. Having possession of this card was likely to attract attention. It was safer and preferable to trade it with another student who needed it, but since the Trials and Tribulations card had powerful effects that could go one way or the other, it couldn’t easily be handed off to someone from one of the other classes. If the group I ended up trading it to get first place, then the blame would fall squarely on me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was possible that Tsukishiro had slipped the card into my possession deliberately to get me expelled, but considering the fact that cards were transferrable, that was far too weak a strategy to drive me out. It was more natural to simply interpret this as luck of the draw. The two remaining special cards seemed to be in the hands of Amikura Mako from Class C and Yano Koharu from Class A, respectively. The former had drawn the “One More” card and the latter had drawn the “Nullify” card. I supposed it was fortunate that the cards had been well separated. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI left my dorm room a little earlier than I usually did, pondering about what I was going to do from here on out. When I set foot on the elevator, I bumped into Shinohara.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Morning.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good morning,” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though we were classmates, we weren’t particularly close, so we didn’t really do more than exchange that simple greeting as we headed down toward the lobby. The ride wasn’t long. When we reached the first floor, I pressed the open button and let Shinohara off first. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the lobby, we saw Ike, who normally showed up at school relatively late. He looked over in my direction, seeming somewhat restless. I thought he might have been waiting for Sudou, but that didn’t seem to be the case, since he only exchanged a brief greeting with her as they crossed paths and then proceeded to watch her leave. Right after she went out, however, he followed her. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI slowed my own pace down somewhat, trying to keep my distance from the two of them, as to not get in their way.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Shinohara,” said Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I got outside, I could hear Ike and Shinohara’s conversation carried on the wind, although only just barely.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, uh, y’know. About this whole uninhabited island exam group thingy, and all… Just wondering, have you talked with anybody yet, about teamin’ up with them?” asked Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I haven’t really talked to anyone yet about it… Why do you ask?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, no real reason, really. Just figured I’d ask is all.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, okay… So, what about you? You’re probably going to team up with Sudou-kun and Hondou-kun, right?” said Shinohara.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That so bad? I mean, it’d be fun, bein’ with those dudes,” said Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I guess.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShinohara laughed as though she was making fun of him, but Ike didn’t seem to mind at all. It seemed he had something he wanted to say, but he was desperately struggling to get the words out.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But, I mean, dudes can make it on their own more or less, anyway, I think… ’Sides, Ken’s really strong, so I think in terms of like, manpower, he’d be enough for the whole group, I think,” said Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough Shinohara’s reaction was a little cold, it didn’t seem like she disliked talking to Ike at all.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, not sure how to put this, but, uh. I should be able to lend you a hand where you need it…? So, if you’re feelin’ like you’re in trouble, you can… Well, y’know, you can form a group with me, okay?” said Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s that all about? Look at you, being all high and mighty,” said Shinohara.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, you saw me in action last year, didn’t you? I’m pretty good at the kind of stuff this exam needs,” said Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was trying to sell Shinohara on the fact that she could capitalize on his skills. Basically though, the reason Ike was doing this seemed to be that he just wanted to partner up with Shinohara.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I suppose I can think about it… You want to be in the same group as me?” asked Shinohara.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, uh, hey, don’t get any weird ideas or anything, okay? Look, you’re like, one of the people who’s in danger of getting expelled, right? That’s why I’m saying that I, kindhearted guy that I am, will sacrifice myself to protect you.” Ike, unable to honestly say what he wanted to, blurted out something that Shinohara was sure to take issue with.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Excuse me? Sacrifice? What? I don’t remember asking you for that!” she shouted.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd of course, considering the way that Ike had phrased his offer, there was no way she was going to graciously ask that Ike join a group with her. The mood started to sour between them, badly. Just as the vibe was getting grim, though, Kushida approached and called out to Ike from behind.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“G-good morning, Ike-kun. Do you have a minute?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe moment Kushida called out to him, Ike averted his gaze from Shinohara and excitedly waved at her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oooh, what’s up?! Yeah, I’m super free right now!” he exclaimed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe left Shinohara and approached Kushida. Shinohara simply watched him go with a somewhat cold look in her eyes.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To tell you the truth, Kobashi-san from Class C said she wanted to invite you to join her group, Ike-kun. I\u0026#160;think she’s already at school right now. Do you think you could maybe talk about it with her?” asked Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seriously?! Yeah, totally, let’s go! Let’s get going right now!” Ike shouted. He looked incredibly excited to learn he was being requested by a girl.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, but it seems like you were just talking with Shinohara-san just now… Is it okay for Ike-kun to go talk to her?” asked Kushida, wanting to make sure that Shinohara was okay with it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, it’s completely fine. He’s been annoying me with all his babbling. Take him with you,” said Shinohara.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, you’re the one who’s been annoyin’ me!” shouted Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey were each giving as good as they got. Ike was mainly at fault here, but he started walking away with Kushida with a skip in his step. Shinohara stopped where she stood, watching them go with a somewhat lonely look on her face. It wasn’t long before I caught up to her and then proceeded to pass by her. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHow should I put this? Ike was just the sort of guy who got carried away rather easily. It seemed he’d grown so ecstatic at being requested by a girl that he was missing something big.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Satsuki.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSuddenly, I heard someone call Shinohara’s first name from behind. I couldn’t help but turn back and look at who it was.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, Komiya-kun… Hello,” said Shinohara.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt turned to be none other than Komiya Kyougo from Class 2-B. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s wrong? Are you crying?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Wh-why do you ask?” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, ’cause your eyes are all red.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, guess you noticed, huh? Yeah, just got some dust or something in my eye a little while ago… Ouch,” said Shinohara, putting up an act, trying to cover up how she was really feeling. “Oh hey, that reminds me, Sudou-kun said that you’re going to be a regular player on the basketball team. Is that right?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, finally.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, you always practice until late, so I’d be lying if I said you didn’t deserve it,” said Shinohara.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe’d stood still as she talked with Komiya, so the distance between us widened as I continued to walk on. As I kept going, their voices grew fainter, until I eventually couldn’t hear them anymore.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e4.7\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003e“I\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eSEE YOU’VE CERTAINLY\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e been having your fair share of misfortunes too, having drawn the Trials and Tribulations card. I’m sure you must be the center of attention again,” said Horikita, coming up to me right after she got to the classroom.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I was just going through the same mental agony this morning.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would’ve been nice if we could freely trade cards within our own class. A student who isn’t confident they can win absolutely would not want the Trials and Tribulations card, and yet, we can’t just hand it over to a student who is confident that they can win,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe card that Horikita had drawn was the “Half Off” card. It was a useful card to have when you suffered a \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003epenalty, but if you were the sort of student who was shooting for a higher place in the rankings, it didn’t do you much good.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In any case, since things have turned out this way, you’re simply going to have to work hard, get into the top thirty percent, and if possible, win the prize,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re talking to me like I’m a stranger or something. Aren’t you worried about me at all, as a classmate?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you really, really want to rely on me so badly, I’ll help you, of course.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita was getting increasingly brash. Or rather, she was getting to be more difficult to deal with than before. The incendiary glare she was giving me seemed to be saying, “What the heck do you want?” It made me not want to rely on her. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, but if I find someone who wants it, then I might hand it over to them,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What you choose to do is entirely up to you. I hope it’ll be easy for you to find someone who’ll take it, for sure. The Trials and Tribulations card affects not just the person who owns it, but the entire group. It’s a dangerous risk to take on,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was nice that she’d explained all that so politely, but to me, it simply sounded like sarcasm.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In case you were wondering, I was being sarcastic,” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I figured.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s payback for the many times that you’ve tormented me,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t really remember ever tormenting you, though.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile the Trials and Tribulations card was a burden to bear, it could also be a bit of a protective charm. Icould expect the number of students who might offer to partner with me to decrease without me needing to do anything. In the worst-case scenario, I’d have to consider the possibility of starting the uninhabited island test alone, while holding onto this card. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Since this is you we’re talking about, is it safe to assume that you can handle things?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could rely on Horikita, as she was the class’s leader. But there were bound to be students that needed her support. It would be best if I placed as little burden on her as possible. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, well, I’ll try my best,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI told Horikita that I’d get through this on my own and then took my seat. As I was doing some digging to see who had drawn which cards, I heard a loud shout from Ike, who had arrived late to the classroom.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Wait, you… you found someone to partner up with?!” wailed Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I did. Is something wrong with that?” asked Shinohara.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, Shinohara had decided to form a group with someone during the time she and Ike were apart. Most likely, her partner was…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, though! I just invited you to join a group before! I mean, ’sides, we’re not allowed to form a group without Horikita’s permission, anyway! It’s forbidden!” shouted Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not forbidden, though. Anyway, the group isn’t even officially confirmed yet…though, I’m planning on confirming it today,” said Shinohara.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wha—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And besides, what are you even talking about? What invitation? Who was the one who started drooling over another girl and ignored me?” said Shinohara.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, come on, it wasn’t even like that! I even turned her down for you, you know!” shouted Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, you turned her down now, huh? Ugh, you’re getting on my last nerve. You really are the worst person in the world,” said Shinohara.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who…did you form a group with, anyway?” asked Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s that got to do with you?” she snapped.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nothing, really, just kinda curious,” said Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Komiya-kun, from Class B. He invited me to join his group right after the special exam started yesterday,” said Shinohara.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, it was Komiya after all. Huh. I’m guessing that either Shinohara or Komiya must have mentioned the idea while they were walking to school together.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Komiya? Wait, Komiya? That flashy showoff from the basketball team? No way!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDeep down, Ike had probably thought that Shinohara would’ve joined his group. I’m sure he had been holding onto that arrogant assumption.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He isn’t a show-off. He promised to meet me at the café after class so we could discuss it,” said Shinohara.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter Shinohara had said her piece, she turned her back to Ike. I’m sure that from our classmates’ perspective, who had been overhearing their argument in the classroom, what they just heard sounded like an extension of their usual fights. After class had ended, Shinohara had left the classroom right away, just as she said she was going to do. Ike quietly watched Shinohara leave, but then he left the classroom himself right after, looking as though he had just made up his mind about something.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYousuke, having seen what happened, approached me after Ike had left the room.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, do you have a minute?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMaybe it was because he wanted to avoid anyone else hearing our conversation, but he said he wanted to talk to me in the hallway, so I went along. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, so, about what’s going on with Ike-kun. I don’t think it’s a good idea to just leave him be right now,” said Yousuke.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. Even though he’s pretty self-centered, it’s clear that his knowledge and experiences will be useful during the uninhabited island exam. It’s possible that this incident with Shinohara might make him unable to utilize his full potential,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I agree. And considering how he looked, I’m worried about what will happen if he sees Shinohara-san and Komiya-kun’s discussion.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could certainly understand why Yousuke was feeling uneasy about this. It wasn’t a good idea for us to get into a dispute with Class B at this current point in time \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think I’d like to go check things out. I was wondering if you wouldn’t mind coming along, if you were okay with it? Ike-kun doesn’t really like me very much, after all,” said Yousuke.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf you asked me, I wasn’t so sure that Ike liked me either, really. That being said, it was understandable why Yousuke felt discouraged.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shinohara-san said that she was going to meet up with Komiya-kun at the café, right?” said Yousuke.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. Maybe we should head over there and check things out for the time being,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure,” said Yousuke.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI decided to head over to the café in Keyaki Mall together with Yousuke. While we were on the way there, we talked a little bit about group formation plans.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I had wanted to recommend a plan where our entire grade level would work together to fight against the first-years and third-years, but from the looks of things, it doesn’t seem like the rest of the classes are intending to collaborate. If we got just the second-year students to come together and agree to not let anyone from our grade level get expelled, then it wouldn’t be impossible for us to make it through without losing anyone. Though I suppose there’d be no shortage of suffering if we went along with that plan,” mused Yousuke.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had discussed as much with Horikita yesterday. We could make sure that no one got expelled by deliberately losing the exam. However, the grade that actually executed that kind of plan would inevitably suffer particularly severe damage. I suppose it would be unrealistic to expect our entire grade level to share that pain. That was exactly why, even after an entire day had passed, not a single student had come forward to make a such an idealistic pie-in-the-sky suggestion like that. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess all we can do is form groups that won’t leave us with any regrets,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Guess so…” he replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure you’ve probably been invited by quite a few people, haven’t you, Yousuke?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was impossible that Yousuke wouldn’t have been approached by people. He was popular both with men and women, and his abilities were impressive all around.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Personally, I think that I’d like to pick two people from Class D. Rather than aiming for the top spot, I’d like to try and tackle this exam in a way to avoid penalties,” said Yousuke.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf he were going to protect anyone, it would be the students of Class D, not people from the other classes. That was a natural way of thinking about things. If you’re a talented and popular student, you’ll have no trouble at all finding someone to partner up with. However, students who were less capable weren’t going to be able to ask for help from anyone, not even people in their own class. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is Sakura-san okay?” asked Yousuke.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYousuke was worried about Airi, who was part of my circle of friends, and who was the most lacking in terms of ability.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As of now, she’s looking at making a group with Akito and Haruka,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Miyake-kun is athletic and has great motor coordination, so that group doesn’t seem badly balanced at all,” said Yousuke.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough Keisei had been left out of their group, he had been approached several times by students from other classes who had wanted to scout him because of his brains. I supposed that if Keisei chose a student who could compensate for physical ability, an area that remained a concern for him, then he’d make a formidable group.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, one problem had emerged while we were in pursuit of Ike. There was someone tailing us. Whoever it was, they had done their utmost to avoid being noticed before, but it seemed like now they were willingly allowing me to spot them, like they were prepared for it. Ike headed straight into Keyaki Mall, so now it was just me, Yousuke, and the person following behind us. This state of multiple parties tailing someone, with us tailing Ike and this mystery person tailing us, continued.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough ignoring this person wouldn’t be difficult, if things like this kept happening in the future, it was going to be troublesome. As we got near Keyaki Mall, I stopped for a moment.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, Yousuke. Would you mind going on ahead?” I\u0026#160;asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s up?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just remembered that there’s a little something I need to take care of. I think I should catch up to you in about ten minutes, give or take,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right. If anything happens, give me a call or text,” said Yousuke.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYousuke, without asking me for any additional details, went into Keyaki Mall, disappearing from view. Then, the student who had been following us approached, as if they thought this was their cue. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was my classmate: Matsushita Chiaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t seem surprised. Did you notice me following you right from the beginning?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just don’t show surprise in my expression is all,” I\u0026#160;replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWas this the first time since spring vacation that I had talked with Matsushita alone like this, just the two of us? Well, no, actually, even if you took away the “just the two of us” part, it still applied. This was the first time we had talked since back then.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What were you talking about with Hirata-kun? About Ike-kun? About the uninhabited island exam?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMatsushita, now standing beside me, looked up at me, as if she were trying to read me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And what business is that of yours, Matsushita?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I suppose it’s not so much my business as it is our business. Because you’re someone particularly important in order for us to get to Class A, Ayanokouji-kun,” said Matsushita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe seemed to think very highly of me, but what was she after?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eConsidering how quick-witted Matsushita was, she should have known that a little bit of gentle persuasion by way of flattery wasn’t going to work. But I couldn’t imagine that she was approaching me right now for no reason at all.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_4\" src=\"/hola-lector-agua/images/books/y2v2/OEBPS/Images/INTERIORIMAGES_4.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t be so alarmed. I came up to you today because I have something I needed to tell you, and as soon as possible.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Something to tell me?” I repeated.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The Trials and Tribulations card is an item with powerful effects, but it’s difficult to handle. If you’re having trouble, I think I’d like to offer you my help, Ayanokouji-kun. What do you think?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePutting aside my own thoughts and intentions, she had shown a willingness to help me anytime because we were on the same side. When I didn’t open my mouth to respond to that, she looked a little bit distressed by it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess you’re not going to give me an answer unless I tell you straight out, huh?” said Matsushita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wasn’t trying to be mean to her or anything, but I didn’t want to get thrust into a conversation like this while there were so many people coming and going. It was after class, and you could start to see all kinds of students around. It wasn’t like Matsushita hadn’t noticed that herself. Then, without waiting for an answer from me, she started talking once again.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You need to stay at the top of the rankings to avoid a penalty, so you’re having a difficult time finding people to form a group with, right? Which is why I wanted you to rely on me if you’re having trouble,” said Matsushita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter she said that, she must have forgotten something important, because she quickly spoke up and made an addendum.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course, I intend to completely follow your instructions during the exam, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, that was the message she had wanted to give me, going as far as deliberately tailing me to do so.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m honestly happy that you’re offering to help me, but you’ll be penalized if we don’t make the top thirty percent. Do you understand that you’ll be taking that risk on too, Matsushita?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand. That’s exactly why I think it’s important for me to cooperate with you by helping you out, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t like I thought she didn’t have good intentions. But I figured that the true essence of her request must have laid elsewhere.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile suppressing my wish to hurry things up and go join up with Yousuke, I turned towards Matsushita, who was walking alongside me. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you determine that your odds of survival are highest if you form a group with me?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTo put it simply, you would normally expect that the group with the Trials and Tribulations card would have a higher chance of getting expelled. Yet despite this, Matsushita had offered to help me, without concern for the dangers. I couldn’t interpret that simply as something done solely out of good intentions.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Guess I’ve been found out, huh?” said Matsushita, smiling with her whole face, raising the white flag in surrender.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was thinking that it won’t be difficult for you to stay in the top percentage of groups, Ayanokouji-kun, since, well, it’s you. Even if you don’t necessarily make it to the very top, it’s almost a complete certainty that you’ll break into the top thirty percent. It would be more dangerous for me to casually prioritize my friends and join a group haphazardly,” said Matsushita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThose were her true feelings. She weighed me against the other students she could have possibly chosen, and she ended up choosing me. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought you might get snatched up, Ayanokouji-kun,” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, she came to talk to me as soon as possible. That made it easier for me to understand her intentions, by coming to me with her evaluation. I was grateful for her offer, but I had no intention of coming to a firm conclusion here from the beginning. That wasn’t Matsushita’s fault or anything. It would’ve been the same regardless of whoever approached me. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not going to decide on a group now, at least not this month,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Meaning that you’re going to sit back and see what happens?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I want to see what the other classes are doing,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI gave her a plausible answer. But what I was concerned about was very different from what the average student was concerned about. A special exam on an uninhabited island required extensive preparation. It was impossible to imagine that Tsukishiro wasn’t involved in this somehow.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt had already been a month and a half since the previous special exam, and there still hadn’t been any significant movements on his end. As days went on, we were getting further away from his original scheme to have me expelled by the end of April. Because of the fact that the White Room agent had been acting at their own discretion, Tsukishiro’s plans had gotten off track. Something was likely going to happen at this stage while we were forming groups. This period of time could be called the preliminary battle. There was an element of danger that not even Matsushita could read. If she got involved, she wouldn’t be able to get out that easily. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it seems like I can’t get a satisfactory answer now then, I suppose. I get it. In that case, please just think it over,” said Matsushita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe probably had no intention of pushing this matter too hard because she seemed to back off immediately, waving her hand to say goodbye.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, that reminds me. Here’s my personal contact info,” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe handed me a slip of paper with her ID written on it. It seemed like she had prepared it ahead of time.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I said what I wanted to say.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMatsushita said her piece quickly and efficiently, without wasting any time. After she had made her offer, she turned on her heel and walked back towards the dormitory. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It doesn’t feel bad, getting another girl’s contact information,” I said to myself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRight now, it was unclear whether I’d be able to live up to Matsushita’s expectations of me in the future. Afterward, I met up with Yousuke in Keyaki Mall.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s the situation?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I get the feeling that it’s not going to be the worst-case scenario or anything, but, well…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI followed Yousuke’s line of sight and saw Shinohara and Komiya chatting away happily in the café, engaged in friendly conversation. And a little further away from them, I spotted Ike from behind, slouching his back like he was feeling depressed. He was watching Shinohara and Komiya quietly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What should we do?” asked Yousuke.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, for the time being, if he doesn’t show any signs of going on a rampage of charging in there, I think we can just wait and see. Just carelessly calling out to him might not lead us to a solution anyway,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYousuke nodded in agreement.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In the meantime, I think we should find out more about Komiya. I’m not sure what Komiya’s intentions are in inviting Shinohara to join a group, but we can’t make a move until we make sure what those intentions are,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll think about who the best person for Ike-kun to partner up with would be, in the event that he can’t partner with Shinohara-san, just in case,” said Yousuke.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please do,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe both agreed to split up and gather information separately. \u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e4.8\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eFTER I SEPARATED\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e from Yousuke, I gave Ishizaki, who was in Komiya’s class, a call and asked him to come out. He told me that he was still at school, so I decided to walk on over to where he was. As soon as I\u0026#160;met up with Ishizaki, he immediately ran up to me with a huge smile on his face.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey dude! You’re ready to pair up with us?!” he shouted.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, the jury is still out on that one, sorry. I actually wanted to talk to you about a different matter today,” I\u0026#160;replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I told him that, Ishizaki looked a little bit disappointed, but he quickly recovered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s up dude? Come on, talk to me,” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was about to launch right into what I wanted to talk to him about, but then I turned my attention to a girl that was approaching Ishizaki. It was Nishino Takeko, from Class 2-B.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s this? So, your business you had to take care of was meeting up with Ayanokouji-kun?” said Nishino.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-hey, I told you not to follow me, didn’t I, Nishino? Sorry, Ayanokouji,” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter Ishizaki apologized to me, he urged Nishino to go on ahead to Keyaki Mall. Nishino didn’t listen to him at all, but instead approached me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re close with Ishizaki, huh? It’s kind of surprising to see the two of you together,” said Nishino, observing me closely. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI also noticed that she didn’t include any honorific after Ishizaki’s name.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, you never listen to people at all! This is exactly why everybody shuns you!” shouted Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shuns her?” I repeated.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, uh, yeah, she’s all alone in our class right now. She hasn’t got a single friend. It’s kinda a problem,” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All alone? I’m not really bothered by it though,” said Nishino.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOn that subject, that reminded me, Ibuki was also something of a lone wolf herself. Apparently, Nishino was quite like her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, just go on ahead. ’Kay?” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nope,” said Nishino.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“N-Nope? Hey, come on… Sorry Ayanokouji, hold on just a sec. I’m gonna get her outta here,” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m just curious why you’re sneaking around and meeting Ayanokouji-kun in secret like this, Ishizaki,” said Nishino.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI hadn’t ever talked with Nishino before, but she seemed to be the type of person who just said what was on her mind without hesitation. It was certainly true that a person like that tended to make a lot of enemies. However, I supposed that since Ishizaki and I were meeting together, it was understandable that she would find it curious. It might be counterproductive to just turn her away without telling her anything. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI decided to tell Nishino about what I was going to talk to Ishizaki about. First though, I wanted to give her some background context, before going on to the matter at hand.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ishizaki and I were in a group together during the camp thing last year. We became friends there,” I told her. “I contacted Ishizaki because I want to know a few things about Komiya from Class B. And since this isn’t something that we wanted people to overhear, I asked him to meet me here.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“About Komiya-kun? What do you mean?” asked Nishino.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe didn’t drop the honorific in Komiya’s case, apparently. With that thought in mind, I went ahead and explained what was going on.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I heard that he promised to make a group with Shinohara, from my class. Did you know about that?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nope, first I’ve heard ’bout it. But like, it ain’t all that weird, is it?” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePartnering up with someone from another class was certainly by no means strange, no. So, it wasn’t unreasonable for Ishizaki was curious why I’d ask about it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what ’bout it?” he added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even in the kindest of terms, Shinohara isn’t the type of person who can perform well in the uninhabited island exam. Our class is worried about whether her forming a group with Komiya might be a problem or not. I wanted to know what kind of person he is,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, I guess he’s a normal, good dude, y’know? He’s pretty coordinated and stuff, and he’s on the basketball team, so he’s got stamina,” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki then turned to Nishino for her opinion, with a look that said “Right?” I’m guessing she must have agreed with him, because she responded with an immediate nod, as if there was no issue.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Apparently, one of them had asked the other to be in a group, from the sounds of it. Are they going out or something?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? U-uh, I dunno, I guess…” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no way that you could find that out by asking Ishizaki, though. He doesn’t know a single thing about love,” said Nishino.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shut up! What, do you know anythin’ about it?” shouted Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know more than you, at the very least. I don’t think that they’re dating, but I’m pretty sure that Komiya-kun likes Shinohara-san,” said Nishino.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat must have sparked Ishizaki’s memory, because he spoke up and told me something.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoa, serious? Komiya likes Shinohara? Oh, but hey, come to think of it, I’m pretty sure he might’a said somethin’ about there bein’ a girl he liked in another class… Though I only have like, a vague memory of that,” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf students were to form a group with each other, they would obviously want to look for certain things. There were many factors. Talent or a bond of friendship. Or things like romantic feelings, perhaps. If, as Nishino had said, Komiya had feelings for Shinohara, then it was no wonder that he would want to form a group with her. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But why do you care about all that, though?” asked Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I saw the two of them together this morning. Since Komiya had called Shinohara by her first name, I figured they must be close. I thought there might be something going on,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh… Hey, hold on. Ayanokouji, are you, maybe…? Do you like Shinohara?” asked Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI immediately denied it, but Ishizaki was grinning happily, like a switch had been flipped in his brain.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dude, come on. So, you’re just pretendin’ to be this quiet dude, but turns out there’s a lady you like. All right, I get it,” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I said no, though. It’s not true.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aw, don’t hide it from me. You and me are buds, right?” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, I didn’t think we were close at all until the training camp exam, though… But I supposed it was true that lately he’d been more of a friend to me than the people in my class who I hardly knew at all.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But seriously dude, knowing you, you probably could score a much cuter girl,” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf this kept going any further, there was a chance that some misguided rumors could start going around. If that happened, then Ike and Shinohara’s relationship might sour even further.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s Ike. Ike, from my class. He’s the one who has a crush on Shinohara,” I told him. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Oh what? So, it ain’t you, Ayanokouji?” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Which is why I’m here, trying to find things out,” I\u0026#160;added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, I understand what yer gettin’ at now sure. But, I mean, it ain’t like love is somethin’ another person can just butt into though, know what I mean?” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I agree with that. I think that getting involved in their business would be wrong,” added Nishino.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Normally, yes, I would agree with you. However, for our class, this is a situation that we can’t really ignore, since Ike taking part in this exam is vital to our class,” I\u0026#160;answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe more strained that Ike and Shinohara’s relationship became, the more chance there was that he might run off in a weird direction. This wasn’t a good turn of events, because the uninhabited island special exam, a place where we could really make use of Ike’s talents, was approaching. However, what I was requesting didn’t offer any benefits for Class B. If anything, it would be like them helping their enemy. This wasn’t something that they’d want to help us too much with. That’s what I had thought, anyway.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right. If you need it, I’ll lend ya a hand. What should I do?” asked Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki offered to help me, not minding it at all.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, Ishizaki, are you being serious? You’re Komiya’s friend, aren’t you?” said Nishino.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what, am I just s’posed to abandon Ayanokouji right here, when he’s in trouble?” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yes, you are supposed to abandon him. I get that you two are friendly, but we’re supposed to be enemies,” said Nishino.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They do say that yesterday’s enemies are tomorrow’s friends, right?” replied Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, technically, he should have said “today’s friends,” but it was fine, so I decided to just let that slide.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s very kind of you to offer, but it might be tough for me if you’re asking for something in return,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Somethin’ in return? Nah dude, I ain’t askin’ for nothing. It’s normal to help a friend when they’re in trouble,” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki wasn’t good at lying. He seemed to be willing to give me some advice without asking for any kind of payment. I was grateful for that, but considering that he was Komiya’s friend, I couldn’t make an unreasonable proposal. Besides, if I carelessly tried to separate Komiya and Shinohara, it would probably be frowned upon, especially by Nishino.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay then, in that case… Could you try to get Komiya to tell you how he really feels?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you just wanna know if he really likes Shinohara?” asked Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, but please make sure to keep quiet about the fact that there’s someone who wants to know about it,” I\u0026#160;answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, ’course I’ll do that. But how am I s’posed to actually ask him? Any ideas?” asked Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki was struggling because he didn’t have any motive to ask Komiya how he felt, but Nishino stepped in to throw him a lifeline.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun, you saw the two of them together having fun, didn’t you? In that case, why don’t you guys pretend like it was Ishizaki who actually witnessed them, and then Ishizaki can use that to ask if they’re dating? Wouldn’t that work? Besides, since Ishizaki is a guy who isn’t very popular. It would bother him when one of his friends beat him to the punch, right?” said Nishino.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki immediately accepted Nishino’s proposal since he didn’t really have many ideas of his own to work with.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-well, it definitely feels pretty flimsy as a reason and all, but… A-all right, I’ll do it. Just wait a sec. Club stuff still hasn’t started yet, and—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki had added that he thought the plan would probably work, and then proceeded to call Komiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Oh, hey, Komiya? Sorry for hittin’ you up before your club stuff. Oh, uh, yeah, just somethin’ I wanted to ask ya. Were you talkin’ with Shinohara from Class D this morning? …Dude, I knew it. Aw man, and here I thought we were like brothers in arms, since we didn’t have girlfriends and all. And here you go, leavin’ me in the dust,” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe asked Komiya about Shinohara, handling it better than I had expected he would.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh wait, so you guys aren’t really goin’ out? Guess that must be true, yeah. If I find out later that you’re lyin’ though, we’re gonna have a problem, y’know?” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe confirmed that the two of them were not dating, and then made an “okay” gesture to me with his right hand. Just then though, his expression changed slightly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh… Seriously? O-oh. All right, I getcha, huh…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki had been asking questions in a way that I could follow along up with so far, but the amount of information I could pick up from the conversation suddenly diminished. He began to listen intently to Komiya, who was speaking on the other end of the line. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…That so? Huh, okay. Yeah dude, I get it. Guess that means the time has come for you to become a man. I’m pullin’ for you dude, of course. Let me know how it goes, okay?” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBased on how the conversation had gone, I was able to understand what Komiya had told Ishizaki, more or less. When Ishizaki finished his call, he looked at me with a somewhat awkward expression on his face.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, Komiya’s plannin’ on telling Shinohara that he’s got a thing for her. He’s gonna do it on the island,” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf they formed a group, that meant they’d be together on the island for twenty-four hours a day. I’m sure there would come plenty of times when he’d have the perfect opportunity to tell Shinohara how he felt about her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What now? I mean, ain’t no way we can stop ’em, right?” said Ishizaki.\u003c/span\u003e\u003c/p\u00
