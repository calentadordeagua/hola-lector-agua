03c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e The owner of this card can join a group as a seventh member. It takes effect once the main portion of the exam has started and is not affected by the gender ratio rule.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eNullify:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e The Private Points needed to be paid out for a penalty are reduced to zero. Only valid for the student who owns this card.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eTrials and Tribulations:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Using this card entitles you to be able to earn 1.5 times the Class Point rewards for the special exam. However, if your group fails to place in the top 30%, then your group will be penalized. The school will cover the increased reward amounts.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what are those all about?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“These cards are items that will affect the uninhabited island survival exam. Everyone will receive one card. With one exception, there is no drawback to having any of these cards. Their efficacy can be roughly understood by looking at the descriptive text on the cards,” explained Chabashira. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was a total of eight kind of cards in the lineup, ranging from cards that would give you an edge in the special exam to cards that specialized in protection. The latter cards were useful in the sense that you can keep yourself safe, but if you consider that they were basically for when you’re prepared for defeat, it was likely that those cards would be evaluated differently. The tricky card out of the lineup would be “Trials and Tribulations,” the only one that has a disadvantageous aspect to it. If you used the card effectively, then it carried greater potential than any other rewards, but it wouldn’t be easy to break into the top thirty percent.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Each student will get one of these eight cards, selected at random. The cards will be distributed tomorrow morning. The cards that you’ve obtained can be transferred or traded with students from other classes so long as they are in your grade level until the special exam officially begins. Anyone can view who holds which cards in the OAA app. You can sell your cards to anyone who wishes to buy them from you. You can even buy up a bunch of cards and hold onto multiple. However, the same card effects cannot be stacked, so there is absolutely no point in having two of the same card,” explained Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eCard Overview and Rules\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBoth Basic Cards and Special Cards can be traded with students from within your grade level. You cannot trade with students from within your own class. Also, once a card has changed hands, it cannot be traded again. Even if multiple copies of the same kind of card are used, card effects do not stack.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis meant that a single student could theoretically hold up to a maximum of eight kinds of cards at once and could use them all. However, because the cards had positive and negative applications, it wasn’t like you could activate all their effects at once. In the end, you would just have effective options at your disposal that you could use.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Also, regarding the special cards… There are three kinds of special cards, and they’ll be handed out randomly, but only one will be handed out to each grade level. Therefore, there is the possibility that, through sheer coincidence, one class may come to hold all three cards. That’s all,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAn explanation of the uninhabited island special exam, followed by an explanation of the rewards and penalties. And then an explanation about the distribution of items called cards. And thus, we came to the end of the long overview of the uninhabited island survival exam.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure that some of you might not have understood everything that we just went over, but by lunchtime, the special exam manual will be automatically distributed to your tablets so you can check out the information that way,” said Chabashira, having now finished explaining everything to us.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe bell rang loud and clear, signaling that it was the end of our first-period class. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suggest that you think long and hard about what kind of group strategy you’re going to produce. You have time,” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter giving us that bit of advice, Chabashira left the classroom. Afterward, the students began to huddle together. Kouenji, who was sitting far to the left of me, one empty seat between us, stood up, and then went out into the hall. It looked like he was simply acting according to his selfish whims, as we had come to expect, but he was walking at a quicker pace than usual. I felt like there was something off about the way Kouenji was behaving, so I decided to follow him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI tried to soften my footsteps and anything else that might cause me to be detected so that I wouldn’t be noticed. That being said, there was only so much that I\u0026#160;could do. There weren’t an infinite number of things I could hide behind, like I could on the island. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, ordinary people didn’t usually go about their day with the consideration of being followed. Even if an amateur \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewere\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to try and tail another amateur, the person being followed would probably only vaguely suspect something was up. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShortly afterward, I heard the voices of both Chabashira and Kouenji coming from around the corner. I hid near the corner, holding my breath, and listened in on their conversation. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what did you want to talk to me about, Kouenji?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, teacher, I can’t help but feel that you left a crucial detail out of your explanation,” replied Kouenji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was guessing that Chabashira was probably standing face-to-face with Kouenji now, as she waited for him to ask his question.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A crucial detail?” she asked in return.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Namely, if a person who is taking the exam entirely on their own happens to succumb to illness or injury, what would happen to him or her as a result?” asked Kouenji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, I was wondering what you were going to ask. What a trivial question,” replied Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though I couldn’t actually see her, Chabashira had a somewhat amused smile on her lips when she said that.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I remember correctly, you bowed out of the last exam due to illness. Unfortunately, that’s not going to work this year. No special exceptions will be made. You would be penalized, meaning that you’d be asked to pay six million points if you wanted to stay. And judging from what you have on hand, that would be impossible for you,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fu fu, yes, that’s certainly true. I’m the sort of man who is quite liberal with his cash flow, after all, so it seems like I am in quite the predicament here, yes.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed like Kouenji had been planning to bow out of even this special exam on the uninhabited island, as expected. But there was no escape route open for a solo-participant trying to tackle this exam.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, what are you going to do? Maintain your freedom and get expelled?” asked Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm, I wonder? Yes, yes, I wonder. Well, I don’t mind if you run along now, teacher.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji must have been satisfied with the answer he had gotten from Chabashira, because he just told her to leave. I started hearing footsteps. They immediately picked up in speed, and then I couldn’t hear them anymore. I’m guessing that Kouenji was going to start moving soon too. In that case, I supposed there wasn’t any reason for me to hang around here for long. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI decided to leave without making a sound. But then…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“By the way, who is the person hiding over there, spying on me?” asked Kouenji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji had noticed me hiding from him. I could tell from the way his voice carried in the hall that he must have turned around.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whether or not you come out is entirely up to you,” he added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t like he just blurted that out on a whim or anything. It was almost like he had the keen senses of an animal or something…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough I could have returned to the classroom without revealing myself, I decided to face him honestly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh ho, Ayanokouji Boy. Do you have some business with me, perchance?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe didn’t seem surprised at all. If anything, he was indifferent to my presence there, acting nonchalant about it. It wasn’t so much like he had been anticipating that I would have been there. It was more like he just didn’t care who was there. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita told me to keep an eye on you. She said it’s because she can’t tell what you’re going to do,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji looked at me as though he were sizing me up, and then slowly started walking towards me. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You seem to be quite good at coming up with a front to hide what you’re up to. But I see neither truth nor lies from you, Ayanokouji Boy. I won’t trust the words of a person like that,” said Kouenji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I never saw you as the type of person who would trust anyone anyway,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fu fu fu, well, that’s certainly true, yes. I do not trust anyone other than myself. Not a single person. Or perhaps it would be more accurate to say that I’m not even interested in anyone else.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce Kouenji got directly beside me, he stopped completely still.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And of course, that applies even to you, Ayanokouji Boy,” he added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven after I had gotten that perfect score in the math section of the exam, Kouenji looked no different than usual when he left the classroom earlier. And there hadn’t been any signs at all of him asking anyone about it, either. I could detect no lies whatsoever in what he was saying.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you planning to do for this special exam?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm, yes… I’m sure there will be more to discuss, but may I be included in your group?” asked Kouenji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was wondering how he was going to respond to my question. I see. So that’s how it was going to be. If he partnered with at least one person, then that means Kouenji can withdraw from the exam right at the start with ease.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, but I have to turn you down. I don’t exactly have the kind of leeway to invite in the sort of person who is essentially guaranteed to bow out right when the exam begins,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fu fu fu. I see. Well, I suppose that’s that, then,” said Kouenji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is it okay for you to think that way, though? Even if you find a group somewhere that’ll let you in, in the end you’ll be leaving the fate of your expulsion in someone else’s hands,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, that certainly is true. If I simply withdraw without doing anything, that is,” said Kouenji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe resumed walking, moving past me. As he did though, he gave me a parting shot.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll think long and hard about how I’m going to get through this before the exam begins.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, he returned to the classroom.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e4.2\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003e“S\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003ePECIAL EXAMS\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e on uninhabited islands for two years in a row. I mean, it’s not like I hadn’t considered it at all or anything, but…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was expecting something like this to happen, and it has.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I got back to the classroom, I saw that discussion regarding the special exam had begun. You could say was sort of a customary thing that happened now whenever we had these sorts of tests. Nearly everyone in class, Yousuke included, had gathered near Horikita’s seat in the front row and were trying to sort out the situation. Kouenji had returned to his own seat, swooning over his reflection in his prized hand mirror.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The especially important part of this special exam is that while there are certain conditions, we can team up with anyone in our own grade level.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was most definitely a new rule that we hadn’t seen in any of the special exams until now. Besides, such a rule being implemented should have been outside of the realm of what was expected at this school, in the first place.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But what about how the Class Points are gonna be handed out when you win, though? I mean, I more or less get the idea behind it at all, because we’ve basically gone through somethin’ kinda like it. But I don’t see the benefit in teamin’ up with other classes,” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed it was quite natural that Sudou would’ve brought that point up right away. This special exam is a battle between grade levels, but also between different classes in the same grade level. The only way to finish this exam in an efficient and effective manner was for a group consisting of only students from your own class to take first place. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven still, the school really had come up with some interesting rules. It was much easier to aim for the top spots if your group was made up of many students from within your same year. You’d minimize the risks, but there weren’t many rewards. “Low risk, low return,” I suppose they’d say. On the other hand, if you narrowed your group’s focus, that meant you’d have a high-risk, high-return opportunity.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe most ideal solution would be to form two groups with three people in the same class, and then have them combine into a group of six later. However, Chabashira had mentioned earlier that it wasn’t going to be easy to bring groups together how we wanted once the exam began. If we didn’t get any guarantees that we would be able to form groups freely beforehand, the damage would be great if we tried something and failed. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, it was also a fact that this particular special exam had tremendous destructive power. Supposing if the top three spots were dominated by a single class, the total number of Class Points gained would be as high as 600. And supposing if our class had managed to pull that off, it would essentially be like our magic express ticket to move on up to Class B in one shot.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But, if we try and do this with only the people from our own class, I’m sure there are going to be gaps in talent that we aren’t going to be able to make up for. And besides, if we were to form a group with students from our own class, and… Well, what if the other classes work together? In the worst-case scenario, we might end up being the only class getting left behind.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt went without saying that managing to take first place in this exam only with people from our own class would be ideal, but that was it. It was nothing more than an ideal. If any one class chooses to fight alone, they create the risk of being ganged up on by the other three classes. And if that solitary class were to lose, well, there’d be no “high return” in that situation whatsoever.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would be one thing if it were simply a concern about if we couldn’t win. But if we were to get eliminated early, then we’d run the risk of getting expelled. Meaning, if we aren’t incredibly confident that… No, as long as we don’t have a completely certainty of winning on our own, forming a group of six people, blended together with students outside our class is a prerequisite.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis special exam, where the other classes were going to be both friend and foe, was shaping up to be something truly unprecedented. If you considered that, then I suppose you’d conclude that including students right away from the beginning with the goal of unifying your objectives, would be an important strategy. However, there was no guarantee that we would be able to easily align ourselves with the other classes. Even if you understood that there’s no apparent advantage in forming groups only with students from your own class, in the end, it was normal to want to outpace the other classes if possible since there were going to be a large number of Class Points moving around. That was especially true for the lower-ranked classes. So, the starting point for us would be deciding which way to go, while operating on the premise that we’ll begin with forming a group, with all that in mind.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How are Sakayanagi-san, Ryuuen-kun, and Ichinose-san going to play this?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn order to get us to come to a decision, Horikita decided to start the conversation with our whole class with that particular question, directing it at Yousuke.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’m sure that Class A won’t be stressing at all about trying to team up with other classes since they have a significant lead over the rest of us. No matter what group wins, it won’t exactly be a problem for them as long as the gap in Class Points doesn’t close too much. On the other hand, the rest of the classes, us included, definitely want to close that gap somehow,” replied Yousuke.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou, who had been listening closely to the conversation, spoke up, offering an idea that wasn’t bad.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“’Kay then. How about formin’ an alliance with us three? B, C, and D? If Class A is so far ahead of the rest o’ us, it wouldn’t be a bad thing if we were to start by workin’ together with B and C to try and close the gap, right?” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe idea was that we would an establish a common enemy, and we’d work together to attack Class A on all sides.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They do say ‘the enemy of my enemy is my friend,’ after all. Trying to isolate Class A isn’t a bad idea. And there’s a good chance that Ichinose-san would go along with this proposal,” replied Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But if we suggest isolating Class A, we’re going to need to be prepared to bear some serious resentment. Considering Sakayanagi-san’s personality, I’m sure she’ll devote any and all of her resources to hunt even us, D, the lowest class, down,” said Yousuke.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNormally, you would think that someone in their position would be focused on knocking down the class that was on their tail in second place, Class B. But, just like Yousuke had said, Sakayanagi tended to persistently chase after anyone she had selected to be her prey.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We need to close the distance between ourselves and the upper classes quietly, as much as possible,” he added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If B, C, and D are going to fight together, it’s better that we’re not the ones who propose the idea,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe idea was to set up someone else to be the spokesperson for this plan, and let them suffer Sakayanagi’s, and the rest of Class A’s, ire. The difficult part wasn’t talking about it, but actually going through with it. The trouble with this special exam is that not everything could be solved through discussion from just within your own class. It didn’t matter how heated our debates got from this point onward. Nothing was going to move forward. If we didn’t understand what Class B and Class C were thinking, and if we couldn’t unify our intentions and put plans into action, then we ended up with nothing more than armchair theory.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t going to be easy for our three classes to simply come together and hold a discussion. Ichinose wouldn’t be an issue, but it was hard to imagine that Ryuuen would be willing to agree to it so easily. Besides, if Sakayanagi got wind of this information, then she would naturally\u0026#160;act.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seems like we’re going to have to make a real difficult decision…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though we had a grace period of more than a month to form groups, if we went about things slowly, the other classes would be making their own moves, trying to form their own groups, one after another. We wouldn’t sit around and not take a firm stance.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’d sure be a huge help if one of the other classes proposed a similar plan themselves…,” said Yousuke.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe students of Class D were racking their brains. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just figuring out how we should make a group is proving to be quite a headache,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn addition to the important task of forming a group, there were still other things that needed to be done too. There was the matter of the cards, which had various effects. Tomorrow morning, each and every student was going to be given one of these unique cards, which cannot be transferred between classmates. Moreover, once an item had been transferred once, its possession becomes fixed, and couldn’t be returned. Meaning the only way to get a card for sure is to simply trade with a student from another class, or by buying and selling. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems highly likely that everyone will start making their moves tomorrow.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. And gathering up effective cards for your group is also going to be a point that we’ll need to think about.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eToday was the day when the school gave us the go ahead to start making groups for the upcoming special exam. Naturally, the situation was going to take a major turn. That included our class, D, as well.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e4.3\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eFTER CLASS HAD ENDED\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the phones of students were who classified as exceptional in terms of academic ability or physical ability started ringing. Horikita approached me, while keeping an eye on the situation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seems like they’ve started making their move right away. I suppose it’s only natural for them to try and pull in the most talented students to their side,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRegardless of whatever policy the class you’re in had adopted, there wasn’t any harm in kicking things off with some tentative reservations.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Have you gotten any calls or texts?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“None.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Well, the number of people who actually have your contact information is extremely limited,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You knew that, and yet you deliberately went ahead and said something meant to agitate me. That goes to show that you really are inconsiderate. So, did anyone try to contact you, Ayanokouji-kun? Mister ‘I got a perfect score in math’? Your phone seems surprisingly quiet, doesn’t it?” snapped Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita had come back at me with some harsh words of her own. I decided to look at my phone, which wasn’t ringing.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unfortunately, my battery’s dead. I haven’t charged it for about two or three days now,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you don’t use your phone so often, you won’t need to charge it as often,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs much as I’d like to deny that and say it wasn’t the case, she wasn’t wrong. If you didn’t use your phone that much, you’d usually forget about charging it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shouldn’t you go ahead and give warnings to our classmates? If they carelessly start forming groups on their own, it might spell trouble later,” I cautioned.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t need to explain anything to them. I’ve already given my instructions. I summed things up in a very easy-to-understand message and sent it to everyone. You just didn’t notice since your phone is dead,” said Horikita, showing me her phone’s screen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e—Do not finalize any group assignments until we’ve had the chance to discuss it within Class D. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e—If you need to finalize a group assignment as soon as possible for some reason, please contact Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed like Horikita had seen something like this coming and established some minimum-level ground rules. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not like these rules are binding, though. Ultimately, it’s up to the individual to decide, based on their discretion,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was certainly true that it was up to the individual to decide who to partner up with and to whom not. You couldn’t really meddle when it came to things like personal chemistry, and besides, expulsion was at stake here. Even if all four classes worked together, there was no ideal combination that would keep absolutely everyone safe from the threat of expulsion. With that in mind, all you could really do was offer some advice.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI always carried around a portable charger with me, so I plugged in my phone and got up from my seat. I figured there might be some students eavesdropping on conversations happening in our classroom.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Any word from Ichinose? It wouldn’t be surprising if she threw out a suggestion for our grade level to all work together,” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Haven’t gotten anything from anyone yet so far. And there haven’t been any suggestions coming from Class A or Class B, either. If our entire grade level were going to be joining together as one, we should assume that there would be an attempt to come to a mutual understanding of some kind at this current stage,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf students just went ahead and started forming groups based on their own wants all willy-nilly, it would gradually become more difficult for us to coordinate. If we weren’t going to have some kind of discussion at the outset, that was essentially establishing the reality that the classes in our grade level were going to be fighting one another. If Horikita wanted there to be some cooperation between our classes, she should be making her move now.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita didn’t show any visible signs of displeasure at the fact I got up from my seat. Instead, she got up and followed me. It seemed like she apparently still had more she wanted to say. After we got out into the hallway and she made sure that no one else was around, she started talking to me again.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Regarding this special exam… Would you be able to get first place all by yourself?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t be absurd. All we know right now is that there’s going to be a test on an uninhabited island,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just figured that someone like you, who got a perfect score in math, wouldn’t even need a group,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat kind of logic was that? It seemed like she just tried throwing that out there, just asking for the impossible. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As long as we get first place, our class will see positive results. I don’t care if the first-years and third-years get second- and third-place, they can have them. I’d rather they take those places than someone else from our grade level,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEasier said than done.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, in that case, I suppose we could form groups in such a way to prevent as many expulsions as possible, and that would make things easier, but…” I replied, pausing briefly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut if we steered towards making strong groups to win, we would inevitably be creating some weak groups, as well.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But it’s not like everyone is going to be able to pay up the number of Private Points to save themselves,” I added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, that’s true. I’d like to collect as many Private Points as possible for the students who are still feeling anxious. But if the students who I borrow any points from end up getting penalized and expelled, that’ll be almost too terrible to imagine,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was hardly anything more fruitless than trying to save others only to end up taking a fall yourself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you hate the thought of that happening, then you’ll just have to only request points from students who have extra,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat would certainly work. But in that case, the number of students we could reach out to was quite limited.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are ways to do this without letting anyone get expelled, though I doubt anyone would want to do it,” I\u0026#160;added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You mean the idea of having people bow out right at the start, deliberately?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, Horikita had also noticed the few holes in this exam. According to the rules, only the first five groups that are taken out are expelled. In that case, if we set up five groups specifically to be sacrificed and deliberately let them get taken out, we wouldn’t have to worry about any students after them getting expelled. However, to carry that idea out, a total of thirty million Private Points would need to be prepared. And, more importantly, whatever grade levels made up those bottom three spots in the exam would be handing over Class Points to whoever placed in the top three. And even if people from the same grade level took both the top and bottom ranks, the rewards would be decreased a little bit, so it was inevitable that by taking on the role of deliberately getting out, there were going to be some losses. I supposed that the reason the top three places were tied to the bottom three could be considered the school’s way of preventing anyone from cheating all that easily.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess we just need to survive on our own power somehow,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, it really does seem that way. May I consult with you again later?” asked Horikita, stopping in her tracks.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As long as it’s something I can help with, sure.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’ll be plenty. Thank you.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita seemed like she must have had something to talk about with someone else because she went back inside the classroom. After I watched Horikita go back inside, I decided to head for the exit.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e4.4\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eW\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHILE I WAS WALKING\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e in the hallway, making my way to the main entrance…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“’Sup!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I stood there looking at my phone’s pitch-black blank screen before it powered on, the student who called out to me was none other than Ishizaki Daichi from Class 2-B. He had a wide grin plastered on his face. I guessed that something good must have happened to\u0026#160;him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey dude. I tried sendin’ you a text, but I didn’t get an answer. So I figured I’d just come over.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry. My battery ran out.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No worries, man. Hey, I’m just gonna borrow you for a sec. ’Kay?” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Am I being mugged or something right now?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What? Come on dude, now that’s a good joke. I mean, hell, is there even anyone in this school who could mug you?” he replied, responding to what he thought was a joke with one of his own. “What, do you have something you gotta do or something?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I was just about to head back to my dorm.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I figured. In that case, ain’t no problem, right? Let’s go,” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki beckoned to me with an impassive smile on his face. He started walking on ahead, going faster and faster, inviting me to follow. If I just stood there and let him walk off, I’d probably lose sight of him in a flash. However, if we carelessly conducted a conversation here in the hallway and caused a commotion, we’d only end up attracting attention. Since I had time right now anyway, I\u0026#160;decided to follow Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut the minute I turned the corner, an impossibly large wall suddenly appeared right before my eyes. No, wait, that’s not what it was. It was Yamada Albert, Ishizaki’s classmate. He was wearing sunglasses. Then, with an air of intimidation about him, he placed his right hand on my shoulder.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey,” he said in English.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Hey,” I replied similarly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t really understand what was going on right now, so I figured I’d just respond to him with the same thing he said to me. But what was happening here? This mugging that was supposedly just a joke now seemed to be a little more real.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hello, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRight there, besides the gigantic Albert whom I had earlier thought was a wall, stood Hiyori.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s kind of unusual seeing you three together,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You might be right about that,” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had thought for sure that Ryuuen would show up too, but that didn’t seem like it was going to happen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, probably not so great to hang ’round here. Let’s move,” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Move? Where to?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm, yeah… I actually haven’t really given that any thought,” said Ishizaki, rubbing underneath his nose with his left index finger, chuckling sheepishly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, I’ve got a bad feeling about all this, so can you please just let me leave now?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had the feeling that this was in no way going to be a good turn of events, so I asked for their permission to make my exit.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, the hell man? You’re free, ain’tcha? We ain’t lettin’ you go.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re…not letting me go?” I repeated.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlbert, who was standing behind me, used the strength from his massive frame to hold me, binding my arms behind my back. Then Hiyori grabbed hold of my arm as well, pulling herself close. The two of them had captured me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry, Ayanokouji-kun. We can’t let you escape.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh…?”\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_3\" src=\"/hola-lector-agua/images/books/y2v2/OEBPS/Images/INTERIORIMAGES_3.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFinally, my mugging theory was starting to look increasingly plausible.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e…Okay, that’s enough of me making that joke.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnyway, the three of them seemed like they were planning to bring me to some other location.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’ll draw attention here. Let’s go somewhere else, Ishizaki-kun.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. But where?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That is a good question… Well, how about your room, Ishizaki-kun?” she asked, making a casual suggestion.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? M-my room? N-no, that’s uh, kinda… I mean! No way! We can’t!” cried Ishizaki, in a panic, after she had suggested we move to his room.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why? Is it inconvenient or something?” asked Hiyori.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-well, there’s, uh, lots of reasons. I mean, you just asked me totally out of nowhere and all, and, uh…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think anyone would mind if your room were a little bit messy though. Right?” said Hiyori, turning to Albert, looking for his opinion.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlbert slowly moved his large head up and down, nodding in agreement.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e…Is it okay for me to assume that he understands Japanese? I mean, I’m certain that he would have to get through classes and take exams, but I’d like to hear him speak it at least once.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yeah, that’s it. And it’s not just a little messy, it’s like, super, crazy messy! It’s like, you won’t even have anywhere to step, it’s that bad. Oh darn, that’s just too bad!” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no need to worry. If necessary, we can help clean up,” said Hiyori.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, no, no! There’s like, tissues, and stuff, definitely not the kinda stuff I want a girl to help clean up!” wailed Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki couldn’t help but blurt out exactly what was littered around his room.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tissues…and stuff? What’s that supposed to mean?” asked Hiyori, cocking her head to the side in apparent confusion, wondering what Ishizaki was talking about.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, my room’s a no-go! S-so hey, let’s go to Albert’s room!” said Ishizaki, changing the topic while still panicking. “Yeah! I mean, Albert’s room should be great, right? Right? Right!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki threw that suggestion out like he was trying to run away from something.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“OK.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo Albert did understand Japanese after all. He gave Ishizaki a brief response, indicating that he accepted his proposal. Then, we started to move, with Albert carrying me in his arms.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, um… Am I just going to be carried there like this?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s all right. Yamada-kun is quite strong,” said Hiyori.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYeah, uh, that’s not exactly the problem here. If anything, I felt like we were unusually conspicuous looking like this…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s all right. I suppose that in a way, this is kind of like sending a message,” said Hiyori, the same kind-hearted smile she usually had on her face as she led on the way.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, all right! You go, Shiina! Great idea!” shouted Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat in the world were they planning to do, dragging me along like this? \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that question in mind, I was brought over to the dorms.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e4.5\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHIS WAS THE FIRST TIME\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I had visited Albert’s room. Even though he was much larger than the rest of the students in terms of physique, his room’s layout and structure were naturally the same. However, everyone decorated their rooms in different ways, and his was a bit unique. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA large American flag and Japanese flag hung in the center of his room—and those weren’t the only flags he had up. He also had countless others, including the Chinese flag, Italian flag, the flags of some African countries, and more. The others were smaller in size, but still displayed all over his walls. I felt a sense of passion in the display, particularly when I noticed these weren’t simply printed on paper, but proper cloth flags.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Albert’s kinda a flag fanatic. Surprised?” asked Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe must have visited Albert’s room several times before, which was why he was able to explain that to me in a calm manner.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, seems that way,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter Albert released me from his hold, he urged me to take a seat. Once I had made sure everyone was now sitting, I decided to go ahead and ask them what they wanted.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So… What are you three after?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe three of them exchanged glances. For some reason, they all had happy smiles on their faces, like they were enjoying this. Then, Ishizaki, the representative of their group, spoke up.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m just gonna come right out and say it. Here goes, this is my proposal… Form a group with us for the next special exam!” shouted Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, that was one of the things I’d predicted that this might be about. So this did have to do with the special exam, after all.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Form…a group? Can you explain your plan in a more detail?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whaddya mean, more detail? That’s everything”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um, no, that doesn’t cover nearly everything. I can’t tell who exactly I’m supposed to be partnering up with.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were four people present in this room right now. Which meant that there was one extra person. And on top of that, Hiyori, a girl, wouldn’t be able to participate due to the gender ratio restrictions. Ishizaki was certain to suggest that I team up with him and Albert, but since he hadn’t come right out and said exactly what he wanted me to do, I couldn’t be sure. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Honestly, with whoever, we don’t really care. ’Kay? It can be with me, or Albert, or Shiina, anybody. The point is, we’re askin’ you to team up with people from our class,” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWow, talk about a grand and daring proposal. In a sense, it was the kind of thing that could only be suggested precisely because it was Ishizaki proposing it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re saying that you want me to form a group with two people from Class B?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yep. Then, when the exam starts, you can form up with another three-person group from Class B, makin’ a six-person team. It’ll be perfect. With five folks from Class B and you, Ayanokouji, you can shoot for first place,” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe talked like the idea was a thing so sublime it could move one to tears. But it was significantly important that we calmly discuss this.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hiyori… Did you explain the rules of the special exam to Ishizaki properly? In the simplest terms possible?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No,” she replied immediately. “I felt like if I tried to interrupt earlier, I’d end up having to correct him on something after only five seconds. I thought it would be better to just let him carry on till he was done.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYeah, I had to wonder about that. I didn’t think it was better. Well, it certainly was true that even just five seconds into his suggestion, it was clear that there were things that he didn’t understand about the exam…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, even though there are many points I’d like to bring up, I’ll narrow it down to two… no, three questions for the time being. First, when the special exam begins, there’s no guarantee you’ll be able to form the large group you want so easily,” I explained.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn fact, our homeroom instructor had already told us that it wasn’t going to be easy. If teaming up was as simple as “Hey, let’s make a group!” “Yeah, let’s!”, there would be no point in forcing us to create three-person groups at this stage. If anything, it would only put us at a disadvantage. It was precisely because it was difficult to form larger groups during the exam that we were allowed to freely choose our teammates for the smaller groups right now.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh, that so?” Ishizaki seemed like he didn’t understand one bit. He cocked his head to the side in confusion, looking to Hiyori for an answer.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you sort through everything that’s been explained to us, then yes, you can see that it’s true. Basically, depending on how the situation plays out, it’s possible we might have to cooperate with groups we didn’t expect to team up with,” said Hiyori.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh. What’s the deal with that? I don’t get it at all, man.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“During the exam, there might be certain prerequisites necessary for teaming up with certain people, or to make certain groups. That’s what we’re talking about.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And the heck is that supposed to mean?” asked Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed if he’d understood what that meant, he wouldn’t be struggling so much right now.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The details are unclear. But judging by what the school has explained to us, we can be sure it’s not going to be easy,” said Hiyori.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But… Even if there are conditions, we gotta get ready. We gotta start actin’ on the idea of makin’ groups, right?” asked Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, if you put it that way… Yes, that’s true.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then we’re all good, right? We just gotta go ahead and prepare for the exam like I suggested, and then we’ll be golden.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe fact that he could break things down in such simple terms was honestly something I kind of respected. Hiyori was also listening to Ishizaki’s suggestion with an amused look.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, ain’t no reason to worry ’bout stuff I don’t really understand, y’know?” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWas it safe for me to say that this was one of Ishizaki Daichi’s charms?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, anyway… Onto my second point,” I continued.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFiguring I couldn’t really get him to understand my first point, I decided to just move on to the next.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who else have you talked to, other than me? Or are you planning to talk to anyone else?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ain’t really talked to anybody else, no. And not plannin’ on it, either. Right?” said Ishizaki, looking to his two companions for approval.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey both nodded, indicating their agreement.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Meaning you’ve only talked to me, then. And the reason for that is?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, ain’t that obvious? I mean, you’re just as amazin’ as Ryuuen-san… Well, no, if I had to say, I think you’re even more amazin’ than Ryuuen-san is right now. It’s like, you’re crazy strong in a fight, and your quick thinkin’ has even gotten Ryuuen-san’s seal of approval. And on top of all that, you got a perfect score in math, dude. That’s just nuts. I figure, whoever controls Ayanokouji basically controls the special exam. How could I not invite you?” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My, that’s some high praise, Ayanokouji-kun. However, I agree with everything he said,” added Hiyori.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlbert nodded in agreement as well, without hesitation. I’d said I was only going to bring up three points earlier, but now I wanted to raise a fourth. How much Japanese did Albert actually understand and speak? I’d never seen him in class or anything, but I was sure that he was being taught in Japanese, so…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnyway, Ishizaki hadn’t denied that they were basically trying to win me over…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right then, the third thing… What’s in this for me? What do I stand to gain? If I assume that everyone else in my group is going to be from Class B, and we manage to get first place in this test, then your class is going to be the only one who really gets anything,” I told them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe Class Points we’d get might be the same, but the number of Private Points earned would be very different.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aw, come on dude, ain’t no thing. ’Course we ain’t gonna screw you over so you’re the only one who loses out. Right? When we move on up to Class A, we’ll pay up twenty million points to welcome you into our class, Ayanokouji. Whaddya think?” said Ishizaki, answering my question in a confident, cocksure manner. “So basically, either you get your own class up to A, or our class gets up to A. Don’t matter either way. There’s a 50 percent chance that you’re going to graduate from Class A.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe proud smile on his face seemed to be saying, “Well, how ’bout that?” His reasoning would certainly hold true if all four classes had an equal chance of getting up to Class A. In that case, my chances of getting there via either his class or mine would be 50 percent. But that wasn’t how this worked. Each class had a different level of skill, making it difficult precisely calculate their chances of making it to Class A. Of course, there was no denying the fact that even having one more class I could potentially move into would be an advantage for me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hiyori and Albert agree too, right?” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. We would welcome you with open arms,” said Hiyori.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes,” said Albert, but in English.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBoth of them went along with Ishizaki’s proposal happily, even though they understood it was nuts. What was going on here? Anyway, if I were going to go ahead and accept this absurd proposal for the time being, there was an especially important point I had to bring up before I could commit. I decided to go ahead and ask another question.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Was Ryuuen the one who decided to invite me? Or was this Ishizaki’s sole decision?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki had been answering all my questions in a casual manner so far, but he now wore a tense look for the first time in our conversation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It was my decision. Ryuuen-san doesn’t know a thing about it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo apparently Ishizaki had thought up this plan and made this decision all by himself. I had thought that might be the case, but wow, that really was reckless of him. If that were the case, though, I now understood why Ibuki, who usually hung around Ishizaki, wasn’t here right now. Did that mean that Albert and Hiyori were Ishizaki’s advocates, then?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Have you thought about what might happen if Ryuuen were to find out about this?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nope, I haven’t! I mean, don’t even need to! Besides…I’m ready for it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though Ishizaki was shaking in his boots, he desperately tried to put up a brave front. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The rules say there ain’t any problem with formin’ groups with people in other classes, anyway. So I figure, even if I decide that we need you and invite you, what’s so weird about that? Y’know?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was true. If their class’s policy stated they were to only form groups with people from their own class, I supposed Ryuuen would have no reason to be dissatisfied with Ishizaki’s decision here. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The key to this special exam is to make sure the Class Points stay with our grade and aren’t taken by anyone else. Naturally, this means we need to aim for the top in the overall rankings. And Ayanokouji-kun is indispensable to achieving that goal,” said Hiyori.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Right!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, even though there are still many aspects of this plan of yours that concern me… I’d like to say that I do understand where you’re coming from,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So will you join up with us?” asked Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Although I don’t think you did anything wrong by inviting me, I can’t say yes to you right now.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-but why?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s because Ayanokouji-kun has his own class to consider. Right?” said Hiyori.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though she’d endorsed Ishizaki’s plan, she still understood my reasons for refusal without needing to\u0026#160;ask.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides, I think the terms we’ve offered Ayanokouji-kun aren’t enough, anyway,” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not enough…? What, you sayin’ that twenty million points ain’t enough?” said Ishizaki.\u0
