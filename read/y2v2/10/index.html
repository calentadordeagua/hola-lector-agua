e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T40e85,"])</script><script>self.__next_f.push([1,"\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 4:\u003cbr/\u003eApproaching Summer, Premonition of a Fierce Battle\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eM\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eID-JUNE\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e was almost here. There hadn’t been any new special exams since the one held at the end of April, and we had basically gone back to our normal lives here at school. I saw no signs of the White Room agent that was supposed to be after me making a move either. The only inconvenient thing that happened to me was Amasawa’s visit, but there was no imminent danger of expulsion. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, it did seem like the incident had left a deep impression on Kei and me, considering that even now we were still holding off on trying to kiss again. Even in situations when the mood was getting fairly good, it was like there was this invisible wall separating us. While I wanted to remove that wall and to make progress, there was probably no need to rush things. With time, Kei should be able to break past that wall on her own and naturally move on to the next step. Which might be more effective, in the sense of helping her to grow both emotionally and mentally.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSummer was approaching steadily. At the same time, I was experiencing a daily routine that was almost too fulfilling for a high school student. The temperature outside was slowly beginning to rise, just like in years past. On particularly sunny days, the temperature started reaching as high as thirty degrees. We truly were in the transition period between spring and summer.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaving spent an extended period of time living the carefree student life now, there were some topics that I heard people talk about quite often. One of these seemed trivial: which season was your favorite? However, this proved to be a surprisingly deep and interesting topic of conversation. Even people who grew up in the same place and were raised in the same way had different answers to that question.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had experienced all four seasons here at this school, and I was looking forward to the hot season coming once again. Now that I thought about it, I recognized that summer was my favorite season. Maybe that was why the blue skies looked so beautiful and dazzling during this time of year.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good morning, Ayanokouji-senpai.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I was walking along, looking up at the bright blue sky, I was greeted by a voice coming from in front of me. It was a student from Class 1-D, Nanase Tsubasa. She seemed to be going to class by herself, as there were no friends around her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, morning,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eConsidering the fact that she had been walking ahead of me, she’d probably just so happened to turn around and see me. Either that or she had some business with me and had been waiting for this.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is there something up in the sky?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe reason I didn’t notice Nanase was because I was concentrating on looking up at the blue sky. She must have been observing me for a while if she had noticed me doing that.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nothing. I was just looking at the sky,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At the sky?” she repeated.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase, now standing side-by-side with me, turned her gaze up toward the sky, like me. It was a clear blue today, without a single cloud in sight.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s really nice out, isn’t it?” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. And by the way, it’s been a while.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though we’d passed each other while out and about, we hadn’t actually had a conversation like this in a long time.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. We haven’t talked for about a month and a half or so now,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase had colluded with Housen in his plan to get me expelled from school. It would be no surprise if, like Amasawa, she’d felt it difficult to approach me under normal circumstances. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I feel like I did something really terrible to you, Ayanokouji-senpai,” said Nanase, while still looking up at the sky.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, she had more on her mind that I had imagined she would.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you resent me?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t really have a reason to. It was part of a special exam, right? So there’s nothing to talk about. Besides, I saw you try to protect me anyway.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough Nanase had been complicit in Housen’s schemes, she eventually leapt to my defense, without regard for the danger. I remembered that she had confronted Housen, who was being quite hostile.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that special exam over yet? I didn’t hear anything about a deadline,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, it’s still ongoing. The deadline isn’t until the start of the second semester,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo from the sounds of it, the special exam would be ongoing for a while. However, if that were the case, I found the fact that Nanase and Housen had been silent for the past month and a half was somewhat curious.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aren’t you concerned about the fact that I haven’t tried to make contact with you?” asked Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’d be lying if I said that didn’t concern me. It makes me worry that there might be some scheming going on behind the scenes or something.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Considering what happened the last time, I was convinced that even if we did devise a new plan, it wouldn’t work so easily. Besides, it’s extremely difficult for us to try and force you into a corner in the course of your daily life now that you know our objective, Ayanokouji-senpai,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So you’re waiting for another special exam that’ll involve multiple grade levels, huh? What about the other students in your grade, though?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not entirely sure, but I think they do already know that Housen-kun made a move.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, now that Housen has failed, you’ve all decided that you can’t make any careless moves? I guess that’s one benefit of my injury.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know if that’s worth your left hand, though,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf all the first-year students, Housen Kazuomi was one who really attracted attention, for better or for worse. The fact that he was the first to act might have been a stroke of good luck, in a way. The question was, who knew about this hidden special exam? It was easy for me to just ask Nanase about that, but…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI tried looking at her a few times, but she kept averting her gaze, so I gave up on that and faced forward again. Even if I tried asking Nanase that question, it wasn’t like she was going to answer. The students in the other three classes were still staying hidden so I wouldn’t know out their identities. I was sure Nanase wasn’t going to sell them out, to maintain fairness. The only thing Nanase had done was make me aware of the existence of this special exam in general, to offset any disadvantage to Class\u0026#160;1-D.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I sincerely appreciate your understanding,” said Nanase, speaking as though she understood what I was thinking once I had remained silent for a while.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince we were both headed to class anyway, I decided to talk about something completely unrelated.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seems like you’ve gotten completely used to things here at this school,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom the way she was acting, it looked like she had lost the innocence she had when she first arrived, now blending in with the rest of the students.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. I think the students in my class, myself included, are starting to get better at tolerating the special circumstances of this school. I’m not sure how much the upperclassmen know about this, but we first-years had our second special exam at the end of May,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as we second-years had our own battles to fight, so too did the first-years have their own.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I haven’t had this information directly confirmed by anyone, but I hear that a student has been expelled,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe second-year students had also heard news about someone getting expelled. One student had been expelled from the last special exam.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems like you are also aware of it, then. As I expected. The expulsion was one boy from Class 1-C,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe’d found out because there was one student’s name missing from the list in OAA. He’d had had an A in academics, so he must have been hit with some kind of penalty. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“People are always going to talk when an expulsion occurs,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Friends who were laughing together just the day before can just up and vanish at this school. It’s ruthless. What happened made me realize once more that I need to live my life here in a way that leaves me with no regrets,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough her class might consider what happened to everyone else as not their problem, they didn’t know when the time would come that they’d have to deal with something similar. It was especially important for them to have some sense of alarm, like Nanase. That being said, I didn’t know anything about the Class Points situation in the other grade levels. Meaning that I had no information at all about who won or who lost.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What kind of results did your class get in the special exams?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unfortunately, we didn’t do so well. We came in last place the previous time and in third place this time. However, this time around, it was an exceptionally close match between us, Class A, and Class B, so the gap in Class Points is quite narrow,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed like Nanase felt that they were capable enough to not get left in the dust by Class A and Class B, but if anything, hold their own against them. On the other hand, Class C sank to the bottom of the rankings, largely because someone from their class had been expelled, most likely.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, is Housen behaving himself more these days? Or…?” I began, before being cut off by Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d be lying if I said he wasn’t exhibiting any problematic behavior. However, he wasn’t involved in this most recent expulsion scandal. That’s because it seems as though he’s obsessed with you, Ayanokouji-senpai.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase, who had been looking up at the sky for a long time, turned directly to me for the first time since our conversation began, looking at me with a wry smile.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Though this is definitely hindsight talking, I do think that Housen-kun has calmed down somewhat, thanks to you, Ayanokouji-senpai. I think the strong emotions he’d previously directed solely at the students in our grade are now being directed at our senpai, too. Lately, he’s been saying things like, ‘I wanna throw down with the second-years as soon as I can!’ Which makes me glad.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, that’s… I supposed it was certainly good news for the first-year students, anyway. The Housen and I would occasionally lock eyes when I passed his large, conspicuous form, but if I recalled correctly, the look he gave me felt something like, “Bring it on already.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sooner or later, there might come a time when we have to fight your grade,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe had only worked together once so far. But if Nagumo’s policies were strongly endorsed by the school, the day we’d end up competing with each other wasn’t that far off. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I intend to live my life here at this school without regrets,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s nice.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust like Nanase had said earlier, a friend who was laughing with you one day might very well be gone the next. This was the sort of school where things like that could happen. That was why we had to cherish each and every day that went by, and not take anything for granted. Because each day that passed could never come back. They would be in the past.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-senpai, please try and live your life here at this school without regrets, too,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe said in a way that implied my days here at this school were numbered. And there seemed to be some kind of powerful conviction in her eyes as she looked at\u0026#160;me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course. I’ll make sure I don’t have any regrets,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter she heard my reply, Nanase responded with a nod, seemingly satisfied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, if you’ll please excuse me.” She bowed to me and went her own way, just as we neared the school building.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e4.1\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eC\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eONSIDERING THAT THE\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e first-year students had had their second special exam at the end of May, it wouldn’t be too surprising if we, the second-year students, had one announced any day now. It was about time for us to be ready for something like that. Then, as if to evaluate our resolve, our usual morning homeroom began.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems like everyone is present. That’s good.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter Chabashira had finished taking attendance, she started fiddling with her tablet, most likely to project something up on the monitor. Shortly afterward, she must have finished what she was doing, because the screen went completely white. When that happened, the students looked up at it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We have been together for quite a long time now. So I’m sure you probably have some idea of what this is about,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA new special exam was about to begin. Even though everyone clearly had something they wanted to say, they all waited to hear what Chabashira was going to announce. After a brief period of silence, she let out a little chuckle as she took in the gazes of nearly all of the students in the class.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, we will certainly be discussing a special exam. However, to keep you in suspense for a while longer, we’ll hold onto that discussion until later. First, I’m going to talk to you about summer vacation,” said Chabashira, casting her gaze down at the tablet.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAn image appeared on the monitor—first, a picture of a luxury cruise ship. Our class certainly had memories of a similar ship.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now, I’m going to start by explaining a bit about what this summer vacation will be like,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe students looked at each other for a moment, their expressions conveying the joy they felt at the sweet-sounding words that had just come out of Chabashira’s mouth. However, the combination of the words “ship” and “vacation” ultimately dredged up some very different memories that had been deeply ingrained in us. Those memories reminded us that there was no way this school would let us indulge in such sweet fantasy. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs we were reminded of that fact, the picture on the monitor changed from an exterior view of the ship to an interior view. The itinerary was also displayed, in similar fashion.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“From August 4 through August 11, you’ll be able to enjoy your summer vacation freely and to the absolute fullest on this luxury cruise liner. That’s a total of eight days and seven nights. You can watch plays or indulge in tasty meals. And there will be nothing even remotely like a special exam held on this cruise, either,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, we were being promised a true, genuine vacation for about one whole week. The students who had serious doubts felt themselves relax a bit. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, that slight easing of doubts disappeared as soon as the on-screen image faded away. It was almost like poison had been delivered right into our eyes.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, in order to fully enjoy this cruise, you must successfully complete the upcoming special exam,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter those few brief moments of dreamlike bliss, my classmates were swiftly yanked back to reality. The act of lifting the students’ hopes, only to drop them back down right after, would normally have resulted in great disappointment. However, the students instantly changed gears in their minds, adopting an attitude that showed that they were ready and willing to accept this upcoming battle.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems you really have been learning,” said Chabashira, an approving smile appearing on her lips, as if to express her admiration of us.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t like she had mentioned the vacation part first simply out of sheer meanness or anything. She probably wanted to prove that even though we were still Class D, we were different from how we were a year ago. After all the trials and tribulations we’d endured, we’d learned to brace ourselves and keep our spirits up. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe very first person to ask a question was none other than Horikita, whose seat was directly in the middle. “When will this special exam begin?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, typically when we make these announcements, the special exam would be given that very same day or the next. Unfortunately, in this instance, it’s still a ways off. The next special exam is going to be held during the summer break,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, the school was going to hold the special exam during summer break, after the first semester had finished? If that was the case, what concerned me was the fact that it seemed far too early for the teachers to be explaining the rules right now. What was the purpose of this announcement, if the exam was still more than a month away? \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt any rate, whether we liked it or not, there was one particular special exam that sprang to the students’ minds when they considered what had been said so far. Then, just as everyone seemed to be thinking the exact same thing, Chabashira spoke once more and transformed those thoughts into reality.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re going to participate in an ‘Uninhabited Island Survival’ test, and will be competing against each other.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSurvival on an uninhabited island for a special exam. The battle between the classes that took place during summer break during our first year had been deeply etched into our brains. Each class competed against one another using the limited number of Class Points that we were given during that exam. Also, there were additional rules such as trying to guess who the leader for each class was and getting points by occupying zones. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, we have to do that again this year…” mumbled Keisei, who must have been recalling what had happened then. He would normally have quietly listened to the entire explanation of the special exam, but had probably spoken up because our class had quite a challenging time back then, including some fierce infighting between the guys and girls. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure you’re thinking back to the uninhabited island survival exam that you took last year. However, this year’s exam is going to be different from the previous ones. This will be more rigorous, more grueling than any other special exam. Of course, the Class Points and Private Points that you can earn in this exam will be significant, though,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe’d been free to fight any way we wanted to in the Uninhabited Island Survival battle last year. If you were determined to win, you needed to be frugal with your assets, but if you were fine with giving up on trying to win, then you were allowed to spend your time relatively freely. That was the kind of exam it was. There were no harsh measures such as expulsion, at least not as long as the students didn’t violate any important rules.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe said that this exam was going to be more rigorous and more grueling, but what changes would be implemented from last year’s exam? I didn’t need to worry about getting an answer to that question, though, because I was sure Chabashira was going to tell us right away.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s start by going over the schedule. You can download it to your own devices later and look it over, so there’s no need for you to take any notes here,” explained Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe put up the schedule for the special exam, just as she said she would, the monitor lighting up again now that something was being projected to it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJuly 19: Assemble on the sports field. Depart by bus. Board the cruise ship at the harbor. Depart.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJuly 20: Special exam begins. Explanation of special exam, distribution of supplies, etc.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAugust 3: Special exam ends. Rankings will be announced onboard the cruise ship. Rewards will be handed out accordingly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e* Private Points for the month of August will be allotted after the results of the uninhabited island special exam are applied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAugust 4: Start of free time on the cruise ship.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAugust 11: Arrive at harbor. Return to campus. Dismissal. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe closing ceremony, which would mark the end of the first semester, was going to be held on Friday the sixteenth. We were scheduled to depart three days after that. Moreover, we could tell from the schedule that the duration of this special exam would be twice as long as the previous one, at two weeks.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sensei, based on this schedule, won’t our summer break be shortened like, a lot?” asked Nishimura, launching his question like it were an arrow.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe summer break was generally supposed to be around forty days long, but even if you counted the free days spent lounging around on the cruise ship as part of our summer break, we still were only getting about twenty-four days. It was no wonder students felt dissatisfied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unfortunately, there will be no making up for that lost time. The fact of the matter is that your summer break will most definitely be shortened this year. That’s just how it is,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe school had stopped Nishimura’s arrow dead in its tracks. I supposed that a bit of booing was unavoidable. To many students, days spent on break were more valuable than days spent learning in school.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, on the bright side, you’ll get to spend one week on a luxury cruise ship. Depending on how you look at it, this one week you get to spend on the cruise ship might be more valuable than the two weeks of normal time that you’ll be losing. And as I stated earlier, you can enjoy your time on the ship purely as a vacation period,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed like Chabashira was trying to encourage us to hang in there by saying all of that. We did get to ride on a cruise ship last year, but we’d had extraordinarily little time to actually enjoy it. After the uninhabited island survival exam ended, I remembered, we’d been thrust into the zodiac exam. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTo the students, who lived here on campus, the outside world was so fresh and exciting. And even though we were going to be onboard a ship, we could still say we’d be able to spend our time there differently from how we usually would. It could be the best summer vacation ever. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven the students who had been complaining seemed to be satisfied, more or less. If you weren’t satisfied, you couldn’t move forward. And besides, unlike last year, we had replenished our Private Points to a certain extent, so it wasn’t like we’d be inconvenienced by a lack of funds on the cruise ship. I supposed that was another reason why this might be less stressful on the students.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now then, let’s get down to business. This is similar to the uninhabited island survival exam that you had last year, but you could say that the most significant difference here is in terms of scale. In addition to the fact that there’s going to be a two-week long test period for this exam, the island that we’re using for this is larger in size than the one you were on before,” explained Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAn uninhabited island in the middle of the ocean was shown on the monitor. The photographs seemed to have been taken from the air.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And this time, it won’t just be students in the same grade competing. Students from every grade level will be competing against each other.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMeaning that the competition was going to be larger in scale than the previous one in many ways.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Therefore, the number of opponents you have to fight will also be higher than ever before,” added Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, that was an unexpected development. This test of survival would involve all grade levels, and on top of that, students wouldn’t just be facing off against opponents from their grade. That bit was particularly unexpected.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, wait… Doesn’t that mean that the first-year students will be put at a significant disadvantage, whereas the third-year students will have an advantage?” asked Hirata, a student who despised inequality.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf this were an exam where we were \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003epartnered\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e with students from other grade levels, then everyone would be equal. But that didn’t seem to be the case this time. If so, it meant the difference in physical ability and experience that came with age would create a considerable handicap. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand what it is you’re trying to say but let me just go ahead and say that no exam is ever going to be one-hundred-percent fair. Even if we’re only talking about you second-year students, you’ll be competing on the same stage despite the fact that there’s nearly a year’s difference between those born in April and those born in March of the following year, right?” replied Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTo put it another way, though, that meant there were also cases where students in grades only a year apart might have an actual age difference of nearly two years. That would be a significant handicap.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If a first-year student comes to you asking you for advice, it befits you as their senpai to give them at least some kind of answer. However, the exact nature of what you say to them is entirely up to you. Likewise, you could also ask a third-year student for their opinion,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, while there didn’t seem to be a problem with discussing things as much as you’d like or if necessary, it \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewould\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e basically be like helping the enemy.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There will be a minor handicap applied based on grade level, but you’re basically going to be on a level playing field. So how are we going to make up for the difference in grade level, you ask? The answer is that the lower the student’s grade level, the more rewards they can receive and the fewer penalties they have to worry about,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhich in turn meant that the higher your grade level, the fewer rewards you might receive, and the more severe the penalties, huh? This seemed somewhat similar in structure to the special exam that was held in April, where we had to find partners. Though the test contests were the same in that exam, the penalty the second-years faced expulsion, whereas the first-years just saw a difference in the number of Private Points they’d gain. That was a significant difference. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, taking all of that into account, let’s move on. I’m now going to explain part of the outline, regarding the new rules for the uninhabited island survival exam,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe word “part” made the students exchange looks.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That means not all of the rules are going to be revealed to you today, at this time,” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira instructed us to listen quietly to her explanation and then brought up a new image on the monitor. We looked up at it, seeing the word “group” stand out prominently. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In order for you to understand the rules of the survival battle on the uninhabited island, we must begin with the rules regarding the formation of groups,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed the preliminary part of this particular special exam was going to be much longer than any we’d had before. This also seemed to hint at the intensity of the battle that awaited us.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your next special exam, which is to say, the uninhabited island survival battle, has a rule that allows you to form large groups of up to six people and cooperate with one another. The first thing that you must remember is that these large groups can be formed with any student from your grade level, regardless of class,” explained Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, does that mean…the other second-year students are our allies…?” muttered Horikita quietly to herself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe’d assumed, until then, that everyone outside our own class was an enemy. Her quiet monologuing echoed throughout the room. I was sure her muttered words had reached Chabashira’s ears, but she continued speaking without answering the question.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For the next four weeks or so, from today until the end of Friday, July 16, you second-year students will be given the right to form small groups of up to three students with any partners of your choosing in your grade level. These groups will be the basis for the large groups. However, even though I said you can team up with partners of your choosing, there are some restrictions involved. One of those is, as I just said, that you can only choose students from your grade. You cannot form a group with first-year students or third-year students,” explained Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe could work with anyone from our grade. In other words, students from Class A could team up with Class\u0026#160;C. Apparently, first-year students were allowed to make small groups of up to four students, while third-year students could make small groups of up to three, like we second-years could. I supposed that was one of the handicaps were being doled out for each grade level. The rule in question was then clearly displayed on the monitor.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt might be possible for all four second-year classes to work together to form the strongest groups to compete in this test. If we were free to assemble ideal groups, we’d naturally have a chance at winning this thing. On the other hand, if the other grade levels were similarly able to form the best possible groups of people, we’d need to summon all our strength in order to compete with them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Next, we have the gender ratio. In the case of a mixed-gender small group, girls must make up at least two-thirds of the group,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo groups of two boys and one girl, or just one boy and one girl, weren’t allowed, huh? The possible group combinations were shown up on the monitor.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e[1 Boy]\t[2 Boys] \t[3 Boys]\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e[1 Girl]\t[2 Girls] \t[3 Girls]\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e[1 Boy \u0026amp; 2 Girls]\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSeven possible configurations. Meaning that group configurations like [2 Boys \u0026amp; 1 Girl] or [1 Boy and 1 Girl] would be rejected.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What happens if you don’t form a group? …Or in the event that you can’t form a group? What then?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As you can see from the list of possible combinations, ‘groups’ of just one person can be formed. There would be fewer benefits to such an approach, but it’s not disallowed. The next special exam can be conducted regardless of the number of people in your group. If anyone does want to try going it alone, they are allowed to, regardless of gender,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough the fact of the matter was that the more people in your group, the better off you were, it sounded you could still take this special exam on alone without issues.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure that some students might feel more comfortable being on their own, but the more people in your group, the better. In addition to the advantages you gain by simply having more people, there are also special benefits for having more members. I would strongly recommend you do not choose the option of trying to go it alone in this test, except as a last resort,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed if that if you could handle yourself well enough, it would be all right to be on your own. But students who couldn’t form a group would essentially be forced to take the exam while at a disadvantage, which meant joining a group of three was basically the minimum requirement necessary for a normal student to be ready to compete.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are a considerable number of benefits to forming a group, but there is one caveat. Once a group has been established, people cannot transfer to another group for any reason whatsoever,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce you’d formed your group, it seemed you were stuck together as allies until the special exam was over.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand that we’re unable to change our group, but we can form groups of up to six people for the special exam, correct? So far, we’ve only heard about being able to form small groups of up to three people. Could we please hear more about that?” asked Hirata, addressing Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, that is a key point. When the actual special exam begins, the small groups will be allowed to form up with each other. You could have two groups of three people come together, or three groups of two people, or even six individuals. However, there are conditions for the formation of larger groups as well. In large groups of four persons or more, the group must be at least fifty percent girls,” explained Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo the gender ratio rule would change, requiring groups to have a one-to-two ratio of girls instead of two-to-three. If these restrictions were going to be changing, I supposed sticking with a small group of just one or two people in the beginning was a viable strategy. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“From everything you’ve heard thus far, I’m sure that some students might think that it’s fine if they form their groups right after the special exam starts, but it’s really not as simple as all that. Though you are free to form groups with anyone you’d like, it will be extremely difficult for you to form your ideal large group during the exam. There will be many cases where you might \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewant\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to form a group of up to six people, but won’t be able to do so,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo it seemed that being in a smaller group wasn’t necessarily entirely without merit. But considering the risks of having to survive on an uninhabited island alone from start to finish, it would be safer to form a group of three people at this stage after all, I supposed. If we didn’t take into account students who had been expelled, there were forty students for each class in all grade levels. With four classes in each grade level, that was 160 students per grade. Since the school had clearly stated that groups of up to a maximum of six students could be formed, the minimum number of groups that could be formed in this test, for all grades combined, would be eighty-one. Since there were no guarantees that you would be able to form a group of six people during the actual test, depending on how things played out, it was possible that the number of groups competing against each other could actually be somewhere in the triple digits.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand you must feel perplexed, after being told to just go ahead and form small groups of your choosing. If you don’t know what the contents of this exam will be, you can’t exactly narrow down what kind of people you might need,” said Chabashira, sure that everyone in class had arrived at that conclusion.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe continued speaking.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I cannot tell you exactly what the next special exam is going to be assessing you on. But I can lightly touch on what kind of skills that you may need. That kind of thing,” she added, taking a look at the students, whose expressions had tightened. “I’m sure many students were left feeling frustrated by last year’s survival exam on the uninhabited island, feeling as though they were unable to really demonstrate their potential. However, it is safe for you to assume that this year’s exam is going to test \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eall\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e kinds of ability. Academic ability, physical ability, emotional strength, and communication skills. There’s a strong possibility you’ll be able to make use of strengths other than those I just mentioned, too,” explained Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo it wasn’t enough to simply be good at academics or sports. This meant that students who were good at many things would have an advantage, from the sounds of it. A connection between an uninhabited island and academics was difficult to imagine, but I supposed there were many ways in which it could be accomplished. For example, a rule that said you didn’t get any food if you couldn’t answer a question correctly first. A group made up of people who could only boast of their physical prowess could be eliminated all too quickly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Although it \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eis\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e important for you to choose students you have a good relationship with, a group’s overall strengths are likely to tie directly into their performance during this special exam. I recommend that you look for the right people for the job when forming your groups,” explained Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis meant students who were talented all-rounders would simply have better odds if they teamed up with each other. However, as Chabashira had said, choosing students you got along with was an important consideration, too. Considering that we weren’t sure exactly what kind of exam this would be, chances were good that cooperation would be key.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Although I’ve said that the more people you have, the more advantages you’ll have, the reason this is true isn’t because you’ll have six brains or six bodies working together. It’s because there’s a rule for this exam which implements a dropout system. Let’s compare what would happen in a situation if Hirata tried to get through this exam by himself versus what would happen if we were in a group of three, with Sudou and Hondou,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe then typed something on her tablet. After she did so, there were two groups displayed up on the monitor. One was a group made up of just Hirata and the other was a group of three people, which included Hirata. Each name shown on the screen was colored blue.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s suppose that, during the special exam, Hirata suffered some kind of unfortunate accident that made it impossible for him to continue. Naturally, if he were going this test alone, that would mean his group would be disqualified at that point, and he would be penalized,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the box for the one-person group, Hirata’s name now turned red, indicating disqualification. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“On the other hand, what would happen if Hirata were forced to retire during the exam if he were in a group of three…?” said Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough Hirata’s name in the three-person group went red, the other two names remained blue.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hirata would be disqualified and sent back to the cruise ship, but the remaining two members of the group would be able to continue the test without any issues. And if the group managed to stick around until the end and win first place in the exam, then Hirata would be considered as having come in first place as well, since he\u0026#160;was also a member of the group,” she explained.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo even if an individual dropped out, it would be okay as long as the rest of the group survived. That being said, the loss of any member of the group was bound to have a negative impact. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It doesn’t matter how many people you lose along the way. The group will continue to function without issue until the very last person is gone. In other words, the more people you have in your group, the more ‘lives’ you have, to put it simply,” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI see. This confirmed how significant the groups were. No matter how capable a student might be, accidents were still bound to happen, like getting injured or falling ill. In order to minimize that risk, the formation of a group of six was essential in order to win.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now that you understand the importance of the groups, let’s talk about the rewards,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow the real impact of this uninhabited island survival battle would become clear to us.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eRewards\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em; text-transform: uppercase;\"\u003eFIRST PLACE GROUP\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e300 Class Points, 1,000,000 Private Points, 1 Protection Point\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em; text-transform: uppercase;\"\u003eSECOND PLACE GROUP\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e200 Class Points, 500,000 Private Points\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em; text-transform: uppercase;\"\u003eTHIRD PLACE GROUP\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e100 Class Points, 250,000 Private Points\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em; text-transform: uppercase;\"\u003eGROUPS IN THE TOP 50%\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e (Including those in First through Third Place)\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e50,000 Private Points\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em; text-transform: uppercase;\"\u003eGROUPS IN THE TOP 70%\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e (Including those in First through Third Place)\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e10,000 Private Points\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e* Class Points awarded to the groups in the top three places will be transferred from the grades of the groups in the bottom three places.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass Points will be divided evenly by the number of classes, regardless of the number of the students (rounded).\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBased on the rewards shown up on the monitor, the Class Point and Private Point rewards were fairly large. If one particular class dominated the top three spots, the class rankings would be significantly shaken up. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut there were some bizarre things to take note of.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is the list of rewards for this particular exam. It is important for you to note that you cannot form groups with students outside your own grade for this exam, so essentially, each grade level will be competing against each other. However, the effects of the rewards and penalties are applied based on the composition of each group. In other words, if a group made up of only Class D students takes first place, then the rewards for first place will all belong to Class D. On the other hand, if a group composed of students from all four classes wins first place, then the rewards will be divided equally among the four classes. So, if you create a group made up of the best, most capable students from each of the four classes, you might be able to increase your odds of winning, but your Class Point standing might not really change all that much,” explained Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd because the number of people in a particular group didn’t factor into the equation at all, the 300 points would simply be divided out equally among the four classes. Which means that even if you did take first place in that situation, you wouldn’t really be able to close the gap in Class Points. Well actually, I supposed, given we could only form three-person groups at this stage, we wouldn’t be able to form any with students from all four classes in the first place. That would make it impossible for us to have any sort of ideal discussion, most likely.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And then… The total Class Point rewards for the top three places, a massive 600 points in total, will be collected equally from the grades that fall into the bottom three groups. Say for example that the group that comes in first place is made up of second-year students, and the group in last place is made up of first-year students. That means Class Points will be collected from each of the first-year classes. The rewards for the group that comes in second correspond with the group that comes in second-to-last, and similarly, the group that comes in third place will get their rewards from the group that comes in third-to-last,” explained Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo there was a strong possibility that different grade levels would try and rob points from each other, from the sounds of it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now then, I’ll go on to explain what will happen in a situation where groups from the same grade level come in first and last place, respectively, for the sake of comparison. In this instance, it would be a bit of a special case. The classes included in the group that placed in last would have to pay a hundred Class Points to the classes that had come in first place. Second-to-last place, sixty-six points. Third-to-last, thirty-three points. If a group made up of a single class comes in first place, they will still get the 300 points, as usual. However, if another group of students from the same class were to come in last place at the same time, that means a hundred points would be deducted, so the winning class would only get 200 points,” explained Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhich meant that if a group comprised of students from all four classes were to win, each class would get seventy-five Class Points. No matter how many students your class had in first place, if you happened to have students from your class in a group that placed at the bottom, it was possible that you could lose out.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Additionally, in the event that the Class Points the school has collected is not enough to cover the payout, the school will compensate and pay the remainder. The same rule applies when collecting points from the other grade levels, as well,” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, even in situations where they didn’t have enough Class Points to pay up, the rewards would still be guaranteed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, supposing if a group comprised of students from all four classes does finish in last, the amount that they have to pay out will be reduced, but only slightly. Last place will have to pay out seventy-five points. Second-from-last will pay out fifty points. And third-from-last will pay out twenty-five points. I suppose you could say that everyone shares the burden equally,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed that was kind of a bonus, in an exam where cooperation was quite difficult.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And of course, groups that place at the bottom of the rankings will naturally suffer some penalties. The groups that place in the bottom three positions will have Class Points snatched from them, as I had mentioned earlier. But that’s not all. Students in the bottom five groups will be expelled,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe students gasped. Five entire groups meant it was possible that a maximum of thirty students could be expelled.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-but, if only students from our class are the ones who end up getting expelled, then…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In the worst-case scenario, that would leave only nine of you. But there’s no need to worry about that. In the unlikely event that you are penalized, you could pay six million Private Points to save yourselves. That amount is divided by the number of people in a group. So, for a group of six people, it would cost one million Private Points per person,” explained Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, even in the unlikely event that we did get hit with the expulsion penalty, there seemed to be ways that we could save ourselves.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There is a condition, though. You must have the requisite number of points to pay out that fee to save someone on hand, on your own phones, before you board the ship. You will not be able to borrow or lend any Private Points once the exam has begun.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhich meant we didn’t have the option of helping each other later. We needed to procure those points before the exam.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But within the group that is penalized, I’m sure that there will be some students who can pay up and some who can’t. What happens if one of the students in the group doesn’t have enough points to cover their share?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry about that. Even if five out of the six people in a group come up short and can’t pay their share, the sixth person, the one who does have enough to cover their share, can still save themselves by paying out that one million Private Points,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBasically, if you had enough people, it seemed like you didn’t need to worry about having the others dragging you down with them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“May I ask a question?” asked Horikita, raising her hand, sitting directly facing where Chabashira was standing. “The rules state that if you team up with other classes, each class gets an equal share of the rewards. In the end, wouldn’t that rule result in students choosing to form groups only with students from their own class?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita was saying that even if you did your best to win, it would be pointless if you had to split the Class Points multiple ways.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you decide that there’s no benefit in doing so, then yes, you can simply decide to team up with your own classmates only. That’s all,” replied Chabashira, telling us to figure out for ourselves what to do.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere wasn’t going to be a definite right answer to that question. However, if there was one thing we could be sure of, it’s that if you tried to monopolize all of the rewards and only form groups with students from within your own class, the less-capable leftover groups comprised of a mishmash of students who didn’t get picked for the main groups, would be forced into a difficult situation. At the same time, you’d be creating groups that would likely run the risk of getting expelled. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOn the other hand, if you increased the number of classes represented in your group, the rewards would be fewer, but you would be able to create a broader group more easily and you could control the risk of being penalized. Of course, there were other risks that might come\u0026#160;up. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs far as forming groups for the survival test on the uninhabited island went… Here was a summary of the information that Chabashira had presented to us so far.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e•Survive on an uninhabited island for up to a maximum period of two weeks\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e•A wide variety of skills will be needed, and a high level of overall ability will be more advantageous, but cohesion cannot be ignored\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e•Special rewards such as Class Points, Private Points, and a Protection Point will be given to the groups that place at the top (Class Points are divided equally based on the number of classes though)\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e•Groups will be formed, with a minimum of one person to a maximum of six, and the more people in your group, the more advantages you’ll have (Group rankings are determined by when the last person gets eliminated from the group)\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e•The groups that come in last will receive penalties, expulsion is also a possibility\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e•In accordance with the rules, we can freely form small groups within our grade (up to a maximum of three people)\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e•Forming a large group during the exam will not be easy\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was a rough breakdown of everything so far, but that explanation alone wasn’t enough to give us the entire picture.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand that this has all been a lot to take in so far, but there is still a lot left to explain,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe drew a breath, then moved on to the next part of her explanation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please take a look at this.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe monitor refreshed, now showing eight items on the screen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eBasic Card Overview\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eHead Start:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Points available at the start of the exam are multiplied by 1.5.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eBonus:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Whoever owns this card gets double the Private Point rewards.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eHalf Off:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Halves the number of Private Points that needs to be paid out for a penalty. Only valid for the student who owns this card. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eFree Ride:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e At the start of the exam, designate a specific group. You will receive half of the number of Private Point rewards that the designated group will receive. This effect disappears if you join with the group you’ve designated.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eInsurance:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e If the owner of this card would normally be disqualified from the exam due to poor health, they are instead given one full day to recover. Not valid in the event of disqualification due to cheating, etc. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eSpecial Card Overview\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eOne More:\u0
