nc\":true}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T82c3,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 1\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWE ARRIVED AT Keyaki Mall. Continuing our conversation, we strolled idly through the mall. It was just as I was thinking of suggesting we get lunch in a little while.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Actually, there\u0026apos;s one more reason I called you here. And I was lucky enough to find her.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? Whaddya mean?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo the head-tilting Karuizawa-san, I simply directed my gaze in that direction and had her follow.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Amasawa-san?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe muttered the name upon spotting the back of a lone student with red twin-tails walking ahead of us.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Amasawa Ichika-san has a connection to Ayanokouji-kun\u0026apos;s past. That\u0026apos;s why I\u0026apos;m investigating her right now.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ahh... So that\u0026apos;s how it is.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNext to me, Karuizawa-san showed no surprise, but rather a look of understanding.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Did you perhaps know about their relationship?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Nah, not at all. But I\u0026apos;ve seen Ayanokouji-kun and Amasawa-san talking a little bit. I kinda had a feeling it wasn\u0026apos;t just some simple senpai-and-kouhai relationship they made at this school.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt didn\u0026apos;t seem like there was a difference in the information we had, but her opinion was reassuring.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe fact that we sensed the same thing gave me encouragement to continue with the tedious investigation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are we gonna tail her now? Hey, should we?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...You seem awfully excited about this.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t mind doing spy-like stuff. I mean, is there anyone who actually dislikes it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWell, if I thought of it as an extension of a game, perhaps it wouldn\u0026apos;t be so bad...\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOur target likely had a connection to Ayanokouji-kun and moreover, she was considerably skilled.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKnowing that there was a high probability of losing our only lead if we failed, I found it impossible to enjoy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;For now, I\u0026apos;ll tell you what I\u0026apos;ve gleaned from observing Amasawa-san lately.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was something I\u0026apos;d noticed from watching Amasawa-san after school over the past few days.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe usually acted alone most of the time, and I never saw her spending time with classmates or friends. Of course, she would respond with a smile if spoken to by anyone, boy or girl, but she would immediately return to being alone and would never join the group that had approached her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt appeared to be her stance not to form any particularly close relationships.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat preference for solitude seemed somewhat similar to Ayanokouji-kun\u0026apos;s, but perhaps that was a stretch. In his case, it wasn\u0026apos;t that he didn\u0026apos;t make friends; if anything, he was the type who couldn\u0026apos;t, even if he wanted to.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That was an act... No, it couldn\u0026apos;t have been, could it? Surely not.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t think that was an act. That similarity seems like another thing they have in common.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSetting aside how pathetic it was that I hadn\u0026apos;t known that about him, his way of interacting with people really wasn\u0026apos;t very skillful. That was probably his true self.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTime passed as we continued to follow Amasawa-san\u0026apos;s back from a distance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIdeally, I should\u0026apos;ve spoken with her directly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut the world wasn\u0026apos;t so kind that she would talk honestly just like that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnother person, this time a male student, called out to Amasawa-san.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey only spoke for about five seconds and it appeared to be little more than a greeting.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven so, I made a point to remember every student who was on speaking terms with her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eGathering information indirectly was the only thing I could do at the moment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as I was memorizing his face, the phone I held in my right hand vibrated.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What\u0026apos;s up?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hold on.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e[\u0026apos;I\u0026apos;m waiting in the Student Council room.\u0026apos;]\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI took out my phone, looked at the text on the screen and tilted my head in my mind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Who could this be?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSuch a short message, from an unregistered contact.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was no date or time specified, but did that mean right now...?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf my two o\u0026apos;clock appointment today had been moved up, it wouldn\u0026apos;t have been strange to get word from Nanase-san. Was this something else, then? Even as I was lost in thought, Amasawa-san continued to walk through Keyaki Mall.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThough I knew I had to follow her, I blanked my phone\u0026apos;s screen and closed my eyes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I suppose it can\u0026apos;t be helped...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs long as I\u0026apos;d been entrusted with the position of student council president, I couldn\u0026apos;t just act on personal feelings alone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf someone was waiting in the student council room, I had a duty to respond as best as I could.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOr, even if there was a 99% chance it wasn\u0026apos;t, it might have been from Ayanokouji-kun.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs a realistic possibility, it might also have been part of the next special exam.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m sorry. I know it\u0026apos;s sudden, but I have to go to the student council.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI apologized for having to cut things short before we could even have lunch, despite being the one who invited her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t worry about it at all. And hey, I won\u0026apos;t go tailing Amasawa-san on my own, so don\u0026apos;t you worry.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRealizing on her own what I was about to warn her against, Karuizawa-san replied accordingly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI apologized to her one more time and then decided to head for school.\u003c/p\u003e\u003ch2 class=\"heading_2\"\u003ePart 2\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAFTER ABOUT TEN minutes, I arrived in front of the student council room, but no one was there.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo new messages had arrived on my phone either.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOn a holiday at this hour, the unused student council room was locked, as one would expect.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...A prank?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThough I was suspicious, I used my key to enter the student council room just in case.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, no one was in the silent room and not a single sound could be heard. After returning to the hallway, I decided to wait there for the person who sent the message, just in case.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut, as I expected, the person I was waiting for never appeared, and time simply passed by.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wonder if it would\u0026apos;ve been better to follow Amasawa-san after all. A hint of that regret began to sprout, but since I still had about two hours before my official student council duties, I decided to head back for the time being.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfterward, I went down the stairs to the first floor. From there, I started walking toward the entrance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Student Council President Horikita.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as I took a few steps down the hallway, a student suddenly called my name.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut no one was in my line of sight until now. Surprised, I turned to look behind me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re... Ishigami-kun, right? Do you need something from me?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIshigami Kyou-kun from Class 2-A stood there, dressed in his school uniform.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I recalled his name, I wondered why such an unusual person would approach me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was Saturday, after all. The chances of running into anyone other than students with club activities should\u0026apos;ve been extremely low.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s been a while. I have something I\u0026apos;d like to discuss, so may I have a moment of your time?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course. It\u0026apos;s been quite a while since we\u0026apos;ve spoken like this.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That time, it was you who approached me, President.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s right.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI recalled the time I invited Ishigami-kun to join the student council. He turned me down flat, but whether or not someone joined was a personal matter, so naturally, I couldn\u0026apos;t blame him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was pretty sure Ayanokouji-kun was with me then, too...\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Would you mind if we moved somewhere else?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Somewhere else? Is it something... difficult to talk about?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;d prefer if no one saw us. I don\u0026apos;t intend to take up much of your time.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe said that and without waiting for my permission, turned his back and started walking.\u003c/p\u003e\u003cimg src=\"/hola-lector-agua/images/books/ss-y3-v2/OEBPS/IeHzmpOSNxNIYeShsIchb.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t have any pressing reason to hurry back, so I didn\u0026apos;t mind going along with him, but...\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere were no other people wandering around the school on this day off, so it seemed like we could talk anywhere without issue. I wondered if that meant it was something he really didn\u0026apos;t want anyone to overhear...\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Were you the one who sent me the message?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What makes you think so?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So you\u0026apos;re not going to start with denial.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I mentioned the message, he didn\u0026apos;t seem puzzled and appeared to know what I was talking about.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFurthermore, his attitude seemed to be a natural admission and it didn\u0026apos;t look like he had any intention of hiding it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you have something to discuss, on a holiday like today, I can listen to you anywhere. But you specifically said you didn\u0026apos;t want to be seen. If we used the student council room, someone might come by, or I might have to call the other student council members. Plus, you approached me on my way back from the student council room. That way, you could confirm I was acting alone before making contact.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI figured he must have stayed out of my sight, waiting for the opportune moment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I admit it. I apologize for the roundabout method.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t particularly mind, but if this is a student council consultation requiring urgency, I may not be able to keep it to myself.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe bigger the problem, the more necessary it became to release the information as the student council.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAn obligation to report not only to the students but also to the teachers would likely arise.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You need not worry on that account.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That isn\u0026apos;t something for you to judge personally, though.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Regarding my consultation\u0026#x2014;it seems you\u0026apos;ve been looking into Amasawa, President.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIshigami-kun spoke without turning to face me, continuing to walk at a steady pace.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...What do you mean?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile I felt a slight sense of unease at his unexpected words, I first feigned ignorance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI\u0026apos;d never made a connection between Ishigami-kun and Amasawa-san, but perhaps my assessment of him had been too naive. She must have noticed I was tailing her early on and requested Ishigami-kun\u0026apos;s cooperation. That was a perfectly plausible scenario, and yet I hadn\u0026apos;t considered it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re not going to start with denial, are you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe stopped and said so as he turned back, his gaze meeting mine without hesitation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was to expose and assess the agitation I was trying to hide.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy belated wariness toward him spiked all at once.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Amasawa and I are in the same class. If she makes any suspicious moves, it\u0026apos;s only natural that I\u0026apos;d be informed.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...I suppose so.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor the last few days, I\u0026apos;d been under the self-assessed assumption that Amasawa-san was a student who preferred to act alone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut it seemed that wasn\u0026apos;t actually the case.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDid she tell Ishigami-kun that she was troubled by me following her and asked for his help\u0026#x2014;?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo, but...\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So you\u0026apos;re displeased that your classmate is being investigated. Is this a warning?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No. However, I need to know why the student council is investigating Amasawa. If she is the source of some problem, we as a class will be forced to respond, you see.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a perfectly logical reason. For Class A, which appeared to be managed with stability, it was only right to be sensitive to a classmate\u0026apos;s misconduct and it was no wonder they had their feelers out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In that case, you can rest assured. She isn\u0026apos;t in any kind of trouble.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFirst, I had to clear up Ishigami-kun\u0026apos;s misunderstanding.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd doing so would also naturally lead to my own objective.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Would you mind telling me the reason?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Do you know of a student from third-year Class C named Ayanokouji-kun?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ve never spoken to him directly, but he\u0026apos;s been the subject of various discussions among the second-years as the student who voluntarily transferred from Class A to Class C.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see. So you\u0026apos;re aware of him, as I\u0026apos;d expect. When I bring this sort of thing up, most students want to ask me how I feel about it, but you don\u0026apos;t seem to be that way.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Unfortunately, I have no interest in students from other years. With that said, I fail to see what this has to do with you investigating Amasawa.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed Ishigami-kun was, through and through, only interested in his own class\u0026apos;s affairs.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was hardly good news for me... but I continued my explanation anyway.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m searching for any student who might know about his life before he enrolled at this school. And in doing so, the possibility arose that Amasawa-san is an old acquaintance of Ayanokouji-kun. That\u0026apos;s why I want to ask her for details, but she and I aren\u0026apos;t particularly close. I\u0026apos;m hesitant to ask her directly, so I was in the middle of trying to find some kind of lead.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why is the student council president investigating the one who betrayed her class?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;While it isn\u0026apos;t a frequent occurrence at this school, now that a class transfer happened, it must be dealt with. He has now moved to Class C and we\u0026apos;re now rivals. Surely it isn\u0026apos;t so strange for me to try and gather as much information as I can in order to defeat him in the future, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;To know your enemy, you must get inside their camp. Is that what you\u0026apos;re saying?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Something like that. I may continue to investigate Amasawa-san, but rest assured, it won\u0026apos;t have any negative impact on the second-year Class A.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I understand. However, there\u0026apos;s no telling how others will perceive this. If the student council president has her eyes on Amasawa, it could create the misunderstanding that our class has a problem. I would like you to resolve this as quickly as possible.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t as if I wanted to take my time either, but if it were that simple, I wouldn\u0026apos;t be having such a hard time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;For now, I don\u0026apos;t have any information regarding Ayanokouji-senpai, but I have someone in mind who might know about his past.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Really? Who is it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI asked in response to his intriguing statement, but Ishigami-kun didn\u0026apos;t answer immediately.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t mind telling you, but I need you to promise me one thing. You must absolutely keep the identity of the person who gave you this student\u0026apos;s name\u0026#x2014;in other words, me\u0026#x2014;confidential.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor a moment, the thought that he might ask for Private Points as an information fee crossed my mind, but it seemed I was mistaken.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If that\u0026apos;s what you wish, I promise to protect your anonymity.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The person in question is a student with fairly sharp intuition. It\u0026apos;s to be expected that they\u0026apos;ll try to figure out how you found your way to them. You can handle that with pride befitting Class A and the student council president, correct?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe asked for confirmation, deliberately applying pressure as if to make a point.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps, from Ishigami-kun\u0026apos;s perspective, this person was just that troublesome to deal with.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo, that was something I\u0026apos;d known from the very beginning.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf this was a person who knew Ayanokouji-kun\u0026apos;s past, it stood to reason that they would be someone of considerable ability.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll do my best. For now, all I can do is ask you to trust my resolve.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI answered him that way, fully intending to refuse if he asked me to wager something or enter a contract.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Very well. I will place my trust in you, Student Council President Horikita and provide the information.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Thank you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;She\u0026apos;s a female student from second-year Class D named Nanase. As she\u0026apos;s a member of the student council, you must know her well.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe name of a person I hadn\u0026apos;t considered a possibility, someone who was far too close.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUpon hearing it, my thoughts came to a complete and sudden halt.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m afraid that\u0026apos;s not the case. I had the opportunity to have tea with her and asked a similar question. She told me she didn\u0026apos;t know.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Perhaps she simply wasn\u0026apos;t telling the truth?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t just a passing thought; Ishigami-kun looked at me, his tone of voice hinting at a sliver of confidence.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Why do you think that? I can\u0026apos;t doubt her without reason.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I am, after all, a member of Class A, so I\u0026apos;m constantly gathering information on the other classes. And in doing so, I\u0026apos;ve learned that Nanase was in contact with Ayanokouji-senpai from very early on.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was because Nanase-san participated in the special exam last year, one revealed to only a portion of the first-years, in which they would receive Private Points if they could expel Ayanokouji-kun. I started to say as much but thought better of it. Not all the current second-years knew of that affair, nor had it spread to the third-years.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI decided no one would gain anything if I made a careless remark and dredged up the past.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Last year\u0026apos;s first special exam that you second-years faced. Our class made contact with Nanase-san\u0026apos;s class to coordinate, so perhaps that\u0026apos;s the connection?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m aware of that as well. But can we dismiss the possibility that Nanase orchestrated even that initial alliance for the sake of contacting Ayanokouji-senpai?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If they were old friends, she could\u0026apos;ve just spoken to him openly. There would be no need to go to such lengths\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You may be right. If I\u0026apos;m just overthinking it, that\u0026apos;s fine. Please forget about it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt that, Ishigami-kun retracted his statement.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNanase-san knows about Ayanokouji-kun\u0026apos;s past?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe only information to go on was Ishigami-kun\u0026apos;s statement, so it wasn\u0026apos;t particularly credible. However, now that such a possibility had been suggested, even for a moment, it was etched into a corner of my mind against my will.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI felt it was impossible, but if it were true\u0026#x2014;that would mean...\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...I wonder, could I ask for your cooperation?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Cooperation? What for?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I want to investigate Nanase-san, just in case. Though you\u0026apos;re in different classes, you\u0026apos;re both second-years, so I\u0026apos;m sure you have some contact in your daily lives.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That may be true, but I think it would be difficult for me to cooperate. That\u0026apos;s part of the reason I wished to remain anonymous, as it seems Nanase dislikes me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;She dislikes you...? From the class competition or something?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ve had to intervene in our constant troubles with Housen of Class D, even outside of special exams. While I can\u0026apos;t determine the exact reason, I\u0026apos;m certain that she dislikes me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe OAA confirmed that Ishigami-kun possessed exceptional academic ability. He didn\u0026apos;t seem to be his class\u0026apos;s leader, but assuming he contributed to his class in a position close to that of a strategist, it was a natural dynamic for him to view Nanase-san\u0026#x2014;or rather, her entire class\u0026#x2014;with hostility.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever... she wasn\u0026apos;t the type to openly dislike someone on a personal level just because they were class rivals. At least, that was the judgment I made based on the information I had at my disposal.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf Ishigami-kun had no way of knowing that about her, then it was understandable that he\u0026apos;d take it that way. Or perhaps the boy standing before me simply didn\u0026apos;t want to get dragged into trouble and was making an excuse not to cooperate.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t know if he was someone I could trust, but right now, I just wanted a collaborator.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Very well. I cannot act directly, but I\u0026apos;ll try to do some probing to an extent that my identity isn\u0026apos;t discovered. On the chance that Nanase is unrelated, I\u0026apos;ll also check if Amasawa or anyone else seems to know about Ayanokouji-senpai. Student Council President Horikita, you just have to keep your promise to me and move forward with your own investigation as you please.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes, thank you. Even if I\u0026apos;m pressed for information, I\u0026apos;ll protect you at all costs.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I am hoping for positive results. Well then.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith those words, Ishigami-kun turned his back on me and started walking in the opposite direction of the entrance. It was likely a precaution, born from his wariness of being seen with me by Nanase-san.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe more I tried to investigate Ayanokouji-kun, the more I felt like I was sinking into a swamp.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ayanokouji-kun, just what are you...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven so, I had no choice but to recklessly push through the mud and continue chasing after him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, as I renewed my determination, I was still completely unaware.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf Ayanokouji-kun\u0026apos;s birth.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf the existence of an education and a facility so unreal and harsh that no one who lived a normal life could ever imagine it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf the fact that he was the only one who survived, as other children broke one after another.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf the cruel fate that awaited him later in life\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was surely the turning point.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy reunion with him, with Ishigami-kun, was the beginning of a great change in my life.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBecoming deeply involved in the life of the man named Ayanokouji Kiyotaka\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAn orchestrated encounter.\u003c/p\u003e\u003ch1 class=\"heading_1\"\u003e\u003ca class=\"heading-link\" href=\"/read/ss-y3-v2/2\"\u003eAuthor\u0026apos;s Afterword\u003c/a\u003e\u003c/h1\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTHE YEAR IS passing by in a flash these days. This is Kinugasa.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI\u0026apos;m getting older, and my hernia is starting to flare up again, so I can\u0026apos;t say I\u0026apos;m in perfect shape, but other than that, I\u0026apos;m actually getting healthier every year.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy blood pressure and whatnot\u0026#x2014;the numbers that were a little bad have all trended toward improvement and are now at a level appropriate for my age. All that\u0026apos;s left is, really, the hernia... That\u0026apos;s the one thing I can\u0026apos;t seem to do anything about. But I\u0026apos;ll keep at it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the next volume, Volume 3, since we\u0026apos;re heading into early summer a bit ahead of schedule, that annual event will be coming up sooner.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eVolume 2 was, if anything, a more relaxed and heartwarming installment, but this next one might have a bit more of a bite to it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut since it\u0026apos;s me saying this, you\u0026apos;d best take it with a grain of salt.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile I feel there\u0026apos;s still a long way to go until the conclusion, when I think about how the first term is already drawing to a close, perhaps it\u0026apos;s going by surprisingly fast. I want to avoid touching too much on the main story or the future in the afterword, so I\u0026apos;ll stop here for now, brief as it is.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNow for a bit of pointless talk about my private life. Feel free to skip this. (Just filling pages.)\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo put it simply, with games I used to play a lot like Mario Kart or Smash Bros., I\u0026apos;ve had my fill after just twenty or thirty minutes of playing with my kids, and I don\u0026apos;t have a single game app on my phone other than YouMaji. I used to think, \u0026apos;I can\u0026apos;t imagine a time without games, what else is there to do?\u0026apos;... But now, before I know it, the day is just over!\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd my kids just keep growing up big and healthy in the blink of an eye...\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI\u0026apos;m keenly experiencing Janet\u0026apos;s Principle, sensing that from now on, I\u0026apos;ll probably feel time accelerate more and more as I get older.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWell then, everyone\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI look forward to the day we can meet again before the year is out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs long as there aren\u0026apos;t any major problems, y\u0026apos;know. Any major problems... y\u0026apos;know\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 48\",\"volumeId\":\"ss-y3-v2\",\"chapterIndex\":48,\"prevChapter\":\"$undefined\",\"nextChapter\":{\"volumeId\":\"ss-y3-v2\",\"chapter\":51,\"title\":\"Ichinose Honami’s Short Story: To Love Too Much…\"},\"toc\":[{\"label\":\"Ichinose Honami’s Short Story: To Love Too Much…\",\"href\":\"ss-1.xhtml\",\"index\":51},{\"label\":\"Morishita Ai’s Short Story: Ear Gun\",\"href\":\"ss-2.xhtml\",\"index\":52},{\"label\":\"Shiina Hiyori’s Short Story: A Wavering Heart\",\"href\":\"ss-3.xhtml\",\"index\":53},{\"label\":\"Shiraishi Asuka’s Short Story: The Voice Hidden Within\",\"href\":\"ss-4.xhtml\",\"index\":54},{\"label\":\"Special Short Story: The Six First-Year Students\",\"href\":\"ss-5.xhtml\",\"index\":55}],\"volumeTitle\":\"Short Stories: Volume 2\",\"detailsLink\":\"/select/year-3/ss-y3-v2\",\"returnLink\":\"/select/year-3?contentType=shortStories\",\"currentSpineIndex\":48,\"nextVolumeLink\":\"$undefined\",\"nextVolumeTitle\":\"$undefined\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://classroom-of-the-elite-reader.vercel.app\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"COTE Reader\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"en_US\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:image:width\",\"content\":\"1200\"}],[\"$\",\"meta\",\"9\",{\"property\":\"og:image:height\",\"content\":\"630\"}],[\"$\",\"meta\",\"10\",{\"property\":\"og:image:alt\",\"content\":\"Classroom of the Elite Reader Preview\"}],[\"$\",\"meta\",\"11\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"12\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\"$\",\"meta\",\"13\",{\"name\":\"twitter:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"14\",{\"name\":\"twitter:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"15\",{\"name\":\"twitter:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"link\",\"16\",{\"rel\":\"icon\",\"href\":\"/hola-lector-agua/icon.svg?icon.ae5abf30.svg\",\"sizes\":\"any\",\"type\":\"image/svg+xml\"}],[\"$\",\"$L14\",\"17\",{}]]\n"])</script></body></html>
