us.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hey, let\u0026apos;s grab a bite to eat, Ayanokouji!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a completely transparent, fake attempt to make it seem like he was the one inviting me all along.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, his expression conveyed at least the determined spirit of someone aiming for the Best Supporting Actor award.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi looked on fondly at the transparent Yoshida, her eyes narrowed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn this situation, there was probably only one course of action I could take.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What a coincidence to get two invitations at once. Is it alright if Yoshida joins us?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf it was about something personal or exam-related, we might need to speak privately, so I decided to check.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course, that\u0026apos;s fine. It\u0026apos;s not like I was planning on having any particularly difficult discussions. In that case, may I have Nishikawa-san join us as well? I thought it might be more fun with more people.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt soon became clear that it was just a simple invitation to a meal, so I had no reason to refuse either.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is that okay with you too, Yoshida?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What, Shiraishi and her group are coming too? Well, I guess that\u0026apos;s fine.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis, too, was a transparent act, and he couldn\u0026apos;t hide his happiness completely. If anything, his desperate attempt to put on a deadpan expression backfired, a grin leaking out, making him very easy to read.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSuch a transparent guy, Yoshida must have been irresistibly amusing to Shiraishi\u0026#x2014;perhaps even cute? She watched him the whole time with a warm smile.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Morishita-san, would you care to join us as well?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as Nishikawa approached and a small circle formed, Shiraishi turned her gaze behind me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m quite alright, cock-a-doodle-doo.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSeemingly having no intention of joining the four of us, Morishita refused with that strange turn of phrase.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto glanced my way, but perhaps having heard it was just a normal meal, he made no move to join us and walked toward the hallway alone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince the exam was just announced, he was probably making a move to gather information and scout things out, trying to use his time effectively in his own way. After that, Morishita also left the classroom by herself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Unfortunately, it seems we\u0026apos;ve been turned down.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t worry about someone like Morishita. Come on, let\u0026apos;s go.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYoshida said to Shiraishi, his eyes turning toward the classroom exit.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Wait a minute. There\u0026apos;s someone else I want to invite, is that alright?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Someone else? Ah, you mean Hashimoto?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, Hashimoto already left the classroom.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh, is that right? He\u0026apos;s usually the one talking to you. Then who is it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI turned my gaze to the back of a certain student who was still sitting in their chair.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe other three followed my line of sight, understood who it was I wanted to talk to, and were surprised.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Seriously?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Dead serious.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter making a grim face, Yoshida looked over at Shiraishi and the others.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Are you sure, Shiraishi? If we mix \u003cem\u003ehim \u003c/em\u003ein, things could get ugly.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFearing it would not be an enjoyable meal, he left the decision up to her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Fufufu. Doesn\u0026apos;t that sound interesting? I\u0026apos;m all for it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo Yoshida, who hoped she would refuse, Shiraishi gave her smiling permission to welcome him. Yoshida seemed bewildered by this, but Nishikawa also enthusiastically agreed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sounds like fun. I\u0026apos;m in, too.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Geez, girls are so gutsy when it comes to this kind of stuff...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOr perhaps, they were simply enjoying seeing Yoshida flustered.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWatching the smiles on Shiraishi and Nishikawa\u0026apos;s faces, I couldn\u0026apos;t help but think so.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn any case, I was glad to have received permission. After getting the okay from the two girls, I made my way to that person\u0026apos;s desk\u0026#x2014;Kitou.\u003c/p\u003e\u003ch2 class=\"heading_2\"\u003ePart 2\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTHE FIVE OF us went to the cafeteria, bought tickets from the vending machines, placed our orders, and after we all received our food, we found an open corner table in the back and sat down.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYoshida was on my right, and Kitou was on my left. Shiraishi sat across from me. And Nishikawa was in front of Yoshida. I\u0026apos;d actually intended to have Yoshida and Shiraishi sit across from each other, but whether out of reservation or shyness, I didn\u0026apos;t know. Still, he avoided it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe probably thought he was acting naturally, but it seemed Shiraishi and Nishikawa picked up on my intentions and the meaning behind Yoshida\u0026apos;s actions. Nishikawa, in particular, was grinning with amusement, not even attempting to hide it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Whoa...it\u0026apos;s Ayanokouji...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI heard a voice nearby, and when I looked, I saw Ike and Hondou holding trays and looking our way. It seemed they\u0026apos;d planned to sit in this area since it was empty, but after spotting me, they chose to steer clear and walked away.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Looks like you\u0026apos;ve become quite hated, Ayanokouji-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That can\u0026apos;t be helped. From their point of view, I\u0026apos;m a complete traitor.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was right. If I\u0026apos;d been the one avoiding Ike and the others, it would have been a gross overestimation of my own importance, but the reverse was a normal reaction. Anyone who talked to me in a friendly manner would likely be given strange looks.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The special exam\u0026apos;s about to start, so maybe they don\u0026apos;t want to carelessly give away any information?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Something like that, probably.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I listened to Nishikawa and Yoshida\u0026apos;s exchange, a similar thought ran through my own mind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo be honest, I wanted them to have at least that much of a defensive mindset, and if I were to ask for more, I would have wanted them to set aside their personal feelings and sit near an opponent they hated to steal information. Just by having Ike and the others sit nearby, the five of us would be unable to make any careless remarks, and it would simultaneously serve as a form of harassment toward me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, Ike and the others showed no such inclination; it was merely a coincidence that they almost took a table near us.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey didn\u0026apos;t turn back, and it seemed the two of them had settled at a table far away.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh, right, right. There was something I wanted to talk about. Have you guys seen this month\u0026apos;s OAA yet?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDespite the encounter with my former classmates, Yoshida changed the subject with that question, posing it to everyone at the table.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, I haven\u0026apos;t yet. Was there something different written on it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNishikawa and I both shook our heads, and Kitou didn\u0026apos;t even react.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter confirming that no one had seen it, Yoshida grinned and pointed at me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s this guy\u0026apos;s... Ayanokouji\u0026apos;s OAA.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe then took out his phone and showed the screen to Nishikawa and Shiraishi.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter that, he turned the screen toward me as well.\u003c/p\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAyanokouji Kiyotaka OAA\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAcademic Ability A+ (96)\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePhysical Ability A (81)\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAdaptability B (66)\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSocial Contribution B+ (77)\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOverall B+ (80)\u003c/p\u003e\u003c/div\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eApparently, it was my OAA, displaying the school\u0026apos;s latest evaluation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is there something wrong with this?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not \u0026apos;what\u0026apos;s wrong with this?\u0026apos;! Just look at this overall score. This B+ is top-class among the third-years, top-class! It\u0026apos;s proof that your class transfer and the process and results of the last special exam majorly affected your Academic Ability, Adaptability, and Social Contribution, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was true that I hadn\u0026apos;t explicitly held back since transferring to Class C.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI hadn\u0026apos;t slacked off on written exams, and I\u0026apos;d tackled assignments in P.E. and other subjects normally. It was probably inevitable that my scores would increase compared to my first and second years.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRegarding the class transfer, depending on one\u0026apos;s perspective, it could have negatively impacted my Social Contribution, but it was a rule and system approved by the school, and since I had, of course, transferred legally, it seemed safe to assume that the act itself hadn\u0026apos;t significantly affected my evaluation, for better or for worse.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re the acting leader of Class C now. Dude, you really were an amazing guy all along.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You seem awfully happy, Yosshii. Ayanokouji-kun might be amazing, that\u0026apos;s for sure, but in the end, it\u0026apos;s someone else\u0026apos;s grades, isn\u0026apos;t it? I\u0026apos;m surprised you can be so happy about something that\u0026apos;s not even your own score.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s \u0026apos;cause we\u0026apos;re comrades now, you know? Like with famous baseball or soccer players, even if it\u0026apos;s got nothing to do with you directly, you still root for them unconditionally like \u0026apos;awesome, awesome!\u0026apos; because you feel like you\u0026apos;re on the same team, right? It\u0026apos;s the same kinda thing. That home run the other day and that dramatic comeback goal were electrifying, man. The whole country was celebrating.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYoshida spoke passionately, but it seemed his fervor wasn\u0026apos;t getting through to Nishikawa.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is that so? I\u0026apos;m not a fan of sweaty sports like that, so I wouldn\u0026apos;t know.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps fed up with Nishikawa\u0026apos;s immediate negativity, Yoshida shifted his gaze to Shiraishi.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sh-Shiraishi...? You get what I\u0026apos;m trying to say, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes, of course I do. I am also one of the students who supports Ayanokouji-kun. I am very happy that we were able to welcome such a wonderful talent to our class.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;R-Right? I knew it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m more jealous than happy, though~. I mean, no matter how you look at it, those are scores anyone would be envious of.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re just narrow-minded, Nishikawa.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;d call it being realistic, you know? Besides, I think blind faith is a dangerous way of thinking. \u0026apos;Go with the flow,\u0026apos; \u0026apos;If everyone crosses on a red light, it\u0026apos;s not scary.\u0026apos; Unfortunately for you, I\u0026apos;m not the type to unconditionally root for those kinds of heroes. In fact, I\u0026apos;m the kind of person who gets fed up with one-sided media coverage.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYoshida\u0026apos;s assertion, however, was met with Nishikawa\u0026apos;s unabashed negativity.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;ve got a really great personality, you know that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Thanks.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn response to Yoshida\u0026apos;s undisguised sarcasm, Nishikawa seemed to happily narrow her eyes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What are your thoughts, Kitou-kun? Regarding Ayanokouji-kun\u0026apos;s OAA.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi addressed the boy who\u0026apos;d been silent the whole time, despite having followed them to the cafeteria. Kitou remained perfectly still, his gaze fixed on the lunch he\u0026apos;d chosen, a plate of curry rice.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWould he praise me like Yoshida and Shiraishi, or show disgust and caution like Nishikawa?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was still easy for me to aim higher given the standard level of this school, and for that very reason, I wanted to grasp in as much detail as possible the effect these fabricated grades had on the class.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf many students thought like Nishikawa and their dissatisfaction was building up, it might become necessary for me to change my pace.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s useless, useless. Just a waste of time asking. He\u0026apos;ll just say he\u0026apos;s not interested and that\u0026apos;ll be the end of it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I have no interest in other people\u0026apos;s OAA ratings.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKitou answered in a quiet, yet firm voice.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;See?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKitou\u0026apos;s sharp gaze swiftly shot over, glaring piercingly at me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...I am interested in the reason why you hid this much ability for two years. And also... why you\u0026apos;ve started to get serious now.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe OAA was introduced at the beginning of our second year, after Nagumo became student council president.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy stats at that time were certainly mediocre, to say the least.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Come to think of it, what were Ayanokouji\u0026apos;s old OAA stats like? I\u0026apos;ve looked through all the classes\u0026apos; stats before, but I don\u0026apos;t remember at all.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t remember either. Like, I barely even had an impression of you, Ayanokouji-kun. How about you, Asuka?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes, that\u0026apos;s right... I don\u0026apos;t recall either.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eApparently, none of the three had any recollection of what my OAA had been.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t answer, instead recalling the data from a year ago in my mind.\u003c/p\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAcademic Ability C (51)\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePhysical Ability C+ (60)\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAdaptability D+ (37)\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSocial Contribution C+ (60)\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOverall Ability C (51)\u003c/p\u003e\u003c/div\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey were unmistakably the epitome of mediocrity, with not a single noteworthy point.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was precisely why my overall growth compared to a year ago was undoubtedly among the top of our grade. It was for no other reason than that I\u0026apos;d been intentionally holding back my abilities, but it was only natural for others to find it strange.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, it was certainly not something to be proud of.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wouldn\u0026apos;t bring it up here, as it would be a topic about another class\u0026#x2014;moreover, my former one\u0026#x2014;but in terms of pure growth, Sudou\u0026apos;s OAA was the one truly worth bragging about.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I imagine your stats were quite average, which is precisely why your current OAA is so compelling. If you demonstrated your current potential from the very beginning, Ayanokouji-kun, Horikita-san\u0026apos;s Class A would have surely earned more Class Points by now and been in a higher position. I\u0026apos;ve digressed a bit, but why did you start to get serious?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs if intending to let Shiraishi continue her line of questioning, Kitou scooped up a large spoonful of curry and rice and shoveled it into his mouth.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t like to stand out. At first, I wasn\u0026apos;t even interested in graduating from Class A. That\u0026apos;s why I had no intention of getting heavily involved in the class\u0026apos;s ups and downs.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So you\u0026apos;re sayin\u0026apos; your thinking changed before we became third-years? Or after? That\u0026apos;s a huge change, if it\u0026apos;s true. \u003cem\u003eIf\u003c/em\u003e\u0026#xa0;it\u0026apos;s true.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNishikawa showed strong doubt toward my statement, just like the skepticism she directed at Yoshida.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m aware it\u0026apos;s hard to believe, but it\u0026apos;s the truth.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So then, why did someone like you, who doesn\u0026apos;t like to stand out and wasn\u0026apos;t motivated to be serious, suddenly feel like getting serious?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I believe I\u0026apos;ve already explained this, so it\u0026apos;s a bit late to ask. A major factor was that Hashimoto asked me for help, wanting me to do something about the situation where we could no longer win after Sakayanagi left. I decided that if my power could be useful, I wouldn\u0026apos;t mind becoming the class leader.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHere, I made sure to re-emphasize that the transfer was Hashimoto\u0026apos;s achievement. Hashimoto, who was the subject of great suspicion within the class, had become a figure to be avoided, if anything.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hmm. Somethin\u0026apos; about that doesn\u0026apos;t add up. You feel that way too, right, Asuka?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter thinking for a moment, Shiraishi also nodded in agreement.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even if your true feelings were a desire to be useful and become the leader, I find it hard to believe that \u0026#xa0;he alone would be enough to make you transfer to a lower-ranked class. If you remained in Class A, you could have led them, Ayanokouji-kun, and things might have proceeded more smoothly, don\u0026apos;t you think?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah, yeah. There\u0026apos;s no need to take a risk and betray your class, is there~.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hey, hold on. Don\u0026apos;t go blaming Ayanokouji like that. What\u0026apos;ll you do if he loses his motivation over this?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If he loses his motivation from a little questioning like this, then that\u0026apos;s all he\u0026apos;s got, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNishikawa laughed, lightly brushing aside Yoshida\u0026apos;s defense.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well... but still...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not that simple. Class A has established Horikita as their leader, and her position is secure. If I suddenly threw my hat in the ring, it would just cause confusion. Besides, if I\u0026apos;m going to be a leader for real, there\u0026apos;s no point unless I do something like rebuilding a class from the bottom up.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...So you\u0026apos;re sayin\u0026apos; you wanna get to Class A with your own two hands, even if it\u0026apos;s a pain?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I answered with a nod, Yoshida nodded back two or three times as if impressed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I respect that spirit of yours.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you, like, a glutton for punishment or something? Like, super masochistic? And are you forreal, forreal?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNishikawa continued to laugh, but she also kept voicing her lingering doubts without hesitation. My answer probably wouldn\u0026apos;t clear up her suspicions here, but it would be better to keep answering her anyway.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, before I could open my mouth, Yoshida, his expression hardened, spoke up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Maybe not all of it, but I think what he\u0026apos;s sayin\u0026apos; is true, for the most part.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The words of Ayanokouji-kun\u0026apos;s little follower don\u0026apos;t seem to hold much weight~.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Who\u0026apos;re you callin\u0026apos; a follower?!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then should I call you Hashimoto-kun Number 2?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Anything but that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA short, fast rally of words took place, and Nishikawa deftly spun the chopsticks in her right hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So then, what makes you say you think it\u0026apos;s true?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s like, you can just tell by lookin\u0026apos; at him. No matter how you slice it, he\u0026apos;s a weirdo on the same level as Morishita.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was grateful that he was defending me, but I was not pleased about being put in the same category as Morishita.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I haven\u0026apos;t been paying attention for a bit, and you\u0026apos;ve already earned this much of Yosshii\u0026apos;s trust, huh~.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh, Nishikawa-san. I also trust Ayanokouji-kun a great deal, you know?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi replied, a mysterious smile on her face just as Yoshida had described.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why, why? \u0026apos;Cause he got results in the special exam? Or... is it a personal preference?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNishikawa looked at Yoshida with what could be described as her biggest suggestive smile of the day.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;P-Personal preference...? What the hell is that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYoshida, who took the bait as expected, pressed Nishikawa as he questioned her again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You totally know what I mean~. The truth is, you just want Asuka to look at you that way, don\u0026apos;t you, Yosshii?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;W-Well... I mean... n-no, that can\u0026apos;t be true!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDuring my recent exchange with Shimazaki, the idea that the story of her \u0026quot;100-man slayer\u0026quot; title was a lie had come up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, I had to remember that it was strictly Shimazaki\u0026apos;s opinion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn fact, he\u0026apos;d warned me afterward not to tell anyone about his denial.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA careless student might have let it slip, but Yoshida didn\u0026apos;t show the slightest hint of it, instead framing his words on the premise that the rumor of her \u0026quot;100-man slayer\u0026quot; title was true.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOr perhaps, even while wanting to deny it, he still wasn\u0026apos;t completely convinced by Shimazaki\u0026apos;s statement.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m still holding on to my theory that you\u0026apos;re an assassin sent by Horikita-san, you know.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYoshida\u0026apos;s expression stiffened even more at Nishikawa, who continued to make such blunt remarks.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Knock it off, Nishikawa.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why? You want me to place my complete trust in him like you, Yosshii? I\u0026apos;m not that easy of a girl, you know.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Complete trust? Don\u0026apos;t be ridiculous. Such a relationship doesn\u0026apos;t exist between us in Class C and Ayanokouji yet. We\u0026apos;re still in the process of feeling each other out.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hmm? And yet, you no longer doubt Ayanokouji-kun\u0026apos;s transfer or his future contributions, do you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s not it. I\u0026apos;m trying to start from a place of trust. At the very least, Ayanokouji earned that right by getting us through the first special exam, didn\u0026apos;t he? Or are you going to say that the right thing to do is to constantly doubt him and keep asking, \u0026apos;Is he useful? Is he really on our side?\u0026apos;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo longer bothering to hide his irritation, Yoshida spoke heatedly and forcefully to the frivolously smiling Nishikawa.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s a bit too cool for you, Yosshii, but\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt this, Nishikawa, while still facing Yoshida, glanced over at Shiraishi.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah, well, maybe that\u0026apos;s the right way to think about it. I can\u0026apos;t do it right away, but I guess I do hope I can learn to trust Ayanokouji-kun as soon as possible.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNishikawa, who\u0026apos;d been so openly brandishing her suspicions about me, now took a step back.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I understand how both of you feel very well. So, how about we take this opportunity to dig a little deeper into each other? While visible achievements like the results of the special exam are important, you can\u0026apos;t truly know someone without seeing their private life.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi brought her hands together as she made the suggestion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That might be a good idea. It\u0026apos;s true I still don\u0026apos;t really know what kind of person Ayanokouji-kun is.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps because it was Shiraishi\u0026apos;s suggestion, Nishikawa readily agreed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Since we\u0026apos;re having lunch together like this, let\u0026apos;s reintroduce ourselves.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe irritated Yoshida had no choice but to accept Shiraishi\u0026apos;s proposal... no, the corners of his eyes were already drooping with delight.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well then, I shall start. On weekdays, when I\u0026apos;m alone, I usually go straight back to the dorms. When Nishikawa-san or my friends invite me out, I sometimes stop by Keyaki Mall, but that\u0026apos;s at most once or twice a week.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUnless they were short on cash, the vast majority of students went home via Keyaki Mall nearly every day. It was the only place where they could enjoy almost every aspect of their private lives, from daily shopping to having fun.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Asuka, you turn me down quite a lot when I invite you out, don\u0026apos;t you~?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m sorry. If I had to say, I prefer to spend my time alone. But that\u0026apos;s precisely why on my days off, I make a point of going out and increasing my opportunities to interact with people. Even so, I tend to take it easy in the morning and get more active in the afternoon. I often go to caf\u0026#xe9;s or general stores.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn order to let us get to know her, Shiraishi shared her behavioral patterns with me in more detail than I expected. As if to match her, Nishikawa also began to speak.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Okay, my turn~. I guess I\u0026apos;m usually at Keyaki Mall~. I\u0026apos;m there alone a lot, and I go with friends a lot, too~. Like Takanashi-san or Tsukaji-san, you know.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNishikawa, who began talking cheerfully, continued to speak eloquently even after mentioning her friends\u0026apos; names, going into great detail about what they talked about and what they did.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Alright, alright. We get it, that\u0026apos;s more than enough.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYoshida, who\u0026apos;d been listening in silence for a while, seemed to have finally reached his limit as her story stretched on for several minutes, and he forcibly cut in to stop her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNishikawa looked like she still had plenty more to say, but she reluctantly passed the baton to me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Honestly, I don\u0026apos;t think I\u0026apos;m that different from any other student. If I had to point out a difference, it would be that I\u0026apos;ve been showing my face at the gym recently whenever I have free time, regardless of whether it\u0026apos;s a weekday or a day off.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The gym? You mean the one on the second floor? I didn\u0026apos;t know any students actually went there.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNishikawa muttered as if she were looking at something rare.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are there any guys from our class who go?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hmm, probably not, don\u0026apos;t you think?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eApparently, no classmates immediately came to mind for Yoshida and the others.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt\u0026apos;s not like I go to the gym all that often myself, but I have no memory of any Class C students.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s true that it might not be very popular, but there should still be about thirty members from the entire school. I\u0026apos;m sure a few new students will be joining soon, too.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn addition, school staff could also use it, so the total number of members, including adults, was probably around forty to fifty people.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJudging from the gym\u0026apos;s floor space and the membership fees, it seemed it would almost certainly be operating at a loss if the rent was appropriate, but it was likely able to stay afloat because the school provided generous subsidies.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Does anyone want to join the gym?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ugh, that was a terrible pitch, Ayanokouji...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;A sudden invitation in the middle of this conversation? You\u0026apos;ve got no taste, you know~?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYoshida and Nishikawa looked at me, voicing similar thoughts almost simultaneously.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust then, Kitou stood up, pulling his chair back a little roughly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe\u0026apos;d apparently finished his curry, and he then picked up his tray.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...I\u0026apos;m going back to the classroom.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eLeaving only those words behind, he departed from the group.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In the end, he barely participated in the conversation... Seriously, why\u0026apos;d he even agree to eat with us?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Who knows? It\u0026apos;s hard to tell what Kitou-kun\u0026apos;s thinking. And his face is scary.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wouldn\u0026apos;t go so far as to say Nishikawa was wrong for just blurting out what she thought, but wasn\u0026apos;t that last part definitely an unnecessary comment?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn any case, it seemed the distance with Kitou was not going to be easily closed after all.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter that, I continued to eat while I considered what to do after school.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI\u0026apos;d been thinking about stopping by the library soon, but as luck would have it, the exam had been announced today. Since I still lacked the information to narrow down the rules, I wanted to devote my time after school to that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTomorrow\u0026#x2014;I would make time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was sure I\u0026apos;d be able to talk with Hiyori more leisurely that way, too.\u003c/p\u003e\u003ch1 class=\"heading_1\"\u003e\u003ca class=\"heading-link\" href=\"/read/ss-y3-v2/2\"\u003eChapter 3:\u003cbr/\u003eGetting to Know the Opponent\u003c/a\u003e\u003c/h1\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTHE STUDENTS OF Class A looked at each other as the bell signaling the end of morning homeroom rang.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was the announcement of an unheralded special exam, something that had become a regular occurrence, but this time they couldn\u0026apos;t hide their bewilderment at the slightly different development.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;W-wait, even if you say that\u0026apos;s all, that\u0026apos;s not nearly enough of an explanation!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIke-kun hastily called out to stop Chabashira-sensei, who\u0026apos;d moved to the door to leave the classroom.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I told you, didn\u0026apos;t I? I will not be accepting any questions this time.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah, but\u0026#x2014;!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith a conspicuous sigh, Chabashira-sensei turned only her head and looked at Ike-kun.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m not being intentionally cold. It\u0026apos;s simply a rule that we teachers cannot elaborate on the specific rules of this exam.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer harsh tone made the expressions of the classmates, including Ike-kun, stiffen even more.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I want you to stop acting so spoiled and show me you\u0026apos;ve grown. I\u0026apos;d like you to make me think you\u0026apos;re different from when you first enrolled.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eChabashira-sensei declared, as if to drive the point home.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe fact that it wasn\u0026apos;t harassment and that she never intended to spend time explaining the rules from the start was something we were supposed to infer from the unnatural timing of the announcement, right before the end of homeroom.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe swung the classroom door wide and left without fuss.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven after the door slammed shut, the classroom didn\u0026apos;t fall silent; rather, the teacher\u0026apos;s departure only made it grow noisier.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;She seriously left. How\u0026apos;re we supposed to take this on without even hearing the rules?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;She said she wasn\u0026apos;t being intentionally cold, but wasn\u0026apos;t she kinda cold?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah, she was super cold. Could it be because we lost the last special exam?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We did our best, though.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe classmates continued to grumble and complain as they pleased.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I get why you wanna say that, but calm down, will ya? Kickin\u0026apos; up a fuss ain\u0026apos;t gonna tell us the rules.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps to signal \u0026#x2018;you\u0026#x2019;re being loud\u0026#x2019;, Sudou-kun stuck his pinky into his left ear as he chided the restless students.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sudou-kun is right. The lack of a rules explanation isn\u0026apos;t something to get so worked up about. The other classes are fighting under the same conditions, so there\u0026apos;s no advantage or disadvantage at this stage.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn concert with Sudou-kun\u0026apos;s strong, resonant voice, Hirata-kun also said as much to soothe the students.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s easy for you to say, but we can\u0026apos;t do anything if we don\u0026apos;t know the rules. Wouldn\u0026apos;t it be better to just go in blind a week from now?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I think that would\u0026apos;ve been better, too. This feels like we\u0026apos;re just being strung along.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShinohara-san strongly agreed with the unceasingly complaining Ike-kun.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI could understand what they wanted to say, but the special exam had now been announced.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn that case, all we could do was face it seriously.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo begin with, it was a mistake to assume there were no hints before even thinking about it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI couldn\u0026apos;t just stand by and watch until things got out of hand, so I decided to speak up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The special exam doesn\u0026apos;t start until tomorrow, so just panicking here is a waste of time. First, we should calm down, brainstorm ideas, and discuss things.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You say \u0026apos;ideas,\u0026apos; but what can we do if the rules haven\u0026apos;t been explained?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHere, Hondou-kun, looking exasperated, stared at the large, powered-off monitor that served as a blackboard, re-emphasizing that things were different from usual.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If we pool our wisdom, it\u0026apos;s possible we can get closer to the rules. We just need to imagine what kind of special exam will be held and prepare our options.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah, well, maybe you\u0026apos;re right, but can we really overlook our teacher\u0026apos;s attitude? I\u0026apos;m talkin\u0026apos; about how cold she was, you know?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShinohara-san seemed to have really disliked Chabashira-sensei\u0026apos;s response, as she continued to fixate on that point.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd several other students agreed with her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI really didn\u0026apos;t think it should take priority over the content of the special exam, but...\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was true that Chabashira-sensei had become much softer in her demeanor compared to before. In fact, during the second half of our second year, the frequency with which she showed us a smile increased to the point where she was almost unrecognizable from her former self.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNow in our third year, Ayanokouji-kun transferred, and our teacher was hurt, too.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSometimes that showed in her attitude. But wasn\u0026apos;t that proof that she felt Class A would be forced into a difficult situation from now on...?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e...or perhaps she was limiting unnecessary kindness and smiles to a minimum, as a way to make us refocus.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAbove all, demanding kindness for free, for whatever reason, was simply out of line.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was how I took it, but they didn\u0026apos;t.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe frustrated gazes of some students were directed at me, Hirata-kun, and even Sudou-kun.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEveryone was suffering, burdened with an indescribable frustration.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I thought about our history, I felt no small amount of resistance to reprimanding them harshly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI can\u0026apos;t forget that everyone in the class was also a victim, caught up in the discord created by Ayanokouji-kun\u0026apos;s departure.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the end, no satisfactory discussion took place before the first period began, and only time passed.\u003c/p\u003e\u003ch2 class=\"heading_2\"\u003ePart 1\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDURING THE BREAKS and lunchtime, I meticulously used that time to speak individually with the anxious students of Class A, requesting a discussion after school and securing their permission.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wanted to let them blow off some steam, even if just a little, so the students who\u0026apos;d been complaining, led by Ike-kun and Shinohara-san, wouldn\u0026apos;t still be agitated when it was time for the after-school discussion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSudou-kun said it was an overreaction, but when I saw Chabashira-sensei, who was just as cold as she\u0026apos;d been that morning, I became convinced that I\u0026apos;d done the right thing by acting in advance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Horikita. As I told you during the lunch break, you have a matter in the Student Council room in one hour. I don\u0026apos;t mind you having a discussion, but don\u0026apos;t forget.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes, I understand.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd just as I\u0026apos;d expected, Sensei left the classroom after coming over to me and saying just that, without ever touching on the details of the special exam during the afternoon homeroom. After seeing her off, I made my move. I wanted to avoid a repeat of the morning\u0026apos;s complaint session.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I quickly stepped up to the teacher\u0026#x2019;s podium, another student began to move.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe was the one person I\u0026apos;d identified as a potential problem but hadn\u0026apos;t spoken to.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That guy...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSudou-kun, who muttered quietly nearby, clicked his tongue and turned around.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe student who drew a conspicuous amount of attention, Koenji-kun, stood up from his seat alone and quickly left the classroom.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hey, Koenji\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSudou-kun immediately called out to him in a reprimanding tone, but he walked away without turning back or even stopping for a moment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was normal. He wouldn\u0026apos;t interfere with the discussion, but at the same time, he wouldn\u0026apos;t cooperate either.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI knew that, so I didn\u0026apos;t even try to talk to him before school let out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI resigned myself to the fact that asking for his cooperation would be more trouble than it was worth and would likely just lead to a fight.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEssentially, Sudou-kun, the only one who called out to him, must have felt the same way.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs if to prove it, he too lost interest in Koenji-kun\u0026apos;s disappearing form.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was fine. We could just start the discussion as usual without him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe discussion would proceed more smoothly that way, and problems were less likely to arise.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever...\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wondered if it was really alright to keep letting this slide, dismissing it as \u003cem\u003enormal\u003c/em\u003e.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hirata-kun, I\u0026apos;m sorry, but could you get started without me? I\u0026apos;ll be right back.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah, I understand.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI entrusted the room to Hirata-kun, who readily agreed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven though I knew it was pointless to plead with him, I hurried out into the hallway to chase after Koenji-kun.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI followed him at a light jog down the hallway, where he was presumably heading for the shoe lockers.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd when I spotted the large back of the person I was after, I quickly closed the distance and fell in step beside him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Would you mind waiting a moment?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI called out, looking up at his tall figure from close by.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026#xa0;\u0026quot;Well, well, Horikita Girl. Is there something I can do for you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKoenji-kun glanced at me once, but he didn\u0026apos;t so much as turn his head, his face remaining pointed straight toward his destination.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI struggled to match my steps to his long strides as I continued to follow.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I just want you to at least hear me out.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t mind listening a bit, as long as we\u0026apos;re walking.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s not it. I want you to return to the classroom right now and listen to the discussion.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a modest request.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKoenji-kun didn\u0026apos;t react extravagantly, just flashed a smile that showed his white teeth.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Wouldn\u0026apos;t that simply be pointless? My time is quite priceless, you see. Besides, you and I have an established contract. I\u0026apos;m under no obligation to lend you a hand, am I?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes, I am aware of that. But all I\u0026apos;m asking is for you to listen to the discussion. I\u0026apos;m not asking for your cooperation to win the special exam. I won\u0026apos;t even ask you to say anything.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf I were to ask him to use his potential to contribute to our victory, he would obviously refuse. I recognized the fact that he had every right to do so.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;All you have to do is sit there until we\u0026apos;re dismissed. It\u0026apos;s simple, isn\u0026apos;t it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You seem to be making a passionate case, but I\u0026apos;m afraid I don\u0026apos;t follow. For what purpose, exactly?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s necessary for the class to unite once again. I don\u0026apos;t want you to disrupt that harmony. If even one person breaks the rules, it affects the entire class\u0026apos;s morale.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy justification and my appeal. Surely, at least some of it had to have gotten through to Koenji-kun.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe next expression to appear on the profile I\u0026apos;d been staring up at was a scornful laugh.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hmph. What a curious thing to say. If the class falls apart simply because I\u0026apos;ve left, that just goes to show the limits of your own abilities, Horikita Girl.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This has nothing to do with my abilities. If there\u0026apos;s even one student doing as they please, we can hardly be described as \u0026apos;united,\u0026apos; can we? If even a single piece is missing, the whole thing is incomplete.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see. It seems you\u0026apos;re capable of a somewhat amusing answer. However, you said \u0026apos;once again,\u0026apos; but has the class, excluding myself, ever truly been united as one?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy expression stiffened for a moment at his merciless words, and I stopped in my tracks.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut I knew I couldn\u0026apos;t let Koenji-kun walk away with a rebuttal like that, so I immediately resumed walking.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Saying we\u0026apos;ve never been united is a bit of an overstatement, don\u0026apos;t you think? Over the past two years, while not every time, there have been more than a few occasions when our class came together as one. That\u0026apos;s why we\u0026apos;re in Class A now.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe overcame hardships together. It might not have been something to boast about to others, but a fact was a fact.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You should add \u0026apos;in your mind\u0026apos; to that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And you should add, \u0026apos;not in yours.\u0026apos;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if it was just a tit-for-tat exchange, I couldn\u0026apos;t back down, so I pressed on even if I had to force it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Being in Class A is proof of unity? The only reason the class was lucky enough to win was because Ayanokouji-boy was making his moves. Surely you understand that without me having to tell you, don\u0026apos;t you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...It\u0026apos;s true that Ayanokouji-kun left our class. But we didn\u0026apos;t win through his power alone.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you truly believe that, then that\u0026apos;s quite the comical tale. You talk of unity, of being as one, but aren\u0026apos;t you just trying to convince yourself that you can win even without Ayanokouji-boy?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHis merciless words felt like a blade stabbing me in the back.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s no point in me returning to the classroom now. No matter how much you struggle, as long as you\u0026apos;re the leader, a victory against the other classes is impossible.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe pointed out my lack of ability without sugarcoating it in the slightest.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m... not good enough?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIchinose-san, who earned enough trust to unite her class. Ryuuen-kun, who brought his class together through fear and violence. And Sakayanagi-san, who produced results and earned recognition with her exceptional abilities.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAyanokouji-kun, who\u0026apos;d been accepted by the class in the blink of an eye with his overwhelming ability\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI couldn\u0026apos;t deny that there was a difference when I compared them to myself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes, that might be true. But that doesn\u0026apos;t mean it\u0026apos;s okay for me to just stand still here, does it? I have to start with what I can do. Precisely in order to strengthen our imperfect unity\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I won\u0026apos;t deny that, in itself. It is your freedom to do as you please. And, as I have neither reason nor obligation to follow the class\u0026apos;s instructions, I am also free to persist in my non-participation.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re an excellent student; I know that. But with Ayanokouji-kun now on the enemy\u0026apos;s side, our class\u0026apos;s position as Class A will be threatened before long. You\u0026apos;re fine with that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWithout his cooperation, we might not be able to graduate from Class A.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wanted to see if Koenji-kun was prepared for that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHis behavior... So as not to miss any sign that he was acting differently than usual, I focused my gaze from his head to toe.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut even under my testing gaze, Koenji-kun\u0026apos;s attitude didn\u0026apos;t change at all.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn fact, he just laughed back at me, amused.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In the end, it seems you\u0026apos;re the same.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWithout slowing his pace in the slightest, Koenji-kun continued to distance himself from the classroom.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...The same? What\u0026apos;s the same?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I speak of this cheap ploy to stoke my sense of crisis and desperately try to make me move.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Does that mean someone besides me has already tried to do the same thing?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWas there anyone in the class now who would blame Koenji-kun for his selfish behavior? Even Sudou-kun would only give him a light warning, and most students avoided even speaking to him. Hirata-kun might have tried to talk to him, but he would never resort to threats.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Now, who\u0026apos;s to say?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile I was trying to figure it out, I realized we were almost at the school entrance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Chasing after me any further is a waste of your time, so I suggest you stop.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...I\u0026apos;d like to take your advice, but I simply can\u0026apos;t.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI would pursue him to the very end.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUntil Koenji-kun admitted defeat and said he would return to the classroom.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI certainly felt a new resolve ignite within me, but that flame was extinguished in an instant.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Advice? What a misguided girl you are. Unfortunately, this isn\u0026apos;t advice. It\u0026apos;s a warning.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hk...!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI caught the look from Koenji-kun, and meeting his eyes, I gasped.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was an irritation from Koenji-kun that he rarely ever showed, tinged with a faint killing intent.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a particular glint in his eyes, different from what someone like Ryuuen-kun, who constantly relied on intimidation, would show.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you planning to make an enemy of me too, Horikita-girl?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe was not an ally, but he was neutral.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis was a warning that if I intended to make him abandon that stance, he would show me no mercy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...I have no such intention.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy resolve vanished in an instant, and I stopped. I had no other choice.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFailing to gain his cooperation was one thing, but making an enemy of him was pointless under any circumstances.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe was, for better or for worse, a troublemaker. If he felt like it, he probably wouldn\u0026apos;t think twice about letting the class fall apart.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Good. Well then, I shall be taking my leave.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI felt a gnawing frustration, but ultimately, I was still powerless to stop Koenji-kun from walking away.\u003c/p\u003e\u003ch2 class=\"heading_2\"\u003ePart 2\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWITH THE CLASS discussion at a standstill, I left things to Hirata-kun and the others, and hurried to the Student Council room to attend my duties.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI\u0026apos;d hoped to settle on a direction, at the very least, but that wish wasn\u0026apos;t granted.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTruthfully, I wanted to discuss it until we were all satisfied...but it couldn\u0026apos;t be helped. Having accepted the role of student council president, I had to tackle those responsibilities with the same diligence as the special exam.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I arrived in front of the Student Council room, Nanase-san was already there and bowed her head.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Good work, Student Council President Horikita.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re quite early.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile exchanging pleasantries, we entered the still-empty Student Council room together. Then, as I took my seat at the president\u0026apos;s desk, Nanase-san stood beside me and showed me two printed sheets of paper.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I just received these materials from Mr. Houjou, the homeroom teacher for Class 1-A.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEach paper contained information on a single student.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOne was Kusanagi Minato-kun from Class 1-A. The other was Maki Yuuma-kun from Class 1-D.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And here is an overview of the incident.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter looking over their profiles, she handed me another sheet of paper.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t particularly complicated, and a quick glance was all I needed to grasp the contents.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;These two got into a big fight, is that it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe date was last Friday, and the location was behind the first-year dormitories.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMaki-kun from Class D called out Kusanagi-kun from Class A, and after a verbal dispute, it escalated into a fight.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBoth struck each other multiple times, including blows to the face. Maki-kun\u0026apos;s injuries would take about three weeks to heal, Kusanagi-kun\u0026apos;s about one. The fight came to light when a third party discovered them as they were returning from behind the dorms. Fortunately, they\u0026apos;ve been able to attend school since Monday\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If it was behind the dorms, then there\u0026apos;s no footage of them fighting, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s right. It was in a blind spot for the security cameras. It seems a third party who was also returning to the dorms discovered the two injured students as they were about to head back.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhere the cameras are, and where they aren\u0026apos;t.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seems even the first-years, who haven\u0026apos;t been here long, are getting a grasp of such things.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It seems we should ask the school to install more security cameras.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I agree. I did try to briefly ask Houjou-sensei\u0026#xa0;about it, but he told me to hear the details from the students and didn\u0026apos;t elaborate.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;To maintain fairness, I suppose. That\u0026apos;s likely the reason they\u0026apos;ve tossed the judgment of this case over to us in the student council.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNanase-san, who nodded firmly, seemed to have something on her mind, and began to speak.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Actually, last year, I was also called to the student council for a similar incident.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You, Nanase-san? Were you assaulted by someone?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, that\u0026apos;s not it. It was a problem caused by a classmate\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter a slight, wry smile, Nanase-san explained the details.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBefore last summer, when Housen Kazuomi-kun of Class D and Utomiya Riku-kun of Class C passed each other in the hallway, a trivial matter led to an argument, and a tense standoff ensued where they glared at each other from point-blank range. Just when it seemed a fight could break out at any moment, students from their respective classes who were nearby started to argue, and a Class C student, having reached their limit, struck a Class D student. Then, riding that momentum, they charged at Housen-kun and tried to punch him, only to be spectacularly countered.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Just as Utomiya-kun was about to throw a punch, the teachers happened to pass by and the commotion was somehow settled, but afterward, the problem was brought before the student council.\u0026quot;\u003c/p\u003e\u003cp class=\"pa
