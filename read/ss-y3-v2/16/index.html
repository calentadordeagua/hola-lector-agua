y pressure from the classes below. If we suffer two or three consecutive losses, we\u0026apos;ll inevitably be neck-and-neck with them. And if that happens, many of our classmates will see it not as being on equal footing, but as falling into a disadvantage.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The outcome of that special exam is our class\u0026apos;s final line of defense, isn\u0026apos;t it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was still only May. Assuming the next major special exam would be held in either June or July, the worst-case scenario might await them before they even reached the halfway point of the year.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If there is any silver lining, I suppose it\u0026apos;s that we can assume the probability of an academics-centered special exam is not very high. While studying is an inseparable part of being a student, if we\u0026apos;re constantly forced to compete in that area, our class has no chance of victory from the outset. I\u0026apos;m sure the school wouldn\u0026apos;t be so consistently unfair.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt the time of class assignments upon enrollment, many honor students were placed in Class A.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile one could accept that as a large head start, if that alone were to decide everything, there would\u0026apos;ve been no need to make them compete from the very beginning, as it would\u0026apos;ve been entirely superfluous.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If the rewards are worth it, we should use anything at our disposal, including the Private Points we saved last time. I don\u0026apos;t want to recommend it, but that includes acts that border on breaking the rules.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So you\u0026apos;re finally starting to get it, Katsuragi. But I have no intention of fighting within the rules. Fouls, whatever, I\u0026apos;ll use any means necessary to win.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I understand. But I will stop you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKatsuragi didn\u0026apos;t change his stance of strictly adhering to the rules.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey continued their fruitless discussion, and a silence fell between them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a disconnected moment, especially as other students were getting rowdy in the next room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ryuuen-kun... you\u0026apos;re not trying to force me to talk about Ayanokouji-kun, it seems...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s just that I don\u0026apos;t think I\u0026apos;d get any useful information out of you anyway.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Is that really the only reason?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? What do you want me to say? Do you want me to order you to \u0026apos;find his weakness by any means necessary\u0026apos;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2014;That\u0026apos;s...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen already had the answer to that question.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat Shiina felt for Ayanokouji went beyond mere friendship.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll make damn sure you\u0026apos;re useful. Not for Ayanokouji, but for this class.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if it meant exploiting those feelings, Ryuuen envisioned a future where he defeated Ayanokouji.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. That resolve\u0026#x2014;I intend to form it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEver since the transfer, she hadn\u0026apos;t been able to have a proper conversation with Ayanokouji.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBecause of that, Shiina was trying to come to a certain resolution.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo Ayanokouji, she was just a friend, or perhaps even less than a friend.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf that were the case, even her faint feelings would become heavy shackles.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKaneda quietly continued to watch Shiina, whose sorrowful profile looked as if she might vanish.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was the first such experience for a man who\u0026apos;d lived his life devoid of any fighting spirit.\u003c/p\u003e\u003ch1 class=\"heading_1\"\u003e\u003ca class=\"heading-link\" href=\"/read/ss-y3-v2/2\"\u003eChapter 6:\u003cbr/\u003eFortune and Misfortune Are Intertwined\u003c/a\u003e\u003c/h1\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTHE DAY STEADILY drew to a close and before I knew it, school was over. It was almost the end of the fifth day since the exam was announced, but not a single major change had occurred. As far as my brief investigation showed, every class maintained a perfect record of no tardiness or absences and the student body was leading a quiet, more serious school life than usual. I also heard no rumors of any trouble over the weekend, a time when things tended to get lax. It seemed the students hadn\u0026apos;t forgotten to maintain a sense of tension.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs was evident from their diligence in their studies and sports, their avoidance of tardiness and absences, and their strict adherence to order and politeness, all four classes were acting with the consideration that their daily conduct would be key to the exam. It seemed Ryuuen\u0026apos;s class hadn\u0026apos;t been able to grasp that on the first day, but Kondou and the others\u0026apos; actions, while probing, had clearly taken daily conduct into account from the very beginning. I didn\u0026apos;t know which student in Ryuuen\u0026apos;s class proposed the idea, but in that class, the leader\u0026apos;s decision was everything.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe fact that he adopted it meant that, at the very least, Ryuuen himself came to the same conclusion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eThwip, thwip-thwip!\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as I was about to get up from my seat, a sharp pain shot through the back of my neck again and again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ow, ow, that hurts. What the...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTurning around in response to the unfamiliar sensation, I saw Morishita holding what looked like... a gun, made from disposable chopsticks.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;To think you\u0026apos;re still alive. You\u0026apos;re quite something.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Never mind \u0026apos;quite something\u0026apos;... What is that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It is a gun. A gun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eThwip!\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile I was turned around, she fired a rubber band into the palm of my hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe gun was formed from multiple layers of rubber bands wrapped around disposable chopsticks and it seemed to be designed so that pulling the part that resembled a trigger would launch a rubber band.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That hurts, you know?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s because I\u0026apos;m shooting you with the intent to cause pain.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why\u0026apos;d I have to be the one in pain...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eStill, it was well made... It wasn\u0026apos;t just haphazardly assembled into the shape of a gun; it was designed to shoot rubber bands.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;When\u0026apos;d you make something like that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s a secret weapon I diligently crafted during break time. It\u0026apos;s a wonderfully lethal weapon, capable of slipping past even the metal detector gates.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI decided to consider it a small mercy that she hadn\u0026apos;t been working on it during class.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Let\u0026apos;s take a drive to the ends of hell together. \u003cem\u003eBang.\u003c/em\u003e\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I absolutely don\u0026apos;t want to do that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs we were having this pointless exchange, Satonaka\u0026#xa0;approached us hesitantly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Do you have a moment?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah. What\u0026apos;s up?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile surprised to be addressed by someone so unexpected, part of me thought it would be funny if Morishita shot Satonaka with a rubber band.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I glanced over at Morishita, at some point she\u0026apos;d put the gun on her desk and was staring out the window, looking bored. Apparently, I was the only one she wanted to take a drive with to the ends of hell.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I was wondering if you\u0026apos;d like to hang out with our group this Sunday.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs he said that, Satonaka looked back and a group of a few boys and girls waved in our direction.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere were three of them in total: Yanagibashi and Tsukasaki, with whom I\u0026apos;d had almost no interaction, and a girl named Hoashi.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I won\u0026apos;t force you, but what do you think?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t have any particular plans, so if you guys don\u0026apos;t mind, I\u0026apos;d like to join.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I answered, Satonaka smiled happily. I wondered if the reason I felt inexplicably happy just seeing that was because of his handsome features, which even a guy could admire.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you\u0026apos;d like, how about you, Morishita-san?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll pass.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWithout so much as a glance at Satonaka, she gave her blunt refusal while continuing to stare out the window.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter that, Satonaka said he\u0026apos;d message me the details later and went back to his group.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why\u0026apos;d you refuse?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;For no reason other than I\u0026apos;m simply not interested.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt some point, she shifted her gaze from the window back to me and was now unabashedly gripping the gun in her right hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t tell me, Morishita, you have feelings for Satonaka\u0026#x2014;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eThwip!\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA rubber band shot mercilessly into my left cheek.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Too bad for you, Ayanokouji Kiyotaka. Did you think you would get to see me blush and become flustered?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The thought crossed my mind, but it seems I was wrong... Besides, that hurt, and it\u0026apos;s dangerous.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m simply not interested in him. Besides, faces that are too androgynous\u0026#xa0;are not to my liking. A face as hideously distorted as yours, Ayanokouji Kiyotaka, is better\u0026#x2014;at least it warrants pity. Are you happy to know that I\u0026apos;m fond of you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s no doubt that sadness far outweighs happiness. Sorry, but I\u0026apos;m heading home.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI hurried out into the hallway, escaping from Morishita, who kept firing rubber bands at me and asking if I was running away.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI took out my phone and checked the message from Ichinose one more time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e[\u0026apos;It looks like Hoshinomiya-sensei wants to see you, Ayanokouji-kun...\u0026apos;]\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter receiving that message, I headed for the special building she\u0026apos;d designated.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt the time, just after school let out, that special building was always quiet.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTwo years ago, there\u0026apos;d been an incident in that very place where Sudou fell into Ryuuen\u0026apos;s trap in a security camera blind spot, but since then, more cameras were installed there.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith the exception of spaces where privacy was a consideration, such as the changing rooms and restrooms, it could be said that most of the school was now covered by them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile a small number of students felt suffocated by the extensive surveillance, the majority likely welcomed it as a means of protecting themselves.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI arrived at the promised location, but Hoshinomiya-sensei was still nowhere in sight.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSo, I decided to kill some time by gazing out the window.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eConsidering I had to go see Hiyori, I didn\u0026apos;t want to linger for too long today. The figures of students heading home or off to their club activities began to trickle into view.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2014;Club activities, huh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the end, I never joined one, but my mindset changed enough that I thought if I could start over as a first-year, it might be good to try joining one.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEnough that if someone were to ask if I was satisfied with my student life, I could give a hesitant nod.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI averted my gaze from the window and looked down the hall.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNot long after, I heard the sound of high-pitched footsteps echoing all around.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs she came into view, our eyes met, and she approached with a light wave of her hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sorry for the wait, Ayanokouji-kun. Did you need something from me, calling me out to a place like this?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re the one who called me here, aren\u0026apos;t you, Sensei?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Whaaat are you talking about~? A teacher would never call a student out to a place like this, you know. I only came because Ichinose-san told me \u003cem\u003eyou \u003c/em\u003ewanted to see \u003cem\u003eme\u003c/em\u003e, Ayanokouji-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was in the exact same situation, but I figured it wasn\u0026apos;t even worth asking her about it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHoshinomiya-sensei\u0026apos;s eyes were clearly smiling.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I was trying to figure out her true intentions, she closed the distance even further, pressing herself against my body.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What do you think you\u0026apos;re doing?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What am I doing? Whatever do you mean~?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe played dumb, refusing to answer my question and instead brought herself closer as if to whisper.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd then, without so much as asking for my permission, she entwined her slender arm with mine.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I need you to do your best this year, Ayanokouji-kun, so it\u0026apos;s fine if I give you a little bit of service, right? Just like this.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo call such a blatant act \u0026apos;service\u0026apos; was just like her, but for a teacher, it could only be called unbecoming conduct.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat said, I had no intention of lecturing her about it here, nor did I intend to forcibly shake off her slender arm. Either way, the important thing was not to take any action myself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You leave no openings, do you, Hoshinomiya-sensei.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI stopped her objective, not with action, but with conversation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Eh? What\u0026apos;s that supposed to mean, \u0026apos;leave no openings\u0026apos;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I already had my predictions about the upcoming special exam, but your advances just now have confirmed them. What the school will judge over the course of one week is our \u0026apos;attitude in our daily school life.\u0026apos; The number of tardies and absences, our general conduct. The factors that usually only cause minor monthly fluctuations will be the main evaluation criteria. The school hallways are lined with countless security cameras, so they can easily assess the students by checking the recordings later. If they see me in close contact with a teacher of the opposite sex, it will inevitably affect my assessment.\u0026quot;\u003c/p\u003e\u003cimg src=\"/hola-lector-agua/images/books/ss-y3-v2/OEBPS/KGZwaOHTXhjgYMWagqXwo.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA little while ago, Hoshinomiya-sensei had been on the verge of running wild, determined to win even if it meant using her authority as a teacher to ensure her class\u0026apos;s victory. To prevent that, I told her the details of my alliance with Ichinose and the arrangements that came with it, so she was now somewhat under control. However, what she truly desired was to return to the upper classes as soon as possible and to see Chabashira-sensei\u0026apos;s class fall.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ayanokouji-kun, you\u0026apos;re being a little too suspicious. We\u0026apos;re in this together, aren\u0026apos;t we? So there\u0026apos;s no way I\u0026apos;d do anything to drag you down, right? Besides, we don\u0026apos;t even know if you\u0026apos;re right about the exam.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course, I don\u0026apos;t have any concrete proof. It\u0026apos;s just a feeling I have. But please, rest assured. Even if you were to intentionally act in a way that lowers my evaluation, Hoshinomiya-sensei, it won\u0026apos;t affect our alliance.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I continued to speak in a calm, business-like tone, Hoshinomiya-sensei\u0026apos;s smile deepened, perhaps because she understood.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh, that\u0026apos;s a relief. Well then, does this mean you\u0026apos;ll let my class have the win this time? You\u0026apos;ll let the class with fewer Class Points have the glory, won\u0026apos;t you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That would be the case if I could completely control the outcome. However, this is a competition between all four classes. If our class receives a negative assessment, we risk placing last. And there\u0026apos;s no guarantee that Ichinose\u0026apos;s class will be able to take first place.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But come on, that\u0026apos;s where you get to show off your skills, isn\u0026apos;t it, Ayanokouji-kun? You just have to arrange things so my class takes first and your class takes second.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Unfortunately, I have no intention of intervening to make adjustments.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...But why? Are you just going to ignore the risk of Class A and Class B winning?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Frankly, for this particular exam, I don\u0026apos;t believe that will be an issue.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even if we get them, it\u0026apos;s a mere fifty Class Points. Are you saying they\u0026apos;re not even worth bothering with? That\u0026apos;s\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s incorrect. It\u0026apos;s because I\u0026apos;ve judged that this isn\u0026apos;t an exam that warrants demonstrating the true value of our alliance. To begin with, isn\u0026apos;t it also necessary to believe in your own class?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor the past two years, the school saw Ichinose\u0026apos;s class as being just as disciplined as Sakayanagi\u0026apos;s, if not more so. However, unable to endure their current circumstances of having fallen to Class D, Hoshinomiya-sensei was always trying to forcibly change the situation by using every trick in the book.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, it would\u0026apos;ve been understandable if she were acting out of sheer desperation, but in a case like this, her actions could\u0026apos;ve ended up nullifying her class\u0026apos;s greatest strength.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Remember to watch over them. That\u0026apos;s something even Chabashira-sensei is capable of.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hk...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI finally brought up the name of her contemporary rival, Chabashira-sensei.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe moment I did, Hoshinomiya-sensei\u0026apos;s demeanor changed in an instant.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHoshinomiya-sensei stopped, and her arm slipped smoothly away from me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I can trust you, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe meaning behind those words was simple. It included the threat that if betrayed, she would go on a rampage at any time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Please consider our alliance from a long-term perspective, not a short-term one. That\u0026apos;s all I can say for now.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see. Well, you certainly did come through for me during the last special exam, so I suppose I\u0026apos;ll just wait and see for now.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a good thing that Hoshinomiya-sensei was wary and hadn\u0026apos;t let her guard down.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut in truth, it was also a fact that we didn\u0026apos;t need to force a win in this exam. If our daily conduct was indeed being assessed, intervening carelessly to control it would be a troublesome and high-risk endeavor. For my class and Ichinose\u0026apos;s, which had very few behavioral issues to begin with, employing unnecessary measures would only increase the danger. The best strategy was to let them act as they usually did.\u003c/p\u003e\u003ch2 class=\"heading_2\"\u003ePart 1\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eONLY ABOUT THIRTY minutes had passed since school let out. I arrived at the library at a relatively early hour.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter many twists and turns, the time had finally come.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe start of a new special exam during Golden Week, repeated after-school invitations, and chance encounters. A considerable amount of time had passed since Ishizaki told me to meet with Hiyori.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I stepped into the library, its distinctive scent gently drifted into my nostrils.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wondered if Hiyori was there.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe library at ANHS was so vast that finding a person could be just as difficult as finding a book.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I happened to glance at the librarian at the entrance, she gave me a warm smile and then pointed a finger without a word.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat direction was the area where the mystery novels were shelved.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eApparently, the person I was looking for was there.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I slowly approached the spot, which was still some distance away, Hiyori appeared from behind a bookshelf.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBefore long, in the sparsely populated library, our eyes met.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut in the next instant, she averted her gaze and disappeared deeper into the shelves.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI thought our eyes met, but could it be that she hadn\u0026apos;t noticed me?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eCalling out from a distance would be a breach of etiquette, so I headed for the bookshelves.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe was no longer where I\u0026apos;d last seen her, so I began checking the aisles between the shelves.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOne, two, three...\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhere was she? I couldn\u0026apos;t imagine she had gone that far\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as I was thinking that, I finally found Hiyori at the end of the aisle, on the opposite side of the bookshelf where I stood.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd our eyes definitely met.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOr so I thought, but she immediately broke her gaze and vanished into another aisle.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe definitely noticed me. If so, does that mean she\u0026apos;s avoiding me?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWas it because I was late in coming to see her? Because I didn\u0026apos;t transfer to Ryuuen\u0026apos;s class?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I speculated on the reason, I closed the distance to talk to her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf she continued to run away from me inside the library, then I would have no choice but to give up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI couldn\u0026apos;t bring myself to forcibly corner someone who was clearly reluctant.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHoping that wouldn\u0026apos;t be the case, I walked toward the spot where I\u0026apos;d last seen Hiyori.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhere did she go from there...?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as I was thinking that, Hiyori, perhaps wanting to see where I\u0026apos;d gone, peeked out from behind a nearby bookshelf.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe distance was less than two meters. Close enough that if I stepped forward and reached out my arm, I could easily touch her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hiyo\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI tried to call her name, but she hid her face again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut she didn\u0026apos;t run away again; it seemed she\u0026apos;d only hidden her face.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs proof, her hand rested on the bookshelf and a part of her uniform was visible.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Was I bothering you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I spoke in a quiet tone, her face slowly emerged after a brief silence.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Did you come here to look for a book to read...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt least she replied. For now, I was relieved about that.\u003c/p\u003e\u003cimg src=\"/hola-lector-agua/images/books/ss-y3-v2/OEBPS/LlMgAFLkskDfsqQkPbLJr.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, I came to see you today, Hiyori.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe meaning of my words must have gotten through, but Hiyori still wouldn\u0026apos;t come out from behind the bookshelf, keeping half her body hidden. I was reminded of the words of Ishizaki from the other day.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026apos;Make sure you see Shiina soon. She was pretty down, even if not as much as I was.\u0026apos;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd then there was the somewhat awkward atmosphere from when we were in the elevator together a few days ago.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhy hadn\u0026apos;t I come to see her sooner?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI now regretted that I\u0026apos;d been running away from the guilt I felt over transferring classes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you still bothered by the fact that I rejected your class\u0026apos;s invitation and transferred to Class C?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI decided that we would not be able to have a satisfactory conversation without first eliminating any unnecessary distance between us, so I posed the question. Hiyori, who immediately showed her agitation, averted her eyes, which had been trying to meet mine and pressed her lips tightly together.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I suppose I can\u0026apos;t say... that I haven\u0026apos;t been concerned. I kept imagining that maybe my invitation was the reason you were keeping your distance, Ayanokouji-kun...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s quite unlike you. You of all people should know that\u0026apos;s not possible.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf anything, the Hiyori in my mind was always unhurried and did things at her own pace.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI saw her as a person who could look at matters calmly, with a discerning eye, without ever growing flustered.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI assumed she understood, without me needing to say a word, that my transfer from Class A to Class C had a purpose that could only be attained by joining that class.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was no way she\u0026apos;d distance herself just because her invitation was rejected.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, it was an undeniable fact that I\u0026apos;d delayed coming to see her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I apologize again for not being able to accept the transfer to Class B. And for taking so long to properly talk about it. That caused the misunderstanding.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the silence of the library, Hiyori took in my words, then shook her head.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No... You\u0026apos;ve done nothing wrong, Ayanokouji-kun. The class transfer... how should I put it... was just me getting my hopes up on my own... And even though I thought there might be a reason on my part for why you weren\u0026apos;t visiting, I couldn\u0026apos;t bring myself to come see you. Please allow me to apologize for that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter she said that, the rest of her body, which had been hidden, slowly came into view.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen she bowed her head, as deeply as she possibly could.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd yet, Hiyori didn\u0026apos;t have a single thing to apologize for.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat being said, continuing this apology contest wouldn\u0026apos;t lead to anything productive.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I thought I was prepared...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Prepared?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We\u0026apos;re in different classes now, Ayanokouji-kun. I thought that our relationship, where we could chat so familiarly, had to come to an end... But talking with you like this... I suppose...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSo she\u0026apos;d been trying to sever our friendly relationship and resolve herself to see me as an enemy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRealizing that, I felt a sense of relief that I made it in time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you don\u0026apos;t mind, Hiyori, why don\u0026apos;t we talk about this past month we\u0026apos;ve been apart? We have plenty of time today.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is it... really okay?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course. I came here today because I wanted to see you and talk with you, Hiyori.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I told her my honest feelings, a smile appeared on Hiyori\u0026apos;s face for the first time that day.\u003c/p\u003e\u003ch2 class=\"heading_2\"\u003ePart 2\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWE SAT FACING each other in the empty seats of the library.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen, as if to fill the one-month blank, we began to string together words little by little. At first, Hiyori, who had a somewhat distant atmosphere, gradually returned to her usual smooth and gentle tone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So, even after becoming a third-year student, the bookworm remains unchanged.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. In fact, I just finished reading another one last night.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe looked once at the bookshelf lined with mystery novels and replied that she\u0026apos;d just returned it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah, actually, I\u0026apos;ve made one more friend who\u0026apos;s a fellow reader.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHiyori clasped her own hands together and her eyes narrowed with joy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ever since I became a third-year, Kaneda-kun has been visiting me often at this time.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Kaneda? Well, I can picture him reading a book, so I\u0026apos;m not particularly surprised...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eStill, until the end of the second year, I\u0026apos;d never once seen Kaneda in the library.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf he was considering going to university, the library was also an excellent environment for studying.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah, speak of the devil.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHiyori, whose back was to the library entrance, noticed Kaneda\u0026apos;s arrival before I did and waved.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI also turned around and raised my hand in response to Kaneda, who was looking this way.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKaneda showed a slightly surprised face but immediately started walking and came to our table.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Hello, Shiina-shi. I\u0026apos;ve come again today.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy guess was correct; along with the library books, he also had academic books in his hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Kaneda-kun, you really do love books, don\u0026apos;t you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was clear from Hiyori\u0026apos;s words that he was a frequent visitor. When I gestured with my eyes for him to sit in the seat next to me, he gave a slight nod and sat down.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes, well. I\u0026apos;ve heard that you, Ayanokouji-shi, also used to frequent the library. It seems you haven\u0026apos;t shown your face recently, though.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor the past month. It was precisely when Kaneda started coming to the library that I\u0026apos;d been unable to come.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It seems like we\u0026apos;ve been swapping places. I think we\u0026apos;ll have more chances to meet from now on.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...I see. As a fellow reader, that\u0026apos;s nothing but delightful.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe showed a welcoming stance, but his expression showed no joy. It was no surprise, since my presence had no direct bearing on him. The only one who would be truly happy about gaining another reading companion would probably be Hiyori right in front of me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Be that as it may, you seem to have been busy. The matter of your transfer from Class A to Class C surprised me a little\u0026#x2014;no, quite a bit\u0026#x2014;hmm?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA sudden shadow fell over us, its source being the librarian.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m sorry to interrupt your conversation. Shiina-san, this is sudden, but could you lend me a hand? I don\u0026apos;t think it will take long\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If I\u0026apos;m the one you need, of course I\u0026apos;ll help. You two, if you don\u0026apos;t mind, please wait just a little. I\u0026apos;ll recommend some books to you later.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eLeaving us with those words, Hiyori left her seat with the librarian.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNow, just the two of us, Kaneda and I, who were not particularly close, were left behind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was often the case that the atmosphere became a little awkward when a mutual acquaintance left. I learned such things through my school life.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI suppose I would try to take the lead in the conversation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What kind of books do you usually read, Kaneda?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m not very good at such meaningless small talk.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA clean rejection. It\u0026apos;s like I threw him the conversational ball, and he just chucked it out into left field. I thought I started a natural topic since he liked books, but it seemed to be a question Kaneda disliked. Or perhaps my throw was clumsy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;My bad. I apologize if my wording offended you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWas it an unbefitting overestimation to think that I could hold my own in a situation like this?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...No, my apologies as well. There\u0026apos;s no need to be so down about it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I was just trying to connect the conversation smoothly. Really.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I got that sense, somehow.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you don\u0026apos;t want to talk to me, you don\u0026apos;t have to force yourself.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...This is rather unsettling. It\u0026apos;s not that I dislike it, but I don\u0026apos;t often have the opportunity to talk with you face-to-face like this, Ayanokouji-shi, so I couldn\u0026apos;t help but think about various things. Until Shiina-shi comes back, shall we talk for a bit, if you\u0026apos;d like?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was a little happy to see Kaneda showing a positive attitude toward conversing with me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If there\u0026apos;s anything on your mind, you can ask me. Of course, I can\u0026apos;t give unlimited answers regarding class problems.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI thought Kaneda would understand that, but I told him just in case.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKaneda took off his glasses, breathed on the lenses, and wiped both of them with a cleaning cloth he took from his pocket. Then he slowly put his glasses back on.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;With Shiina-shi\u0026#x2014;you seem to be on good terms.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hm? Oh, it\u0026apos;s because she\u0026apos;s a fellow bookworm, like you, Kaneda. I have her keep me company.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;A fellow bookworm, you say? That may certainly be true, but the expression I saw on Shiina-shi\u0026apos;s face from a distance just now was one I haven\u0026apos;t been able to see this past month. When I saw you two from the entrance, I was frankly surprised. It was the first time in a long while I\u0026apos;d seen her genuine smile.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That might have been my fault. I just apologized to Hiyori and she forgave me. So from now on, I imagine you\u0026apos;ll be able to see her smiling in class and in the library, just as she did before.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI kept to myself the part about her inviting me to transfer classes. It wouldn\u0026apos;t have been pleasant to tell Kaneda, who was not only from a rival class, but also close to Ryuuen and I had no idea how that information would be interpreted.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Do you realize just how amazing that is?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Amazing?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You don\u0026apos;t understand? No... are you pretending that you don\u0026apos;t? Ayanokouji-shi, have you ever felt like you\u0026apos;re blessed?\u0026quot; he asked me as if to test me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Blessed? That\u0026apos;s far too broad a definition for me to answer.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;My apologies. It seems my words were insufficient. Even from my perspective as a man, your features are quite excellent, Ayanokouji-shi. You\u0026apos;re also taller than average and well-built, yet you don\u0026apos;t give off a needlessly intimidating air. More than anything, you have an impeccably clean-cut appearance. And on top of that, it seems you were dating Karuizawa-shi until recently and lately, I\u0026apos;ve even been hearing rumors about you and Ichinose-shi. The more other men learn about you, the more they will look at you with admiration and, at the same time, feel a fierce jealousy at the immense gap between you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy interest was piqued by Kaneda\u0026apos;s unexpected words and I listened intently.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not just your appearance. In terms of academics, you\u0026apos;re increasingly being called the number one student in our year by those with high academic ability. I was once proud to think that my own academic ability was not inferior to yours, Ayanokouji-shi, but I\u0026apos;m now ashamed of that and couldn\u0026apos;t help but laugh at myself. Furthermore, concerning your physical abilities, it seems you\u0026apos;ve been achieving excellent results in PE since April. As for me, someone who is poor at sports, I could stand on my head and still not come close to your potential\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSo this was Kaneda Satoru, a student who could speak so eloquently and passionately.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe praised me while simultaneously disparaging himself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen looking at student values across the entire year, Kaneda was in the top thirty percent. I saw no reason for him to needlessly belittle himself, but...\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile forcefully heaping praise upon me, Kaneda continued.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And now, you\u0026apos;ve unleashed the true abilities you\u0026apos;d hidden for two years and have even taken up the position of leader to rebuild Class C now that Sakayanagi-shi left. Even that somewhat dangerous mind of yours must surely captivate many. You\u0026apos;re the very picture of a hero, are you not? I envy you from the bottom of my heart.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Envy me? I\u0026apos;m a traitor who abandoned Class A and objectively speaking, not using the power I possessed and hiding my true abilities would more likely be judged as villainous.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That just makes you an anti-hero, which is still a hero.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith a hint of a dry, exasperated laugh, Kaneda glanced behind him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy eyes followed his and I saw Hiyori, who seemed to be working on a computer with the librarian. It looked like it would be a while longer before she returned.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOne thing I could tell for certain from Kaneda\u0026apos;s attitude and words, was that he held feelings for me that were stronger than I\u0026apos;d imagined. I was aware that transferring classes would lead to various opinions being directed at me, but his ranked high among them. At first, I thought his comments were out of consideration for his class leader, Ryuuen, but it didn\u0026apos;t seem to be only that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd one thing was for certain: Kaneda didn\u0026apos;t like me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah... my apologies. It seems I\u0026apos;ve gotten carried away and talked too much.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed Kaneda realized how his words must have sounded to me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s nothing to apologize for. People are free to think what they want of others.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even that part of you is so cool it\u0026apos;s infuriating, Ayanokouji-shi. Even if you\u0026apos;re prepared to be hated, I\u0026apos;m sure it doesn\u0026apos;t feel good to actually be hated by someone. Or is it simply because it\u0026apos;s me, you don\u0026apos;t care what I think of you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s not it. I would say the same thing in the same way to anyone.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI\u0026apos;d proceeded this far on the assumption that I would be hated.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2014;Then, what if that person were Shiina-shi...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd then, Kaneda brought up Hiyori\u0026apos;s name.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe was, indeed, one of the most appropriate students to use as an example in that situation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI intended to reply immediately just as before, but the words caught in the back of my throat.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t mind if Hiyori hated me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYes, in essence, that was true.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI knew that was a possibility after I rejected Hiyori\u0026apos;s invitation and transferred to Class C.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe reason I hadn\u0026apos;t gone to apologize right away was because I needed to prioritize other matters.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat she thought was a secondary, or even tertiary, concern that I placed low on my list of priorities.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Please, forget I asked. That was an indelicate question.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWithout waiting for my reply, Kaneda quietly pulled back his chair and stood up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I think I will be leaving for today.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you sure? Hiyori looked like she wanted you to wait.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s quite all right. It makes no difference whether someone like me is here or not right now. I apologize for the one-sided conversation.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, don\u0026apos;t worry about it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is that so? Then I am grateful for your magnanimity.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eLeaving behind an air of resolution, Kaneda departed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA short while later, Hiyori returned, looking around curiously.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh? Are you all alone, Ayanokouji-kun?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eApparently, he hadn\u0026apos;t called out to Hiyori, who was near the entrance, before he left.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah. He left, apparently on urgent business. He asked me to tell you he\u0026apos;ll be back again soon.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is that so? That\u0026apos;s something to look forward to.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSeeing her gentle smile, it seemed she was genuinely looking forward to his next visit.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI arbitrarily assumed that Hiyori spent the past month all alone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut in reality, she\u0026apos;d been gradually expanding her circle of friends and found time to spend with Kaneda in the library.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I thought about it, there was nothing strange about it at all.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as I\u0026apos;d changed classes and friends, the number of people I interacted with slightly increased, Hiyori, too, changed since we first met.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe\u0026apos;d met someone new somewhere and was growing closer to that person.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA mere classmate. A mere underclassman, an upperclassman.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom such relationships, they become friends and then best friends.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePeople much closer to her than I was would appear one after another in Hiyori\u0026apos;s future.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps someone else might be sitting in the empty seat next to her tomorrow\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eLooking at her as she lowered her gaze to her book, I was surprised by my own arbitrary thoughts.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWho was getting close to whom was nothing more than a piece of information.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSomething to be judged solely on whether or not it could be used in the future.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd yet, I was indulging in useless and arbitrary speculation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was trying to see an invisible someone next to Hiyori.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t know why I\u0026apos;d become unable to see her in the same way I saw other students.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSame sex, opposite sex. Friend, best friend.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI interacted with many students without being bound by things like gender or how close we were.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile there were varying degrees of compatibility, like whether our hobbies matched or if we seemed likely to get along, I basically never accepted or avoided someone for those reasons alone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, with this much noise interfering with my thoughts, I had no choice but to admit it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat Hiyori was perhaps a little different from the frameworks I\u0026apos;d used until then.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was different from willfully moving a category from right to left.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSomething that\u0026apos;d been on the right side until yesterday moved to the left before I knew it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust reading books and sharing the same space together filled me with a sense of fulfillment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf I were to describe it in a word, it was \u0026apos;happiness\u0026apos;.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat expression was probably the closest fit.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t as if the time we\u0026apos;d spent together was particularly long, nor had we exchanged many conversations in a short period.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut thinking back, I naturally felt a sense of familiarity with her from early on.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer name too\u0026#x2014;it wasn\u0026apos;t like I started calling her Hiyori because she asked me to.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn other words, it wasn\u0026apos;t a name I used with a purpose.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBefore I knew it, I\u0026apos;d been staring intently at Hiyori\u0026apos;s face as her gaze fell upon her book.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHiyori didn\u0026apos;t notice my gaze for a while, but in a brief moment, she looked my way and our eyes met as if it were the most natural thing in the world.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is something the matter?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eLooking at Hiyori\u0026apos;s face calmed my heart.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was no doubt that saying something like that would only make her uncomfortable.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAround just after 6:00 p.m., Hiyori and I left the library and then the school.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is it okay if I stop by the library again tomorrow?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course it is. Besides, you don\u0026apos;t need my permission, you know?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps finding my attempt to ask for confirmation amusing, she placed a hand to her mouth and chuckled softly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Maybe it\u0026apos;s because I kind of see the library as your home.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s... not entirely wrong, I suppose. I\u0026apos;m here every day unless I have other plans.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI felt like I would mistakenly assume she caught a cold if she wasn\u0026apos;t there. After thinking that, I recalled a time when Hiyori had stopped appearing in the library for a while. It was around when the news that Karuizawa and I were dating spread around school. While it was true we were merely reading companions, Hiyori had been considerate by doing things like changing the times she visited.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt the end of Hiyori\u0026apos;s gaze, I found a small pull cart, wheels rattling, slowly making its way toward the main gate.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMany colorful flowers were lined up on its bed, beautiful even from a distance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs the two of us stood there watching it pass by, the middle-aged woman pulling the cart noticed us and stopped right in front of us.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I got special permission to sell here today. Would you like to take a look?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is it alright?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter being spoken to so kindly, Hiyori happily narrowed her eyes and approached the cart\u0026apos;s bed. I also stood beside Hiyori and looked down at the flowers.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKeyaki Mall didn\u0026apos;t have a flower shop. If you wanted to give flowers for a birthday or the like, you had to get artificial flowers from the general store or order them online. So, it was refreshing to see them being sold like this. From cut flowers like baby\u0026apos;s breath to potted hydrangeas. A small number of other assorted plants were also there.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;They\u0026apos;re beautiful...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHiyori said to the flowers beside me, looking hesitant, as if deciding which one to buy. After waiting a little while, she reached out her hand as though she\u0026apos;d found the one she wanted.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;May I have this one, please?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat Hiyori pointed to as she spoke was a single, carefully wrapped corn poppy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Just one?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. I thought it was lovely, precisely because it\u0026apos;s a single flower.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not about the number of flowers, young lady.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe clerk said so with a bright smile and explained that it was called a \u0026apos;single wrap.\u0026apos;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then I\u0026apos;ll take one of these.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI took out my phone and asked to pay for it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah, um, no, Ayanokouji-kun. I\u0026apos;ll buy it myself\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s fine. I want to give this to you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI told her that, and just as Hiyori looked up at me, I continued.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s an apology for making you wait a month. Though this might not be much of one.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust a single corn poppy. Price-wise, it didn\u0026apos;t even cost 400 points; it was a very cheap purchase.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s not true at all. I\u0026apos;m very happy.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter she bowed her head, it seemed to me that her face was slightly flushed when she looked up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe sky had been dyed by the sunset in an instant; perhaps that was the reason.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Then, I gratefully accept.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA voice of gratitude so quiet, one might have missed it if not close by.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter I paid, the clerk handed it to me instead of Hiyori, looking back and forth between us, and then said, \u0026quot;Thank you very much.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe just stood there and quietly watched the pull cart until it was out of sight.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter we were alone again, I handed the single corn poppy I was holding to Hiyori.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Thank you so much.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No need to thank me. It\u0026apos;s just for my own satisfaction, a selfish apology.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat\u0026apos;s how I answered, but the truth was a little different. I simply wanted to give Hiyori a present.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI genuinely want her to be happy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe corn poppy\u0026#x2014;a gift given from such an impulsive action.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eClutching that single small flower to her chest, Hiyori stared intently at me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe was certainly smiling with joy the moment our eyes met.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut as we continued to gaze at each other, her expression gradually began to change.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe showed an unexpected expression.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why are you crying?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps Hiyori, whose eyes were faintly glistening with tears, hadn\u0026apos;t noticed it herself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe hurriedly wiped at the corners of her eyes with her slender, white fingertips.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;For me, this was supposed to be just another ordinary day until I met you, Ayanokouji-kun. But it\u0026apos;s now become such a happy and fulfilling time... it feels like a dream, I can\u0026apos;t believe it...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer voice, which sounded as if it were squeezed from her very heart, continued.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m so happy... I\u0026apos;m so very happy. That we didn\u0026apos;t end up drifting apart, Ayanokouji-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eStrangely enough, I was in the exact same state of mind as Hiyori.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s much the same for me. This was supposed to end as just another ordinary day. But it\u0026apos;s turned into a very fulfilling one\u0026#x2014;it\u0026apos;s true.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf Hiyori\u0026apos;s words weren\u0026apos;t false, then it meant our feelings were mutual.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor some reason, this supposedly meaningless synchronization felt ticklish and it made me happy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBeneath the sunset-dyed sky.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI deeply burned the image of her into my mind\u0026#x2014;clutching the corn poppy, her eyes glistening.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSo that, from now on, I could remember it at any time\u0026#x2014;\u003c/p\u003e\u003ch2 class=\"heading_2\"\u003ePart 3\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWHEN I RETURNED to the dorm lobby, Hashimoto, who\u0026apos;d been sitting on a sofa, saw me and stood up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sorry, Shiina. I\u0026apos;m gonna borrow Ayanokouji.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThough he offered a light apology, Hashimoto gave her no room to refuse, but Hiyori showed no sign of displeasure and bowed cheerfully. Then she waved and got on the elevator first.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto watched her go with a broad grin, waving back.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We meet often. Were you waiting for me to come back?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah, something like that. Let\u0026apos;s take a walk.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe half-forcibly led me out of the lobby and we walked down a path off the school route.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re really tolerant of Shiina, or rather, you\u0026apos;re pretty close with her, aren\u0026apos;t you? You\u0026apos;re the one who gave her the flower, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why do you think that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was no one else around at the time, so there was no way Hashimoto could\u0026apos;ve seen me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s not a funny way to play dumb. There\u0026apos;s no way it\u0026apos;s nothing. Anyone could tell just by seeing how happy she looked holding that flower.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed Hashimoto felt that way after seeing Hiyori and I together.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re always going on about \u0026apos;Shiina, Shiina,\u0026apos; so there\u0026apos;s been something on my mind. I figured I had to confirm it today, no matter what.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter a short pause, Hashimoto looked me straight in the eye.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;d probably be hard for anyone else to ask, so as the designated bad guy, I\u0026apos;ll ask you straight up. Is Shiina someone especially close to you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHis expression clearly conveyed his seriousness.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is it a problem to have a specific person I\u0026apos;m close to?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, I wouldn\u0026apos;t go so far as to say it\u0026apos;s a problem. But I\u0026apos;m not exactly welcoming it, either.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\
