steeling myself for it. I was beginning to accept that it couldn\u0026apos;t be helped that similar feelings would be reawakened every time the conversation turned to Ayanokouji-kun.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t really get fighting and all that, but does that mean Ayanokouji-kun has something that makes him better than Yamada-kun, besides just muscle? \u0026apos;Cause, like, no matter how you look at it, Yamada-kun is way stronger.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, if you put it like that, I guess so, but...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIbuki-san trailed off and then looked at me. She was no doubt pawning off the tedious explanation onto me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In his case, it isn\u0026apos;t a matter of training or martial arts styles; he exists outside of such things.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe path to becoming strong was fundamentally the same for everyone. In a specific field, be it karate or judo, one had no choice but to accumulate training and hone their skills. I explained this to Kushida-san.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If we could only understand the foundation of his polished technique...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven for a genius with exceptional talent, it took many years to grow to the level of a master.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if I hadn\u0026apos;t seen as much as Ibuki-san, I had been shown a glimpse of his power when he confronted Housen-kun and during the training camp. It was precisely because I too had studied martial arts that my mind refused to comprehend it. I couldn\u0026apos;t believe it was something a high school student could achieve.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I wonder if he learned those skills after he came to this school, or maybe from before?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That guy was already a monster back in the winter of our first year. No way he got \u0026apos;em after he enrolled here. There\u0026apos;s no place to learn skills like that here, anyway. You\u0026apos;re an idiot, Kushida.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Listen, my brain isn\u0026apos;t made of muscle like you two, okay? It\u0026apos;s totally normal not to know about all that barbaric stuff. Get it? So, doesn\u0026apos;t that just mean he started taking lessons for that sort of thing before elementary school, or maybe around that time?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Martial arts are the same as academics, Kushida-san. Strength isn\u0026apos;t something one acquires simply based on the time invested. No matter how much you study, it\u0026apos;s difficult to come out on top of the pack, is it not? It isn\u0026apos;t as if one can become stronger than anyone else just by training.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI studied diligently through elementary and middle school in order to take first place.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn fact, in middle school, I was proud to say that I was, to put it modestly, in the top three of my grade.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut after enrolling at the ANHS, I was unceremoniously knocked from that perch. Even though I could maintain a high rank, taking first place was no longer easy. When I went to university, I would likely experience something similar. Excellent students from all over the country would gather, and my ranking would naturally drop. It was a cycle. A cruel reality that could not be overcome by effort alone awaited.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well then, doesn\u0026apos;t that mean there\u0026apos;s really only one answer? He\u0026apos;s the best at studying in this school, and he\u0026apos;s the strongest in this school, right? It\u0026apos;s just a simple case of Ayanokouji-kun having the natural talent of a genius, the kind that lets him be at the top.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYes. If one didn\u0026apos;t think too deeply about it, that was, in a sense, an answer in itself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA person with genuine talent, different from the handful of hard workers and honor students in our grade.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOne of the handful of talented individuals who could consistently take the top spot at Japan\u0026apos;s most prestigious high schools and universities.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWithout a doubt, Ayanokouji-kun was a person who held that qualification.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It may be blunt to say, but that might be the case. However, it still doesn\u0026apos;t feel real to me. I\u0026apos;ve seen many people more capable than myself, but even among them, Ayanokouji-kun feels... anomalous... as if he alone is clearly standing on a different plane.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026#x2014;Somehow, I felt as though I was arbitrarily evaluating him on a level close to deification.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor now, I decided to assume he was just such an exaggerated existence. If it turned out that upon getting to know him, he was merely an honor student in the top ten or twenty percent, then my peace of mind would be preserved.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter taking a breath, I recalled a recent event.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Wanting to know his roots, I actually went to the three-way conference hoping to meet his parents.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKushida-san, who up to this point seemed almost completely uninterested in our discussion of martial arts, opened her mouth eagerly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ayanokouji-kun\u0026apos;s? What were they like?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m curious about that, too. Did he look strong, like a gorilla?\u0026quot; As if she couldn\u0026apos;t wait to hear the rest, Ibuki-san leaned forward.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You might be disappointed to hear this. It was his father who came for the interview, and while he had a somewhat stern look, he was a calm, ordinary person. He also said he hadn\u0026apos;t done anything particularly special regarding his education.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No way, that\u0026apos;s gotta be a lie. It\u0026apos;s the only way to explain it, short of him being turned into a cyborg.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe said something outrageous while slurping her miso soup.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;He didn\u0026apos;t seem like he was lying, though.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But we\u0026apos;re talking about Ayanokouji-kun\u0026apos;s father, right? It\u0026apos;d be kinda weird to think he\u0026apos;d tell the whole truth.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Yes, that\u0026apos;s true.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt certainly wasn\u0026apos;t something that could be acquired through a normal education.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven with a considerably elite education, it still seemed a distant realm.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWas it simply a lie to avoid actions that would be considered bragging about his son?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Speaking of parents... I wonder if there are any students at this school from the same middle school as Ayanokouji-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I wonder about that. When I tried to get similar information out of him a few times before, he skillfully evaded my questions.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Usually, someone would tell you what school they went to, right? But the fact he won\u0026apos;t... maybe that means he really does have a little secret.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eComing from Kushida-san, who desperately wanted to keep her own middle school a secret, it was quite persuasive.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was certain that it wasn\u0026apos;t something one would hide unless there was an inconvenient reason.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So is Ayanokouji a beast at sports other than fighting, too? I mean, he was fast on his feet.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m not so sure; I don\u0026apos;t really know about that. Early on, I didn\u0026apos;t question it much, but considering he deliberately avoided high scores on the written exams, it\u0026apos;s quite plausible he was intentionally holding back in sports he excels at.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So even if we found out he was in a club in middle school, he might\u0026apos;ve been holding back then, too, huh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...That\u0026apos;s true. If he possessed outstanding talent in a particular sport, someone would\u0026apos;ve likely heard rumors, whether inside or outside the prefecture...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I just tried searching Ayanokouji-kun\u0026apos;s name, but nothing came up. I thought something would pop up since Ayanokouji is a rare last name, but I can\u0026apos;t find any trace of him setting records in elementary or middle school. The only other results are for celebrities or politicians who don\u0026apos;t seem related.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKushida-san explained this to us while scrolling on her phone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUntil he enrolled in high school, he wasn\u0026apos;t the kind of student who, for better or worse, would appear online.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat in itself was a clue, but we could hardly say we\u0026apos;d made any progress.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSomeone with a clue that connected to Ayanokouji-kun...\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That guy seemed like he knew something, didn\u0026apos;t he?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIbuki-san muttered quietly, as if recalling something.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt almost the same moment, I recalled the person she had called \u003cem\u003ethat guy \u003c/em\u003eas well.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What was his name again... uh, the one in the year below us...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yagami. Yagami Takuya-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah, yeah, Yagami. He was a pretty dangerous dude, went on a real rampage. Looked like he beat the crap outta Komiya and his friends on the deserted island, and wasn\u0026apos;t he screaming something about Ayanokouji?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs Ibuki-san and I reminisced about Yagami-kun, Kushida-san, who\u0026apos;d been listening quietly, tensed up at the mention of his name. Cornered in the student council room by Nagumo-senpai, Ryuuen-kun, and the teachers, Yagami-kun was expelled for instigating the assault on the deserted island.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, at the time, I had a fleeting thought that someone else might have been pulling the strings. A suspicion that Ayanokouji-kun had orchestrated the entire thing. But with no evidence, it was nothing more than a hunch. Now, however, that same suspicion was beginning to resurface.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Amasawa showed up at the end, too. And a bunch of weird adults stormed in.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s right... I believe they said they were mutual associates of Yagami-kun and Amasawa-san. My own memory has faded quite a bit, but I\u0026apos;m certain I heard that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYagami-kun and the others had been trying to get Ayanokouji-kun expelled.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed Ayanokouji-kun had summoned that very same Yagami-kun by setting a trap in a letter.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe connection between Yagami-kun and Amasawa-san was the only solid fact.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut any connection to Ayanokouji-kun remained unconfirmed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yagami, Amasawa, and Ayanokouji... maybe they were from the same middle school, or they\u0026apos;ve known each other for a long time? The possibility is definitely there, right? Why don\u0026apos;t you try searching for Yagami and Amasawa, too?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No luck, I\u0026apos;m afraid. I just tried.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed Kushida-san had already begun her search, as she turned her screen toward us to show the results.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt that moment, I remembered something I had forgotten until now.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Wait. Now that I think about it, Yagami-kun... he went to the same middle school as me\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? Seriously? Then doesn\u0026apos;t that mean he has nothing to do with Ayanokouji? How could you not remember something like that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It couldn\u0026apos;t be helped. I never knew him back in middle school. But you\u0026apos;re a different story, Kushida-san.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKushida-san, who\u0026apos;d been listening in silence up to this point, quietly placed her phone on the table.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Kushida-san, you\u0026apos;re from the same middle school as me, and you also knew Yagami-kun. Is that right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then it\u0026apos;s your fault, you idiot Kushida. Hurry up and say it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yagami... I see.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter murmuring quietly, Kushida-san continued.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, Ayanokouji-kun has transferred classes and there\u0026apos;s no point in hiding it here anymore, so I\u0026apos;ll tell you. Yagami-kun and I aren\u0026apos;t from the same middle school.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2014;Huh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? What\u0026apos;s that? What do you mean? I\u0026apos;m getting totally lost here.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIbuki-san was confused. At the same time, I also felt a sense of confusion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRight after last year\u0026apos;s first-years enrolled. I remembered that when Yagami-kun visited the second-year classrooms, they certainly had a conversation stating they were from the same middle school.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was something I believed unconditionally, without a shred of doubt. That fundamental premise was suddenly shattered.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd then, Kushida-san told us the reason why.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe students from her middle school days who knew her true nature. Although she had no memory of a kouhai named Yagami Takuya, he clearly acted as though he knew her. She was worried that if she acted like she didn\u0026apos;t know him, it would lead to a difficult situation where he might carelessly expose her past, so she impulsively lied that they were from the same middle school to go along with his story. She did it to probe and see for herself just how much Yagami-kun knew. And the result had been the worst possible one. Despite not being from the same middle school, Yagami-kun knew the details of Kushida-san\u0026apos;s past, and in exchange for not revealing it, he demanded various forms of cooperation from her. It seemed Amasawa-san had a hand in that affair as well.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;W-Wait a minute. That\u0026apos;s so much bombshell information, my head can\u0026apos;t keep up. You knew that Yagami-kun was smart, too... Was he really not your kouhai?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I only remembered a little because it was right after I saw the new students\u0026apos; OAA. He had an A in Academic Ability, so it stuck in a corner of my mind. It\u0026apos;d be a pain if a kouhai from my middle school showed up, like you did in my case, Horikita-san, right? That\u0026apos;s why I checked the faces and names of all the first-years the moment we got access.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe confessed that she\u0026apos;d skillfully used that \u0026apos;A in Academic Ability\u0026apos; part to pretend they were acquaintances.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t know how sure you guys were, Horikita-san, but the one who got Yagami-kun expelled was definitely Ayanokouji-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKushida-san cut into the one area where Ibuki-san and I had been unable to find a definitive answer.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I asked Ayanokouji-kun directly after Yagami-kun was expelled. He said he \u0026apos;took care of\u0026apos; Yagami-kun to save me from being used. It seems Yagami-kun and Ayanokouji-kun went to different schools, but he said they were acquaintances. Same for Amasawa-san; he said she lived nearby.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You should\u0026apos;ve said that sooner. Really, you idiot Kushida.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s my sealed-away past, you know. This is a story I really wouldn\u0026apos;t want anyone to hear.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Jeez, to think there was someone who knew what I wanted to know this close by.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Indeed... I sympathize with your circumstances, but this is a perfect example of it being darkest under the lighthouse.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt felt like the building blocks I\u0026apos;d painstakingly stacked on my own had been forcefully knocked over by a hand from the side.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ayanokouji-kun said he earned their resentment a long time ago. Did Amasawa-san forgive him? Was the misunderstanding cleared up? It seemed like something like that, but he said Yagami-kun wouldn\u0026apos;t forgive him. The story was that he probably dug up my past in order to get revenge on Ayanokouji-kun... I think.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKushida-san spoke, recalling that conversation from what was likely last year as best as she could.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I thought I\u0026apos;d never tell this story to anyone else, but you never know, I guess.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKushida-san, laughing self-deprecatingly, took a sip of water.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps her throat was dry from having spoken the truth she had hidden until now.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I may have made you recall unpleasant things, but this is a huge piece of information. Though we\u0026apos;ll need to reorganize everything from the beginning... you know.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe person known as Ayanokouji Kiyotaka, whose background was a mystery.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut it was a fact that even a person like Ayanokouji-kun had mutual acquaintances in Amasawa-san and Yagami-kun. Furthermore, both of them also possessed extraordinary abilities. What could be deduced from this was that their relationship was likely more than just being mere acquaintances.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe earned the resentment of his two kouhai somewhere\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Were they in the same environment since middle school, or perhaps even earlier, since childhood\u0026#x2014;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd there was some trouble... In my mind, I began to reconstruct everything from scratch.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t know anything about martial arts, but there are probably famous karate or judo dojos known nationwide, so isn\u0026apos;t it possible they attended a place like that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Idiot Kushida. Their strength isn\u0026apos;t something you can get that easily.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I did preface my statement by saying \u0026apos;I don\u0026apos;t know anything about martial arts,\u0026apos; didn\u0026apos;t I? Just because my idea is different from your perception, Ibuki-san, could you stop trying to attack people for it? You\u0026apos;re just embarrassing yourself. Also, could you stop calling me an idiot over and over? With our grades, it wouldn\u0026apos;t even be a contest between you and me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKushida-san added with exasperation that she\u0026apos;d merely offered one opinion from a layman\u0026apos;s point of view.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hmph. Knowing about martial arts is just common sense, isn\u0026apos;t it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t have that kind of common sense.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t fight. But it\u0026apos;s true that you can\u0026apos;t easily acquire skills like Ayanokouji-kun and the others just by attending a famous dojo... Conversely, yes, perhaps as a result of their skills, they were invited to a famous dojo or something, and that\u0026apos;s how they met... That line of thought might be possible.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe adults who came to pick up Yagami-kun when he went on a rampage in the student council room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf they were also people related to his origins, then the connections would gradually start to become visible.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I wonder if I should try asking Amasawa-san directly soon?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You think that little devil would tell you anything?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That may be true... What will you two do?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll pass.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If I see Amasawa\u0026apos;s face, I\u0026apos;ll want to punch her, so I\u0026apos;m not going.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe two of them showed their refusal almost simultaneously.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut it was true that making careless contact would likely yield no progress.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt might be better to start by just observing the situation.\u003c/p\u003e\u003ch2 class=\"heading_2\"\u003ePart 7\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIBUKI-SAN, HAVING EATEN her fill, left first. About two minutes later, Kushida-san went to the entryway and put on her shoes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as I thought she would leave the room without so much as a glance back\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Thank you for the meal today. I appreciate it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...You\u0026apos;re not so bad, I suppose. Unlike a certain someone, you can actually say thank you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not just about you, Horikita-san. I don\u0026apos;t really want to thank anyone else either, but I guess it\u0026apos;s just a habit. I make a point of putting it into words, so it just comes out unconsciously.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKushida-san nonchalantly\u0026#xa0;stated that her previous remark was also an unconscious one.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see... Well, regardless of your true feelings, words are important, aren\u0026apos;t they?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn truth, there was a certain satisfaction to be had even from those words of gratitude, however superficial.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I thought she would leave, she immediately turned back toward me for some reason.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;By the way, how are things with the special exam? Have you been able to predict what kind of rules it\u0026apos;ll have?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m narrowing down the possibilities. I intend to report a few potential strategies to the class tomorrow.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis sort of discussion was impossible with Ibuki-san around.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wondered if that was why Kushida-san had deliberately chosen to leave a little later.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So you\u0026apos;re even wary of her, of Ibuki-san.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Honestly, she\u0026apos;s not really at a level where I need to be cautious, you know. But just in case, I was on my guard, thinking she might try to probe me about our thoughts on the special exam rules during the meal. But there was no sign of that, or rather, I guess the thought never even crossed her mind.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was no doubt she\u0026apos;d stopped by the room purely for the meal.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eStill, Kushida-san avoided the topic just in case.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo be honest, it was a helpful consideration.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s a special exam and we don\u0026apos;t know the rules, but do you still plan on winning?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What a thing to ask. Of course, I do. The conditions are the same for every other class, you know.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But Class C has Ayanokouji-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA sharp gaze and words that struck at the core without any reservation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was as if she were testing my mental state all over again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s strange, isn\u0026apos;t it? When we first enrolled, I never would have imagined it, but now, just hearing his name makes my body instinctively tense up and feel intimidated, and I can no longer see him as an opponent I can defeat.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI acknowledged the undeniable fact and sighed at my own weakness.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even so, I\u0026apos;ll fight with the belief that I can win. Isn\u0026apos;t that the bare minimum attitude to have?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Perhaps,\u0026quot; Kushida-san answered, averting her gaze from me for a moment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I thought I\u0026apos;d get to bask in a little bit of bliss once we made it to Class A, but now we\u0026apos;re in a position where we have to run for our lives. We\u0026apos;re like rabbits being chased by a lion, you know? It\u0026apos;d be pretty uncool if we keep losing like this, I think.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith her great pride, Kushida-san continued to play the part of an honor student and was extremely concerned with appearances. Though she never put it into words, there was no doubt she\u0026apos;d been deeply irritated about being placed in Class D and having to content herself with being in a lower-ranked class.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen, during the Unanimous Vote Special Exam, her true nature was exposed to the entire class, and her circumstances changed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe now had to interact with people she despised, like me, and was forced to keep fighting, even as she was being wounded.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe status of Class A, which she finally, painstakingly obtained.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe fact that it was now facing the threat of being toppled in an instant must have been causing her considerable mental anguish.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Either way, it doesn\u0026apos;t look like you can do it by yourself, Horikita-san.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Even if I wanted to, I can\u0026apos;t deny it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;For now, if you figure out anything that could be a hint for the special exam, let me know. I\u0026apos;ll try thinking about it my own way from there.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes, of course. Even so...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKushida-san, who showed her willingness to cooperate even as she unreservedly voiced her complaints.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I never thought I\u0026apos;d hear you declare your support. You do have a genuinely kind side to you, don\u0026apos;t you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI praised her frankly. In response, Kushida-san scoffed, then looked at me with a fixed smile, her eyes unmoving.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I just love the cute me who pretends to be kind. It\u0026apos;s because I\u0026apos;m aware I have an awful personality that I can afford to treat even you with an angelic attitude, Horikita-san. So then, I expect your strength isn\u0026apos;t just for show.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith that, Kushida-san gave a small, mocking laugh, opened the door, and left.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see... I guess that means I\u0026apos;m still a poor judge of character.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFar from being exasperated, I found myself inadvertently impressed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI\u0026apos;d been shown Kushida-san\u0026apos;s way of life\u0026#x2014;one that was endlessly concerned only with how she presented herself to others.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer final words echoed in the back of my mind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026apos;\u003cem\u003eI expect your strength isn\u0026apos;t just for show\u003c/em\u003e.\u0026apos;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026#x201c;\u0026#x2014;I am expecting that of myself, as well.\u0026#x201d;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter the door closed, I let out a breath and returned to the living room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA new special exam would begin the next day.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut I had things to do, so it wasn\u0026apos;t yet time to rest.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026#x201c;Well then\u0026#x2026; I suppose I should clean up.\u0026#x201d;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSuppressing my slight reluctance, I turned my gaze to the table.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKushida-san always ate gracefully, but Ibuki-san was the surprising one.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile it wasn\u0026apos;t uncommon for people to leave rice grains in their bowls, she\u0026apos;d eaten every last one.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026#x201c;I can praise her for that, at least, but everything else is as hopeless as ever.\u0026#x201d;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSpilled miso soup and bits of side dishes weren\u0026apos;t only on the table, but also where she\u0026apos;d been sitting.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer uniform skirt must have been stained as well.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026#x201c;I wish she\u0026apos;d have at least some awareness that her daily conduct and manners are being observed\u0026#x2014;\u0026#x201d;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as I was about to reach out, I stopped.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA thought suddenly occurred to me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see... That sort of thing is certainly plausible, isn\u0026apos;t it...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe school imposed a week-long special exam with no explanation of the rules.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDid it refer to this one week, or to the time after this one week?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe answer hadn\u0026apos;t been obtained.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTherefore, every class must have been racking their brains.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2014;The possibility is by no means low.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eChabashira-sensei\u0026apos;s words, actions, and attitude.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat if they were, in a way, the best hint she could give us?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe wanted us to make her think that we were different from when we first enrolled.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSuch cold words reflected the true feelings of our teacher, who\u0026apos;d been watching our immature class.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf the idea that surfaced in my mind was correct, I had to take action immediately, within the day.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis was because whether or not I could control that person by tomorrow was directly linked to victory or defeat.\u003c/p\u003e\u003ch2 class=\"heading_2\"\u003ePart 8\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI RUSHED OUT of my room just after 8:00 p.m. and first headed downstairs in the elevator.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd then, standing in front of Sudou-kun\u0026apos;s room, I suppressed my impatience and knocked with some reservation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter hearing footsteps pattering toward the door, it opened a little roughly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Who the hell is it at this hour\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSudou-kun appeared, still in his school uniform with only his blazer removed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe sight of him wearing glasses, which I rarely saw, felt a little refreshing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I apologize for visiting without notice. I have something I\u0026apos;d like to talk about.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;S-S-S-Suzune!? Wh-what are you doing here? I mean, uh, it\u0026apos;s not a problem or anything!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA mechanical pencil was clutched in the hand of the flustered, gesticulating Sudou-kun.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh? Horikita-san?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom behind the bewildered Sudou-kun, Onodera-san poked her head out as she spoke.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI glanced at the entryway and saw two pairs of shoes. Even I had my suspicions, however slight.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Was I interrupting something?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;N-No, you\u0026apos;re not interrupting anything at all! We were just studying together, that\u0026apos;s it!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Studying?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIndeed, there were Sudou-kun\u0026apos;s glasses and the mechanical pencil in his hand. More importantly, both of them were still in their school uniforms.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs the student council president, there seemed to be no problems to point out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Well, y\u0026apos;see, about this special exam. They said we don\u0026apos;t gotta study yet, but it\u0026apos;d be bad if there was a written test, right? So I figured we should prepare, even just a little.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven though I hadn\u0026apos;t yet told them our plan for tomorrow, he\u0026apos;d already begun to prepare countermeasures. I doubt anyone could have predicted seeing him like this back when we first enrolled.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s admirable, but make sure you get Onodera-san back to her room safely before curfew, all right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;O-Obviously! So what do you want, showing up without any notice?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe tried to shoo Onodera-san toward the living room with his hand, but I stopped him. Since there was a guest, it would be faster to explain it to both of them at once.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;May I come in for just a moment? This is something I\u0026apos;d rather people from other classes not overhear.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah... of course you can.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI stepped into the entryway and closed the door.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen I beckoned Onodera-san, who was watching me with curiosity, over to the entryway.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The special exam that starts tomorrow. I can\u0026apos;t say for certain, but I have an idea about the kind of rules it might have.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI lowered my voice slightly and explained it to the two of them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Seriously? What kinda rules d\u0026apos;you think they are?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;When Chabashira-sensei announced the special exam, her attitude was colder than usual, wasn\u0026apos;t it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Kanji and the others were complaining about it, yeah. Sounded like they were trying to figure out why.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not that she was being cold because she couldn\u0026apos;t afford to be otherwise; I believe she was actually being curt on purpose.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? On purpose? What\u0026apos;s the point of doing that? She\u0026apos;ll just make people hate her, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I interpreted that attitude as the only hint the teacher could give us... I think she wanted to make us remember the time shortly after we enrolled.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You mean back in our first year, right? Yeah, she was pretty damn cold back when we enrolled.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSudou-kun glanced back to meet Onodera-san\u0026apos;s eyes, recalling the past, and they both nodded in understanding.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Do you remember the first special exam we took as first-year Class D?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hmm? The uninhabited island exam... wasn\u0026apos;t it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOnodera-san, who\u0026apos;d taken a few more steps forward to stand beside Sudou-kun, murmured as she tried to recall.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Your guess isn\u0026apos;t technically wrong, Onodera-san. However, right after we enrolled, we were put through a certain month-long test without any explanation of the rules\u0026#x2014;the root cause of all our struggles for the past two years.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs soon as I said that, Sudou-kun immediately remembered, and Onodera-san followed suit.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh, right. They were checkin\u0026apos; stuff like tardiness, absences, and our attitude in class. That\u0026apos;s how our Class Points went to zero, wasn\u0026apos;t it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA surprise from the school that gave the children who\u0026apos;d just become first-year high schoolers points equivalent to 100,000 yen every month. Repeated tardiness and private conversations. The teacher simply continued to watch over us quietly, without a word of warning.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eClass D, who enjoyed and reveled in it all without a single thought for what was behind it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe price for that was steep, and it led to the two years of hardship I just mentioned.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So it\u0026apos;s that exam again this time?... Come to think of it, she did say somethin\u0026apos; like, \u0026apos;show me you\u0026apos;ve grown.\u0026apos; Guess she meant for us not to make the same mistake again.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSudou-kun, who\u0026apos;d been properly listening to Chabashira-sensei\u0026apos;s words, picked up the pieces of her statement himself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s how I interpreted it. That\u0026apos;s why I thought it might be a special exam with the same rules.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That seems totally plausible. Actually, now that you mention it, it almost feels like that\u0026apos;s the only possibility.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOnodera-san heard my idea and I could tell from her expression that it clicked.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course, I can\u0026apos;t completely rule out the possibility of an exam with some kind of unrelated rules. But our classmates studied intensively for the last special exam, and a fair amount of frustration has built up. Continuing this way doesn\u0026apos;t guarantee we\u0026apos;ll get good results.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere couldn\u0026apos;t have been many students who could maintain such high motivation, like these two.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This whole \u0026apos;prepare for anything\u0026apos; approach, honestly, it\u0026apos;s not a good fit for our class.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s certainly easier just focusing on one thing.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course, it will be a gamble. If it\u0026apos;s announced on the day that it\u0026apos;s a written exam after all, our chances of winning might disappear. However...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t know what you think, Sudou-kun, but I\u0026apos;m on board with Horikita-san\u0026apos;s plan. Studying isn\u0026apos;t a bad thing, but you get less efficient if you overdo it. As a strategy for the class to win, I think a simple one is more effective and not a bad idea.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. I want to share this with the entire class today and have them lead a thoroughly disciplined life starting tomorrow. A single case of tardiness could be the difference between winning and losing.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAyanokouji-kun\u0026apos;s class and Ichinose-san\u0026apos;s class had many honor students to begin with.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey could maintain a high standard for their usual perfect attendance and general conduct without even trying.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA mistake on the first step meant we had absolutely no chance of winning.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then we gotta make damn sure no one finds out about this. If Kanji and his crew go blabbing to other classes, we\u0026apos;re screwed.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re absolutely right. Whether or not we can get a head start on the first day is a crucial factor.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, putting the other classes aside, there was no way Ayanokouji-kun couldn\u0026apos;t have figured out something of this level. Class C must have already factored this possibility into their plans. And that meant... just as Karuizawa-san feared, the information might be passed to and shared with Class D...\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Ayanokouji\u0026apos;s probably figured it out.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven without me voicing my thoughts, it seemed Sudou-kun had gotten the picture.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was proof that he now fully understood that Ayanokouji-kun was a formidable opponent.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even so, the other classes may not know. Will you cooperate?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah. I\u0026apos;ve even got an idea how to make those guys stick to the rules and keep their mouths shut.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe thumped his chest with his fist and puffed it out. He looked very dependable.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But just keeping Ike-kun and the others in line won\u0026apos;t be enough. Our class has one major obstacle.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;An obstacle?... Ah, I see. Is that why you came here, Horikita-san?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAn image of the problem child who never listened to anyone came to both Onodera-san\u0026apos;s and Sudou-kun\u0026apos;s minds.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;He isn\u0026apos;t a student who is normally late or absent without reason, but his classroom attitude and private life are highly problematic. If he alone were to drag us down, our class would have absolutely no chance of winning.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo win the special exam, getting his cooperation became our most important task.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But that\u0026apos;s impossible, ain\u0026apos;t it? Gettin\u0026apos; that guy to do what he\u0026apos;s told.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Simply asking him will likely be impossible. However, I have an idea. To that end, I am thinking of visiting Koenji-kun\u0026apos;s room, but I\u0026apos;ve never been there before. Therefore, I would like a classmate to accompany me, just in case.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Koenji\u0026apos;s room? Right now? Yeah, that does sound a little dicey. If that guy goes feral, even I wouldn\u0026apos;t be able to stop him easily. Nah, you made the right call not goin\u0026apos; alone.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat wasn\u0026apos;t the sort of thing I was worried about, but...\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t feel like pressing the issue, so I let it slide.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So, that\u0026apos;s the situation. Would you mind if I borrowed Sudou-kun for a bit? I believe I can have him back in ten or twenty minutes, at the earliest.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If that\u0026apos;s the case, be my guest. Well then, I\u0026apos;ll just hang around and wait.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSudou-kun readily agreed on the spot, and after he quickly put on his shoes, the two of us stepped out into the hallway.\u003c/p\u003e\u003ch2 class=\"heading_2\"\u003ePart 9\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWHEN WE ARRIVED at Koenji-kun\u0026apos;s room, Sudou-kun stepped forward and took the lead for me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was no response from inside the room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I wonder if he hasn\u0026apos;t returned yet...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI thought he would be in his room at this hour, but maybe that was wishful thinking...\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Who knows? That guy seems like he\u0026apos;d just ignore anything he finds annoying, so I can\u0026apos;t say.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith that, he knocked repeatedly on the door with brute force. It was very helpful that he could do something I would hesitate to do without a second thought.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter the sound echoed in the surrounding area for a while, the door, which had long been silent, finally opened.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yo, Koenji. So you were in there after all.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh my, oh my. To think the fools at my door were none other than my own classmates.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I apologize for showing up unannounced so late at night. I have a simple request for you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you wished to make an appointment with me, I should think you would have used your cell phone.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Using a cell phone with no guarantee of reaching you would be a problem if this waited until tomorrow. Besides, I determined that you wouldn\u0026apos;t listen to my request unless I came to speak with you in person. It\u0026apos;s about the special exam.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I wondered what this request could be, but are you still not giving up, Horikita-girl? I was under the impression you\u0026apos;d seen the light during our discussion this afternoon.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You don\u0026apos;t have to participate in our discussions. And you don\u0026apos;t need to shoulder anything for the class by yourself. But that\u0026apos;s not it... If this were a request that would benefit you, wouldn\u0026apos;t you have room to consider it? If you hear me out, I\u0026apos;m sure it won\u0026apos;t be a bad deal for you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t want to overuse the tactic of dangling a carrot in front of an unmoving horse.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut it was also true that I couldn\u0026apos;t afford to say such things when dealing with Koenji-kun.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hmm. In that case, I suppose I shall hear you out.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs he said that, the door swung wide open before we could say anything else.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It would be difficult to talk with our voices echoing outside, wouldn\u0026apos;t it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps having realized something when he heard the words \u003cem\u003especial exam\u003c/em\u003e, he welcomed us into his entryway.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Never thought I\u0026apos;d see the day I\u0026apos;d be stepping into your room.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Fufufu. You should be purely delighted, red-hair-kun. You are the first man to have ever set foot in my room.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Not happy about it at all...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter making a gagging gesture, Sudou-kun crossed his arms and stood a half-step in front of me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Now then, shall you let me hear this story of yours? Something about it being beneficial to me?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. Starting tomorrow, I want you to simply come to school as usual, without being late or absent, and to refrain from idle chatter during class. On top of that, for one week only, I want you to correct all the behaviors that are considered problematic: your posture and habits in class, and any actions that disrupt discipline at Keyaki Mall and other places.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUp to this point, it was merely a request from our side. It was obvious that Koenji-kun would not nod his head in agreement for that alone. So I immediately got to the part that would benefit him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you exhibit no problematic behavior whatsoever, just like the other classmates, I will pay you 200,000 Private Points.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEssentially 200,000 yen just for being mindful of the rules for one week. This was undeniably an exceptional reward.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSudou-kun gave me a look that said I was paying too much. But without this level of impact, Koenji-kun wouldn\u0026apos;t budge. Besides, I was prepared to pay up to 300,000 points in the unlikely event he complained it was not enough.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So, you believe that following the rules is the basis of this exam, do you, Horikita-girl?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Coincidentally, that is precisely what I was thinking, myself.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That is... a coincidence. I would very much like you to tell me how you arrived at that conclusion.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Most likely the same way you did. From our teacher\u0026apos;s attitude.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUnlike me, who\u0026apos;d just had a flash of insight, Koenji-kun may have realized it at a much earlier stage. I wanted to ask for details, but I decided against it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;However, the world is full of various happenings. As it stands, the probability of this being an exam that requires discipline is about 70%. In the event that it is an entirely unrelated exam, or if we lose due to factors other than myself, I will still expect to be paid the full amount in Private Points. Is that acceptable?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hey, that ain\u0026apos;t fair!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There is nothing more expensive than something free, you know. If you cannot accept this, then I can offer no cooperation whatsoever.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I expected you would say that. I don\u0026apos;t mind accepting those terms, but you will have to avoid any action that could result in even a single point deduction.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Fufufu. Then our negotiations are complete. For one week, starting tomorrow\u0026#x2014;I shall sell you my discipline. For the exceptional price of 500,000 Private Points.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...You\u0026apos;re asking for quite a lot, aren\u0026apos;t you? I can hardly believe that\u0026apos;s an amount you\u0026apos;re willing to negotiate.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even this is me showing considerable kindness, you know? Not being able to check my bangs with a hand mirror during class when I am so concerned with them is painful for one such as myself who pursues beauty. Besides, I am the type who prefers to conclude negotiations in one fell swoop rather than probing each other\u0026apos;s true intentions.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat last remark was his way of saying he\u0026apos;d seen through the fact that I hadn\u0026apos;t set 200,000 Private Points as my upper limit. He hit me where it hurt, just like he did after school.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s way too much. Just because you\u0026apos;re takin\u0026apos; advantage of our weakness, you think you can get away with\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI stopped Sudou-kun, who was on the verge of grabbing him, cutting him off.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Forcing your own arbitrary sense of what\u0026apos;s normal is also out of the question, I trust you understand that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course. It will be a sad time from tomorrow, not being able to take in the sight of my beautiful, long legs upon my desk, but I suppose it can\u0026apos;t be helped.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Are you sure about this, Suzune? Five hundred thousand Private Points is just\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The deal is done. And don\u0026apos;t speak of this contract to anyone.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a gamble. Just as Koenji-kun said, there was no guarantee that obeying school regulations was part of the special exam rules, and a 70% chance would\u0026apos;ve been more than enough. But for now, I had to act with the belief that I could seize that probability; I wouldn\u0026apos;t be able to defeat the other classes without shouldering that much risk.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAbove all else, Koenji-kun would never act in an ordinary way. Had my request been something no one else could imitate, such as asking him to get a high score on an exam or take the top spot in sports, there would\u0026apos;ve been no room for negotiation at all.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut this time, it was the opposite kind of request: for him to simply do nothing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlthough it was a large sum, he accepted my proposal of Private Points.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well then, it is about time you took your leave. Today will be another long night for me. Or perhaps, Horikita Girl, would you care to accompany me for this long night? I promise you won\u0026apos;t regret it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Like hell! We\u0026apos;re leaving, Suzune.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSudou-kun took my arm and, as if he didn\u0026apos;t want me to linger for a second longer, opened the front door and stepped out into the hallway.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Damn that guy... Spouting such nonsense...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs we were leaving, Sudou-kun quietly cursed in front of the elevator.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It was a foolish joke, so pay it no mind. Besides, the negotiations were concluded successfully.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But still, isn\u0026apos;t five hundred thousand just for doing nothing way too steep?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If the other students heard about this, they\u0026apos;d no doubt complain. But rest assured. I have no intention of burdening anyone else in the class with the cost.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s not what I mean... Before we even get to whether you\u0026apos;re paying for it yourself, don\u0026apos;t you think there\u0026apos;ll be people who won\u0026apos;t be convinced if they find out about this proposal?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s right. That\u0026apos;s why I asked you to accompany me. You won\u0026apos;t tell anyone else about this negotiation, will you, Sudou-kun?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a request to keep it \u0026apos;confidential\u0026apos; while avoiding a direct statement.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSudou-kun looked a little bewildered, but he nodded firmly as he reached for the elevator\u0026apos;s up button.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;W-well... If you\u0026apos;re asking me to keep my mouth shut, then I won\u0026apos;t tell anyone.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Thank you. Oh, the down button is fine.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI reached past Sudou-kun\u0026apos;s slowly extending arm and pressed the down button.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m going to take the stairs back. Well then, you were a great help today for agreeing to my sudden request. Good night.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter thanking him, I turned toward the emergency exit door.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Suzune!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA voice called out, stopping me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What is it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026#x2014;I, um...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wondered if he hadn\u0026apos;t decided what to say, or if he had, but the words wouldn\u0026apos;t come out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSeeing him so flustered, his voice catching in his throat, I tilted my head slightly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you have something you want to say, you can tell me. Did you disapprove of my methods?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s not it. It\u0026apos;s not like that... I... I might not be a replacement for Ayanokouji, but...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAyanokouji. At his name, I found my eyes widening slightly in surprise.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m not strong like him, and I\u0026apos;m not smart either... But still, I\u0026apos;ll always be on your side, Suzune. So\u0026#x2014;whenever you\u0026apos;re in trouble, make sure you rely on me like you did today.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSudou-kun told me so, his eyes, filled with strong resolve, fixed on me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You held the class back quite a bit during our first year, so for this next year, I\u0026apos;ll need you to do your best until the very end.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ugh\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn response to my merciless words, Sudou-kun gave a wry smile, as if he\u0026apos;d broken out in a cold sweat.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The elevator is here. Say hello to Onodera-san for me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh, uh, yeah. Well... see you tomorrow...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes, see you tomorrow.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI watched Sudou-kun step into the elevator, then headed for the emergency stairwell.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Thank you, Sudou-kun. Your words made me very happy.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe reason I couldn\u0026apos;t thank him honestly was because I couldn\u0026apos;t help but feel a warmth spreading through my chest. I had allies. I had reliable classmates. I couldn\u0026apos;t remain in despair forever just because Ayanokouji-kun had left.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI knew I had to live up to the expectations of those who supported me, no matter what.\u003c/p\u003e\u003ch1 class=\"heading_1\"\u003e\u003ca class=\"heading-link\" href=\"/read/ss-y3-v2/2\"\u003eChapter 4:\u003cbr/\u003eThe Quest for Knowledge\u003c/a\u003e\u003c/h1\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIT WAS THE morning after the exam was announced.\u003c/em\u003e\u0026#xa0;This day marked the start of the week-long exam period\u0026#x2014;or rather, the preparation period. But I did nothing out of the ordinary. I just woke up in the morning, went to school, paid attention in class, spent my free time after school and prepared for the next day.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI\u0026apos;d given my classmates one instruction, but otherwise, they were free.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey could carry on as usual, or they could study more. I left it all up to their own discretion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was still quite early for school, but with nothing else to do, I decided to keep up my early departure routine for a little while longer. I turned off the TV, put on my shoes, and stepped out into the hall.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen the elevator arrived and its doors opened, five girls and one boy were already inside.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis wasn\u0026apos;t an unusual sight, as the elevators were often crowded on mornings before school.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eConsidering the capacity, I could\u0026apos;ve squeezed in, but the three Class A girls who happened to be riding\u0026#x2014;Shinohara, Matsushita, and Inogashira\u0026#x2014;were staring at me with somewhat cold eyes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was no point in forcing my way on, so I decided to let it go and wait for the next one.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe stairs were an option, but I chose to wait for the next elevator.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis one also had three girls on it, but there was still some room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, my feet felt a little heavy, and for a moment, I hesitated to get on. But there was clearly space, and it would\u0026apos;ve been unnatural not to get on. With that thought, I stepped forward. I turned around inside the elevator\u0026#xa0;to face the doors, and it soon arrived at the first floor.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs the last one to get on, I was naturally the first to step out into the lobby. I took a few steps and stopped, and the two girls behind me immediately walked past.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Good morning.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOne girl remained. She spoke to me from behind in a small voice, careful not to startle me. It was Hiyori, who\u0026apos;d been in the elevator with me. I\u0026apos;d seen her nearby or passed her in the halls several times like this,
