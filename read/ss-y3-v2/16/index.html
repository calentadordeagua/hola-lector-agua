ragraph\" style=\"text-align: left\"\u003eThe student Housen-kun had struck, suffered injuries that took about three weeks to heal. However, the Class C student threw the first punch and also hit another student. Deciding who was at fault and how to judge the matter dragged on, requiring numerous discussions and taking two weeks to resolve. Nanase-san shared all of the details with me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Nagumo-senpai must have had a tough time.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I think so, too.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThough exasperated, I couldn\u0026apos;t help but laugh.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Was it that funny of a story?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, that\u0026apos;s not it. It\u0026apos;s just that the same kinds of trouble happen everywhere, and I had a similar experience in my first year.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is...that so?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It was similar to your situation. A classmate of mine got into a fight with one of Ryuuen-kun\u0026apos;s classmates.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt that time, my brother was sitting in the very seat I occupied.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSudou-kun struck a student in the special building and a discussion was held to determine responsibility, such as who threw the first punch. My brother didn\u0026apos;t unilaterally take anyone\u0026apos;s side, but fulfilled his duty as student council president with an impartial eye. I\u0026apos;m sure Nagumo-senpai did the same last year.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s almost become an annual tradition for the new students to cause trouble at least once, and when I imagined it like that, I found it kind of amusing.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hearing your story makes it feel more real. I can imagine something similar happening here again next year.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In that case, it will be your turn to pass judgment as student council president.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Eh, m-me?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If things proceed as they are, that\u0026apos;s what will happen. Will you do it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...I hope I\u0026apos;m up to the task... Besides, they say all the past student council presidents have graduated from Class A... and I\u0026apos;m currently in Class D.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNanase-san answered without much confidence, but she was without a doubt the leading candidate.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;d do best not to worry about precedents born from chance. Until now, the student council president could only come from Class A or B, yet here I am, serving in the position despite having started in Class D. And while this is a good example, there\u0026apos;s no guarantee that I will even be in Class A at graduation.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe current Class A was also a temporary position.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a position we wouldn\u0026apos;t have reached without Ayanokouji-kun\u0026apos;s help.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I believe you, at least, are more than qualified to become the student council president. Have some confidence.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Thank you very much. For now, I\u0026apos;d like to focus on producing solid results as a secretary.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThough hesitant, Nanase-san accepted my words earnestly, nodding and lowering her head.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The fact that their fight was brought to the student council is proof that this is a considerable dispute. I\u0026apos;m going to share a few of my thoughts before they arrive. I want you to lend a hand depending on the situation.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOne of them was a Class A student. I had the impression that students prone to this kind of violence tended to be concentrated in Class D or Class C, but this time was different. Kusanagi-kun not only had high physical ability of B+, but his academic ability was also a B+.\u0026#xa0;I wanted to consider the possibility that he was quick-witted and take the measures I could.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the time we had left, I verbally explained a few plans to Nanase-san.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSoon, when the scheduled time came, a dry knock sounded at the student council room door.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It seems they\u0026apos;ve arrived. Please, come in.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt Nanase-san\u0026apos;s reply, two male students appeared, glaring at each other.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBoth had unique hairstyles and an appearance that would make anyone think of them as delinquents.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey showed no signs of remorse whatsoever and seemed to think the other was entirely responsible.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut what caught my eye the most was not their hairstyles or attitudes, but their faces.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Those are some... pretty bad injuries.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe injuries were so bad that even Nanase-san couldn\u0026apos;t help but comment on them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe one standing to my left was the first-year Class D student, Maki-kun.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe one standing to my right was the first-year Class A student, Kusanagi-kun.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI\u0026apos;d heard that even minor injuries could be diagnosed as taking two or three weeks to fully heal, but they looked quite battered. They must have really gone at it, as both of their faces were swollen. Maki-kun\u0026apos;s injuries were particularly bad, making it clear who got the upper hand in the fight.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I assume you both know why you\u0026apos;ve been summoned to the student council room?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNanase-san coaxed them, as if guiding them to explain voluntarily.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Nah, I got no idea. Why the hell do I gotta get called in here? This guy\u0026apos;s the one at fault.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKusanagi-kun immediately retorted, turning to Maki-kun and baring his teeth.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? Don\u0026apos;t fuck with me! You\u0026apos;re the one who threw the first punch!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Bullshit! You\u0026apos;re the one who came at me first. Well, you missed, though!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA loud shouting match began over who made the first move and who threw the first punch.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNanase-san and I exchanged a quick glance and listened to the boys\u0026apos; argument for a while.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe judged that it would be easier later if they blew off some steam first.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt first, they just tried to pin the blame on each other for starting the fight, but it gradually devolved into unnecessary verbal abuse, and eventually escalated to irrelevant topics like height and appearance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;How childish.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Childish, indeed.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven though they were only just first-year high school students, they were starting to cross a line that couldn\u0026apos;t be ignored. What\u0026apos;s more, they showed no signs of calming down; on the contrary, they looked like they were about to start brawling right there in the student council room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s quite enough noise. I\u0026apos;m going to have to ask you both to be quiet for a moment.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNanase-san, unable to watch any longer, warned them as such, but they merely glanced at her and didn\u0026apos;t stop their tirade.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey were clearly underestimating her because she was a girl. That attitude was plain to see.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut as long as I knew Nanase-san\u0026apos;s words reached them, that was enough.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTheir complaining was simply a matter of mutual dissatisfaction.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn that case, all I had to do was prepare to hand down a ruling that would be most dissatisfying for them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI sent a look to Nanase-san.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOur eyes met, and she gave a small nod, having perfectly grasped my intentions.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you\u0026apos;re going to continue arguing as you please, then this meeting is unnecessary. We may have to impose a heavy penalty on both of you. Is that acceptable?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs Nanase-san spoke with a cold, dismissive tone, I silently pulled back my chair and stood up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? Hold on, there\u0026apos;s no way I\u0026apos;m gonna accept that!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This ain\u0026apos;t got nothing to do with the damn student council, especially not some girl buttin\u0026apos; in!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Please use formal language when you speak.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey glared back at my warning, their gazes filled with discontent.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI suppose they think I\u0026apos;ll back down because of that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This is ANHS, and the student council is vested with a certain amount of authority. This discussion is a precious opportunity to bring the truth to light. If you two insist on trampling all over it, then we have no intention of wasting any more time. Let us compile a report for the teachers, Student Council President.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t you dare end this on your own!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You two are quite welcome to leave. Or, if you wish to continue your argument, please do so in the hallway.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince they only just enrolled, trying to convince them that this wasn\u0026apos;t for the good of the class would have no effect.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor those two, the worst-case scenario was that neither of their claims would be accepted. I doubt their cheap pride would allow for that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut little by little, the two of them began to feel the strange atmosphere in the room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince they entered the Student Council Office, I hadn\u0026apos;t said a single word to them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Why is the Student Council President just staying quiet? Say something.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI guess because I gave a speech at the entrance ceremony, they do recognize that I\u0026apos;m the student council president.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;ve been watching this whole time, so you get which one of us is in the wrong, don\u0026apos;t you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEach of them pointed at the other, continuing to insist that they weren\u0026apos;t at fault, only the other was.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey\u0026apos;d likely intended to continue until I gave my answer.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut I continued my silence.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI conveyed to them with my silence that the situation was not worth speaking about.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEventually, my scheme began to bear fruit, and the noisy Student Council Office fell silent.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was proof they realized they were the only ones making a ruckus.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey still opened their mouths as if to protest, but their words were too quiet for me to hear, and eventually, their lips sealed shut. Both of them, at nearly the same time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What are we supposed to do...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd then, with a strained voice, he asked for my judgment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It seems they have the will to resolve this. What will you do, Student Council President?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI gave a quiet nod and signaled for Nanase-san to proceed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Alright then, first, Kusanagi-kun, would you please tell us your side of the story again? In the meantime, no matter how dissatisfied you may be, Maki-kun, I must ask that you absolutely refrain from speaking. I assure you that you will be given an equal opportunity to speak next. Is that understood?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUpon hearing Nanase-san\u0026apos;s admonition, Maki-kun bit his lip hard and gave a slight nod.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This guy... Maki was givin\u0026apos; me a nasty look. So when I asked him what his problem was, he just suddenly snapped. After that, he called me out to the back of the dorms. I wasn\u0026apos;t gonna back down, so I went, and he immediately came at me swinging. Well, I had a hunch I was stronger, y\u0026apos;know, so I dodged it easily and fed him a counter.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOne side of the story. Of course, for Maki-kun, who had to listen, it probably wasn\u0026apos;t a story he could accept.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe tried to speak, not hiding his irritation, but his eyes met mine and he stopped himself just in time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was a risk that if he interrupted, he would be unilaterally branded the bad guy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf he stayed quiet, he would be given a chance to explain himself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed he had instinctively sensed that this was how the proceedings worked.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor a while after that, Kusanagi-kun continued his complaint that Maki-kun was entirely at fault, and when we determined that no further testimony would be forthcoming, we passed the turn to the long-suffering Maki-kun.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;He can just run his mouth all he wants. This guy conveniently left out everything that makes him look bad. In the first place, it\u0026apos;s \u0026apos;cause that bastard Kusanagi called me \u0026apos;defective\u0026apos; or whatever! I just wanted to make him take it back! And a \u0026apos;hunch\u0026apos;? No way, I was clearly the stronger one! You think I didn\u0026apos;t notice your legs trembling when you took that shot to the gut?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe yelled near Kusanagi-kun\u0026apos;s ear, his voice carrying all the irritation he\u0026apos;d been bottling up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eLooking slightly uncomfortable at Maki-kun\u0026apos;s words, he feigned ignorance, turning to look off in another direction to ignore him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eDefective goods\u003c/em\u003e. Now that\u0026apos;s a rather nostalgic phrase, isn\u0026apos;t it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs first-years in Class D, we were called the exact same thing. I wonder if that part of it, like some vile tradition, had been passed down at the school this year too.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePutting their stories together without emotion\u0026#x2014;-\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFirst, Kusanagi-kun made a remark mocking Maki-kun, calling him defective. Hearing this, an enraged Maki-kun called him out, went behind the dorms and demanded he take it back. However, Kusanagi-kun refused, and Maki-kun, unable to stand his attitude, couldn\u0026apos;t hold back and threw the first punch. The first blow didn\u0026apos;t land; instead, Kusanagi-kun\u0026apos;s counter hit its mark. From there, it became a fistfight of grappling and punching. As for the outcome, it seemed from the extent of his injuries that Maki-kun lost to Kusanagi-kun, but Maki-kun refused to admit it. He insisted that he\u0026apos;d been the one with the upper hand. On the other hand, Kusanagi-kun said that he won and that he stopped fighting the moment the victor was decided\u0026#x2014;or so he claimed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBecause their claims were complete opposites, it was impossible to judge either way.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKusanagi-kun glared again at Maki-kun, who\u0026apos;d just finished speaking, then his expression changed and he looked at me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, how should I say this... Student Council President, you understand my side of things, right? I mean, we\u0026apos;re both in Class A, after all. It was perfect self-defense.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis was the first time he used proper polite language with me, but I wasn\u0026apos;t so soft as to let my impression of him improve over something so simple.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The title of Class A is meaningless on its own. A fool in Class A will be punished, just as someone in Class D will be rewarded for good deeds.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;W-What? But\u0026#x2014;!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs if mentally slapping himself for trying to suck up to me, Kusanagi-kun\u0026apos;s attitude instantly changed again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSo even Class A has such violent-tempered students this year, huh.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It may be true that Maki-kun called you out, but that doesn\u0026apos;t mean it was right for you to retaliate so thoughtlessly. Especially since you immediately intuited that you were the stronger one, correct?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That is...!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, for someone so convinced of his own strength, you seem to have sustained some rather nasty injuries yourself, haven\u0026apos;t you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if Kusanagi-kun had a slight edge, they looked to be on about the same level.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThough he looked displeased, Kusanagi-kun averted his gaze at the remark.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026apos;Course you can\u0026apos;t answer that. You didn\u0026apos;t even win.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Shut the hell up, Maki. No matter how you slice it, I\u0026apos;m the stronger one.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf they didn\u0026apos;t apologize and reconcile as things stood, I would have to assign penalties based on the severity of their injuries\u0026#x2014;a ratio of four for Maki-kun and six for Kusanagi-kun.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was just as I\u0026apos;d begun to think that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In the first place, I didn\u0026apos;t even hit Maki this bad... Shit.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a slip of the tongue that escaped his lips unintentionally, rather than something he\u0026apos;d meant for us to hear.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNormally, I would have taken it as an act just to save his own skin, but Maki-kun, standing beside him, didn\u0026apos;t object to the remark at all; in fact, he made a gesture as if to ignore it. Given how things had gone up to this point, he absolutely should have argued back.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt that baffling behavior, Nanase-san and I exchanged a brief glance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What do you mean by that? When you say you \u0026apos;didn\u0026apos;t hit him this bad\u0026apos;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Nah, it\u0026apos;s nothin\u0026apos;.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It can hardly be \u003cem\u003enothing\u003c/em\u003e. Violence is violence, but it\u0026apos;s clear that Maki-kun has sustained more severe injuries. Combined with the school\u0026apos;s judgment, you may be the one to receive a harsher punishment. If that\u0026apos;s the case, shouldn\u0026apos;t you explain yourself properly?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe two of them, who never made eye contact except to glare at each other, momentarily met gazes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt looked like the kind of eye contact Nanase-san and I occasionally exchanged.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s nothin\u0026apos; more to say... What I just said is everything. Right, Maki?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah... Still, you\u0026apos;re definitely the one who\u0026apos;s worse, Kusanagi.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? Are you seriously still saying that?!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI supposed this was what one would call being back to square one.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If no new testimony is forthcoming, we will have to conclude matters here. Are you two really okay with this?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I also felt, from what I\u0026apos;ve heard, that both of you are equally at fault.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I restated the student council\u0026apos;s opinion, both showed their dissatisfaction and retorted, but they gradually fell silent. It seemed they understood that without new information, there would be no progress.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Fine, I get it. We just have to take the same punishment, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Tch... Then fine. This was a complete waste of time...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFollowing Maki-kun\u0026apos;s lead, Kusanagi-kun also reached that conclusion, albeit with some reluctance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt the very least, when they first showed up in the Student Council Office, they\u0026apos;d been trying to pin the blame on the other.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was clear that both sides hoped for a lighter punishment for themselves.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had Nanase urge them once more to speak if they had anything to say, but their hardened attitudes didn\u0026apos;t soften. As the student council couldn\u0026apos;t hold them indefinitely, we dismissed them for the day, sent them home, and told them the results would be delivered later.\u003c/p\u003e\u003ch2 class=\"heading_2\"\u003ePart 3\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIN THE NOW completely silent student council room, I sighed without reservation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If we wanted to, we could end this incident with a fair ruling, but...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;They don\u0026apos;t seem to be denying that they hit each other, but it\u0026apos;s clearly strange that they both started to accept punishment after that apparent slip of the tongue, wouldn\u0026apos;t you agree?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKusanagi-kun said he had the upper hand on his opponent, Maki-kun, and admitted to hitting him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOn the other hand, Maki-kun also said that he had the upper hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, there was a considerable difference in the extent of their injuries, and from what I saw, Kusanagi-kun had the advantage.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut... regarding the damage to his face, which was the deciding factor, an unexpected statement slipped out\u0026#x2014;that he hadn\u0026apos;t attacked hard enough to cause such an injury.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFurthermore, even though it was the perfect opportunity for Maki-kun to claim\u0026#x2014;even as a lie\u0026#x2014;that Kusanagi-kun had attacked him excessively to lighten his own blame, he overlooked the slip of the tongue and pretended not to hear it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Student Council President, what was your take on it? To me, it looked like Maki-kun didn\u0026apos;t want to admit defeat and prioritized his pride.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I suppose so. That\u0026apos;s a possibility, but... at first, it definitely looked like he wanted to pin the heavier blame on Kusanagi-kun. So it\u0026apos;s strange that he didn\u0026apos;t pursue that slip of the tongue. He could have claimed that he deliberately held back, but Kusanagi-kun didn\u0026apos;t stop attacking. Couldn\u0026apos;t he have protected his pride that way, too?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I answered, Nanase-san closed her eyes as if deep in thought.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOr perhaps... I tried to think about it from another direction.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Maybe... there\u0026apos;s someone else involved in this assault case.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThinking that, as I recalled their testimonies, I felt as if I was beginning to see a glimpse of the truth.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But Kusanagi-kun was the one who won the fight, wasn\u0026apos;t he? If this was revenge, wouldn\u0026apos;t it only make sense if Kusanagi-kun was the one who got the worst of it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It doesn\u0026apos;t necessarily have to be revenge, does it? It\u0026apos;s possible a third party punished Maki-kun for starting a fight and losing. Not that such a thing should be condoned, of course.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...I see. That\u0026apos;s one way of looking at it. But then it doesn\u0026apos;t explain why Kusanagi-kun wouldn\u0026apos;t report it. Is it because he\u0026apos;s afraid of becoming a target for the person who punished him... perhaps?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What I was just imagining is something similar to that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was understandable that if Maki-kun had been punished by someone like Ryuuen-kun or Housen-kun, even the winner, Kusanagi-kun, would lack the courage to speak up. But it was hard to imagine that they would go all the way to the first-year dorms just for a trivial squabble between freshmen. Besides, if there\u0026apos;d been such a vicious intervention from an upperclassman, there was no way they would\u0026apos;ve so brazenly tried to blame each other in the student council room; they would\u0026apos;ve been instructed to act remorseful and get through the matter without further incident.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThose two showed no signs of anything like that, and what came across for certain was that they were both confident in their fighting skills and very proud. However, they were also unwilling to tell the whole story. I could surmise that much.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But Student Council President\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I know. As far as I\u0026apos;m aware, there aren\u0026apos;t any boys among this year\u0026apos;s first-years who rule their surroundings with violence and fear like Ryuuen-kun or Housen-kun. That\u0026apos;s what you were about to say, wasn\u0026apos;t it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. I can\u0026apos;t think of a single male student who stands out enough to be ruling his class through fear.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWere they just good at hiding, or was it something else...\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI looked through the documents I received from Nanase-san again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShould I try to hear from the first witness who found the two injured...?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOr should I call in Maki-kun and Kusanagi-kun again, after they\u0026apos;ve had more time to cool off?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was also the option of speaking to them individually, but I had a feeling that carelessly wounding their pride wouldn\u0026apos;t lead to a solution.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Say, Nanase-san. Boys can be a bit childish in the way they think, don\u0026apos;t you agree?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hm, yes, I suppose so. I do think they have that side to them, to some extent. In fact, the two of them acted like children the entire time they were in the student council room.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. The problem is, both Kusanagi-kun and Maki-kun think they\u0026apos;re strong. That\u0026apos;s exactly why they were only concerned about who won or lost the fight, refusing to back down an inch and trying to pin all the blame on each other, even in a place where they could be punished by the student council.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What if someone took on both of them at the same time, two boys who are confident in their fighting skills?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You mean their pride was wounded because they lost a two-on-one fight? It\u0026apos;s not out of the question, but would they really be that tight-lipped about it? Couldn\u0026apos;t they have worked together to pin the blame on that single person?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But what if their opponent wasn\u0026apos;t a boy... but a girl... and just one at that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNanase-san, who was listening beside me, looked at me with a startled expression.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That could be it. For two boys who are boasting and insisting they didn\u0026apos;t lose the fight, I can see why they\u0026apos;d be too embarrassed to admit they lost to a high school girl.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis matter could be closed, since the two boys were accepting of their punishment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, if a third party was involved in this fight, that was a clear act of assault.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eConsidering their future here at school, this was a problem I wanted to correct now.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Since neither of them is filing a complaint, we have no choice but to investigate. Nanase-san, if you\u0026apos;re willing, could you help me uncover the truth?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course, Student Council President. But being the president is a lot of work, isn\u0026apos;t it? You\u0026apos;re amazing, Horikita-senpai.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m nothing special. I was told I was exceptional quite often back in middle school, but... Ayanokouji-kun, my brother, Nagumo-senpai... no, Sakayanagi-san and Ichinose-san are the same. Watching them up close, I\u0026apos;m always made keenly aware of it. To people like them, I\u0026apos;m... undoubtedly just another mediocre person...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was pathetic self-deprecation, but I voiced what I honestly felt.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps it was because the way Koenji-kun so easily brushed me off after school was still weighing heavily on my mind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor some reason, Nanase-san\u0026apos;s eyes widened in slight surprise as she stared intently at me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No\u0026#x2014;mediocre. Even so, I think that\u0026apos;s fine. A mediocre Horikita-senpai isn\u0026apos;t bad at all.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hmph... You know, hearing that repeatedly is starting to get on my nerves.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo matter how I looked at it, it sounded as though she were making a fool of me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;W-Wha\u0026#x2014;!? I-I\u0026apos;m so sorry! I think Student Council President Horikita is very admirable!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNanase-san lost her composure, looking truly panicked.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s too late to try and smooth things over now.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter pretending to be angry, I smiled and gently placed my hand on her shoulder.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll need you to lend me your strength for a while.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Y-Yes. Of course.\u0026quot;\u003c/p\u003e\u003ch2 class=\"heading_2\"\u003ePart 4\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI COULDN\u0026apos;T IGNORE the student council\u0026apos;s problems, but at the same time, I had duties to attend to as the class leader.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDespite feeling tired, I headed to Keyaki Mall for our meeting before 6:00 p.m.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was an important exam, no matter how small the reward or the change in Class Points.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd it was scheduled to take place either for a week starting tomorrow, or a week later.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn order not to lose, in order to win, I had to do what I could today.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI spotted a student standing at the entrance of the supermarket inside the mall and jogged over to her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Heya. The weather\u0026apos;s been pretty awful lately, huh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe person I met up with, Karuizawa-san, murmured.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s true. The rainy season isn\u0026apos;t supposed to start for a little while yet, though.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt rained all day last Sunday, too.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe forecast for now called for a little rain late at night, after midnight.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Thank you for coming shopping with me at this hour.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Nah, not at all. I was planning to go to the supermarket myself, so don\u0026apos;t worry about it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe both grabbed a basket and slowly walked from the fruit section near the entrance toward the vegetable section. As I picked up a golden kiwi that was on sale, I looked over at Karuizawa-san.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Did you have any particular thoughts while listening to the discussion after school today?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hmm, I dunno. Seemed like business as usual to me. Totally disorganized, everyone just says whatever they want... I mean, why are you asking for my opinion?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe replied with a wry smile, saying that it really wasn\u0026apos;t her kind of thing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was true that Karuizawa-san wasn\u0026apos;t normally the proactive type in serious discussions. She left most of the talking during our meetings to me, Hirata-kun, and the other more outspoken students.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We can\u0026apos;t keep doing the same things as always. That\u0026apos;s why I want to take a step toward changing things.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So that\u0026apos;s why you\u0026apos;re asking me? Well, normally, people wouldn\u0026apos;t bother asking me for advice on an exam, since I\u0026apos;m useless for that, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No. It\u0026apos;s true that I reached out to you because I want things to change. But I don\u0026apos;t think you\u0026apos;re useless, Karuizawa-san\u0026#x2014;unlike before.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI spoke those words honestly, prepared for her to get angry.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter all, lying and saying she\u0026apos;d always been someone I could rely on would have been far more disrespectful to her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re really merciless, Horikita-san. But, y\u0026apos;know, I like that about you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWithout so much as a grimace, Karuizawa-san laughed and accepted my true feelings.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe was far more clever of a person than I\u0026apos;d given her credit for.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a great takeaway to have that perception corrected.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well then, how \u0026apos;bout the \u0026apos;super-helpful me\u0026apos; lend an ear? So, Horikita-san, what do you think the main rule for this special exam is?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBefore I could ask a question, Karuizawa-san posed one to me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI found that strangely funny and I let out a laugh myself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlthough I was only able to join the after-school discussion for less than an hour, several potential ideas came from my classmates.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA standard written exam, a physical fitness test.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn addition, there were oral exams, presentations, a practical music test, and interviews. There was even talk of programming, art, and drawing exams.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn any case, the prevailing view was that some kind of test would be held in one week.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe reason so many people suggested an interview exam was likely due to the major influence of our approaching entrance exams and job searches as third-years.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eConsidering the one-week preparation time and the lack of an explanation of the rules, that possibility certainly couldn\u0026apos;t be ruled out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, the opinion also came up that there was no need to hide the rules for that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat\u0026apos;s because if it were an interview, it would be the kind of thing they should tell us about from the start.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn any case, there were suggestions ranging from plausible to unrealistic, but none of them felt definitive yet. Since some of the ideas overlapped, we could be more efficient if we narrowed them down.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEspecially for anything academic, the result would likely change drastically depending on whether it covered all subjects or just specific ones.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI told Karuizawa-san a few of my own thoughts.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe listened intently, which she should\u0026apos;ve found boring, without showing any sign of displeasure.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd so, the conversation moved onto more sensitive topics, the kind I could only discuss with Karuizawa-san.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This is just my guess, but I think Class C and Class D are connected.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKaruizawa-san brought it up just as we were approaching the condiment aisle.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ayanokouji-kun is lending Ichinose-san a hand... So that\u0026apos;s what you\u0026apos;re thinking, is it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah. I\u0026apos;m sure that\u0026apos;s how it went last time, and I think it\u0026apos;ll be something similar this time, too.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn a calm tone, Karuizawa-san answered while looking me straight in the eye.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe was the first to suggest that possibility as one of the reasons for our defeat in the last special exam.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, there was no proof of that for now. I\u0026apos;d sensed something strange about Ayanokouji-kun and Ichinose-san growing closer right after his transfer, but I hadn\u0026apos;t thought they\u0026apos;d progressed so far as to share information with each other.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What about you, Horikita-san?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...I don\u0026apos;t think the possibility is low. From Ayanokouji-kun\u0026apos;s perspective, it\u0026apos;s only natural that he wouldn\u0026apos;t want our class, Class A, to win. Since he can\u0026apos;t fight us directly, it\u0026apos;s easy to understand why he would give Ichinose-san information to let her win. He knows our class better than anyone else.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile I was unable to function, Hirata-kun and the others took the lead and selected the test members. I was sure that even if Ayanokouji-kun hadn\u0026apos;t seen it happen directly, he could\u0026apos;ve imagined it\u0026#x2014;what discussions took place and what conclusions they\u0026apos;d reach.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, Hirata-kun and the others weren\u0026apos;t at fault. I had a feeling that even if I\u0026apos;d participated in the discussions, the outcome would\u0026apos;ve been the same, although the process might have been different.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But this special exam isn\u0026apos;t necessarily a one-on-one battle. It\u0026apos;s possible Ayanokouji-kun could suffer a disadvantage by giving information to Ichinose-san.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That won\u0026apos;t happen.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Because he thinks he won\u0026apos;t lose even if he gives her information?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I asked that, Karuizawa-san gave a small laugh and denied it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If his goal in transferring to Class C was to raise it to Class A by himself, that\u0026apos;s a bit half-assed, you know? He should\u0026apos;ve just gone to the bottom-ranked Class D.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But isn\u0026apos;t that because a leader like Ichinose-san is already there? Class C was in a situation where Sakayanagi-san had been expelled, leaving them without a new leader.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If it were Ayanokouji-kun... he would\u0026apos;ve gone to Class D, even if it meant getting Ichinose-san expelled.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s\u0026#x2014;that\u0026apos;s taking it too far. He might be able to target her if there\u0026apos;s a risk of expulsion in a special exam, but... are you saying he was trying to get Ichinose-san expelled during the year-end special exam?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat special exam wasn\u0026apos;t one where you could intentionally get someone from the opposing class expelled. Its rules were structured around whether or not someone from within your own class would be expelled.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I can\u0026apos;t think of how he\u0026apos;d do it, but getting someone expelled isn\u0026apos;t just limited to special exams, is it? He might even be able to do it on an ordinary day like today.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps Karuizawa-san, who dated him, held Ayanokouji-kun in higher esteem than I did. Of course, I had no intention of arguing that she was overestimating him, but...\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Assuming that\u0026apos;s true... then why did he transfer to Class C, I wonder.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t know. But Ayanokouji-kun seems to always be thinking of something unimaginable, and he doesn\u0026apos;t seem to need Ichinose-san\u0026apos;s help to get to Class A. And yet, if he helped her out, I just figured he\u0026apos;d probably do it again this time.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWas this a favor intended to make future exams easier by having the lower-ranked classes join forces?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs long as his objective and the answer remained unknown, speculation was dangerous, but I had to keep it in the back of my mind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd if we were going to fight based on that assumption, I had to figure out the rules of this special exam, and its solution, as quickly as possible.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA late start the next day would truly be a fatal blow.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t think I would have a sharp flash of insight so easily just because I did something different from usual.\u0026#xa0;But I was certain that taking on new challenges like this would surely be helpful in the future.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if some might say it was too little, too late, I wanted to cherish what I realized now.\u003c/p\u003e\u003ch2 class=\"heading_2\"\u003ePart 5\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eQUITE SOME TIME had passed since Ayanokouji-kun transferred classes, but the wound in my heart hadn\u0026apos;t completely healed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe same must have been true for Karuizawa-san, whom I\u0026apos;d gone shopping with.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut we\u0026apos;d both become able to look forward and move on, more so than before.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI think I\u0026apos;d recovered enough to at least feign composure whenever I saw Ayanokouji-kun at school, at Keyaki Mall, or in the dorms.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKaruizawa-san had been the catalyst for my recovery, but another one was right in front of me\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;For a loser, your color\u0026apos;s looking a little better, Horikita.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It was just past 6:30 PM, and I had just returned from the supermarket. I heard a rough knock, and when I unlocked the door to my room,\u0026#xa0;Ibuki-san\u0026apos;s opening words were dripping with sarcasm.\u0026#xa0;It was hardly the attitude of someone about to come into another person\u0026apos;s room and be served a meal.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s thanks to your wonderful flying kick. I\u0026apos;m so very grateful.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn response to my sarcasm, Ibuki-san proudly puffed out her chest.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If it happens again, I\u0026apos;ll be sure to kick you then, too, so be grateful.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wondered if, in her head, she\u0026apos;d conveniently interpreted that as praise...\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe was making me regret ever having said that she\u0026apos;d helped, even a little, as a catalyst for my recovery.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo, more importantly, to prevent any future victims, it seemed better to explain that this was a real problem, rather than using sarcasm that wouldn\u0026apos;t get through to her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Kicking someone in the back from behind without warning is an extremely dangerous act, so don\u0026apos;t do that again. At the very least, you should never do it to anyone but me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was fortunate that I, the one who was kicked, had some knowledge of martial arts and that by chance the damage was kept to a minimum, but if the point of impact had been worse, I could\u0026apos;ve been seriously injured. I made sure to warn her firmly about that part.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, Ibuki-san didn\u0026apos;t take my words at face value and instead laughed mockingly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So it\u0026apos;s fine to do it to you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It is not fine. But I won\u0026apos;t be kicked by you again. After all, your prerequisite for kicking me was, \u0026apos;if it happens again,\u0026apos; wasn\u0026apos;t it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo think the precaution I\u0026apos;d taken would pay off so quickly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hmph. So you\u0026apos;re sayin\u0026apos; you\u0026apos;ve completely recovered, then.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I can say it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs if she found that completely unbelievable, Ibuki-san laughed as she kicked her shoes off messily and stepped inside. I picked up the disheveled shoes and rearranged them next to the two pairs that were already neatly lined up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOne pair belonged to me, the owner of this room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd the other pair\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What do you think, Kushida? About what Horikita just said.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIbuki-san called out, turning her gaze to the owner of the other pair of shoes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Unbelievable.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe answered instantly, without so much as a glance in my direction, her eyes fixed on her phone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s what she says.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Like you, she won\u0026apos;t readily agree with anything I say, so I pay it no mind.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI let out a soft sigh and moved from the entryway to the front of the kitchen.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen, while taking the groceries I bought at the Keyaki Mall supermarket out of my reusable bag, I turned back and called out to them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Just sit wherever and play on your phone like she is. I don\u0026apos;t mind if you watch TV, either.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t have to tell me twice.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIbuki-san plopped down in her usual spot and then glanced around the room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKushida-san, who was watching Ibuki-san out of the corner of her eye, muttered quietly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What\u0026apos;s with that look on your face? It\u0026apos;s disgusting.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? Whose face did you say is disgusting?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s only one other person nearby, so there\u0026apos;s no need to say a name, is there?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Could be Horikita. She\u0026apos;s got a gross face.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh, right. Yeah, that might be true. I guess that might\u0026apos;ve been misleading.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wondered if those two even realized whose room this was...\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But I was talking about you, Ibuki-san.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? What, what? Why are you trying to pick a fight all of a sudden? You want me to throw a pillow at you?\u0026quot; snapped the always-combative Ibuki-san.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s because you had this look on your face, like, \u0026apos;I\u0026apos;m so happy to be in Horikita-san\u0026apos;s room after so long~\u0026apos;.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Wha\u0026#x2014;? Wha\u0026#x2014;? I\u0026apos;m not happy! I just felt lucky I could get a free meal, that\u0026apos;s all.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Isn\u0026apos;t that what you call being happy?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Absolutely not!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eCasting a sideways glance at the living room, which had suddenly grown noisy with the addition of just one person, I began to cook with practiced hands. The ingredients I bought today cost twice my usual budget.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eStill, compared to when I had given up on cooking for myself for some time in favor of simple meals from convenience stores, the expense was low.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe noisy sound of their two voices, something I\u0026apos;d never found pleasant until just a little while ago.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut now, they reached my ears like strangely calming music.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA person\u0026apos;s state of mind changed drastically with just a small shift in their perspective and way of thinking.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven as I chopped the vegetables with a kitchen knife, I reflected once again on the situation I found myself in.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA little while ago, I told Ibuki-san a small lie.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy answer regarding my recovery. My assertion that I could say so with certainty.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was a clear lie.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI do believe I\u0026apos;d managed to crawl my way from the depths of despair to a much better place.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNevertheless, my wounded heart is far from fully healed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA lie told to prevent another victim of Ibuki-san\u0026apos;s kicks.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut the truth is, I wanted to lie to deceive myself into believing I was all right.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe reality that Ayanokouji-kun was gone was just that heavy\u0026#x2014;\u003c/p\u003e\u003ch2 class=\"heading_2\"\u003ePart 6\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTHE RICE COOKER, which I\u0026apos;d set ahead of time, beeped, announcing that the rice was cooked.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI immediately opened the lid, fluffed the rice with the paddle to release excess surface moisture, and evened it out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter that, I set the prepared meal down in front of Kushida-san and Ibuki-san.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;A hamburger steak made with domestic kuroge wagyu. Not just black-haired cattle, mind you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;K-Kuroge wagyu?! Th-This is pretty extravagant, isn\u0026apos;t it...!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThough bewildered, Ibuki-san spread her hands and gave the food an approving look.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You were the one who hoped to eat something nice, weren\u0026apos;t you? Also, your Japanese is a bit strange, so you should be more careful.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePointing this out with exasperation, I quickly resumed my preparations.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you\u0026apos;re gonna treat me this well, I wouldn\u0026apos;t mind stopping by every day, y\u0026apos;know?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I will have to firmly decline. Today is an exception.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So stingy, Horikita. Oh well, I\u0026apos;ll settle for a normal meal from tomorrow on.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t understand why she\u0026apos;d already decided that I would be treating her from tomorrow onward, but I ignored her, as engaging would only encourage her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt the very least, she seemed to have taken it as a genuine token of my gratitude and welcomed this elaborate meal.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA spread on the dining table, a cut above the usual.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI noticed that Kushida-san, too, had stopped fiddling with her phone and was now staring at the food.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It certainly is special, perhaps\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn contrast to the delighted Ibuki-san, Kushida-san grew more guarded.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There might be a catch to this. If you eat it carelessly, you might regret it\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed she\u0026apos;d tried to quickly warn Ibuki-san, but Ibuki-san was already in motion, lifting a side dish to her mouth with her fork.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So fast...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe ate with such vigor you could hear her wolfing it down.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was proof of how delicious it was\u0026#x2014;that once she started, she couldn\u0026apos;t stop\u0026#x2014;and a pleasant sight to behold. As the one who made it, it wasn\u0026apos;t a bad feeling at all.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Savage.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Who\u0026apos;re you calling a savage?!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThough her mouth was still full, she immediately retorted to Kushida-san\u0026apos;s jab.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I watched for a moment without touching my own food, a beaming Ibuki-san looked up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ve been flat broke lately, so a meal like this is an improvement.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was curious as to what kind of life she was leading, but I had more pressing matters at the moment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter all, Ibuki-san always left in a hurry as soon as she finished eating.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I want to hear both of your opinions.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;About the food?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No. Regarding Ayanokouji-kun, who has become quite the topic of conversation.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe moment she heard that name, Ibuki-san showed an overt, unconcealed look of disgust.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKushida-san, for her part, glanced at me once, her expression unchanging.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut her eyes seemed to say, \u0026apos;I knew it,\u0026apos; having already guessed the intent behind the special meal.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;About him transferring classes? If so, that\u0026apos;s old news by now, don\u0026apos;t you think?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs she spoke so nonchalantly, I wondered whether she felt no shock at Ayanokouji-kun\u0026apos;s departure, even though the guarantee that we could safely maintain our position in Class A had clearly vanished.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ayanokouji-kun is now our enemy... How can we defeat him?... Right now, I can\u0026apos;t see a way. I need a hint that will lead to a breakthrough.\u0026quot;\u003c/p\u003e\u003cimg src=\"/hola-lector-agua/images/books/ss-y3-v2/OEBPS/EGWpxXChgbpTWBkDPEcAf.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So it\u0026apos;s \u0026apos;three heads are better than one,\u0026apos; huh? If that\u0026apos;s the case, isn\u0026apos;t Ibuki-san a little out of her league?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I am perfectly aware of that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I replied to Kushida-san, Ibuki-san, who was still gripping her fork, lightly slammed her fist on the table.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I get that you\u0026apos;re making fun of me. You wanna get kicked?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I may be making fun of you, but I\u0026apos;m also trying to rely on you. With regard to this topic, at least, I\u0026apos;m hoping you might come up with some unexpected advice. After all, you\u0026apos;ve never seemed to like Ayanokouji-kun, have you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hmph. I get it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed she\u0026apos;d accepted my convoluted phrasing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, you totally don\u0026apos;t get it, Ibuki-san... Oh well, whatever.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIbuki-san picked up her fork again, shoveled a large amount of rice into her mouth, and after chewing thoroughly and swallowing, she snorted once more. Then she nodded while spinning her fork around impolitely.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Beat Ayanokouji, huh? That\u0026apos;s impossible.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Giving up so quickly? That\u0026apos;s rather unlike you. I do wish you\u0026apos;d put a little more thought into your words.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I am\u003cem\u003e\u0026#xa0;\u003c/em\u003ethinking. He\u0026apos;s as strong as a monster and surprise attacks don\u0026apos;t work on him. Sure, if he were an opponent I felt I could almost beat, I\u0026apos;d be fired up to get revenge next time, but he\u0026apos;s not on that level, and I get that now. That\u0026apos;s why I\u0026apos;ve already given up.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor Ibuki-san, who loved to fight, to say something like that was just what one would expect from Ayanokouji-kun\u0026#x2014;but that wasn\u0026apos;t the issue.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It seems that when you think of \u0026apos;defeating him,\u0026apos; you only consider it in a physical sense.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? Is there any other way?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNormally, one would assume I meant in terms of intellect, but I decided to positively accept this as another one of those ideas that only she could come up with.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Perhaps it might not be a bad idea to start by considering things from that angle.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was precisely because Ibuki-san was here that we could even have this kind of discussion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But I gotta ask, don\u0026apos;t you know the secret to his strength or something?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The secret to his strength...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Neither you nor I could even touch him. Even that Albert guy was like a kid in front of Ayanokouji. In terms of pure power, Ayanokouji shouldn\u0026apos;t have stood a chance, but it wasn\u0026apos;t even a contest.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe fork that\u0026apos;d been spinning on her fingertips stopped as she gripped it tightly in her hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe secret to his strength that Ibuki-san mentioned. When and where had he acquired that abnormal strength?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo, it wasn\u0026apos;t just his strength. I had a feeling his intelligence was also clearly different from that of an ordinary student.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Unfortunately, I don\u0026apos;t know anything... Because he never told me anything.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eAnd I was the one closest to him\u003c/em\u003e... I muttered such a self-deprecating thought to myself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re useless, aren\u0026apos;t ya. And here I was, thinkin\u0026apos; you and Ayanokouji were a package deal.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a painfully sharp remark that I couldn\u0026apos;t refute in the slightest.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf I could, I would\u0026apos;ve covered my ears with my hands to hide my pathetic self.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut even so, I was
