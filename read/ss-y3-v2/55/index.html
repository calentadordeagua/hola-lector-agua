6apos;t seem like the type to act like she\u0026apos;s carrying a mission.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Maybe. But aren\u0026apos;t you the same, Utomiya-kun? You don\u0026apos;t seem interested in things like Class A or special privileges.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAverting her gaze from Ayanokouji, Tsubaki turns her eyes to Utomiya, who is sitting next to her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSeeing this, Utomiya looks somewhat awkward and turns his face away, towards the outside window.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s Housen and Nanase.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hm...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the line of sight of Utomiya, who was muttering to change the subject, were two first-year Class D students who were about to pass by Ayanokouji.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt looked like there might be some kind of contact, but there was no exchange of words, only Nanase giving a polite nod.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Coincidence? Or not?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I can\u0026apos;t say anything just from that. But the bandage on Ayanokouji\u0026apos;s left hand\u0026#x2014;it piques my interest a bit.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;He was wearing something like that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTsubaki, who hadn\u0026apos;t noticed, shifted her gaze to Utomiya once again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Maybe something had happened. Knowing Housen\u0026apos;s personality, it wouldn\u0026apos;t be surprising if he started it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You mean he injured his hand? Housen-kun looked unharmed, though.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If they clashed somewhere, Ayanokouji probably chose not to fight back. There\u0026apos;s a risk in carelessly injuring your opponent.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh? But for that to happen, wouldn\u0026apos;t Ayanokouji-senpai also need a certain level of skill?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;His actual fighting ability is unknown, but I can\u0026apos;t imagine him losing to someone at Housen\u0026apos;s level. I can tell that much just by watching his usual demeanor and presence.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026apos;Housen-kun\u0026apos;s level\u0026apos;... Are you serious? He seems to just rampage around as he pleases, though.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat surprised Tsubaki was not the high evaluation of Ayanokouji, but the low estimation of Housen.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s just because everyone around him is weak. \u0026#x2015;\u0026#x2015;Probably.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFeeling he had said too much, Utomiya trailed off.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMen are creatures who bluff. Most of them inwardly believe they are stronger than whoever they face.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was a good chance that Utomiya\u0026apos;s remark was just a bluff, or that he simply had an abnormally high self-assessment, but he wasn\u0026apos;t usually one to behave like that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor the first time, Tsubaki felt a slight interest in her classmate, Utomiya.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I think I\u0026apos;ve become a little interested in getting to know you, Utomiya-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Stop it. I don\u0026apos;t pry into anyone\u0026apos;s business, and I don\u0026apos;t want anyone prying into mine.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ahh~. What a nice atmosphere~. Could it be that you two are dating?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA shadow fell between the two, and a girl appeared as if to interrupt them. It was Amasawa from first-year Class A.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We are not dating.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUtomiya denied it instantly. Tsubaki also nodded in agreement, not seeming particularly interested.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You think so? For that, your sense of distance seemed pretty close, though~\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s your imagination. Did you approach us just to say something so stupid? Or did you come over because you wanted to extract some information from us?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen Utomiya retorted in a harsh\u0026#xa0;tone, Amasawa smiled, her lips curling in delight.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh, come on, I didn\u0026apos;t mean it like that. Even if our classes are different, we\u0026apos;re still first-years, so let\u0026apos;s get along. Right, Tsubaki-chan?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sorry, but I\u0026apos;ll pass. I\u0026apos;m not exactly looking for friends.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So harsh, meow~\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWithout looking particularly shocked, Amasawa gave a cute reply.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well then, I guess I\u0026apos;ll save deepening our friendship for next time. See you later, Tsubaki-chan, Utomiya-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSaying that, Amasawa left behind a blown kiss, turned her back, and walked away.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Amasawa doesn\u0026apos;t know about the special exam, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;She shouldn\u0026apos;t. In Class A, only Takahashi and Ishigami know. However, I can\u0026apos;t deny the possibility that they asked her to investigate even without knowing the details.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But in any case, it\u0026apos;s a baffling exam. To think it\u0026apos;s targeting a specific individual, only Ayanokouji.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It might be something that\u0026apos;s normal at this school, and we just don\u0026apos;t know about it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...If that\u0026apos;s the case, it makes the situation\u0026#xa0;even more unsettling.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hello, Utomiya-kun. And Tsubaki-san as well.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA voice calls out from a short distance away.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYagami from first-year Class B, who had come to the cafe, stopped and approached the two.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Now it\u0026apos;s Yagami... He\u0026apos;s the type to show up if you talk about the exam.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Can you blame him? The amount of private points you can get is on a whole other level.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you don\u0026apos;t mind, could I join your conversation as well?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We were just having a boring small talk, that\u0026apos;s all.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It didn\u0026apos;t look that way to me. It seemed you were watching Ayanokouji-senpai and Housen-kun\u0026apos;s group.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh... So you\u0026apos;ve been watching us from quite an early stage.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It was just a coincidence, though.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Either way, we\u0026apos;re enemies.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s precisely because we are enemies that there is meaning in talking to each other, don\u0026apos;t you think?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUtomiya, Tsubaki, Housen, Nanase, Yagami.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat they all had in common, Yagami included, was that they were all targeting Ayanokouji Kiyotaka.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTsubaki and Utomiya had no way of knowing, but Amasawa was also involved in a certain special exam for first-year students.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom this gathering, the story connects to the upcoming special exam on the uninhabited island\u0026#x2015;.\u003c/p\u003e\u003ch1 class=\"heading_1\"\u003e\u003ca class=\"heading-link\" href=\"/read/ss-y3-v2/2\"\u003eLegacyEMTLs Afterword\u003c/a\u003e\u003c/h1\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFirst off I would like to apologize for all the delays with releasing this volume. We certainly felt the impact of missing some staff. Anyways, I would like to thank everyone who helped with translating, editing, and typesetting this volume. It was certainly a beast. I would also like to thank you, the reader, for choosing our translation to read. We certainly wouldn\u0026apos;t be here without you. I hope you enjoyed this volume as much as I did. Anyways, peace \u0026#x270c;\u0026#xfe0f;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: right\"\u003e\u003cem\u003e- Colibri\u003c/em\u003e\u003c/p\u003e\u003ch1 class=\"heading_1\"\u003e\u003ca class=\"heading-link\" href=\"/read/ss-y3-v2/2\"\u003eLegacyEMTLs Credits\u003c/a\u003e\u003c/h1\u003e\u003chr/\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003eColibri - Lead / Dev\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\"\u003eI dead\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003eFS7 - JE Checker\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\"\u003eI miss Arisu\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003e1chi - English Editor\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\"\u003eAh yes, Kinu\u0026apos;s masterful baiting shenanigans never end. This time it\u0026apos;s Hiyori. Can\u0026apos;t wait for Kushida\u0026apos;s turn.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003eHiyori\u0026apos;s Only Lover - English Editor\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\"\u003eHmmmm, I don\u0026apos;t know what to say. This volume was decent. But I don\u0026apos;t what to feel regarding Hiyori\u0026apos;s situation, you never know what kinu will do. Soooo nasty, the King.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003eWriter - English Editor\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\"\u003eTeehee no clue what this is about but yay!!!!!\u003c/p\u003e\u003cp class=\"paragraph\"\u003eLife\u0026apos;s good teehee\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003eSky - English Editor\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\"\u003eStill waiting for Hiyori to carry the whole novel, any day now...\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003eAxcel - JE Checker\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\"\u003e\u0026quot;Farewell, My Lovely\u0026quot;\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003eStella - JE Checker\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\"\u003eI fear for Hiyori\u0026apos;s future. Many red flags... But I\u0026apos;m also curious to see Kiyotaka\u0026apos;s development!\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003eKall_tho - English Editor\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\"\u003eStill obsessed with Honami-chan iykyk :P\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003e3F - Illustrator\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\"\u003eFnck y3 illustrations and fnck every fncking character who\u0026apos;s illustrated as a spaghetti doodle.\u003c/p\u003e\u003c/div\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Special Short Story: The Six First-Year Students\",\"volumeId\":\"ss-y3-v2\",\"chapterIndex\":55,\"prevChapter\":{\"volumeId\":\"ss-y3-v2\",\"chapter\":54,\"title\":\"Shiraishi Asuka’s Short Story: The Voice Hidden Within\"},\"nextChapter\":\"$undefined\",\"toc\":[{\"label\":\"Ichinose Honami’s Short Story: To Love Too Much…\",\"href\":\"ss-1.xhtml\",\"index\":51},{\"label\":\"Morishita Ai’s Short Story: Ear Gun\",\"href\":\"ss-2.xhtml\",\"index\":52},{\"label\":\"Shiina Hiyori’s Short Story: A Wavering Heart\",\"href\":\"ss-3.xhtml\",\"index\":53},{\"label\":\"Shiraishi Asuka’s Short Story: The Voice Hidden Within\",\"href\":\"ss-4.xhtml\",\"index\":54},{\"label\":\"Special Short Story: The Six First-Year Students\",\"href\":\"ss-5.xhtml\",\"index\":55}],\"volumeTitle\":\"Short Stories: Volume 2\",\"detailsLink\":\"/select/year-3/ss-y3-v2\",\"returnLink\":\"/select/year-3?contentType=shortStories\",\"currentSpineIndex\":55,\"nextVolumeLink\":\"$undefined\",\"nextVolumeTitle\":\"$undefined\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\
