ust as difficult as finding a book.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I happened to glance at the librarian at the entrance, she gave me a warm smile and then pointed a finger without a word.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat direction was the area where the mystery novels were shelved.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eApparently, the person I was looking for was there.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I slowly approached the spot, which was still some distance away, Hiyori appeared from behind a bookshelf.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBefore long, in the sparsely populated library, our eyes met.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut in the next instant, she averted her gaze and disappeared deeper into the shelves.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI thought our eyes met, but could it be that she hadn\u0026apos;t noticed me?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eCalling out from a distance would be a breach of etiquette, so I headed for the bookshelves.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe was no longer where I\u0026apos;d last seen her, so I began checking the aisles between the shelves.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOne, two, three...\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhere was she? I couldn\u0026apos;t imagine she had gone that far\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as I was thinking that, I finally found Hiyori at the end of the aisle, on the opposite side of the bookshelf where I stood.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd our eyes definitely met.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOr so I thought, but she immediately broke her gaze and vanished into another aisle.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe definitely noticed me. If so, does that mean she\u0026apos;s avoiding me?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWas it because I was late in coming to see her? Because I didn\u0026apos;t transfer to Ryuuen\u0026apos;s class?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I speculated on the reason, I closed the distance to talk to her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf she continued to run away from me inside the library, then I would have no choice but to give up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI couldn\u0026apos;t bring myself to forcibly corner someone who was clearly reluctant.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHoping that wouldn\u0026apos;t be the case, I walked toward the spot where I\u0026apos;d last seen Hiyori.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhere did she go from there...?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as I was thinking that, Hiyori, perhaps wanting to see where I\u0026apos;d gone, peeked out from behind a nearby bookshelf.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe distance was less than two meters. Close enough that if I stepped forward and reached out my arm, I could easily touch her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hiyo\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI tried to call her name, but she hid her face again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut she didn\u0026apos;t run away again; it seemed she\u0026apos;d only hidden her face.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs proof, her hand rested on the bookshelf and a part of her uniform was visible.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Was I bothering you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I spoke in a quiet tone, her face slowly emerged after a brief silence.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Did you come here to look for a book to read...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt least she replied. For now, I was relieved about that.\u003c/p\u003e\u003cimg src=\"/hola-lector-agua/images/books/ss-y3-v2/OEBPS/LlMgAFLkskDfsqQkPbLJr.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, I came to see you today, Hiyori.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe meaning of my words must have gotten through, but Hiyori still wouldn\u0026apos;t come out from behind the bookshelf, keeping half her body hidden. I was reminded of the words of Ishizaki from the other day.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026apos;Make sure you see Shiina soon. She was pretty down, even if not as much as I was.\u0026apos;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd then there was the somewhat awkward atmosphere from when we were in the elevator together a few days ago.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhy hadn\u0026apos;t I come to see her sooner?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI now regretted that I\u0026apos;d been running away from the guilt I felt over transferring classes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you still bothered by the fact that I rejected your class\u0026apos;s invitation and transferred to Class C?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI decided that we would not be able to have a satisfactory conversation without first eliminating any unnecessary distance between us, so I posed the question. Hiyori, who immediately showed her agitation, averted her eyes, which had been trying to meet mine and pressed her lips tightly together.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I suppose I can\u0026apos;t say... that I haven\u0026apos;t been concerned. I kept imagining that maybe my invitation was the reason you were keeping your distance, Ayanokouji-kun...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s quite unlike you. You of all people should know that\u0026apos;s not possible.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf anything, the Hiyori in my mind was always unhurried and did things at her own pace.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI saw her as a person who could look at matters calmly, with a discerning eye, without ever growing flustered.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI assumed she understood, without me needing to say a word, that my transfer from Class A to Class C had a purpose that could only be attained by joining that class.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was no way she\u0026apos;d distance herself just because her invitation was rejected.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, it was an undeniable fact that I\u0026apos;d delayed coming to see her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I apologize again for not being able to accept the transfer to Class B. And for taking so long to properly talk about it. That caused the misunderstanding.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the silence of the library, Hiyori took in my words, then shook her head.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No... You\u0026apos;ve done nothing wrong, Ayanokouji-kun. The class transfer... how should I put it... was just me getting my hopes up on my own... And even though I thought there might be a reason on my part for why you weren\u0026apos;t visiting, I couldn\u0026apos;t bring myself to come see you. Please allow me to apologize for that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter she said that, the rest of her body, which had been hidden, slowly came into view.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen she bowed her head, as deeply as she possibly could.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd yet, Hiyori didn\u0026apos;t have a single thing to apologize for.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat being said, continuing this apology contest wouldn\u0026apos;t lead to anything productive.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I thought I was prepared...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Prepared?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We\u0026apos;re in different classes now, Ayanokouji-kun. I thought that our relationship, where we could chat so familiarly, had to come to an end... But talking with you like this... I suppose...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSo she\u0026apos;d been trying to sever our friendly relationship and resolve herself to see me as an enemy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRealizing that, I felt a sense of relief that I made it in time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you don\u0026apos;t mind, Hiyori, why don\u0026apos;t we talk about this past month we\u0026apos;ve been apart? We have plenty of time today.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is it... really okay?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course. I came here today because I wanted to see you and talk with you, Hiyori.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I told her my honest feelings, a smile appeared on Hiyori\u0026apos;s face for the first time that day.\u003c/p\u003e\u003ch2 class=\"heading_2\"\u003ePart 2\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWE SAT FACING each other in the empty seats of the library.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen, as if to fill the one-month blank, we began to string together words little by little. At first, Hiyori, who had a somewhat distant atmosphere, gradually returned to her usual smooth and gentle tone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So, even after becoming a third-year student, the bookworm remains unchanged.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. In fact, I just finished reading another one last night.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe looked once at the bookshelf lined with mystery novels and replied that she\u0026apos;d just returned it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah, actually, I\u0026apos;ve made one more friend who\u0026apos;s a fellow reader.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHiyori clasped her own hands together and her eyes narrowed with joy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ever since I became a third-year, Kaneda-kun has been visiting me often at this time.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Kaneda? Well, I can picture him reading a book, so I\u0026apos;m not particularly surprised...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eStill, until the end of the second year, I\u0026apos;d never once seen Kaneda in the library.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf he was considering going to university, the library was also an excellent environment for studying.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah, speak of the devil.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHiyori, whose back was to the library entrance, noticed Kaneda\u0026apos;s arrival before I did and waved.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI also turned around and raised my hand in response to Kaneda, who was looking this way.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKaneda showed a slightly surprised face but immediately started walking and came to our table.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Hello, Shiina-shi. I\u0026apos;ve come again today.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy guess was correct; along with the library books, he also had academic books in his hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Kaneda-kun, you really do love books, don\u0026apos;t you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was clear from Hiyori\u0026apos;s words that he was a frequent visitor. When I gestured with my eyes for him to sit in the seat next to me, he gave a slight nod and sat down.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes, well. I\u0026apos;ve heard that you, Ayanokouji-shi, also used to frequent the library. It seems you haven\u0026apos;t shown your face recently, though.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor the past month. It was precisely when Kaneda started coming to the library that I\u0026apos;d been unable to come.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It seems like we\u0026apos;ve been swapping places. I think we\u0026apos;ll have more chances to meet from now on.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...I see. As a fellow reader, that\u0026apos;s nothing but delightful.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe showed a welcoming stance, but his expression showed no joy. It was no surprise, since my presence had no direct bearing on him. The only one who would be truly happy about gaining another reading companion would probably be Hiyori right in front of me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Be that as it may, you seem to have been busy. The matter of your transfer from Class A to Class C surprised me a little\u0026#x2014;no, quite a bit\u0026#x2014;hmm?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA sudden shadow fell over us, its source being the librarian.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m sorry to interrupt your conversation. Shiina-san, this is sudden, but could you lend me a hand? I don\u0026apos;t think it will take long\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If I\u0026apos;m the one you need, of course I\u0026apos;ll help. You two, if you don\u0026apos;t mind, please wait just a little. I\u0026apos;ll recommend some books to you later.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eLeaving us with those words, Hiyori left her seat with the librarian.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNow, just the two of us, Kaneda and I, who were not particularly close, were left behind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was often the case that the atmosphere became a little awkward when a mutual acquaintance left. I learned such things through my school life.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI suppose I would try to take the lead in the conversation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What kind of books do you usually read, Kaneda?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m not very good at such meaningless small talk.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA clean rejection. It\u0026apos;s like I threw him the conversational ball, and he just chucked it out into left field. I thought I started a natural topic since he liked books, but it seemed to be a question Kaneda disliked. Or perhaps my throw was clumsy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;My bad. I apologize if my wording offended you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWas it an unbefitting overestimation to think that I could hold my own in a situation like this?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...No, my apologies as well. There\u0026apos;s no need to be so down about it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I was just trying to connect the conversation smoothly. Really.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I got that sense, somehow.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you don\u0026apos;t want to talk to me, you don\u0026apos;t have to force yourself.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...This is rather unsettling. It\u0026apos;s not that I dislike it, but I don\u0026apos;t often have the opportunity to talk with you face-to-face like this, Ayanokouji-shi, so I couldn\u0026apos;t help but think about various things. Until Shiina-shi comes back, shall we talk for a bit, if you\u0026apos;d like?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was a little happy to see Kaneda showing a positive attitude toward conversing with me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If there\u0026apos;s anything on your mind, you can ask me. Of course, I can\u0026apos;t give unlimited answers regarding class problems.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI thought Kaneda would understand that, but I told him just in case.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKaneda took off his glasses, breathed on the lenses, and wiped both of them with a cleaning cloth he took from his pocket. Then he slowly put his glasses back on.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;With Shiina-shi\u0026#x2014;you seem to be on good terms.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hm? Oh, it\u0026apos;s because she\u0026apos;s a fellow bookworm, like you, Kaneda. I have her keep me company.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;A fellow bookworm, you say? That may certainly be true, but the expression I saw on Shiina-shi\u0026apos;s face from a distance just now was one I haven\u0026apos;t been able to see this past month. When I saw you two from the entrance, I was frankly surprised. It was the first time in a long while I\u0026apos;d seen her genuine smile.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That might have been my fault. I just apologized to Hiyori and she forgave me. So from now on, I imagine you\u0026apos;ll be able to see her smiling in class and in the library, just as she did before.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI kept to myself the part about her inviting me to transfer classes. It wouldn\u0026apos;t have been pleasant to tell Kaneda, who was not only from a rival class, but also close to Ryuuen and I had no idea how that information would be interpreted.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Do you realize just how amazing that is?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Amazing?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You don\u0026apos;t understand? No... are you pretending that you don\u0026apos;t? Ayanokouji-shi, have you ever felt like you\u0026apos;re blessed?\u0026quot; he asked me as if to test me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Blessed? That\u0026apos;s far too broad a definition for me to answer.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;My apologies. It seems my words were insufficient. Even from my perspective as a man, your features are quite excellent, Ayanokouji-shi. You\u0026apos;re also taller than average and well-built, yet you don\u0026apos;t give off a needlessly intimidating air. More than anything, you have an impeccably clean-cut appearance. And on top of that, it seems you were dating Karuizawa-shi until recently and lately, I\u0026apos;ve even been hearing rumors about you and Ichinose-shi. The more other men learn about you, the more they will look at you with admiration and, at the same time, feel a fierce jealousy at the immense gap between you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy interest was piqued by Kaneda\u0026apos;s unexpected words and I listened intently.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not just your appearance. In terms of academics, you\u0026apos;re increasingly being called the number one student in our year by those with high academic ability. I was once proud to think that my own academic ability was not inferior to yours, Ayanokouji-shi, but I\u0026apos;m now ashamed of that and couldn\u0026apos;t help but laugh at myself. Furthermore, concerning your physical abilities, it seems you\u0026apos;ve been achieving excellent results in PE since April. As for me, someone who is poor at sports, I could stand on my head and still not come close to your potential\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSo this was Kaneda Satoru, a student who could speak so eloquently and passionately.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe praised me while simultaneously disparaging himself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen looking at student values across the entire year, Kaneda was in the top thirty percent. I saw no reason for him to needlessly belittle himself, but...\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile forcefully heaping praise upon me, Kaneda continued.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And now, you\u0026apos;ve unleashed the true abilities you\u0026apos;d hidden for two years and have even taken up the position of leader to rebuild Class C now that Sakayanagi-shi left. Even that somewhat dangerous mind of yours must surely captivate many. You\u0026apos;re the very picture of a hero, are you not? I envy you from the bottom of my heart.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Envy me? I\u0026apos;m a traitor who abandoned Class A and objectively speaking, not using the power I possessed and hiding my true abilities would more likely be judged as villainous.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That just makes you an anti-hero, which is still a hero.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith a hint of a dry, exasperated laugh, Kaneda glanced behind him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy eyes followed his and I saw Hiyori, who seemed to be working on a computer with the librarian. It looked like it would be a while longer before she returned.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOne thing I could tell for certain from Kaneda\u0026apos;s attitude and words, was that he held feelings for me that were stronger than I\u0026apos;d imagined. I was aware that transferring classes would lead to various opinions being directed at me, but his ranked high among them. At first, I thought his comments were out of consideration for his class leader, Ryuuen, but it didn\u0026apos;t seem to be only that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd one thing was for certain: Kaneda didn\u0026apos;t like me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah... my apologies. It seems I\u0026apos;ve gotten carried away and talked too much.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed Kaneda realized how his words must have sounded to me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s nothing to apologize for. People are free to think what they want of others.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even that part of you is so cool it\u0026apos;s infuriating, Ayanokouji-shi. Even if you\u0026apos;re prepared to be hated, I\u0026apos;m sure it doesn\u0026apos;t feel good to actually be hated by someone. Or is it simply because it\u0026apos;s me, you don\u0026apos;t care what I think of you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s not it. I would say the same thing in the same way to anyone.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI\u0026apos;d proceeded this far on the assumption that I would be hated.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2014;Then, what if that person were Shiina-shi...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd then, Kaneda brought up Hiyori\u0026apos;s name.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe was, indeed, one of the most appropriate students to use as an example in that situation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI intended to reply immediately just as before, but the words caught in the back of my throat.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t mind if Hiyori hated me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYes, in essence, that was true.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI knew that was a possibility after I rejected Hiyori\u0026apos;s invitation and transferred to Class C.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe reason I hadn\u0026apos;t gone to apologize right away was because I needed to prioritize other matters.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat she thought was a secondary, or even tertiary, concern that I placed low on my list of priorities.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Please, forget I asked. That was an indelicate question.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWithout waiting for my reply, Kaneda quietly pulled back his chair and stood up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I think I will be leaving for today.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you sure? Hiyori looked like she wanted you to wait.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s quite all right. It makes no difference whether someone like me is here or not right now. I apologize for the one-sided conversation.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, don\u0026apos;t worry about it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is that so? Then I am grateful for your magnanimity.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eLeaving behind an air of resolution, Kaneda departed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA short while later, Hiyori returned, looking around curiously.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh? Are you all alone, Ayanokouji-kun?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eApparently, he hadn\u0026apos;t called out to Hiyori, who was near the entrance, before he left.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah. He left, apparently on urgent business. He asked me to tell you he\u0026apos;ll be back again soon.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is that so? That\u0026apos;s something to look forward to.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSeeing her gentle smile, it seemed she was genuinely looking forward to his next visit.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI arbitrarily assumed that Hiyori spent the past month all alone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut in reality, she\u0026apos;d been gradually expanding her circle of friends and found time to spend with Kaneda in the library.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I thought about it, there was nothing strange about it at all.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as I\u0026apos;d changed classes and friends, the number of people I interacted with slightly increased, Hiyori, too, changed since we first met.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe\u0026apos;d met someone new somewhere and was growing closer to that person.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA mere classmate. A mere underclassman, an upperclassman.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom such relationships, they become friends and then best friends.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePeople much closer to her than I was would appear one after another in Hiyori\u0026apos;s future.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps someone else might be sitting in the empty seat next to her tomorrow\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eLooking at her as she lowered her gaze to her book, I was surprised by my own arbitrary thoughts.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWho was getting close to whom was nothing more than a piece of information.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSomething to be judged solely on whether or not it could be used in the future.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd yet, I was indulging in useless and arbitrary speculation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was trying to see an invisible someone next to Hiyori.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t know why I\u0026apos;d become unable to see her in the same way I saw other students.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSame sex, opposite sex. Friend, best friend.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI interacted with many students without being bound by things like gender or how close we were.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile there were varying degrees of compatibility, like whether our hobbies matched or if we seemed likely to get along, I basically never accepted or avoided someone for those reasons alone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, with this much noise interfering with my thoughts, I had no choice but to admit it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat Hiyori was perhaps a little different from the frameworks I\u0026apos;d used until then.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was different from willfully moving a category from right to left.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSomething that\u0026apos;d been on the right side until yesterday moved to the left before I knew it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust reading books and sharing the same space together filled me with a sense of fulfillment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf I were to describe it in a word, it was \u0026apos;happiness\u0026apos;.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat expression was probably the closest fit.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t as if the time we\u0026apos;d spent together was particularly long, nor had we exchanged many conversations in a short period.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut thinking back, I naturally felt a sense of familiarity with her from early on.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer name too\u0026#x2014;it wasn\u0026apos;t like I started calling her Hiyori because she asked me to.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn other words, it wasn\u0026apos;t a name I used with a purpose.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBefore I knew it, I\u0026apos;d been staring intently at Hiyori\u0026apos;s face as her gaze fell upon her book.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHiyori didn\u0026apos;t notice my gaze for a while, but in a brief moment, she looked my way and our eyes met as if it were the most natural thing in the world.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is something the matter?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eLooking at Hiyori\u0026apos;s face calmed my heart.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was no doubt that saying something like that would only make her uncomfortable.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAround just after 6:00 p.m., Hiyori and I left the library and then the school.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is it okay if I stop by the library again tomorrow?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course it is. Besides, you don\u0026apos;t need my permission, you know?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps finding my attempt to ask for confirmation amusing, she placed a hand to her mouth and chuckled softly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Maybe it\u0026apos;s because I kind of see the library as your home.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s... not entirely wrong, I suppose. I\u0026apos;m here every day unless I have other plans.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI felt like I would mistakenly assume she caught a cold if she wasn\u0026apos;t there. After thinking that, I recalled a time when Hiyori had stopped appearing in the library for a while. It was around when the news that Karuizawa and I were dating spread around school. While it was true we were merely reading companions, Hiyori had been considerate by doing things like changing the times she visited.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt the end of Hiyori\u0026apos;s gaze, I found a small pull cart, wheels rattling, slowly making its way toward the main gate.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMany colorful flowers were lined up on its bed, beautiful even from a distance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs the two of us stood there watching it pass by, the middle-aged woman pulling the cart noticed us and stopped right in front of us.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I got special permission to sell here today. Would you like to take a look?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is it alright?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter being spoken to so kindly, Hiyori happily narrowed her eyes and approached the cart\u0026apos;s bed. I also stood beside Hiyori and looked down at the flowers.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKeyaki Mall didn\u0026apos;t have a flower shop. If you wanted to give flowers for a birthday or the like, you had to get artificial flowers from the general store or order them online. So, it was refreshing to see them being sold like this. From cut flowers like baby\u0026apos;s breath to potted hydrangeas. A small number of other assorted plants were also there.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;They\u0026apos;re beautiful...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHiyori said to the flowers beside me, looking hesitant, as if deciding which one to buy. After waiting a little while, she reached out her hand as though she\u0026apos;d found the one she wanted.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;May I have this one, please?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat Hiyori pointed to as she spoke was a single, carefully wrapped corn poppy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Just one?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. I thought it was lovely, precisely because it\u0026apos;s a single flower.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not about the number of flowers, young lady.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe clerk said so with a bright smile and explained that it was called a \u0026apos;single wrap.\u0026apos;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then I\u0026apos;ll take one of these.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI took out my phone and asked to pay for it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah, um, no, Ayanokouji-kun. I\u0026apos;ll buy it myself\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s fine. I want to give this to you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI told her that, and just as Hiyori looked up at me, I continued.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s an apology for making you wait a month. Though this might not be much of one.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust a single corn poppy. Price-wise, it didn\u0026apos;t even cost 400 points; it was a very cheap purchase.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s not true at all. I\u0026apos;m very happy.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter she bowed her head, it seemed to me that her face was slightly flushed when she looked up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe sky had been dyed by the sunset in an instant; perhaps that was the reason.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Then, I gratefully accept.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA voice of gratitude so quiet, one might have missed it if not close by.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter I paid, the clerk handed it to me instead of Hiyori, looking back and forth between us, and then said, \u0026quot;Thank you very much.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe just stood there and quietly watched the pull cart until it was out of sight.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter we were alone again, I handed the single corn poppy I was holding to Hiyori.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Thank you so much.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No need to thank me. It\u0026apos;s just for my own satisfaction, a selfish apology.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat\u0026apos;s how I answered, but the truth was a little different. I simply wanted to give Hiyori a present.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI genuinely want her to be happy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe corn poppy\u0026#x2014;a gift given from such an impulsive action.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eClutching that single small flower to her chest, Hiyori stared intently at me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe was certainly smiling with joy the moment our eyes met.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut as we continued to gaze at each other, her expression gradually began to change.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe showed an unexpected expression.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why are you crying?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps Hiyori, whose eyes were faintly glistening with tears, hadn\u0026apos;t noticed it herself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe hurriedly wiped at the corners of her eyes with her slender, white fingertips.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;For me, this was supposed to be just another ordinary day until I met you, Ayanokouji-kun. But it\u0026apos;s now become such a happy and fulfilling time... it feels like a dream, I can\u0026apos;t believe it...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer voice, which sounded as if it were squeezed from her very heart, continued.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m so happy... I\u0026apos;m so very happy. That we didn\u0026apos;t end up drifting apart, Ayanokouji-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eStrangely enough, I was in the exact same state of mind as Hiyori.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s much the same for me. This was supposed to end as just another ordinary day. But it\u0026apos;s turned into a very fulfilling one\u0026#x2014;it\u0026apos;s true.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf Hiyori\u0026apos;s words weren\u0026apos;t false, then it meant our feelings were mutual.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor some reason, this supposedly meaningless synchronization felt ticklish and it made me happy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBeneath the sunset-dyed sky.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI deeply burned the image of her into my mind\u0026#x2014;clutching the corn poppy, her eyes glistening.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSo that, from now on, I could remember it at any time\u0026#x2014;\u003c/p\u003e\u003ch2 class=\"heading_2\"\u003ePart 3\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWHEN I RETURNED to the dorm lobby, Hashimoto, who\u0026apos;d been sitting on a sofa, saw me and stood up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sorry, Shiina. I\u0026apos;m gonna borrow Ayanokouji.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThough he offered a light apology, Hashimoto gave her no room to refuse, but Hiyori showed no sign of displeasure and bowed cheerfully. Then she waved and got on the elevator first.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto watched her go with a broad grin, waving back.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We meet often. Were you waiting for me to come back?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah, something like that. Let\u0026apos;s take a walk.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe half-forcibly led me out of the lobby and we walked down a path off the school route.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re really tolerant of Shiina, or rather, you\u0026apos;re pretty close with her, aren\u0026apos;t you? You\u0026apos;re the one who gave her the flower, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why do you think that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was no one else around at the time, so there was no way Hashimoto could\u0026apos;ve seen me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s not a funny way to play dumb. There\u0026apos;s no way it\u0026apos;s nothing. Anyone could tell just by seeing how happy she looked holding that flower.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed Hashimoto felt that way after seeing Hiyori and I together.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re always going on about \u0026apos;Shiina, Shiina,\u0026apos; so there\u0026apos;s been something on my mind. I figured I had to confirm it today, no matter what.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter a short pause, Hashimoto looked me straight in the eye.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;d probably be hard for anyone else to ask, so as the designated bad guy, I\u0026apos;ll ask you straight up. Is Shiina someone especially close to you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHis expression clearly conveyed his seriousness.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is it a problem to have a specific person I\u0026apos;m close to?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, I wouldn\u0026apos;t go so far as to say it\u0026apos;s a problem. But I\u0026apos;m not exactly welcoming it, either.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto said, somewhat evasively. When I looked at him, he seemed a bit uncomfortable and averted his gaze.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not just me. Ichinose probably isn\u0026apos;t too happy about it either, is she? I\u0026apos;ve been hearing rumors that Ichinose likes you. The source of the rumor is Class D. In other words, she found out you broke up with Karuizawa and openly declared herself the next girlfriend candidate, right? I thought the way Ichinose looked at you wasn\u0026apos;t exactly normal ever since we heard about the alliance together, but...anyway, I was sure you were going to get together with her\u0026#x2014;or are you dating Ichinose?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We\u0026apos;re not dating.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis should\u0026apos;ve been the answer Hashimoto wanted, but instead of being pleased to hear it, he scowled.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...And why\u0026apos;s that? If it\u0026apos;s Ichinose, you couldn\u0026apos;t ask for a better person to date, right? Honestly, even I, who\u0026apos;ve barely had any contact with her, would say yes in a heartbeat if she confessed to me. She\u0026apos;s on that level, you know? There\u0026apos;s no reason to turn her down, is there?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sorry to burst your bubble while you\u0026apos;re getting all worked up, but I haven\u0026apos;t been confessed to.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even so, all you have to do is make a move, right? She already likes you, so you should just go for it without hesitation. Ah, I don\u0026apos;t mean that in a weird way.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe hurriedly denied it, but that was a trivial distinction.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ichinose and I have an alliance. Nothing more, nothing less.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So you\u0026apos;re saying you\u0026apos;re just pragmatic allies? For the foreseeable future, too?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter asking that, he continued without waiting for my reply.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So then... does that mean you\u0026apos;re going after Shiina right now?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m surprised. I didn\u0026apos;t think you cared so much about other people\u0026apos;s love lives.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;To be precise, I\u0026apos;m just worried that those feelings might affect the outcome of the class competition.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was my business who I dated, but he was worried I might let my personal feelings get in the way.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat seemed to be what he feared.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a very Hashimoto-like way of thinking.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Nah, I don\u0026apos;t even need to hear your answer; I already know. You cut ties with Horikita and the others you shared two years of hardship with to join us. I don\u0026apos;t doubt for a second that your actions would change just because you got involved with one or two girls like Ichinose or Shiina.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And yet, you seem awfully hung up on it. Especially when it comes to Hiyori.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto was clearly placing more weight on it versus the situation with Ichinose.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;From an outsider\u0026apos;s perspective, it\u0026apos;s always felt to me like you treat Shiina differently.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto concluded by saying that if it was just a needless worry, then that was great, but it was already certain that I was, in fact, treating Hiyori in an indescribable way.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat said, I wouldn\u0026apos;t let her existence affect the class\u0026apos;s performance. But speaking purely from personal feelings, I didn\u0026apos;t want to treat Hiyori carelessly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI see.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So that\u0026apos;s what it is.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What\u0026apos;s \u0026apos;what it is\u0026apos;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Perhaps I\u0026apos;m in love with Hiyori.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Huh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I can\u0026apos;t say for sure what this feeling is just yet. But I might at least be harboring, or starting to harbor, feelings for Hiyori that I don\u0026apos;t have for anyone else.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe unease and errors I\u0026apos;d felt up to that point and their cause.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe reason it hadn\u0026apos;t been easy to find was because it was something outside my empirical rules.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;W-Whoa, whoa, are you serious? Nah, what\u0026apos;re you talking about, like this is your first time feeling something? You were just dating Karuizawa a little while ago, weren\u0026apos;t you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf the emotion I just identified is truly budding within me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI\u0026apos;m even amazed by the strength of this thing called emotion and its unpredictable timing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA desire to know more began to overflow.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIf I traced it back, would I be able to see it?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWhen did I start to become conscious of Hiyori?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWhat was different about her compared to other people?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eI want to try digging as deep as I can.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026#x2014;No, for now, I should probably stop these unnecessary delusions.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eComing up with an answer right now, as if deducing a strategy, would\u0026apos;ve been far too hasty.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo matter how it turned out, that emotion was extremely fascinating as a subject for experimentation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then... depending on the situation, are you planning on dating Shiina?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Didn\u0026apos;t you believe that my actions wouldn\u0026apos;t change? So why are you sticking your nose so deep into someone else\u0026apos;s love life?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, just this once, y\u0026apos;know... It\u0026apos;s my view on love, I guess, but it\u0026apos;s screaming at me that I absolutely have to check.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Your view on love, huh? Do you have a corresponding amount of experience with it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI asked this while keeping the expelled Maezono in mind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Now you\u0026apos;re underestimatin\u0026apos; me a bit, Ayanokouji. It\u0026apos;s not like I can brag about it, but between middle and high school, I\u0026apos;ve dated two... no, to be precise, three people.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI surmised that the reason he was cagey about the last one was because he was referring to Maezono.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So? Are you planning to date Shiina? If you can\u0026apos;t answer, that\u0026apos;s fine too\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Whether we date or not involves the other person. It isn\u0026apos;t something I can answer.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hah, well, yeah. But from the sound of it... if this is really your first time feeling this way, that\u0026apos;d make it your first love, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Perhaps.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRight then, I possessed no way to deny it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No matter how many people you date, you only get one first love. And what\u0026apos;s more, you almost never end up with that person. My own first love was a classmate in elementary school, but I couldn\u0026apos;t even talk to her properly. If you treat your first love like that, it might feel romantic, or special, but in reality, it ain\u0026apos;t all that. Guys are especially simple, y\u0026apos;know, we\u0026apos;ve got a tendency to unconditionally fall for any cute girl.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI fully understood that regardless of whether the object of affection was a man or a woman, the majority of people tended to be attracted to those with superior looks. Even looking at TV or magazines, the proportion of handsome men and beautiful women who caught the eye and gathered attention was overwhelmingly high.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So just go ahead and ditch that first love stuff. If a reasonably cute girl falls for you, your tenth love or your twentieth love can start just like that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDespite his roundabout expressions, Hashimoto\u0026apos;s way of thinking remained consistent.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Whether it\u0026apos;s really your first love or whatever, stay away from Shiina. This is my strongest advice to you as your strategist, as your friend, and as a comrade aiming for Class A.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto was strongly wary of my relationship with Hiyori developing in an unexpected way.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not a difficult concept, is it? You can get back together with Karuizawa, you can date Ichinose. Heck, any other girl would be fine. Just, not Shiina.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was clear that by deliberately repeating himself, Hashimoto was watching my reaction. It was plain to see that he would take either excessive agreement or denial as an unfavorable sign.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I understand your concern very well. However, you\u0026apos;re counting your chickens before they hatch.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2014;I can trust you, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You probably wouldn\u0026apos;t believe me even if I answered, but you can trust me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor me, Hiyori\u0026apos;s existence was becoming indispensable.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAn existence that made me learn an unfamiliar emotion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI couldn\u0026apos;t help but want to find out whether or not I could be certain it was what Hashimoto called a first love.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wanted to experience being swallowed by the irresistible waves of emotion and see how I would be carried away.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wanted to take both myself and the other person apart and seek the answer to the very end.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was true that I would remember his warning as a warning, but I had no intention of stopping.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBecause I was already getting ready to dive in as deep as I could.\u003c/p\u003e\u003ch1 class=\"heading_1\"\u003e\u003ca class=\"heading-link\" href=\"/read/ss-y3-v2/2\"\u003eChapter 7:\u003cbr/\u003eThe Observer\u003c/a\u003e\u003c/h1\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eA WEEK HAD finally passed since the exam announcement\u003c/em\u003e\u0026#xa0;and the Thursday of the reveal arrived.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe only slightly worrisome elements were the encounter with Ike and his friends at the cafe and Hoshinomiya-sensei\u0026apos;s approach; I received no reports of trouble from any other classmates.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe matter with Hoshinomiya-sensei was unfortunate, as it only served as a disadvantage to the alliance, but it was also a reflection of just how hungry she was for victory.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe exam was truly a neck-and-neck race. In truth, it was completely unclear if any gap had formed at all. The students of Ryuuen\u0026apos;s class also had an exemplary week, remaining calm and taking no action to entrap students from other classes. It seemed that the outcome would be decided by a truly trivial difference.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I waited in the classroom that morning for my classmates to arrive, a bewildered-looking Hashimoto came hurrying in.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This is a real pain, Ayanokouji. At the eleventh hour, it\u0026apos;s confirmed that Rokkaku\u0026#xa0;and Yano\u0026#xa0;will be absent.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ryuuen?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I suspected that right off the bat, too, but apparently there wasn\u0026apos;t any real contact. They\u0026apos;re saying they just got sick and have a fever.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAccording to Hashimoto\u0026apos;s explanation, the two of them had an idea what caused the fever; apparently, when Rokkaku and the others were shopping a few days ago, a sick-looking employee at the mall sneezed on them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom what I heard, it seemed like an unavoidable, unforeseen event.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRokkaku and the others also understood the cause of their poor health and moreover, they hadn\u0026apos;t done anything reckless like forcing themselves to come to school, so there was nothing to blame them for.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;d love it if today\u0026apos;s tardiness and absences don\u0026apos;t affect the exam... but things are never that simple, are they?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Probably.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePresumably, the scope of the exam extended right up to that morning\u0026apos;s attendance, covering the entire week.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf that was the case, the absences might have dealt a fatal blow in such a neck-and-neck competition.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;At this point, all we can do is hope your 90% prediction is wrong, Ayanokouji, and that this exam has nothing to do with it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto pinned his hopes on the few remaining unknown rules and details of the exam.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t think it\u0026apos;s a concern with this class, but make sure to tell everyone not to slander the two who are absent under any circumstances. Even if we lose because of it, it won\u0026apos;t affect the general state of the class.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I figured you\u0026apos;d say that, so I\u0026apos;ve already sent out the notice.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePhone in hand, Hashimoto showed me the screen, indicating he just sent the message.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter that, the classmates who arrived in the classroom seemed to have learned of the situation; though they appeared slightly disheartened and shaken, they quickly composed themselves and went to their seats with expressions of acceptance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey understood very well that panicking wouldn\u0026apos;t get the class points back.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFurthermore, not abandoning the hope Hashimoto had for an unrelated exam, I could see several students tackling their studies.\u003c/p\u003e\u003ch2 class=\"heading_2\"\u003ePart 1\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eICHINOSE INVITED ME to have a little discussion about the exam results after school, so for the first time in a week, I headed to the front of the gym on the second floor of Keyaki Mall. There, I spotted Watanabe from behind, standing near the entrance and looking up at the gym. He then paced back and forth, crossing the gym\u0026apos;s entrance over and over again. But he never went inside; I could see him repeat this behavior.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What are you doing?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Wh-whoa, Ayanokouji!? H-hey, long time no see. Wh-what a coincidence... haha.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShowing blatant agitation with slightly broken speech, Watanabe raised his hand and answered.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I was just thinkin\u0026apos; about maybe joinin\u0026apos; the gym, y\u0026apos;know? Like, I\u0026apos;ve got this newfound desire to work out and get lean? And I was wonderin\u0026apos; if going to the gym with Amikura would mean we could spend more time together. Well, a mix of things like that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNeither was a bad thing, but it was clear that the latter objective was the bigger one.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If that\u0026apos;s your plan, you should just go ahead and join. It\u0026apos;d be nice for me, too, since having you join would mean another person to talk to.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;R-really? In that case, can I just say you were the one who invited me!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed he didn\u0026apos;t so much want to take the final step himself as he wanted someone to give him a push.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I have no problem with that at all.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I readily agreed, Watanabe seemed genuinely happy, his eyes sparkling with delight.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m meeting Ichinose after this, but do you want to join right now, maybe do a trial run? I\u0026apos;m guessing Amikura will probably be there, too.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;A-a trial by fire right off the bat, huh...!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor a moment, it crossed my mind that he might flinch, but Watanabe nodded as if he\u0026apos;d made up his mind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, as he faced the gym, his brave advance came to a halt.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Isn\u0026apos;t this a little too obvious?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, I can\u0026apos;t deny that. Girls especially seem to be perceptive when it comes to romance. If you, who\u0026apos;s had nothing to do with the gym until now, suddenly joined the group, it\u0026apos;s conceivable that Ichinose, or in some cases, Amikura herself, might get suspicious.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI explained this to Watanabe, mixing in my own analysis, which was gradually improving.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s no good! S-seriously, I can\u0026apos;t have Amikura finding out at this stage!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter letting his imagination run a little, he seemed to have concluded that he couldn\u0026apos;t hide how suspicious he looked.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Letting her know you like her is also a valid strategy, you know.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;M-maybe, but I\u0026apos;m not a veteran like you, Ayanokouji... I\u0026apos;m like a hero in an RPG who hasn\u0026apos;t even left the first village yet, you know? It\u0026apos;s impossible at level one...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t quite understand his analogy, but it seemed he still wanted to avoid letting Amikura know his feelings.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Should you hold off on joining then?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ugh... If I can, I wanna have as many chances to talk to Amikura as possible... but still...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In that case, it\u0026apos;s a bit roundabout, but there is a way to camouflage your objective.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Camouflage?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s an exaggeration to say \u0026apos;hide a tree in a forest,\u0026apos; but you could just get two or three other people besides yourself to join the gym at the same time. If you\u0026apos;re just one of several people who were invited, it\u0026apos;ll be harder for her to figure it out.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ooh, that\u0026apos;s a great idea. Is there anyone from your class you could ask, Ayanokouji?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, it\u0026apos;s better to avoid Class C. To join Ichinose and Amikura\u0026apos;s circle naturally, it\u0026apos;s best to select people from the same class.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBesides, involving Class C would make problems more likely to arise when the framework of the alliance was removed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see... It\u0026apos;s true that it\u0026apos;s more natural to get close to a classmate... but is there anyone who\u0026apos;d join if I asked...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis was the first time I\u0026apos;d interacted with Watanabe since my class transfer, but he didn\u0026apos;t mention my move from Class A to C at all. It seemed less like he was deliberately avoiding a sore subject and more like he wasn\u0026apos;t that concerned about it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t know much about Class D, but what about Shibata? As a member of the soccer club, he probably doesn\u0026apos;t mind physical activity and at the gym, he could further build up his body\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s absolutely impossible.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWatanabe\u0026apos;s eyes flew open as he grabbed both my shoulders, cutting me off as if to say, \u0026quot;Don\u0026apos;t say another word.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s impossible?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s just cruel, Ayanokouji... The fact that you\u0026apos;re sayin\u0026apos; it without even knowing why just makes it more infuriatingly impossible... If Shibata saw you and Ichinose together, he\u0026apos;d cry...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hm...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter saying it was impossible, he muttered something in a very quiet voice, but I couldn\u0026apos;t quite catch it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Look, he could become a rival for Amikura\u0026apos;s affection, right? Shibata\u0026apos;s surprisingly popular with the girls.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see. I hadn\u0026apos;t considered that perspective.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had next to no information on who in Class D was interested in whom.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But I can\u0026apos;t think of anyone else who\u0026apos;d do it. It costs money to join, too.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was true that joining out of inertia or just to be sociable, without any real interest, carried its own risks.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In that case, I have a clever idea. Provided he won\u0026apos;t be a potential rival for you, of course.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left
