\"\u003e\u0026quot;Who is it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Kanzaki and Himeno. Then Hamaguchi. Should be okay with these three, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What a mismatched trio, huh? Himeno\u0026apos;s a girl, and it\u0026apos;s not like Kanzaki and Hamaguchi are the type to be rivals in love. But I can\u0026apos;t picture them going to the gym at all.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not as surprising as you might think. Especially if Kanzaki\u0026apos;s motivated, there\u0026apos;s a chance the negotiation could work out.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is that... so?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWatanabe tilted his head, not quite understanding.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If it\u0026apos;s alright with you, Watanabe, I was thinking of talking to them. Is that okay?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, sure.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI intended to use Kanzaki and the others to bring about a change in Ichinose, but the fact that she evolved beyond his expectations would surely be a joyous thing for Kanzaki as well, though he probably strongly doubted how genuine that evolution was.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe fact that he hadn\u0026apos;t approached me despite hearing about the alliance served as proof of that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUp until now, we only exchanged occasional pleasantries, but from here on, it would be desirable to get closer and spend as much time as possible talking over the next few months.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo matter how much Ichinose cast aside her hesitation, she couldn\u0026apos;t win on her own.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was essential to raise the level of students like Kanzaki, Himeno, and of course, Watanabe and Amikura.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUsing the gym as a meeting place with Class D was an on-the-spot idea, but if it worked out well, it might not be a bad thing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;For now, hold off on joining today and give me a little time. I\u0026apos;ll somehow get Kanzaki and the others to join the gym and try to create an opportunity for you to naturally get closer to Amikura.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;O-oh. Thanks, Ayanokouji. You\u0026apos;re a good guy, you know that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe tried to suppress his happiness, then went down the stairs from the second floor, where the gym was, to the first floor.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe fact that his steps seemed to have a little skip in them was probably proof of his anticipation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was still a little while before Ichinose would arrive, but I decided to change and start my workout.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I was showing my membership card at the reception to check in, a student came in behind me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Hey...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was Utomiya from Class 2-C. I\u0026apos;d never seen him at the gym before, but was he perhaps a member? As if he thought he was being scrutinized, he spoke uncomfortably.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I was just a little curious, so I came to have a look. Are you... a member here, senpai?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWas he hoping to join? Perhaps a new breeze was blowing into the sparsely populated gym.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah. A friend invited me a little while ago and I started coming.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see... I get it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was painfully obvious from his attitude that he had no interest in the fact that I came here or what impression I had of the gym.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;They offer a free trial, so if you\u0026apos;re interested, you should give it a try.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI told him anyway, even though I thought it might be meddling.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll think about it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd, just as I\u0026apos;d imagined, the reply came back with a cold expression, one that looked like he had no intention of thinking about it at all.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps he was displeased at being seen considering joining the gym, because he turned right back around and left.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That was Utomiya-kun, right? Are you two on bad terms? It looked pretty tense.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAkiyama-san, who happened to be passing by, asked me with a wry smile.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t mean for it to be, but I can\u0026apos;t say we\u0026apos;re on friendly terms, to be polite.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn most cases, when I talked with Utomiya, Tsubaki was often with him and we rarely ever spoke one-on-one.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But I\u0026apos;m surprised you knew Utomiya\u0026apos;s name.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;He\u0026apos;s been coming here for the last two days straight, and I\u0026apos;ve seen him at the reception desk or the entrance like just now, so I\u0026apos;ve had a few chances to talk to him.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So he\u0026apos;s really considering joining?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I wonder. That might be part of it, but I think he\u0026apos;s probably more concerned about his kouhai-chan.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;His kouhai?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s a first-year girl who was brought here by Utomiya-kun and joined recently. She just joined two days ago, but they seemed pretty close. Maybe he was worried about her?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRather than having met after he became a second-year, perhaps they were acquaintances from before who ended up enrolling at ANHS?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Looks like she hasn\u0026apos;t come yet today, though~\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, if he was acquainted with this kouhai, there was no need to come all the way to the gym to see her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf he had some business, he could just contact her on his phone. Considering that, it could be that they had only just met and hadn\u0026apos;t yet exchanged contact information directly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;By the way, that girl is an amazing athlete. The first day, a crowd gathered when she was on the treadmill, so I took a look too, and she was maintaining a 20-kilometer pace for several minutes. And she was perfectly fine training after that. Mashima-sensei got really into it, too.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWell, normally, you wouldn\u0026apos;t come to a gym and run at 20 kilometers per hour.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf your timing was off by even a single step, there was a risk of falling, and since it didn\u0026apos;t stop immediately even when the stop button was pressed, the emergency stop couldn\u0026apos;t keep up. It seemed to have limited applications, such as for those with experience in track and field, soccer, or martial arts to use for a moment of intense sprint training.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor a first-year high school student, fifteen or sixteen years old\u0026#x2014;and a girl at that\u0026#x2014;to be able to handle it meant she was remarkably talented.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn fact, there\u0026apos;d been children in the White Room who dropped out, unable to achieve that level.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn any case, it probably meant that an interesting talent joined the gym.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut what was Utomiya\u0026apos;s reason for taking an interest in that girl?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I made some unkind speculations about it\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Perhaps a storm of love is brewing.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAkiyama-san said so and laughed, her eyes narrowing happily.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI see. It might have been another one of those things, like Watanabe\u0026apos;s feelings or the boys\u0026apos; maneuvering for Shiraishi.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRomance, something I would never have known about if I hadn\u0026apos;t started dating Karuizawa.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd then, the image of Hiyori surfaced in my mind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThrough experience, I was becoming more sensitive to the romantic developments concerning myself and those around me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah, right... Um, there\u0026apos;s just something I wanted to ask, if that\u0026apos;s all right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What is it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Um, about Mashima-sensei... How should I put it... Is my impression of him the right one? It\u0026apos;s not like he\u0026apos;s actually a player, is it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;While I cannot definitively deny the possibility that he possesses such a side, I do believe he\u0026apos;s a reliable teacher. I don\u0026apos;t think he\u0026apos;s so different from the impression you have of him.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I-Is that so? Thank you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t as if there\u0026apos;d been any major developments between the two. Rather, Akiyama-san\u0026apos;s demeanor was such that it made me think there might be some progress between them in the future.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eInside the gym, there was no sign of Koenji or the notable first-year and the gym was deserted.\u003c/p\u003e\u003ch2 class=\"heading_2\"\u003ePart 2\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAFTER WORKING UP a good sweat, I left the gym with Ichinose and Amikura.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Alright, I\u0026apos;m gonna make a little detour on my way home,\u0026quot; Amikura announced as soon as we stepped outside, then promptly put some distance between us, waving as she headed down the escalator.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;She was in quite a hurry. Is she meeting up with someone?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Mm, I think she was just being considerate. So that you and I could talk alone, Ayanokouji-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWas it out of concern for the leaders of allied classes to deepen their friendship? Or some other kind of consideration? It wasn\u0026apos;t particularly difficult to imagine the real reason.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you\u0026apos;d like, how about we walk home together? Ah... saying it like that makes it hard for you to say no, doesn\u0026apos;t it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, it\u0026apos;s fine. I was planning on heading straight home today anyway. Besides, we haven\u0026apos;t had a chance to talk about the exam.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Really? That\u0026apos;s great, I\u0026apos;m glad.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI left Keyaki Mall with Ichinose, who looked up at me and smiled, her eyes narrowing slightly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe time was past 6:30 p.m., but it wasn\u0026apos;t dark outside.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was proof that winter\u0026apos;s shadow had completely retreated and the daylight had begun to linger, one step at a time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The outcome this time was unfortunate, wasn\u0026apos;t it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even if you\u0026apos;re thorough about managing your health, some things are just out of your control. It can\u0026apos;t be helped.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as every class imagined, the recent exam took place over the course of one week.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe evaluation was based on how well we adhered to proper daily conduct and school rules, and although we weren\u0026apos;t told the detailed point distribution, we were informed that all four classes were more or less neck and neck.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe results were: Ichinose\u0026apos;s class in first place with 50 Class Points. Horikita\u0026apos;s and Ryuuen\u0026apos;s classes were in second place, each receiving 10 Class Points. My class, with two absentees, came in last with a deduction of 25 points. It was a relief that Hoshinomiya-sensei\u0026apos;s outburst didn\u0026apos;t have a negative impact.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHorikita Class 1240 points\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen Class 1081 points\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAyanokouji Class 867 points\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIchinose Class 864 points\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was no change in the class rankings, and the gap from Class A to Class D remained mostly unchanged.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not a problem in the grand scheme of things. It\u0026apos;s a gap we can close if we aim to win the next special exam.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see. That\u0026apos;s very reassuring. I\u0026apos;ll do my best to help out as much as I can, too.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course, I\u0026apos;m counting on you. More importantly, I have something else I\u0026apos;d like to discuss. I\u0026apos;m thinking of getting more people to join the gym. Is it alright if I invite them?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I think that\u0026apos;s a great idea! I was actually getting a little worried about things like sales, since the number of members is so low.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIchinose readily expressed her approval, agreeing it was a good plan.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But you don\u0026apos;t need my permission or anything.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s not quite right. The students I\u0026apos;m thinking of inviting are from your class, Ichinose.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh, really? Who are they?\u0026quot;\u003c/p\u003e\u003cimg src=\"/hola-lector-agua/images/books/ss-y3-v2/OEBPS/lVhZMayuhWwmBdFdcwpCW.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The three I\u0026apos;m thinking of asking are Watanabe, Kanzaki, and Himeno.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI consciously relayed the names in a natural flow, so as not to hint at any particular intention with the order or combination.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd I deliberately chose not to mention Hamaguchi\u0026apos;s name.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, it was a petty trick at best. Upon hearing the three names, Ichinose smiled.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s an interesting trio. Kanzaki-kun has seemed a little distant from me lately, and on the other hand, it seems he\u0026apos;s gotten closer with Himeno-san, as the two of them have apparently been seen talking together at times. I\u0026apos;m aware they were trying hard to do something when I was being so unreliable. If we\u0026apos;re at the gym together, we might be able to remove that unnecessary barrier, don\u0026apos;t you think? But in that case, wouldn\u0026apos;t it be better to invite Hamaguchi-kun as well?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed she completely read my intentions. And she had a magnificent grasp on the state of her own class.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And Watanabe-kun simply wants to get closer to Mako-chan\u0026#x2014;I guess that\u0026apos;s about it, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Impressive. I guess it was obvious.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile I was sincere about wanting to liven up the gym, she saw through the reasons for my choices all too easily.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I can figure that much out. But, yes, I\u0026apos;d totally welcome them. I think Watanabe-kun will be fine as long as we just pretend not to notice his true motives, but... I wonder if Kanzaki-kun and the others will agree to join?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;They\u0026apos;ll join. No, I believe they have to.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re right. It doesn\u0026apos;t have to be the gym later on, but I\u0026apos;ve been feeling that we really do need to unite the class in the truest sense, and sooner rather than later.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In that case, I\u0026apos;ll go ahead and ask them without hesitation.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Okay, thank you. I\u0026apos;m really happy for your support, Ayanokouji-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter Ichinose, standing to my right, gave me an unreserved smile, the back of her left hand brushed against the back of my right for an instant.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen her hand slowly drew near again and our fingertips touched and intertwined.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, she reflexively realized it was wrong and hastily pulled away.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer cheeks reddened, and she averted her gaze. But her eyes slowly returned to me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I-I\u0026apos;m sorry... I\u0026apos;m sorry. I just... couldn\u0026apos;t help wanting to touch you... even though we\u0026apos;re just friends, aren\u0026apos;t we.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven though we knew everything about each other, our relationship was that of friends.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven though I knew it was only a difference in a single expression, a large, insurmountable wall stood between us.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was easy enough to take her wavering hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was sure that Ichinose herself wouldn\u0026apos;t have minded the action.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t dislike her personality, her body, or her thoughts.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn fact, it was true that she seemed far more charming than some half-assed person.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I stared at her, Ichinose shyly met my gaze as well.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe also possessed the great capacity to accept me, even knowing a part of my darkness.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd yet\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI would have denied that my heart was being swayed by romance at that very moment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI recalled the other day: the library after school with Hiyori and the sight of her holding the flower.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA space enveloped in a sense of bliss, a feeling I never experienced before.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI clearly desired what I had felt on that day, at that time\u0026#x2014;an emotion I had no memory of experiencing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2014;Who are you thinking about?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs if she slipped into my thoughts through our meeting gaze, her lips moved to form those words.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What makes you think that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Because you looked so happy, I suppose.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIchinose had always been skilled at reading the atmosphere and understanding people, but since that night, her perception had sharpened dramatically.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m sorry, you don\u0026apos;t have to answer. It\u0026apos;s not something a friend should be prying into... right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe showed a slightly lonely expression but quickly returned to her usual self.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEventually, we arrived in front of the dorms, keeping a slight distance between us.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll be waiting for Kanzaki-kun and the others\u0026apos; reply, okay?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter watching her back as she hurried into the dorm ahead of me, I lifted my gaze slightly and stared at the sky, stained by the sunset.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe joy of learning a new emotion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd what kind of effect that emotion would have on myself, and on others.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWould what came next be prosperity, or ruin?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOr perhaps, something else entirely?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was, at that moment, living a very fulfilling\u0026#x2014;contented moment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor that, I had to be truly, deeply grateful.\u003c/p\u003e\u003ch2 class=\"heading_2\"\u003ePart 3\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA LITTLE PAST 4:30 p.m. on Thursday, around the time Ayanokouji met up with Ichinose and the others.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHaving received a message from a certain individual, Shiraishi appeared at the restaurant alone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt that hour, most students gathered at the cafe, so the restaurant, where meals were the main focus, was comparatively less busy, with empty seats always standing out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe sat alone at a table in the back and ordered a cup of black tea from her tablet.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe flavor was not something one could praise, even out of politeness; it tasted like it\u0026apos;d been brewed from a cheap teabag.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi imagined that if it were of the same quality as the cafe, the place would have been bustling at this hour as well. Still, it wasn\u0026apos;t that there were no customers at all, just a sparse few. Then, just as her tea was delivered, another student came in and sat down at the table next to Shiraishi\u0026apos;s.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom over her shoulder, she could hear the electronic chime of a tablet being operated and an order being placed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Have I kept you waiting?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe charming words came from behind her. A voice, clear and unadulterated, unpolished yet powerful, reached Shiraishi\u0026apos;s ears.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Not at all. I only just arrived myself.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you really sure this was the right place to meet?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. It\u0026apos;s easy for our voices to carry even when we\u0026apos;re back-to-back with the sofa in between, don\u0026apos;t you think?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s true that it\u0026apos;s easier to talk since there are few customers, but on the flip side, that means we inevitably stand out. Anyone who enters can spot us easily, and it\u0026apos;s unavoidable that we\u0026apos;ll leave an impression.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was no panic in her voice, but she gave off a strong sense of caution.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe situation, where she could only hear her companion\u0026apos;s voice, worked to Shiraishi\u0026apos;s advantage.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was no way for the person in question to know that she\u0026apos;d been placed in such a unique environment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Visually speaking, that may be so. However, it\u0026apos;s impossible for anyone to imagine our relationship from this back-to-back situation. The fact that we might catch someone\u0026apos;s eye also means that they catch ours. As long as we remain calm, there won\u0026apos;t be any problems.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey\u0026apos;d simply come to the unpopular restaurant individually. Seeing two students from different classes\u0026#x2014;no, different school years\u0026#x2014;the number of people who could imagine they arranged to meet and were conversing on purpose was extremely limited.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I think an ordinary student would just assume we\u0026apos;re here waiting for two different people. However, there are a few individuals I need to be wary of. If one of them, Ayanokouji-senpai, were to see this...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even if he didn\u0026apos;t understand it just from witnessing the situation, he would still unconsciously commit this pairing to memory and likely retrieve it later as needed.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOn that day, at that time, Shiraishi and Nanase sat back-to-back in the restaurant. Had they been pretending to be strangers while having a conversation they didn\u0026apos;t want overheard? He would begin a line of deduction an ordinary person could never reach.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you understood that, may I ask why you still took that risk?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The risk you\u0026apos;re concerned about, Nanase-san, has already been eliminated. Ayanokouji-kun just entered the gym with Ichinose-san. At the very least, he won\u0026apos;t be out for another hour.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Surely you didn\u0026apos;t ask Ayanokouji-senpai directly, or have someone else find out for you, did you? Even that would be cause for suspicion.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer tone of voice remained the same, but Shiraishi didn\u0026apos;t miss the faint anxiety it contained.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t worry. The only words we exchanged today were morning greetings.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then how did you ascertain Ayanokouji-senpai\u0026apos;s location?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;How I procured that information is a trade secret.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe used a line she heard from Ayanokouji himself during a previous exchange.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Forgive my rudeness, but if you used your friend Nishikawa-senpai, I believe she would be ill-suited for the task. There\u0026apos;s no way Ayanokouji-senpai wouldn\u0026apos;t notice if she carelessly tailed him. It\u0026apos;s entirely plausible he would suspect it was your doing, Shiraishi-senpai, since you two are close. Or does she perhaps possess some hidden talent?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was a subtle shift in Nanase\u0026apos;s speech that an ordinary person wouldn\u0026apos;t have noticed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOnly when she spoke the name Nishikawa was there a truly faint, yet deliberate, emphasis.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re aware that she isn\u0026apos;t capable of handling such a major role, aren\u0026apos;t you? My apologies, but Nishikawa-san is merely a friend. Your attempt to read so deeply into things is meaningless.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Is that so?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s all well and good to meticulously check for any missteps on my part, but you\u0026apos;ve exposed your own foolishness quite spectacularly, Nanase-san. To let an uninvolved student discover the existence of your second phone and then to be overheard speaking with someone who was supposed to have left the school.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re right. I was careless in that regard.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ve taken measures to sufficiently silence Hashimoto-kun and Morishita-san, who happened to witness it. It\u0026apos;s possible it may eventually reach Ayanokouji-kun\u0026apos;s ears, but for the time being, it should be fine.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So you took care of it for me. Thank you very much.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi picked up the saucer with her left hand, then placed the fingers of her right hand on the handle of the cup.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Shall we get to the point now? Contacting me is a clear violation of the rules.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I am fully aware that up until now, you\u0026apos;ve lived your life at this school as a completely ordinary student. However\u0026#x2014;I, too, have a job that only I can do, so this was unavoidable. Please, I need your help.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What is it you want me to do?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I want to get Ayanokouji-senpai expelled. As soon as possible, and at a time he can\u0026apos;t predict.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eClosing her eyes, Shiraishi mulled over Nanase\u0026apos;s words, letting them sink in deep.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a tone of impatience, not one of deceit. She assessed its credibility within herself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I sympathize with your feelings, but I must decline to offer my assistance.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why...is that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s because I am, strictly speaking, an observer. From the very beginning, I was never given any role beyond that. It is precisely because I didn\u0026apos;t get involved in anything for these past two years that, from Ayanokouji-kun\u0026apos;s perspective, I was nothing more than \u0026apos;Female Student A\u0026apos; from another class\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then why have you started to close the distance now? Even if he doesn\u0026apos;t know who you are, Shiraishi-senpai, he might recognize that you\u0026apos;re not an ordinary student.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I suppose so. But it can\u0026apos;t be helped, can it? Through an ironic twist of fate, he and I ended up in the same class. By chance, we ended up in adjacent seats. And by chance, an opportunity arose for the two of us to speak in the classroom one morning... Given all that, there\u0026apos;s no way I can possibly suppress this impulse...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi smiled as she recalled that event, the morning they\u0026apos;d spoken alone in the classroom.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I will spend my days with Ayanokouji-kun as a classmate. For now, I just want to purely enjoy this environment. Nothing more, nothing less, simply as an observer. Besides, that nuisance, Sakayanagi-san, has voluntarily withdrawn from the school.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is that so... I understand. It seems it will be difficult to rely on you as things stand, Shiraishi-senpai.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo take a breath, Nanase took a sip of the freshly delivered iced milk through a straw.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Have your fellow students also been given a similar role, Shiraishi-senpai? That is, the role of an observer?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Who knows. The possibility that they\u0026apos;ve been given the same role as me isn\u0026apos;t zero, but I don\u0026apos;t know. All that is required of us is to spend three years as ordinary students. It\u0026apos;s as simple as that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I will take action while Ayanokouji-senpai is still within reach. If I cannot receive your cooperation, Shiraishi-senpai, then I may have to find one of your fellow students who will cooperate.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even if you threaten me, cooperation is a difficult matter.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I am from that side.\u0026quot;\u003csup id=\"fnref-1-87c39c1f-e305-518e-87f6-94b3a5050825\"\u003e\u003ca class=\"footnote-ref\" href=\"#fn-1-87c39c1f-e305-518e-87f6-94b3a5050825\" data-ref=\"1\" epub:type=\"noteref\"\u003e[1]\u003c/a\u003e\u003c/sup\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Aren\u0026apos;t you leaving a little something out? \u0026apos;Supposedly,\u0026apos; isn\u0026apos;t it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...My apologies. It is true that my position may be rather ambiguous. However, isn\u0026apos;t it precisely because my position is different that I\u0026apos;m not in violation of the rules?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s true. The reason I accepted your invitation today, Nanase-san, was because I wanted to reassure you regarding the matter with Hashimoto-kun and Morishita-san. I have no intention of cooperating in any other matter.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;At least give me some information... Please, just disclose the names of your associates. After that, we\u0026apos;ll handle\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you wish to know, I suggest you ask your superiors directly. Tsukishiro-san, was it? You have someone reliable you can turn to, don\u0026apos;t you? Not that I\u0026apos;m fond of him.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi placed her finished cup on its saucer and rose from the sofa.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I understand that you will not be cooperating for the time being. However, there is just one thing I\u0026apos;d like you to remember. May I state it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What is it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That if I am expelled before Ayanokouji-senpai\u0026apos;s fate is decided... things may very well head in a direction that Shirogane-sensei would not desire\u0026#x2014;I ask that you please bear this in mind.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Very well. I shall keep it in mind.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi answered as such without so much as a nod, and left the restaurant before Nanase.\u003c/p\u003e\u003chr class=\"footnote-rule\"/\u003e\u003col class=\"footnotes\"\u003e\u003cli data-id=\"87c39c1f-e305-518e-87f6-94b3a5050825\" data-ref=\"1\" class=\"footnote first-footnote\" id=\"fn-1-87c39c1f-e305-518e-87f6-94b3a5050825\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003ca class=\"footnote-backref\" href=\"#fnref-1-87c39c1f-e305-518e-87f6-94b3a5050825\"\u003e[1]: \u003c/a\u003eNanaese\u0026apos;s statement \u0026quot;I am from that side\u0026quot; (\u0026#x305d;\u0026#x3061;\u0026#x3089;\u0026#x5074;\u0026#x306e;\u0026#x4eba;\u0026#x9593;\u0026#x3067;\u0026#x3059;) is her saying she\u0026apos;s aligned with the anti-Ayanokoji faction (\u0026quot;superiors\u0026quot;, Tsukishiro etc.) Shiraishi responds with \u0026#x4e00;\u0026#x5fdc; which means \u0026quot;for the time being\u0026quot;, \u0026quot;tentatively\u0026quot;, or \u0026quot;In principle\u0026quot; she is essentially saying \u0026quot;Your position isn\u0026apos;t as strong as you\u0026apos;re making it sound\u0026quot;, she dismisses Nanase\u0026apos;s declaration.\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e\u003ch1 class=\"heading_1\"\u003e\u003ca class=\"heading-link\" href=\"/read/ss-y3-v2/2\"\u003eEpilogue:\u003cbr/\u003eAnother Story Begins\u003c/a\u003e\u003c/h1\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIT WAS JUST before 11:00 a.m. on a Saturday in late May\u003c/em\u003e\u0026#xa0;when I left my room for a meeting.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd just as I left the dorm lobby, the person I was there to meet called out to me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Good morning, Horikita-san.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKaruizawa-san, who seemed to have arrived a little earlier than planned, was smiling.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Good morning. I apologize for contacting you so suddenly last night.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026#xa0;As I\u0026#x2019;d just mentioned, I had sent the message asking to see Karuizawa-san last night. It wouldn\u0026apos;t have been surprising if she had plans, given how many friends she had, but she readily agreed to meet.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s totally fine! I mean, getting an invitation from you, Horikita-san, was kinda new and exciting, so I was happy.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe was looking forward to it, she added with a smile.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But...why are you in your uniform?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I have a Student Council\u0026#xa0;matter I need to attend to, at two o\u0026apos;clock.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEntering school grounds in casual clothes was prohibited. I explained that it would be a hassle to go out before noon in casual wear, only to have to return to change into my uniform. On days off, some students came to school for club activities, so even though we were a minority, I wasn\u0026apos;t worried that I would be the only one standing out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Being student council president sounds like a lot of work. I could never do something like that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe said, \u0026quot;No way, no way,\u0026quot; while gazing toward Keyaki Mall.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So, what\u0026apos;s the plan? I\u0026apos;m actually kinda looking forward to you escorting me around, Horikita-san.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If that\u0026apos;s what you were expecting, then I\u0026apos;m afraid I\u0026apos;ll have to apologize. I didn\u0026apos;t invite you to hang out for fun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I offered my light apology, Karuizawa-san\u0026apos;s eyes widened, as if she\u0026apos;d just realized something.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Eh, ah... Don\u0026apos;t tell me... you have something you want to know about Ayanokouji-kun?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re sharp. That is one of my objectives.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, the special exam just ended smoothly and all, so I kinda figured that might be it. But even so, there\u0026apos;s no guarantee I can actually help, you know?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I understand that. But if it\u0026apos;s something even you don\u0026apos;t know, then I can give up.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter all, among everyone I knew, she was without a doubt the one who knew Ayanokouji-kun best.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Okay. Then ask me anything. If it\u0026apos;s something I know, I\u0026apos;ll answer whatever!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter saying that, she seemed to have second thoughts, scratching her head in a fluster.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sorry, maybe \u0026apos;anything\u0026apos; is a bit much. But I can talk about most things, so, yeah.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKaruizawa-san corrected herself, her face turning red.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a slightly curious reaction, but it would be more than enough if she simply told me what she could.\u003c/p\u003e\u003cimg src=\"/hola-lector-agua/images/books/ss-y3-v2/OEBPS/xFbJRJTHEXJEPINZREygZ.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Thank you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKaruizawa-san\u0026apos;s devoted\u0026#x2014;no, positive response put my heart at ease.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I have no intention of keeping secrets or telling you any clumsy lies, either. I\u0026apos;ll tell you everything about why I want to know about Ayanokouji-kun and what my thoughts are, so I\u0026apos;d like you to hear me out.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course. I might not look it, but I\u0026apos;m great at keeping secrets, so bring it on!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTrusting her, I told her that as a first step toward my goal of defeating Ayanokouji-kun, I planned to start by learning more about him, mentioning Kushida-san and Ibuki-san\u0026apos;s names as well.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd that to do so, I was also thinking of looking into his roots.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI explained all of this to Karuizawa-san.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see. I... Yeah, since before I started dating Kiyotaka, ah\u0026#x2014;I mean, Ayanokouji-kun, I used to wonder a lot about things like what he was like in middle school, so I get it. Oh, and sorry, I might still slip up and call him by his first name.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t mind that at all. If it\u0026apos;s difficult for you to use his surname, you\u0026apos;re welcome to do otherwise.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Nn-nn, this is about setting boundaries. For me... you know?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I was dating Ayanokouji-kun, but to be honest, I doubt I have much more information than you do. I tried asking him about his past a few times, but I don\u0026apos;t think he ever really gave me a straight answer.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Things like which prefecture he lived in, or where his middle school was?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah. I asked about things like what foods he likes and dislikes, or his taste in clothes, but\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs she made a gesture of recollection, Karuizawa-san began telling me what she saw and heard for herself.\u003c/p\u003e\u003ch2 class=\"heading_2\"\u003ePart 1\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWE ARRIVED AT Keyaki Mall. Continuing our conversation, we strolled idly through the mall. It was just as I was thinking of suggesting we get lunch in a little while.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Actually, there\u0026apos;s one more reason I called you here. And I was lucky enough to find her.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? Whaddya mean?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo the head-tilting Karuizawa-san, I simply directed my gaze in that direction and had her follow.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Amasawa-san?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe muttered the name upon spotting the back of a lone student with red twin-tails walking ahead of us.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Amasawa Ichika-san has a connection to Ayanokouji-kun\u0026apos;s past. That\u0026apos;s why I\u0026apos;m investigating her right now.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ahh... So that\u0026apos;s how it is.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNext to me, Karuizawa-san showed no surprise, but rather a look of understanding.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Did you perhaps know about their relationship?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Nah, not at all. But I\u0026apos;ve seen Ayanokouji-kun and Amasawa-san talking a little bit. I kinda had a feeling it wasn\u0026apos;t just some simple senpai-and-kouhai relationship they made at this school.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt didn\u0026apos;t seem like there was a difference in the information we had, but her opinion was reassuring.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe fact that we sensed the same thing gave me encouragement to continue with the tedious investigation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are we gonna tail her now? Hey, should we?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...You seem awfully excited about this.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t mind doing spy-like stuff. I mean, is there anyone who actually dislikes it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWell, if I thought of it as an extension of a game, perhaps it wouldn\u0026apos;t be so bad...\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOur target likely had a connection to Ayanokouji-kun and moreover, she was considerably skilled.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKnowing that there was a high probability of losing our only lead if we failed, I found it impossible to enjoy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;For now, I\u0026apos;ll tell you what I\u0026apos;ve gleaned from observing Amasawa-san lately.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was something I\u0026apos;d noticed from watching Amasawa-san after school over the past few days.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe usually acted alone most of the time, and I never saw her spending time with classmates or friends. Of course, she would respond with a smile if spoken to by anyone, boy or girl, but she would immediately return to being alone and would never join the group that had approached her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt appeared to be her stance not to form any particularly close relationships.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat preference for solitude seemed somewhat similar to Ayanokouji-kun\u0026apos;s, but perhaps that was a stretch. In his case, it wasn\u0026apos;t that he didn\u0026apos;t make friends; if anything, he was the type who couldn\u0026apos;t, even if he wanted to.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That was an act... No, it couldn\u0026apos;t have been, could it? Surely not.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t think that was an act. That similarity seems like another thing they have in common.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSetting aside how pathetic it was that I hadn\u0026apos;t known that about him, his way of interacting with people really wasn\u0026apos;t very skillful. That was probably his true self.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTime passed as we continued to follow Amasawa-san\u0026apos;s back from a distance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIdeally, I should\u0026apos;ve spoken with her directly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut the world wasn\u0026apos;t so kind that she would talk honestly just like that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnother person, this time a male student, called out to Amasawa-san.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey only spoke for about five seconds and it appeared to be little more than a greeting.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven so, I made a point to remember every student who was on speaking terms with her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eGathering information indirectly was the only thing I could do at the moment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as I was memorizing his face, the phone I held in my right hand vibrated.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What\u0026apos;s up?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hold on.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e[\u0026apos;I\u0026apos;m waiting in the Student Council room.\u0026apos;]\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI took out my phone, looked at the text on the screen and tilted my head in my mind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Who could this be?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSuch a short message, from an unregistered contact.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was no date or time specified, but did that mean right now...?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf my two o\u0026apos;clock appointment today had been moved up, it wouldn\u0026apos;t have been strange to get word from Nanase-san. Was this something else, then? Even as I was lost in thought, Amasawa-san continued to walk through Keyaki Mall.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThough I knew I had to follow her, I blanked my phone\u0026apos;s screen and closed my eyes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I suppose it can\u0026apos;t be helped...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs long as I\u0026apos;d been entrusted with the position of student council president, I couldn\u0026apos;t just act on personal feelings alone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf someone was waiting in the student council room, I had a duty to respond as best as I could.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOr, even if there was a 99% chance it wasn\u0026apos;t, it might have been from Ayanokouji-kun.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs a realistic possibility, it might also have been part of the next special exam.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m sorry. I know it\u0026apos;s sudden, but I have to go to the student council.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI apologized for having to cut things short before we could even have lunch, despite being the one who invited her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t worry about it at all. And hey, I won\u0026apos;t go tailing Amasawa-san on my own, so don\u0026apos;t you worry.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRealizing on her own what I was about to warn her against, Karuizawa-san replied accordingly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI apologized to her one more time and then decided to head for school.\u003c/p\u003e\u003ch2 class=\"heading_2\"\u003ePart 2\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAFTER ABOUT TEN minutes, I arrived in front of the student council room, but no one was there.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo new messages had arrived on my phone either.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOn a holiday at this hour, the unused student council room was locked, as one would expect.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...A prank?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThough I was suspicious, I used my key to enter the student council room just in case.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, no one was in the silent room and not a single sound could be heard. After returning to the hallway, I decided to wait there for the person who sent the message, just in case.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut, as I expected, the person I was waiting for never appeared, and time simply passed by.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wonder if it would\u0026apos;ve been better to follow Amasawa-san after all. A hint of that regret began to sprout, but since I still had about two hours before my official student council duties, I decided to head back for the time being.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfterward, I went down the stairs to the first floor. From there, I started walking toward the entrance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Student Council President Horikita.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as I took a few steps down the hallway, a student suddenly called my name.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut no one was in my line of sight until now. Surprised, I turned to look behind me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re... Ishigami-kun, right? Do you need something from me?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIshigami Kyou-kun from Class 2-A stood there, dressed in his school uniform.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I recalled his name, I wondered why such an unusual person would approach me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was Saturday, after all. The chances of running into anyone other than students with club activities should\u0026apos;ve been extremely low.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s been a while. I have something I\u0026apos;d like to discuss, so may I have a moment of your time?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course. It\u0026apos;s been quite a while since we\u0026apos;ve spoken like this.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That time, it was you who approached me, President.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s right.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI recalled the time I invited Ishigami-kun to join the student council. He turned me down flat, but whether or not someone joined was a personal matter, so naturally, I couldn\u0026apos;t blame him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was pretty sure Ayanokouji-kun was with me then, too...\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Would you mind if we moved somewhere else?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Somewhere else? Is it something... difficult to talk about?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;d prefer if no one saw us. I don\u0026apos;t intend to take up much of your time.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe said that and without waiting for my permission, turned his back and started walking.\u003c/p\u003e\u003cimg src=\"/hola-lector-agua/images/books/ss-y3-v2/OEBPS/IeHzmpOSNxNIYeShsIchb.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t have any pressing reason to hurry back, so I didn\u0026apos;t mind going along with him, but...\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere were no other people wandering around the school on this day off, so it seemed like we could talk anywhere without issue. I wondered if that meant it was something he really didn\u0026apos;t want anyone to overhear...\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Were you the one who sent me the message?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What makes you think so?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So you\u0026apos;re not going to start with denial.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I mentioned the message, he didn\u0026apos;t seem puzzled and appeared to know what I was talking about.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFurthermore, his attitude seemed to be a natural admission and it didn\u0026apos;t look like he had any intention of hiding it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you have something to discuss, on a holiday like today, I can listen to you anywhere. But you specifically said you didn\u0026apos;t want to be seen. If we used the student council room, someone might come by, or I might have to call the other student council members. Plus, you approached me on my way back from the student council room. That way, you could confirm I was acting alone before making contact.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI figured he must have stayed out of my sight, waiting for the opportune moment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I admit it. I apologize for the roundabout method.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t particularly mind, but if this is a student council consultation requiring urgency, I may not be able to keep it to myself.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe bigger the problem, the more necessary it became to release the information as the student council.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAn obligation to report not only to the students but also to the teachers would likely arise.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You need not worry on that account.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That isn\u0026apos;t something for you to judge personally, though.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Regarding my consultation\u0026#x2014;it seems you\u0026apos;ve been looking into Amasawa, President.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIshigami-kun spoke without turning to face me, continuing to walk at a steady pace.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...What do you mean?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile I felt a slight sense of unease at his unexpected words, I first feigned ignorance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI\u0026apos;d never made a connection between Ishigami-kun and Amasawa-san, but perhaps my assessment of him had been too naive. She must have noticed I was tailing her early on and requested Ishigami-kun\u0026apos;s cooperation. That was a perfectly plausible scenario, and yet I hadn\u0026apos;t considered it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re not going to start with denial, are you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe stopped and said so as he turned back, his gaze meeting mine without hesitation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was to expose and assess the agitation I was trying to hide.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy belated wariness toward him spiked all at once.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Amasawa and I are in the same class. If she makes any suspicious moves, it\u0026apos;s only natural that I\u0026apos;d be informed.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...I suppose so.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor the last few days, I\u0026apos;d been under the self-assessed assumption that Amasawa-san was a student who preferred to act alone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut it seemed that wasn\u0026apos;t actually the case.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDid she tell Ishigami-kun that she was troubled by me following her and asked for his help\u0026#x2014;?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo, but...\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So you\u0026apos;re displeased that your classmate is being investigated. Is this a warning?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No. However, I need to know why the student council is investigating Amasawa. If she is the source of some problem, we as a class will be forced to respond, you see.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a perfectly logical reason. For Class A, which appeared to be managed with stability, it was only right to be sensitive to a classmate\u0026apos;s misconduct and it was no wonder they had their feelers out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In that case, you can rest assured. She isn\u0026apos;t in any kind of trouble.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFirst, I had to clear up Ishigami-kun\u0026apos;s misunderstanding.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd doing so would also naturally lead to my own objective.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Would you mind telling me the reason?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Do you know of a student from third-year Class C named Ayanokouji-kun?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ve never spoken to him directly, but he\u0026apos;s been the subject of various discussions among the second-years as the student who voluntarily transferred from Class A to Class C.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see. So you\u0026apos;re aware of him, as I\u0026apos;d expect. When I bring this sort of thing up, most students want to ask me how I feel about it, but you don\u0026apos;t seem to be that way.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Unfortunately, I have no interest in students from other years. With that said, I fail to see what this has to do with you investigating Amasawa.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed Ishigami-kun was, through and through, only interested in his own class\u0026apos;s affairs.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was hardly good news for me... but I continued my explanation anyway.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m searching for any student who might know about his life before he enrolled at this school. And in doing so, the possibility arose that Amasawa-san is an old acquaintance of Ayanokouji-kun. That\u0026apos;s why I want to ask her for details, but she and I aren\u0026apos;t particularly close. I\u0026apos;m hesitant to ask her directly, so I was in the middle of trying to find some kind of lead.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why is the student council president investigating the one who betrayed her class?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;While it isn\u0026apos;t a frequent occurrence at this school, now that a class transfer happened, it must be dealt with. He has now moved to Class C and we\u0026apos;re now rivals. Surely it isn\u0026apos;t so strange for me to try and gather as much information as I can in order to defeat him in the future, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;To know your enemy, you must get inside their camp. Is that what you\u0026apos;re saying?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Something like that. I may continue to investigate Amasawa-san, but rest assured, it won\u0026apos;t have any negative impact on the second-year Class A.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I understand. However, there\u0026apos;s no telling how others will perceive this. If the student council president has her eyes on Amasawa, it could create the misunderstanding that our class has a problem. I would like you to resolve this as quickly as possible.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t as if I wanted to take my time either, but if it were that simple, I wouldn\u0026apos;t be having such a hard time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;For now, I don\u0026apos;t have any information regarding Ayanokouji-senpai, but I have someone in mind who might know about his past.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Really? Who is it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI asked in response to his intriguing statement, but Ishigami-kun didn\u0026apos;t answer immediately.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t mind telling you, but I need you to promise me one thing. You must absolutely keep the identity of the person who gave you this student\u0026apos;s name\u0026#x2014;in other words, me\u0026#x2014;confidential.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor a moment, the thought that he might ask for Private Points as an information fee crossed my mind, but it seemed I was mistaken.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If that\u0026apos;s what you wish, I promise to protect your anonymity.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The person in question is a student with fairly sharp intuition. It\u0026apos;s to be expected that they\u0026apos;ll try to figure out how you found your way to them. You can handle that with pride befitting Class A and the student council president, correct?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe asked for confirmation, deliberately applying pressure as if to make a point.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps, from Ishigami-kun\u0026apos;s perspective, this person was just that troublesome to deal with.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo, that was something I\u0026apos;d known from the very beginning.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf this was a person who knew Ayanokouji-kun\u0026apos;s past, it stood to reason that they would be someone of considerable ability.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll do my best. For now, all I can do is ask you to trust my resolve.\u0026quot;\u003c/p\u00
