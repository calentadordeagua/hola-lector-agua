3e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI answered him that way, fully intending to refuse if he asked me to wager something or enter a contract.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Very well. I will place my trust in you, Student Council President Horikita and provide the information.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Thank you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;She\u0026apos;s a female student from second-year Class D named Nanase. As she\u0026apos;s a member of the student council, you must know her well.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe name of a person I hadn\u0026apos;t considered a possibility, someone who was far too close.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUpon hearing it, my thoughts came to a complete and sudden halt.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m afraid that\u0026apos;s not the case. I had the opportunity to have tea with her and asked a similar question. She told me she didn\u0026apos;t know.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Perhaps she simply wasn\u0026apos;t telling the truth?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t just a passing thought; Ishigami-kun looked at me, his tone of voice hinting at a sliver of confidence.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Why do you think that? I can\u0026apos;t doubt her without reason.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I am, after all, a member of Class A, so I\u0026apos;m constantly gathering information on the other classes. And in doing so, I\u0026apos;ve learned that Nanase was in contact with Ayanokouji-senpai from very early on.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was because Nanase-san participated in the special exam last year, one revealed to only a portion of the first-years, in which they would receive Private Points if they could expel Ayanokouji-kun. I started to say as much but thought better of it. Not all the current second-years knew of that affair, nor had it spread to the third-years.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI decided no one would gain anything if I made a careless remark and dredged up the past.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Last year\u0026apos;s first special exam that you second-years faced. Our class made contact with Nanase-san\u0026apos;s class to coordinate, so perhaps that\u0026apos;s the connection?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m aware of that as well. But can we dismiss the possibility that Nanase orchestrated even that initial alliance for the sake of contacting Ayanokouji-senpai?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If they were old friends, she could\u0026apos;ve just spoken to him openly. There would be no need to go to such lengths\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You may be right. If I\u0026apos;m just overthinking it, that\u0026apos;s fine. Please forget about it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt that, Ishigami-kun retracted his statement.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNanase-san knows about Ayanokouji-kun\u0026apos;s past?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe only information to go on was Ishigami-kun\u0026apos;s statement, so it wasn\u0026apos;t particularly credible. However, now that such a possibility had been suggested, even for a moment, it was etched into a corner of my mind against my will.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI felt it was impossible, but if it were true\u0026#x2014;that would mean...\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...I wonder, could I ask for your cooperation?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Cooperation? What for?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I want to investigate Nanase-san, just in case. Though you\u0026apos;re in different classes, you\u0026apos;re both second-years, so I\u0026apos;m sure you have some contact in your daily lives.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That may be true, but I think it would be difficult for me to cooperate. That\u0026apos;s part of the reason I wished to remain anonymous, as it seems Nanase dislikes me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;She dislikes you...? From the class competition or something?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ve had to intervene in our constant troubles with Housen of Class D, even outside of special exams. While I can\u0026apos;t determine the exact reason, I\u0026apos;m certain that she dislikes me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe OAA confirmed that Ishigami-kun possessed exceptional academic ability. He didn\u0026apos;t seem to be his class\u0026apos;s leader, but assuming he contributed to his class in a position close to that of a strategist, it was a natural dynamic for him to view Nanase-san\u0026#x2014;or rather, her entire class\u0026#x2014;with hostility.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever... she wasn\u0026apos;t the type to openly dislike someone on a personal level just because they were class rivals. At least, that was the judgment I made based on the information I had at my disposal.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf Ishigami-kun had no way of knowing that about her, then it was understandable that he\u0026apos;d take it that way. Or perhaps the boy standing before me simply didn\u0026apos;t want to get dragged into trouble and was making an excuse not to cooperate.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t know if he was someone I could trust, but right now, I just wanted a collaborator.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Very well. I cannot act directly, but I\u0026apos;ll try to do some probing to an extent that my identity isn\u0026apos;t discovered. On the chance that Nanase is unrelated, I\u0026apos;ll also check if Amasawa or anyone else seems to know about Ayanokouji-senpai. Student Council President Horikita, you just have to keep your promise to me and move forward with your own investigation as you please.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes, thank you. Even if I\u0026apos;m pressed for information, I\u0026apos;ll protect you at all costs.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I am hoping for positive results. Well then.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith those words, Ishigami-kun turned his back on me and started walking in the opposite direction of the entrance. It was likely a precaution, born from his wariness of being seen with me by Nanase-san.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe more I tried to investigate Ayanokouji-kun, the more I felt like I was sinking into a swamp.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ayanokouji-kun, just what are you...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven so, I had no choice but to recklessly push through the mud and continue chasing after him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, as I renewed my determination, I was still completely unaware.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf Ayanokouji-kun\u0026apos;s birth.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf the existence of an education and a facility so unreal and harsh that no one who lived a normal life could ever imagine it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf the fact that he was the only one who survived, as other children broke one after another.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf the cruel fate that awaited him later in life\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was surely the turning point.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy reunion with him, with Ishigami-kun, was the beginning of a great change in my life.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBecoming deeply involved in the life of the man named Ayanokouji Kiyotaka\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAn orchestrated encounter.\u003c/p\u003e\u003ch1 class=\"heading_1\"\u003e\u003ca class=\"heading-link\" href=\"/read/ss-y3-v2/2\"\u003eAuthor\u0026apos;s Afterword\u003c/a\u003e\u003c/h1\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTHE YEAR IS passing by in a flash these days. This is Kinugasa.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI\u0026apos;m getting older, and my hernia is starting to flare up again, so I can\u0026apos;t say I\u0026apos;m in perfect shape, but other than that, I\u0026apos;m actually getting healthier every year.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy blood pressure and whatnot\u0026#x2014;the numbers that were a little bad have all trended toward improvement and are now at a level appropriate for my age. All that\u0026apos;s left is, really, the hernia... That\u0026apos;s the one thing I can\u0026apos;t seem to do anything about. But I\u0026apos;ll keep at it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the next volume, Volume 3, since we\u0026apos;re heading into early summer a bit ahead of schedule, that annual event will be coming up sooner.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eVolume 2 was, if anything, a more relaxed and heartwarming installment, but this next one might have a bit more of a bite to it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut since it\u0026apos;s me saying this, you\u0026apos;d best take it with a grain of salt.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile I feel there\u0026apos;s still a long way to go until the conclusion, when I think about how the first term is already drawing to a close, perhaps it\u0026apos;s going by surprisingly fast. I want to avoid touching too much on the main story or the future in the afterword, so I\u0026apos;ll stop here for now, brief as it is.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNow for a bit of pointless talk about my private life. Feel free to skip this. (Just filling pages.)\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo put it simply, with games I used to play a lot like Mario Kart or Smash Bros., I\u0026apos;ve had my fill after just twenty or thirty minutes of playing with my kids, and I don\u0026apos;t have a single game app on my phone other than YouMaji. I used to think, \u0026apos;I can\u0026apos;t imagine a time without games, what else is there to do?\u0026apos;... But now, before I know it, the day is just over!\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd my kids just keep growing up big and healthy in the blink of an eye...\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI\u0026apos;m keenly experiencing Janet\u0026apos;s Principle, sensing that from now on, I\u0026apos;ll probably feel time accelerate more and more as I get older.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWell then, everyone\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI look forward to the day we can meet again before the year is out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs long as there aren\u0026apos;t any major problems, y\u0026apos;know. Any major problems... y\u0026apos;know\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 40\",\"volumeId\":\"ss-y3-v2\",\"chapterIndex\":40,\"prevChapter\":\"$undefined\",\"nextChapter\":{\"volumeId\":\"ss-y3-v2\",\"chapter\":51,\"title\":\"Ichinose Honami’s Short Story: To Love Too Much…\"},\"toc\":[{\"label\":\"Ichinose Honami’s Short Story: To Love Too Much…\",\"href\":\"ss-1.xhtml\",\"index\":51},{\"label\":\"Morishita Ai’s Short Story: Ear Gun\",\"href\":\"ss-2.xhtml\",\"index\":52},{\"label\":\"Shiina Hiyori’s Short Story: A Wavering Heart\",\"href\":\"ss-3.xhtml\",\"index\":53},{\"label\":\"Shiraishi Asuka’s Short Story: The Voice Hidden Within\",\
