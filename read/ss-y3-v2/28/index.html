eft\"\u003eHe half-forcibly led me out of the lobby and we walked down a path off the school route.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re really tolerant of Shiina, or rather, you\u0026apos;re pretty close with her, aren\u0026apos;t you? You\u0026apos;re the one who gave her the flower, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why do you think that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was no one else around at the time, so there was no way Hashimoto could\u0026apos;ve seen me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s not a funny way to play dumb. There\u0026apos;s no way it\u0026apos;s nothing. Anyone could tell just by seeing how happy she looked holding that flower.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed Hashimoto felt that way after seeing Hiyori and I together.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re always going on about \u0026apos;Shiina, Shiina,\u0026apos; so there\u0026apos;s been something on my mind. I figured I had to confirm it today, no matter what.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter a short pause, Hashimoto looked me straight in the eye.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;d probably be hard for anyone else to ask, so as the designated bad guy, I\u0026apos;ll ask you straight up. Is Shiina someone especially close to you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHis expression clearly conveyed his seriousness.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is it a problem to have a specific person I\u0026apos;m close to?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, I wouldn\u0026apos;t go so far as to say it\u0026apos;s a problem. But I\u0026apos;m not exactly welcoming it, either.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto said, somewhat evasively. When I looked at him, he seemed a bit uncomfortable and averted his gaze.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not just me. Ichinose probably isn\u0026apos;t too happy about it either, is she? I\u0026apos;ve been hearing rumors that Ichinose likes you. The source of the rumor is Class D. In other words, she found out you broke up with Karuizawa and openly declared herself the next girlfriend candidate, right? I thought the way Ichinose looked at you wasn\u0026apos;t exactly normal ever since we heard about the alliance together, but...anyway, I was sure you were going to get together with her\u0026#x2014;or are you dating Ichinose?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We\u0026apos;re not dating.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis should\u0026apos;ve been the answer Hashimoto wanted, but instead of being pleased to hear it, he scowled.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...And why\u0026apos;s that? If it\u0026apos;s Ichinose, you couldn\u0026apos;t ask for a better person to date, right? Honestly, even I, who\u0026apos;ve barely had any contact with her, would say yes in a heartbeat if she confessed to me. She\u0026apos;s on that level, you know? There\u0026apos;s no reason to turn her down, is there?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sorry to burst your bubble while you\u0026apos;re getting all worked up, but I haven\u0026apos;t been confessed to.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even so, all you have to do is make a move, right? She already likes you, so you should just go for it without hesitation. Ah, I don\u0026apos;t mean that in a weird way.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe hurriedly denied it, but that was a trivial distinction.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ichinose and I have an alliance. Nothing more, nothing less.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So you\u0026apos;re saying you\u0026apos;re just pragmatic allies? For the foreseeable future, too?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter asking that, he continued without waiting for my reply.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So then... does that mean you\u0026apos;re going after Shiina right now?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m surprised. I didn\u0026apos;t think you cared so much about other people\u0026apos;s love lives.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;To be precise, I\u0026apos;m just worried that those feelings might affect the outcome of the class competition.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was my business who I dated, but he was worried I might let my personal feelings get in the way.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat seemed to be what he feared.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a very Hashimoto-like way of thinking.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Nah, I don\u0026apos;t even need to hear your answer; I already know. You cut ties with Horikita and the others you shared two years of hardship with to join us. I don\u0026apos;t doubt for a second that your actions would change just because you got involved with one or two girls like Ichinose or Shiina.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And yet, you seem awfully hung up on it. Especially when it comes to Hiyori.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto was clearly placing more weight on it versus the situation with Ichinose.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;From an outsider\u0026apos;s perspective, it\u0026apos;s always felt to me like you treat Shiina differently.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto concluded by saying that if it was just a needless worry, then that was great, but it was already certain that I was, in fact, treating Hiyori in an indescribable way.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat said, I wouldn\u0026apos;t let her existence affect the class\u0026apos;s performance. But speaking purely from personal feelings, I didn\u0026apos;t want to treat Hiyori carelessly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI see.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So that\u0026apos;s what it is.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What\u0026apos;s \u0026apos;what it is\u0026apos;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Perhaps I\u0026apos;m in love with Hiyori.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Huh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I can\u0026apos;t say for sure what this feeling is just yet. But I might at least be harboring, or starting to harbor, feelings for Hiyori that I don\u0026apos;t have for anyone else.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe unease and errors I\u0026apos;d felt up to that point and their cause.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe reason it hadn\u0026apos;t been easy to find was because it was something outside my empirical rules.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;W-Whoa, whoa, are you serious? Nah, what\u0026apos;re you talking about, like this is your first time feeling something? You were just dating Karuizawa a little while ago, weren\u0026apos;t you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf the emotion I just identified is truly budding within me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI\u0026apos;m even amazed by the strength of this thing called emotion and its unpredictable timing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA desire to know more began to overflow.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIf I traced it back, would I be able to see it?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWhen did I start to become conscious of Hiyori?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWhat was different about her compared to other people?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eI want to try digging as deep as I can.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026#x2014;No, for now, I should probably stop these unnecessary delusions.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eComing up with an answer right now, as if deducing a strategy, would\u0026apos;ve been far too hasty.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo matter how it turned out, that emotion was extremely fascinating as a subject for experimentation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then... depending on the situation, are you planning on dating Shiina?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Didn\u0026apos;t you believe that my actions wouldn\u0026apos;t change? So why are you sticking your nose so deep into someone else\u0026apos;s love life?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, just this once, y\u0026apos;know... It\u0026apos;s my view on love, I guess, but it\u0026apos;s screaming at me that I absolutely have to check.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Your view on love, huh? Do you have a corresponding amount of experience with it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI asked this while keeping the expelled Maezono in mind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Now you\u0026apos;re underestimatin\u0026apos; me a bit, Ayanokouji. It\u0026apos;s not like I can brag about it, but between middle and high school, I\u0026apos;ve dated two... no, to be precise, three people.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI surmised that the reason he was cagey about the last one was because he was referring to Maezono.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So? Are you planning to date Shiina? If you can\u0026apos;t answer, that\u0026apos;s fine too\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Whether we date or not involves the other person. It isn\u0026apos;t something I can answer.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hah, well, yeah. But from the sound of it... if this is really your first time feeling this way, that\u0026apos;d make it your first love, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Perhaps.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRight then, I possessed no way to deny it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No matter how many people you date, you only get one first love. And what\u0026apos;s more, you almost never end up with that person. My own first love was a classmate in elementary school, but I couldn\u0026apos;t even talk to her properly. If you treat your first love like that, it might feel romantic, or special, but in reality, it ain\u0026apos;t all that. Guys are especially simple, y\u0026apos;know, we\u0026apos;ve got a tendency to unconditionally fall for any cute girl.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI fully understood that regardless of whether the object of affection was a man or a woman, the majority of people tended to be attracted to those with superior looks. Even looking at TV or magazines, the proportion of handsome men and beautiful women who caught the eye and gathered attention was overwhelmingly high.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So just go ahead and ditch that first love stuff. If a reasonably cute girl falls for you, your tenth love or your twentieth love can start just like that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDespite his roundabout expressions, Hashimoto\u0026apos;s way of thinking remained consistent.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Whether it\u0026apos;s really your first love or whatever, stay away from Shiina. This is my strongest advice to you as your strategist, as your friend, and as a comrade aiming for Class A.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto was strongly wary of my relationship with Hiyori developing in an unexpected way.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not a difficult concept, is it? You can get back together with Karuizawa, you can date Ichinose. Heck, any other girl would be fine. Just, not Shiina.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was clear that by deliberately repeating himself, Hashimoto was watching my reaction. It was plain to see that he would take either excessive agreement or denial as an unfavorable sign.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I understand your concern very well. However, you\u0026apos;re counting your chickens before they hatch.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2014;I can trust you, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You probably wouldn\u0026apos;t believe me even if I answered, but you can trust me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor me, Hiyori\u0026apos;s existence was becoming indispensable.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAn existence that made me learn an unfamiliar emotion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI couldn\u0026apos;t help but want to find out whether or not I could be certain it was what Hashimoto called a first love.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wanted to experience being swallowed by the irresistible waves of emotion and see how I would be carried away.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wanted to take both myself and the other person apart and seek the answer to the very end.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was true that I would remember his warning as a warning, but I had no intention of stopping.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBecause I was already getting ready to dive in as deep as I could.\u003c/p\u003e\u003ch1 class=\"heading_1\"\u003e\u003ca class=\"heading-link\" href=\"/read/ss-y3-v2/2\"\u003eChapter 7:\u003cbr/\u003eThe Observer\u003c/a\u003e\u003c/h1\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eA WEEK HAD finally passed since the exam announcement\u003c/em\u003e\u0026#xa0;and the Thursday of the reveal arrived.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe only slightly worrisome elements were the encounter with Ike and his friends at the cafe and Hoshinomiya-sensei\u0026apos;s approach; I received no reports of trouble from any other classmates.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe matter with Hoshinomiya-sensei was unfortunate, as it only served as a disadvantage to the alliance, but it was also a reflection of just how hungry she was for victory.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe exam was truly a neck-and-neck race. In truth, it was completely unclear if any gap had formed at all. The students of Ryuuen\u0026apos;s class also had an exemplary week, remaining calm and taking no action to entrap students from other classes. It seemed that the outcome would be decided by a truly trivial difference.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I waited in the classroom that morning for my classmates to arrive, a bewildered-looking Hashimoto came hurrying in.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This is a real pain, Ayanokouji. At the eleventh hour, it\u0026apos;s confirmed that Rokkaku\u0026#xa0;and Yano\u0026#xa0;will be absent.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ryuuen?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I suspected that right off the bat, too, but apparently there wasn\u0026apos;t any real contact. They\u0026apos;re saying they just got sick and have a fever.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAccording to Hashimoto\u0026apos;s explanation, the two of them had an idea what caused the fever; apparently, when Rokkaku and the others were shopping a few days ago, a sick-looking employee at the mall sneezed on them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom what I heard, it seemed like an unavoidable, unforeseen event.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRokkaku and the others also understood the cause of their poor health and moreover, they hadn\u0026apos;t done anything reckless like forcing themselves to come to school, so there was nothing to blame them for.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;d love it if today\u0026apos;s tardiness and absences don\u0026apos;t affect the exam... but things are never that simple, are they?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Probably.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePresumably, the scope of the exam extended right up to that morning\u0026apos;s attendance, covering the entire week.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf that was the case, the absences might have dealt a fatal blow in such a neck-and-neck competition.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;At this point, all we can do is hope your 90% prediction is wrong, Ayanokouji, and that this exam has nothing to do with it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto pinned his hopes on the few remaining unknown rules and details of the exam.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t think it\u0026apos;s a concern with this class, but make sure to tell everyone not to slander the two who are absent under any circumstances. Even if we lose because of it, it won\u0026apos;t affect the general state of the class.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I figured you\u0026apos;d say that, so I\u0026apos;ve already sent out the notice.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePhone in hand, Hashimoto showed me the screen, indicating he just sent the message.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter that, the classmates who arrived in the classroom seemed to have learned of the situation; though they appeared slightly disheartened and shaken, they quickly composed themselves and went to their seats with expressions of acceptance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey understood very well that panicking wouldn\u0026apos;t get the class points back.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFurthermore, not abandoning the hope Hashimoto had for an unrelated exam, I could see several students tackling their studies.\u003c/p\u003e\u003ch2 class=\"heading_2\"\u003ePart 1\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eICHINOSE INVITED ME to have a little discussion about the exam results after school, so for the first time in a week, I headed to the front of the gym on the second floor of Keyaki Mall. There, I spotted Watanabe from behind, standing near the entrance and looking up at the gym. He then paced back and forth, crossing the gym\u0026apos;s entrance over and over again. But he never went inside; I could see him repeat this behavior.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What are you doing?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Wh-whoa, Ayanokouji!? H-hey, long time no see. Wh-what a coincidence... haha.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShowing blatant agitation with slightly broken speech, Watanabe raised his hand and answered.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I was just thinkin\u0026apos; about maybe joinin\u0026apos; the gym, y\u0026apos;know? Like, I\u0026apos;ve got this newfound desire to work out and get lean? And I was wonderin\u0026apos; if going to the gym with Amikura would mean we could spend more time together. Well, a mix of things like that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNeither was a bad thing, but it was clear that the latter objective was the bigger one.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If that\u0026apos;s your plan, you should just go ahead and join. It\u0026apos;d be nice for me, too, since having you join would mean another person to talk to.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;R-really? In that case, can I just say you were the one who invited me!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed he didn\u0026apos;t so much want to take the final step himself as he wanted someone to give him a push.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I have no problem with that at all.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I readily agreed, Watanabe seemed genuinely happy, his eyes sparkling with delight.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m meeting Ichinose after this, but do you want to join right now, maybe do a trial run? I\u0026apos;m guessing Amikura will probably be there, too.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;A-a trial by fire right off the bat, huh...!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor a moment, it crossed my mind that he might flinch, but Watanabe nodded as if he\u0026apos;d made up his mind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, as he faced the gym, his brave advance came to a halt.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Isn\u0026apos;t this a little too obvious?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, I can\u0026apos;t deny that. Girls especially seem to be perceptive when it comes to romance. If you, who\u0026apos;s had nothing to do with the gym until now, suddenly joined the group, it\u0026apos;s conceivable that Ichinose, or in some cases, Amikura herself, might get suspicious.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI explained this to Watanabe, mixing in my own analysis, which was gradually improving.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s no good! S-seriously, I can\u0026apos;t have Amikura finding out at this stage!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter letting his imagination run a little, he seemed to have concluded that he couldn\u0026apos;t hide how suspicious he looked.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Letting her know you like her is also a valid strategy, you know.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;M-maybe, but I\u0026apos;m not a veteran like you, Ayanokouji... I\u0026apos;m like a hero in an RPG who hasn\u0026apos;t even left the first village yet, you know? It\u0026apos;s impossible at level one...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t quite understand his analogy, but it seemed he still wanted to avoid letting Amikura know his feelings.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Should you hold off on joining then?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ugh... If I can, I wanna have as many chances to talk to Amikura as possible... but still...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In that case, it\u0026apos;s a bit roundabout, but there is a way to camouflage your objective.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Camouflage?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s an exaggeration to say \u0026apos;hide a tree in a forest,\u0026apos; but you could just get two or three other people besides yourself to join the gym at the same time. If you\u0026apos;re just one of several people who were invited, it\u0026apos;ll be harder for her to figure it out.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ooh, that\u0026apos;s a great idea. Is there anyone from your class you could ask, Ayanokouji?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, it\u0026apos;s better to avoid Class C. To join Ichinose and Amikura\u0026apos;s circle naturally, it\u0026apos;s best to select people from the same class.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBesides, involving Class C would make problems more likely to arise when the framework of the alliance was removed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see... It\u0026apos;s true that it\u0026apos;s more natural to get close to a classmate... but is there anyone who\u0026apos;d join if I asked...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis was the first time I\u0026apos;d interacted with Watanabe since my class transfer, but he didn\u0026apos;t mention my move from Class A to C at all. It seemed less like he was deliberately avoiding a sore subject and more like he wasn\u0026apos;t that concerned about it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t know much about Class D, but what about Shibata? As a member of the soccer club, he probably doesn\u0026apos;t mind physical activity and at the gym, he could further build up his body\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s absolutely impossible.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWatanabe\u0026apos;s eyes flew open as he grabbed both my shoulders, cutting me off as if to say, \u0026quot;Don\u0026apos;t say another word.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s impossible?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s just cruel, Ayanokouji... The fact that you\u0026apos;re sayin\u0026apos; it without even knowing why just makes it more infuriatingly impossible... If Shibata saw you and Ichinose together, he\u0026apos;d cry...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hm...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter saying it was impossible, he muttered something in a very quiet voice, but I couldn\u0026apos;t quite catch it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Look, he could become a rival for Amikura\u0026apos;s affection, right? Shibata\u0026apos;s surprisingly popular with the girls.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see. I hadn\u0026apos;t considered that perspective.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had next to no information on who in Class D was interested in whom.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But I can\u0026apos;t think of anyone else who\u0026apos;d do it. It costs money to join, too.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was true that joining out of inertia or just to be sociable, without any real interest, carried its own risks.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In that case, I have a clever idea. Provided he won\u0026apos;t be a potential rival for you, of course.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Who is it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Kanzaki and Himeno. Then Hamaguchi. Should be okay with these three, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What a mismatched trio, huh? Himeno\u0026apos;s a girl, and it\u0026apos;s not like Kanzaki and Hamaguchi are the type to be rivals in love. But I can\u0026apos;t picture them going to the gym at all.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not as surprising as you might think. Especially if Kanzaki\u0026apos;s motivated, there\u0026apos;s a chance the negotiation could work out.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is that... so?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWatanabe tilted his head, not quite understanding.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If it\u0026apos;s alright with you, Watanabe, I was thinking of talking to them. Is that okay?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, sure.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI intended to use Kanzaki and the others to bring about a change in Ichinose, but the fact that she evolved beyond his expectations would surely be a joyous thing for Kanzaki as well, though he probably strongly doubted how genuine that evolution was.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe fact that he hadn\u0026apos;t approached me despite hearing about the alliance served as proof of that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUp until now, we only exchanged occasional pleasantries, but from here on, it would be desirable to get closer and spend as much time as possible talking over the next few months.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo matter how much Ichinose cast aside her hesitation, she couldn\u0026apos;t win on her own.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was essential to raise the level of students like Kanzaki, Himeno, and of course, Watanabe and Amikura.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUsing the gym as a meeting place with Class D was an on-the-spot idea, but if it worked out well, it might not be a bad thing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;For now, hold off on joining today and give me a little time. I\u0026apos;ll somehow get Kanzaki and the others to join the gym and try to create an opportunity for you to naturally get closer to Amikura.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;O-oh. Thanks, Ayanokouji. You\u0026apos;re a good guy, you know that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe tried to suppress his happiness, then went down the stairs from the second floor, where the gym was, to the first floor.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe fact that his steps seemed to have a little skip in them was probably proof of his anticipation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was still a little while before Ichinose would arrive, but I decided to change and start my workout.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I was showing my membership card at the reception to check in, a student came in behind me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Hey...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was Utomiya from Class 2-C. I\u0026apos;d never seen him at the gym before, but was he perhaps a member? As if he thought he was being scrutinized, he spoke uncomfortably.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I was just a little curious, so I came to have a look. Are you... a member here, senpai?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWas he hoping to join? Perhaps a new breeze was blowing into the sparsely populated gym.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah. A friend invited me a little while ago and I started coming.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see... I get it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was painfully obvious from his attitude that he had no interest in the fact that I came here or what impression I had of the gym.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;They offer a free trial, so if you\u0026apos;re interested, you should give it a try.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI told him anyway, even though I thought it might be meddling.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll think about it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd, just as I\u0026apos;d imagined, the reply came back with a cold expression, one that looked like he had no intention of thinking about it at all.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps he was displeased at being seen considering joining the gym, because he turned right back around and left.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That was Utomiya-kun, right? Are you two on bad terms? It looked pretty tense.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAkiyama-san, who happened to be passing by, asked me with a wry smile.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t mean for it to be, but I can\u0026apos;t say we\u0026apos;re on friendly terms, to be polite.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn most cases, when I talked with Utomiya, Tsubaki was often with him and we rarely ever spoke one-on-one.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But I\u0026apos;m surprised you knew Utomiya\u0026apos;s name.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;He\u0026apos;s been coming here for the last two days straight, and I\u0026apos;ve seen him at the reception desk or the entrance like just now, so I\u0026apos;ve had a few chances to talk to him.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So he\u0026apos;s really considering joining?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I wonder. That might be part of it, but I think he\u0026apos;s probably more concerned about his kouhai-chan.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;His kouhai?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s a first-year girl who was brought here by Utomiya-kun and joined recently. She just joined two days ago, but they seemed pretty close. Maybe he was worried about her?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRather than having met after he became a second-year, perhaps they were acquaintances from before who ended up enrolling at ANHS?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Looks like she hasn\u0026apos;t come yet today, though~\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, if he was acquainted with this kouhai, there was no need to come all the way to the gym to see her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf he had some business, he could just contact her on his phone. Considering that, it could be that they had only just met and hadn\u0026apos;t yet exchanged contact information directly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;By the way, that girl is an amazing athlete. The first day, a crowd gathered when she was on the treadmill, so I took a look too, and she was maintaining a 20-kilometer pace for several minutes. And she was perfectly fine training after that. Mashima-sensei got really into it, too.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWell, normally, you wouldn\u0026apos;t come to a gym and run at 20 kilometers per hour.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf your timing was off by even a single step, there was a risk of falling, and since it didn\u0026apos;t stop immediately even when the stop button was pressed, the emergency stop couldn\u0026apos;t keep up. It seemed to have limited applications, such as for those with experience in track and field, soccer, or martial arts to use for a moment of intense sprint training.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor a first-year high school student, fifteen or sixteen years old\u0026#x2014;and a girl at that\u0026#x2014;to be able to handle it meant she was remarkably talented.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn fact, there\u0026apos;d been children in the White Room who dropped out, unable to achieve that level.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn any case, it probably meant that an interesting talent joined the gym.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut what was Utomiya\u0026apos;s reason for taking an interest in that girl?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I made some unkind speculations about it\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Perhaps a storm of love is brewing.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAkiyama-san said so and laughed, her eyes narrowing happily.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI see. It might have been another one of those things, like Watanabe\u0026apos;s feelings or the boys\u0026apos; maneuvering for Shiraishi.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRomance, something I would never have known about if I hadn\u0026apos;t started dating Karuizawa.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd then, the image of Hiyori surfaced in my mind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThrough experience, I was becoming more sensitive to the romantic developments concerning myself and those around me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah, right... Um, there\u0026apos;s just something I wanted to ask, if that\u0026apos;s all right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What is it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Um, about Mashima-sensei... How should I put it... Is my impression of him the right one? It\u0026apos;s not like he\u0026apos;s actually a player, is it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;While I cannot definitively deny the possibility that he possesses such a side, I do believe he\u0026apos;s a reliable teacher. I don\u0026apos;t think he\u0026apos;s so different from the impression you have of him.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I-Is that so? Thank you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t as if there\u0026apos;d been any major developments between the two. Rather, Akiyama-san\u0026apos;s demeanor was such that it made me think there might be some progress between them in the future.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eInside the gym, there was no sign of Koenji or the notable first-year and the gym was deserted.\u003c/p\u003e\u003ch2 class=\"heading_2\"\u003ePart 2\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAFTER WORKING UP a good sweat, I left the gym with Ichinose and Amikura.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Alright, I\u0026apos;m gonna make a little detour on my way home,\u0026quot; Amikura announced as soon as we stepped outside, then promptly put some distance between us, waving as she headed down the escalator.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;She was in quite a hurry. Is she meeting up with someone?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Mm, I think she was just being considerate. So that you and I could talk alone, Ayanokouji-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWas it out of concern for the leaders of allied classes to deepen their friendship? Or some other kind of consideration? It wasn\u0026apos;t particularly difficult to imagine the real reason.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you\u0026apos;d like, how about we walk home together? Ah... saying it like that makes it hard for you to say no, doesn\u0026apos;t it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, it\u0026apos;s fine. I was planning on heading straight home today anyway. Besides, we haven\u0026apos;t had a chance to talk about the exam.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Really? That\u0026apos;s great, I\u0026apos;m glad.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI left Keyaki Mall with Ichinose, who looked up at me and smiled, her eyes narrowing slightly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe time was past 6:30 p.m., but it wasn\u0026apos;t dark outside.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was proof that winter\u0026apos;s shadow had completely retreated and the daylight had begun to linger, one step at a time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The outcome this time was unfortunate, wasn\u0026apos;t it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even if you\u0026apos;re thorough about managing your health, some things are just out of your control. It can\u0026apos;t be helped.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as every class imagined, the recent exam took place over the course of one week.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe evaluation was based on how well we adhered to proper daily conduct and school rules, and although we weren\u0026apos;t told the detailed point distribution, we were informed that all four classes were more or less neck and neck.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe results were: Ichinose\u0026apos;s class in first place with 50 Class Points. Horikita\u0026apos;s and Ryuuen\u0026apos;s classes were in second place, each receiving 10 Class Points. My class, with two absentees, came in last with a deduction of 25 points. It was a relief that Hoshinomiya-sensei\u0026apos;s outburst didn\u0026apos;t have a negative impact.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHorikita Class 1240 points\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen Class 1081 points\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAyanokouji Class 867 points\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIchinose Class 864 points\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was no change in the class rankings, and the gap from Class A to Class D remained mostly unchanged.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not a problem in the grand scheme of things. It\u0026apos;s a gap we can close if we aim to win the next special exam.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see. That\u0026apos;s very reassuring. I\u0026apos;ll do my best to help out as much as I can, too.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course, I\u0026apos;m counting on you. More importantly, I have something else I\u0026apos;d like to discuss. I\u0026apos;m thinking of getting more people to join the gym. Is it alright if I invite them?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I think that\u0026apos;s a great idea! I was actually getting a little worried about things like sales, since the number of members is so low.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIchinose readily expressed her approval, agreeing it was a good plan.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But you don\u0026apos;t need my permission or anything.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s not quite right. The students I\u0026apos;m thinking of inviting are from your class, Ichinose.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh, really? Who are they?\u0026quot;\u003c/p\u003e\u003cimg src=\"/hola-lector-agua/images/books/ss-y3-v2/OEBPS/lVhZMayuhWwmBdFdcwpCW.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The three I\u0026apos;m thinking of asking are Watanabe, Kanzaki, and Himeno.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI consciously relayed the names in a natural flow, so as not to hint at any particular intention with the order or combination.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd I deliberately chose not to mention Hamaguchi\u0026apos;s name.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, it was a petty trick at best. Upon hearing the three names, Ichinose smiled.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s an interesting trio. Kanzaki-kun has seemed a little distant from me lately, and on the other hand, it seems he\u0026apos;s gotten closer with Himeno-san, as the two of them have apparently been seen talking together at times. I\u0026apos;m aware they were trying hard to do something when I was being so unreliable. If we\u0026apos;re at the gym together, we might be able to remove that unnecessary barrier, don\u0026apos;t you think? But in that case, wouldn\u0026apos;t it be better to invite Hamaguchi-kun as well?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed she completely read my intentions. And she had a magnificent grasp on the state of her own class.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And Watanabe-kun simply wants to get closer to Mako-chan\u0026#x2014;I guess that\u0026apos;s about it, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Impressive. I guess it was obvious.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile I was sincere about wanting to liven up the gym, she saw through the reasons for my choices all too easily.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I can figure that much out. But, yes, I\u0026apos;d totally welcome them. I think Watanabe-kun will be fine as long as we just pretend not to notice his true motives, but... I wonder if Kanzaki-kun and the others will agree to join?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;They\u0026apos;ll join. No, I believe they have to.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re right. It doesn\u0026apos;t have to be the gym later on, but I\u0026apos;ve been feeling that we really do need to unite the class in the truest sense, and sooner rather than later.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In that case, I\u0026apos;ll go ahead and ask them without hesitation.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Okay, thank you. I\u0026apos;m really happy for your support, Ayanokouji-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter Ichinose, standing to my right, gave me an unreserved smile, the back of her left hand brushed against the back of my right for an instant.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen her hand slowly drew near again and our fingertips touched and intertwined.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, she reflexively realized it was wrong and hastily pulled away.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer cheeks reddened, and she averted her gaze. But her eyes slowly returned to me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I-I\u0026apos;m sorry... I\u0026apos;m sorry. I just... couldn\u0026apos;t help wanting to touch you... even though we\u0026apos;re just friends, aren\u0026apos;t we.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven though we knew everything about each other, our relationship was that of friends.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven though I knew it was only a difference in a single expression, a large, insurmountable wall stood between us.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was easy enough to take her wavering hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was sure that Ichinose herself wouldn\u0026apos;t have minded the action.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t dislike her personality, her body, or her thoughts.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn fact, it was true that she seemed far more charming than some half-assed person.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I stared at her, Ichinose shyly met my gaze as well.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe also possessed the great capacity to accept me, even knowing a part of my darkness.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd yet\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI would have denied that my heart was being swayed by romance at that very moment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI recalled the other day: the library after school with Hiyori and the sight of her holding the flower.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA space enveloped in a sense of bliss, a feeling I never experienced before.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI clearly desired what I had felt on that day, at that time\u0026#x2014;an emotion I had no memory of experiencing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2014;Who are you thinking about?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs if she slipped into my thoughts through our meeting gaze, her lips moved to form those words.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What makes you think that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Because you looked so happy, I suppose.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIchinose had always been skilled at reading the atmosphere and understanding people, but since that night, her perception had sharpened dramatically.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m sorry, you don\u0026apos;t have to answer. It\u0026apos;s not something a friend should be prying into... right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe showed a slightly lonely expression but quickly returned to her usual self.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEventually, we arrived in front of the dorms, keeping a slight distance between us.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll be waiting for Kanzaki-kun and the others\u0026apos; reply, okay?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter watching her back as she hurried into the dorm ahead of me, I lifted my gaze slightly and stared at the sky, stained by the sunset.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe joy of learning a new emotion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd what kind of effect that emotion would have on myself, and on others.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWould what came next be prosperity, or ruin?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOr perhaps, something else entirely?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was, at that moment, living a very fulfilling\u0026#x2014;contented moment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor that, I had to be truly, deeply grateful.\u003c/p\u003e\u003ch2 class=\"heading_2\"\u003ePart 3\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA LITTLE PAST 4:30 p.m. on Thursday, around the time Ayanokouji met up with Ichinose and the others.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHaving received a message from a certain individual, Shiraishi appeared at the restaurant alone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt that hour, most students gathered at the cafe, so the restaurant, where meals were the main focus, was comparatively less busy, with empty seats always standing out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe sat alone at a table in the back and ordered a cup of black tea from her tablet.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe flavor was not something one could praise, even out of politeness; it tasted like it\u0026apos;d been brewed from a cheap teabag.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi imagined that if it were of the same quality as the cafe, the place would have been bustling at this hour as well. Still, it wasn\u0026apos;t that there were no customers at all, just a sparse few. Then, just as her tea was delivered, another student came in and sat down at the table next to Shiraishi\u0026apos;s.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom over her shoulder, she could hear the electronic chime of a tablet being operated and an order being placed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Have I kept you waiting?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe charming words came from behind her. A voice, clear and unadulterated, unpolished yet powerful, reached Shiraishi\u0026apos;s ears.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Not at all. I only just arrived myself.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you really sure this was the right place to meet?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. It\u0026apos;s easy for our voices to carry even when we\u0026apos;re back-to-back with the sofa in between, don\u0026apos;t you think?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s true that it\u0026apos;s easier to talk since there are few customers, but on the flip side, that means we inevitably stand out. Anyone who enters can spot us easily, and it\u0026apos;s unavoidable that we\u0026apos;ll leave an impression.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was no panic in her voice, but she gave off a strong sense of caution.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe situation, where she could only hear her companion\u0026apos;s voice, worked to Shiraishi\u0026apos;s advantage.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was no way for the person in question to know that she\u0026apos;d been placed in such a unique environment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Visually speaking, that may be so. However, it\u0026apos;s impossible for anyone to imagine our relationship from this back-to-back situation. The fact that we might catch someone\u0026apos;s eye also means that they catch ours. As long as we remain calm, there won\u0026apos;t be any problems.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey\u0026apos;d simply come to the unpopular restaurant individually. Seeing two students from different classes\u0026#x2014;no, different school years\u0026#x2014;the number of people who could imagine they arranged to meet and were conversing on purpose was extremely limited.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I think an ordinary student would just assume we\u0026apos;re here waiting for two different people. However, there are a few individuals I need to be wary of. If one of them, Ayanokouji-senpai, were to see this...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even if he didn\u0026apos;t understand it just from witnessing the situation, he would still unconsciously commit this pairing to memory and likely retrieve it later as needed.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOn that day, at that time, Shiraishi and Nanase sat back-to-back in the restaurant. Had they been pretending to be strangers while having a conversation they didn\u0026apos;t want overheard? He would begin a line of deduction an ordinary person could never reach.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you understood that, may I ask why you still took that risk?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The risk you\u0026apos;re concerned about, Nanase-san, has already been eliminated. Ayanokouji-kun just entered the gym with Ichinose-san. At the very least, he won\u0026apos;t be out for another hour.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Surely you didn\u0026apos;t ask Ayanokouji-senpai directly, or have someone else find out for you, did you? Even that would be cause for suspicion.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer tone of voice remained the same, but Shiraishi didn\u0026apos;t miss the faint anxiety it contained.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t worry. The only words we exchanged today were morning greetings.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then how did you ascertain Ayanokouji-senpai\u0026apos;s location?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;How I procured that information is a trade secret.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe used a line she heard from Ayanokouji himself during a previous exchange.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Forgive my rudeness, but if you used your friend Nishikawa-senpai, I believe she would be ill-suited for the task. There\u0026apos;s no way Ayanokouji-senpai wouldn\u0026apos;t notice if she carelessly tailed him. It\u0026apos;s entirely plausible he would suspect it was your doing, Shiraishi-senpai, since you two are close. Or does she perhaps possess some hidden talent?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was a subtle shift in Nanase\u0026apos;s speech that an ordinary person wouldn\u0026apos;t have noticed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOnly when she spoke the name Nishikawa was there a truly faint, yet deliberate, emphasis.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re aware that she isn\u0026apos;t capable of handling such a major role, aren\u0026apos;t you? My apologies, but Nishikawa-san is merely a friend. Your attempt to read so deeply into things is meaningless.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Is that so?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s all well and good to meticulously check for any missteps on my part, but you\u0026apos;ve exposed your own foolishness quite spectacularly, Nanase-san. To let an uninvolved student discover the existence of your second phone and then to be overheard speaking with someone who was supposed to have left the school.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re right. I was careless in that regard.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ve taken measures to sufficiently silence Hashimoto-kun and Morishita-san, who happened to witness it. It\u0026apos;s possible it may eventually reach Ayanokouji-kun\u0026apos;s ears, but for the time being, it should be fine.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So you took care of it for me. Thank you very much.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi picked up the saucer with her left hand, then placed the fingers of her right hand on the handle of the cup.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Shall we get to the point now? Contacting me is a clear violation of the rules.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I am fully aware that up until now, you\u0026apos;ve lived your life at this school as a completely ordinary student. However\u0026#x2014;I, too, have a job that only I can do, so this was unavoidable. Please, I need your help.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What is it you want me to do?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I want to get Ayanokouji-senpai expelled. As soon as possible, and at a time he can\u0026apos;t predict.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eClosing her eyes, Shiraishi mulled over Nanase\u0026apos;s words, letting them sink in deep.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a tone of impatience, not one of deceit. She assessed its credibility within herself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I sympathize with your feelings, but I must decline to offer my assistance.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why...is that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s because I am, strictly speaking, an observer. From the very beginning, I was never given any role beyond that. It is precisely because I didn\u0026apos;t get involved in anything for these past two years that, from Ayanokouji-kun\u0026apos;s perspective, I was nothing more than \u0026apos;Female Student A\u0026apos; from another class\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then why have you started to close the distance now? Even if he doesn\u0026apos;t know who you are, Shiraishi-senpai, he might recognize that you\u0026apos;re not an ordinary student.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I suppose so. But it can\u0026apos;t be helped, can it? Through an ironic twist of fate, he and I ended up in the same class. By chance, we ended up in adjacent seats. And by chance, an opportunity arose for the two of us to speak in the classroom one morning... Given all that, there\u0026apos;s no way I can possibly suppress this impulse...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi smiled as she recalled that event, the morning they\u0026apos;d spoken alone in the classroom.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I will spend my days with Ayanokouji-kun as a classmate. For now, I just want to purely enjoy this environment. Nothing more, nothing less, simply as an observer. Besides, that nuisance, Sakayanagi-san, has voluntarily withdrawn from the school.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is that so... I understand. It seems it will be difficult to rely on you as things stand, Shiraishi-senpai.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo take a breath, Nanase took a sip of the freshly delivered iced milk through a straw.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Have your fellow students also been given a similar role, Shiraishi-senpai? That is, the role of an observer?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Who knows. The possibility that they\u0026apos;ve been given the same role as me isn\u0026apos;t zero, but I don\u0026apos;t know. All that is required of us is to spend three years as ordinary students. It\u0026apos;s as simple as that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I will take action while Ayanokouji-senpai is still within reach. If I cannot receive your cooperation, Shiraishi-senpai, then I may have to find one of your fellow students who will cooperate.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even if you threaten me, cooperation is a difficult matter.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I am from that side.\u0026quot;\u003csup id=\"fnref-1-87c39c1f-e305-518e-87f6-94b3a5050825\"\u003e\u003ca class=\"footnote-ref\" href=\"#fn-1-87c39c1f-e305-518e-87f6-94b3a5050825\" data-ref=\"1\" epub:type=\"noteref\"\u003e[1]\u003c/a\u003e\u003c/sup\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Aren\u0026apos;t you leaving a little something out? \u0026apos;Supposedly,\u0026apos; isn\u0026apos;t it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...My apologies. It is true that my position may be rather ambiguous. However, isn\u0026apos;t it precisely because my position is different that I\u0026apos;m not in violation of the rules?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s true. The reason I accepted your invitation today, Nanase-san, was because I wanted to reassure you regarding the matter with Hashimoto-kun and Morishita-san. I have no intention of cooperating in any other matter.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;At least give me some information... Please, just disclose the names of your associates. After that, we\u0026apos;ll handle\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you wish to know, I suggest you ask your superiors directly. Tsukishiro-san, was it? You have someone reliable you can turn to, don\u0026apos;t you? Not that I\u0026apos;m fond of him.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi placed her finished cup on its saucer and rose from the sofa.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I understand that you will not be cooperating for the time being. However, there is just one thing I\u0026apos;d like you to remember. May I state it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What is it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That if I am expelled before Ayanokouji-senpai\u0026apos;s fate is decided... things may very well head in a direction that Shirogane-sensei would not desire\u0026#x2014;I ask that you please bear this in mind.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Very well. I shall keep it in mind.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi answered as such without so much as a nod, and left the restaurant before Nanase.\u003c/p\u003e\u003chr class=\"footnote-rule\"/\u003e\u003col class=\"footnotes\"\u003e\u003cli data-id=\"87c39c1f-e305-518e-87f6-94b3a5050825\" data-ref=\"1\" class=\"footnote first-footnote\" id=\"fn-1-87c39c1f-e305-518e-87f6-94b3a5050825\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003ca class=\"footnote-backref\" href=\"#fnref-1-87c39c1f-e305-518e-87f6-94b3a5050825\"\u003e[1]: \u003c/a\u003eNanaese\u0026apos;s statement \u0026quot;I am from that side\u0026quot; (\u0026#x305d;\u0026#x3061;\u0026#x3089;\u0026#x5074;\u0026#x306e;\u0026#x4eba;\u0026#x9593;\u0026#x3067;\u0026#x3059;) is her saying she\u0026apos;s aligned with the anti-Ayanokoji faction (\u0026quot;superiors\u0026quot;, Tsukishiro etc.) Shiraishi responds with \u0026#x4e00;\u0026#x5fdc; which means \u0026quot;for the time being\u0026quot;, \u0026quot;tentatively\u0026quot;, or \u0026quot;In principle\u0026quot; she is essentially saying \u0026quot;Your position isn\u0026apos;t as strong as you\u0026apos;re making it sound\u0026quot;, she dismisses Nanase\u0026apos;s declaration.\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e\u003ch1 class=\"heading_1\"\u003e\u003ca class=\"heading-link\" href=\"/read/ss-y3-v2/2\"\u003eEpilogue:\u003cbr/\u003eAnother Story Begins\u003c/a\u003e\u003c/h1\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIT WAS JUST before 11:00 a.m. on a Saturday in late May\u003c/em\u003e\u0026#xa0;when I left my room for a meeting.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd just as I left the dorm lobby, the person I was there to meet called out to me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Good morning, Horikita-san.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKaruizawa-san, who seemed to have arrived a little earlier than planned, was smiling.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Good morning. I apologize for contacting you so suddenly last night.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026#xa0;As I\u0026#x2019;d just mentioned, I had sent the message asking to see Karuizawa-san last night. It wouldn\u0026apos;t have been surprising if she had plans, given how many friends she had, but she readily agreed to meet.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s totally fine! I mean, getting an invitation from you, Horikita-san, was kinda new and exciting, so I was happy.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe was looking forward to it, she added with a smile.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But...why are you in your uniform?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I have a Student Council\u0026#xa0;matter I need to attend to, at two o\u0026apos;clock.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEntering school grounds in casual clothes was prohibited. I explained that it would be a hassle to go out before noon in casual wear, only to have to return to change into my uniform. On days off, some students came to school for club activities, so even though we were a minority, I wasn\u0026apos;t worried that I would be the only one standing out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Being student council president sounds like a lot of work. I could never do something like that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe said, \u0026quot;No way, no way,\u0026quot; while gazing toward Keyaki Mall.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So, what\u0026apos;s the plan? I\u0026apos;m actually kinda looking forward to you escorting me around, Horikita-san.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If that\u0026apos;s what you were expecting, then I\u0026apos;m afraid I\u0026apos;ll have to apologize. I didn\u0026apos;t invite you to hang out for fun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I offered my light apology, Karuizawa-san\u0026apos;s eyes widened, as if she\u0026apos;d just realized something.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Eh, ah... Don\u0026apos;t tell me... you have something you want to know about Ayanokouji-kun?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quo
