school, but with nothing else to do, I decided to keep up my early departure routine for a little while longer. I turned off the TV, put on my shoes, and stepped out into the hall.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen the elevator arrived and its doors opened, five girls and one boy were already inside.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis wasn\u0026apos;t an unusual sight, as the elevators were often crowded on mornings before school.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eConsidering the capacity, I could\u0026apos;ve squeezed in, but the three Class A girls who happened to be riding\u0026#x2014;Shinohara, Matsushita, and Inogashira\u0026#x2014;were staring at me with somewhat cold eyes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was no point in forcing my way on, so I decided to let it go and wait for the next one.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe stairs were an option, but I chose to wait for the next elevator.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis one also had three girls on it, but there was still some room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, my feet felt a little heavy, and for a moment, I hesitated to get on. But there was clearly space, and it would\u0026apos;ve been unnatural not to get on. With that thought, I stepped forward. I turned around inside the elevator\u0026#xa0;to face the doors, and it soon arrived at the first floor.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs the last one to get on, I was naturally the first to step out into the lobby. I took a few steps and stopped, and the two girls behind me immediately walked past.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Good morning.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOne girl remained. She spoke to me from behind in a small voice, careful not to startle me. It was Hiyori, who\u0026apos;d been in the elevator with me. I\u0026apos;d seen her nearby or passed her in the halls several times like this, but we\u0026apos;d never had a proper conversation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Good morning.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Have you been...well?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Same as always.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a brief exchange. For some reason, I struggled, unable to keep the conversation going.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI\u0026apos;d envisioned going to the library, first apologizing about my class transfer, and then maybe talking about books... I wondered if it was because we were in such an unexpected place.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo, that was just a flimsy excuse. In this small community, I never knew when or where a coincidence like this would leave us alone together. It could\u0026apos;ve happened yesterday or the day before. It was something I should\u0026apos;ve been able to anticipate from the start.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026#x2014;And yet, I couldn\u0026apos;t find the words to say. That never happened before.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFeeling a strange sensation, we started to walk together.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was only a short, few-minute walk to school, but I was sure a conversation would arise naturally as we went.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOr so I hoped.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, at times like this, unexpected events tended to pile up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as we stepped outside, looking for the right moment to speak, I noticed a trio standing a short distance from the dorms, watching the lobby: Hashimoto, Morishita, and Shiraishi. It seemed I was their target, as Hashimoto approached me alone, acting as their representative.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026apos;Yo, good mornin\u0026apos;. And mornin\u0026apos; to you too, Shiina.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto offered his morning greeting with his usual casual demeanor.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026apos;Wanted to check on somethin\u0026apos; related to our class before we get to school, y\u0026apos;see.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI always welcomed contact from Class C students, but the timing of this couldn\u0026apos;t have been worse. But Hiyori, either reading the mood or wanting to get away quickly, greeted the three of them and started walking to school by herself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026apos;Whoops, was I interruptin\u0026apos; somethin\u0026apos;...? My bad.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe apologized for form\u0026apos;s sake, but considering he was using it as a convenient way to drive away an outsider who wasn\u0026apos;t his classmate, it was clear his choice of words was deliberate.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s fine.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf I wanted to have a proper talk with Hiyori, the issue could be resolved simply by heading to the library as I\u0026apos;d originally planned.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI\u0026apos;d known that for a long time. I kept procrastinating, but considering what happened today, I knew I had to go and properly clear the air soon.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ayanokouji Kiyotaka, you certainly don\u0026apos;t discriminate, do you? Are you trying to make a move on Shiina Hiyori, too?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why would you think that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s what you say, but I wonder what the truth of the matter is.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What\u0026apos;s wrong with that? It doesn\u0026apos;t matter how many cute girls he gets close to. Besides, setting your sights on Shiina-san... I\u0026apos;d say you have excellent taste. I think it shows a wonderful eye for beauty!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI could see Shiraishi\u0026apos;s eyes sparkle as she watched Hiyori walk away. It brought back memories of my recent conversation with Shimazaki and Yoshida.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn any case, there was no point in continuing this pointless conversation, so I prompted Hashimoto to move things along.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026apos;Bout that special exam plan you sent out yesterday. I wanted to confirm it with ya.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I was curious about that as well. Since Hashimoto-kun appeared to be waiting for Ayanokouji-kun, I decided to take the opportunity to join you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And Morishita, you too? You seem surprisingly interested\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I am merely an onlooker.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe onlooker declared curtly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You laid out the instructions for the special exam in the group chat last night, right? When I saw that, I was impressed, man. Thought you were finally gettin\u0026apos; serious about leadin\u0026apos; us.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI posted in the group chat that I once again believed it was highly likely the school was making our daily conduct part of the exam. I conveyed some finer points, such as recommending that students who weren\u0026apos;t confident in their actions shouldn\u0026apos;t leave the dorms, as weekends couldn\u0026apos;t be taken lightly in addition to our weekday behavior.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I bet you\u0026apos;ll manage the class more stably than we could ever imagine. Things were a real pain in other ways back when it was Sakayanagi. You think so too, don\u0026apos;t you, Shiraishi?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto tossed the topic to Shiraishi, seeking her agreement, but he received an unexpected reply.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, I hold our former leader, Sakayanagi-san, in high regard. It\u0026apos;s true that she had a habit of making decisions on her own as she pleased, but she maintained our position as Class A for two years without ever once letting it fall.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn reality, if an irregular existence like mine hadn\u0026apos;t been there, she likely would have maintained control of the class for three years without issue and led them to graduate as Class A.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I, too, agree with that statement. Only Hashimoto Masayoshi seems oddly negative, despite having been by her side.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What\u0026apos;s with that suspicious look...? I\u0026apos;m just sayin\u0026apos; it was a huge pain precisely because I was her aide, you know? Besides, in the end, it was Sakayanagi\u0026apos;s fault we dropped to Class C as a result of her doin\u0026apos; whatever she wanted.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto spoke with an attitude that suggested he was completely without fault.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh? I don\u0026apos;t believe so. Shall I specifically elaborate on the reason for you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Nah, I\u0026apos;ll pass. Just listenin\u0026apos; to your crazy talk is exhausting.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That would be wise, traitorous Hashimoto THE \u003cem\u003eRighteous\u003c/em\u003e.\u0026quot;\u003csup id=\"fnref-1-eea6e4d7-8987-50ea-8261-1c9f1ec8ffb4\"\u003e\u003ca class=\"footnote-ref\" href=\"#fn-1-eea6e4d7-8987-50ea-8261-1c9f1ec8ffb4\" data-ref=\"1\" epub:type=\"noteref\"\u003e[1]\u003c/a\u003e\u003c/sup\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What\u0026apos;s with \u0026apos;THE\u0026apos;? What do you mean, \u0026apos;THE\u0026apos;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo this incomprehensible nickname, Hashimoto retorted like a comedian.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh my, what do you mean by \u0026apos;traitorous\u0026apos;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t mind it at all. That\u0026apos;s just Morishita sayin\u0026apos; whatever comes to mind, like always. More importantly, let me get us back on topic.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as Hashimoto got the conversation back on track and was about to return to the topic of the exam, Kondou and Komiya from Ryuuen\u0026apos;s class emerged from the lobby and approached us. Their timing was so perfect it seemed planned.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The new class leader and his cronies, huh? Scheming somethin\u0026apos; evil this early in the morning?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKondou circled around us, glancing at everyone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Long time no see, Kondou. Looks like you\u0026apos;ve been keepin\u0026apos; your distance from our class lately.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, things are different now. We\u0026apos;re Class B, and you guys are Class C. We\u0026apos;re only ever on guard against the classes above us.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven as he said we weren\u0026apos;t worth his time, his words were contradicted by his attempt to make contact, and above all, a faint, unconcealable tension leaked from Kondou\u0026apos;s voice.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then you could\u0026apos;ve just ignored us today, too, you know?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I just thought you might get lonely if I didn\u0026apos;t mess with you a little.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt\u0026apos;d been the same the other day when Ryuuen came into our classroom, but the usually fussy Morishita became abnormally quiet, like a mouse. At that moment, she was staring at the trees with a feigned air of ignorance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Besides, I figured if you were havin\u0026apos; an interesting chat, you could let us in on it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Unfortunately, we were just lamentin\u0026apos; the start of another boring day.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was almost certain that Ryuuen had ordered Kondou and his group to decipher the exam rules. Perhaps they were just trying to get any hint they could. Or perhaps, like us, they\u0026apos;d already pinpointed the exam\u0026apos;s rules and sent Kondou and the others as agents.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the end, Kondou and his group, who stuck to our side, continued to apply silent pressure without saying or doing a thing, right up until we entered the school building and went our separate ways in the classroom.\u003c/p\u003e\u003chr class=\"footnote-rule\"/\u003e\u003col class=\"footnotes\"\u003e\u003cli data-id=\"eea6e4d7-8987-50ea-8261-1c9f1ec8ffb4\" data-ref=\"1\" class=\"footnote first-footnote\" id=\"fn-1-eea6e4d7-8987-50ea-8261-1c9f1ec8ffb4\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003ca class=\"footnote-backref\" href=\"#fnref-1-eea6e4d7-8987-50ea-8261-1c9f1ec8ffb4\"\u003e[1]: \u003c/a\u003eHashimoto\u0026apos;s given name Masayoshi (\u0026#x6b63;\u0026#x7fa9;) means justice/righteousness, Morishita is jokingly saying \u0026quot;the\u0026quot; in english here to emphasize how his last name means righteous even though he\u0026apos;s a \u0026quot;traitor.\u0026quot;\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e\u003ch2 class=\"heading_2\"\u003ePart 1\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWHEN SCHOOL LET out, Hashimoto immediately approached and spoke to me before I could make a move.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Can I assume you\u0026apos;re free today? Let me continue what we were talking about this morning.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m sorry, but I have plans, so I must decline. Please try not to cry, even if you\u0026apos;re hurt.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMorishita, who sat behind me, rejected Hashimoto\u0026apos;s invitation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m not asking you... I\u0026apos;m talking to Ayanokouji, Ayanokouji.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI expected this would happen ever since our conversation was interrupted this morning, but at this rate, the opportunity to head to the library was slipping further away.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShould I turn him down once and prioritize meeting Hiyori?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo... we already entered the exam period.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf that was the case, for the sake of sound class management, I should probably put off showing my face at the completely private library. There was a chance I could still meet her after this discussion was over.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Shall we change locations?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That sounds like a good idea. Seems like a troublesome phantom\u0026apos;s latched onto your back, Ayanokouji.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI followed Hashimoto, who urged me to get up from my seat, and we headed for the hallway.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi, who\u0026apos;d been there in the morning, was now talking with a girl named Nakajima, perhaps planning to spend time with her after school. She seemed to notice us, but right after, the two of them left the classroom side-by-side.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The caf\u0026#xe9; at Keyaki Mall is good, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had no particular reason to refuse, so just as I was about to give a brief reply\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That will be on Hashimoto Masayoshi\u0026apos;s treat, correct?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not that I wouldn\u0026apos;t treat you if you\u0026apos;re telling me to... but hey, why are you coming along?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Since you called me a phantom, I thought I would make good on your words for the sake of consistency. For the honor of phantoms.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wasn\u0026apos;t sure if it was necessary to be consistent or protect the honor of spiritual beings, but she probably didn\u0026apos;t approve of Hashimoto and I talking about various things by ourselves.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Jeez. Do you intend to monitor me so thoroughly?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s a path that cannot be avoided for the sake of sound class management. Well, I won\u0026apos;t be asking for anything too expensive, so please rest assured. I\u0026apos;m a woman who is kind to wallets, you know.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I said I\u0026apos;m not treating you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;ll treat Ayanokouji Kiyotaka but not me? Is this... gender discrimination...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI couldn\u0026apos;t tell if her face was one of astonishment, but Morishita\u0026apos;s eyes widened as she muttered.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I shall post on social media and request an all-out assault from my comrades.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe promptly took out her phone and began to tap her fingertips on it over and over.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah, geez, whenever you show up, the conversation never moves forward.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you wish for the conversation to proceed, why not graciously pay the price for some tea? It\u0026apos;s a small price to pay for things to go smoothly.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Agh, damn it, fine. I\u0026apos;ll treat you, so at least be a little quiet while we\u0026apos;re having a serious discussion. That\u0026apos;s an order, got it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps those words were the deciding factor, as Morishita gave a small nod and immediately closed her mouth. Then, she pressed her left thumb and index finger together and made a small sliding motion from right to left across her lips. I supposed it meant she was zipping her mouth shut.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter confirming that she\u0026apos;d actually gone quiet, we started walking again, and Hashimoto looked at me and began to speak.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I spent all day yesterday looking into the other classes.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Did you get any results?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Unfortunately, there wasn\u0026apos;t anything you could call a real find. I guess it\u0026apos;s no surprise that it\u0026apos;s hard to make a move in a special exam with no rules explained. All three classes were quiet. Or rather, I should say they\u0026apos;re no different than usual.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis probably wasn\u0026apos;t the main topic; Hashimoto continued while lightly reporting on it and moving on.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Those instructions you gave us last night, or rather, your idea... did you tell Ichinose about it too?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course. As allies, we need to share information.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Is that so? Well, it\u0026apos;s more convenient for us if Class D ranks high right now anyway. If we take first place and Ichinose takes second, then there\u0026apos;s nothing to complain about.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t that he was completely without complaints, but for now, it was probably just a confirmation to be safe.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If the exam is just like you predicted, Ayanokouji, then Ryuuen\u0026apos;s class is very likely to lose again. If Horikita\u0026apos;s class is even one step too late in noticing these rules, it\u0026apos;ll be irreversible. And even if there\u0026apos;s an unexpected exam waiting for us, we won\u0026apos;t lose if it\u0026apos;s a battle of academics. I think we\u0026apos;ve got this one in the bag.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The moment you let your guard down is when the rug gets pulled out from under you. Besides, Horikita\u0026apos;s no fool. She already realized as of yesterday the possibility that \u0026apos;school life attitude\u0026apos; is being watched, just as I told you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I told him that with conviction, he stopped walking for a moment and looked back at me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Huh? Is that right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen, after sensing from my demeanor that my statement was true, he started walking again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;How can you say for sure that she\u0026apos;s figured it out?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It just means that getting a class to unite isn\u0026apos;t that simple.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I told him only that, Hashimoto must have understood something, as he let out a short whistle.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You must have a skilled scout, or maybe you\u0026apos;ve got a spy planted in there\u0026#x2014;either way, you\u0026apos;re skillfully extracting the situation.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNormally, the inquisitive Hashimoto would probably want to pursue the matter further, including whether I was already using Yamamura, but he didn\u0026apos;t. He understood instinctively that it wasn\u0026apos;t a wise move to carelessly dig too deep here and worsen my impression of him.\u003c/p\u003e\u003ch2 class=\"heading_2\"\u003ePart 2\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAS THE THREE of us headed toward a cafe in Keyaki Mall, a female student standing by the entrance spotted us and gave a light wave. After Hashimoto and I exchanged a glance, we approached her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I thought I would join you all.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe one who answered was Shiraishi, who I thought had left the classroom earlier with Nakajima.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Where\u0026apos;s Nakajima?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We were just chatting for a bit, then we parted ways. You\u0026apos;re well aware that I was with Nakajima-san, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, Ayanokouji Kiyotaka is always ogling Shiraishi Asuka from afar, so it\u0026apos;s a piece of cake for him. Right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMorishita patted my shoulder and gave me a firm thumbs-up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Could you not make me out to be a pervert?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you afraid of being disliked? Even though you\u0026apos;re being hated by everyone in your previous class?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Whoa, whoa, just \u0026apos;cause it\u0026apos;s true doesn\u0026apos;t mean you have to say it out loud. Besides, he\u0026apos;s got us now. I mean, as a guy, I totally get wanting to stare at Shiraishi,\u0026quot; he said, patting my other shoulder and giving a firm thumbs-up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;He may be like this, but please try not to hate him.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo matter how I looked at it, Morishita seemed to be leading the effort to make me disliked.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf I were to say, at that moment, that I was just trying to keep track of the entire class, it would only be taken as an excuse.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh my, I\u0026apos;m actually very happy. It\u0026apos;s quite the honor to have someone you\u0026apos;re interested in keep their eyes on you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;For real? Good for you, Ayanokouji. Sounds like you\u0026apos;ve got a shot.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis probably wasn\u0026apos;t the first time he\u0026apos;d heard that kind of reply from Shiraishi. Hashimoto also played along, knowing it was half a joke.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs for me, I was at a loss for how to respond either way, so I just let it slide.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You get it, right, Morishita?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll be quiet for the discussion, so rest assured. Just make sure you treat me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNow a group of four, we each placed our orders and took an empty table.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was what you\u0026apos;d call \u0026apos;our usual spot\u0026apos;.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a strange thing, but people have that sort of natural habituation, like a routine.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey feel a sense of security in places they\u0026apos;ve been before, and they subconsciously choose seats that meet detailed criteria, such as the view from the seat, the way the light comes in, or the distance to the next table.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was likely influenced not only by physical aspects, but also by the consolidation of memory.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePositive factors, such as having a pleasant time with the people you were with, an enjoyable conversation, or coming up with a good idea, couldn\u0026apos;t be ignored. Conversely, if one had bitter memories associated with that seat, there would be a tendency to avoid it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA rational psychological mechanism. I could guess that Hashimoto and Morishita had a similar feeling.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi joined us, but I couldn\u0026apos;t see any change in the atmosphere, for better or for worse.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi was good at blending into the atmosphere; that was the impression she gave.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Jeez, you really made me buy you an expensive drink. You know my financial situation, yet you still ordered the most insane thing without a second thought...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs payment for her silence, Hashimoto treated her to a new frapp\u0026#xe9; made with a generous amount of strawberries. Just at a glance, it looked like it contained about five whole strawberries. While most cafe drinks were between 500 and, at most, 800 Private Points, this strawberry frapp\u0026#xe9; was 1,300 Private Points.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;My mother taught me to go all out when someone else is paying. I was simply following her teachings faithfully.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe answered nonchalantly with a statement that was exquisitely hard to judge, though I figured it was probably a lie.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;To be honest, my instincts were telling me I just wanted a regular caff\u0026#xe8; latte, but... \u003cem\u003esigh\u003c/em\u003e.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe added those words with a look of distaste and unenthusiastically plunged her straw into the strawberry frapp\u0026#xe9;.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then you should\u0026apos;ve just ordered the caff\u0026#xe8; latte...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile watching their exchange out of the corner of my eye, I had a sip of my coffee and took a breath.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI moistened my throat in anticipation of the upcoming discussion with Hashimoto.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Alright, time for a serious discussion.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUpon hearing that, Morishita mimed zipping her lips from right to left.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was probably a signal to reassure us that her lips were sealed tight.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You seem fired up, but to be honest, I don\u0026apos;t intend to be particularly concerned with winning or losing this exam,\u0026quot; I stated quietly, as all three of them turned their gazes toward me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What do you mean by that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto\u0026#x2014;no, almost every student\u0026#x2014;intended to win every single exam for the coming year.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was why his question, laced with suspicion, was a normal reaction to hearing I wasn\u0026apos;t concerned with the outcome.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This was true for the last special exam as well, but the changes in Class Points weren\u0026apos;t exactly astounding, and they didn\u0026apos;t have a major impact. As for this exam, the reward is only about half of the previous one.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, yeah, it\u0026apos;s true that even if we were to lose this one by some chance, the damage might not be that bad. But what do you mean you\u0026apos;re not concerned with winning or losing?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe greedily aimed for even a single rank higher.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto looked disgusted by my statement, which went against that stance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, I had no intention of taking a harsh stance on this exam.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;To be precise, it may be more accurate to say that it\u0026apos;s not that I don\u0026apos;t care about winning or losing, but rather that I can\u0026apos;t.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps finding some sense in that simplified explanation, Shiraishi smiled and nodded.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I believe I have some understanding of what you wish to say. You think that the information you shared with us, Ayanokouji-kun, is what\u0026apos;s most likely the real focus of the exam, correct?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe details of the exam were kept hidden. Therefore, all the third-year students had to spend the week considering several possibilities for the exam\u0026apos;s content. Some of those possibilities, such as a written test, were directly tied to one\u0026apos;s abilities, so normally, one should\u0026apos;\u0026apos;ve adopted Hashimoto\u0026apos;s mindset of wanting to win and taking action to increase their odds. Simply studying for a week would have brought one closer to victory.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut the exam I considered most likely was based on \u0026apos;everyday conduct\u0026apos;.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You can avoid obvious demerits, but you can\u0026apos;t earn merits. The only thing we can do is wait for the other classes to make a mistake. That\u0026apos;s why I think it\u0026apos;s pointless to get all worked up.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So you don\u0026apos;t think this\u0026apos;ll be a battle of academics or athletics, huh? But if that\u0026apos;s the case, wouldn\u0026apos;t it be better to let everyone know that from the start? There are plenty of guys gettin\u0026apos; all worked up so they\u0026apos;ll be ready for whatever exam comes, y\u0026apos;know?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s fine to let them put in the effort. Since the rules are unclear, it\u0026apos;s not like they can overdo it by focusing on just one thing.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto\u0026apos;s expression remained somewhat stiff, as if he was still unconvinced. Morishita was silent as usual, so I thought our conversation about the current exam was coming to an end, but Shiraishi unexpectedly took an interest.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;May I ask a small question? You\u0026apos;ve concluded that the exam is based on our everyday conduct, Ayanokouji-kun, but what would you say the probability of that is?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Over 90%. At least, that\u0026apos;s my assessment.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Damn, that\u0026apos;s crazy high. Guess I should be more on board with this, then. The day this turns out to be right is the day my faith in Ayanokouji goes through the roof.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What led you to determine that probability? It\u0026apos;s impossible to clearly tell if this week is a preparation period or the exam itself, which is exactly why everyone is speculating on all fronts. It seems you based your judgment on Mashima-sensei\u0026apos;s comment to \u0026apos;try to act in a way that befits a student,\u0026apos; Ayanokouji-kun, but I feel that alone is insufficient grounds for such a conclusion.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed Shiraishi was demanding to know the basis for my assertion of over 90%, given the few hints we had.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If it was only Mashima-sensei\u0026apos;s comment, the probability wouldn\u0026apos;t even have reached 50%.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But were there any other remarks that caught your attention? We didn\u0026apos;t miss anything, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto sought confirmation from Shiraishi and Morishita as he recalled his exchange with Mashima-sensei from the previous day.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I can\u0026apos;t think of anything.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs Shiraishi denied it, Morishita also nodded, her lips sealed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In reality, no other hints were given. Not from Class C, that is.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Whaddya mean by that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;For this exam, what some students latched onto was Mashima-sensei\u0026apos;s phrasing, \u0026apos;try to act in a way that befits a student.\u0026apos;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah, that stuck out to me too. But we can\u0026apos;t be sure if it\u0026apos;s actually related to the exam, can we?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If it\u0026apos;s ambiguous and unclear, then we should verify it. What I focused on was the next step: whether or not those words themselves held any meaning. And if they did, the next thing to investigate is whether that statement was common to all classes. If the school instructed them to convey the message without changing a single word, then you can be confident that the words themselves are meaningful.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You mean what the teachers of the other three classes said\u0026#x2014;is that it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s right. We have no information on Sakagami-sensei, but Hoshinomiya-sensei apparently said, \u0026apos;You\u0026apos;ll be fine as your usual selves.\u0026apos; Chabashira-sensei supposedly said, \u0026apos;I want you to show me that you\u0026apos;re different from when you enrolled.\u0026apos;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf one added Mashima-sensei\u0026apos;s statement to those, the rule being used for the exam became clear. The three others present would likely be able to figure it out as well.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;A single statement shouldn\u0026apos;t have been enough to narrow it down, but adding the information from the other classes feels like it\u0026apos;s removing all the static.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, you\u0026apos;re dead on... At this point, I can\u0026apos;t even imagine the rules being about anything other than our conduct.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto let out a breath with a wry smile, making no attempt to hide his admiration.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHorikita\u0026apos;s class, which lost all its Class Points at the start of the year due to their poor conduct.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIchinose\u0026apos;s class, which, despite receiving a certain number of demerits, had steadily produced results.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd Sakayanagi\u0026apos;s class, which had been more stable than any other.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOne could interpret them as pieces of advice from the teachers that corresponded to their respective results.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;By the way, how I procured information from the two classes is a trade secret.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto and Morishita could probably guess that the information about Hoshinomiya-sensei\u0026apos;s statement came from Ichinose, but because Shiraishi was also here and because it also included information about Horikita\u0026apos;s class, I kept the sources hidden.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs for the alliance, I could just announce it when the time was right.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Everyday conduct is something you practice all the time; it can\u0026apos;t decide the outcome. So that\u0026apos;s why you\u0026apos;re not hung up on it this time\u0026#x2014;it\u0026apos;s all startin\u0026apos; to make sense.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m glad you seem to understand. More than that, I want the three of you to focus, not on this current exam, but on the \u003cem\u003enext\u003c/em\u003e\u0026#xa0;special exam.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The next one? You think the next special exam is likely to be a huge battle?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. Considering the last exam and this one, it wouldn\u0026apos;t be strange for a high-stakes one to come next.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you considering the possibility that someone might be expelled?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I can\u0026apos;t say for certain, but I wouldn\u0026apos;t be surprised if that was included in the rules with a fairly high probability.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sure, not every exam is gonna be risk-free, but aren\u0026apos;t the high-stakes ones supposed to be rare?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto posed the question, wondering if it was really something to be so cautious about.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, I wouldn\u0026apos;t say that\u0026apos;s necessarily the case. It was clear from observing the upperclassmen over the last two years that the third-years\u0026apos; risk of expulsion is higher compared to the other grades.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe one who offered a reply was Morishita, who\u0026apos;d properly remained silent up to that point.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer tone suggested she understood what happened with Horikita Manabu\u0026apos;s and Nagumo Miyabi\u0026apos;s generations.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Come to think of it, last year, didn\u0026apos;t a pretty big number of students get expelled by the time the second term started?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s correct. About fifteen students were expelled. Nagumo Miyabi did as he pleased, you see. Even if that was an extreme case, it\u0026apos;s unlikely that this year alone will see everyone pass through unscathed.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Getting expelled during a time like this would seriously suck, but damn, you\u0026apos;ve got a good memory.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This is merely common sense. Common sense.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto kept several sensitive antennae tuned to information about his own grade, but it seemed he paid little attention to the other years.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hey, I thought you were just gonna listen quietly? What happened to zippin\u0026apos; it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh? When did I ever say such a thing? At what hour, what minute, what second, and after how many of the Earth\u0026apos;s rotations?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? What the hell is that supposed to mean? The Earth\u0026apos;s what-now...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Good grief. Do the youths of today truly not know the statements conceived by the great figures of the past?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was confident that my knowledge of great historical figures and their statements was fairly comprehensive, but I had no memory of that one.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe Earth took about twenty-four hours to make one rotation. More precisely, the twenty-four-hour day was defined based on the time it took to make one rotation. With that as a premise, the Earth was about 4.5 billion years old. If I were to start calculating that out, with 365 days in a year plus leap years and so on\u0026#x2014;no, this was a completely useless calculation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you\u0026apos;re truly that dissatisfied, I shall return your drink.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Return it, you say?... It\u0026apos;s empty!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was because while she wasn\u0026apos;t talking, she\u0026apos;d been silently and diligently drinking her strawberry frapp\u0026#xe9; by herself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wondered if she chugged it all just so she could start talking.\u003c/p\u003e\u003ch2 class=\"heading_2\"\u003ePart 3\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAFTER THAT, I focused on Hashimoto and Shiraishi to get information about Class C.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI asked about personal matters that couldn\u0026apos;t be understood from the OAA or written exams alone, like who was on good terms with whom, and who wasn\u0026apos;t. Although Hashimoto knew a lot about the class, there seemed to be many things that only girls could see, and I was able to hear a few useful stories that made me nod in agreement.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAbout an hour passed since we started chatting, and the caf\u0026#xe9; gradually grew more crowded as evening approached.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as I started to consider wrapping things up\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Crap... Ayanokouji again...?!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA voice exclaimed, and the pair who arrived at the next table turned to us with a look of dismay.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was Ike and Hondou, whom I ran into at the school cafeteria yesterday afternoon.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We\u0026apos;re fated to meet.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt my reply, he narrowed his eyes, his displeasure obvious.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What do you mean, \u0026apos;fated to meet\u0026apos;?! Don\u0026apos;t act so familiar, you traitor.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDisgust oozed from his expression. I thought they would immediately move to another table, like at the cafeteria, but with few empty seats available, the two of them sat down reluctantly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSeeing the Class A students, Hashimoto deliberately chose to act casual.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We\u0026apos;re in different classes, but we\u0026apos;re still students at the same school, so let\u0026apos;s get along, eh? Or are you planning to complain every time you see his face?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not like I mean to... but you can see why I\u0026apos;m pissed, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIke and his friend, not wanting to direct their frustration at Hashimoto, glanced over and glared at me again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why\u0026apos;re you so bent out of shape about it? It\u0026apos;s not like Ayanokouji transferred from C to A. Just changing classes had no effect on your Class Points. It\u0026apos;s not like it cost you anything out of your own pockets. And besides, you guys are the almighty Class A, aren\u0026apos;t ya?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThough it was a struggle, he tried to flatter them to somehow reduce their pointless frustration.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah, we\u0026apos;re Class A, but Ayanokouji hid how smart he was. That\u0026apos;s pretty much like betraying the class from the start, ain\u0026apos;t it? And then the second he transferred, bam, a perfect score. I\u0026apos;ve never seen such a nasty move.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI produced proper results in the latter half of my time in Horikita\u0026apos;s class, but perhaps for Ike and the others, that was also part of the problem.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And besides\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSeemingly with more to complain about, Ike averted his gaze from Hashimoto and looked at me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m hearing all sorts of nasty rumors, y\u0026apos;know. That you intentionally set up both Sakura and Maezono to get expelled from the very beginning. Don\u0026apos;t tell me... You didn\u0026apos;t get Haruki expelled too, did you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA former friend of ours. The name of a student who\u0026apos;d been especially close to Ike and Sudou came up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Haruki? Who\u0026apos;s that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs if the name didn\u0026apos;t ring a bell, Hashimoto looked blankly and tilted his head a little to the left.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yamauchi Haruki!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe slammed his hand on the table and shot to his feet. The cup shook from the impact, but thankfully, it didn\u0026apos;t tip over.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIke had been complaining but remained calm until now, but it seemed that was an unexpected landmine.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yamauchi... Oh, ahh, right, there was a student with that name. My bad, my bad. He was in another class, so I totally forgot about him. But I remember now. Anyway, Sakayanagi was the one who did that, right? Ayanokouji had nothin\u0026apos; to do with it, man. It\u0026apos;s way outta line to blame him for every little thing.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eApologizing for having genuinely forgotten, Hashimoto hastily tried to calm him down.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll never let a guy like you get me expelled, you hear me!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hey, I said calm down, Ike. No need to go raising such a huge death flag for yourself. Nobody wins if we start trading barbs here.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSeeing Ike\u0026apos;s increasingly heated and uncontrollable attitude, even Hashimoto started to panic. He probably couldn\u0026apos;t care less about what Ike and Hondou were feeling, but he knew this commotion wasn\u0026apos;t good for his class.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe had to have heard about one of the possible rules for this special exam from Horikita, but I wondered if he really understood it. On the other hand, if this was all an act\u0026#x2014;a strategy to drag down Class C\u0026#x2014;then it might be worthy of praise, but it wasn\u0026apos;t a clever method, as it also increased the risk of their own defeat. If he raised his voice any further and continued his belligerent attitude, he would inevitably be noticed and without a doubt be subject to a penalty.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Okay... Maybe I was overreacting a bit, but we in Class A have the right to complain this much. Just how much did they pay you to betray our class?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTheir frustration built up considerably, partly due to their defeat in the last special exam.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat wasn\u0026apos;t a problem that could be easily resolved by trying to smooth it over like Hashimoto did.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed it would be better if I just took the brunt of it and let them vent their anger.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Who can say. It might be twenty million, it might be thirty million. Unfortunately, I have no intention of revealing the exact figure to you here.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was important for me to maintain a cold and detached response.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBy doing so, Ike and the other guy could direct their hatred toward me without any hesitation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd by bringing that back to their class, they could rally together, firmly united against a common enemy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAbove all, if I got worked up here, Class C would only be at a disadvantage. Even if the school was monitoring the situation with cameras or external observers, I wanted to paint a picture where Class A was the aggressor, and Class C was trying to settle things peacefully.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was unclear if the school was monitoring us that closely, but even if our daily behavior was unrelated to the exam, it was important to act with discipline like a proper student, as it had a small, yet not insignificant, effect on our monthly Class Points.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe teachers\u0026apos; words to each class would surely be a good opportunity to make our classmates re-evaluate the importance of sticking to the fundamentals.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t you come crying to us later, regretting your decision and wanting to come back to our class.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter voicing his complaints one last time, the pair slightly distanced themselves as they returned to their seats.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey just sat down. I didn\u0026apos;t want to make their caf\u0026#xe9; time uncomfortable.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Shouldn\u0026apos;t we head back soon?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI called out to the three of them, picked up my nearly empty cup, and stood up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah, good call. We\u0026apos;ve said what we needed to.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto replied in agreement, and Morishita and Shiraishi followed suit.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen, after we left the caf\u0026#xe9;, Hashimoto turned and glanced back toward Ike\u0026apos;s group.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;All that complaining... Ike\u0026apos;s completely getting worked up over nothing. The way he blames every little thing on Ayanokouji tells me the atmosphere in their class is still pretty damn heavy. They need to get their heads on straight already.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Logically speaking, that may be so, but I believe it would be better to cut them some slack. After all, if I were a student in Class A, I\u0026apos;m sure I would be on edge in their current situation as well.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Maybe so, but still. In the first place, Ayanokouji, was it really okay not to deny taking the money? That guy\u0026apos;s gonna go around spreading all kinds of rumors, true or not.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It doesn\u0026apos;t matter. It\u0026apos;s already being whispered about as a rumor, anyway. The situation won\u0026apos;t change just because it seems a little more plausible.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So you don\u0026apos;t care what other people think of you, huh? Still, connecting it to the Yamauchi incident... that\u0026apos;s a bit of a leap, to say the least.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs Hashimoto looked on, exasperated, Morishita turned a suspicious eye toward me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You never know. With a man like Ayanokouji Kiyotaka, you can never tell what he\u0026apos;s doing behind the scenes. It\u0026apos;s a long shot, I know, but he might have had a hand in it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Nah, that\u0026apos;s going too far. But if, on the off chance, it were true, that\u0026apos;d make him one hell of a reliable ally. The stronger your allies are, the better, after all.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo matter how things turned out, Hashimoto was determined to see it in a positive light.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you overestimate me, you\u0026apos;ll only be more disappointed later.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then I\u0026apos;ll gladly overestimate you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wanted to hedge my bets just in case, but it seemed he wasn\u0026apos;t going to let me.\u003c/p\u003e\u003ch2 class=\"heading_2\"\u003ePart 4\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eBY THE TIME I left Keyaki Mall, it was past five in the afternoon.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe sky was still blue, but the evening sun would soon begin to peek through.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sorry, but I\u0026apos;m gonna take a little detour on my way back.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;A detour? Where to? I was thinkin\u0026apos; we\u0026apos;d all walk back together.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto asked, looking disappointed, as if he had assumed we would all return to the dorms together.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;To school. I was thinking I\u0026apos;d stop by the library.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah, Shiina, huh? Now that ya mention it, it seems like I interrupted you two talkin\u0026apos; this mornin\u0026apos;.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHaving prioritized his own plans, Hashimoto wore an expression that said he couldn\u0026apos;t argue with that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If that\u0026apos;s the case, I\u0026apos;ll gracefully see ya off today. Let\u0026apos;s head back, Morishita, Shiraishi.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;d rather not. Why should I have to walk home holding hands with Hashimoto Masayoshi?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No one said anythin\u0026apos; about holdin\u0026apos; hands. What kinda leap in logic is that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even if we weren\u0026apos;t holding hands, I still wouldn\u0026apos;t walk back with you. I\u0026apos;m going to browse around Keyaki Mall for a bit before I head back. So, if you\u0026apos;ll excuse me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith a graceful turn, Morishita went back inside the mall.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It seems Morishita-san dislikes you more than you imagined, Hashimoto-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t care if she hates me. It doesn\u0026apos;t bother me one bit if she does. Well then, Shiraishi, shall we go together\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m also going to take a small detour on my way back. Let\u0026apos;s walk home together some other time, Hashimoto-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Tch... I see. That\u0026apos;s a shame.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe seemed genuinely unconcerned when Morishita turned him down, but being rejected by Shiraishi as well must have been unexpected. Hashimoto\u0026apos;s shoulders slumped in disappointment as he walked back alone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Would you mind if I walked with you part of the way?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Do you have some business at the school?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No. I just thought I\u0026apos;d like to chat with you a little longer, Ayanokouji-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;With me? I\u0026apos;m not as interesting as Hashimoto, you know. Are you sure?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s just you being modest. You\u0026apos;re a very interesting person, Ayanokouji-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was hard to feel like I was being complimented, but even if it was just flattery, it didn\u0026apos;t feel bad to hear her say it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi fell into step beside me and we began to walk slowly toward the school.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt our pace, it would only be a few minutes before we reached the entrance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Come to think of it, this is only the second time we\u0026apos;ve been alone like this.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe first time was the day after I transferred to Class C. It\u0026#x2019;s been since that day that I came to school early in order to observe my classmates.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Fufu, that\u0026apos;s right. It hasn\u0026apos;t been that long since then, though.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...I suppose you\u0026apos;re right.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI made it a point of coming to school early ever since that day, but Shiraishi was no longer the first to arrive in the classroom. Now, my impression was that she tended to come in later. She\u0026apos;d mentioned she woke up unusually early that one time, so her habits were probably different from the start.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What kind of impression do you have of me, Shiraishi?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh my, that\u0026apos;s quite direct of you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Eh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I thought you were a more reserved person. I must say, that was a bold question.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No... Ah, I see, it could be taken that way. My apologies.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt might have sounded like a question related to romance, like whether she liked or disliked me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What I meant to ask was about me transferring into the class. I could tell you were welcoming from early on, but wouldn\u0026apos;t people normally be more suspicious?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why do you think that is?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe turned the question back on me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t know... I\u0026apos;d never even spoken to you during our first two years. I assumed that students who only saw me from the outside would have a rather negative impression.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter successfully navigating the first special exam, I managed to gain acceptance from my classmates, but Shiraishi seemed to place her trust in me even before that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was no sign that Hashimoto or Morishita gave her a special explanation early on.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re the person who transferred to Class C after Sakayanagi-san left, aren\u0026apos;t you? Moreover, Hashimoto-kun was certain you would be a great asset. While I\u0026apos;m not surprised some people were doubtful, I think there were actually quite a few who, like me, wanted to hold onto hope and believe in you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRather than give up on Class A, they would bet on that last chance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t difficult to say in words, but convincing one\u0026#x2019;s own heart was a different matter.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the future, for the sake of Yoshida and Shimazaki, I wanted to avoid creating opportunities to be alone with Shiraishi as much as possible. That was precisely why it might be okay to press a little further.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It may be conceited of me to say, but wasn\u0026apos;t Shiraishi watching me, to some extent, before I transferred classes?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was the same kind of observational gaze she\u0026apos;d shown in the karaoke room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed a bit excessive, going too far for someone she practically just met.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was also somehow different from the sense of distance she kept with Yoshida and the other boys.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer lips parted slightly, and an ambiguous sound, like a breathy word or a sigh, escaped them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd then Shiraishi, who stopped walking, looked directly at me from a few steps ahead and met my gaze.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ahh... that just won\u0026apos;t do.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026apos;Won\u0026apos;t do\u0026apos;? What\u0026apos;s wrong?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI asked quietly, but Shiraishi only continued to smile without answering.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter a few seconds of silence, in which it felt as if time had stopped\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m Shiraishi Asuka,\u0026quot; she said.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe already introduced ourselves long ago, and even spent time together during lunch breaks and on days off.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd yet, for some reason, Shiraishi now introduced herself all over again and held out her hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And you\u0026#x2014;who are you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wondered what the intention behind her words was.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOr perhaps, was she simply teasing me?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m Ayanokouji Kiyotaka.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePrepared to be laughed at, I accepted her words and her outstretched hand, grasping it in return.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI felt the touch of her slender fingertips, which were a little cold, but certainly held a gentle warmth.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;For some reason, you using your full name reminds me of Morishita-san.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;True...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed Shiraishi laughed, not because I was teasing her, but because of the resemblance to Morishita.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eComparing her to Hashimoto and Morishita, or Yoshida and Shimazaki, made it clear just how little my understanding of Shiraishi had progressed.\u003c/p\u003e\u003cimg src=\"/hola-lector-agua/images/books/ss-y3-v2/OEBPS/gdFtxkCshMjyAgqlHOGXR.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe Shiraishi that Yoshida saw and the Shiraishi that Shimazaki saw.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBy combining both of their impressions with my own, as her neighbor, I made some slight progress.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI thought I would be able to get a better grasp of her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn reality, however, the mystery only deepened.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer mysterious eyes couldn\u0026apos;t be confined to the simple label of \u0026apos;classmate and neighbor.\u0026apos;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOr perhaps this was simply her mysterious personality and atmosphere.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well then, I\u0026apos;ll be going. Please give my regards to Shiina-san.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the end, Shiraishi never answered my question.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWas there no reason, or was there one she simply didn\u0026apos;t want to give?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEither way, she didn\u0026apos;t seem harmful for the time being.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom there, I wanted to delve a little deeper to understand what kind of person she was.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"tex
