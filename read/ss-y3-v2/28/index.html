t-align: left\"\u003eAfter that, I made my way through the school and arrived at the library.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, that was just how things went; when the timing was off, it was completely off.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHiyori was nowhere to be seen in the spacious library and when I asked the familiar librarian, I was told she left before five o\u0026apos;clock.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince it was a Friday, it wouldn\u0026apos;t have been unusual for Hiyori to have a plan or two.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd so, day by day, my visit to Hiyori kept being pushed back\u0026#x2014;\u003c/p\u003e\u003ch1 class=\"heading_1\"\u003e\u003ca class=\"heading-link\" href=\"/read/ss-y3-v2/2\"\u003eChapter 5:\u003cbr/\u003eYamamura\u0026apos;s Courage\u003c/a\u003e\u003c/h1\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eAFTER SCHOOL ON Monday\u003c/em\u003e, it\u0026apos;d been four days since the exam was announced over the weekend.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t know how many times I hesitated, but the days truly started to feel like they were passing quickly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was still bright outside the window, but the world would soon be dyed the color of sunset.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wondered if it was what one would call a sentimental mood\u0026#x2014;it wasn\u0026apos;t bad.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ayanokouji Kiyotaka. I must ask you to lend me your face.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe moment Mashima-sensei left the classroom, that listless voice came from the seat behind me, pulling me back to reality. Yes, just as if my hair were being forcefully pulled from behind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTug, tug...\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTug, tug...\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut, it wasn\u0026apos;t \u0026apos;as if,\u0026apos; it was actually being pulled with considerable force.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are your ears working properly?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I can hear you, so stop pulling my hair. And your choice of words is questionable.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eReluctantly, I turned around and asked what she wanted.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It appears Yamamura Miki wishes to see you now.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yamamura?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSchool had only just ended, but while I was gazing outside, Yamamura vanished.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe must have slipped out into the hallway in an instant, leaving behind neither sound nor presence.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd then delivered a message to Morishita.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I suppose she could have just told you herself, but for her to approach the current Ayanokouji Kiyotaka directly would make her stand out in a bad way, even with her presence being as faint as shrink wrap. Yes, I admit my magnificent metaphor may have missed the mark a little. Do you have a problem with that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I didn\u0026apos;t say anything, though...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe played the fool, acted as her own straight man, then quietly got defensive all by herself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI intended to go to the library today for sure, but I could probably make time to see Yamamura.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMore than anything, if I missed this chance, I didn\u0026apos;t know when she would reach out again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What should I do?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You would do well to follow me. I shall guide you. And you\u0026apos;ll owe me for this, you know?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe stood up smoothly and struck a pose with a thumbs-up, like a sidekick.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wouldn\u0026apos;t have minded going by myself if she\u0026apos;d just told me the location, but she unilaterally put me in her debt... Oh well, refusing would be a hassle, so I figured it was fine.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt might have been that Morishita wanted to come along as well.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI glanced around the classroom to see who was still there.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi and Nishikawa were chatting with a group of a few other girls, while Hashimoto and Kitou were already gone from the classroom.\u003c/p\u003e\u003ch2 class=\"heading_2\"\u003ePart 1\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFOR THE MOST part, when I met up with students, it was inside the Keyaki Mall.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis was no exception for Yamamura, who did her best to conceal her presence, but the designated location wasn\u0026apos;t a caf\u0026#xe9; or the like, but rather a bit unusual.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;My? It appears she isn\u0026apos;t here.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was brought to a rest area on the second floor with a row of vending machines, but Yamamura was nowhere to be seen; instead, several first-year students were gathered and chatting on a bench.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo matter how faint Yamamura\u0026apos;s presence was, if there were several people gathered nearby, and she were hiding next to a vending machine, she would surely attract an unusual amount of attention if discovered.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It would appear she saw the group of first-years and fled.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Seems like it. But if she\u0026apos;s not here, where could she be...? Did you try her phone?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWithout answering my question, Morishita motioned with her chin for me to follow, crossing her arms and heading toward the side of the vending machines. Then she placed the palm of her right hand on the floor.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had no idea what she was doing, but I watched to see what would happen.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hmm... She must have been sitting here until just a moment ago. It\u0026apos;s still faintly warm.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is that so?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if she\u0026apos;d been sitting on the floor, it seemed like it would have returned to its normal temperature in a matter of seconds, or a few dozen at most, after she stood up\u0026#x2026;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you doubt me, you should try touching it. You\u0026apos;ll be able to indirectly feel the warmth of Yamamura Miki\u0026apos;s butt.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a rather unpleasant way to put it, but I was curious if it was actually warm, so I touched it with the palm of my hand. Instead of warmth, a chilly sensation came through.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ugh, you actually touched it. What an outrageous pervert.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But you\u0026apos;re the one who told me to touch it, Morishita...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ayanokouji Kiyotaka, if someone told you to grope them, would you just obediently do it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No... I wouldn\u0026apos;t...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s right. You mustn\u0026apos;t be so easily swayed and deceived by the words of others. From now on, let\u0026apos;s learn to judge for ourselves what\u0026apos;s right and what\u0026apos;s wrong. Is that clear?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe was admitting that she deceived me herself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wanted to point that out, but the bigger problem was the first-years watching me with curiosity from a distance as I was getting scolded by a petite girl.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd they probably also heard words like \u0026apos;butt,\u0026apos; \u0026apos;warmth,\u0026apos; and \u0026apos;pervert.\u0026apos;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a misunderstanding from beginning to end, but I probably wouldn\u0026apos;t be given an opportunity to explain myself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In any case, we\u0026apos;re moving. I\u0026apos;m told Yamamura Miki moved to just outside the south entrance.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith that, she turned her phone screen toward me, showing me a message she received from Yamamura.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e[\u0026apos;I\u0026apos;m sorry, but please allow me to change the meeting place to just outside the south entrance. I\u0026apos;m truly sorry.\u0026apos;]\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt certainly seemed she received such a message, but the timestamp indicated it arrived five minutes ago.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I want to ask, just to be sure, but when did you notice this message?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I noticed it as soon as it arrived, but what of it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFive minutes ago would\u0026apos;ve been right around when we were approaching the Keyaki Mall entrance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe indeed made a gesture as if to take out her phone... so she really did receive a message then.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So, the fact that Yamamura isn\u0026apos;t here, and that the floor is already cold...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes, of course. I was aware of all of it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a completely pointless trip\u0026#x2014;or rather, a pointless act.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Now, let\u0026apos;s hurry to the south entrance. If we keep Yamamura Miki waiting too long, her existence might just vanish from the world, you see.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDespite being the one to cause the grand delay, she turned back the way we came without showing the slightest bit of remorse.\u003c/p\u003e\u003ch2 class=\"heading_2\"\u003ePart 2\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWE BOTH LOOKED around at the same time after exiting the south entrance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh? She isn\u0026apos;t here either.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Looks like it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince the dorms were a fair distance away and the area wasn\u0026apos;t very crowded to begin with, I thought we would find her right away, but we didn\u0026apos;t. I glanced toward the roadside trees, but there was still no sign of her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;She\u0026apos;s quite a handful, isn\u0026apos;t she? Leading people around like this.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Aren\u0026apos;t you one to talk?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe looked around here and there, but we couldn\u0026apos;t find a trace of Yamamura, let alone Yamamura herself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This is like a real-life \u003cem\u003eWhere\u0026apos;s Waldo\u003c/em\u003e. What a waste of time.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you one to talk\u0026#x2014;never mind.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo matter how many times I interjected, it was probably meaningless by now.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And yet, you\u0026apos;ll still interject next time. That\u0026apos;s what it means to be the straight man in a comedy duo.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t go making us a comedy duo without my permission.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf we headed straight for the south entrance, we would\u0026apos;ve arrived a good ten minutes earlier. Then Yamamura would\u0026apos;ve been standing there quietly, waiting for us\u0026#x2014;or maybe not.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the hushed space, the cell phone Morishita held in her hand vibrated faintly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026apos;If you can find me, then come and try\u0026apos;? How provocative of her!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYamamura sent a message like that? Thinking so, I peeked at her phone screen from the side, but it seemed she only received a notification for new economic news.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Please don\u0026apos;t peek at my phone without permission, you rude person.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy impulsive action might have indeed been a bit rude.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I suppose there\u0026apos;s no other choice. Shall we try contacting her?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not that there\u0026apos;s no other choice. Shouldn\u0026apos;t we have done that from the start?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Radio waves are bad for the brain. I try to avoid using my phone as much as possible.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had no idea what she was talking about, but for some reason, I felt it was better not to press the issue.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as Morishita put her phone to her ear and started to make a call, I felt a faint breeze from behind me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah, um...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Whoa, you appeared so suddenly, Yamamura Miki. Please don\u0026apos;t startle me like that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;S-Sorry.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYamamura, who had appeared without a sound, bowed her head slightly in apology for being scolded.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis probably included an apology for changing the meeting place as well.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Morishita told me you had something to talk to me about. Is that true?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was sad that I had to start by questioning that part, but it was unavoidable, thanks to the wonderful relationship of trust I built up with Morishita.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Y... Yes. Since you transferred classes, Ayanokouji-kun, we still... haven\u0026apos;t said a single word to each other... so...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAbout a month already passed, and if you included greetings on the way to and from school as conversation, it wouldn\u0026apos;t be an exaggeration to say she was the only student in the class I hadn\u0026apos;t spoken to.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Right. I was being considerate because you dislike standing out. Were you unhappy about it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;N-Not at all. I mean, I was grateful... for it...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe way Yamamura stammered out her words, she might have seemed even more fidgety than when we first met. To the untrained eye, it might look like she\u0026apos;d regressed, but in reality, that wasn\u0026apos;t the case.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUp until now, Yamamura had quietly erased her own presence and made herself inconspicuous.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI took that image of her desperately trying to speak as a sign of evolution, a phenomenon seen in the process of breaking away from her past self.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, given Yamamura\u0026apos;s life so far, it was a difficult task to ask a person who lived 99% of their life passively to suddenly become proactive.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe tried to somehow advance the conversation on her own but couldn\u0026apos;t make any headway.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMorishita probably didn\u0026apos;t know this flustered side of Yamamura either. A passive person has a passive way of speaking, and until now, she likely engaged in dialogue with that stance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Um... I-I, therefore...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSo I would just watch over her for now. If I anticipated her and said, \u0026apos;\u003cem\u003eIs this what you want to do?\u0026apos;\u003c/em\u003e\u0026#xa0;or \u003cem\u003e\u0026apos;Is that what you want me to do?\u0026apos;\u003c/em\u003e\u0026#xa0;it would only encourage her passivity.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah, and... so...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYes... watching over her was important\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd so, what felt like a minute passed with her fidgeting, unable to continue her sentence.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShould I prompt her a little to make it easier for her to talk?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo, for her own growth, I supposed I should wait as long as it took for Yamamura to speak of her own accord.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So... what I want to say is...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe conversation wasn\u0026apos;t progressing at all.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere were quite a few students who were bad at communicating and I couldn\u0026apos;t deny that I was one of them, but I was struck by how many different types there were.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere were people like me, who couldn\u0026apos;t think of what to say in the first place, and then there were people like Yamamura, who had things they wanted to say but had difficulty voicing them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile I was prepared to wait patiently, Morishita, next to me, apparently lost her patience and went to stand beside Yamamura.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor a moment, I thought she was going to subtly give her some support, but\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Fwooh!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen, quite forcefully, she puckered her lips and blew into Yamamura\u0026apos;s ear.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Wha-a-a-aah!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYamamura, who\u0026apos;d been looking in my direction, but not actually at me, hadn\u0026apos;t noticed Morishita approaching her face. A scream, louder than any she\u0026apos;d ever let out before, echoed all around.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Wh-wh-wh-what are you doing...!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hmph. That\u0026apos;s the \u003cem\u003eEar Gun\u003c/em\u003e. All those who\u0026apos;re caught unaware are startled, you see.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You probably based that on \u0026apos;air gun,\u0026apos; but isn\u0026#x2019;t that... still just an air gun?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Now that you mention it, that is true indeed. I shall praise you, Ayanokouji Kiyotaka.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat might have been the moment in my life I was most praised, yet felt the least happy about it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI worried that Yamamura\u0026apos;s tension might have broken, just as she\u0026apos;d been working up her resolve.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMorishita, showing no signs of remorse, wore a smug look on her face and lightly pinched Yamamura\u0026apos;s cheek.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Wh-What!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;How about it, Yamamura Miki? Don\u0026apos;t you feel a little less tense now?\u0026quot;\u003c/p\u003e\u003cimg src=\"/hola-lector-agua/images/books/ss-y3-v2/OEBPS/UyCcIzEuCmoMIOGduwfNa.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Eh? Ah... I suppose... that might be so.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In all things, tension and relief are essential. That\u0026apos;s the secret bestowed upon the masters of comedy.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;C-Comedy...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, that is of no consequence, so you would do well to tell Ayanokouji Kiyotaka at once.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer expression, which had been rigid, certainly relaxed and the redness in her cheeks subsided a little.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlthough it was rough and nonsensical, Morishita\u0026apos;s actions seemed to have had a positive effect on Yamamura.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer gaze, which had been fixed around my nose, finally met my eyes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut perhaps that hurdle had been too high, as her gaze immediately darted back down.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Today... I called you here because there\u0026apos;s something I wanted to tell you...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe was able to speak much more clearly than before and without faltering.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I want to change. I want to have more self-confidence, to be able to smile in front of others. I really, truly think so.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYamamura composed her breathing and did her best to string her words together to convey her feelings.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wondered how much courage she must have mustered to expose her innermost thoughts\u0026#x2014;the pathetic, embarrassing parts.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe couldn\u0026apos;t maintain eye contact, but it was a commendable effort.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe desire to change sprouted within her, and she approached me with resolve.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Please let me... help with getting to Class A, too.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You have good grades, Yamamura and you\u0026apos;re already helpful to the class.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I want to do more... much more. Because I believe... there\u0026apos;s something... that only I can do.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You understand, do you not, Ayanokouji Kiyotaka? It should be your role here to meet Yamamura Miki\u0026apos;s expectations.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I suppose so. Then there\u0026apos;s something I\u0026apos;d like you to do for me right away.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Y-Yes!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFirst was a task suitable as a starting point to see just how useful Yamamura could be.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I want you to find out about Shiraishi Asuka.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sh-... Shiraishi-san, you mean...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe was probably prepared to conduct any kind of espionage, but she would\u0026apos;ve assumed it would be against the other classes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe surely hadn\u0026apos;t expected to be told to investigate her own class.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So the man who came to save the class was just a common lecher... I see. What has the world come to.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s quite the imaginative interpretation, as always.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Am I wrong? Shiraishi Asuka is the class\u0026apos;s secret idol. Is it possible that you, Ayanokouji Kiyotaka, have also fallen into her trap? Why don\u0026apos;t you let your heart be as honest as your body? Well? May I have your answer?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSaying that, she made a fist and pressed it insistently against my cheek.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eApparently, she was pretending her hand was a microphone, but it hurt nonetheless.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m currently struggling to raise my understanding of the class. In the process, I feel I\u0026apos;m making progress understanding people like Yoshida and Shimazaki, but with Shiraishi, it feels like I\u0026apos;m getting nowhere. I can\u0026apos;t spend forever on my neighbor, which is precisely why I want to ask for your cooperation.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You certainly have a convincing way of putting things. However\u0026#x2014;I suppose I can feel a bit of sympathy for the part about you struggling to understand her.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is... that so?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I suppose you wouldn\u0026apos;t understand, Yamamura Miki. You always use your faint presence to investigate students from other classes, or untrustworthy students like Hashimoto Masayoshi; you wouldn\u0026apos;t watch a student like Shiraishi Asuka, who seems harmless on the surface.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes... If you\u0026apos;re okay with it, Ayanokouji-kun, I think I can... try to investigate Shiraishi-san in my own way... I can\u0026apos;t, um, promise at all that I\u0026apos;ll find any useful information, though...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course, I\u0026apos;m aware of that. Whether or not she has a side she doesn\u0026apos;t show to me or our classmates\u0026#x2014;anything you learn, no matter how trivial, will be fine. Look into it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eInvestigating students from other classes came with some trouble, but since this involved a classmate, the possibility of it developing into a major problem was likely low.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, if Shiraishi recognized Yamamura\u0026apos;s presence, it could become a source of conflict, but any dissatisfaction or anger would be directed not at Yamamura, but at the person presumed to be behind her. If she was the kind of student who would instead assume Yamamura was acting alone, then that was the extent of her abilities. Even if parts of her personality remained unclear, it was safe to end the analysis there.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI hadn\u0026apos;t had this much contact with Yamamura since transferring. Strictly within our class, our relationship wasn\u0026apos;t apparent to any student besides Morishita.\u003c/p\u003e\u003ch2 class=\"heading_2\"\u003ePart 3\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIT WAS RIGHT after I received Yamamura\u0026apos;s agreement and finished telling her about Shiraishi.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA single student popped up at the south entrance, where we hadn\u0026apos;t seen anyone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe then spotted us, shook his head as if to say \u003cem\u003e\u0026apos;good grief\u0026apos;\u003c/em\u003e, and approached with a smirk.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Kinda cold, isn\u0026apos;t it? Not inviting me to what looks like a pretty important chat.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;How did you know we were here, Hashimoto Masayoshi?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMorishita, not even trying to hide her wariness, bluntly asked him for his reasoning.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Process of elimination. I had to run frantically around campus and Keyaki Mall. I was wonderin\u0026apos; where you and Ayanokouji were going and well, I imagined you two were in a relationship you couldn\u0026apos;t speak of.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Please limit your jokes to your face.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Now that\u0026apos;s just hurtful. I\u0026apos;m actually pretty confident about my looks, for your information.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was almost impressive that he hadn\u0026apos;t followed us immediately after we left the classroom.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe\u0026apos;d properly taken into account the risk of us spotting his tail.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m on your side, you know? You don\u0026apos;t have to be so guarded.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto said that as he closed the distance with Morishita, who frequently and openly avoided him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you so much as lay a finger on me, I\u0026apos;ll let out a maidenly scream that could tear silk, you brute.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had a feeling that \u0026apos;tearing silk\u0026apos; and \u0026apos;maidenly\u0026apos; didn\u0026apos;t really go together.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, since I couldn\u0026apos;t imagine what kind of scream Morishita would let out, my interest was piqued just a little.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, I guess I can kinda see why you wouldn\u0026apos;t want me involved this time, though.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSaying that, he shifted his gaze from Morishita, with whom he was making no progress, to Yamamura.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYamamura, now the subject of his gaze, looked uncomfortable, took a step back, and averted her eyes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you making Yamamura your aide, Ayanokouji?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s not what this is about. For me, this is still Class C, which I\u0026apos;ve only just entered. There aren\u0026apos;t many people I can rely on. However, Yamamura and I were together for the school trip and the training camp, and I believe we\u0026apos;ve formed something of a bond. And I\u0026apos;ve judged her to be a trustworthy person. It\u0026apos;s not a matter of me \u003cem\u003eadding \u003c/em\u003eYamamura; I\u0026apos;m hoping she\u0026apos;ll \u003cem\u003ejoin \u003c/em\u003eme.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis reversal of roles was an extremely important distinction.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, well, looks like you\u0026apos;ve really earned Ayanokouji\u0026apos;s trust, eh, Miki-chan?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Uh... Mi-Miki...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Calling a girl by her first name without permission is rather inappropriate, wouldn\u0026apos;t you say, Hashimoto Masayoshi?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hey, you\u0026apos;re one to talk, calling people by their full name. And while we\u0026apos;re at it, why don\u0026apos;t you try getting along with me too, Ai-chan?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I absolutely refuse.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Harsh. What\u0026apos;ll it take for you to trust me?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Trust isn\u0026apos;t built in a day. No, in your case, perhaps I should say: it takes years to build trust, but only a moment to lose it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMorishita sharply thrust her index finger right in front of Hashimoto\u0026apos;s face.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even if Ayanokouji won\u0026apos;t back me up, at least Miki-chan might\u0026#x2014;huh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the instant his gaze was stolen by Morishita, Yamamura once again silently departed from the scene.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;As expected of a ninja\u0026apos;s descendant. It seems the talent is passed down through the ages.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was pretty sure she didn\u0026apos;t have any ancestors like that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I will be leaving as well. Please don\u0026apos;t follow me again.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t worry, I won\u0026apos;t chase after anyone but Ayanokouji.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;My condolences,\u0026quot; she said to me as a parting shot and without heading back to Keyaki Mall, Morishita seemed to be walking home from outside.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOnce it was just the two of us, Hashimoto\u0026apos;s shoulders slumped in an exaggerated fashion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Am I really that untrustworthy?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Do you think you are?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...I don\u0026apos;t.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then you\u0026apos;ll have to be prepared for people to keep secrets from you or avoid you to some extent.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The truth hurts.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto wasn\u0026apos;t an idiot. He understood and accepted that his past actions made his classmates give him the cold shoulder. And yet, he\u0026apos;d gone out of his way to chase me down. It seemed like an action that could only bring him harm, not benefit.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is it strange? That I\u0026apos;d show up even when I\u0026apos;m being told to stay away.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;d be a lie to say I wasn\u0026apos;t wondering about it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hah... Of course I want to get to Class A. I\u0026apos;m the guy who was willing to betray his own class to make that happen. I tried every trick in the book to cozy up to the other classes. But now, I\u0026apos;ve decided this class can win. The fact that I threw away my Private Points is proof of that, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe\u0026apos;d actually lost a large sum of Private Points, making it nearly impossible to buy a ticket to escape should his class sink. For Hashimoto, that was proof of his resolve to go down with his current ship, even if it meant being swallowed by the raging waves.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re an amazing guy, you know. I feel like you\u0026apos;ll win to some extent even without my help. I know it\u0026apos;d be a smarter move not to show up like this and make myself disliked. And yet, the reason I can\u0026apos;t help but stick my nose in... is because I want to do everything I can to help get us to Class A.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter he said that with a serious face, he immediately reverted to a joking expression.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Not that I expect you to believe me, though. But I\u0026apos;m gonna keep pestering you anyway.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed he intended to stick to his guns, fully aware of the criticism he would receive for being unable to suppress his true nature.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Do as you like. Though I think you\u0026apos;ll be hearing endless complaints from Morishita...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s my one and only headache. She\u0026apos;s so loud. So? You heading somewhere now?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;d like to, but I\u0026apos;m stopping by the school.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The school? The library? Didn\u0026apos;t you get to see Shiina on Friday?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, she\u0026apos;d already left for the day, so I couldn\u0026apos;t meet her. So you could say this is me trying again.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...I see?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlthough he let me go without any issue on Friday, Hashimoto\u0026apos;s expression turned slightly suspicious, perhaps because he thought I was using the same line again as an excuse to turn him down.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Listen, you\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto started to speak, but then he let out a short laugh, exhaled, and shook his head.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s nothing. If you want to see Shiina, I\u0026apos;ll graciously step aside today, too. Well then, I\u0026apos;m off.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe turned his back and walked into Keyaki Mall.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was a little concerned about how Hashimoto was acting, but it was getting late again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI decided I should hurry to the library.\u003c/p\u003e\u003ch2 class=\"heading_2\"\u003ePart 4\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAFTER PARTING WITH Hashimoto, I returned to the school.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe time was just past five o\u0026apos;clock. Most students had already gone home and the majority of those remaining were in the middle of their club activities.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShouts could be heard from the fields and the sound of squeaking shoes from the gymnasium.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was heading to the library to meet Hiyori, something I\u0026apos;d been putting off for a while.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe exchanged greetings on Friday, but didn\u0026#x2019;t get to talk beyond that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe invitation to transfer to Class B.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI refused it and, for my own purposes, transferred to the unrelated Class C.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t that I regretted it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut the reason I still felt a lingering pull was probably because I, too, had wanted to transfer to Class B, where Hiyori was waiting.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs an ordinary male student of the Advanced Nurturing High School.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA year spent without being tied down by things like being a leader or a strategist.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA future that might have been.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA future I could\u0026apos;ve chosen.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI recalled the end of our second year, when Ishizaki led me to hold hands with Hiyori.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Am I regretting this?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSeeing my own faint reflection in the windowpane, I stopped walking.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy feet, which stayed away from the library under the pretext of personal matters.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was true that many things often overlapped at inconvenient times.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut it wasn\u0026apos;t as if I couldn\u0026apos;t go to the library at all.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI should\u0026apos;ve been able to find a gap in my schedule and make enough time to at least show my face.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDoes that mean I was unconsciously avoiding going there?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhy?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI probably already had the answer to that question.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBecause I didn\u0026apos;t want to see the sadness on Hiyori\u0026apos;s face, if at all possible.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBecause, even though I knew it was wrong, I betrayed the smile of the girl who invited me with all her heart.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut that wasn\u0026apos;t rational.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe more time that passed, the more the relationship deteriorated and the sadness grew. If I was the one at fault, I should\u0026apos;ve gone to see her immediately, apologized, and repaired the relationship.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKnowing it was pointless, I posed the question to myself once more.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo answer comes back. Of course not. The answer was already in my head. The act of asking myself questions while pretending not to know... it felt unsettling somehow.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI decided to move to Class C and rejected Hiyori\u0026apos;s invitation. Therefore, I would apologize for it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhy couldn\u0026apos;t I just get on with such a simple process?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI could also tell her via a call or a message, so why hadn\u0026apos;t I even considered that as an option?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the first place, Hiyori wasn\u0026apos;t the only one saddened by my transfer.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy classmates, like Horikita, who were aiming to graduate from Class A, were the prime victims of that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSo why am I\u0026#x2014;so concerned only about Hiyori...?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI averted my gaze from the windowpane and started my halted feet moving toward the library once more.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had no basis for it, but I felt like I\u0026apos;d understand if I went and saw her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was the feeling I had.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as I steeled my resolve and started moving again, Hasebe appeared from the hallway that led to my destination. There didn\u0026apos;t seem to be anyone else around right now, but I wondered what she was doing all by herself at this hour.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was a little curious, but we weren\u0026apos;t on the kind of terms that we could casually call out to one another. So, I figured we would just pass each other by and that would be the end of it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIndeed, Hasebe seemed to notice me right away, but she averted her gaze, her eyes downcast.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd so, we passed each other without exchanging a word.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hey... hey...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a faint, small voice, so much so that I thought I might have imagined it for a moment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut it definitely came from Hasebe.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I stopped and turned around, Hasebe did the same, though she kept her gaze averted.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I... I wanted to talk for a bit, if that\u0026apos;s... okay?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt would\u0026apos;ve been easy to refuse, but I could see a hint of resolve in Hasebe.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe\u0026apos;d approached me in the same way at the end of the school year, but Amasawa\u0026apos;s interference at the time meant I was ultimately unable to hear what she had to say.\u003c/p\u003e\u003cimg src=\"/hola-lector-agua/images/books/ss-y3-v2/OEBPS/fXQWGKCSlvjlEkSueEGIQ.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf I brushed her off again here, she might never approach me again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was before I changed classes. And now it was after I\u0026apos;d changed classes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat she wanted to talk about might have changed, but it seemed I needed to hear her out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah. I couldn\u0026apos;t hear you out when you came to talk to me before.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You remembered.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It was just the other day.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s true... In the meantime, you changed classes, Ayanokouji-kun... but... could that be my fault? Because I came to talk to you\u0026#x2014;and you got sick of it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s completely unrelated, so you can rest easy. I\u0026apos;d been getting offers from students in the current Class C since before the end-of-year special exam. Sakayanagi\u0026apos;s expulsion just made it a reality.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a lie I made up on the spot, but there was no problem with it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt didn\u0026apos;t matter whether there was one reason or a hundred for my transfer, for my betrayal.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh... I see.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhether she believed my words or not, she let out a breath as if relieved, or rather, as if she were a little happy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I would\u0026apos;ve thought resentment would come first.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Resentment...? It\u0026apos;s not like I have the right to feel something like that... It\u0026apos;s like, conversely, with you changing classes, Ayanokouji-kun, I feel like we\u0026apos;ve found a more appropriate distance between us. Of course, I\u0026apos;m going to be in my current class forever, so I think I understand that part.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA distance that was uncomfortable as an ally. A distance that was comfortable as an enemy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSo that was how Hasebe was taking it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So, if it\u0026apos;s not about resentment, what\u0026apos;d you want to talk to me about?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh, yeah, well, actually\u0026#x2014;it\u0026apos;s...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile answering my question, Hasebe hurriedly searched for something on the phone she was holding.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I just really wanted you, Ayanokouji-kun, to see how hard she\u0026apos;s been working\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom Hasebe\u0026apos;s flustered phone-fiddling and fragmented words, I figured out what she wanted to say.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe one who left the school. The student named Sakura Airi and what happened to her afterward. Hasebe must have some information about that. I\u0026apos;d briefly heard that she\u0026apos;d passed an audition, but that was just a piece of information I\u0026apos;d acquired. Until a short while ago, I wouldn\u0026apos;t have had any interest in it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, through my contact with Tsubaki, I had developed a slight curiosity about what happened to those who dropped out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eStill, that was only in comparison to before.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt certainly wasn\u0026apos;t something worth stopping and turning back for.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHasebe\u0026apos;s anxious eyes, staring at me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAll I would gain by refusing was the small amount of time that wouldn\u0026apos;t be wasted afterward.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is it... not okay?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I didn\u0026apos;t answer, Hasebe whispered, clutching her phone anxiously.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s not true. I\u0026apos;d like to hear it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Eh\u0026#x2014;r-really?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah. I didn\u0026apos;t have the courage to look into it myself, but to be honest, I\u0026apos;ve been wondering about her all this time.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe students of Horikita\u0026apos;s class were becoming more and more wary of me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlthough there were still some cracks, it would probably become difficult to extract information from them from now on.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn that case, I just needed to try a new angle of attack.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePrecisely because I put myself in a difficult position by abandoning everything and betraying my class, I couldn\u0026apos;t pass up an opportunity to test how to win them over, or how to create a breakthrough.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHasebe, her eyes sparkling, held out her phone to me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;She\u0026apos;s started to appear on TV bit by bit, though it\u0026apos;s in a late-night slot.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;On TV? That\u0026apos;s amazing.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSakura was expelled at the beginning of the second term last year. The fact that she made it onto TV in less than a year since then was genuinely surprising.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI imagined her simply starting a new school life as a student at some other school.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed she had actually wanted to invite Miyake and Yukimura to talk about Sakura at the end of the school year, and I confirmed that what she wanted to tell them was exactly the same.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOur standing conversation went on longer than expected and the scenery outside began to take on a reddish hue.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh...! Sorry, Ayanokouji-kun. I got carried away talking... Didn\u0026apos;t you have somewhere to be?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s fine. I enjoyed talking with you, Hasebe, it\u0026apos;s been a while. And I was happy to learn more about Sakura.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;R-Really? To be honest, I could talk about Airi forever... but I\u0026apos;m glad.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you don\u0026apos;t mind, let\u0026apos;s make some time to talk again somewhere. Or, if you\u0026apos;re worried about drawing resentment from Class A, we could talk on the phone.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course! I\u0026apos;ll make sure you become Airi\u0026apos;s number two fan, Kiyopon.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed she didn\u0026apos;t realize it herself, but she unconsciously called me by my old nickname.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter that, I parted ways with Hasebe and arrived at the library before six o\u0026apos;clock, but Hiyori was already gone; the same librarian from the other day told me that she left about ten minutes earlier.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere were two main routes from the library to the entrance, and it seemed I picked the wrong one, a fifty-percent chance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe librarian asked if I wanted them to pass on a message, but I declined the offer.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll try again another day.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was no need to rush; the time to know the answer would surely come soon enough.\u003c/p\u003e\u003ch2 class=\"heading_2\"\u003ePart 5\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eAT 7:40 P.M. on Monday\u003c/em\u003e, Kaneda, having finished dinner in his dorm room, arrived in front of the karaoke parlor where they were to meet at 8:00, looking restless.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe occasionally looked around, let out small sighs and paced about the area.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat strange behavior came to an abrupt halt with the appearance of a certain person.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;T-Thank you for coming today, Shiina-shi.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith a nervous expression, Kaneda bowed his head, quickly adjusted his crooked glasses and offered a stiff smile. Then, he let out a long breath as he looked at Shiina in her casual clothes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The pleasure is all mine, Kaneda-kun. This feels somewhat refreshing, doesn\u0026apos;t it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes, it really is. I wonder what Ryuuen-shi\u0026#xa0;is thinking.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTogether, the two of them looked up at the karaoke parlor, which was brilliantly beckoning customers.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut Kaneda, out of the corner of his eye, burned the sight of Shiina into his memory.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe arrived much earlier than the meeting time because he anticipated that Shiina, who now stood beside him, might also arrive early. And that hunch was correct.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat meant they would have nearly twenty minutes alone together at most.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We still have a little time, what should we do? Personally, I think it would be best if we went inside to wait\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as he was about to suggest that, a loud voice echoed through the mall.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What the heck?! I thought I\u0026apos;d be the first one here, but you two already beat me to it!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith an exaggerated reaction to something not particularly surprising, Ishizaki arrived.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Hello, Ishizaki-shi.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhether he was put off by his attitude or for some other reason, Kaneda greeted him with a somewhat displeased look.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re here early. I had the impression you were the type to be late.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You look pretty bummed, Kaneda. Don\u0026apos;t tell me you\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs if he\u0026apos;d an inkling about Kaneda\u0026apos;s suspicious behavior, Ishizaki grinned slyly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;W-What is it...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s my job to greet Ryuuen-san, got it? I\u0026apos;m not gonna let you look cool!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see... So that\u0026apos;s why you arrived early, Ishizaki-shi.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The three of us got here at pretty much the same time. There\u0026apos;s no first or last place here, so remember that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Rest assured, I don\u0026apos;t place any importance on such things.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Man, I wonder what Ryuuen-san\u0026apos;s thinking. He said he\u0026apos;s not just callin\u0026apos; you, Kaneda, but that Tokitou guy too. They ain\u0026apos;t got the rank to be called to a meeting, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t know about Tokitou-shi, but I have regular meetings with Ryuuen-shi, so I would appreciate it if you didn\u0026apos;t lump us together.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKaneda pointed it out sharply, pushing up the bridge of his glasses with his middle finger.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn reality, Kaneda did have regular conversations with Ryuuen while the exams were underway, but a large portion of those cases involved them speaking one-on-one.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The strategy for the special exam\u0026apos;s already been decided, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. We haven\u0026apos;t received any additional orders as of now. Or, it\u0026apos;s also conceivable that this is a meeting to report on some other possibility he\u0026apos;s discovered...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Or maybe he needs our power. Like, we all get together and come up with some amazing ideas.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I understand what you\u0026apos;re trying to say, but that doesn\u0026apos;t mean just any talent will do... Don\u0026apos;t you agree, Shiina-shi?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was just a proverb, after all. Kaneda added that simply having more people wasn\u0026apos;t enough and was about to ask for Shiina\u0026apos;s opinion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt that moment, however, Ryuuen appeared and the atmosphere instantly grew heavy. Ishizaki also put on a tense expression, bowed his head deeply in greeting and immediately began to move inside the karaoke parlor.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe four of them were led to a room in the back that\u0026apos;d been reserved in advance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen slid a menu across the table and had the other three order food and drinks.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It seems Katsuragi-shi and Tokitou-shi haven\u0026apos;t arrived yet. Is that all right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;They let me know they\u0026apos;d be late. More importantly, Kaneda, have you heard anything from that Hashimoto guy?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWithout even looking at him, Ryuuen asked the question, and Kaneda slowly shook his head from side to side.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, I have not. We were in frequent contact until just before we became third-years, but since Ayanokouji-shi\u0026apos;s class transfer was finalized, he\u0026apos;s been ignoring my messages.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUpon hearing that report, Ryuuen closed his eyes and the left corner of his mouth curled up slightly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So he\u0026apos;s made up his mind, huh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It seems he holds Ayanokouji-shi\u0026apos;s abilities in very high regard. Of course, I\u0026apos;ve also been observing the recent developments objectively and have had to revise my own evaluation of him two or three times\u0026#x2014;but even so, I thought Hashimoto-shi would leave open the possibility of transferring to another class.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, Sakayanagi probably would\u0026apos;ve found Hashimoto\u0026apos;s two-timing diplomacy amusing, but with Ayanokouji, you never know how things will turn out. If he makes a clumsy move to secure his own escape route, he\u0026apos;ll be cut off without mercy. Even he doesn\u0026apos;t have the guts to cross that bridge.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEither risk it all and keep his ties to other classes, or commit fully and go down with Ayanokouji. Ryuuen answered that it was the decision he made after weighing those options.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...You truly do hold him in high esteem.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKaneda acknowledged his ability, but he still didn\u0026apos;t rate him as highly as Ryuuen did.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBecause he\u0026apos;d only ever seemed like an ordinary student, Kaneda perceived him as having some kind of weakness and failed to sense the sharpness\u0026#x2014;the kind that made one feel they would get hurt just by touching him, like with Sakayanagi or Ryuuen.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen turned his gaze to Shiina, who hadn\u0026apos;t said a word since entering the room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What\u0026apos;s your read on Ayanokouji right now?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Me?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;His actions since transferring classes. Including what the hell he\u0026apos;s aiming for.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA little surprised, Shiina recalled how he\u0026apos;d been when she ran into him in the elevator the other day.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I wonder... I can\u0026apos;t really give a good answer.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s impossible, Ryuuen-san. It\u0026apos;s \u0026apos;cause Shiina sees Ayanokouji through a filter.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;A filter? What do you mean by that, Ishizaki-shi?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKaneda retorted to the strange expression.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s a special filter, man. A special one. The kind ya call the Ayanokouji Filter.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt Ishizaki\u0026apos;s answer, Kaneda\u0026apos;s facial muscles tensed slightly and his expression grew grim.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven Shiina, who was dense about such things, understood what Ishizaki was trying to say and looked down awkwardly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen, on the other hand, didn\u0026apos;t change the way he looked at Shiina in the slightest.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t give a damn what kind of feelings you have for Ayanokouji. But as long as you\u0026apos;re a member of my class, you need to work to make us win. Got it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes, I understand.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Anyway, you managed to talk to Ayanokouji after he transferred, right? Tell us about that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No... Actually, I haven\u0026apos;t been able to speak with him properly yet.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? How come? I definitely told him to go see you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs Ishizaki tilted his head in confusion, Shiina\u0026apos;s spirits sank at the mention of Ayanokouji.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll get in touch with Ayanokouji right now and\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s enough out of you. Just sing.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs if to say there was no need for any more pointless talk, Ryuuen gripped the microphone and tossed it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;W-Whoa, r-roger that!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIshizaki, who caught the mic to keep it from falling, seemed to think he\u0026apos;d been appointed to liven things up, grinning determinedly as he psyched himself up. Then, after he selected a song, the introduction began to play.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as he began to sing, the door to the room opened, and Katsuragi and Tokitou appeared in the karaoke room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sorry for the wait.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eImmediately after Katsuragi spoke, Tokitou cut in and confronted Ryuuen.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What do you think you\u0026apos;re doing, calling even me out here?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I figured I\u0026apos;d listen to a useless guy\u0026apos;s opinion for once. It\u0026apos;s just a whim.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile Ishizaki belted out his song, sparks already flew between Ryuuen and Tokitou.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Now, calm down. First, why don\u0026apos;t you tell us why you\u0026apos;ve gathered us here today? I was under the impression our policy for the current special exam had already been decided.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot
