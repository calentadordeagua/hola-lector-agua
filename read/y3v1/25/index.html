e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T2731,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 1\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTHE DAY THE special exam was announced, I had an ordinary afternoon, as usual.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDuring that time, after Mashima-sensei concluded homeroom and left the classroom, Hashimoto stood up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Alright. So, we\u0026apos;re all good with leaving this special exam up to Ayanokouji, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe asked everyone, assuming their consent rather than seeking permission.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo one said yes or no, and the classroom momentarily fell silent.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, soon after, Shimazaki glared at Hashimoto without holding back his dissatisfaction.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And why\u0026apos;s that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why? I could ask you the same. This special exam is a good opportunity for a transfer like Ayanokouji to show his abilities. If we don\u0026apos;t leave it to him now, then when? It makes you wonder why we recruited him in the first place.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven though I\u0026#xa0;wasn\u0026apos;t welcomed, Hashimoto argued fiercely, thinking it was obvious.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And what if we lose?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Lose? Don\u0026apos;t be stupid, there\u0026apos;s no way we\u0026apos;ll lose. Right, Ayanokouji?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto looked at me with an expression full of expectation and pressure.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I can\u0026apos;t guarantee our victory or defeat, but if you entrust me with it, I intend to give it my all.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI took a complete turn from my confident speech after the opening ceremony, deliberately playing it safe with my words, which led me to receive my classmates\u0026apos; cold glares in return.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHearing that the outcome was uncertain, naturally, they couldn\u0026apos;t believe it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ha\u0026#x2026; that\u0026apos;s what he says, Hashimoto.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt such times, Sakayanagi probably would\u0026apos;ve already declared, \u0026apos;We will win.\u0026apos;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe difference in our answers might\u0026apos;ve confused and disappointed some of them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Come on, be more decisive. It makes the rest of us worried. I\u0026apos;m starting to worry myself\u0026#xa0;too.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eScratching his head, Hashimoto sighed and looked away.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So, Shimazaki, what do you plan to do if we don\u0026apos;t plan on leaving it to Ayanokouji?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Nothing special. We\u0026apos;ll just fight like normal and win like normal.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Normal? Then who will come up with the strategy?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We can discuss it as a class. Of course, I don\u0026apos;t oppose Ayanokouji joining in.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So you mean we don\u0026apos;t need a leader?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s not what I\u0026apos;m saying. Of course we need a leader. Someone has to steer the class when there\u0026apos;s a dispute. But I just can\u0026apos;t feel like entrusting him with this special exam. I\u0026apos;ll be clear, from what I\u0026apos;ve heard, this exam is one we should naturally win. We\u0026apos;ve been leading in written exam scores for two years, and our opponent has always been the lowest-scoring class, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto grunted slightly, but he soon countered.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If it were a simple written exam, yes, but this is a special exam. Can we really win by charging in without thinking?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m not saying that we won\u0026apos;t be thinking. I\u0026apos;m saying we should discuss it as a class if necessary.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The more people there are, the easier it is for information to leak.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There won\u0026apos;t be any idiots who\u0026apos;ll leak it. I don\u0026apos;t know about you, though.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;How nice of you to say.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWatching the argument between Hashimoto and Shimazaki, Sanada stood up to mediate.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;May I ask Ayanokouji-kun a question?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Looking at this special exam, I think the key point lies in who gets the penalty points. If we leave it to you, you\u0026apos;ll be able to predict who the opponent will send out for the small-group battles and who we should select to avoid being targeted\u0026#x2026; is it okay to assume that? If you can tell us that much, then I might consider entrusting this to you, Ayanokouji-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eProviding help to Hashimoto\u0026apos;s case, Sanada followed up with a suggestion that could make those who were skeptical yield to letting me take the lead.\u0026#xa0;Sanada looked at Shimazaki calmly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;I see. So it\u0026apos;s not about judging Ayanokouji based on the outcome, but measuring his abilities through the process.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. I also feel like we have a high chance of winning this special exam. However, if there\u0026apos;s anything that could turn the tables, it\u0026#x2019;ll be the distribution of penalty points in the small-group battles. Discussing it as a group doesn\u0026apos;t guarantee the best solution. Entrusting it solely to Ayanokouji-kun has its risks, but as Hashimoto-kun said, there will come a time when we must entrust him with something. Maybe this exam is a good opportunity to make a quick and conclusive decision.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a compromise that incorporated both Hashimoto\u0026#x2019;s and Shimazaki\u0026#x2019;s opinions.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Indeed\u0026#x2026; not a bad idea. Ayanokouji, we can leave it to you, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you entrust it to me, I\u0026apos;ll do my best.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was all I said, but Shimazaki immediately raised his voice.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Alright! Then, since winning is a given, we\u0026apos;ll focus on whether your guesses match up, okay?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Okay, okay. Let\u0026apos;s go with that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto, having secured the plans, nodded in satisfaction and clapped his hands together, making a loud sound.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe must\u0026apos;ve thought that anything was possible as long as I was just given the chance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s settled then. We\u0026apos;ll handle the details from here. Just sit back and relax.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We\u0026apos;ll see about that. For now, I guess I\u0026apos;ll just have to rack my brains over whom to assign these to.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn case the discussion dragged on, potentially resulting in them unexpectedly retracting their plans, Hashimoto urged everyone to disperse.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So, Ayanokouji, make sure you have plenty of time after this.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eLooks like I won\u0026apos;t be able to go home right after school ends.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hashimoto Masayoshi seems quite bothered about his exclusion in the transfer talks.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe definitely looked quite determined not to let discussions proceed without him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is it really okay to let someone who might betray us in on our strategy?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMorishita whispered her doubts from right behind me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Your trust in Hashimoto is pretty thin, huh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It couldn\u0026apos;t possibly be thick, can it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince our seats were one behind the other, it was convenient for having these small types of chats. Sensing Hashimoto approaching, Morishita cut the conversation short.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Let\u0026apos;s go, Ayanokouji. What about you, Morishita?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I might as well keep you company for the time being. I\u0026apos;m interested in seeing your skills.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Whether it\u0026apos;s the dorm, karaoke, or behind the school building, I\u0026apos;ll join you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eChoosing a location for strategizing usually meant picking a place away from prying eyes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, I deliberately suggested holding the meeting at a caf\u0026#xe9; as per usual.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 1\",\"volumeId\":\"y3v1\",\"chapterIndex\":25,\"prevChapter\":{\"volumeId\":\"y3v1\",\"chapter\":24,\"title\":\"Chapter 5: Convolution\"},\"nextChapter\":{\"volumeId\":\"y3v1\",\"chapter\":26,\"title\":\"Part 2\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 1\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"l
