asked his question.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why are you asking me? Just do what you want.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;My dad used to talk about it when he came back from hostess clubs. He said that deep-fried pasta\u0026apos;s really delicious. I\u0026apos;ve always wanted to try it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t care about that story.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Whether it\u0026apos;s pasta or something else, I don\u0026apos;t care what you eat, but we need to start with the discussion. This special exam won\u0026apos;t be easy. No, I should say \u0026apos;also\u0026apos; this time.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKatsuragi, sitting farthest away from him with his arms crossed, urged Ishizaki and the others to join in on the discussion first.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It might seem obvious, but no matter how generously you look at things, this is the kind of exam Class B would struggle the most with.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, there\u0026apos;s nothing we can do about studying.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIbuki responded in a resigned tone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was practically impossible for them to win in a battle of academic abilities.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was undoubtedly the biggest challenge facing Ryuuen\u0026apos;s class.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDespite reaching Class B through sheer ability and luck, they hadn\u0026apos;t been able to find a way to win in their weakest subjects yet.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMoreover, this time, they were competing against the former Class A, known for their academic prowess.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If our goal\u0026apos;s to win, we\u0026#x2019;re bound for a tough battle.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why not just give up? Losing the opportunity to gain about a hundred class points isn\u0026apos;t a big deal, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You giving up before we even start, Ibuki!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then are you going to study nonstop, twenty-four hours a day, until the exam starts? Even if you do, I doubt you\u0026apos;d be able to close the gap enough to even score well.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Uh, that would be\u0026#x2026; well\u0026#x2026; a bit tough\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s because you don\u0026apos;t study regularly. You haven\u0026apos;t done any of the assignments I gave you, have you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I hate schoolwork enough, why do I have to do the homework you\u0026apos;ve made too, Katsuragi?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It was made for the class. In fact, students who are taking these seriously have already seen steady improvements in their academic abilities.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKatsuragi emphasized the assignments\u0026apos; results, but Ishizaki awkwardly averted his gaze.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Studying just enough not to fail is all I can handle. If I cram any more, I\u0026apos;ll burst.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSeeing Ishizaki\u0026apos;s attitude, Katsuragi sighed and looked toward Ryuuen.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Shouldn\u0026apos;t you be giving stricter instructions? That might motivate Ishizaki and the others a bit.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s no cure for stupidity. Besides, there\u0026apos;s no need to play on their turf. We never intended to fight fairly from the start.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRather than adopting a losing strategy, Ryuuen immediately dismissed the idea.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;However, they\u0026apos;re a formidable enemy. Even though Sakayanagi has left, Class C still has many students specialized in academics. It\u0026apos;s not like they had a significant downgrade.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIshizaki stood up and clenched his fist after listening without much interest until now.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not actually a downgrade. With Ayanokouji in their class, they\u0026apos;ve powered up like crazy. Damn, why did he go to Class C\u0026#x2026; I don\u0026apos;t get it. Do you understand why, Ibuki?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t ask me. You shouldn\u0026apos;t even try to understand his thoughts.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eGetting involved could lead to complications.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIbuki learned this through experience, and now, she generally avoided it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen the others asked her to go to the caf\u0026#xe9; to confront Ayanokouji, she instantly rejected them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThanks to that, she was mentally fine, and she felt relatively calm.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere were times when they had unexpected encounters, but that wasn\u0026apos;t always the case.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It really feels like a tough enemy just showed up\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If that weren\u0026apos;t the case, it\u0026apos;d be a real problem. That\u0026apos;s where my ultimate goal lies.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eI need a formidable opponent\u003c/em\u003e\u0026#x2014;that was what he was trying to say.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlthough Ishizaki felt like that was an unusual thing for Ryuuen to say, he quietly nodded without pressing any further.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s right. However, I still have some doubts. Of course, I don\u0026apos;t deny that Ayanokouji has excellent qualities, such as his calmness and occasional sharpness, but there\u0026apos;s something about him that\u0026apos;s missing\u0026#x2014;or rather, I can\u0026apos;t bring myself to completely hate him\u0026#x2026; I can\u0026apos;t decide if he\u0026apos;s someone who\u0026apos;s able to surpass Sakayanagi.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s because you haven\u0026apos;t seen how great Ayanokouji is directly, Katsuragi. He\u0026apos;s incredible, right, Ibuki?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Stop bringing me into this. I get really annoyed just talking about him. I truly hate him.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Who do you hate more, him or Horikita? You always seem to be complaining about her.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s\u0026#x2026; a tough choice. It\u0026apos;s like choosing whether to lose your right eye or your left\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s way too scary, what kind of comparison even is that\u0026#x2026;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile the two engaged in some trivial banter, Ryuuen glanced at the ceiling, unconcerned. Katsuragi turned his gaze to Ishizaki at that moment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;How were Ayanokouji and Hashimoto after the transfer? What was the reason for the transfer?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It didn\u0026apos;t seem like anything\u0026apos;s changed. It felt like neither classes A nor C mattered to him. He mentioned getting help from C, but I\u0026apos;m not sure if that\u0026apos;s true.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Wasn\u0026apos;t it just so he could be the leader and then do as he wishes?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ibuki, now that Sakayanagi isn\u0026apos;t here anymore, indeed, nobody\u0026apos;s in their leader position, however\u0026#x2026; I thought Ayanokouji was the type to get things done quietly without standing out much.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKatsuragi, aligning what he heard with his own impressions, questioned Ryuuen.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What do you think?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t know. If he\u0026apos;s going to come out in the open after transferring classes, the reason wouldn\u0026#x2019;t matter.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen seemed to have organized his thoughts and turned his gaze back to Katsuragi.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In this special exam, if we play it by the book, it\u0026apos;s almost certain that we\u0026apos;ll lose 99% of the time, regardless of Ayanokouji\u0026apos;s presence. But it\u0026apos;s not like there aren\u0026apos;t any holes in the rules. The exam\u0026apos;s designed in a way that gives us an advantage\u0026#x2014;as big as we want\u0026#x2014;as long as we have \u0026apos;live ammo,\u0026apos; and that\u0026apos;s not bad.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s true, but\u0026#x2026; are you planning to pour in all the Private Points you\u0026apos;ve saved up?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;They must\u0026apos;ve spent a lot on pulling Ayanokouji. Moreover, since they have the upper hand academically, they\u0026apos;ll come at us without making many investments and try to win. They\u0026apos;re a good target.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor their class, it was a situation that couldn\u0026apos;t turn into an expense-driven exchange. Class C, with no money to spare, could only fight with their pure academic ability and the penalty points given to them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I understand what you\u0026apos;re saying, but the gap between our academic abilities isn\u0026apos;t something we can just easily bridge using a few additional penalty points. It would barely become fair even if we distribute penalties to dozens in their class. It\u0026apos;s not a very efficient plan. You can\u0026apos;t even be sure you\u0026apos;ll hit all five of their participants, can you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you against it then?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Not exactly. I\u0026apos;m saying don\u0026apos;t do it if you\u0026apos;re going in half-baked. To have a high chance of winning\u0026#x2026; Even though this is just a hypothetical, we\u0026apos;d want to take away an additional three hundred points. That would require about 15 million private points.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Man, does it really cost 15 million to win?!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even then, there\u0026apos;s no absolute guarantee. If we were to use our four hundred penalty points on their entire class, we\u0026apos;d only be able to take away ten points per person. However, they could narrow down who to use their initial hundred points on, using their points on five people within our class and trying to take away twenty points each. If they\u0026apos;re able to get an accurate reading of who our participants are, we\u0026apos;d be starting off the small-group battle with ten points less per participant compared to their class. Of course, there\u0026apos;s a low possibility of that happening, but if we assume the worst, something like that\u0026apos;s possible.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSpending a large sum of money might not even bring an equal start.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMisevaluation could result in their Private Points vanishing into thin air.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKatsuragi felt concerned and continued his explanation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;To increase our odds of winning even further, we\u0026apos;d have to throw in another ten or twenty million Private Points. Alternatively, we could narrow down who their participants will be and aim to take away about twenty points each. But it\u0026apos;s hard to say that it\u0026#x2019;d even increase our chances.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s practically the same as going bankrupt.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes, but if you\u0026apos;re aiming to win despite the huge amount of money and risk, I have no reason to stop you. It won\u0026apos;t be a \u0026apos;complete victory,\u0026apos; but losing absolutely cannot be allowed.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was no small obstacle. Ibuki, who\u0026#x2019;d been listening half-heartedly, raised her face.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Listening to all of this, I think it might be better to just give up on this exam.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn response to Ryuuen, who seemed ready to compete, Ibuki challenged him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hey, Ibuki, are you really going to argue with Ryuuen-san?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What, didn\u0026apos;t you call me here because you wanted my opinion? If not, I\u0026apos;ll leave.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs Ibuki showed signs of leaving, Ryuuen laughed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll listen. Why do you think that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s simply because it\u0026apos;s disadvantageous for us. As Katsuragi said, we can\u0026apos;t win by just studying. The idea is that we \u003cem\u003emight\u003c/em\u003e\u0026#xa0;win if we use Private Points, but the reward isn\u0026#x2019;t worth how\u0026#xa0;much we\u0026apos;re spending. Even I think it\u0026apos;s too reckless, and that\u0026apos;s proof enough.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I agree with Ibuki. In terms of cost-effectiveness, it\u0026apos;s not good at all. Even if we assume a complete victory, the return isn\u0026apos;t even that great.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKatsuragi also conveyed his stance, aligning his viewpoint with Ibuki\u0026apos;s.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, if you only look at the returns you can see, sure, that might be the case.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What do you mean by that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah, this is an exam we\u0026apos;re expected to lose. But that also means it\u0026apos;s an exam they absolutely cannot afford to lose. If you expect to win, it can create pressure that\u0026apos;s always at the back of your mind. And the damage, the shock from actually losing, would be on a whole different scale.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So you want to hinder Ayanokouji\u0026apos;s momentum from the start, is that it? But even if we win by force, are you sure it would cause that much damage?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It would. I\u0026apos;ve had a painful taste of it myself during that incident on the rooftop.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen clenched his fists and showed a sharp gaze.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe was confident in his dominant violence and unyielding spirit, and in Ryuuen\u0026apos;s mind, no matter what the situation was, he only thought of the ultimate victory.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, Ayanokouji, who alone boldly entered enemy territory and overwhelmed everyone else, was way beyond the norm.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe physically and mentally defeated the way of thinking that Ryuuen considered absolute.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt took more than a short amount of time to recover after being pushed to the very bottom.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The Class C guys and Ayanokouji would never think they\u0026apos;ll lose. But deep down, they\u0026apos;re scared of the \u0026apos;what if.\u0026apos; That\u0026apos;s why it\u0026apos;s meaningful for us to keep on fighting. If we can strike them down during his first exam,\u0026#xa0;his maiden voyage, it will be a bigger advantage than the actual Class Point difference.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if the reward was only about 100 Class Points, the increase in class points couldn\u0026#x2019;t be ignored.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eCompared to the difference between Ryuuen\u0026#x2019;s and Horikita\u0026apos;s classes, their gap with Class C, to which Ayanokouji belonged, wasn\u0026apos;t small.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eGiven the situation where they couldn\u0026apos;t afford any unnecessary defeats, gaining additional Class Points here would be a significant achievement.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe remaining school life they had was only ever getting shorter, never longer.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But the minimum condition to win would cost over fifteen million\u0026#x2026; that\u0026apos;s steep\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIshizaki was counting on his fingers, surprised at the amount of Private Points involved.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Normally, that amount would give us a good chance at winning, but our opponent is Ayanokouji. He must\u0026apos;ve calculated that we\u0026apos;d be prepared to blow a large sum, prepared to self-destruct. Even if we manage to snatch victory using penalty points, as long as we can prevent a complete victory, that might be enough.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the full-class battle, since nobody could use penalty points, the opponent would effectively have two victories in hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hmm\u0026#x2026; I understand, but it seems the risk is far greater no matter how you look at it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen himself knew this.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf there were no doubts in his mind, he wouldn\u0026apos;t have held this meeting to ask for opinions from Katsuragi and others.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eTo take on or give up on this special exam\u0026#x2014;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFirst, they had to decide on which of these options to pick.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile Ryuuen, who had an aggressive spirit, remained indecisive, Katsuragi now turned his gaze to Ibuki.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;How is Horikita doing?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? Why are you asking me?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You said you\u0026apos;ve been eating at Horikita\u0026apos;s room often lately. I know she was in a bad state, but has she recovered?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t think she\u0026apos;s recovered. She turns me away when I come, and she always has a gloomy expression. It\u0026apos;s annoying.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere were still no signs of improvement, even a week after the transfer.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see. It\u0026apos;s tough taking on a special exam when she hasn\u0026apos;t regained her composure.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Good. She should just lose miserably.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s harsh. Aren\u0026apos;t you two friends? Isn\u0026apos;t that a bit cold?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Haaaaaaa? She\u0026apos;s not my friend.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not that I take pleasure in others\u0026apos; misfortune, but if Class A stumbles, it\u0026apos;s a situation we should be grateful for. Even if Ichinose picks up a win or two, they won\u0026apos;t be much of a threat.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIf there\u0026apos;s a reason to forcibly secure a victory, this would be it\u003c/em\u003e, Katsuragi thought.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf Class B could catch up and surpass Class A, they could suddenly pull ahead in one swift move.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter a while of casual chatter, Ryuuen quickly drank the water left on the table.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;I\u0026apos;ve decided how I\u0026apos;ll fight.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you really going to go all out to confront them?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePouring Private Points into the plan and winning the special exam at all costs.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHaving asked that question, Katsuragi judged that the plan had a strong sense of how desperate times called for desperate measures.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What do you think is the most important thing for him, for Ayanokouji, in the next special exam?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That would definitely be \u0026apos;the first victory.\u0026apos;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Right. He made the guys from Class C pay for his transfer. He took over Sakayanagi\u0026#x2019;s position so he could do whatever he wants. But that class isn\u0026apos;t stupid. So far, they haven\u0026apos;t entrusted everything to someone who hasn\u0026apos;t shown anything. So Ayanokouji must want to win no matter what. Moreover, a defeat in a special exam he\u0026apos;s expected to win is unthinkable. In a way, it\u0026apos;s his first and last chance.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That makes sense. It\u0026apos;d be super lame if he took command right after transferring and then lost.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIbuki, as well as the one seated next to her, Ishizaki, completely agreed and nodded.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;To sink Class C\u0026apos;s ship in one go\u0026#x2014;right.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even if he knows he has the upper hand, no matter how easy the battle is, he will always take it seriously. After all, he has an infuriatingly extraordinary way of thinking. It wouldn\u0026#x2019;t be surprising if he sees through all five people we select for the small-group battle.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf Ryuuen were to roll some dice to pick the participating students, it would actually be impossible for others to read.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eBut still, he might guess correctly\u003c/em\u003e\u0026#x2014;he was someone so powerful, they had to consider that possibility, no matter how slim.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s also a chance he\u0026apos;ll spend all his Private Points to buy penalties.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then it would become a battle of financial power.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s not all. We absolutely must prevent the information on our selection from leaking.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;They\u0026apos;ll definitely try to probe us\u0026#x2026; Honestly, I can\u0026apos;t even imagine what methods they\u0026apos;ll use.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIshizaki\u0026apos;s muttering, which almost made it sound like he was talking to himself, also stirred strong doubts within Ryuuen.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere didn\u0026apos;t seem to be any significant loopholes in the special exam.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAyanokouji might not have any qualms about using foul play, but he wouldn\u0026apos;t use methods Ryuuen would think of, the kind that would kick up dust.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter all, there was no need to cross a dangerous bridge against an opponent who was significantly inferior in basic academic skills.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe problem would be solved as long as they could secure reliable information regarding Ryuuen\u0026apos;s class.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We should start off with Hashimoto, and it also seems wise to pay special attention to Yamamura.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUpon Katsuragi\u0026apos;s words, Ryuuen gave a small nod in agreement.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Who\u0026apos;s Yamamura? Was there such a person in Class C?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIbuki tilted her head, not remembering the name.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Kuku! Try to steal our information if you can, Ayanokouji.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWhich students to impose penalty points on.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIncluding everything, Ryuuen wouldn\u0026apos;t even leave a one percent chance of information being leaked to those around him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt would be impossible to accurately predict everything, and if it were possible, it would be akin to precognition.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe was convinced that such a thing could absolutely not be done.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile feeling convinced, he also felt a bit of anxiety and anticipation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe wanted to see how the impossible could be made possible.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is that okay, Ryuuen? I\u0026apos;ll start moving with that in mind too.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKatsuragi, thinking it was best to strike while the iron was hot, headed toward the karaoke exit.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince he significantly contributed to the improvement of the class\u0026apos;s academic performance, he felt a strong sense of responsibility for his actions in exams where academic skills were required.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSeeing the sight of Katsuragi\u0026apos;s determined back, Ruuyen was\u0026#x2026;\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 5\",\"volumeId\":\"y3v1\",\"chapterIndex\":29,\"prevChapter\":{\"volumeId\":\"y3v1\",\"chapter\":28,\"title\":\"Part 4\"},\"nextChapter\":{\"volumeId\":\"y3v1\",\"chapter\":30,\"title\":\"Chapter 6: School Life in Class C\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 1\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: The End of Everyday Life\",\"href\":\"prologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Confusion\",\"href\":\"chapter-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"chapter-1-part-1.xhtml\",\"index\":12},{\"label\":\"Chapter 2: Confirmation\",\"href\":\"chapter-2.xhtml\",\"index\":13},{\"label\":\"Part 1\",\"href\":\"chapter-2-part-1.xhtml\",\"index\":14},{\"label\":\"Chapter 3: The Commencement of a One-Year Period\",\"href\":\"chapter-3.xhtml\",\"index\":15},{\"label\":\"Part 1\",\"href\":\"chapter-3-part-1.xhtml\",\"index\":16},{\"label\":\"Part 2\",\"href\":\"chapter-3-part-2.xhtml\",\"index\":17},{\"label\":\"Part 3\",\"href\":\"chapter-3-part-3.xhtml\",\"index\":18},{\"label\":\"Part 4\",\"href\":\"chapter-3-part-4.xhtml\",\"index\":19},{\"label\":\"Part 5\",\"href\":\"chapter-3-part-5.xhtml\",\"index\":20},{\"label\":\"Chapter 4: An Onlooker's Perspective \",\"href\":\"chapter-4.xhtml\",\"index\":21},{\"label\":\"Pa
