tient feelings, we arrived at the location.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the back of the cafe, in one corner, I saw Ayanokouji-kun and\u0026#x2026; students from Class C, Hashimoto-kun and Morishita-san, and Ichinose-san from Class D.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There he is\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes\u0026#x2026; \u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe seemed to be conversing with those around him indifferently, just as usual.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s as if he isn\u0026apos;t thinking much of the transfer at all\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was an event that had happened just about an hour ago.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was as if he had already put it behind him\u0026#x2026;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Anyway, let\u0026apos;s talk\u0026#x2026; We need to talk to start things off. Everything begins from there.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eI shouldn\u0026apos;t make any conclusions at this stage yet.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eI must not conclude anything.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI forced myself to suppress my emotions and continued walking, though, my\u0026#xa0;steps felt heavy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I decided to call out to Ayanokouji-kun after closing enough distance between us, Hashimoto-kun, who had noticed us, quickly stood up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hey, Horikita. We\u0026apos;re in the middle of a strategy meeting right now, but do you need something?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was well aware that I would be treated as an unwanted guest here.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut right now, I only wanted to talk to Ayanokouji-kun.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I want you to let me have a conversation with Ayanokouji-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you want to talk to our leader candidate, you\u0026apos;ll have to go through me first.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;Leader candidate\u0026#x2026; That\u0026apos;s quite a sudden thing to say.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not sudden. I\u0026apos;ve been waiting for this moment all along. Right, Ayanokouji?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto-kun laughed and sought Ayanokouji-kun\u0026apos;s agreement.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wanted him to outright reject such an absurd notion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut I couldn\u0026apos;t directly meet\u0026#xa0;Ayanokouji-kun\u0026apos;s eyes as he looked my way.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wasn\u0026apos;t confident in facing the words he would utter next\u0026#x2026;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I won\u0026apos;t deny it. With Sakayanagi around, that chance was nonexistent anyway.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t want to hear such words.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIgnoring it, I continued.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What do you mean by this? Doing such a thing, transferring classes, really?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;d be bad if you just start talking on your own.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sorry, but I need you to be quiet right now, Hashimoto-kun. As the class leader, I have to grasp the current situation.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see, as the class leader, huh? Well, it\u0026apos;s certainly natural since a classmate suddenly left, but that makes it all the more reason why I can\u0026apos;t let you check. It\u0026apos;s convenient for us if you guys are troubled.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto-kun smiled slyly; his reasoning was sound.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIndeed, driving me away, who had barged in by myself, was undoubtedly better for Class C.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t glare at me like that. By the way, why\u0026apos;s Matsushita here at this crucial moment?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto-kun asked, concerned about the strange combination.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDespite his constant vigilant nature, he still had a habit of poking into troublesome places.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt\u0026apos;d be better if he wasn\u0026apos;t concerned with who was present, but he pretended to care and stirred things up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eHow should I answer to satisfy him?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I was about to think it over, Matsushita-san lined up beside me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m just accompanying her. I\u0026apos;m only here to convey to my class what I\u0026apos;ve seen and heard as a normal classmate rather than a leader. It seems Horikita-san is quite absorbed with Ayanokouji-kun, but honestly, it\u0026apos;s not a big problem for us.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs if deliberately taking on the thankless role, Matsushita-san answered.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI took her words graciously and gently nodded.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see. Indeed, it must look like a strange transfer to everyone but a few students. There\u0026apos;s no reason for Ayanokouji to drop to a lower class, and above all, questions like, \u0026apos;why would a student like Ayanokouji\u0026#x2026;?\u0026apos; is going around.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIndeed, there shouldn\u0026apos;t be that many people like me and Sudou-kun yet\u0026#x2014;people who knew even a fraction of Ayanokouji Kiyotaka\u0026apos;s true abilities.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eMatsushita-san here should be no exception\u0026#x2026;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAyanokouji-kun, having looked at us once, shifted his gaze back to Hashimoto-kun, who was about to sit down again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What Matsushita just mentioned about being an accompaniment must be a pretext.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;A pretext? But Horikita seemed convinced, didn\u0026apos;t she?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s a misunderstanding. To Horikita, Matsushita might seem like just another classmate. But in reality, she\u0026apos;s quite a schemer. It seems she values my abilities as much as Horikita does, or maybe even beyond that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt Ayanokouji-kun\u0026apos;s words, I looked at Matsushita-san.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe appeared calm, but I could see a slight disturbance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eHer understanding of Ayanokouji-kun\u0026apos;s abilities was deeper than I thought, and she even knew about it earlier than I had imagined\u0026#x2026;?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was how I took Ayanokouji-kun\u0026apos;s tone to mean\u0026#x2026;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Matsushita must\u0026apos;ve thought that she couldn\u0026apos;t leave this matter to Horikita.\u0026#xa0;That\u0026apos;s why she came to see me with her own eyes, to verify the reasons for the transfer, my true intentions. Just by looking at the OAA or observing her in everyday life, Matsushita might look like a mere honor student, but in actuality, she\u0026apos;s one of the sharpest minds in Horikita\u0026apos;s class. Usually, she doesn\u0026apos;t put forth all her effort and works behind the scenes. In fact, in this situation, it\u0026apos;s better to see that Matsushita can analyze the situation more calmly than Horikita.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh no, Ayanokouji-kun, you really seem to be overestimating me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMatsushita-san tried to deny it, but Ayanokouji-kun relentlessly showered her with his words.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s not the case. There have been several instances where you\u0026apos;ve skillfully arranged things from behind the scenes when I needed help. Even when Maezono was expelled, it was because you lent a hand. I\u0026apos;m actually giving you a fair evaluation.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAyanokouji-kun answered, and looking at Matsushita-san again, she no longer seemed capable of completely hiding her disturbance. This was the cooperative relationship between Ayanokouji-kun and Matsushita-san, which had likely been happening without my knowledge.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was casually exposed in front of the other classes\u0026apos; students.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eTo make it clear that he was no longer an ally\u0026#x2026;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo, for him, he might not even consider this as exposing us.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIchinose-san, who had been listening to the conversation with keen interest, rested her chin on her hands and smiled.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I didn\u0026apos;t know she was such a reliable person. I still have much to learn about the students here. From now on, I\u0026apos;ll have to pay close attention to Matsushita-san.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt felt as if the ground was shaking beneath me, and I was about to lose my sense of balance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a thought I would never have had before\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe feeling that this situation had completely turned into the opponent\u0026apos;s ground suddenly attacked both me and Matsushita-san.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s no point in exploring the reasons for the transfer. I haven\u0026apos;t told anyone about this, not Horikita, not Matsushita\u0026#x2014;not anyone in the class. I\u0026#x2019;m sure you can tell; neither Hashimoto, Morishita, nor Ichinose are surprised by my transfer. You understand what I mean by this difference?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s\u0026#x2026; maybe just something you only mentioned to them after meeting up at the cafe\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then go back to Class C or catch someone from the class and ask. They should tell you when they knew about the transfer.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI lost the voice I should\u0026apos;ve uttered with.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI couldn\u0026apos;t immediately think of the words to say.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s scary when a student leaves the class, huh, Horikita? Our class also had Katsuragi leave, and some information flowed to Ryuuen, but even then, Katsuragi was an outsider\u0026#x2026; No, Sakayanagi made him an outsider, so he hardly had any kind of insider knowledge. However, Ayanokouji isn\u0026apos;t like that, right? He was at the core of your class, so it seems likely that digging into things will reveal a lot about Matsushita and others.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto-kun, seemingly amused, lightly knocked on the table.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So Horikita, it\u0026apos;s about time you stated\u0026#xa0;your business here. We\u0026apos;re busy discussing things.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s nothing specific\u0026#x2026; I just\u0026#x2026; Like I said, I just want to talk with Ayanokouji-kun.\u0026#xa0;Preferably, just the three of us.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;As you can see, I\u0026apos;m currently having a discussion with Hashimoto and the others. Let\u0026apos;s talk right here.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;It\u0026apos;s hard to talk about things here. If you\u0026apos;re busy, it\u0026apos;s fine to talk at night, or tomorrow, or the day after\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sorry, but I\u0026apos;m booked for a while after this.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo matter how much I was rejected, I had to keep acting tough.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere were many students in the cafe, including my classmates.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf I carelessly lost my composure here, it would affect Class A\u0026apos;s future direction.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then, let me talk here\u0026#x2026; I came to hear your true intentions. I\u0026apos;m sure you understand why, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You really want to know the reason for the class transfer?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. What were you thinking doing something like that\u0026#x2026;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWas I the reason?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eOr was there something that changed your heart?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a\u0026#xa0;voice that couldn\u0026apos;t be heard.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI desperately tried to keep my heart\u0026apos;s inner screams from becoming reality.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sorry, but I don\u0026apos;t feel like answering. The only thing I can make clear is that the fact I moved from Class A to Class C is real\u0026#x2014;it isn\u0026apos;t a dream or an illusion.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe averted his gaze from me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe said he\u0026apos;d listen, but it was almost like being turned away at the door.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Unfortunately, there\u0026apos;s nothing more to say.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re okay with not answering anything? Ayanokouji-kun, you\u0026apos;ll be treated as a traitor, you know?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMatsushita-san persisted, speaking those words.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Isn\u0026apos;t that more or less the case already?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe didn\u0026apos;t care how others viewed him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe wasn\u0026apos;t even thinking about whether he had the resolve to go through with it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;I see.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePersisting any further here wouldn\u0026apos;t yield any results.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was clear that it would only expose my miserable self.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo\u0026#x2026; I had known from the start that it would turn out this way.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf he was worried about being seen, he simply would\u0026apos;ve taken the steps to have this meeting in the dorms or later in the day.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI understood this, but I just couldn\u0026apos;t restrain myself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Let\u0026apos;s go, Matsushita-san. He\u0026apos;s become my enemy, I understand that well. It\u0026apos;s clear that there\u0026apos;s no need to be discreet going forward.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI turned my back on him and started walking again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut I didn\u0026apos;t think I felt any clear emotions from what remained here.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOnly a feeling like that of a headache or a dizziness\u0026#x2014;an indescribable nausea\u0026#x201
