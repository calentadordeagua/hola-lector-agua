e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T18e4,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 4\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAFTER HEARING WHAT I had to say without sugarcoating anything, Horikita and Matsushita quietly turned back. Later, Ichinose also rejoined her friends and waved goodbye to the three of us. Watching her leave, Hashimoto took a deep breath.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Their reaction\u0026#x2026; It must have been quite a shock.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see. Ayanokouji Kiyotaka deliberately transferred this very day, waiting until after the opening ceremony, to maximize the disturbance in Class A?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If the transfer had been completed the day before, I risked the school notifying them or the homeroom teacher leaking it to them. Therefore, doing it when there was essentially no delay was best. In terms of time, the difference was less than an hour. However, I was in the same classroom as them before the ceremony and attended it as well. Horikita and the others must\u0026apos;ve unconsciously felt that it was the beginning of their usual journey with their classmates for the last year.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat faint hope, that expectation, was flawlessly utilized.\u0026#xa0;I was just waiting for the right timing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Did you calculate that far? That\u0026apos;s ruthless. Even though I\u0026apos;m on the side that benefits, it was hard to look directly at their faces when they were almost crying. In that respect, you don\u0026apos;t seem to have any sympathy or hesitation, Ayanokouji.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There shouldn\u0026apos;t be any. And there can\u0026apos;t be any. I came to Class C to ensure that in this final year, I could bring it to a position where it could claim Class A. Using the transfer at the most effective moment is a perfectly natural strategy.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf I were someone who still harbored lingering attachments, there was no way Class C would\u0026apos;ve accepted me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSomeone like that couldn\u0026apos;t be entrusted with class leadership.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s really reassuring to have you as an ally.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe current difference in Class Points was significant.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if we were to force expulsions, it wasn\u0026apos;t a tactic that could be employed frequently or repeatedly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo increase our chances of winning, even wasting the slightest opportunity wouldn\u0026apos;t be allowed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m still somewhat skeptical about the alliance, but I\u0026apos;m convinced for now.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I agree. However, the problems are piling up, Ayanokouji Kiyotaka. If it becomes known that you tried to form alliances or proceeded with matters on your own without being recognized as a leader by most of the class, the backlash from within Class C will only intensify.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m aware of that. Sooner or later, there will be students who voice their opinions against me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if they were unsatisfied, the class had no choice but to silently observe.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo pull me out of Class A, they all contributed their private points.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was what\u0026apos;s commonly known as the sunk cost fallacy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePeople couldn\u0026apos;t accept that the cost they\u0026apos;ve invested in would result in a loss so easily.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTherefore, while they\u0026#x2019;d criticize me, they\u0026#x2019;d also give me some leeway, hoping for a result that matches their efforts.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis seemingly reckless alliance strategy was set up from the start in a way that left no choice but to compromise by first observing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto, who invested the most Private Points in me, was a good example of this.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then, first and foremost, you have to gain the class\u0026apos;s approval, fast.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If a special exam can do that, things would be quicker.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMorishita, who stood up from her chair, glanced briefly at Hashimoto after his response.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I wonder about that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What do you mean?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Can you unconditionally entrust an unknown student to create a strategy for the special exam?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This time, if you weren\u0026apos;t the one mainly involved in bringing Ayanokouji Kiyotaka to the class, you would be the prime candidate for opposing such a plan. If not, refute my claim perfectly with just one, singular word.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;One word is impossible\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hmph.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSeeing that Hashimoto didn\u0026apos;t have a perfect rebuttal, Morishita left her seat.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s tiring dealing with her.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Was Morishita like that before I started talking to her?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;She hasn\u0026apos;t changed. But sure, she wasn\u0026apos;t someone who actively involved herself with others. In that sense, you\u0026apos;ve gotta be somewhat of an exception to her.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI felt a mix of emotions, unsure whether I should be genuinely pleased.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 4\",\"volumeId\":\"y3v1\",\"chapterIndex\":19,\"prevChapter\":{\"volumeId\":\"y3v1\",\"chapter\":18,\"title\":\"Part 3\"},\"nextChapter\":{\"volumeId\":\"y3v1\",\"chapter\":20,\"title\":\"Part 5\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 1\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: The End of Everyday Life\",\"href\":\"prologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Confusion\",\"href\":\"chapter-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"chapter-1-part-1.xhtml\",\"index\":12},{\"label\":\"Chapter 2: Confirmation\",\"href\":\"chapter-2.xhtml\",\"index\":13},{\"label\":\"Part 1\",\"href\":\"chapter-2-part-1.xhtml\",\"index\":14},{\"label\":\"Chapter 3: The Commencement of a One-Year Period\",\"href\":\"chapter-3.xhtml\",\"index\":15},{\"label\":\"Part 1\",\"href\":\"chapter-3-part-1.xhtml\",\"index\":16},{\"label\":\"P
