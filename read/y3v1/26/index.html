e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T9eb8,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 2\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWE ARRIVED AT the caf\u0026#xe9; without taking any detours.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Please wait a moment. I\u0026apos;ll take about an hour to decide what to drink.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t take an hour,\u0026#xa0;seriously don\u0026apos;t take an hour.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMorishita grinned in response to Hashimoto\u0026apos;s retort.\u0026#xa0;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Just kidding, but please wait a bit. I\u0026apos;ll ask my stomach what it wants.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWas your stomach really the right place to ask?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIn this case, I feel like you\u0026apos;d rather be asking the brain, but\u0026#x2026; well, never mind.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBehind us were a pair of first-year students, who seemed to be heading to the caf\u0026#xe9; as well. They started to line up, but then they stopped and started taking a step back to look at the menu, probably because of Morishita\u0026apos;s indecisiveness.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Decide before the line gets held up.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Understood. Today, I think I\u0026apos;ll have a matcha latte.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then, I\u0026apos;ll order for all of us. Go ahead and find us a seat in the back.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince we came to the caf\u0026#xe9; right after school, ninety percent of the seats were still empty.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed we could choose almost any seat we wanted, so I decided to pick the same spot as last time. While Hashimoto waited at the counter for our three drinks, Morishita and I took our seats.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Aren\u0026apos;t you calling Yamamura Miki over as well?\u0026#xa0;She was being self-deprecating, saying she\u0026apos;s just like oxygen, lighter\u003csup id=\"fnref-1-a2f23b93-d93b-5d29-bcfa-3471f6687c20\"\u003e\u003ca class=\"footnote-ref\" href=\"#fn-1-a2f23b93-d93b-5d29-bcfa-3471f6687c20\" data-ref=\"1\" epub:type=\"noteref\"\u003e[1]\u003c/a\u003e\u003c/sup\u003e\u0026#xa0;than carbon dioxide\u0026#x2014;you just breathe it in and out as you please, and that\u0026apos;s it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yamamura wouldn\u0026apos;t make such a harsh, self-deprecating comment.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat sounded like something only someone as eccentric as Morishita would say.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, that was indeed my own original comment, but she\u0026apos;s definitely feeling worried.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ve already given Yamamura a heads-up. It\u0026apos;s better for her to keep her distance from me for a while.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith my transfer, many students had been approaching me every day, and I\u0026#x2019;d become quite conspicuous. From baseless rumors to true information, things were flying around everywhere.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even for someone as inconspicuous as Yamamura Miki, that could certainly become an issue. You made that decision thinking that we don\u0026apos;t need to deliberately lower her value as someone who barely stands out.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Value, huh? Well, that\u0026apos;s one way to look at it, but this is out of consideration for a friend.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh? If you say so.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf I called, Yamamura would probably do her best to respond.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, standing out might cause her undue stress and hurt her emotionally.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So if Yamamura Miki wants to stand out, it\u0026apos;s okay for her to do so?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course. She should feel free to reveal herself at her own pace.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;How kind\u0026#x2014;or should I say, you\u0026apos;re quite composed.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYamamura had gotten close to Sakayanagi, which slowly began to change her thoughts. If I were to force her into acting as a mere tool right away, it might\u0026apos;ve caused her to close off her heart, fast. If that were to happen, she wouldn\u0026apos;t be able to function as the class\u0026apos;s eyes and ears properly. Overworking and breaking her would be foolish.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUnlike Sakayanagi, who had been making stable and consistent use of Yamamura since the beginning, I wanted to start by first nurturing her mind so that she\u0026apos;d become a resource that could be more handily put to use.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was unclear how Morishita viewed Yamamura, so it was safer not to discuss the matter.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Rather, I could be asking you the same. Aren\u0026#x2019;t you going to get along with Yamamura?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince transferring to Class C, I\u0026#x2019;d never seen Morishita and Yamamura interact.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYamamura had been sending her glances and seemed restless around Morishita, so it didn\u0026apos;t seem like she was unwilling to interact with her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s better not to get too involved with me.\u0026#xa0;It would only end up dragging her into a wicked fate. A frail being like her would likely perish\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t understand what you\u0026apos;re saying at all. Are you saying it\u0026apos;s okay for me to get involved then?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re fine, Ayanokouji Kiyotaka. You\u0026#xa0;seem like you can take a hit.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer impression probably wasn\u0026apos;t wrong, but it still felt somewhat unsettling.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hey, you two didn\u0026apos;t start the discussion without me, did you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto came back quickly, holding three cups in his hands.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t worry. The discussion is already over.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s good. Then let\u0026apos;s start from the beginning. First, let\u0026apos;s confirm the details of the exam again.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed he realized it was a lie, and he immediately prepared to start the discussion as soon as he sat down.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe took out his phone and displayed the rules of the special exam.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll just listen, so please start without me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHaving said that, Morishita declared her role as a listener and inserted a straw into her matcha latte cup.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then, I\u0026apos;ll start with what I thought. Honestly, I\u0026apos;m surprised the special exam\u0026apos;s using a one-on-one format right from the start of our third year. We just faced each other off at the end of last school year.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto shared his honest thoughts upon hearing the announcement.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBeing in a new class, this kind of start wasn\u0026#x2019;t bad.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s right. Moreover, the upper and lower classes are neatly divided. Seems to be a decision they made after considering the situation between us third years.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a great opportunity to close the gap between the classes at the top and the classes at the bottom, but it also inherently carried the risk of widening it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;As for me, I\u0026apos;m just glad we don\u0026apos;t have to start the alliance off unstable right from the get-go. The class would inevitably resist, and if that had happened, we would\u0026#x2019;ve had to prepare for an immediate loss. Just imagining it is scary.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI understood the feeling, but even if left alone, the time would come for this class to battle Ichinose\u0026apos;s.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had the opposite opinion; it would\u0026#x2019;ve been better if we\u0026#x2019;d clashed from the start. With superior academic abilities and having just transferred, deliberately losing to Ichinose would\u0026#x2019;ve left Horikita and Ryuuen with the impression that something was wrong.\u0026#xa0;I would\u0026apos;ve been able to leave a larger impact on those two, so I felt like I lost out a bit.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eLosing wasn\u0026#x2019;t just about losing; giving meaning to the defeat could also add value.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBy doing so, it could\u0026#x2019;ve led to a productive defeat.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShortly after the conversation started, the caf\u0026#xe9; began to get busier. The male and female first years who\u0026#x2019;d ordered earlier chose a seat next to ours with their iced coffee in hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t care about the details of the exam.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps having quickly reached her limits for staying silent, Morishita grumbled as she bit her straw.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe\u0026#x2019;d bitten it several times, flattening the tip.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hey, why did you come here then?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I was worried about Ayanokouji Kiyotaka because of your reckless outburst earlier, Hashimoto Masayoshi. You\u0026#xa0;made a bold statement in front of the whole class without permission, but was that really okay? Efficiently imposing penalty points on our opponents while neatly avoiding them on our classmates is the ideal tactic, sure, but it\u0026apos;s not easy. Our opponents are also thinking the same thing and racking their brains.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eStudents with high academic abilities could score high, but they were likely targets for penalty points. Conversely, students with low academic abilities were less likely to be targeted for penalties, but you couldn\u0026#x2019;t expect them to score high.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t worry, Morishita, it\u0026apos;ll work out. Shimazaki also said that at least we have the advantage of our academic prowess. So, even if we get hit by some of their penalty points, we\u0026#x2019;ll still be far ahead. It\u0026apos;s unavoidable if our guesses are a bit off. If we win the exam, we\u0026apos;ll likely continue with Ayanokouji as our leader for the next one.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was practically impossible to achieve a hundred percent accuracy while avoiding all of the penalty points.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhether I tried to look at it head-on or tried to turn things around, there was no absolute answer when it came to reading the opponent in this exam.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo matter how much we analyze, our accuracy would remain between 1% and 99%.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, unexpected developments like inside leaks could change the situation, but such naive scenarios were unlikely to occur now that we were in our third year.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even if our penalties completely miss, this victory will definitely bring something significant. Since there won\u0026apos;t be any reason to deny you from the start, I think there\u0026#x2019;s still a possibility that they\u0026#x2019;ll entrust the next exam to you. However, even then, our opponent\u0026apos;s participants in the small-group battles\u0026#x2026; ideally, you need to hit at least three of them to prove a point.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf I couldn\u0026apos;t successfully hit anyone, I wouldn\u0026apos;t be able to sway students like Shimazaki from being skeptical.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, it would be absolute proof that you\u0026apos;ve accurately read our opponent\u0026apos;s thoughts, so we can\u0026apos;t ignore it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOnly five students could participate in the small-group battles. Initially, we had a baseline of a hundred penalty points, so there would be five people for us to give a significant twenty-point deduction to. There was a less than a one percent chance of randomly hitting three participants from our opponent\u0026apos;s forty-student class.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was why reading the opponent became a critical and valued aspect of the exam.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Though, three seems tough. I think even two is enough.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto speculated that even showing a bit of accuracy would change the class\u0026apos;s impression.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe casually suggested getting two correctly, but even then, the probability was still less than ten percent. It wasn\u0026apos;t something you could consider high.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re just leaving it to somebody else, so you sure must be feeling comfortable, aren\u0026apos;t you? What I want to hear is your thoughts, Ayanokouji Kiyotaka. In a situation where there are no clues, how are you going to predict which student the opponent will nominate?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I can\u0026apos;t talk about that at this point yet. Saying anything careless here and having them taken at face value would be troublesome.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;My, my, you\u0026apos;re already on the defensive. This doesn\u0026#x2019;t bode well for the future.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I won\u0026apos;t deny it. That being said, if you have any other thoughts about the current situation, let me hear them.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I asked Hashimoto, who automatically kept the conversation moving, he nodded willingly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe was probably hoping that speaking up would bring about a good idea.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then, let\u0026apos;s proceed with the premise that we\u0026apos;ll hit two targets, alright? I think it\u0026apos;s best to spread our targets widely, assigning ten people with ten penalty points each. It\u0026apos;ll hurt if we narrow it down to just five students who might participate in the small-group battles and miss. Besides, with a ten-point advantage, our class would have a good chance of winning. There\u0026apos;s only a handful of opponents that\u0026apos;d be hard to deal with in their class.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust like Hashimoto said, in Ryuuen\u0026apos;s class, there were unfortunately very few students with a B+ or higher in academic ability, like Kaneda, Hiyori, and Katsuragi. That description wouldn\u0026apos;t even match six people.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you\u0026apos;re not confident, that\u0026apos;s the least you should do.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You agree, then, Morishita.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, it\u0026apos;s the most basic of basics.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then, we also need to think about our defensive strategy, not just offense. Though, do you even have a grasp of the academic ranking in our class?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I think I have a good idea from the OAA and the past two years.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Okay, but later, I\u0026apos;ll tell you about my subjective view over the past two years, so use it as a reference.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That would really help. I don\u0026apos;t know the finer details of everyone\u0026#x2019;s strengths and weaknesses.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was unclear whether it\u0026apos;d be useful in this special exam, but it should help save time later on.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;As for who to send from our class, I think we should select students with high academic abilities as the base, and then add some irregularities.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh? So does this mean you\u0026apos;re prepared to take on some of their penalty points, Morishita?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Playing it steady and choosing students with academic abilities in the low to middle range would significantly damage us if they were to end up seeing through that strategy. On the other hand, if we send students with high academic abilities and they\u0026apos;re overlooked, it\u0026apos;s a win for us.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto, leaning on his elbows and seemingly convinced, apparently had different thoughts.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I think we should distribute our participants among students with lower abilities. It\u0026apos;s essential to note those with high academic abilities. If it were me, I\u0026apos;d target them even if there\u0026apos;s a chance I\u0026apos;d miss the mark. No, actually, I might even take the gamble and assign a lot of points to only their top performers.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBoth parties\u0026apos; ideas for the special exam\u0026apos;s small-group battles seemed to contradict each other.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEach idea had valid points.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, in the end, there were only about three types of lineups to choose from.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe could either choose students with high abilities, low abilities, or a balance between them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Also, we should be concerned if the opponent decides to buy additional penalty points. It would be troublesome if they were to expand their targets to twenty or thirty of us in a strategy where they focus on quantity.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Using Private Points like live ammunition, huh? It\u0026apos;s risky, but Ryuuen might be prepared to make such a move.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf they were to successfully target all of the participating students in the small-group battles, they could significantly ease their handicap.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe ability to purchase additional penalty points was perhaps the most interesting element of this special exam.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNormally, it wasn\u0026apos;t easy to bridge the academic differences, and Ryuuen\u0026apos;s class would have almost no chance of winning.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, in addition to the full-class battle giving two points and the small-group battles giving five points, there was also the penalty points rule.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf they were able to come out on top in predicting our representatives, they could bring things to an even state, and with them being able to purchase additional penalty points on top of that, they\u0026apos;d be able to control their chances of turning things around to some extent.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was an exam we expected to win, but surprisingly, there were also opportunities for our opponents to utilize.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If they assign a twenty-point penalty to all our top scorers\u0026#x2026; that would be really bad, huh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Our odds of winning would drop significantly. However, to pull off such an absurd move, they\u0026apos;d have to use up their Private Points as if it were drinking water.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo reduce an extra twenty points, it would\u0026apos;ve cost an additional one million in Private Points. With twelve people in Class C with an evaluation of B+ or higher, even after deducting the initial hundred points, the expenses would amount to seven million.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Spending nearly ten million and still losing\u0026#x2014;that wouldn\u0026apos;t be something to laugh about.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYes, if they ended up winning, they\u0026apos;d be somewhat relieved, but they also had to consider the risks of losing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe higher they rose their odds of winning on this exam, the more they\u0026#x2019;d face financial difficulties, affecting their odds of winning in the future.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;How will Ryuuen handle this? Can you read his moves?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto frequently looked forward to\u0026#xa0;what I had to say.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy performance here would solidify my position within the class, so he was expecting an exceptional answer.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ryuuen\u0026apos;s strategy\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI showed a small gesture to suggest I was thinking before answering.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t know a thing about it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;So you haven\u0026apos;t thought of anything either.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Too bad, it seems Ayanokouji Kiyotaka hasn\u0026apos;t had a flash of insight yet.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s still time until the exam. All I have to do is come up with a winning strategy by then.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;He\u0026apos;s saying it\u0026apos;s better to take the long way around, huh? Well, Ayanokouji isn\u0026apos;t a god, after all.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto acted composed, though he clearly felt uneasy inside.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Besides, I have no intention of participating in the small-group battles in this special exam.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re free to do as you like, but are you sure that\u0026apos;s okay? You said yourself when we were talking about transferring that you need to demonstrate\u0026#xa0;your abilities clearly to be recognized in our class, Ayanokouji. It\u0026apos;s not that you\u0026apos;re lacking confidence, right, rare A-in-Academic-Ability-san?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Do you think Ryuuen won\u0026apos;t pay me any attention?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, it\u0026apos;s obvious that Ryuuen has his eye on you\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And normally, people would assume you\u0026apos;d participate, Ayanokouji Kiyotaka, and it would be standard for them to impose penalty points on you. If you foolishly show up, you\u0026apos;d be targeted. One or two penalty points would probably be manageable, but with thirty or forty of them, you\u0026apos;ve basically got no chance of winning. Let\u0026apos;s set aside whether they\u0026apos;d go that far just to secure a victory.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven with a perfect score, forty penalty points would reduce it to sixty.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven those that weren\u0026apos;t on Kaneda, Hiyori, or Katsuragi\u0026apos;s level would stand a good chance of winning.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s an eighty to ninety percent chance Ryuuen will impose multiple penalty points on me. There\u0026apos;s no need for me to participate.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see. You\u0026apos;re assuming Ryuuen will impose penalty points on you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. Regardless of how he responds verbally, he\u0026apos;ll almost certainly do that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then it might be better not to push it. It would be a relief if Ryuuen misses his shot.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It might be interesting to ask him what he thinks when he comes later.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? What do you mean, \u0026apos;when he comes\u0026apos;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ryuuen.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I spoke, Hashimoto hurriedly looked around.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;He\u0026apos;s isn\u0026apos;t here, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Not yet. But there\u0026apos;s been some movement in here, so it\u0026apos;s only a matter of time.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I directed my gaze to a corner of the caf\u0026#xe9;, Hashimoto and Morishita also looked that way.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKomiya and Yamawaki, who had been watching us, hurriedly averted their eyes, pretending it was coincidental, but it was probably too late.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So they were keeping an eye on us. I wasn\u0026apos;t worried about them because of our distance.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto had only been wary of potential eavesdropping.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn that sense, though, it was already too late.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTwo first-year students, a male and female duo, who had been sitting at the next table over finished their break at the caf\u0026#xe9; and stood up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I watched the two leave, Morishita tilted her head in confusion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Was there something about those first-year students?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Those two were also new students sent by Ryuuen.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah\u0026#x2026;? Are you serious?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. They tried to appear natural, but they placed their phones toward the edge of the table, closer to us, and laid them face down. They were either recording an audio or a video. If they were to receive a call, the screen would light up, and that would risk us seeing it. Normally, regardless of gender, people would either keep their phones on them or at hand and regularly check them. But Takikura\u0026#x2026; that girl didn\u0026apos;t touch her phone even when there was a pause in their conversation.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Damn, he\u0026apos;s already got first years in his grasp in such a short amount of time\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s been just under a week since they started school. During that time, Ryuuen has been making contact with first years to expand his surveillance network.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto was cautious, but naturally, it seemed the first years were off his radar.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re on top of things, Ayanokouji Kiyotaka.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even if it\u0026apos;s just information based on their middle school records, their names and faces are available on the OAA. I made sure to look them up the day they were published.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That might explain why those two seemed suspicious. However, that alone isn\u0026apos;t definitive evidence that they were people Ryuuen Kakeru sent out as guns. Perhaps she just happened not to touch her phone, or maybe the placement was unintentional. I don\u0026apos;t think we should completely dismiss those possibilities.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That might be true, but it\u0026apos;s better to be cautious. It\u0026apos;s important to operate under the assumption that they\u0026apos;re doing at least that much.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn actuality, there was indeed a reason that supported it, but it was better to touch on it after the special exam.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto whistled and nodded with a proud smile.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The possibility of them being spies is enough, Morishita. As expected of Ayanokouji.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You can\u0026apos;t just keep praising him. Rather, that would mean Ayanokouji Kiyotaka passed on some information.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ve only passed on information that\u0026apos;s safe to share. It\u0026apos;s okay.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So that\u0026apos;s why you were talking like you weren\u0026apos;t sure earlier. Yeah, that\u0026apos;s it. That\u0026apos;s a part of you I think highly of. You can\u0026apos;t just carelessly speak your mind when the enemy is nearby.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eGiven the limited moves we could make in this exam, information was indeed a weapon.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was essential to take action, gathering even the slightest hint or clue to win.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, it was also necessary to understand that it wouldn\u0026#x2019;t necessarily increase the odds of winning.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUsing unsuspecting first years wasn\u0026apos;t a bad idea, but ultimately, the information accuracy was more important than the quantity. Sorting through a mountain of claims that mixed in truths and lies and only extracting the former was a daunting task. In fact, it was fair to say that it\u0026apos;s extremely difficult.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMorishita took her lips off the straw of her half-finished matcha latte.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It seems he really did come.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Looks like it. Let\u0026apos;s stop chatting for now. Our next opponents are much more troublesome than Horikita and the others.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto, slightly tense, spoke with a smile that resembled a bitter grin.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen, Ishizaki, and Albert approached.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA week had passed since the opening ceremony.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eStudents from other classes and even different years asked about my class transfer in detail, but Ryuuen\u0026apos;s classmates, although they made eye contact, hadn\u0026#x2019;t mentioned the transfer at all until now. Rather, they seemed to have made an effort to deliberately avoid me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was clear that Ryuuen was giving instructions to his classmates.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t think things will take a bad turn in a place like this\u0026#x2026; but it\u0026apos;s a bit worrying without Kitou here.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto looked at Morishita, seemingly feeling a bit anxious.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe was probably imagining a worst-case scenario, but it was safe to say that he didn\u0026apos;t need to consider such a possibility.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You don\u0026apos;t have to tremble like a newborn fawn. When the time comes, I\u0026apos;ll knock them down one by one. Believe it or not, I have a master\u0026apos;s license in Ai-chan style martial arts.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;I\u0026apos;m counting on you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto, while grateful for Morishita\u0026apos;s pure lie, stood in front of us.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ayanokoujiii!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRight after, a loud and deep voice echoed not just through the caf\u0026#xe9; but throughout Keyaki Mall.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was Ishizaki who bursted out, unable to contain himself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why the hell did you transfer to Class C!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed that until now, he\u0026#x2019;d wanted to touch on this topic but hadn\u0026apos;t.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIshizaki opened the topic as if he were exploding with emotion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Shut up, Ishizaki. You\u0026apos;re bothering the other students, calm down.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto stepped in between us to prevent Ishizaki from reaching me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;How can I calm down! I\u0026apos;ve always\u0026#x2014;!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Move.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen caught up with Ishizaki, pushed his shoulder, and forcibly cleared the way.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eStudents sitting nearby, thinking that sparks might fly their way, began to hurriedly move their seats.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re ruining the caf\u0026#xe9;\u0026apos;s pleasant atmosphere, Ryuuen. At least use basic manners, will you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re as desperate as ever. If Sakayanagi disappears, you immediately stick to Ayanokouji without a hint of hesitation. Can\u0026apos;t you survive without clinging to the strong?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Working for the class isn\u0026apos;t a bad thing, is it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hah, well, do as you like. More importantly\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter turning his head around, Ryuuen pierced me with a sharp gaze.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What\u0026apos;s your intention in transferring to Class C?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s no particular reason. Sakayanagi left, and Class C came to help me transfer.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI looked at Hashimoto, who gave an exaggerated nod as if to say that was exactly right.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No way, man! You wouldn\u0026apos;t just transfer to a lower class for that!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Be quiet for a bit.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Y-Yes, sorry!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIshizaki, with Ryuuen grabbing him by the collar, hurriedly apologized.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Does my transferring to Class C cause any inconvenience to you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Kukuku. No? Far from it, I welcome this development. If you yourself lead the class, there could be no better stage for me to bring you down.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen had been dissatisfied with fighting against me while I utilized Horikita as a puppet to act as my cover.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn that sense, he showed a welcoming stance on the matter.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But Ryuuen, isn\u0026apos;t it quite late for you to be greeting our new leader?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Leader? That\u0026apos;s premature. It doesn\u0026apos;t seem like this guy\u0026apos;s been acknowledged yet.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOver the past week, he\u0026#x2019;d probably been prying into Class C\u0026apos;s state.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eStarting with the situation regarding Shimazaki and the others, it was probably clear to Ryuuen that I wasn\u0026apos;t welcomed yet and that I wasn\u0026apos;t able to act as their leader.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;My class expects results in the upcoming special exam. Please go easy on us.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s an impossible request. This is a good opportunity for us to fight you. I\u0026apos;ll play every card I can without holding back.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen turned his back to me and walked away.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s unnecessary to chat any further.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ayanokouji\u0026#x2026; why\u0026#x2026;? If you were going to C\u0026#x2026; Damn it\u0026#x2026;! Ah, well, what\u0026apos;s done is done\u0026#x2026; Anyway, let\u0026apos;s talk more next time.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDespite his frustration, Ishizaki accepted the situation and conveyed his message.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah, make sure you meet Shiina soon. She was feeling pretty down, not as much as me though.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I intend to.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI\u0026#x2019;d been deliberately avoiding the library until Ryuuen reached out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI decided that I would show my face again once the special exam was over.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlbert also gave me a small wave and silently followed Ryuuen back.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hah, he\u0026apos;s not all he makes himself out to be.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs if she herself had driven Ryuuen away, Morishita sucked up the matcha that was settled at the bottom of the cup like she\u0026apos;d just finished a hard day\u0026apos;s work.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The one who didn\u0026#x2019;t say a word sure is talking a lot\u0026#x2026; Anyway, Ryuuen\u0026apos;s definitely aiming for victory, and you can\u0026apos;t afford to lose either, Ayanokouji. Take your time and think through the strategy carefully. I\u0026apos;ll report to you as soon as I get new information.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFeeling restless, Hashimoto grabbed his cup without sitting back down and left the caf\u0026#xe9;.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hashimoto Masayoshi likes to move around on foot. Maybe it\u0026apos;s because he\u0026apos;s in the track and field club?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eNo, that\u0026apos;s probably unrelated\u0026#x2026; probably.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBesides, Hashimoto wasn\u0026apos;t even part of the track and field club.\u003c/p\u003e\u003chr class=\"footnote-rule\"/\u003e\u003col class=\"footnotes\"\u003e\u003cli data-id=\"a2f23b93-d93b-5d29-bcfa-3471f6687c20\" data-ref=\"1\" class=\"footnote first-footnote\" id=\"fn-1-a2f23b93-d93b-5d29-bcfa-3471f6687c20\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003ca class=\"footnote-backref\" href=\"#fnref-1-a2f23b93-d93b-5d29-bcfa-3471f6687c20\"\u003e[1]: \u003c/a\u003eIn Japanese, the kanji for \u0026quot;light,\u0026quot; \u0026#x8efd;\u0026#x3044;, is an adjective that can both describe an object that\u0026apos;s light and something\u0026#x2014;or in this case, someone\u0026#x2014;that isn\u0026apos;t important.\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 2\",\"volumeId\":\"y3v1\",\"chapterIndex\":26,\"prevChapter\":{\"volumeId\":\"y3v1\",\"chapter\":25,\"title\":\"Part 1\"},\"nextChapter\":{\"volumeId\":\"y3v1\",\"chapter\":27,\"title\":\"Part 3\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 1\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: The End of Everyday Life\",\"href\":\"prologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Confusion\",\"href\":\"chapter-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"chapter-1-part-1.xhtml\",\"index\":12},{\"label\":\"Chapter 2: Confirmation\",\"href\":\"chapter-2.xhtml\",\"index\":13},{\"label\":\"Part 1\",\"href\":\"chapter-2-part-1.xhtml\",\"index\":14},{\"label\":\"Chapter 3: The Commencement of a One-Year Period\",\"href\":\"chapter-3.xhtml\",\"index\":15},{\"label\":\"Part 1\",\"href\":\"chapter-3-part-1.xhtml\",\"index\":16},{\"label\":\"Part 2\",\"href\":\"chapter-3-part-2.xhtml\",\"index\":17},{\"label\":\"Part 3\",\"href\":\"chapter-3-part-3.xhtml\",\"index\":18},{\"label\":\"Part 4\",\"href\":\"chapter-3-part-4.xhtml\",\"index\":19},{\"label\":\"Part 5\",\"href\":\"chapter-3-part-5.xhtml\",\"index\":20},{\"label\":\"Chapter 4: An Onlooker's Perspective \",\"href\":\"chapter-4.xhtml\",\"index\":21},{\"label\":\"Part 1\",\"href\":\"chapter-4-part-1.xhtml\",\"index\":22},{\"label\":\"Part 2\",\"href\":\"chapter-4-part-2.xhtml\",\"index\":23},{\"label\":\"Chapter 5: Convolution\",\"href\":\"chapter-5.xhtml\",\"index\":24},{\"lab
