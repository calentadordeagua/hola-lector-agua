2014;her gaze was unfocused.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer eyes were lifeless, in some ways hollow.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven the most insensitive person in the class would\u0026apos;ve likely had the same impression.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eInitially intending to ask about the absent Ayanokouji, considering the atmosphere, Horikita judged that it wasn\u0026apos;t at all a subject that would be appropriate to bring up, and she figured that checking on Chabashira\u0026apos;s condition should undoubtedly be the top priority.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sensei, are you alright?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut before Horikita could act, Hirata had already checked on Chabashira.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, Chabashira did not respond to his voice.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed Hirata\u0026apos;s voice did not reach her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe students, who had been relatively quiet, began to grow anxious at this abnormality.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Um\u0026#x2026; Sensei?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom the front seat, close to Chabashira, Kikuchi\u0026#xa0;called out tentatively.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a call that came from\u0026#xa0;point blank range.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut Chabashira did not respond, remaining motionless.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKikuchi, trying to get noticed, stood up and waved their hand in front of her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFinally, it seemed Kikuchi\u0026apos;s actions caught her attention, and Chabashira glanced at them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, her gaze quickly shifted, now directed toward Horikita.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt least, that was what Horikita felt. Though, their eyes didn\u0026apos;t actually meet.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was just a vague look in Horikita\u0026apos;s direction.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe concluded that Hirata\u0026apos;s and the other students\u0026apos; voices weren\u0026apos;t reaching her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf that was the case, she might\u0026apos;ve been unwell.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere were no signs of anything going amiss until they headed for the opening ceremony, so they couldn\u0026apos;t just leave it be. It might\u0026apos;ve been a medical emergency.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs Horikita pulled out her chair to stand and head toward the podium\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m fine.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eHad Chabashira been hearing the students all along, or had she only just now registered their voices?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThough lacking vigor, Chabashira murmured that short line.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You say that, but you clearly seem unwell.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThough relieved to get a response, Hirata wanted confirmation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;That is\u0026#x2026; no, really, I\u0026apos;m fine. Just\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTrying to continue, Chabashira leaned on the podium.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer gaze turned toward Horikita again, but it wasn\u0026#x2019;t really focused on her\u0026#x2014;it was fixed on the only empty seat beside her, Ayanokouji\u0026#x2019;s seat. \u0026quot;Did something happen to Ayanokouji-kun?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOn the way back from the gym, if Ayanokouji had suffered a major injury or developed some kind of illness, Chabashira\u0026apos;s change in demeanor would\u0026apos;ve made sense.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWas there something wrong?\u003c/em\u003e\u0026#xa0;Such speculation seemed to have hit the mark somewhat.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHorikita\u0026apos;s inquiry must\u0026apos;ve reached Chabashira for sure.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYet, the lack of response and the ensuing silence suggested the seriousness of the matter.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is it an injury? Or an illness?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eImpatiently, Horikita asked the question, and Chabashira shook her head slightly from side to side.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis gesture indicated that their assumption was wrong.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIf it isn\u0026apos;t an injury or illness, then for now, it isn\u0026apos;t an emergency.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eBut then, why\u0026apos;s Chabashira showing such a gloomy expression?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, no, what is it? Something happened to Ayanokouji, right? Please tell us.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDespite reading the room, Ike, frustrated by Chabashira\u0026apos;s vague demeanor, pressed for a quicker explanation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eChabashira glanced at Ike before turning to look over the entire class.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer expression remained grave, giving no sign of reassurance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;Honestly\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eChabashira began to speak softly, but then she closed her eyes, and her mouth once came to a close.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, she couldn\u0026apos;t remain silent forever and raised her head.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026#x2019;s something I need to tell all of you. This morning\u0026#x2014;no, just a little while ago\u0026#x2014;a certain student used their Private Points to exercise a certain right\u0026#x2026; or so it seems.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThough her words were hesitant and unclear, Chabashira told the class the truth.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? I don\u0026apos;t really understand. What did they do with their Private Points?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eA certain student.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eUsed their Private Points to exercise a certain right.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven as she tried to explain the situation, the details were so vague that it left everyone confused.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIs it a troublesome matter another class caused, something she can\u0026apos;t elaborate on?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSpeculations continued to grow in the students\u0026apos; minds.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The student who\u0026#x2019;s absent from the classroom right now\u0026#x2026; Ayanokouji. He\u0026#x2019;s the one who exercised that right.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eChabashira spoke gravely, but her lack of clarity made the students tilt their heads.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWhat kind of right had Ayanokouji exercised?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;Class\u0026#x2026; transfer.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as someone was about to ask another question, Chabashira uttered what seemed to be the crux of the matter.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAyanokouji had transferred classes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIndeed, Chabashira had mentioned a class transfer, but such a thing seemed impossible.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf he were to transfer from Class A, it would inevitably mean going to a lower class.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut that was a problem in itself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Um, Chabashira-sensei. If this is a joke, it isn\u0026apos;t funny, and shouldn\u0026apos;t you consider our feelings when we\u0026apos;re listening so seriously?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf it was as simple as just transferring classes as soon as you thought of doing so, no one would have a hard time with it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, a student would need to prepare twenty million Private Points to transfer to another class\u0026#x2014;a well-known fact and an unrealistic tale.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was why some students began to take it as a joke.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I also agree with Horikita-san\u0026apos;s opinion. More importantly, are you really okay?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eChabashira continued to make statements that not only lacked a sense of credibility, but the claims were bordering on contradictory.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps she was ill, or\u0026#x2026;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Could it be that some special exam has started?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlmost simultaneously with Horikita, Sudou crossed his arms and calmly expressed his thoughts.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYes, from Chabashira\u0026apos;s behavior and claims, it seemed more realistic to think that some strange exam had begun.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I understand that what I\u0026apos;m saying is hard to grasp. However\u0026#x2026; it\u0026apos;s the truth.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even if you say it\u0026apos;s the truth\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Take out your phone and display the class OAA.\u0026quot; Chabashira, refusing to admit it was a lie, gave instructions with her eyes lowered.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I think you\u0026apos;re taking this joke too far\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, a trace of unease crossed her mind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBy now, Horikita had begun to feel a slight sense of foreboding.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMany classmates, though skeptical, followed the instructions and turned on their phones.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey displayed the Class 3-A list.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, it was supposed to list all thirty-seven students\u0026apos; OAA.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eNo, if it isn\u0026apos;t listed, it must be a lie.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eHowever\u0026#x2026;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThinking she might\u0026apos;ve missed it, Horikita repeatedly swiped her screen up and down.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut Ayanokouji\u0026apos;s name was nowhere to be found.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was as if he had never been in the class, vanishing from the list.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSuch an update to the OAA\u0026#x2014;she had seen this scenario a few times before.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was the same when Katsuragi Kouhei transferred and when someone dropped out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Just now, it seems that Ayanokouji\u0026apos;s data has been moved.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What\u0026#x2026; What are you talking about, Sensei? That can\u0026apos;t\u0026#x2026; that can\u0026apos;t be right.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHorikita\u0026apos;s voice unconsciously trembled.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ayanokouji has been transferred from this class to Class C as of today.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eChabashira clarified the situation\u0026apos;s previously ambiguous details.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAyanokouji had been absent since the opening ceremony because he had left this class.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;Huh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe understood the words, Chabashira\u0026apos;s explanation, but immediately after, Horikita\u0026apos;s body showed signs that she didn\u0026apos;t understand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What are you talking about\u0026#x2026;? Something like Ayanokouji-kun transferring to Class C\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s not funny, Sensei. It\u0026apos;s not April Fool\u0026apos;s Day.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMany of the students still weren\u0026apos;t even half convinced. They doubted it, assuming it was a lie.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I also\u0026#x2026; don\u0026apos;t\u0026#xa0;like such jokes.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eThump, thump, thump\u003c/em\u003e\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I think there\u0026apos;s something off about Chabashira-sensei today.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eThump, thump, thump, thump, thump\u0026#x2014;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003ePlease stop\u0026#x2014;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHorikita muttered in her mind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWhy is my heartbeat so fast, so loud?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn truth, she had understood why by this point, but she didn\u0026apos;t want to.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDisturbed by Chabashira\u0026apos;s bad joke, her mind was thrown into disarray.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I feel the same way\u0026#x2014;it\u0026apos;s unbelievable. But\u0026#x2026; this is undoubtedly the truth.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eThump, thump, thump, thump, thump, thump, thump\u0026#x2014;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That can\u0026apos;t be right. It must be some mistake.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs Horikita responded, she loaded the OAA list for Class 3-C.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIf it\u0026apos;s true that he\u0026apos;s transferred, it\u0026apos;d be strange if Ayanokouji\u0026apos;s name isn\u0026apos;t displayed here.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eBut there\u0026apos;s no way that could happen.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYet, as she looked at the displayed OAA list\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAyanokouji Kiyotaka\u0026apos;s name had been added.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe moment she saw it, she became utterly confused, and Horikita\u0026apos;s thoughts came to a halt.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;T-This is a lie, right, Sensei? That Ayanokouji-kun has transferred\u0026#xa0;to Class C\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMatsushita, who was clearly flustered, raised her voice in a way that was unlike her; some students couldn\u0026apos;t hide their surprise at this unusual behavior.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s true\u0026#x2026; It\u0026apos;s not a mistake.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eChabashira kept glancing back at the tablet.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf that was the case, it wouldn\u0026apos;t be strange if there had been a notification from the school. It made her want to go against the flow of time and stop it\u003cem\u003e.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHorikita\u0026apos;s understanding of the situation hadn\u0026apos;t caught up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAyanokouji had transferred classes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo matter how many times she thought about it, it was incomprehensible.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIt can\u0026apos;t be possible.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHorikita and the others had finally, with a great amount of effort and time, climbed up from Class D.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd at last, they had reached Class A.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom that moment forth, for one year, everyone would unite to maintain that position.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYet, there was no benefit to transferring to Class C.\u003c/p\u003e\u003cimg src=\"/hola-lector-agua/images/books/y3v1/OEBPS/GMrdMMKLBVawdOpnxdDjK.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cimg src=\"/hola-lector-agua/images/books/y3v1/OEBPS/MbudzruBBiLVsnoRzspif.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cp class=\"paragraph after-image\" style=\"text-align: left\"\u003e\u0026quot;B-But what about the Private Points? Twenty million is a huge amount, even for him\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We don\u0026apos;t know the details yet. However, since the school has officially approved it, he definitely prepared that amount.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What? If that\u0026apos;s true, then Ayanokouji\u0026#x2026; Eh, why?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, it doesn\u0026apos;t make sense, right? We finally managed to make it to Class A, right? And on our first day as Class A, he moves to the falling Class C\u0026#x2014;to the class that lost Sakayanagi?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What the hell is Ayanokouji thinking\u0026#x2026;? I can\u0026apos;t understand it at all. Did you hear anything beforehand, Akito?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, not a word\u0026#x2026; We\u0026#x2019;ve been a bit distant lately. If even Horikita and the others don\u0026apos;t know, then probably no one does.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs it turned out,\u0026#xa0;even the students within the group Ayanokouji was close to, such as Yukimura and Miyake, were not informed about this transfer.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Or is \u003cem\u003ethat\u003c/em\u003e\u0026#xa0;what this is about? Because he was dumped by Karuizawa and felt too embarrassed to stay in the class?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, that can\u0026apos;t be it, right?\u0026#xa0;Even if he was embarrassed, he wouldn\u0026apos;t have the funds to transfer.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Maybe he begged people and ended up borrowing\u0026#x2026;? No, that\u0026apos;s unlikely.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Could he have betrayed us?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But then again, he didn\u0026apos;t go to a higher class, he went to a lower one, right? It\u0026apos;s just not normal\u0026#x2026; It\u0026apos;s not like he\u0026apos;s jumping on the winning horse, especially since Sakayanagi is gone. And it\u0026apos;s not like Katsuragi\u0026apos;s case where he no longer had a place to fit in and got pushed out, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShinohara muttered her doubts, to which Hondou responded with a similar suspicion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere were things they couldn\u0026apos;t even imagine.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOr rather, at least most students wouldn\u0026apos;t even imagine it\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat Ayanokouji alone could influence the outcome of the class battles with his abilities.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was a chance that Ayanokouji might\u0026apos;ve wanted to take it easy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, it could\u0026apos;ve been argued that staying in this class and doing nothing would be a far safer bet than transferring to a class that sank with Sakayanagi\u0026apos;s departure.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t know. It\u0026apos;s weird to voluntarily go down to a lower class, but there might be Private Points involved. Not just the transfer funds, but getting paid for living expenses for the next year in return\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026#x2019;s even weirder. That would mean he\u0026#x2019;s being brought in as a replacement for Sakayanagi, or rather, someone worth paying a huge sum to guarantee Class C\u0026#x2019;s victory. But why Ayanokouji? Sure, he\u0026#x2019;s been making some noticeable moves lately, but\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUpon hearing that, Horikita gasped.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if she didn\u0026apos;t understand Ayanokouji\u0026apos;s intentions, she couldn\u0026apos;t discard the idea that the former Sakayanagi class had acted to acquire Ayanokouji. Rather, it might\u0026apos;ve been the most logical choice they could take to turn things around.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut that raised the question: \u003cem\u003eWould Ayanokouji really agree to such a proposal?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s a possibility.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKushida calmly murmured her comment amidst everyone\u0026apos;s disturbance and confusion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But, you know\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, even if it\u0026apos;s true\u0026#x2026; it doesn\u0026apos;t feel like something to make such a big fuss about, right? It\u0026apos;s not like Horikita or Hirata left.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Kanji\u0026#x2026; Ayanokouji being gone isn\u0026apos;t such a simple issue.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re saying that it\u0026apos;s not that simple? Even if Ayanokouji-kun leaves, it\u0026apos;s not even that big of a\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSome students didn\u0026apos;t see\u0026#xa0;the reality of this transfer as much of an issue.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKushida looked at them with a dismayed gaze.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ike-kun, Shinohara-san, sorry, but Ayanokouji-kun is much more important than you two think.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Important, you say\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Just because it hasn\u0026#x2019;t come to light doesn\u0026#x2019;t mean he hasn\u0026#x2019;t contributed to the class in countless unseen ways. Right, Horikita-san?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKushida, remaining calm amidst the chaos, passed the question to Horikita, who nodded in agreement.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes\u0026#x2026; Setting aside Ayanokouji-kun\u0026#x2019;s intentions, there\u0026#x2019;s no denying he\u0026#x2019;s the ideal recruit for Class C\u0026#x2019;s comeback. If he truly were someone we could afford to lose, Chabashira-sensei wouldn\u0026apos;t be like this.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRather than listening to her students, Chabashira remained in a state of shock.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShinohara and Hondou exchanged glances as they watched her remain frozen in place.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;For real? Is it actually true?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Like Horikita said, Ayanokouji\u0026apos;s presence is significant. If he weren\u0026apos;t in our class, we most likely wouldn\u0026apos;t be in Class A now. Of course, that\u0026apos;s not the only reason we made it to Class A, but still\u0026#x2026; the hole he leaves is bigger\u0026#xa0;than imagined\u0026#x2014;but still, why\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNeither the teacher nor the students knew the answer.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf a student existed who understood everything in this situation\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNaturally, not only Horikita but many students\u0026apos; gazes turned to Karuizawa, who hadn\u0026apos;t spoken a word.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eKaruizawa, as a girlfriend, had spent more time with him than anyone else; she might know\u0026#x2014;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEveryone probably harbored such thoughts.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Karuizawa-san, did he tell you anything?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;I don\u0026apos;t know. I really don\u0026apos;t know anything. It\u0026apos;s not that I\u0026apos;m hiding anything; I truly don\u0026apos;t know.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWithout looking their way, Karuizawa answered indifferently. To Horikita, Karuizawa\u0026apos;s clouded expression didn\u0026apos;t seem to stem only from Ayanokouji\u0026apos;s transfer, but also from Karuizawa believing that it was due to her, as his girlfriend, initiating the breakup.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eNo, that\u0026apos;s not the issue now\u003c/em\u003e.\u0026#xa0;Horikita dismissed such thoughts from her mind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf Ayanokouji had truly transferred classes, that was the last of their concerns.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Can this transfer be canceled if it\u0026apos;s some kind of mistake?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If it\u0026apos;s an illegal transfer, there\u0026apos;s a possibility it could be canceled\u0026#x2026; However, in that case, the person who committed the fraud would face severe punishment. The arrows would also point at Ayanokouji.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eAn illegal transfer initiated by Ayanokouji.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was an unthinkable possibility.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But the possibility that it\u0026apos;s a fraud is low. Since the school has officially accepted it\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Still, we don\u0026apos;t know, do we? He might have some unexpected reasons that may come to light later, like him being threatened.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOtherwise, Horikita couldn\u0026apos;t explain it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eA transfer to another class without any warning\u0026#x2014;there\u0026apos;s just no way.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, that\u0026apos;s\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Horikita-san.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHirata\u0026apos;s calm voice reached the flustered Horikita.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I think we should start by accepting reality.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Reality\u0026#x2026; what do you mean by that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Just what it sounds like. He, Ayanokouji-kun, has transferred classes. This is an undeniable fact. The school has already accepted it, and his absence here is proof.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But that\u0026apos;s\u0026#x2026; that\u0026apos;s not proof. He might just be sick, or it could be some sort of a mistake\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;As Sensei explained, Ayanokouji-kun\u0026apos;s transfer has been confirmed on the\u0026#xa0;OAA. No matter how much we don\u0026apos;t want to believe it, we have to start by accepting that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHorikita was at a loss for words as Hirata continued speaking calmly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKushida, observing this, showed some slight interest.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You seem quite calm, Hirata-kun. Whether it\u0026apos;s a transfer or expulsion, a student may have disappeared from our class, and yet you\u0026apos;re not disturbed.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHirata had always been distressed whenever there was a risk of expulsion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd after someone would leave, he was more concerned about the departed student than anyone else.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Transfer and expulsion are different. Especially if it\u0026apos;s his own decision. Besides, panicking won\u0026apos;t help. No matter how much we fuss, Ayanokouji-kun won\u0026apos;t come back.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Isn\u0026apos;t that wrong? Horikita-san hasn\u0026apos;t given up on the possibility of it being a mistake yet. Shouldn\u0026apos;t you be supporting her, like the Hirata-kun we know?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile a few students in the class remained calm, Hirata was the most composed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHis careful observation of the class\u0026apos;s reaction was uncharacteristic.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So, what are you trying to say, Kushida?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSudou stood up, pulling his chair back.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe suspected that Kushida was stirring up trouble in the class again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Merely discussing this during our homeroom period without any clear information won\u0026apos;t lead us to any conclusion. Right, Chabashira-sensei?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith a signaling tilt of her head, Kushida glanced toward the hallway.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe other classes had apparently finished their homerooms, as the hallway was getting noisy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;Y-Yes, that\u0026apos;s right.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe classroom was highly soundproof, so a normal speaking volume wouldn\u0026apos;t carry to the hallway.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, if someone were to approach the wall and get close to the door, it was possible to catch some voices.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eStudents with bad intentions might\u0026apos;ve been eavesdropping outside.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSudou nodded appreciatively and sat back down.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Let\u0026apos;s end the homeroom period here. However, I ask that you don\u0026apos;t take action against Ayanokouji for the sake of blaming or criticizing him.\u0026#xa0;Currently, he hasn\u0026apos;t done anything against the rules.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust like the students, she had many doubts. However, as a teacher, she had to instruct them to refrain from any problematic behavior. As an adult, she mustn\u0026apos;t forget to give warnings where necessary.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I agree with Chabashira-sensei. Not only from a rules perspective, but also because approaching him in large numbers without understanding the situation can easily lead to trouble. I\u0026apos;ll check on things first, so please stay calm until then.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s right. Avoid unnecessary contact with Ayanokouji, and make sure not to get into trouble with other classes. If anything happens, make sure to go through me or the school, okay?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs a teacher, Chabashira thought that staying silent with the students any longer wouldn\u0026apos;t help. She steeled herself, placing her hands firmly on the podium.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 1\",\"
