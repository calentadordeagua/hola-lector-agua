e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T354f,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 1\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI\u0026#x2019;D RECENTLY TRANSFERRED classes, and although it was a slow start, my relationships gradually began to change.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, some things in my school life didn\u0026apos;t change\u0026#x2014;the school lessons.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDuring class, students generally focused on things quietly, spending a lot of time alternating between monitors and tablets. With each class, the faces of the teachers giving the lectures also varied, but it was a similar scene no matter which class you belonged to.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith special exams looming, students seemed to be working more seriously than usual.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe content we were studying wasn\u0026apos;t worth mentioning in detail; it was like revisiting a path I\u0026#x2019;d traversed many years ago, now taking it on as a form of review.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn such unchanging times, if I had to point out a difference between Horikita\u0026apos;s class and my current one, it would be the lack of time wasted and efficiency when studying.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere were individual differences in academic ability, with some students who were fast to grasp new concepts and others slow.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTherefore, students like Ike and Hondou often stumbled over things they didn\u0026apos;t understand, resulting in the teachers being asked more questions and even occasional pauses in the lesson.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOn the other hand, overall, Class C was highly motivated when it came to learning, and many students understood how to study, making the progress extremely smooth. A solid foundation for learning had been established, creating a virtuous cycle that led to improvement in everyone\u0026apos;s academic abilities.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd today, it was time for self-study, where I tended to slack off and lose focus.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince there were no teachers nearby watching, it was easy to hear some private conversations in the background, but the students in this class still faced their tasks earnestly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHorikita\u0026apos;s class had grown considerably over the last two years, but when it came to learning, it wasn\u0026apos;t surprising that they hadn\u0026apos;t been able to catch up to or surpass Class C\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eHm? Something feels a bit uncomfortable.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIs it just my imagination?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUpon thinking so, I felt something else that was a bit uncomfortable.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eAn uncomfortable sensation\u0026#x2026; right?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWhat is it? It\u0026apos;s not just my imagination, is it?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile I still had my pen in hand, I stopped writing on my tablet.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was because, in my mind, a faint but recurring uncomfortable sensation was occurring.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, it felt very small.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe first time, I\u0026#xa0;perceived it as just the wind playing pranks on me, but that wasn\u0026apos;t it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eClearly, this uncomfortable sensation was recurring, and it was happening in unspecified places on my hair.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo investigate its cause, I slowly looked behind me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What is it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMorishita voiced her question in a low voice, glaring at me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe held a pen in her hand, just like me, and seemed to be working on something.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, I mean\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Looking behind you during class, even during the self-study period, is something only a naughty, naughty student would do. Please face forward and focus on what you have to do.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was given an irrefutable argument.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFortunately, the uncomfortable sensation in my hair disappeared for some reason when I turned around, so it might be better not to worry about it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI turned back to the front and resumed working on the tablet.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA little while after resuming, I felt the sensation in my hair again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf there was a cause, it could only be Morishita, who was sitting behind me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis time, I turned back a bit quicker.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen, Morishita, looking like she was caught in the act, quickly grasped something with her left hand and hid it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUnfortunately, I couldn\u0026apos;t see what it was.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Staring at my face from such a close distance, what a pervert.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I have no such intention. Are you doing something to the back of my head?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI decided to ask directly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Not at all? I\u0026apos;m seriously engaged in the class.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe tapped the tablet with her pen twice to emphasize that, but her behavior was clearly odd.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlthough it was self-study time, it wasn\u0026apos;t a situation where I could freely turn around as I pleased.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, there was no doubt that something was going on.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMorishita was clearly deceiving me, but the surrounding gazes told a different story.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere were clearly those who looked at me with eyes filled with \u0026apos;sympathy\u0026apos; and \u0026apos;pity.\u0026apos;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hey, Shiraishi.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Fufufu, what is it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy seatmate, upon being addressed, couldn\u0026apos;t suppress her laughter and covered her mouth as she chuckled.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is Morishita doing something?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, I don\u0026apos;t really know.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eConfused by the obvious lie, I realized that I had to deal with it myself. If that was the case\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI pretended to give up and faced forward again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI immediately continued my studies with my pen.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, Morishita must have known that I wasn\u0026apos;t seriously staring down at the tablet.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe was probably trying to catch definitive evidence. But that was fine.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIf I can confirm that she\u0026apos;s up to something, she might decide to stop her wrongdoings there.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn other words, it was a way of saying, \u0026apos;I\u0026apos;ll overlook this, so don\u0026apos;t do anything more.\u0026apos;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI thought this would allow me to concentrate, but such hope was shattered in just a few seconds.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAn uncomfortable feeling appeared at the back of my head again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eDid she do that because she saw through my shallow thoughts?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if I tried to turn around quickly, there was a limit to how fast I could react when I was exposing my back defenselessly. It was difficult to check what she was holding in her left hand before she could clench her fists to hide it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eBut what exactly is she doing\u0026#x2026;?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSuddenly, I noticed Shiraishi\u0026apos;s fingertips moving and pointing toward the floor.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eI see\u0026#x2026; This was the source of that uncomfortable sensation.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFurthermore, Shiraishi motioned with her hand, setting the tip of her left index finger on her desk, tapping it lightly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe sensation occurred just as her fingertip either touched or nearly touched the desk.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis meant I could move before the sensation came.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer fingertips rose again, and then lowered.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt that moment, I turned around. Morishita flinched, but this time, I wouldn\u0026apos;t let her escape.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRather than grabbing the hand she was moving, I took her left hand that was clenched into a fist and forcibly opened it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat came out was an eraser that had long become unnecessary in class.\u003c/p\u003e\u003cimg src=\"/hola-lector-agua/images/books/y3v1/OEBPS/zUZajMwDGyMAcvsjiFtxT.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cimg src=\"/hola-lector-agua/images/books/y3v1/OEBPS/AzkcuoVImjaCtoyDdrseY.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cp class=\"paragraph after-image\" style=\"text-align: left\"\u003e\u0026quot;What is this?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, what could it be?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And these crumbs on the floor?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t know.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe played ignorant, but it was futile. Morishita had been rubbing the eraser on the desk and throwing the resulting crumbs at my head.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;d better confess.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You saved me, Shiraishi. Thanks to you telling me the timing, I caught her red-handed.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah, so that\u0026apos;s what it was. You\u0026apos;re impressive, Shiraishi Asuka.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m sorry. I couldn\u0026apos;t just leave Ayanokouji-kun feeling troubled.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Isn\u0026apos;t this what you call bullying, Morishita?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Bullying? What a laughable accusation. Let me ask you something, would you call it bullying if a kitten messes with a lion? Just imagine.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well\u0026#x2026; I wouldn\u0026apos;t.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Right? Bullying is a vile act where the strong prey on the weak. One of us is trying to become the class leader, the physically superior Ayanokouji Kiyotaka, and then there\u0026apos;s me, a weak maiden. No matter how you look at it, it\u0026apos;s clear and obvious who\u0026apos;s strong and who\u0026apos;s weak. What I\u0026apos;m doing, if I must say, is similar to Jeanne d\u0026apos;Arc.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why is the Maid of Orleans coming up here?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Because she\u0026apos;s a knight who defeats evil?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eI\u0026apos;m the villain, and Morishita\u0026apos;s justice? That\u0026apos;s a truth I absolutely can\u0026apos;t accept in this situation\u003c/em\u003e.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Cute.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi muttered the word, having been watching our exchange with narrowed eyes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIndeed, if judged solely by appearance, Morishita was indeed blessed in terms of looks.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, only those who hadn\u0026#x2019;t actually suffered could deem this behavior cute.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I finally understand, Shiraishi. This must be why Sugio readily gave up his seat.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. It seems the student before Morishita-san faced similar troubles.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;As\u0026#xa0;long as evil exists in this world, it\u0026apos;s my duty to keep fighting.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThough whatever Morishita was saying shouldn\u0026apos;t have made any sense, Shiraishi kept smiling cheerfully throughout.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 1\",\"volumeId\":\"y3v1\",\"chapterIndex\":31,\"prevChapter\":{\"volumeId\":\"y3v1\",\"chapter\":30,\"title\":\"Chapter 6: School Life in Class C\"},\"nextC
