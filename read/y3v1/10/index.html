e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T1ade,"])</script><script>self.__next_f.push([1,"\u003ch1 class=\"heading_1\"\u003e\u003ca class=\"heading-link\" href=\"/read/y3v1/2\"\u003ePrologue:\u003cbr/\u003eThe End of Everyday Life\u003c/a\u003e\u003c/h1\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWHILE SUPPRESSING A faint feeling of excitement, I headed to school a little earlier than usual.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen, climbing the stairs that I hadn\u0026apos;t yet grown used to,\u0026#xa0;I reached the floor where the third-year classrooms were located.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBefore long, I was looking at a nameplate, in which the name \u0026apos;Class 3-A\u0026apos; was embedded\u0026#x2014;my classroom.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI stopped and stared intently at the neatly polished plaque.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ve finally made it here\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlthough the reality still feels somewhat distant, I know the situation before me isn\u0026apos;t a dream.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom Class 1-D to Class 3-A.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere\u0026apos;s been many fun and happy moments, but I must not forget the painful experiences.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe journey here was by no means smooth.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYamauchi-kun, Sakura-san, and Maezono-san.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat exists here now is built upon the sacrifices of those who had to leave our class.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI must not forget that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eCome to think of it, when I entered the school, I didn\u0026apos;t have any clear goals.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was here simply to follow after my older brother.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, my brother continued to keep his distance and coldly pushed\u0026#xa0;me away.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDespite this, as I continued my school life, I came to realize my brother\u0026apos;s true feelings.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was made to learn that it wasn\u0026apos;t sufficient to just chase after him, denying my own potential.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNow, I\u0026apos;m a member of the student council, and I even read a congratulatory speech at the entrance ceremony.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI\u0026apos;m walking an unbelievable path.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI must not forget that, behind me on this path, Ayanokouji-kun\u0026apos;s presence has been significant.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf he hadn\u0026apos;t been in the same class, I certainly wouldn\u0026apos;t be who I am now.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI would\u0026apos;ve been more immature and clumsy, and I wouldn\u0026apos;t have been able to close the distance with anyone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThough his inscrutable demeanor sometimes troubles me, that is part of his charm.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnyway, since that day, I truly decided to set my sights on graduating from Class A.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNot just for my brother or for myself\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut to share the joy with everyone in the class, starting with Ayanokouji-kun.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis is what this place, Class A, is about.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA place I could never have reached alone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026#x2014;I must not be complacent.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNow, the path to the summit has only just been cleared.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere is still one more year of school life left.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen-kun\u0026apos;s class is quickly catching up right behind us.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven though they\u0026apos;re a bit far away, I can\u0026apos;t underestimate Ichinose-san\u0026apos;s class or the former Sakayanagi-san\u0026apos;s class either.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey\u0026apos;ll try to overtake us by any means necessary in the future.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eConversely, we must fight to escape and prevent them from catching up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI took a deep breath\u0026#xa0;and turned away from the nameplate.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor now, the celebration ends here.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI decided to tighten my resolve anew.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith that thought in mind, I opened the classroom door.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eInside the classroom. A large monitor, serving as a blackboard, displayed the pre-assigned seats.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;My seat is\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSecond row from the corridor side, fourth from the front.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was my seat on the first day in Class 3-A.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd next to that seat, first row, fourth seat, was Ayanokouji-kun\u0026apos;s name.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;To think I\u0026apos;d be next to him again, huh\u0026#x2026;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlthough our seating arrangement had been quite different, we also sat next to each other two years ago.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eEven if there were to be a seating change soon, I don\u0026apos;t dislike such coincidences.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFeeling a sense of amusement at the overlap in this arrangement, I sat down in my seat. It was still early for school, so Ayanokouji-kun hadn\u0026apos;t shown up yet.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wanted to share my thoughts on this seating with him as soon as possible.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI gazed out at the scenery.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe view looked slightly different from both my first and second years.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOne more year.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn just one more year, my time at this school will come to an end.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eAt that time\u0026#x2014;with this class, with these companions\u0026#x2014;I want to graduate from Class A.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wouldn\u0026apos;t let it end as just a dream.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo matter what, I have to make it happen.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Prologue: The End of Everyday Life\",\"volumeId\":\"y3v1\",\"chapterIndex\":10,\"prevChapter\":\"$undefined\",\"nextChapter\":{\"volumeId\":\"y3v1\",\"chapter\":11,\"title\":\"Chapter 1: Confusion\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 1\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"la
