e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T3a83,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 1\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAFTER THEIR LUNCH break and just before the start of the special exam, Class 3-B, Ryuuen\u0026apos;s class, was enveloped in excessive stress.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMost students spent almost all their time studying until the special exam, solely to score even one more point and avoid Ryuuen\u0026apos;s admonishments.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYet, their only wish was to avoid being selected as part of the five participants. If they were chosen and defeated, no one knew what kind of treatment they\u0026apos;d receive from Ryuuen.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe participants chosen for the small-group battle were usually communicated to the parties involved beforehand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, Ryuuen kept completely silent, not revealing even a single person.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUntil the start of the exam, everyone was a candidate.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the face of such an aggressive approach, everyone felt like they couldn\u0026apos;t afford to hold back.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKatsuragi had a grasp of the entire class\u0026apos;s academic abilities, and he could feel the improvements the class had made in less than two weeks. Of course, individuals like Kaneda, Katsuragi, and Shiina, who weren\u0026#x2019;t worried about any harsh treatment they might\u0026#x2019;ve received, had only one thing in mind: to score as many points as possible for the class, regardless of whether they would participate in the small-group battle. However, their expressions remained grim throughout, understanding that they were far from matching their opponents, Class C.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Now, I\u0026apos;ll announce the names of the five students participating in the small-group battle.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSakagami, their homeroom teacher, was the only person Ryuuen had informed regarding the five names the day before.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;First, \u0026apos;Ishizaki Daichi\u0026apos;; second, \u0026apos;Yabu Nanami\u0026apos;; third, \u0026apos;Ibuki Mio\u0026apos;; fourth, \u0026apos;Kondou Reon\u0026apos;; fifth, \u0026apos;Kinoshita Minori.\u0026apos; These are the five representatives for your small-group battle.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs all the names were announced, the students looked at each other, unable to control their emotions.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven though it was unclear who would be chosen, the combination was utterly chaotic, something that seemed absolutely impossible for Ryuuen to choose.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe participants had several students who were among the lowest in terms of academic ability in their class, those who lacked motivation and weren\u0026#x2019;t good at studying. Particularly, Ibuki, who\u0026#x2019;d managed to keep up with her studies until the beginning of her second year, had gradually fallen behind, and now her academic abilities had declined to the point where she was even on par with Ishizaki. Such was the selection. Moreover, among those that should\u0026apos;ve been prioritized as participants, not a single name was listed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePulling out his chair, Tokitou reflected on all of the hard work he had gone through during these past two weeks and directed his irritation toward Ryuuen.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What is this ridiculous lineup, Ryuuen? Have you given up on the small-group battle?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe full-class battle was already nearly hopeless.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe only way to overturn that result was to miraculously win four times in the small-group battle.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEveryone in the class faintly harbored that miracle in their hearts.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut Ryuuen answered without a hint of hesitation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah, I\u0026apos;ve given up. No matter how much we strategize, this isn\u0026apos;t a match we can win from the start. You dissatisfied?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Dissatisfied? Very much so. Sure, I never thought we could win this special exam by playing it straight. And if we\u0026#x2019;d been splashing Private Points around to buy penalty points, I would\u0026#x2019;ve been dissatisfied with that too. That being said, there was no need to give up before we even started. What do you think we were studying so desperately for?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;For what? For your own damn sake.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t mess with me!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen and Tokitou quarreling had become a common sight. Sakagami, ignoring their conversation, took off his glasses and began to carefully wipe the lenses.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hah! Then let me ask you this\u0026#x2014;you think we could have a chance at winning this if we played it straight?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s a possibility. Not all of them are smart. Maybe they\u0026apos;re using people who can only score around sixty points because they\u0026apos;re afraid of us hitting them with penalty points. In that case, if we put Kaneda or Katsuragi against them, we might have a chance of winning\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What you\u0026apos;re saying is way too far from reality to even call it a child\u0026apos;s fantasy.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s\u0026#x2026; but still, there was no reason to give up from the start!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No reason? No, there is a reason. Sakagami, are there any among the five I nominated who\u0026#x2019;ve been given penalty points?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;None. Zero.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen smirked wickedly upon hearing that report, convinced that he had chosen the right strategy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So what? There\u0026apos;s no point in making Ishizaki and the others participate.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Not really. The opponents couldn\u0026#x2019;t see through any of the five people I nominated. That means they couldn\u0026#x2019;t read my thoughts at all.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOn the day he met Ayanokouji, he held a strategy meeting in the karaoke room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen called Katsuragi back at the end and withdrew all the strategies he\u0026#x2019;d previously conveyed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the past, he would\u0026#x2019;ve forcefully jumped into the fray and focused all his efforts on defeating Ayanokouji.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen, he would\u0026#x2019;ve been outsmarted by Ayanokouji\u0026apos;s superior strategies, likely getting hit by a counterattack.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe paused, realizing how important it was to observe the situation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOn top of a special exam that was purely disadvantageous for his class, at the moment, there was no method he could take to combat Ayanokouji,\u0026#xa0;and mindlessly stepping on the accelerator would be nothing but recklessness.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was crucial that he calmly applied the brakes and took control of the situation according to the circumstances.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn other words, it was a new way of fighting that Ayanokouji wouldn\u0026apos;t have been able to anticipate.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe opponent would assume that Ryuuen would always act with victory in mind. Depending on the situation, they\u0026apos;d think he might even invest the Private Points he had accumulated to attack. Ayanokouji had to think seriously to win. However, what awaited him at the end of his desperate thoughts was only the fact that no one could see through it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith him unable to see through Ryuuen\u0026apos;s strategy to retreat rather than fight, Ayanokouji showed himself looking foolish, struggling to identify who Ryuuen had chosen as participants.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a miss. All five were completely off the mark. That was the reality.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ryuuen, it seems you\u0026apos;ve managed to outsmart the opponent first. They must be surprised.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Kukuku, it just shows that he\u0026apos;s not omnipotent after all.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs if to say everything had gone as planned, Ryuuen\u0026apos;s attitude had upset Tokitou once more.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even if you manage to embarrass that guy by outsmarting his strategy like this, it\u0026apos;s still going to be all okay for them in the end, right? They\u0026apos;re most likely just going to be grateful that we\u0026apos;re going at them with a lineup made up of these idiots.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Everyone except Ayanokouji, that is.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Seems like he\u0026apos;s become the talk of the town with his unreasonable transfer, but what about Ayanokouji? Does he think he can replace Sakayanagi as their leader?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTokitou spoke, unaware of the details, and Katsuragi replied in response.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;At least Ryuuen thinks so. I think so too. However, there\u0026apos;s no point in discussing it here, so I\u0026apos;ll omit it, but Ayanokouji is currently being questioned for his qualifications to become their leader. Whether Ayanokouji can read Ryuuen\u0026apos;s thoughts is now a crucial element that will weigh heavily in the future.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Were you trying to make Ayanokouji misread?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s right.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even if that\u0026apos;s effective in the future, this is just too much. We might end up losing seven straight matches and losing class points.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That won\u0026apos;t happen.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen laughed and denied the possibility, but Tokitou couldn\u0026apos;t understand and clicked his tongue.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We\u0026apos;ll probably be defeated in the full-class battle, and our selection for the small-group battle is just terrible. We\u0026apos;re definitely getting a complete defeat\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No? I\u0026apos;ve read Ayanokouji\u0026apos;s thoughts. If I\u0026apos;m right, that idiot\u0026apos;s even participating in the small-group battle, isn\u0026apos;t he?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Correct. The five participants on the other side are \u0026apos;Ayanokouji Kiyotaka\u0026apos; as their first, \u0026apos;Shimazaki Ikkei\u0026apos; as their second, \u0026apos;Fukuyama Shinobu\u0026apos; as their third, \u0026apos;Sanada Kousei\u0026apos; as their fourth, and \u0026apos;Sawada Yasumi\u0026apos; as their fifth. And\u0026#x2026; the penalty points you specified are being applied as planned to Ayanokouji Kiyotaka, all one hundred of them. This means that no matter how many points he gets, he would score a zero. They wouldn\u0026apos;t be able to score a complete victory unless Ishizaki-kun scores a zero.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What\u0026#x2026;? All one hundred penalty points applied to Ayanokouji\u0026#x2026;!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I told you, I\u0026apos;ve read his thoughts.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven Ishizaki, who wasn\u0026apos;t great academically, wouldn\u0026apos;t score zero unless he left his paper blank.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, Ishizaki would never do such a thing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis meant that no matter how much they lost at that point, one victory was 100% guaranteed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Can I really win against Ayanokouji!? Seriously, that\u0026apos;s great!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eLooking at the result alone, with one win and six losses, they were likely to lose, but that one win became invaluable.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I was confused when I heard the plan, but this must be the optimal solution while avoiding risks. The opponent\u0026apos;s lineup is straightforward, only containing academically gifted students. I don\u0026apos;t know who among us was chosen for their penalty points, but it\u0026apos;s safe to assume it was mostly our top students. So, it was indeed a losing battle.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf students with similar abilities were to clash, depending on the combinations and developments, Class B might\u0026apos;ve been able to snatch one or two victories, but considering the two defeats in the full-class battle, their odds of winning remained low.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTokitou also had no choice but to swallow his frustration upon seeing the members the opponent had put forward.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll at least let them taste the sweet victory wine. But Ayanokouji\u0026apos;s considerations have been completely wasted. Knowing him, I wouldn\u0026apos;t be surprised if he had boldly announced his predictions before the exam.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo take command in Class C, such feats were required.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;As it turns out, you\u0026apos;ve made a complete fool of him.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This will make it difficult for Class C to easily accept Ayanokouji.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if Ayanokouji were to become the leader eventually, delaying it was crucial.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo eventually defeat Ayanokouji on a perfect stage, Ryuuen wanted to show him that he could learn to change and fight flexibly, and the results that came of it. This development was all ideal for Ryuuen.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 1\",\"volumeId\":\"y3v1\",\"chapterIndex\":33,\"prevChapter\":{\"volumeId\":\"y3v1\",\"chapter\":32,\"title\":\"Chapter 7: Ayanokouji's Defeat\"},\"nextChapter\":{\"volumeId\":\"y3v1\",\"chapter\":34,\"title\":\"Part 2\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 1\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: The End of Everyday Life\",\"href\":\"prologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Confusion\",\"href\":\"chapter-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"chapter-1-part-1.xhtml\",\"index\":12},{\"label\":\"Chapter 2: Confirmation\",\"href\":\"chapter-2.xhtml\",\"index\":13},{\"label\":\"Part 1\",\"href\":\"chapter-2-part-1.xhtml\",\"index\":14},{\"label\":\"Chapter 3: The Commencement of a One-Year Period\",\"href\":\"chapter-3.xhtml\",\"index\":15},{\"label\":\"Part 1\",\"href\":\"chapter-3-part-1.xhtm
