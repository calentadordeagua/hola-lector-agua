apos;t because I didn\u0026apos;t want to attract attention, and it wasn\u0026apos;t just a whim either.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFirst, I needed to understand Class C in detail. That meant getting to know its internal situation, not just through OAA evaluations, but also by observing and listening to the students directly, finding more in-depth information.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor that, I had to move actively, not just sit and wait.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIn the morning, who arrives at school the earliest and who arrives the latest?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eTalkative students, quiet students, those who can read the room, and those who can\u0026apos;t.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eObserving such behaviors was the first step in getting to know them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI arrived at Class 3-C and slowly opened the door to the classroom, which I expected to be empty.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever\u0026#x2026;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI suddenly encountered a situation that spoiled my start.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI thought I was the first to arrive at the classroom, but I wasn\u0026apos;t the first one there after all.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNext to my seat, a female student was using her tablet.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen the door opened, she turned around with a slightly startled look.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI hadn\u0026apos;t intended to open the door so loudly, but perhaps she hadn\u0026apos;t expected another student to arrive so early.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, her expression quickly softened.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Good morning.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter a pause, I greeted the person I was seated next to, Shiraishi, who\u0026#x2019;d arrived first.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Good morning to you, too.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe replied politely.\u003c/p\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cstrong\u003eOAA: Shiraishi Asuka\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eAcademic Ability B+ (76)\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003ePhysical Ability D (34)\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eAdaptability C+ (57)\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eSocial Contribution C\u0026#x2013; (44)\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eOverall Ability C (54)\u003c/em\u003e\u003c/p\u003e\u003c/div\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi had above-average academic ability, but her physical ability was low, and she wasn\u0026apos;t the type to actively socialize with others, and she also wasn\u0026apos;t known for getting particularly friendly with other classes. This was the limited information I knew about Shiraishi from the past two years using the OAA.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom here, I began to memorize her appearance and characteristics anew.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFirstly, the beauty mark under her left eye, her beautiful long blonde hair, and her headband were noticeable. She had a calm aura, giving her the impression of a quiet student who wasn\u0026apos;t one to cause a commotion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn fact, during the past two years, from the brief encounters I had with her, I never felt that Shiraishi had a flashy personality. Although it was somewhat different from what I\u0026#x2019;d planned, this could still be the result I sought.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t know when the seat changes would take place, but it was unlikely to be anytime soon.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf so, befriending a desk neighbor was the classic approach to school life.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was just like how it started with a conversation with Horikita two years ago. I would walk the same path now, based on my past two years\u0026apos; experience. The question was how to start the conversation\u0026#x2026;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t know anything about Shiraishi\u0026apos;s personality, hobbies, or preferences from the data I had.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSo, I needed to feel my way through from scratch.\u0026#xa0;As I approached my seat, I realized that Shiraishi had been studying in the classroom this morning, holding a pen and working on something akin to an assignment on her tablet. I waited a moment before speaking.\u003c/p\u003e\u003cimg src=\"/hola-lector-agua/images/books/y3v1/OEBPS/ETHIExUKkoPUcpCsLkpXt.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cimg src=\"/hola-lector-agua/images/books/y3v1/OEBPS/AwttkFGqRbOyGNrvzEafW.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cp class=\"paragraph after-image\" style=\"text-align: left\"\u003eWe\u0026#x2019;d passed each other several times over the past two years, but this was the first time I tried to initiate a conversation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I didn\u0026apos;t expect someone to be here already. You\u0026apos;re rather early.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;Yes, I woke up unusually early today. But you\u0026apos;re early too, Ayanokouji-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor now, a polite response followed our greetings.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe hesitated a bit with her words, perhaps because she wasn\u0026apos;t used to me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOr maybe she didn\u0026apos;t want to talk, but given the situation with just the two of us here, she reluctantly replied.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI still couldn\u0026apos;t read that much into it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Since I\u0026apos;ve switched classes, it\u0026apos;s like I\u0026apos;m a transfer student from a different school. Rather than being welcomed, I thought it\u0026apos;d be better to be the one doing the welcoming.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI decided to mix in some truths, planning to keep talking to Shiraishi until she blatantly showed disinterest.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRemaining silent in a classroom with just the two of us could be a problem.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s an interesting coincidence\u0026#x2014;two people who are early risers sitting next to each other in such a large, empty classroom.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Maybe.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA coincidence. An unintended, slightly amusing overlap.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt least, Shiraishi didn\u0026apos;t seem to be uncomfortable.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eNow, how should I continue the conversation?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen it came\u0026#xa0;to such situations\u0026#x2026; I found it harder to speak than I thought.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eVarious ideas came to mind, but I wasn\u0026apos;t confident whether it was really okay to break the ice with them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf it were Hirata Yousuke in this situation, he\u0026apos;d develop the conversation smoothly without making the other person wait, and he\u0026apos;d do so naturally without even planning it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why did you decide to transfer to this class, Ayanokouji-kun?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn my hesitation, Shiraishi posed a very natural question.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe continued, expressing her desire to know more.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I can\u0026apos;t believe you\u0026apos;d choose to drop to a lower class after finally making it to Class A.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That might be true under normal circumstances.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If it\u0026apos;s not normal, then\u0026#x2026; why\u0026#xa0;did you decide to transfer?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs she asked that question, Shiraishi\u0026apos;s eyes were direct and beautifully colored.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe seemed very keen on knowing the true reason.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hashimoto and the others should\u0026apos;ve explained it to you. I came to this class as reinforcement.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course, I understand that. But that\u0026apos;s to save us. No one has explained how this would benefit you, Ayanokouji-kun. I\u0026apos;ve heard rumors that you received a large number of Private Points behind the scenes or that you\u0026apos;ll receive them in the future.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi asked this difficult question without a hint of hesitation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps the empty environment influenced her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe answer to her question was simple.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eTo bring balance to the four classes\u003c/em\u003e.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor that, it was necessary to elevate Class C and Class D to catch up to the higher ranks.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo execute what would be impossible as an outsider, from within.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, since the alliance talks hadn\u0026apos;t been brought to light, that wasn\u0026apos;t something I wanted to disclose yet.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;To put it bluntly, except for a few people, we\u0026apos;re still skeptical about what kind of impact you can have on the class, and whether you can turn the situation around if you do have an impact.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s only natural.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The discussion about whether you\u0026apos;re necessary has also begun, Ayanokouji-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s too late to start now. Couldn\u0026apos;t you have opposed and refused\u0026#xa0;my transfer?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s a harsh opinion. The class was in chaos over Sakayanagi-san\u0026apos;s expulsion during spring break.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOne of the conditions for my transfer was receiving the entirety of Class C\u0026apos;s consent.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith Sakayanagi gone and the class weakened both in terms of power and morale, the class was desperate for a quick recovery plan. Regardless of whether \u003cem\u003eAyanokouji Kiyotaka\u003c/em\u003e\u0026#xa0;was capable or not, the proposal to pull someone from Class A and supplement the numbers wasn\u0026apos;t a bad one. Hashimoto paid most of it, but the individual expenses weren\u0026apos;t cheap.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was natural to expect a performance that was worth the price.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Indeed, only a few students would willingly drop from Class A to C.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I thought it was similar to Katsuragi-kun\u0026apos;s case, but he lost his place in this class. He probably also wanted revenge against Sakayanagi-san.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then you aren\u0026apos;t considering the possibility that I had a conflict with Class A?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eInstead of giving the expected answer, I decided to throw a question in return.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t think that\u0026apos;s the case. Class A was relying on you, and I figured that you blended in well.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt may have appeared to be a string of mere flattery, but it was a fine line that also seemed to reflect her sincerity.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo, it would be better to take it as her being sincere and proceed with the conversation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t remember showing such an attitude to other classes.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;From the outside, you can see quite a lot. Plus, in the special exams at the end of our first and second years, you were entrusted with important roles. That wouldn\u0026apos;t be possible without the class having both trust and confidence in you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see. So, Shiraishi, how do you perceive my transfer?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;As I just mentioned, I have a high regard for you, Ayanokouji-kun, so I honestly have high expectations. Besides, Hashimoto-kun and Morishita-san, the students who worked hard for your transfer, seem to regard you even more highly than I do\u0026#x2026; and\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi\u0026apos;s words, which carried implications, were interrupted by a male student who arrived in class right after.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;H-Hey, Shiraishi. Good morning.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Good morning, Yoshida-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlthough their seats were spread apart, Yoshida called out to Shiraishi as soon as he entered the classroom.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen, after giving me a sharp look, he put his bag on his desk and approached us.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What\u0026apos;s up, Ayanokouji? You\u0026apos;re quite early this morning, huh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Not really. I intended to be the first one here, but Shiraishi arrived earlier.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In that case, come as soon as the gates open starting tomorrow. Being the first to arrive at school is one way to set an example. Continue until everyone in the class acknowledges you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe school allowed entry at 7:15 in the morning\u0026#x2014;quite early.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eThat\u0026apos;s quite a harsh suggestion, but it might actually be a good idea to do that for a while.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Isn\u0026apos;t that a bit much?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRight when I was about to agree with him, Shiraishi gently responded to Yoshida.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That said, what exactly do you mean by everyone acknowledging him?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, um, I hadn\u0026apos;t thought that far\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eConfused by the unexpected counterattack, Yoshida couldn\u0026apos;t hide his bewilderment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In that case, if you felt like it, Yoshida-kun, couldn\u0026apos;t you alone just continue refusing to acknowledge him, so it would never end up being the entire class?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, I wouldn\u0026apos;t do that!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If it\u0026apos;s a misunderstanding, shouldn\u0026apos;t you retract your previous claim first?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Okay, I understand. I\u0026apos;ll retract what I just said, so forget it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFlustered, Yoshida strained his voice as he spoke with Shiraishi.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m glad. I thought you\u0026apos;d understand.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well\u0026#x2026; maybe I did say a bit too much.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s right. Yoshida, you\u0026apos;re popular in the class, so why don\u0026apos;t you help Ayanokouji-kun get along with our other classmates?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? Eh? Me, help Ayanokouji?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Isn\u0026apos;t that okay?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not okay, don\u0026apos;t make light of me!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYoshida was popular\u0026#xa0;in the class. I noted those words in my mind, but whether they were true or just flattery was unclear at the moment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is that so? Then, if I may be so bold, may I volunteer? I might not be able to connect with the boys, but I think I can with the girls. Some time soon, perhaps during a day off, I\u0026apos;ll introduce you to some friends, so could you join us?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eAs the saying goes, the early bird catches the worm\u0026#x2014;that might just be true\u003c/em\u003e.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed there was no reason to refuse Shiraishi\u0026apos;s offer.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll take you up on that offer.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Wait a minute! I guess I have no choice but to help you out too.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDespite saying that he didn\u0026apos;t want to be made light of earlier, Yoshida retracted his previous statement as he leaned forward.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is that okay, Yoshida-kun?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, I did feel a bit bad for refusing the welcome party. It must\u0026apos;ve taken a lot of courage to transfer to a class that was an enemy until recently. Since it is a new class, you need some support, right? So, when should we do it? I\u0026apos;m free anytime.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYoshida asked while directing a smile at me, or rather, towards Shiraishi.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Alright. I\u0026apos;ll contact you when it\u0026apos;s decided.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Okay! Don\u0026apos;t get sick until then, Ayanokouji.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOverwhelmed by the intense energy, I simply nodded for now.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSoon after, Class C students began to appear in the classroom one after another, and Yoshida hurried back to his seat.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yoshida-kun\u0026apos;s quite simple, isn\u0026apos;t he?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi muttered, briefly glancing at Yoshida.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen, she turned back to me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;He likes me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So it seems.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was clear that he had some affection for her, but it was rare for the recipient to state it with such certainty.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s why he couldn\u0026apos;t stand me going out with other boys on days off, or maybe he was hoping for some progress with me. Even if the day comes when Yoshida-kun and I are the only humans left on Earth, I still wouldn\u0026apos;t choose him.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe was aware of her attractiveness to the opposite sex, but she didn\u0026apos;t seem to enjoy it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIs it simply because she isn\u0026apos;t interested in someone she doesn\u0026apos;t like, or is it taken for granted?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Next time, please be sure to tell me the reason why you transferred.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi smiled as she looked away, signaling that she hadn\u0026apos;t forgotten.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eA kind neighbor\u003c/em\u003e\u0026#x2014;but maybe that wasn\u0026apos;t all there was to my analysis regarding Shiraishi.\u003c/p\u003e\u003chr class=\"footnote-rule\"/\u003e\u003col class=\"footnotes\"\u003e\u003cli data-id=\"da6c9769-f9dd-5f28-8805-b1e25f56cf17\" data-ref=\"1\" class=\"footnote first-footnote\" id=\"fn-1-da6c9769-f9dd-5f28-8805-b1e25f56cf17\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003ca class=\"footnote-backref\" href=\"#fnref-1-da6c9769-f9dd-5f28-8805-b1e25f56cf17\"\u003e[1]: \u003c/a\u003eThe title, \u0026quot;\u0026#x508d;\u0026#x76ee;\u0026#x516b;\u0026#x76ee;,\u0026quot; is a Japanese saying that means \u0026quot;outsiders have a better grasp of the situation than the people involved.\u0026quot;\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 4: An Onlooker's Perspective \",\"volumeId\":\"y3v1\",\"chapterIndex\":21,\"prevChapter\":{\"volumeId\":\"y3v1\",\"chapter\":20,\"title\":\"Part 5\"},\"nextChapter\":{\"volumeId\":\"y3v1\",\"chapter\":22,\"title\":\"Part 1\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 1\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: The End of Everyday Life\",\"href\":\"prologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Confusion\",\"href\":\"chapter-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"chapter-1-part-1.xhtml\",\"index\":12},{\"label\":\"Chapter 2: Confirmation\",\"href\":\"chapter-2.xhtml\",\"index\":13},{\"label\":\"Part 1\",\"href\":\"chapter-2-part-1.xhtml\",\"index\":14},{\"label\":\"Chapter 3: The Commencement of a One-Year Period\",\"href\":\"chapter-3.xhtml\",\"index\":15},{\"label\":\"Part 1\",\"href\":\"chapter-3-part-1.xhtml\",\"index\":16},{\"label\":\"Part 2\",\"href\":\"chapter-3-part-2.xhtml\",\"index\":17},{\"label\":\"Part 3\",\"href\":\"chapter-3-part-3.xhtml\",\"index\":18},{\"label\":\"Part 4\",\"href\":\"chapter-3-part-4.xhtml\",\"index\":19},{\"label\":\"Part 5\",\"href\":\"chapte
