ost students would use this downtime to spend their time as regular students, also using it to recharge.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, each day was indeed passing by, and the remaining time continued to decrease.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor third-year students, career choices were always a concern.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t that \u0026apos;it was only just April\u0026apos;, rather, \u0026apos;it was already April\u0026apos;; for a class that was catching up, there was no time for rest.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTherefore, it was necessary to make all possible preparations now.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was just like preparing emergency food and disaster supplies for a catastrophe.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf things could get done without using them, all the better.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt dusk, Kushida, a student from Class A whom I had called out, was quietly waiting alone for me while leaning on the railing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why did you choose this place to meet?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I approached, having asked the question, Kushida answered without turning around.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;When we first entered school, you saw quite a lot of things you shouldn\u0026apos;t have, Ayanokouji-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThough she evaded the question, I didn\u0026apos;t pursue it further and let it go.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That did happen.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKushida, who\u0026#x2019;d unexpectedly reunited with Horikita from the same middle school, had been under excessive stress, which she kept bottled up. Her classmates, who were under the belief that she was more gentle-natured, must\u0026apos;ve been truly surprised to see her true nature.\u003c/p\u003e\u003cimg src=\"/hola-lector-agua/images/books/y3v1/OEBPS/LmEktIMwAPcTaInNRcfSk.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cimg src=\"/hola-lector-agua/images/books/y3v1/OEBPS/MjgjnUfBuIzgXLJWbpQos.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cp class=\"paragraph after-image\" style=\"text-align: left\"\u003eBack then, Kushida had shown she was willing to use her own body in a moment of desperation to keep me silent.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIt was only two years ago, but strangely, it feels like it\u0026apos;s been a long time.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It was something like an accident, but I was really anxious when you threatened me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Really? You\u0026apos;ve been thinking about setting me up since then, haven\u0026apos;t you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I have no such intentions. Really.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven though I answered, Kushida, who sent me a brief glance, didn\u0026apos;t seem to believe me at all.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I first entered school, there was still so much I didn\u0026apos;t know.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe peers\u0026apos; circumstances were among the most significant.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the White Room, people my age were dropping out and disappearing one after another.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI\u0026#x2019;d been alone in that environment for a long time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBefore entering school, I\u0026#x2019;d never once gotten close to a girl my age after leaving the White Room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo\u0026#x2026;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust once before entering school, I met a girl who dropped out of the White Room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps my brain deemed it unnecessary, as I had almost completely forgotten about that girl.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOccasionally, I would remember a past that wasn\u0026apos;t necessary, like a glimpse of my childhood.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWhat was that girl\u0026apos;s name?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWhat kind of conversation did we have?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eOr maybe we didn\u0026apos;t talk at all.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI couldn\u0026apos;t remember 99% of it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt might\u0026#x2019;ve been a side effect of dedicating all my brain\u0026apos;s resources to learning.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf I hadn\u0026apos;t left the White Room, I wouldn\u0026apos;t have directed my attention to such things.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps because I learned about various human patterns at this school, I became slightly interested in my past.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wondered how that girl and the others were doing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSome, like Yagami, might\u0026apos;ve been undergoing re-education.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why did you ask me to come?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps because I\u0026#x2019;d been reminiscing and remained silent, Kushida prompted me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I was just wondering how the class is doing. I\u0026apos;m a bit worried.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Really? If you were that interested, you wouldn\u0026apos;t have transferred.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;True.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The actual topic is something else, isn\u0026apos;t it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter I lined up beside her, I decided to bring up the reason why I called her here to the perceptive Kushida.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;To close the gap we have with Class A, it would be easier to have an insider from now on.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What? Are you seriously asking me to betray my class?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s exactly it. If you deliver results, I\u0026apos;ll pay you in private points.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I acknowledged it, Kushida seemed to have worn a faint smile.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Because of our previous Private Point transaction, I ended up in trouble. Do you think I would cooperate with you again now that you\u0026apos;ve become an enemy?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKushida, without turning to face me the entire time, expressed her refusal.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re free not to cooperate, but in that case, I can\u0026apos;t guarantee I\u0026apos;ll keep your secrets.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer true nature had already been exposed in Class A.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, it wasn\u0026apos;t widely known among the other classes yet.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Do you think that counts as a threat? Ryuuen-kun knows about it too.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Since it\u0026apos;s Ryuuen, any negative rumor he spreads about you will lack credibility.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if Ryuuen were to spread rumors about Kushida\u0026apos;s malicious nature, she\u0026apos;d be able to deny knowing anything about it. Students from Class A wouldn\u0026apos;t bother helping Ryuuen either.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then isn\u0026apos;t it the same for you, Ayanokouji-kun? You transferred on your own, so there\u0026apos;s no guarantee people would believe anything you expose.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It depends on how it\u0026apos;s done.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;You seem confident?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I won\u0026apos;t deny it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKushida narrowed her eyes, not surprised by my answer as if she had anticipated it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWhat else might be reflected in her eyes as she gazes at the scenery?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You don\u0026apos;t even need my strength to take down Horikita\u0026#x2019;s pathetic class.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It won\u0026apos;t be that easy. Horikita will definitely recover soon.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? You sure think highly of her, don\u0026apos;t you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt might\u0026apos;ve been difficult for Horikita alone, but with the help of her classmates, it\u0026apos;d be a different story.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSooner or later, she would become a significant obstacle for Classes C and D.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Besides, if we need to forcibly expel some people in the future, that would change things.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUpon hearing my words, Kushida looked at me for the first time, trying to ascertain my true intentions.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Expulsions\u0026#x2026; from our class?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see no special reason to exclude anyone.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBased on Kushida\u0026apos;s information, expulsions would occur within Class A.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHearing this, there was only one thing to think.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s, like, really risky. Even if I get a little allowance on the side and drag down the class, it\u0026apos;s meaningless if I can\u0026apos;t graduate from Class A. If it ever comes out that I\u0026apos;m connected to you, I\u0026apos;d completely lose my standing.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then you\u0026apos;ll have to save up enough Private Points to transfer in the remaining year.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;How serious are you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was just superficial skepticism. She wasn\u0026apos;t trying to discern which of my words were actually true.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIs she assuming I was lying from the start, or is there another reason?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eAnd she\u0026apos;s also trying to mask her true intentions, not letting me read them.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe didn\u0026apos;t want me to know where her feelings really stood.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m not asking for an immediate answer. You\u0026apos;re free to tell Horikita or anyone else about this invitation to betrayal. If you\u0026apos;re recording this on your phone, feel free to spread that too. It would strengthen the unity of Horikita\u0026#x2019;s class.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What\u0026apos;s that about? So what do you want, Ayanokouji-kun? You want to bring down Class A, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Unfortunately, I want more than just one thing.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI avoided going into details, and Kushida didn\u0026apos;t seem inclined to pursue it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t really get it, but it seems like you just want things to go your way. You were the only one to score perfectly on the special exam, so I guess there\u0026apos;s no need to hide anything anymore.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s right.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had said enough here for today.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI could ask for Kushida\u0026apos;s response another time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;Did you give advice to Ichinose-san\u0026apos;s class this time? They got three of them right.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Just a little. Considering Horikita\u0026apos;s mental state, Hirata probably took the lead instead. Yukimura might\u0026apos;ve said he could win even with some penalty points, and Wan Mei-Yui would likely follow, trying to meet Hirata\u0026apos;s expectations. You guys wouldn\u0026apos;t use Horikita, who stands out as the class\u0026apos;s leader, to give her a rest. Koenji, who generally takes his studies seriously, presented the class with an opportunity to exploit.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Weren\u0026apos;t you scared of them blaming you if your predictions had failed?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course, it\u0026apos;s all within the realm of predictions, and I can\u0026apos;t guarantee anything as absolute. However, it\u0026apos;s worth the gamble rather than choosing five random people, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBehind her deductions lay not just my own influence, but also information that Ichinose herself gathered directly, like who Hirata called together and how the plan was formed. That couldn\u0026apos;t be overlooked.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was why Ichinose could accept my advice.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis wasn\u0026apos;t a relationship that would\u0026apos;ve worked if one of us had only relied on the other.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy phone vibrated, so I took it out and looked at its screen.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Who\u0026apos;s it from?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hashimoto. He\u0026apos;s inviting me to continue my welcome party at the dorm.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see you\u0026apos;ve been recognized by Class C after achieving results in the special exam.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s right.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hey.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I turned to leave, Kushida spoke to me again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What\u0026apos;s up?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you really going to prepare Private Points for me?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course. I\u0026apos;ll tell you the amount before you do anything. If you\u0026apos;re not satisfied, you can refuse at any time. That being said, it\u0026apos;s not necessary right now. Both my class and I are quite financially strained.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUnfortunately, I couldn\u0026apos;t prepare Kushida a satisfactory amount right away.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Let me think about it a little.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course. There\u0026apos;s no set deadline.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I started walking, it felt like someone behind me was watching, and I turned around.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKushida was holding the handrail and staring at me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I mean\u0026#x2014;albeit reluctantly\u0026#x2014;I do appreciate you, Ayanokouji-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBefore I could reply to her words, Kushida looked away.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s all. I just thought I should tell you that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is that so? Well, see you later.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer words carried meaning, but there was no need to dwell on them now.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was now up to Kushida whether to prioritize her own convenience or the class\u0026#x2019;s.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith that choice, you could say that there was one more thing to look forward to in the future.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 1\",\"volumeId\":\"y3v1\",\"chapterIndex\":39,\"prevChapter\":{\"volumeId\":\"y3v1\",\"chapter\":38,\"title\":\"Chapter 8: Enemies and Allies\"},\"nextChapter\":{\"volumeId\":\"y3v1\",\"chapter\":40,\"title\":\"Epilogue: What Awaits Ahead\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 1\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: The End of Everyday Life\",\"href\":\"prologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Confusion\",\"href\":\"chapter-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"chapter-1-part-1.xhtml\",\"index\":12},{\"label\":\"Chapter 2: Confirmation\",\"href\":\"chapter-2.xhtml\",\"index\":13},{\"label\":\"Part 1\",\"href\":\"chapter-2-part-1.xhtml\",\"index\":14},{\"label\":\"Chapter 3: The Commencement of a One-Year Period\",\"href\":\"chapter-3.xhtml\",\"index\":15},{\"label\":\"Part 1\",\"href\":\"chapter-3-part-1.xhtml\",\"index\":16},{\"label\":\"Part 2\",\"href\":\"chapter-3-part-2.xhtml\",\"index\":17},{\"label\":\"Part 3\",\"href\":\"chapter-3-part-3.xhtml\",\"index\":18},{\"label\":\"Part 4\",\"href\":\"chapter-3-part-4.xhtml\",\"index\":19},{\"label\":\"Part 5\",\"href\":\"chapter-3-part-5.xhtml\",\"index\":20},{\"label\":\"Chapter 4: An Onlooker's Perspective \",\"href\":\"chapter-4.xhtml\",\"index\":21},{\"label\":\"Part 1\",\"href\":\"chapter-4-part-1.xhtml\",\"index\":22},{\"label\":\"Part 2\",\"href\":\"chapter-4-part-2.xhtml\",\"index\":23},{\"label\":\"Chapter 5: Convolution\",\"href\":\"chapter-5.xhtml\",\"index\":24},{\"label\":\"Part 1\",\"href\":\"chapter-5-part-1.xhtml\",\"index\":25},{\"label\":\"Part 2\",\"href\":\"chapter-5-part-2.xhtml\",\"index\":26},{\"label\":\"Part 3\",\"href\":\"chapter-5-part-3.xhtml\",\"index\":27},{\"label\":\"Part 4\",\"href\":\"chapter-5-part-4.xhtml\",\"index\":28},{\"label\":\"Part 5\",\"href\":\"chapter-5-part-5.xhtml\",\"index\":29},{\"label\":\"Chapter 6: School Life in Class C\",\"href\":\"chapter-6.xhtml\",\"index\":30},{\"label\":\"Part 1\",\"href\":\"chapter-6-part-1.xhtml\",\"index\":31},{\"label\":\"Chapter 7: Ayanokouji's Defeat\",\"href\":\"chapter-7.xhtml\",\"index\":32},{\"label\":\"Part 1\",\"href\":\"chapter-7-part-1.xhtml\",\"index\":33},{\"label\":\"Part 2\",\"href\":\"chapter-7-part-2.xhtml\",\"index\":34},{\"label\":\"Part 3\",\"href\":\"chapter-7-part-3.xhtml\",\"index\":35},{\"label\":\"Part 4\",\"href\":\"chapter-7-part-4.xhtml\",\"index\":36},{\"label\":\"Part 5\",\"href\":\"chapter-7-part-5.xhtml\",\"index\":37},{\"label\":\"Chapter 8: Enemies and Allies\",\"href\":\"chapter-8.xhtml\",\"index\":38},{\"label\":\"Part 1\",\"href\":\"chapter-8-part-1.xhtml\",\"index\":39},{\"label\":\"Epilogue: What Awaits Ahead\",\"href\":\"epilogue.xhtml\",\"index\":40},{\"label\":\"Part 1\",\"href\":\"epilogue-part-1.xhtml\",\"index\":41},{\"label\":\"Part 2\",\"href\":\"epilogue-part-2.xhtml\",\"index\":42},{\"label\":\"Author's Afterword\",\" ",\"content\":\"summary_large_image\"}],[\"$\",\"meta\",\"13\",{\"name\":\"twitter:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"14\",{\"name\":\"twitter:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"15\",{\"name\":\"twitter:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"link\",\"16\",{\"rel\":\"icon\",\"href\":\"/hola-lector-agua/icon.svg?icon.ae5abf30.svg\",\"sizes\":\"any\",\"type\":\"image/svg+xml\"}],[\"$\",\"$L14\",\"17\",{}]]\n"])</script></body></html>
