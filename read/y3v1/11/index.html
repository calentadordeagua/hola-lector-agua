e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T230f,"])</script><script>self.__next_f.push([1,"\u003ch1 class=\"heading_1\"\u003e\u003ca class=\"heading-link\" href=\"/read/y3v1/2\"\u003eChapter 1:\u003cbr/\u003eConfusion\u003c/a\u003e\u003c/h1\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAFTER THE END of the opening ceremony in the gymnasium, the new third-year students returned to the classroom.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA few minutes later, the bell for the second period was about to ring.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;It\u0026apos;s strange.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHorikita tilted her head, looking down the hallway several times.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What\u0026apos;s up? You worried about something?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSudou, who had taken the seat diagonally behind her, asked with a hint of concern.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I haven\u0026#x2019;t seen Ayanokouji-kun since the opening ceremony ended. It\u0026#x2019;s already time for class, and he\u0026#x2019;s still not here.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust like usual, everyone was present in the classroom\u0026#x2014;except Ayanokouji.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven though there were no classes after this today, this was a time when his presence was mandatory. The school would check for unexcused tardies. Horikita understood from past experiences that a single absence wouldn\u0026apos;t result in a significant deduction of class points, but it was the first day for Class 3-A. And unlike Sudou and Ike who had histories of being late, an absence from Ayanokouji, who preferred not to stand out, was troubling.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Come to think of it, yeah. Though, I\u0026apos;m pretty sure he looked normal when we left the gym?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSudou muttered, glancing up as he recalled the memory that occurred less than thirty minutes ago.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHorikita had exchanged a few words with Ayanokouji that morning when they became desk\u0026#xa0;neighbors, and nothing unusual had happened then.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Maybe he\u0026apos;s got a stomachache and is holed up in the bathroom?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, it\u0026apos;s not impossible.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDespite feeling a bit uncomfortable with the indelicate suggestion, it was still a plausible explanation to consider.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eStill, something didn\u0026apos;t sit right with her, and Sudou, as if remembering something, crossed his arms and gave a deep nod.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Maybe he\u0026apos;s pretending to be sick.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter speaking, Sudou let out a wry smile, imagining something unexpected.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Feigning sickness? Why would you think that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen Horikita questioned him about his unexpected reasoning, Sudou lowered his voice by about two notches and started whispering.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;He and Karuizawa recently broke up, right? It must be pretty awkward to face each other.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s no reason to feign sickness\u0026#x2014;and he was normal this morning.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Maybe when he actually came to school, it hit him like a body blow\u003csup id=\"fnref-1-b6ad045c-3a8a-59c5-b2e4-d114127d5319\"\u003e\u003ca class=\"footnote-ref\" href=\"#fn-1-b6ad045c-3a8a-59c5-b2e4-d114127d5319\" data-ref=\"1\" epub:type=\"noteref\"\u003e[1]\u003c/a\u003e\u003c/sup\u003e? For me too, you know, when I experienced heartbreak, it really took a toll on me mentally.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe looked into Horikita\u0026apos;s eyes, but then, feeling somewhat embarrassed, he averted his gaze.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSudou, who had confessed to Horikita during last year\u0026apos;s school trip, was speaking from personal experience. Horikita also thought back to Sudou\u0026apos;s feelings at that time. Indeed, there was a certain awkwardness.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;Is that how it is?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlthough she didn\u0026apos;t consider herself superior in matters of love, the unavoidable reality was that there were people who dumped others and those who got dumped themselves.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor Horikita, who still lacked knowledge and experience in love, it was somewhat difficult to comprehend.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSudou, seeing Horikita\u0026apos;s complex expression, hurriedly scratched his head.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hey, I\u0026apos;m fine now. But, you know, Ayanokouji might also have a surprisingly delicate side to him. Being in a relationship with someone from within the same class and then breaking up with them can be quite troublesome, you know? Look, even Karuizawa seemed\u0026#xa0;to be blatantly avoiding Ayanokouji since this morning.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBefore spring break and up till the end of the third term, Horikita recalled the two having a closeness that only intimate lovers could have, a sense of distance that made it difficult for a third party to approach.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, this morning in the classroom, neither of them took even a single step to close the distance between each other.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t just physically, but emotionally as well.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe reconsidered, realizing that it might indeed be true that human relationships became somewhat complicated when romance was involved.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I understand what you\u0026apos;re saying, but weren\u0026apos;t both of them prepared for that when they started dating?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe had no intention whatsoever of meddling in the affairs between girls and guys, but as a matter of fact, not everyone could part amicably. She muttered that they must\u0026apos;ve been aware of the risks.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s not true. No one starts dating with the assumption that they\u0026apos;ll break up, right? I hear stories from my kouhai\u0026#xa0;about how they started dating, leading up to their breakup. Now, they\u0026apos;re struggling because they can\u0026apos;t figure out the right distance to keep between them, you know?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHorikita, trying not to be noticed, stole glances at Karuizawa, who was sitting in a seat near the back by the window. With a somewhat listless appearance, she was gazing out the window.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;d hope for them to manage at least this little\u0026#xa0;bit of risk\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if that were true, it was a separate issue. Being uncomfortable and thus absent or late was not something to condone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But\u0026#x2026; still, I don\u0026apos;t think there\u0026apos;s a very high likelihood either way.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhether it was stomach pain or the shock of being dumped, \u003cem\u003eAyanokouji\u0026apos;s demeanor remained the same as usual\u003c/em\u003e, she once again concluded.\u0026#xa0;While it was entirely possible that he simply had a poker face and was skillfully hiding behind it, she could hardly imagine him being the type of person to do such a thing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, it\u0026apos;s just a possibility. Cut him some slack if he\u0026apos;s a bit late.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Once is okay. But if it happens repeatedly, as a class, we can\u0026apos;t just ignore it. Alright. Whatever the case, we\u0026apos;ll understand when the time comes.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHorikita decided that, no matter the truth, it was unlikely for Ayanokouji to disappear from school without notice.\u003c/p\u003e\u003chr class=\"footnote-rule\"/\u003e\u003col class=\"footnotes\"\u003e\u003cli data-id=\"b6ad045c-3a8a-59c5-b2e4-d114127d5319\" data-ref=\"1\" class=\"footnote first-footnote\" id=\"fn-1-b6ad045c-3a8a-59c5-b2e4-d114127d5319\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003ca class=\"footnote-backref\" href=\"#fnref-1-b6ad045c-3a8a-59c5-b2e4-d114127d5319\"\u003e[1]: \u003c/a\u003eIn this context, a \u0026quot;body blow,\u0026quot; also known as a \u0026quot;body shot,\u0026quot; refers to the boxing term when punching an opponent in the torso.\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 1: Confusion\",\"volumeId\":\"y3v1\",\"chapterIndex\":11,\"prevChapter\":{\"volumeId\":\"y3v1\",\"chapter\":10,\"title\":\"Prologue: The End of Everyday Life\"},\"nextChapt
