;Would you mind changing the location a bit? It seems like people might gather here.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m fine with it as long as you don\u0026#x2019;t mind. Shall we go to my room, Yousuke?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Outside might be better.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo accommodate his wish, Yousuke and I left the lobby and tried to move away from the dorm.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, being alone with just Hirata wasn\u0026apos;t so easy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was evening, and everyone was returning home. It was inevitable that we ran into several students from Horikita\u0026#x2019;s class.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hirata\u0026#x2026; Ayanokouji.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTaken aback, Sudou muttered our names.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBeside him were Ike and, in an unusual combination, Keisei and Akito.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I just met Suzune and heard a bit of the situation... Rather than transferring to Class C for some strategy, you seriously did it on your own free will?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was unclear whether Horikita had yet to return to the dorm or had already gone back earlier.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah. Sorry.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why did you do it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSudou, showing a pained expression, tried to approach me when Yousuke intervened.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sudou-kun. If we keep talking here, more and more people will gather.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s\u0026#x2026; right, sorry.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you have something to say, I\u0026apos;m willing to listen. Let\u0026apos;s change the location for now.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI agreed with Yousuke and responded to Sudou. Afterward, we ended up going around to the back of the dormitory.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNot only Sudou, but the other three also followed without a hint of hesitation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSoon after moving to a blind spot from the dormitory entrance, Sudou, unable to hold back any longer, spoke up again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why the hell did you do that, Ayanokouji? Why did you transfer classes? There\u0026apos;s no need to go down to Class C after finally moving up to Class A, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Haha, was it because of Karuizawa after all?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t meant to be a joke, but that slipped out of Ike\u0026apos;s mouth.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hey Ike\u0026#x2026;!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Come on. I can\u0026apos;t think of any other reason. It must be embarrassing to be dumped.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That might be one of the reasons.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;See! I knew\u0026#x2014;ack!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIke, clapping his hands in joy, was hit with Sudou\u0026apos;s angry slap on the back.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s definitely a lie, that\u0026apos;s for sure.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ouch\u0026#x2026; He admitted it himself, so assuming it\u0026apos;s a lie is what\u0026apos;s really questionable here if you ask me\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile rubbing his sore back, Ike glared at Sudou and furrowed his brows.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So, what\u0026apos;s the real reason?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAkito asked with a tone that showed he held back some of his anger.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnswering that question was simple, but there were plenty of reasons why it couldn\u0026apos;t be done.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;A reason? I don\u0026apos;t see any meaning in answering that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There is meaning. Do you know how we feel right now? I was just with Haruka, and she was feeling really down. She kept repeating over and over that it might\u0026apos;ve been her fault\u0026#x2014;that maybe her attempt to reconcile so conveniently became a burden for you, Kiyotaka.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eCome to think of it, I had a chance to talk with Hasebe before the end-of-year special exam.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIndeed, it wouldn\u0026apos;t be surprising to think the remarks exchanged then had influenced me to transfer.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;She\u0026apos;s been troubled even before today\u0026apos;s events. Kiyotaka, you\u0026apos;ve helped her, and she hasn\u0026apos;t even been able to properly express her gratitude.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKeisei nodded to Akito\u0026apos;s plea.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I was once saved by you too, Ayanokouji-kun. If it weren\u0026apos;t for you, I probably wouldn\u0026apos;t have stayed at this school.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYousuke seemed to have similar thoughts.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYousuke, who feared people getting hurt, had been wounded by his three classmates\u0026apos; expulsions. It was undeniable that without my support, he would\u0026apos;ve fallen.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s why I respected your strength and found you a reliable classmate. But during the unanimous special exam and the end-of-year special exam, there were things I couldn\u0026apos;t digest, no, couldn\u0026apos;t accept. Of course, I won\u0026apos;t deny that it would\u0026apos;ve been better if I had more strength, but I also came to distrust you a bit.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt the end of our spring break, even at the victory celebration Horikita planned, Yousuke showed a hint of those nuanced feelings.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince then, it\u0026#x2019;d been slightly on my mind that he wasn\u0026apos;t calling me by my first name, and considering that he\u0026#x2019;d been maintaining that stance today as well, it might\u0026apos;ve meant he unconsciously wanted to keep a distance between us. Similarly, I\u0026#x2019;d also been intentionally distinguishing between using his first and last name due to the changes in our relationship.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not just Sudou-kun and the others here. Everyone in the class is very worried and confused.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEveryone present wanted to know the reason.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was because they wanted to extract some sort of statement where I admitted there were unavoidable circumstances for the transfer.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Worry and confusion, huh? Well, that\u0026apos;s right. I transferred classes without telling anyone to get that reaction.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;What do you mean?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps his brain refused to comprehend for a moment. Keisei adjusted his glasses and asked to hear it again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Just take it at face value. I didn\u0026apos;t say anything because I wanted to trouble the class. And my reason that you wanted to hear is simple. Class C was in trouble without Sakayanagi. So, I chose to help by transferring in exchange for Private Points.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eA contrived act.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eAnd for selfish reasons.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI emphasized that the transfer was solely for my own benefit. Even if there were some lies mixed in, it was the undeniable truth.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Wha\u0026#x2026; Are you serious\u0026#x2026;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThose were Sudou\u0026apos;s words, but Akito and Keisei probably felt the same.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey showed similar reactions to my cold words.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, Yousuke was almost unfazed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hey, I\u0026apos;ve been wondering since this morning, but why would that happen?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the tense atmosphere, Ike tilted his neck\u0026#xa0;and brought his hands to the back of his head.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I get that it\u0026apos;s a pinch without Sakayanagi, but why pay a huge sum of twenty million to poach Ayanokouji? It doesn\u0026apos;t make any sense. I can see that it\u0026apos;s to weaken Class A, but normally, there would be plenty of other students they\u0026apos;d want, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was a question that seemed obvious given the situation. Excluding Yousuke and Sudou, no one there could truly understand why I was the one being bought.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I also thought so at first too. That\u0026apos;s why I was concerned that there might\u0026apos;ve been something behind the transfer. You really aren\u0026apos;t willing to tell us the full story?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKeisei, while agreeing with Ike, wanted to know whether there were any hidden circumstances behind the transfer.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s nothing more to say. What I just said is everything there is. It\u0026apos;s difficult to prove at this point whether Class C had a good reason to go through such lengths to acquire me. Though, I believe it\u0026apos;s only a matter of time.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No matter how you look at it\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as Ike was about to interject, Sudou stepped up to him and grabbed his shoulder.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s a big problem, Kanji.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What is\u0026#x2026;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s Ayanokouji\u0026apos;s transfer. You don\u0026apos;t get it, do you\u0026#x2026;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then do you understand, Ken?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ayanokouji is\u0026#x2014;no, I don\u0026apos;t understand everything either\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What\u0026apos;s that supposed to mean?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even so, Ayanokouji\u0026apos;s an important presence for the class!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs Sudou raised his voice in anger, Yousuke approached and spoke to calm him down.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen he quietly turned towards me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What I wanted to confirm today was solely why you left the class. If it were for the sake of the class, I thought you wouldn\u0026apos;t want to cause any misunderstandings for any of us, including me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You can rest assured. It\u0026apos;s purely, 100%, a transfer solely for my own benefit.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;It seems so.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps, I was only saying that on the surface, and it was different in actuality. However, at the moment at least, Hirata didn\u0026apos;t seem to be able to consider it that way.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe was someone who was much more sensitive than others when it came to trouble within the class.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen he learned of my transfer, he probably wasn\u0026apos;t too disturbed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy presence had both advantages and disadvantages. If I were gone, my disappearance could simply result in class management becoming more stable.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Looks like it, and you\u0026apos;re okay with that, Hirata? Just letting Ayanokouji transfer?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Regardless of whether it\u0026apos;s good or bad, it\u0026apos;s Ayanokouji-kun\u0026apos;s choice. Besides, the school procedures are already completed without any mishaps, so if we were to call him back to our class, we would need the same amount of Private Points. It\u0026apos;s not an amount we can prepare immediately.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you regret leaving the class, Ayanokouji, then I\u0026apos;ll contribute all the money I have on hand. Right, guys?!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSudou tried to rally all the boys present, including Ike, but Akito and Keisei didn\u0026apos;t immediately nod.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eGiven my indifferent attitude and the fact that I had made it clear I left on my own accord, they probably didn\u0026apos;t think it was possible to call me back, nor were they inclined to do so.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Kiyotaka\u003csup id=\"fnref-1-0b221183-dfeb-501c-8bb5-6b01d1432cb6\"\u003e\u003ca class=\"footnote-ref\" href=\"#fn-1-0b221183-dfeb-501c-8bb5-6b01d1432cb6\" data-ref=\"1\" epub:type=\"noteref\"\u003e[1]\u003c/a\u003e\u003c/sup\u003e\u0026#xa0;left the class on his own free will. We have to respect that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTurning away from the persistent Sudou, Hirata faced me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is there anything you need to tell the class?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Nothing.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see\u0026#x2026; Sorry for taking your time.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eObediently, Hirata accepted everything and left the scene.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlthough he probably wasn\u0026apos;t calm on the inside, exerting pointless effort here wouldn\u0026apos;t improve the situation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eInstead, he needed to focus on navigating the situation without causing problems among his classmates.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Suzune was relying on you. What kind of face do you plan to make from tomorrow onward\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hey Ken, now that we know Ayanokouji left on his own, let\u0026apos;s go back too.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSudou bit his lower lip in frustration and was pushed by Ike to leave.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We\u0026apos;re still friends even if you left the class. If you ever encounter any problems, feel free to consult us.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAkito also gave a response and returned to the dormitory with Keisei.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI watched my former classmates leave and decided to return to the dormitory a bit later.\u003c/p\u003e\u003chr class=\"footnote-rule\"/\u003e\u003col class=\"footnotes\"\u003e\u003cli data-id=\"0b221183-dfeb-501c-8bb5-6b01d1432cb6\" data-ref=\"1\" class=\"footnote first-footnote\" id=\"fn-1-0b221183-dfeb-501c-8bb5-6b01d1432cb6\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003ca class=\"footnote-backref\" href=\"#fnref-1-0b221183-dfeb-501c-8bb5-6b01d1432cb6\"\u003e[1]: \u003c/a\u003eFor some reason, Hirata addresses him as \u0026quot;Kiyotaka\u0026quot; here rather than \u0026quot;Ayanokouji-kun\u0026quot;\u0026#x2014;that isn\u0026apos;t a translation mistake. We don\u0026apos;t know why. It could be another mistake on Kinu\u0026apos;s part; that wouldn\u0026apos;t be the only mistake he may have made in this volume.\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 5\",\"volumeId\":\"y3v1\",\"chapterIndex\":20,\"prevChapter\":{\"volumeId\":\"y3v1\",\"chapter\":19,\"title\":\"Part 4\"},\"nextChapter\":{\"volumeId\":\"y3v1\",\"chapter\":21,\"title\":\"Chapter 4: An Onlooker's Perspective \"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 1\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: The End of Everyday Life\",\"href\":\"prologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Confusion\",\"href\":\"chapter-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"chapter-1-part-1.xhtml\",\"index\":12},{\"label\":\"Chapter 2: Confirmation\",\"href\":\"chapter-2.xhtml\",\"index\":13},{\"label\":\"Part 1\",\"href\":\"chapter-2-part-1.xhtml\",\"index\":14},{\"label\":\"Chapter 3: The Commencement of a One-Year Period\",\"href\":\"chapter-3.xhtml\",\"index\":15},{\"label\":\"Part 1\",\"href\":\"chapter-3-part-1.xhtml\",\"index\":16},{\"label\":\"Part 2\",\"href\":\"chapter-3-part-2.xhtml\",\"index\":17},{\"label\":\"Part 3\",\"href\":\"chapter-3-part-3.xhtml\",\"index\":18},{\"label\":\"Part 4\",\"href\":\"chapter-3-part-4.xhtml\",\"index\":19},{\"label\":\"Part 5\",\"href\":\"chapter-3-part-5.xhtml\",\"index\":20},{\"label\":\"Chapter 4: An Onlooker's Persp
