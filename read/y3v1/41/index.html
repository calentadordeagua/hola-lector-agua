ho was muttering was a student from Class C, Kitou Hayato.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince I transferred, I hadn\u0026#x2019;t had a single conversation with Kitou.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If a classmate calls, it\u0026apos;s my duty to respond.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;Already acting like the class leader?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I believe I\u0026apos;m not mistaken in my perception. I think it\u0026apos;s acceptable to let me take the helm to some extent. Though, you seem to think otherwise.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t think I had a particularly good relationship with Kitou, but I didn\u0026apos;t think it was bad either.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt least before my transfer, I thought we were on terms where we could at least exchange greetings without any problems.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t recognize you as a leader.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, considering we haven\u0026apos;t even had a proper conversation or made eye contact until now, I assumed that\u0026apos;d be the case. You can\u0026apos;t bring yourself to recognize anyone other than Sakayanagi, can you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No\u0026#x2026; It doesn\u0026apos;t matter to me whether it\u0026apos;s Sakayanagi.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026#x2019;s strange. Then why did you obediently follow Sakayanagi?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;As long as I\u0026apos;m not the person leading the class, someone needs to step forward. When asked to choose between Katsuragi or Sakayanagi, I simply chose the one with a higher chance of winning\u0026#x2026; because I thought that was the best way to graduate from Class A.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs he spoke, Kitou\u0026apos;s face grew increasingly irritated.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But\u0026#x2026; Sakayanagi only thought about her own convenience in the end. She essentially didn\u0026apos;t care about Class A at all, she just did whatever she wanted as long as she was enjoying herself. Still, I thought it was okay as long as she produced results\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor the quiet Kitou, whether it was Sakayanagi or Katsuragi, or even a third party, it didn\u0026apos;t matter who someone was as long as they could lead everyone to Class A; he had simply bet on Sakayanagi because he saw a higher possibility in her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt didn\u0026apos;t matter whether he liked or disliked someone\u0026#x2014;that was what he wanted to express. He just made his judgment in a purely detached, matter-of-fact manner based solely on the advantages and disadvantages someone could bring to the class.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This was what happened after I entrusted things to someone else.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m not in a position to talk about other people, but because of somebody\u0026apos;s selfish actions, the class had gone down two ranks. We\u0026apos;re almost at the bottom. It\u0026apos;s natural for you to feel dissatisfied.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re the same as Sakayanagi. You don\u0026apos;t really care about graduating from Class A.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Indeed, I also intend to do as I please. It must be troublesome for you, Kitou. However, I at least plan to raise our current class to a point where we can seize the chance to move up to Class A. Isn\u0026apos;t that enough?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t trust you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026apos;That\u0026apos;s exactly why, this time, instead of making crude judgments based solely on advantages and disadvantages, I decided to take a step forward and get involved myself\u0026apos;\u0026#x2014;that was what he seemed to think.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll see for myself whether you\u0026apos;re trustworthy or not\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs he spoke, he pulled up his black leather gloves and clenched both fists tightly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re strong, I already know that\u0026#x2026; Show me that you can suppress my dissatisfaction with your strength.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKitou didn\u0026apos;t care about what strategies I could come up with for special exams, or how well I\u0026apos;d be able to read the opponent\u0026apos;s thoughts. No matter what accomplishments I achieved, his doubts would still remain.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom what it seemed, if I could demonstrate the pure difference in strength between us, he would suppress his dissatisfaction and comply.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This idea\u0026apos;s similar to Ryuuen\u0026apos;s\u0026#x2014;it\u0026apos;s simple, but it\u0026apos;s not bad. If you want to test me that way, I\u0026apos;m willing to go along with it. However, before that, I have a warning for you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKitou, feeling ready for battle, probably had no idea what I was about to discuss.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Warning\u0026#x2026;? What do you mean?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even if you\u0026apos;re not good at talking, I understand that you have confidence in your physical strength. At least when Ryuuen stormed into the classroom, you should\u0026apos;ve been the first to act.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You wanted me to punch Ryuuen?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No. I\u0026apos;m saying that if you had acted fast enough, you could\u0026apos;ve prevented Sawada from getting into danger. She could\u0026apos;ve had a serious injury there.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKitou, who was sitting near Sawada, deliberately waited rather than moved.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t make me laugh. I don\u0026apos;t recognize you as\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You not recognizing me as the class leader is too childish a reason. Even Koenji, at times, will move to protect a classmate if they\u0026apos;re in danger. I\u0026apos;m not trying to impose some old-fashioned values where men would protect women, but if we\u0026apos;re classmates, the strong wouldn\u0026apos;t need a reason for them to protect the weak.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Classmates\u0026#x2026;? If I don\u0026apos;t think of them like that, it wouldn\u0026apos;t be a problem, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you truly think of them that way, then yes, there wouldn\u0026apos;t be a problem. But if that\u0026apos;s the case, then \u0026apos;Kitou Hayato\u0026apos;s\u0026apos; existence is unnecessary in Class C.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eClassmates who tried to make one-sided demands without working with the class\u0026#x2014;such nonsense would only be tolerated if they possessed a certain level of strength. Otherwise, there was no other option but to make them disappear.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Fine\u0026#x2026; If you win, I\u0026#x2019;ll follow you from now on\u0026#x2026; only if you win, that is\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKitou cut off his words and reached out his long arm toward me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBefore his arm could reach my chest, I grabbed and stopped it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut he didn\u0026apos;t panic. Instead, he tried to pull me toward him with the arm that I grabbed. I could tell before he could even move that he intended to land a hit regardless of the situation and break my will to fight.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMost people would\u0026apos;ve shut their mouths with that one intimidating blow.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Mu\u0026#x2026;!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, when he realized he couldn\u0026apos;t easily pull me in, he immediately brushed off my arm.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eInstead of recklessly diving in for a follow-up attack, Kitou observed the situation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe seemed used to fighting, capable of instinctively sensing danger.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe took a pause, then he gave a provocative yet light tap on the ground with his feet.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;When I glare at people, most of them would feel somewhat disgusted and scared at the same time.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat wasn\u0026apos;t just because he was strong.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe also implied he had an appearance people would fear\u0026#x2014;it was a self-mockery\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Unfortunately, I\u0026apos;m not interested in such superficial things.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe fixed me with a sharp gaze, perhaps feeling uncomfortable that I seemed indifferent. Then, he took a powerful step forward and swung his right fist forward.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a straight punch with no wasted motion; the sound of it slicing through the air echoed in my ear.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWithout panicking, I stepped back and dodged his fist.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI dodged similar attacks two, three times. Then, Kitou stopped, looking dissatisfied.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;Why won\u0026apos;t you attack back\u0026#x2026;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I wonder why.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I evaded the question, Kitou softly clicked his tongue and swung his fist again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis time, he focused on using his left arm, but that fist didn\u0026apos;t reach me either.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTypically, when facing an opponent with long reach like Kitou, the strategy was to use footwork to close the gap and bring the fight into close quarters.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, Kitou knew of this. That was why he wouldn\u0026apos;t take a step in so easily.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKitou grew increasingly irritated by my unexpected movements, and there was no sign of me returning his attacks.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis time, he seemed intent on using his legs, launching a kick.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen the tip of his foot was about to hit my abdomen, I dodged it just like his fists, creating a large opening. I didn\u0026apos;t miss that opportunity and brushed Kitou\u0026apos;s body back with the palm of my hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ugh\u0026#x2026;!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKitou lost his balance and took a step back, his footing slightly unstable\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn comparison, Ryuuen used both his hands and feet equally, and he was skilled in attacking using unconventional methods. On the other hand, Kitou wasn\u0026apos;t as proficient with his legs, but his upper body movements were more refined than Ryuuen\u0026apos;s, and he understood how having long arm reach gave him advantages in a fight.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe moment he tried to regain his composure, focusing on his footing\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI twisted my left fist into Kitou\u0026apos;s abdomen.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAgony. Speechlessness.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a careless complacency born from the assumption that I wouldn\u0026apos;t attack yet.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKitou intended to use his arms to go for a counterattack, but out of a defensive reflex, they moved toward his own abdomen.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince I hadn\u0026apos;t planned on attacking him repeatedly, I intended to end it with this one strike.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t use my dominant arm, but I thought that was enough.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, Kitou bent his knees and quickly resumed a fighting stance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps it was his tenacity that prevented him from being easily defeated.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven after a brief exchange of blows, the difference in strength should\u0026#x2019;ve been clear, but his resolve wasn\u0026#x2019;t broken. Before his brain could realize he was in an impossible situation, Kitou kicked the ground, stretched out both his hands, and closed the distance once again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt would\u0026apos;ve been easy to deflect his hands, but I chose to challenge it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUsing both his hands, he caught my neck and pushed my back against the wall with the momentum. Normally, people would try to escape the pressure by grabbing the opponent\u0026apos;s arms.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, that was a mistake. It wouldn\u0026apos;t be easy to pry the opponent\u0026apos;s arms away.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHaving quickly spread my hands, I slapped both of Kitou\u0026apos;s ears with my palm.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUnexpected and vulnerable to such an attack, Kitou\u0026apos;s face contorted, his arms released me, and he quickly retreated back.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt that moment, I delivered a front kick, forcing Kitou to bend his knees again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ugh\u0026#x2026;!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDespite\u0026#xa0;showing a pained expression from the intense blow, Kitou immediately dropped to one knee.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe didn\u0026apos;t completely fall, firmly displaying his determination that he had yet to be defeated.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re strong\u0026#x2026; Is there this much of a difference\u0026#x2026;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re strong enough, but that\u0026apos;s why you should use your strength properly. In a normal school life, violence isn\u0026apos;t necessary. However, there are times when students find themselves in danger due to forces beyond their control. I want you to protect those students. In return, though it may sound odd, I promise to take Class C to a position where we can aim for Class A.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I won\u0026apos;t believe that so easily.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s fine. The results will show shortly with the flow of time.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI extended my hand to Kitou, who looked at me with a strong gaze, unafraid.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Aren\u0026apos;t you worried that I might grab that hand someday and drag you down by force?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll look forward to that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHaving heard my response, Kitou gave a small nod and took my hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith my start in Class C, having this rough side to things wasn\u0026apos;t necessarily bad.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA conversation for those who sought it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA show of strength for those who sought it.\u003c/p\u003e\u003cimg src=\"/hola-lector-agua/images/books/y3v1/OEBPS/gqmxDTHEbaXPGtEbojsvM.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cp class=\"paragraph after-image\" style=\"text-align: left\"\u003eI had to close the distance with each student in their most suitable way.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor that, I was willing to engage in anything.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 1\",\"volumeId\":\"y3v1\",\"chapterIndex\":41,\"prevChapter\":{\"volumeId\":\"y3v1\",\"chapter\":40,\"title\":\"Epilogue: What Awaits Ahead\"},\"nextChapter\":{\"volumeId\":\"y3v1\",\"chapter\":42,\"title\":\"Part 2\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 1\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: The End of Everyday Life\",\"href\":\"prologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Confusion\",\"href\":\"chapter-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"chapter-1-part-1.xhtml\",\"index\":12},{\"label\":\"Chapter 2: Confirmation\",\"href\":\"chapter-2.xhtml\",\"index\":13},{\"label\":\"Part 1\",\"href\":\"chapter-2-part-1.xhtml\",\"index\":14},{\"label\":\"Chapter 3: The Commencement of a One-Year Period\",\"href\":\"chapter-3.xhtml\",\"index\":15},{\"label\":\"Part 1\",\"href\":\"chapter-3-part-1.xhtml\",\"index\":16},{\"label\":\"Part 2\",\"href\":\"chapter-3-part-2.xhtml\",\"index\":17},{\"label\":\"Part 3\",\"href\":\"chapter-3-part-3.xhtml\",\"index\":18},{\"label\":\"Part 4\",\"href\":\"chapter-3-part-4.xhtml\",\"index\":19},{\"label\":\"Part 5\",\"href\":\"chapter-3-part-5.xhtml\",\"index\":20},{\"label\":\"Chapter 4: An Onlooker's Perspective \",\"href\":\"chapter-4.xhtml\",\"index\":21},{\"label\":\"Part 1\",\"href\":\"chapter-4-part-1.xhtml\",\"index\":22},{\"label\":\"Part 2\",\"href\":\"chapter-4-part-2.xhtml\",\"index\":23},{\"label\":\"Chapter 5: Convolution\",\"href\":\"chapter-5.xhtml\",\"index\":24},{\"label\":\"Part 1\",\"href\":\"chapter-5-part-1.xhtml\",\"index\":25},{\"label\":\"Part 2\",\"href\":\"chapter-5-part-2.xhtml\",\"index\":26},{\"label\":\"Part 3\",\"href\":\"chapter-5-part-3.xhtml\",\"index\":27},{\"label\":\"Part 4\",\"href\":\"chapter-5-part-4.xhtml\",\"index\":28},{\"label\":\"Part 5\",\"href\":\"chapter-5-part-5.xhtml\",\"index\":29},{\"label\":\"Chapter 6: School Life in Class C\",\"href\":\"chapter-6.xhtml\",\"index\":30},{\"label\":\"Part 1\",\"href\":\"chapter-6-part-1.xhtml\",\"index\":31},{\"label\":\"Chapter 7: Ayanokouji's Defeat\",\"href\":\"chapter-7.xhtml\",\"index\":32},{\"label\":\"Part 1\",\"href\":\"chapter-7-part-1.xhtml\",\"index\":33},{\"label\":\"Part 2\",\"href\":\"chapter-7-part-2.xhtml\",\"index\":34},{\"label\":\"Part 3\",\"href\":\"chapter-7-part-3.xhtml\",\"index\":35},{\"label\":\"Part 4\",\"href\":\"chapter-7-part-4.xhtml\",\"index\":36},{\"label\":\"Part 5\",\"href\":\"chapter-7-part-5.xhtml\",\"index\":37},{\"label\":\"Chapter 8: Enemies and Allies\",\"href\":\"chapter-8.xhtml\",\"index\":38},{\"label\":\"Part 1\",\"href\":\"chapter-8-part-1.xhtml\",\"index\":39},{\"label\":\"Epilogue: What Awaits Ahead\",\"href\":\"epilogue.xhtml\",\"index\":40},{\"label\":\"Part 1\",\"href\":\"epilogue-part-1.xhtml\",\"index\":41},{\"label\":\"Part 2\",\"href\":\"epilogue-part-2.xhtml\",\"index\":42},{\"label\":\"Author's Afterword\",\"href\":\"authors-afterword.xhtml\",\"index\":43}],\"volumeTitle\":\"Light Novel 3rd Year Volume 1\",\"detailsLink\":\"/select/year-3/y3v1\",\"returnLink\":\"/select\",\"currentSpineIndex\":41,\"nextVolumeLink\":\"/select/year-3/y3v2\",\"nextVolumeTitle\":\"Light Novel 3rd Year Volume 2\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/
