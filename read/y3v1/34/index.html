e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T2bae,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 2\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMEANWHILE, HORIKITA\u0026apos;S CLASS, Class A, was also experiencing that same moment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was Class 3-A versus Class 3-D. Although Ichinose\u0026apos;s class had a slight advantage due to the number difference, Horikita\u0026apos;s class still had a good chance at winning the full-class battle, and depending on how well they had seen through each other in the small-group battle and the penalty point applications, it could go either way.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was supposed to be a close and intense battle.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe tense atmosphere was about to become heavier with Chabashira\u0026apos;s next words.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Unfortunately\u0026#x2026; three of the five you chose were targeted by the opponent\u0026apos;s penalty points. Your second selection, \u0026apos;Wan Mei-Yui,\u0026apos; your third selection, \u0026apos;Yukimura Teruhiko,\u0026apos; and your fourth selection, \u0026apos;Kouenji Rokusuke,\u0026apos; will each have twenty-five points deducted from their exam results. On the other hand, your correctly assigned penalty points on the opponent\u0026apos;s small-group battle are their second selection, \u0026apos;Kanzaki Ryuuji,\u0026apos; and their third selection, \u0026apos;Tsube Hitomi,\u0026apos; each of whom will have ten points deducted.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Twenty-five points for three people\u0026#x2026;!? That much\u0026#x2026;!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe situation was indeed dire. A twenty-five-point difference was almost enough to bring students from academic levels A and D to the same level.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Did they use their Private Points to apply a large number of penalty points?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Unfortunately, information about how many additional penalty points the opponent purchased isn\u0026apos;t disclosed. All we know is that three people were targeted for the penalty application.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf twenty-five penalty points were applied to ten people each, then they\u0026apos;d need a total of 250 penalty points.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSubtracting the initial 100 penalty points given, they\u0026apos;d have to prepare 150 more points out of pocket, costing a total of 7.5 million Private Points.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven the assumption that they were applying the penalty points to just ten people involved a somewhat unrealistic sum of Private Points.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf it was hard to imagine such a large investment, the next thought that came to mind was\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hey, Hirata. I don\u0026apos;t want to think about it, but could this mean there was a leak?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSudou interpreted and accepted the reality he faced.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I can\u0026apos;t deny it\u0026#x2026; But I only spoke about who I\u0026apos;d assign with a few people\u0026#x2014;the people I talked to in order to help decide who to pick and the actual participants. Oh, and also Horikita-san.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn selecting the five for the small-group battle this time, Horikita had entrusted Hirata with the responsibility, judging that she couldn\u0026apos;t make a calm decision by herself. Hirata wasn\u0026apos;t the type to decide alone, so he had discussions with a few key people and selected the five participants. Needless to say, the selection of these five classmates was top secret, and they had tight control over the information to prevent leaks.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then it must be one of them.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No\u0026#x2026; I can\u0026apos;t imagine that happening.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But look at the people who were assigned, no one would normally choose Kouenji. He\u0026apos;s not the type to actively participate, and our opponent knows that\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs he began to speak, Sudou realized one possibility.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Could it be Kouenji? You informed the participants beforehand, didn\u0026apos;t you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKouenji showed no reaction to the question, but soon Hirata interjected, denying the possibility.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s not possible. I hadn\u0026apos;t told Kouenji-kun in advance that I\u0026#x2019;d chosen him. I only told him that he might be chosen as a participant.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDuring the discussions, it was decided that excluding Kouenji from the small-group battle from the start would only be welcomed by\u0026#xa0;the opponent.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom Ike to Kouenji, it was important to thoroughly examine and carefully select from everyone available.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEventually, they concluded that choosing Kouenji would catch the opponent off guard. Kouenji didn\u0026apos;t follow anyone\u0026apos;s instructions, but he had been relatively serious about past written exams.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe small-group battle was merely an extension of the full-class battle, and it didn\u0026#x2019;t require any extra work for the selected individuals.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTherefore, they assumed that Kouenji would receive a reasonably high score without much effort.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe fact that he was targeted as a nominee was completely unexpected.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then why? No matter how you think about it, this is\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It can\u0026#x2019;t be because our information got leaked, right? After all, the other two weren\u0026apos;t targeted. If it\u0026#x2019;d been completely leaked, it wouldn\u0026apos;t be strange if everyone had been selected for penalty points. There\u0026apos;s no need to deliberately leave out those two.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKushida pointed this out to Sudou, who didn\u0026apos;t want to take on the exam while harboring doubts.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;That\u0026apos;s true, isn\u0026apos;t it\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then did Ichinose-san guess the three people correctly only using pure speculation? That\u0026#x2019;s amazing\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlongside this, there was also her boldness in assigning twenty-five penalty points each.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMany of their classmates, including Shinohara, were surprised by this unconventional method.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAll except for one person.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;I don\u0026apos;t\u0026#x2026; think that\u0026apos;s it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was almost like Karuizawa was muttering to herself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What do you mean \u0026apos;I don\u0026apos;t think that\u0026apos;s it,\u0026apos; Kei-chan?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom a distant seat, Satou voiced her confusion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Maybe\u0026#x2026; it wasn\u0026apos;t Ichinose-san who saw through them\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe paused for a moment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSaying that name made her feel heavy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat happy scene \u003cem\u003ethose two \u003c/em\u003ehad this morning lingered in her mind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was why Karuizawa reached a single conclusion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Could it be Ayanokouji-kun?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a classmate from not long ago.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHearing that name, Ike raised his voice with slight irritation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? Why Ayanokouji? He\u0026apos;s in Class C and has nothing to do with us.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We, Class A, are enemies even from Class C\u0026apos;s perspective, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith emotionless eyes, Karuizawa looked toward Ike.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFeeling an unusual intensity in her gaze, Ike caught his breath.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well\u0026#x2026; maybe\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHirata felt as if the tangled threads were unraveling upon hearing Karuizawa\u0026apos;s words.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s possible\u0026#x2026; He was in the same class as us for two years. He would understand better than anyone how the state of the class is and who might be chosen. He knew that Kouenji-kun had a positive attitude towards the written exams, so it\u0026apos;s not surprising that he was targeted.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If that\u0026apos;s the case, then Ayanokouji really is the worst\u0026#x2026;!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We shouldn\u0026apos;t jump to conclusions. Whether the information had been leaked or Ayanokouji-kun had been involved, it\u0026apos;s all just speculation. We have no choice but to fight with the hand we\u0026apos;re dealt.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey were already crushed by despair before the exam even started.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYet, they had to overcome this handicap and win.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m sorry, everyone\u0026#x2026; It\u0026apos;s because I\u0026#x2026; couldn\u0026apos;t do anything\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHorikita voiced her regrets and apologized.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe intensely loathed herself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf she had been more reliable, perhaps the situation might\u0026apos;ve changed a bit.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We haven\u0026apos;t lost yet. Even if we\u0026apos;re at a disadvantage, if we refuse to give up and continue fighting, we should still have a chance.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWithout panicking, Hirata calmly conveyed the situation. Lowering their motivation here would do more harm than good. The points they could gain wouldn\u0026apos;t increase, but they could certainly decrease\u0026#x2026;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSoon, Chabashira announced the start of the special exam.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 2\",\"volumeId\":\"y3v1\",\"chapterIndex\":34,\"prevChapter\":{\"volumeId\":\"y3v1\",\"chapter\":33,\"title\":\"Part 1\"},\"nextChapter\":{\"volumeId\":\"y3v1\",\"chapter\":35,\"title\":\"Part 3\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 1\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: The End of Everyday Life\",\"href\":\"prologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Confusion\",\"href\":\"chapter-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"chapter-1-part-1.xhtml\",\"index\":12},{\"label\":\"Chapter 2: Confirmation\",\"href\":\"chapter-2.xhtml\",\"index\":13},{\"label\":\"Part 1\",\"href\":\"chapter-2-part-1.xhtml\",\"index\":14},{\"label\":\"Chapter 3: The Commencement of a One-Year Period\",\"href\":\"chapter-3.xhtml\",\"index\":15},{\"label\":\"Part 1\",\"href\":\"chapter-3-part-1.xhtml\",\"index\":16},{\"label\":\"Part 2\",\"href\":\"chapter-3-part-2.xhtml\",\"index\":17},{\"label\":\"Part 3\",\"href\":\"chap
