e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T7d1c,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 3\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAT THE CAFE counter, we ordered our drinks. Since I had no personal funds due to the transfer, I borrowed twenty thousand Private Points from Hashimoto, promising to repay it after the May deposit, so payment wasn\u0026apos;t an issue. While waiting for the coffee, I received the receipt and idly looked at a poster advertising a part-time job recruitment opening at the cafe.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNot just at the cafe, similar notices were posted at various stores.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince students of our school met the age requirements but are prohibited from working, they couldn\u0026apos;t work. Nor would it be appropriate for teachers to take part-time jobs. Perhaps these posters were calls for job changes directed at people already working within Keyaki Mall.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile I was thinking about such meaningless things, time passed, and our ordered items were ready. Hashimoto secured a spacious seat in the back, so I picked up Hashimoto\u0026apos;s drink and moved to that seat.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter waiting for a few minutes, Ichinose appeared, waving gently to signal her arrival. After a brief exchange with the staff at the counter, she approached with a cup in hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sorry to keep you waiting, Ayanokouji-kun. And you\u0026apos;re with Hashimoto-kun and Morishita-san too.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIchinose politely greeted Morishita as well. On the other hand, Morishita, with a slight nod, remained silent, making it clear that they had little daily interaction.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is it okay for these two to be here?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course, there\u0026apos;s no problem at all.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eListening to our brief exchange, Hashimoto smirked.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You don\u0026apos;t look surprised\u0026#x2026; Did you already know? About Ayanokouji\u0026apos;s transfer, that is.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf Ichinose was caught off guard, having just learned about the transfer from the school that morning, her surprise would\u0026apos;ve been obvious. However, Ichinose showed no such signs, nor did she seem like she was about to question my change in class. It wasn\u0026apos;t surprising that Hashimoto reached such a conclusion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I found out a little while ago.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Morishita, you also seem to know that Ichinose knew about it earlier, didn\u0026apos;t you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I know what I knew. Those who didn\u0026apos;t know should keep this in mind, okay? Quite an interesting expression, I\u0026apos;d say.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What\u0026apos;s that? Are you trying to dodge the question with some nonsense?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Not at all. Of course, I knew. The only one here who wasn\u0026apos;t informed was\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSlowly, she pointed her index finger right in front of Hashimoto\u0026apos;s eyes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe lightly brushed it off with his hand and glared back.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So it\u0026apos;s just me, huh? Makes me tear up at the strong sense of trust you guys have for each other.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s just between\u0026#xa0;us\u0026#xa0;here. I haven\u0026apos;t told any other classmates.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s the same for my class. Everyone else was surprised, so they clearly didn\u0026apos;t know.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven with this reassurance, it was hard for him to digest.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Thanks for the consolation. Though, from here on out, I\u0026apos;ll be digging in deep\u0026#x2014;including why Ichinose was informed about the transfer.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAside from how she was seemingly involved in the plan, Hashimoto had other reasons for why he was directing his glare toward Ichinose.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But why Ichinose? Don\u0026apos;t tell me you broke up with Karuizawa to date Ichinose\u0026#x2026; and that\u0026apos;s what led to you telling her?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhether he perceived us as being close or if it was mere conjecture, Hashimoto didn\u0026apos;t hesitate to ask.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s quite a bold question. However, I do sort of understand how you feel.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBoth of them alternated their gazes between me and Ichinose.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We wouldn\u0026apos;t discuss the transfer just for that reason.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;She isn\u0026apos;t even in the class you transferred to, so why does Ichinose get to know? There has to be a convincing reason, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course. It\u0026apos;s because for the next year, as Class C aims for Class A, Ichinose and her class\u0026apos;s cooperation is essential. Without her cooperation, my transfer to Class C wouldn\u0026apos;t have happened.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s quite a grand claim\u0026#x2026; but what kind of cooperation are you talking about?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The alliance with Ichinose Honami\u0026apos;s class\u0026#x2026; So you were serious.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMorishita muttered first, and I nodded in response.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNaturally, Hashimoto was taken aback by the sudden mention of an alliance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRegarding what was coming up next, it was something I would need to explain step by step.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Indeed, I\u0026apos;m serious. In fact, Ichinose and I have formed a complete alliance. Not just some short-term cooperation plan based on the circumstances, but rather a plan to fight together through most of our third year.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI simply conveyed the core of the strategy Hashimoto wanted to know.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, Hashimoto wasn\u0026apos;t convinced by just that. If anything, the confused look on his face only grew stronger.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s impossible, right? Only one class can graduate from Class A, regardless of how hard people try. A complete alliance is impossible.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe might\u0026apos;ve taken my words as a joke or a ridiculous claim. This was still within expectations, so there was no need to get flustered or firmly reject it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s not necessarily true. Indeed, an alliance can\u0026apos;t be formed unconditionally, but the fact that the classes have neatly split into upper and lower halves, paired with the fact that Ichinose and I aren\u0026apos;t aiming to win alone, is significant. If we add the condition \u0026apos;until the four classes are competing equally,\u0026apos; maintaining the alliance isn\u0026apos;t difficult.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf we explained it calmly, our sincerity would come across.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No\u0026#x2026; wait. That\u0026apos;s still impossible. Even if the lower classes were to join hands, the school decides what exams come and who\u0026apos;s matched against whom. If our next battle is against Ichinose\u0026apos;s class, it\u0026apos;d go to hell with any alliances at that point.\u0026#xa0;At most, we could have a gentleman\u0026apos;s agreement to avoid expulsions. Neither can afford to lose, so cooperation is\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf it were an alliance based solely on who wins and loses, there might be contradictions.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, the word \u0026apos;alliance\u0026apos; meant more than just that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBefore I could add anything, Ichinose nodded and explained.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course, the combination of matches is often uncontrollable. That\u0026apos;s been proven over the past two years, and I think it\u0026apos;s only natural for the school to make it so.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe school had our classes competing in a balanced way, at times designating our opponent for us, and at times allowing us to choose it ourselves.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was the rule for the special exams we repeated throughout our school life.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So, anticipating that, we\u0026#x2019;ve already made detailed arrangements. In case my class and Ayanokouji-kun\u0026apos;s class end up competing one-on-one, we\u0026apos;ve agreed to \u0026apos;concede victory to the class that is even one point behind in Class Points.\u0026apos; There are actually more detailed arrangements, but what I want to say is, if the winning and losing classes are predetermined with this condition, there will be no disputes.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMorishita listened to Ichinose\u0026apos;s explanation and sighed softly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you serious? I mean, the arrangement is easy to understand, but what I want to point out is that there\u0026apos;s no point in an alliance where victories are conceded. Conceding victory to the class with even one less point? Hey, that means that the other party is losing a valuable opportunity to gain Class Points. It\u0026apos;s like throwing away a part of the limited number of special exams available each year.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re talking as if all the special exams are set up for Hashimoto-kun and the rest of your class to have an advantage.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We have been maintaining Class A all this time.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Until a little while ago, that is. Now that Sakayanagi-san has lost and voluntarily withdrawn, hasn\u0026apos;t the class\u0026apos;s strength significantly weakened?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s why we poached Ayanokouji.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The alliance formed with Ichinose\u0026apos;s class is also one of the reasons for my transfer.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;So the alliance is a foregone conclusion, huh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs Ichinose and I nodded almost simultaneously, Hashimoto exaggeratedly shook his head.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even if forming an alliance is the condition\u0026#x2026; First of all, there\u0026apos;s no guarantee that the class that received a concession will concede victory the following time. If we clash in the next special exam\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the current situation, the slightly superior Class C would have to accept defeat.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Over these two years, Ichinose has been building her credibility. That\u0026apos;s the key to forming the alliance.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto widened his eyes, seemingly at a loss for words.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed he didn\u0026apos;t want to follow a conversation that was beyond his understanding.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You, Hashimoto Masayoshi, who always betrays, can\u0026apos;t possibly imagine it, can you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s harsh\u0026#x2026; But then, do you understand what they\u0026apos;re saying?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ve always thought it\u0026apos;s ridiculous.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s typical of Ayanokouji. Morishita, you agree with me, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t agree, though.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Just agree with me\u0026#x2026; Anyway, I get that Ichinose is far more trustworthy than someone like me, but that\u0026apos;s not the issue. Betrayal\u0026#x2014;that risk is still scary, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Let\u0026apos;s hypothesize. Suppose in the next special exam, we face Ichinose\u0026apos;s class, which is currently Class D, and we concede victory to them. Do you think Ichinose would betray us and break the alliance\u0026apos;s promise afterward?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI told him to visualize the situation, and Hashimoto crossed his arms and looked at Ichinose.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe slightly averted his eyes, letting his imagination do the work inside his head.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter a moment of silence, he faced Ichinose, who was looking straight at him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well\u0026#x2026; I guess she\u0026apos;s not entirely untrustworthy\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m glad to hear you say that, even if you\u0026apos;re half-doubtful.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIchinose smiled happily, narrowing her eyes, and Hashimoto awkwardly looked away, scratching his cheek.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Men are simple creatures. Truly foolish beings.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHearing Morishita\u0026apos;s exasperated words, Hashimoto snapped back to attention and resumed his rebuttal, but perhaps having already lost interest in the topic, he placed both hands over his drink and started mumbling to himself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But, you know what? That\u0026apos;s just the beginning of our third year. What happens when we\u0026apos;ve been fighting for a few months and the situation gets tense? Even if Ichinose\u0026apos;s trustworthy, the people in her class might tempt her to betray us. And the same could happen to us. When it comes down to the wire, it\u0026apos;s not about trust anymore.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course, if the time comes, the alliance will be dissolved. Just like what you\u0026apos;re worried about, Hashimoto-kun, we can\u0026apos;t keep the alliance for the whole year. But there\u0026apos;s no benefit in unilaterally cutting ties at an awkward time before that moment arrives. It\u0026apos;s exactly because we\u0026apos;re in a situation where there\u0026apos;s truly no next time that I want to maintain the cooperative relationship with Ayanokouji-kun until the last possible moment.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHolding back from betraying has more benefits than doing so.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as we\u0026#x2019;d evaluated Ichinose\u0026apos;s credibility from the past, Ichinose was currently assessing my abilities in real-time. A delicate balance had been established.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;You really think highly of Ayanokouji.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. Just like you, Hashimoto-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIchinose looked straight at Hashimoto and answered without hesitation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see\u0026#x2026; Well, I understand what you\u0026apos;re trying to say, Ichinose. Indeed, there might not be any benefits for you to betray us. But there\u0026apos;s no guarantee that we won\u0026apos;t betray you, right? Or maybe you\u0026apos;ve got that covered too, like with a contract or something? If that\u0026#x2019;s the case, then\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto asked, and Ichinose smiled and denied it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s no contract. We\u0026apos;ve just exchanged promises verbally.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s just too soft, no matter how you look at it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, that\u0026apos;s enough for me. Just like Ayanokouji-kun trusts me, I trust him too.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIchinose answered without hesitation, and Hashimoto, seemingly far from understanding, had his head in his hands again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t understand, not for me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;People who assume betrayal as a given wouldn\u0026apos;t understand, would they? However, I don\u0026apos;t understand either.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMorishita, who had been mocking Hashimoto all along, seemed dissatisfied with the contract between me and Ichinose.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Let\u0026apos;s set aside the issue of trust for now. Does this alliance really mean anything significant? I\u0026apos;m not saying it\u0026apos;s completely ineffective, but do you really think it\u0026apos;s enough to compete in the battle for Class\u0026#xa0;A?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMorishita was skeptical of the argument, which she saw as very unrealistic.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah, I agree. Before we even get to matters of trust, can this alliance really be the key? After all, it\u0026apos;s just about giving way to each other when we clash. I can\u0026apos;t see how that alone would catch us up to Horikita\u0026apos;s or\u0026#xa0;Ryuuen\u0026apos;s class.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor Hashimoto, it seemed like something that would reduce rather than increase the chances of gaining Class Points.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was clear that he viewed the alliance this way.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Forming an alliance isn\u0026apos;t just about yielding to each other and not fighting. If we become complete allies, the amount of information we can gather from daily interactions simply doubles. This is effective not only during academic and physical exams but also in various other situations.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOne person is better than none, two are better than one, and three are better than two. It would become possible to gather people who are skilled and support those who aren\u0026apos;t, motivating us and creating synergy. In class-wide exams like the deserted island exams conducted during the past two years, there would be opportunities for us to cooperate.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And when classes join hands, it means we can coordinate Private Points as needed. If you need a large amount of funds, we can accommodate that. This could also help in special exams.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, there was no guarantee that all of that would be necessary.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSuch a thing might only occur two or three times out of ten.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut having the option to achieve what a single class couldn\u0026apos;t was a weapon.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I understand that it\u0026apos;s better to borrow strength that you usually can\u0026apos;t\u0026#x2026; but, the fact that we formed an alliance will come to light soon, right? What if the top two classes join hands because we are? All the benefits just mentioned would be blown away.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s not a concern for now. The top two classes are not in a position to yield to each other. Allowing Class Points to move around without both parties benefiting would only bring disadvantages. Besides, setting Horikita aside, Ryuuen isn\u0026apos;t reliable. They don\u0026apos;t have a relationship where he\u0026apos;d unconditionally concede the victory first or lend Private Points when demanded. And Horikita isn\u0026apos;t likely to take a conceding stance either.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if they were allowed some flexibility, with Ryuuen, a little would never be enough. Moreover, involving Ryuuen, someone who preferred flashy maneuvers, would bring him significant disadvantages.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;Well, that\u0026apos;s true. But that\u0026apos;s exactly why we have contracts. If there\u0026apos;s a contract, like when Ryuuen and Katsuragi teamed up, they would be forced\u0026#xa0;to follow the rules.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course, if they bring up a contract and involve the school, that\u0026apos;s also possible, and it would be a welcome development for us.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Them forming an alliance would help us?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah. If the top classes were to join hands, they\u0026apos;d naturally start suffocating each other. If they bind themselves with terms, like yielding victories to each other, they\u0026apos;d have to bear the loss when they need to win.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd with the binding conditions, it could never be nullified.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;A tightly bound contract can sometimes be a fatal blow.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMorishita muttered to herself, holding a cup.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;On the other hand, we don\u0026apos;t have unnecessary bindings like a contract. It\u0026apos;s not about whether we betray each other, but about being able to adjust our strategy flexibly and opportunistically. If a gap in Class Points arises, we can provide substantial support to the other party until the gap is closed.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eThe contract that normally would\u0026apos;ve been put in place.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eThe wide range of strategic options that came from not having one.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This is unexpected. Not having a contract actually works to our advantage, huh? I hadn\u0026apos;t considered that perspective\u0026#x2026; but in the end, this alliance will be terminated and we\u0026#x2019;ll be competing normally, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ichinose also mentioned that. If Class C and Class D rise to stand alongside Horikita\u0026apos;s and\u0026#xa0;Ryuuen\u0026apos;s classes, our cooperative relationship will naturally dissolve.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis was, of course, made with approval from Ichinose\u0026apos;s side.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIchinose nodded in response so that Hashimoto and Morishita could understand that point clearly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m somewhat convinced. But because of that, I have more questions. Let me ask something more probing\u0026#x2014;why did you decide to cooperate with Ayanokouji? Morishita and I are certainly planning to set Ayanokouji up in a high position, but most of our classmates aren\u0026apos;t convinced. If Ayanokouji\u0026apos;s branded as someone unsuitable to be a leader, such an alliance won\u0026apos;t mean anything, and it might even end up hindering you. Are you managing those risks properly?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto deliberately directed his question not at me but at Ichinose.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe believed he could fully expose Ichinose with his insight, but it wasn\u0026apos;t that simple. His opponent had clearly changed and grown since before.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Having fallen into Class D, our backs are against the wall. You understand that, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah, of course. That\u0026apos;s why a soft approach like this alliance will only make you advance by half a step at a time instead of full steps. In fact,\u0026#xa0;I\u0026apos;m even feeling so anxious just hearing this proposal that I\u0026apos;m almost panicking.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Using your expression, a certain half step is better than an uncertain full step. We\u0026apos;ve been walking for two years without moving forward, having only fallen behind. Our situation is different from that of your class, Hashimoto-kun. That\u0026apos;s why we could accept it from the start.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter seeing her positive attitude, Hashimoto gave a single nod.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then I\u0026apos;ll change the question. What if Ayanokouji can\u0026apos;t become the leader? Or even if he becomes the leader, but the condition for the class to accept him is to avoid working with Class D? Would you simply withdraw from the cooperative relationship then?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat Hashimoto feared was a half-hearted cooperation network.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOr he feared that Ichinose\u0026apos;s class might become dependent and start to collapse.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I hope you won\u0026apos;t take this the wrong way, but honestly, I feel like you\u0026apos;re a burden. Between our class and yours, it\u0026apos;s clear who holds the reins. If you say that we\u0026apos;re forming an alliance, I\u0026apos;d want something in return to be on equal footing.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What kind of return are you looking for?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eInstead of outright refusing, Ichinose first sought to draw out a proposal from Hashimoto.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re a shameless man. What do you intend to make Ichinose Honami do?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t jump to conclusions on what it\u0026apos;s about.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But, what about if she said yes regardless?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s\u0026#x2026; no, I\u0026#x2019;m saying that\u0026apos;s not what I mean.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That pause just now spoke volumes.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto, with a strong motion, waved his hands at Morishita, telling her to stop interrupting the conversation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There must be something, like paying Private Points or something like that\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sorry, Hashimoto, but the alliance I want to reap benefits from is based on equality, not subordination. Establishing a disadvantaged hierarchy would actually be more of a drawback.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen opinions diverged, it was natural for Class C to use their superior position and pressure others to comply. That was something we wanted to avoid.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s one thing I want you to be reassured about: if Ayanokouji-kun\u0026#x2014;no, if anyone from Class C\u0026#x2014;opposes it, I\u0026apos;m prepared to accept that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see? So you\u0026apos;d be willing to discard the alliance proposal then?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes, but I don\u0026apos;t think there\u0026apos;s any need to worry about that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And why\u0026apos;s that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Because it\u0026apos;s Ayanokouji-kun\u0026apos;s proposal.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer straightforward gaze pierced through Hashimoto.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s what I believe, so I don\u0026apos;t think this discussion will fall apart.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;I see.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sorry, but let\u0026apos;s stop this discussion for now.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why\u0026apos;s that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI deliberately directed my gaze in a certain direction, and Hashimoto and Morishita followed suit. There, Horikita and Matsushita appeared, still not fully comprehending the situation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah, that figures. I\u0026apos;ll handle it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Make sure to keep the alliance under wraps. It\u0026apos;s impossible for those two right now to predict that we might be forming one. There\u0026apos;s no need to tell them at this stage.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I get it. There\u0026apos;s no need to spill it so early.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto\u0026apos;s interpretation and my intentions probably didn\u0026apos;t align.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Honestly, it would be fine to reveal the alliance today or tomorrow.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh? Is that so?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The alliance doesn\u0026apos;t need to be kept secret indefinitely; it\u0026apos;s more effective when we make it known. However, right now, Horikita and the others have already taken significant damage just by the fact that I\u0026apos;ve transferred classes. Mentioning the alliance to confuse them now would be too wasteful. It\u0026apos;s better for them to learn about it once the wound of the transfer has healed a bit. That will hurt them more deeply.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;Right. You\u0026apos;re not planning to show any mercy.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis was merely lip service aimed toward Hashimoto, Morishita, and Ichinose.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThose who would be relieved and simultaneously intimidated by Horikita\u0026apos;s Class\u0026#x2019;s downfall would find this acceptable.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, my goal wasn\u0026apos;t to bring down Horikita.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had to lead her to growth.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAdding to the transfer, throwing an unexpected threat like an alliance at her would significantly weigh on her psyche.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, Horikita\u0026apos;s psyche might be even more deeply wounded afterward.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut there was no need to worry.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTwo years had passed. Horikita was able to build her relationships with her classmates during this time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI trusted that they would help her recover through this time.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 3\",\"volumeId\":\"y3v1\",\"chapterIndex\":18,\"prevChapter\":{\"volumeId\":\"y3v1\",\"chapter\":17,\"title\":\"Part 2\"},\"nextChapter\":{\"volumeId\":\"y3v1\",\"chapter\":19,\"title\":\"Part 4\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 1\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\
