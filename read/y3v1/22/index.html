class=\"paragraph\" style=\"text-align: left\"\u003eAfter several exchanges, we decided to meet at the gym and started getting ready.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eStudents were gathering by the entrance of Keyaki Mall, waiting for it to be open, and although I didn\u0026apos;t join them, I tried to kill time from a distance when Housen Kazuomi, a student from Class 2-D I don\u0026apos;t usually interact with, approached me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDue to his imposing physique and appearance, the nearby first years started to distance themselves as if they were fleeing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eLast year, interactions with the first years started right at the beginning of our second year.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOn the other hand, there hadn\u0026apos;t been any chances to get to know the new first-year students this year yet, so no one knew anyone\u0026apos;s face or name.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIt wouldn\u0026apos;t be strange if someone with remarkable talent had enrolled\u0026#x2014;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile I was thinking about that, Housen came close to me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe was indeed one of the students who\u0026#x2019;d caught a lot of attention last spring.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hey Ayanokouji-paisen\u003csup id=\"fnref-1-4bdf3471-acf9-55ee-808c-b3037205dfa4\"\u003e\u003ca class=\"footnote-ref\" href=\"#fn-1-4bdf3471-acf9-55ee-808c-b3037205dfa4\" data-ref=\"1\" epub:type=\"noteref\"\u003e[1]\u003c/a\u003e\u003c/sup\u003e. I\u0026apos;ve been hearing some flashy rumors lately about a stupid senpai who voluntarily transferred to Class C amidst its fall. What\u0026apos;s the deal?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe eagerly asked the question, but his eyes weren\u0026apos;t smiling.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe didn\u0026apos;t seem very interested in the topic itself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, who knows what the intention is?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I deliberately responded as if it were someone else\u0026apos;s business, Housen smiled a bit and came even closer.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hah, well, I guess it doesn\u0026apos;t matter.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eClearly, that wasn\u0026#x2019;t the reason why he was here, and Housen continued speaking.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s just that my skills have been getting dull lately, and it\u0026apos;s bothering me. I\u0026apos;m looking for someone to be my punching bag. Got any ideas?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe swung his large arm around, saying something suggestive.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sorry, but I\u0026apos;m not interested in fighting.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What\u0026apos;s the deal, you\u0026apos;re no fun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If that\u0026apos;s what you\u0026apos;re looking for, you should ask Ryuuen.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI thought I\u0026#x2019;d provided some excellent information, but Housen gave an exaggerated sigh and expressed his dissatisfaction.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That guy is a chicken who won\u0026apos;t fight one-on-one.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then you should fight multiple people at once. It\u0026apos;d be exciting.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Once, maybe, but it\u0026apos;s too much trouble when it\u0026apos;s hectic all the time.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf Housen went after Ryuuen, he\u0026apos;d likely win on the spot. However, at any point in time, Ryuuen would retaliate using whatever underhanded method necessary. Housen seemed to have predicted as much.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDuring the deserted island exam, they\u0026#x2019;d directly clashed. However, since then, there hadn\u0026apos;t been any incidents that required school intervention.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo one would willingly go after Ryuuen at this school, except perhaps the uninformed first-year students. In a sense, he\u0026#x2019;d established an effective defense mechanism.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;By the way, does it look like you can move up to Class C?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince it was pointless to keep talking about such menacing topics, I casually asked about the second years\u0026apos; situation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHousen and the other second-year students had spent the year without any class changes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, all classes, including Class D, were still in a good position to win.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Who knows? As long as I get money, that\u0026apos;s all I care about. I\u0026apos;ve thrown that responsibility to Nanase.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Nanase? I didn\u0026apos;t think you were the type to delegate tasks to others. Though, that\u0026apos;s a good decision. Nanase seems more capable of being a solid leader than you, Housen.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You said it. So, you wanted to fight me after all, huh? Then\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHousen tried to steer the conversation back to violence.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ayanokouji.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I faced the aggressive Housen, a slightly tense Chabashira-sensei appeared. At the sight of the teacher, Housen quietly clicked his tongue and walked away as if he\u0026#x2019;d been interrupted.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;See you later, Paisen. I\u0026apos;ll have fun with some interesting first years for a while, and after that, you\u0026#x2019;ll be my sparring partner.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m not interested.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI figured I\u0026apos;d at least reply, so I did so in a voice too low to be heard.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe moment I finished replying to the departing Housen from over my shoulder, Chabashira-sensei pulled my arm.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Come with me for a moment.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWithout allowing any room for objection, Chabashira-sensei led me to a corner.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What is it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;I wanted to talk to you. As your homeroom teacher\u0026#x2026; no, as your former homeroom teacher, I thought it might be inappropriate to carelessly make contact, but I couldn\u0026apos;t help wanting to check something.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eChabashira-sensei expressed her pent-up feelings.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer expression lacked vigor, and she must\u0026apos;ve been in deep thought this week.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So you\u0026apos;ve been following me from the dormitory.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;You noticed?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, it was quite obvious.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer tailing skills were on par with Morishita\u0026apos;s, and to put it nicely, they weren\u0026apos;t good.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There was no guarantee I\u0026apos;d be leaving the dorm. How early were you waiting for me, exactly?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was still quite chilly in the mornings, despite it getting warmer by the day.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was cold enough to catch a cold, but she didn\u0026apos;t seem to mind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That doesn\u0026apos;t matter. What I want to hear about is the class transfer\u0026#x2026; the transfer matter. What were you thinking when you decided to transfer without telling anyone\u0026#x2026;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The transfer matter, huh? Honestly, I\u0026apos;ve been asked the same question so many times this week that I\u0026apos;ve grown tired of it, regardless of gender or year.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, it was the first time a teacher like Chabashira-sensei had confronted me. From a teacher\u0026apos;s perspective, it would be impossible to react to every single student\u0026apos;s actions and transfers.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Explain what\u0026apos;s going on.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s difficult to explain when you ask like that. There shouldn\u0026apos;t be any problem with a student exercising their rightful option to transfer classes.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had no obligation to explain the circumstances.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eChabashira-sensei, fully aware of this, wouldn\u0026apos;t back down at such words.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Isn\u0026apos;t there something inconvenient\u0026#x2026; something that forced you to transfer?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And what would that be?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen questioned back, Chabashira-sensei choked on her words, unable to articulate them clearly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I forgot to mention earlier, but the issue I mentioned about dealing with Hoshinomiya-sensei has been resolved, so you can rest assured. I don\u0026apos;t think she will cause any more trouble for the teachers or the school.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026#x2026;!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe almost blurted something out impulsively, showing her true feelings.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThough, perhaps she couldn\u0026apos;t hold back after all. She grabbed my shoulders and started opening her mouth.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is it really because of me? Because I was troubled with Chie\u0026apos;s problem\u0026#x2026; Did you sacrifice yourself to solve it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I thought you might think that way, Chabashira-sensei. But don\u0026apos;t worry. I had intended to transfer classes even before Hoshinomiya-sensei\u0026apos;s issue came up.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe looked into my eyes, trying to ascertain whether it was the truth.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, she couldn\u0026apos;t dispel the concern that I was covering things up with a lie.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eStill, she should\u0026apos;ve understood that I had no hesitation and not a trace of regret.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It doesn\u0026apos;t seem like you\u0026apos;re simply being considerate\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. I had narrowed it down to either Class C or Class D early on. It wasn\u0026apos;t because I had complaints about the teacher or the class.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What\u0026apos;s the reason then? Why do something so meaningless\u0026#x2026;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Whether it\u0026apos;s meaningless or not depends on how you see things. You know I\u0026apos;m not obsessed with graduating from Class A, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This transfer is entirely for my own sake. I judged that it\u0026apos;d be difficult to accomplish what I need to do in this school while remaining in your class. However, I will not disclose what that task is here.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith this much said, she could understand that the transfer was intentional.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, I wouldn\u0026apos;t provide excessive details.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eChabashira-sensei might unexpectedly share this conversation with Horikita and others.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026#x2019;s about time for me to head to the gym, so I\u0026apos;ll be excusing myself.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs a teacher, she probably couldn\u0026apos;t probe any further.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe nodded quietly, trying hard to control her expression.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Understood. I see\u0026#x2026; sorry for taking your time.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI left Chabashira-sensei standing there and headed to the gym on the second floor.\u003c/p\u003e\u003chr class=\"footnote-rule\"/\u003e\u003col class=\"footnotes\"\u003e\u003cli data-id=\"4bdf3471-acf9-55ee-808c-b3037205dfa4\" data-ref=\"1\" class=\"footnote first-footnote\" id=\"fn-1-4bdf3471-acf9-55ee-808c-b3037205dfa4\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003ca class=\"footnote-backref\" href=\"#fnref-1-4bdf3471-acf9-55ee-808c-b3037205dfa4\"\u003e[1]: \u003c/a\u003eFor those who don\u0026apos;t remember, \u0026quot;paisen\u0026quot; is Housen\u0026apos;s informal way of saying the honorific, \u0026quot;senpai.\u0026quot;\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 1\",\"volumeId\":\"y3v1\",\"chapterIndex\":22,\"prevChapter\":{\"volumeId\":\"y3v1\",\"chapter\":21,\"title\":\"Chapter 4: An Onlooker's Perspective \"},\"nextChapter\":{\"volumeId\":\"y3v1\",\"chapter\":23,\"title\":\"Part 2\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 1\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: The End of Everyday Life\",\"href\":\"prologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Confusion\",\"href\":\"chapter-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"chapter-1-part-1.xhtml\",\"index\":12},{\"la
