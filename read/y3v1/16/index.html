e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T2d82,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 1\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAFTER RECEIVING AN explanation from Mashima-sensei regarding the schedule and classes from tomorrow onward, the school day would come to an end.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor third-year students, the way we\u0026apos;d use our time would likely change significantly compared to the previous two years.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBeing one of the turning points in life, third years had to decide on their future paths by around summer and start taking action alongside everyday school life. Though, it was irrelevant for those who had already decided on their path, or for a few students like me, whose paths were already set even without requiring any intervention.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If there are no particular questions, then this homeroom period is\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMashima-sensei began to conclude the class. Since the others weren\u0026apos;t informed about my transfer to Class 3-C until the last minute, there was a possibility that Class 3-A students, including Horikita, might swarm in.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, I wouldn\u0026apos;t panic and run away.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter all, I was bound to be confronted somewhere in the future.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eStill, such a commotion here could lead to some unexpected issues.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt\u0026apos;d be safer to change locations before that happened.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBesides, I had a meeting with a certain student afterward.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs the homeroom period was declared over, I was about to stand up. However, having pulled his chair out prematurely, it was Hashimoto who stood up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Kay. So, how about we all throw a welcome party for Ayanokouji at Keyaki Mall and make it flashy?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was his proposal to his classmates.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, immediately after, the classroom was enveloped in a tense atmosphere.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI\u0026#xa0;quietly and discreetly lowered my hips, which had begun to rise, back onto the chair.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMashima-sensei, who was about to leave the classroom, also stopped and turned back to check his students\u0026apos; reactions.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor a few seconds, no one said anything during that silent time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was Yoshida who broke the silence.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sorry, but I\u0026apos;m against it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe stated his refusal flatly, with minimal emotion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;C\u0026#x2019;mon now, why would you say that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto, who had his spirits dashed, slumped his shoulders in an overexaggerated way.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Think about how Ayanokouji would feel, being left out and ignored right away by his new buddies.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eBeing left out\u0026#x2014;is that going to be the case?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor now, I tried to think about how that would feel.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026#x2026;Well, at least it wouldn\u0026apos;t feel good\u0026#x2026; I think.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was bothersome not because I wasn\u0026apos;t welcomed, but because the classroom atmosphere soured over a topic involving me, and it felt complicated watching as a bystander.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince I hadn\u0026apos;t expected a proposal for a welcome party without having built any relationships, there was nothing to do but watch after such a statement had been made.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBecause of my position, I couldn\u0026apos;t just say \u0026apos;please do it\u0026apos; or \u0026apos;I refuse.\u0026apos;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003ePersonally, it would\u0026apos;ve been best if things had continued as usual\u0026#x2026;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto\u0026apos;s actions were out of consideration for me, so I couldn\u0026apos;t blame him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not that we\u0026apos;re rejecting Ayanokouji. It\u0026apos;s because we\u0026apos;re prepared to welcome him that we all contributed Private Points to support the class transfer. But you understand that it\u0026apos;s not easy to genuinely welcome him, right? Now that we\u0026apos;ve fallen to Class C, we can\u0026apos;t afford to fail any special exams from now on. First, it\u0026apos;s necessary for us to see results that prove he\u0026apos;s a valuable ally. If that happens, we\u0026apos;ll acknowledge Ayanokouji as a comrade and welcome him without you having to say anything, Hashimoto.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHaving stated the reason for refusing the welcome party, Yoshida stood up from his seat.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I agree too. He hasn\u0026apos;t done anything yet, and there\u0026apos;s even a possibility that he\u0026apos;s a spy, so I don\u0026apos;t feel like putting on a forced smile and having a welcome party.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFollowing that, Machida also expressed his opinion, and one after another, the Class C students began to leave.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Seriously\u0026#x2026; this is tough.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter scratching his head, Hashimoto turned towards me and made a slight gesture of apology, but I gestured back that I wasn\u0026apos;t bothered.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOne by one, the students left, and soon, only a few remained in the classroom.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlthough it was partly because we\u0026#x2019;d been enemies up until now, I hadn\u0026apos;t actively interacted with this class\u0026apos;s students. Among those who remained were Hashimoto, Morishita, Yamamura, and Sanada\u0026#x2014;members with whom I\u0026#x2018;d started to form some connections through events.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eConversely, it meant that almost nobody else was left.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ayanokouji Kiyotaka, you\u0026apos;re spectacularly unpopular. It\u0026apos;s like you\u0026apos;re leftover merchandise.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s natural that they can\u0026apos;t welcome me wholeheartedly.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;True, but if the transfer student had been someone like Ichinose Honami, Kushida Kikyou, or Hirata Yousuke, would the same thing have happened?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI imagined what\u0026apos;d happen if the students she listed were the ones in my position.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven a brief thought brought a clear scene to mind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even if it wouldn\u0026apos;t be everyone, they would\u0026apos;ve been surrounded by smiles, welcoming the newcomer.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;Well\u0026#x2026; maybe.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not \u0026apos;maybe,\u0026apos; it\u0026apos;s true. Being too reserved in your assessment is a bit stingy, isn\u0026apos;t it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe relentlessly shattered even the slightest possibility of a future where that wouldn\u0026apos;t happen.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In other words, the fact that you are unpopular is undeniably true, Ayanokouji Kiyotaka.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA harsh accusation. I couldn\u0026apos;t deny it even if I wanted to.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You should start by accepting that reality.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That seems like a good idea\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSomehow, I might\u0026apos;ve felt a bit sentimental.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs\u0026#xa0;Morishita\u0026apos;s remarks continued to echo in my ears, Yamamura and Sanada also left with looks of apology.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter seeing them off, Hashimoto approached and tapped me on the right shoulder.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sorry, Ayanokouji. Our numbers might\u0026apos;ve decreased a bit, but let\u0026apos;s have a welcome party.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Who\u0026apos;s attending?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;For now, it\u0026apos;s just me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was hardly \u0026apos;a bit,\u0026apos; but I saw no reason to refuse.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIf even one person welcomes me, I\u0026apos;ll start by accepting their welcome.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah, right. You\u0026apos;ll come, right, Morishita? It\u0026apos;s boring without girls.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTrying to invite a second person, Hashimoto called out to Morishita, who was still there.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMorishita responded immediately\u0026#x2026;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, I refuse.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe declined without a moment\u0026apos;s delay.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Come on, don\u0026apos;t refuse. You\u0026apos;re on our side, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Please stop. I don\u0026apos;t want to be associated with a traitor and someone unpopular. I have plans to go on an adventure after school, so excuse me. \u003cem\u003eTaking off\u003c/em\u003e.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe quickly grabbed her bag, stood up, and left the classroom at a brisk pace.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNow, only a few students, both male and female, remained in the classroom.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe girl sitting next to me had been looking our way, but she stood up when her eyes met Hashimoto\u0026apos;s.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed inevitable that the welcome party would be between just the two of us.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;By the way, what exactly does she mean by \u0026apos;adventure\u0026apos;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t worry about it, man. You should only listen to about half, no, maybe one-fifth of what Morishita says. Taking her seriously is just a waste of time.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile expressing his astonishment, he gently pushed my back and started walking.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This depressing atmosphere isn\u0026apos;t good for the body. Let\u0026apos;s move, shall we?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBeing led by Hashimoto, I left the classroom.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 1\",\"volumeId\":\"y3v1\",\"chapterIndex\":16,\"prevChapter\":{\"volumeId\":\"y3v1\",\"chapter\":15,\"title\":\"Chapter 3: The Commencement of a One-Year Period\"},\"nextChapter\":{\"volumeId\":\"y3v1\",\"chapter\":17,\"title\":\"Part 2\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 1\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6
