e\u003c/p\u003e\u003cp class=\"paragraph\"\u003e\u0026quot;I gotta be the biggest Anime Anyway hater in LegacyEMTLs\u0026quot;\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003eF2P2W - Lead / Head Editor\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\"\u003e\u0026quot;Please don\u0026apos;t actually send hate to anime anyway... Besides that, persimmons are bomb.\u0026quot;\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003eJ\u0026#xe9;ra - JE Checker / Editor\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\"\u003e\u0026#x300c;\u0026#x4eca;\u0026#x5bb5;\u0026#x306e;\u0026#x6050;\u0026#x6016;\u0026#x5287;\u0026#x3092;\u0026#x59cb;\u0026#x3081;\u0026#x3088;\u0026#x3046;\u0026#x300d;\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003eIchinose Honami - JE Checker\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\"\u003e\u0026quot;If anime anyway gets less than 1000 views by Y3V6 I\u0026apos;ll flash on a colored illustration\u0026quot; \u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003eKall - Editor\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\"\u003e\u0026quot;I don\u0026apos;t like expending more effort than I have to - Anime Anyway (Probably)\u0026quot;\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003eECA - Editor\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\"\u003e\u0026quot;skibidi toilet, skibidi toilet, ts pmo\u0026#x1f494; \u0026quot;\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003eMika - Editor\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\"\u003e\u0026quot;Quis ut Deus\u0026quot;\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003eSky - Editor\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\"\u003e\u0026quot;Shoutout to the team for the hard work, enjoy the read.\u0026quot;\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003eHiyori\u0026apos;s Only Lover - Editor\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\"\u003e\u0026quot;Why is Hiyori\u0026apos;s name only mentioned once??? Arcangel Pa\u0026quot;\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003eUnknown - Editor\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\"\u003e\u0026quot;Ayano the rizzler\u0026quot;\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003eBigFaulty - Illustrator\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\"\u003e\u0026quot;Inchinose\u0026gt;\u0026gt;\u0026gt;\u0026quot;\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003eFZ - Illustrator\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\"\u003e\u0026quot;CoMiC sAnS iS sUpErIoR\u0026quot;\u003c/p\u003e\u003c/div\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Author's Afterword\",\"volumeId\":\"y3v1\",\"chapterIndex\":46,\"prevChapter\":{\"volumeId\":\"y3v1\",\"chapter\":42,\"title\":\"Part 2\"},\"nextChapter\":\"$undefined\",\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 1\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"ind
