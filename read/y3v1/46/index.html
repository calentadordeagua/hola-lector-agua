e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince the day before, that place had become a certain student\u0026apos;s seat.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom Class 1-D to Class 3-A.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd then from Class 3-A to Class 3-C.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat person\u0026apos;s true intentions remained unclear.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eDid he decide to transfer to become a savior, or is there still a side to him we haven\u0026apos;t seen?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEither way, for Shiraishi, this was a matter beyond her expectations.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This is troubling, isn\u0026apos;t it?\u0026#x201c;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOnly after speaking these words did she realize she\u0026#x2019;d been troubled.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWhat do I want?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNow that she knew about Ayanokouji\u0026#x2019;s transfer, and that fact was seeping into reality, she needed to think.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAn inexpressible emotion\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo, that wasn\u0026apos;t accurate.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe understood, but pretended not to.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;There\u0026#x2019;s a\u0026#x2026; mountain of problems, isn\u0026#x2019;t there?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eStarting up her tablet, she grabbed the pen and began to draw a person.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe very person at the center of this commotion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat kind of expression, what kind of gesture would be better\u0026#x2014;she didn\u0026#x2019;t really know the answers to these questions yet.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom now on, throughout the upcoming school year, she\u0026apos;d surely become better and better at drawing him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe\u0026apos;d surely hear his voice, and come to know.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, but that\u0026apos;s\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe was thinking about it again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe had to avoid thinking about it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eThis secret\u0026#x2026; these feelings mustn\u0026apos;t be known to others.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi made a mental note of this.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEmotions she abandoned years ago.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWhy, now of all times, is this happening?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;I am\u0026#x2026; foolish, aren\u0026#x2019;t I?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eImmediately after she uttered these words of self-reproach to herself, she reacted to the sound of the door opening, and Shiraishi was surprised to see someone unexpected standing at the entrance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Good morning.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat person spotted Shiraishi and greeted her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Good morning to you, too.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter returning the greeting, Shiraishi calmed herself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe deleted the half-finished drawing on her tablet with natural motion and pretended to study.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I didn\u0026apos;t expect someone to be here already. You\u0026apos;re rather early.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;Yes, I woke up unusually early today. But you\u0026apos;re early too, Ayanokouji-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Since I\u0026apos;ve switched classes, it\u0026apos;s like I\u0026apos;m a transfer student from a different school. Rather than being welcomed, I thought it\u0026apos;d be better to be the one doing the welcoming.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s an interesting coincidence\u0026#x2014;two people who are early risers sitting next to each other in such a large, empty classroom.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Maybe.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe had a voice with little inflection.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven so, it wasn\u0026apos;t as though it was completely devoid of emotion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi listened intently, letting Ayanokouji\u0026#x2019;s voice seep into her body, familiarizing it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSilence fell upon them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWanting to hear more of his voice, Shiraishi spoke to him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why did you decide to transfer to this class, Ayanokouji-kun?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi continued after a short pause.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I can\u0026apos;t believe you\u0026apos;d choose to drop to a lower class after finally making it to Class A.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That might be true under normal circumstances.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe was ever so calm.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOr perhaps it was to hide his emotions.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt his voice, as elusive as clouds, Shiraishi almost wore her delight on her sleeves.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If it\u0026apos;s not normal, then\u0026#x2026; why did you decide to transfer?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBecause of that, she couldn\u0026apos;t help but continue.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven while knowing she shouldn\u0026apos;t overstep, she ended up doing so.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile faintly recalling her own bitter past.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile deeply reflecting that she must never repeat her mistakes.\u003c/p\u003e\u003ch1 class=\"heading_1\"\u003e\u003ca class=\"heading-link\" href=\"/read/y3v1/2\"\u003eMorishita Ai\u0026#x2019;s Short Story:\u003cbr/\u003eGatling Gun\u003c/a\u003e\u003c/h1\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e(Original translation provided by \u003c/em\u003e\u003ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.google.com/url?q=https://www.reddit.com/user/AdventurousArt8711/\u0026amp;sa=D\u0026amp;source=editors\u0026amp;ust=1744494178426832\u0026amp;usg=AOvVaw1D8XSzoQ-VE57k7sYnirSf\"\u003e\u003cem\u003eDrago\u003c/em\u003e\u003c/a\u003e\u003cem\u003e, edited by LegacyEMTLs)\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTHIS WOULD BE a life-or-death battle. I firmly resolved myself for this.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eTo end this war, I must pull the trigger.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eFire\u0026#x2014;!\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eImmediately following this declaration in my mind, I shot a large bullet (eraser shaving) with my right index finger, flying out in a straight line.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe target was the evil titan sitting before my eyes, Ayanokouji Kiyotaka\u0026#x2014;the back of his head.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eImpact!\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe first shot hit near the crown of his head.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIt seems that firing just one shot isn\u0026apos;t enough to inflict damage after all.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI, the commander, placed multiple bullets (eraser shavings) I had prepared in advance on my palm.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eAllow me to show you our army\u0026apos;s strongest weapon. Gatling gun\u0026#x2014;unload!\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis time, I fired multiple pieces of eraser shavings (bullets) in rapid succession.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was certain I had to be causing damage to the target\u0026#x2026;!\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as I was attempting to confirm the extent of the damage, the target in question, the titan, began to move and turned around.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What is it?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had asked in response.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, I had accounted for the opponent noticing my attack.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy abundance of combat experience wasn\u0026#x2019;t just for show, you know.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, I mean\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Looking behind you during class, even during the self-study period, is something only a naughty, naughty student would do. Please face forward and focus on what you have to do.\u0026#x201d;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter I made him face forward, though he appeared a bit troubled, he soon seemingly returned to his studies.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWell then, shall we resume the attack?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTap-tap. As I fired the Gatling gun again, the enemy, now on higher alert, turned around even more vigorously than I had accounted for.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eKuh\u0026#x2026; While I hid the eraser properly, it\u0026#x2019;d be great if he hadn\u0026#x2019;t found out, but\u0026#x2026;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Staring at my face from such a close distance, what a pervert.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo divert attention from my left hand clutching the eraser, I responded to change the subject.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I have no such intention. Are you doing something to the back of my head?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Not at all? I\u0026apos;m seriously engaged in the class.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI somehow managed to live another day. I needed to defeat him while I was still able to somehow keep the damage received to a minimum.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026#x2026;However, at that time, I had no way of knowing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat actually, it wasn\u0026#x2019;t only Ayanokouji Kiyotaka, there was another enemy beside him\u0026#x2026;\u003c/p\u003e\u003ch1 class=\"heading_1\"\u003e\u003ca class=\"heading-link\" href=\"/read/y3v1/2\"\u003eShiraishi Asuka\u0026apos;s Short Story:\u003cbr/\u003eAn Extra Pair of Ears\u003c/a\u003e\u003c/h1\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e(Original translation provided by \u003c/em\u003e\u003ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.google.com/url?q=https://www.reddit.com/user/AdventurousArt8711/\u0026amp;sa=D\u0026amp;source=editors\u0026amp;ust=1744494179490498\u0026amp;usg=AOvVaw07I5IFd6d0TVHVV98qZ5ox\"\u003e\u003cem\u003eDrago\u003c/em\u003e\u003c/a\u003e\u003cem\u003e, edited by LegacyEMTLs)\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePRESSING MY PHONE to my right ear, I closed my eyes and calmed my mind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You know what I mean. The \u0026apos;Hundred-Man Slayer\u0026apos; Asuka\u0026#x2014;you\u0026apos;ve heard that nickname, haven\u0026apos;t you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyouko-san\u0026apos;s clear, high-pitched voice was always pleasant to hear, wasn\u0026apos;t it?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;That rumor\u0026apos;s real\u0026#x2026;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course. It\u0026apos;s not the type of story that spreads if it\u0026apos;s a lie.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYoshida-kun\u0026apos;s voice\u0026#x2014;I didn\u0026apos;t dislike it, but it was flat and uninteresting.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It wasn\u0026#x2019;t a hundred friends?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the next moment, reacting to Ayanokouji-kun\u0026apos;s voice reaching my ears, I slowly opened my eyes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Aah\u0026#x2026; It\u0026apos;s this voice after all, isn\u0026apos;t it\u0026#x2026;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs if my body were shivering with excitement, it ran from my ears to my brain, then throughout my entire body.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA voice, clinical and colorless, devoid of emotion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA voice most unsuitable for observation, one impossible to analyze.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eYet, I wonder why it makes my heart race so much.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIs it because his true nature is so beyond conventional thought?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhether it be violence or domination, cunningness or vileness, he executed everything with that voice.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I-I already said I\u0026apos;m not interested!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSo much so that Yoshida-kun\u0026apos;s voice, which I shouldn\u0026apos;t have disliked, suddenly felt like a racket.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had become entranced by his voice.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Does that \u0026apos;Hundred-Man Slayer\u0026apos; expression change to the \u0026apos;Two-Hundred-Man Slayer\u0026apos; when it reaches two hundred?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat impression he had of me\u0026#x2014;I wanted to know his sentiments.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhether it was praise or condemnation, either was fine.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003ePlease tell me with that wonderful voice.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ve come to respect her. It\u0026apos;s honestly amazing for someone my age to be involved with a hundred people.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Eh? Is that what you really think\u0026#x2026;? It really does seem like you feel that way, huh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Isn\u0026apos;t a specialist in any field worthy of respect? Sorry to bring up my previous class, but it\u0026apos;s like Sudou in basketball, Onodera in swimming, or Inogashira in sewing.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;As expected, your way of thinking is wonderful, Ayanokouji-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile feeling it was a shame to temporarily part, I reluctantly removed the phone from my ear.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI couldn\u0026apos;t hold myself back anymore.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eFrom here on out, allow me to hear your voice not through the phone, but directly in person.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sakayanagi-san. Please leave the rest to me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eGetting up from the sofa, I decided to head outside where he waited.\u003c/p\u003e\u003ch1 class=\"heading_1\"\u003e\u003ca class=\"heading-link\" href=\"/read/y3v1/2\"\u003eIbuki Mio\u0026apos;s Short Story:\u003cbr/\u003eConcern?\u003c/a\u003e\u003c/h1\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e(Original translation provided by \u003c/em\u003e\u003ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.google.com/url?q=https://www.reddit.com/user/AdventurousArt8711/\u0026amp;sa=D\u0026amp;source=editors\u0026amp;ust=1744494180457978\u0026amp;usg=AOvVaw0BI_nf5S9kLVnFsxbsTTst\"\u003e\u003cem\u003eDrago\u003c/em\u003e\u003c/a\u003e\u003cem\u003e, edited by LegacyEMTLs)\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIBUKI HAD A lingering frustration she\u0026apos;d been carrying.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe defeat in the special exam, Ryueen\u0026apos;s strategy being seen through by Ayanokouji being used\u0026#x2014;it was neither of these reasons.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo, while those were frustrating, there was something else\u0026#x2026; an even greater frustration.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was Horikita Suzune.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen she heard Horikita had become dispirited learning of Ayanokouji\u0026apos;s transfer, she held her stomach and laughed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut that joy didn\u0026apos;t last long, and gradually, she began to feel stressed. It was because Horikita had stopped cooking and abandoned her duty of supporting and maintaining her, the cash-strapped Ibuki\u0026apos;s, stomach\u0026apos;s peace and stability.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRegardless of whether Ibuki visited her room or called her, she received no proper response.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd today, Class A had been defeated in the special exam.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile this was good news for Ibuki\u0026apos;s class, personally, she couldn\u0026apos;t honestly be happy about it. Horikita would only become more dejected.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSo, who knew when Horikita would be able to provide meals for her again?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;Why do I have to act so considerate?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was after school. Growing irritated with Horikita, who hadn\u0026apos;t emerged from the school building, Ibuki paced back and forth near the entrance, waiting. Once she came out, she\u0026apos;d give her a sharp stimulus to cheer her up, and then make her cook.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSuch one-sided thoughts ran laps inside her mind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut no matter how long she waited, there was no sign of Horikita coming out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe\u0026apos;d gone to check the shoe lockers once, but Horikita\u0026apos;s shoes were still there, so she hadn\u0026apos;t gone home.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Come out already. How concerned do you plan to make\u0026#x2026; no, no, I\u0026apos;m not concerned.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen a strange emotion surfaced, she pushed it out of her mind. Her thoughts were getting weird because she hadn\u0026apos;t eaten anything delicious for a while. That was her conclusion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter that, perhaps another thirty minutes of going back and forth in the same place\u0026#x2026;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah\u0026#x2026; she\u0026apos;s coming out.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHorikita, whom she\u0026apos;d been waiting for, finally emerged from the school building.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe looked lifeless from behind, and as expected, Ibuki couldn\u0026apos;t feel a speck of spirit or vigor.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026apos;You shouldn\u0026apos;t kick anyone, but if you absolutely must kick someone, then I suppose there\u0026#x2019;s no other choice than to find someone who would enjoy being kicked or someone who would benefit from being kicked. If such an odd person exists, that is.\u0026apos;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs she stared at her back, Ibuki remembered what Katsuragi had once told her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBy the time she recalled it, she was already running on impulse.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe only thing she could do right now\u0026#x2014;that is, to deliver a merciless kick to Horikita\u0026apos;s back.\u003c/p\u003e\u003ch1 class=\"heading_1\"\u003e\u003ca class=\"heading-link\" href=\"/read/y3v1/2\"\u003eGuidebook Short Story:\u003cbr/\u003eA Pillar of Support\u003c/a\u003e\u003c/h1\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAS 1 AM on Thursday night approached, I, Hasebe Haruka, was seated in front of my computer, quietly waiting for the moment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was thinking about Ayanokouji-kun\u0026apos;s class transfer.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe looked the same as always at the victory celebration at the end of spring break.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut I couldn\u0026apos;t tell what was in his heart.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDays had passed since the opening ceremony, and the class was still in chaos, with many unable to grasp the situation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven Horikita-san hadn\u0026apos;t been informed about the transfer.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eCould it be\u0026#x2026;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;My fault?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI couldn\u0026apos;t help but think so.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI resented Ayanokouji-kun because Airi had been expelled.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI thought he had trampled on her feelings and those of our group.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t know Ayanokouji-kun\u0026apos;s true intentions.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut to survive in this school, sacrifices sometimes had to be made.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI thought I had learned that much.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wasn\u0026apos;t particularly surprised that Ayanokouji-kun had chosen to transfer.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;How arrogant of me, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t because I saw Ayanokouji-kun as an enemy or wanted to start over with the group.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t as if I got tired of such convenient excuses.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAyanokouji-kun wouldn\u0026apos;t transfer for such reasons.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSurely, it was beyond my understanding.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe must\u0026apos;ve had his own reasons.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt 1 AM, my computer screen automatically changed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA cheap title appeared, and two male hosts were shown amid the audience\u0026apos;s applause.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA comedy duo that was becoming a bit famous.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDespite having school in the morning, this was why I stayed up late.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe online show \u0026apos;Idol in the Making\u0026apos;\u0026#xa0;was broadcast every Thursday at this time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIdols were invited to the studio, where they tackled topics presented by the show while participating in an online popularity vote. Every two months, the top-ranked participant would graduate from the show and secure new work.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eConversely, the lowest-ranked would drop out and be replaced by a new candidate.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed to be a long-running show, having passed its third anniversary.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had only started watching it a few months ago.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo see the idol in the making who had joined the show.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTheir numbers were pinned on their chests in order of age.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy favorite idol was wearing the number nine.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026quot;Let\u0026apos;s get right to it and announce the first topic! Ta-da! The steaming hot oden reaction battle!\u0026quot;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA crudely written flip chart was turned over.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eLast time, when she first appeared on an online show, she was barely known. However, she had managed to secure sixth place in the popularity vote, which was a promising start.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer conversational skills were admittedly not great, but her earnestness and dedication to every challenge had captured some fans\u0026apos; hearts.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI watched the screen intently, waiting for her turn.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe nervously watched the previous idols\u0026apos; reactions.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is it okay if I talk a little?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI started muttering to myself and continued.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah, that\u0026apos;s right. He transferred.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis was also a monologue. Knowing it wouldn\u0026apos;t reach her, I spoke to the girl through the screen. A considerable amount of time had passed since we last met.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut her feelings on the other side of the screen hadn\u0026apos;t changed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI remembered last week\u0026apos;s topic.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026apos;Please confess who your first love was.\u0026apos;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe confessed her true feelings with a shy expression.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was about someone she met in her first year of high school, and whom she still had a crush on.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom the outside, it could\u0026apos;ve seemed like a painful event, a past she wouldn\u0026apos;t want to remember.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYet, instead of being gloomy, that girl had started walking forward.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI, who should\u0026apos;ve been leading and holding her hand, was left behind before I knew it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe was helping me. From afar, she waved and smiled at me, telling me to walk.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen I had to walk.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs a friend worthy of her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eStill, her impulsive remarks were risky and made everyone around her panic.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs an idol, admitting to having a crush was still immature.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut that was okay.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBecause she was still an idol in training.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd a crush is still safe, right?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Maybe you should\u0026apos;ve shown this side of yourself to Ayanokouji-kun sooner...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer striving figure.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer bright smile.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKnowing this, could it have changed Ayanokouji-kun\u0026apos;s feelings about his class?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;No.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eProbably not.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn Ayanokouji-kun\u0026apos;s heart, her presence must\u0026apos;ve vanished.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf it were to sprout again, it would be after zero turned into one.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNot the zero from Advanced Nurturing High School, when you couldn\u0026apos;t do anything.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut the idol who was fighting hard on the other side of this screen, transformed into one.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wish she could say this back then\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026apos;Thanks to that time, I\u0026apos;ve become stronger. I\u0026apos;m not interested in you anymore, though.\u0026apos;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen, even Ayanokouji-kun would be taken aback.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No\u0026#x2026; she wouldn\u0026apos;t say something like that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe would definitely show her sincere gratitude.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNot as a two-faced idol, but as a clumsy idol who only fought honestly and directly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Keep going\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI cheered her on through the screen.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eNow, I can only see her through the screen. She can\u0026apos;t hear my voice.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eMy voice won\u0026apos;t reach her.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eBut I won\u0026apos;t stop.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Keep going\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOver and over.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI\u0026apos;d keep cheering.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll also work hard for one more year\u0026#x2026; so you won\u0026apos;t laugh at me when we finally meet on the outside, okay?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had long been overtaken by her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSo, no matter what, I must not stop.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had to chase after her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNow wasn\u0026apos;t the time to be discouraged by Ayanokouji-kun\u0026apos;s actions.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eLet\u0026apos;s work hard together.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eAnd in one year, I\u0026apos;ll definitely go to meet you\u0026#x2014;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Keep going, Airi.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI called her name and smiled at her through the screen.\u003c/p\u003e\u003ch1 class=\"heading_1\"\u003e\u003ca class=\"heading-link\" href=\"/read/y3v1/2\"\u003eGuidebook Short Story:\u003cbr/\u003eMock Date\u003c/a\u003e\u003c/h1\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTHIS STORY TOOK place just before the second-year deserted island exam began.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI, Karuizawa Kei, had made my way to Keyaki Mall after school.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKeyaki Mall was bustling with students at this time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere were those who came to hang out with friends, and others who came to shop or get a haircut, among various other uses.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOr perhaps\u0026#x2026; to go on a date with a lover.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn any case, since we couldn\u0026apos;t leave the school premises, Keyaki Mall was an essential place.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNormally, I would often come here to hang out with my friends.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut\u0026#xa0;today\u0026#x2026; I went alone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere wasn\u0026apos;t anything in particular I wanted to buy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI just wanted to try something experimental.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Phew, I\u0026apos;m kind of nervous.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI muttered to myself as I entered the mall from the north entrance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt had been nearly an hour since school ended, so there were quite a lot of students around.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah, this should be fine.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI reassured myself by looking around at the crowd and walked on.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFirst, as planned, I headed to the general store.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe store itself was small, but there were about four girls inside, browsing various items and enjoying themselves.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWell then.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI held my phone in my hand and wandered around the store.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSoon after, a message arrived on my phone, signaling that everything was ready.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI almost couldn\u0026apos;t contain my smile but held it back and casually looked at the products by myself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNew products circulated every week, so I never got bored, especially with cute phone accessories around.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, I had bought so many recently that my phone strap was becoming heavier than the phone itself, so today, I had to resist.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eResist\u0026#x2026; Resist\u0026#x2026; Maybe I can\u0026apos;t!\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This is cute~\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA strap that had just arrived was extremely cute.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a small kitten with a ribbon.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI took a photo of the product I liked with my phone and sent it, then muttered to myself as I slowly toured the store.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e[Do you like this kind of thing?]\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI smiled at the message that came back and sent, \u003cem\u003e[Surprising?]\u003c/em\u003e\u0026#xa0;and received \u003cem\u003e[A little.]\u003c/em\u003e\u0026#xa0;in reply.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e[I might swoon if my boyfriend gave me something like this\u0026#x2661;]\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was about to send such a message but felt embarrassed and deleted it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eCertainly, I didn\u0026apos;t have the courage to go that far in today\u0026apos;s trial.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNext, the person I was messaging sent a photo, and I excitedly looked at it\u0026#x2026;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e[I thought you\u0026apos;d like this kind of thing.]\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe photo pictured a strap with a skull and crossbones.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e[No, no, that\u0026apos;s not it. Terrible taste. Only middle school boys would use that.]\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd this time, I sent back a slightly mean reply.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSweet talk wasn\u0026apos;t the only important thing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMaybe I should reveal why I was here today.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wandered around the store by myself, but in fact, there was another person walking a different route from me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt went without saying\u0026#x2026; it was my boyfriend, Ayanokouji Kiyotaka. Super cool and both smart and athletic.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIt\u0026apos;s almost as if he stepped out of a manga\u0026#x2026;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Maybe I\u0026apos;m praising him too much\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI corrected myself after saying it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter all, I wasn\u0026apos;t exactly good at relationships.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAhem, anyway, this was a way we could hold a mock date. We would arrive at the meeting place separately and then wander around the store independently.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf someone else heard about it, they would surely ask, \u0026apos;What\u0026apos;s that?\u0026apos; But this was an attempt to enjoy dating while keeping our relationship a secret.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWell\u0026#x2026; I guess people would say, \u0026apos;Just go public with your relationship with Kiyotaka,\u0026apos; but it\u0026apos;s okay for now.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e[What should we do next?]\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e[Can we look around a bit more?]\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter our exchange, I wandered around the store.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYes, nobody noticed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was true. It was because we each came to the store separately and looked at different things.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, I felt happy that he was nearby, but at the same time, I really wanted to talk directly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo communicate with our words, our eyes, and our touching hands. That was the essence of dating I had in mind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter that, we left the general store and killed time by visiting supermarkets and bookstores, changing places and browsing different items.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a fun but lonely date.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t think the attempt was a failure, but it was complicated\u0026#x2026;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI really wanted to date Kiyotaka openly and proudly as soon as possible. Yes, that was what I thought once again, with a renewed conviction.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd then\u0026#x2026;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was around 7:30 that evening.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was watching TV in my room when I sat up at the sound of a knock.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hmm?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t the chime, but a light knock.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wondered who it could be, but I couldn\u0026apos;t hear any voices.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFeeling a bit curious, I opened the front door\u0026#x2026;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was a small paper bag with pink patterns placed on the hallway floor. There was no one around.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFeeling curious, I picked it up and brought it inside.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIt\u0026apos;s for me, right?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBefore opening it, I touched it from the top.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hmm, could this be\u0026#x2026;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had an inkling of what it might\u0026apos;ve been, so I took the item out of the bag\u0026#x2026;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was a small kitten strap with a ribbon.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSeeing it, I couldn\u0026apos;t help but laugh.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;He really is simple-minded.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIf you think something like this will make you popular, you\u0026apos;re totally mistaken\u003c/em\u003e.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI removed all the other straps and attached the kitten strap to my cell phone, smiling.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m not satisfied with just this.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI spent the rest of the day looking at the strap.\u003c/p\u003e\u003ch1 class=\"heading_1\"\u003e\u003ca class=\"heading-link\" href=\"/read/y3v1/2\"\u003eGuidebook Short Story:\u003cbr/\u003eEver Since That Time...\u003c/a\u003e\u003c/h1\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e(Also known as Volume 10.25)\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAFTER THE SURVIVAL and elimination special exam ended, the first break arrived.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI went to the gym without anyone telling me to.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter training alone for a while and sweating it out, I headed to the rest area. Sitting on a chair, partly to cool down, I remembered something and took out my phone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen, I searched for a certain word.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;I see.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI could only be convinced after looking at the article that came up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile admiring the photos in the article alone, I heard\u0026#x2026;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Good morning, Ayanokouji-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Morning.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe ones who appeared in the rest area were Ichinose and Amikura. They seemed to have come to the gym.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh, that\u0026apos;s a cute photo. It\u0026apos;s a red panda, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAmikura squinted and asked, having seen my phone screen.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah. I was just doing some research.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI turned off the screen as if to dodge the question, but Ichinose seemed to have some insight.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is it related to the exam question? Ayanokouji-kun, you got it wrong, didn\u0026apos;t you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was the special exam from the other day.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a memorable moment, so there was no way they would\u0026#x2019;ve forgotten, even if it was about another class.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Now that you mention it, you got the tapioca question wrong too. Are you surprisingly that ignorant of the world?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHearing Ichinose\u0026apos;s words, Amikura also seemed to understand and asked.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I can\u0026apos;t deny it. Probably because I hardly ever watch TV.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI offered the most common excuse, but both of them just smiled wryly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Honestly, I didn\u0026apos;t think not liking TV would backfire like that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is that really the problem? These things garnered quite a buzz on the internet too, didn\u0026apos;t they?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAmikura expressed her doubt; perhaps my not-watching-TV excuse wasn\u0026#x2019;t persuasive enough.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We\u0026apos;ve discovered an unexpected weakness, huh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIchinose chuckled at my confused expression.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRight after, Akiyama, a member of the gym staff, appeared and called out to Ichinose.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere seemed to be a mistake in some paperwork she had filled out, and she was asked to rewrite it, so they both headed toward the counter.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey\u0026#x2019;d probably be back soon, but for the moment, it was just me and Amikura left to ourselves.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFeeling it\u0026#x2019;d be strange to leave just then, I decided to either wait until Ichinose came back or leave on my own once Amikura left.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince we came to the gym together, Amikura probably intended to wait for Ichinose to return as well.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI sat down on a chair, leaving one empty next to me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Honami-chan\u0026#x2019;s really changed, huh? It\u0026apos;s like, unimaginable when you think about how she was like a few months ago\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is that so?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIndeed. Recently, Ichinose started showing a side of herself that she hadn\u0026apos;t before.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut to say it was achieved after only a few months was an exaggeration.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t surprising, as the changes in Ichinose that Amikura mentioned weren\u0026apos;t about the current situation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It was right after our second-year deserted island exam ended, and the second term had just started, I think.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAmikura began to speak, smiling as if recalling something funny.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Back then, Honami-chan seemed unstable, or rather, she was often lost in thought.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The deserted island exam, huh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHearing that, I caught up with Amikura\u0026apos;s story.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was when I received an unexpected confession from Ichinose and told her about Kei.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eConsidering Ichinose\u0026apos;s feelings, it wasn\u0026apos;t surprising that she seemed unstable to others.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Right around that time, a little incident happened in the class\u0026#x2026; Oh, but keep this story between us, okay? Don\u0026apos;t tell Honami-chan.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eI don\u0026apos;t intend to tell, but it felt like this might turn into something I\u0026apos;d have to bear a bit of responsibility for hearing.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t think he had any malicious intentions, but there was a time when a boy in the class accidentally overheard a rumor that Honami-chan might like you. Well, it all started with a message that Honami-chan sent by mistake\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eApps were convenient since you could send messages with just a press of a button. Therefore, it wasn\u0026#x2019;t uncommon to mistakenly send a message to someone other than the intended recipient due to a misclick. Even if you could delete your message, sometimes the message gets seen before it can be retracted.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor a while after the deserted island exam, Ichinose was going through a mentally unstable period.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wouldn\u0026apos;t be surprising if she made a small mistake.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I didn\u0026apos;t see the text myself, but I think it was something like, \u0026apos;I want to calm down and talk. Can we meet in person?\u0026apos; Taken out of context, it sounds quite meaningful, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah, that\u0026apos;s true. So, the classmate Ichinose mistakenly sent her message to was a boy?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Different class. Though, the problem lies in who she accidentally sent it to. That person was Ishizaki-kun, and during the break, he came to our class and boldly asked, \u0026apos;What does this message mean?\u0026apos; while showing the screen.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eApparently, that caused a stir. The fact that the misdirected recipient was Ishizaki meant the message wasn\u0026apos;t taken too seriously, which was a relief, but on the other hand, it was problematic that he thoughtlessly came to check the message with the person involved.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, it wasn\u0026#x2019;t unusual for Ichinose to be on casual messaging terms with Ishizaki.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Honami-chan was flustered but immediately corrected it, telling him it was a missent message. Ishizaki-kun was convinced and went back to his class, but the difficulties was what followed. The fact that it was a mistakenly sent message meant that she intended to send that important message to someone else.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat might\u0026#x2019;ve sparked the rumors among the boys in the class.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But why does that lead to me?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;d understand if you saw it, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor some reason, I was met with a somewhat forceful smile.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, that\u0026apos;s limited to those with sharp intuition\u0026#x2026; The boys started making noise for a different reason. Ayanokouji-kun, maybe it\u0026#x2019;s because your \u0026apos;A\u0026apos; and Ishizaki-kun\u0026apos;s \u0026apos;I\u0026apos; are close in the contact list\u003csup id=\"fnref-1-f822494b-d425-5685-aeba-590125f8ea5a\"\u003e\u003ca class=\"footnote-ref\" href=\"#fn-1-f822494b-d425-5685-aeba-590125f8ea5a\" data-ref=\"1\" epub:type=\"noteref\"\u003e[1]\u003c/a\u003e\u003c/sup\u003e, which is arranged in alphabetical order. There are other names close by, but you and Honami-chan are often seen together\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe accumulation of past events and the missent message to Ishizaki led to such speculation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Honami-chan is always bright and composed, but she gets quite flustered when it comes to matters concerning herself. Maybe she couldn\u0026apos;t come up with a good excuse at that time, and she turned pale with her eyes drawn to the floor.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed to be another difficult situation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSomehow, I could picture the scene at that time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eI can\u0026apos;t tell the truth.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eBut I can\u0026apos;t pin it on just anyone either.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eAnd since I just said it was sent to the wrong person, I can\u0026#x2019;t pretend it never happened.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eEven though I wandered into this myself, it feels like I\u0026#x2019;ve approached a dead end.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Catching sight of the scene, from our point of view, it was very rare to see Honami-chan like that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBasically, Ichinose was a very capable person.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe\u0026#x2019;d usually overcome most things and could resolve situations herself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, as Amikura described, this was a period when she was in poor condition.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We were watching over her for a while, but it gradually started to feel heavy. Boys who didn\u0026apos;t think it was you started to wonder if she was planning to confess to someone.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe couldn\u0026apos;t sort it out by herself, and the situation only worsened with her silence.\u003c/p\u003e\u003cimg src=\"/hola-lector-agua/images/books/y3v1/OEBPS/OcHlfvFSwpskpyHEKQacz.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cp class=\"paragraph after-image\" style=\"text-align: left\"\u003e\u0026quot;How did she get through that predicament?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026#x2019;t easy to imagine Ichinose pulling off a miraculous recovery from there.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Like me, the girls knew who Honami-chan intended to send it to. We secretly discussed how to help and stepped in to support her.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eApparently, they managed to get through the situation by working together.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was a girl who had sought love advice from Ichinose, and she had been thinking of a reply to her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe message was mistakenly sent during that exchange.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe silence was out of consideration for the possibility of it leading back to that girl.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a result of her trying to protect that girl\u0026apos;s privacy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith testimonies from several people, most of the boys immediately corrected their misunderstanding.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There was nothing to do but accept it, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt would be different if the girls were putting on a bad act, making it obvious they were covering for her, but judging from their tone, they must have handled it well.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you responsible for returning Honami-chan back to normal?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I didn\u0026apos;t do anything special. Ichinose just recovered with her own strength.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see\u0026#x2026; but still, thank you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re thanking someone who didn\u0026apos;t do anything?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I just assume you\u0026apos;re being modest. That\u0026apos;s why I\u0026apos;m grateful.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhether I admit it or not, the truth seemed irrelevant.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But why tell me this? Is it because you thought I was the one who helped?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, it\u0026apos;s a different matter.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAmikura had been calm throughout, but her expression stiffened slightly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You can tell if you look, but even now, Honami-chan sees you as someone very special. You\u0026#x2019;re the only one in this school who can have a strong influence on her, that\u0026apos;s why.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI realized that she wasn\u0026apos;t just standing idly by while being friends with Ichinose.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe understood her nature; she knew Ichinose Honami well.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m telling you this because\u0026#x2026; I don\u0026apos;t want you to make Honami-chan sad or hurt her.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe said this with a bit of difficulty, but her words were clear.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t intend to intentionally hurt her, but that\u0026apos;s quite a difficult request.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Right.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAmikura agreed without denying it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course, I understand your position. It\u0026apos;s not about whether you\u0026apos;re dating. I just don\u0026apos;t want her to be unnecessarily hurt.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUpon answering, Amikura chuckled wryly and continued, muttering.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s tough for Honami-chan, falling for a guy who has a girlfriend.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re pretty straightforward, aren\u0026apos;t you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I have a vague idea of you too. I figure you aren\u0026#x2019;t flustered, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Maybe.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if it wasn\u0026apos;t today, Amikura must\u0026apos;ve been planning to have this conversation with me sooner or later.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs gym buddies, a chance to be alone together would\u0026#x2019;ve come at some point.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I understand what you want to say. I\u0026apos;ll deal with it well.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI couldn\u0026apos;t say anything for certain, so I asked for her understanding.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m sorry, it\u0026apos;s not my place to tell you this as a third party.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAmikura knew this, so she didn\u0026apos;t press the issue too hard.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You can\u0026apos;t just abandon her as a friend. It\u0026apos;s not a bad thing.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI showed my understanding, and Ichinose returned.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sorry to keep you both waiting,\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, not at all.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eConsidering it was a conversation that was embarrassing for the person involved, Amikura was momentarily flustered.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIchinose, who had returned, didn\u0026apos;t change her expression at all, but it wouldn\u0026apos;t be surprising if she had realized something with her keen eyes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, she didn\u0026apos;t ask what we were talking about.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMaybe it was just speculation, but perhaps Ichinose didn\u0026apos;t want to make Amikura tell a clumsy lie.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well then, I\u0026apos;m going to head home soon. See you two later.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI said my goodbyes to Ichinose and Amikura and left the gym.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was unexpectedly told about a situation that occurred in Ichinose\u0026apos;s class, but as soon as I stepped outside, I received a message.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e[Were you having another private talk with Mako-chan? About me?]\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe only came to check with me to avoid negatively impacting Amikura.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMoreover, it seemed she was able to guess that we were talking about an issue concerning her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe was probably curious about what we talked about, but I couldn\u0026#x2019;t tell her because of the promise I made to Amikura.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e[Looks like you\u0026apos;ve got a good best friend.]\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSo, I decided to reply with that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was nothing to worry about, and it certainly wouldn\u0026apos;t lower Amikura\u0026apos;s position.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIchinose sent back a sticker with an illustration labeled \u0026apos;super happy\u0026apos; in response to my message.\u003c/p\u003e\u003chr class=\"footnote-rule\"/\u003e\u003col class=\"footnotes\"\u003e\u003cli data-id=\"f822494b-d425-5685-aeba-590125f8ea5a\" data-ref=\"1\" class=\"footnote first-footnote\" id=\"fn-1-f822494b-d425-5685-aeba-590125f8ea5a\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003ca class=\"footnote-backref\" href=\"#fnref-1-f822494b-d425-5685-aeba-590125f8ea5a\"\u003e[1]: \u003c/a\u003eThe Japanese \u0026#x201c;Alphabet\u0026#x201d; is ordered by the Gojuuon\u0026#x2014;this places the vowels \u0026#x3042;(a) and \u0026#x3044;(i) directly next to each other.\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e\u003ch1 class=\"heading_1\"\u003e\u003ca class=\"heading-link\" href=\"/read/y3v1/2\"\u003eLegacyEMTLs Afterword\u003c/a\u003e\u003c/h1\u003e\u003chr/\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003eHey there, Colibri here.\u003c/p\u003e\u003cp class=\"paragraph\"\u003eJust wanted to say thanks for reading our translation. Countless hours of work and effort went into it and I just wanna say thank you to everyone in the team for being a part of this, and thank you to the reader for supporting us by reading our translation. If you encounter any errors, feel free to report them on our \u003ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.legacyemtls.com/report-error\"\u003esite\u003c/a\u003e. And if you have any comments, you can add them to the comments section of the \u003ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.legacyemtls.com/volume/cote-y3-v1\"\u003eY3V1 page\u003c/a\u003e. Spread our name through word of mouth and feel free to share these files so long as you credit us.\u003c/p\u003e\u003cp class=\"paragraph\"\u003eAnyways, see you next time with Y3V2.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: right\"\u003e\u003cem\u003eColibri\u003c/em\u003e\u003c/p\u003e\u003c/div\u003e\u003cp class=\"paragraph\" style=\"text-align: center\"\u003e\u0026#x22c6;\u0026#x22c5;\u0026#x2606;\u0026#x22c5;\u0026#x22c6;\u003c/p\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003eHi, FS7 here.\u003c/p\u003e\u003cp class=\"paragraph\"\u003eThanks for reading our translation. This is our first new volume release as a TL group so we hope the quality is up to par. We\u0026apos;re planning to redesign some of the mechanisms for translation to make it even better for Y3V2. Also, just like Colibri said, please report any issues to us. We\u0026apos;re very particular about our translations so we\u0026apos;re more than happy to rectify any issues if made aware of them.\u003c/p\u003e\u003cp class=\"paragraph\"\u003eThanks.\u0026#xa0;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: right\"\u003e\u003cem\u003eFS7\u003c/em\u003e\u003c/p\u003e\u003c/div\u003e\u003cp class=\"paragraph\" style=\"text-align: center\"\u003e\u0026#x22c6;\u0026#x22c5;\u0026#x2606;\u0026#x22c5;\u0026#x22c6;\u003c/p\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003eOne more lead here, F2P2W.\u003c/p\u003e\u003cp class=\"paragraph\"\u003eWe spent a lot more effort on this volume compared to our translation of V0 since we\u0026apos;re on a much stricter deadline this time. I\u0026apos;ll say this again, the team is full of people taking on multiple things at once\u0026#x2014;whether that be school, jobs, or personal projects\u0026#x2014;all while working on LegacyEMTLs, so please be kind to the team~\u003c/p\u003e\u003cp class=\"paragraph\"\u003eAlso, you will see a lot of the team bashing Anime Anyway here. Please don\u0026apos;t take it too seriously\u0026#x2026; don\u0026apos;t send hate to anybody. Don\u0026apos;t take our other leads as examples.\u003c/p\u003e\u003cp class=\"paragraph\"\u003eThat being said, we hope to bring good quality reads for those patiently waiting for the Seven Seas official translations! And I hope you all win your 50/50s early pity.\u003c/p\u003e\u003cp class=\"paragraph\"\u003eSigning out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: right\"\u003e\u003cem\u003eF2P2W\u003c/em\u003e\u003c/p\u003e\u003c/div\u003e\u003ch1 class=\"heading_1\"\u003e\u003ca class=\"heading-link\" href=\"/read/y3v1/2\"\u003eLegacyEMTLs Credits\u003c/a\u003e\u003c/h1\u003e\u003chr/\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003eColibri - Lead / Dev\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\"\u003e\u0026quot;Spread your legs\u0026quot;\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003eFS7 - Lead / MTL Dev / Lazy JE Checker\u003c/strong\u003
