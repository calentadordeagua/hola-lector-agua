dn\u0026apos;t particularly like gathering with others.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe just wanted to stand out in the group and be someone superior.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, she still interacted with other classes and other years who knew nothing of her true nature, though she started to do that less often.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was because she was getting increasingly fatigued from continuing her act, as many around her already knew her true nature.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eAh, there goes Kushida pretending to be a good person again.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFacing classmates who looked at her with such emotions, her irritation inevitably grew.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eCompared to her middle school days, she felt that she\u0026#x2019;d matured significantly, and she thought the same for those around her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYet, recently, she\u0026#x2019;d been unable to vent her frustrations.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf her days were to continue without an outlet, she couldn\u0026apos;t bring herself to fake her smile anymore.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ugh, annoying.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs she was leaving, with no one within earshot who\u0026#x2019;d overhear, Kushida spotted a presence. Without holding back, she blurted out a curse.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was Horikita, sitting on a bench with a gloomy expression, looking down.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt would\u0026apos;ve been easy to just walk past, but Kushida stopped in front of Horikita, and slowly, she lifted her face.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Kushida-san\u0026#x2026;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why the questioning tone? I mean, I\u0026apos;m not going to ask what you\u0026apos;re doing here. You\u0026apos;re waiting to bump into Ayanokouji-kun by pretending it\u0026apos;s a coincidence, aren\u0026apos;t you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s not it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, it\u0026apos;s totally obvious. Besides, there\u0026apos;s no coincidental component to it. You\u0026apos;re just incredibly clingy, aren\u0026apos;t you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHorikita, having been hit right on the mark and easily seen through, averted her gaze.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;Could you please leave me alone?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;d like to leave you alone, but I can\u0026apos;t overlook such a gloomy face. If the class leader looks like that, it definitely affects morale.\u0026quot;\u003c/p\u003e\u003cimg src=\"/hola-lector-agua/images/books/y3v1/OEBPS/tSMsiADbYAxPXRADXeWmr.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cimg src=\"/hola-lector-agua/images/books/y3v1/OEBPS/HtcIZCUonVdUyLCWdTkHM.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cp class=\"paragraph after-image\" style=\"text-align: left\"\u003eKushida had her true nature exposed, and she didn\u0026apos;t like Horikita\u0026#x2014;yet, she continued to remain in the same class because Horikita was necessary for her to graduate from Class A. If someone as important as her were to falter, it would lower the odds of success. Kushida certainly wouldn\u0026apos;t welcome that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBefore Horikita could ask anything, Kushida diverted her gaze, alerted by someone approaching from behind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince they were positioned on the way back to the dorm, they saw Yui Ninomiya from Class 3-D who happened to pass by.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Kushida-san, Horikita-san, goodbye~\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah, goodbye Ninomiya-san. Let\u0026apos;s hang out again soon~\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKushida showed a smile, and she continued to smile until Ninomiya was out of earshot.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHorikita, being considerate, watched for a while.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you okay, Kushida-san? With Ayanokouji-kun\u0026apos;s transfer.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Okay? How could I be okay? Without Ayanokouji-kun, this fa\u0026#xe7;ade of a class wouldn\u0026apos;t stand a chance. My chances of graduating from Class A feel completely doomed. Besides, Ayanokouji-kun knows my true nature, so it\u0026apos;s like the information\u0026apos;s already been leaked to the other classes. From here on out, if he deems it necessary, he won\u0026apos;t hesitate to expose me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHorikita remembered the moment she met Ayanokouji after school concluded on the day of the opening ceremony.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe exchanges that\u0026#x2019;d been happening behind the scenes between Ayanokouji and Matsushita, and what was achieved\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey were exposed without a hint of hesitation. Kushida\u0026apos;s fears and predictions were partially correct.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why do you seem so calm then?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I have to pretend to be calm. I\u0026apos;m good at pretending to be a kind person, just like I\u0026apos;m good at pretending to be okay. Unlike someone I know.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince their conversation was taking a while, Kushida decided to start on the caf\u0026#xe9; au lait she\u0026#x2019;d planned to drink after getting home. As it went down her throat, the sweetness started to spread through the air along with the aroma of her coffee.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ugh, so annoying. Can\u0026apos;t you do something about your face? It\u0026apos;s making an ugly person even uglier.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I think I\u0026apos;m acting normally.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If that\u0026apos;s the case, this is pretty severe.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe sighed in exasperation and was about to walk away, but then, she remembered something.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t mind you being a bit pathetic, but can you do something about Ibuki?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;Come to think of it, she\u0026#x2019;s been contacting me quite persistently lately\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Because you aren\u0026apos;t dealing with her, she comes to me asking for something to eat. I told her to eat a set meal of some wild plants, but she\u0026apos;s still dissatisfied. She\u0026apos;s become numb because she used to eat decent quality food for free.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRecently, Horikita had been cooking, and both Ibuki and Kushida had been joining her\u0026#x2014;a routine that lasted more than half the week until spring break ended. However, it suddenly stopped for a week.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m not in the mood to do anything right now.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m not asking you to cook. The special exam is starting, so hurry up and think of something. We can\u0026apos;t lose to Ichinose\u0026apos;s class\u0026#x2014;to the lowest-ranked class.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You say\u0026#xa0;that\u0026#xa0;like it\u0026#x2019;s nothing. Considering the difference in numbers, we\u0026apos;re the ones at a disadvantage\u0026#x2026; aren\u0026apos;t we?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So? Even in these circumstances, a class leader is supposed to win regardless.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHorikita thought that it was a harsh demand, but she was immediately made to understand that it was a reasonable expectation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTaking the initiative to lead meant bearing that responsibility.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s right\u0026#x2026; I think so too.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKushida forcibly returned to adorning a calm expression, putting her mask back on.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even though I know that, it still feels hopeless. Well, I\u0026#x2019;ll be going now. You can wait here for Ayanokouji-kun to come back. But\u0026#x2026; I doubt he\u0026apos;ll care.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe left those cold words behind and tightly gripped her cup as she walked away.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHorikita watched her back for a while, but she eventually got up as Kushida\u0026apos;s figure disappeared into the distance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe last words Kushida left behind were undeniably true.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ambushing him in a place like this\u0026#x2014;doing such a thing\u0026#x2026; there\u0026apos;s no way he\u0026apos;d be happy about it\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven though she\u0026#x2019;d known it from the beginning, she\u0026#x2019;d been playing the part of a pitiful Horikita; a realization sparked by Kushida\u0026apos;s words.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eStill, she couldn\u0026apos;t move forward.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer desire to meet him was genuine.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe wanted to look him in the eye and speak with him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;All I want now\u0026#x2026; is just that\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHorikita apologized to Kushida and her classmates in her heart and decided to go home.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 3\",\"volumeId\":\"y3v1\",\"chapterIndex\":27,\"prevChapter\":{\"volumeId\":\"y3v1\",\"chapter\":26,\"title\":\"Part 2\"},\"nextChapter\":{\"volumeId\":\"y3v1\",\"chapter\":28,\"title\":\"Part 4\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 1\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: The End of Everyday Life\",\"href\":\"prologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Confusion\",\"href\":\"chapter-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"chapter-1-part-1.xhtml\",\"index\":12},{\"label\":\"Chapter 2: Confirmation\",\"href\":\"chapter-2.xhtml\",\"index\":13},{\"label\":\"Part 1\",\"href\":\"chapter-2-part-1.xhtml\",\"index\":14},{\"label\":\"Chapter 3: The Commencement of a One-Year Period\",\"href\":\"chapter-3.xhtml\",\"index\":15},{\"label\":\"Part 1\",\"href\":\"chapter-3-part-1.xhtml\",\"index\":16},{\"label\":\"Part 2\",\"href\":\"chapter-3-part-2.xhtml\",\"index\":17},{\"label\":\"Part 3\",\"href\":\"chapter-3-part-3.xhtml\",\"index\":18},{\"label\":\"Part 4\",\"href\":\"chapter-3-part-4.xhtml\",\"index\":19},{\"label\":\"Part 5\",\"href\":\"chapter-3-part-5.xhtml\",\"index\":20},{\"label\":\"Chapter 4: An Onlooker's Perspective \",\"href\":\"chapter-4.xhtml\",\"index\":21},{\"label\":\"Part 1\",\"href\":\"chapter-4-part-1.xhtml\",\"index\":22},{\"label\":\"Part 2\",\"href\":\"chapter-4-part-2.xhtml\",\"index\":23},{\"label\":\"Chapter 5: Convolution\",\"href\":\"chapter-5.xhtml\",\"index\":24},{\"label\":\"Part 1\",\"href\":\"chapter-5-part-1.xhtml\",\"index\":25},{\"label\":\"Part 2\",\"href\":\"chapter-5-part-2.xhtml\",\"index\":26},{\"label\":\"Part 3\",\"href\":\"chapter-5-part-3.xhtml\",\"index\":27},{\"label\":\"Part 4\",\"href\":\"chapter-5-part-4.xhtml\",\"index\":28},{\"label\":\"Part 5\",\"href\":\"chapter-5-part-5.xhtml\",\"index\":29},{\"label\":\"Chapter 6: School Life in Class C\",\"href\":\"chapter-6.xhtml\",\"index\":30},{\"label\":\"Part 1\",\"href\":\"chapter-6-part-1.xhtml\",\"index\":31},{\"label\":\"Chapter 7: Ayanokouji's Defeat\",\"href\":\"chapter-7.xhtml\",\"index\":32},{\"label\":\"Part 1\",\"href\":\"chapter-7-part-1.xhtml\",\"index\":33},{\"label\":\"Part 2\",\"href\":\"chapter-7-part-2.xhtml\",\"index\":34},{\"label\":\"Part 3\",\"href\":\"chapter-7-part-3.xhtml\",\"index\":35},{\"label\":\"Part 4\",\"href\":\"chapter-7-part-4.xhtml\",\"index\":36},{\"label\":\"Part 5\",\"href\":\"chapter-7-part-5.xhtml\",\"index\":37},{\"label\":\"Chapter 8: Enemies and Allies\",\"href\":\"chapter-8.xhtml\",\"index\":38},{\"label\":\"Part 1\",\"href\":\"chapter-8-part-1.xhtml\",\"index\":39},{\"label\":\"Epilogue: What Awaits Ahead\",\"href\":\"epilogue.xhtml\",\"index\":40},{\"label\":\"Part 1\",\"href\":\"epilogue-part-1.xhtml\",\"index\":41},{\"label\":\"Part 2\",\"href\":\"epilogue-part-2.xhtml\",\"index\":42},{\"label\":\"Author's Afterword\",\"href\":\"authors-afterword.xhtml\",\"index\":43}],\"volumeTitle\":\"Light Novel 3rd Year Volume 1\",\"detailsLink\":\"/select/year-3/y3v1\",\"returnLink\":\"/select\",\"currentSpineIndex\":27,\"nextVolumeLink\":\"/select/year-3/y3v2\"
