ragraph\" style=\"text-align: left\"\u003eI kept repeating the same thing in my mind like a spell.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever\u0026#x2026;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever\u0026#x2026; this\u0026#xa0;was neither a misunderstanding nor a dream.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eThis reality really is happening in real time\u0026#x2026;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wanted to see him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t want to see him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHonestly, I did feel a bit scared about seeing him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was a lie. I was very scared.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was so scared, I couldn\u0026apos;t help it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile continuing the conflict in my mind, I looked at my hands\u0026#x2014;at both of my palms.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey were trembling.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust imagining it made my body tremble.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wanted to stop thinking about it, to reject it entirely.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eBut\u0026#x2026; But still\u0026#x2014;I must confirm Ayanokouji-kun\u0026apos;s true intentions.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI couldn\u0026apos;t just give up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter all, I had yet to hear him speak about his true objectives from his own lips.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wouldn\u0026apos;t be too late to make all the decisions after receiving that confirmation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe might\u0026apos;ve been burdened with something he couldn\u0026apos;t tell us about.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026#x2026;Let\u0026apos;s confirm it.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith only those feelings to rely on,\u0026#xa0;I stood up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;Horikita-san.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs if waiting for me to move, Hirata-kun, who had approached at some point, spoke.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSudou-kun and others were also looking this way.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sorry, but can we talk later? I\u0026apos;m going to meet him now.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eI don\u0026apos;t have the luxury to be distracted by unnecessary chatter right now.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI left without even taking my bag, and with just my phone in hand, I headed to the hallway.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA fair amount of time had passed since the chime signaling the end of the school day rang.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I stepped into the hallway, many students had already started to leave.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eImmediately, I sensed something unusual from the atmosphere of the other classes\u0026apos; students around me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t know whether there had been an announcement from each class\u0026apos;s teachers, but at least, everyone in our year already knew about Ayanokouji-kun\u0026apos;s class transfer.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe curious glances directed at me attested to that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, those glances might\u0026apos;ve held various implications and speculations regarding my class\u0026apos;s situation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe theory that he was sent as a spy to the other class.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe theory that he was exiled from the class.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe theory that he betrayed us.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThose might\u0026apos;ve just been part of the countless baseless rumors and mere speculations flying around.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut that didn\u0026apos;t matter now.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBefore worrying about others\u0026#x2019; thoughts, I didn\u0026#x2019;t even understand the thoughts of my own class, or those belonging to Ayanokouji-kun himself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWithout any regard for manners, I forcefully opened the door to Sakayanagi-san\u0026apos;s\u0026#xa0;former class.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIf he\u0026apos;s still here\u0026#x2014;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was what I was thinking, but\u0026#x2026;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile searching for him, I unconsciously counted the desks.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlthough Sakayanagi-san was supposed to have withdrawn voluntarily, the number of seats hadn\u0026apos;t decreased.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, more importantly, only a few male and female students remained in the classroom, and Ayanokouji-kun wasn\u0026apos;t among them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Tsukasaki-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI approached Tsukasaki-kun, who\u0026#xa0;happened to be nearest.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Do you need something?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You know why I\u0026apos;m here, right? Where is Ayanokouji-kun?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;He left the classroom a few minutes ago. He probably went to Keyaki Mall.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see, thank you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen there was no more need for me to stay here.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I returned to the hallway, I immediately noticed some students smirking.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was clear to them that we were in the midst of trouble, which was unpleasant.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile walking quickly down the hallway, I tried to contact Ayanokouji-kun on my phone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe phone rang, but no matter how long I waited, there was no sign of him answering.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEither he didn\u0026apos;t notice, or he noticed and chose not to answer.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Horikita-san.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was Matsushita-san who called out to me as I was heading toward the stairwell.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sorry, but I\u0026apos;m in a hurry.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I know. You\u0026apos;re going to see Ayanokouji-kun, right? Let me come with you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMatsushita-san lined up beside me, matching my pace without stopping.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why would you come?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;I want to know the reason behind Ayanokouji-kun\u0026apos;s transfer. Just to confirm once more, this isn\u0026apos;t part of your strategy, Horikita-san, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Unfortunately, I have no such plan. Even if transferring him to Ryuuen-kun\u0026apos;s class would make strategic sense, there\u0026apos;s hardly any point in dropping him to Class C. Now that Sakayanagi-san has left, there\u0026apos;s no meaning in joining that class.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;Right. So, Ayanokouji-kun decided to transfer without telling anyone.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t know. Whether someone asked him to, or he was threatened\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eOr perhaps his heart was swayed by a large amount of funds\u0026#x2026;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSuch thoughts crossed my mind, and my brain quickly understood that they were nearly impossible.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt least, he wasn\u0026apos;t the kind of person to be swayed by funds, and it was unlikely that someone of his caliber would decide to transfer just because he was threatened.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was an unpleasant reality I didn\u0026apos;t want to consider.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat meant that, indeed, this transfer was a decision Ayanokouji-kun made on his own.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe worst-case scenario floated to the surface of my mind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Right now\u0026#x2026; I don\u0026apos;t want to talk based on mere speculation. Not until I hear it directly from him. So, it would be better if you wait\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;d like to, but I also want to hear the explanation directly from Ayanokouji-kun. He must have some sort of objective that\u0026apos;ll convince us\u0026#x2026; I want to hear it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eYes, that\u0026apos;s exactly it.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI, too, wanted an answer that would have me convinced.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe didn\u0026apos;t talk about much with me, or rather, to anyone around him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was why he was sometimes misunderstood as incompetent, and some even resented him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut the truth was different.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if he found it troublesome, he cared about the class and lent a hand when we were in need.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was why I was certain that he must\u0026apos;ve had some objective he hadn\u0026apos;t told us about.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eHe must\u0026apos;ve sensed some anomaly or danger in Sakayanagi-san\u0026apos;s\u0026#xa0;former class, which only seemed to be sinking.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eOr perhaps\u0026#x2026; he might\u0026apos;ve received some huge threat.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eThat\u0026apos;s why he went in alone, without telling his allies.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSuch\u0026#x2026; behaviors, like those belonging to a hero in a movie.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, all this speculation contained much of my wishful thinking, but\u0026#x2026;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut that wasn\u0026apos;t the only thing that mattered.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI would\u0026apos;ve wanted him to consult with us.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhatever reason he had for deciding the transfer\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eLeaving the class without saying anything\u0026#x2026; that\u0026#x2019;s just\u0026#x2026; that\u0026#x2019;s just\u0026#x2026;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ayanokouji-kun\u0026#x2026; Why\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026#x2026;Am I really that unreliable?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;Such foolishness\u0026#x2026; \u0026quot; \u003cem\u003e\u0026#x2026;Yes, that\u0026apos;s right.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven as I internally asked myself that question, I couldn\u0026#x2019;t help but let out a bitter smile.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo him, I still must\u0026apos;ve seemed like a child.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t possess the qualifications to stand beside him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was no way he\u0026#x2019;d rely on me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;Horikita-san, are you okay?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m\u0026#x2026; fine.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMatsushita-san looked at me, worried; I wondered if my almost voiceless response reached her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;More importantly, it\u0026apos;s about Ayanokouji-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe class transfer had already been officially decided.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, there was still a good chance that this wasn\u0026apos;t his intention.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf that was the case, I absolutely had to save him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t just me. The whole class had to come together and scrape up Private Points for his sake.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 2: Confirmation\",\"volumeId\":\"y3v1\",\"chapterIndex\":13,\"prevChapter\":{\"volumeId\":\"y3v1\",\"chapter\":12,\"title\":\"Part 1\"},\"nextChapter\":{\"volumeId\":\"y3v1\",\"chapter\":14,\"title\":\"Part 1\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 1\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: The End of Everyday Life\",\"href\":\"prologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Confusion\",\"href\":\"chapter-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"chapter-1-part-1.xhtml\",\"index\":12},{\"label\":\"Chapter 2: Confirmation\",\"href\":\"chapter-2.xhtml\",\"index\":13},{\"label\":\"Part 1\",\"href\":\"chapter-2-part-1.xhtml\",\"index\":14},{\"label\":\"Chapter 3: The Commencement of a One-Year Period\",\"href\":\"chapter-3.xhtml\",\"index\":15},{\"label\":\"Part 1\",\"href\":\"chapter-3-part-1.xhtml\",\"index\":16},{\"label\":\"Part 2\",\"href\":\"chapter-3-part-2.xhtml\",\"index\":17},{\"label\":\"Part 3\",\"href\":\"chapter-3-part-3.xhtml\",\"index\":18},{\"label\":\"Part 4\",\"href\":\"chapter-3-part-4.xhtml\",\"index\":19},{\"label\":\"Part 5\",\"href\":\"chapter-3-part-5.xhtml\",\"index\":20},{\"label\":\"Chapter 4: An Onlooker's Perspective \",\"href\":\"chapter-4.xhtml\",\"index\":21},{\"label\":\"Part 1\",\"href\":\"chapter-4-part-1.xhtml\",\"index\":22},{\"label\":\"Part 2\",\"href\":\"chapter-4-part-2.xhtml\",\"index\":23},{\"label\":\"Chapter 5: Convolution\",\"href\":\"chapter-5.xhtml\",\"index\":24},{\"label\":\"Part 1\",\"href\":\"chapter-5-part-1.xhtml\",\"index\":25},{\"label\":\"Part 2\",\"href\":\"chapter-5-part-2.xhtml\",\"index\":26},{\"label\":\"Part 3\",\"href\":\"chapter-5-part-3.xhtml\",\"index\":27},{\"label\":\"Part 4\",\"href\":\"chapter-5-part-4.xhtml\",\"index\":28},{\"label\":\"Part 5\",\"href\":\"chapter-5-part-5.xhtml\",\"index\":29},{\"label\":\"Chapter 6: School Life in Class C\",\"href\":\"chapter-6.xhtml\",\"index\":30},{\"label\":\"Part 1\",\"href\":\"chapter-6-part-1.xhtml\",\"index\":31},{\"label\":\"Chapter 7: Ayanokouji's Defeat\",\"href\":\"chapter-7.xhtml\",\"index\":32},{\"label\":\"Part 1\",\"href\":\"chapter-7-part-1.xhtml\",\"index\":33},{\"label\":\"Part 2\",\"href\":\"chapter-7-part-2.xhtml\",\"index\":34},{\"label\":\"Part 3\",\"href\":\"chapter-7-part-3.xhtml\",\"index\":35},{\"label\":\"Part 4\",\"href\":\"chapter-7-part-4.xhtml\",\"index\":36},{\"label\":\"Part 5\",\"href\":\"chapter-7-part-5.xhtml\",\"index\":37},{\"label\":\"Chapter 8: Enemies and Allies\",\"href\":\"chapter-8.xhtml\",\"index\":38},{\"label\":\"Part 1\",\"href\":\"chapter-8-part-1.xhtml\",\"index\":39},{\"label\":\"Epilogue: What Awaits Ahead\",\"href\":\"epilogue.xhtml\",\"index\":40},{\"label\":\"Part 1\",\"href\":\"epilogue-part-1.xhtml\",\"index\":41},{\"label\":\"Part 2\",\"href\":\"epilogue-part-2.xhtml\",\"index\":42},{\"label\":\"Author's Afterword\",\"href\":\"authors-afterword.xhtml\",\"index\":43}],\"volumeTitle\":\"Light Novel 3rd Year Volume 1\",\"detailsLink\":\"/select/year-3/y3v1\",\"returnLink\":\"/select\",\"currentSpineIndex\":13,\"nextVolumeLink\":\"/select/ oom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"15\",{\"name\":\"twitter:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"link\",\"16\",{\"rel\":\"icon\",\"href\":\"/hola-lector-agua/icon.svg?icon.ae5abf30.svg\",\"sizes\":\"any\",\"type\":\"image/svg+xml\"}],[\"$\",\"$L14\",\"17\",{}]]\n"])</script></body></html>
