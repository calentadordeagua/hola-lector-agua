e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T66c1,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 2\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAFTER SCHOOL, AYANOKOUJI quickly left the classroom. Having seen him off, Morishita immediately stood up and, with a pen in her hand, forcefully jabbed Hashimoto\u0026apos;s left shoulder, who\u0026#x2019;d been looking down at his phone as he sat at his desk. It was more of a stab than a jab. Hashimoto, grimacing in pain, turned around. Morishita signaled with her eyes to follow her, and they headed to the hallway alone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA little while later, Hashimoto came out of the classroom, holding his left shoulder with his right hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hey, that hurts, Morishita. Don\u0026apos;t call me out so violently\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll get straight to the point. Please go out with me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;What?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe was so shocked that he momentarily forgot the pain.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hey, you\u0026apos;re pretty bold\u0026#x2026; But, no way, I never thought you liked me\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? What are you misunderstanding? I need you to go out and accompany me to the student council room right after this\u0026#x2014;that\u0026apos;s what I meant.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re completely missing the subject matter here\u0026#x2026; That\u0026apos;s definitely on purpose.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In case you were imagining me as your girlfriend, even picturing me in my underwear or less, and even fantasizing about touching me or doing this and that, I\u0026#xa0;thought this would be a good opportunity to maintain a proper distance between us as classmates.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What the hell are you even saying so fast? Well, don\u0026apos;t worry, you\u0026apos;re not my type.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even so, they say all men are beasts. Aren\u0026apos;t you planning to apply old-fashioned proverbs like \u0026apos;A man\u0026apos;s shame is to refuse a prepared meal set before him\u003csup id=\"fnref-1-4c17b5e7-ac38-5274-a451-fe588c923c7c\"\u003e\u003ca class=\"footnote-ref\" href=\"#fn-1-4c17b5e7-ac38-5274-a451-fe588c923c7c\" data-ref=\"1\" epub:type=\"noteref\"\u003e[1]\u003c/a\u003e\u003c/sup\u003e\u0026apos; to modern times?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m not planning to do anything\u0026#x2026; But if you want me to accompany you, why don\u0026apos;t you just act like you want me to accompany you? Wait, why me specifically anyway? I have nothing to do with the student council.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was clear to Hashimoto that Morishita was wary of him, or rather disliked him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you\u0026apos;re feeling lonely, you should ask Ayanokouji instead.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I think he was holding it in before he could go to the bathroom today or something,\u0026#xa0;so he quickly left.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Really? Then maybe tomorrow or\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s an urgent matter. I want to check on Horikita Suzune\u0026apos;s condition.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;Horikita\u0026apos;s? Why her?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor the first time, Hashimoto was slightly interested in Morishita\u0026apos;s plans.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe pain finally subsided, so he lowered his right hand from his shoulder.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;She was defeated by Ichinose Honami\u0026apos;s class in yesterday\u0026apos;s special exam, and I want to check on how she\u0026apos;s feeling. If I drag Ayanokouji Kiyotaka here, it\u0026apos;ll complicate things. I\u0026apos;m not interested in seeing her when she\u0026apos;s distressed.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, if you bring Ayanokouji along, the conversation would definitely be dominated by talk about his transfer. That\u0026apos;s a problem that goes beyond just the results of the special exam.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In that case, you have some connections with Horikita Suzune, and you seem capable of extracting information with your eloquence.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Should I take that as a compliment?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes, of course. It\u0026apos;s your specialty as a traitor.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Again with that\u0026#x2026; Well, I don\u0026apos;t have any plans after this, so I might as well keep you company.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even if this opportunity deepens our friendship, don\u0026apos;t misunderstand. It won\u0026apos;t raise your favorability parameter by even a millimeter.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s not going to happen\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as Morishita was about to start walking, a voice reached their ears from behind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;May I join you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe one who spoke with narrowed eyes and apparent interest was Shiraishi.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Shiraishi!? When did you\u0026#x2026;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;When I saw you two sneaking out, it piqued my curiosity.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Unfortunately, you\u0026#x2019;re not invited, Shiraishi Asuka.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s fine to have secrets, but we\u0026apos;re classmates. We\u0026apos;re allies, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDespite Morishita\u0026apos;s dismissive words, Shiraishi responded with a gentle demeanor.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;d rather not bring someone I\u0026apos;m not close to.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh, then is Hashimoto-kun someone you\u0026apos;re close with?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course not, but it\u0026apos;s about to what extent\u0026#x2014;like the front and back of a toilet seat.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m the front in that analogy, right? Though, I\u0026apos;d hate being the front too.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Morishita-san, both of us had been leaving everything to Sakayanagi-san; we\u0026apos;ve only been quietly observing things these past two years. It wouldn\u0026apos;t be strange for us to want to act for the class now, would it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDespite being compared to the back of a toilet seat, Shiraishi didn\u0026apos;t seem to mind and shared her thoughts.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You look displeased. You\u0026apos;re quite cheeky.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll take that as a compliment.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Fine. It\u0026apos;ll be troublesome if we encounter Ayanokouji Kiyotaka. Come along quickly.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith Shiraishi coming along as an uninvited guest, Morishita led the way as they started moving. \u0026quot;By the way, Shiraishi, I heard you took Yoshida and Nishikawa to karaoke with Ayanokouji?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. I thought it\u0026apos;d be meaningful for deepening the friendships in our class.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m not surprised you\u0026apos;re inviting boys now, but you\u0026apos;re not planning on making a move on him, are you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Am I not allowed to get along with Ayanokouji-kun?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m not saying it\u0026apos;s bad, but you should stop. You\u0026apos;ll only get hurt.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t mind getting hurt. It seems fun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter voicing her sincere response, Shiraishi continued.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Nevertheless, he truly achieved a magnificent first victory.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, it\u0026apos;s certainly a great start. He didn\u0026apos;t just win a safe victory, he also used Ryuuen to establish his position in the class in one fell swoop. He\u0026apos;s truly the best help we can receive.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto smiled happily, but Morishita started murmuring as he turned around.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m a little scared, Hashimoto Masayoshi.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? Scared? Of what?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of Ayanokouji Kiyotaka. Even when he acts with us, he always watches his words and picks up on any enemies around, and he uses us when we\u0026apos;re not in the know. He also gave Ichinose Honami advice and made sure Horikita Suzune\u0026apos;s class didn\u0026apos;t win. He showed no mercy even to old friends.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s quite something. It would be troublesome if he shows mercy and holds back, though.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s true. But don\u0026apos;t you think he\u0026apos;s too ruthless? Even if he wants to do as he pleases in Class C, it\u0026apos;s like he doesn\u0026apos;t have a heart.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;He\u0026apos;s not a robot. You\u0026apos;re thinking too much. He does have emotions, even if there isn\u0026apos;t much.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Isn\u0026apos;t that just on the surface?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What are you trying to say?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t care what happens to you, but still, I\u0026apos;ll offer you some advice. He\u0026apos;s merely an ally of convenience, a helper pulled in by an unavoidable strategy. We\u0026apos;re also just tools for him.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMorishita\u0026apos;s serious expression and opinion, or rather her analysis of Ayanokouji, made Hashimoto clear his throat.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDespite Shiraishi not joining in the conversation, she had been keenly listening in.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I understand. That\u0026apos;s how I\u0026apos;ve been interacting with everyone, and that won\u0026apos;t change.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s good then. But I recommend not getting too involved.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Can you even say that about someone else? You\u0026apos;ve always liked being alone, but you seem quite taken with Ayanokouji.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith a smirk, Hashimoto teased Morishita, but she moved toward the window with her eyes slightly opened.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Could it be\u0026#x2026; perhaps\u0026#x2026; this is\u0026#x2026; a koi\u003csup id=\"fnref-2-d59057d5-09bd-529e-acce-bee7579eb478\"\u003e\u003ca class=\"footnote-ref\" href=\"#fn-2-d59057d5-09bd-529e-acce-bee7579eb478\" data-ref=\"2\" epub:type=\"noteref\"\u003e[2]\u003c/a\u003e\u003c/sup\u003e?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Indeed, those in the pond are the koi fish the vice chairman often feeds.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMorishita looked down from the window, and Shiraishi calmly interjected.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh, well done, Shiraishi Asuka. To follow along with my double-entendre comedy routine.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Not bad, Shiraishi.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, it\u0026apos;s not much.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Come on, let\u0026apos;s not do anything silly and head to the student council room.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMorishita muttered as if nothing had happened and started walking, followed by Hashimoto and Shiraishi.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;By the way, Shiraishi Asuka, you really seem to have taken an interest in Ayanokouji Kiyotaka.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Wouldn\u0026apos;t it be strange if I didn\u0026apos;t? He\u0026apos;s an oddball who moved to a lower class. Despite that, his abilities are unquestionable. Above all, his voice is wonderful.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Voice? Well, whatever, but like I said, he\u0026apos;s a dangerous person. You\u0026apos;ll get burned.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s why it\u0026apos;s fine.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;That\u0026apos;s why it\u0026apos;s fine?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDespite usually being aloof, Morishita was completely puzzled.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s no need to worry. Though, why exactly are we heading to the student council?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;By process of elimination. If we invade her class, we\u0026apos;ll stand out, and it\u0026apos;s the same at a caf\u0026#xe9; or on the way to the dorms. If we push into her room in the dorm, she\u0026apos;ll naturally be on guard. However, there aren\u0026apos;t a lot of people entering the area during student council activities, and we can observe her natural behavior.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEventually, the three approached the floor where the student council room was.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you going to visit her directly, Morishita?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That depends on the situation, but\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oops\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen they arrived at the student council room, the door happened to open, and Morishita, Hashimoto, and Shiraishi reflexively hid around the corner.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey didn\u0026apos;t know whether there was a need to hide. The subconscious psychology of people engaged in guilty behavior\u0026#x2014;that was what led to their actions.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You really are a hard worker, Nanase-san.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile hiding, they silently watched the student council president Horikita and the second-year secretary Nanase.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not like that. It\u0026apos;s all thanks to your precise instructions, President Horikita.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile being modest, she voiced her appreciation for Horikita.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf it were just superficial, it might\u0026apos;ve sounded somewhat sarcastic, but Horikita didn\u0026apos;t take it that way.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer pure gaze and actions were genuinely commendable.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHaving been assigned to Class D upon enrollment, Nanase had remained in Class D even after fighting through her first year.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFortunately, the gap in points with the higher classes wasn\u0026apos;t that bad.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, with Housen as the leader, Horikita thought that Nanase\u0026apos;s strengths couldn\u0026apos;t be utilized. She felt that if Nanase had taken the lead, they could\u0026apos;ve aimed higher.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, it would be somewhat problematic for a third-year like Horikita to say that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eStill, it was inevitable that she felt like taking her side, which wouldn\u0026apos;t be a very fair perspective.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you also aiming for Class A, Nanase-san?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes, I definitely want to graduate from Class A. However, as long as I can finish my school life safely, that would be the best outcome for me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Because you can succeed in further studies or employment on your own?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNanase\u0026apos;s grades, as far as the OAA could show, were excellent. Her conduct was impeccable.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUnless she had very high aspirations, it seemed she could easily do anything.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not like that, but\u0026#x2026; may I ask you a little about Ayanokouji-senpai?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was no particular surprise in her words.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAyanokouji\u0026apos;s class transfer was a concern for anyone who knew him, even for a kouhai.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026#x2019;s fine, but I don\u0026apos;t have much to tell you. He changed classes without telling anyone.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Without telling you, Horikita-senpai? That must\u0026apos;ve been very hard.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I can\u0026apos;t just say I\u0026apos;m fine, but what\u0026apos;s done is done. We just have to look forward a little at a time from now on.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAyanokouji transferred, and they had recently faced defeat in a special exam. However, Horikita\u0026apos;s expression was surprisingly bright.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Would you like to have tea at Keyaki Mall afterward?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you fine with that, Horikita-senpai?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Can I join you later? I want to make a phone call to tell a friend something.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sure. Is it okay if I go ahead? If it\u0026apos;s going to be quick, I can wait here.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The cafe might be crowded right now, so it might be better if you go ahead.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That makes sense. Then I\u0026apos;ll head there first.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes, Horikita-senpai. See you later.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThree people holding their breaths had eavesdropped on the exchange.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFortunately, Horikita was descending the opposite staircase, so she didn\u0026apos;t walk toward Hashimoto and the others, allowing them to breathe a sigh of relief.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile seeing off Horikita, Nanase took out her phone from her pocket.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hello.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed the phone had already been ringing, and Nanase continued the call.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We agreed not to make any unnecessary calls, didn\u0026apos;t we, Tsukishiro-san?\u0026quot;\u003c/p\u003e\u003cimg src=\"/hola-lector-agua/images/books/y3v1/OEBPS/AbPMGCiPVDzpbSkNGEuUU.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cimg src=\"/hola-lector-agua/images/books/y3v1/OEBPS/rioFqetCZSGLDkjRFrsSS.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cp class=\"paragraph after-image\" style=\"text-align: left\"\u003eThe three, who had no interest in Nanase\u0026apos;s phone call, exchanged glances upon hearing the familiar name.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I understand. I\u0026apos;ll continue to monitor Ayanokouji-senpai for another year. However, I\u0026apos;m still concerned about Ishigami Kyou. As initially expected, he seems to have an intellectual curiosity and a role similar to mine. Also\u0026#x2026; a student who caught my attention has enrolled in the first year. I wouldn\u0026apos;t think this is the case, but\u0026#x2026; you\u0026apos;re not involved in that, are you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe conversation was unlike what a typical student would discuss, and it kept going.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s right. If it becomes necessary\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNanase took out another phone from her pocket with her free hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sorry, I have to excuse myself due to an urgent matter.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as the conversation seemed to continue, Nanase abruptly ended the call.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Horikita-senpai, what\u0026apos;s the matter\u0026#x2026;? Ah, I see. Understood. I\u0026apos;ll head there in ten minutes. Yes, yes. Excuse me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNanase had a phone in both her left and right hands.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn this school, there was a rule stating that students could only possess one mobile phone at a time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRealizing they\u0026#x2019;d seen something they shouldn\u0026apos;t have, the three stopped peeping and withdrew.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, that slight movement made a little noise.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe corridor was silent.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWere they noticed?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn that delicate situation, the three of them couldn\u0026apos;t move at all.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIf only she would walk on the opposite side like Horikita, there wouldn\u0026#x2019;t be a problem.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was what they had hoped for, and just a few seconds later\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Senpai, what might you guys be doing in a place like this?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWithout a sound, Nanase suddenly appeared before the three of them as they were hiding around the corner, and spoke up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Uh!? No, we just needed to see Horikita, you know?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes, we just arrived. Is there a problem?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is that so? Horikita-senpai went down the opposite side about a minute ago. You might still be able to catch up with her, Hashimoto-senpai, Morishita-senpai. You too, Shiraishi-senpai.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNanase smiled, having confidently named the three there.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You know about me, huh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes, Shiraishi-senpai. I\u0026apos;m part of the student council,\u0026#xa0;so I have a general grasp of all the senpai.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNanase appraised Shiraishi for a moment without making it seem unnatural, then looked away.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well then, senpai, I\u0026apos;ll take my leave now.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNanase spoke, bowing deeply and descending the stairs.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Man, that really scared me. I broke out in a cold sweat.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I hope we weren\u0026apos;t noticed. And not only that, she had two phones, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Plus, Tsukishiro? \u003cem\u003eThe \u003c/em\u003eTsukishiro? What\u0026apos;s up with that second year?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ayanokouji Kiyotaka\u0026apos;s name came up too. It smells fishy. The blood I inherited from my master detective grandpa is starting to stir.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s definitely a lie. So, what do we do? Should we follow Nanase now?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I think it\u0026apos;s better if we don\u0026apos;t, Hashimoto-kun. Seems like she\u0026apos;s quite sensitive to people\u0026apos;s presence.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi muttered in response to Hashimoto\u0026apos;s suggestion, staring down the stairs where Nanase had disappeared.\u003c/p\u003e\u003chr class=\"footnote-rule\"/\u003e\u003col class=\"footnotes\"\u003e\u003cli data-id=\"4c17b5e7-ac38-5274-a451-fe588c923c7c\" data-ref=\"1\" class=\"footnote first-footnote\" id=\"fn-1-4c17b5e7-ac38-5274-a451-fe588c923c7c\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003ca class=\"footnote-backref\" href=\"#fnref-1-4c17b5e7-ac38-5274-a451-fe588c923c7c\"\u003e[1]: \u003c/a\u003eIf it isn\u0026apos;t clear, this Japanese proverb \u0026quot;\u0026#x636e;\u0026#x3048;\u0026#x81b3;\u0026#x98df;\u0026#x308f;\u0026#x306c;\u0026#x306f;\u0026#x7537;\u0026#x306e;\u0026#x6065;\u0026quot; means that it\u0026apos;s shameful to reject a woman\u0026apos;s advances.\u003c/p\u003e\u003c/li\u003e\u003cli data-id=\"d59057d5-09bd-529e-acce-bee7579eb478\" data-ref=\"2\" class=\"footnote\" id=\"fn-2-d59057d5-09bd-529e-acce-bee7579eb478\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003ca class=\"footnote-backref\" href=\"#fnref-2-d59057d5-09bd-529e-acce-bee7579eb478\"\u003e[2]: \u003c/a\u003eThis is wordplay on \u0026quot;koi\u0026quot; as in the Japanese word for romantic love and \u0026quot;koi\u0026quot; as in the fish.\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 2\",\"volumeId\":\"y3v1\",\"chapterIndex\":42,\"prevChapter\":{\"volumeId\":\"y3v1\",\"chapter\":41,\"title\":\"Part 1\"},\"nextChapter\":{\"volumeId\":\"y3v1\",\"chapter\":43,\"title\":\"Author's Afterword\"},\"toc\":[{\ dex\":29},{\"label\":\"Chapter 6: School Life in Class C\",\"href\":\"chapter-6.xhtml\",\"index\":30},{\"label\":\"Part 1\",\"href\":\"chapter-6-part-1.xhtml\",\"index\":31},{\"label\":\"Chapter 7: Ayanokouji's Defeat\",\"href\":\"chapter-7.xhtml\",\"index\":32},{\"label\":\"Part 1\",\"href\":\"chapter-7-part-1.xhtml\",\"index\":33},{\"label\":\"Part 2\",\"href\":\"chapter-7-part-2.xhtml\",\"index\":34},{\"label\":\"Part 3\",\"href\":\"chapter-7-part-3.xhtml\",\"index\":35},{\"label\":\"Part 4\",\"href\":\"chapter-7-part-4.xhtml\",\"index\":36},{\"label\":\"Part 5\",\"href\":\"chapter-7-part-5.xhtml\",\"index\":37},{\"label\":\"Chapter 8: Enemies and Allies\",\"href\":\"chapter-8.xhtml\",\"index\":38},{\"label\":\"Part 1\",\"href\":\"chapter-8-part-1.xhtml\",\"index\":39},{\"label\":\"Epilogue: What Awaits Ahead\",\"href\":\"epilogue.xhtml\",\"index\":40},{\"label\":\"Part 1\",\"href\":\"epilogue-part-1.xhtml\",\"index\":41},{\"label\":\"Part 2\",\"href\":\"epilogue-part-2.xhtml\",\"index\":42},{\"label\":\"Author's Afterword\",\"href\":\"authors-afterword.xhtml\",\"index\":43}],\"volumeTitle\":\"Light Novel 3rd Year Volume 1\",\"detailsLink\":\"/select/year-3/y3v1\",\"returnLink\":\"/select\",\"currentSpineIndex\":42,\"nextVolumeLink\":\"/select/year-3/y3v2\",\"nextVolumeTitle\":\"Light Novel 3rd Year Volume 2\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novel
