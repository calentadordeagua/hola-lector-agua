e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T4382,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 2\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHASHIMOTO AND I left Class C together and headed to the hallway.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eConsidering that we were the first ones to leave school, it seemed that other classes were still listening to their homeroom teachers.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Looks like we can leave without drawing attention at the end of our first school day after the transfer.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s only a matter of time.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe transferring topic wouldn\u0026apos;t only\u0026#xa0;be brought up by students from Horikita\u0026apos;s class, where I\u0026#x2019;d been a part of.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eStudents from Ichinose\u0026apos;s class and Ryuuen\u0026apos;s class were also included.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs time passed, we\u0026apos;d attract more attention, and students driven by curiosity would start approaching.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you don\u0026apos;t want to go through any of the hassle, maybe we should just go to karaoke\u0026#x2026; but a small room with just two guys is a bit awkward.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I agree. Let\u0026apos;s pass on that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto seemed serious about having the welcome party, and we continued together to the exit, escaping the gazes directed at us.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Man, your boldness is something else\u0026#x2026; I never imagined you\u0026apos;d plan to transfer to our class. And to think you used my money for it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;How many times have you complained about that? You seem really displeased.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe conversation about the transfer was still fresh for Hashimoto, but he brought it up every chance he got.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, of course, I\u0026apos;d have my thoughts about it. Money is a precious insurance for me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto had obtained a large sum of money by moving in all sorts of directions and even betraying Sakayanagi.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wouldn\u0026apos;t be surprising if he felt a great deal of frustration if he had to spit out most of that money.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you could go back to before you had to decide on my transfer, would you want to cancel it, Hashimoto?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s\u0026#x2026; honestly, it would be a lie to say I wouldn\u0026apos;t hesitate.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Right. There might\u0026apos;ve been a future where you could\u0026#x2019;ve saved twenty million private points on your own.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto chuckled softly at these words and nodded without denying it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSaving that amount on his own would be a difficult endeavor, but achieving it would almost guarantee graduating from Class A.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was why it took courage and resolve to give up that dream.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;To graduate from Class A, you have to take the appropriate risks.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Tell me about it. In these past two years, I\u0026apos;ve crossed many dangerous bridges on my own, participating in the conflict between Sakayanagi and Katsuragi, pairing up Ryuuen and Katsuragi on the deserted island, and most recently, taking a stand against Sakayanagi. I\u0026apos;ve been stacking up indescribable efforts and continuously producing results.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto talked about his own proactive actions as if they were someone else\u0026apos;s business.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIndeed, those moves certainly had risks.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then you should think positively. Your efforts to take on those risks have borne fruit, and you\u0026apos;ve successfully pulled me into your class. That\u0026apos;s undoubtedly an accomplishment.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, yeah.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eStill, it\u0026apos;s understandable that Hashimoto couldn\u0026apos;t purely rejoice or be optimistic.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo matter how much Hashimoto valued me, his current class was Class C.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince he decided to go through with a transfer in the first place, he would\u0026apos;ve had a higher chance of victory if he simply went to Horikita\u0026apos;s class himself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOr he could transfer to Ryuuen\u0026apos;s class with me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEither of those options would\u0026apos;ve been easier to understand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, it was precisely because I could see through that thought process that I presented Hashimoto with two choices.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eTo either give up his fortune and accept me, or to give up on accepting me altogether.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf he refused, no cooperative relationship would emerge between us until graduation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf he ended up having to deal with his own class antagonizing him, on top of bearing an adversary-like relationship with me for a year, there would be nothing guaranteeing his safety. Even Ryuen could bare his fangs at any moment..\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe weighed which choice would increase his chances of winning.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s fine to trust you on that, right, Ayanokouji? That from here on, you\u0026apos;ll seriously aim for Class A. I\u0026#xa0;plan to make you stand out even if you don\u0026apos;t want to, okay?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto voiced his wishful thinking.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe must\u0026apos;ve thought he had every right to make such a claim.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIndeed, Hashimoto\u0026apos;s contributions significantly lowered the hurdle for the transfer.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut that didn\u0026apos;t mean I could easily fulfill his wishes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I told you when we talked about the transfer. I won\u0026apos;t guarantee anything when making decisions. You just have to decide whether you believe in me or not.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWhether I intend to rise to Class A\u003c/em\u003e.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if I was willing to strive toward that premise, I never shared how we\u0026apos;d get to Class A, let alone strategies or even the prospects.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was why when it came down to making decisions regarding his plan of action, Hashimoto wasn\u0026apos;t able to come up with an immediate reply, and still had lingering doubts.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto, who antagonized Sakayanagi, and who ultimately contributed to her voluntary withdrawal.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNot all Class C students knew everything, but there were certainly those who were wary and disliked Hashimoto. It was by no means a comfortable class. If trouble were to come, he was the first in position to be discarded.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRemaining in that class and inviting me, who had no guarantee of being useful, was a big risk.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s right\u0026#x2026; Ah, I know that well.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDespite harboring many uncertainties, Hashimoto ultimately decided to accept me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eInstead of the ideal of using twenty million Private Points right before graduation to guarantee Class A, he chose another ideal: teaming up with me to become Class A and graduate on his own.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo, he concluded that it wasn\u0026apos;t an ideal but a reality.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sure, I accepted the conditions. But if you have plans for the future, you could share a little with me. That\u0026apos;s what being comrades is about.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven when I spoke as if I was pushing him away, Hashimoto valiantly continued.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What to do\u0026#x2026; I\u0026apos;m worried about being betrayed like Sakayanagi.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hey, stop with the bad jokes, Ayanokouji. I\u0026apos;m all in on you, literally penniless. What\u0026apos;s the point of betraying now!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto, perhaps flustered, gestured and insisted on his innocence as he moved in front of me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Still, knowing you, Hashimoto, aren\u0026apos;t you scheming something, not even\u0026#xa0;a little here or there?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, no, no, definitely not. It\u0026apos;s fine for others to doubt me, but please, spare me from your suspicions.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, I wasn\u0026apos;t really concerned about whether Hashimoto would betray us in the future.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKeeping a bit of tension was probably just right for Hashimoto.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, I might\u0026apos;ve said too much. Without your cooperation, transferring to Class C wouldn\u0026apos;t have been easy. Let\u0026apos;s properly discuss the strategy, no, the future plans.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Really, you should\u0026apos;ve been straightforward from the beginning.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI took out my phone and confirmed that I\u0026#x2019;d received a reply.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIt might be better to take Hashimoto to the upcoming meeting.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m heading to Keyaki Mall now.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not that you\u0026apos;re asking for a welcome party, but rather, you\u0026apos;re sharing your plans there, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I nodded in affirmation, Hashimoto nodded back, satisfied.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;By the way\u0026#x2026; what about you, Morishita?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI turned around and called out to Morishita, who must\u0026apos;ve been watching us from the shadows.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe girl who should\u0026apos;ve left the classroom earlier showed herself from behind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re doing it, Ayanokouji Kiyotaka. You don\u0026apos;t have a popular\u0026#xa0;presence, but you seem sensitive to the presence of people.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps it was a pun using the same kanji for \u0026apos;\u0026#x4eba;\u0026#x6c17;\u003csup id=\"fnref-1-5483a848-158c-5f63-acc8-5de8f32e43cc\"\u003e\u003ca class=\"footnote-ref\" href=\"#fn-1-5483a848-158c-5f63-acc8-5de8f32e43cc\" data-ref=\"1\" epub:type=\"noteref\"\u003e[1]\u003c/a\u003e\u003c/sup\u003e\u0026apos; (\u0026apos;popularity\u0026apos; and \u0026apos;human presence\u0026apos;).\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis time, I felt I understood the meaning, unlike the previous joke about having a hundred friends.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So you were interested after all. What happened to the adventure you mentioned?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The truth that is now revealed\u0026#x2014;\u003cem\u003ethis is the adventure\u003c/em\u003e. The sudden appearance of the embodiment of unpopularity, Ayanokouji Kiyotaka, and the embodiment of betrayal, Hashimoto Masayoshi. If interacting with these two isn\u0026apos;t an adventure, what is?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Like I said, I\u0026apos;m\u0026#x2026; Ah, never mind. It\u0026apos;s a waste of time to correct you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It seems you finally admit that you are a traitor.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah, yeah. Is it okay for you to be in contact with such a traitor? You just rejected the welcome party.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not like I\u0026apos;m attending the party. It\u0026apos;s only natural as a classmate to discuss the future of Class C early on. You\u0026apos;ll probably meet Ichinose Honami after this, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMorishita smirked as she touched on the topic of our plans after this.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ichinose? Why is her name coming up here?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hehe, so the traitor isn\u0026apos;t trusted after all. It seems you\u0026apos;re not informed about even the most basic of knowledge regarding future plans.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto\u0026apos;s smile stiffened slightly as if provoked.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t tell me you\u0026apos;ve already talked to Morishita?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026apos;\u003cem\u003eI\u0026apos;m cooperating the most, but you intend on just pushing me to the side?\u003c/em\u003e\u0026apos; It was clear he was thinking along the lines of such a question.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;For this transfer, Class C\u0026apos;s unanimous consent was a must. There were things I couldn\u0026apos;t entrust to you and your problematic issues. Unlike you, who trusts me, Morishita has strong doubts, so it was necessary to provide her with appropriate information.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, I sort of get what you\u0026apos;re saying\u0026#x2026; but it\u0026apos;s hard to accept that I lost to Morishita. Well, if I can hear about it later, I can accept it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto sighed. Believing that standing and talking any further was a waste, he took the lead and started walking.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI started walking a bit later, and Morishita lined up beside me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What are you planning?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What do you mean?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You already know the plan, and there was no need for you to be here today.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom the fact that she\u0026#x2019;d been secretly following us, it seemed she\u0026#x2019;d been considering joining from the start.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;As for you, Ayanokouji Kiyotaka, that might be true. However, Ichinose Honami is different. I can\u0026apos;t judge whether the good-natured Class D will be of any use until I see it with my own eyes. At least, if she remains the leader I know, I have low expectations.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was some degree of trust in Ichinose\u0026apos;s abilities, but it wasn\u0026apos;t enough for them to entirely rely upon her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer strength also encompassed her weakness.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMorishita thought about it; if expressed in simple terms, Ichinose was an unreliable leader.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSo, there was a reason to attend and verify whether it made sense to collaborate.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then, observe sharply like a great detective. There are no restrictions.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That goes without saying.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfterward, the three of us headed to the cafe, the prearranged meeting location with Ichinose\u003c/p\u003e\u003chr class=\"footnote-rule\"/\u003e\u003col class=\"footnotes\"\u003e\u003cli data-id=\"5483a848-158c-5f63-acc8-5de8f32e43cc\" data-ref=\"1\" class=\"footnote first-footnote\" id=\"fn-1-5483a848-158c-5f63-acc8-5de8f32e43cc\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003ca class=\"footnote-backref\" href=\"#fnref-1-5483a848-158c-5f63-acc8-5de8f32e43cc\"\u003e[1]: \u003c/a\u003eSome kanji can be read in different ways; in this case, \u0026quot;\u0026#x4eba;\u0026#x6c17;\u0026quot; can both mean \u0026quot;popularity\u0026quot; (pronounced as \u003cem\u003eninki\u003c/em\u003e) or \u0026quot;human presence\u0026quot; (pronounced \u003cem\u003ehitoke\u003c/em\u003e). And yes, the parenthesis here is actually\u0026#xa0;in the raw.\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 2\",\"volumeId\":\"y3v1\",\"chapterIndex\":17,\"prevChapter\":{\"volumeId\":\"y3v1\",\"chapter\":16,\"title\":\"Part 1\"},\"nextChapter\":{\"volumeId\":\"y3v1\",\"chapter\":18,\"title\":\"Part 3\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 1\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: The End of Everyday Life\",\"href\":\"prologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Confusion\",\"href\":\"chapter-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"chapter-1-part-1.xhtml\",\"index\":12},{\"label\":\"Chapter 2: Confirmation\",\"href\":\"chapter-2.xhtml\",\"index\":13},{\"label\":\"Part 1\",\"href\":\"chapter-2-part-1.xhtml\",\"index\":14},{\"label\":\"Chapter 3: The Commencement of a One-Year Period\",\"href\":\"chapter-3.xhtml\",\"index\":15},{\"label\":\"Part 1\",\"href\":\"chapter-3-part-1.xhtml\",\"index\":16},{\"label\":\"Part 2\",\"href\":\"chapter-3-part-2.xhtml\",\"index\":17},{\"label\":\"Part 3\",\"href\":\"chapter-3-part-3.xhtml\",\"index\":18},{\"label\":\"Part 4\",\"href\":\"chapter-3-part-4.xhtml\",\"index\":19},{\"label\":\"Part 5\",\"href\":\"chapter-3-part-5.xhtml\",\"index\":20},{\"label\":\"Chapter 4: An Onlooker's Perspective \",\"href\":\"chapter-4.xhtml\",\"index\":21},{\"label\":\"Part 1\",\"href\":\"chapter-4-part-1.xhtml\",\"index\":22},{\"label\":\"Part 2\",\"href\":\"chapter-4-part-2.xhtml\",\"index\":23},{\"label\":\"Chapter 5: Convolution\",\"href\":\"chapter-5.xhtml\",\"index\":24},{\"label\":\"Part 1\",\"href\":\"chapter-5-part-1.xhtml\",\"index\":25},{\"label\":\"Part 2\",\"href\":\"chapter-5-part-2.xhtml\",\"index\":26},{\"label\":\"Part 3\",\"href\":\"chapter-5-part-3.xhtml\",\"index\":27},{\"label\":\"Part 4\",\"href\":\"chapter-5-part-4.xhtml\",\"index\":28},{\"label\":\"Part 5\",\"href\":\"chapter-5-part-5.xhtml\",\"index\":29},{\"label\":\"Chapter 6: School Life in Class C\",\"href\":\"chapter-6.xhtml\",\"index\":30},{\"label\":\"Part 1\",\"href\":\"chapter-6-part-1.xhtml\",\"index\":31},{\"label\":\"Chapter 7: Ayanokouji's Defeat\",\"href\":\"chapter-7.xhtml\",\"index\":32},{\"label\":\"Part 1\",\"href\":\"chapter-7-part-1.xhtml\",\"index\":33},{\"label\":\"Part 2\",\"href\":\"chapter-7-part-2.xhtml\",\"index\":34},{\"label\":\"Part 3\",\"href\":\"chapter-7-part-3.xhtml\",\"index\":35},{\"label\":\"Part 4\",\"href\":\"chapter-7-part-4.xhtml\",\"index\":36},{\"label\":\"Part 5\",\"href\":\"chapter-7-part-5.xhtml\",\"index\":37},{\"label\":\"Chapter 8: Enemies and Allies\",\"href\":\"chapter-8.xhtml\",\"index\":38},{\"label\":\"Part 1\",\"href\":\"chapter-8-part-1.xhtml\",\"index\":39},{\"label\":\"Epilogue: What Awaits Ahead\",\"href\":\"epilogue.xhtml\",\"index\":40},{\"label\":\"Part 1\",\"href\":\"epilogue-part-1.xhtml\",\"index\":41},{\"label\":\"Part 2\",\"href\":\"epilogue-part-2.xhtml\",\"index\":42},{\"label\":\"Author's Afterword\",\"href\":\"authors-afterword.xhtml\",\"index\":43}],\"volumeTitle\":\"Light Novel 3rd Year Volume 1\",\"detailsLink\":\"/select/year-3/y3v1\",\"returnLink\":\"/select\",\"currentSpineIndex\":17,\"nextVolumeLink\":\"/select/year-3/y3v2\",\"nextVolumeTitle\":\"Light Novel 3rd Year Volume 2\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lect
