 ascent to the leader\u0026apos;s position.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, his scheme failed miserably. Ayanokouji had read all his thoughts.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a complete waste of effort. He may as well have been wrestling without an opponent.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe\u0026#x2019;d mistakenly believed that the enemy was more formidable and thought in a more sophisticated way, utilizing more advanced strategies in this exam.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen he looked into it, it was nothing special.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAyanokouji did nothing extraordinary, yet he succeeded in making his uniqueness known to the class and their entire year.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe scored a perfect score that no one else could achieve, and even foresaw Ryuuen\u0026apos;s utmost caution with a full, one-hundred-point penalty alongside his triumphant entry into the classroom.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eNo, was that what made it so extraordinary?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What a ridiculous guy\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the end, Ayanokouji had read his behavioral patterns and his psychology.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe even anticipated the flexibility he\u0026#x2019;d tried to incorporate into his thinking.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUnconsciously, his arm suddenly moved, and he punched the corridor wall.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHis body signaled that he needed to punish and inflict pain on himself to suppress his emotions.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe gap in their class points narrowed, but he was still leading.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf the next special exam wasn\u0026apos;t about academic ability, there might be a chance\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eNo, is there really a chance?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf he lost, he could win the next time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf he lost again, then he could win the time after that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat had been his creed, the ultimate victory.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was starting to waver again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Tch\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eComplacency, overconfidence, arrogance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe thought he had discarded such things long ago.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYet, in reality, he\u0026#x2019;d dug his own grave and suffered defeat.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Can I really not win alone\u0026#x2026;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe recalled his interactions with Sakayanagi, who left school just a few weeks ago.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUnknowingly, Ryuuen had begun to step into a long, dark tunnel.\u003c/p\u003e\u003cimg src=\"/hola-lector-agua/images/books/y3v1/OEBPS/HCHuGpPwqqhDDwhDKzyMB.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cimg src=\"/hola-lector-agua/images/books/y3v1/OEBPS/utxtxkippHwdbsAiZHWio.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 5\",\"volumeId\":\"y3v1\",\"chapterIndex\":37,\"prevChapter\":{\"volumeId\":\"y3v1\",\"chapter\":36,\"title\":\"Part 4\"},\"nextChapter\":{\"volumeId\":\"y3v1\",\"chapter\":38,\"title\":\"Chapter 8: Enemies and Allies\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 1\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: The End of Everyday Life\",\"href\":\"prologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Confusion\",\"href\":\"chapter-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"chapter-1-part-1.xhtml\",\"index\":12},{\"label\":\"Chapter 2: Confirmation\",\"href\":\"chapter-2.xhtml\",\"index\":13},{\"label\":\"Part 1\",\"href\":\"chapter-2-part-1.xhtml\",\"index\":14},{\"label\":\"Chapter 3: The Commencement of a One-Year Period\",\"href\":\"chapter-3.xhtml\",\"index\":15},{\"label\":\"Part 1\",\"href\":\"chapter-3-part-1.xhtml\",\"index\":16},{\"label\":\"Part 2\",\"href\":\"chapter-3-part-2.xhtml\",\"index\":17},{\"label\":\"Part 3\",\"href\":\"chapter-3-part-3.xhtml\",\"index\":18},{\"label\":\"Part 4\",\"href\":\"chapter-3-part-4.xhtml\",\"index\":19},{\"label\":\"Part 5\",\"href\":\"chapter-3-part-5.xhtml\",\"index\":20},{\"label\":\"Chapter 4: An Onlooker's Perspective \",\"href\":\"chapter-4.xhtml\",\"index\":21},{\"label\":\"Par
