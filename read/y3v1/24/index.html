/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThough reluctantly, I was being forced to understand that fact.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey were trying to alter their two years with Ayanokouji-kun as if it had never happened.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYamauchi-kun, Sakura-san, and Maezono-san too.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNobody mentioned the students who disappeared from the class anymore.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut those of us who were close to him, myself included, hadn\u0026apos;t reached that point yet.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRather, it was the opposite for us.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe keenly felt the cruelty and mercilessness of time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe realization that he was gone grew stronger day by day.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMatsushita-san started to smile and talk less, while Sudou-kun started to get irritated over trivial matters like he used to a long time ago.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wondered how I was affected.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNow, I couldn\u0026apos;t even look at myself objectively.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was desperately trying to maintain Class A\u0026apos;s image by acting calmly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo, I didn\u0026apos;t even know how effective that was.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile fighting the anxiety that made it difficult to distinguish between what was real and what wasn\u0026apos;t, I still continued my days, focusing on my studies and desperately clinging to my desk.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt felt heavy and suffocating. My heart was in pain.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt felt like I had lost an important part of my body.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWhy did this happen?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWas this class not good enough?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWas this place not comfortable for Ayanokouji-kun?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t know.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo matter how much I thought about it, I couldn\u0026apos;t seem to find the answer.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eCertainly, compared to other class leaders, I was still inexperienced. That was why I thought he\u0026apos;d kindly stay by my side, watching over me while sighing to himself\u003cem\u003e.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWas he simply sick of acting like a babysitter?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIf I had been more reliable, could he have stayed without transferring?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd my words that hadn\u0026apos;t reached him\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026#x2018;I won\u0026#x2019;t ask you to help me with everything, but I want you to keep watching over me\u0026#x2026;\u0026#x2019;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eLooking back now, maybe it was good that those feelings at the celebration party didn\u0026apos;t reach him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a wish that would never come true.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eOr maybe\u0026#x2026;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIf those feelings had reached him, would he have stayed\u0026#x2026;?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI barely managed to suppress a sigh that almost naturally escaped my mouth, making sure no one could hear it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was an unbearable reality.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI never had my feet firmly set on the ground.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eLosing my sense of balance, only time continued to pass relentlessly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEventually, the chime for the morning homeroom period rang.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eChabashira-sensei arrived in class. Maybe she\u0026#x2019;d moved on from the transfer issue, or maybe she was trying not to think about it, and had returned to being a normal teacher\u0026#x2014;it was unimaginable when compared to how she was during the first day of school.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the not-too-distant future, Sudou-kun and the others would start looking towards the future as well.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eThen what about me?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWill the day come when I\u0026apos;ll get used to it, too?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was hard to imagine.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWhat am I doing here, in this place?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWhat should I do from now on?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePreviously, when I couldn\u0026apos;t even imagine Ayanokouji-kun leaving the class, I thought I had the strength to move forward and keep fighting..\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIn this place without Ayanokouji-kun, for another year\u0026#x2026;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eI\u0026#x2014;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Did you hear me? Horikita.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2014;Eh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBefore I knew it, Chabashira-sensei had spoken, looking this way.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSome of the students around were also glancing in my direction.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I will now announce the special exam, so don\u0026apos;t zone out and make sure to listen carefully.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sorry, yes. It\u0026apos;s okay, I\u0026apos;m listening.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was a lie. I hadn\u0026apos;t heard anything.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI hadn\u0026apos;t even realized that someone was speaking.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eI need to focus on what the teacher says\u0026#x2026;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo matter how much I suffered and stopped in my tracks, the world around me wouldn\u0026apos;t wait.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat our teacher had just mentioned was\u0026#x2026; a special exam.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy third year\u0026apos;s first special exam had arrived before I could even sort out my feelings.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI shook my head from side to side and stared at the monitor.\u003c/p\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cstrong\u003eSpecial Exam Overview\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026apos;Comprehensive Academic Ability Exam: Full-Class and Small-Group Battles\u0026apos;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA written exam composed of random questions from 21 topics across 7 subjects (100 questions total, scored out of 100 points).\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eCompetition between classes will be separated into two categories: Full-Class Battles and Small-Group Battles.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cstrong\u003eFull-Class Battle\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAll class members will be required to participate in the written exam.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe class with the highest total\u0026#xa0;score wins, and that victory will count as two wins.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf the scores are tied, each class shares one win, and it\u0026apos;ll be treated as a draw.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf there\u0026apos;s a difference in the number of students within the classes, the points equal to the lowest-scoring student will be used for the missing students in that class.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOn the day of the exam, students who are absent or leave midway due to illness will be treated the same as explained above.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cstrong\u003eSmall-Group Battles\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEach class will choose five representatives to participate.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEach class will assign their representatives a number from first to fifth, and they will compete individually for scores.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe student with the higher score wins, and their class will be awarded one victory.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf scores are tied, it is considered a draw, and no victory will be awarded for that particular individual battle.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cstrong\u003eSmall-Group Battle Exclusive Rules\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePenalties can be assigned to any student in the opposing class.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEach class starts with 100 penalty points.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEach penalty point deducts one point from the student\u0026apos;s exam score.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere is no limit on the number of students the penalty points can be assigned to (up to 100 penalty points can be attributed to each student).\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e(Additional penalty points can be purchased until the day before the exam at a cost of 50,000 Private Points each.)\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe designations of penalty points must be reported to the homeroom teacher by the day before the exam takes place.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOnly the penalty points assigned to students participating in the small-group battles will be disclosed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026#x203b; Penalty points will not affect the full-class battle scores or subsequent OAA evaluations.\u003c/em\u003e\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cstrong\u003eVictory Conditions\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe class with the most victories will win, competing for the two wins from the full-class battle and five wins from the small-group battles.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf the score is tied, such as having three wins, three losses, and one draw, the rewards will be evenly split.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cstrong\u003eRewards\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe winning class receives 100 Class Points (50 each in case of a draw).\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA class that achieves a complete victory, seven wins, will receive an additional 50 Class Points.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA class that suffers a complete defeat, seven losses, will have 50 Class Points deducted.\u003c/p\u003e\u003c/div\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom what I could decipher, it was a conventional written exam.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEssentially, it required pure academic ability.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, the special rules added could significantly alter the outcome.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This time, it\u0026apos;s been decided that we\u0026apos;ll compete against Class 3-D, and the exam will be held in two weeks. There won\u0026#x2019;t be a lot of time to prepare, but since it\u0026apos;s the same for everyone, please refrain from complaining.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eClass 3-D.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was the class Ichinose-san belonged to.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eThinking about things this way wasn\u0026apos;t good at all\u0026#x2014;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven though I understood that, I felt relieved that I didn\u0026apos;t have to fight Ayanokouji-kun.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNormally, I would\u0026#x2019;ve regretted the fact that we didn\u0026apos;t get to face Ryuuen-kun\u0026apos;s class since they weren\u0026apos;t good at academic battles.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut now, I only judged how good or bad the situation was based on whether Ayanokouji-kun was our opponent.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut surely, I wasn\u0026apos;t the only one.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt least, Matsushita-san and Sudou-kun seemed relieved to me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile engulfed in self-loathing, I looked at the monitor\u0026apos;s rules again without a change in my expression.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIchinose-san\u0026apos;s class had many students who were well-balanced and excellent academically.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMoreover, the fact that their class had a full roster of forty students was also troublesome.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe more the number of students in the opposing class differed, the more advantages and disadvantages arose before the match even started. Although it seemed that points were guaranteed for the missing students, having the same score as the lowest scorer in the class was still a significant handicap.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith his departure\u0026#x2026; our class was already down to thirty-six people.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat meant having to fight while essentially being forcibly burdened with five students who were equivalent to the lowest scorer in the class.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This is just a guideline, but the predicted scores based on OAA evaluations are as follows. It would be wise to use this as a reference to gauge how much your class can score.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter our teacher explained that, the monitor switched to a new screen.\u003c/p\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOAA Academic Ability\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA rating: 76~85 points\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eB rating: 66~75 points\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eC rating: 56~65 points\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eD rating: 51~55 points\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eE rating: 45~50 points\u003c/p\u003e\u003c/div\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eSeems like the written exam is quite difficult, and it\u0026apos;s nearly impossible to score full marks. That\u0026apos;s the impression it gives.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Looks like it\u0026apos;s going to be a tough fight\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSudou-kun, sitting nearby, muttered to himself with a stern expression.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYes, this battle would undoubtedly be a tough one for us.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf we clashed head-on, the chances of winning were just shy of fifty percent.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe\u0026#x2019;d managed to somewhat improve on our academics. However, looking back at the results of the previous written exams, although we narrowly won against Ichinose\u0026apos;s class in an academic exam once, we\u0026#x2019;re still at a slight disadvantage overall, considering the handicap from our difference in numbers. With two weeks remaining until the exam, they\u0026apos;d be studying just as hard, and there was no guarantee that we\u0026apos;d be able to close the gap efficiently.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThough\u0026#x2026; because it wasn\u0026apos;t a normal exam, there were also different opportunities for victory.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf it was a simple battle based solely on total points, we would\u0026apos;ve had to compete with even lower odds.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut this time, a special rule for small-group battles had been set.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if we were to lose the full-class battle, being able to turn it around with four wins in small-group battles was significant.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince both classes had about the same number of students who had around an A in terms of academic ability in the OAA, if we could pit the top five students against each other, we could compete on equal footing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, we couldn\u0026apos;t overturn the disadvantageous situation itself. If they were to win the full-class battle, they could secure victory by winning two small-group battles, whereas we\u0026apos;d have to win four. If we came to a draw on the full-class battle, three wins would suffice, but there was a very low possibility that we\u0026apos;d tie in total points, so it was better not to consider it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Four wins\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSetting aside whether it was realistic, even if all five students participating in Ichinose-san\u0026apos;s class\u0026apos;s small-group battles were to score eighty-five points, which was among the higher boundary for students with an A in the OAA, we still had a good chance of winning as long as the penalty points were accurately used.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust by distributing twenty penalty points to each of the five students participating, we could drop their score to sixty-five.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, the same can be said for our opponent as well.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf we were to simply send out our most capable students and have them receive a large number of penalty points, we wouldn\u0026apos;t be able to avoid a significant drop in scores, and the outcome wouldn\u0026apos;t be reversed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd if we\u0026#xa0;were to send out students with B\u0026apos;s or C\u0026apos;s in the OAA, they might not be able to score enough to win.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat shallow line of thought was something that all four classes could think of and come to understand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd the likely conclusion was\u0026#x2026; to purchase additional penalty points.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo increase the odds of victory, a straightforward strategy was to buy up points to use penalties.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSimply put, it was the only way to guarantee closing the gap with the opponent.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut the problem was the price\u0026#x2026;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe only issue was that it required fifty thousand private points just to take away one point.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, I understood that it was still one point.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever\u0026#x2026;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had to be careful; spending Private Points wouldn\u0026apos;t guarantee any certain benefits after all. If we were to expect a specific student to participate and target them with a lot of penalty points, it would be unbearable if that student didn\u0026apos;t show up in the small-group battles.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAbove all, the damage from pouring tens of thousands or even hundreds of thousands of Private Points into a special exam and losing is\u0026#x2026; something I don\u0026apos;t even want to think about.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;Ugh\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI placed my hands together\u0026#xa0;and closed my eyes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe special exam this time obviously required us to focus on our studies, but it also depended on who was sent into the small-group battles and whether we could assign penalty points to the right opponents.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere were no other strategies.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, I couldn\u0026apos;t see us winning with such a simple approach without doing anything else.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eI don\u0026apos;t understand\u0026#x2026;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIf only you were here\u0026#x2026;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIf you were here, you\u0026apos;d definitely come up with a surefire way to win.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI closed my eyes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe image of his back that floated to my mind made it hard for me to breathe again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Suzune.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIs it okay to confront Ichinose-san\u0026apos;s class head-on?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eCan we win\u0026#x2026;?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eSince our academic abilities are nearly equal, should we proceed as is?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIs it possible to probe whether our opponent will buy penalty points?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eOr should we resort to underhanded tactics like Ryuuen-kun to manage somehow?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWho will our opponent send out\u0026#x2026;?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIchinose-san won\u0026apos;t participate in the small-group battles, will she?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eOr will she surprise us by boldly participating?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlongside my doubts, Ayanokouji-kun\u0026apos;s image lingered in the corner of my mind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eHow would he fight?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eHow would he view this special exam?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was no longer allowed to even ask.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Suzune.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eShould I buy several penalty points to reduce the risk and apply them to all their top students?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eSometimes, a painful sacrifice is needed to get out of a dire situation, and you\u0026apos;ll just have to endure through that pain\u0026#x2026;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Suzune!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was startled by the sensation of something touching my shoulder and looked in its direction.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was Sudou-kun\u0026apos;s large hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you okay?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;There\u0026#x2019;s no problem. I was just thinking about how to fight in the exam.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s true, but\u0026#x2026; you\u0026apos;re still worried about Ayanokouji, aren\u0026apos;t you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s impossible not to worry, but don\u0026apos;t keep it all to yourself.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes, I\u0026apos;ll try.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI couldn\u0026apos;t show Sudou-kun any more of my pathetic side.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTherefore, at least in this situation, I had to act bravely.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI thought I was managing it, but it seemed it wasn\u0026apos;t enough.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;How we use the penalty points is important\u0026#x2026; Focusing on targeting students likely to score high and getting it wrong is scary.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBefore I knew it, Hirata-kun had taken the lead in discussing this with our classmates.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had no idea what they\u0026#x2019;d been talking about before.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It just started.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;Thank you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSudou-kun understood that I\u0026#x2019;d been preoccupied with my thoughts.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had to pull myself together to avoid causing any more worry.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eResponding to Hirata-kun\u0026apos;s remark, Yukimura-kun raised his hand while still seated.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I think it\u0026apos;s better not to rely solely on the OAA evaluations for the small-group battles. After all, our academic abilities score only represents the average among all our subjects. A student who\u0026apos;s extremely weak in one subject but strong in others can still score high. And there are still a lot of things about our own class that even we\u0026#xa0;don\u0026apos;t know about, like who\u0026apos;s good at what and to what extent. Not all past exams have revealed detailed results.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe suggested leveraging the detailed information only known within our class.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere were two weeks left until the exam.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eI wonder if I can come up with a way to win\u0026#x2026;\u003c/em\u003e\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 5: Convolution\",\"volumeId\":\"y3v1\",\"chapterIndex\":24,\"prevChapter\":{\"volumeId\":\"y3v1\",\"chapter\":23,\"title\":\"Part 2\"},\"nextChapter\":{\"volumeId\":\"y3v1\",\"chapter\":25,\"title\":\"Part 1\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 1\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: The End of Everyday Life\",\"href\":\"prologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Confusion\",\"href\":\"chapter-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"chapter-1-part-1.xhtml\",\"index\":12},{\"label\":\"Chapter 2: Confirmation\",\"href\":\"chapter-2.xhtml\",\"index\":13},{\"label\":\"Part 1\",\"href\":\"chapter-2-part-1.xhtml\",\"index\":14},{\"label\":\"Chapter 3: The Commencement of a One-Year Period\",\"href\":\"chapter-3.xhtml\",\"index\":15},{\"label\":\"Part 1\",\"href\":\"chapter-3-part-1.xhtml\",\"index\":16},{\"label\":\"Part 2\",\"href\":\"chapter-3-part-2.xhtml\",\"index\":17},{\"label\":\"Part 3\",\"href\":\"chapter-3-part-3.xhtml\",\"index\":18},{\"label\":\"Part 4\",\"href\":\"chapter-3-part-4.xhtml\",\"index\":19},{\"label\":\"Part 5\",\"href\":\"chapter-3-part-5.xhtml\",\"index\":20},{\"label\":\"Chapter 4: An Onlooker's Perspective \",\"href\":\"chapter-4.xhtml\",\"index\":21},{\"label\":\"Part 1\",\"href\":\"chapter-4-part-1.xhtml\",\"index\":22},{\"label\":\"Part 2\",\"href\":\"chapter-4-part-2.xhtml\",\"index\":23},{\"label\":\"Chapter 5: Convolution\",\"href\":\"chapter-5.xhtml\",\"index\":24},{\"label\":\"Part 1\",\"href\":\"chapter-5-part-1.xhtml\",\"index\":25},{\"label\":\"Part 2\",\"href\":\"chapter-5-part-2.xhtml\",\"index\":26},{\"label\":\"Part 3\",\"href\":\"chapter-5-part-3.xhtml\",\"index\":27},{\"label\":\"Part 4\",\"href\":\"chapter-5-part-4.xhtml\",\"index\":28},{\"label\":\"Part 5\",\"href\":\"chapter-5-part-5.xhtml\",\"index\":29},{\"label\":\"Chapter 6: School Life in Class C\",\"href\":\"chapter-6.xhtml\",\"index\":30},{\"label\":\"Part 1\",\"href\":\"chapter-6-part-1.xhtml\",\"index\":31},{\"label\":\"Chapter 7: Ayanokouji's Defeat\",\"href\":\"chapter-7.xhtml\",\"index\":32},{\"label\":\"Part 1\",\"href\":\"chapter-7-part-1.xhtml\",\"index\":33},{\"label\":\"Part 2\",\"href\":\"chapter-7-part-2.xhtml\",\"index\":34},{\"label\":\"Part 3\",\"href\":\"chapter-7-part-3.xhtml\",\"index\":35},{\"label\":\"Part 4\",\"href\":\"chapter-7-part-4.xhtml\",\"index\":36},{\"label\":\"Part 5\",\"href\":\"chapter-7-part-5.xhtml\",\"index\":37},{\"label\":\"Chapter 8: Enem
