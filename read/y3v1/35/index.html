e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T2fc8,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 3\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTHE SPECIAL EXAM conducted in the early afternoon had ended, and soon, it was time for Class 3-D\u0026apos;s homeroom period to start. The results were to be announced on the same day, so many students were visibly restless.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIchinose slowly looked around the class, analyzing the expressions of each student, and felt hopeful about the upcoming results. They weren\u0026apos;t sure about the outcome of the full-class battle, but in the small-group battle, their assigned penalty points went better than anyone had anticipated.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTheir odds of winning, which were around fifty percent, must have risen to over seventy afterward\u0026#x2014;that was what she predicted.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, they couldn\u0026apos;t let their guard down until the very end.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was still the possibility that Horikita\u0026apos;s class, despite multiple twenty-point handicaps, could still get multiple high scores or achieve more than expected in the full-class battle.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey had high expectations and a bit of anxiety.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, the moment Hoshinomiya entered the classroom, the anxieties were immediately swept away from the whole class.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a characteristic typical of Hoshinomiya, which couldn\u0026apos;t really be called a strong or a weak point, that made the result evident.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBefore even announcing the results, her expression had already softened significantly, and she could hardly contain her joy, making the outcome obvious to everyone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Everyone, sorry to keep you waiting. The results of the special exam are in, and I\u0026apos;d like to announce them!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yesss! We did it!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShibata prematurely took his victory stance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hey, I haven\u0026apos;t said anything yet~?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I mean, it\u0026apos;s clear as day, isn\u0026apos;t it?! We did it, we did it!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShibata pointed out how her atmosphere made it obvious and started hopping around, but Hoshinomiya\u0026apos;s cheeks remained relaxed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Shibata-kun\u0026apos;s become really cheerful lately. I mean, isn\u0026apos;t it a bit too much? It\u0026#x2019;s like he\u0026#x2019;s a new person.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKobashi and the person who sat in front of her, Iizuka, started whispering about Shibata.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Look, there was that heartbreak\u0026#x2026; It\u0026apos;s not like he\u0026apos;s despairing, but maybe he can\u0026apos;t hold himself together without acting cheerful.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah~ And it\u0026apos;s not just Shibata-kun, right? Well, it can\u0026apos;t be helped~\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Can you believe that Honami-chan made a public confession? Eh, wait, is she already dating Ayanokouji-kun?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t know, but they\u0026apos;ve been coming to school together a lot lately, so maybe they are?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hmm\u0026#x2026; I mean, I guess Ayanokouji-kun is cool and all, but still, for him to win over Honami-chan\u0026#x2026; I wonder what kind of interaction they had.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIizuka looked at Ichinose and nodded in admiration.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Shh, don\u0026apos;t stare too much, or they\u0026apos;ll notice. The boys are all tense about that matter right now. It\u0026apos;s better not to make a fuss.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But I\u0026apos;m curious about Karuizawa-san and stuff\u0026#x2026; Should I ask?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No way. That kind of thing is, you know, tactless.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Okay, everyone, focus on the results~\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs the students started getting noisy, Hoshinomiya lightly called out to them and cleared her throat.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen, she operated the tablet, and the results were displayed.\u003c/p\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026#x203b; The winners of each match will be bolded\u003c/em\u003e\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cstrong\u003eClass A vs. Class D:\u003c/strong\u003e\u003c/p\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eFull-Class Battle:\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eClass A \u0026#x2014; 2633 pts vs. \u003cstrong\u003eClass D \u0026#x2014; 2712 pts\u003c/strong\u003e\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eSmall-Group Battles:\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e1: Sudou Ken \u0026#x2014; 66 pts vs. \u003cstrong\u003eHimeno Yuki \u0026#x2014; 69 pts\u003c/strong\u003e\u0026#xa0;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e2: Wan Mei-Yui \u0026#x2014; 82 pts (Penalty 25) vs. \u003cstrong\u003eKanzaki Ryuuji \u0026#x2014; 75 pts (Penalty 10)\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e3: Yukimura Teruhiko \u0026#x2014; 84 pts (Penalty 25) vs \u003cstrong\u003eTsube Hitomi \u0026#x2014; 77 pts (Penalty 10)\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e4: \u003cstrong\u003eMori Nene \u0026#x2014; 69 pts\u003c/strong\u003e\u0026#xa0;vs. Kobashi Yume \u0026#x2014; 68 pts\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e5: Kouenji Rokusuke \u0026#x2014; 72 pts (Penalty 25) vs.\u003cstrong\u003e\u0026#xa0;Beppu Ryouta \u0026#x2014; 71 pts\u003c/strong\u003e\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cstrong\u003eClass B vs. Class C:\u003c/strong\u003e\u003c/p\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eFull-Class Battle:\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eClass B \u0026#x2014; 2327 pts vs. \u003cstrong\u003eClass C \u0026#x2014; 2880 pts\u003c/strong\u003e\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eSmall-Group Battles:\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e1: \u003cstrong\u003eIshizaki Daichi \u0026#x2014; 40 pts \u003c/strong\u003evs. Ayanokouji Kiyotaka 100 pts (Penalty 100)\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e2: Yabu Nanami \u0026#x2014; 47 pts vs.\u003cstrong\u003e\u0026#xa0;Shimazaki Ikkei \u0026#x2014; 81 pts\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e3: Ibuki Mio \u0026#x2014; 43 pts vs.\u003cstrong\u003e\u0026#xa0;Fukuyama Shinobu \u0026#x2014; 79 pts\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e4: Kondou Reon \u0026#x2014; 47 pts vs. \u003cstrong\u003eSanada Kousei \u0026#x2014; 83 pts\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e5: Kinoshita Minori \u0026#x2014; 50 pts vs. \u003cstrong\u003eSawada Yasumi \u0026#x2014; 80 pts\u003c/strong\u003e\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBoth leaders, Horikita and Ichinose, were wary that they\u0026apos;d get targeted by the penalty points, so they didn\u0026apos;t participate in the small-group battles. Class A opted for a strategy that paired top students with those with moderate abilities, including unexpected combinations like Sudou and Kouenji.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOn the other hand, Class D primarily chose their participants from those who were a bit above average within their class.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eLooking at the results alone, both of the upper two classes were defeated, but Class D didn\u0026apos;t win by a large margin. Few would consider it an easy victory.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It was scary, but I\u0026apos;m glad we bought the penalty points.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIchinose gave a nod at Amikura\u0026apos;s happy tone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAside from the three who were accurately targeted within the small-group participants, twenty-five penalty points were also designated to Hirata Yousuke and Kushida Kikyou, which meant that Ichinose and her class had to pay an additional 1.25 million Private Points out of their own pockets to get the required additional penalty points. Although it was a significant expense, when divided amongst forty people, each person only had to be burdened with paying 31,250 Private Points, which wasn\u0026#x2019;t too taxing on the wallet. Plus, with their monthly income increasing by ten thousand Private Points due to their victory, they\u0026apos;d recover their investment in four months with some to spare.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Congratulations, everyone. We definitely had to defeat Class A, and we did it splendidly!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026#xa0;Even though they anticipated the outcome, the class erupted in joy as it was confirmed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We did it, Honami-chan! We won, we won!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe nearby girls also exploded with joy along with their teacher\u0026apos;s words.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Phew. That\u0026apos;s a relief. It feels like a weight\u0026apos;s been lifted off my shoulders.\u0026quot; Ichinose shared her joy with Shiranami who sat beside her, exchanging high-fives.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSeeing the students\u0026apos; joyous expressions, their homeroom teacher Hoshinomiya also nodded happily.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes, yes. As your homeroom teacher, I\u0026apos;m very satisfied with the result. Of course, there\u0026apos;s still a big gap, so we need to stay focused and keep working hard~\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;By the way\u0026#x2026; I thought that Ayanokouji was the only one who ended up losing, but he actually scored perfectly on that test!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There were some really difficult questions, right? I didn\u0026apos;t even understand some of the questions\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs surprise arose in their classroom, Kobashi and Iizuka looked at each other.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOne particular thought had struck them\u0026#x2014;\u0026apos;\u003cem\u003eIs this why!?\u003c/em\u003e\u0026apos;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The quiet, handsome boy who\u0026#x2019;s been hiding his abilities\u0026#x2026; Ah, this is why, Kobashi-san\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This is why, Iizuka-san\u0026#x2026; surely this is why\u0026#x2026; Honami-chan knew this\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe two joined their hands together, interpreted things their own way, and repeatedly nodded at each other with sparkling eyes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUnaware of their conversation, Ichinose took out her phone and sent a message to Ayanokouji.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e[\u0026#x2018;Getting a perfect score sure is amazing. It\u0026apos;s a pity that some of the penalty points were wasted, but I\u0026apos;m glad Class C could win. Our class also won thanks to you, Ayanokouji-kun. As expected, Kouenji-kun showed up, and Horikita-san didn\u0026apos;t participate. Thank you so much.\u0026apos;]\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs soon as she sent it, the message was read, and a reply came back.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e[\u0026apos;It\u0026apos;s thanks to your courage in choosing to trust in my advice that you won.\u0026apos;]\u003c/em\u003e\u0026#xa0; Ichinose couldn\u0026apos;t help but smile at such a humble reply.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, since they were still technically in class, she decided not to continue the conversation and immediately turned off her phone.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 3\",\"volumeId\":\"y3v1\",\"chapterIndex\":35,\"prevChapter\":{\"volumeId\":\"y3v1\",\"chapter\":34,\"title\":\"Part 2\"},\"nextChapter\":{\"volumeId\":\"y3v1\",\"chapter\":36,\"title\":\"Part 4\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 1\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: The End of Everyday Life\",\"href\":\"prologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Confusion\",\"href\":\"chapter-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"chapter-1-part-1.xhtml\",\"index\":12},{\"label\":\"Chapter 2: Confirmation\",\"href\":\"chapter-2.xhtml\",\"index\":13},{\"label\":\"Part 1\",\"href\":\"chapter-2-part-1.xhtml\",\"index\":14},{\"label\":\"Chapter 3: The Commencement of a One-Year Period\",\"href\":\"chapter-3.xhtml\",\"index\":15},{\"label\":\"Part 1\",\"href\":\"chapter-3-part-1.xhtml\",\"index\":16},{\"label\":\"Part 2\",\"href\":\"chapter-3-part-2.xhtml\",\"index\":17},{\"label\":\"Part 3\",\"href\":\"chapter-3-part-3.xhtml\",\"index\":18},{\"label\":\"Part 4\",\"href\":\"chapter-3-part-4.xhtml\",\"index\":19},{\"label\":\"Part 5\",\"href\":\"chapter-3-part-5.xhtml\",\"index\":20},{\"label\":\"Chapter 4: An Onlooker's Perspective \",\"href\":\"chapter-4.xhtml\",\"index\":
