3eOr did our results just seem close, while in reality, it was a crushing defeat?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter school, I was in Class A\u0026apos;s deserted classroom.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI remained alone in that place, unable to come up with an answer.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter our loss, no one openly blamed me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOn the contrary, everyone just comforted me, saying there\u0026apos;d be a next time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, most of Sudou-kun\u0026apos;s and the others\u0026apos; warm words hardly registered.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t remember exactly what they said; I couldn\u0026apos;t recall.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd before I knew it, I was just sitting there, my mind void, remaining in my chair until I was the very last one left.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom the classroom dyed in twilight, I suddenly looked out the window.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was then that I first realized that the sun was about to set.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I should go home\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWithout thinking, I stood up, reached for the door, only to realize I had forgotten my bag and returned to my seat.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen, I walked through the deserted corridor and headed to the entrance hall.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWhat am I doing here?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWhat\u0026apos;s my goal in this place? \u003c/em\u003eI felt an intense sense of loneliness.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eI\u0026apos;m becoming useless, hopelessly so\u0026#x2026;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eCan I recover by tomorrow?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eCan I start walking forward the day after tomorrow?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t know.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t know anything.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was stuck in a loop.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI put on my shoes, went outside, and started walking.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026#x2026;Let\u0026apos;s go home.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnyway, I wanted to return to the dorm and lie down in bed\u0026#x2014;\u003c/p\u003e\u003cimg src=\"/hola-lector-agua/images/books/y3v1/OEBPS/LnlDdvYSnrejZGRPHugPs.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cimg src=\"/hola-lector-agua/images/books/y3v1/OEBPS/pDYvcNPCDHSOaSMdTKDrI.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cp class=\"paragraph after-image\" style=\"text-align: left\"\u003eSuddenly, my thoughts were interrupted, and my vision shook violently.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAn unexpected shock hit me from the depths of my heart.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI felt a sharp\u0026#xa0;pain\u0026#xa0;in my back and, without warning, I was thrown forward.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlthough my hands reflexively reached out, I couldn\u0026apos;t manage to properly break my fall and slid across the ground.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMoreover, the ground was a gravel-filled area, hardly soft.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy bag rolled away, kicking up a cloud of dust.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ugh\u0026#x2026;!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe pain followed belatedly. My hands and knees, which tried to protect me, especially felt the sting.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What\u0026#x2026; What was that!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was only later that I realized the unbelievable fact that I\u0026#x2019;d been kicked.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen, although delayed, my brain transmitted a thought to me\u0026#x2014;\u003cem\u003eI need to check who the perpetrator is\u003c/em\u003e.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;ve grown pathetic, Horikita. You can\u0026apos;t even dodge a kick like that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe owner of the voice that kicked me hadn\u0026apos;t even a hint of malice, not even one percent.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith her arms crossed, she scoffed as if she was looking down on me; it was Ibuki-san.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What are you doing\u0026#x2026;? You\u0026apos;re out of your mind.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eDon\u0026apos;t you know what happens when you kick someone who\u0026apos;s defenseless with full force?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBefore I could tell her off and direct my anger at her, Ibuki-san cast a contemptuous glare in my direction.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Your pathetic appearance has always been irritating to me. It pisses me off just looking at you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Just don\u0026apos;t look at me then\u0026#x2026; It\u0026apos;s that simple.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWhy do I have to get kicked by some barbarian without any reason, especially when I\u0026apos;m having such rough days, and right after a painful defeat too?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was truly adding insult to injury.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI sighed as I looked at the small amounts of blood seeping into my palm.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;See, that\u0026apos;s what I mean. That kind of spineless attitude keeps jumping into my line of sight; it can\u0026apos;t be helped. You should be thankful I only kicked you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t understand what you mean.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t want to deal with Ibuki-san right then.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI dusted myself off, stood up, and picked up my bag.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFortunately, it seemed my knees weren\u0026apos;t scraped.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hmph. Can\u0026apos;t you even retaliate? Well, even if you did, I\u0026apos;d just counter it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I wouldn\u0026apos;t do that\u0026#x2026; Besides, I\u0026apos;m not\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven at such a time, Ayanokouji-kun\u0026apos;s image came to my mind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ugh, you just thought about Ayanokouji again, didn\u0026apos;t you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;So what? It\u0026apos;s none of your business.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Everyone\u0026apos;s always\u0026#xa0;going off about Ayanokouji this,\u0026#xa0;Ayanokouji\u0026#xa0;that. Can\u0026apos;t you be glad that the plague is finally gone from your class?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I thought you were a bit\u0026#x2014;no, quite lacking in wisdom, but you really are stupid. How could I be happy about him being gone?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;d jump for joy. Just seeing his face makes me so angry\u0026#x2026; Ah, just thinking about it makes me angry. I thought I could finally get one over on him, but it was Ryuuen who ended up embarrassed.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIbuki-san, truly irritated, kicked the ground.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What are you even talking about\u0026#x2026;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI muttered my confusion, then I recalled today\u0026apos;s exam results. Ayanokouji-kun had predictably defeated Ryuuen-kun\u0026apos;s class\u0026#x2026;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was done with a flashy performance that left an unusual impact.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven the exam\u0026apos;s results felt like a distant, unrelated event until just then.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you plan to stay this pathetic forever, I\u0026apos;m done with you. Don\u0026apos;t ever get involved with me again, in fact, don\u0026apos;t even come into my sight.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t recall ever being a bother to you, and to begin with, we never had such a deep relationship in the first place.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn fact, I spent a lot of my own time, money, and effort to help her when she was short on cash.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI only remembered being criticized, never thanked.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh well. Bye then.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHaving vented what she wanted to say, Ibuki-san walked away.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI crouched down on the spot, shutting my eyes against the pain that my back was still inflicted with.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why does it always have to be like this\u0026#x2026;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy school life as a third-year student had just begun.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe moment I saw that \u0026apos;Class A\u0026apos; nameplate was my only joy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIt\u0026apos;s been painful.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eSomeone\u0026#x2026;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eHelp me\u0026#x2026;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eAyanokouji-kun\u0026#x2014;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you okay?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I crouched with my head down toward the ground, someone called out to me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It looked like she hit your back really hard, are you hurt? Should I call a teacher?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was Karuizawa-san who had looked at me, concerned, apparently having seen everything that transpired.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSeeing her still in her uniform, it seemed she hadn\u0026apos;t gone home yet.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m fine\u0026#x2026; the pain is finally starting to subside. She really has no common sense\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I tried to grasp the hand she offered, I remembered that my own palm was covered in blood and dirt and tried to pull back, but Karuizawa-san gently grabbed my wrist and helped me up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen, she brushed the dirt off my uniform with a handkerchief she had.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t have the energy to refuse, so I just watched her, devoted as she was, do as she pleased.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m sorry, and thank you. I must have shown you something ridiculous\u0026#x2026; Did you hear what was being said?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No\u0026#x2026; I was sitting on the bench when I saw the exchange between you and Ibuki-san.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe pointed to a bench further toward the dorms as she spoke.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNormally, I would\u0026#x2019;ve noticed her, but Karuizawa-san hadn\u0026apos;t appeared in my sight.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was why I hadn\u0026apos;t sensed Ibuki-san\u0026apos;s presence either.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe picked up my bag and urged me to sit on the bench.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDespite my bravado, I was still dealing with a significant amount of pain, so I followed her lead.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sorry about the handkerchief. It must be dirty, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s fine. That\u0026apos;s what it\u0026apos;s there for, to get dirty.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m really hopeless right now\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI sighed and closed my eyes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was showing her such an utterly pitiful appearance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m sorry about today\u0026apos;s exam as well. I couldn\u0026apos;t lead the class to victory.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t think it\u0026apos;s your fault. If we had scored more points, we could\u0026#x2019;ve won the full-class battle.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Still, it\u0026apos;s my responsibility.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eI really need to be more careful\u0026#x2026;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eI even made Karuizawa-san seriously worried.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s kind of surprising.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs Karuizawa-san sat beside me, she voiced her thoughts.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Surprising?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I always thought of you as someone much more composed, Horikita-san.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s not true. I\u0026apos;m just\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI almost denied it, but soon, I couldn\u0026apos;t speak.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBecause that denial was a lie.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;It\u0026apos;s not true. I thought I was quite strong myself, but it wasn\u0026apos;t me who was strong\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI clenched my hands that were resting on my knee.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA slow pain spread from my injured palms.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I realized that it was only because Ayanokouji-kun was in the class that I was able to stand up straight.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was just being supported. I thought it was my own strength.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m a weak person. It\u0026apos;s okay if you laugh.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBeing mocked would probably be better for me now than being comforted.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I won\u0026apos;t laugh. I\u0026apos;m just as weak.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut she didn\u0026apos;t try to blame me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s not true. You\u0026apos;ve had a distinct backbone from the moment you entered school. Whether all your methods were praiseworthy is another matter.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe quickly made friends with classmates of the same gender and became the center of her circle in no time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere were a few bad rumors, but there was no doubt she was at the center.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI couldn\u0026apos;t even think of imitating what she had done.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eI wonder if Ayanokouji-kun\u0026apos;s transfer was a good thing for Karuizawa-san\u0026#x2026;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs the one who initiated the breakup, maybe she felt it was better that he left.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut since that day, I felt that Karuizawa-san hadn\u0026#x2019;t been smiling.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIs it simply because she\u0026apos;s anxious about the class\u0026apos;s future?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What kind of person was Ayanokouji-kun to you\u0026#x2026;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDespite feeling I shouldn\u0026apos;t pry, the words naturally slipped out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What kind of person, huh\u0026#x2026;? It\u0026apos;s hard to sum up in one word\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKaruizawa-san looked up at the evening sky and recalled her memories.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;He\u0026apos;s a crucial person to me. Someone important\u0026#x2026; someone I love\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer profile and words didn\u0026apos;t seem like those of someone who had turned away from Ayanokouji-kun.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;Was it his idea? Maybe\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I can\u0026apos;t say. Not saying it\u0026#x2026; that\u0026apos;s become my reason for existence.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;You\u0026apos;re\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eHow shallow and foolish am I\u0026#x2026;?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy suffering was nothing compared to Karuizawa-san\u0026apos;s.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI finally understood that here.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s tough when various hardships pile up, isn\u0026apos;t it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;It really, really is\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat had been lodged deep in my chest all this time had started to loosen in front of Karuizawa-san.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI felt my clouded vision gradually clearing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ouch\u0026#x2026;! Seriously, she\u0026apos;s such a handful. This is just violence, no matter how you look at it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I calmed down a bit, the pain in my palm flared up again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Perhaps, but\u0026#x2026; maybe Ibuki-san was worried about you in her own way?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Her? That\u0026apos;s impossible.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I was sitting on this bench all day, but Ibuki-san was lingering around here and didn\u0026apos;t seem to want to go home. It kind of felt like she was waiting for someone?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;She\u0026#xa0;must have been waiting for someone else.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf even Ibuki-san was worried about me, it must\u0026apos;ve been really serious.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eThat\u0026apos;s bad. Regardless of her true intentions, it\u0026apos;s true that I\u0026apos;m in a terrible state.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hey, Horikita-san. Can I ask you a question that might be a bit insensitive?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;An insensitive question? What is it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Do you\u0026#x2026; like Ayanokouji-kun too?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Eh\u0026#x2014;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe look in Karuizawa-san\u0026apos;s eyes as she turned to me didn\u0026#x2019;t show that she was joking. It was a gaze that showed her sincerity.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What are you talking about? That\u0026apos;s ridiculous.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIf I liked him\u0026#x2026;? There\u0026apos;s no way that could be\u0026#x2026;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDespite the thought, spring break\u0026apos;s events naturally flashed back.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eThe pounding in my chest at that time\u0026#x2014;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a\u0026#xa0;pleasant feeling that I couldn\u0026apos;t describe, yet at the same time, it was embarrassing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey were emotions I\u0026#x2019;d never experienced before.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s no way that could be true\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was all I could manage to squeeze out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ve never experienced liking someone before, other than my family\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But you couldn\u0026apos;t respond right away, isn\u0026apos;t that telling? If you didn\u0026apos;t like him even a little, you\u0026apos;d deny it right away, right? Like, \u0026apos;He was just a business partner,\u0026apos; or something\u0026#x2026; I\u0026apos;m not sure if I\u0026apos;m using that phrase right, though.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRather than Karuizawa-san getting angry as she spoke, she began to show a small smile instead.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer sadness and frustration\u0026#x2014;it was something incomparable to someone like me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re\u0026#x2026; a much better person than I thought.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Wow, you only just realized that now?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. I thought you were the type of student who was more on the obnoxious side.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;How rude~ Just kidding.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKaruizawa-san, self-deprecating, continued her words.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I think I actually was a nasty type of student. I was arrogant, selfish, thinking it was okay not to return money I borrowed from others, that I could do whatever I wanted. At least, that\u0026apos;s how I was right after I enrolled.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah, I\u0026apos;m sorry. It was because of my tactless remark earlier\u0026#x2026; It\u0026apos;s not something to be praised.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, it\u0026apos;s okay. It\u0026apos;s the truth. I hated that part of myself too. It\u0026apos;s something I can say now that I\u0026apos;ve changed.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;Why were you able to change?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Kiyotaka\u0026#x2014;no, Ayanokouji-kun\u0026#x2026; he saved me from the darkness.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Darkness\u0026#x2026;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKaruizawa-san looked at me, her expression somewhat fleeting.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll tell only you, Horikita-san, the secret I have with Ayanokouji-kun. Even Maya-chan doesn\u0026apos;t know.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKaruizawa-san gently held my hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer hand was cold, but for some reason, it had a strangely comforting warmth.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe hand that should\u0026#x2019;ve been hurting forgot its pain at that moment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd what she told me was the life of a girl named Karuizawa Kei.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA past I couldn\u0026#x2019;t have imagined.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe bullying she endured during middle school. Deciding to climb to the top of the school\u0026apos;s social hierarchy, even if it meant being disliked, to change her life. The fake romance with Hirata-kun.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd then\u0026#x2026; how some students, upon realizing the truth, sparked a new wave of bullying. How she was freed from that thanks to Ayanokouji-kun\u0026apos;s intervention. And how, in the end, that had been orchestrated too.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe events of her first year. The battle with Ryuuen-kun on the rooftop. I knew about this from talking to Ibuki-san this past summer, but her memory was unreliable. The details were unclear, with some parts missing. I knew Karuizawa-san suffered terribly at Ryuuen-kun\u0026apos;s hands, but I didn\u0026apos;t know the circumstances.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis was all filled in by matching it with her own memories.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI noticed a single tear falling from my cheek.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI sympathized with her harsh past.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTrying to become strong by playing the role of someone unpleasant\u0026#x2014;I realized just how difficult and steep that path really was.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut that wasn\u0026apos;t why I cried.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI should\u0026#x2019;ve had a deeper understanding when Ibuki-san told me at that time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026#x2026; haven\u0026apos;t been taught anything by him\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe had always been by my side.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNearby, I felt like I knew him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut I was wrong.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps I knew him less than anyone else.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat he always showed me was only his back.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe never turned around or waited.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;How pathetic.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI felt pathetic.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs if I, who\u0026#x2019;d been left out, was the most hurt and depressed, convinced that I was the victim.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m pathetic, aren\u0026apos;t I\u0026#x2026;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I feel the same way.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKaruizawa-san replied, laughing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSeeing her natural smile, my expression naturally softened.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That might\u0026apos;ve been my first proper laugh in a while.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Me too.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKaruizawa-san and I.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI never thought we\u0026apos;d have anything in common.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut now, I felt more connected to her than anyone else in the class.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI squeezed her hand back.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen, perhaps Karuizawa-san\u0026apos;s pent-up feelings began to overflow.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA tear sparkled on her cheek.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We both got involved with a really difficult person, didn\u0026apos;t we?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes, really\u0026#x2026; We really did.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI realized that it was better not to delve too deeply into him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut\u0026#x2026;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI couldn\u0026apos;t back down now.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Now that it\u0026apos;s come to this, I have no choice but to make him turn his head this way. And I \u003cem\u003ewill \u003c/em\u003egraduate with everyone in Class A. I promise.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wouldn\u0026apos;t be easy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith him as an enemy, graduating from Class A had become an unprecedented challenge.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut I wouldn\u0026apos;t stop anymore.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You really are strong, Horikita-san.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Not at all. I\u0026apos;m a weak person, but I\u0026apos;ve realized that I\u0026apos;m not alone.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith comrades by my side, it wouldn\u0026apos;t be impossible.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Alright\u0026#x2026; then I also\u0026#x2026; need to start changing my mindset soon.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKaruizawa-san wiped her tears, gave a mighty stretch, and stood up from the bench.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen, she turned around with a smile again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Let\u0026apos;s make him regret transferring out of our class.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes\u0026#x2014;let\u0026apos;s definitely make him regret it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI finally took a step forward.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBoth in reality and in my heart.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 8: Enemies and Allies\",\"volumeId\":\"y3v1\",\"chapterIndex\":38,\"prevChapter\":{\"volumeId\":\"y3v1\",\"chapter\
