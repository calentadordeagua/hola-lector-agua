e approached, was unmistakably stern.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ayanokouji. You know what I want to say, right?\u0026quot; Shimazaki spoke, pointing at the monitor still displaying the results of the special exam.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You missed every single participant. You really made a remarkable debut.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Calm down, Shimazaki. We won the exam, so it\u0026apos;s all the same in the end.\u0026quot; Hashimoto hurriedly intervened between me and Shimazaki, but Shimazaki forcefully pushed him aside.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I told you before the exam, didn\u0026apos;t I? This time, we\u0026apos;re not judging on whether the class won.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I believe we were focusing on the accuracy of penalty points assigned.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I was expecting you to correctly guess at least two of them, secretly hoping for three\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Winners will be right, and losers will be wrong. Let\u0026apos;s call it even this time, okay?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto tried to mediate, still flustered by the outcome.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sorry, but that\u0026apos;s not going to happen. I intend to make things clear here.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then let\u0026apos;s talk among the three of us. There\u0026apos;s no need to air our grievances in front of everyone.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs Shimazaki clenched his fist, ready to reject this new proposal, the classroom door abruptly opened. Everyone\u0026apos;s words and attention were disrupted by the unexpected noise.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yo, don\u0026apos;t mind me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen led the way as he and his usual group, Ishizaki, Ibuki, and Albert, entered the classroom without permission.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hey, what\u0026apos;s the meaning of this sudden\u0026#x2014;!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs the intimidating group barged in, Shimizu, who sat in the front row near the door, bravely tried to stand up, but a large figure blocked him from approaching Ryuuen.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOverwhelmed by the pressure, Shimizu immediately sat back down.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile this scene unfolded near the door, Sawada, a girl who\u0026#x2019;d been listening to the conversation with Shimazaki near me, unintentionally blocked Ryuuen\u0026apos;s path. Unable to find the right moment to move, she froze, and Ryuuen forcibly cleared the way, grabbing her shoulder.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Kyaa!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith a small scream, she staggered and fell onto a desk, quickly bracing herself with her hands.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlthough it wasn\u0026apos;t a great fall, Ryuuen\u0026apos;s ruthless action froze the entire class.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt felt like a brawl might break out right there in the classroom, in broad daylight.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We\u0026apos;re busy here, you know? Geez, I only have one body.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUnable to leave Shimazaki, who was trying to approach me with clenched fists, Hashimoto lamented not having more bodies to deal with the situation that required more.\u0026#xa0;He seemed to be sending a look for help to Kitou, who was nearby when Sawada almost fell, but Kitou didn\u0026apos;t say a word, didn\u0026apos;t move, and just sat in his seat, watching the situation unfold.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why are there so few allies\u0026#x2026;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith a resolve to act, Hashimoto stood alone between Shimazaki and Ryuuen.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I came all the way here for a winner\u0026apos;s interview, move it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSmirking, Ryuuen ignored Hashimoto and continued to approach me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll take responsibility. Shoot him\u003csup id=\"fnref-1-d882dfd0-711b-5d8a-843b-ce952a822120\"\u003e\u003ca class=\"footnote-ref\" href=\"#fn-1-d882dfd0-711b-5d8a-843b-ce952a822120\" data-ref=\"1\" epub:type=\"noteref\"\u003e[1]\u003c/a\u003e\u003c/sup\u003e\u0026#xa0;immediately.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSomeone behind me seemed to whisper such an absurdity, but it was clear that she wouldn\u0026apos;t actually take responsibility, so I decided to ignore it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Give me a break, Ryuuen. I\u0026apos;m busy today.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So what?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not about \u0026apos;what\u0026apos;... I don\u0026apos;t expect you to understand, but\u0026#x2026; damn it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs Ryuuen advanced toward Hashimoto, he grabbed his shoulder just as he had done with Sawada.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto hesitated for a moment, wondering whether to retaliate, but Ryuuen pushed him aside and forcefully made his way toward me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto must\u0026apos;ve decided that he couldn\u0026apos;t exactly strike\u0026#xa0;first.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So? Has it been officially decided that you\u0026apos;ll lead Class C from now on, Ayanokouji?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;According to Shimazaki, the outcome doesn\u0026apos;t matter; what mattered was my precision in selecting the right students to assign the penalty points to in the small-group battles. Unfortunately, I couldn\u0026apos;t identify any of the students you nominated.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe nomination results, showing that I had gotten zero out of five students correct, were still displayed on the monitor.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, isn\u0026apos;t that troublesome. No wonder it\u0026apos;s gloomy in here despite your class winning, but I guess you\u0026apos;re not planning on making excuses about how it would be unthinkable that I\u0026apos;d be choosing a lineup of idiots, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Who are you calling idiots?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Eh, me and Ibuki, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIshizaki casually pointed back and forth between himself and Ibuki.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I know that! I meant that he didn\u0026apos;t have to say it in front of my face, dumbass!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What, so you knew he was talking about you. Besides, we\u0026apos;re behind him, not in front.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s not the point!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIbuki gave Ishizaki a hard kick on his butt, but ignoring the farce behind him, Ryuuen continued.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So you weren\u0026#x2019;t recognized as a leader this time. That\u0026apos;s too bad.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto, whom Ryuuen had previously pushed aside, intervened again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t just assume things. Regardless of the process, we won the special exam. That\u0026apos;s why we were discussing future plans with Shimazaki and others. Right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto sent a pleading look, begging to be acknowledged just this once.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever\u0026#x2026; Shimazaki didn\u0026#x2019;t nod in agreement.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I told you, this special exam was supposed to be an easy win. Written exams are our class\u0026apos;s forte. Winning or losing doesn\u0026apos;t qualify Ayanokouji. It\u0026apos;s about whether he could accurately impose penalty points on the participants. The overall result was disastrously clear.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIndeed, despite handicaps, the total score for our full-class battle was significantly higher compared to the other three classes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But, Shimazaki, that\u0026#x2019;s\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto tried to say something, but Ryuuen interrupted.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Kukuku. I see, it does seem like you\u0026apos;re busy. It looks like the celebration for Ayanokouji\u0026apos;s rise to leadership will have to wait.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen, having grasped the situation, turned away with a satisfied smile.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto quietly clicked his tongue, but for now, he probably just wanted the troublemakers to leave.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen seemed to have finished confirming the situation, and normally, no one would stop him from leaving.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat is, except one person, me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ryuuen, considering that\u0026apos;s your take on it, aren\u0026apos;t your senses a bit too numb?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? My senses, you say.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe stopped in his tracks, not understanding the meaning behind my words, and turned his head to look back at me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you don\u0026apos;t understand, you should ask Shimazaki to continue what he was saying.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen immediately stopped laughing and cast a sharp glance at Shimazaki, who stood nearby.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hey, Ayanokouji, can\u0026apos;t that wait until after Ryuuen leaves?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto, who didn\u0026apos;t think this would turn out well, gave his suggestion quietly, but I refused.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShimazaki, who had shown a moment of flinching as if intimidated by a snake, took a deep breath and raised his face.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then I won\u0026apos;t be holding back, Ayanokouji. I didn\u0026apos;t come here to complain. There are many things I don\u0026apos;t like, honestly\u0026#x2026; but still, I came to acknowledge you for now\u0026#x2014;about taking command in this class.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShimazaki\u0026apos;s words were not of rejection, but of acknowledgment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNaturally, Ryuuen and Hashimoto couldn\u0026apos;t understand why he said such a thing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah? What a strange thing to say. This guy couldn\u0026apos;t see through my nominations. Didn\u0026#x2019;t you say you were focusing on those results? Moreover, Ayanokouji willingly participated in the small-group battle and received a massive penalty from me. He scored zero points. Because of that, you lost your chance at a precious complete victory.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNot only had I not been able to see through his selection, they had managed to get a complete reading us on top of that\u0026#x2014;it was the worst possible outcome\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUnderstanding this, Hashimoto, who had been standing by, also wanted to somehow calm Shimazaki down.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Indeed, if Ayanokouji himself hadn\u0026apos;t participated in the small-group battle, we might\u0026apos;ve had a good chance at achieving a complete victory. But\u0026#x2026; after seeing that result\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShimazaki chuckled and looked back at the monitor that remained displayed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFollowing him, Ryuuen also looked at the results, but he didn\u0026apos;t feel any sense of discomfort.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eClass C had six wins and one defeat. It was a victory Ryuuen had deliberately offered. In the small-group battles, he didn\u0026apos;t let me guess any of the participants\u0026apos; identities, and I participated, receiving all of their penalties. A complete victory was thwarted.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was exactly the result he\u0026#x2019;d envisioned and aimed for.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut in reality, the point I wanted to make was completely different.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t understand.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn response to Ryuuen, who sought an answer, I began to explain part of it in Shimazaki\u0026apos;s place.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The key to victory lies in the small-group battles. Indeed, it\u0026apos;s important to see through who the opponent\u0026apos;s class selects, so it\u0026apos;s perfectly natural for Shimazaki and the rest of Class C to base their evaluation on that. However, if the opponent wasn\u0026apos;t willing to take the exam seriously, there\u0026apos;s nothing to see through. Even if I could predict students like Ibuki or Ishizaki appearing, there\u0026apos;s no value in assigning them penalty points.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hah, well, normally that would be the case, but that\u0026apos;s the focus of this time. It only makes sense for you to try to see through the students I nominate. It\u0026apos;s an exam you\u0026apos;re probably gonna win even if you miss all of them, so if you miss it, it means you\u0026apos;ve got a class that can stand on its own without you needing to sit as the leader from the start.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What I really had to see through wasn\u0026apos;t your irrational selection after you chose to abandon thinking, but the essence of the opponent\u0026#x2014;your very aim. Whether the enemy will fight head-on, how they will fight, and how we should respond to that is what\u0026apos;s important.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen wouldn\u0026apos;t just miss the valuable opportunity to take me on.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, in a contest of academic ability, his hopes of winning were slim. Would he pour funds into it to aim for victory, or would he give up? That became the focus. And I predicted that Ryuuen would choose to step down from the battle while still scheming to inflict damage on his opponent.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eChoosing to deliberately abandon a weak area, a path that could seem like a wise decision upon first glance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe real battle wasn\u0026apos;t in April, during our first term, but later, in the second and third terms.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was why he wanted to delay the time when I would become the Class C leader for as long as possible.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe wanted to postpone Class C\u0026apos;s realization that I should become the leader, so that the decision to entrust me with the role would be made later.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, all these were merely passive methods of fighting that stemmed from an underlying fear.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Shimazaki. After this result, how do you feel about my presence here?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Honestly, you\u0026apos;re far more amazing than I imagined. No wonder Hashimoto relies on you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eInstead of blaming him for the unexpected, Ryuuen furrowed his brow at Shimazaki\u0026apos;s words of praise.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Think about it, Ryuuen. In this written exam, even students with an A in academic ability, which is the same as Ayanokoouji\u0026apos;s evaluation, could barely score around eighty points. I was one of them. Yet, Ayanokouji alone scored a perfect score, standing out from the rest of us. There were some incredibly difficult questions there\u0026#x2026; I have to admit that, whether I like it or not.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBeing a student who prided himself on his academic abilities, he felt something undeniable.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That isn\u0026apos;t the point. So what if his written scores are better than others?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s exactly the point. In the end, what we wanted to know wasn\u0026apos;t whether he could see through the opponents in the small-group battles or anything like that. What we really wanted to know was his strength\u0026#x2014;whether he was the man capable of saving this class after we were in a pinch following Sakayanagi\u0026apos;s expulsion. And\u0026#x2026; after I explained everything, I\u0026apos;m once again reminded that he made the best choice for the class\u0026apos;s victory without being confused by my meaningless demands.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith Shimazaki\u0026apos;s explanation, Ryuuen\u0026apos;s numb senses began to slightly thaw.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not just that he scored a hundred points. The fact that a dangerous guy like you was completely focused on him is incredible. Normally, you wouldn\u0026apos;t give all one hundred penalty points to one person. Even giving twenty or thirty would almost ensure safety.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen had anticipated that I would come to participate in the small-group battle to demonstrate my strength.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe decided to play a move that preserved Private Points and minimized risk.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHis class\u0026apos;s defeat wasn\u0026apos;t a cheap price to pay, but if I had lost in the small-group battle and missed a complete victory, it would\u0026apos;ve had a worse impact on how I could maneuver in Class C.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eI definitely won\u0026apos;t let Ayanokouji win. I\u0026apos;ll prevent their complete victory by embellishing it with Ayanokouji\u0026apos;s defeat\u0026#x2014;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSuch thoughts also contributed to why he gave me a maximum penalty of one hundred points.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was, in essence, the highest level of \u0026apos;caution\u0026apos; apparent to anyone\u0026apos;s eyes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen\u0026apos;s reading was correct.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was correct, but it was meaningless since it was read.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI went into the small-group battle assuming defeat to show the enormous penalty he was marking me with.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026#x2019;ve done well to study and understand my abilities during my time as a student here. However, most of Class C wouldn\u0026apos;t have known those things. They didn\u0026apos;t even know how high a score I could get in this special exam or the extent to which you were on guard. I chose the top five students in terms of academic ability from Class C. It was an extremely orthodox strategy; in other words, there weren\u0026apos;t any twists. However, I predicted that you would choose your participants unconventionally, and I knew you would impose the penalty points on me. I just needed to have a backup plan for the off chance things didn\u0026apos;t work out. Assigning the penalties to smart students like Katsuragi, Hiyori, and Kaneda\u0026#x2014;that\u0026apos;s the best way to increase Class C\u0026#x2019;s chances of winning. Because of that, there was no need to engage in a deceptive battle of wits.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eEven if some of their participants had been accurately penalized, would that really have been enough?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSome of them would\u0026apos;ve thought it was just by chance, that I just had good luck.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course. A strategy that relied on the roll of the dice couldn\u0026#x2019;t be perfectly read from the start.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was no need to make a bad bet.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe undeniable result was conveyed from Shimazaki to my other classmates, one after another.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ryuuen, no, everyone was only looking at whether they won or lost in this special exam. That\u0026apos;s natural, but I was also focusing on achieving something different. The truth is, someone like Ayanokouji Kiyotaka is far from ordinary. He showed that he could produce outstanding results and that he\u0026apos;s been thoroughly marked by a leader like you. Not all of that was necessary, but I was looking for something that anyone could clearly see. If you look through the monitor, the fact is that there\u0026apos;s only been one defeat in the small-group battles. However, no one can conclude that he lost due to his lack of academic ability. That defeat definitely stands out in an unusual way.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Haha, there\u0026#x2019;s no doubt about it. He\u0026#x2019;s definitely proven himself to be an incredible powerhouse.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto, who had observed this special exam more intently than anyone else, showed a strained smile.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf I hadn\u0026apos;t participated in the small-group battles, those around me wouldn\u0026apos;t have known the number of penalty points I had received. That was why my participation had meaning.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen and the others triumphantly showed up to check on how I was feeling.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven that was all within the plan I\u0026#x2019;d anticipated.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was exactly as scripted; Ryuuen moved predictably from beginning to end.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ryuuen, did this turn out the way you wanted it to?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe remaining Class C students glared at Ryuuen, the intruder.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was supposed to be driven into enemy territory,\u0026#xa0;but it all came back to him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s how it is, huh\u0026#x2026;? Bring it on.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen started walking after having said his piece, leaving Class C behind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe last one out, Albert, closed the door behind him, and cheers of joy erupted from the class.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHaving seen the refreshing sight of their enemy miserably retreating, they couldn\u0026apos;t hide their joy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is this the ending you were aiming for? Since when did you start planning all of this?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;From the beginning. Information isn\u0026apos;t just something you gather. Because it\u0026apos;s being gathered, you should try to use it to your advantage. I talked about the special exam with you and Morishita at the caf\u0026#xe9;. Remember when those two first years who were instructed by Ryuuen came to pick up on the conversation?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah, I thought it was impressive that you immediately saw through their reconnaissance.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You and Morishita were having a serious discussion about how I had to identify two or three participants in the small-group battle to be recognized by the class. That discussion was recorded by the first years, who were \u0026apos;guns\u0026apos; sent by Ryueen, and delivered to his ears. Not only that, but they were also monitoring Shimazaki and the others.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen would definitely use such valuable information.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You took advantage of that, but\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even though I said I had all the first year\u0026apos;s data memorized, Morishita was skeptical about whether they were actually students who received Ryuuen\u0026apos;s instructions, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes, it felt like it was lacking in basis.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There was one other thing I hadn\u0026apos;t revealed. From the day of the opening ceremony until the day the special exam was announced, I had a certain person busy running around\u0026#xa0;the first years.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Running around? Who?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;As you would expect, Ryuuen was keeping an eye on people like Hashimoto, who gathers information in Class C. Moving carelessly would give away your intentions. However, there\u0026apos;s someone else from a different class who\u0026apos;s able to smoothly communicate and quickly gain our kouhai\u0026apos;s trust, allowing them to naturally draw out information.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026#x2019;s Ichinose Honami, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s right. Those first years were approached by students from Ryuuen\u0026apos;s class and agreed to cooperate in exchange for Private Points, as seen and heard by their fellow first years. They hadn\u0026#x2019;t built the kind of relationship where they could cover for one another yet. However, it was important information we wouldn\u0026apos;t usually get our hands on so easily.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s why you were immediately convinced that those two came to check things out.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs each element was intertwined with the other, it was increasingly easier to pinpoint.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;An alliance brings various benefits. And this time, Ichinose was able to defeat Class A because she listened to my advice. Because we teamed up, we gave each other information, accepted it, and were able to implement it. As a result, we defeated the top two classes and closed the gap by a hundred points each.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs Hashimoto and Morishita stood in awe, Shimazaki, who had been sharing his joy with his friends, held out his hand to me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ayanokouji\u0026#x2026; welcome to Class C.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah. I\u0026apos;m looking forward to working with you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I shook hands with Shimazaki, classmates came up to me one after the other to shake my hands.\u003c/p\u003e\u003chr class=\"footnote-rule\"/\u003e\u003col class=\"footnotes\"\u003e\u003cli data-id=\"d882dfd0-711b-5d8a-843b-ce952a822120\" data-ref=\"1\" class=\"footnote first-footnote\" id=\"fn-1-d882dfd0-711b-5d8a-843b-ce952a822120\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003ca class=\"footnote-backref\" href=\"#fnref-1-d882dfd0-711b-5d8a-843b-ce952a822120\"\u003e[1]: \u003c/a\u003eIt\u0026apos;s just Morishita being quirky.\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 4\",\"volumeId\":\"y3v1\",\"chapterIndex\":36,\"prevChapter\":{\"volumeId\":\"y3v1\",\"chapter\":35,\"title\":\"Part 3\"},\"nextChapter\":{\"volumeId\":\"y3v1\",\"chapter\":37,\"title\":\"Part 5\"},\"toc\":[{\"label\":\"Classroom of the
