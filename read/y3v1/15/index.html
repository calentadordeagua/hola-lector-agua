e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T3bff,"])</script><script>self.__next_f.push([1,"\u003ch1 class=\"heading_1\"\u003e\u003ca class=\"heading-link\" href=\"/read/y3v1/2\"\u003eChapter 3:\u003cbr/\u003eThe Commencement of a One-Year Period\u003c/a\u003e\u003c/h1\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eREWINDING A SHORT period of time, it was back to the moment immediately following the opening ceremony.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUpon exiting the gymnasium, rather than returning to Class A, I headed straight to the staff room. However, with a faculty meeting in session, I changed my direction and headed toward the chairman\u0026apos;s office to submit my notice. The chairman did seem a bit surprised, but perhaps that man had already informed him\u0026#x2014;he decided against asking any further questions. Afterward, the various arrangements swiftly proceeded; which included the verification of the twenty million points and their source.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHaving heard about this right before the homeroom period started, I was sure that it\u0026apos;d take some time for Mashima-sensei to understand that this was in fact real.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith a hint of bewilderment still remaining on his face, Mashima-sensei, the homeroom teacher, cleared his throat and looked at me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;For what it\u0026apos;s worth, I think I should introduce myself here. What do you think?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, it wasn\u0026apos;t my first time at this school.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom the time I\u0026apos;d spent in this school up until now, even though we might have been in different classes, I remembered everyone\u0026apos;s names and faces.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd all the Class C students were aware of me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, I still had to go through the formalities.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The opening ceremony just ended, but I, Ayanokouji Kiyotaka, have transferred to this class using twenty million Private Points. I can\u0026apos;t replace Sakayanagi, who voluntarily withdrew, but if there\u0026apos;s still a will to fight among everyone here, I\u0026apos;m confident that I can help overcome the class\u0026apos;s greatly deteriorated situation.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI kept it brief, but I firmly conveyed what was necessary.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eReflecting on my past failure during my self-introduction as a first-year student, I chose my words carefully.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eI think it was a passing mark, but I wonder if my intentions were properly conveyed to the students here.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs everyone silently watched, one student broke the silence and clapped.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Glad to have ya, Ayanokouji.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was the biggest investor in my transfer to Class C\u0026#x2014;Hashimoto Masayoshi.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eStarting from there, a few others began to clap sporadically.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, I could see that not everybody was welcoming.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe looks directed at me weren\u0026apos;t all warm.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRather, the majority of their gazes were cold, and many of them weren\u0026apos;t truly welcoming.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, I didn\u0026apos;t expect everyone to accept me from the beginning.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRather, it would speak poorly of the class\u0026apos;s quality if that were the case..\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt would be like them introducing themselves as a feeble gathering of a class\u0026#x2014;one that, upon losing Sakayanagi, had now lost all of its ability to judge situations, leaving everything to a helper\u003csup id=\"fnref-1-b702813e-7648-5d2c-9e4b-04e4dafc1c0f\"\u003e\u003ca class=\"footnote-ref\" href=\"#fn-1-b702813e-7648-5d2c-9e4b-04e4dafc1c0f\" data-ref=\"1\" epub:type=\"noteref\"\u003e[1]\u003c/a\u003e\u003c/sup\u003e\u0026#xa0;that shouldn\u0026apos;t be so easily trusted.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey had to be cautious, skeptical, and willing to seek results rapidly and aggressively.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut Mashima-sensei, unaware that the students were thinking of the situation to such an extent, picked up on the awkward atmosphere and resumed homeroom.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well then, as for Ayanokouji\u0026apos;s seat\u0026#x2026; Let\u0026#x2019;s see here\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eStill unable to fully hide the hint of bewilderment on his face, Mashima-sensei looked around the classroom.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eCurrently, there were thirty-six students in the class, excluding me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn terms of the seating arrangement alone, securing enough space for four seats wouldn\u0026apos;t be a problem.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt might be ideal to assign my seat to one of the four less populated rows, but\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003ePerhaps this timing could be used to change around the seating arrangement?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBefore Mashima-sensei could decide, a female student sitting by the window in the very back raised her hand swiftly enough for it to make a noise.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;For now, I believe the seat in front of me would be suitable.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEither surprised by the statement or by the student who made it, Mashima-sensei showed unmistakable confusion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In front of Morishita\u0026apos;s\u0026#x2026;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYes, it was the eccentric Morishita Ai who spoke.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. I will explain the reasons. First, Ayanokouji Kiyotaka is like a transfer student, meaning he is new to the class and unfamiliar with it. Placing him in the center of the class right away would make him shrink back like a loner. And giving him the most coveted spot at the back by the window, my position, would be too much of a privilege. Moreover, since he\u0026apos;s an unexpected foreign element from an opposing class, who was an enemy until recently, proper surveillance is necessary. Considering all these factors, I think it\u0026apos;s best for him to sit in front of me. If anyone has objections, please speak up now.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNone of the students objected to Morishita\u0026apos;s proposal, which was biased and something she decided entirely on her own.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWell, wherever my seat ends up, it probably won\u0026apos;t be a big issue.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs the homeroom teacher, if the students agreed on a location without objections, Mashima-sensei probably wouldn\u0026apos;t outright reject it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was only one issue remaining\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWhat\u0026apos;s left is whether the student sitting in front of Morishita would accept this proposal\u0026#x2026;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If Sugio is fine with it\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs Mashima-sensei tried to get confirmation with Sugio Hiroshi, who was currently sitting there\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course, it\u0026apos;s fine.\u0026#xa0;Change it right away\u0026#x2014; No, rather, I\u0026apos;d be happy if you could please change it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe eagerly accepted the chance to move his seat.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRather, he had an expression that made it seem like he was more than happy that he could move.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Alright. Then, let\u0026apos;s have Sugio move over to the back of the empty row.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSugio responded eagerly, quickly gathered his belongings, and stood up from his seat.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHaving received the consent of the student who needed to be moved first,\u0026#xa0;Mashima-sensei immediately brought in a new chair and desk.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then, Ayanokouji, please take your seat. We\u0026apos;ll proceed with homeroom.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Understood.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI took my spot in front of Morishita like she\u0026#x2019;d proposed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs soon as I sat down, Morishita called out to me from behind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;ll be a pleasure going forward, Ayanokouji Kiyotaka.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes, likewise.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlthough Class C as a whole was still somewhat unsettled, it was considerably quieter compared to the Horikita class that I was familiar with. Even though they were told in advance about the transfer, many students must not have thought that it would actually happen.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs expected, the students\u0026apos; fundamental qualities here appeared to be generally quite high.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a relief to have an environment that was easy to navigate at this point, as it reduced the amount of trouble involved.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith the OAA, I already had a grasp on all of the students\u0026apos; faces, names,\u0026#xa0;and basic abilities.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, like myself, there were often aspects to each student\u0026apos;s abilities that weren\u0026apos;t visible through school evaluations alone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDiscovering these in my new school life going forward would be one of my top priorities.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith only one more year of school life, there was no time for leisure.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHaving said that, saying something like, \u0026apos;There\u0026apos;s no time, open up to me right away,\u0026apos; wasn\u0026apos;t something you could just go and approach people with.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA middle ground, a balance, was required.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What are you thinking about, Ayanokouji Kiyotaka?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBehind me, I could hear Morishita whispering.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;About what\u0026apos;s to come.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Wondering if you can make a hundred friends?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t know why she suddenly asked that question in a rhythmic tone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIndeed, getting to know classmates involved making friends to some extent.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not about that\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince, in essence, it was off the mark, I denied it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re not thinking about wanting to eat \u003cem\u003eonigiri \u003c/em\u003ewith a hundred people?\u003csup id=\"fnref-2-fe542ea8-b1d0-5a94-8452-45a22a68af60\"\u003e\u003ca class=\"footnote-ref\" href=\"#fn-2-fe542ea8-b1d0-5a94-8452-45a22a68af60\" data-ref=\"2\" epub:type=\"noteref\"\u003e[2]\u003c/a\u003e\u003c/sup\u003e\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m not thinking about that\u0026#x2026; or rather, I don\u0026apos;t understand what you mean by \u0026apos;\u003cem\u003eonigiri\u003c/em\u003e\u0026#xa0;with a hundred people.\u0026apos;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eAnd why\u0026apos;s she continuing with her rhythmic tone?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Please turn this way.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFollowing her instruction, I turned around, and I was met with Morishita\u0026apos;s cold stare.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ayanokouji Kiyotaka is surprisingly stupid, huh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s quite the thing to say.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI thought her unrealistic idea of making a hundred friends and eating \u003cem\u003eonigiri \u003c/em\u003etogether was more absurd.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You don\u0026apos;t even know this joke\u0026#x2014;no, it\u0026apos;s not even a joke\u0026#x2014;it\u0026apos;s a classic reference. Are you sane?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Nobody can probably understand that joke.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I responded, she took a deep, deep sigh.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Rather than calling you stupid, it might be more accurate to say you\u0026apos;re ignorant, or maybe you\u0026apos;re out of touch with the world.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe seemed to be getting disappointed all on her own, but I had no idea why.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eCan you make a hundred friends?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eDo you want to eat onigiri with a hundred people?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI tried to think about it calmly for a moment, but I still couldn\u0026apos;t understand the meaning.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Enough. Make sure to face forward and listen earnestly to what the homeroom teacher says.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIt was you, Morishita, who turned me around, though\u0026#x2026;\u003c/em\u003e\u003c/p\u003e\u003chr class=\"footnote-rule\"/\u003e\u003col class=\"footnotes\"\u003e\u003cli data-id=\"b702813e-7648-5d2c-9e4b-04e4dafc1c0f\" data-ref=\"1\" class=\"footnote first-footnote\" id=\"fn-1-b702813e-7648-5d2c-9e4b-04e4dafc1c0f\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003ca class=\"footnote-backref\" href=\"#fnref-1-b702813e-7648-5d2c-9e4b-04e4dafc1c0f\"\u003e[1]: \u003c/a\u003eThe kanji used for \u0026quot;helper\u0026quot; here, \u0026#x52a9;\u0026#x3063;\u0026#x4eba;, can also be translated to a \u0026quot;foreign player,\u0026quot; which is an outsider that\u0026apos;s hired to strengthen a team.\u003c/p\u003e\u003c/li\u003e\u003cli data-id=\"fe542ea8-b1d0-5a94-8452-45a22a68af60\" data-ref=\"2\" class=\"footnote\" id=\"fn-2-fe542ea8-b1d0-5a94-8452-45a22a68af60\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003ca class=\"footnote-backref\" href=\"#fnref-2-fe542ea8-b1d0-5a94-8452-45a22a68af60\"\u003e[2]: \u003c/a\u003eMorishita\u0026apos;s lines about a hundred friends and eating \u003cem\u003eonigiri\u003c/em\u003e\u0026#xa0;are references to the song \u0026quot;\u0026#x4e00;\u0026#x5e74;\u0026#x751f;\u0026#x306b;\u0026#x306a;\u0026#x3063;\u0026#x305f;\u0026#x3089;\u0026quot; (lit. \u0026quot;When I Become a First Year\u0026quot;).\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 3:
