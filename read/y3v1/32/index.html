" style=\"text-align: left\"\u003eAnd then, back to a school life spent alone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom the time she parted with Ayanokouji until this very day, Karuizawa hasn\u0026#x2019;t been able to smile even once.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer heart didn\u0026apos;t spare any space for a smile.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSatou and Karuizawa\u0026apos;s other friends tried their best to encourage her and make her happy, but it only tightened the grip on her heart even more, making it scream in agony every day.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYet, it was through her sheer stubbornness that she kept attending school without pause.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOn her way to school, Karuizawa unexpectedly came to a stop.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was because Ayanokouji was sitting on a bench ahead, fiddling with his phone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHaving faced her days mindlessly since their breakup, Karuizawa, still harboring strong feelings for Ayanokouji, felt her heart constrict involuntarily every time she saw her former lover.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer gaze naturally followed Ayanokouji, and each time their eyes met, she keenly felt that Ayanokouji held no lingering attachment to their breakup.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis realization mercilessly tightened the grip on Karuizawa\u0026apos;s heart.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYet, she had to move forward.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIdeally, she could just greet him with a strong \u0026quot;good morning\u0026quot; and walk away.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt shouldn\u0026apos;t be difficult if she could just show herself acting strong.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe repeatedly told herself this and was about to start walking when\u0026#x2026;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Good morning, Karuizawa-san.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKaruizawa, whose attention was completely captured by Ayanokouji sitting in front of her, was startled by a voice that came from a student approaching from behind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe face that peered into Karuizawa\u0026apos;s had eyes that were large and sparkling; hair that was long, beautiful, and glossy; and lips that were plump\u0026#x2014;it was a female student who could captivate even those of the same sex.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Uh, Ichinose-san, good morning\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re earlier than usual today.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Eh? Oh, yeah, maybe so.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOnly then did she realize that she\u0026#x2019;d left the dorm unusually early that day.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, it bothered her that Ichinose spoke in a way that implied she knew her routine.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Do you know\u0026#x2026; how early I usually leave by?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah. It\u0026apos;s usually around 7:50 AM, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Uh\u0026#x2026; maybe\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIchinose confidently pinpointed the time, leaving Karuizawa with a chill.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRather, it was because she herself hadn\u0026#x2019;t been aware of the exact time she usually went to school.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Recently, Ayanokouji-kun has been sitting on that bench like that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is that so\u0026#x2026; You seem to know him quite well.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, I usually go to school at this time, so I see him quite often. Switching up the time you usually leave the dorm can really give you a whole new view, doesn\u0026#x2019;t it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile the two stood there chatting, other students gradually walked past.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMost of them greeted Ichinose, who returned their greetings with a smile. School life wasn\u0026apos;t all just about having many friends.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKaruizawa knew this, but it was clear that the paths they walked during these past two years of school were vastly different.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEverywhere she looked, be it her right, her left, her front, and her behind, she could only see Ichinose\u0026apos;s friends.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt even seemed like students from Class A, Karuizawa\u0026#x2019;s own class, greeted Ichinose with more familiarity than they showed Karuizawa. Ichinose had likely broadened her interactions beyond just the second-year students\u0026#x2014;she could easily imagine that Ichinose was already connecting with the first years too.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re as popular as ever, aren\u0026#x2019;t you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Popular? I\u0026apos;m just greeting my friends, like I did with you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt might\u0026apos;ve sounded a bit clich\u0026#xe9;, but when it was Ichinose who said it, it actually made sense.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was backed by the achievements she had built up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah, right. Today is finally the day of the special exam.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;Well, yes, it is.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;How did your studies go?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, I tried my best. But you probably don\u0026apos;t have anything to worry about, Ichinose-san, so that must be nice.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s not true at all. I\u0026apos;m just barely holding up against the pressure.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIchinose said as much, but she didn\u0026apos;t seem to be suffering at all.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt least, that was how it appeared to Karuizawa beside her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe conversation was naturally coming to an end, and Ichinose would likely start walking soon.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Can I\u0026#x2026; ask you something?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as her brain decided she should just see Ichinose off, those words had spilled out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hmm? Ask me anything. Ah, but things like who will participate in the small-group battle or how we\u0026apos;ll assign penalty points are secrets, okay?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not about that\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then there\u0026apos;s probably no problem.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIchinose waited with a smile for Karuizawa to speak.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you\u0026#x2026; uh, are you and Ayanokouji-kun\u0026#x2026; dating\u0026#x2026;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKaruizawa asked what was on her mind with a strained voice.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, she unconsciously looked away, fearful of the potential answer.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was one of the possible reasons why Ayanokouji had broken up with her\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe idea that he\u0026#x2019;d left her to date another girl, Ichinose.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs a third-year student, she couldn\u0026#x2019;t help but notice how close Ayanokouji and Ichinose were getting.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt didn\u0026apos;t seem like just a friendship.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t just Karuizawa. Other students also whispered such rumors.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Me? No way. There\u0026apos;s no way Ayanokouji-kun would date \u003cem\u003eme\u003c/em\u003e.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe response that came back was a strangely phrased denial.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe downplayed herself and elevated Ayanokouji.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eStill, no matter how you looked at it, the two seemed like an ideal pair\u0026#x2014;possibly the perfect couple.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, she couldn\u0026apos;t take Ichinose\u0026apos;s words at face value. That denial wasn\u0026apos;t something she could easily believe, and Karuizawa turned her averted gaze back toward Ichinose.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you\u0026apos;re holding back from telling the truth for my sake\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026#x2019;s really true. Ayanokouji-kun and I are not in that kind of relationship.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eThat can\u0026apos;t be. Even if they aren\u0026apos;t dating, their relationship has definitely changed.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was why she pressed on, fully prepared to be viewed as persistent.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a question she never wanted to ask or hear again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSensing Karuizawa\u0026apos;s earnest pleas from her wavering eyes, Ichinose let out a quiet sigh.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That being said, it is kinda like that, huh? Though, it\u0026apos;s not the typical kind of relationship you\u0026apos;re thinking of.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What does that mean\u0026#x2026;? I don\u0026apos;t understand\u0026#x2026; Are you two actually dating?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s really not it. Absolutely not.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So\u0026#x2026; that\u0026apos;s how it is\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe virtuous Ichinose gave an unwavering response.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt meant she truly wasn\u0026apos;t lying. Karuizawa could believe that much. If they were actually dating, she would probably say so.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, she couldn\u0026apos;t feel genuinely happy about this. Her feelings were complicated.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eEven if they aren\u0026apos;t dating now, they might be tomorrow.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eNo, they might even start dating today.\u003c/em\u003e\u003c/p\u003e\u003cimg src=\"/hola-lector-agua/images/books/y3v1/OEBPS/zCmsjdYVozoInsHjqKEDO.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cimg src=\"/hola-lector-agua/images/books/y3v1/OEBPS/KMciKuIVSbEuFMKwogVHc.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cp class=\"paragraph after-image\" style=\"text-align: left\"\u003eFor Karuizawa, Ichinose dating Ayanokouji was nothing short of despair.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYet, she inevitably felt a slight sense of relief in her heart for now.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eAt this moment, there\u0026apos;s still salvation.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe forced herself to accept this in her mind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMeanwhile, Ichinose sensed Karuizawa\u0026apos;s heart slightly relaxing as she stood beside her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKaruizawa was happy about the fact they weren\u0026apos;t dating.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd Ichinose realized this. A new emotion had been born in her during her conversation with Karuizawa.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe knew there was a flicker of malice within her, however faint.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eLast year, when she had ascertained her romantic feelings for Ayanokouji, Karuizawa was already his girlfriend.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe had cried from the pain more than once or twice as she thought of Karuizawa\u0026apos;s existence.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I understand, Karuizawa-san. Ayanokouji-kun is wonderful, isn\u0026apos;t he?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t really understand, why would you break up with someone like Ayanokouji-kun?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIchinose asked such a question, fully knowing that Ayanokouji had dumped her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe couldn\u0026apos;t reveal the fact that she\u0026#x2019;d been dumped.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKaruizawa knew this, but she still didn\u0026apos;t want to give Ichinose any hope.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Y-You know, Ichinose-san\u0026#x2026;? About Ayanokouji-kun, that\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eGetting too close to Ayanokouji would lead to pain. She wanted to give her a warning.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, while Karuizawa hesitated to continue, Ichinose opened her lips.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Perhaps he\u0026#x2019;s different from your average person. Is that what you wanted to say?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIchinose answered as if she had already read the intent behind her words.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;Y-Yes.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince she indeed wanted to say something similar, she could only nod, though a bit disturbed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIchinose, standing next to her, seemed to know something about Ayanokouji\u0026apos;s secrets. She could intuitively feel it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Thank you for the advice, or warning. But I\u0026apos;m okay.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;How can you say that so confidently?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;How, I\u0026apos;m not quite sure myself. Do you regret breaking up with him?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;N-Not really\u0026#x2026; It\u0026apos;s really not like that\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is that so? It doesn\u0026apos;t seem that way to me. Don\u0026apos;t you think you could\u0026apos;ve maintained such an important relationship if something had been different?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRegardless of who ended it, there would always be a reason for the breakup to occur within the relationship. If those unstable factors had been dealt with, then maybe the future would\u0026apos;ve turned out differently.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This is just my speculation, but maybe your relationship ended because you wanted something in return?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat comment caused the emotions Karuizawa had been holding back to start bubbling to the surface.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWhy should I be criticized by an outsider like Ichinose?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What do you mean, \u0026apos;wanted something in return\u0026apos;? I\u0026apos;m not asking for anything like\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Because when you love people, you want to be loved too. Because when you care for people, you want to be cared for too. It\u0026#x2019;s a give and take relationship. It\u0026apos;s both painful and sad, and it hurts when you don\u0026apos;t get that in return. This probably isn\u0026apos;t limited to romantic relationships but also to friends and family\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What\u0026apos;s that supposed to mean\u0026#x2026; Isn\u0026apos;t that normal\u0026#x2026;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It usually is, but maybe I\u0026apos;m different.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s impossible. Even you, Ichinose-san\u0026#x2026; If you start dating someone, you\u0026apos;d want the same, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen someone said \u0026apos;I love you,\u0026apos; they\u0026apos;d want to hear \u0026apos;I love you too\u0026apos; in return. This seemingly futile exchange was what made love precious.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Someone? Should I assume you mean Ayanokouji-kun?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You know, don\u0026apos;t you, Karuizawa-san? That I\u0026#xa0;like Ayanokouji-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWithout feeling embarrassed or hesitating, Ichinose stated it clearly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd after a pause, Ichinose continued before Karuizawa could speak.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I guess I\u0026apos;m more about giving than receiving. I want to be actively involved in helping everyone in my class, but I don\u0026apos;t expect anything in return. I believe Ayanokouji-kun feels the same way. I don\u0026#x2019;t need anyone to return my feelings. As long as I\u0026#x2019;m allowed to like them, that\u0026#x2019;s enough for me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;That would be impossible to endure\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It is possible. I already said something similar earlier, but this isn\u0026apos;t just about romance. I want to be useful to someone by my side. If there\u0026apos;s someone in trouble near me, I want to help. That\u0026apos;s all.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis was undoubtedly Ichinose\u0026apos;s true feelings.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was an unpaid service.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor Karuizawa, the time she was spending now was nothing but cruel and suffocating.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYet, from the gaze Ichinose toward her, Karuizawa was certain of something.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was something that only those who had fallen for the same person could understand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf all people, as the one who stood beside that person of the opposite sex first, she couldn\u0026apos;t help but ask.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What if\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hm?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What if I\u0026#x2026; asked for help\u0026#x2026; from you, Ichinose-san\u0026#x2026; would you help me?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKaruizawa was naturally included among those \u0026quot;someones\u0026quot; Ichinose had previously spoken of.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt least, she should\u0026apos;ve been.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was unthinkable for Karuizawa, a romantic rival, to seek help from Ichinose.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor Ichinose, these words must\u0026apos;ve come as a complete surprise.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter a brief silence, Ichinose gave a small smile.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sorry, I take back what I said earlier. Maybe I can\u0026#x2019;t help you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eGoodwill.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eHypocrisy.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a new way of thinking for Ichinose; it was different from her other sides.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t have the power to help everyone.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere were times when choices had to be made.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePreviously, Ichinose would\u0026#x2019;ve tried to help all a hundred people if there were a hundred people who needed it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if she only had the power to help fifty, she would\u0026apos;ve set her sights far too high.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat would mean failing to save even the fifty who could\u0026#x2019;ve been saved.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn that case, it would\u0026apos;ve been better not to aim too high and save all fifty from the start instead.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis was Ichinose\u0026apos;s new set of values and priorities.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd within the initial fifty, Karuizawa Kei simply wasn\u0026apos;t included.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah, right. I hadn\u0026apos;t mentioned it, but the reason Ayanokouji-kun\u0026apos;s sitting on the bench is because\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIchinose spoke, smiling down at Karuizawa\u0026apos;s downcast eyes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;He\u0026apos;s waiting to meet with me at this time.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUnable to respond, Karuizawa could only lower her gaze even further.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And there\u0026apos;s one more thing I want to say. Even if there were some important events or some deep connection between me and Ayanokouji-kun, something that we can\u0026apos;t tell others, by that day, by that time, it was already after he had said goodbye to you, Karuizawa-san. There\u0026apos;s nothing that would cause any trouble between us. Yeah, so we can continue being friends\u0026#x2014;there\u0026apos;s no problem with that, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHaving said everything, Ichinose walked away and called out to Ayanokouji.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAyanokouji put away his phone, stood up, and started walking beside Ichinose.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe must have noticed Karuizawa standing still behind him for a moment, but that was all.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe neither turned his eyes toward her nor did he change his expression.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIchinose\u0026apos;s face, looking at Ayanokouji, was filled with happiness.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKaruizawa felt something rising from the pit of her stomach and stepped off the school path, hiding herself in the bushes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUnseen by anyone.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 7: Ayanokouji's Defeat\",\"volumeId\":\"y3v1\",\"chapterIndex\":32,\"prevChapter\":{\"volumeId\":\"y3v1\",\"chapter\":31,\"title\":\"Part 1\"},\"nextChapter\":{\"volumeId\":\"y3v1\",\"chapter\":33,\"title\":\"Part 1\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 1\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"labe
