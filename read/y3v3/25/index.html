e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T528b,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 3\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWE SUCCESSFULLY RETRIEVED the event supplies at G13. About thirty minutes later, Takemoto and his group safely reached D14 and ten minutes after that, the commander informed our VIP, Shiraishi, that they retrieved all the supplies. In total, we\u0026apos;d succeeded in securing two locations.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe paintball supplies included two empty magazines for an assault rifle and a hundred paintballs in a bag. And the daily necessities included one lighter, three mess tins and three pairs of disposable chopsticks. Many students were disappointed with the daily necessities, but from the contents, it became clear that simply collecting food wasn\u0026apos;t enough.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe possibility that opening a food supply crate might only reveal uncooked rice grew stronger. It seemed we needed to aim to acquire food and daily necessities as a set.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat both types of supplies had in common was that they were hidden by being about halfway buried in the ground, making them difficult to find just by walking around, except by chance. If you entered the correct password and opened the lid, you could take the supplies out directly, so there was no need to dig the box itself out of the ground. We were able to gather information, such as the fact that the size of the box seemed to be directly linked to the quantity of items inside.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen there was H9, where there\u0026apos;d been a possibility of engagement, but Class A, led by Horikita, decided to retrieve the supplies at G7 and head for the northern area.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed they disliked the risk of their classmates getting eliminated by engaging in combat.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOn the other hand, Class B, led by Ryuuen, split their team in two, with one heading for H9 and the other to take the distant B7. They achieved results by choosing a small, elite group of physically fit students to exit onto the beach from C10 and run straight north.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs a result, in that first event, each class succeeded in retrieving supplies from two locations, ending in a draw, at least in terms of numbers.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter that, the second event at 1:00 p.m. and the third event at 3:00 p.m. were announced as time passed, and the four classes repeatedly secured paintballs, food and daily necessities while avoiding combat.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd soon it was 5:00 p.m. on the first day, the time for the final event.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So far, we\u0026apos;ve managed to collect a total of five sets of supplies. A total of 200 rounds, 1.5kg of rice, eight assorted cans of food, some nuts, chicken and a few provisions. And on top of that, 15 liters of water\u0026#x2014;I guess you could call it a minimal harvest.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eCalculating backward from the nutrients a person should consume, it couldn\u0026apos;t be called sufficient; it was clearly not enough.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA total of thirty-nine event supply crates had appeared so far, so we hadn\u0026apos;t managed to get very many of them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Being pinned down like this is just so unpleasant. They\u0026apos;re practically stalkers at this point. Stalkers.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was the presence of Class B, who, ever since their surprise attack, had constantly maintained their main camp between G9 and G10, lying in wait.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBecause of their presence, we\u0026apos;d been unable to break out of the area surrounding our headquarters.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe supplies that appeared on the west side and near the center were being collected by Class B at their leisure, all within their reach.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOn the other hand, all we could do was either reach out toward the beach area slightly east of our headquarters or retrieve supplies from the areas further south.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI understood why Morishita would call them stalkers, but it could be called a near-ideal position and strategy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ayanokouji Kiyotaka. You could just charge in by yourself and annihilate the enemy unit, you know?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I can\u0026apos;t exactly pull off something like the protagonist of an American action movie. At best, I\u0026apos;d get taken down after defeating two or three of them.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Just that many? How pathetic. If it were me, the so-called \u0026apos;Amazoness of the Jungle,\u0026apos;\u0026#xa0;I could easily dispose of a hundred of them.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf that were true, I wanted her to defeat every class right away and lead us to victory.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Didn\u0026apos;t you say\u003cem\u003e\u0026#xa0;\u003c/em\u003e\u0026apos;Amazoness of the Dense Forest\u0026apos;\u0026#xa0;a moment ago?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re such a stickler for details.\u0026#xa0;\u0026apos;Jungle\u0026apos;\u0026#xa0;and \u0026apos;dense forest\u0026apos;\u0026#xa0;mean basically the same thing. In fact, it\u0026apos;s a bit of a scale-up, so wouldn\u0026apos;t you say that makes it even better?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t think so, but it was a waste of time, so I decided to stop arguing and just nodded.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Morishita\u0026apos;s proposal is something else, but can\u0026apos;t we actually break through somehow? Like just forcing our way through?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUnable to hide his irritation, Matoba nervously bounced his right foot up and down.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;d be rough. Attacking them from our position is a complete suicide mission. Besides, where would we even go if we broke through? Head north and Class A\u0026apos;s there to greet you; head east and it\u0026apos;s Class D. There\u0026apos;s no escaping a scenario where we get pincered by Class B coming up from behind.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Maybe Class A and D will let us pass, afraid of getting hurt themselves...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m sure they don\u0026apos;t \u003cem\u003ewant\u003c/em\u003e\u0026#xa0;to fight. But we\u0026apos;d be crashing an event they\u0026apos;re trying to claim in safety, right? You think they\u0026apos;re just going to say, \u0026apos;Let\u0026apos;s all be friends and split the supplies\u0026apos;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf we were in their shoes, we would naturally move to eliminate any approaching class.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMatoba, who must have easily imagined the same, clicked his tongue.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Damn it... We\u0026apos;re seriously, seriously one step behind. So does that mean our only option is to wait for them to attack?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If they were to attack us, we would have the option of using our geographical advantage, but it\u0026apos;s unlikely they will rush in so carelessly. It\u0026apos;s in their best interest to continue leveraging their absolute superiority in numbers, after all.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFaced with that harsh reality, the group fell silent for a moment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTrying to do something about the oppressive atmosphere, Hashimoto shifted his gaze to his backpack.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But man, we\u0026apos;re barely managing to endure this as it is. Classes with forty people must be struggling big time.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey could probably get through the first day with what they were given at the start, but unless they acquired more provisions in the second day\u0026apos;s events, things would likely become progressively more difficult.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Now that our class has been cut in half, the food situation should be easier to handle.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even so, that doesn\u0026apos;t change our disadvantage. The three other classes are collecting supplies at their leisure.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eClass D acquired the most supplies with ten boxes, followed by Class A and Class B with nine. Even looking only at food items, the gap was more than one box.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was 5:00 p.m. in area G12. The number of supply drops for the day\u0026apos;s final event was\u0026#x2014;nine locations in total.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And now we get the fewest of the day?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Moreover, you could hardly say these are favorable areas for us, either.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe analyst, Sanada, lightly pressed the side of his glasses with his palm as he pointed to each drop location.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere were no locations they could target while avoiding a confrontation with Class B, who watched them like a hawk, leaving only the dangerous D12 and I10. Since the next closest was G8, the only two locations they could realistically target were those first two.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Class B has no intention of letting us escape, so we\u0026apos;ll definitely be competing there. We\u0026apos;ll only be evenly matched if they split into two groups. If they concentrate their forces on one side, I doubt we stand a chance.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;How about a strategy where we risk it and escape to the east? Class D is at N12 right now, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed Matoba hadn\u0026apos;t given up on escaping from the southern area.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If we get caught in a pincer attack, things will be even tougher than they are now. Are you okay with that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s why... we\u0026apos;ll just have to pray that doesn\u0026apos;t happen...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You can\u0026apos;t call leaving things to chance a strategy.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe current situation was still difficult, but the option to escape to the east certainly existed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, if they made that choice now, Class B would undoubtedly follow.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf that happened, the next time they tried to escape, there would be no path left but the dangerous one over the mountains.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHow many students in Class C could cross the mountains and reach the northeast area?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd even if they did cross, what benefit would there be?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was hardly a feasible plan.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePutting aside what to do about their future base, the immediate problem was supplies.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe supplies that appeared at D12 and I10 were food, so they wanted to move to secure them at all costs.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We\u0026apos;re staying based in the southern area and securing the supplies.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...So we\u0026apos;re prepared to fight, then.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSighing, Matoba\u0026apos;s expression hardened with resolve.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If we were only thinking about today, avoiding them would be fine. But tomorrow\u0026apos;s event isn\u0026apos;t until 11:00 AM at the earliest. And since there\u0026apos;s no guarantee we\u0026apos;ll get food, I want to secure both spots if possible, or at least one of them.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Understood. So, what\u0026apos;s the specific plan?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf they were going for supplies with enemies present, cooperation with the commander was as essential as ever\u0026#x2014;no, even more so.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTherefore, they could split into two groups of equal number, led by the VIPs Shiraishi and Takemoto and prioritize balance, or concentrate all their forces in one location.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe students looked at each other, speculating which plan it would be.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Going after the supplies means we\u0026apos;re not gonna back down easily, right? Then shouldn\u0026apos;t we concentrate our forces? We\u0026apos;ve only got half our strength left. Even if they split up, they\u0026apos;ll still outnumber us two to one. If we clash, we could get wiped out.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was only natural that the morale of a class already falling behind was low and that anxiety would take precedence.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed opinions within the class were divided, but there was no time for a leisurely debate.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWithin the limited one-hour timeframe, Class B would start moving at any moment. No, they might have been moving already.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We\u0026apos;re still going after both supply drops.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you serious? They\u0026apos;ll probably come for both too. If you\u0026apos;re so sure of that, we\u0026apos;d be better off concentrating on one. When it comes to a fight, it\u0026apos;s pointless unless we\u0026apos;re on even footing in terms of numbers.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMatoba explained just how risky it was to face an enemy with twice their numbers.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I agree with Matoba-kun. Isn\u0026apos;t it an option to play it safe and just go for one? If we all move together, even they won\u0026apos;t be able to easily charge a group of nearly twenty people. And if they decide to gather their entire class, we can just retreat.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was true that if we focused on one location instead of two, our safety would increase dramatically.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo fight a consolidated Class C, they would need more than half their students to gain an advantage and to guarantee victory, they would have to gather everyone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, such a large-scale movement, barring the use of a tactic, would definitely be detected by the commander and the VIP would be notified of an approaching presence immediately.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was precisely why Matoba\u0026apos;s idea of moving as a whole group sounded clever at first glance, but it was proof that he hadn\u0026apos;t considered it from the enemy\u0026apos;s perspective.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If I were Ryuuen\u0026#x2014;no, if I were any other class, I\u0026apos;d be grateful to see Class C moving in one big clump. I could judge that you\u0026apos;ve chosen the path of self-destruction without me having to risk a fight. I could ignore the supplies Class C is targeting and go collect a ton of events instead. By tomorrow morning, you guys will be unable to bear the hunger, your stamina and intelligence will have dropped and you\u0026apos;ll be forced to take on even harder events.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...I see.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The other classes are the ones who desperately need supplies right now. If we group up, we\u0026apos;d just be helping them out, huh.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sorry, but we don\u0026apos;t have time to debate this any further. This is my decision as the one temporarily in charge of Class C. If you still have objections, you\u0026apos;ll have to face the appropriate consequences.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAppropriate\u0026#x2014;meaning, they would have to bear the risk of expulsion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t even need to wait for an answer; Matoba and the others likely didn\u0026apos;t have that kind of resolve.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Fine. How are we splitting the teams?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith limited time, the farther the distance, the faster they needed to move.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHeading to I10, where the supplies were located in the mountains, would be tough.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll go to I10 alone. Even if I don\u0026apos;t know the exact location of the supplies, the watches have a built-in compass and a function to check our current location. It won\u0026apos;t be that hard to reach the designated area itself. The rest of you, head to D12.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Alone...? Are you for real? They\u0026apos;re definitely moving with their VIP. If they spot some guy moving on his own, he\u0026apos;s bound to be a target.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince time was precious, I had them start preparing while I continued my conversation with Hashimoto.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even so. I have no intention of changing my decision.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Right. Well, if that\u0026apos;s what you\u0026apos;ve decided, I won\u0026apos;t argue any further, but...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Alright. Takemoto, Hashimoto and the rest of you, hurry to the designated area, find the event and secure the supplies. After that, we\u0026apos;ll regroup in one to one and a half hours. The primary rendezvous is F12. Even if you get separated from the VIP, it\u0026apos;s near the base, so you\u0026apos;ll be conspicuous and easy to spot. However, if other classes surround us there, we\u0026apos;ll have no escape route. Therefore, if the commander gives a signal, I\u0026apos;m designating H12 as the secondary rendezvous.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf, by some chance, another class approached the rendezvous point, it had to be avoided as a meeting spot. That was because the commander was always fully aware of the other classes\u0026apos; movements.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What do we do if Ichinose\u0026apos;s class attacks?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Considering the distance, there\u0026apos;s no way Class D will force an attack on us.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBecause the VIP was worth one hundred points, it was easy to lose sight of other things, but even losing a single point from a reduced number of guards would become a major handicap in determining the final rankings.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But there\u0026apos;s no guarantee they won\u0026apos;t attack, is there? I\u0026apos;m sure they want to win when they have the chance.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Basically, if we don\u0026apos;t attack, we won\u0026apos;t be attacked. Operate under that assumption.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Guess I\u0026apos;ve got no choice but to believe that for now. So, how are you planning to meet up with us? You won\u0026apos;t have any way of knowing how the situation changes moment to moment, right? It\u0026apos;d be hell if you got separated.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t worry about me. More importantly, let\u0026apos;s talk about what happens if you\u0026apos;re attacked by Class B while securing supplies. You are only to engage them if their numbers don\u0026apos;t exceed ten. The moment you confirm they have more people than that, you\u0026apos;re free to retreat.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was extremely difficult to capture a fleeing enemy on this vast, deserted island.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDeducing how the three classes would move for the last event of the day required no great thought.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI sent everyone ahead to D12, while I headed for I10 alone.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 3\",\"volumeId\":\"y3v3\",\"chapterIndex\":25,\"prevChapter\":{\"volumeId\":\"y3v3\",\"ch
