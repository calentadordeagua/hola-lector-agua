e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T2449,"])</script><script>self.__next_f.push([1,"\u003ch1 class=\"heading_1\"\u003e\u003ca class=\"heading-link\" href=\"/read/y3v3/2\"\u003eChapter 4:\u003cbr/\u003eA Chance Encounter\u003c/a\u003e\u003c/h1\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIT WAS EARLY morning, just past 6:00 a.m.\u003c/em\u003e, a time when most students were still asleep.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe one to slowly emerge from a one-person tent was Ryuuen Kakeru, the leader of Class B.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe spread out a map to reconfirm the last recorded GPS positions from yesterday and with a mind refreshed after a night\u0026apos;s sleep, stared at the situation of each class he marked.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat\u0026apos;d been troubling him from the middle of the night until then was who to fight next and how.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat he needed to do to ultimately come out on top of the other three classes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe had to decide how to act moving forward, setting those immediate objectives by 9:00 a.m.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFirst, he ruled out Class A and Class D, who\u0026apos;d set up camp in the north and east areas.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat was important was his own class and Class C, both clustered together in the southwest where their base was.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter the successful surprise attack, Ryuuen dedicated all his resources to events, making his classmates run around to secure supplies.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven so, food was always in short supply and they were forced to actively participate in events to sustain their class size. Even though their numbers decreased, Class C, unable to secure supplies, was in the same state of deficiency.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was an adjustment intended by the school.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey were clearly being guided toward a gradual decline, tempted to launch an attack.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut the students were no fools. They weighed the risks of combat against the contents of the supplies and chose to endure hunger rather than lose their VIP or escorts. At least, that\u0026apos;s how it went on the first day.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSo, what would happen on the second day? It all depended on the addition of new restricted areas and their scope.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf the usable area for Class C, currently holed up near their base, were forcibly narrowed, they might finally resolve to cut off their escape routes and fight for real.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ve got him cornered... but how\u0026apos;re you gonna move, Ayanokouji?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOne thing was certain: Ryuuen had no intention of remaining on the defensive.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIdeally, he wanted to launch an all-out attack on Class C, even by force and sink them to last place.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe judged that no matter if Ayanokouji was there, they had a 99% chance of winning right now.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, that came with the precondition that the special exam would end at that very moment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter defeating Class C, it would be extremely difficult to defeat Class A and Class D with their remaining forces.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s always the option of crushin\u0026apos; that eyesore Class A first... but that\u0026apos;d just make the guys at the bottom happy.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf it turned into a war of attrition between two classes, the remaining two would simply profit.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Quite an early morning, isn\u0026apos;t it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSensing a presence, Katsuragi came outside and called out to Ryuuen as he approached.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you deliberating on which class to target?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt those words from Katsuragi, who sensed his boiling blood up close, Ryuuen gave a small laugh.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Something like that. Well, the main target\u0026apos;s always Class C.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Being belligerent is all well and good, but even if we don\u0026apos;t force an attack, time, coupled with a lack of supplies and the restricted areas, will inevitably force a fight. Is there really a need to squander the advantage we gained from the surprise attack on Class C at this stage?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sure, maintainin\u0026apos; our numbers advantage ain\u0026apos;t a bad thing. We\u0026apos;re the ones holdin\u0026apos; the initiative here. But we already used our main tactic yesterday to get the first strike. Since they still have the right to use theirs, it means they can launch a surprise attack too. Striking before that happens is one option. And if he decides he can\u0026apos;t fight and uses tactics to escape, well, that ain\u0026apos;t half bad for us either.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen Ryuuen looked at the supplies placed in front of the tent and continued.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;When you\u0026apos;re hungry, your stamina drops whether you like it or not. It\u0026apos;s frustrating that we won\u0026apos;t be able to use the strength of those idiots.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere were many big eaters in Class B, but for that reason, they still had plenty of stamina for now.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe more time passed, the more their advantage would fade, Ryuuen explained.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKatsuragi folded his arms, mulling over Ryuuen\u0026apos;s words.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe understood his intent and it wasn\u0026apos;t as if it lacked reason.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...You have a point. If we use the supplies we desperately scraped together for breakfast, we\u0026apos;ll have almost nothing left. That said, having them continue to collect supplies on an empty stomach is problematic. However, that is precisely why I believe we should prioritize collecting from events on the second day as well.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKatsuragi had come to that conclusion after discussing it with Ryuuen late last night.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHis opinion hadn\u0026apos;t changed and he advised that they should basically remain on the defensive.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Only Class C should be feeling impatient. For now, we should simply keep a close eye on the other classes. That line of thinking was part of your original plan, was it not?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKatsuragi knew that Ryuuen wasn\u0026apos;t making light of the risks of attacking.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eStill, what he couldn\u0026apos;t get behind was his abnormal obsession with Class C.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo be precise, he was concerned that his fixation on defeating Ayanokouji would end in futility.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s a strange thing. They should\u0026apos;ve been half-destroyed by that surprise attack, but lookin\u0026apos; at this map, I can\u0026apos;t see Ayanokouji showin\u0026apos; any sign of weakness.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen stared at the mark in the south. Katsuragi, who looked at it as well, nodded once in agreement.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s the fear of not being able to see your opponent\u0026apos;s face. The stronger the enemy, the more one\u0026apos;s imagination is stirred up with wild ideas of what they might do to outmaneuver you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen partly agreed with the \u0026apos;overthinking\u0026apos; part, but he learned that lesson the hard way over more than two years of fighting.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe plan succeeded and damage was dealt.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn other words, it meant that even Ayanokouji had an opening. However, it was a minuscule one.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe difficulty of continuing to press that opening was incomparable to the initial surprise attack.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In any case, don\u0026apos;t overthink things with Class C. If you truly cannot suppress your urge to fight, shouldn\u0026apos;t you turn your attention to Class A for now? We won\u0026apos;t become Class A unless we defeat those above us.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2014;Maybe so.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen looked away from the map and up at the trees, where the sun was just starting to shine through.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L1
