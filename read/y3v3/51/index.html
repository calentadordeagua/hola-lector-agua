e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T215d,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 5\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAS THE REMAINING time drew near, the state of the battle in various locations also seemed to be finally reaching its climax.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The tactic\u0026apos;s effect has worn off and it seems Class A\u0026apos;s current locations were all displayed at once. As of now, there are a total of 43 students remaining. As for the breakdown by class\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi calmly explained the situation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Just as you said, Ayanokouji-kun, it\u0026apos;s turned into quite a chaotic battle, hasn\u0026apos;t it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Appoint a commander, gather supplies, keep your distance, read the enemy\u0026apos;s movements and avoid engagement. Then, devise a strategy in preparation for the final decisive battle. They can carry things out reasonably well up to this point, but once the firefight actually starts, anyone would lose their ability to think calmly. What\u0026apos;s more, without their VIP nearby, they can\u0026apos;t even tell their own precise location, let alone the enemy\u0026apos;s. Should they go right or left, forward or back? While they\u0026apos;re wandering, they run into other classes, creating a chain of eliminations. The ones fighting right now aren\u0026apos;t trained soldiers or even people who have played this survival game over and over. They\u0026apos;re just a bunch of high school students.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe important thing was to throw the field into intense chaos. To sow discord and reduce their numbers.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOnce a little more time passed, the numbers would decrease further. And at that time, the action to take was already decided: have the VIP escape. They had no choice but to avoid total annihilation and switch to running until time ran out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was the same for Horikita and Ryuuen.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It appears Kanzaki-kun and the two Class D VIPs have now arrived at G11. The suspension of the global GPS will be lifted shortly. Will the pursuers move immediately to target the three of them after this?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Fifty-fifty. The battlefield has already expanded and it\u0026apos;s not certain if the VIPs who\u0026apos;ve noticed will be able to give information to their guards. Either way, if there\u0026apos;s any suspicious movement, we\u0026apos;ll use our tactics to get them away immediately. Just as planned.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Understood.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I nodded, Shiraishi took the radio and told Shimazaki to prepare to use the individual GPS shutdown tactic. The targets weren\u0026apos;t the Class C VIP, but the two Class D VIPs who were currently escaping. There was no restriction that a tactic had to be used on one\u0026apos;s own class, so as long as it wasn\u0026apos;t a problem in and of itself, no issues would arise from using it on anyone from any class. However, only the commander of the class that executed the tactic would know their current location, so that point alone required caution.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat was important was not letting anyone figure out where the escaped Class D VIPs were.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Just now, another one from Class A, Yukimura-kun\u0026#x2014;the second VIP\u0026#x2014;was eliminated. That means the only one left is Satou-san, correct?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s right.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I imagine Class A is surprised right about now. Wondering why their three VIPs were found out and are being so persistently targeted. And by all three classes, no less.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe one big mistake Class A made before the final day.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was the evening of the third day, when I showed up at Horikita and the others\u0026apos; campsite.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt the time, I arrived while the GPS suspension was still active and I didn\u0026apos;t attack right away.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI attacked only after carefully checking the positions of my former classmates.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe objective wasn\u0026apos;t to eliminate as many people as possible, but to find out who the VIPs were.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHaving received an unexpected attack, the Class A students\u0026apos; thoughts would\u0026apos;ve been split into two main camps: \u0026apos;defeat the intruder\u0026apos; and \u0026apos;protect the VIP\u0026apos;.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDefeat if the VIPs were all eliminated and the maneuvers to protect them. It was an action that\u0026apos;d become ingrained in them over several days of having it drilled into their heads. The guards immediately ran to protect the three.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThose three were Wang Mei-Yu, Satou Maya and Teruhiko Yukimura.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Didn\u0026apos;t you ever suspect it might have been a fake?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If they could have predicted the attack beforehand, it could\u0026#x2019;ve been a feint. But the attack came when they thought the danger was over for the day. The probability of it being an act is low.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd so, I decided to give the information I\u0026apos;d obtained to Class B this morning as well.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was because it would be easier for them to fight if they knew who the VIPs were.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf they chose not to believe the information, there would be no negative repercussions, so it was information they had nothing to lose by receiving.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, if even a small number of students approached Class B carelessly, they would be shot.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn fact, the student I sent was shot and eliminated, but that was no problem.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven after being eliminated, as long as it wasn\u0026apos;t during a battle, some conversation was possible.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat would be effective in defeating Class A and that information would also act as the catalyst to get Class B to attack Class A.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So, they were skillfully outplayed by you alone, Ayanokouji-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I think Class A\u0026apos;s movements weren\u0026apos;t bad, considering they knew they were a target. Now, all that\u0026apos;s left is to take out the remaining Class B students and this special exam will be over.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if capable students like Sudou or Hirata remained, they couldn\u0026apos;t continue to operate if the VIP was defeated.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Excuse me, there\u0026apos;s a message from Shimazaki-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi\u0026apos;s expression stiffened slightly as she listened to the radio. She must have received some bad news.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It seems Class B is putting on a lot of pressure in some combat zones. As a result, the number of eliminations from our allied classes is rapidly increasing. It appears there\u0026apos;s a fierce battle going on in F11.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wanted to leave things to them to some extent, but it seemed it would be better if I made a move.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Only in the event that Class A is wiped out first, come and see me after three o\u0026apos;clock if you can make contact.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Understood. What will you do now, Ayanokouji-kun?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Adjustments.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eLeaving Shiraishi with Yamamura, I started to slowly make my way to F11.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 5\",\"volumeId\":\"y3v3\",\"chapterIndex\":51,\"prevChapter\":{\"volumeId\":\"y3v3\",\"chapter\":50,\"title\":\"Part 4\"},\"nextChapter\":{\"volumeId\":\"y3v3\",\"chapter\":52,\"title\":\"Epilogue: Show Me What You’ve Got\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 3\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":11},{\"label\":\"Prologue: Shiina Hiyori's Monologue\",\"href\":\"prologue.xhtml\",\"index\":12},{\"label\":\"Chapter 1: Opening. Survival Game Special Exam.\",\"href\":\"c1.xhtml\",\"index\":13},{\"label\":\"Part 1\",
