e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T2726,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 2\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDAY 1, DAY 2. Each class tried its best to avoid combat and focused solely on securing supplies.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey held one another in check and watched, scurrying about various places to gather supplies.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe only spectacular development, to repeat myself, was the surprise attack by Class B and the few-minute shootout on the second day that we initiated to secure supplies.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, moment by moment, the off-limits areas were steadily increasing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor now, it was only the outer perimeter, two squares deep. In other words, each class simply had to move away from the coast and shift slightly inward; avoiding large-scale combat would\u0026apos;ve been easy at that point.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut from the third day onward, that would almost certainly not be the case. The representatives of the Class C and Class D alliance, who set up a base in K13, began a discussion, joined by several students from both classes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Where\u0026apos;ve you been all morning? I even went to your tent to get ya, y\u0026apos;know?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;My bad, I had some business to take care of.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I offered a light apology with my right hand, Hashimoto stared at it quizzically.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ain\u0026apos;t it kinda dirty?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s nothing serious, don\u0026apos;t worry about it. More importantly, let me hear what you were discussing.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hm? Oh, right\u0026#x2014;Kanzaki, please continue.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I was just saying that we\u0026apos;ve reached a difficult phase. We\u0026apos;ve used most of our handheld provisions and it wouldn\u0026apos;t be surprising if they were depleted by noon. Also, Sumida and Minamikata have seemed somewhat unwell since this morning. They themselves say they are still fine, but I don\u0026apos;t believe they will last until the exam is over.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI received Kanzaki\u0026apos;s report on the Class D students.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If one is the VIP, it would be a bit of a hassle, but if they\u0026apos;re guards, having them retire now may be an option. In any case, I want you to tell them not to overdo it. The damage will only be greater if they lie to themselves and force it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Ah, yes. Saying that will likely put them both at ease. Moriyama, my apologies, but would you mind relaying Ayanokouji\u0026apos;s words to them?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNodding as if to say, \u0026quot;Leave it to me,\u0026quot; Moriyama headed off at a run toward the tents that were being taken down.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But man, we\u0026apos;re obviously runnin\u0026apos; low on supplies. We got nothin\u0026apos; but a bunch of starving folks over here, too.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePressing his stomach lightly, Hashimoto muttered wearily.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. And it\u0026apos;s already the third day of the exam; there must be a limit to how much longer we can continue collecting from a distance. Which means... a battle over supplies is finally about to begin. Let me hear your thoughts.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen Kanzaki asked me about our plan for the day, I nodded silently.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There are broadly two methods for determining our plan. One is to envision the objective you wish to achieve and map out a path to it. The other is to gauge the enemy\u0026apos;s aim and thwart their intentions.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI spread out the map and began to explain in a way that was easy for Hashimoto and Kanzaki to understand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;On the first day, Class B\u0026#x2014;or rather, Ryuuen\u0026#x2014;launched a surprise attack on Class C. What do you suppose the reason was?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What\u0026apos;s there to suppose? He figured he could deal a huge blow to the enemy by catching them off guard. It\u0026apos;s the story of him taking a risk and successfully pulling it off, ain\u0026apos;t it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If the lottery results had been different and Class A was next to us, would he have attacked in the same way?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKanzaki crossed his arms, thought for a moment, then nodded.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Wouldn\u0026apos;t Class A have been the ideal enemy, instead? If you think about it that way, attacking becomes the obvious choice.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;My thinking is different. I believe that if Ryuuen couldn\u0026apos;t launch a surprise attack on Class C, he wouldn\u0026apos;t have initiated a fight using his trump card tactic from the very beginning. Why did it have to be the lower-ranked Class C? Because in order to win, he considers my existence to be one of the most troublesome obstacles.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;To Ryuuen, you\u0026apos;re his arch-rival now. That makes you the best opponent to take down with a sneak attack.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I can\u0026apos;t say I don\u0026apos;t get what you\u0026apos;re saying, but even so, I can\u0026apos;t accept the conclusion that he wouldn\u0026apos;t have attacked Class A. Even if they weren\u0026apos;t ideal, he should\u0026apos;ve had no problem attacking.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf they could knock the top-ranked Class A to last place, Class B would be able to pull itself much closer to that position. What Kanzaki wanted to say was simple.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s a troublesome presence in Class A from the start. Needless to say, it\u0026apos;s Koenji. At the beginning, it was impossible to judge whether he intended to participate in this special exam or not. In fact, you felt he was an element of uncertainty too, didn\u0026apos;t you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Yeah, that\u0026apos;s true.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even if he didn\u0026apos;t intend to participate, Koenji was still with Class A for a short time after the start. Launching a surprise attack there would create the unnecessary risk of waking a sleeping lion.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see... So if Koenji took issue with the surprise attack and cooperated with his class and by some chance launched a counterattack, the situation would instantly become impossible to read, is that it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIchinose must have reported on that point as well. Kanzaki muttered.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In fact, the Class B students who came into contact with Koenji were eliminated, after all... I see.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe was a person with enough potential to make one think he could change the course of the battle all by himself, a fact no one would deny.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In any case, after much consideration, Ryuuen executed a surprise attack and gained a huge advantage over Class C. But now, compared to Class A, he\u0026apos;s lost fourteen guards and can no longer use his core tactic of disabling the overall GPS. Now that the number of out-of-bounds areas is increasing, the value of this tactic is growing with each passing moment.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If the opponent\u0026apos;s GPS stops working when you start fighting, even for just thirty minutes, you won\u0026apos;t know where they\u0026apos;re coming from. It wouldn\u0026apos;t be strange to be completely immobilized.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe himself demonstrated, through the surprise attack he launched, that a successful ambush could inflict enormous damage, even if only for a short time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So what\u0026apos;s your take on it? Does Ryuuen plan to attack, or defend? Let me hear what you think.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;He\u0026apos;ll wait until the last possible moment without launching a hasty attack. He\u0026apos;s waiting for the time when the out-of-bounds areas expand, making it impossible to escape far away and forcing the four classes to gather whether they like it or not.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was the closest thing to the optimal solution. The problem was whether Ryuuen could choose that answer. If he impatiently went after Class A or the allied classes, Class B might be eliminated surprisingly quickly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then should we attack instead?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, avoiding engagement is best for now. We\u0026apos;ll stick to a defensive strategy, just like on the first and second days.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if we did nothing, the exam\u0026apos;s end time was fixed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA development in which we would all randomly fire at each other within the shrinking area was sure to come.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd that, in fact, was the very development we were hoping for.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 2\",\"volumeId\":\"y3v3\",\"chapterIndex\":41,\"prevChapter\":{\"volumeId\":\"y3v3\",\"chapter\":40,\"title\":\"Part 1\"},\"nextChapter\":{\"volumeId\":\"y3v3\",\"chapter\":42,\"title\":\"Part 3\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 3\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":11},{\"label\":\"Prologue: Shiina Hiyori's Monologue\",\"href\":\"prologue.xhtml\",\"index\":12},{\"label\":\"Chapter 1: Opening. Survival Game Special Exam.\",\"href\":\"c1.xhtml\",\"index\":13},{\"label\":\"Part 1\",\"href\":\"c1p1.xhtml\",\"index\":14},{\"label\":\"Part 2\",\"href\":\"c1p2.xhtml\",\"index\":15},{\"label\":\"Part 3\",\"href\":\"c1p3.xhtml\",\"index\":16},{\"label\":\"Chapter 2: A Surprise Attack\",\"href\":\"c2.xhtml\",\"index\":17},{\"label\":\"P
