e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T1fae,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 1\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAFTER THAT, RYUUEN, who\u0026apos;d been standing alone at the water\u0026apos;s edge thinking as he stared at the sea, took a map out of his pocket. From their current situation, what could he do to lead the class to victory? Defeating Class A in an all-out battle before the lower-class alliance closed in on their area was the most rational and simple option. Should he make his move early on this third day\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter that, there was also the all-or-nothing strategy of using their remaining forces to target only Ayanokouji\u0026apos;s group\u0026apos;s VIP\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t like this one bit.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eChoosing that option meant his judgment was being influenced by the hastily formed lower-class alliance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was nothing less than the side that succeeded in a surprise attack and seized the advantage being forced onto the defensive.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe feeling that he wouldn\u0026apos;t let Ayanokouji have his way welled up inside him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf that was the case, then he could also go all out and attack the lower-class alliance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eThey must be thinking that we won\u0026apos;t make a move against an alliance that has swelled to fifty people with Class B...\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Heh, he ain\u0026apos;t that naive.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAttacking Class A, attacking the alliance\u0026#x2014;Ayanokouji had probably considered both.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEither way, Ayanokouji already anticipated in his mind how Ryuuen would fight.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What do I want to do... No, what do I want?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eVictory for Class B was a given, but there was something he craved just as much.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd that was to beat Ayanokouji.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat should he choose to achieve that and be satisfied?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs he averted his gaze from the sea and turned around, he found a lone girl walking on the beach.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAll by herself, she was smiling at the gently lapping waves.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen lightly rolled up the map, stuck it in the back pocket of his gym uniform and started walking toward the person.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Lookin\u0026apos; pretty happy all by yourself, Shiina.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh my, good morning, Ryuuen-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiina, who returned the short greeting, turned to face Ryuuen and smiled cheerfully.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Since we\u0026apos;re at the beach, I was taking a little walk.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter answering, Shiina looked at Ryuuen\u0026apos;s stern expression and surmised his state of mind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I heard that there is a high probability that Class C and Class D have joined forces. What do you intend to do?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs Shiina walked slowly along the deserted beach, Ryuuen matched her pace and walked alongside her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There ain\u0026apos;t nothin\u0026apos; to it. I\u0026apos;m gonna win this special exam and I\u0026apos;m gonna do it with my own damn power.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen declared forcefully, as if to hide his own indecisiveness.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. We believe in your words, Ryuuen-kun and we will follow you, now and always.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSeeing Shiina smile, Ryuuen returned a slight smile of his own.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Do whatever you want for the next 30 minutes or so.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen turned his back to return to the tent, but Shiina called out to him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ryuuen-kun, if the beginning of a novel you were reading was hopelessly pessimistic, what kind of ending would you imagine?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSuch a question. Anyone else probably would\u0026apos;ve scoffed and ignored her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe stopped and thought about it seriously. Then he immediately found the answer within himself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Unfortunately, I\u0026apos;m not a fan of stories with depressin\u0026apos; beginnings. But most stories are made to be convenient, ain\u0026apos;t they? If that\u0026apos;s the case, then wouldn\u0026apos;t they usually turn out for the better?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s true. The structure of a story is such that readers are most moved when it turns from darkness to light, so works with sad starts often become the foundation for depicting rebirth, atonement and healing. Conversely, if a story begins on a bright note, a sad ending often awaits.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter replying, Shiina continued.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;However, it\u0026apos;s a wide world out there. There are many masterpieces that are sad from beginning to end.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What\u0026apos;re you gettin\u0026apos; at?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That it\u0026apos;s best to be mentally prepared for whatever might happen. Not just for this special exam, but for what lies beyond as well...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as there was a chance of victory in an exam he thought he might lose, defeat lurked in an exam he thought he could win. And, that it wouldn\u0026apos;t necessarily always follow that rule.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So in the end, it means we don\u0026apos;t know shit about what\u0026apos;s comin\u0026apos;, huh.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Fufu, perhaps that\u0026apos;s so.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But still\u0026#x2014;I\u0026apos;ll force my way through with my own power. Whatever it takes to take down Ayanokouji.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I believe that\u0026apos;s for the best.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eLooking into Shiina\u0026apos;s eyes as she answered, Ryuuen gave her a sharp, testing gaze.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And that\u0026apos;s even if I force some kinda cruel choice on you down the line?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen knew full well that it was a malicious question. That was precisely why it was a question that, ordinarily, he shouldn\u0026apos;t have voiced.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut Shiina met his gaze without looking away.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If it would be for the sake of everyone... for the sake of the Class B that is so important to me...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter she answered, Shiina gazed at Ryuuen with a smile.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In that case\u0026#x2014;I won\u0026apos;t hesitate. No matter who my opponent is, or what the outcome may be.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Good.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter meeting the gaze of Shiina, who answered with resolve, Ryuuen returned to the tent where Katsuragi and the others waited.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 1\",\"volumeId\":\"y3v3\",\"chapterIndex\":40,\"prevChapter\":{\"volumeId\":\"y3v3\",\"chapter\":39,\"title\":\"Chapter 6: The Real Goal\"},\"nextChapter\":{\"volumeId\":\"y3v3\",\"chapter\":41,\"title\":\"Part 2\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 3\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":11},{\"label\":\"Prologue: Shiina Hiyori's Monologue\",\"href\":\"prologue.xhtml\",\"index\":12},{\"label\":\"Chapter 1: Opening. Survival Game Special Exam.\",\"href\":\"c1.xhtml\",\"index\":13},{\"label\":\"Part 1\",\"href\":\"c1p1.xhtml\",\"index\":14},{\"label\":\"Part 2\",\"href\":\"c1p2.xhtml\",\"index\":15},{\"label\":\"Part 3\",\"href\":\
