e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T4e35,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 3\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e1:00 P.M. THE event updated and revealed zero new supplies. This meant the phase for gathering supplies was completely over. The current locations of each class were Class A at D11, Class B at D12 and the Class C and D alliance at E10. As a result of the repeated attacks and retreats up to that point, the situation progressed to a point where all classes were rapidly closing in on each other. Though they hadn\u0026apos;t made contact yet. Receiving a rapid-fire report from the analyst, Class A shouted to inform everyone of the restricted area. A little after 1:05 p.m., the VIP Yukimura received a new message from the commander and urged everyone to halt.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBarely fifty meters away from that exchange.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eClass B, who advanced northward, also stopped in their tracks.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Class A is right in front of us. They\u0026apos;re probably a few dozen meters away. Everyone, stay sharp.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKatsuragi took a half step forward and quietly informed his classmates.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Every single one of you better take down at least one of them before you get taken out. Now that we\u0026apos;re this far, who gives a damn how many we beat in that first-day ambush? Any useless deadweight is a candidate for expulsion.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith those words, Ryuuen put intense pressure on them, firing them up and making them advance forward quietly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOne step, two steps. They moved forward, treading on dirt, leaves and small twigs.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But are you sure about this, Katsuragi? We let one of Class A\u0026apos;s VIPs get away...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIshizaki spoke up. A short while ago, Ryuuen immediately used tactics to identify the two GPS signals that had unnaturally separated from the main Class A group. Their identities were the escort, Miyake Akito and the VIP, Wang Mei-Yu.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If three VIPs are taken out, it\u0026apos;s a total wipeout. They probably split off to avoid the risk of being annihilated in a massive brawl. For us to send pursuers, we would similarly need a VIP and a guard\u0026#x2014;a minimum of two people. But in a two-on-two, there\u0026apos;s no telling how it\u0026apos;ll turn out. Miyake\u0026apos;s athletic ability isn\u0026apos;t bad, either. On top of that, it\u0026apos;s not just Class A nearby; Class C and Class D are also approaching. Acting separately is far too dangerous.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile they wanted to defeat them if they could, Ryuuen judged it too risky to split off a small part of their forces to send after them in this situation. Class B staunchly maintained its stance of protecting the VIP with all its members.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Something\u0026apos;s off...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt that, Katsuragi\u0026apos;s expression tightened.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? What\u0026apos;s off?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey weren\u0026apos;t engaging with the Class A group in front of them. It was taking longer than expected to make contact.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We should be running into them any time now\u0026#x2014;this is a frustrating wait.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf they moved in any of the three directions other than south, where they would run into Class B, it wouldn\u0026apos;t be difficult to avoid contact. If they fled, they wanted to pursue immediately, but they could only learn the other classes\u0026apos; latest movements every five minutes. They couldn\u0026apos;t give chase right away without receiving the new locations.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eClass B, which continued to advance slowly and with maximum caution, was informed of the latest positions by the commander five minutes later, but it was then that they learned a troublesome fact.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was because Class A hadn\u0026apos;t moved in any of the four cardinal directions.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;R-Ryuuen-kun... It says... Class A\u0026apos;s GPS and our GPS are overlapping...!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So they used a tactic here, did they?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor the next thirty minutes, they would be unable to track Class A. They knew that was a possibility, but it meant a period of extreme disadvantage for the other classes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKatsuragi immediately gave orders to protect the VIPs from all four sides. This was because they couldn\u0026apos;t afford to have their three VIPs taken out under any circumstances. Fortunately, in preparation for such a situation, Katsuragi made them learn several hand signals as a way to issue commands without speaking.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHaving them retreat from the inevitable battle ahead was one option, but without their VIPs, they couldn\u0026apos;t grasp the other classes\u0026apos; battle situations and if the guards were wiped out, they would eventually be cornered and defeated. In the end, it was most efficient to keep them close. At least, that was how Ryuuen was thinking and acting.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWould they run, or would they attack?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEveryone fell silent, holding their breath, so as to not miss the slightest footstep or any sign of trouble.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe VIP who received the information from the commander took a pre-prepared slip of paper and scribbled on it gently, careful not to tear a hole in it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen, they showed it to Ryuuen, who was standing nearby.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026apos;C and D ahead\u0026apos;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was news that even the allied classes, who\u0026apos;d been approaching in a pincer formation, were now close. If the vanished Class A circled around, the risk of Class B being caught in a pincer attack would increase.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDeciding there was no time to hesitate, Ryuuen made the decision to retreat south for the time being and just as he raised his arm to give the command\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;They\u0026apos;re behind us!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe one who shouted was Isoyama, who was in the rear. Multiple paintballs began to assault Class B from behind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;They got behind us?! Fall back while returning fire! C and D are coming, hurry!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOnce things had gotten to that point, hand signals were meaningless, so Katsuragi shouted, simultaneously ordering them to fight and retreat. The battle with the enemy that got behind them began.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No doubt about it! It\u0026apos;s Class A! I saw Sudou!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;H-haha\u0026#x2014;!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHearing her classmate\u0026apos;s voice, Ibuki broke into a fierce, frightening smile.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;W-what\u0026apos;s with that creepy laugh? You\u0026apos;re givin\u0026apos; me the creeps, Ibuki!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIshizaki, hiding behind a tree with her, looked at Ibuki, slightly taken aback.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You know, I honestly didn\u0026apos;t give a damn about things like that ambush on Class C at the start.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe ejected the magazine from her submachine gun, confirmed that there were plenty of rounds left and then slammed it back deep into place with a \u003cem\u003eclack\u003c/em\u003e.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Because I\u0026apos;ve finally met the opponent I\u0026apos;m supposed to take down.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ooh... pretty ambitious for you. Thinkin\u0026apos; Class A is the biggest enemy, huh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? You think I care about crap like that? I\u0026apos;ve just been itching for a fight... because I wanted so, so badly to see that look of frustration on that Horikita girl\u0026apos;s face!\u0026quot;\u003c/p\u003e\u003cimg src=\"/hola-lector-agua/images/books/y3v3/OEBPS/RGDYIZnTtrVLupNblsETE.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe said as she mercilessly fired paintballs from her submachine gun. A wristwatch alarm rang out, indicating she hit someone more than ten meters away.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen the magazine ran empty, she quickly removed it and reloaded a new one. Ibuki still had seven spare magazines she\u0026apos;d been saving up until then. She could shoot more than enough.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;All my pent-up grudges, I\u0026apos;m gonna pay them back right here, right now!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;O-Oh. Well, I guess it\u0026apos;s not a bad thing to be motivated... For now, I\u0026apos;m gonna back up a bit, so don\u0026apos;t push yourse\u0026#x2014;What the...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was inevitable that that place would soon become a danger zone and just as Ishizaki tried to fall back a little, Ibuki grabbed his arm and stopped him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re my support.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? Give me a break. I\u0026apos;ve gotta protect Ryuuen-san.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You don\u0026apos;t need to protect a guy like that. More importantly, you\u0026apos;re going to be my shield.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No way in hell!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re holding that big-ass weapon, so just charge in, will you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If I go now, it\u0026apos;s like I\u0026apos;m asking them to shoot me!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;As long as I can take down Horikita, that\u0026apos;s all that matters!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not all that matters!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDuring their loud exchange, Class A also noticed the enemy students hiding behind the large tree and fired paintballs at them without mercy. A paintball faintly whizzed past the tip of Ishizaki\u0026apos;s hair.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Whoa, that was close!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIbuki glared at Ishizaki, who was breaking out in a cold sweat.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If we wait here, we\u0026apos;ll get taken out eventually, so go, Ishizaki! C\u0026apos;mon! Hurry up!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Agh, fine! I guess I\u0026apos;ve got no choice! Follow me, Ibuki!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIshizaki burst out and using his large build for cover, Ibuki stuck close behind him and burst out as well.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMeanwhile, on the other side, were the Class A students who\u0026apos;d used tactics to circle around to the rear. One of them, Sudou, had just taken out his fifth person.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m out of ammo! Let me reload!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBlessed with great physical ability and having polished his skills in practice to a level his classmates could not match, he was putting on an ace-level performance without holding back.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYukimura, who was hiding nearby, handed Sudou a fully loaded magazine. As the designated VIP, Yukimura couldn\u0026apos;t attack, but providing support didn\u0026apos;t violate the rules.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Class B is down to thirteen! The guy Sudou just took out was probably one of their VIPs!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eInformation about eliminated students came in periodically over the radio.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh, for real? That\u0026apos;s lucky...! Just two more!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah, no, wait! It looks like we lost one, too. Mii-chan\u0026apos;s out!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHis joy was short-lived; in the blink of an eye, the VIP count was two to two.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What\u0026apos;s the situation with Class C and Class D?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hirata\u0026apos;s holding them off now. It seems we anticipated their counter-strategy, just as Horikita read.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s Suzune for ya\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSudou smiled, overcome with delight, but then he heard multiple sets of footsteps approaching from the front.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;They\u0026apos;re closing in! You stay hidden!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe gave the order to Yukimura, then leaned his upper body out and aimed his gun at the approaching Class B students. Meanwhile, the Class B students, despite noticing Sudou, showed no sign of aiming at him and were all facing a different direction.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe landed a paintball on the abdomen of Nomura, who got the closest, but the remaining few forcefully broke past Sudou\u0026apos;s flank.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I won\u0026apos;t let you get away!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe aimed at their backs and took out one more, but the dense trees blocked the remaining two and he couldn\u0026apos;t get a clear shot.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Tch! I\u0026apos;m leaving this place to you guys!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eLeaving a few students with orders to protect Yukimura, Sudou gave chase to the two.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s Satou! Take her out, no matter what!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eClass C, Class D and Class B.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs if their objectives had aligned, all of their guns locked onto Satou.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut the next moment, as they pulled their triggers, Satou\u0026apos;s figure vanished in an instant.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Kya!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was by the hands of someone Satou herself had never expected.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you okay?!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSudou pulled Satou into his arms, saving her from the predicament of being showered in paintballs.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Y-Yeah, thank\u0026#x2014;!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBefore Satou could finish her thanks, even more paintballs grazed past them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;They\u0026apos;re comin\u0026apos; at us with everything they\u0026apos;ve got. Are they plannin\u0026apos; on using up all their ammo here?!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSudou fired back a few warning shots, but knowing he couldn\u0026apos;t aim properly while protecting Satou, he quickly took his finger off the trigger.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t you think somethin\u0026apos;s weird...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;W-Weird?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Look at the paintball marks around us. It\u0026apos;s obvious way more guns are pointed at us, right? Even though there are a bunch of other allies hidin\u0026apos; around.\u0026quot;\u003c/p\u003e\u003cimg src=\"/hola-lector-agua/images/books/y3v3/OEBPS/VJGfcnsIvdOPBwEDabyPb.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe said, looking at Inogashira and Okitani hiding behind the large trees to their left and right a short distance away.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe marks where paintballs had actually hit and burst were visible, but that was only at the beginning; now, concentrated fire was being directed at Sudou and Satou\u0026apos;s position.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Isn\u0026apos;t it because you\u0026apos;re here, Sudou-kun?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Nah, it\u0026apos;s been like this since before I jumped in. In other words, doesn\u0026apos;t that mean Class B knew you were the VIP before we even started fightin\u0026apos;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;H-How...? Really?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Probably... They\u0026apos;re ignoring the guards and are weirdly obsessed with taking you down.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSudou was confident he could handle it well if the target was aimed at him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut with a strategy that so blatantly targeted only Satou, that became difficult.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was because even Sudou couldn\u0026apos;t fend them all off if the other side was prepared to sacrifice two or three people.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Maybe they figured out the VIP\u0026apos;s identity somehow... and what\u0026apos;s worse, maybe everyone\u0026apos;s\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Can they do something like that? M-Maybe... it got exposed when Ayanokouji-kun came here!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I guess it\u0026apos;s true he might\u0026apos;ve unconsciously protected the VIP, but where were you then?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;U-Uhm. I was right inside the tent\u0026#x2014;-I was scared, so I just stayed hidden...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHearing her words, Sudou broke out in a cold sweat as a certain possibility came to his mind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut right then, whether or not the answer was correct meant nothing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I... I don\u0026apos;t think I can get away. At least you should run, Sudou-kun and protect the other VIPs\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If that\u0026apos;s what it takes to win, maybe that\u0026apos;s what I should do. But I\u0026apos;m not gonna let \u0026apos;em take you out this easily... We just gotta fight!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe accuracy of the incoming shots was by no means high.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSudou surmised that the skill of the unseen enemy guards wasn\u0026apos;t great.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe\u0026apos;d leap out, betting it all and take down all the enemies before Satou was shot.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHaving made his decision, Sudou leaped out in front of the enemy.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 3\",\"volumeId\":\"y3v3\",\"chapterIndex\":49,\"prevChapter\":{\"volumeId\":\"y3v3\",\"chapter\":48,\"title\":\"Part 2\"},\"nextChapter\":{\"volumeId\":\"y3v3\",\"chapter\":50,\"title\":\"Part 4\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 3\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":11},{\"label\":\"Prologue: Shiina Hiyori's Monologue\",\"href\":\"prologue.xhtml\",\"index\":12},{\"l
