e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T1772,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 1\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAT EXACTLY 9:00 AM on the morning of the second day.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe first report came in from the commander, Shimazaki, to the VIP, Shiraishi. That was because all GPS information had remained frozen from 6:00 PM to 9:00 AM, the hours outside the exam.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat said, students had to restart the next day from the area they were in at 6:00 PM the previous day, so there was no need to worry excessively unless an enemy remained in the same area.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It seems the GPS locations have been updated. Not a single one is missing and their movements appear to have been minimal within the same areas. Koenji-kun, who\u0026apos;s isolated from Class A, is also still present and is said to be in D6.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI\u0026apos;d expected that someone might report feeling unwell overnight, but it seemed everyone managed to get through it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I knew he crossed mountains and rivers in a day, but he\u0026apos;s completely enjoyin\u0026apos; himself, ain\u0026apos;t he? He can\u0026apos;t have any extra food, so what the hell\u0026apos;s he doin\u0026apos;? Don\u0026apos;t tell me he\u0026apos;s livin\u0026apos; off the land?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wasn\u0026apos;t an expert on the wild plants of the uninhabited island, but I hadn\u0026apos;t seen enough of them to supplement one\u0026apos;s nutrition. One could catch fish in the sea, but there were no fishing rods among the supplied items this time. That meant it had to be something one could find on the beach, but judging from his movements yesterday, his GPS hadn\u0026apos;t reached the sea.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, whatever. He can\u0026apos;t get any extra supplies without the password anyway, so we can just leave him be.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was unclear whether he would become a threat, but it was certain there was zero merit in us getting involved.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Koenji, huh\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI hoped he would\u0026apos;ve voluntarily retired during the off-hours, but he was still there?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is something the matter? I believe it would be best to leave him alone, as Hashimoto-kun said.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s our common understanding, but there\u0026apos;s just a certain... creepiness to it. It\u0026apos;s because I don\u0026apos;t understand the reason why he\u0026apos;s still here instead of retiring.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re the one who thinks he\u0026apos;s not motivated, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s more accurate to say that\u0026apos;s how I saw him. That\u0026apos;s why I expected him to have already retired by this morning. I also considered the possibility he might approach the base by nightfall.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKoenji\u0026apos;s current position was quite far from the base, deep within the uninhabited island.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;He probably just thinks it\u0026apos;s a vacation, right? That\u0026apos;s his character, after all.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This place is the same as last year. There shouldn\u0026apos;t be anything new about it for Koenji.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFollow Horikita and participate in the special exam...?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo, of course I wouldn\u0026apos;t say the probability was zero, but it still wasn\u0026apos;t very high.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy own thoughts, from having analyzed the student known as Koenji Rokusuke.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Isn\u0026apos;t it a waste of time just thinkin\u0026apos; about it? Even if, by some chance, the guy is motivated, we have no way of knowin\u0026apos;. He\u0026apos;s alone and as long as we don\u0026apos;t make contact, there\u0026apos;s no problem, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUnable to contact his commander, Koenji didn\u0026apos;t know the location of his allies or his enemies, so even if he had the will to fight, it was true he couldn\u0026apos;t find an enemy on his own.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn other words, the idea that there would be no problem as long as we kept track of his GPS location was fundamentally correct.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, there was the unavoidable case of accidentally running into him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOr, even if he had no intention now, there was also the case that Horikita might plot to make him move in the future.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was important not to dismiss him as just one person and to always keep an eye on him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What\u0026apos;s everyone\u0026apos;s condition?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Can\u0026apos;t say we\u0026apos;re in top form, not by a long shot. To be honest, I\u0026apos;m hungry too.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe food we secured yesterday. If we were to use it all up, we could fill our stomachs temporarily, but looking ahead to today and tomorrow, we had to refrain from wasteful consumption.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Unless the other classes make any suspicious moves, our basic strategy is to wait until an event occurs.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI conveyed our tentative policy and spoke once more to Shiraishi and Takemoto, telling them to maintain close communication between the commander and the VIPs.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 1\",\"volumeId\":\"y3v3\",\"chapterIndex\":29,\"prevChapter\":{\"volumeId\":\"y3v3\",\"chapter\":28,\"title\":\"Chapter 4: A Chance Encounter\"},\"nextChapter\":{\"volumeId\":\"y3v3\",\"chapter\":30,\"title\":\"Part 2\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 3\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":11},{\"label\":\"Prologue: Shiina Hiyori's Monologue\",\"href\":\"prologue.xhtml\",\"index\":12},{\"label\":\"Chapter 1: Opening. Survival Game Special Exam.\",\"href\":\"c1.xhtml\",\"index\":13},{\"label\":\"Part 1\",\"href\":\"c1p1.xhtml\",\"index\":14},{\"label\":\"Part 2\",\"href\":\"c1p2.xhtml\",\"index\":15},{\"label\":\"Part 3\",\"href\":\"c1p3.xhtml\",\"index\":16},{\"label\":\"Chapter 2: A Surprise Attack\",\"href\":\"c2.xhtml\",\"index\":17},{\"label\":\"Part 1\",\"href\":\"c2p1.xhtml\",\"index\":18},{\"label\":\"Part 2\",\"href\":\"c2p2.xhtml\",\"index\":19},{\"label\":\"Part 3\",\"href\":\"c2p3.xhtml\",\"index\":20},{\"label\":\"Part 4\",\"href\":\"c2p4.xhtml\",\"index\":21},{\"label\":\"Chapter 3: The Unseen Pressure\",\"href\":\"c3.xhtml\",\"index\":22},{\"label\":\"Part 1\",\"href\":\"c3p1.xhtml\",\"index\":23},{\"label\":\"Part 2\",\"href\":\"c3p2.xhtml\",\"index\":24},{\"label\":\"Part 3\",\"href\":\"c3p3.xhtml\",\"index\":25},{\"label\":\"Part 4\",\"href\":\"c3p4.xhtml\",\"index\":26},{\"label\":\"Part 5\",\"href\":\"c3p5.xhtml\",\"index\":
