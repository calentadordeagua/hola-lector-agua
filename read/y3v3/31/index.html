e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T437c,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 3\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTHE CLOCK\u0026apos;S HANDS ticked forward, from 11:28 to 11:29 AM.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eClass B had been divided into two ten-person groups to retrieve supplies under Ryuuen\u0026apos;s command and a main force to hold back Class C. The guard group, led by Komiya and accompanied by the VIP Morofuji, was headed for the supplies that appeared in E9.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNormally, the E9 location would\u0026apos;ve been completely clear. It was difficult for either Class A or Class C to target and Class B thought it would be an easy acquisition.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, just before 11:00 AM, one concern emerged regarding the retrieval of those supplies.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA lone GPS signal that had strayed from Class A, which appeared at D6 at 9:00 in the morning.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey were now in a situation where they might coincidentally run into it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;R-Report. Looks like that lone GPS signal is still heading our way.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShowing a slight bewilderment, Morofuji relayed Kaneda\u0026apos;s report to her classmates.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You say he\u0026apos;s comin\u0026apos; our way, but it\u0026apos;s just one guy, right? Some scrub like that doesn\u0026apos;t even know where we are, so there\u0026apos;s no need to sweat it. Besides, if we spot him, we can just shoot \u0026apos;im.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith nine guards and a VIP, there was no way they could lose, Komiya replied with an air of confidence.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But... that\u0026apos;s probably Koenji-kun, right? There\u0026apos;s no doubt he\u0026apos;s a dangerous guy...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t matter. This ain\u0026apos;t a fistfight, it\u0026apos;s a survival game, ya know? Doesn\u0026apos;t matter who pulls the trigger, the result\u0026apos;s the same, so there\u0026apos;s nothin\u0026apos; to be on guard for. More importantly, we gotta grab the supplies and get back to the main unit, or we\u0026apos;ll be in deep shit if Class C makes a move.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe number of students in the main unit and in Class C were evenly matched. It wasn\u0026apos;t out of the question that Ayanokouji, seeing it as an opportunity, might suddenly go on the offensive. That was precisely why Ryuuen ordered them to return as soon as possible.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What should we do, Oda-kun...? Is it okay to let him go?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOda, having been called, thought for a moment before telling her to contact Kaneda and ask for Ryuuen\u0026apos;s instructions and then decided to follow Komiya.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUnable to hide her anxiety, Morofuji operated the radio again and again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s no use. He must be talking to someone else, I can\u0026apos;t get through at all.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was only one commander and if communications with the VIPs were congested, the line wouldn\u0026apos;t connect.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen he was communicating with someone else, a period of radio silence was inevitable.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;See, I told ya you\u0026apos;re worryin\u0026apos; too much. If we run into him, I\u0026apos;ll put a round right through his heart. With this partner of mine that took out four guys during the ambush!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eLaughing, Komiya took the shotgun in his hands and struck a pose as if to show off.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Where are you, Koenji!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShouting confidently, Komiya ran out and pointed the muzzle of his shotgun left and right.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Here!? It\u0026apos;s over here, huh!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith a \u003cem\u003eBang! Bang!\u003c/em\u003e, he fired the shotgun twice into the dark forest.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hey, don\u0026apos;t go wasting so many shots~\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Heh heh, what\u0026apos;s the harm? He could actually be hiding, you know.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eLooking amused, Komiya took out the magazine and reloaded it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That guy\u0026apos;s getting carried away. That\u0026apos;s totally a death flag, isn\u0026apos;t it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eLaughing in amusement, Yamawaki spoke to Kinoshita, who was walking beside her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Guys are so dumb. To think they could find fighting with these things fun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKinoshita sighed, staring coldly at the assault rifle in her hands.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You say that, but when we charged Class C, you looked like you were having fun shooting. I saw you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Th-that was... I mean, I just got kinda caught up in the moment, you know\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBlushing that he\u0026apos;d seen an unexpected side of her, Kinoshita sharply smacked Yamawaki on the shoulder.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Agh\u0026#x2014;!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eImmediately after, a voice cried out in agony.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;H-Huh!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe didn\u0026apos;t remember hitting him that hard, Kinoshita thought, but the voice that cried out wasn\u0026apos;t Yamawaki\u0026apos;s. It was Komiya, who was walking at the front. He crumpled to the ground.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe simultaneously dropped the shotgun he\u0026apos;d been holding loosely.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor a brief moment, the students walking behind Komiya couldn\u0026apos;t comprehend what happened.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hey, Komiya, what are you doin\u0026apos;\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eImmediately after, Kinoshita, who was right beside Yamawaki as she started to speak, also felt a sharp pain pierce her abdomen.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eSplat!\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlong with that sound came the sensation of an impact and liquid spreading across her abdomen.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ow!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe impact itself wasn\u0026apos;t that strong, but such a cry escaped her at the unexpected shot.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was then that Yamawaki finally understood what was happening.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Gah\u0026#x2014;she\u0026#x2019;s been shot! There\u0026apos;s an enemy!!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTriggered by Yamawaki\u0026apos;s shout, a paintball landed on the side of Yabu, who was standing dazedly nearby and another on Sonoda\u0026apos;s left thigh and \u0026apos;out\u0026apos; warnings were issued from their wristwatches.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was only then that the panicked students each raised their paint guns and with many eyes, frantically scanned left and right, focusing on the area ahead.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, they couldn\u0026apos;t spot the enemy that was shooting at them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I-It\u0026apos;s gotta be Koenji! Koenji\u0026apos;s close! Isn\u0026apos;t Kaneda gonna say anything!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe exploded with frustration at the commander for not reporting the approaching danger.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I haven\u0026apos;t been able to get through at all!!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This makes no sense!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey continued to shout in a panic as the guards formed a circle to protect the VIP, Morofuji.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut they couldn\u0026apos;t find Koenji, or even a single human figure.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Where are they shooting from!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I dunno!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA sharp sound rang out and by the time they noticed, a paintball struck someone else.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNot a single wasted shot and each one was precise.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnother shot flew from out of nowhere and Yamawaki was hit.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePredicting their opponent\u0026apos;s position from the point of impact, the remaining four fired back.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut still, there was no one in sight.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why are you attacking us, Koenji!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was nothing strange about it, as they were enemies, but Komiya, who was now \u0026apos;out,\u0026apos; shouted at the unseen Koenji, not having expected him to participate in the exam.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s just one person, isn\u0026apos;t it? We can\u0026apos;t lose to him!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe girl, Nishino, exhaled and started running toward the direction the paintballs seemed to be coming from.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Wait, Nishino!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOda shouted, but immediately after, Nishino was also shot and she fell forward in shock.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe Class B students were deeply shaken by the extraordinary situation of six students being eliminated in less than thirty seconds.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey fired their guns wildly, paintballs hitting and splattering on trees, the ground, leaves\u0026#x2014;everywhere.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Where the hell are you!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It is Koenji, right!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t know!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOne by one, they were taken down, until all eight guards surrounding Morofuji were \u0026apos;out.\u0026apos;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What\u0026apos;s... what\u0026apos;s happen\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSuzuki was stunned as his allies were taken down one after another by an unseen enemy.\u003c/p\u003e\u003cimg src=\"/hola-lector-agua/images/books/y3v3/OEBPS/fZbZjSAcYVdQMwoATEjwy.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt that moment, just as a call from Kaneda came in over the radio for Morofuji, that very Suzuki was shot in the shoulder and his wristwatch issued an alert.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMorofuji, the VIP who was being protected, frantically tried to run away, but she tripped and fell.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;M-Morofuji! He\u0026apos;s here, he\u0026apos;s here! Run!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom the direction the eliminated student had shouted toward, Koenji appeared, walking with a confident stride.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMorofuji picked up a weapon an ally had dropped and aimed it at Koenji.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;D-Don\u0026apos;t come any closer!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re the VIP, aren\u0026apos;t you? If you were to fight back, you would simply be eliminated for nothing.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn response to Koenji\u0026apos;s calm admonishment, Komiya stood up and ran over.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What do you think you\u0026apos;re doing!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There is nothing to it, is there? I am from Class A, you are from Class B. We\u0026apos;re enemies.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Th-That\u0026apos;s...! I mean, how\u0026apos;d you find us when you\u0026apos;re all alone!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;My, my. I had no knowledge that I would stumble upon you. However, when one hears voices and gunshots so unsuited for this great wilderness, it is something one would understand whether one likes it or not. Am I wrong?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe sound of a cocky Komiya provoking Koenji and the sound of gunfire.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was what led him to their location, Koenji answered.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I enjoyed the uninhabited island for a day and thinking I had my fill, was on my way back to the ship\u0026#x2014;but I thought I\u0026apos;d give this a try for the novelty of it. That is all.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSaying so, he raised his assault rifle and grinned.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Damn it, this is your fault, Komiya!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;S-Sorry...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t be so quick to blame him. Thanks to him, I\u0026apos;ve had some fun. Now that I\u0026apos;ve tried it for myself, this so-called survival game is quite entertaining, you know.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe muzzle pointed at them came from Koenji, who\u0026apos;d just thanked them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSensing she was out, Morofuji closed both eyes, but there was no sign of her being shot.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Have you come to collect the supplies in this area, perhaps?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;W-Well...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I should think it would be for your own good to answer honestly.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Y-Yeah. There\u0026apos;s ammo... so we came to get it...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is that so? In that case, you may take the supplies and return with them to Class B.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What... do you mean?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Being defeated by me was nothing more than a series of unfortunate events. It would be a pity to single out Class B and bully them for no reason, wouldn\u0026apos;t it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t you dare fall for it, Morofuji! He\u0026apos;s bound to shoot you in the back once you open the box! Koenji wants the ammo!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Y-Yeah!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMorofuji nodded, taking the advice from the student who\u0026apos;d been eliminated.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSeeing this, Koenji let out a light sigh.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;My, my, that\u0026apos;s quite the misjudgment. For me, winning or losing this special exam is a matter of supreme indifference. I have no interest in whether I defeat the VIP here, or whether I obtain the supplies. However, for all of you, the VIP\u0026apos;s points are a crucial element, are they not? And the supplies as well...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh, well,\u0026quot; Koenji muttered and began to walk away.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;A-Are you really letting me go?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re quite persistent, aren\u0026apos;t you? If you desire it so much, shall I eliminate you here and send you on your way?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen he pointed the muzzle of the assault rifle at Morofuji, the sheer force of it made her shake her head vigorously from side to side.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Very well. I shall take my leave now. I trust you will take care not to get in my way again. I am, after all, thinking of returning to the ship soon.\u0026quot;\u003c/p\u003e\u003c
