e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T29d8,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 4\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIT WAS PAST 6:00 p.m. As I made my way forward, Hashimoto, who noticed my approach on the GPS beforehand, came over to meet me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Impressive stuff, Ayanokouji. I was watchin\u0026apos; the whole time on the analyst\u0026apos;s tablet and saw you reach the event and secure the goods. Heard you went straight for the destination, huh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I actually had to search for a bit. It helped that it was placed in a surprisingly easy-to-find spot. Inside the supply crate were five small mess tins, five small bags of white rice to go with them, five 500-ml bottles of water and five small, simple loaves of bread.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor a class maintaining a group of nearly forty people, these were meager provisions. It symbolized how a single event wasn\u0026apos;t enough and how we had to keep moving.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So it\u0026apos;s not much, huh? Sorry, but we pulled back without a second thought. A big group was comin\u0026apos; our way. Guess you could say we succeeded in drawin\u0026apos; \u0026apos;em out, though.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHaving fewer people was a disadvantage not only in terms of points, but also in combat.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut if there was one advantage to be found among the many drawbacks, that was it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe Class C students began to assemble the tents and make their beds.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe tents that could sleep three or more people were for the boys, while the smaller one- and two-person tents were mainly for the girls and to keep things fair, we used rock-paper-scissors to assign who would use which tent.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The girls are settin\u0026apos; up the simple tents and makeshift toilets now and they\u0026apos;re pretty damn good at it. I mean, for Japanese high schoolers, we\u0026apos;re probably top-class when it comes to roughin\u0026apos; it in the wild, huh? I thought it was a useless experience at first, but it might actually be a handy skill.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto said with admiration and he was right.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In a disaster-prone country like Japan, it\u0026apos;s not a bad thing to have experience with things like living in a tent and using outdoor toilets. No, in fact, it\u0026apos;s probably one of the things that should be encouraged from now on.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis was the third year and the third time we had an uninhabited island exam.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed that holding them consecutively had been rare until now, but when considered as an important experience for the future, it wasn\u0026apos;t hard to see why.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the future, if we were ever caught in a situation where electricity wasn\u0026apos;t readily available, wouldn\u0026apos;t we be able to handle it without panicking?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA short while later, once the setup was more or less complete, we gathered the food we\u0026apos;d brought back in one place and began to calculate how much each person would get if we divided it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, we would collect as much as we could from future events as well, but it was always better to keep track of our current caloric intake and hydration levels.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis was to avoid heading to an event when we didn\u0026apos;t need to gather excess supplies, which could lead to unnecessary confrontations and casualties.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFurthermore, to maintain fairness, the food we obtained was distributed equally among everyone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd so, while commiserating over the day\u0026apos;s fatigue, the students brought the modest meal to their lips.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hey, can I ask you somethin\u0026apos;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMatoba, who\u0026apos;d approached me, said so hesitantly while looking at the food.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;How effective is it, really, to eat and drink in small portions? It\u0026apos;s not like we\u0026apos;re light on luggage and food takes up a lotta space, right? Wouldn\u0026apos;t it be better to just eat when we can?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;As an extreme example, the energy efficiency of splitting one meal into three is overwhelmingly higher than stuffing yourself with one meal a day. The human body is limited in how much energy it can store when consumed all at once. Carbohydrates are a good example; even if a small amount is stored in the liver and muscles, the rest is converted into fat. Of course, energy is also consumed during the conversion process. Water is even more pronounced; drink too much and it can\u0026apos;t be stored, instead being expelled as sweat or urine. Moreover, the human body adapts to starvation and transitioning gradually to a low-calorie state slows the metabolism and suppresses consumption.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven in survival manuals for disasters, the basic principle was to consume small amounts for as long as possible.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So, even with the same food, how long it lasts is completely different.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMatoba understood that even if it was a bit of a hassle, it was definitely better to carry the food.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter that, the students who finished their meal enjoyed their free time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA few students came forward saying they wanted to practice shooting for tomorrow, so I gave them permission after limiting the number of bullets they could use.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs long as they didn\u0026apos;t shoot others, firing a gun outside the designated times wasn\u0026apos;t, in itself, a violation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf anything, it was important for them to hone their skills.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI spread out the map and reflected on the day.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eClass C, half-destroyed in a surprise attack; Class B, which was all but unscathed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eClass A and Class D succeeded in keeping a firm distance from the other classes, navigating the events safely and only collecting supplies.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe effect of sinking to a provisional last place was significant and few of my classmates were smiling.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Man, everyone\u0026apos;s lookin\u0026apos; so gloomy. Well, can\u0026apos;t be helped, given our results so far.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto muttered as he looked around, a nutritional block held in his mouth.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Isn\u0026apos;t there somethin\u0026apos; you can say as our leader? Like, \u0026apos;We\u0026apos;ll definitely win, so don\u0026apos;t worry,\u0026apos; or whatever.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I can\u0026apos;t say something baseless. If I were to say that now, I\u0026apos;d only earn their resentment and they\u0026apos;d ask, \u0026apos;Who do you think you are?\u0026apos;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe leader who couldn\u0026apos;t foresee the surprise attack and was nonchalantly lecturing on how to use the weapons.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was perfectly obvious that I would be met with looks and words of contempt.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And yet, you seem to be havin\u0026apos; a pretty good time.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Do I look that way?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Just a hunch. How can you enjoy a situation like this?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I suppose it\u0026apos;s because I don\u0026apos;t dislike the deserted island exam itself. It\u0026apos;s an intense way to experience things you could never go through in a normal school life. I get to see so many expressions on my classmates\u0026apos; faces that I\u0026apos;ve never seen before.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, that\u0026apos;s somethin\u0026apos; else. So you\u0026apos;re sayin\u0026apos; you\u0026apos;re satisfied in a way that\u0026apos;s got nothin\u0026apos; to do with whether we\u0026apos;re winning or losing the exam?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It would be a lie to say I\u0026apos;m not. Of course, I have no intention of losing, either.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll take you at your word. Anyway, I guess when things are this gloomy is when it\u0026apos;s my time to shine, huh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith those words, Hashimoto clapped his hands and made his way toward his downcast classmates.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not like we\u0026apos;ve lost the exam yet, y\u0026apos;know. If you get all down in the dumps, we\u0026apos;ll lose a battle we could\u0026apos;ve won, don\u0026apos;tcha think? How \u0026apos;bout you try to have a little fun with this deserted island life?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhether he was encouraging them or provoking them, Hashimoto continued on.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;d be one thing if we were in the lead, but do you really think we can enjoy ourselves while we\u0026apos;re losing?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor Class C, who weren\u0026apos;t used to losing, the defeat in the end-of-year special exam, the previous loss by a narrow margin and now this difficult situation was a series of misfortunes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe human brain receives roughly twice the emotional impact from a loss as it does from a win. They were a class that\u0026apos;d won many times before, but that, combined with their current position as Class C, was becoming an unbearable shock. Because they were nearly the polar opposite of Horikita\u0026apos;s class, their state was, after all, very interesting to just watch.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 4\",\"volumeId\":\"y3v3\",\"chapterIndex\":26,\"prevChapter\":{\"volumeId\":\"y3v3\",\"chapter\":25,\"title\":\"Part 3\"},\"nextChapter\":{\"volumeId\":\"y3v3\",\"chapter\":27,\"title\":\"Part 5\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 3\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\": rt 3\",\"href\":\"c5p3.xhtml\",\"index\":37},{\"label\":\"Part 4\",\"href\":\"c5p4.xhtml\",\"index\":38},{\"label\":\"Chapter 6: The Real Goal\",\"href\":\"c6.xhtml\",\"index\":39},{\"label\":\"Part 1\",\"href\":\"c6p1.xhtml\",\"index\":40},{\"label\":\"Part 2\",\"href\":\"c6p2.xhtml\",\"index\":41},{\"label\":\"Part 3\",\"href\":\"c6p3.xhtml\",\"index\":42},{\"label\":\"Part 4\",\"href\":\"c6p4.xhtml\",\"index\":43},{\"label\":\"Part 5\",\"href\":\"c6p5.xhtml\",\"index\":44},{\"label\":\"Part 6\",\"href\":\"c6p6.xhtml\",\"index\":45},{\"label\":\"Chapter 7: The Time of the Decisive Battle\",\"href\":\"c7.xhtml\",\"index\":46},{\"label\":\"Part 1\",\"href\":\"c7p1.xhtml\",\"index\":47},{\"label\":\"Part 2\",\"href\":\"c7p2.xhtml\",\"index\":48},{\"label\":\"Part 3\",\"href\":\"c7p3.xhtml\",\"index\":49},{\"label\":\"Part 4\",\"href\":\"c7p4.xhtml\",\"index\":50},{\"label\":\"Part 5\",\"href\":\"c7p5.xhtml\",\"index\":51},{\"label\":\"Epilogue: Show Me What You’ve Got\",\"href\":\"e.xhtml\",\"index\":52},{\"label\":\"Part 1\",\"href\":\"e1.xhtml\",\"index\":53},{\"label\":\"Author's Afterword\",\"href\":\"authors-afterword.xhtml\",\"index\":54}],\"volumeTitle\":\"Light Novel 3rd Year Volume 3\",\"detailsLink\":\"/select/year-3/y3v3\",\"returnLink\":\"/select\",\"currentSpineIndex\":26,\"nextVolumeLink\":\"$undefined\",\"nextVolumeTitle\":\"$undefined\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience
