quot;Hey Kanzaki, does this... mean what I think it means...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s too early to draw conclusions, but if the next event has a similar mechanic, the probability will be orders of magnitude higher.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe 11:00 a.m. event on the second day.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA warning flag was raised on the basic assumption that they\u0026apos;d simply repeat what they\u0026apos;d done four times the day before.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe map was divided into a 15x15 grid. Its outer squares were, of course, mostly sea, but it\u0026apos;d been announced that all of these outer squares would be designated as completely prohibited areas starting in one hour. In an hour, this gray would turn pitch black and a rule would be activated that would get you eliminated in five minutes for entering.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut that alone would have no effect on their current situation. However, what would happen in two hours, at the start of the next event? If the outer squares were similarly made prohibited, that would mean the map would silently shrink, layer by layer from the outside, with each future event.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eToday, tomorrow, the day after. There were 10 events left, not including this one. While it was hard to imagine the perimeter shrinking in all of them, if the rule didn\u0026apos;t change, the four classes would end up clustered near the center. If that happened, the enemy would be right under their noses.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s no way to avoid a fight from here on out\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDark clouds began to gather over Class D, whose primary goal had been to make it through the exam just by staying in the eastern area, where they could maintain their distance from the other three classes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If one or two more prohibited areas are created today by shrinking the perimeter, we should probably consider making a major move.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eReturning to the center from the north would require a time-consuming detour. Furthermore, Class A was in the northern area, creating the risk of an ambush. On the other hand, if they leaned too far south in an attempt to return to the center early, the terrain might be unsuitable for collecting event rewards.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUnable to take his eyes off the tablet, his thoughts spun round and round in his head.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Kanzaki-kun!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKanzaki, shaken by the shoulder, realized his name had been called repeatedly and looked up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...My apologies. What is it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;A message from Honami-chan. She says she\u0026apos;ll think about our course of action, so don\u0026apos;t worry.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a message from Ichinose, as if she\u0026apos;d been watching Kanzaki\u0026apos;s near-confusion from the side.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It seems she wants you to focus on the event in front of you for now.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes... you\u0026apos;re right.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;She also said we don\u0026apos;t have to push ourselves for O14, just in case.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf they headed to O14 from their current position and had trouble recovering the supplies, there was a risk of being eliminated.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;For now, we\u0026apos;ll move to secure it. O14 has little land, so the supplies themselves should be easy to find.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNot going after the event would mean losing the opportunity to collect the supplies.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...We\u0026apos;ll split into three groups at once and head to collect the event rewards.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe kept their goal unchanged: to play it safe by repeating the same actions and work hard to gather the supplies needed for everyone to get through the day.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 2\",\"volumeId\":\"y3v3\",\"chapterIndex\":30,\"prevChapter\":{\"volumeId\":\"y3v3\",\"chapter\":29,\"title\":\"Part 1\"},\"nextChapter\":{\"volumeId\":\"y3v3\",\"chapter\":31,\"title\":\"Part 3\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 3\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"
