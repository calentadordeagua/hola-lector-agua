e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T6c80,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 4\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eABOUT 30 MINUTES before the Class B students were suddenly attacked.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt 11:00 a.m., Class C reached the first event time of the second day and upon receiving information that all squares on the outer perimeter had been designated as restricted areas, they immediately began a new strategy meeting.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlthough the sea accounted for most of it, the fact that a total of 56 squares had become restricted left the students unable to hide their surprise.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Does this mean the restricted areas might...grow from the outside in?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs Hashimoto murmured his hypothesis, Morishita immediately added to it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s a definite possibility. If the map ultimately shrinks to a single area, a fight will be inevitable. Don\u0026apos;t you think Ayanokouji Kiyotaka would agree?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a simple and effective way to forcibly gather the classes that\u0026apos;d been keeping their distance until then.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I agree. Even if the map doesn\u0026apos;t converge perfectly on the center, expanding the restricted areas from the perimeter inward is one of the most logical ways to lead us toward the end goal of this survival game: defeating opponents with paintball guns.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf all the remaining outer squares became unusable with each event, an additional 48 squares would be lost. On the third occasion, another 40 would disappear and by tomorrow, it would shrink to the final square. Considering the three-night, four-day duration, the pace of reduction would inevitably be a bit slower, but it was best to keep in mind that it would likely end up that way by the final day.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNortheast, northwest, southeast, southwest, or the center.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe probability that it would narrow from one of these points was high, but it was still impossible to determine which one for now.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOr rather, the school probably wouldn\u0026apos;t narrow it down in a way that would be easy to figure out early on.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was precisely why each class was racking their brains, trying to decide where to move while still participating in events.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe starting point\u0026#xa0;wouldn\u0026apos;t be revealed until the third day at the earliest, or perhaps at the time of reduction on the fourth day.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Right now, everyone\u0026apos;s focused on moving around the island, gathering supplies and staying healthy, but that\u0026apos;s nothing more than a prelude. It\u0026apos;s become more likely that the class that can secure the best position for the final firefight or the one that can seize even the slightest momentum, will be the victor.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So it\u0026apos;s like this whole thing\u0026apos;s going to be settled with a pure survival game? Well then, I\u0026apos;m ready to show my stuff.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMorishita clenched her fist.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe possibility that the outcome would be decided by pure combat had indeed increased. No matter how many rounds of ammunition or how much food one gathered, a moment of carelessness could take out ten or twenty people. So what was the point of these three nights and four days? Of course, it served as a mechanism to create small advantages, but it seemed too elaborate for just that. Was it an opportunity to experience life on a deserted island and learn from the extraordinary? The food obtained from supply crates was by no means plentiful and they were forced to manage their health under difficult conditions, so gaining survival experience separate from the game itself wasn\u0026apos;t a bad thing... but.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWas this survival embedded in a survival game, or a survival game embedded in survival?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOr would this lead to something completely separate from the special exam?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;d be great for us if the other classes just started fighting each other in the smaller area. No doubt we\u0026apos;ll be at a disadvantage in a firefight if we don\u0026apos;t close the numbers gap, even by a little.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIgnoring my classmates who continued their discussion, I narrowed down the possible scenarios to a few patterns and plotted them all out on the virtual map I\u0026apos;d already constructed in my mind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe chaotic battle in the endgame was unavoidable. If the three VIPs were unfortunately taken out by stray rounds, it would be checkmate. On the other hand, if only the VIPs were to flee, their allies would lose contact with their commander and wouldn\u0026apos;t know the enemy\u0026apos;s location, which would also increase the risk of the VIPs being targeted and picked off. The existence of tactics for identifying individuals was likely a weapon for just such a situation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the end, even if I could wrack my brain and increase our odds of winning, I couldn\u0026apos;t bring them to one hundred percent.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eStill, I had to build a strategy to increase our chances of winning, even by a single percent.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eHow would the four classes move in response to the restricted areas? What\u0026apos;re they planning?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI\u0026#xa0;had to construct the logic and predict several outcomes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI thought faster than anyone else about how I could intervene to reach the ideal outcome.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI deduced the psychological states of each class, considering the presence of the VIPs, their movements within the deep forest and where they would end up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe future-oriented movements of Class A and Class D.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo what extent did Class B intend to suppress Class C?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTaking a composite view of all those factors, I first considered how my own class should move.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd then there was one other lingering concern: the likely route of Koenji, who moved freely and capriciously on his own. He was a presence that had surely been plaguing Horikita\u0026apos;s mind from the start.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThinking of it as a chance to provoke him and observe his movements, perhaps she would try to control him a little, even if it was a long shot.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile weaving together the event area displayed on the analyst\u0026apos;s tablet and the reports from the commander, I raised my head to look at my classmates.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We\u0026apos;re leaving now. We\u0026apos;re going to secure the supplies and food at G11.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if we ran, a fight would occur eventually. It was a decision to strike rather than wait.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHearing that, my classmates looked at each other, their expressions showing a hint of confusion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s tough that no supplies spawned in an area we can safely secure, but going for G11 means we\u0026apos;ll run into Ryuuen\u0026apos;s class, right? Besides, they\u0026apos;re a little closer.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMatoba said he didn\u0026apos;t like a gamble where, even if they headed out immediately, there was a chance the supplies could be collected first.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe continued, saying they should consider waiting and seeing for this event, but I strongly rejected that and reiterated that we would be going on the offensive.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Enough idle talk. It\u0026apos;s precisely because the enemy is closer that we must get there first.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen\u0026apos;s group would probably take ten to fifteen minutes, while it would take us fifteen to twenty.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSwift action was essential to close that five-minute gap.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ayanokouji\u0026apos;s the leader. We trust him and follow his orders, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Well... I guess so. All right.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven with Hashimoto\u0026apos;s words, Matoba couldn\u0026apos;t seem to shake his anxiety, but that feeling itself wasn\u0026apos;t wrong. After all, jumping into a place where the enemy was lying in wait was akin to a suicide mission.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t address their unease and we began to move. At the GPS update five minutes later, all of us moved into area G12.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Class B\u0026apos;s GPS shows they\u0026apos;re currently split into three groups. One group of ten is heading toward area E9. Another ten are in G8. And the rest are all gathered over by G11.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I took the radio report, information regarding the other classes\u0026apos; situations was also relayed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So the real fight is finally starting, huh... Even though they\u0026apos;re missing twenty-something people, that just barely makes us even. No, maybe I should just be grateful we can fight on even terms...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s not necessarily true. They\u0026apos;ve realized we\u0026apos;re heading for G11 at this point, so they might just turn back and launch an all-out attack... What\u0026apos;ll we do if we see signs of that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s unlikely to happen. Even if it looks like we\u0026apos;re targeting G11, they can\u0026apos;t gauge how serious we are. If they were to call back the group they sent to retrieve supplies, we would naturally retreat. They know that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eClass B, who could reach the target area first, gained an advantage at that point.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBeing in a position to intercept us created a significant advantage. It wasn\u0026apos;t too late for them to fight for real after they probed just how serious we were about capturing the supplies.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe rearranged our formation, solidifying the front to middle ranks with boys as guards. The two VIPs were placed in the back, I stood in front of them and Hashimoto took up the rear, as if to protect the VIPs\u0026apos; backs.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Gotta admit, even I\u0026apos;m getting a little tense here.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps his weapon-holding hand was sweating, as Hashimoto supported his weapon with his left hand and lightly wiped his right on his jersey. Once he finished, he did the same with the other hand. The time was 11:15 a.m. I received the latest information and learned that the GPS signals of Ryuuen\u0026apos;s group, lying in wait, were packed together just ahead. After that, I also received the routine report on the locations of the other GPS signals.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;They\u0026apos;re just ahead... maybe two or three minutes... if we walk that far...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI gave a hand signal, instructing everyone to stop.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We\u0026apos;ll wait here for five minutes.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Five minutes? Is that okay? Won\u0026apos;t they take the supplies during that time if we\u0026apos;re not careful?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;They don\u0026apos;t have that luxury.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey were likely planning to lie in wait and intercept us with a flawless formation. If they carelessly focused on the supplies, their initial reaction to our attack would be delayed. Before long, our surroundings fell silent.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA silence to ensure we wouldn\u0026apos;t miss the sound if, by some chance, they attacked first.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA time when only the tense breathing of my classmates echoed through the forest.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs time ticked by, feeling more like an hour than just five minutes, Shiraishi spoke in a low voice.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There seems to be almost no movement. They\u0026apos;re completely wary of us and have stopped. Shimazaki-kun says to let him know whenever you want to use a tactic.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We\u0026apos;re not using any tactics. If we save them, the enemy will have to remain constantly on guard. More importantly, tell me the GPS locations and details for the other classes.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI got looks from several people, as if asking why I needed information on other classes in that situation, but I got the details from the commander and had Shiraishi relay them to me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We\u0026apos;ll wait another five minutes.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Seriously? Well... Roger.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHow we would fight after that was already decided.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe could\u0026apos;ve attacked then and we could\u0026apos;ve attacked five minutes ago.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd\u0026#x2014;I already knew the result.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut, if we were going to attack anyway, it was better to do it at the ideal time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe spent another five minutes in silence and the time passed 11:25 a.m. Immediately after confirming through Shiraishi that the targets ahead had barely moved and after receiving the status report on the other classes, I raised my arm.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Let\u0026apos;s advance. Once you find the enemy, you have my permission to attack without hesitation. Also, Matoba, you\u0026apos;ll take command during the battle.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What? Aren\u0026apos;t you going to take command, Ayanokouji?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I thought it best to leave it to you in the front lines, for the sake of class coordination.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...I see... In that case, I accept. Let\u0026apos;s go...!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt probably wasn\u0026apos;t an appointment he was happy about, but Matoba accepted readily without arguing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ayanokouji, you just stay back here and protect the VIPs, okay? As long as they\u0026apos;re safe, I still think we can win this,\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto said in a small voice, considering the possibility that Matoba might fail.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Understood.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMatoba ran to the front, let out a word to fire everyone up and moved forward.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eImmediately after, there was a loud cracking sound of a branch breaking in the woods ahead\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRight after, a series of gunshots that seemed to rip through the forest air flew at us.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe bullets tore through the air and leaves scattered, leaving behind the specks of paintballs.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSeveral people in the front line flinched, their shoulders trembling.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe enemy\u0026apos;s first strike. Class B spotted us first and made their move.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;They\u0026apos;re firing! Fire! Light \u0026apos;em up!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt didn\u0026apos;t go like it did in practice; the students kept their fingers on the triggers and fired on full auto.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe return fire split thin branches diagonally, leaving marks like blood splatters with every impact.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut hitting them wasn\u0026apos;t easy. The distance was still fifteen to twenty meters or more.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe enemy had taken up positions between the trees and rocks and only small parts of their faces and bodies were visible.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust when they were spotted, they immediately pulled back and returned fire when they saw an opening.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Three to the front right! I\u0026apos;ve confirmed one more in the back!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hold them down! Concentrate fire on the base of that tree!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt Matoba\u0026apos;s command, the front line fired all at once.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePaintballs flew in succession, chipping away at the tree\u0026apos;s bark.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever\u0026#x2014;the alarm that was supposed to sound from a wristwatch upon a successful hit never went off.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOn the contrary, a counterattack came back immediately.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAn enemy\u0026apos;s shot flew in as if sliding from a low angle, striking one of the Class C vanguards squarely in the chest. Bright red paint spread as an electronic sound rang out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;One person\u0026apos;s out! Fall back a bit!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Shit, where the hell are they shooting from!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePanic spread in an instant. Not missing this opportunity, Class B laid down a barrage from the cover of the woods on both sides.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA dozen or so dry popping sounds rang out in succession. The formation fell into disarray and the situation was disastrous.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ugh\u0026#x2014;!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA second and then a third, were hit in quick succession.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUnable to expose their bodies to defend themselves, they were taken out one after another, starting with those with the largest exposed areas.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto immediately shouted, the smile completely gone from his face.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Front line, fall back to the trees and use the cover better! Mid-rank, provide covering fire!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe students moved according to the orders, but the trees were close together and visibility was poor.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eClass B\u0026apos;s shots were clearly more accurate than ours; they read our positions and adjusted their angles of attack.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven so, one of the shots they returned miraculously hit its mark.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA faint electronic sound rang out from deep within the forest and one of the opponents stood up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn that moment, the atmosphere on our side shifted slightly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;A hit! We took one down!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Nice, keep \u0026apos;em pinned down!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe rhythm of their firing returned for just a moment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut the enemy also regrouped immediately.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMatching our gunfire, they fired back with precision, as if pinpointing our locations by sound.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA paintball grazed past someone\u0026apos;s head and spectacularly splattered a tree behind them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Three to the front left! There\u0026apos;s another guy aiming from deep in the woods!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s too dangerous to circle around, keep your distance!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAn order was given, but a student on the right couldn\u0026apos;t react in time and was shot in the shoulder, triggering the fourth electronic sound.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen another, someone who had been behind a tree, was shot in the leg and the \u0026apos;out\u0026apos; signal rang.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA fifth person. Deeply colored paint dripped onto the ground.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe firefight lasted only a few minutes, but it was so intense it left them breathless.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m hit! I can\u0026apos;t even tell if we\u0026apos;re hitting them at all!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA student, crouching to stay out of the way, punched the ground in frustration.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, we hit \u0026apos;em! My shot hit just now!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;On the right side, there\u0026apos;s five of them!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI took a moment to compose my breathing and surveyed the scene before me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eClass B remained hidden in the shade of the trees. The tempo of their shooting didn\u0026apos;t falter.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey probably had the advantage of having secured more paintballs than Class C with their provisions, but the difference in quality was clear.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if the numbers were equal, Class B was overwhelmingly superior in terms of supplies, momentum and composure. That much was clear even just watching from a short distance away.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eCompared to our casualties, the enemy had at most one or two.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf it continued, our losses would only grow.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was safe to conclude that the outcome of the battle had been decided in an instant.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eCalmly and briefly, I gave the order.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Continuing any further will only worsen our losses. We\u0026apos;re retreating.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;R-Retreat? We\u0026apos;re retreating, right!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI announced the retreat to all the remaining classmates and had the front line fall back by walking backward so they would not be pursued. It was then that Morishita also hurried from the middle line to the rear.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA Class B student closed in, their gun\u0026apos;s muzzle taking aim at Morishita.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Watch out, Yamamura Miki\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMorishita shouted and just as she grabbed both of Yamamura\u0026apos;s shoulders, a single paintball hit her in the back.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Kgh...!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAn expression of anguish. Immediately after, a second and then a third shot landed on her back.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto hurriedly fired back but missed and the Class B student retreated as if to flee.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ugh...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA groan. Morishita was done for now, the alarm on her wrist blaring mercilessly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;M-Morishita-san!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It would appear... this is the end for me. At the very least, you must escape...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No... Why would you protect someone like me...!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo, had Morishita really protected Yamamura? It looked to me like the gun had been aimed at Morishita and realizing she was the target, she had tried to use the nearby Yamamura as a shield to save herself, but failed... No, surely even Morishita wouldn\u0026apos;t do something like that\u0026#x2014; Actually, she just might.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I, too, had some goodness left in my heart. That is all there is to it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhichever her true intentions were, there was no time to find out now.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You must live, Yamamura Miki. And, in my stead, as an Amazoness... Ghk.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Morishita-san...Morishita-san...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMorishita had closed her eyes and leaned limply, but then she suddenly snapped them wide open.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I believe it would be best for you to flee quickly. Pursuers may be on their way.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Eh, ah... Um, that is, yes...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ayanokouji Kiyotaka. I leave the rest to you. I shall be taking it easy on the ship.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor someone who\u0026apos;d just been eliminated, she didn\u0026apos;t seem to mind at all. In fact, she even seemed happy that things had wrapped up so quickly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd so, the \u0026apos;Amazoness of the Dense Forest\u0026apos; who even volunteered to be a guard was out, disappearing from the class without making any major contribution.\u003c/p\u003e\u003cimg src=\"/hola-lector-agua/images/books/y3v3/OEBPS/QesvFskvNKoXxOxVErUol.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt the very end, a strange, relaxed atmosphere hung in the air for a moment, but we hurried to continue our retreat regardless.\u003c/p\u003e"])</script><script>self.__next_f.push([1
