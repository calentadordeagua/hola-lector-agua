003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cstrong\u003e\u003cem\u003eClass C\u003c/em\u003e\u003c/strong\u003e\u003cem\u003e: 2 VIPs surviving + 12 remaining students in total\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cstrong\u003e\u003cem\u003eClass D\u003c/em\u003e\u003c/strong\u003e\u003cem\u003e: 3 VIPs surviving + 35 remaining students in total\u003c/em\u003e\u003c/p\u003e\u003c/div\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps because Class A, which secured supplies over a wide area in the north and Class B, where food appeared steadily in the west, were able to maintain the health of all their students at a minimum standard. Both classes had only one student retire each. On the other hand, Class C, which was suppressed by Class B right at the start, was half-decimated and had few students left. The supplies they obtained were also very scarce and their alliance with Class D forced an even more severe food problem upon them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe time was now just past 8:40 in the morning.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHorikita completed taking down the tents and other things early on, prepared to move at a moment\u0026apos;s notice.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was an unusually tense atmosphere, different from the past three days. More than half of the area was already unusable and the four classes were just a stone\u0026apos;s throw away from each other.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eClass A\u0026apos;s final location yesterday was G8, Class B\u0026apos;s was E12 and the Class C-D alliance\u0026apos;s was H10.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe final mind games would begin at the approaching hour of 9:00 a.m.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWould they go on the attack, or prioritize defense until the very last minute?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHorikita looked around once, checking on the state of her classmates.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSome were restless and fidgety, others more irritable than usual, but these were still the least of her worries.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe number of students weakened by their loss of stamina from four days of survival was also beginning to increase.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The immediate problem is\u0026#x2014;something else, though...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What are we gonna do, Suzune? About him.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSudou quietly approached the pensive Horikita and spoke.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHorikita quietly followed Sudou\u0026apos;s gaze.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eGiving no impression at all of being in enemy territory, his figure, calmly packing up a one-person tent, looked exceedingly composed from any angle.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAyanokouji Kiyotaka. For Horikita, he was once the person she trusted the most, relied on the most and most\u0026#x2014;such a person.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMost of those around him were glaring at Ayanokouji with undisguised gazes of aversion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe solo attack on Class A before 6 PM yesterday was completely and utterly unexpected.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe pretended to return to his main group, then used his superior physical abilities to close a distance a normal student couldn\u0026apos;t have. He not only took out several classmates with his paintball gun, but also pulled off the incredible feat of getting them disqualified for a rule violation by using the exam\u0026apos;s end time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yesterday seriously had me in a cold sweat. I only couldn\u0026apos;t shoot because Ayanokouji just happened to get behind a tree in my line of fire, but if he hadn\u0026apos;t, I might\u0026apos;ve been out just like Ike and the others...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSudou, recalling the same scene, said quietly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It was understandable. A surprise attack by a single person and a talented former classmate at that. For those few minutes, everyone in the class lost their composure. He initiated the battle with exquisite timing.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe two of them looked toward Ayanokouji and briefly recalled what happened yesterday.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Everyone seems quite bloodthirsty, don\u0026apos;t they?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHirata approached Horikita and Sudou.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No kidding. Charging in alone like that and getting the better of us...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Especially since the opponent was a former classmate.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you alright?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...I\u0026apos;m alright, I think.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAyanokouji\u0026apos;s appearance greatly unsettled and influenced Horikita\u0026apos;s inner thoughts and mental state.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Let\u0026apos;s try to look on the bright side. Fortunately, it was only the guards who were taken out.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHirata said, having the VIP defeated would\u0026apos;ve been the worst possible outcome. It was a good thing they\u0026apos;d at least avoided that, especially since everyone had been defenseless.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s true... He personally took out three people. It wouldn\u0026apos;t have been surprising if a VIP had been among them.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince she\u0026apos;d been a short distance from the campsite, Horikita didn\u0026apos;t know the details of the raid.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It seems several people managed to coordinate on the spot and form a defense to protect the three VIPs. Looks like our practice paid off, doesn\u0026apos;t it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSudou nodded and Horikita also gave a nod in response to the positive news.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;d like to do one last check before 9 o\u0026apos;clock. Do you have a moment?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOn the map Hirata spread out, all the areas that were prohibited were marked with an X.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;As I believe I mentioned yesterday, this is developing into a rather unfavorable situation for us.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eClass A was based in G8.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUntil yesterday, they\u0026apos;d safely completed events in the area to the north, but now the entire northern area was restricted.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I wouldn\u0026apos;t be surprised if the results of the eleven o\u0026apos;clock event push us even further toward the center.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe expansion of the restricted area and the prediction of where supplies would appear.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOnce again, ahead of the battle that was likely to happen today, Horikita pressed her lips together firmly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Supplies are little more than a bonus at this point. We\u0026apos;ve gathered a decent amount of important ammunition, so I believe we don\u0026apos;t need to push ourselves to get more from here on out.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah, I think that\u0026apos;s fine. If a fight breaks out, some students will likely be eliminated, so the food supply should balance out. Worst-case scenario... we\u0026apos;ll just have them hold on until evening without a meal. And about the timing for our remaining tactic, am I right to assume you don\u0026apos;t intend to change it from what you\u0026apos;ve already told us?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes, that hasn\u0026apos;t changed. More importantly, what\u0026apos;s crucial now is the position we take up.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eConsidering Class C and D was in H10 and Class B was in E12, they had to maneuver themselves to be ready for any expansion of the next restricted area.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If we lean too far west, we\u0026apos;ve got Class B and if we lean too far east, it\u0026apos;s the Class C and D alliance, huh. This is a damn hassle.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That said, I can\u0026apos;t exactly be happy about a scenario where the southern area shrinks, either. While it would save us from having to move, we\u0026apos;d also risk losing our escape route... Depending on the situation, we could even face the worst-case scenario of a pincer attack.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;For my part, I think we should bite the bullet and move from G8 to E9. What do you think?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s not a bad idea... In fact, that\u0026apos;s probably the correct answer. I was thinking the same thing.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf they had to choose an opponent, barring a pincer attack, it was none other than Class B. Their VIPs were unscathed and their number of guards was nearly identical. It was precisely because they were competing for the same rank.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMoreover, Class B already used its total GPS shutdown tactic, giving Class A a slight advantage on that front.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So it means we might finally be going up against that bastard Ryuuen, huh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If they were to clash with us, it would be a huge gamble for them, win or lose. They wouldn\u0026apos;t have enough stamina left to defeat the allied classes. So I\u0026apos;d like to think they won\u0026apos;t be too eager, but...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA four-way standoff would have made a stalemate easy, but now it was a three-way affair.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith the sudden formation of a large alliance, Horikita was left with no choice but to make a bitter decision.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter they finished discussing their general plan once more, they took a short breather, but the conversation didn\u0026apos;t end.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Up until now, everything has gone more or less as expected, with the exception of the matter concerning Ayanokouji-kun. The decisive moment of this special exam is right now, today, on this final day. The restricted areas closing in on the center to an extreme degree is also something I\u0026apos;d envisioned. The fact that we\u0026apos;ve saved our GPS shutdown tactic should definitely prove useful to us.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe key to the special exam wasn\u0026apos;t to outwit and defeat opponents like Ryuuen, but to keep as many VIPs and guards in the game as possible until the very end.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey\u0026apos;d use the GPS shutdown tactic entirely for defense, not for offense.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was the crucial decision Horikita made at the very beginning, a strategy she shared with the entire class. As for identifying individuals, they hadn\u0026apos;t used it on anyone besides Morofuji and she thought it might not be needed again. Naturally, she had Matsushita lock on to Ayanokouji\u0026apos;s GPS using his tag.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You think you can get away from here, Ayanokouji?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps unable to bear just watching any longer, Hondou approached Ayanokouji with an assault rifle in hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hey, Hondou!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSudou shouted at the sight, but as if they\u0026apos;d been waiting for one person to make a move, several boys and girls surrounded Ayanokouji with weapons in hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We gotta punish the class traitor. I\u0026apos;m not about to let him do as he pleases any longer. I\u0026apos;m definitely taking Ayanokouji out right here.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Stop that, Hondou-kun. Forcibly surrounding him here won\u0026apos;t solve anything. The act of completely sealing off an opponent\u0026apos;s path, even indirectly, is considered restraint. It most certainly won\u0026apos;t be permitted.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;B-but! Are you just gonna let him do what he wants, then!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEveryone with a weapon directed their frustration toward Horikita.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...I\u0026apos;m not saying that. Letting him escape is a threat to us. So it\u0026apos;s self-evident that we must defeat him here. But we mustn\u0026apos;t do it the wrong way. We are to maintain a suitable distance and wait for 9:00 a.m.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA path about a meter wide would suffice. Horikita figured that as long as they maintained enough space for Ayanokouji to walk freely, no problems would arise according to the rules. In response, the classmates glanced at one another, then moved to either side to create a path.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter looking at the narrow path, Ayanokouji looked toward Horikita and the others.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The right call. Headquarters is undoubtedly tracking every student\u0026apos;s GPS in real-time, 24/7. They know I\u0026apos;m in enemy territory and they know I\u0026apos;m surrounded like this. If my GPS didn\u0026apos;t move and I was eliminated right at 9:00 a.m., the school would investigate the situation. I\u0026apos;d naturally claim I was restrained with my path completely blocked. The probability of you being penalized for a violation would be high.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYesterday, Ayanokouji was eliminated after 6:00 p.m. and was rescued by school staff who rushed to the scene. Although malice wasn\u0026apos;t found on the part of the students who fired outside of exam hours, they all received the penalty of elimination for a rule violation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe couldn\u0026apos;t let them repeat the same mistake.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo matter who Ayanokouji was, if things stayed like that until 9:00 a.m., he would have no chance of escape.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt best, the most he could do was fire his paint gun at the same time and take one person down with him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Aaargh, this is so damn frustrating... The enemy\u0026apos;s right in front of my eyes! Dammit!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eForced to clear a path and wait for 9:00 a.m., bound by the rules, Hondou yelled, frustrated by the dilemma.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If this were a real battlefield, my method of fighting would be completely useless. But this is a special exam. It\u0026apos;s a strategy that\u0026apos;s only possible because I can use the rules and be protected by them. You should try copying it sometime, if you get the chance.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a provocative statement. Perhaps it was meant to bait someone into attacking rashly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust in case, Horikita once more told them to wait until 9:00 to fire.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKaruizawa watched the situation from afar, clenching her hands tightly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd the time passed 8:50.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ten more minutes! We won\u0026apos;t let you escape! Absolutely!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith the exam\u0026apos;s start time drawing near, Ayanokouji quietly took a step forward.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTension ran through the Class A students as they aimed their muzzles, fingers on the triggers.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What are you planning to do, Ayanokouji-kun?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What am I planning? Nothing. If there\u0026apos;s a path, I\u0026apos;ll walk it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAyanokouji started to walk. In response, the Class A students began to walk at the same pace.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey had sixteen guards in total, both boys and girls. Horikita took into consideration her classmates\u0026apos; feelings that they had to defeat Ayanokouji there, but in truth, she didn\u0026apos;t want to send a single one of them\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m goin\u0026apos; too\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHorikita grabbed Sudou by the shoulder, stopping him as he tried to dash off from her side.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t... I\u0026apos;m sure it\u0026apos;s no use.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What\u0026apos;s that supposed to mean, Suzune?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If he had resolved to fight us at nine o\u0026apos;clock sharp, we could defeat him. But I\u0026apos;m sure he won\u0026apos;t fight. He\u0026apos;ll pour every ounce of his being into getting away.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the dense, tree-filled forest, Sudou was probably the only student who could keep up with Ayanokouji\u0026apos;s outstanding physical abilities. In other words, he could easily shake off the sixteen of them in a chase that would only last a few minutes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was because he had that confidence that he could calmly spend the night in a tent next to Class A.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But I\u0026apos;m confident I can keep up with him. He\u0026apos;s got a lot of luggage, too.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...That\u0026apos;s exactly why I can\u0026apos;t let you go.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt 9:00 a.m., in a worst-case scenario, a one-on-one fight between Ayanokouji and Sudou could occur.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf that happened, it was impossible to know who would win.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf by some chance Sudou lost and Ayanokouji escaped, Class A would suffer an even greater blow.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But, hey, doesn\u0026apos;t this mean we\u0026apos;re playin\u0026apos; right into Ayanokouji\u0026apos;s hands from start to finish...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I know. But, just as he said himself, he skillfully used the special exam\u0026apos;s rules this time. This isn\u0026apos;t a situation that can be solved with brute force.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMoreover, the guards who pursued him would also exhaust their stamina.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe reason she didn\u0026apos;t stop them was that she figured she couldn\u0026apos;t.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe depths of the forest\u0026#xa0;grew noisy as nine o\u0026apos;clock arrived.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBefore long, the guards who lost sight of Ayanokouji returned,
