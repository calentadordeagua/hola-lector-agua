03cp class=\"paragraph\" style=\"text-align: right\"\u003e\u003cem\u003e- Colibri\u003c/em\u003e\u003c/p\u003e\u003ch1 class=\"heading_1\"\u003e\u003ca class=\"heading-link\" href=\"/read/y3v3/2\"\u003eLegacyEMTLs Credits\u003c/a\u003e\u003c/h1\u003e\u003chr/\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003eColibri - Lead / Dev\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\"\u003esomehow still alive\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003eFS7 - JE Checker\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\"\u003eI like taking credit for things I didn\u0026apos;t do again\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003eStella - JE Checker\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\"\u003eIt was really nice to see some action after several volumes without it. Looking forward to the next one! Even with the high chances of expulsion, I hope Hiyori will shine in some way and leave a mark on Kiyotaka.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003eTakuya Yagami - JE Checker\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\"\u003eRead Swan Song on Royal Road, peak story\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003eWriter - English Editor\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\"\u003eJeno is hot\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\"\u003e\u003cstrong\u003e3F - Illustrator\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\"\u003eA whole lotta nothing; #TeamHiyori\u003c/p\u003e\u003c/div\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Author's Afterword\",\"volumeId\":\"y3v3\",
