e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T14c1,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 3\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAT 11:00 A.M., as supplies appeared, the restricted area simultaneously expanded and an announcement was made that in one hour, the available area would become an 81-square, nine-by-nine grid from D4 to L12.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe supplies were located in a total of eleven spots: D4, D8, D10, E6, F6, G7, H10, I12, J5, K10 and L10. It seemed some were in places that were extremely difficult to retrieve, or just barely reachable and the more difficult the supply crate, the higher the proportion of them contained food.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;They\u0026apos;re really testing us... but J5 and K10? That\u0026apos;s just asking too much.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto let out a wry smile and waved his hands back and forth as if to say it was impossible.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom our current position, it seemed best to focus solely on moving toward the center during the 11:00 a.m. event.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s a shame we can\u0026apos;t retrieve the food, but it can\u0026apos;t be helped.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBefore I could say anything, Kanzaki said as much, having apparently reached the same conclusion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s right. I want to avoid the risk of pushing ourselves unnecessarily, losing stamina, or getting injured. The greatest strength of the allied classes is our numbers. To avoid pointlessly whittling them down, ignoring the treacherous routes is the correct choice.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe were short on many things, but it was time for patience.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;However, I want to send a few people ahead to secure the food at H10.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was highly likely they wouldn\u0026apos;t make it by walking, but if they maintained a light jog, they could just barely get there.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs if he\u0026apos;d already mentally prepared himself, Hashimoto gave a stretch.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well then, guess I\u0026apos;ll step up. I\u0026apos;ll make a run for it and see if I can secure them. Takemoto should be ready to go, too.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;To prevent them from narrowing down our VIP, we\u0026apos;ll assign several mobile guards from our class. Besides, there\u0026apos;s no guarantee that Class B won\u0026apos;t try to come at us with tactics to stop individuals.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith that, Kanzaki called over several male students and told them about the plan.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe classmates watched the backs of the group that departed immediately.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Let\u0026apos;s follow after them at a reasonable pace.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo prepare for when and how the restricted area might expand next, both classes first began to advance toward the area from H10 to H12.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor a while after that, a period of time began where, just as we had for the past two days, we exchanged messages with the VIP every five minutes and kept a constant watch on the movements of the other classes. The possibility that Class B might aim for H12 wasn\u0026apos;t zero, but perhaps judging it too difficult due to the distance, it seemed they decided to focus on gathering supplies in the western area, where they could be secured reliably.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Just as you predicted, it doesn\u0026apos;t seem like Ryuuen is making a move to attack either side yet.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah. But going on the offensive isn\u0026apos;t necessarily a bad move.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh, is that so?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s simply a matter of the priority of fighting changing depending on what you prioritize. If closing the gap with those above is the most important thing, then the best move is to attack Class A right now and defeat their three VIPs. Alternatively, quickly securing G8 and forcing Class A to take a detour, like over the mountain, could also be interesting.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, as long as they beat Horikita\u0026apos;s group, losing to us once isn\u0026apos;t a big deal for them, huh.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe reason Ryuuen wasn\u0026apos;t moving was either because he prioritized beating the allied classes over victory against Class A, or because he determined that was the choice that would lead to his own victory.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps it was a strong indication of his will to avoid the risk of engagement to the utmost limit and conserve his stamina.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd before long, a report came in from the commander to our VIP that the supplies had been secured.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 3\",\"volumeId\":\"y3v3\",\"chapterIndex\":42,\"prevChapter\":{\"volumeId\":\"y3v3\",\"chapter\":41,\"title\":\"Part 2\"},\"nextChapter\":{\"volumeId\":\"y3v3\",\"chapter\":43,\"title\":\"Part 4\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 3\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":11},{\"label\":\"Prologue: Shiina Hiyori's Monologue\",\
