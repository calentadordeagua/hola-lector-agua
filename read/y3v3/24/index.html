e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T332b,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 2\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHORIKITA PEERED INTO the tablet of Shinohara, who\u0026apos;d become the analyst and confirmed the event area.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen, she immediately contacted Matsushita, the commander and received the latest GPS information.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I think we should head north without hesitation. If we carelessly get involved in the central area of H9, we might have to fight Class B... or even Class C.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe couldn\u0026apos;t afford to be blinded by supplies whose quantity and other details were unknown, only to lose her precious classmates in the process.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHirata proposed fighting defensively without hesitation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I agree. In this special exam, losing classmates early on limits our strategic options and it\u0026apos;s clear we\u0026apos;ll just be worn down. We can\u0026apos;t take a big risk for the first supply drop when we don\u0026apos;t even know how much we\u0026apos;ll get.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAbove all, to avoid engagement, they\u0026apos;d chosen to start from G12 when they won the right to choose in the lottery. Simply to break through to the northern area via the straightest, shortest route.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if an event happened to appear nearby, they shouldn\u0026apos;t carelessly get involved unless it was extremely safe.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMaintaining a situation where not a single person was missing for as long as possible was the simplest and most reliable way to aim for the top ranks in the special exam.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey stopped to assess the situation, but Horikita soon began to move toward G7 with Hirata by her side.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Man, serves Ayanokouji right. Got his ass kicked by Ryuuen and ran back to the starting point. And one of their VIPs got taken out, right? Even if they run around, if the exam ends like this, they\u0026apos;re guaranteed last place.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom behind her, she could hear Ike and the others laughing as they talked about it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSudou, who\u0026apos;d been listening nearby, crossed his arms, nodded deeply and walked over to Horikita.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Suzune. About that fight between Class B and Class C just now. Honestly, I was surprised.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Me too. To use a tactic for an all-out attack right at the start... even if you thought of it, it would take considerable courage to execute. To be so bold when they\u0026apos;ve barely gotten the hang of using the guns... But, it might have been one of the optimal choices, timing-wise. Right after the start, we also had moments where we were defenseless and stopped to focus on strategy. The thought that we might be surprise-attacked with a tactic... we weren\u0026apos;t on guard for that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe confessed that she\u0026apos;d been concentrating solely on reaching the northern area.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah. But still, for Ayanokouji to get taken down so easily...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...I suppose so.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt\u0026apos;d been obvious that fighting Ayanokouji would make victory extremely difficult.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt the stage where everyone started on equal footing, the class she wanted to fight the least was Class C.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was because she\u0026apos;d thought that if she attacked them carelessly, they would surely be countered.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What do you think about him losing, Horikita-san?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHirata, walking beside her, turned his gaze to Horikita and asked.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;My honest impression is, \u0026apos;Really? Is it possible?\u0026apos;\u0026#xa0;I was certainly surprised by the boldness of using a trump card at the very beginning, but I never imagined they would take such a major blow.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I feel the same way.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ayanokouji-kun is\u0026#x2014;how should I put it... He\u0026apos;s not the type of person to be careless in this kind of fight.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was precisely why, like Sudou, her surprise was the only thing that preceded all else.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe preconceived notion that he wouldn\u0026apos;t be defeated without a reason made it difficult for Horikita to judge the situation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a dangerous way of thinking, close to faith or worship, that Ayanokouji had no weaknesses.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But if he anticipated the preemptive strike, he shouldn\u0026apos;t have let his class get half-wiped out. He could\u0026apos;ve escaped quickly, or even met the attack head-on and had an even fight, don\u0026apos;t you think?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe actual result was a crushing defeat and a rout.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe number of Class C students who vanished from the GPS told the story, allowing no room for concealment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was a slight opening that Ayanokouji had shown, a clear and undeniable fact.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is there absolutely no way it\u0026apos;s part of Ayanokouji\u0026apos;s strategy? Like, to reduce the hassle of gathering food.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s true that with fewer people, food problems are lessened. But you could just have people retire later if you run into trouble and it would be the same thing. There\u0026apos;s no merit in reducing your numbers from the start. What\u0026apos;s more, even their VIP was taken out, so their efficiency at gathering supplies will also drop.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHirata\u0026apos;s words were correct. And yet, while they were correct, she just couldn\u0026apos;t bring herself to be convinced.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo, the feeling that she didn\u0026apos;t \u003cem\u003ewant\u003c/em\u003e\u0026#xa0;to be convinced was growing stronger.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I probably... just don\u0026apos;t want to frankly acknowledge it. Acknowledge Ryuuen-kun, who managed to get the better of him.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe focused on creating distance, turning her back on a powerful enemy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven though she knew it was a choice made to win, there was a somewhat servile emotion to it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s all right, Hirata-kun. I won\u0026apos;t laugh at his defeat, nor will I let my guard down. If we, or Class D, had been in Class C\u0026apos;s position, it\u0026apos;s highly likely we would have ended up with the same result.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eLooking at the GPS signals moving away, Horikita murmured that a feeling of relief had undoubtedly come first.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But let\u0026apos;s gratefully accept the result. The situation is now slightly in our favor.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And with their numbers down, a point gap\u0026apos;s opened up, too.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eClass C, having taken heavy damage, became last place and Class B, who attacked them, also lost four guards. With that, the scores of Class A and Class B became even, so if they could make it to the end without fighting, a sudden death match would be held to decide second place. The addition of that condition wasn\u0026apos;t bad news.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But we should probably estimate our score as one point lower. That guy Koenji could retire at any moment. It\u0026apos;d be nice if he at least used the ammo he took to take out one person... but that\u0026apos;s probably not gonna happen.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSudou snorted in a way that could be taken as either irritation or exasperation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShortly after the exam began, Koenji ignored Horikita\u0026apos;s instructions and turned his back on them, saying he would enjoy himself by getting some exercise on the deserted island. He didn\u0026apos;t see it as a special exam, but rather as a simple vacation. It could be easily inferred from his actions two years ago that he would return to the ship as soon as he got bored.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;As long as he doesn\u0026apos;t get in our way, I suppose it\u0026apos;s fine. Unfortunately, I\u0026apos;m in no position to expect more from him at the moment.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHorikita managed to save up Private Points in her daily life, but she made a large expenditure to secure Koenji\u0026apos;s cooperation in the last special exam. If she were to try and secure his cooperation for a long-term special exam like this one, he likely wouldn\u0026apos;t agree for merely two or three times the amount of Private Points he had previously.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even without Koenji-kun, our situation isn\u0026apos;t bad.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Our top priority should be to quickly head north. That will allow us to safely maintain our advantage. Let\u0026apos;s hope that Class B and Class C continue to fight amongst themselves.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Still, I wonder why I can\u0026apos;t feel relieved in the slightest, even though Class C is in a jam.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s true... We should be one step ahead and yet it\u0026apos;s still frightening.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHorikita\u0026apos;s expression tightened.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s because Ayanokouji\u0026apos;s still in\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHorikita affirmed with a slight nod.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs long as Ayanokouji wasn\u0026apos;t out, they absolutely couldn\u0026apos;t afford to underestimate him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf anything, he was sure to come up with some clever trick to cancel out their mistake and make a comeback.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was precisely why they were moving to the northern area, to gain enough distance so they couldn\u0026apos;t be taken by a surprise attack, no matter what tactics he used.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even though their numbers have been halved, I still can\u0026apos;t help but feel this invisible pressure.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlthough it was clear that there were no enemies nearby at the moment, Horikita couldn\u0026apos;t shake a lingering anxiety that they might still get attacked.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I feel the same way. In fact, precisely because they lost half their people, I\u0026apos;m thinking they\u0026apos;re gonna stage a comeback with some outrageous move.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ryuuen-kun probably feels the same. That\u0026apos;s why he didn\u0026apos;t give chase; he couldn\u0026apos;t.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter a brief moment of hesitation, Sudou shyly placed a hand on Horikita\u0026apos;s shoulder.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, let\u0026apos;s just focus on what we can do. If it comes to a straight-up fight, we\u0026apos;ll crush \u0026apos;em, whether it\u0026apos;s Class B, Class D... or even Ayanokouji. Right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt least Sudou was more confident in his physical stamina than anyone else.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe would fight with all his might to protect the class, no matter how much effort it took.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe was prepared for that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Let\u0026apos;s move. First, we\u0026apos;ll head north and secure as many event locations as possible. We need to gather supplies to avoid needless conflict.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSeeing Horikita stride forward purposefully, Sudou gave a short reply and the class proceeded north.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 2\",\"volumeId\":\"y3v3\",\"chapterIndex\":24,\"prevChapter\":{\"volumeId\":\"y3v3\",\"chapter\":23,\"title\":\"Part 1\"},\"nextChapter\":{\"volumeId\":\"y3v3\",\"chapter\":25,\"title\":\"Part 3\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 3\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":11},{\"label\":\"Prologue: Shiina Hiyori's Monologue\",\"href\":\"prologue.xhtml\",\"index\":12},{\"label\":\"Chapter 1: Opening. Survival Game Special Exam.\",\"href\":\"c1.xhtml\",\"index\":13},{\"label\":\"Part 1\",\"href\":\"c1p1.xhtml\",\"index\":14},{\"label\":\"Part 2\",\"href\":\"c1p2.xhtml\",\"index\":15},{\"label\":\"Part 3\",\"href\":\"c1p3.xhtml\",\"index\":16},{\"label\":\"Chapter 2: A Surprise Attack\",\"href\":\"c2.xhtml\",\"index\":17},{\"label\":\"Part 1\",\"href\":\"c2p1.xhtml\",\"index\":18},{\"label\":\"Part 2\",\"href\":\"c2p2.xhtml\",\"index\":19},{\"label\":\"Part 3\",\"href\":\"c2p3.xhtml\",\"index\":20},{\"label\":\"Part 4\",\"href\":\"c2p4.xhtml\",\"index\":21},{\"label\":\"Chapter 3: The Unseen Pre
