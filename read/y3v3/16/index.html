g those crucial positions, it would undoubtedly affect our chances of winning.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo give an extremely easy-to-understand example, just giving the role of commander to students like Ike or Hondou from Horikita\u0026apos;s class, or Ishizaki or Kondou from Ryuuen\u0026apos;s class, would significantly lower that class\u0026apos;s probability of winning. On the other hand, since Ishizaki had relatively high physical ability and stamina, he could be a valuable asset as a guard.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBefore I could speak, Morishita quietly stepped forward.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The commander is an extremely important position. They must survey the entire battlefield, anticipate other classes\u0026apos; movements and above all, determine the timing for using tactics. If so, we should determine it first while we\u0026#x2019;re free to choose from all thirty-seven students in our class.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;She sure says the obvious with a self-important attitude, that girl.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile Hashimoto muttered just loud enough for me to hear, Tamiya also raised her voice in agreement.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I agree with Morishita-san too, I guess. It will likely be a tough fight without the commander\u0026apos;s instructions. Wouldn\u0026apos;t Ayanokouji-kun be the natural choice? He is the leader, after all.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, wait a minute. It\u0026apos;s definitely true that if Ayanokouji becomes commander, he\u0026apos;ll surely produce results. But I\u0026apos;m strongly against it; it\u0026apos;s better to have him take command on the ground. Guard is his best role.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Guard? Never mind other roles, but why a guard of all things?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Isn\u0026apos;t the reason obvious? It\u0026apos;s because I view Ayanokouji as a special combat asset. Putting it bluntly, guards are pawns, but they\u0026#x2019;re the only ones given a means of attack. Aside from me and Kitou, we don\u0026apos;t have many students skilled in this kind of combat. That\u0026apos;s why it\u0026apos;s absolutely better to have Ayanokouji fight on the front lines. Besides, just because he can\u0026apos;t directly communicate with the commander doesn\u0026apos;t mean he can\u0026apos;t organize the class, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe class was somewhat surprised by Hashimoto\u0026apos;s passionate appeal.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe VIP was crucial for determining victory or defeat, but the core mission was simply not getting eliminated. There was nothing wrong with Hashimoto\u0026apos;s plan to allocate power to the guards in order to avoid being defeated.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd even without direct communication with the commander, contact was still possible via the VIP, albeit requiring double the effort. One could even have the commander activate tactics. For those reasons, even before the discussion, I\u0026#x2019;d immediately ruled out the possibility of taking on the roles of VIP, analyst, or scout for myself. However, there was room for consideration regarding whether to be commander or a guard.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe fact that only one person in the class could track every student\u0026apos;s GPS location made the commander position extremely attractive, as it directly influenced the chance of winning.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had no way of knowing which students from other classes were moving where, how or what they were targeting on this vast uninhabited island. I had no choice but to leave myself to the flow of events as they unfolded. That was precisely why that position couldn\u0026apos;t be taken lightly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, it wasn\u0026#x2019;t as if victory or defeat could be controlled entirely solely by the commander\u0026apos;s ability.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Besides, even Ayanokouji wouldn\u0026apos;t want to entrust his fate to others, would he?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI thought the role of giving instructions via tablet and radio wasn\u0026apos;t a bad thing, but it was an unshakable fact that in this special exam, every student capable of utilizing their physical abilities should become a VIP or guard.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re already thinking about what to do with the positions, aren\u0026apos;t you? Let\u0026#x2019;s hear what you\u0026apos;ve come up with.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFive types of positions. Where I ended up would be a choice with no room for error.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe commander position in particular, stationed at headquarters, was undeniably critical. They could check the current locations of all students via GPS and use authority and tactics that could overturn the situation. Being the only position allowed to view the battle situation from a bird\u0026apos;s-eye view, it couldn\u0026apos;t be entrusted to an unskilled student.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf so, taking that position was certainly worth considering.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, even as a compliment, Class C didn\u0026apos;t have an abundance of physically gifted students; while students who could move like Kitou and Hashimoto existed. Other than them, the percentage of students who were average or below was higher. No matter how accurate the instructions the commander issued, it was meaningless if they couldn\u0026apos;t be executed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOn the other hand, if I took the position of guard which possessed a means of attack, I could demonstrate my individual ability to the fullest. That was because it was possible to survive with skill even without relying on the commander\u0026apos;s information or use of tactics.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;My hope is to be a guard.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Alright, that\u0026apos;s the correct answer.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But only if there\u0026apos;s someone suitable we can trust as commander.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWho to make commander. A certain person popped into my mind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was Morishita. For commander, I didn\u0026apos;t want a simple honor student, but a student who had a different viewpoint from others. For that reason, I wanted to believe in Morishita\u0026#x2019;s ability.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI really did\u0026#x2026; But her eccentricity was a major concern and the telephone game communication through a VIP could easily lead to unwanted chaos.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven considering all that, she was still a prospective commander, but most importantly, it depended on her own will.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I glanced toward Morishita, she snapped her eyes open wide and met my gaze.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you\u0026#x2019;re asking me to take on the role of commander, I respectfully decline.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe thrust out her palm in clear refusal.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I haven\u0026apos;t said anything yet.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Your eyes gave you away.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, it\u0026#x2019;s true that I was considering it. Let\u0026apos;s hear the reason for your refusal, just in case.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Reason? Because I\u0026#x2019;ll participate as a guard. When I see an uninhabited island, my old blood stirs no matter what. Yes, back then, I was known and feared as the Warrior Woman of the Dense Forest\u0026#x2014;no, this is an old story, please forget it. It\u0026apos;s not worth discussing.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe said she wouldn\u0026apos;t talk much about it, but she talked quite a bit. Since it was obviously one hundred percent fiction, I decided to forget it without hesitation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, now that it\u0026#x2019;d come to this, no other classmate came to mind who could demonstrate the ability I was looking for. Unfortunately, it meant that there were no suitable candidates, but...\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn that case, by process of elimination, someone like Sanada who was well-connected with the whole class\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ayanokouji. If you\u0026#x2019;re lost on who to make commander, could you let me handle it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was Shimazaki who approached, as if to interrupt the brief silence.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t know how well I\u0026apos;ll be able to live up to your expectations, but I think I can handle the role without any issues.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince he volunteered, I had no complaints regarding Shimazaki as a potential commander.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, for better or worse, Shimazaki was an orthodox honors student. It was questionable just how flexible or quick-witted he could be. But since I had no other candidates worth considering enough to reject him, simply turning him down might cast a shadow over our future relationship.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Can I leave it to you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah. I don\u0026apos;t really like moving around on a deserted island in the first place. I figured I\u0026apos;d be more useful if I could focus on thinking.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince the role of commander inevitably carried pressure, just showing a positive attitude was enough to consider him qualified.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Understood. In that case, I\u0026apos;ll leave the role of commander to you, Shimazaki. However, there\u0026#x2019;s no need to burden yourself excessively. There\u0026#x2019;s a limit to what a commander can do. I, the one who entrusted this to you, will take full responsibility for the outcome of the exam, win or lose.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I said that, Shimazaki\u0026apos;s tense expression relaxed slightly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter that, I appointed the three students who volunteered themselves\u0026#x2014;Takemoto, Shiraishi, and Nishikawa\u0026#x2014;as VIPs.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNext, I appointed Sanada and Nakajima as analysts and Tsukaji as a scout.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNaturally, the remaining students were all given the role of guards, concluding the role assignment process.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It seems all the roles have been decided. Now then, please take the necessary supplies and head to the starting point immediately. The student serving as commander should remain here to move to the headquarters after this.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMashima-sensei instructed the students to follow him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince I would part ways with Shimazaki there and would be unable to make any direct contact until the end of the exam, I approached him quickly and called out to him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s something I want to tell you before you leave.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What is it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No matter how trivial, I want you to report anything you find strange or unusual without hesitation.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ve been entrusted with an important role; that goes without saying.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s not it. The more you feel the weight of the commander position, the more likely you are to miss what\u0026apos;s right under your nose. A commander from another class laughed, or got angry. Changes in the GPS that feels slightly off but doesn\u0026apos;t seem worth mentioning. Please report anything that concerns you personally, Shimazaki.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s... Won\u0026apos;t receiving miscellaneous information throw the chain of command into chaos?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s true, which is why it can\u0026apos;t just be anyone. Let\u0026apos;s narrow it down to one person.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Who should I report to?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It doesn\u0026apos;t matter who, but let\u0026apos;s see. Let\u0026apos;s go with Shiraishi for now. That should make things easier for you as well.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust like Yoshida, I knew from our earlier exchanges that Shimazaki harbored feelings for Shiraishi.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf I could increase their points of contact, even a little, then it should be something he would welcome.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs for me, looking at Takemoto, Nishikawa, and Shiraishi... I didn\u0026apos;t know all of them very well, so I judged Shiraishi to be the one I had the clearest read on.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, no... That actually makes it harder... Yoshida will get mad at me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s no need to favor only Yoshida. To me, both of you are important friends.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I can\u0026apos;t believe you can say something like that with a straight face... But, still, Shiraishi is...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is that so? Then Takemoto or Nishikawa\u0026#x2014;actually, Takemoto being a guy might be the safest option?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince they\u0026#x2019;re close, any clumsy exchanges might be passed straight from Nishikawa to Shiraishi.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, actually... You\u0026apos;re right, Shiraishi is fine. I\u0026apos;ll do it properly, so don\u0026apos;t worry.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile still showing hesitation, Shimazaki corrected himself and said he would report to Shiraishi.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe must have reconsidered, figuring that if he had to talk to someone, it might as well be Shiraishi.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;One last confirmation. I think you\u0026apos;ll be watching the GPS locations, but you can basically contact any VIP you want. However, when it comes to uncertain questions or feelings of unease, use Shiraishi to avoid adding unnecessary noise. The more people playing a game of telephone, the more it becomes a source of confusion. In other words, you can tell Shiraishi anything and everything, no matter what it is.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf a situation arose where Shiraishi was eliminated, we could just discuss what to do next at that time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Right. Got it, let\u0026apos;s do that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI then verbally relayed a few more things I wanted him to look into after he arrived back at the base and Shimazaki readily agreed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBefore we left, as a final step, we all put on safety goggles to protect our eyes. Aiming for the head was against the rules, but for safety reasons, it was recommended to wear these goggles at all times during the exam; any unexpected trouble that occurred while they were off was entirely one\u0026apos;s own responsibility. Also, it seemed the sensors were only on our gym uniforms, but hits were apparently detected even with a tracksuit on top, so wearing one was optional. However, it was probably safer to wear one, as it would help lessen the pain.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 3\",\"volumeId\":\"y3v3\",\"chapterIndex\":16,\"prevChapter\":{\"volumeId\":\"y3v3\",\"chapter\":15,\"title\":\"Part 2\"},\"nextChapter\":{\"volumeId\":\"y3v3\",\"chapter\":17,\"title\":\"Chapter 2: A Surprise Attack\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 3\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xh ex\":39},{\"label\":\"Part 1\",\"href\":\"c6p1.xhtml\",\"index\":40},{\"label\":\"Part 2\",\"href\":\"c6p2.xhtml\",\"index\":41},{\"label\":\"Part 3\",\"href\":\"c6p3.xhtml\",\"index\":42},{\"label\":\"Part 4\",\"href\":\"c6p4.xhtml\",\"index\":43},{\"label\":\"Part 5\",\"href\":\"c6p5.xhtml\",\"index\":44},{\"label\":\"Part 6\",\"href\":\"c6p6.xhtml\",\"index\":45},{\"label\":\"Chapter 7: The Time of the Decisive Battle\",\"href\":\"c7.xhtml\",\"index\":46},{\"label\":\"Part 1\",\"href\":\"c7p1.xhtml\",\"index\":47},{\"label\":\"Part 2\",\"href\":\"c7p2.xhtml\",\"index\":48},{\"label\":\"Part 3\",\"href\":\"c7p3.xhtml\",\"index\":49},{\"label\":\"Part 4\",\"href\":\"c7p4.xhtml\",\"index\":50},{\"label\":\"Part 5\",\"href\":\"c7p5.xhtml\",\"index\":51},{\"label\":\"Epilogue: Show Me What You’ve Got\",\"href\":\"e.xhtml\",\"index\":52},{\"label\":\"Part 1\",\"href\":\"e1.xhtml\",\"index\":53},{\"label\":\"Author's Afterword\",\"href\":\"authors-afterword.xhtml\",\"index\":54}],\"volumeTitle\":\"Light Novel 3rd Year Volume 3\",\"detailsLink\":\"/select/year-3/y3v3\",\"returnLink\":\"/select\",\"currentSpineIndex\":16,\"nextVolumeLink\":\"$undefined\",\"nextVolumeTitle\":\"$undefined\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://classroom-of-the-elite-reader.vercel.app\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"COTE Reader\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"en_US\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:image:width\",\"content\":\"1200\"}],[\"$\",\"meta\",\"9\",{\"property\":\"og:image:height\",\"content\":\"630\"}],[\"$\",\"meta\",\"10\",{\"property\":\"og:image:alt\",\"content\":\"Classroom of the Elite Reader Preview\"}],[\"$\",\"meta\",\"11\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"12\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\"$\",\"meta\",\"13\",{\"name\":\"twitter:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"14\",{\"name\":\"twitter:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"15\",{\"name\":\"twitter:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"link\",\"16\",{\"rel\":\"icon\",\"href\":\"/hola-lector-agua/icon.svg?icon.ae5abf30.svg\",\"sizes\":\"any\",\"type\":\"image/svg+xml\"}],[\"$\",\"$L14\",\"17\",{}]]\n"])</script></body></html>
