e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:Tb1e6,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 1\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAT 3:20 P.M., with forty minutes left until the end of the exam, I made my way to the center of E11, asking Beppu for the enemy\u0026apos;s position every step of the way.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...They\u0026apos;re coming. All three of them, they\u0026apos;re really close now, right in front of us...! What if Ryuuen and Ibuki split up...? What should I do?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s unlikely. Yamashita isn\u0026apos;t very athletic and she\u0026apos;s probably nearing her limit. She can\u0026apos;t keep up with your pace as a guy and it wouldn\u0026apos;t be easy for them to track you with a five-minute delay taken into account.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I hope you\u0026apos;re right... To be honest, I\u0026apos;m at my absolute limit...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe gave a wry smile, his legs screaming after having walked and run around the deserted island for nearly four days.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In that case, all you can do is lie low and pray they don\u0026apos;t find you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah, I\u0026apos;d rather not do that...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eConsidering the remaining time, he would almost certainly be found and taken out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re in there, aren\u0026apos;t you! Ayanokouji! You should be grateful I came all this way for a fight!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom ahead, Ibuki\u0026apos;s shout reached me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What\u0026apos;s with her, is she a tsundere or something...? Well, I\u0026apos;m outta here, then?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter making his light-hearted jab, Beppu raised a hand and quietly departed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI tore my gaze from his retreating figure and moved forward, one step at a time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith the eliminated students having withdrawn, the deserted island was now sparsely populated. The surrounding sounds were clearer than ever.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt\u0026#x2019;d been a survival game where, until now, everyone fired without question upon seeing an enemy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut as I walked onward, both Ryuuen and Ibuki emerged from between the trees.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFaintly behind them, I could also see Yamashita.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hah, we\u0026apos;ve been playing this exam seriously, all trial and error, but in the end, it\u0026apos;s just a flashy shootout with no brains involved that wears everyone down. It\u0026apos;s no wonder an idiot like Ibuki, who can at least move, is still standing, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sounds like you were pretty successful. How many people did you take out?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t remember how many I beat. Besides, because those three Class A VIPs got eliminated, I missed my chance to take down Horikita!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe seemed frustrated about that, her voice laced with anger.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t like it, but it\u0026apos;s thanks to the information you sent. A convergence of interests, I suppose?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJudging by the deadlocked results, Class A might have been the one left standing if I hadn\u0026apos;t passed on the information.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It would be a problem for the other three classes if Class A didn\u0026apos;t lose. Right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah. But I\u0026apos;d like to hand you a loss just as much. Time\u0026apos;s running out. Let\u0026apos;s settle this here and now and decide our ranks.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHis low voice echoed from straight ahead. As Yamashita fell back, both of them disappeared between the trees.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, they wouldn\u0026apos;t think of a two-on-one as cowardly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf it were a normal fight, they would\u0026#x2019;ve realized they had no chance of winning and wouldn\u0026apos;t have taken the bait.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut this time, the situation was different. They could defeat me just by hitting me with a paintball.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWithout bothering to take cover, I advanced to see what my opponents would do.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI couldn\u0026apos;t be careless at a distance of less than ten meters, but there were still more than twenty meters between us. It wasn\u0026apos;t too late to react after seeing the muzzle of a gun.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOr rather, you could say it was because I didn\u0026apos;t have enough ammo left for a long-range firefight.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAmmunition unilaterally favors the side that has more of it. But an advantage doesn\u0026apos;t necessarily guarantee victory. I had about twenty rounds left. All of my actions needed to be structured by calculation. Without taking a deep breath, I calmly processed the variables before me: distance, angle of cover, Ibuki\u0026apos;s habits, Ryuuen\u0026apos;s line of fire.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Die, Ayanokouji!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIbuki, who went out of her way to shout, reminded me of Ishizaki, who I fought on the rooftop.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eImmediately after, a submachine gun poked out and fired off a somewhat random spray of bullets.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat wasn\u0026apos;t meant to take me down, but to serve as bait\u0026#x2014;to make me take cover, cutting off my sight and hearing so I wouldn\u0026apos;t know Ryuuen\u0026apos;s position. Submachine guns have little ammunition.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe moment she fired off all thirty rounds, I kicked off the ground and closed the distance to Ibuki.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSeeing this, Ibuki spun around and slipped low between the trees.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI dropped my stance and fired a short burst. The trajectory wavered slightly, shaving off one leaf, then another and grazed Ibuki\u0026apos;s shoulder, but since the paintball didn\u0026apos;t burst, her wristwatch didn\u0026apos;t signal a hit. Ibuki glared at me, her teeth bared in a grimace that resembled a smile.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen she hid securely behind a tree and began to reload. Since I didn\u0026apos;t know Ryuuen\u0026apos;s current location, it was difficult to flank her to close the distance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe faint sound of scraping plastic reached me. Taking that as my cue, I moved a few steps to the side. By changing my position, I altered the line of fire and peeked through the trees to assess the situation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDeep among the trees, Ibuki\u0026apos;s shadow moved slightly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe moment I confirmed a gun muzzle peeking out in the corner of my vision, I reflexively dropped my body low.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe sound of a paintball slicing through the air rushed past, practically grazing my ear, before it splattered against the bark of a tree behind me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBefore I could even confirm the miss, Ryuuen was already moving to a new position. I wanted to follow him with my eyes, but Ibuki, having finished reloading, had started moving again, so I broke my line of sight.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;She\u0026apos;s fast, as expected.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe petite Ibuki moved between the trees, running like a small animal. Moreover, she seemed accustomed to shooting with some accuracy while running. Bullets flew sporadically from her lightweight submachine gun, striking the large tree that was protecting me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWary of her getting behind me, I took a few steps back and changed my position as well.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFaster than the eye could follow, a branch swayed and leaves danced.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePredicting her line of movement, I fired two bursts.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe bullets struck the trunk and wood chips flew.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t a direct hit, but it was enough to stop Ibuki\u0026apos;s advance for just a moment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Where are you even aiming? You think you\u0026apos;re gonna hit me with a shot that pathetic? You\u0026apos;re a lousy shot.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIbuki\u0026apos;s voice echoed between the trees.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a provocation. But I didn\u0026apos;t answer, just regulated my breathing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIbuki showed her face again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was even a smile on her face. Was it confidence, or perhaps overconfidence?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut as there was no hesitation in her movements, their straightforward predictability remained unchanged.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe position of her hips the moment she jumped out, the height of her gaze, everything was consistent.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd then, at that moment, Ryuuen moved again, scattering paintballs in my direction.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn a situation where one hit meant it was over, my attention was unwillingly diverted and I focused on evasion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen I pulled the trigger three times toward Ryuuen as a warning, forcing him to back down. I had only taken my eyes off her for two or three seconds before turning my body and gaze toward the spot where I thought Ibuki had last hidden.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Gotcha\u0026#x2014;!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe shout came from two trees over from where I had set my sights.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThinking I hadn\u0026apos;t noticed she moved, she boldly revealed herself and took aim at me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Wha\u0026#x2014;!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was true that I was looking at the place where Ibuki had hidden just a few seconds before. My body was facing that direction, too, but there was one thing that wasn\u0026apos;t: the muzzle of the weapon held firmly in my hand. The muzzle alone was pointed toward Ibuki, who just jumped out, seeing her chance to win.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI confirmed the feel of my finger on the trigger and pulled.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe bullet\u0026apos;s trajectory cut through the air, flying in a straight line.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIbuki reflexively twisted her body, but she couldn\u0026apos;t completely dodge it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA paintball hit her right thigh and burst. The judging tone echoed through the forest a moment later.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIbuki\u0026#x2019;s eyes widened in surprise and she collapsed onto the ground. The electronic sound repeated.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Agh, dammit! So this is how it ends!? This is so fucking annoying!! I told you I didn\u0026apos;t want to do this!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had no time to listen to Ibuki\u0026apos;s bitter complaints as the wind stirred behind me. I immediately turned and pulled the trigger on Ryuuen, who was aiming at me. But the gun didn\u0026apos;t fire. Meanwhile, Ryuuen had fired while moving his body, so his shot barely missed my shoulder and failed to hit.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Out of ammo here\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith my weapon in one hand, I broke into a run, heading south.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe looked calm at a glance, but in truth, he pursued me without hesitation, like a beast about to pounce.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was the price for using up too much ammo on the small stuff.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRight as I finished off Ibuki, the magazine was clearly and completely empty.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNot a single paintball remained in my assault rifle.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI bluffed by aiming behind me, but Ryuuen continued to advance without flinching at all.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA determined pursuit, shouldering the risk of his own defeat.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy watch showed that the area had switched to E12.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut I had no time to look closely at my watch.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs straight and as short as possible, but the deep forest would not let me escape so easily.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo the right, to the left, sometimes from underfoot.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNature attacked, preventing me from running at full speed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA paintball came flying from behind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUnable to worry about appearances any longer, I threw the cumbersome weapon in my right hand onto the ground.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat awaited me beyond the forest was, of course, a sprawling sandy beach.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was no cover at all.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI stopped after running about twenty meters across the sand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I surrender.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI raised both my hands and said so to Ryuuen, who aimed his weapon at me from behind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So even you can\u0026apos;t dodge every bullet here, can you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA calmer voice than I\u0026apos;d expected came from behind me, though he was out of breath.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Impossible. There\u0026apos;s no way I can dodge them all.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf it\u0026#x2019;d been a concrete surface where my feet wouldn\u0026apos;t get stuck in the sand, could I have put up a bit more of a fight? No, that was probably impossible.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf my opponent only had one or two shots left, it would\u0026#x2019;ve been a different story, but that wasn\u0026apos;t the case.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat slim possibility had just vanished with the \u003cem\u003eclack\u003c/em\u003e\u0026#xa0;of a magazine being replaced.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Gotta take every precaution when I\u0026apos;m up against you, Ayanokouji, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2014;Maybe. But why did you decide to fight me? It seemed like Ibuki was against it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even in a 2-v-1, there\u0026apos;s no guarantee we\u0026apos;d win a shootout against you. She probably thought she had a better chance of winning if she took an all-or-nothing shot at the VIP.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith my hands still in the air, I moved only my neck to look behind me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And you thought differently?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Nah. If it were just about winning, I\u0026apos;d have thought that was the better move, too. But settling things by running away on a rare occasion like this? That ain\u0026apos;t any fun at all. A far cry from victory.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen had racked up loss after loss until now; perhaps his obsession with victory had led to this 2-v-1.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I understand your reason. But if that\u0026apos;s the case, why haven\u0026apos;t you shot me now that you\u0026apos;ve finished reloading? If the victory you desire is to defeat me, you\u0026apos;re one step away from achieving it. All you have to do is put some force into your fingertip and pull the trigger and it\u0026apos;ll all be over.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWithout even a one percent shred of a lie, that decision would get me eliminated.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut the reason he didn\u0026apos;t was likely because he wanted a certain victory.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven though he already won, he couldn\u0026apos;t believe he could actually win.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hah\u0026#x2014;you\u0026apos;ve got a point. I\u0026apos;ve gotten pissed off watching scenes like this in movies and shows myself. Like, \u0026apos;If you\u0026apos;ve got time to talk, just shoot already.\u0026apos;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Correct. While we\u0026apos;re standing here like this, Yamashita might be getting targeted by one of our guards.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Maybe. But there are things you only understand when you\u0026apos;re in a situation like this yourself.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen was laughing, but he hadn\u0026apos;t let his guard down in the slightest.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe wasn\u0026apos;t getting too comfortable with his overwhelming advantage.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I just wanna know, is this really you surrendering? How is the one existence I thought I couldn\u0026apos;t beat going to escape this predicament? Or do you even think you \u003cem\u003ecan\u003c/em\u003e\u0026#xa0;escape? If you do, I wanna see it. Even if it means risking my own defeat.\u0026quot;\u003c/p\u003e\u003cimg src=\"/hola-lector-agua/images/books/y3v3/OEBPS/EuGOeYKICPKoWnmNttfYU.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter taking a breath, Ryuuen took a single half-step back from me without changing his posture at all.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No matter who you are, there\u0026apos;s no way you can dodge every single bullet I fire, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I already told you it\u0026apos;s impossible. The muzzle velocity of these paint guns is about 90 m/s. Meanwhile, the average human reaction time is 0.2 to 0.3 seconds. If we were about 20 meters apart, there\u0026apos;d be some leeway, but at this distance, it\u0026apos;s hopeless. Even if I could instinctively dodge a few shots, it\u0026apos;s absolutely impossible to keep dodging them all until the magazine is empty.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI glanced around lightly and stated the objective situation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If there were no rules, I might have the option of taking that slim chance to dodge, close the distance and disarm you\u0026#x2014;but taking a weapon is obviously prohibited. Or if I had a handgun, I could\u0026#x2019;ve at least fought back, but anyone carrying a handgun is required to wear a holster visibly on their leg, so it\u0026apos;s impossible to conceal one. With both overpowering you and fighting back sealed off, the only thing I can do now is keep dodging.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen glanced at my feet to double-check.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, I didn\u0026apos;t have a handgun.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah, that\u0026apos;s right. No matter how you look at it, you\u0026apos;re cornered.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;ve cornered me this perfectly and you\u0026apos;re still telling me to show you a way out?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;d like to see it, but\u0026#x2014;if you can\u0026apos;t, you can\u0026apos;t. I\u0026apos;ll take you down and go hunt the remaining VIP and guards. You\u0026apos;re betting everything on your last remaining guard, huh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eReadjusting his firm grip on the gun, Ryuuen lowered his tone of voice a notch.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eConsidering the time remaining, he would have to finish me off soon and re-enter the forest.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Bet everything on the last guard... That\u0026apos;s not a bad suggestion.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The ones left are Kanzaki and Yamamura? Sorry, but I ain\u0026apos;t got any intention of losing to small fry.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is that so? I\u0026apos;d say that depends on the conditions.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSensing something ominous in my words, Ryuuen furrowed his brow.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Keep walking forward a few more meters. Right, stop there.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen made me walk, then stomped his foot on the sandy spot where I had just been standing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Guess there\u0026apos;s no way you pulled a trick like luring me here to a spot where you\u0026apos;d buried a weapon, huh.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed he considered the less than one percent possibility and wanted to eliminate it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The idea of being lured isn\u0026apos;t a bad line of thought. After I ran out of ammo, I threw down my weapon and ran away from you, but can you really say I was just running away?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Huh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Doesn\u0026apos;t it feel a little strange\u0026#x2014;that I fled frantically, got lost, left the forest and ran onto this beach? The area we can move through is already limited, but there\u0026apos;s no way I haven\u0026apos;t memorized the map. If I were going to run anyway, it would\u0026#x2019;ve been a hundred times better to keep running in circles inside the forest. There\u0026apos;s no merit to fleeing to a beach like this with no cover whatsoever, where the sand trips you up so you can\u0026apos;t run properly and you can\u0026apos;t even dodge.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...\u0026apos;Cause the forest has all the damn cover you could want. But still, I don\u0026apos;t get it. Why would you lure me here, to a place that only gives me the advantage?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s a matter of perspective. Having no cover leaves you defenseless, but at the same time, it leaves your opponent defenseless too. It\u0026apos;s an environment where even a poor shot can hit an enemy with a paintball if they pull the trigger up close.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen\u0026apos;s brow furrowed even more.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter all, it was a simple fact that while it was advantageous to Ryuuen, it wasn\u0026apos;t to me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And the forest is too quiet. But here, you can clearly hear the sound of the wind and waves. The risk of making unnecessary noise by stepping on a twig is low. It\u0026apos;s the perfect place to sneak up from behind.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;From behind...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen couldn\u0026apos;t carelessly look away from me, knowing I was not to be underestimated.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI continued to throw words at Ryuuen, who must have been starting to feel a chill down his spine.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You were chasing me. But at the same time, I was giving orders to my remaining guard. I told them that once it was confirmed to be one-on-one, I would lure Ryuuen to this spot, so they should approach from behind and finish him off\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And you think I wouldn\u0026apos;t notice?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Could you really? You focused completely on chasing me. It was a pursuit that could be called obsessive. But as a result, it\u0026apos;s hard to say your awareness of what was behind you was perfect. Are you not aware of the reality of your situation, that you have a gun pointed at you, as if someone is aiming from a few meters behind you right now?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t make me laugh. That\u0026apos;s a bluff.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You think you\u0026apos;d definitely know if someone approached? But one of my remaining guards is Yamamura. She\u0026apos;s skilled at erasing her presence, she\u0026apos;s lightweight and nimble. She doesn\u0026apos;t have great athletic ability, but she\u0026apos;s one of the most suitable people for sneaking up quietly.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAmidst the quiet, repeating sound of the waves, Ryuuen strained his ears.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut it would be difficult to pick up the breathing of an opponent who was standing still.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If Yamamura is behind me... then why haven\u0026apos;t you had her shoot?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Same as you. You wanted to get all the answers, didn\u0026apos;t you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Kuku... This is what makes it so damn interesting. I thought I\u0026apos;d cornered you into a situation where I was under absolutely no threat, but you\u0026apos;ve made me consider the \u0026apos;what if.\u0026apos; Let\u0026apos;s say, just for argument\u0026apos;s sake, that Yamamura is behind me. What would you do if I turned around and counterattacked before she could fire? Yamamura would be out and I\u0026apos;d be sure to shoot you down before you could pick up her weapon.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That might happen, or it might not. If you\u0026apos;re curious, you can always test it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI could tell that Ryuuen, standing before me, took a sharp breath.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUnlike before, he was becoming very wary of his unseen back.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf Yamamura was standing behind him\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs the last guard, that would mean game over.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe thought. Was he really being followed without noticing?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo, that couldn\u0026apos;t be, he thought, yet doubt remained as to whether he\u0026#x2019;d been paying attention to his back.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe important thing wasn\u0026#x2019;t whether she was there or not.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was that he had to act under the assumption that she was.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe had to turn around quickly and land a paintball on Yamamura before she could shoot.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if he could manage that without difficulty, if by some chance a shot was fired before Yamamura was ruled out, Ryuuen would have to dodge that paintball at all costs. That wouldn\u0026#x2019;t be easy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen again, trying to take me out first was nonsense. He\u0026apos;d just get shot by Yamamura in the meantime and it would be over.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI could read Ryuuen\u0026apos;s thoughts as if they were my own.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe couldn\u0026#x2019;t ignore what was behind him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAbove all, since I didn\u0026apos;t have a gun, his only option was to dodge.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn that case, there was no harm in glancing behind for a moment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf no one was there, he just had to return his gaze and posture to normal in less than a second.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if I tried to run, I wouldn\u0026apos;t get far on this wide beach, as my footing would be poor.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust after he let out a faint breath\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe twisted his body, turning around with the muzzle of his gun.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen\u0026apos;s field of vision. The forest visible in the distance and the deserted beach.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was no one behind him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA moment of relief.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAll that was left was to turn back toward me and shoot the one without a weapon to secure his victory.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut faster than his gaze could return, I put a great deal of strength into my right hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was true that I held no weapon.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNor did I have any means of escape.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever\u0026#x2014;I did have the means to fight.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI, too, twisted my body around toward Ryuuen.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eConvinced of his victory, Ryuuen turned back to me and pulled the finger that was already on the trigger.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI could not dodge all the bullets that would fly out, but that wasn\u0026#x2019;t a problem.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBetween the index finger and thumb of my right hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA single, damaged paintball was wedged there.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith all my might, I threw it at Ryuuen, like a pitcher throwing into a mitt.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt the same time my abdomen was stained, Ryuuen\u0026apos;s abdomen was stained the same color.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Wh\u0026#x2014;!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOnly the faint hum of the motor that fired the pellet remained.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlmost simultaneously, our watches beeped, announcing we were out and sealing both our defeats.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis paintball was fundamentally the same as the ones loaded in the magazine, but with one key difference. Normally, it wouldn\u0026apos;t break easily even if a person hit their target by throwing it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRepeated trial and error.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHow much force was needed to break it on impact?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHow hard of a surface did it need to hit to break?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat was the most efficient method?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHow damaged did the membrane preventing the paintball from bursting need to be for it to rupture?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was something I spent time preparing over the past three days, repeating trials to create the perfect amount of damage so that it wouldn\u0026apos;t break.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You... threw it...!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s nothing in the rules against it. It\u0026apos;s just that using a weapon is more reliable and convenient, so it\u0026apos;s something nobody needs to do.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen glared at the obnoxiously loud alarm on his watch and slammed his weapon onto the ground.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Did you drag this out just to show off some tricky little stunt? What if I\u0026apos;d pulled the trigger without hesitating? You wouldn\u0026apos;t have had any time for a counterattack like this.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The moment I lured you to the beach, your overwhelming advantage was guaranteed. I predicted with high probability that you wouldn\u0026apos;t shoot me right away. Besides, I had my own circumstances to consider. While it\u0026apos;s true I wanted to purely enjoy the match, ultimately, I was fine with losing here. Because I\u0026apos;d already achieved my goal.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Your goal?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll make it official here. I, Class D and Ichinose have joined forces. I can\u0026apos;t say how far this alliance will go or to what extent, but we are united in aiming for the top. But even if you call it an alliance, the other students, especially those in Class C, wouldn\u0026apos;t just accept it. That\u0026apos;s why my top priority was to drive them into a situation where they had no choice but to form one.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So that\u0026apos;s what this was about. In other words, the reason my surprise attack worked was\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. The time of highest risk in this special exam is when the classes are close to each other. Barring the final phase, the starting point is the most dangerous. Everyone rushes to move away from the other classes. They communicate constantly with their commander via GPS to confirm they\u0026apos;re putting distance between them. You wouldn\u0026apos;t have thought to use your strategy from the get-go if we quickly moved away, either.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut in reality, as soon as Class C confirmed the other classes moved away, they stopped in their tracks.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;By making it seem like we shifted our focus to teaching how to use the weapons first and formulating a strategy, I created an environment that was easy for a surprise attack.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So you left your classmates defenseless and let them take the hit?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s right. Unfortunately for you, winning a shootout wasn\u0026apos;t my first priority. I just wanted to create a situation where Class C would have no choice but to rely on Class D, whether they liked it or not.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven Hashimoto and Morishita, who were relatively well-informed, were highly skeptical of the alliance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd for good reason. They felt there were more disadvantages than advantages to teaming up with Class D, who\u0026#x2019;d so far shown few notable achievements. Even if you simply said you\u0026#x2019;d form an alliance, it wasn\u0026apos;t something they could easily accept.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, if they were cornered, it was a different story. If they couldn\u0026apos;t find a way to survive the special exam without Class D\u0026apos;s help, it was a different story. If a path to second or third place opened up on the road to rock bottom, it was a different story.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd so, the Class C students came to plead for Class D\u0026apos;s cooperation on their own.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course, we probably could have forced an alliance even without the surprise attack. But what do you think would\u0026#x2019;ve happened if an unscathed Class C and Class D had joined hands? Even someone as bold as you would find it reckless to challenge nearly eighty opponents. That\u0026apos;s why you can\u0026apos;t easily make a move even against a moderately weakened Class C and D alliance. On the other hand, Class A would feel similarly. They\u0026apos;d think that at this rate, it would become a muddy battle between Class A and Class B for last place.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen, too, spread out the map in his mind, tracing what he would\u0026#x2019;ve done.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In that case, this thought naturally arises: \u0026apos;Perhaps we could join forces with Class B just for this special exam, crush the lower classes first and then settle things between us.\u0026apos;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDo what the opponent did to get back on even footing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, it wouldn\u0026apos;t be easy. They might not be able to build enough mutual trust to act as a completely unified front like Classes C and D. However, there was a possibility they could build a cooperative relationship strong enough to avoid direct conflict and pincer the C-D alliance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I never would\u0026apos;ve thought you\u0026apos;d take a surprise attack on purpose... So you\u0026apos;re saying I shouldn\u0026apos;t have done it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It was a matter of sooner or later. The reason I had you attack the waiting Class C on the second day was also because I wanted to wear down our forces a little more. There were any number of ways to break my allies\u0026apos; spirits.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat defeat on the second day was the clincher.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRealizing they had no other choice, the Class C students personally requested an alliance with Class D.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In the end, that idiot Ibuki was the most right, huh. This is the pathetic result of being too damn fixated on you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA declaration of defeat. But it was somehow different from the pathetic figure he\u0026#x2019;d cut in the classroom last time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ve seen your process of using any environment to win. In that case, from here on out, I\u0026apos;m not gonna show you any mercy in the truest sense.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So you\u0026apos;ve been holding back on me until now? How very kind of you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen slowly picked up his weapon, averted his gaze from me and stared out at the sea.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen, without responding to my words, he started walking down the beach. After watching him go, I turned back once to retrieve the weapon I intentionally dropped, then returned to the base, arriving late.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen I returned to the ship and waited. Although we were told we were free until the end of the special exam, there wasn\u0026apos;t enough time to do anything and the scheduled time arrived just like that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere hadn\u0026apos;t been an official announcement yet, but with Class A already wiped out and Class B without its guard, there was almost no doubt that Class A would be last, Class B third, Class C second and Class D first. Since Horikita and Koenji in Class A had Protection Points, there would be no expulsions.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as Hashimoto came over to offer me words of praise, an announcement was made for us to disembark.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed the results of the special exam would be announced outside.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs we started walking to disembark together, students nearby muttered about what a tough exam it\u0026#x2019;d been, but was that really the case? The previous special exam and then this special exam. It was certainly true that this one had been harsh in comparison, due to the long period of isolation, the considerable fluctuation in Class Points and the fact that a student would be selected for expulsion, even if they could be protected by a Protection Point.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen we got down to the wharf, we were instructed to freely take one bottle from several types of labeled plastic bottles lined up, but they were all water and tasted the same, so I grabbed one at random before stepping onto the sandy beach. It seemed there was no need to line up by class, as a teacher told us to wait wherever we wanted.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy eyes searched for Hiyori, whom I hadn\u0026apos;t seen once during this deserted island exam.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd in the distance, I found her talking with our classmate Kaneda.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe didn\u0026apos;t look injured or unwell; she seemed to be in good spirits.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wondered whether or not I should go talk to her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I pondered for a moment, Yoshida, who spotted me and Hashimoto, rushed over, resting his elbow on my shoulder with a grin to celebrate our second-place finish.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUnable to move as I pleased, the three of us simply waited as time passed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe teachers moved about frantically.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor a simple special exam results announcement, the atmosphere was strangely solemn.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t the state of each class, but the teachers\u0026apos; demeanor that was odd.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven Hoshinomiya-sensei, who should\u0026#x2019;ve been suppressing her joy, wasn\u0026apos;t letting her guard down at all.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSomething was definitely off.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven Hashimoto and Yoshida, who hadn\u0026apos;t noticed at first, picked up on the strangeness.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe newly brought-in cardboard boxes were completely unopened.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Man, don\u0026apos;t you get a really bad feeling about this?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...What a coincidence, Hashimoto. I was just about to say the same thing.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBoth of us sensed the strangeness and realized that something new was beginning.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEventually, the exhausted Yamamura and the others were led back to the base by a teacher and as soon as the last survivors were gathered, they were made to stand on the beach with no time to rest.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was a clear difference in physical condition and stamina between the students who were eliminated early on and those who had survived until the end, but no consideration was shown for it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOr perhaps even this difference was all just a prelude to what was coming next.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs the students watched, Mashima-sensei picked up a megaphone and brought it to his mouth.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The Uninhabited Island Survival Game Special Exam is hereby concluded\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat should\u0026#x2019;ve followed those words was the announcement of the results.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut they changed into words that confirmed the oppressive atmosphere the students felt was real.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;From this moment, the Uninhabited Island Special Exam will now begin.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThose were words that heralded a new battle.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis was something entirely different from the \u0026apos;lenient\u0026apos; survival game, whose penalties were little more than an extension of play.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe curtain rose on the school\u0026apos;s battle of \u0026apos;trust\u0026apos; and \u0026apos;betrayal\u0026apos; to sift through the students and determine whether they were worthy of graduation.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 1\",\"volumeId\":\"y3v3\",\"chapterIndex\":53,\"prevChapter\":{\"volumeId\":\"y3v3\",\"chapter\":52,\"title\":\"Epilogue: Show Me What You’ve Got\"},\"nextChapter\":{\"volumeId\":\"y3v3\",\"chapter\":54,\"title\":\"Author's Afterword\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 3\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":11},{\"label\":\"Prologue: Shiina Hiyori's Monologue\",\"href\":\"prologue.xhtml\",\"index\":12},{\"label\":\"Chapter 1: O
