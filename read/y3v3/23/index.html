e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T2a14,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 1\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eONCE THE PERSONNEL had been organized and redeployed, Hashimoto called out again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No problems here. We\u0026apos;re ready to move whenever, wherever.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAn hour had passed since the exam began. With ten o\u0026apos;clock just a few dozen seconds away, the first event that would finally set everyone into motion was about to start.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe map was divided into areas, one square at a time, from A1 to O15 and an event would occur in one of those areas.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs it was the very first event, we would need to start by getting a feel for things, grasping the scale and details. What we knew beforehand was that events wouldn\u0026apos;t occur in the three areas where the commanders and teachers were gathered\u0026#x2014;E14, F13 and F14\u0026#x2014;or in any area that was entirely ocean. This was clearly stated in the rulebook.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith Shiraishi and her radio at his side, Hashimoto spread out the map.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSanada, our analyst, also waited for the signal on his tablet, ready for anything.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd then\u0026#x2014;the scheduled time arrived.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It looks like there are ten events in total for the first round. I\u0026apos;ll read out the locations first. B7, D14, E5, G7, G13, H9, J12, L14, M4\u0026#x2014;and finally, N7.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs Sanada read them off precisely, Hashimoto marked them on the map. Two other students who were on standby immediately jotted them down on their own maps by hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEach event would be active for one hour from now. If we were even a second late, the revealed password would become invalid, which meant the places we could go were inevitably limited.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The one we can get to right away is G13, right next to us. After that, D14 looks like a safe bet. Based on distance alone, we could probably reach H9 and J12 within the hour, but Class A and Class B have a huge advantage for H9...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The supplies at H9 are food, right? If it\u0026apos;s within our reach, we\u0026apos;d want to get our hands on it...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile it was a question of whether we could even get there in time, the top two classes were close enough to reach it in ten or fifteen minutes. Even if we got lucky and made it, the supply crate would probably be empty by then.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s like pullin\u0026apos; someone else\u0026apos;s chestnuts outta the fire, y\u0026apos;know? Worst case, it\u0026apos;ll be a three-way shootout. No, wait, if Class A and B fight it out, maybe we could hit \u0026apos;em from behind?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto touched his chin with his fingertips and ran the tip of his pen over the map, simulating the movements.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut now that our numbers were halved, launching an attack came with a huge risk.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;For what it\u0026apos;s worth, if I were the leader of Class A, I would abandon H9, at the very least. If they were to rush over just because it\u0026apos;s the closest, it\u0026apos;s plain to see they would be attacked from behind by the aggressive Class B.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMorishita joined the conversation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSanada, who was still looking at his tablet, also offered his opinion on the matter.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In that case, couldn\u0026apos;t they split their class in two and form a defensive line? Even Class B wouldn\u0026apos;t charge in so easily if they knew they were walking into an ambush\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I wonder about that. It seems more likely they would take advantage of their current momentum and initiate an attack. Rather than taking such a risk, since they went to the trouble of being the first to break into the northern area, collecting G7 and heading for E5 would be the safe and certain option.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAbandoning the nearby food supplies would be frustrating, but that did seem to be the most sensible route.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI couldn\u0026apos;t imagine Horikita would want to get into a fierce battle with Class B right away.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom what I heard from our commander via Shiraishi, abandoning H9 without a second thought was the right call.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We\u0026apos;ll start by securing G13 and D14 for sure.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s more straightforward, yeah.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eG13 was ammunition and D14 was daily necessities.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe decided to postpone the food problem until the start of the next event.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The main unit will move to G13 and we\u0026apos;ll form a separate detachment with four people to escort our VIP, Takemoto. Only the VIP can receive their exact coordinates from the commander, after all.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf an analyst wasn\u0026apos;t going to accompany them, it would also be crucial to relay those details to the commander.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eCoordination was essential to accurately align the location of the supplies with our own.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah... The watch only tells you if you\u0026apos;re in the current area or not.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor now, there were no signs of other classes around D14, so it was free, but the event\u0026apos;s location was still just \u003cem\u003esomewhere\u003c/em\u003e\u0026#xa0;in the area and without a tablet, we would have to search for it on foot. In other words, if the search proved difficult, we would waste time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo maximize our chances of acquiring the supplies, the VIP\u0026apos;s presence was indispensable.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re gonna coordinate closely with the commander and bring back those supplies.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Five people in total? Couldn\u0026apos;t Takemoto go alone?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Just getting there wouldn\u0026apos;t be a problem, but no matter how safe D14 is, I want to avoid a situation where we can\u0026apos;t find the event location, or the supplies are too much to carry back all at once.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah, right, gotta think about carrying it all back, too.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter opening it with the password, could we still take things out after the hour was up, or could we just take everything out and leave it there? Since those points were unclear, we had to prevent any mistakes we could.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen again, if we sent too many people, it would just force them to move around and needlessly drain their stamina.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe balance of it would likely change depending on the conditions of the supply crate.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Five people is plenty. Besides, if there are no enemies, I don\u0026apos;t think there\u0026apos;ll be any trouble. Leave it to me. By the way, should we just come back here to regroup?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah. The base is an easy landmark, so F13 is fine. We\u0026apos;ll need to grab the supplies at G13 quickly while also keeping watch from F12 or G12 to see if Class B heads south.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf we moved on D14 with a large group, there was a chance Ryuuen would send a large number of his guards toward our base.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf that happened, we would be driven into a dead end with no escape.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs we immediately started preparing to depart, I spotted Yamamura with an anxious look on her face.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What is it? If you have a problem, I\u0026apos;ll hear you out.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah, no... it\u0026apos;s not that... it\u0026apos;s just...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Just?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s just... it\u0026apos;s scary, isn\u0026apos;t it? If I get separated, I won\u0026apos;t have any idea where my allies are or where the enemy is, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps her imagination was stirred by listening to the exchange between the VIP and the commander.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBecause Class C lost Nishikawa right after the start, their situation was equivalent to having already lost one-third of their mobility. It was no wonder she felt anxious over such a trivial matter.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And there\u0026apos;s nothing I can do to be of use...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s not true. Our class was half-decimated due to my poor judgment, but at least we still have half of us left. As long as half of us are still here, it means there\u0026apos;s still a chance to win. If you, Yamamura, can just stay in for even one second longer without getting out, that alone is useful.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is that... really all it takes?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s what\u0026apos;s important. Even if you can\u0026apos;t shoot, as long as you don\u0026apos;t get shot, that alone is a huge plus for the class. You should remember that the value is the same.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe point was to keep remaining until the very end, even if more classmates were eliminated from that point on.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter thinking for a moment, Yamamura gave a small, but definite nod.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 1\",\"volumeId\":\"y3v3\",\"chapterIndex\":23,\"prevChapter\":{\"volumeId\":\"y3v3\",\"chapter\":22,\"title\":\"Chapter 3: The Unseen Pressure\"},\"nextChapter\":{\"volumeId\":\"y3v3\", iance\",\"href\":\"c5.xhtml\",\"index\":34},{\"label\":\"Part 1\",\"href\":\"c5p1.xhtml\",\"index\":35},{\"label\":\"Part 2\",\"href\":\"c5p2.xhtml\",\"index\":36},{\"label\":\"Part 3\",\"href\":\"c5p3.xhtml\",\"index\":37},{\"label\":\"Part 4\",\"href\":\"c5p4.xhtml\",\"index\":38},{\"label\":\"Chapter 6: The Real Goal\",\"href\":\"c6.xhtml\",\"index\":39},{\"label\":\"Part 1\",\"href\":\"c6p1.xhtml\",\"index\":40},{\"label\":\"Part 2\",\"href\":\"c6p2.xhtml\",\"index\":41},{\"label\":\"Part 3\",\"href\":\"c6p3.xhtml\",\"index\":42},{\"label\":\"Part 4\",\"href\":\"c6p4.xhtml\",\"index\":43},{\"label\":\"Part 5\",\"href\":\"c6p5.xhtml\",\"index\":44},{\"label\":\"Part 6\",\"href\":\"c6p6.xhtml\",\"index\":45},{\"label\":\"Chapter 7: The Time of the Decisive Battle\",\"href\":\"c7.xhtml\",\"index\":46},{\"label\":\"Part 1\",\"href\":\"c7p1.xhtml\",\"index\":47},{\"label\":\"Part 2\",\"href\":\"c7p2.xhtml\",\"index\":48},{\"label\":\"Part 3\",\"href\":\"c7p3.xhtml\",\"index\":49},{\"label\":\"Part 4\",\"href\":\"c7p4.xhtml\",\"index\":50},{\"label\":\"Part 5\",\"href\":\"c7p5.xhtml\",\"index\":51},{\"label\":\"Epilogue: Show Me What You’ve Got\",\"href\":\"e.xhtml\",\"index\":52},{\"label\":\"Part 1\",\"href\":\"e1.xhtml\",\"index\":53},{\"label\":\"Author's Afterword\",\"href\":\"authors-afterword.xhtml\",\"index\":54}],\"volumeTitle\":\"Light Novel 3rd Year Volume 3\",\"detailsLink\":\"/select/year-3/y3v3\",\"returnLink\":\"/select\",\"currentSpineIndex\":23,\"nextVolumeLink\":\"$undefined\",\"nextVolumeTitle\":\"$undefined\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__nex
