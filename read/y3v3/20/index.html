e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T2ae8,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 3\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eGOING BACK ABOUT thirty minutes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was right when Kaneda used his strategy to halt the GPS locations of everyone in Class B.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIchinose just finished checking everything she could do on the commander\u0026apos;s tablet.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOn the map of the uninhabited island displayed, the four GPS colors assigned to each class were flashing according to the number of remaining students.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor her own class, Class D in Ichinose\u0026apos;s case, she could tap on the green GPS markers to open their tags and constantly keep track of who was who. In contrast, for the other three colors\u0026#x2014;red, blue and yellow\u0026#x2014;tapping them only brought up a blank tag.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, since it was possible to freely enter text into these tags, one could input a name if they knew who the GPS belonged to, or a role if their position was discovered. It could also be used to mark students who were making suspicious moves.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe looked away from the tablet for a moment, placed it on the simple table set up in front of her tent and took the radio in one hand and started to walk slowly around the headquarters area.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe did that to check who the commanders of each class were and what they were up to.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDuring the exam, the commanders were bound by an unexpectedly troublesome restriction.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey were forbidden from talking to or communicating with the other commanders.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if she wanted to contact Ayanokouji, actions like calling out to Shimazaki to ask him to pass on a message were impossible.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFurthermore, there was a physical distance between the tents, making it difficult to overhear the voices of the other class commanders speaking normally. If one were to force their way closer, there was a risk of being perceived as attempting to communicate, so they couldn\u0026apos;t approach carelessly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd this didn\u0026apos;t just apply to interactions with other commanders.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I guess it\u0026apos;s impossible after all.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe commanders were forbidden from leaving the designated headquarters area and from within that area, it was structured in such a way that they couldn\u0026apos;t make contact with the students participating in the exam, no matter how hard they tried.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if students made their way to the headquarters, direct conversations with a commander wasn\u0026apos;t possible.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn other words, they had to convey their voice to their own class\u0026apos;s VIP through the radio.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was the only way commanders were permitted to intervene with others.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was why, in the opening stage, they reported the information from their tablets every five minutes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo see if there was a risk of an enemy class engaging with them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince that was what they needed to confirm, it could be said to be a natural course of action.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs Ichinose watched the similar exchanges between the three from a distance, she noticed something.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKaneda, the commander of Class B, was the only one who was constantly talking into his radio.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe also touched his tablet without a moment\u0026apos;s rest, as if he were in a hurry for something.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf that had been all, Ichinose wouldn\u0026apos;t have grown so suspicious, but despite the situation, Kaneda looked up just once and spotted Ichinose observing him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA calm, normal face, as if to say, \u003cem\u003e\u0026apos;What is it?\u0026apos;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen Ichinose smiled and gave a small wave, Kaneda gave a slight nod with just his head before immediately returning his gaze to the tablet and resuming his conversation with the VIP on the radio.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA natural response. But to Ichinose, it seemed unnatural.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIchinose slowly returned to her tent and once she was out of Kaneda\u0026apos;s sight, she picked up the tablet she had left on the table.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The place where Ryuuen-kun and the others are hasn\u0026apos;t changed much from five minutes ago. Hmm, they haven\u0026apos;t moved at all.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was safe to assume there would always be some margin of error with the satellite signal due to the basic limitations of GPS.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn other words, even if everyone was sitting perfectly still, it wouldn\u0026apos;t be strange for at least one of them to move slightly. However, she could see no difference whatsoever between their positions five minutes ago, as she remembered them and their current positions.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Has Kaneda-kun already stopped the GPS? If so... why?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe answer to that was obvious, even without Ichinose having to ask herself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was because he judged that using his trump card, the GPS shutdown right at the start of the exam would be effective enough.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA plan to attack Class C, who were located closest and were the most likely to have stopped moving.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, the possibility wasn\u0026apos;t a certainty, but it was better to warn them of the danger just in case.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThinking this, Ichinose hurriedly moved to a position where Shimazaki could see her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSpeaking, gesturing, or even mouthing words would be a strict violation of the rules, so Ichinose wouldn\u0026apos;t and couldn\u0026apos;t risk it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut she decided that the act of just staring at Shimazaki probably wouldn\u0026apos;t fall under the category of communication. If she received a warning, she would just have to back down then.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf they made eye contact, he might realize that she was trying to tell him something.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, Shimazaki\u0026apos;s attention was focused on operating his tablet and he didn\u0026apos;t look up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor a minute, then two, Ichinose continued to stand there, waiting for Shimazaki to look up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFinally, just as five minutes were about to pass, he looked up and lightly rolled his neck as if to loosen his stiff muscles. His eyes met Ichinose\u0026apos;s for a moment, but that was all. Shimazaki immediately dropped his gaze back to his tablet.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom his perspective, Ichinose was an enemy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd he was also keenly aware of the rule that forbade any communication.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s... no good.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was no way for Ichinose to warn Class C of the danger any further.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBelieving that interfering too much risked a penalty for Class D and that it would be even more dangerous to stay too long and draw Kaneda\u0026apos;s attention, Ichinose reluctantly distanced herself from the area and returned to her own tent.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOver the radio, she spoke with Class D\u0026apos;s Kobashi, firmly emphasizing their safety and instructing them to avoid combat on the first day to focus only on events, also relaying a few possible routes in case other classes pursued them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFive minutes later, the GPS updated again. Ayanokouji\u0026apos;s Class C\u0026apos;s GPS was active, but their position was fixed; they were perhaps resting or having a strategy meeting. In any case, they were not moving. Meanwhile, the GPS for Ryuuen\u0026apos;s class was also completely stationary.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;As I thought... Given the time, they might be reaching Ayanokouji-kun\u0026apos;s group right about now...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAn anomaly that Ayanokouji would have surely noticed had he been the commander.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe frustration of sensing it but being unable to tell the other class.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIchinose prayed for Class C\u0026apos;s safety.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat Class B was trying to exploit was a weakness in Class C.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe understood well that in this special exam, the brain and the body were separate.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIchinose was impressed, judging that the decision to take them by surprise was the correct one if Shimazaki was the commander.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBeing caught by surprise might have been unavoidable, but even so, Ayanokouji would not be completely wiped out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf so, Ichinose considered what would happen next.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf they suffered a devastating blow, Class C would be forced into a difficult fight.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat, then, would Ayanokouji do?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIchinose instantly judged that this was the best moment to bring up talk of an alliance and picked up her radio.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2014;-I want you to listen to me very carefully.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSo from that point on, Class D could rush in at any time to help Class C\u0026#x2014;no, to help Ayanokouji.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 3\",\"volumeId\":\"y3v3\",\"chapterIndex\":20,\"prevChapter\":{\"volumeId\"
