e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T7c5f,"])</script><script>self.__next_f.push([1,"\u003ch1 class=\"heading_1\"\u003e\u003ca class=\"heading-link\" href=\"/read/y3v3/2\"\u003eChapter 2:\u003cbr/\u003eA Surprise Attack\u003c/a\u003e\u003c/h1\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNO MATTER HOW much my abilities began to be recognized, their distrust didn\u0026apos;t disappear completely.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf they had any doubts about the policy, my classmates would immediately raise their voices in objection.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut the sight of me shouldering the resolve to be expelled, going beyond the mere title of leader, had a greater effect on my classmates than they could have imagined.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI described my first strategy to them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was to head north as soon as the exam began and be the first to cross G8.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eClass C, having started from E12, began to walk in a scattered formation toward the target area with me at the head of the group.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a cautious move, also to quickly escape the situation of being sandwiched between Ryuuen\u0026apos;s class to the west and Horikita\u0026apos;s class to the east.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was also the option of moving to area F13, right next to the headquarters, but if both Class A and B saw that and gave chase, we could\u0026apos;ve been cornered into D14, D15, E14 and E15, losing our escape route.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, we didn\u0026apos;t run or anything of the sort. Pushing through an unfamiliar forest, even if it was somewhat maintained, wasn\u0026apos;t easy and this was the result of weighing the consumption of stamina versus the risk of injury.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eLess than a minute after the special exam started, the first report reached Nishikawa, one of the VIPs.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;A call from Shimazaki-kun. He found out who the other classes\u0026apos; commanders are.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe audio received on our radio was connected to a single earpiece and it was only through this that we could pick up the voice of the commander, Shimazaki. In other words, Shimazaki\u0026apos;s voice was inaudible to those around us and of course, no one other than the three VIPs were allowed to listen directly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEach of the three radios was independent and it wasn\u0026apos;t possible to talk to Shimazaki at the same time. Therefore, the system required us to always choose one person to communicate with him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Let\u0026apos;s hear it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto, who reacted immediately to those words, stepped closer to Nishikawa.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe means of knowing who held what position in classes other than our own was very limited.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOnly the commanders were gathered in the same headquarters, so their identities were inevitably revealed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was the first piece of important information to come in regarding the distant, unseen enemy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s Matsushita-san for Class A, Kaneda-kun for Class B and Ichinose-san for Class D.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAmong the leaders of each class, it seemed only Ichinose had chosen to be the commander herself. It may have been a process of elimination, given that her athletic abilities weren\u0026apos;t particularly outstanding to begin with and that they lacked personnel who could fully demonstrate their skills as commander.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMatsushita becoming commander was both surprising and fitting.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eClass A had several smart students, but for better or worse, they were similar in type to the students of Class C\u0026#x2014;your typical honor students. They weren\u0026apos;t particularly adept at exploiting loopholes in strategy or noticing anomalies. In that context, the choice of Matsushita wasn\u0026apos;t bad and she could be called one of the suitable candidates.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs for Kaneda, it could be simply described as a safe and solid choice.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t think he would display any remarkable talent, but I also didn\u0026apos;t think he would make any major mistakes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBefore long, my watch vibrated once in a short burst and displayed E11, as if to inform us that we\u0026#x2019;d entered a new area.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So this is how ya figure out when you\u0026apos;ve moved areas, huh? It\u0026apos;s convenient, I guess... but it\u0026apos;d be a real pain in the ass to rely only on the watch to travel long distances.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf we knew our current area and bearing, we could manage for the most part, but in reality, it was difficult to keep moving in the same direction and we would be forced to take detours. It would probably be better to avoid traveling for long periods without support from the commander.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile we were doing that, five minutes passed and the time came for the first GPS update. It was a crucial moment to learn how each class moved from their initial positions.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat time, the report went to Takemoto.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey\u0026apos;d probably switched from Nishikawa, likely to check if radio communications were working without issue.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter Takemoto conversed on the radio for a few dozen seconds, he spoke with a look of relief.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;He says we can relax for now. It looks like all of Class B\u0026apos;s GPS signals are heading straight north, into area C11. And, uh, Class A is apparently in G11, also to the north.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s a relief we\u0026apos;re not starting off with a battle, but this means we haven\u0026apos;t escaped the pincer move, huh.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as Hashimoto muttered, if all three classes had simply moved north from their original areas, it couldn\u0026apos;t be called an improvement in our situation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But at least we\u0026apos;ve confirmed that neither Class A nor Class B wants to fight from the get-go. That alone isn\u0026apos;t so bad.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTakemoto said that if they intended to fight as soon as possible, they would\u0026apos;ve had to move toward Class C\u0026apos;s position.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What about Class D?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed they hadn\u0026apos;t heard any information about Ichinose\u0026apos;s class, the farthest away, so he asked back on the radio. Before long, a reply seemed to come back and Takemoto looked at me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;He says Class D started walking toward J12, so, to the east. They plan on keeping their distance completely.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTheir favorable starting position probably had something to do with it, but it could be called a choice typical of them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom this first report alone, I could clearly see that Class D\u0026apos;s policy was to avoid pointless conflict.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We don\u0026apos;t need to pick up the pace, then? If Class A is aiming for G8, there\u0026apos;s a high chance they\u0026apos;ll get there ahead of us, y\u0026apos;know?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto, walking right behind me, asked me in a low voice if there was any change in our policy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even if we were to pick up the pace, the enemy would find out within five minutes. If they knew we\u0026apos;d quickened our movement, Class A would do the same. That would be nothing more than an act that increases risk.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the first place, we weren\u0026apos;t at a distance where we could overtake them in a mere five minutes from the start.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf we provoked the enemy and it turned into a race, that would only heighten the tension leading to a confrontation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If a fight breaks out recklessly, Class B might join in, huh...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s the situation. I don\u0026apos;t want to do anything that would give another class the chance to profit from our conflict.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter walking north within the same area for about five more minutes, ten minutes passed since the start of the exam.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah, yeah. Go ahead.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed a voice had come through on the radio, as Nishikawa responded immediately.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had figured the next report would be from Shiraishi, but apparently that wasn\u0026apos;t the case.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What are the other classes\u0026apos; movements? Has anything changed?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah, sorry, but hold on a sec. I\u0026apos;m listening to it right now.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShimazaki\u0026apos;s voice came from her right ear and Hashimoto\u0026apos;s from her left. As she seemed to have been spoken to by both at nearly the same time, Nishikawa made a momentarily annoyed face as she focused her attention on the radio.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMorishita pointed a finger at Hashimoto, making fun of him as he apologized with a gesture.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo matter how important this special exam was, the mood was probably to be expected since we hadn\u0026apos;t entered a tense situation yet.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If they keep heading north, Class A will be fine, but I wonder what Class B will do. Will they cut through the area from C7 to D6 where the slope is relatively gentle? Or will they stop partway...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto imagined each class\u0026apos;s route of travel while glaring at the map.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But in the end, it all depends on the event placement, I guess. If they\u0026apos;re concentrated in the south, they\u0026apos;ll probably turn back. What\u0026apos;ll we do if an event pops up at about the same distance for both of us?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course, it also depends on the number of other events and the amount of supplies we can actually get, but in a situation where we\u0026apos;re already short on food for the day, carelessly passing one up might be an irreversible mistake.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if we could endure the hunger and get through one night, on the second day, a significant drop in stamina would inevitably have a major negative impact on our movement, combat ability and health.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So, that means you\u0026apos;re thinking that you\u0026apos;ll fight from the start if necessary, Ayanokouji?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah. If I determine the supplies are necessary, I\u0026apos;ll go for them without hesitation.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI conveyed my clear policy on engagement, which had been vague up until now, to my classmates via Hashimoto.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Yeah, thanks. I\u0026apos;ll pass it on.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe exchange seemed to be over, as Nishikawa looked up with a smile.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;They say Class A is heading north at an unchanged speed. And it looks like all of Class B\u0026apos;s GPS signals moved a little away from us to the northwest. They\u0026apos;re near B10.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto, who\u0026apos;d been waiting for the report, map in hand, immediately pointed to it to confirm the details.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe never neglected communication with the commander.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe GPS location information, updated once every five minutes, would be essential in close-quarters environments.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If Ryuuen and his crew are heading for B10, that means they\u0026apos;ll come out by the sea. I don\u0026apos;t know if they\u0026apos;ll keep heading north, but it\u0026apos;s a relief that the lateral distance has increased. So for now, I guess we should be wary of Class A?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf we proceeded at the same speed, by the time Class A reached G8, we would be about to enter F9. We would be allowing them to get completely ahead of us.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If by some chance they ambush us, we might not be able to get through... What\u0026apos;s the play, Ayanokouji?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere were many options. We could pick up the pace now and at the five-minute GPS update, the commander, Matsushita, would notice the change and inform Class A, causing them to turn back for fear of a clash. Or, they could accelerate to be the first to break through to the northern area, thinking they absolutely had to get there first. The latter was more likely and in that case, we could deliberately slow down and let Horikita\u0026apos;s group go ahead. Alternatively, we could turn back to the starting point now, or stop and remain in the current area.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If we just head straight for G8 without a second thought, won\u0026apos;t we be starting a disadvantageous fight?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;About that\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as I was about to state my policy, Yoshida approached.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I think getting into a fight right now would be bad news. We should stop for a bit and let Class A go on ahead. It\u0026apos;s not like we\u0026apos;ll be in trouble just because they get the lead, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah. It all depends on where the events appear. For now, there\u0026apos;s no advantage or disadvantage.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you decide to fight, I\u0026apos;ll follow you. But, isn\u0026apos;t there something we should be doing first? We don\u0026apos;t even really know how to use these guns yet.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYoshida\u0026apos;s concern was a problem all my classmates shared.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was why they were paying close attention to Horikita\u0026apos;s class, with whom the probability of our routes overlapping was increasing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut it wasn\u0026apos;t just Class A we had to watch.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So why don\u0026apos;t we get on with a lecture on how to handle weapons and stuff?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m in agreement with that opinion.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMorishita spoke while pulling on the sleeve of my left arm, her shoulders rising and falling in short breaths.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you tired already? You\u0026apos;re out of breath.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That couldn\u0026apos;t possibly be the case. It\u0026apos;s merely that this morning, I had an excess of energy and repeatedly dashed through the ship at full speed for about an hour. Perhaps that\u0026apos;s why I\u0026apos;ve accumulated some slight fatigue.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTrue to her self-proclaimed title of \u0026apos;Amazoness of the Dense Forest\u0026apos;, she seemed to impose a considerable burden on herself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Got it. Let\u0026apos;s let Class A go on ahead. We\u0026apos;ll wait here for now.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was Hashimoto who was surprised by that decision.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you for real? You agreed to that pretty easily.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto seemed to think that as long as a conflict could be avoided, he didn\u0026apos;t care whether we went to the northern area first or second, but my acceptance of our classmates\u0026apos; opinion seemed to have sparked some dissatisfaction and doubt in him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe was probably worried that I didn\u0026apos;t have a clear policy yet.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not like I decided this because Yoshida told me to. I was also thinking we should wait and see for a bit.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What, is that right? Then I guess this is your decision, Ayanokouji.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto muttered, convincing himself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed to have served as some reassurance, as he accepted the policy without any further complaints.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI turned back to the classmates who were following me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ten minutes have passed and we\u0026apos;ve gotten a small glimpse of each class\u0026apos;s intentions. Our primary objective was to pass through G8 first, but allow me to revise that. First, we\u0026apos;ll learn how to properly handle our weapons here and once we\u0026apos;re ready to fight, we\u0026apos;ll check the GPS positions again. From there, I\u0026apos;d like to search for a new route.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sounds good to me. I doubt anyone\u0026apos;s gonna argue with that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe switched to preparing for battle. Many of the students, led by Yoshida, were relieved by that decision.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe time immediately changed to one of confirming how to use the paintball guns with each other, deepening our understanding even if just a little.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, no matter how many simulations we ran, there was much experience that could only be gained in actual combat.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe would never get a true feel for it until we actually pulled the trigger.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFive minutes passed quickly after we stopped and the latest GPS information was finally sent from the commander to Shiraishi.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen\u0026apos;s class seemed to have shifted slightly further northwest, but their movement was weaker than before and their progress slowed to a crawl. On the other hand, Horikita\u0026apos;s class was passing through G10 at the same pace as before and they appeared to still be heading for G8. And Ichinose\u0026apos;s class, who\u0026apos;d chosen a completely different route, was continuing endlessly eastward.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s new information from Shimazaki-kun. It seems one GPS from Class A has split off and is heading towards H9. Do you know what this could mean?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;H9? On his own?...Does that mean it\u0026apos;s Koenji?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eH9 was in the direction of the mountains. I wouldn\u0026apos;t be surprised if Koenji headed off alone to enjoy some mountain climbing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If he\u0026apos;s not planning to participate seriously, that\u0026apos;s convenient for us, but... you don\u0026apos;t think he\u0026apos;s getting fired up like on the deserted island last year, do you? How should I take this?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto questioned me, his former classmate, about Koenji\u0026apos;s movements.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eLast year\u0026apos;s deserted island exam, which all of the school years participated in.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe shock of him taking first place all by himself was likely still fresh in the minds of the second and third years alike.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I can\u0026apos;t say for sure, but if anything, the usual Koenji has no motivation. In almost every exam, he does as he pleases, just like in the deserted island exam two years ago where he briefly enjoyed the island and then retired on his own without cooperating with the class at all. Last year\u0026apos;s deserted island exam was an exception to the exception, solely because Koenji himself proposed a condition to Horikita: \u0026apos;complete freedom until graduation,\u0026apos; and promised she would acknowledge it if he took first place. Conversely, he also had her promise that if he placed second or lower, he would cooperate in the next exam.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, damn. So Horikita got him to contribute to the class with his performance, but she lost the bet. She probably never dreamed he\u0026apos;d take first place all by himself. Which means, Koenji\u0026apos;s clearly a free agent now. If that\u0026apos;s the case, that\u0026apos;s a huge help.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s right. If Koenji were to participate, he wouldn\u0026apos;t be an easy opponent.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat being said, there was still no confirmation that the student who started acting alone was Koenji.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was true that Koenji wasn\u0026apos;t the type of man to cooperate voluntarily, but that wasn\u0026apos;t necessarily the case when Private Points were involved. If someone were to offer him points from their own pocket in addition to the deserted island exam\u0026apos;s reward, it was possible he would lend a hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI should reserve judgment until I could see the state of Horikita\u0026apos;s class with my own eyes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Wouldn\u0026apos;t it be a good idea to have the commander use a tactic?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSanada recommended using the person identification tactic.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Nah, we shouldn\u0026apos;t use it yet. This could be a strategy to get us to waste one of our tactics. Besides, if he\u0026apos;s not gonna participate, it\u0026apos;s a waste to use it on a guy like that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto, on the other hand, voiced his opposing opinion that we should still save it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf someone were to split off and act alone, there was a 90% chance it was Koenji.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs long as he didn\u0026apos;t rejoin Class A somewhere, it wouldn\u0026apos;t be difficult to keep tracking him on the tablet. However, once it hit 6:00 p.m., the GPS wouldn\u0026apos;t update again until 9:00 a.m.\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Have the commander identify the GPS of the student who started acting alone.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...You sure? It\u0026apos;s almost definitely Koenji.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t mind. It\u0026apos;s worth a try. Let\u0026apos;s use one as a test.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNodding, Shiraishi began to notify Shimazaki to use a tactic on the student who separated from Class A.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe results would be known soon after this.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBefore the results came back, I decided to ask Nishikawa to pass on a message as well.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Nishikawa, I need you to contact Shimazaki.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? Now? Isn\u0026apos;t he still talking to Asuka?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It doesn\u0026apos;t matter. Try contacting him.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Mm, okay.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith that, Nishikawa operated the radio, but she immediately removed her earphone and shook her head.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not connecting.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see. So when a VIP is talking to the commander, the line is busy and you can\u0026apos;t get through.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh, so that\u0026apos;s it... That\u0026apos;s what you wanted to find out.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn other words, the line was basically one-to-one, with no interruptions. For example, if the VIP was far away, you couldn\u0026apos;t speak simultaneously. You had to disconnect and reestablish the link each time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then, after he\u0026apos;s done talking with Shiraishi, I need you to pass on the message.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So there really is something to report. Okay, what should I tell them?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Tell them I want to know the movements of the three classes every five minutes until the event starts. After that, it\u0026apos;ll depend on the event\u0026apos;s content, but if the situation seems to have calmed down, we\u0026apos;ll take a short break.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlthough the GPS positions updated every five minutes, it would\u0026apos;ve been wasteful to communicate every single time the clock struck the five-minute mark.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was because the commander and the VIP would shoulder unnecessary fatigue from the seemingly endless task.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Got it. I\u0026apos;ll let them know.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNishikawa put the radio and the connected earpiece back into her right ear.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen, Nishikawa began to relay my message to the commander, Shimazaki, rephrasing it in her own words. And as if taking her place, Shiraishi, who\u0026apos;d just finished her communication, approached me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I was able to confirm that the GPS at H9 is Koenji-kun\u0026apos;s. His role is apparently a guard.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So it\u0026apos;s that guy, huh. Let\u0026apos;s just pray he goofs around for a bit and then calls it quits.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Understood. For now, let\u0026apos;s move on to the next matter.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIncluding the handling of the weapons, I decided to take care of one problem first.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Let\u0026apos;s decide on our positions and formation for when the whole class moves together from now on. Depending on the width of the path, we\u0026apos;ll basically have two to four people side by side. For the VIPs\u0026apos; positions, we\u0026apos;ll disperse the risk by placing one in each row: Shiraishi in the front, Takemoto in the middle and Nishikawa in the rear.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI assigned each and every classmate to one of the three groups, just like the VIPs.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the front row, I placed Hashimoto and Kitou as the main guard protecting the rear.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI placed a larger number of students who seemed poor at exercise and combat in the middle row.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hey, wouldn\u0026apos;t it be better to have Nishikawa in the front? She can really move when it counts, y\u0026apos;know?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I considered that at one point, but I figured it\u0026apos;s important to place someone who can react instantly in the rear precisely because she can. Besides, Shiraishi isn\u0026apos;t good at raising her voice and it won\u0026apos;t carry far. But Nishikawa, on the other hand, has a loud voice.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen communicating from a distance, there was a potential risk of not being heard.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see, so the merits far outweigh the demerits, huh.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In any case, the focus is on avoiding a situation where we could be wiped out all at once by dividing the class into three groups beforehand. Whether we\u0026apos;re heading to multiple locations for an event, or if we happen to get separated unintentionally, as long as we move with the VIPs at the center, it\u0026apos;ll be easier to regroup later.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust then, Morishita approached, weapon in hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m not pleased with being placed in the middle row, Ayanokouji Kiyotaka. I\u0026apos;m the main strength of this class.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;ve got some nerve coming here to complain, Morishita... The middle suits you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eExasperated, Hashimoto shooed her away with his hand, telling her to return to the middle row.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;To demote me and place a traitor in the front row instead... It seems we\u0026apos;ve been saddled with an incompetent leader. Let us go, Yamamura Miki.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I-I\u0026apos;m... in the front row...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh? So in addition to a traitor, you\u0026apos;ve appointed tissue paper to the front row. You are beyond saving.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo be spoken to like that just for deciding the formation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMuttering complaints, Morishita headed toward the middle row.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd as soon as she reached the middle row, she looked back at us and shook her head in exasperation. I decided to ignore her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had Shiraishi relay the details of how we divided the rows, including the VIPs, to Shimazaki.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom now on, this would also serve as a guide for Shimazaki to look at his tablet and decide who to contact via radio depending on the situation.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 2: A Surprise Attack\",\"volumeId\":\"y3v3\",\"chapterIndex\":17,\"prevChapter\":{\"volumeId\":\"y3v3\",\"chapter\":16,\"title\":\"Part 3\"},\"nextChapter\":{\"volumeId\":\"y3v3\",\"chapter\":18,\"title\":\"Part 1\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 3\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":11},{\"label\":\"Prologue: Shiina Hiyori's Monologue\",\"href\":\"prologue.xhtml\",\"index\":12},{\"label\":\"Chapter 1: Opening. Survival Game Special Exam.\",\"href\":\"c1.xhtml\",\"index\":13},{\"label\":\"Part 1\",\"href\":\"c1p1.xhtml\",\"index\":14},{\"label\":\"Part 2\",\"href\":\"c1p2.xhtml\",\"index\":15},{\"label\":\"Part 3\",\"href\":\"c1p3.xhtml\",\"index\":16},{\"label\":\"Chapter 2: A Surprise Attack\",\"href\":\"c2.xhtml\",\"index\":17},{\"label\":\"Part 1\",\"href\":\"c2p1.xhtml\",\"index\":18},{\"label\":\"Par
