e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T1a6d,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 1\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAFTER PROCEEDING THROUGH the forest for about five minutes, the two of us arrived at our destination.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2014;Halt.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe Class D students must have been watching the two signals on their GPS heading toward them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTen male students, led by Kanzaki, formed a wall to protect their classmates behind them, mercilessly pointing their guns at us.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Looks like we\u0026apos;re gettin\u0026apos; a warm welcome.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFaced with a reception that made it impossible to hide, let alone escape, it seemed Hashimoto could only laugh.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We have no intention of attacking.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto and I raised our hands, showing that we held nothing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I wonder about that. There\u0026apos;s a possibility your allies are hiding nearby.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Nah, that ain\u0026apos;t it. You guys are always watchin\u0026apos; the GPS, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If your commander is using tactics, that\u0026apos;s not necessarily the case, as you should be well aware.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Nah, you can only fake out the whole GPS or an individual\u0026apos;s GPS, one or the other, y\u0026apos;know? There\u0026apos;s no way to freeze the GPS of only the people other than us.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;However, it is possible to target up to three people individually.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe possibility that we had three allies use the individual GPS jamming tactic to outsmart them and lie in wait behind us, or somewhere nearby, couldn\u0026apos;t be denied.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat Class D was wary of were three invisible, armed enemies.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile it might not have been enough to overturn a situation where they were at an overwhelming disadvantage, it could be called the only way to inflict major damage.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Just three people ain\u0026apos;t gonna do nothin\u0026apos;.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you were to jam the entire GPS right this instant, it would no longer be limited to three people. Am I wrong?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Fair point.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKanzaki declared to Hashimoto that there were any number of ways to deceive Class D.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But in reality, we have no desire to fight Class D. First, let us talk.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s no need for that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSaying that, Kanzaki approached us, his gun still raised.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It seems you were caught in a surprise attack by Ryuuen and lost the morning battle as well.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So you got a good look at our pathetic state, huh.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If we defeat the two of you here, we can significantly lower our chances of coming in last. This is a golden opportunity.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That might be true if you\u0026apos;re only looking at this special exam. However, even if you defeat us, there\u0026apos;s no guarantee you can beat Class A and Class B. Your goal isn\u0026apos;t to avoid last place, but to aim for the top. Surely you understand that much without Ichinose having to tell you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlthough they\u0026apos;d been wounded by Koenji, it remained doubtful just how much of an advantage Class D could gain against Class B, who already had combat experience, with numbers alone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Let\u0026apos;s join forces. That way, Class C and Class D can form a group of fifty.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;An alliance... What if we trust you and are betrayed? That would be a crisis for our class.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlthough he wore a stern expression, I didn\u0026apos;t get a strong sense of hostility from Kanzaki.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s why I refuse\u0026#x2014;or rather, it\u0026apos;s not that I don\u0026apos;t feel like saying that and sending you away... but I can trust you, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe atmosphere changed. It was a reaction as if he already understood everything about why we came.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIchinose, their commander, had likely already given them some sort of message.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Right now, we need Class D\u0026apos;s help. And we believe we can be the strength that Class D needs.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs soon as I answered, Kanzaki lowered the gun he\u0026apos;d been holding.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs if on cue, the boys standing behind him all lowered their guns at once.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You can bring your allies. As you wish, let\u0026apos;s talk first.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m grateful we didn\u0026apos;t get shot, but... you\u0026apos;re being awfully reasonable, aren\u0026apos;t ya?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto, whose imagination hadn\u0026apos;t yet reached the behind-the-scenes interactions between Ichinose and Class D, suspected this might be a trap to lure us in.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ichinose told us that Class C might make contact at some point. She also warned us not to make the first move until we were attacked.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, what do you know\u0026#x2014; You\u0026apos;re sayin\u0026apos; Ichinose saw it comin\u0026apos; that we\u0026apos;d ask for your help?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I also heard about the alliance. Considering that, a request for cooperation is hardly a stretch.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe shifted his gaze from Hashimoto to me, so I gave a slight nod.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 1\",\"volumeId\":\"y3v3\",\"chapterIndex\":35,\"prevChapter\":{\"volumeId\":\"y3v3\",\"chapter\":34,\"title\":\"Chapter 5: The Alliance\"},\"nextChapter\":{\"volumeId\":\"y3v3\",\"chapter\":36,\"title\":\"Part 2\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 3\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis
