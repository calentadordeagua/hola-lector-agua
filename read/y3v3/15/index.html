e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T6a2b,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 2\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOUR STARTING POSITIONS were decided by lottery and we would start from area E12. Ryuuen\u0026apos;s Class B was in C12, Horikita\u0026apos;s Class A in G12 and Ichinose\u0026apos;s Class D in I12.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSanada apologized for failing to secure an advantageous corner area, but I told him not to worry about it, since there was nothing we could do about it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen, moving on to the next step, we were guided in front of some cardboard boxes where an explanation regarding the class-specific supplies began.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What we have here are the initial supplies given to each class; the contents are common to every class. Regarding the items here, you may take everything here or leave behind whatever you deem unnecessary. However, once the exam starts, any leftover supplies will be collected, so you won\u0026#x2019;t be able to add more later. Bearing that in mind, judge amongst yourselves what is necessary.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA maximum of three nights and four days. We would have to think carefully about what to take with us.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor now, since there could be no discussion without knowing the contents, we decided to check the inside of the cardboard boxes directly. What immediately caught my eye was an unwelcome reality. It was a meager amount of food that anyone could see was vastly insufficient.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026#x2019;s hardly any food... Isn\u0026apos;t this less than a day\u0026apos;s worth?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe only food provided was nutritional supplement blocks and mineral water. Upon counting, there were only two per person for the class and there was absolutely nothing else edible.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed they\u0026apos;d only prepared enough to last through the upcoming lunch.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If we want food, we have to secure it from the event supplies no matter what, huh... They\u0026#x2019;re really something.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf event supplies became essential to secure food, the necessity of participating in events would be essential, whether we liked it or not. Naturally, the risk of matching up against other classes would increase significantly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe could ignore the events, but practically speaking, it was likely designed so that the initially supplied materials alone would definitely be insufficient. To induce combat, such forceful measures might indeed have been necessary.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Looking at the rules, if we can keep running away, we won\u0026apos;t lose for the time being. Paintballs won\u0026apos;t be consumed unless we fight, but the food problem is unavoidable.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi picked up a box of nutritional supplement blocks and said that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was an undeniable fact; the classes that failed to secure food would see their range of strategies narrow, become impatient, challenge others to reckless battles and drop out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhether to take risks and retrieve supplies or avoid risks and endure the lack of supplies.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOr perhaps a balanced strategy that took the middle ground.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlready, the discussion within the class was heating up. Opinions were beginning to diverge.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I definitely think aiming for nearby events is dangerous. If we\u0026apos;re going to shoulder the risk of fighting poorly and getting out, why don\u0026apos;t we just avoid Class A from the start and cross the mountain? That way, it\u0026apos;ll be easier for us to monopolize the events in the northeast area. Other classes wouldn\u0026apos;t bother traveling that far to fight us, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSugio, who\u0026#x2019;d been listening to the conversation while staring at the small amount of food supplies, proposed that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, Shimazaki immediately voiced his opposition.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m against it. Other classes might be thinking something similar. Besides, even if we force ourselves to cross the mountain, there\u0026apos;s no guarantee that events will necessarily occur in the northeast, is there?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was only the students who assumed they would be distributed evenly; we wouldn\u0026apos;t know the actual distribution until we started.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In that case, I think it\u0026apos;s better not to go too far from the starting point until the first event begins.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf we went with the plan Sugio first proposed, we might have been able to avoid combat, but it entailed many risks. In addition to the stamina drain of crossing mountains, there was the uncertainty of event appearances. And the movements of our rivals. None of these could be taken lightly. Deriving a correct answer at this stage was impossible, even for me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo head north on this uninhabited island via the shortest and safest route, one had to pass through the narrow riverside area in G8. It was conceivable that if we chased after Class A, who had the closest starting position to us, they would likely rush there first. That could plunge us straight into battle\u0026#x2014;or something of that sort.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Not moving, huh? I don\u0026apos;t intend to deny that, but if we do that, it means we\u0026apos;re resolving ourselves to a shootout right from the start, doesn\u0026apos;t it? If, by some chance, three VIPs get taken out because of that\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNever mind three nights; the outcome could be decided within an hour of the exam starting.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSugio imagined such a worst-case vision and voiced it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Okay, okay. I get what you want to say, Sugio, but for now, let\u0026apos;s look at the other supplies before we argue about that. Our leader will squeeze out a good idea for us in the meantime.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto cut in between their gazes and urged them on.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnyone could offer an opinion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, if one pushed that opinion through, responsibility naturally followed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNeither Sugio nor Shimazaki possessed the resolve to shoulder that burden.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...True enough.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd so, they paused the discussion and left the judgment to the leader.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe strategic path was put on hold, but that didn\u0026apos;t mean the tense atmosphere vanished.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn this exam where combat and movement were frequently required, it couldn\u0026apos;t be helped that the majority of the class was becoming sensitive.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePrecisely because the members of Class C had their strengths skewed toward academics, it was proof that they unconsciously held a strong desire to absolutely avoid making the wrong choice.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShelving the opening moves and the food issue for a moment, I checked the next cardboard box and small items like paper maps, ballpoint pens, toothbrushes and sanitary products came out. According to Mashima-sensei\u0026apos;s supplementary explanation, it seemed these items could be taken out freely during the exam period on the condition that they weren\u0026#x2019;t discarded and were retrieved later. They weren\u0026apos;t bulky and it would be convenient and useful to have a few on hand, including some spares.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNext, I opened the large cardboard box. Tents, necessary and convenient for sleeping, revealed themselves, seemingly prepared in large numbers according to size.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Tents, huh? We need to think about what to take and how much right away. The question is how much of the thinking we should burden Ayanokouji with\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto looked at me as if asking for my opinion. I nodded once in response.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I will provide a guideline for what supplies are necessary and how much to carry. If there are objections, voice them then with your reasoning.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFirst, I would create a framework and then incorporate my classmates\u0026apos; opinions as necessary.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was likely the optimal method to avoid wasting time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRegarding life in tents, ideally everyone would use one tent per person. However, everyone carrying their own tent would be bulky and labor-intensive, reducing their mobility. Instead, we should narrow down the numbers from the start and focus on two-person and multi-person tents. That way it would be easier to alternate carrying them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMore important than that was how many people we needed to prepare for in total. As time passed, people were bound to retire. In other words, by the middle game\u0026#x2014;or if things went poorly, even the early game\u0026#x2014;large tents would become unnecessary and a reversal would occur where smaller one or two-person tents became more convenient. Since small tents were designed to be set up easily, they were also easier to prepare and pack up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile considering the balance of which and how many tents to bring, I turned my eyes to the last remaining group of cardboard boxes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eInside were the essentials: weapons for fighting.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;They look real up close. This is my first time touching something like this.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto immediately reached out and picked up an assault rifle. Counting them, there seemed to be a total of forty main weapons prepared: twenty assault rifles, ten submachine guns, and ten shotguns. Then there were two handguns as sub-weapons. Since each Guard could carry one main weapon to serve as their combat mainstay, it was possible for everyone to have one.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Man, the shotguns look hard to use, though. And they\u0026apos;re heavy.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI picked up the three types of main weapons one by one and checked them briefly. I wouldn\u0026apos;t know their true value until I actually used them, but as the initial quantities suggested, the assault rifle seemed to be the most user-friendly and well-balanced weapon. So, we\u0026#x2019;d likely choose submachine guns and shotguns only to make up for the shortage for the Guards.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If we start with zero analysts, it looks like we can take two extra guns; what will you do?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter checking the number of weapons, Morishita approached me and asked.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Getting slightly more paintballs is certainly an advantage, but we will need analysts immediately. Considering the trouble of carrying and managing the guns at that time, it\u0026apos;s hard to say if it\u0026apos;s worth it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was certain that weapons couldn\u0026apos;t be discarded on the spot like daily necessities; carrying them around and bringing them back was mandatory. If a Guard could use two weapons simultaneously, there might be irregular ways to use them, but that was against the rules and impossible, so any surplus would inevitably occupy someone\u0026apos;s hands.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEvery time an analyst or scout was eliminated, a new one would be appointed from the Guards, so the burden would increase.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We\u0026apos;ll go with a policy of not increasing our luggage.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So you don\u0026apos;t intend to take any surplus. At times like this, human psychology makes us want to prepare at least a little insurance; one tends to get greedy.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWhat if the weapon breaks? What if we run out of ammo?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was why people wanted to take as many weapons and as much ammo as possible.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf everyone could keep fighting without getting eliminated, having spare weapons and ammo would be reassuring.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTherefore, it was natural for the psychology of wanting insurance to come into play.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If we need something, we can just obtain it through an event. That\u0026apos;s what the rules are for.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, proceeding through the exam unscathed was difficult and there would undoubtedly be cases where students were eliminated without using up all of their supplies. Especially in this class, there were few students who could be relied upon offensively, so having surplus weapons and ammo was meaningless if they couldn\u0026apos;t hit anything. Besides, the candidates for surplus weapons would be the lightweight submachine guns, but each gun only had sixty rounds, including the spare magazine. Moreover, the magazine specifications were different from the assault rifles, so swapping ammo would require taking bullets out one by one, which was a hassle.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnother reason I reached that conclusion was that there were other ways to preserve supplies, such as collecting them from eliminated students if weapons ran short or stocking spare magazines in specific backpacks beforehand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, I\u0026apos;ll leave it to you. I want to push the responsibility onto Ayanokouji Kiyotaka anyway.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s fine.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter confirming the class\u0026apos;s intentions, I declared what we needed to Mashima-sensei and received the supplies.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBoys with strength and stamina took charge of heavy items like water, while those less athletic and the girls were made to carry only the minimum belongings, like their own underwear and toiletries, to minimize their burden.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s something I want to talk about before the exam starts. Listen up.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI called out to my classmates, who were doing a final check for missing supplies and had them turn towards me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I want to tell you about the case where we get wiped out first in this special exam.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You mean you\u0026apos;re talking about losing before we\u0026apos;ve even started? Why?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMatoba\u0026apos;s expression darkened slightly as he asked, maybe sensing something ominous.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOr perhaps he thought I was making excuses for defeat in advance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s an unavoidable penalty in that event. We\u0026apos;ll be forced to expel someone. To avoid conflict, I want to confirm\u0026#x2014;to decide\u0026#x2014;who will be expelled first.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith that statement, a tense atmosphere overflowed from the classmates.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s true that I don\u0026apos;t want to take the exam while thinking I might get expelled, but...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ayanokouji-kun, can we say that\u0026apos;s the right judgment?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSanada, having grasped the situation, also spoke up in agreement with Matoba.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No student in our class has a Protection Point. In other words, if we take the total wipeout penalty, someone is definitely getting expelled. It\u0026apos;s nothing but a hellish topic for that person.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs Matoba and Sanada said, few students would honestly accept a situation where their expulsion was confirmed if we lost.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Or rather, just because you\u0026apos;re the leader, you think you get to decide? Who gets expelled?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNot a single student wanted to volunteer for expulsion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven more so, if a newcomer like me were to wave the baton, the rejection would be strong.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Shouldn\u0026apos;t we just decide when we lose, including whoever screwed up during the exam? Or, since we\u0026apos;re all in this together, decide by drawing lots if we lose. That\u0026apos;s about the only way, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe people around me were clearly against deciding at that point, but I had my own thoughts.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hashimoto Masayoshi, it seems Ayanokouji Kiyotaka\u0026apos;s policy is already decided. I understand his decision without even receiving an explanation from him.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Seriously?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMorishita nodded confidently at the doubting Hashimoto.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If we end up receiving the penalty, then Hashimoto Masayoshi will be the first sacrifice to protect the classmates. This would be the fairest and most balanced conclusion.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see, if that\u0026apos;s the case, I accept\u0026#x2014;like hell I would...! Good grief, give me a break. I was an idiot for even thinking about listening seriously for a second.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is that so? I am speaking with absolute, total seriousness, you know? Don\u0026apos;t you think everyone other than Hashimoto Masayoshi would happily accept this proposal?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, if they\u0026apos;re safe themselves, I guess they would.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;See? Everyone\u0026#x2019;s saved. No unfortunate victims.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then are you saying it\u0026apos;s okay to make \u003cem\u003eme\u003c/em\u003e\u0026#xa0;the victim?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That can\u0026#x2019;t be helped. You\u0026#x2019;ll protect your classmates and become a star. A hero. Goodbye, Hashimoto Masayoshi. I will make sure to remember your existence for at least a week.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Only a week, huh? Though even if it were a year, I\u0026apos;d never accept it. Anyway, you just forced my name out there hoping to actually make me the sacrifice, didn\u0026apos;t you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo one welcomed having their name brought up as a candidate for expulsion in a situation like this.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBecause the spearhead inevitably tended to point toward those in the class who were prone to being disliked.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Tch, you noticed?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You seriously just clicked your tongue at me... I can\u0026apos;t let my guard down around you at all.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter glaring at Morishita for just a moment, Hashimoto looked at me with clear anxiety.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If Hashimoto is willing to volunteer, that\u0026#x2019;s fine, but unfortunately, I have already decided who will be expelled, and I won\u0026apos;t change it even if there are objections.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Wait a minute. I said this earlier, but just because you\u0026apos;re the leader doesn\u0026apos;t mean you can decide everything\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI raised my hand to stop Matoba as he tried to protest.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If we end up receiving the penalty, I\u0026#x2019;ll take on that role.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I answered that way, the noisy classmates fell silent in an instant.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven Mashima-sensei, who\u0026#x2019;d been listening silently with his arms crossed, lowered his arms, perhaps unconsciously.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Are you serious? You\u0026apos;re the leader.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Taking responsibility for defeat precisely because I \u003cem\u003eam\u003c/em\u003e\u0026#xa0;the leader. It sounds cool if I say it like that, but the reason is different. For better or worse, I\u0026#x2019;m an outsider. Not many days have gone by since I entered this class. If I, who joined to lead the class to victory, instead lead us to defeat, then bearing that responsibility is only logical.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, but, it\u0026apos;s not like this is an exam where you alone can completely control victory or defeat, right? It\u0026apos;s not exactly our class\u0026apos;s specialty, even if I wanted to flatter us, you know? In the first place, what happens to the future of the class if you\u0026apos;re gone?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Either way, you wouldn\u0026apos;t be able to trust a leader who lost miserably without being able to do anything, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...I see... Well, I guess you can certainly look at it that way...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat was required of the class, sinking in the lower ranks, was the basis for winning. That single point.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026#x2019;t entirely fail to appreciate your willingness to take responsibility as leader. If we\u0026#x2019;re forced to produce an expulsion, Ayanokouji Kiyotaka will disappear. Isn\u0026apos;t it fine for now? More than anything, we\u0026#x2019;re getting our immediate safety guaranteed for the time being.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMorishita said that it was better to leave it at that for now. Not to be cold, but rather in consideration of the mental burden on the classmates.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;However, if that really happens, you should offer yourself for expulsion through self-sacrifice, right, Hashimoto Masayoshi?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re really dying to sacrifice me no matter what, aren\u0026apos;t you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, unlike when he was first named, no strong rebuttal came.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePartly because arguing with Morishita was pointless, but there was another reason.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf I disappeared from the class, it was almost synonymous with Hashimoto himself disappearing. Now that he\u0026#x2019;d abandoned his chance to join other classes, there were virtually no other means for him to graduate in Class A. Of course, even if that actually happened, he wouldn\u0026apos;t accept it unconditionally and it wouldn\u0026apos;t be something he could be convinced of, but he might be able to resign himself to the fact that he couldn\u0026apos;t go to Class A.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe had no choice but to believe in my ability and stand pat for now.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWithout an alternative candidate, there were no other options.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Mashima-sensei. There is no problem with speaking about this decision to those around us, is there?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course. Whether the part about who\u0026#x2019;ll be expelled upon defeat is true or a lie, there is no problem with spreading it around in itself.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then, do you mind if I ask one favor?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What is it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;As I just said, in the event that an expulsion occurs in the class, I want to confirm it\u0026#x2019;s me. This is to prevent something like retracting it later. Announcing and determining it in advance is unrelated to the rules of the exam, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Are you truly serious about this?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course. These aren\u0026apos;t words that should be spoken merely to ease the anxiety of my classmates.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWithout a firm commitment, I\u0026apos;d be allowed to resist\u0026#x2014;to say \u0026#x2018;I won\u0026apos;t drop out after all\u0026#x2019; if we lost. Even while taking the verbal abuse from it, I\u0026#x2019;d be able to push the blame onto someone else.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026#x2019;m sorry, but according to the rules, I cannot make it definite at this stage. However, I\u0026#x2019;ll keep that thought in mind.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Thank you very much.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMashima-sensei couldn\u0026#x2019;t hide his bewilderment, but since a teacher couldn\u0026#x2019;t possibly suggest another expulsion candidate, he had no choice but to respect my personal opinion for the time being.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 2\",\"volumeId\":\"y3v3\",\"chapterIndex\":15,\"prevChapter\":{\"volumeId\":\"y3v3\",\"chapter\":14,\"title\":\"Part 1\"},\"nextChapter\":{\"volumeId\":\"y3v3\",\"chapter\":16,\"title\":\"Part 3\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 3\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":11},{\"label\":\"Prologue: Shiina Hiyori's Monologue\",\"href\":\"prologue.xhtml\",\"index\":12},{\"label\":\"Chapter 1: Opening. Survival Game Special Exam.\",\"href\":\"c1.xhtml\",\"index\":13},{\"label\":\"Part 1\",\"href\":\"c1p1.xhtml\",\"index\":14},{\"label\":\"Part 2\",\"href\":\"c1p2.xhtml\",\"index\":15},{\"label\":\"Part 3\",\"href\":\"c1p3.xhtml\",\"index\":16},{\"label\":\"Chapter 2: A Surprise Attack\",\"href\":\"c2.xhtml\",\"index\":17},{\"label\":\"Part 1\",\"href\":\"c2
