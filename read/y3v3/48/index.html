e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T1c8e,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 2\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePREPARED FOR A confrontation with the allied classes, Class A retrieved the supplies that appeared in the southern G9 area and immediately completed their move to the F9 area. The time was 12:00 PM.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHorikita and the others temporarily stopped to receive a new report from Matsushita.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It seems a Class C student was just eliminated between E12 and F11. The remaining student appears to be turning back, but... what in the world could this mean?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUpon receiving the bewildered report from Wang, Horikita and Hirata looked at each other.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Did they try to retrieve the supplies at F10 without using a VIP? And then Class B ambushed them when they strayed a little from the path?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...I don\u0026apos;t know. But there\u0026apos;s no doubt that Ayanokouji-kun is the one giving the orders. Tell Matsushita-san to immediately use a tactic to find out who the retreating student is.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Y-Yes!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWang received Horikita\u0026apos;s instructions and immediately relayed them to the commander via radio.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNot even a minute later, another message came in from Matsushita, who used the tactic, to Wang.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The retreating student is Nishi-san from Class C and her role is Scout!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;A Scout... In that case, we can likely rule out the possibility that they were after supplies...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Could it be that they used two people as bait to lure out Class B? No, but that would be a rather ineffective way to go about it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;They\u0026apos;ve just pointlessly lost a guard. And there\u0026apos;s no guarantee the scout will even make it back safely. Their true intentions are still unclear, but for now, let\u0026apos;s monitor the movements of both classes from here. While securing a location that\u0026apos;s easy to defend in case we\u0026apos;re attacked.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTen minutes later Horikita and the others noticed something was wrong.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt became clear when communication came in immediately from Matsushita to their VIP, Wang.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Horikita-san! Class C and Class D have apparently started moving north! To be precise, all their GPS signals are moving northwest from H10 toward G9!\u0026quot; Kushida, who was standing right near Horikita, spread out a map and Horikita peered down at it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;For them to move to G9 at this stage... doesn\u0026apos;t that mean there\u0026apos;s a chance they\u0026apos;re targeting us?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Yes. Well, if they\u0026apos;re trying to take someone down, it\u0026apos;s only natural they\u0026apos;d target Class A over Class B\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;A-And there\u0026apos;s one more thing to report! Class B, which had been on standby in E12, has also started to move north!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBoth classes started moving five minutes earlier, with what seemed like perfectly coordinated timing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No way... Could it be that Class D contacted Class B for this very reason...!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s possible. They might\u0026apos;ve proposed a pincer attack to take down Class A.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith Kushida calmly analyzing beside her, Horikita immediately relayed it to her classmates.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;W-w-w-what\u0026apos;re we gonna do!? There\u0026apos;s no way we can win against three classes!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If they are coming for us, staying here just means we\u0026apos;ll get caught in a pincer. I think running is an option, don\u0026apos;t you? There\u0026apos;s a chance they\u0026apos;ll run into each other in the meantime.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe was forced to make a decision, even though it wasn\u0026apos;t certain that they were targeting Class A.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2014;We\u0026apos;re moving. Let\u0026apos;s fight Class B at E10.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo matter how advantageous their defensive position was, that advantage would be blown away in an instant if they engaged with three classes. She judged that challenging Class B to a fight gave them a higher chance of victory.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEveryone hurriedly shouldered their bags again and immediately began to advance toward E10.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe next GPS update confirmed that Class B entered E11 and the allied classes were about to enter G9. Class A continued toward E10, but ten minutes and two GPS updates later, the situation began to change again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs a result of the other classes realizing they\u0026apos;d begun to move five minutes earlier, Class B stopped their northward advance and began to retreat back the way they came, toward E12. Meanwhile, Class C and D stopped moving north and began to move west.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;They must have sensed we were trying for a swift conclusion and pulled back. But I was fully aware they\u0026apos;d notice. We\u0026apos;ll proceed to challenge Class B to a fight.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs the words left her mouth, a sickening feeling clung to her. It was because she was enveloped in a sensation of being swept away by a raging current that allowed no resistance. The Class C student sent towards Class B. If they conveyed the message to cooperate and defeat Class A, fully prepared to be eliminated, then the entire development involving all four classes was none other than a scenario orchestrated by Ayanokouji.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer ideal had been to stand her ground and observe until the very end. And yet, starting with a single raid from Ayanokouji, she allowed him to manipulate the state of the battle with such ease.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This is Class A\u0026apos;s weak point, Horikita-san. I\u0026apos;m sure you were prepared from the start for the risk that others with the shared goal of pulling down the top class would team up.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Yes, you\u0026apos;re right. For us, from here on out\u0026#x2014;this is where we show what we\u0026apos;re made of.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHorikita acted, believing it would lead them down the path to their own victory.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 2\",\"volumeId\":\"y3v3\",\"chapterIndex\":48,\"prevChapter\":{\"volumeId\":\"y3v3\",\"chapter\":47,\"title\":\"Part 1\"},\"nextChapter\":{\"volumeId\":\"y3v3\",\"chapter\":49,\"title\":\"Part 3\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 3\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"hr
