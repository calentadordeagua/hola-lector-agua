e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T564e,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 2\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOUR WATCHES SWITCHED to F12 as we fled southeast.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAround that time, the distance between us and the students chasing us from behind had begun to widen slightly, so I slowed our pace.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;ve gotta be kidding me... The exam\u0026apos;s just started, how many people got taken out just now!? Shira\u0026#x2014;no, Takemoto, hurry up and tell Shimazaki to report the situation! Why\u0026apos;d you let Class B get so close!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi, one of the VIPs, was gasping for breath. Seeing that she was struggling just to keep up and had no energy to communicate with the commander, a classmate demanded that Takemoto send the message in a harsh tone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTakemoto, who also seemed to be in pain, continued to jog while speaking into his radio.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hah? No, hah, wh-what the hell, hah... I-I\u0026apos;ll tell him!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA message came back from headquarters and Takemoto looked at Hashimoto, muttering as if to himself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;He says there was no sign of any other classes approaching our vicinity on the tablet. And that Class B\u0026apos;s position still hasn\u0026apos;t changed!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA sorrowful voice echoed through the forest.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What the hell!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYoshida, unable to hide his irritation, exhaled a ragged breath toward the sky.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnyone could figure out why this was happening if they just calmed down a little.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut right now, they were still in the midst of a panic and probably didn\u0026apos;t have the composure to think.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eConsidering the strain on the class, I slowed my pace from a jog to about a brisk walk.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The answer is quite simple. Ryuuen\u0026apos;s class deliberately kept its distance after the start to make it seem like they were avoiding engagement. This is certain, since they were far away during the first three GPS updates. But it was all a pretense. A setup for an attack. All that was left was to have their commander activate the \u0026apos;Disable All GPS\u0026apos; tactical card before the next update and their preparations were complete.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom that point, the GPS positions froze in place for thirty minutes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe scouts\u0026apos; watches also showed no reaction while the tactical card was in use. Meanwhile, Ryuuen\u0026apos;s side only had to receive information from their commander, Kaneda, at any time and charge toward our precise location.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith more than enough time, they had pulled off a successful surprise attack.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So they used their one-time-only big move right from the get-go...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYoshida and the other classmates were frustrated.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEasier said than done. It was undeniably a gamble.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if we hadn\u0026apos;t noticed the attack, it wouldn\u0026apos;t have been such an easy ambush if we had finished our discussion and immediately resumed moving.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Judging by the speed of their decision, they must have been planning to use it from the moment they understood the rules of the special exam.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt the start, every class wants to decide on a strategy and learn how to handle their weapons as quickly as possible. If anything, their decision was likely based on the assumption that our pace would be slower.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a strategy that truly felt like Ryuuen, a display of his decisiveness.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, there were other factors behind the success of this surprise attack, but\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut there was no point in touching upon them and talking about it here and now.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;A surprise attack, huh... If they\u0026apos;d just waited and watched, another class might\u0026apos;ve crushed each other for them. Heh... That bastard Ryuuen, he took on a pretty big risk, didn\u0026apos;t he?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eExasperation, impatience and anger. And then, admiration.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto\u0026apos;s candid feelings were conveyed to those around him through his words.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I looked back at the students following me, I saw one who was starting to fall far behind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs the one in the lead, I drastically slowed our pace and came to a complete stop in about three seconds.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hey, Ayanokouji, what\u0026apos;s wrong? Shouldn\u0026apos;t we be putting more distance between us?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, this is about our limit. If we force ourselves to keep going, we\u0026apos;ll only increase the risk of our allies dropping out.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter Morishita, who\u0026apos;d been lagging the furthest behind, finally reached us, she plopped down onto the ground.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hah... hah... I suppose this is because I ran a full marathon in the schoolyard yesterday, isn\u0026apos;t it... hah.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wondered if she was the type of person who couldn\u0026apos;t help but tell a needless lie about everything.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Jeez, Morishita. You volunteered for this and now look at you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t say that. It\u0026apos;s not just Morishita; the girls, especially, are close to their physical limits.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was more than just one or two students breathing heavily, their shoulders heaving.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah, oh, right... Yeah, that makes sense.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt would be one thing if it were a girl who was confident in her athletic ability, but it was nothing short of cruel to expect the same level of stamina from the other girls as from the boys.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Just as it\u0026apos;s tough on us, it\u0026apos;s also difficult for them to have their whole group chase us. The proof is that we can\u0026apos;t even see them right now.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe forest behind us was now blanketed in a silence that made the earlier commotion feel like a lie.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI gave instructions for everyone to drink at least one sip of water, which we wanted to conserve as much as possible.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter they finished their light rehydration and caught their breath, Yoshida, perhaps having calmed his head, spoke up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Thinking about it normally, there was no way to defend against that surprise attack, was there...? It\u0026apos;s a flaw in the rules.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eLeaning against a tree, he grumbled like that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI understood how they felt, but whether or not it was truly an unforeseeable surprise attack was questionable.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat was important for noticing it quickly was a commander who could survey the entire situation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe moment the full GPS shutdown began, the five-minute position updates would stop completely. In that case, by carefully watching the tablet, one could have noticed that no one was moving an inch. No matter how still people were, it would be unnatural if no one moved for five, or even ten minutes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf there was no change, it was necessary to report that there was no change.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut Shimazaki overlooked it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe commander\u0026apos;s ability directly affected the class\u0026apos;s overall ability.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA bad example of that had blatantly emerged just after the exam began.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, I couldn\u0026apos;t blame him. It was easy to imagine that he\u0026apos;d been staring intently at his tablet without letting his guard down, as the exam had only just begun. Perfectly recognizing the positions of well over 100 GPS signals was an impossible task for someone with ordinary ability.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile the confusion had yet to subside, Takemoto contacted Shimazaki and the process of organizing the information on who was safe and who was out began.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI left the exchange with Shimazaki to Takemoto and, a short distance away, went about the task of confirming what supplies we were missing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBefore long, Hashimoto, who\u0026apos;d been standing beside Takemoto, approached me with a grim look on his face.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Kitou got taken out after that. Well, not that I thought he\u0026apos;d be able to get away.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s understandable. The surprise attack was likely carried out by all of Class B. He did well to buy us time under those circumstances.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf his role of holding them back hadn\u0026apos;t worked, the damage would have been much greater.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Apparently, the three who escaped late were Yano, Sawada and Tsukasaki. But they don\u0026apos;t know our position or the enemy\u0026apos;s, so they\u0026apos;ll be wandering around on their own for a while. It\u0026apos;d be great if they could make it to a position where we can meet up...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs for that, there was nothing to do but wait, since we couldn\u0026apos;t go and get them right now.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And sorry to keep piling on the bad news, but it seems Rokkaku left his weapon behind when he ran. Should we just be straight with the school and report it as lost? Or should we go back for it at some point?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA short distance away, Rokkaku was bowing his head apologetically.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Lost is fine. Tell the commander immediately and have them request the school to retrieve it. As for Rokkaku, who lost his weapon, we can just put him into one of the vacant role slots as needed.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I asked Rokkaku directly if he was okay with that, I received a firm reply along with another apology.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto, who\u0026apos;d been watching, looked at me with some wonder.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The only saving grace in this screwed-up situation is that you\u0026apos;re as calm as ever.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNot even an hour passed since the special exam began.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDuring a long special exam spanning several days, even if the current situation was a crisis, a leader who was running around in confusion wouldn\u0026apos;t be able to pave a way forward.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Seriously... you think we can still pull this off?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;d be a lie to say it has no effect. In fact, in less than an hour since we started, our Class C\u0026apos;s position has become terribly bad.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Yeah.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Still, it\u0026apos;s not as if our chance to win has disappeared. If one of our VIPs was taken out, we just have to take out two of theirs. If another one of ours is defeated later, we\u0026apos;ll just take out three in return.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see. In that case, this is the last time I\u0026apos;ll be acting so weak. I\u0026apos;ll trust that if I follow your orders, we\u0026apos;ll find a way out of this. So, what\u0026apos;s the plan from here?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We have a few options, but for now, maintaining our distance from Ryuuen\u0026apos;s class is an absolute must.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So you\u0026apos;re saying they might try to lure us into a false sense of security and attack again.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I think they stopped their pursuit considering the possibility that we might turn to ambush and counterattack, but they might come for us if they see an opening. This is just a precaution.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven though we pulled away, it was a distance they could close with just a short run.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt could hardly be called a safe zone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Just in case, I need you to go and check one more time if any students are having trouble at this stage. I\u0026apos;d like you to tell them to talk to me about anything if there\u0026apos;s something they don\u0026apos;t understand or are worried about.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I asked him, Hashimoto readily agreed without the slightest look of displeasure and headed toward our classmates.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs if taking his place, Shiraishi, who\u0026apos;d been listening to our conversation nearby, approached.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I overheard a little of your conversation with Hashimoto-kun. Even in a situation like this, you aren\u0026apos;t worried that you might be the first to receive the penalty for being wiped out, are you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m not worried. If that\u0026apos;s what happens after we\u0026apos;ve done our best, I\u0026apos;ll simply accept it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But it won\u0026apos;t end as a simple defeat. In the worst-case scenario, Ayanokouji-kun, you would be expelled and our path to Class A would be closed off.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you don\u0026apos;t like that future, then we have no choice but to win.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI thought she might be doubting our victory, but apparently, that wasn\u0026apos;t the case.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then let\u0026apos;s go and seize victory together.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I turned only my gaze to Shiraishi, she continued to look back at me with a soft expression.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was no trace of anxiety in her attitude or her gestures.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf anything, she even seemed to be enjoying the current crisis somehow.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhy was that?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat was the driving force behind that thought?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA faint sense of unease began to sprout.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut I put that aside.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had to face reality for what it was.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat our class had lost fifteen people, including one VIP, who were now out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere, I once again finished organizing all the information.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThree students, Yano, Sawada and Tsukasaki, were not out, but they were currently separated from the main group.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShimazaki was the only one who knew their current location, but we couldn\u0026apos;t go rescue them until Class B\u0026apos;s GPS jamming tactic wore off. On the other hand, Ryuuen\u0026apos;s group could see the trio\u0026apos;s position, so it was highly likely they already formed a group and sent them out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If only Shimazaki had noticed something was wrong...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps Hashimoto was thinking the same thing I was, as he muttered in a regretful tone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s incorrect, Hashimoto Masayoshi. The one at fault is Ayanokouji Kiyotaka.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMorishita pointed her index finger straight out, thrusting her arm forward until it was just a few centimeters from my eyeball.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;A true leader would have told the commander\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as she started to say that, I immediately raised my assault rifle.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What do you think you\u0026apos;re\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMorishita, right in front of me, must have thought she was about to be shot for her insolence, as her pupils dilated slightly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBefore she could finish her sentence, I grabbed her shoulder with my left arm, pulled her toward me and pulled the trigger once.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt almost the same instant, Class B\u0026apos;s Kondou, who emerged silently from the shadows, was about to aim his muzzle at me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA single bullet hit Kondou square in the chest with a dry crack and Kondou, who\u0026apos;d been trying for a silent ambush, stood there dumbfounded.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBefore anyone could understand what just happened, an alarm blared from Kondou\u0026apos;s watch.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrustrated that he\u0026apos;d been hit just as he aimed at me, he took his finger off the trigger.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Damn it, you knew?!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe must have been following us and searching the area for a while. Kondou\u0026apos;s breathing was incredibly ragged.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Impressive, hitting me in one shot... and how\u0026apos;d you even notice me?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBreathlessly, Kondou asked me how I knew.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You must have been pretty exhausted. You weren\u0026apos;t able to completely silence your footsteps. It also helped that I was your primary target, not just anyone. Wasting time trying to line up the perfect shot was your downfall.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDespite his failure, Kondou\u0026apos;s somewhat satisfied expression left an impression on me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah, well... taking out the leader would\u0026apos;ve been a huge score. Guess I should\u0026apos;ve just fired randomly.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto, while remaining vigilant of his surroundings, approached Kondou, who sat down to rest.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That was one hell of a flashy ambush. You really got the drop on us.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince they could still talk even after being eliminated, Hashimoto praised Class B.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ryuuen-san\u0026apos;s amazing, ain\u0026apos;t he? Well, the game is on. It\u0026apos;s your fault for letting your guard down.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There might be other students besides Kondou looking for us. Let\u0026apos;s get moving.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In that case, shouldn\u0026apos;t we have Shimazaki check the GPS for Class B\u0026apos;s location?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was Yoshida who ran up and suggested this.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut as I turned my back and began to walk away without answering, Shiraishi, the VIP, added an explanation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The reason Kondou-kun was able to approach us undetected is because they\u0026apos;re using a tactic to hide all of their class\u0026apos;s GPS signals. Since it hasn\u0026apos;t been thirty minutes yet, contacting the commander now wouldn\u0026apos;t give us any details.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh, right, of course... My bad.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Do your best to run and hide~\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eLeaving behind Kondou, who had cheerfully uttered the taunt, we headed south as if returning to the starting point.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 2\",\"volumeId\":\"y3v3\",\"chapterIndex\":19,\"prevChapter\":{\"volumeId\":\"y3v3\",\"chapter\":18,\"title\":\"Part 1\"},\"nextChapter\":{\"volumeId\":\"y3v3\",\"chapter\":20,\"title\":\"Part 3\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 3\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"i
