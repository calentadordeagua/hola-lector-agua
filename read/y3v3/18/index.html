e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T916b,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 1\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSEVERAL MORE MINUTES passed. While discussing the various ways to handle their weapons, the guards experimented with different stances and grips.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMeanwhile, I looked through the details in the rulebook, at the rules that would incur a major penalty.\u003c/p\u003e\u003cdiv class=\"text-block\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cstrong\u003e\u003cem\u003eMajor Penalties (For each infraction, a deduction of 100 Class Points and in serious cases, expulsion.)\u003c/em\u003e\u003c/strong\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e-Acts such as assault, restraint, or destroying or stealing guns.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e-A student who has been judged \u0026apos;out\u0026apos; intentionally continuing to fight back.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e-Acts such as stealing or taking items from other classes.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e-False reports in response to school inquiries.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e-Other behavior that undermines the dignity of the special exam.\u003c/em\u003e\u003c/p\u003e\u003c/div\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMashima-sensei also verbally explained about attacking after being judged \u0026apos;out\u0026apos;, but unless it was intentional\u0026#x2014;including attacks on opponents outside of exam hours\u0026#x2014;it wasn\u0026apos;t subject to a penalty. However, even if someone feigned an unintentional attack, the target wouldn\u0026apos;t be declared \u0026apos;out\u0026apos; and would be given relief, so there was little point in pushing the boundaries. Of course, it wasn\u0026apos;t impossible to find loopholes if one looked for them, but it wasn\u0026apos;t worth the risk of breaking the rules.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis was because the school had a strong will to thoroughly enforce the rules. It was precisely because this was an uninhabited island exam where gray areas could emerge that I understood the phrase \u0026apos;behavior that undermines the dignity of the special exam\u0026apos; was a warning that they would show absolutely no mercy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince actions that were close to a gray area came with high risks, it was safe to assume that even Ryuuen wouldn\u0026apos;t be able to execute them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ayanokouji, we got a new report from Shimazaki. He says Class A\u0026apos;s advanced to the point where they\u0026apos;ll be entering area G8 soon.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto was the first to react to the new report from the commander.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Got it, the situation with Horikita\u0026apos;s class. What\u0026apos;s next?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hold on. Before that\u0026#x2014;it seems Koenji\u0026apos;s GPS has already entered I9.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I9? Damn, he\u0026apos;s fast.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was no one other than Koenji who could move as swiftly on a mountain path as on a flat road.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What about Ryuuen\u0026apos;s class?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hold on a sec. Shimazaki, what\u0026apos;s the status of Class B?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe pressed for an answer from the commander, but with the VIP acting as an intermediary, the process was time-inefficient.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Not being able to talk to the commander directly... this might be more of a pain than I thought.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eGrowing impatient from the unavoidable, forced wait, Hashimoto let out a sigh.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The exam\u0026apos;s only just begun. There\u0026apos;s no need to rush.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMorishita, who sat down on the ground to take a complete break, muttered without looking at Hashimoto.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This special exam is on a deserted island, so the rewards are pretty huge, y\u0026apos;know. Plus, if we get hit with the total annihilation penalty, someone\u0026apos;s gonna get expelled. It\u0026apos;d be unreasonable not to get fired up.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ayanokouji Kiyotaka said as much, but when push comes to shove, Hashimoto Masayoshi is our only choice.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hey, don\u0026apos;t just go deciding that on your own. You should be the one to say something to her spouting off whatever she wants.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah, Ayanokouji? You\u0026apos;re not... If we lose, you\u0026apos;re not actually gonna make me the sacrificial lamb for expulsion, are\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Relax. I won\u0026apos;t do that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You sure about that? What was with that pause just now? Huh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I was just responding to the setup.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...You better be telling the truth.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You seem to have gotten more of a scare than I expected.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto forced a wry smile, looking annoyed at Morishita for her constant retorts.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It seems Class B has stopped moving for now, just like us.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat report came from Takemoto\u0026apos;s mouth, and Hashimoto nodded once.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;They\u0026apos;re probably just relieved to have gotten some distance from Ayanokouji. They\u0026apos;re likely doing the same as us\u0026#x2014;using the time to talk things over. Whether or not you\u0026apos;ve been coached on how to use the weapons makes a huge difference in accuracy, after all. Heh, I\u0026apos;ll bet they were on pins and needles, worried we\u0026apos;d come to the west side.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed Ichinose\u0026apos;s class had also stopped and perhaps shifted to discussions as well. I had Takemoto reply that no reports on Class D were necessary for the time being unless there were major developments.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA little while later, a radio call came in from the commander, this time for Shiraishi.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;He says, \u0026apos;I\u0026apos;m reporting because we\u0026apos;ve learned a few things about Ayanokouji-kun\u0026apos;s request.\u0026apos;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter she relayed that, Shiraishi once again listened to the voice coming from her earphone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Apparently, the commanders were informed that during the special exam, direct contact, private conversations and any message-like exchanges are prohibited. And the tablet\u0026apos;s screenshot function is disabled; even if you try to use it, it will only save a completely black screen as the picture\u0026#x2014;that\u0026apos;s what he said.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I thought I saw him talking to Shimazaki when we split up, but he even asked him to check on all that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I had him look into it because I thought there might be things he could do outside of his official authority as commander, but it seems they\u0026apos;re being monitored more strictly than I anticipated. They may be sharing the space called the main base, but the premise is likely that the commanders are all in separate locations.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Also, it seems the GPS on the tablet\u0026apos;s map has individual tags, and he found out it\u0026apos;s possible to take notes on the GPS of students from other classes. So, he said he made sure to put Koenji-kun\u0026apos;s name on the GPS marker at I9, where he\u0026apos;s isolated.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Got it. Tell Shimazaki I said thanks, and to let us know anytime if anything else comes up.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI broke my gaze from Shiraishi, who nodded and I took off my goggles for a moment. I looked at the classmates I\u0026apos;d lined up in a column and with an assault rifle in one hand, I moved to a place where everyone could see me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Once the event begins, our movements will become hectic. Furthermore, depending on the quality of our supplies, the possibility of combat will gradually increase. That\u0026apos;s why I\u0026apos;m going to take the time now to properly lecture you all on how to use these weapons. Then, after the lecture, I want one of the guards who isn\u0026apos;t confident in their fighting ability to temporarily give their weapon to one of the three VIPs, one after another. And every few hours, collect it and have a different guard hand over their weapon. I want them to constantly be in rotation with someone.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What do you mean by that? The VIPs are forbidden from using weapons, right? No... is that exactly why...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe had a moment of doubt, but Toba immediately understood what it meant.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah. One method for identifying another class\u0026apos;s VIP is to see if they can use a weapon. If we get into an unexpected fight, it\u0026apos;s entirely conceivable that they\u0026apos;ll prioritize targeting any student without one.\u0026quot;\u003c/p\u003e\u003cimg src=\"/hola-lector-agua/images/books/y3v3/OEBPS/ivxceYLavBtEsKqaEySHG.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, during an engagement, one guard would be unable to function, but I wanted to include the element of misdirection as a form of insurance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So this will stop the enemy from easily identifying our VIPs?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s right. However, just in case, when you hand a weapon to a VIP, I want you to be sure to remove the magazine and check the chamber as well. I want to reduce the risk of them firing reflexively when attacked by another class to zero.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? What was that? Chamber?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The firing chamber\u0026#x2014;basically, there might be cases where a round remains inside even after you remove the magazine. I plan on carefully checking the structure of these paint guns later to see how they actually work, but if we build this routine from the start, we can prevent mistakes.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI took the assault rifle in my hands, showed them how to remove the magazine and demonstrated how to check the chamber. Then, I handed it to Toba and taught him the method via a hands-on demonstration.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...You\u0026apos;re awfully knowledgeable about this stuff. You look like you belong holding a weapon, too.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe muttered that after checking it himself a few times to learn the movements.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Regarding this type of firearm, Ijuuin from Horikita\u0026apos;s class is very knowledgeable and he taught me a few things in the past. It seems that knowledge, which I initially thought was useless, has proven to be useful.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is that so... In that case, they\u0026apos;ll probably adopt a similar strategy, of course.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was true that Ijuuin was knowledgeable about guns, but he never taught me anything in the past.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI\u0026apos;d never held this type of gun outside of the toy ones from the culture festival, but I knew about them because I had experience learning about firearms through my knowledge from the White Room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat being said, Toba had no way to confirm whether this story was true, so it likely wouldn\u0026apos;t be a problem.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Anyway, I understand the aim. I should also practice when I have some free time, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI recalled that Toba, who was athletic, was also good at basketball. Since he also achieved good results in P.E. classes, he would likely be a more capable fighter than the other students. Perhaps it was because he felt he had to be the one to lead that he was so proactively stepping forward.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom there, I settled down in that spot, taught them how to handle the weapons and showed them things like how powerful the shots were by actually firing a few rounds at a tree.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI really wanted to let everyone have a test shot, but I wanted to avoid wasting ammunition in the current situation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRadio reports came in periodically and after another ten minutes, Horikita\u0026apos;s class was still pushing north without changing course, while the remaining two classes appeared to have stopped to discuss and were continuing to formulate their strategies.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as I was getting the hang of the weapons, Kitou approached me with an assault rifle in hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Let me confirm something, just to be sure. You\u0026apos;re aiming to take first place in this exam... Am I right to think that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s surprising, Kitou. I didn\u0026apos;t expect you to ask something like that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;A survival game... This feels like nothing more than playtime, but if we\u0026apos;re aiming to win, I\u0026apos;m going to take this seriously.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ayanokouji is betting his own expulsion on this, you know? Of course he\u0026apos;s going to play for real.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs if worried that infighting amongst us would cause trouble, Hashimoto immediately cut in here as well.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s certain that aiming to lose isn\u0026apos;t an option.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe came to get a verbal commitment to win from me, who was staking my own expulsion on this challenge.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWas it perhaps because he couldn\u0026apos;t sense any fighting spirit from me? Or was it simply that Kitou\u0026apos;s intuition was at work?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But you\u0026apos;ve touched on a good point.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEither way, it seemed I had to revise my evaluation of Kitou just a little.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Unfortunately, even if you want first place, it seems I won\u0026apos;t be able to live up to that expectation.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I answered him so honestly, Kitou faintly furrowed his brow and narrowed his eyes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...In other words, you\u0026apos;re not confident?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKitou\u0026apos;s eyes, which already held a sharp glint, grew even more intense and stern.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t think it\u0026apos;ll be an easy win, but that\u0026apos;s not it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI paused, looked away from Kitou in front of me for a moment and glanced around at my surroundings.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, not a single student was missing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This is a good opportunity. It might seem like I\u0026apos;m derailing things a bit, but please listen.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI addressed all of my classmates, who were watching to see what I would say.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I believe this class\u0026apos;s ultimate goal, the rank we should be aiming for, is second place.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn an instant, everyone there fell silent.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Second place? I mean, I wouldn\u0026apos;t say it\u0026apos;s a bad goal, but what\u0026apos;s the deal with aiming for that right from the start?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEveryone first aimed for first place. That was the natural mindset one should have.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was precisely why Shimizu was surprised and tilted his head. He didn\u0026apos;t even try to hide his dissatisfaction with the passive answer.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The reason is simple and clear. I\u0026apos;m thinking we can give first place to Ichinose\u0026apos;s class.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Huh? What the hell is that? I have no clue what you mean.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith the exception of a very small number of people like Hashimoto and Morishita, it was natural that they wouldn\u0026apos;t be able to understand what I was saying.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe alliance between Class C and Class D that I\u0026apos;d arranged between Ichinose and myself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe special exam was the most suitable time to bring up that topic and it was a situation where it was essential to announce it at this point.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not easy to rebuild this class, which has fallen to Class C over the past year and raise it to Class A. I think you all can understand that, given your past where you\u0026apos;d all but given up.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven after hearing the hard-to-accept statement that I intended to give up first place, my classmates were surprised and confused, but they didn\u0026apos;t get terribly upset.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey seemed willing to listen first before raising any objections.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I transferred to raise this class to Class A. But given that the hurdle is actually very high, we must use a strategy to win efficiently. And one of those important strategies is Ichinose\u0026apos;s class\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt that moment, Hashimoto showed a dubious look for an instant.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOr rather, it should be said that he couldn\u0026apos;t suppress his impulse.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hey, Ayanokouji...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe hurriedly came between the students and forcefully interrupted me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen he leaned in close and whispered in my ear.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You should probably stop talking about \u003cem\u003ethat\u003c/em\u003e\u0026#xa0;here. No matter how you look at it, now\u0026apos;s not the time...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe were just about to all pull together to win this special exam.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was the most unsuitable topic to bring up at such a time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What is this \u0026apos;one important strategy\u0026apos;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh, that\u0026apos;s\u0026#x2014; uhm\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven Hashimoto couldn\u0026apos;t seem to come up with a good excuse on the spot and his agitation was clearly showing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, I ignored Hashimoto\u0026apos;s advice and words and continued.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That strategy, I believe, lies in an alliance with Ichinose\u0026apos;s class.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI said it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto\u0026apos;s expression was striking to see up close, but the looks on my classmates\u0026apos; faces were even more intense.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Wait... what? An alliance...? What are you\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn front of the bewildered students, I began to explain the advantages of the alliance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI explained that we should form a cooperative relationship, something that couldn\u0026apos;t be established with Class A or Class B, who we should be chasing. It was a partnership that could only be realized because we were both lower-ranked classes and because we were dealing with the trustworthy Ichinose\u0026apos;s class.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI verbally conveyed the specific contract details of the alliance to my classmates.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen faced with an exam where all four classes competed, the win would be given to the class with even one fewer Class Point. Of course, it wasn\u0026apos;t about giving away victory for free.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf we conceded the victory here, this class, which would then fall to Class D, would in turn gain the full cooperation of Ichinose\u0026apos;s class.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In this survival exam, we\u0026apos;re supposed to be fighting three other classes. That means we\u0026apos;re facing nearly 120 enemies, but an alliance can change that premise. I don\u0026apos;t need to explain in detail how effective that would be.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If Class D is on our side, we can focus just on Class A and Class B... huh.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not just that. At the same time the number of enemies decreases, the number of allies increases by that same amount. That alone brings victory much closer.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMaking the most of the alliance was vital.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I think it\u0026apos;s a good idea. It\u0026apos;d be no laughing matter if we gave it our all and ended up in last, or third place at best. But if we can take it a little easier and secure second, that\u0026apos;s not a bad deal. We can steadily earn Class Points and close the gap with A and B. After this, there should be another academic exam, too.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith that, we would accelerate further and by then all four classes would be on even footing. Those were Hashimoto\u0026apos;s words, describing a prospect that wasn\u0026apos;t unrealistic, but many students were left with things they couldn\u0026apos;t quite digest.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMorishita\u0026apos;s gaze alone seemed to say, \u003cem\u003e\u0026apos;You really shouldn\u0026apos;t be sticking your neck out.\u0026apos;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMorishita, who also knew about the alliance, probably felt the same way as Hashimoto.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you\u0026apos;re bringing up an alliance now, that means things are already moving behind the scenes, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHow I answered here was extremely important.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat we already formed the alliance and that it was now unavoidable.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnswering like that would be easy, but it wasn\u0026apos;t the optimal solution.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You could say a provisional agreement has been made. The other side is keen on it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, of course they are. They\u0026apos;ve got no way of moving up otherwise.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t just that he was looking down on Class D, but an answer based on the flow of events so far.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNot only the harsh Matoba, but many of the people here thought so.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You can refuse\u0026#x2014;or rather, reject the idea\u0026#x2014;but it\u0026apos;s not something we can pick up and drop as we please. If you reject it, we\u0026apos;ll never be able to team up with Class D again and depending on the situation, there\u0026apos;s a slight risk that Class D could team up with Class A or Class B. That\u0026apos;s something you\u0026apos;ll have to be prepared for.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s a pretty selfish proposition.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a normal reaction to want to criticize the part about trying to form an alliance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMatoba was dumbfounded, at a loss for words.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs if slipping through that brief moment of silence, Motodoi lightly raised her\u0026#xa0;hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Let me say something, too. This talk about an alliance... do we have to decide right now? No matter how you look at it, this isn\u0026apos;t the right time. I\u0026apos;ll admit, this special exam isn\u0026apos;t exactly in our favor. But to throw away first place and aim for second just to get a better advantage... I can\u0026apos;t accept that. It\u0026apos;s less about not wanting to let Class D win and more that I don\u0026apos;t want to throw away our \u003cem\u003eown\u003c/em\u003e\u0026#xa0;chance of winning.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I agree. So basically, we\u0026apos;re the ones who have to suck up and bring them a gift, right? \u003cem\u003e\u0026apos;We\u0026apos;ll make you number one, so let\u0026apos;s team up.\u0026apos;\u003c/em\u003e\u0026#xa0;What\u0026apos;s up with that? In case you forgot, we\u0026apos;re the ones who are supposed to be on top here.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe\u0026#xa0;avoided saying it directly, but he probably wanted to say that if anyone was going to be bringing a gift, it should be Class D.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI could sense that feeling from Matoba\u0026#x2014;no, from many of my classmates.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Just when this pain-in-the-ass exam starts, you drop a bombshell like this on us. And the fact that Hashimoto\u0026apos;s so into the idea is shady as hell.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMorishita\u0026apos;s gaze changed to a triumphant one, as if to say, \u003cem\u003e\u0026apos;See?\u0026apos;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto, who was normally the type to be suspicious if anything, had been in favor of the alliance from the very first word. It was only natural for them to be dissatisfied, thinking he must have been told about it beforehand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWondering if he overstepped this time, Hashimoto involuntarily looked up at the sky.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;How about we discipline them?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No need.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut I had no intention of blaming Hashimoto for his actions and words, nor did I find him annoying.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRather, I considered it a necessary spice.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Look, we\u0026apos;re not going to form an alliance just from this one discussion. There\u0026apos;s no way. That said, I\u0026apos;m not going to reject the idea out of hand, either. So we can have time to really think about whether this is necessary, can\u0026apos;t we postpone this conversation until after the special exam is over?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eConsidering that no objections erupted from the other students, it seemed any further effort would be a waste of time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was no need to struggle here any further.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNegative opinions and criticisms of the alliance were things that could be easily overturned with a single change in perspective. All I had to do was make them feel that what they thought they didn\u0026apos;t need was, in fact, necessary.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis was a big step toward that goal.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;My bad for bringing this up so suddenly. Like Matoba and the others said, let\u0026apos;s talk about the alliance again after this special exam is over. For now, just forget we had this conversation.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I answered in a way that seemed to concede, Matoba, as if his rising anger had subsided, nodded emphatically.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust then.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA faint wind blew.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe sound of rustling trees.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt the same time, I faintly picked up on multiple other sounds from a distance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo one else sensed anything.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUntil just a moment ago, they had been completely at ease, hearing reports on the other classes\u0026apos; locations from Shimazaki every five minutes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDeep down, no one wanted to engage in combat this early in the game.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat assumption had bred carelessness.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hashimoto.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hm?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSensing a change in my demeanor, Hashimoto tilted his head curiously.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy gaze was directed past Hashimoto, past the rear guard and deeper into the forest where visibility was poor.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2014;Everyone, run! Now!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? What do you mean by\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eImmediately after, our surroundings erupted as if they\u0026apos;d been brought to a sudden boil. It was as if the volume on a muted television had been cranked to MAX all at once.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There they are! Fire, fire, fire!!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s Class C! Get \u0026apos;em!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Go, go, go, go, go!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNumerous shouts came from within the forest. I couldn\u0026apos;t identify whose voices they were, but I was certain of one thing: they didn\u0026apos;t belong to the boys or girls of our Class C.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn an instant, they appeared from deep within the trees.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt the same time, no, even before that, a rain of paintballs flew into view.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo, it might be more accurate to call it a torrential downpour raging from the side.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a storm of paintballs, far from accurate, that relied on sheer numbers.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMore than half of them were blocked by the large, natural trees that served as cover and missed their mark, but the remaining paintballs reached the Class C students.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA paintball hit and burst on the shoulder of Morishige, who was standing at the very back.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe had yet to process what just happened and wore a dumbfounded look.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eImmediately after, a paintball struck Motodoi in the hip and she let out a small shriek from the impact.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom there, their thoughts instantly plunged into a state of panic.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSome realized they were enemies and tried to raise their guns, only to be covered in paint.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOthers dropped their weapons to escape, or were hit with paintballs as they went back for the backpacks they\u0026apos;d forgotten at their feet.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn just a few short seconds, the casualties began to mount among the classmates at the rear. Then, the figures of the enemy came into view, revealing which class was behind the surprise attack.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut there was no time to talk about that now.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Your packs, don\u0026apos;t forget your packs! Just run!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto shouted to his classmates, waving his arm broadly to beckon them over.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We don\u0026apos;t even know how many of them there are. For now, run! Just run!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto repeatedly shouted, but his voice was mostly drowned out by panicked thoughts and screams.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Kitou\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was about to give an order to Kitou in the back, but it seemed there was no need for a detailed verbal explanation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe moment our eyes met, or perhaps even before they did, his brain\u0026#x2014;or maybe his body\u0026#x2014;had already understood the predicament and he broke into a run.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor all of Class C to turn their backs and flee would only increase our losses unnecessarily.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTherefore, having a few people stay here and hold off the enemy was one of the few options available.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKitou immediately took cover behind a large nearby tree and began to counterattack.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe showed a glimpse of skill and courage that made it hard to believe he\u0026apos;d never fired a single shot in a real fight before.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe must have taken out one of his opponents, as an alarm from a wristwatch rang out from deep within the unseen trees.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe enemy, who\u0026apos;d been attacking on the momentum of their surprise attack alone, was halted for the first time and took cover behind a large tree.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eInspired by Kitou\u0026apos;s swift counterattack, Machida and several other boys, though a bit late, also managed to take cover and began firing back blindly, with no time to take proper aim.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We\u0026apos;ll leave this place to Kitou and the others and retreat.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI called out only to the front line, which hadn\u0026apos;t taken any casualties yet and hastily left the area.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi and Hashimoto followed, moving frantically to catch up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAngry shouts, screams and the sounds of paint guns firing flew through the air.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith those sounds at my back, I took the lead and forged a path forward.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt became clear as I actually passed through. While nature remained untouched, simple, narrow, man-made paths were made in places to make it easier for people to walk. This uninhabited island might be subject to some changes in the future. Nevertheless, we couldn\u0026apos;t let our guard down for a moment. One step off that path and you were in the deep woods. If we didn\u0026apos;t flee prepared to get a few scrapes, the damage would surely have been greater.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 1\",\"volumeId\":\"y3v3\",\"chapterIndex\":18,\"prevChapter\":{\"volumeId\":\"y3v3\",\"chapter\":17,\"title\":\"Chapter 2: A Surprise Attack\"},\"nextChapter\":{\"volumeId\":\"y3v3\",\"chapter\":19,\"title\":\"Part 2\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 3\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":11},{\"label\":\"Prologue: Shiina Hiyori's Monologue\",\"href\":\"prologue.xhtml\",\"index\":12},{\"label\":\"Chapter 1: Opening. Survival Game Special Exam.\",\"href\":\"c1.xhtml\",\"index\":13},{\"label\":\"Part 1\",\"href\":\"c1p1.xhtml\",\"index\":14},{\"label\":\"Part 2\",\"href\":\"c1p2.xhtml\",\"index\":15},{\"label\":\"Part 3\",\"href\":\"c1p3.xhtml\",\"index\":16},{\"label\":\"Chapter 2: A Surprise Attack\",\"href\":\"c2.xhtml\",\"index\":17},{\"label\":\"Part 1\",\"href\":\"c2p1.xhtml\",\"index\":18},{\"label\":\"Part 2\",\"href\":\"c2p2.xhtml\",\"index\":19},{\"label\":\"Part 3\",\"href\":\"c2p3.xhtml\",\"index\":20},{\"label\":\"Part 4\",\"href\":\"c2p4.xhtml\",\"index\":21},{\"label\":\"Chapter 3: The Unseen Pressure\",\"href\":\"c3.xhtml\",\"index\":22},{\"label\":\"Part 1\",\"href\":\"c3p1.xhtml\",\"index\":23},{\"label\":\"Part 2\",\"href\":\"c3p2.xhtml\",\"index\":24},{\"label\":\"Part 3\",\"href\":\"c3p3.xhtml\",\"index\":25},{\"label\":\"Part 4\",\"href\":\"c3p4.xhtml\",\"index\":26},{\"label\":\"Part 5\",\"href\":\"c3p5.xhtml\",\"index\":27},{\"label\":\"Chapter 4: A Chance Encounter\",\"href\":\"c4.xhtml\",\"index\":28},{\"label\":\"Part 1\",\"href\":\"c4p1.xhtml\",\"index\":29},{\"label\":\"Part 2\",\"href\":\"c4p2.xhtml\",\"index\":30},{\"label\":\"Part 3\",\"href\":\"c4p3.xhtml\",\"index\":31},{\"label\":\"Part 4\",\"href\":\"c4p4.xhtml\",\"index\":32},{\"label\":\"Part 5\",\"href\":\"c4p5.xhtml\",\"index\":33},{\"label\":\"Chapter 5: The Alliance\",\"href\":\"c5.xhtml\",\"index\":34},{\"label\":\"Part 1\",\"href\":\"c5p1.xhtml\",\"index\":35},{\"label\":\"Part 2\",\"href\":\"c5p2.xhtml\",\"index\":36},{\"label\":\"Part 3\",\"href\":\"c5p3.xhtml\",\"index\":37},{\"label\":\"Part 4\",\"href\":\"c5p4.xhtml\",\"index\":38},{\"label\":\"Chapter 6: The Real Goal\",\"href\":\"c6.xhtml\",\"index\":39},{\"label\":\"Part 1\",\"href\":\"c6p1.xhtml\",\"index\":40},{\"label\":\"Part 2\",\"href\":\"c6p2.xhtml\",\"index\":41},{\"label\":\"Part 3\",\"href\":\"c6p3.xhtml\",\"index\":42},{\"label\":\"Part 4\",\"href\":\"c6p4.xhtml\",\"index\":43},{\"label\":\"Part 5\",\"href\":\"c6p5.xhtml\",\"index\":44},{\"label\":\"Part 6\",\"href\":\"c6p6.xhtml\",\"index\":45},{\"label\":\"Chapter 7: The Time of the Decisive Battle\",\"href\":\"c7.xhtml\",\"index\":46},{\"label\":\"Part 1\",\"href\":\"c7p1.xhtml\",\"index\":47},{\"label\":\"Part 2\",\"href\":\"c7p2.xhtml\",\"index\":48},{\"label\":\"Part 3\",\"href\":\"c7p3.xhtml\",\"index\":49},{\"label\":\"Part 4\",\"href\":\"c7p4.xhtml\",\"index\":50},{\"label\":\"Part 5\",\"href\":\"c7p5.xhtml\",\"index\":51},{\"label\":\"Epilogue: Show Me What You’ve Got\",\"href\":\"e.xhtml\",\"index\":52},{\"label\":\"Part 1\",\"href\":\"e1.xhtml\",\"index\":53},{\"label\":\"Author's Afterword\",\"href\":\"authors-afterword.xhtml\",\"index\":54}],\"volumeTitle\":\"Light Novel 3rd Year Volume 3\",\"detailsLink\":\"/select/year-3/y3v3\",\"returnLink\":\"/select\",\"currentSpineIndex\":18,\"nextVolumeLink\":\"$undefined\",\"nextVolumeTitle\":\"$undefined\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://classroom-of-the-elite-reader.vercel.app\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"COTE Reader\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"en_US\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:image:width\",\"content\":\"1200\"}],[\"$\",\"meta\",\"9\",{\"property\":\"og:image:height\",\"content\":\"630\"}],[\"$\",\"meta\",\"10\",{\"property\":\"og:image:alt\",\"content\":\"Classroom of the Elite Reader Preview\"}],[\"$\",\"meta\",\"11\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"12\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\"$\",\"meta\",\"13\",{\"name\":\"twitter:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"14\",{\"name\":\"twitter:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"15\",{\"name\":\"twitter:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"link\",\"16\",{\"rel\":\"icon\",\"href\":\"/hola-lector-agua/icon.svg?icon.ae5abf30.svg\",\"sizes\":\"any\",\"type\":\"image/svg+xml\"}],[\"$\",\"$L14\",\"17\",{}]]\n"])</script></body></html>
