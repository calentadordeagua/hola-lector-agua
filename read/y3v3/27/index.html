e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T3ca9,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 5\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAROUND 8:00 P.M., the Class C students started trickling into their tents.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was still the first day of the exam and aside from the surprise attacks, not a single engagement with another class had occurred.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs tomorrow and the day after arrived, the scent of battle would inevitably draw closer.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAvoiding needless exertion and striving to recover our stamina was the best move we could make right now.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFive of the boys had gathered in the large tent I was using, but surprisingly, they were lively and engaged in idle chatter, showing no signs of negativity.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA major factor contributing to this positivity was undoubtedly Hashimoto\u0026apos;s presence.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe constantly brought up new topics to keep us from falling into the mindset that we might lose.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy classmates weren\u0026apos;t fools. If they dwelled on their current predicament, things would inevitably become gloomy. That was why they were quick to join in, allowing themselves to be influenced by Hashimoto\u0026apos;s demeanor.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe idle chatter shifted away from class matters and moved on to funny stories from the past.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOnce Satonaka finished his story, all eyes turned to Hashimoto, who was sitting beside him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well then, guess I\u0026apos;ll tell a story I just remembered.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWithout refusing, he cheerfully began to speak.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSeeing that made me realize once again that being a cheerful character is a talent in itself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Back in my third year of middle school, I met up with a classmate from elementary school and we biked to this ramen and udon place. It was a big place and there were a bunch of bikes in the bike rack. But then, there was this one bike parked outside the rack, in a car\u0026apos;s parking spot. We didn\u0026apos;t think anything of it and parked our bikes on either side of it. Just as we were about to go in, the guy who owned the bike in the parking spot\u0026#x2014;some gloomy-looking college-aged dude\u0026#x2014;came out.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto continued, laughing amusedly as he recalled the memory.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;As we passed each other, he was looking at our bikes and muttering complaints. So, I asked him what was up and he goes, \u0026apos;I can\u0026apos;t get my bike out because yours are in the way.\u0026apos; But like, there was plenty of space between our bikes, you know? Anyway, I figured I\u0026apos;d just move it for him, but as I started to, he said, \u003cem\u003e\u0026apos;Don\u0026apos;t park here, it\u0026apos;s a nuisance.\u0026apos;\u003c/em\u003e\u0026#xa0;That kinda pissed me off, so I shot back, \u0026apos;You\u0026apos;re the one parked in a car\u0026apos;s spot.\u0026apos;\u0026#xa0;Then he starts yelling back at me all fast, spouting some lame excuse like, \u0026apos;Well, you guys parked two bikes\u0026apos;\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Dude, if you parked your bike in a car spot too, then you\u0026apos;re also in the wrong.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA punch of pure logic flew from Matoba.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah, well. I know that, but it was just funny seeing him get pissed at us younger guys like he wasn\u0026apos;t at fault at all. If it\u0026apos;d been some scary dude parked there, he definitely wouldn\u0026apos;t have said a word. The moment we glared at him, he just muttered something under his breath and took off.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRegardless of whether Hashimoto was in the right or not, I figured everyone probably had one or two funny stories from before high school.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You tell us something too, Ayanokouji. It can be a stupid story like mine.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had a feeling my turn would be coming up soon.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, I didn\u0026apos;t have a single funny story to share.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sorry, but I have to step out. An issue came up that I need to deal with for tomorrow.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI sat up and gave my excuse.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh, is that so? Can\u0026apos;t be helped then.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf it was a problem related to the special exam, no one, including Hashimoto, would object.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto seemed to have started another funny story from his stockpile, so I left the tent, relieved.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt might have seemed like I was running away, but I hoped they\u0026apos;d forgive me since it was true that I had a problem to deal with before the special exam resumed tomorrow.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was past 9:00 p.m. and as far as I could see, everyone was inside their tents. Few seemed to be asleep, however, as the sound of chatter was constant. A short distance away in the darkness, lanterns glowed faintly in several of the tents standing side-by-side. The entrances were open, but a mesh screen kept insects out. It was as if the students, protected by their small sanctuaries, were trying to escape their anxiety and enjoy their current circumstances in a positive way, all while maintaining their distance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It seems they still have some mental fortitude left.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOr perhaps it was because they felt such hardship that they huddled together for protection.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEither way, that wouldn\u0026apos;t be a problem until the exam started tomorrow.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe tent used by the person I was looking for was a two-person model and its flap was closed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I have a small favor to ask of you, Shiraishi. Do you have a moment?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t think she would be asleep yet, but I called out to her tentatively.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen, I heard the faint rustle of fabric from inside the tent and the closed entrance soon opened. She held a lantern in her hand and its light softly spread to the surroundings.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Good evening, Ayanokouji-kun. Is something the matter?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi, who was using a two-person tent, handed the lantern to me for a moment and then quietly crawled out.\u003c/p\u003e\u003cimg src=\"/hola-lector-agua/images/books/y3v3/OEBPS/xiEtLGQSqiPTphywfgOnI.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;d like to talk for a bit. Can you spare the time?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;To talk...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi showed a rare moment of bewilderment. From behind her, another person, her tent-mate Hoashi, peeked out, unable to hide her grin.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hey, hey. You should probably make sure the other boys don\u0026apos;t see you, you know? It\u0026apos;ll be a huge mess if they do.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not like that. Right, Ayanokouji-kun?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah\u0026#x2014;it\u0026apos;s not like that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat did she mean by \u0026apos;that\u0026apos;?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor a moment, I considered it, but the faces of Yoshida and Shimazaki immediately came to mind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe act of calling Shiraishi out of her tent in the middle of the night would certainly appear suspicious if anyone saw.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You can relax. It\u0026apos;s about the exam from tomorrow onwards.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI explained as much to Hoashi just in case, but her eyes were smiling and it was doubtful whether she believed me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs Hoashi saw us off, I moved a short distance away from the campsite with Shiraishi, who held a lantern in one hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is this a private matter?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Something like that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi\u0026apos;s expression, illuminated by the dim light, had already returned to its usual\u0026#x2014;to borrow Yoshida\u0026apos;s words\u0026#x2014;mysterious atmosphere.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So, what was it you wanted to discuss with me?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If there was anything about my command and actions today that made you feel uneasy, I want you to tell me. I\u0026apos;m starting to have doubts about how to proceed from here.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Unease and doubts?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlthough she immediately understood why she\u0026apos;d been summoned, Shiraishi brought her free hand to her mouth, looking puzzled.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s quite unexpected for you to harbor such unease and doubts, Ayanokouji-kun. I thought you were the type of person who considers everything and arrives at the answers all on your own and without any hesitation.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026apos;Unexpected.\u0026apos;\u003c/em\u003e\u0026#xa0;That one word from Shiraishi, casually included in her sentence.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI felt a new sense of unease.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe feeling I got from Shiraishi right after the surprise attack began to magnify.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe outcome of the attack that made even Hashimoto concerned.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn contrast, Shiraishi showed no doubt whatsoever that we might lose.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut for now, I decided to continue our conversation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I apologize if I seemed like an unreliable leader.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s not true at all. At the very least, I trust you. I believe that in the end, you will most certainly meet my expectations. Therefore, there\u0026apos;s not a single thing I\u0026apos;m uneasy about.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eStaring straight at me, Shiraishi answered without a hint of hesitation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you were hoping for a reprimand, does this mean I failed to meet your expectations?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you don\u0026apos;t doubt my ability, even though I couldn\u0026apos;t predict the surprise attack, then that\u0026apos;s fine. I understand now that you trust me, Shiraishi.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNodding yes, Shiraishi gave me an even wider smile.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then I\u0026apos;ll make use of that trust without reservation.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m prepared to help with anything, as long as it\u0026apos;s within my power.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI finished my conversation with Shiraishi and walked her to her tent.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHoashi\u0026apos;s surprised greeting of, \u0026quot;You\u0026apos;re back already?\u0026quot; was rather memorable.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOn my way back alone to the tent where Hashimoto and the others waited, I glanced back at Shiraishi and Hoashi\u0026apos;s tent.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi, who\u0026apos;d nodded without hesitation that she trusted me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA divergence from the impression I\u0026apos;d had of the student named Shiraishi Asuka.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe was able to show respect for others. If she thought it was for their own good, she would tell a gentle lie without hesitation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eConversely, if she thought it wouldn\u0026apos;t be for their own good, she would speak her true feelings.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe hadn\u0026apos;t even tried to blame me for my mistake and said that she trusted me from the bottom of her heart.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe damage from the surprise attack was considerable; it wasn\u0026apos;t something that could be overlooked as a simple mistake.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi, with whom I\u0026apos;d first spoken to alone in an empty classroom early in the morning on the second day of Class C.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat scene had certainly been a gift of chance, but I questioned whether the same was true for our other encounters.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was still June; I\u0026apos;d only spent about two months with the students of Class C.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTrue, it wasn\u0026apos;t as if we\u0026apos;d had no contact at all during our first and second years, but I had only very recently begun to take the lead.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven the boys, Yoshida and Shimazaki, didn\u0026apos;t understand me well yet and it was likely the same for Hashimoto, who acted as my aide.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was an incident that would cause anyone\u0026#x2014;Hashimoto, Matoba, Hoashi, Morishita\u0026#x2014;to feel a touch of unease.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince they didn\u0026apos;t know me well, it was normal for them to have doubts.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYes, that was the part that was abnormal.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhy had she found it surprising that I, as the leader, would feel anxiety and uncertainty?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe wasn\u0026apos;t a student incapable of thought.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA statement she couldn\u0026apos;t have made unless she\u0026apos;d known me from before we became third-years.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;A connection to Sakayanagi... or perhaps, a similar\u0026#x2014;student, is it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEither way, it was a trivial matter.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eStill, I made a point not to forget to keep it in my memory.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 5\",\"volumeId\":\"y3v3\",\"chapterIndex\":27,\"prevChapter\":{\"volumeId\":\"y3v3\",\"chapter\":26,\"title\":\"Part 4\"},\"nextChapter\":{\"volumeId\":\"y3v3\",\"chapter\":28,\"title\":\"Chapter 4: A Chance Encounter\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 3\",\"href\":\"cove art 2\",\"href\":\"c5p2.xhtml\",\"index\":36},{\"label\":\"Part 3\",\"href\":\"c5p3.xhtml\",\"index\":37},{\"label\":\"Part 4\",\"href\":\"c5p4.xhtml\",\"index\":38},{\"label\":\"Chapter 6: The Real Goal\",\"href\":\"c6.xhtml\",\"index\":39},{\"label\":\"Part 1\",\"href\":\"c6p1.xhtml\",\"index\":40},{\"label\":\"Part 2\",\"href\":\"c6p2.xhtml\",\"index\":41},{\"label\":\"Part 3\",\"href\":\"c6p3.xhtml\",\"index\":42},{\"label\":\"Part 4\",\"href\":\"c6p4.xhtml\",\"index\":43},{\"label\":\"Part 5\",\"href\":\"c6p5.xhtml\",\"index\":44},{\"label\":\"Part 6\",\"href\":\"c6p6.xhtml\",\"index\":45},{\"label\":\"Chapter 7: The Time of the Decisive Battle\",\"href\":\"c7.xhtml\",\"index\":46},{\"label\":\"Part 1\",\"href\":\"c7p1.xhtml\",\"index\":47},{\"label\":\"Part 2\",\"href\":\"c7p2.xhtml\",\"index\":48},{\"label\":\"Part 3\",\"href\":\"c7p3.xhtml\",\"index\":49},{\"label\":\"Part 4\",\"href\":\"c7p4.xhtml\",\"index\":50},{\"label\":\"Part 5\",\"href\":\"c7p5.xhtml\",\"index\":51},{\"label\":\"Epilogue: Show Me What You’ve Got\",\"href\":\"e.xhtml\",\"index\":52},{\"label\":\"Part 1\",\"href\":\"e1.xhtml\",\"index\":53},{\"label\":\"Author's Afterword\",\"href\":\"authors-afterword.xhtml\",\"index\":54}],\"volumeTitle\":\"Light Novel 3rd Year Volume 3\",\"detailsLink\":\"/select/year-3/y3v3\",\"returnLink\":\"/select\",\"currentSpineIndex\":27,\"nextVolumeLink\":\"$undefined\",\"nextVolumeTitle\":\"$undefined\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"nam
