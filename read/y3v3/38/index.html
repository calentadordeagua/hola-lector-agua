e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T2863,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 4\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIT WAS 6:00 PM on the second day. The supplies we acquired included food such as nutritional bars, two kilograms of white rice and canned goods. In addition, there were five new plastic bowls and cups and thoughtfully, five pairs of disposable chopsticks as well. We decided who would eat the white rice with a fair game of rock-paper-scissors, under the condition that no one could refuse without a reason and I became one of the winners. I decided to gratefully accept the warm meal.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhite steam billowed gently from the lid of the mess tin over the evening campfire. With the orange-dyed sky at my back, sweat beaded on my hands as I judged the fire\u0026apos;s heat. Before long, after the quiet crackling of scorching rice echoed through the quieting forest, I opened the lid and a cloud of fluffy steam billowed out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUnder the setting sun, the freshly cooked white rice shone with a particular brilliance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as I picked up my chopsticks, Shibata, who\u0026apos;d been watching me from a distance, approached with his lips pressed firmly together.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;H-Hey, Ayanokouji. Sorry to bother you before you eat, but you got a sec?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t mind. What is it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Uh... how should I put it? We\u0026apos;re allies now, right? So, I just wanted to say hi, or something...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe said it while his eyes darted around, scratching his head vigorously.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Um... this is kind of a weird question, but\u0026#x2014;uh...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Go ahead and say it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I prompted Shibata, who was unable to get to the point, his averted gaze met mine.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The thing I want to ask is...!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as he seemed to have made up his mind and opened his mouth wide, another person approached from behind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Pardon me, Shibata, but could you give us a moment? I have something to discuss with Ayanokouji.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was Kanzaki, who\u0026apos;d taken the lead on serving duty; he approached with an empty mess tin in one hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;O-Oh, yeah, n-no problem at all. See ya later, Ayanokouji...!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs if fleeing, Shibata ran off and left the area.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Do you need something?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I forgot to tell you something important. Regarding the chain of command from here on, Ichinose has said to entrust everything to you, Ayanokouji.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see. I appreciate that, but are you ok with that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;My satisfaction is irrelevant. Ichinose is the leader of Class D. There are no longer any students in this class who would object to that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Such impressive loyalty.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOr perhaps their fangs had already been broken and they simply stopped caring about such trivial matters.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn any case, if things went smoothly, I had no complaints.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven after I told him what I\u0026apos;d forgotten to mention, Kanzaki made no move to leave.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is there something else?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...There\u0026apos;s something that I just can\u0026apos;t seem to accept.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHaving said that and pausing for a moment, Kanzaki continued.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why did you propose something as unprofitable as an alliance with Class D? I don\u0026apos;t understand why you\u0026apos;d go out of your way to lend us a hand and give us a chance to get back on our feet.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s no \u0026apos;why\u0026apos; to it. We were hit with a surprise attack from Ryuuen\u0026apos;s class and lost half our classmates in an instant. Without this alliance, we would\u0026apos;ve inevitably ended up in last place in this special exam. That means the alliance was certainly meaningful.\u0026quot;\u003c/p\u003e\u003cimg src=\"/hola-lector-agua/images/books/y3v3/OEBPS/NZqNxiuKjVjDCuFomTgTq.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s just looking at the result. You were scheming with Ichinose behind the scenes to form an alliance before the island exam, no, even before we became third-years, weren\u0026apos;t you? At the very least, I can\u0026apos;t imagine Class C had any need for it at that point. You should be able to recover on your own and compete with Class A and Class B.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKanzaki had met my father, Ayanokouji Atsuomi. And just as Kanzaki\u0026apos;s father admired that man, so did he. Consequently, his opinion of me, Atsuomi\u0026apos;s son, was also inevitably high.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re overestimating me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m no fool. It\u0026apos;s not just because of your father; I\u0026apos;ve watched you for more than two years now, so I\u0026apos;m well aware. You have the power to turn the tide of battle all by yourself.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s an odd thing to say. I lost half my classmates to Ryuuen\u0026apos;s surprise attack. And just this morning, I took an all-or-nothing gamble, lost six people and failed to secure any supplies. If you don\u0026apos;t call that overestimating me, what do you call it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course, no one is perfect. Anyone can make a miscalculation like that. Or rather, even before that, Class C just isn\u0026apos;t suited for fighting.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s precisely why. Can\u0026apos;t you think of the alliance as insurance, just in case? It won\u0026apos;t have a major impact on Class C if Class D rises up a bit. And it\u0026apos;s useful in other ways, too. If we couldn\u0026apos;t count on Class D growing and rising over this next year, then Horikita and Ryuuen would only have to focus on Class C. It\u0026apos;s easier for us to operate if their attention is divided. I\u0026apos;m not extending a hand for nothing.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn terms of overall strength, Class C was certainly a step ahead.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut in reality, it was Class C that was now asking for help and Class D accepted.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Class D is still developing. You can count on your potential for growth.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Still developing when we\u0026apos;re a lap behind?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s plenty of time. If we can manage a one-two finish in this special exam, the gap with the top classes will be trivial. Am I wrong?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I can\u0026apos;t shake the feeling that they\u0026apos;re still out of our reach... But I suppose Ichinose believes; believes that with you, we can aim for that\u0026#x2014;even after all these failures, Ichinose doesn\u0026apos;t seem to doubt your abilities.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was probably connected to why she said she was leaving the command to me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI finished my white rice and gently closed the lid of my mess tin.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen I stood up and moved to Kanzaki\u0026apos;s side.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It would be a problem if Ichinose were the only one aiming for Class A. You, Kanzaki, need to be on the same page as her and more than anything, you need confidence and resolve.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Confidence and resolve...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you still don\u0026apos;t get it, then you should take a good look at the view from here. You may want to deny it, but the strength that only Class D possesses is on clear, almost amusing, display.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the scene spread out before him, students from Class C and Class D were conversing without any wariness.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You should try to better understand just how incredible it is to be trusted.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was an environment where Class D, superior in numbers, could defeat Class C with a single surprise attack if they so chose.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf their opponents were Class A or Class B? They definitely couldn\u0026apos;t have felt at ease. They would\u0026apos;ve been fraught with anxiety, wondering when they\u0026apos;d be backstabbed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why don\u0026apos;t you come visit the sports gym sometime?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...That\u0026apos;s out of the blue. What brought that on?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s what they call being \u0026apos;so close, yet so far.\u0026apos; You should start by getting to know what kind of person Ichinose is up close.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI knew I might not get a favorable answer now, but it would be enough to simply plant the thought in his mind.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 4\",\"volumeId\":\"y3v3\",\"chapterIndex\":38,\"prevChapter\":{\"volumeId\":\"y3v3\",\"chapter\":37,\"title\":\"Part 3\"},\"nextChapter\":{\"volumeId\":\"y3v3\",\"chapter\":39,\"title\":\"Chapter 6: The Real Goal\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 3\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"h
