e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T27ee,"])</script><script>self.__next_f.push([1,"\u003ch1 class=\"heading_1\"\u003e\u003ca class=\"heading-link\" href=\"/read/y3v3/2\"\u003eChapter 6:\u003cbr/\u003eThe Real Goal\u003c/a\u003e\u003c/h1\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eCLASS B SPENT that night in tents pitched on the edge of the beach at E12, so the sound of the waves could be heard nearby even from inside. Ryuuen laid in his tent, lost in thought as he stared at the low ceiling. When he heard footsteps nearby, a faint shadow appeared.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s past nine o\u0026apos;clock.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt Katsuragi\u0026apos;s quiet report, Ryuuen silently sat up and went outside his tent.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe students who\u0026apos;d been waiting for Ryuuen to emerge greeted him one after another.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe ignored them and walked over to Katsuragi, who was waiting with a map spread out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIbuki and Ishizaki were also waiting for him with grim expressions.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;From last evening to this morning, no students from Class C or Class D have been eliminated. In fact, the two classes are now clustered together, intermingled.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So they teamed up, huh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I thought it was strange there were no signs of combat from the moment they made contact, but...for it to come to this.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s the only way for the nearly-annihilated Class C to survive, I guess. Heard they were making some weird contact with Ichinose, too. Means they were plannin\u0026apos; to team up from an early stage.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNow that it\u0026apos;d actually happened, it seemed like the best possible move for the wounded Class C to take.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yesterday\u0026apos;s battle with Koenji was also a huge blow. Losing nine people is a considerable loss. The fact that Morofuji survived without being eliminated was a silver lining, but...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Man, I really wish he\u0026apos;d just charged into Class C and Class D instead.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In this matter, the fault lies heavily with Komiya\u0026apos;s group for their rash, semi-provocative actions after their paths crossed. Had they quietly let him pass, it is highly likely a conflict could have been avoided.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe said after summarizing the report from Morofuji, who desperately returned to the main force yesterday.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh, but Ryuuen-san, that Koenji guy retired just a little while ago!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Guess he\u0026apos;s satisfied after hunting down some small fry. What a self-centered bastard.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The sacrifices were not insignificant, but it means one threat has been eliminated. That\u0026apos;s precisely why the frustration with Komiya\u0026apos;s group\u0026apos;s failure is mounting, however...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But Morofuji\u0026apos;s group \u003cem\u003ewas\u003c/em\u003e\u0026#xa0;trying to contact Kaneda before they fought Koenji, weren\u0026apos;t they?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs Ibuki interjected, Ishizaki also spoke up defensively.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Right at that moment, the Class C guys attacked to secure supplies, so the radio was tied up, right? I don\u0026apos;t think it\u0026apos;s fair to blame only Komiya\u0026apos;s group. They just had bad luck.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKatsuragi, to whom those words were directed, looked quietly at Ryuuen and opened his mouth.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Bad luck... was it? Do you really think so?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Nah. The timing was just too damn perfect. If they were serious about stealing supplies, they should\u0026apos;ve been able to rush over a bit sooner. Maybe they delayed a little to aim for when Komiya\u0026apos;s group would run into Koenji.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe main force and the detached unit. It was obvious which radio would be prioritized. If Ryuuen had been speaking directly with Kaneda, he could have relayed a message to Komiya\u0026apos;s group with little time lost, but with a VIP in between, there were inevitably delays and errors in the information transmission.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You mean \u003cem\u003ehe\u003c/em\u003e\u0026#xa0;planned that? If so, that\u0026apos;s too perfect. I can\u0026apos;t believe it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKatsuragi folded his arms and once again recalled the events of yesterday.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I also believe, as Ryuuen said, that there\u0026apos;s no doubt Ayanokouji orchestrated this, aiming for the moment Komiya\u0026apos;s unit and Koenji would overlap. However, he likely didn\u0026apos;t think the probability of an actual engagement was high. It is more natural to see it as him aiming for a by-product of his own attack.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf Komiya\u0026apos;s group calmly altered their course or hid themselves, they wouldn\u0026apos;t have ended up in a fight, judging from what Koenji said to Morofuji.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen and Katsuragi had the same thought. Even if that wasn\u0026apos;t the case, they firmly shared the understanding that their opponent was someone who\u0026apos;d do that kind of thing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Uh, um, Ryuuen-san. About Class C and Class D becoming allies, how are they gonna decide who gets the higher rank? Wouldn\u0026apos;t they normally not be able to agree...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Obviously Class C\u0026apos;s gonna compromise. No matter how you look at it, they\u0026apos;re headed straight for last place on their own. I can just picture \u0026apos;em, crying and begging Class D to help them out in exchange for letting them take the glory.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh, I see,\u0026quot; Ishizaki said, striking his fist into his palm in understanding.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s the key point. The issue of ranking, which would be a source of endless dispute if they were equals, becomes a viable alliance precisely because of the difference in their positions. They\u0026apos;ve certainly played a troublesome hand. As a result, their side has swelled to fifty people and the difference in numbers between them and us, who lost Komiya\u0026apos;s group, now exceeds twenty. The tables have completely turned.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKatsuragi explained the situation was no longer optimistic, but Ishizaki once again slapped his palm.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then how \u0026apos;bout we team up with Class A? Together we\u0026apos;d have sixty people!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And would we, who are similarly at a numerical disadvantage, concede and give first place to Class A?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Eh? Uh, well, that\u0026apos;s\u0026#x2014;can\u0026apos;t be helped, right? Ah, but no, that\u0026apos;s no good...!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOrdinarily, an alliance was not something easily formed. For two classes competing for the seat of Class A, not even a single class point was something they could readily compromise on.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo begin with, there was far too little merit for Class B in teaming up with Class A only to hand over first place.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was no trust between them and it was uncertain if they could even form an alliance. Even if they did, there was no guarantee they could beat C and D. Rather than shouldering multiple risks like that, it was more efficient for Class B, in its aim for the top, to defeat Class A directly and secure third place or higher.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If this had been a move right at the start, we would have still had several options, but for them to form an alliance here on the third day is more troublesome than I imagined.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven the path of defeating the crucial Class A was now hampered by the difference in numbers created by the elimination of Komiya\u0026apos;s group. It was inevitable that this would hinder their battles when the number of usable areas drastically decreased.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What will you do, Ryuuen? Today\u0026apos;s actions may well decide the outcome of this exam.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHis judgment as leader was now being tested.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe was the sole focus of Katsuragi, Ibuki and Ishizaki, all eyes were on Ryuuen.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe initiative had, at some point, slipped from Ryuuen\u0026apos;s grasp and was now passing to the opponent who should\u0026apos;ve been at a disadvantage.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe possibility that the lower-ranked alliance would launch a preemptive strike to defeat either Class A or Class B couldn\u0026apos;t be dismissed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Things are finally gettin\u0026apos; interesting.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor Ryuuen, one thing was certain: there wasn\u0026apos;t much time left.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eStill, he couldn\u0026apos;t come to a conclusion right away.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eLeaving word for his comrades to wait, Ryuuen turned his back on the three of them and began to walk toward the sandy beach.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 6: The Real Goal\",\"volumeId\":\"y3v3\",\"chapterIndex\":39,\"prevChapter\":{\"volumeId\":\"y3v3\",\"chapter\":38,\"title\":\"Part 4\"},\"nextChapter\":{\"volumeId\":\"y3v3\",\"chapter\":40,\"title\":\"Part 1\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 3\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":11},{\"label\":\"Prologue: Shiina Hiyori's Monologue\",\"href\":\"prologue.xhtml\",\"index\":12},{\"label\":\"Chapter 1: Opening. Survival G
