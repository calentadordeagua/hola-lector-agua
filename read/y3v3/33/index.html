e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T2935,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 5\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWE WITHDREW FROM area G11 and fell back to the evacuation point at H12, the designated spot in case of defeat. I had my classmates take a rest while I went a short distance away to talk with Shiraishi and Hashimoto.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs it happened, Yamamura was there by herself and she tried to leave when we approached, but when I told her it was fine for her to stay, she gave a hesitant nod.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It seems we\u0026apos;re not being followed. I believe we can rest easy for now.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We\u0026apos;re totally screwed... It\u0026apos;s like, I really felt the strength of the side that just waits. Or rather, they just have more guys who are genuinely better at survival games than we are.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile there was a big difference between attacking and defending, Hashimoto muttered his honest impression from the firefight with a hint of surrender.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo be honest, I didn\u0026apos;t think there was a huge difference in skill itself, but Class B\u0026apos;s fighting spirit and intensity were far superior. It was proof that Ryuuen\u0026apos;s high-pressure morale and orders were working in their favor.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ve just received one piece of good news.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi, who continued to communicate via radio even after confirming Class B wasn\u0026apos;t in pursuit, cut in during a lull in the conversation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Apparently, the GPS signals for the ten Class B students who went to E9 have all been eliminated, save for one.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Huh? The hell? What\u0026apos;s that supposed to mean?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It appears to be the result of their route completely overlapping with Koenji-kun\u0026apos;s GPS.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re not serious. He took out nine guys all by himself?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The situation would suggest so. It\u0026apos;s hard to say if he listened to Horikita\u0026apos;s instructions or if it was just a whim. Given how things have played out, the latter seems more likely.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Heh, if that\u0026apos;s the case, we\u0026apos;ve turned a disaster into a blessing. That bastard Ryuuen must\u0026apos;ve taken some serious damage.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto spoke cheerfully. It was true that this was likely an unforeseen battle for Ryuuen. The recent fight against Class C had an ideal outcome of six to one or two, but behind the scenes, he lost nine people. This was damage that couldn\u0026apos;t be ignored.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Still, we struggled just to take out one or two people and Koenji goes and solos nine? What a hell of a trade that turned out to be.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Koenji-kun has not been eliminated and is apparently still staying in E9 alone.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe took out nine people and still managed to survive without being eliminated?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;An unexpected outcome. Still, there\u0026apos;s a big gap between Class C and Class B.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI knew he was the type to swat down an annoying fly if it buzzed in front of his face, but it seemed he made contact and engaged them in a small area. The result appeared to be a more overwhelming victory for Koenji than I\u0026apos;d imagined, but it was unclear if it would motivate him. In fact, it seemed entirely possible he might just be satisfied and call it quits.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, I couldn\u0026apos;t be as genuinely happy as Hashimoto and the others about Koenji defeating nine people.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt first glance, it seemed like only a good thing for the other classes, but there was the matter of balance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was fifty-fifty on which way I wanted things to turn out, but it looked like I needed to give it some thought.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs Hashimoto, Shiraishi and I were talking, Matoba, who\u0026apos;d been fighting on the front lines, walked over, his expression one of utter exhaustion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Can I talk to you for a minute?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you\u0026apos;re gonna blame Ayanokouji for this situation, give me a break, man. He\u0026apos;s doin\u0026apos; his best while we\u0026apos;re half-destroyed as it is.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I know. That\u0026apos;s why I want to continue our talk from yesterday... no, the one we cut short.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The one we cut short?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I tilted my head slightly, not understanding what he meant, Matoba spoke hesitantly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s... about the alliance with Class D.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We can take our time and discuss that matter after this exam is over. Even if I get expelled, the deal won\u0026apos;t fall through, so don\u0026apos;t worry.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No... it\u0026apos;s because we\u0026apos;re in this situation that I want to talk about it now. You probably think this is self-serving, but I understood it clearly in that last fight. We can\u0026apos;t push back and what\u0026apos;s more, we can barely even move. It\u0026apos;s a certainty that the area will shrink from here on out and Class A or Class D might come to finish us off while we\u0026apos;re weak. There\u0026apos;s just no way I can see us surviving.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHaving fought them head-on, perhaps his spirit had been broken by Class B\u0026apos;s aggressive stance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s frustrating, but I can\u0026apos;t deny it. I\u0026apos;m trying my best to win for real, but there\u0026apos;s no guarantee we can turn this disadvantage around.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I know. That\u0026apos;s why I\u0026apos;m asking if we can make the alliance... official, right here and now.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;An alliance?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, if Class D will have us, I want to join up with them right away. I thought that would be for the best. If the alliance is formed, we\u0026apos;ll have a huge force of about fifty people. We could make a full recovery, not just some kind of rally, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs if it was their only option, he cast aside his pride and opened the lid he himself closed, making his appeal.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto reacted immediately, patting Matoba on the shoulder.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Nah, I was thinking the same thing. I\u0026apos;ve already told the class about the alliance talks and the C and D alliance is gonna be exposed soon anyway, right? It might be a little earlier than planned, but I think it\u0026apos;s the best way to protect ourselves.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile he followed my instructions, he would likely welcome any plan that was safer.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA brief silence fell as everyone held their breath, waiting for my answer.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s my fault things got this bad; I let my guard down. But it\u0026apos;s true that because we left the possibility of an alliance open, it might just be our last hope. Matoba, if you and the rest of our classmates can agree to it, then it\u0026apos;s worth taking that bet.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as Matoba nodded, Hashimoto clapped his hands together with a \u003cem\u003esmack\u003c/em\u003e.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll talk to the other guys. You cool with that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah, I\u0026apos;m counting on you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Alright. Leave it to me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThumbs-up and looking pleased, Hashimoto ran over to his battered and bruised classmates.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYamamura watched the exchange without saying a single word.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, she looked at me hesitantly, as if she had something she wanted to say.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What is it? If you have something on your mind, say it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah, no, it\u0026apos;s just... you accepted Matoba-kun\u0026apos;s... reproposed alliance so readily... I was just thinking... I\u0026apos;m sorry.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Was that wrong?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;N-No, of course, I also felt that merging with Class D was one of the best choices to protect our class now that we\u0026apos;ve been cornered this badly. It\u0026apos;s just... if this was going to happen, I can\u0026apos;t help but wonder if it might have been better to discuss the alliance again much sooner... Morishita-san might not have been eliminated and...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed Yamamura was thinking that I, of all people, could have tried to bring up the alliance again after we were ambushed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I was told to drop any talk of an alliance, so I couldn\u0026apos;t bring it up.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Right, of course... I\u0026apos;m sorry for saying something so strange.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven after hearing my answer, far from looking relieved, an even deeper shadow fell over Yamamura\u0026apos;s expression.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 5\",\"volumeId\":\"y3v3\",\"chapterIndex\":33,\"prevChapter\":{\"volumeId\":\"y3v3\",\"chapter\":32,\"title\":\"Part 4\"},\"nextChapter\":{\"volumeId\":\"y3v3\",\"chapter\":34,\"title\":\"Chapter 5: The Alliance\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 3\",\"href\":\"cover.xhtml\",\"inde
