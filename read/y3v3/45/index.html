e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T742a,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 6\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIN THE EVENING, after finishing their supply retrieval, Horikita and the others arrived at G8 around 5:25 p.m. This arrival time was a result of their constant wariness of an ambush, which had them keep the option of taking the route south from E6 to E8 open until the last possible moment. And just as they had five minutes prior, they received a report that the students from Class B and the Class C/D alliance were keeping their distance from G8.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I wonder what happened to the eight GPS signals that went to retrieve supplies at G9?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe instructions she\u0026apos;d been emphasizing over and over were confirmed by Matsushita through her VIP, Wang.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It seems that at 5:25, they were all observed moving back toward H10.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What the hell? So Ryuuen didn\u0026apos;t make a move after all, even though they were up against a small group?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey assumed that if one side moved, the other would move to intercept, but it didn\u0026apos;t lead to a confrontation. As a result, the group of eight students from Class C and Class D succeeded in retrieving the supplies without any trouble.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It can\u0026apos;t be helped. No one could have predicted that Koenji-kun would take down nine people.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Yeah, I guess. But one thing\u0026apos;s for sure, he wasn\u0026apos;t fightin\u0026apos; for us. He even casually dropped by the beach and retired afterward. This ain\u0026apos;t a game.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHorikita nodded once in agreement with Sudou\u0026apos;s words. Koenji accidentally entered a state of combat with ten students from Class B who moved to retrieve supplies and he defeated nine of them. All nine people he took out were guards; the VIP wasn\u0026apos;t among the defeated students. However, coordination between the analyst and the VIP and the VIP and the commander, was essential for accurately retrieving supplies. Immediately after learning of the battle, Horikita had them use tactics to identify the individuals, confirming that the only student who escaped was Morofuji Rika and that her role was the VIP.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In any case, we need to focus on ourselves rather than the other classes right now. I don\u0026apos;t think they\u0026apos;ll attack us with just those eight people nearby, but tell everyone to remain vigilant.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince they were only ten or fifteen minutes away in a straight line, the possibility that they would attack using individual GPS shutdowns was not, for the time being, zero. That was why she communicated to Matsushita to keep watch without letting her guard down.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was fifteen minutes later that Horikita, unable to fully shake her tension, finally felt a sense of relief.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter three GPS updates, the Class C students who\u0026apos;d been staying north of G9 finished retrieving their supplies and moved southeast. It was when she finished confirming that they were about to rendezvous with their allies in their designated waiting area, just before passing slightly through G10 and on to H10. There were only twenty minutes left. It was a distance that neither Class B nor the Class C/D alliance could possibly cover.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Good work, everyone\u0026#x2014;we can get some proper rest around here today.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt her voice, her classmates all lowered their weapons at once and took their tents out of their backpacks. Because the trees were dense, they could not pitch their tents together, so each of them began to work separately.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was just then.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Uwah!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA loud scream suddenly came from one of the boys, Hondou.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHorikita\u0026apos;s heart skipped a beat for a moment, but the cause of the scream was immediately clear.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was because a tree branch had pierced his tent, opening up a small hole.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Damn, there\u0026apos;s seriously no space to pitch a tent here.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It can\u0026apos;t be helped. This is the best position if we\u0026apos;re to prepare for tomorrow. Be careful as you work.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn about five minutes, Horikita finished setting up her own sleeping quarters and stretched once.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This is rough\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlthough they hadn\u0026apos;t engaged in combat, they were about to face the third night with food constantly scarce and not enough water. Her body was already in a state where it was beginning to show signs of its limit. It was a harshness unlike that of any uninhabited island exam from the past two years.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA short distance away, Horikita spotted Karuizawa and two other girls who\u0026apos;d just finished their work and recalled what she wanted to talk about during the day if she had time. She approached them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Do you have a minute?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hm? What\u0026apos;s up, Horikita-san?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince she had even less stamina than Horikita, the signs of her fatigue were pronounced, but she put on a smile and looked at Horikita.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s something I want to ask you... but it\u0026apos;s difficult to talk about here\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe excused herself to Shinohara and Onodera, who were near Karuizawa and they moved to a spot a short distance away.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Something you want to talk to me about? It\u0026apos;s something you don\u0026apos;t want overheard, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes, well, a little\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs a cool breeze gently enveloped the two of them, Horikita took off her goggles as if to catch her breath.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe time was almost 6:00. As a rule, they had to keep them on until the exam ended, but she judged that it wouldn\u0026apos;t matter anymore. Seeing this, Karuizawa also took off her goggles.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s pretty hot keeping these goggles on, isn\u0026apos;t it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKaruizawa let out a breath and relaxed into the pleasant breeze.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ask me anything. We\u0026apos;re friends, aren\u0026apos;t we?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWithout even looking at Horikita, who\u0026apos;d been unable to broach the subject, she asked and Horikita steeled her resolve.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s about Class C and D. In the end, we\u0026apos;ve come to the evening of the third day without the GPS signals of either class decreasing significantly all day. It\u0026apos;s a situation where there\u0026apos;s no doubt that the two classes have joined hands.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah, there\u0026apos;s no mistake about that. It\u0026apos;s easy for losing classes to team up.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis much had been talked about all over the class from last night until now.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t something that required a private conversation between the two of them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf that were the case, she immediately understood that Horikita wanted to take it one step further.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What\u0026apos;s bothering me is \u003cem\u003ewhen\u003c/em\u003e\u0026#xa0;the two classes decided to team up. We couldn\u0026apos;t make contact with other classes when the special exam details were announced and their starting positions were far apart, with our class in between.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince communication between commanders was also impossible, there was definitely no contact.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Class D is a special class. They might have felt sympathy seeing Class C in a wounded state. However, that doesn\u0026apos;t mean it\u0026apos;s easy to suddenly accept a half-destroyed enemy. It shouldn\u0026apos;t have been easy to form an alliance without some prior arrangement...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah. Hirata-kun and the others said the same thing. They were speculating about all sorts of things, like maybe he not only threw the match but also gave them Private Points.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKaruizawa spoke while reminiscing and while Horikita agreed, she voiced another possibility.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Right after he left the class, he and Ichinose-san became close... well, \u0026apos;close\u0026apos; might be the wrong word, but I\u0026apos;ve sensed that they\u0026apos;ve been closing the distance between them.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe opening ceremony when he left the class. That day, Ayanokouji already met with Ichinose in addition to the Class C students after school. Perhaps their cooperation had been in motion beneath the surface since then.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWanting confirmation on that point, Horikita replied to Karuizawa.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see... yeah, I think so too. In fact, I\u0026apos;m sure of it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So you think the same.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah. The relationship between Class C and D has definitely gotten deeper than before.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKaruizawa nodded firmly. In response, Horikita made a mental note that she might need to reconsider the future.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Um... you kinda dodged this the other day, but can I ask you something a little more personal?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hm, I dodged something? What are you talking about?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even though you\u0026apos;re enemies now, do you like Ayanokouji-kun, Horikita-san?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? Wh-when you said \u0026apos;more personal,\u0026apos; you meant \u003cem\u003ethat\u003c/em\u003e?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s pretty important to me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I-I already told you, I\u0026apos;ve never been in love with anyone, have I not?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But you\u0026apos;re flustered.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;When someone asks you a question like whether you like someone or not, it\u0026apos;s only natural to get flustered.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePlacing both hands behind her back along with her goggles, Horikita averted her gaze.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then do you like Sudou-kun?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course not. He\u0026apos;s a dependable classmate.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;See? You answered instantly. And it was a similar question.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith a grin, Karuizawa pointed at Horikita as she made her point.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was true; when it came to Ayanokouji, her mind would freeze for a moment and she couldn\u0026apos;t think straight.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe felt it for some time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t as if she\u0026apos;d never questioned it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd yet, she still hadn\u0026apos;t found the right answer for her own feelings.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you\u0026apos;re holding back because of me, you don\u0026apos;t have to. I don\u0026apos;t think it\u0026apos;s a bad thing to like the same person... besides...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor a moment, the smile vanished from Karuizawa\u0026apos;s face, replaced by a shadow.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Besides... what?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe couldn\u0026apos;t help but ask.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not just me and you who like Ayanokouji-kun, Horikita-san. Ichinose-san does too.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...She does...? No, I\u0026apos;m not that surprised, but... is that true?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s true. And I think their relationship is probably more than you imagine, Horikita-san.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You mean... they\u0026apos;re dating?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor a moment, she wondered if that might be one of the reasons they had formed an alliance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut Karuizawa shook her head and continued quietly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Um, I don\u0026apos;t think so... but it\u0026apos;s something close to that, I guess.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m sorry, I don\u0026apos;t quite understand what you mean\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as she started to ask for more details, noisy voices came from the direction of the campsite.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKaruizawa in front of her also sensed the faint disturbance and their eyes met.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as it seemed to have gone quiet for a moment, the noisy voices returned.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis time, they didn\u0026apos;t die down and with the passage of time, the clamor grew twice as loud.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMixed in with those voices, the sound of a projectile flying could be faintly heard.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA dry sound echoed repeatedly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is someone shooting? Am I imagining things?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was the question. However, the dry sounds continued to come from the direction of the tents.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...There\u0026apos;s no mistaking it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe sound of someone firing a paintball gun rang out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDuring the exam, they\u0026apos;d fired paintballs for practice several times, so it was by no means an unusual sound.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven so, a sense of unease filled her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe time on her watch showed it was just past 5:57 PM.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eStrictly speaking, it was a time when the exam was not yet over.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut it was impossible.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe received a report that all eight GPS signals remaining nearby were on their way back to the enemy\u0026apos;s main force. From that point, even if they aimed for Class A, there was no way a normal person could\u0026apos;ve made it in time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Let\u0026apos;s go back.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe two of them ran toward the direction of the sound.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe hoped it was just a shot fired on accident, or playing around.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHorikita strongly wished for that, but upon returning near the tent, she noticed the disaster.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIjuuin, standing stunned nearby, noticed Horikita\u0026apos;s presence and turned around.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ugh... I was shot!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIjuuin clutched his abdomen, where a paintball splattered and the alarm on his watch was ringing. And as she looked around, between the erected tents, she caught sight of Mori with a splash of paint across her back.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;How many enemies!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I-I don\u0026apos;t know. Someone suddenly started shooting from the woods... a-and, but Sudou and the others went chasing after them that way!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the direction he pointed, several students were still running, weapons in hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe thought about returning to the tent to retrieve her weapon, but decided it was better to rush over even a second sooner, Horikita immediately followed after the students.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile readjusting her goggles, she took the handgun from the holster on her leg that she hadn\u0026apos;t removed and scanned for the unseen allies and enemies.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAhead, the sound of gunfire continued, two, three times.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe\u0026apos;d fired the handgun several times in practice, but even so, she\u0026apos;d yet to fire a single shot in actual combat.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was the same for her allies fighting back ahead of her, who\u0026apos;d been caught completely by surprise. A sense of urgency grew within her, thinking that it was no different from when Class C was ambushed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Where... where are you...?!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf there were multiple enemies, she felt she should\u0026apos;ve spotted at least one, but she saw no one other than her classmates. Kicking up dirt and treading on leaves, Horikita spotted a human silhouette ahead and raised her gun.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut it was an ally, not an enemy. She found Onodera sitting down, having been shot in the back. Noticing the footsteps, Onodera turned around, her expression regretful, but she immediately pointed to the northeast.\u003c/p\u003e\u003cimg src=\"/hola-lector-agua/images/books/y3v3/OEBPS/EGbDuJmiXVGhxCZxyQkZU.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t worry about me\u0026#x2014;that way!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Thank you!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe passed by her and rushed ahead, gun raised. Where her vision opened up slightly, she saw several students continuously firing their paintball guns toward a single point.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Corner him! This way!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;He went that way!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eLost amidst those voices, Horikita tried to grasp the situation and called out to Miyamoto, who was holding a shotgun.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The enemy? How many?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s Ayanokouji! Ayanokouji! He came barging in here all on his own!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt that moment, several classmates moved in from the left and right, trying to circle around behind a large tree.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So he\u0026apos;s over there...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMiyamoto nodded. Even Horikita, who\u0026apos;d just arrived, could see at a glance that Ayanokouji was completely surrounded and in an inescapable situation. He\u0026apos;d already been cornered.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was no way for him to hide from the paintballs fired by the students surrounding the large tree.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNot only were Horikita and Miyamoto in front of him, but there were also male and female guards to his left, right and rear. It was truly a hopeless situation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo attack alone and infiltrate the Class A campsite was far too reckless.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlthough he\u0026apos;d taken down several guards, she wondered if it was worth the value of a student like Ayanokouji.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHorikita felt a sense of doubt at an action so disproportionate to the risk, but there wasn\u0026apos;t enough time to find an answer.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnother three or four seconds\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd with that, this commotion would come to an end.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBefore his classmates could complete their encirclement, Ayanokouji moved.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe took half a step forward from behind the large tree, aimed only at Ike and moved to raise his weapon.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWas his intention to take at least one person down with him if he was going to be defeated?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, just a fraction of a second faster, the Class A students placed their fingers on the trigger.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Fire\u0026#x2014;!!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHondou shouted as if giving a command; the situation was perfectly set up for a 100% elimination.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was then that Horikita realized it. She realized what Ayanokouji\u0026apos;s aim was and why he was able to charge in all by himself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No! Don\u0026apos;t shoot!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlmost at the same time as the sound of someone\u0026apos;s gunshot, Horikita screamed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, four of the students who had their weapons ready already finished pulling the trigger.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePaintballs hit Ayanokouji\u0026apos;s right hand, right foot and the area near his side one after another, just as he was about to shoot them. The alarm blaring from his watch clearly indicated he was out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I did it! I did it! I\u0026apos;m the one who took down Ayanokouji! Serves you right, Ayanokouji!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIke, who hadn\u0026apos;t heard the voice telling them to stop, jumped for joy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe casualties were three people: Ijuuin, Onodera and Mori. It was a one-for-three trade, but it was a different story when the opponent was Ayanokouji. The students must have even thought they\u0026apos;d come out ahead by defeating the leader.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn a situation where it wouldn\u0026apos;t have been strange to be celebrating, Horikita squeezed her eyes shut.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s no use... He isn\u0026apos;t out...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? I\u0026apos;m tellin\u0026apos; ya, they were clear hits! His watch is goin\u0026apos; off and everything!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe classmates exchanged high-fives, unable to contain their excitement.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut the one who was calmer and more composed than anyone was the man who should have been out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;My bad, Ike. It looks like you\u0026apos;re the ones who are out, not me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What the hell is that...?! I don\u0026apos;t get i\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...It\u0026apos;s six o\u0026apos;clock. It\u0026apos;s already past six o\u0026apos;clock.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe watch Horikita confirmed by bending her left arm had just passed 6:00:32.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh...? Wha...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The moment it turns 6:00 p.m., that day\u0026apos;s test ends. All subsequent eliminations are rendered invalid and the student who fired the shot to take someone down is eliminated instead\u0026#x2014;that was the rule, wasn\u0026apos;t it, Horikita?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA solo attack, aimed at a moment when their guards were down.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe anger of having their comrades taken out and the perfect opportunity to defeat a traitor.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe students, driven by impulse, had completely forgotten about the current time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf it was even one second past 6:00 p.m., the elimination was invalid. The signal emitted from Ayanokouji\u0026apos;s watch clearly recorded him as safe.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you charge into the enemy camp alone, you won\u0026apos;t get away unscathed. You deliberately used that, didn\u0026apos;t you...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s right. My bad.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAyanokouji answered and glanced at Horikita for just a moment, but immediately looked away.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSometime after 7:00 p.m., the school staff arrived and supplied Ayanokouji with a new tracksuit, after which the four students who fired and hit him outside of test hours retired by self-reporting.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe result of one person charging in alone was that he forced a mistake from his opponent and got as many as seven students eliminated.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile the commotion still continued, Ayanokouji silently began to set up his tent.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;H-Hey, what the hell are you doin\u0026apos; settin\u0026apos; up a tent here?!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I was under the impression I was free to set it up anywhere, but am I being a nuisance?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course you are!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s no good, Hondou-kun. It\u0026apos;s better not to keep Ayanokouji-kun at a distance.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? So what\u0026apos;re you sayin\u0026apos;, Hirata? That we should sleep with the enemy?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Fighting outside of hours is forbidden and if Ayanokouji-kun cheats, he\u0026apos;ll be retired. What I\u0026apos;m trying to say is that if we keep Ayanokouji-kun at a distance, it will be easier for him to escape. Besides, at nine o\u0026apos;clock tomorrow morning, he absolutely has to start from the same area as us.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;O-Oh, right. So we can just blast him with paintballs when morning comes...!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Because you understood that, you decided to set up your tent here too, didn\u0026apos;t you, Ayanokouji-kun?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even if I were to keep my distance and set up camp somewhere else as if to escape now, it\u0026apos;s obvious you\u0026apos;d just come to surround me in the morning anyway. It\u0026apos;s better if we both don\u0026apos;t waste our energy.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hey, you know... I don\u0026apos;t think you realize you\u0026apos;re in the enemy\u0026apos;s cage, do you...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNext to Hondou, Shinohara, who\u0026apos;d been glaring with resentment over Ike being eliminated, grumbled this.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That might be true.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnswering matter-of-factly without denying it, Ayanokouji went inside the tent he\u0026apos;d pitched.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHorikita was unable to say a single word and could only stare, dumbfounded.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 6\",\"volumeId\":\"y3v3\",\"chapterIndex\":45,\"prevChapter\":{\"volumeId\":\"y3v3\",\"chapter\":44,\"title\":\"Part 5\"},\"nextChapter\":{\"volumeId\":\"y3v3\",\"chapter\":46,\"title\":\"Chapter 7: The Time of the Decisive Battle\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 3\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":11},{\"label\":\"Prologue: Shiina Hiyori's Monologue\",\"href\":\"prologue.xhtml\",\"index\":12},{\"label\":\"Chapter 1: Opening. Survival Game Special Exam.\",\"href\":\"c1.xhtml\",\"index\":13},{\"label\":\"Part 1\",\"href\":\"c1p1.xhtml\",\"index\":14},{\"label\":\"
