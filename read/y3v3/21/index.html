n: left\"\u003eThis made it clear that the effect of their tactic had worn off and it could be said that the risk of them lurking nearby had also been significantly reduced.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Also, the three who strayed have all been eliminated. Unfortunately, it seems they headed toward the vicinity of F10 and were taken down.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Can\u0026apos;t be helped, I guess... Without the VIP, you can\u0026apos;t tell what\u0026apos;s goin\u0026apos; on. Hey, but what do you mean, \u0026apos;concentrated in F10\u0026apos;? That doesn\u0026apos;t mean everyone, right? Give me the details.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUnflustered by Hashimoto\u0026apos;s prodding, Shiraishi traced a thin, white fingertip along the unfolded map.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;As I mentioned, the blue GPS signals\u0026#x2014;that is, the people believed to be Class B\u0026apos;s main force\u0026#x2014;are gathered here in F10. However, another ten blue GPS signals have also moved to the area one-southeast of here.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ten people? Is a detached unit comin\u0026apos; after us?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, I wonder about that. If we reason it out normally, there\u0026apos;s a possibility that one or two students followed us on impulse, like Kondou and the VIP and their guards accompanied them to pick them up. The large number is likely due to their concern that the commander would use a tactic to identify the individuals.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I agree with Ayanokouji Kiyotaka\u0026apos;s reasoning. If just one or two of them were to carelessly go and pick up the stragglers, it would be like proving they were the VIP.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So that\u0026apos;s the most likely scenario, huh. But we can\u0026apos;t let our guard down yet, can we? They can only use the group-wide GPS once, but they can use the individual GPS stop three times, right? There\u0026apos;s still a chance they\u0026apos;ve followed us this close\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s unlikely. It was a successful operation because it combined two things: a surprise attack and a group-wide attack, strategy and firepower. Even if they used their three chances to fake the GPS locations of three people, they wouldn\u0026apos;t have a follow-up. Without moving the VIP, it\u0026apos;s also difficult for them to grasp our precise location.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...I see. So that means we can finally relax, huh.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven Hashimoto, who\u0026apos;d been shouting and barely escaped the storm of paintballs with his life, looked utterly exhausted. Everyone, including Shiraishi\u0026apos;s group, sank powerlessly to the ground.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEighteen people were left. The expression \u0026quot;half-decimated\u0026quot; was a perfect fit.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTwo VIPs, one analyst and fifteen guards.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom there, Rokkaku became the analyst to fill Nakajima\u0026apos;s place, leaving fourteen guards. The scout position was also vacant, but for now, we prioritized the number of guards and put that on hold. We were put in a difficult situation where we couldn\u0026apos;t afford to clash head-on with other classes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was my misjudgment to stop for so long, thinking the enemy wouldn\u0026apos;t attack once we had put some distance between us.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA situation brought about by none other than the carelessness and arrogance of the Class C leader.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a battle that would make anyone, both inside and outside the class, think that way.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 4\",\"volumeId\":\"y3v3\",\"chapterIndex\":21,\"prevChapter\":{\"volumeId\":\"y3v3\",\"chapter\":20,\"title\":\"Part 3\"},\"nextChapter\":{\"volumeId\":\"y3v3\",\"chapter\":22,\"title\":\"Chapter 3: The Unseen Pressure\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 3\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":11},{\"label\":\"Prologue: Shiina Hiyori's Monologue\",\"href\":\"prologue.xhtml\",\"index\":12},{\"label\":\"Chapter 1: Opening. Survival Game Special Exam.\",\"href\":\"c1.xhtml\",\"index\":13},{\"label\":\"Part 1\",\"href\":\"c1p1.xhtml\",\"index\":14},{\"label\":\"Part 2\",\"href\":\"c1p2.xhtml\",\"index\":15},{\"label\":\"Part 3\",\"href\":\"c1p3.xhtml\",\"index\":16},{\"label\":\"Chapter 2: A Surprise Attack\",\"href\":\"c2.xhtml\",\"index\":17},{\"label\":\"Part 1\",\"href\":\"c2p1.xhtml\",\"index\":18},{\"label\":\"Part 2\",\"href\":\"c2p2.xhtml\"
