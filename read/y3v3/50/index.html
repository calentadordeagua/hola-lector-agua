e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T4cc1,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 4\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFROM THE SURROUNDING clamor, Class C and D soon learned that an intense firefight had begun. At the same time, the commanders reported that Class A likely used a tactic, along with who\u0026apos;d been taken out. Eight from Class B and five from Class A. Perhaps as a result of getting the drop on them from behind, a slight advantage had begun to emerge in that short amount of time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Looks like Class A circled around back and engaged Class B.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah... If we keep advancing now, we can trap Class B between us\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But you get it, right, Kanzaki? The orders we got from Ayanokouji were...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I understand.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNodding, Kanzaki immediately ran to the rear. He then began to move out with the members he\u0026apos;d spoken to in advance. After seeing them off, he turned his attention back to the front.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s been about five minutes since the shooting started, right? For all that, maybe not as many people have been taken out as I thought.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen he murmured, speaking to Takemoto, who walked beside him, Takemoto also nodded in agreement.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Doesn\u0026apos;t that just mean they\u0026apos;re fighting while prioritizing defense?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well then, shall we get going\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as he rose from his crouch, a paintball hit the shoulder of Matoba, who\u0026apos;d been preparing beside Hashimoto.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hgh!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHis watch announced that he was out and Hashimoto, judging it was dangerous to stay there, immediately fled.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s Class A! Hirata\u0026apos;s here, Hashimoto!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMatoba, who\u0026apos;d been shot, shouted as he glared in the direction the paintball came from.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hirata? Didn\u0026apos;t he circle around behind Class B...!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere, Hashimoto understood that it wasn\u0026apos;t their entire class, but that Class A sent only some of their students around back, leaving several behind to deal with the alliance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Take us out with a small group? Are they serious?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt that point, Class A had 16 to 19 guards remaining. Assuming they assigned half of them to Class B, it wasn\u0026apos;t realistic for the remaining eight or nine to take on an allied class of about 40 people. The number of paintballs that occasionally flew their way was by no means large.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven when they shot back, there wasn\u0026apos;t an overwhelming retaliatory volley.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...What\u0026apos;s going on...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto thought they split into two groups, but they might have actually been divided into even smaller units.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe advance had initially begun with the intention of pressing Class A with Class B and the allied classes to drop them to last place. However, Class A\u0026apos;s use of tactics shut down the overall GPS and part of Class A circled around behind Class B. Meanwhile, the allied classes continued to advance, figuring it didn\u0026apos;t matter if the target they were trapping switched from Class A to Class B, but the ones they were actually facing were from Class A.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust then, a faint shout could be heard from the direction Kanzaki went, the complete opposite of where Hirata\u0026apos;s group was hiding.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Damn, what the hell... I can\u0026apos;t even tell who\u0026apos;s fighting where anymore...!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith the VIP no longer nearby, he had no way of grasping the details of the battlefield. That being the case, he cleared his head for a moment. The only thing Hashimoto could do was to confront Hirata and the other Class A students and win.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut that was difficult. Hashimoto attacked, using his paintballs without hesitation, but they kept changing their positions and he couldn\u0026apos;t get a clear shot.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat\u0026apos;s more, the paintballs they shot back always grazed just past Hashimoto.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Not bad, Hirata... You\u0026apos;re way more skilled than I thought. There\u0026apos;s no hesitation or mercy in your aim.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto broke out in a cold sweat, letting slip his frank impression of Hirata, who was hiding up ahead.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe knew from the start that Hirata was good at sports, but his miscalculation lay elsewhere.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe naked killing intent, unbecoming of a mere honor student, was what surprised Hashimoto more than anything.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if it meant a mutual takedown, he would absolutely defeat his opponent.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven that level of intent seemed to be flying toward Hashimoto along with the paintballs.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2014;Hah...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile confronting his rising heart rate, Hashimoto racked his brain for a way out of the situation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJudging by the back-and-forth so far, Hirata had slightly more momentum, but their skills were evenly matched.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe number of rounds left in his magazine was less than half and it was entirely possible that Hirata had a spare.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if he tried to use the terrain to flank him, it wouldn\u0026apos;t be easy, given who his opponent was.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...No matter how you look at it, I\u0026apos;m at a disadvantage, huh.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf that was the case, should he settle for a mutual takedown? No, that conclusion could wait a little longer.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe only area where he could confidently say he had the upper hand was with his words.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t too late to use them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince his position was exposed anyway, there was no problem with raising his voice.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Never seen you with such a desperate look on your face before! Did getting abandoned by Ayanokouji really piss you off that much?!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a taunt meant to agitate him, thinking it would be a win if it made his aiming hand waver.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe loud voice that echoed through the forest was soon swallowed and silence returned.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;How \u0026apos;bout it? I could ask Ayanokouji to negotiate pulling you into our class. You\u0026apos;re a sharp guy and the girls love you. I bet we could get you a seat at the table, eh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe considered psychological warfare to be the key to victory and thoroughly tried to rattle him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto thought that if Hirata responded skillfully, he\u0026apos;d have him right where he wanted him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, even as time passed, Hirata still didn\u0026apos;t respond.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Givin\u0026apos; me the silent treatment, huh? You could at least say some\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as he was about to call out again, a sound of rustling through the bushes came from the direction where Hirata was likely hiding.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Tch...!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was Hirata who moved first. But Hashimoto\u0026apos;s reaction wasn\u0026apos;t delayed. Conscious of their remaining ammunition, they read each other\u0026apos;s lines of fire. Firing using tree trunks for cover, sliding with their bodies half-turned, a series of short feints canceled out each other\u0026apos;s aim. The bullets flew in high, thin arcs.\u003c/p\u003e\u003cimg src=\"/hola-lector-agua/images/books/y3v3/OEBPS/iFEfxFYibgiDbXJlsixbD.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Whoa, that was close!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust after Hashimoto pulled his face back behind the tree, the paintball hit the trunk and splattered spectacularly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe rise in tension was extraordinary, as a direct hit meant instant elimination.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe series of exchanges at a relatively close range was a rapid succession of impacts. Bullets grazed the tree bark and pulverized the fallen leaves on the ground. Hashimoto spun his body at a sharp angle, trying to get to Hirata\u0026apos;s flank, but Hirata had read his move. Lowering his stance, a single shot returned from the hip grazed Hashimoto\u0026apos;s shoulder, leaving a stain.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Kuh...!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA cry of anguish, not of pain. The trivial mistake born from losing the exchange of wits sent a chill down his spine.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And I don\u0026apos;t have time to be wasting on one guy...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe held his weapon vertically and tried to recall the times he pulled the trigger during the fight, wondering how many rounds he had left.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe had certainly fired more than forty shots, leaving only a few at best.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShould he change the magazine early, or should he use up every last shot?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHis opponent showed no sign of reloading either and likely had a similar number of rounds left.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBoth were close to emptying their magazines, hinting at the need to reload. The existence of spare magazines dulled the choice between offense and defense. To retreat meant defeat. To push through meant victory. But half the battle was a dialogue of the mind\u0026#x2014;in other words, psychological warfare. Every piece of information, from each other\u0026apos;s breathing and the trembling of their fingers to their habits of shifting weight on the soles of their shoes, was crucial. For a moment, Hashimoto hid in the shade of a tree before trying a ploy in a low voice.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ayanokouji was sayin\u0026apos; he felt bad about what he did to you, Hirata.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs his voice broke the forest\u0026apos;s silence like a rolling pebble, Hirata\u0026apos;s gaze faltered for just an instant at those words.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBetting on that slight mental disturbance, Hashimoto leaped out. He squeezed the trigger with all his might.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe certainly caught Hirata by surprise. But\u0026#x2014;although two bullets flew out, they missed and unluckily, a third failed to emerge. He was out of ammo.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHirata immediately composed himself for a counterattack and pulled the trigger in return.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNear Hashimoto\u0026apos;s ear, \u003cem\u003ebang\u003c/em\u003e!, paint splattered and color spread across the edge of his goggle\u0026apos;s field of view.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHis vision was obstructed. That was a huge disadvantage.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe dove back behind the tree and immediately kicked off the ground.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHis vision reduced to about thirty percent, Hashimoto immediately chose to create distance. He had to move quickly between the trees and regroup. Hirata could\u0026apos;ve shot Hashimoto in the back, but he too ran out of ammo at that exact moment. He pursued him, determined not to let him escape. They changed locations, once again bringing themselves to a close-range standoff.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a tense situation where the match would be decided in an instant if either of them showed the slightest opening.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith no time to worry about appearances, Hashimoto slid his goggles onto his forehead, removed the assault rifle\u0026apos;s magazine and immediately swapped it with his spare.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe then desperately rubbed the stained goggles with his fingertips to get the paint off, but seeing no significant improvement, he had no choice but to slide them back over his eyes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So this is what they call a desperate situation...!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto still had fifty rounds left. But when they ran out, it would be over.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOn the other hand, Hashimoto didn\u0026apos;t know how many rounds Hirata had.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, the same was true for Hirata. He didn\u0026apos;t know how many rounds his opponent had.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was even a possibility that he had no spare magazine and had just fired his last shot.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn that case, should he risk it and close the distance before Hirata could escape?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn a battle of attrition, mental fatigue would set in before physical exhaustion. Should he aim for a quick, decisive battle, or try to bait a mistake from his opponent in a war of attrition? Their breaths overlapped as the pale afternoon light streamed into the forest.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWho would be the first to make a fatal misstep?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBreathing heavily, Hashimoto peeked the muzzle of his gun just slightly from behind the tree.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSweat dripped from his chin. He saw Hirata\u0026apos;s shadow move at the edge of his vision.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was now or never.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto took aim and leaped out at once, closing the distance to Hirata.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eImmediately after, a dual gunshot rang out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe paintballs whizzed past each other and a sound like the air itself was splitting echoed through the forest.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto felt a hot sensation on his chest. Lowering his gaze, he saw the paint that had hit him slowly spreading.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHirata\u0026apos;s shot, fired at almost the same time, had been slightly faster.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe elimination tone sounded.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt should have been a lifeless electronic sound, but strangely, it sent a chill deep into his body.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Damn it\u0026#x2014;!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe shock sent Hashimoto to one knee.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHis breathing was ragged and his throat was parched as if it were on fire.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe match was decided\u0026#x2014;he understood that logically, but his heart hadn\u0026apos;t accepted the end.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...That was some serious spirit, Hirata. This match is my loss.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe praised Hirata in a hoarse voice.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a defeat that came after fighting with all his might.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHirata didn\u0026apos;t answer, he simply lowered his gun slowly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe movement stopped after a brief pause.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHis gaze, fixed on the kneeling Hashimoto, didn\u0026apos;t move.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe muzzle of the gun slowly rose once more.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hey... Hirata...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto\u0026apos;s breath caught as he looked into Hirata\u0026apos;s eyes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe could see a finger being placed on the trigger.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto was already out and the match had been completely decided.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf he were to add a follow-up attack, a heavy penalty awaited Class A.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If this is a joke, I\u0026apos;m not laughing.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe muzzle was pressed against his forehead. It was truly point-blank range.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA position from which he might be seriously injured if the trigger were pulled.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe might get shot.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as that impossible delusion crossed his mind, the trigger\u0026#x2014;was squeezed partway and then Hirata\u0026apos;s finger stopped moving.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSilence fell.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe wind passed through the forest. The smell of paint mixed with the dampness of the earth.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHirata said nothing, lowered the gun and turned his back.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe students of Class A and Class C were still fighting in a different area and he had to go support them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the ears of Hashimoto who was left behind, an echo lingered as if he could hear the unsqueezed trigger and a gunshot.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Guess I pushed the honor student a little too far\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a sharp fear, no different from actually having been shot a second time.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 4\",\"volumeId\":\"y3v3\",\"chapterIndex\":50,\"prevChapter\":{\"volumeId\":\"y3v3\",\"chapter\":49,\"title\":\"Part 3\"},\"nextChapter\":{\"volumeId\":\"y3v3\",\"chapter\":51,\"title\":\"Part 5\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 3\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":11},{\"label\":\"Prologue: Shiina Hiyori's Monologue\",\"href\":\"prologue.xhtml\",\"index\":12},{\"label\":\"Chapter 1: Opening. Survival Game Special Exam.\",\"href\":\"c1.xhtml\",\"index\":13},{\"label\":\"Part 1\",\"href\":\"c1p1.xhtml\",\"index\":14},{\"label\":\"Part 2\",\"href\":\"c1p2.xhtml\",\"index\":15},{\"label\":\"Part 3\",\"href\":\"c1p3.xhtml\",\"index\":16},{\"label\":\"Chapter 2: A Surprise Attack\",\"href\":\"c2.xhtml\",\"index\":17},{\"label\":\"Part 1\",\"href\":\"c2p1.xhtml\",\"index\":18},{\"label\":\"Part 2\",\"href\":\"c2p2.xhtml\",\"index\":19},{\"label\":\"Part 3\",\"href\":\"c2p3.xhtml\",\"index\":20},{\"label\":\"Part 4\",\"href\":\"c2p4.xhtml\",\"index\":21},{\"label\":\"Chapter 3: The Unseen Pressure\",\"href\":\"c3.xhtml\",\"index\":22},{\"label\":\"Part 1\",\"href\":\"c3p1.xhtml\",\"index\":23},{\"label\":\"Part 2\",\"href\":\"c3p2.xhtml\",\"index\":24},{\"label\":\"Part 3\",\"href\":\"c3p3.xhtml\",\"index\":25},{\"label\":\"Part 4\",\"href\":\"c3p4.xhtml\",\"index\":26},{\"label\":\"Part 5\",\"href\":\"c3p5.xhtml\",\"index\":27},{\"label\":\"Chapter 4: A Chance Encounter\",\"href\":\"c4.xhtml\",\"index\":28},{\"label\":\"Part 1\",\"href\":\"c4p1.xhtml\",\"index\":29},{\"label\":\"Part 2\",\"href\":\"c4p2.xhtml\",\"index\":30},{\"label\":\"Part 3\",\"href\":\"c4p3.xhtml\",\"index\":31},{\"label\":\"Part 4\",\"href\":\"c4p4.xhtml\",\"index\":32},{\"label\":\"Part 5\",\"href\":\"c4p5.xhtml\",\"index\":33},{\"label\":\"Chapter 5: The Alliance\",\"href\":\"c5.xhtml\",\"index\":34},{\"label\":\"Part 1\",\"href\":\"c5p1.xhtml\",\"index\":35},{\"label\":\"Part 2\",\"href\":\"c5p2.xhtml\",\"index\":36},{\"label\":\"Part 3\",\"href\":\"c5p3.xhtml\",\"index\":37},{\"label\":\"Part 4\",\"href\":\"c5p4.xhtml\",\"index\":38},{\"label\":\"Chapter 6: The Real Goal\",\"href\":\"c6.xhtml\",\"index\":39},{\"label\":\"Part 1\",\"href\":\"c6p1.xhtml\",\"index\":40},{\"label\":\"Part 2\",\"href\":\"c6p2.xhtml\",\"index\":41},{\"label\":\"Part 3\",\"href\":\"c6p3.xhtml\",\"index\":42},{\"label\":\"Part 4\",\"href\":\"c6p4.xhtml\",\"index\":43},{\"label\":\"Part 5\",\"href\":\"c6p5.xhtml\",\"index\":44},{\"label\":\"Part 6\",\"href\":\"c6p6.xhtml\",\"index\":45},{\"label\":\"Chapter 7: The Time of the Decisive Battle\",\"href\":\"c7.xhtml\",\"index\":46},{\"label\":\"Part 1\",\"href\":\"c7p1.xhtml\",\"index\":47},{\"label\":\"Part 2\",\"href\":\"c7p2.xhtml\",\"index\":48},{\"label\":\"Part 3\",\"href\":\"c7p3.xhtml\",\"index\":49},{\"label\":\"Part 4\",\"href\":\"c7p4.xhtml\",\"index\":50},{\"label\":\"Part 5\",\"href\":\"c7p5.xhtml\",\"index\":51},{\"label\":\"Epilogue: Show Me What You’ve Got\",\"href\":\"e.xhtml\",\"index\":52},{\"label\":\"Part 1\",\"href\":\"e1.xhtml\",\"index\":53},{\"label\":\"Author's Afterword\",\"href\":\"authors-afterword.xhtml\",\"index\":54}],\"volumeTitle\":\"Light Novel 3rd Year Volume 3\",\"detailsLink\":\"/select/year-3/y3v3\",\"returnLink\":\"/select\",\"currentSpineIndex\":50,\"nextVolumeLink\":\"$undefined\",\"nextVolumeTitle\":\"$undefined\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://classroom-of-the-elite-reader.vercel.app\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"COTE Reader\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"en_US\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:image:width\",\"content\":\"1200\"}],[\"$\",\"meta\",\"9\",{\"property\":\"og:image:height\",\"content\":\"630\"}],[\"$\",\"meta\",\"10\",{\"property\":\"og:image:alt\",\"content\":\"Classroom of the Elite Reader Preview\"}],[\"$\",\"meta\",\"11\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"12\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\"$\",\"meta\",\"13\",{\"name\":\"twitter:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"14\",{\"name\":\"twitter:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"15\",{\"name\":\"twitter:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"link\",\"16\",{\"rel\":\"icon\",\"href\":\"/hola-lector-agua/icon.svg?icon.ae5abf30.svg\",\"sizes\":\"any\",\"type\":\"image/svg+xml\"}],[\"$\",\"$L14\",\"17\",{}]]\n"])</script></body></html>
