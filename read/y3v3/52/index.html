e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T1f58,"])</script><script>self.__next_f.push([1,"\u003ch1 class=\"heading_1\"\u003e\u003ca class=\"heading-link\" href=\"/read/y3v3/2\"\u003eEpilogue:\u003cbr/\u003eShow Me What You\u0026#x2019;ve Got\u003c/a\u003e\u003c/h1\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTHE WATCH, INDICATING F11 to E11, struck 3:00 p.m. and Class A, having lost three VIPs, was forced out entirely and eliminated.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as I slowly removed my finger from the trigger, Yamamura and Shiraishi, along with Kanzaki and the two VIPs from Class D, appeared before me as I quietly surveyed our surroundings. There were five of them in total.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Were the remaining guards taken out?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. We were attacked by two Class B students while we were running away... According to Ichinose-san, it seems those two had their personal GPS signals turned off, so they completely caught us by surprise. We used the tactic you gave us permission to use beforehand and escaped and thanks to you buying us time, we were saved.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi reported the situation, though she was still breathing heavily.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Tell me the details.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYamamura, who was similarly out of breath, seemed unable to speak yet, so Kanzaki spread out a map instead.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The ones left in Class B are Ryuuen and Ibuki, as well as Yamashita and Yoshimoto. Their location is D11\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then there are three left. I just took down Yoshimoto there a moment ago.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed he hadn\u0026apos;t received the latest information from the commander yet.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...It seems several signals disappeared before we got here, but was that all you, Ayanokouji-kun?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I cleaned up the area within my line of sight to a certain extent. But it seems the two troublesome ones are still left.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe ones remaining from Class C were me and the VIPs, Shiraishi Asuka and Yamamura Miki. From Class D were the guard Kanzaki and the VIPs Beppu and Himeno. In terms of points, Class B and Class C had 102 points, while Class D had 201 points.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf the exam ended now, first place would be secured and second and third place would go to a sudden death match, huh.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It seems there\u0026apos;s no doubt that Class B\u0026apos;s VIP is Yamashita-san. I just got a message from Shimazaki-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I figured. There\u0026apos;s no merit whatsoever in making Ibuki the VIP.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eClass A taking last place was already set, so there was no risk of expulsion, but the rankings for third place and above weren\u0026#x2019;t decided.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe key wasn\u0026apos;t the number of VIPs, but the number of guards.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith one hour remaining, if even one guard from any class survived, they could unilaterally decide the outcome.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eShould I leave Beppu here, who still had stamina to spare, or should I leave Himeno?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What do you suppose their next move will be?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No matter how small the playable area has become, they\u0026apos;ll likely stick together. As for their tactics, there\u0026apos;s a possibility they still have one personal GPS jammer left, but with only one, they can\u0026apos;t track our movements without a VIP, so it\u0026apos;s not a huge problem. By the way, how much ammo do you two have?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Um, I have a full load. I... haven\u0026apos;t fired any shots... I also have two magazines... I\u0026apos;m sorry...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;On the contrary, I\u0026apos;ve used up pretty much everything. Whatever\u0026apos;s left in here, maybe 10 or 20 rounds, that\u0026apos;s all I\u0026apos;ve got.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then take this.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI handed Kanzaki the two magazines I had prepared as spares.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I appreciate it, but doesn\u0026apos;t this break the rules\u0026#x2014;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not robbery or anything. It\u0026apos;s just a transfer.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But what about you? Do you have enough ammo?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I have 22 rounds left. That should be enough.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then I can\u0026apos;t accept this. You should be able to use it more effectively than me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t worry. The important thing is for the guards to protect the VIPs and escape until the very end. Besides, sometimes it\u0026apos;s more convenient not to be carrying an excessive amount.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wouldn\u0026apos;t be an even match if I had 100 or 200 rounds, after all.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFighting in such a tense situation was the only way to enjoy it when the outcome was uncertain.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNow that third place or higher was guaranteed, I could cast aside any unnecessary thoughts and indulge in the survival game.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen would probably rather take down Shiraishi, Beppu and Himeno rather than confront me directly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut as time passed, the area would shrink further, forcing a confrontation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What... are you going to do?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ryuuen won\u0026apos;t be satisfied with the exam ending like this. If he doesn\u0026apos;t fight, he\u0026apos;s guaranteed either second or third place, but if he fights and wins, he has a chance to seize first.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFive minutes passed and the GPS updated.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe reports that came in from both Shimazaki and Ichinose stated that all the changes on the GPS were minor.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey maintained their state of standing still in roughly the same location without using any tactics.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sorry, but Beppu, could you come with me for a bit?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What are you going to do...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m not too keen on this stalemate leading to a sudden death match. If there\u0026apos;s no movement in the next ten minutes, I\u0026apos;m thinking of making a move ourselves.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had Yamamura and Shiraishi, as well as Kanzaki and Himeno, stand by for the moment. I instructed them to move immediately if anything changed on the GPS, then walked forward with Beppu.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was certain they were checking the GPS data from when I charged into Class A alone on the evening or morning of the third day to identify individuals, so word of my movement would undoubtedly reach them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen wasn\u0026apos;t stupid enough to be unable to perceive our movements and our objective.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Epilogue: Show Me What You’ve Got\",\"volumeId\":\"y3v3\",\"chapterIndex\":52,\"prevChapter\":{\"volumeId\":\"y3v3\",\"chapter\":51,\"title\":\"Part 5\"},\"nextChapter\":{\"volumeId\":\"y3v3\",\"chapter\":53,\"title\":\"Part 1\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 3\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":11},{\"label\":\"Prologue: Shiina Hiyori's Monologue\",\"href\":\"prologue.xhtml\",\"index\":12},{\"label\":\"Chapter 1: Opening. Survival Game Special Exam.\",\"href\":\"c1.xhtml\",\"index\":13},{\"label\":\"Part 1\",\"href\":\"c1p1.xhtml\",\"index\":14},{\"label\":\"Part 2\",\"href\":\"c1p2.xhtml\",\"index\":15},{\"label\":\"Part 3\",\"href\":\"c1p3.xhtml\",\"index\":16},{\"label\":\"Chapter 2: A Surprise Attack\",\"href\":\"c2.xhtml\",\"index\":17},{\"label\":\"Part 1\",\"href\":\"c2p1.xhtml\",\"index\":18},{\"label\":\"Part 2\",\"href\":\"c2p2.xhtml\",\"index\
