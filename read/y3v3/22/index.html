ign: left\"\u003eLooking down at the Class C students with their various expressions, Ryuuen quietly exhaled.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom the moment he deciphered the rules of the special exam and the lottery placed them starting in the area next to Class C. Ryuuen decided to immediately execute a certain strategy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a strategy to defeat Ayanokouji.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn a long battle spanning four days and three nights, everyone wanted to save their tactics with strict usage limits. Everyone would first think to avoid conflict. He turned that on its head.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t simply a reckless gamble that would determine victory or defeat within the first hour.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn a way, Ryuuen considered it the most effective countermeasure against Ayanokouji.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSuperhuman physical abilities and intellect.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe longer the special exam dragged on, the more time it would give Ayanokouji to think.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe would come up with effective ways to use their tactics.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd he would likely read the thoughts of Ryuuen, Horikita and Ichinose completely.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn that case, it was best to strike Ayanokouji before he could devise a clear plan.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was precisely the result of his judgment bearing fruit.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs Ryuuen stared at the results of the surprise attack, Katsuragi quietly approached him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ve finished confirming with Kaneda through the VIP. We have three casualties and they have fifteen. Among those fifteen were our target, Kitou and the designated VIP, Nishikawa. This is undoubtedly a great success, more than we could have imagined. Furthermore, it appears Class C got separated from three of its members while fleeing and they\u0026apos;re still wandering around this vicinity. We\u0026apos;ll take them out if we can before our tactic expires\u0026#x2014;I take it you have no objections?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah. If things go well, that\u0026apos;s eighteen people. Not bad.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;However...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKatsuragi, who had a slight concern, hardened his expression and continued.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Kondou and Komiya chased after the fleeing Class C and haven\u0026apos;t returned. It seems Kondou will catch up to Class C soon if he doesn\u0026apos;t take a wrong turn, but Komiya has strayed far off course and is isolated.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was bad news received from the commander.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s probably better if Kondou doesn\u0026apos;t catch up. I can\u0026apos;t imagine him accomplishing anything by jumping in alone against a cautious Ayanokouji. Leave him.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then, may I send Yamashita to retrieve Komiya? If you\u0026apos;re concerned about a girl going alone, I think we could assign a male student as an escort.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo find the stray students, a student who could coordinate with the commander was indispensable.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah, that\u0026apos;s fine.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen initially agreed with Katsuragi\u0026apos;s proposal to dispatch the minimum number of personnel.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No\u0026#x2014;send ten people.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe immediately retracted his statement and re-instructed him to significantly increase the number of personnel.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ten people? The risk of engagement seems low, but is this for insurance? I have no objection, but it will be a needless drain on their stamina.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I almost forgot myself, but moving in a small group will just give them a hint.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...I see, that makes sense. The GPS-Jamming tactic will expire soon. When that happens, our current location will be pinpointed by the other classes all at once, is that it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s right. They\u0026apos;ll know there\u0026apos;s a VIP mixed in with the group we send out.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBecause there was a tactic called Identify Person, which revealed the identity of a designated GPS signal, there was a risk of giving away the information that Yamashita was the VIP at a low cost, depending on their movements and timing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, if they moved as a unit of ten, the odds of identifying the VIP among them would be one in ten.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe figured that even if the movement was suspicious, the enemy would feel a strong reluctance to use Identify Person.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That may be true, but... are you sure? This will interfere with our plans for later.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;More importantly, how many bullets do we have left?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;About half, I\u0026apos;d say. We\u0026apos;ll definitely need to resupply at the next event, but we can still fight as planned.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven after receiving Katsuragi\u0026apos;s report, Ryuuen\u0026apos;s expression didn\u0026apos;t relax; on the contrary, his vigilance only increased.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a success so great that wanting anything more could be called a luxury.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, for Ryuuen, there was a reason he couldn\u0026apos;t rejoice wholeheartedly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Your strategy was a magnificent success and yet you don\u0026apos;t look happy at all.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as Katsuragi, wanting to know the reason, was about to ask Ryuuen for an answer, Ishizaki came running up, panting heavily.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ryuuen-san! Let\u0026apos;s go after those Class C guys right now and finish \u0026apos;em off! We\u0026apos;re all set to go, sir!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs if to follow Ishizaki, the students who were confident in their physical abilities gathered behind him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe second the order was given, the pursuit of Class C would begin.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2014;-No, this is as far as we go.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, Ryuuen ordered a retreat, rather than the attack they originally planned.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh!? Wh-what do you mean!? It went perfectly, didn\u0026apos;t it!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBefore they launched the surprise attack, Ryuuen suggested they would press the attack if their targets fled. Since the operation was a success, Ishizaki assumed they would give chase.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKatsuragi, too, showed some confusion at Ryuuen\u0026apos;s surprisingly timid move.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you certain you don\u0026apos;t want to pursue them? If we let Class C gain distance on us here, we might not be able to recover.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey could still close the distance with Class C. Looking ahead, where tactics like disabling the GPS would be useless and surprise attacks would be difficult, they should strike while they had the chance, Katsuragi said.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is there something on your mind?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If the ambush had been a \u003cem\u003etotal\u003c/em\u003e\u0026#xa0;success, sure, I would\u0026apos;ve been planning to hunt \u0026apos;em down \u0026apos;til they were wiped out.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You don\u0026apos;t consider this outcome a success?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;He held out longer than I expected.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen muttered this toward the back of Kitou, who\u0026apos;d been taken out and was now heading back to the starting point.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It certainly took some time, but our losses were minimal.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This ain\u0026apos;t about our losses. The problem is we failed to take down the one guy we needed to. If we\u0026apos;d gotten Ayanokouji in the ambush, I would\u0026apos;ve been fine with letting you and Ishizaki go and mop up the remaining small fry like you wanted. But as long as the most troublesome bastard is still standing, I wouldn\u0026apos;t be surprised if he managed to turn the tables on us even when we\u0026apos;ve got twice the strength.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf they got greedy and pursued too far, they could be counterattacked from an advantageous position.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOr they could risk walking into some kind of trap.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eConsidering those factors, Ryuuen decided to call off the pursuit.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;W-well, it\u0026apos;s true Ayanokouji\u0026apos;s a monster, sir, but this ain\u0026apos;t a fistfight. With this thing, even \u003cem\u003eI\u003c/em\u003e\u0026#xa0;might be able to take him down.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSaying so, Ishizaki raised the shotgun he was holding.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Maybe, if we were to surround him or chase him into a corner with no escape.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuen\u0026apos;s gaze fell on the deep forest where Ayanokouji and the other Class C students fled.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eVisibility was even worse there than here and the footing was poor.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd large trees grew thick enough for them to regroup and hide themselves.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBesides, if the other three classes aside from Class C chose to avoid conflict, Ayanokouji\u0026apos;s class would be guaranteed to finish in last place.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Now that one of their VIPs is down, Ayanokouji has no choice but to go on the offensive, like it or not. So there\u0026apos;s no need for us to jump the gun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter hearing this, Katsuragi processed Ryuuen\u0026apos;s decision to retreat in his own way.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I can\u0026apos;t say the thought that you\u0026apos;re being overly cautious with Ayanokouji hasn\u0026apos;t crossed my mind... but if we\u0026apos;re speaking from a position of maximum vigilance, then perhaps pulling back here is the best move. Just having our ambush succeed is a victory in itself. It\u0026apos;s an undeniable fact that we\u0026apos;ve blunted Class C\u0026apos;s opening gambit. And the fact that we\u0026apos;ve proven even Ayanokouji has openings we can exploit is also a major gain.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Exactly.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn reality, what Ryuuen gained from this surprise attack wasn\u0026apos;t just taking out half of Class C, including Kitou and a VIP.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat was more significant was that not even Ayanokouji was infallible. If Ayanokouji were omnipotent, he would\u0026apos;ve been able to foresee the ambush, quickly distance himself from Class B and escape.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe fact that even the most formidable opponent had a slight opening to exploit was a great relief to Ryuuen.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Very well, then. Let us assemble a ten-person search party, including the VIP Yamashita and send them out without delay.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKatsuragi called Nomura over, told her what they just discussed and had her take action immediately.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlthough some of the students, like Ishizaki, who were still excited from their victory, felt somewhat unsatisfied, they swallowed their feelings and accepted the decision, as it came from none other than Ryuuen.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 3: The Unseen Pressure\",\"volumeId\":\"y3v3\",\"chapterIndex\":22,\"prevChapter\":{\"volumeId\":\"y3v3\",\"chapter\":21,\"title\":\"Part 4\"},\"nextChapter\":{\"volumeId\":\"y3v3\",\"chapter\":23,\"title\":\"Part 1\"}
