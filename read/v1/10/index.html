[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:Tb3bf,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 4:\u003cbr/\u003eLadies and Gentlemen,\u003cbr/\u003eThank You for Waiting\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003e“G\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eood morning, Yamauchi!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good morning, Ike!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eArriving to class, Ike wore a broad grin as he called out to Yamauchi. It was rather unusual for them to get here so early. It’d been one week since the entrance ceremony, and Ike and Yamauchi would always make it to class right before the bell rang.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whew, man! I was looking forward to today so much that I barely slept last night!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah ha ha! This school is just the best! I can’t believe that it’s almost time for swimming! And when I say swimming, I mean girls. And when I say girls, I mean girls in school swimsuits!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was true that the swimming classes were co-ed. In\u0026#160;other words, that meant that Horikita, Kushida, and all of the other girls would be…showing off a lot of skin. The girls backed away from Ike and Yamauchi’s rabid excitement. I, on the other hand, sat in my chair, isolated and alone. I couldn’t do so forever. I had to proactively work at joining a group of friends.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFortunately, their conversation had ended, so I stood up. However, just then…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Professor! Come here for a sec!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh, you called?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA chubby boy, apparently nicknamed “The Professor,” approached them slowly. If I remembered correctly, his name was Sotomura or something like that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Professor, can you record the girls wearing their swimsuits for us?” Ike asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Leave it to me. I’ll pretend to be sick so that I can skip class and observe.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eRecord?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e What are you planning?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The Professor is going to rank the girls’ breast sizes for us. If we’re lucky, he’ll get some pictures with his phone.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, hey.” Sudou visibly drew back in response to Ike’s plan. If the girls found out about it, the consequences would be severe. However, despite the content of the conversation, I was jealous of their easy banter. Having friends had to be nice. I wanted friends, too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Pathetic,” a familiar voice said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re here, too, huh, Horikita?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just arrived while you were looking at those boys over there. You didn’t notice me. If you want to be their friend, why not try just talking to them?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shut up and leave me alone already. If I could just do it, I wouldn’t be agonizing over it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“From what I’ve seen, you don’t seem to be unsociable or lacking in communication skills, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are a lot of reasons why I can’t do it. So far, you’re the only person I’ve been able to talk to, Horikita.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though I’d exchanged contact information with Ike and the others, I still hadn’t been able to actually hold a conversation with them yet.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait just a minute. I already warned you not to, but you wouldn’t be thinking of me as your friend, would you?” said Horikita. She took a few steps away from me, as if in disgust.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s fine. No matter how low I sink, I’d never dream of being your friend,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. I feel a little relieved.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wondered just how much she hated having friends.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Ayanokouji!” Ike called my name. When I looked up, I saw him beaming at me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what is it?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI stood, stuttering as I did so. Horikita no longer showed any interest in me. A chance to enter into a new group of friends had suddenly fallen into my lap.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To tell you the truth, we’re taking bets on the girls’ chest sizes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’ve come up with some probabilities.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe Professor took out a tablet and opened a spreadsheet. The names of all the girls in our class were displayed. There were numbers listed as well. I honestly had no interest in gambling, but I couldn’t let this opportunity go to waste.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Umm. So, is it okay if I join you?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah! Come on, do it. Do it!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs of right now, Hasebe was the likeliest contender for the biggest breasts in the class. The odds sat at one to eight I hadn’t heard most of the names before. I couldn’t even remember my classmates’ names. This was too awful.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is way more elaborate than I would have thought. Aren’t you observing them a little too closely?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on. We’re men, aren’t we? Men have only two things constantly on t m;\"\u003eWhile I considered the offer, boys crawled out of the woodwork around me, getting blatantly excited over the size of the girls’ breasts. The girls in the classroom looked at us like we were dirt.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll join, too. By the way, my money’s on Sakura,” Yamauchi chimed in. Sakura was a somewhat plain girl who wore glasses, but because I’d barely talked to anyone, I honestly didn’t know that much about her. While it looked like he was pondering something, Yamauchi tapped the Professor and Ike on the shoulders and whispered something to them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m only telling you guys about this. The truth is, I actually confessed to Sakura.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?! S-seriously?!” Ike was the most surprised and flustered by this. Had his goal to become the first guy in class to snag a girlfriend fallen through?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, seriously. But keep this on the down low. It’s just between us, okay? I mean, I thought she was really plain at first, but then I saw her wearing regular clothes. She was \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehuge\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, man.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You doofus. If she’s not cute, you shouldn’t ask her out, even if she’s got huge tits. I wouldn’t date anyone unless they were in the same league as Kushida or Hasebe. I’m not interested in such a Plain Jane.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe spoke harshly because no one else was around. I wondered how much I believed Yamauchi when he said that he’d asked Sakura out. I had my doubts. In the end, I decided to place my bet on the girl with the highest odds.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e4.1\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003e“A\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ell right!\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe pool!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter lunch had ended, it was finally time for swim class. Finally, the moment Ike and the others had so desperately been waiting for. Without even trying to hide his excitement, Ike leapt up and headed with the others toward the indoor pool. I followed behind them in what I thought was a stealthy manner. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, let’s go together, Ayanokouji!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? O-okay.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d hesitated somewhat upon receiving Ike’s invitation, but I hurried to join and followed them to the locker room. Sudou promptly removed his uniform and started to change, showing off his physique. He’d built up his body through his years of basketball playing. Even in comparison with the other students, he was clearly in incredible \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eshape. While the others wrapped themselves in bath towels, Sudou unabashedly wore only his underwear. He stood there, semi-nude, and took his swimsuit out of his bag. I couldn’t keep myself from blurting something out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sudou, you’re pretty bold. Aren’t you nervous being around other people?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In sports, you can’t get flustered every time you have to change. If you act all shifty, it’ll have the opposite effect. You become the center of attention.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe could say that again. In these sorts of places, sneaky guys got mocked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, I’m going on ahead.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA moment later, Sudou left the locker room. I quickly finished changing as well.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUpon seeing the fifty-meter pool, Ike cried out, “Whoa, this school is something else! It’s even better than the city pool, don’t you think?” The water was clear and beautiful, and because it was indoors, we didn’t have to worry about the weather. The perfect environment.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What about the girls? Aren’t they here yet?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke looked around, sniffing the air like a dog.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They take a while to change, so they’re probably not ready,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, I wonder would what happen if I just suddenly jumped into the girls’ locker room?” Ike said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They’d gang up on you, beat the crap out of you, and then file charges, probably.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t give me such a realistic, deadpan answer and ruin my fun!” Ike began to tremble with fright as he played that scenario in his head.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If the girls sense you staring at them in their swimsuits, they’ll probably hate you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, like there’s a guy out there who \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewouldn’t\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e stare! Agh. What am I gonna do if I get a boner?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf that happened, they’d probably hate Ike from that moment all the way until the day of our graduation. Wait a second, what was happening? Had I started talking naturally to Ike and the others? Even though until this morning I hadn’t been able to join their group, I suddenly had my foot in the door, so to speak. This was the moment for a new friendship to be born.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow! It’s so spacious! It’s so much bigger than the pool at my junior high school.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA few minutes after the boys had arrived, a girl’s voice could be heard.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A-are they here?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke looked ready to strike. If you were that obvious about it, the girls were bound to hate you. Even so, I was curious, too. I mostly wondered about Hasebe and Kushida, but a little about Horikita as well. I was particularly interested in Hasebe, the girl rumored to have the biggest tits in class. I didn’t think there’d be any harm in taking a little peek. However, it turned out that all of the boys’ wishes were dashed by an unexpected turn of events.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hasebe isn’t here! Wh-what’s going on, Professor?!” Ike cried.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe Professor, who had been watching the class, was now in a panic. Standing on the second-floor observation deck, he scanned the room. Ike and the others also looked around. At this height, the Professor’s beady, bespectacled eyes should have spotted his prey instantly. However…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe couldn’t find the girls anywhere. He looked to his right and left, as if in disbelief. Could they still be changing? Or could…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-behind you, Professor!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke pointed and shouted. The situation had become clear. Hasebe stood behind the Professor on the observation deck. One by one, the rest of the girls appeared, until they’d all emerged onto the second floor. Sakura was among them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what’s going on? How did this happen?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke slumped to the ground and buried his face in his hands, shaken by this unbelievable turn of events. Hasebe seemed to be self-conscious about being considered a beautiful girl. Furthermore, she seemed to dislike getting curious looks from the boys. She was not amused at their attempts to ogle. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aw, but I thought I’d get to see big tits! Big tits! I thought this was my chance!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke appeared to be contemplating suicide. His wails of agony reached Hasebe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Gross,” the girls muttered among themselves. Ike was being far too obvious, so it wasn’t surprising that the girls hated him…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ike, don’t be sad! Come on, there are still tons of girls out there for us!” Yamauchi said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yeah, that’s right. You got a point. I can’t get down in the dumps now!” Ike cried.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Bro!” Yamauchi and Ike reaffirmed their manly bond of friendship, clasping their hands together.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you two doing? That looks like fun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“K-K-Kushida-chan?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida showed up between the two of them. She was clad in her school-issued swimwear, which nicely showed off her voluptuous figure. In an instant, nearly all of the boys’ eyes were glued to Kushida’s body. She must have been a D or E cup. I didn’t know for sure, but I estimated. She was a lot bigger than I’d thought. Her butt and thighs were also more voluptuous than I had pictured, which was strangely captivating. However, all of us boys quickly averted our gaze.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAh, the weather was so nice today… World peace truly was wonderful.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce the inevitable physiological reaction kicked in, it was quite a terrible shock.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why the pained expression?” Horikita examined my face closely, with a suspicious look.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m currently in the midst of an internal battle,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita was in a school swimsuit. How to put it? Yeah. She looked good. Not bad at all. But if I stared, it was likely that something bad would result. I thought it best to grin and bear it until I calmed down.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Text_body__And__Centre_Alignment__And__Page_Break\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol1_INTERIORIMAGES_4\" src=\"/hola-lector-agua/images/books/v1/OEBPS/Images/ClassroomElite-Vol1_INTERIORIMAGES_4.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…………”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor some reason, Horikita was checking me out all over.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun, do you exercise?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? No, not really. I’m not particularly proud of this, but in middle school I was the kid who never had any after-school plans.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, you say that, but…judging from the development of your forearms and your back muscles, you seem above average.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess my parents blessed me with good genes?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think that’s the only reason.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Jeez, what’s with you? Do you have a muscle fetish or something? Is that it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose if you deny it that much, I have to believe you…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe appeared somewhat dissatisfied. I guessed that Horikita had a rather discerning eye and enjoyed using it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you a good swimmer, Horikita-san?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough Horikita gave a slightly puzzled look in response to Kushida’s question, she quietly answered. “I wouldn’t say I’m particularly good or bad at it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was really bad at swimming when I was in junior high. But I gave it my all and practiced really hard, and now I think I’ve gotten better,” Kushida said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see.” Horikita gave a disinterested response and backed away slightly, clearly signaling that she didn’t want to continue the conversation further.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, everyone, line up!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA macho-looking middle-aged man, the kind of guy who apparently devoted himself to sports, gathered everyone together and started the class. He looked like a \u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003ePE\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e teacher, but also seemed like the kind of guy who was attractive to men and women alike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are sixteen of you, huh? I thought there would’ve been more, but this is all right.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClearly, some of the students in that count had ditched class, but it didn’t appear to frustrate him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“After you warm up, I want to see what you can really do. Swim for me,” the coach said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Excuse me, sir. I can’t really swim, though…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA lone boy sheepishly raised his hand and spoke up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Since you have me as your teacher, you’ll be swimming by summertime. Don’t worry about a thing.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, we don’t really need to force ourselves to swim, do we? It’s not like we’re going to the beach or anything.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No way. I don’t mind at all if you’re bad at swimming now, but I’ll make sure you guys are winners in the end. Besides, being able to swim will definitely come in handy later in life. Definitely.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSwimming would definitely come in handy? Well, I suppose knowing how to swim would be convenient. However, hearing a teacher say something like that made me feel uncomfortable. Though, he probably just wanted to keep the students from sinking like rocks.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone started their warm-up exercises. Ike kept peeking at the girls. The teacher asked us to swim for about fifty meters. Students who could not swim were allowed to touch the bottom of the pool with their feet. I hadn’t been in a pool since last summer. The water must have been temperature-controlled, because I didn’t feel chilled when I entered and adjusted right away. After getting in, I started to swim lightly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter fifty meters, I waited for everyone else to finish.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He he he, that was an easy win for me. Did you all see my super swimming skills?” Ike crowed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe’d swum expertly, and now got out of the pool with a smug, self-satisfied grin. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eNo, Ike, your performance wasn’t really that different from anyone else’s.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it looks like everyone can swim, for the most part.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course, sir. Back in junior high, people called me ‘the flying fish,’ you know.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. In that case, I’ll have you start competing against each other. We’ll separate groups by gender. Fifty-meter freestyle.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“C-compete?! Are you serious?” Ike cried.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll give out a special bonus to the first-place winner: 5000 points. The student who comes in last place, however, will have to take supplementary lessons. Get ready.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe skilled swimmers cheered with joy, while the less confident students groaned.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because we don’t have very many girls, I’ll split you into two groups of five people, and the student with the fastest overall time will be the winner. As for the boys, I’ll look at the top five finishing times and then move on to a final round.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d never imagined that the school would award points as a prize. Perhaps this was a way to light a fire under the students. Rather well thought out, I had to say. Excluding the observers and the one student who couldn’t swim, there were sixteen boys and ten girls competing. The girls started first, while the boys sat on the sidelines, filled with excitement as they cheered… no, as they \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eassessed \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ethe girls. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kushida-chan, Kushida-chan, Kushida-chan, Kushida-chan, Kushida-chan. Haaaaaaa…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt looked like Kushida had completely entranced Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re scaring everyone, Ike, settle down,” I mumbled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-but, Kushida-chan is so goddamn cute, isn’t she? And her breasts are pretty big, too!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida immediately dominated the boys’ attention. Would any of the other girls catch up to her? If you focused on her face alone, Horikita could definitely have been in the top tier, but because she loathed social interaction so much, her popularity had dipped. Despite that, many of the boys thought she looked great, so she got plenty of cheers at the starting line.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Everyone, burn these images into your mind! Remember the fap material you see here today!” Ike cried.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah!” everyone shouted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSomehow, swimming had strengthened the boys’ bond. The only exception was Hirata, who seemed to avoid looking at the girls. The whistle blew, and five of the girls dove into the water. Horikita was in the second lane. She took the lead at the beginning of the race and kept her distance from the others, maintaining her position at the front of the pack. She swam confidently, effortlessly covering the fifty meters.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow! Awesome, Horikita!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer time was approximately twenty-eight seconds. She was pretty fast. Horikita slowly got out of the pool and went to the side, not even appearing out of breath. To the boys, results were of secondary importance. Their eyes were glued to the girls’ jiggling butts. I stared at Horikita, too. Was it because we were getting along? Well, she \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewas\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e a girl. There was something there, I thought. Yeah.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter that came the second race. Kushida, the most popular girl, was in the fourth lane. The boys cheered for her, smiling and waving. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoo!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWow, those guys were really riled up. Some even tried to sneakily cover their crotches. During our introductions, Kushida had announced that she wanted to make friends with everyone in class. It looked like her wish had already pretty much come true. It wasn’t just the boys, either; girls were around her constantly, too, chatting away happily. Kushida had an air that attracted other people.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe second race began. The contest ended up being rather one-sided. A girl named Onodera, who had been on swim teams before, won by a mile. She finished with a time of about twenty-six seconds, netting her the win. Kushida finished at about thirty-one seconds, which was a fairly good time, but only resulted in her getting fourth place. I went over to the side of the pool to talk with Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You were so close. Second place, I mean. I guess that those guys on the swim team were really tough, huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t mind whether I win or lose. Enough about me. Are you feeling confident in yourself?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, definitely. I just can’t come in last.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not really something to take pride in. I thought boys were supposed to be fixated on winning and losing.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t like competing against people. I just like avoiding trouble, after all,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d given up on trying to get first place from the very beginning. All I wanted was to avoid taking those supplementary lessons. I was assigned my spot and placed in the second lane, while Sudou was in the first, right next to me. It was impossible to even hope to match Sudou’s pace, so I didn’t plan to try. I aimed to come in somewhere in the middle, just not last. With that in mind, the race started, and we dove in.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou finished the fifty-meter race with incredible speed. The boys and girls cheered in admiration.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, you’re amazing, Sudou. You finished the race in twenty-five seconds!” they cried.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI, on the other hand, finished in thirty-six seconds. It looked like I got tenth place. All right, no supplementary lessons for me. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sudou, won’t you consider joining the swim team? If you practice, you could probably win at competitions!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Basketball is my only sport. Swimming’s just for fun.” Sudou, who hadn’t even broken a sweat, calmly got out of the pool.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, wow, he has absolutely outstanding motor skills.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke, feeling envious, elbowed Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kya!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA girl let out a joyful scream as Hirata took his starting position. Whereas Sudou’s body had attracted the boys’ admiration, Hirata’s body attracted the girls. He was slender, but also well built. You could say he was a macho pretty boy. After hearing the girls’ delighted squeals for Hirata, Ike spat in response. Sudou didn’t seem very amused either, and shot Hirata a glare.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m going to blow you out of the water. I’ll use all of my power,” he growled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDidn’t he say that he swam just for \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003efun\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter the teacher blew the whistle, Hirata dove into the pool with beautiful form. Every time Hirata’s arms cut through the water, the girls cheered by the side of the pool. His form was effortlessly cool.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He’s surprisingly fast,” Sudou commented. It was certainly true that Hirata swam fast. There was no doubt that he’d shot ahead of the four other boys who were competing with him. This, of course, prompted more shrieks from the girls. Hirata didn’t fail to live up to our expectations: He came in first place. Deafening cheers reverberated throughout the room.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sensei, what was his time?” asked Ike, impatiently.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hirata’s time was…26.13 seconds.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right. You can do it, Sudou. You can definitely win against him! Bring down the hammer of justice!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Leave it to me. I’ll demolish him and his popularity…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke’s encouragement had Sudou all fired up, but even if Hirata lost, it wasn’t likely that his popularity would drop.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hirata-kun, you were so cool! You’re not just good at soccer, you’re really good at swimming!” one girl cried.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You think so? Thank you!” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, why are you ogling Hirata-kun like that?” another girl said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI’m\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e ‘ogling’?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was an indignant squeal.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata’s immense popularity was unbelievably frustrating.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, girls, knock it off. Please don’t fight over me. I belong to everyone. I want to be everyone’s friend. Besides, what if someone who’s better at swimming comes along?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji mistakenly seemed to assume that the cheers were for him. He put on a refreshing smile and then planted his feet by the starting line.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey. Uh, why is Kouenji wearing a speedo?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough the school allowed such tight swimwear, Kouenji was the only one in our class wearing it. The briefs drew attention to his crotch, and the girls all looked away. However, in the third race, all eyes were on Kouenji. The stance he took at the starting line was just like an athlete’s. His posture wasn’t the only impressive thing, either. He looked to be in even better physical shape than Sudou. Sudou and all of the other boys in class held their breath as they attentively focused on Kouenji.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not particularly interested in winning or losing…but I don’t like losing,” said Sudou, to no one in particular.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs the whistle blew, Kouenji dove into the pool with textbook form.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoa! Wow!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou gave a surprised shout in response to Kouenji’s unexpectedly aggressive swimming. Hirata also stared in apparent amazement. Kouenji splashed fiercely as he swam, but it didn’t slow his incredible speed. He was unquestionably faster than Sudou. After checking the time, the teacher reflexively looked at his stopwatch twice.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“23.22 seconds.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My abdominal muscles, back muscles, and psoas major muscle seem to be in good shape, as usual. Not a bad performance,” Kouenji said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter getting out of the pool, he smirked and swept his hair up. He wasn’t short of breath at all. It was as if he hadn’t even swum in the first place.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m fired up!” Sudou didn’t want to lose, so his competitive spirit flared. To be honest, Sudou was the only one who had any chance of winning against Kouenji. The final round was more like a one-on-one match between the two of them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m really looking forward to this. Both Kouejin-kun and Sudou-kun are so fast,” Kushida said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A-ah, yeah.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStanding beside a swimsuit-clad beauty, I’d entered a state of emergency, my heart pounding in my chest.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm? What’s the matter? Your face looks red for some reason. Are you not feeling well, by chance?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, no, no, that’s not it at all…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, even so, something seems unusual. Why do we have swimming classes in April, anyway?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because we have such an incredible indoor pool. Oh, yeah, that reminds me… You were pretty fast, Kushida. I can’t believe that you weren’t very good at swimming in junior high.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re much faster than average, too, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah, I’m pretty average. I don’t really like to exercise.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that so? But you look like a really manly guy, Ayanokouji-kun. Even though you’re so slim, I could say that you’re even better built than Sudou, and he plays basketball.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida examined my body in shock and awe, as if she were thinking “\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eReally? Really?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e” I was ten times more nervous now than when Horikita had stared at me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was just born naturally muscular. There’s no special reason behind it. To tell you the truth, I’m not in any clubs.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe conversation revolved around good health. I felt somewhat nervous, but strangely satisfied as well. We continued in this way for a while; I’d wanted to talk with Kushida alone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, Kouenji is amazing. I thought that Sudou would have won in a landslide… What the heck is going on, Ayanokouji?” Ike asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt looked like Kouenji had beaten Sudou by about a five-meter lead in the final round. After he’d finished observing the race, Ike zeroed in on me, his face like a demon’s.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh, nothing really. I didn’t do anything,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not what I’m talking about!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe wrapped his arms around my shoulders and whispered in my ear.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m aiming for Kushida-chan. Don’t get in the way!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t exactly plan to get in the way, but his goal was slightly unrealistic. I didn’t think Kushida was the type who’d stoop to being with someone like Ike. Of course, I didn’t think she’d get with me, either.\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 4: Ladies and Gentlemen, Thank You for Waiting\",\"volumeId\":\"v1\",\"chapterIndex\":10,\"prevChapter\":{\"volumeId\":\"v1\",\"chapter\":9,\"title\":\"Chapter 3: The Students of D Class\"},\"nextChapter\":{\"volumeId\":\"v1\",\"chapter\":11,\"title\":\"Chapter 5: Friends\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Title Page\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Credits and Copyright\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue :  The Structure of Japanese Society\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: Welcome to the School Life of Your Dreams\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: The Students of D Class\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: Ladies and Gentlemen, Thank You for Waiting\",\"href\":\"Text/section-0008.html#au
