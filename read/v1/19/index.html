[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:Tf97,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003ePostscript\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e sincerely apologize\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003efor the long silence. This is Kinugasa Syougo. It’s a pleasure to meet you. I wrote this story about a year ago. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eClassroom of the Elite\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e came out of my transition from student to adult, and because I wanted to tackle a challenging subject. When I think back to my student days, I recall everyone continuously telling me that I had to study if I wanted to get into a good university, if I wanted to get a job in a good field, if I wanted to have a good life. Recently, I’ve had my doubts as to whether that advice was actually correct. Unfortunately, I’ve gone astray, and leapt into a world far different from the one that my family and peers imagined for me…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, studying is important, and there’s no doubt that it is useful for a person’s future. But I believe that academics aren’t everything. For an easy example, sports are often part of an academic curriculum. Many people participate in sports. Everyone’s personality is unique, though. A child who has a talent for drawing might become an illustrator, or someone with the comedic gift might become an entertainer. Besides academics and sports, there are a near-infinite variety of callings and professions that suit all different types of people.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I started thinking about this, I began to consider those regrets that adults face for the first time. I thought, “If only I’d done this,” and started to regret my past. Lately, these ideas have been constantly on my mind.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow, I’d like to list some acknowledgements.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTomose Shunsaku-sama. Thank you so much for working with me time and time again. The male characters you draw are so wonder—no, I should say I give you my sincerest thanks because you draw both male and female characters that simply overflow with charm. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI will always make sure to show you how appreciative and thankful I am for your help. I sincerely look forward to working with you in the future. We should really go out to get some yakiniku soon. My treat. One of those cheap all-you-can-eat places!\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy editor, I-sama. Thank you so much for going over my writing. Though I’ve placed many burdens upon you with my previous work, I am sincerely grateful for all the effort you’ve put in, especially when this took a rather long time to complete. Huh? You say to knock it off and cut you a break? Ha ha ha, what a great joke. We have a long, long way to go. A one-way ticket all the way to the depths of hell. At least we’re falling together, right?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Normal\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFinally, there is you, the reader. Because you’re holding this book, you could say that in some sense you play a part in its central theme. While I am incredibly grateful to you more than anyone, I think we can conclude this volume here. It’s already the spring of 2015, but, as usual, my physical health is hardly perfect. I continue my longstanding battle with insomnia, but I’ll keep doing my best not to lose.\u003c/span\u003e\u003c/p\u003e\r\n\r\n\u003cdiv class=\"p.P_Centre\"\u003e\r\n\u003cp\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Epilogue: Postscript\",\"volumeId\":\"v1\",\"chapterIndex\":19,\"prevChapter\":{\"volumeId\":\"v1\",\"chapter\":18,\"title\":\"Chapter 12: Victory Celebration\"},\"nextChapter\":\"$undefined\",\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc
