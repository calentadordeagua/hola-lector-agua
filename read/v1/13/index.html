have been sorted into Class D.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLooks like I would have won that bet. Horikita was definitely the type to think herself superior. She wasn’t excessively self-conscious, either. She’d tied for first place on the test, as shown in the morning’s results.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You solved nearly all of the problems on the entrance examination, hmm? Normally I couldn’t show the examination results to individual students, but I’ll make an exception in this case. I just so happen to have your answer sheet here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re incredibly prepared. It’s…almost as if you knew I’d come here to protest.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m an instructor. I understand the mind of a student, at least to some degree, Horikita Suzune. Just as you said, you did well on the entrance examination. You had the third-highest test score among the first-year students and were close to the highest- and second-highest-scoring students. You did exceedingly well. And you’re right: We found no particular problems in your interview. On the contrary, we evaluated you quite highly.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you very much. So then…why?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Before I answer, why are you dissatisfied with Class D?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who could be happy with an incorrect evaluation? Furthermore, the class rankings greatly impact our future prospects. Of course I’m dissatisfied.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Incorrect evaluation? Perhaps your self-evaluation is far too high.” Chabashira-sensei snickered, or rather, laughed outright. “I acknowledge that your academic ability is excellent. You’re certainly very smart. However, who decided that smart people are categorically superior? We never said that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But…that’s just common sense.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Common sense? Didn’t common sense create our current, flawed society? Before, Japan relied solely on test scores to separate the superior and inferior. As a result, the incompetents at the top tried desperately to kick down the truly superior students. In the end, we settled on a system of hereditary succession.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA system of hereditary succession meant that things like social standing, prestige, and employment were passed down to future generations. At those words, I groaned unintentionally. My chest hurt.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re a capable student. I don’t deny that. However, this school’s goal is to produce superior people. If you believe academics alone place you into a higher class, you are mistaken. That was the very first thing we explained to you. Besides, think rationally. Would we have admitted someone like Sudou if we decided superiority based solely on academic merit?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tch…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite the fact that this was one of the country’s leading preparatory schools, this place allowed students to enroll for purposes other than academics.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Furthermore, you may be too hasty in proclaiming that no one would be happy to be incorrectly evaluated. Take Class A, for instance. They are under incredible pressure from the school, and also the target of extreme envy from the lower classes. Competing every day with that kind of pressure bearing down upon you is far more difficult than you might imagine. There are some students who are happy to be incorrectly evaluated at a lower level.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re joking, right? I can’t understand such a person.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that so? I think that Class D boasts some of those people. Strange students who would happily be set at a low level.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was almost as if she were talking to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You still haven’t given me an explanation. Was I honestly sorted into Class D? Did anything go wrong with the grading? Please double-check,” Horikita said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry, but you weren’t sorted by mistake. You are definitely in Class D. You are at that level.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that so? Then I will ask the school again, at another time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, she wasn’t going to give up. Horikita had merely determined that her homeroom teacher was the wrong person to ask.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ll get the same answer from anyone in a higher position. Besides, there’s no need to be disappointed. As I told you this morning, it’s possible for one class to overtake another. You could conceivably reach Class A before you graduate.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t imagine it will be easy, though. Forget overtaking Class A; how in the world could those immature Class D misfits gain more points? I can’t see how it’s possible.” Horikita spoke the truth. The difference in points was overwhelming.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know. You alone get to decide how you head down that path. At any rate, Horikita, do you need to be in Class A for any special reason?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well…I suppose that’s enough for now. Excuse me. But know that I’m not yet convinced I was sorted correctly.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Understood. I will keep that in mind.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA chair squeaked against the floor, signaling that the discussion was over.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, that reminds me. I’ve summoned another person to the guidance room. It’s someone relevant to you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Relevant to me? No, you can’t mean… bro—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on out, Ayanokouji,” the teacher said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was a bad time to reveal myself. Maybe I just wouldn’t go.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you don’t come out, I’ll have you expelled.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJeez. A teacher shouldn’t casually wield expulsion like a weapon.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How long do you intend to keep me waiting?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith a sigh, I entered the room. Naturally, Horikita appeared surprised and perplexed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Were you listening to our conversation?” she asked me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Listening? I know you guys were talking, but I didn’t really hear anything. The walls are surprisingly thick.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not true. Voices carry pretty well into the kitchen.” Apparently, Chabashira-sensei wanted to drag me into the action.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sensei, why would you do this?” Horikita noticed that this had all been planned and was clearly angry.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because I deemed it necessary. Now then, Ayanokouji, I’ll explain why I called you here.” Chabashira-sensei dismissed Horikita’s concerns and shifted her attention to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, if you’ll excuse me…” Horikita muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, Horikita. It would be in your best interest to stay and listen. It may provide you with a hint on how to reach Class A.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita stopped dead in her tracks and sat back down.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please keep it brief,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei chuckled as she glanced over her clipboard. “You’re an interesting student, Ayanokouji.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not at all. I’m certainly not as interesting as a teacher with a strange surname like Chabashira.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Would you speak like that to every Chabashira in the nation? Hmm?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf you looked all over the country for another person with the surname of Chabashira, you probably wouldn’t find one.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, when I read over the entrance exam’s results, your scores piqued my interest. I was shocked.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOn her clipboard, I saw a rather familiar answer sheet.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fifty points in Japanese. Fifty points in mathematics. Fifty points in English. Fifty points in social studies. Fifty points in science. You even scored Fifty points on the recent short test. Do you know what this means?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA stunned Horikita looked over my test paper and then shifted her focus to me. “This is a rather frightening coincidence,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh? You believe that getting 50s all across the board was a coincidence? He did it intentionally.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s a coincidence. There’s no evidence that it’s not. Besides, what would I gain by manipulating my scores in the first place? If I were smart enough to do that, I would’ve tried for perfect scores.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I feigned innocence, Chabashira-sensei sighed in exasperation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You really do seem like an odious student. Listen. Only 3 percent of students solved the fifth math problem successfully. However, you solved it perfectly, and used a complex formula to do so. However, the tenth problem on the test had a completion rate of 76 percent. Did you make a mistake on it? Is that normal?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know what normal is. It was a coincidence, I tell you. A coincidence.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For crying out loud! I respect your frank attitude, but it’ll cause problems for you in the future,” the teacher said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll think about that when the time comes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei shot Horikita a glance that seemed to say, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWhat do \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e think?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why do you pretend not to know?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Like I said, it was a coincidence. It’s not like I’m hiding that I’m a genius or anything.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder. He may be even more intelligent than \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, Horikita.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita flinched. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ePlease don’t say anything unnecessary, Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t like studying, and I don’t plan to try hard. That’s why I get those scores.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A student who chose this school wouldn’t say something like that. However, some students may have different reasons for getting in. You, for example, and Kouenji as well. I think you’re fine with being in either D or A.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn't just this school that was abnormal—the teachers were weird, too. Moments earlier, Chabashira-sensei had upset Horikita with just her words. It was almost as if the teachers knew every student’s secrets.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What other reasons do you have?” Horikita asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You want me to explain it to you in detail?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI noticed the sharp gleam in Chabashira-sensei’s eyes. It was almost as if she wanted to provoke Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, we’d best stop here. Any more, and I might go mad and destroy all the furniture in here,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you did that, Ayanokouji, I would demote you to E Class.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, there’s an E Class?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Certainly. Of course, the ‘E’ stands for ‘expelled.’ As in, you’d be kicked out of school. Well, I suppose our conversation has ended. Enjoy your lives.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat incredible sarcasm.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m leaving, too. It’s almost time for the faculty meeting. I’m going to close the door, so please step outside.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe pushed us into the hallway. Why had Chabashira-­sensei called both of us in together? She didn’t seem like the type to do meaningless things.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well. Should we head back?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita didn’t respond, and I walked away. Probably best if we weren’t together right now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait.” Horikita called out, but I didn’t stop. If I managed to keep away from her until I got to the dorms, I’d be home free.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Was your score…really just a coincidence?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I already said so, didn’t I? Or do you have any proof that I got that score on purpose?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t, but…I also don’t understand, Ayanokouji-kun. You said that you like to avoid trouble, but you don’t seem to be interested in Class A.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You have an extraordinary fixation on Class A.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Should I not? I’m simply striving to improve my future prospects.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, absolutely. You should. It’s perfectly natural.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When I entered this school, I thought graduation was my only goal. But the reality is different. I’m not even at the starting line.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita sped up and started walking next to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, why are you aiming for Class A?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“First, I want to ascertain this school’s true motives. Why was \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e put into Class D? Chabashira-sensei said I’d been deemed a Class D student, but why? When I discover the answer, I’ll aim for A. No, I will definitely make it to A.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s going to be difficult. You’ll have to rehabilitate the problem children. You have Sudou’s continued tardiness and class cutting, everyone else talking in class, and, of course, the test scores. Even if you manage all of that, you’re still at zero points.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know that. I still think the school made a mistake with my placement.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnxiety had replaced Horikita’s previously overflowing confidence. Did she really know that was the case? The only conclusion I could draw from today was that “despair” was a two-syllable word. If you followed the fundamental school rules, you could avoid losing points. However, it was still unclear how to turn those losses into gains. Class A had had only had a small number of points subtracted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if we somehow found an efficient way to increase our points, the other classes might also find a way to do the same. Since we’d started out with such a substantial difference in points, we’d have to compete hard against the other classes in a limited amount of time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can understand your thoughts, but I don’t think the school will continue supervising us so carefully. If they did, there’d be no meaning in competition,” Horikita said.\u003c/span\u003e\u003c/p\u003e\r\n    \r\n    \r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. I suppose you could think that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had heard somewhere that the school didn't allow students in Class A to drop out in the first month after being admitted, among other things. In other words, Horikita believed this precise moment in time represented an opportunity to see a huge increase or decrease in points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’ll try to take care of this situation by yourself?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n    \r\n    \r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t act so proud.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA hand chopped my side. Horikita ignored my pained expression.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ow. Look, I understand how you feel, but you can’t solve this by yourself. Think about Sudou. Even if you improve, the rest of the class will drag you down.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. You’re right that no lone individual can solve this problem. We won’t even make it to the starting line without everyone’s help.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it sounds like we’ve got a huge problem on our hands.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We have three major, immediate issues. Tardiness and talking during class are the first two. Third, we must make sure no one fails the midterm exam.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think we’ll manage those first two issues, but the midterms…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe short test we’d taken had contained a few difficult questions, but overall it had been pretty easy. Even at that level, some students had failed. Honestly, their chances of passing the midterm exam were slim.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I need your help, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Help?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita glared at me. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What if I refuse? Like how you refused Hirata this morning.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you want to refuse?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What if I said I’d gladly help?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I never would’ve thought you’d do it gladly, but I doubt you’d refuse. If you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e refuse to work with me, then that would be the end of it. No matter what I said about our future, I’d be powerless if you refused. So, will you help me or not?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wanted to say what she’d said before, when she’d silenced Hirata… What was it, again? Well, it wasn’t as though I would just bluntly refuse someone who asked for my help. Then again, if I told her I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewould\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e help, she’d probably run me into the ground until graduation. I needed the heart of a demon.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I refuse,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I always knew you’d help, Ayanokouji-kun. I’m grateful.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t say that! I turned you down!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I heard the voice inside your head. You said you’d help.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTerrifying! It was like she could read my thoughts.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t even know how I could help you, though.” Besides being an exemplary student, Horikita was incredibly quick-witted. She probably didn’t need my skills.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry. I don’t require your brain power, Ayanokouji-kun. Leave the planning to me, and act as I tell you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? What do you mean by act?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Doesn’t our lack of points trouble you, Ayanokouji-kun? If you follow my instructions, I promise you we’ll see a point increase. I would never lie.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know what you’re cooking up, but there are other people you could count on. If you made friends, they’d cooperate with you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unfortunately, no one else in Class D is nearly as easy to manipulate as you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, there are several people. Hirata, for example. He’s popular and smart, so he’d be perfect. Besides, he’s worried that you’re all alone, Horikita.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf she reached out to him, they’d probably become good friends.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He’s no good. Even if he has some talent and ability, I can’t use him. To use an analogy, think about the pieces in shogi. Right now, I don’t need a gold or silver general. I want a pawn.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSo, you just called me a pawn? \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat’s\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e what you called me?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, if a pawn were to cooperate, he could become a gold general?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“An interesting answer, but you don’t seem like the type to make that effort, Ayanokouji-kun. Besides, haven’t you been thinking, ‘I’ve always been a pawn, I don’t want to advance,’ all along?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe’d shot me down with precisely the right brand of ammunition. If I were a normal person, my feelings would’ve been hurt.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, but I can’t help you. I’m not suitable for this,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, contact me once you’ve given it some thought. I look forward to hearing from you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita wasn’t paying attention to what I’d said in the slightest.\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 7: Classroom of the Elite\",\"volumeId\":\"v1\",\"chapterIndex\":13,\"prevChapter\":{\"volumeId\":\"v1\",\"chapter\":12,\"title\":\"Chapter 6: The End of Everyday Life\"},\"nextChapter\":{\"volumeId\":\"v1\",\"chapt  Celebration\",\"href\":\"Text/section-0016.html#auto_bookmark_toc_top\",\"index\":18},{\"label\":\"Epilogue: Postscript\",\"href\":\"Text/section-0017.html#auto_bookmark_toc_top\",\"index\":19}],\"volumeTitle\":\"Light Novel Volume 1\",\"detailsLink\":\"/select/year-1/v1\",\"returnLink\":\"/select\",\"currentSpineIndex\":13,\"nextVolumeLink\":\"/select/year-1/v2\",\"nextVolumeTitle\":\"Light Novel Volume 2\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://classroom-of-the-elite-reader.vercel.app\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"COTE Reader\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"en_US\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:image:width\",\"content\":\"1200\"}],[\"$\",\"meta\",\"9\",{\"property\":\"og:image:height\",\"content\":\"630\"}],[\"$\",\"meta\",\"10\",{\"property\":\"og:image:alt\",\"content\":\"Classroom of the Elite Reader Preview\"}]
