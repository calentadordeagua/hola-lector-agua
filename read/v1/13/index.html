[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T16cdb,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 7:\u003cbr/\u003eClassroom of the Elite\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eO\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003en May 1, the morning bell rang for our very first day of class. Soon afterward, Chabashira-sensei strode into the room, holding a rolled-up poster. Her expression today was even more stern than usual. Had she started menopause, I wondered? If I made that joke out loud, I think she would have swung an iron bat at my face with full force.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, sensei, did you start menopause or something?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnbelievably, Ike actually let that joke fly. Honestly, it was more shocking that I’d thought the same thing as Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, your morning homeroom is about to begin. Before we get started, does anyone have any questions? If so, now is the time to speak.” Chabashira-sensei completely ignored Ike’s sexual harassment. She appeared totally convinced that the students had questions they wanted answered. Immediately, several students raised their hands.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um, I checked my point balance this morning, but I didn’t see any deposits. Points are given on the first day of every month, aren’t they? I couldn’t buy juice this morning.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hondou, I already explained this before, didn’t I? Points are deposited on the first day of the month. I’ve confirmed that points were wired this month without any issues.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um, but…nothing was deposited into my account, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHondou and Yamauchi exchanged glances. Ike appeared too shocked to notice them looking at each other. I’d checked my point balance that morning as well, but saw that it had remained unchanged from the day before. No more points had been deposited into my account. I’d simply thought that the points would be wired later.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you kids really that dumb?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWas she angry or delighted? I was getting an ominous vibe from Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dumb? What?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs Hondou stupidly repeated her words, Chabashira-sensei looked at him sharply.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sit down, Hondou. I’ll explain once more,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“S-Sae-chan-sensei?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHondou, taken aback by her unusually strict tone, slumped in his seat.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Points were deposited. That much I know for certain. There is absolutely no chance that we forgot about anyone in this class. To think so is ludicrous. Understood?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, even if I tell you that we understand, we haven’t received any points…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHondou, still perplexed, began to look dissatisfied. Supposing that what Chabashira-sensei said was true and that points had been wired to us, then that meant…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHad there been a discrepancy, then? Did that mean that zero points had been deposited into our accounts? My vague doubts quickly grew.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ha ha ha! I see. So, it’s like that then, teacher? I think I’ve solved the mystery,” Kouenji boomed, laughing.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe propped his feet up on his desk and smugly pointed toward Hondou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s simple. We’re in Class D, so we didn’t receive a single point.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? What are you talking about? They said that we’d get 100,000 points every month—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t remember hearing that, though. Do you?” Chuckling, Kouenji boldly pointed at Chabashira-­sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“While he certainly has an attitude problem, Kouenji is exactly right. For crying out loud, barely anyone seems to have noticed the hint I gave you. How deplorable.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn response to this sudden turn of events, the classroom exploded in an uproar.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sensei, may I please ask you a question? I’m afraid I still don’t understand.” Hirata raised his hand. He appeared to ask on behalf of his classmates rather than out of selfish concern. Just as I’d expect of the de facto class leader. Even now, he took the initiative.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can you please tell us why we didn’t receive any points? We won’t completely understand otherwise.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was certainly true.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A total of ninety-eight absences and late arrivals. Three hundred ninety-one incidences of talking or using a cell phone in class. That is quite a few infractions over one month. In this school, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyour class’s results are reflected in the points that you receive\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. As a result, you wasted all of the 100,000 points that you should have received. That’s what happened.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I should have explained this all to you on the day of the entrance ceremony. This school measures its students’ true abilities. This time, you were evaluated as being worth nothing. That’s all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei spoke in a robotic fashion, devoid of any emotion. The doubts I’d had since coming to this school were finally confirmed, though, in the worst way possible. Even though we’d started with the huge advantage of 100,000 points, Class D had lost it in just a single month. \u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Text_body__And__Centre_Alignment__And__Page_Break\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol1_INTERIORIMAGES_5\" src=\"/hola-lector-agua/images/books/v1/OEBPS/Images/ClassroomElite-Vol1_INTERIORIMAGES_5.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI heard a pencil moving against paper. Horikita seemed to be tallying the number of absences, tardy arrivals, and instances of talking in class down in her notebook, perhaps trying to make sense of the situation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Chabashira-sensei. I do not recall hearing you explain that to us before—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What? Are you incapable of understanding something unless it’s explained in detail?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course. There was never any talk about reducing our points. Had that been explained beforehand, I’m sure we would have avoided being late or talking during class.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That is a rather bizarre argument, Hirata. It is certainly true that I don’t recall explaining the rules of point distribution. However, didn’t you all learn in elementary school not to be late or talk in class? Was that not taught throughout your elementary and junior high schools?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure that in nine years of compulsory education, you learned that being late and talking in class are bad things. And now you say that you can’t understand this because I haven’t explained it to you? I’m afraid your reasoning is flimsy. If you had simply acted properly, then your points would not have dropped all the way to zero. This comes down to you taking personal responsibility.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no way for anyone to refute her perfectly sound argument. Everyone knew that bad behavior didn’t pay.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Having just entered your first year of high school, did you honestly think you’d receive 100,000 points every month with no strings attached? At a school established by the Japanese government for the express purposes of training gifted people? That’s unthinkable. Try using some common sense. Why would you leave it to chance?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough Hirata appeared to be frustrated, he looked the teacher straight in the eye. “Well then, could you at least explain in detail how points are added or deducted? We can keep that in mind for future reference.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I cannot tell you. We cannot disclose the methods behind our student evaluation. It’s the same as any other organization. When you enter a company, it is the company’s choice whether or not to tell you how it evaluates its employees. However, I’m not cruel, and I’m not trying to be cold. In fact, this situation is so pathetic that I will give you one bit of guidance.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor the first time, I saw a faint sliver of a smile on Chabashira-sensei’s lips.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s say that you stop being late to class and have no more absences… Even though zero points will be deducted from you this month, that doesn’t mean that your points will increase, either. That means next month you will still receive zero points. From another perspective, you could say no matter how times you’re late or absent to class, it doesn’t matter. So, you’re not really at a loss, are you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tch…” Hirata’s expression darkened. Her explanation was so counterproductive that it had the opposite effect; some students seemed incapable of understanding what she meant. The students who thought they could improve their situation by remedying bad behavior had their hopes dashed. That was probably Chabashira-sensei’s, or rather, this school’s, intention.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe bell rang, signaling the end of homeroom.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It looks like we spent too much time yammering. I hope that you understood the gist of it. Well, it’s about time that we switch to our main topic.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom the tube she carried, she removed a white rolled-up poster and spread it out. She stuck the poster to the blackboard with some magnets. The still-confused students stared blankly at the poster.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are these…the results for each class?” Horikita tentatively took a guess. She was probably right. Class A through Class D were listed. To the side was a row of numbers that went up to a maximum of four digits. Class D had zero. Class C had 490. Class B had 650. And at the top was Class A, with a total of 940. In this case, 1000 points would mean 100,000 yen, wouldn’t it? Every class had apparently lost points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Isn’t something about this odd?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. The numbers look too even.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita and I had both noticed something strange.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve all been doing whatever you pleased this past month. The school has no intention of preventing you from doing what you want. Your actions, such as being late or talking during class, only affect the points you receive. The same goes for how you use your points. How you choose to spend is entirely up to you. We have not put any restrictions on point usage.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This isn’t fair, though! We can’t enjoy our student lives like this!” shouted Ike, who’d stayed quiet until now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi wailed in incredible agony. He’d already used up all of his points…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Look here, morons. Every other class got points. The amount of points we gave you for the first month should be plenty for you to live on.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-but, how do the other classes still have points left? That’s weird…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve already told you, there’s nothing unfair about it. All of the classes were scored using the same rules. Despite that, they didn’t lose as many as you. That’s the truth.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But…why is there such a difference in our point values?” Hirata also seemed to have noticed that the numbers were too tidy.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you finally understand now? Do you see why you were placed in Class D?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The reason why we were placed in Class D? Weren’t we simply accepted into this school?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? But classes are \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003enormally\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e divided up like this, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStudents exchanged glances.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In this school, students are sorted by their level of excellence. The superior students are sorted into Class A, the least capable in Class D. It’s the same system you’d find in the major cram schools. In other words, Class D is akin to the last bastion for failures. You are the worst of the worst. You’re defective. This is just the result of you being defective.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita’s face stiffened. She appeared shocked by this line of reasoning. It certainly made sense to sort the superior students with the other superior students and the failures with the failures. If you mixed rotten oranges with good ones, the rotten would quickly spoil the good. Inevitably, the superior Horikita would find this revolting.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI, on the other hand, was glad. This meant I couldn’t go any lower.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, I have to say, this year’s Class D was the first to ever spend all of their points in a single month. I am impressed by how much you indulged yourselves. Wonderful, just wonderful.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei’s false applause echoed throughout the classroom.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, does that mean that once we reach zero points, we’ll always stay there?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. You will remain at zero until you graduate. But don’t worry, you can still have a room in the dorms and free meals. You won’t die.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough we knew that it was possible to get by with the bare minimum, a lot of students weren’t comforted by that fact. After all, we’d lived a life of luxury this past month. To suddenly restrain yourself after that would prove seriously difficult.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Won’t the other classes make fun of us?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou kicked the legs of his desk with a loud \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethwack\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. After hearing that the classes were divided based on merit, everyone else would probably believe that Class D was full of morons. Despair wasn’t unreasonable.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What? You’re still worried about your dignity, Sudou? Well then, work to make your class into the best one.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your class’s points aren’t just linked to the amount of money that you receive each month. They’re also indicative of your class rank.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words…should we get to 500 points, then Class D would be promoted to Class C. This really did sound like a company performance review.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now then, I have one more bit of bad news to share with you all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe stuck another sheet of paper up on the board. It listed the names of everyone in class. A number stood next to everyone’s name.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Judging from these, I can see that we’ve quite a few idiots in this class.” As her heels clacked against the floor, she glanced at us. “These are the results of the short test you took a while ago. Your sensei was \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eso happy\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e after your \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eexcellent\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e performance. Come on, what in the world did you all study when you were in junior high?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith the exception of a few high scores, almost everyone tested below a sixty. Even if you ignored Sudou’s \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewonderful\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e score of fourteen points, there was Ike, scoring a little above him at twenty-four points. The average score was sixty-five.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m so glad. If this were an actual test, then seven of you would’ve had to drop out.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“D-drop out? What do you mean?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, what, did I not explain this to you? If you fail on a midterm or final exam in this school, then you have to drop out. If we applied that rule to this test, anyone who scored below thirty-two points would be out. You guys really are stupid, aren’t you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what?!” wailed Ike and the other failures.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was a red line drawn on the paper, separating the seven people in question from the rest of the class. Among those seven people, Kikuchi had scored highest, with thirty-one points. Anyone with a score equal to or lower than Kikuchi’s had failed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, don’t jerk us around, Sae-chan-sensei! Don’t joke about kicking us out!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Frankly, I’m also at a loss,” the teacher said. “These are the school rules. You should prepare for the worst.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The teacher’s right. There do seem to be a lot of morons here.” Kouenji wore a smug grin while he polished his nails, his legs propped on the desk.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What the hell, Kouenji? You scored below the red line, too!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Pah. Where exactly are \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e looking, boy? Look again.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Kouenji is…huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStarting from the bottom of the page, Sudou scanned upward, and there he found Kouenji Rokosuke’s name. Unbelievably, Kouenji had tied for the top spot, scoring ninety points. That meant he’d been able to solve one of those super difficult problems.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I never thought that Sudou was an idiot like me!” cried Ike, a mixture of wonder and sarcasm in his voice.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, one more thing. This school, which operates under government supervision, boasts a high rate of advancement into elite education and workforce placement. That is a well-known fact. It’s very likely that most of you have chosen a college or future workplace.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, naturally. This school boasted the highest rates of advancement in the whole country. There were rumors that it was possible to get into a highly competitive school or company just by graduating. Rumors even suggested that graduation from this school was like receiving a recommendation to Tokyo University, the most prestigious of Japan’s institutes of higher learning.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, nothing comes easy in this world. Mediocre people such as yourselves would have to be naive to think that you could easily get into the college or workplace of your choice.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei’s words carried throughout the room.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In other words, you’re saying that if we want to get into the company or college of our choice, we must, at minimum, surpass Class C?” Hirata asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re wrong. To make your dreams of a bright future come true, your only option is to overtake Class A. This school guarantees nothing for any other students.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Th-that’s…absurd! We didn’t hear anything about that!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA bespectacled student named Yukimura stood up. He’d tied with Kouenji for the top score, indicating that there were no issues with his academic abilities. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How disgraceful. There’s nothing more pitiful than men losing their cool.” As if prompted by Yukimura’s words, Kouenji let out a sigh.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t you feel dissatisfied being in Class D, Kouenji?” Yukimura asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dissatisfied? Why would I feel dissatisfied? I don’t understand.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because the school says we’re so low that we’re basically delinquents and failures. We’ve been told that there’s no guarantee whatsoever that we’ll advance into higher education or get a job!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Pah. Utter nonsense. That’s so marvelously stupid that I can’t even find the words.” Kouenji didn’t even stop polishing his nails or turn to face Yukimura as he spoke. “The school simply hasn’t seen my potential yet. I pride myself on being great, and I value, respect, and regard myself more highly than anyone. So, the school arbitrarily placing me into Class D means nothing. Say, for instance, that I dropped out of school—I would be perfectly fine. After all, I am 100 percent positive that the school would come crying to take me back.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat certainly sounded like something Kouenji would say. Was it being macho? Or narcissism? It’s true that if you didn’t care about the school’s classification of students, then it really wasn’t a big deal. If you considered Kouenji’s impressive intellect and physical ability, it was difficult to imagine that all of the students in Class A could be better than him. Perhaps he’d been assigned to Class D because of his personality rather than his ability.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides, I don’t care in the slightest if the school does or doesn’t assist me to higher education or the workforce. It’s been decided that I will lead the Kouenji conglomerate group. Whether I’m in Class D or Class A is a trivial matter.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was true that for a man whose future was already decided, getting into Class A was far from a necessity. Yukimura, at a loss for words, simply sat back down.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It looks like your bubbles have been burst. If you had simply understood the harsh reality of the situation from the start, then this long homeroom period might have meant something. Your midterm exams are in three weeks. Please think things over, and be careful not to drop out. I have confidence that you can find a way to avoid getting red marks on your report cards. If at all possible, challenge yourself to act in a way befitting a skilled individual.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei exited the room, closing the door with some force for added emphasis. The students marked in red were left dejected. Even the normally proud Sudou clicked his tongue and hung his head in shame.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e7.1\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003e“I\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ef we don’t get any more points, what I am gonna do?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I used up all of my points yesterday…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDuring the break, the classroom erupted into an uproar…or rather, chaos.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Forget about the points. What the hell about this \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eclass\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e? Why was \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e put into Class D?!” Yukimura cried resentfully. A thin layer of sweat covered his forehead.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, does this mean that we can’t get into college now? Why did we even go to this school? Does Sae-chan-sensei hate us or something?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNone of the other students could hide their confusion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand that you’re all confused right now, but everyone needs to calm down.” Hirata, sensing the classroom tipping toward crisis, stood and attempted to rein everyone in.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How are we supposed to calm down? Aren’t you frustrated that she called us a bunch of failures?!” Yukimura said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if I was, isn’t it better for us to band together so we can turn things around?” Hirata asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Turn things around? I don’t even agree with how we were sorted in the first place!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand. However, sitting here whining won’t help us right now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What did you say?” Yukimura quickly went to Hirata and forcefully grasped his collar.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Calm down, you two, okay? I’m sure that the teacher talked to us harshly so we’d be inspired to do better, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was Kushida. She slipped between the two and separated them, gently taking Yukimura’s balled fist. Just as anyone would expect, Yukimura didn’t try to hurt her and reflexively took half a step back.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides, it’s only been one month since we started here, right? Like Hirata-kun said, it’s better if we all do our best together. Do you think that I’m wrong about that?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“N-no, it’s… Well, I certainly wouldn’t say you’re \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewrong\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, but…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYukimura’s anger had almost completely vanished. Kushida looked at everyone in class, and it was almost as if her eyes reflected a sincere wish for us to work together.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, it’s better for us to band together. Right? There’s no need for you to fight, Yukimura. Hirata.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry. I lost my cool,” Yukimura said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s all right. I should have chosen my words a little more carefully.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida Kikyou’s presence brought everyone together. I took out my cell phone and snapped a picture of the paper with the class point totals. Horikita, taking notice, looked at me with a puzzled expression.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you doing?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I haven’t been able to figure out how points are calculated yet. You’ve also been taking notes, haven’t you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I could figure out how many points were deducted by being late or talking in class, it’d be easier to come up with countermeasures. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wouldn’t it be difficult to figure out those details at this stage? Besides, I don’t think you can resolve this simply by investigating. Everyone in our class arrived late and talked too often.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs Horikita had said, it certainly was difficult to conclude anything based on the current information. Also, Horikita’s usually cool, composed attitude was gone. She seemed rather impatient.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you trying to get into college, too?” I wondered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why do you ask?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, when we learned about the differences between A and D, you looked shocked.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But so was almost everyone in this class, more or less. If they’d told us at the start, that would’ve been one thing, but to explain it at this stage? Unthinkable.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, she was right about that. There was probably a lot of discontented grumbling coming from Class C and B students as well. After all, the school treated every class except for A like leftovers. Trying to get to the top was probably our best option.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think that before we even start talking about A or D or whatever, we should secure points.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Points are just a byproduct of our performance, though. Not having points won’t hinder our lives here at school. We have free options at almost every turn, right?” Horikita said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf you thought about it that way, it’d be a relief for the students who’d lost all of their points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“‘Won’t hinder our lives here at school,’ huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf you wanted to simply get by, this wouldn’t be a problem. However, there were many things you could only obtain with points. Entertainment, for example. If the lack of entertainment options wasn’t a problem, then it’d be fine, but…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“About how many points did you spend last month, Ayanokouji-kun?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm? Oh, my points? I spent about 20,000, approximately.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was tragic for the students who’d used up their points. Like Yamauchi, who was ranting and raving at his desk. Ike had also spent almost all of his points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“While unfortunate, they’ve simply reaped what they’ve sown,” Horikita said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was certainly true that indiscriminately spending all 100,000 points in a single month was a \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eslight\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e problem.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They baited us into spending all our points over the course of this one month, and we fell for it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOne hundred thousand points per month. Even though everyone had thought it too good to be true, we’d been too happy to care.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Attention, everyone. Before class begins, I want you to listen seriously for a moment. Especially you, Sudou-kun.” The class was still in an uproar, but Hirata claimed everyone’s attention when he stood at the teacher’s podium. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tch, what is it?” Sudou grumbled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We didn’t get any points this month. This is a serious problem, and one that will have an enormous impact on our daily lives moving forward. It’s impossible for us to make it to graduation with zero points, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re absolutely right!” shouted one of the female students, her voice full of despair.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata gave a kind nod in response, sympathizing with her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course. Therefore, we must earn points next month. To do that, we all need to cooperate with each other. So, please, take care not to be late to class or to talk during the lecture. Also, the use of cell phones during class is prohibited, of course.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? And why do \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e get to tell us what to do? Besides, that’s supposing our points will increase. If they don’t change at all, then it’s useless.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As long as we continue talking during class and being late, our points won’t increase for sure. Although we can’t go below zero points, disruption will, without a doubt, count as strikes against us.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m still not convinced. Besides, even if we get serious and work hard in class, our points won’t necessarily go up.” Sudou snorted and crossed his arms in defiance. Kushida took notice of this and commented on it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, the teacher \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003esay that the being late and talking in class were obviously bad, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I agree with Kushida-san. It’s only natural to avoid doing those things.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s just your own selfish interpretation. Besides, you don’t know how to increase our points. Try talking to me after you figure that out.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think that there’s anything particularly wrong with what you said, Sudou-kun. I apologize if I made you feel uncomfortable.” Hirata bowed his head politely toward the disgruntled Sudou. “However, Sudou-kun, it’s a fact that unless we all cooperate, we won’t get any more points.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do whatever you want. It doesn’t matter. Just don’t involve me in it. Understand?” Sudou snapped.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs if being in the room made him feel uncomfortable, he left immediately. I had to wonder: Would he return when class started? Or did he not intend to return at all?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sudou-kun really can’t read the room. He’s the one who was late to class the most. Couldn’t we still get some points even without Sudou-kun?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. He really is the worst. Why is he in our class?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHmm. Until now, everyone had been enjoying their lives of luxury to the absolute fullest. No one had previously complained about Sudou. Hirata stepped down from the podium and, strangely, stopped right in front of my desk.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita-san, Ayanokouji-kun, do you have a moment? I want to speak with you about how we can increase our points. I’d like you to join me. Can you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why do you want us?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I want to hear everyone’s voices. However, if I ask for everyone to weigh in, I think more than half of the class probably won’t take it seriously.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, he wanted to ask us individually? I doubted I’d be able to come up with any particularly useful ideas, but I supposed it couldn’t hurt to talk. Just as I was thinking that…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry, can you ask someone else? I’m not particularly good at discussing things with others,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We wouldn’t force you to speak up. If you could help think of something, that would be good. Simply being there would be enough,” Hirata said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry, but I have no interest in something meaningless.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is the first trial we’re facing together as a united Class D. So then—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I refuse. I won’t participate.” Her words were stern, yet composed. While she’d considered Hirata’s position, she refused him once again.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I…I see. I’m sorry. If you change your mind, I’d love for you to join us.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita had already stopped looking at Hirata, who withdrew dejectedly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What about you, Ayanokouji-kun?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHonestly, I’d be glad to participate. I’d thought that most of the class would be involved. However, if Horikita was the only one absent, then she might be treated the same as Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah…I’ll pass. I’m sorry.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I’m sorry for bothering you. If you change your mind, please let me know.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata probably understood what I was thinking. I hadn’t rejected him strongly. After the discussion ended, Horikita began preparing for the next class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hirata’s a great guy. He’s able to get everyone to take action just like that. People can easily get depressed in these situations.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s one perspective, yes. If we could easily solve this by talking, then that’d be fine. However, if an unintelligent student tries to lead the discussion, the group will fall further into chaos, to the point where there’s no hope of salvaging anything. Besides, I can’t meekly accept my current situation.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can’t accept what now? What do you mean?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita didn’t answer my question. She fell completely silent.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e7.2\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eC\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003elass had ended for the day. Hirata stood at the podium, using the blackboard to prepare for our big discussion. Because of Hirata’s powerful charisma, almost everyone in our class had shown, with the exception of a few like Horikita and Sudou. When I looked around, I noticed that they’d already left the room. I decided to leave before the discussion got into full swing, as well.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi suddenly appeared from under my desk, his expression deathlike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoa! Wh-what? What’s wrong?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, buy this from me for 20,000 points. I can’t buy anything!” he cried.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi placed the game console he’d purchased the other day on my desk. Frankly, I didn’t even want the thing.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But if you sell that to me, who am I supposed to play with?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How the heck should \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eknow? Come on, it’s good, right? It’s special, so it’s a good deal.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll buy it from you for 1,000 points.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji! Come on, you’re my only hope!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why am \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ethe only one? I can’t afford it, anyway.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi looked at me all teary-eyed, which grossed me out. I looked the other way. He must have realized I wasn’t biting, so he immediately switched to a new target.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Professor! Your best buddy has a favor to ask! Buy this game system for 22,000 points!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was trying to get the Professor to buy it and had shamelessly increased the price.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Things must be really tough for the people who used up their points,” remarked Kushida as she observed Yamauchi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What about you, Kushida? Do you have enough points? Girls have a lot of necessities, after all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m okay. For now, anyway. I’ve used up about half of my points. I kind of lost control the first month and overspent, so it’ll be a little difficult to hold myself back. What about you, Ayanokouji-kun? Are you okay?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s got to be hard not to spend money when you’re so popular. I’ve barely used any of my points, to be honest. I haven’t really needed to buy anything.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because you don’t have friends?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, sorry, sorry. I didn’t mean to offend,” Kushida apologized with a giggle. She was too cute when she did that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Kushida-san, do you have a minute?” Karuizawa asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s up, Karuizawa-san?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Honestly, I’ve spent way too many points, and I’m seriously running low. Some of the other girls in class have lent me a few points, but I was wondering if you could help me out, too. We’re friends, right? I only need, like, 2,000 points from you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa didn’t seem all that earnest, laughing breezily while she hit up Kushida. In such a case, rejection should be the knee-jerk reaction.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, sure.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSure?!\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I repeated silently, but it wasn’t my business. This was a problem for the friends in question. Kushida had decided to help Karuizawa without even a hint of reluctance.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you! This is really what friends are for, huh? By the way, here’s my number. Okay, see you later. Ah, Inogashira-san! Hey, to tell you the truth, I used up too many of my points…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa turned away just like that and went in pursuit of her next target.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you sure? You know you probably won’t get those points back, right?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t just ignore a friend in need. Karuizawa-san has a lot of friends, too, so I think it’s probably hard for her not to have any points.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think using up 100,000 points is kind of her own fault, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, how do you transfer points?” Kushida asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Karuizawa gave you her phone number, didn’t she? You should be able to do it with your cell phone.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This school really does take great care of its students. It even has a way to help students like Karuizawa-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTrue, transferring points was a lifesaver for Karuizawa, but was it really necessary to give her the money? If anything, it seemed a recipe for disaster.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe loudspeaker came alive with a soothing sound effect, and a robotic voice issued an announcement.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun, from first-year Class D. Please come see Chabashira-sensei in the faculty office.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks like the teacher wants to see you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah… Sorry, Kushida. Gotta go.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was sure I hadn’t done anything to get me called to the office. Exiting the classroom, I could feel my classmates’ stares drilling a hole into the back of my head. Timid as a rabbit, I found the faculty office and entered. I looked all around, but I didn’t find Chabashira-sensei anywhere. Baffled, I called out to a teacher inspecting her appearance in a mirror.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Excuse me, is Chabashira-sensei here?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm? Sae-chan? Oh, she was just here a moment ago.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe teacher had wavy, shoulder-length hair, which made her look mature. The way she said Chabashira-sensei’s name made them sound close. They were near in age and probably friends.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She must have stepped away for a minute. Do you want to wait here?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, thank you. I’ll wait in the hall.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t like being in the faculty office. I hated attention, so the hall would do just as well. However, the young teacher unexpectedly followed me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m Hoshinomiya Chie, in charge of Class B. Sae and I have been best friends since high school. That’s why we call each other Sae-chan and Chie-chan.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat information seemed kind of superfluous.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, why did Sae-chan call you? Huh? Huh? Why?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No idea.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t understand. You were called to the office without a reason? Hmm? What’s your name?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAn onslaught of questions. She scanned me from top to bottom, as if sizing me up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My name’s Ayanokouji,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun, huh? Oh, wow, that’s a cool name. You’re pretty popular, aren’t you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat was \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewith\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e this overly friendly teacher? She acted more like a student. If this were an all-boy school, she would have immediately captured every student’s heart.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, do you already have a girlfriend?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No… I’m, uh, not especially popular.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI tried to seem reluctant, but Hoshinomiya-sensei kept pushing herself onto me. She grabbed my arms with slender, delicate hands.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm? How unexpected. If we were in the same class, I’d never leave you alone. Perhaps because you’re so innocent? Or do you like playing hard to get?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe caressed my cheeks. I had no idea what to do. She’d probably stop if I licked her fingers, but I had a feeling that’d get me expelled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you doing, Hoshinomiya?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei appeared out of nowhere. With a loud \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethud\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, she smacked Hoshinomiya-sensei on the head with her clipboard. Hoshinomiya-sensei crouched and gripped her skull in apparent pain.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ouch! What was that for?” she cried.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For getting involved with one of my students.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was only keeping him company while he waited for you, Sae-chan.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would have been better if you just left him alone. Thanks for waiting, Ayanokouji. Let’s go into the office.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The guidance office?” I asked. “Did I do something wrong? I’ve been trying to keep a low profile here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A good answer. Come.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile I wondered what this was all about, I followed Chabashira-sensei. Hoshinomiya-sensei remained by my side, smiling widely. Chabashira-sensei noticed and turned, her face much like a demon’s.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You stay,” she ordered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, don’t be so cold! It won’t be the end of the world if I listen, right? Besides Sae-chan, you’re definitely not the type to give one-on-one guidance. Pulling a new student like Ayanokouji-kun into the guidance room out of nowhere… Are you after something, I wonder?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eGrinning, Hoshinomiya-sensei scooted behind me and placed her hands on my shoulders. I sensed a storm brewing.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, Sae-chan, are you looking to be dominated by a younger man?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDominated by a younger man? What did \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e mean?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t say such stupid things. That wouldn’t be possible.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hee, you’re certainly right. It wouldn’t be possible for \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, Sae-chan,” Hoshinomiya-sensei muttered, her words laced with a double meaning.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why are you following us? This is a Class D matter.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? I can’t go to the guidance room? That’s not okay? Come on, I can give advice, too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs Hoshinomiya-sensei continued to follow, a female student came up to us, a beautiful girl with light-pink hair. I’d never seen her before.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hoshinomiya-sensei, do you have a moment? The student council wishes to discuss something with you.” She glanced at me, but quickly returned her attention to Hoshinomiya-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, you have someone who needs you. Get to it.” \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSlap!\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Chabashira-sensei smacked Hoshinomiya-sensei on the butt with her clipboard.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aw! She’ll get mad at me if I hang around any longer. See you later, Ayanokouji-kun! All right, Ichinose-san. Let’s go to the faculty office.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, she turned on her heel and left with the beautiful Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei lightly scratched her head while she watched Hoshinomiya-sensei leave. Soon after, we entered the guidance room, which stood beside the faculty office.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So. Why did you call me here?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, about that… Before we begin, please come here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe briefly glanced at a clock hanging on the wall, which gave the time as nine o’clock, and opened the door. Inside was a small office kitchenette. She placed a kettle on top of a stove.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m going to make tea. Is roasted green okay?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI picked up the container with the tea powder.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t make any unnecessary moves. Shut up and get in here. Understand? Don’t make a sound and stay until I tell you it’s okay to come out. If you don’t do as I say, you’ll be expelled,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? What do you mean by—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe closed the door to the kitchenette without explanation, leaving me in there. What in the world was she scheming? I did as I was told and waited. Soon after, I heard the outer door to the guidance room open.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, come in. So, what did you want to talk to me about, Horikita?” I heard Chabashira-sensei say.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently Horikita was in need of guidance.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I will be frank. Why was I sorted into Class D?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s quite frank.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Today, you told us that the school sorted superior students into Class A. You said that Class D was filled with the leftovers, the last bastion of delinquents.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s true. You must consider yourself to be a superior person.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wondered how Horikita would respond. I’d bet she’d confidently object.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I solved nearly every problem on the entrance examination. I made no substantial mistakes on the interview, either. At the very least, I shouldn’t
