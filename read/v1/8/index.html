"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T179d1,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 2:\u003cbr/\u003eWelcome to the School\u003cbr/\u003eLife of Your Dreams\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003e“A\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eyanokouji-kun, do you have a moment?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe came. She was here. It was terrifying. I’d been feigning sleep during class, pondering society’s true purpose while I pretended to nap, when the devil approached me. Shostakovich’s Symphony No. 11 played in my head, music that captured the sense of people fleeing from pursuing demons and the desperation that comes at the end of the world. Right then, it was the perfect accompaniment. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though my eyes were closed, I understood. I could feel the devil’s presence as she waited for her slave to awaken. So, as a slave, how exactly could I get out of this situation?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy computer-like brain instantly executed all the calculations to arrive at the answer I most needed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eConclusion: I’d pretend not to hear her. I had dubbed this the “Sleeping Strategy.” If she were a kind girl, then she would say something like, “Aw, well, there’s nothing to be done. I’d feel bad to wake you, so I’ll forgive you.\u0026#160;★” “If you don’t get up, I’ll kiss you!” would also be okay.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you do not awaken within three seconds, I will bestow additional punishment upon you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean, ‘punishment’?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn an instant, I’d abandoned my “Sleeping Strategy” and yielded to her threats of force. Well, at least I offered some resistance by not meeting her gaze.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“See, you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eare\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e awake after all, aren’t you?” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know enough that I’m afraid to make you angry.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Glad to hear it. Well then, may I have a little of your time?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I refuse?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, even though you have no right to veto such a decision, I suppose I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewould\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e be exceptionally displeased.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe continued with, “And when I am displeased, then I will prove a major obstacle to your school life, Ayanokouji-kun. For example, I might set a great number of thumbtacks on your chair. Or, when you go to the toilet, I might splash water on you from above. Or stab you with the needle of my mathematical compass. Those kinds of obstacles, I suppose.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s nothing but harassment, or rather, bullying! And besides, that last one sounds strangely familiar, because you’ve already stabbed me before!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI reluctantly sat up at my desk. A girl with beautiful, sharp eyes and long black hair that framed her face stared down at me. Her name was Horikita Suzune, a student of the Tokyo Metropolitan Advanced Nurturing High School, Class D, and my classmate.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry. That was only a joke. I wouldn’t splash water on you from above.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s more pressing are the thumbtacks and the compass needle! Look at this! There are still marks from when you stabbed me the last time! Will you take responsibility if it scars me for life?” I rolled up my right sleeve and displayed my forearm to Horikita, so she could see the scars she’d left behind.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Evidence?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What about the evidence? Did you decide I’m the culprit without evidence?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was right; there was no evidence. Even though Horikita was the only one in class close enough to stab me with a needle, I’d be hard-pressed to call that definitive proof…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, I needed to confirm something first anyway.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, I’m required to help you? I’ve thought on it again, and, after all, I—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun. Would you prefer to regret while you suffer or regret while you despair? Which would you like more? Because if you refuse me and force my hand, it will be your responsibility.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was stuck with Horikita’s two completely absurd choices. It appeared she would not accept any delays. Though it was a mistake to make a deal with this devil, I gave up and obeyed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, then. What am I supposed to do?” I asked, filled with trepidation. Her requests no longer surprised me. I certainly didn’t like how this situation had turned out, but… I thought back to when I’d met this girl two months ago, on the day of the entrance ceremony.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e2.1\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003epril. The school entrance ceremony. I rode the bus to school, bobbing and shaking in my seat. While I looked idly out my window, watching the city’s scenery change, the bus picked up more and more passengers.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMost of them were young people wearing high school uniforms.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was also a frustrated salary worker, who looked like the type to have once mistakenly groped someone aboard a crowded bus. An unsteady elderly lady stood in front of me, wobbling so badly I thought she was in danger of falling. Considering I’d known how packed this bus would likely be, I supposed I was simply reaping what I’d sown by getting on.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was fortunate to have found a seat, but it was still crowded. I forgot about the unfortunate elderly woman and patiently waited to arrive at my destination, my mind clear as a passing stream. The weather was especially fine today, not a single cloud in the sky. It was so refreshing that I nearly fell asleep then and there.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, my gentle respite was promptly obliterated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Excuse me, but shouldn’t you offer up your seat?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy eyes, which were about to close, snapped back open. Huh? Could this person be angry with me? But I realized that it was someone else being scolded. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA young, well-built blond man of high school age had sat down in one of the priority seats. The elderly woman stood right next to him, and another woman stood beside her. This second, younger lady appeared to be an office worker.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, you there. Can’t you see that this elderly woman is having trouble?” the office lady said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe seemed to want the young man to offer up his seat.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer voice carried quite well throughout the quiet bus, attracting several people’s attention.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s a really crazy question, lady,” the boy said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wondered whether the boy was angry, unobservant, or just painfully honest. In any case, he grinned broadly and crossed his legs. “Why should I offer up my seat? There’s no reason for me to do so.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re sitting in a priority seat. It’s natural to offer up those seats to the elderly.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t understand. Priority seats are just that: priority seats. I have no legal obligation to move. Since I’m currently occupying this seat, I should be the one who determines whether or not I move. Am I supposed to give up my seat just because I’m young? Ha! That reasoning is nonsense.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe didn’t speak like a normal high school student. His hair was dyed blond, which made him stand out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m a healthy young person who certainly wouldn’t find standing inconvenient. However, I’d obviously expend more energy by standing than I would by sitting. I have no intention of doing such a pointless thing. Or are you suggesting I should act a bit livelier, I wonder?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what kind of attitude is that to take with your superiors?” she demanded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Superiors? Well, it’s obvious that both you and the old woman there been alive longer than I have. There can be no doubt about that. However, the word ‘superior’ ­implies that you’re referring to someone of a higher position. In addition, we have another problem. Even though our ages are different, wouldn’t you agree that you have an impertinent attitude and are being extremely rude?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wha— You’re a high schooler, aren’t you?! You should be quiet and listen to what adults tell you!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s f-fine, whatever…” the elderly woman mumbled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe apparently didn’t want any further commotion and tried to calm the office lady. But after being insulted by the high school student, the younger woman still seemed very upset.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Apparently, this elderly woman is more perceptive than you, which is nice. Also, I haven’t given up on Japanese society yet. Please enjoy your remaining years.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter flashing a pointlessly vigorous smile, the boy slid his earphones in and began listening to rather cacophonous music. The office lady now clenched her teeth in frustration. Though she tried needling the boy by arguing further, his smug, self-important attitude remained fixed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt any rate, I had to at least partly agree with the boy.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf you ignored the question of a moral imperative, it was true that he wasn’t legally obligated to give up his seat.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry…” Desperately fighting back her tears, the office lady apologized to the elderly woman.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, it was all just a minor incident on the bus. I was relieved that I hadn’t been caught up in the situation. Honestly, I couldn’t care less about giving up my seat for an elderly person.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClearly, the egotistical boy had won. At least, everyone secretly thought so.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um… I think that the lady is right.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe woman received unexpected support from someone standing alongside her. The helper, a girl wearing my high school’s uniform, gave her brave and frank opinion to the boy. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And the new challenger is a pretty girl, eh? It would seem that I’m rather lucky with the fairer sex,” the boy said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This poor woman appears to have been suffering for quite some time now. Won’t you offer up your seat? While you might consider such courtesy unnecessary, I think it would contribute greatly to society.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eCrack!\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e The boy snapped his fingers. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A contribution to society, you say? Well, that \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eis\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e a rather interesting opinion. It’s certainly true that offering up one’s seat to the elderly could be viewed in such a positive light. Unfortunately, I have no interest in contributing to society. I care only for my own satisfaction. Oh, and one more thing. You’re asking me, the one in the priority seat, to give up his spot, but couldn’t you simply ask one of the other people seated on this crowded bus? If you truly cared for the elderly, then something like priority seating would be a rather trivial concern, wouldn’t you agree?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe boy’s haughty attitude remained unchanged. Both the office lady and the elderly woman simply wore bitter smiles in response. However, the girl didn’t back down.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Everyone, please listen to me for just a moment. Won’t someone give up their seat for this woman? It doesn’t matter who. Please.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Text_body__And__Centre_Alignment__And__Page_Break\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol1_INTERIORIMAGES_\" src=\"/hola-lector-agua/images/books/v1/OEBPS/Images/ClassroomElite-Vol1_INTERIORIMAGES_.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHow could someone pour so much courage, determination, and compassion into so few words? That was no simple feat. The girl might have seemed like a nuisance to those around her, but she appealed to the other passengers earnestly and without fear.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough not in a priority seat, I was near the elderly woman. I imagined if I raised my hand and offered my spot, then the matter would be settled. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, like everyone else, I didn’t move. None of us had thought it necessary to move. The boy’s attitude and remarks aside, everyone on the bus had, for the most part, agreed with him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow, of course, the elderly have undeniable worth to Japan. But we, the youth, will continue to support Japan into the future. Also, considering that our society ages more and more every year, you could say that our youthful value only increases. So, if you were to examine both the elderly and the young and ask yourself which group is more valuable, the answer should be obvious. That’s really the perfect argument, wouldn’t you say?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut still, I wondered what the others would do. As I looked around, I saw two kinds of people: those who had pretended not to have heard anything and those who looked hesitant. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, the girl sitting next to me was different. She alone wasn’t swept up by the confusion. Her face remained expressionless.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile I unintentionally stared at her, our eyes met for an instant. Even without speaking a word, I could tell that we shared the same opinion. Neither of us considered it necessary to give up our seat. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“E-excuse me. You can have mine.” Shortly after the girl’s appeal, a working woman stood, unable to bear the guilt any longer, and offered up her seat.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you very much!” the elderly woman said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe working woman smiled, lowered her head, and guided the elderly woman to the now-vacant seat. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe elderly woman expressed her gratitude repeatedly, and slowly sat. Watching the scene unfold from my peripheral vision, I crossed my arms and closed my eyes. Soon, we arrived at our destination, and all the high school students began to disembark.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I got off the bus, I saw a gate formed from natural rock waiting just ahead. All the young boys and girls dressed in school uniforms were passing through this gate. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe Japanese government had created the Tokyo Metropolitan Advanced Nurturing High School with the express purpose of developing future leaders. This would be my school from now on.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eOkay, stop for a moment. Take a deep breath. All right, here we go!\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe instant I tried to take my first courageous step, someone called out to me. It was the girl who’d sat next to me on the bus.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You were looking at me. Why?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe narrowed her eyes while we spoke.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry. I guess I was just interested, is all. I mean, you didn’t think about giving up your seat to the old woman, did you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. I didn’t consider giving it up. Is there something wrong with that?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, no, not at all. I didn’t intend to give up my seat, either. In fact, I firmly abide by the philosophy of letting sleeping dogs lie. I dislike trouble.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You dislike trouble? Then I don’t think you and I are anything alike. I didn’t give up my seat because I thought it would be pointless. That’s all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But doesn’t that seem worse than just not liking trouble?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Perhaps. I’m simply acting according to my own beliefs. That’s different from someone who just dislikes trouble, like you. I don’t want to spend any time around people like you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I feel the same way,” I muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had only wanted to share my opinion, but I wasn’t too keen on going back and forth with her like this. We both sighed and proceeded to walk in the same direction.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e2.2\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 3.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003edisliked the entrance ceremony and imagined that many first-year students probably felt the same. The principal and the students exchanged excessive words of gratitude, there was far too much time spent standing in lines, and, with so many irritating things to deal with, it all felt like a huge pain in the butt. But those weren’t my only complaints. The entrance ceremonies for elementary school, junior high, and high school all mean the same thing: the start of another major trial for children. In order for students to enjoy their time at school, they must make friends, and there are only a few key days after the entrance ceremony to properly do that. Failure to do so signals the beginning of a rather tragic three years.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs someone who dislikes trouble, I decided I’d like to establish proper relationships. Unfamiliar with the notion, I’d spent the day before in preparation, running through different scenarios. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor instance, should I burst into the classroom and actively start talking to people? Should I secretly pass around a slip of paper with my email address, so as to better befriend someone? Someone like me needed to practice, because this environment was so different from what I’d experienced thus far. I was completely isolated. I had ventured alone into a battlefield, and it was do or die. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLooking around the classroom, I walked toward the seat that bore my nameplate. It was at the back of the room, near the window. A good place to sit, generally. As I looked around, I saw that the room was already halfway filled with students. The others were either immersed in their class materials or already talking with other people. Perhaps they’d all been friends beforehand or had only recently gotten acquainted. Well then, what should I do? Take action during this free time and try to meet someone? In front of me, a rather rotund boy sat at his desk, hunching over. Perhaps it was my imagination, but he appeared lonely.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe boy exuded an aura that seemed to shout, “Please, someone be my friend!” However, if you just went up to someone and start talking, you might be bothering them. Should you wait for the right time? But then you might wait too long and be left friendless. I just had to… No, no, wait, I couldn’t be hasty. If I started a thoughtless conversation with someone I didn’t know, I ran the risk of making a serious social gaffe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNot good. I was trapped in a downward spiral.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the end, I couldn’t talk to anyone at all. At the rate things were going, I’d be completely alone. Had I heard someone say, “Is he still all alone?” Had I heard chuckling? Perhaps it was all in my head. What on earth are “friends,” anyway? Where do friends come from? Do people become friends after sharing a meal together? Can you become friends with someone after you walk to the bathroom together for the first time? The more I thought about it, the more I wondered: What is friendship? Is it something deep and meaningful? I tried to piece it together.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTrying to make friends is incredibly bothersome. Besides, don’t human relationships tend to form naturally? My thoughts were in utter disarray, as though a raucously loud festival was being staged inside my head. While I sat lost in a haze, the classroom quickly filled. Fine. Whatever. Nothing ventured, nothing gained, right? After a long period of conflict, I finally began to rise from my seat. However…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBefore I knew it, the rotund, bespectacled boy in front of me had started to talk with another classmate.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWearing a bitter smile, I realized that there was no new friendship to be cultivated there. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI’m happy for you, Glasses-kun. It looks like you made your first friend.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I got beaten to the punch!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was at my wit’s end, stuck in useless navel-gazing. Reflexively, I let out a deep sigh. My high school experience seemed poised to be exceptionally dour. Then, someone sat down beside me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s quite a heavy sigh, considering the school year has only begun. Meeting you again makes \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eme\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e want to sigh.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was the girl who’d fought with me at the bus stop and then walked off.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, we were placed in the same class, huh?” I mumbled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, there were only four classes for all of the first-year students, after all. Statistically, it wasn’t impossible for us to be together.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nice to meet you. I’m Ayanokouji Kiyotaka.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You just went ahead and introduced yourself?” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, this is the second time that we’ve spoken. Isn’t it fine for me to do so?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had wanted to introduce myself to someone anyway, so it wasn’t as though I could just keep quiet. Besides, in order to become familiar with my class, I had to at least know my neighbor’s name…even if she was this ­audacious girl.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you mind if I refuse?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think sitting next to someone for an entire year without knowing their name would be comfortable.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I disagree.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShooting me a glance, she placed her bag on her desk. Apparently, she wasn’t going to tell me her name. Lacking any interest in the classroom, the girl simply sat upright in her chair like a model student.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you have a friend in another class? Or did you enroll here all on your lonesome?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re a curious one, aren’t you? You won’t find talking to me very interesting, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I’m bothering you, you can just tell me to be quiet.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wouldn’t introduce myself if it made her angry. I thought that the conversation was over, but then the girl sighed. Apparently, she’d changed her mind. She turned her gaze on me and introduced herself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m Horikita Suzune.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor the first time, I got a good look at her face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWow. She was cute. Or rather, she was beautiful. Even though we were in the same grade, I’d have believed it if you told me she was a year or two older.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSuch a calm, cool beauty.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let me tell you about myself,” I said. “I have no particular hobbies, but I’m interested in just about anything. I\u0026#160;don’t need many friends, but I think it would be nice to have at least a few. And, well, that’s about it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Spoken just like someone who avoids trouble. I don’t think I could ever like such a person,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Jeez, I feel like you trashed my entire existence in one second,” I muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I pray this will be my only upset.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I sympathize, but, unfortunately, I don’t think your prayers will be answered.” I pointed to the classroom entrance. Standing there was—\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This seems like a rather well-equipped classroom. It would appear to live up to people’s expectations, hmm?” Yes. The boy who’d quarreled with those women on the bus.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. This certainly is bad luck,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis troublemaker had been placed in Class D with us. Without seeming to notice our presence at all, he went over to the seat labeled “Kouenji” and sat. I wondered if such a person had ever considered even the idea of friendship. I tried observing him for a little bit. Kouenji put his feet on top of the desk, took a nail file from his bag, and hummed while he treated his fingernails. He acted as though he were completely alone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, the rude comments he’d made on the bus had been an accurate reflection of his opinions. Within ten seconds, more than half the class had begun drawing away from Kouenji. His imposing nature dominated the space. Looking over, I saw that Horikita’s gaze had lowered, and she seemed to be reading one of her own books. Oh, shoot. I’d forgotten that conversational back-and-forth was one of the basics of maintaining interest. I’d squashed one of my chances to become friends with Horikita. Leaning down, I glanced at the title of her book: \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eCrime and Punishment\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. Now that was interesting. A story that debated whether it was right to kill someone, so long as it was done for the sake of justice.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo sad. Perhaps Horikita’s taste in books was reflected in her personality. Well, at any rate, we’d introduced ourselves, so perhaps we could at least become neighborly. After a few minutes, the first bell rang. At that precise moment, a woman entered the classroom. When I first saw her, my initial impression was that she firmly believed in discipline. If I had to guess, I would have placed her age at thirty. She wore a suit and had delicate features. Her hair seemed long, and she’d tied it into a ponytail.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ahem. Good morning to you, students. I’m the instructor for Class D. My name is Chabashira Sae. I usually teach Japanese history. However, at this school, we do not change classrooms for each grade. For the next three years, I will be acting as your homeroom teacher, so I hope to get to know all of you. It’s a pleasure to meet you. The entrance ceremony will be in the gymnasium one hour from now, but first, I will distribute written materials with information about this school’s special rules. I will also hand out the admissions guide.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe students in the front seats passed back the familiar documents I’d received after being accepted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis school differed from the multitude of other Japanese high schools in a few key ways. Here, all students were required to live in dormitories located on school premises. Also, except for special cases, such as studying abroad, students were forbidden to contact anyone outside the school. Even contact with your immediate family was forbidden without authorization. Naturally, leaving school grounds without permission was also strictly forbidden.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, the campus also came equipped with many excellent facilities. With its own karaoke spot, theater, café, boutique, and more, you could easily compare this school to a small city. The campus spread over more than 600,000 square meters. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis school boasted another unique feature: the S System.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I will now hand out your student \u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eID\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e cards. By using your card, you can access any of the facilities on campus, purchase goods from the store, and so on. It acts like a credit card. However, it is imperative that you pay attention to the points that you spend. At this school, you can use your points to buy anything. Anything located on the school premises is available for purchase.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOur points, loaded onto our student \u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eID\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e cards, acted as a kind of currency. The lack of paper money would prevent many students’ financial troubles. However, students needed to keep a watchful eye on their spending habits. At any rate, the school provided these points free of charge.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your student cards can be used simply by swiping them through the machine scanner. The method is simple, so you shouldn’t get confused. Points are automatically deposited into your account on the first of every month. You should all have received 100,000 points already. Keep in mind that one point is worth one yen. No further explanation should be necessary.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe classroom erupted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, we had received a 100,000-yen monthly allowance from the school upon admission. I’d expect nothing less from a massive institution run by the Japanese government. 100,000 yen is a rather large sum of money for a high schooler.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shocked by the amount of points you’ve been given? This school evaluates its students’ talents. Everyone here has passed the entrance examination, which itself speaks to your value and potential. The amount you’ve received reflects the evaluation of your worth. You can use your points without restraint. After graduation, however, all of your points return to the school. Because it’s impossible to exchange your points for cash, there’s no advantage to saving them. Once points have been deposited into your account, it’s up to you how to spend them. Do as you like. In the event that you don’t want to spend your points, you may transfer them to someone else. However, extorting money from your peers is not allowed. This school monitors bullying very carefully.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs bewilderment spread among the students, Chabashira-sensei looked over the room.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it appears no one has any questions. I hope that you enjoy your time here as students.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMany of my classmates could not hide their surprise at the large amount of points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This school doesn’t seem as strict as I thought,” I muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI thought I was talking to myself, but Horikita looked in my direction. She must have imagined I was speaking to her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This school is extremely lenient, isn’t it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite all of the restrictions, like being forced to live in the dormitories, being forbidden to leave the campus, and being prohibited from contacting anyone on the outside, no one here seemed to have any complaints. In fact, you might even say that we’d been given such preferential treatment that it was like we’d been transported to paradise. Of course, the Advanced Nurturing High School’s most impressive statistic was its near 100 percent placement rate for students advancing into higher education or entering the workforce. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis government-sponsored school’s thorough guidance of its students hoped to ensure a better future. In fact, the school heavily advertised this. Many of its alumni went on to achieve fame. Typically, no matter how famous or impressive a school might be, the areas of specialization are limited. For example, one school might specialize in sports or in music. Another might focus on something related to computers. However, at this school, any student could hope to succeed, regardless of their field.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnly this school had that kind of name-brand value. I’d assumed that the atmosphere would be cutthroat, but the majority of students looked like typical kids. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo, that wasn’t quite right. After all, we’d been capable enough to pass the entrance exam. If we could reach graduation day peacefully, without incident, then we would have achieved our goal… Was such a thing really possible, though?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is almost \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003etoo\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e much preferential treatment. It’s frightening.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs Horikita spoke, I realized I felt the same way. We hardly knew anything about this school. It was as if a veil of mystery shrouded everything. Because a school like this could make any wishes a reality, I’d thought some kind of risk would have to be involved.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, hey! Do you want to check out a store with me on our way back? Let’s do some shopping!” one girl cried.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure. With this much, we can buy anything. I’m so glad I got into this school!” another said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce the teacher was gone, the newly rich students began to grow restless. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Everyone, can you please listen to me for a moment?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA student with the air of an upstanding young man quickly raised his hand. His hair wasn’t dyed. He looked like an honors student. Based on his appearance, I got the impression he wasn’t a delinquent.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Starting today, we’re all going to be classmates. Therefore, I think it’d be good for us to introduce ourselves and become friends as soon as possible. We still have some time until the entrance ceremony. What do you say?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe’d just done something incredible. The majority of students were lost in thought, unable to speak up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Agreed! After all, we still don’t know a thing about each other, not even our names,” someone shouted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter the ice had broken, the previously hesitant students began to speak.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My name’s Hirata Yousuke. Back in junior high, lots of people called me Yousuke. Feel free to use my first name! I guess my hobby is sports in general, but I especially like soccer. I’m planning on playing soccer here, too. Nice to meet you!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe young man who had proposed the idea of everyone becoming acquainted—Hirata—effortlessly introduced himself to the class. He seemed exceptionally brave. And he’d talked about his love for soccer, too! His level of popularity must’ve increased two, no, maybe four times. Why, the girl seated next to Hirata had hearts in her eyes! If someone like Hirata became our class’s linchpin, I wondered if he’d keep everyone honest and motivated until graduation. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSomeone like him would probably end up dating the cutest girl in class. That was how these things typically went.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, I’d like everyone to introduce themselves, starting from the front. Is that okay?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough the girl at the head of the class looked a little bewildered, she quickly made up her mind and stood. Or rather, she’d been pressured, in response to Hirata’s words.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“M-my name is…Inogashira Ko-Ko…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe girl, last name Inogashira, seemed to freeze during her introduction. Was she drawing a blank, or had she not considered what she was going to say beforehand? As her words halted, she paled. It was rare to see someone get so incredibly nervous.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do your best!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t panic! It’s okay!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKind words poured out of our classmates. But it seemed to have the opposite effect on the girl; the words stuck in the back of her throat. The silence continued for five seconds. Ten seconds. You could’ve cut the tension with a knife. Some of the girls started giggling. Inogashira was paralyzed with fear. She couldn’t move a muscle. Another girl spoke up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s okay to go slowly. Don’t rush.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough it might seem kind, saying, “Do your best!” and, “It’s okay!” it actually conveys a completely different meaning. To someone who is extremely nervous, “Do your best!” and, “It’s okay!” can actually seem forceful, as if indicating she needs to match her classmates. On the other hand, saying, “Just take things slowly. Don’t rush,” allows her to take things at her own pace.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter that, the girl calmed down and regained her composure. She took a few small breaths and tried again. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My name is Inogashira…Kokoro. Um, my hobby is sewing. I’m pretty good at knitting. I-It’s nice to meet you all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was able to finish without stopping. Looking alternately relieved, delighted, and embarrassed, Inogashira sat down. Other introductions followed hers.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m Yamauchi Haruki. I competed in table tennis during elementary school, and in junior high I was the ace player on our baseball team. I was number four. I got hurt during the inter-high school championships, though, and I’m undergoing rehab now. Nice to meet you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t think that the number of his baseball uniform was essential information…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBesides, I’d thought the inter-high championship was a national sports competition for high school students. Junior high school kids were supposed to be ineligible.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWas he trying to crack a joke? He seemed like a talkative guy who got carried away pretty easily.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, I’m next, aren’t I?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe cheerful girl who stood up was the same one who’d told Inogashira to go slowly and calm down. She was also the same girl who’d helped out the elderly woman on the bus that morning.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My name is Kushida Kikyou. None of my friends from junior high made it to this school, so I’m alone here. I’d like to get to know all of your names and faces right away and become friends as soon as possible!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile most of the students had only said a few words of introduction, Kushida continued to talk. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My first goal is to become friends with everyone. So, after we’re finished with introductions, I’d love for you to share your contact information with me!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe wasn’t just saying that. I could tell right away that this girl was the type to open up her heart to anyone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer encouraging words to Inogashira hadn’t been platitudes, but a genuine reflection of her feelings.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, after school or during vacations, I want to make all sorts of memories with lots of people. Please feel free to invite me to lots and lots of events! Anyway, I’ve talked for a long time, so I’ll end my introduction here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Text_body__And__Centre_Alignment__And__Page_Break\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol1_INTERIORIMAGES_2\" src=\"/hola-lector-agua/images/books/v1/OEBPS/Images/ClassroomElite-Vol1_INTERIORIMAGES_2.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe said it as though she knew I’d been critiquing everyone’s introductions. I felt strangely uncomfortable, and I wasn’t sure why.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat should I say when my turn came? Should I make a joke? Should I go into it with really high energy in order to get some laughs? No, that wouldn’t work. Going out of control would just ruin the atmosphere. Besides, that didn’t really fit my personality anyway.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe introductions continued while I wrestled with my anxiety.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, next up is…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs Hirata looked encouragingly toward the next student, that student glared back. His hair was dyed a fiery red. He both looked and sounded like a delinquent.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What, are we a bunch of little kids or something? I don’t need to introduce myself. People who want to do that can go ahead. Just leave me out of it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe red-haired guy scowled at Hirata. He had quite a presence, his attitude intense and overpowering.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t force you to introduce yourself, of course. However, I don’t think that getting along with your classmates is a bad thing. If I’ve made you uncomfortable, I apologize.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen Hirata bowed his head, some of the girls glared at the guy with red hair.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Isn’t it fine to introduce yourself?” one of them snapped.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, yeah!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I’d expected, the pretty-boy soccer star had captured most of the girls’ hearts in the blink of an eye. However, half of the male students started to look angry, probably out of jealousy.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shut it. I don’t care. I didn’t come here to make friends.” The guy with red hair got up from his seat. It seemed he had no intention of getting to know anyone. Several other students followed suit and left the classroom together. Horikita got up and briefly glanced my way. When she realized I wasn’t moving, she started to walk out the door. Hirata looked a little lonely when he saw Horikita head out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They’re not a bad bunch. It’s my fault. I was being selfish and made people do this.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No way. You didn’t do anything wrong, Hirata-kun. Let’s just leave those guys be, okay?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough some people had rebelled at the idea of introductions, the students who remained were happy to continue. In the end, things wrapped up in a rather ordinary fashion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m Ike Kanji. I love girls, and I hate pretty boys. I’m currently in the market for a new girlfriend. It’s nice to meet you! All the better if you’re a cutie or a beauty!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was difficult to tell if he was joking or not. At the very least, the girls looked at him with revulsion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow. You are \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eso\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e cool, Ike-kun,” one girl said, in a completely emotionless voice. Of course, her statement was 1000 percent false.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seriously? Seriously? Oh, man. I mean, I thought that I wasn’t bad or anything, but…heh heh.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, Ike thought that she was being serious. He blushed. Instantly, the girls started to laugh.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, wow. He’s \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecute\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, huh, everyone? He’s looking for a girlfriend!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eDude, they’re making fun of you.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Ike continued to jovially go along with the teasing. He didn’t seem like a bad guy, though.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNext up was the combative boy from the bus, Kouenji. While inspecting his bangs in a hand mirror, he combed his hair.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Excuse me, can you introduce yourself?” Hirata asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmph. Fine.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe smirked like an aristocrat, displaying his impudent attitude. As he shifted in his seat, I thought he might leave, but Kouenji placed both of his legs on his desk and introduced himself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My name is Kouenji Rokusuke. As the sole male heir to the Kouenji conglomerate group, I will soon be tasked with carrying Japan into the future. I sincerely look forward to making your acquaintance, ladies.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe aimed his introduction solely at the opposite sex, rather than the entire class. After hearing that he was rich, some of the girls looked at him with sparkling eyes, while others regarded Kouenji as if he were nothing more than a weirdo. That was only natural.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Starting today, I will mercilessly punish anyone who makes me uncomfortable. Please exercise proper precaution so that you may avoid that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um, Kouenji-kun. What exactly do you mean when you say, ‘anyone who makes me uncomfortable’?” asked Hirata, who looked uneasy at the word “punish.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I meant exactly what I said. If asked to give an example, well… I would say I hate ugly things, for instance. So, if I saw something ugly, I would do just as I said.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFwish!\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e He flipped his long, flowing bangs.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, thank you. I will be careful then.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was the guy with red hair, Horikita, Kouenji, Yamauchi, and Ike. Apparently, this class was full of people with bizarre idiosyncrasies. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI, too, was especially peculiar, in that there was nothing peculiar about me. I had wanted to be free, free as a bird, but prior to this I’d languished in a cage. I had wanted to fly into the expansive open skies. If you looked out the window, you could watch birds gracefully soaring… Well, not right now, but in general. Anyway, that’s the kind of guy I was.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, time for the next person. Can you please introduce yourself?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOh, shoot. My turn had come while I’d been daydreaming. Students turned, waiting for my introduction. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHey, hey! Don’t look at me with so much anticipation. Oh well, I might as well try my best\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eClack!\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e The chair rattled as I stood.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um. Well, my name is Ayanokouji Kiyotaka. And, uh, I don’t really have any special skills or anything. I’ll do my best to get along with all of you. It’s, uh, nice to meet you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell? Was \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e my introduction?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d failed!\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI instinctively buried my head in my hands. I hadn’t had time to construct a proper introduction because I’d been too busy daydreaming. It was the worst possible intro. It didn’t attract attention, and absolutely no one would remember it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s nice to meet you, Ayanokouji-kun. I always want to be friends with everyone, just like you. Let’s both do our best, okay?” Hirata responded with a refreshing smile.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone clapped. Their applause felt somewhat like pity, which strangely pained me. Despite that, however, I felt kind of glad.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e2.3\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eE\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003even though people said this place was tough, the entrance ceremony was the same as any other school’s. Some important people offered words of thanks, and the ceremony concluded without incident. Then, it was noon. After we received some general information about the campus, the crowd dispersed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e70–80 percent of the students headed toward the dormitories. The remaining students quickly formed into groups. Some made their way to cafés, while the louder ones went out for karaoke. The hustle and bustle quickly died down. On a whim, I decided to swing by the convenience store on my way back to the dormitory. Of course, I went alone. I didn’t have a chaperone, or acquaintance, or anyone like that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My, what an unpleasant coincidence.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEntering the convenience store, I ran into Horikita once again. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, there’s no need to be so hostile. Anyway, did you need to buy something?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, just a few things. I came to get some necessities.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no shortage of things you needed when starting life in a dorm, especially if you were a girl. Horikita took various necessities like shampoo off the shelves and promptly threw them into the basket she was carrying. I’d thought she would choose higher quality items, but she only took the cheapest options.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought girls usually made a fuss over what kind of shampoo they bought.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that depends on the person, doesn’t it? I’m the sort who doesn’t know when you might need money,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe shot me an icy glare that seemed to say, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eCould you please not inspect other people’s purchases without their permission?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At any rate, I was terribly surprised that you stayed for introductions,” she said. “You didn’t look like the type to hang out with a circle of classmates.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I decided to participate precisely because I don’t like trouble. Why didn’t you introduce yourself to them, Horikita? You could have gotten to know several other students, and it would have been a chance to make friends.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eQuite a few of the students had exchanged cell numbers, too. If Horikita had participated, she would probably have become quite popular. What a waste.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are several reasons why I objected, but I suppose it might be better if I simply explain, hmm? My introduction might have sown discord, depending on how things went. Thus, doing nothing avoided creating more problems. Am I wrong?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But, statistically speaking, there was a high probability that you could have hit it off with everyone after introducing yourself,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How did you arrive at that conclusion? Actually, if I argue this with you now, we’ll just end up in an endless debate. Let’s say that the probability of making friends was high, like you said. So, how many people did you get to know?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe gazed at me. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was a rather splendid argument. The fact that I hadn’t yet exchanged contact information with anyone worked in Horikita’s favor. It proved there was no guarantee that introductions led to friendship. I instinctively averted my eyes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In other words, you have no evidence to support your claim that self-introductions lead to making friends, do you?” she asked. “Besides, I never intended to make friends in the first place. If I have no need to introduce myself, then I also have no reason to listen to anyone else’s introductions. Have I convinced you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat reminded me of the disastrous first time I’d tried to introduce myself to Horikita. Come to think of it, it might have been a miracle that I’d managed to get her name.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I asked her if I shouldn’t have introduced myself to her, she shook her head. People tended to have hidden depths, no doubt about it. Horikita might have been a more solitary, more aloof person than I’d imagined. \u003c
