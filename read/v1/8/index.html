/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe roamed around the convenience store without looking at each other. Even though she was somewhat uptight, being with her didn’t feel uncomfortable.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoa! There’s even an amazing selection of noodle cups here! This school is super convenient!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTwo rather noisy male students stood before the instant foods. They tossed a veritable mountain of noodle cups into their basket and made their way to the cash register. Besides noodles, they’d stocked up on snacks and juice. Hey, it’d be nearly impossible to go through all your points; better to spend them. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Noodle cups. They have so many kinds.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThese were definitely one reason I’d come to the convenience store.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, do boys really like this kind of stuff? I can’t imagine that it’s healthy,” Horikita said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I like them just fine, I guess.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI picked up a noodle cup and examined the price tag. It said 156 yen, but I couldn’t tell whether that was expensive or cheap. Even though the school referred to its credit system as points, the prices were all listed in yen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, what do you think? Is this price high or low?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm. I’m not sure. Why, is there something curious about it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I was just wondering.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe store’s prices seemed reasonable. One point appeared to really equal one yen. Given that the average freshman’s allowance was around 5,000 yen, the amount of money we’d received seemed impossibly large. Horikita, noting my odd behavior, gave me a quizzical look. I grabbed a noodle cup to avoid suspicion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, this is enormous. It’s a G Cup, huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, that stood for “Giga Cup.” Just looking at it made me feel full. On an unrelated note, Horikita’s breasts were neither small nor huge. They exquisitely straddled the line between the two. The perfect size.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun. Were you thinking about something stupid just now?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Er. No?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I felt like you were acting strangely.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe could sense my inappropriate thoughts just by looking at me. She was a sharp one.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was just wondering whether or not I should buy this. What do you think?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh. Well, I suppose that’s fine. Anyway, do \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e really think you should buy that? This school offers far healthier food options. Don’t you think it’s better to avoid eating junk?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLike Horikita said, I had no reason to eat junk. However, since I had an irresistible urge, I took one package of regular-sized instant noodles with “FOO Yakisoba” written on it and tossed it into my cart. Her attention wandering, Horikita moved away from the food and began hunting for daily essentials. I planned to use witty jokes to score more points with her next.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re looking for something \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ea cut above the rest\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, how about this razor with five blades? I bet it’d do the job.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why in the world would I want to shave with \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI grinned smugly and pretended to shave an imaginary beard, but she didn’t laugh. Far from it. Instead, she looked at me like I was dirt.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Look at me,” she said. “I don’t have anything to shave. Not on my chin, not under my armpits, and not down \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethere\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI mumbled hesitantly, my spirit crushed. It looked like my jokes failed colossally with women.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have to say, I’m a little envious of your ability to babble inanely to someone you’ve only just met.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I feel like you’ve been saying stupid crap, too, and you only just met \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eme\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that so? I’ve merely stated facts. Unlike you.” She calmly tossed my words back at me, shutting me up. To be fair, I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehad\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e said some random nonsense. The smooth, eloquent Horikita, on the other hand, was always well-spoken, no matter how you sliced it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita chose the cheapest face wash. I would have thought girls cared more about that kind of thing, too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t you think that this one is better?” I took an expensive cream off the shelf and showed it to her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unnecessary.” She refused it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, but—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I already said it was unnecessary, didn’t I?” she snapped.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI gently returned the face wash as she glared at me. I thought I could carry on a conversation without making her angry, but I’d failed. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t seem adept at socializing. You’re terrible at conversation.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, if it’s coming from you, then it’s definitely true,” I grumbled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. I consider myself, at the very least, to have a good eye for people. Normally, I wouldn’t want to hear you talk anymore, but I will put in a painful level of effort to listen to you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d said that I wanted to be her friend, but, apparently, she didn’t feel the same. With that, our conversation abruptly stopped. Two new girls entered the convenience store. It was a little strange, but I became aware of something crucial: Horikita really was cute.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey. What’s up with this?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile looking around the store, desperate for a new topic, I’d found something strange. Some toiletries and food had been tucked away in the corner of the convenience store. At first glance, they appeared to be the same as the other items, but there was one big difference.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Free?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita apparently also thought it strange, so she picked up one of the items. Daily necessities like toothbrushes and bandages had been stuffed into a clearance bin and labeled “Free.” The bin was also marked with the proviso “three items per month.” These were obviously different from the store’s other goods.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They must be emergency relief supplies for students who use up their points. This school is so incredibly lenient,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had to wonder how far their leniency extended, though.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, shut it! Just wait a sec! I’m looking for it right now!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA sudden, loud voice drowned out the store’s peaceful background music.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, hurry up. You have a line of people waiting on you!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, yeah? Well, if they have any complaints, they can take it up with me!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, trouble was brewing by the register. A dispute had broken out between two young men who were glaring at each other. I recognized the one with the thoroughly ill-tempered look on his face. It was the student from my class, the guy with the red hair. He had his hands full of noodle cups.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s going on here?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Who are \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had meant to appear amicable, but the guy with red hair scowled at me. Apparently, he was under the mistaken impression that I was an enemy.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My name’s Ayanokouji. I’m from your class. I just asked because it sounded like there was trouble.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt my explanation, the red-haired guy looked somewhat mollified and lowered his voice a little. “Oh. Yeah, I remember you. I forgot my student \u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eID\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e card. Forgot that it pretty much acts as our money from now on, too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI looked at his empty hands. He’d put the noodle cups away. He started to leave, probably heading back to the dorms, where he’d likely forgotten his card. To be honest, the fact that the student \u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eID\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e was necessary for payment hadn’t yet sunk in for me, either.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can pay for you. I mean, it’d be annoying if you had to head all the way back to the dorms. I don’t mind.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s true. You’re right, it’d be absolutely annoying. Thanks.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe store wasn’t particularly far from the dorms, but by the time he got back there would be a long line of students buying lunch.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My name’s Sudou,” he said. “Thanks for helping me out. I owe you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nice to meet you, Sudou.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou handed me his noodle cup, and I walked over to the hot water dispenser. After watching our short exchange, Horikita sighed, aghast.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re acting like a pushover right from the start. Do you intend to become his servant? Or are you doing this to make friends?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t care about making friends. I just wanted to help. No big deal.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t seem to be afraid.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Afraid? Why? Because he looks like a delinquent?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A normal person would try to keep someone like him at a distance.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess, but he doesn’t seem like a bad person to me. And you don’t appear to be scared either, Horikita.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s mostly defenseless people who stay away from those types. If he acted violently, I could rebuff him. That’s why I don’t withdraw.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita’s words were always a little difficult to understand. To begin with, what did she mean by “rebuff”? Did she carry pepper spray to keep off perverts or something?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s finish our shopping. We’ll be a bother to the other students if we dawdle,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWrapping things up, we presented our student \u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eID\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e cards to the machine by the register. Since we didn’t have to deal with small change, our transaction was speedy. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You really can use it like money…” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy receipt showed the price of each item and the remaining amount of points. The payment had gone through without any problems. I poured hot water into my noodle cup while waiting for Horikita. I’d thought it might be tricky, but opening the lid and pouring hot water up to the line was simple enough.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnyway, this school was eerie.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat merit could every student possibly have that would warrant such a massive allowance? Considering that there were about 160 people enrolled in my grade, simple calculation suggested that there were 480 people total in this school. That alone would mean 48 million yen each month. Annually, that would equal 560 million yen. Even for a government-supported school, that seemed like overkill.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How does the school benefit from giving us this much money?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder. The campus has more than enough facilities for the number of students, and I wouldn’t think it necessary to hand out so much. Students who should be studying might slack off.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps it was some kind of reward for working hard and passing a test or something. Indeed, student motivation might increase if offered an incentive. However, the school had just handed out 100,000 yen to everyone, with no strings attached.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I won’t tell you what to do, but I think it would be best to avoid wasting your money. It’s difficult to fix frivolous spending habits. Once a person gets used to an easy life, they find they need more and more. When you lose it, the shock can be great,” Horikita said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll keep that in mind.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t really intend to waste money on miscellaneous junk, but she had a point. After paying and exiting the store, I found Sudou seated outside, waiting for me. When I saw him, he gently waved me over. I waved in return, feeling somewhat embarrassed, yet happy.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you really going to eat here?” I asked him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course. It’s just common sense.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou perplexed me with his matter-of-fact reply. Horikita sighed in exasperation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m going back. I’ll be stripped of my dignity if I spend more time here,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean, ‘dignity’? We’re just high school students. We’re ordinary. Or, what, are you the high-born daughter of some noble family or something?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita didn’t flinch at Sudou’s harsh tone. Seemingly irritated, Sudou set his noodle cup on the ground and stood.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Hey, listen to people when they’re talking to you! Hey!” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s his problem? He just suddenly got angry.” Horikita said this to me, ignoring Sudou. This was apparently too much for Sudou, who started to shout.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, get over here! I’ll smack that smug look off your face!” he yelled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Look, I’ll admit that Horikita has a bad attitude, but you’re taking this too far.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was apparent that Sudou’s patience had run out. “Huh? What was that? She has a bratty, obnoxious attitude. That’s bad, especially for a girl!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For a girl? That’s rather outdated thinking. Ayanokouji, I would advise you not to become his friend,” Horikita said. With that, she turned her back on Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, wait! You shitty girl!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Calm down.” I held Sudou back as he actually tried to grab Horikita. She made her way in the direction of the dorms without stopping or glancing back.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What the hell is her deal? Goddamn it!” he shouted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are many different types of people, you know.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shut it. I hate those stuffy, too-serious types.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe continued to glare at me. Sudou grabbed his noodle cup once again, ripped off the cover, and began eating. Just a little while ago, he’d fought in front of the register, too. He probably had a short fuse.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, you guys first years? This is our spot.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs Sudou slurped his ramen, three boys called out to us. They seemed to have come out of the same store and were carrying the same brand of noodle cups.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who are \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e? I was already here. You’re in the way. Get lost,” Sudou barked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You hear this guy? ‘Get lost,’ he says. What a cocky little first-year punk.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe three laughed in Sudou’s face. Sudou shot up, slamming his noodle cup against the ground. The broth and noodles splashed everywhere.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“‘First-year punk,’ huh? You tryin’ to make fun of me, huh?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou had an \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eextremely\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e short fuse. If I had to judge, he seemed like the type to immediately threaten anyone or anything that crossed him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re awfully mouthy, considering we’re second-year students. We already put our bags here, see?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ePlop\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e! With those words, the second-year upperclassmen students put down their bags and guffawed loudly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“See, our stuff’s here. Now, beat it,” one of them said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You got a lot of guts, asshole.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou didn’t back down, unfazed by being outnumbered. It looked like fists were going to fly at any moment. I, of course, didn’t want any part of it myself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, wow, scary. What class are you in? Wait, never mind. I think I know. You’re in Class D, aren’t you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, so what?” Sudou snapped.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe upperclassmen students exchanged glances and burst into laughter.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You hear that? He’s in Class D! I knew it! It was a dead giveaway!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? What’s that supposed to mean? Hey!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs Sudou barked at them, the boys grinned and stepped backwards.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aw, you poor things. Since you’re ‘defective,’ we’ll let you off the hook, just for today. Let’s get going, \u003cbr/\u003eguys.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, don’t run away! Hey!” Sudou shouted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, yeah, keep on yapping. You guys’ll be in hell soon enough anyway.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eBe in hell?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey appeared calm and composed. I wondered what they’d meant. Previously, I’d been certain this school would be filled with upper-class young men and women, but there seemed to be plenty of rowdy, combative people like Sudou or those upperclassmen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, damn it! If those had been nice second-year students, or cute girls, that would’ve been great. Instead, we had to deal with those annoying morons.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou didn’t bother to clean up his mess. He thrust his hands into his pockets before heading back. I looked at the wall outside the convenience store, discovering two surveillance cameras.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This might lead to problems later,” I muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eReluctantly, I bent down, picked up the cup, and started cleaning up the mess. Come to think of it, as soon as those second-year students found out Sudou was in Class D, their attitudes had changed. Although it ate at me, I couldn’t explain it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e2.4\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eround one pm, I made my way back to the dormitory, my home from that day onward. At the reception desk, I received a keycard for Room 401 and a handbook containing information about the dorm’s rules, then boarded the elevator. I quickly flipped through the handbook, which only detailed the most basic things that we needed for our daily routines. The dates and times for garbage disposal were listed, as well as a notice about avoiding excessive noise. I also saw notes about not wasting water or electricity, and so on.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, they don’t place restrictions on electricity or gas usage?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d assumed that the school would deduct the cost from our points. This school really went to great lengths to have a perfect system for its students. However, I was a little surprised that they’d implemented co-ed dormitories. After all, this was a high school, so the rules stated that unsuitable romantic relationships were frowned upon. In short, sex was strictly forbidden…obviously. I mean, a member of the clergy wouldn’t say that engaging in illicit sexual activity was okay.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile I privately doubted that such pampered students could develop into fine, upstanding adults, it would be wise to make the best of the situation for now. My room was about eight tatami mats wide. Also, though this was a dorm, it was the first time I’d lived alone. I refused to have any contact with the outside world until graduation. Considering my situation, I unintentionally cracked a smile.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis school boasted a high employment rate upon graduation, and its facilities and student services were unmatched throughout the country, making it the preeminent high school in Japan. I found such things trivial, however. I’d chosen this school for one fundamental reason.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt this high school, people were not allowed to contact students without permission, even if they were friends or immediate family. I greatly appreciated that. I was free. In English, they would call it, “freedom.” In French, they would call it, “liberté.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIsn’t freedom simply the best? When I wanted to eat something, I could eat it. I almost didn’t want to graduate. Before being accepted, I’d honestly thought I would be been fine either way, that the difference between passing and failing would have been trivial. But my true feelings finally welled up. I was glad to have been admitted here.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo one else’s eyes or words would ever reach me. I could start ag—no. I could begin anew entirely. A new life. I resolved to enjoy my time here to the fullest, but without drawing attention to myself. Still in my uniform, I dived into my already-made bed. I felt far from tired, however. I was so incredibly excited about my new life that I was unable to calm down. My eyes remained wide open.\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 2: Welcome to the School Life of Your Dreams\",\"volumeId\":\"v1\",\"chapterIndex\":8,\"prevChapter\":{\"volumeId\":\"v1\",\"chapter\":7,\"title\":\"Chapter 1 - Prologue :  The Structure of Japanese Society\"},\"nextChapter\":{\"volumeId\":\"v1\",\"chapter\":9,\"title\":\"Chapter 3: The Students of D Class\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Title Page\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Credits and Copyright\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue :  The Structure of Japanese Society\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: Welcome to the School Life of Your Dreams\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: The Students of D Class\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: Ladies and Gentlemen, Thank You for Waiting\",\"href\":\"Text/section-0008.html#auto_bookmark_toc_top\",\"index\":10},{\"label\":\"Chapter 5: Friends\",\"href\":\"Text/section-0009.html#auto_bookmark_toc_top\",\"index\":11},{\"label\":\"Chapter 6: The End of Everyday Life\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_top\",\"index\":12},{\"label\":\"Chapter 7: Classroom of the Elite\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_top\",\"index\":13},{\"label\":\"Chapter 8: The Association of Failures\",\"href\":\"Text/section-0012.html#auto_bookmark_toc_top\",\"index\":14},{\"label\":\"Chapter 9: The Failures Mobilize Once Again\",\"href\":\"Text/section-0013.html#auto_bookmark_toc_top\",\"index\":15},{\"label\":\"Chapter 10: Midterm Exam\",\"href\":\"Text/section-0014.html#auto_bookmark_toc_top\",\"index\":16},{\"label\":\"Chapter 11: The Beginning\",\"href\":\"Text/section-0015.html#auto_bookmark_toc_top\",\"index\":17},{\"label\":\"Chapter 12: Victory Celebration\",\"href\":\"Text/section-0016.html#auto_bookmark_toc_top\",\"index\":18},{\"label\":\"Epilogue: Postscript\",\"href\":\"Text/section-0017.html#auto_bookmark_toc_top\",\"index\":19}],\"volumeTitle\":\"Light Novel Volume 1\",\"detailsLink\":\"/select/year-1/v1\",\"returnLink\":\"/select\",\"currentSpineIndex\":8,\"nextVolumeLink\":\"/select/year-1/v2\",\"nextVolumeTitle\":\"Light Novel Volume 2\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://classroom-of-the-elite-read
