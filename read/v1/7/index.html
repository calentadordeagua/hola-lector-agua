"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T109b,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 1 - Prologue:\u003cbr/\u003eThe Structure of\u003cbr/\u003eJapanese Society\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eknow this is kind of sudden, but, please, it will only take a moment. I want your honest opinion. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAre people equal or not?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA proper society will constantly strive for equality. There are those who clamor for men and women to always be considered equal. As a result, we raised the employment rate for women, we made specialized subway cars only for women. Sometimes, women will even argue over the order of names in a family register. The public opinion of people with disabilities has also changed. We’re now told that we should not use the term “disabled people” when referring to them, so as not to discriminate. Nowadays, children are taught that all people are created equal.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut is that true? I have my doubts. If men and women have different abilities, then their roles should also differ. People with disabilities are still disabled, no matter what polite euphemisms you use. No matter how you try to avert your eyes, the meaning of the word does not change.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, my answer would be, “No, we are not equal.” To be human is to be unequal. Equality does not exist.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLong ago, in a bygone era, a great man said that heaven does not set one man above or below any other. However, he did not necessarily adhere to the idea that everyone is equal. Did you know that there is more to that famous passage? The rest goes like this: \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eEveryone is equal when they are born, so I ask, why do we see differences in position and status?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e And it continues: \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eDo you or do you not encourage learning to create a difference?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e So then, education creates an imbalance. The point’s spelled out there, in the incredibly famous work \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eGakumon no Sume\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. Even though this is the year 2015, the modern era, nothing about these teachings has changed. The situation has only grown more complex and fraught.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn any case, we are human beings. We are living, thinking creatures. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI don’t think it right to simply say that we are unequal and then live our lives based on pure instinct. In other words, though “equality” is a complete lie, we cannot accept inequality, either. Right now, I’m trying to come up with a new answer for humanity’s eternal question.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHey, you there. You, the one reading this book right now. Have you ever given serious thought to the future?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHave you ever considered the purpose of going to high school or to college? Though the future may seem hazy right now, do you think you’ll find a job someday? That’s what I used to think. Back when I finished my compulsory education and became a high school student, I hadn’t really considered the future. I’d only felt joy at being nearly free of obligation. I didn’t consider the incredible influence that school would continue to have in my life, on my future. I didn’t even understand the purpose behind studying language or numbers.\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$1
