P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter she said that, Horikita extended her arm.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll look after Sudou-kun and the others, but for my own sake. I’ll make sure that they don’t get left behind, but only as a strategic means of securing an advantage for our future. Okay?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry. I didn’t think you’d do it any differently. That’s just like you, Horikita.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’ve come to an arrangement, then.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI took Horikita’s hand. However, I would soon realize that I’d just made a deal with the devil.\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 8: The Association of Failures\",\"volumeId\":\"v1\",\"chapterIndex\":14,\"prevChapter\":{\"volumeId\":\"v1\",\"chapter\":13,\"title\":\"Chapter 7: Classroom of the Elite\"},\"nextChapter\":{\"volumeId\":\"v1\",\"chapter\":15,\"title\":\"Chapter 9: The Failures Mobilize Once Again\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Title Page\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Credits and Copyright\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue :  The Structure of Japanese Society\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: Welcome to the School Life of Your Dreams\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: The Students of D Class\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: Ladies and Gentlemen, Thank You for Waiting\",\"href\":\"Text/section-0008.html#auto_bookmark_toc_top\",\"index\":10},{\"label\":\"Chapter 5: Friends\",\"href\":\"Text/section-0009.html#auto_bookmark_toc_top\",\"index\":11},{\"label\":\"Chapter 6: The End of Everyday Life\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_top\",\"index\":12},{\"label\":\"Chapter 7: Classroom of the Elite\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_top\",\"index\":13},{\"label\":\"Chapter 8: The Association of Failures\",\"href\":\"Text/section-0012.html#auto_bookmark_toc_top\",\"index\":14},{\"label\":\"Chapter 9: The Failures Mobilize Once Again\",\"href\":\"Text/section-0013.html#auto_bookmark_toc_top\",\"index\":15},{\"label\":\"Chapter 10: Midterm Exam\",\"href\":\"Text/section-0014.html#auto_bookmark_toc_top\",\"index\":16},{\"label\":\"Chapter 11: The Beginning\",\"href\":\"Text/section-0015.html#auto_bookmark_toc_top\",\"index\":17},{\"label\":\"Chapter 12: Victory Celebration\",\"href\":\"Text/section-0016.html#auto_bookmark_toc_top\",\"index\":18},{\"label\":\"Epilogue: Postscript\",\"href\":\"Text/section-0017.html#auto_bookmark_toc_top\",\"index\":19}],\"volumeTitle\":\"Light Novel Volume 1\",\"detailsLink\":\"/select/year-1/v1\",\"returnLink\":\"/select\",\"currentSpineIndex\":14,\"nextVolumeLink\":\"/select/year-1/v2\",\"nextVolumeTitle\":\"Light Novel Volume 2\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum- -agua/icon.svg?icon.ae5abf30.svg\",\"sizes\":\"any\",\"type\":\"image/svg+xml\"}],[\"$\",\"$L14\",\"17\",{}]]\n"])</script></body></html>
