[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T90b5,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 5:\u003cbr/\u003eFriends\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003e“K\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eikyou-chan, do you want to stop by a café on our way back today?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure, let’s go! Oh, but wait just a minute, okay? I want to invite one more person.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida headed toward Horikita, who was putting her textbook into her bag. “Horikita-san, would you like to come with us to a café today?” She asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not interested.” Horikita threw Kushida’s invitation back in her face, with no room for ambiguity. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eCouldn’t you just lie and say you were planning to go shopping, or that you were waiting for a friend?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Despite the harsh rejection, Kushida kept smiling.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis wasn’t a particularly unusual scene. Ever since the entrance ceremony, Kushida had regularly tried to invite Horikita to do fun things with her. I thought it would be nice for Horikita to accept an invitation at least once in a while, but perhaps that was just a bystander’s selfish interpretation. No one had ever met with anything but rejection when they’d tried to invite Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Well then, I’ll try inviting you again another time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, Kushida-san.” Surprisingly, Horikita called out to Kushida. Had she finally given in? “Don’t invite me again. It’s a bother,” said Horikita coldly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Kushida didn’t appear saddened. Instead, she smiled as she answered, “I’ll invite you again.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida then ran back to join her friends, and they left the hall.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kikyou-chan, just stop inviting Horikita-san. I hate her—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust before the door closed, I faintly heard one of the other girl’s words. Horikita, who was right next to me, must have heard as well, but she gave no indication that she cared.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You won’t try to invite me places, will you?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nope. I understand your personality well enough. It’s pointless to even try.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m relieved to hear that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter Horikita finished getting ready, she walked out of the classroom by herself. I absentmindedly stuck around for a little while, but soon grew bored and got up. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eTime to go home\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, I thought.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun, do you have a moment?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata, who was still hanging around, called out to me when I passed by. Unbothered, I responded to him softly. It was unusual for Hirata to notice me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s about Horikita-san, actually. I was wondering if something was wrong. Some of the girls were talking about it earlier. Horikita always seems to be alone.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMaybe it wasn’t Kushida especially. Perhaps Horikita was just the kind of person who strongly disliked company.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Could you possibly tell her to try to get along with people a little?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s up to the individual, isn’t it? Besides, Horikita isn’t really making trouble for anyone else,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re right, of course. However, many people have voiced their concerns about it. I absolutely do not want any bullying in our class.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBullying? Such talk seemed premature, but perhaps there were signs of it. Was he warning me, then? Hirata looked at me with the purest of intentions.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I think it’d be better for you to tell her directly rather than talk to me, Hirata,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You have a point. Sorry for bringing it up.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita was always alone, day after day. If this continued, within a month she’d be like a tumor in our class. However, this was Horikita’s personal problem and something I probably shouldn’t involve myself with.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e5.1\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003efter leaving class, I went straight toward the dormitory. Kushida, who was supposed to have left with a friend earlier, appeared to be waiting for someone while leaning up against the wall. Noticing me, she smiled like always.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m so glad! I was waiting for you, Ayanokouji-kun. There’s something I wanted to talk to you about. Do you have a minute?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, sure…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe couldn’t be confessing her feelings for me, could she? Nah, there was about a 1 percent chance of something like that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll just ask you outright. Ayanokouji-kun, have you seen Horikita-san smile even once?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? No, not that I can remember.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, Kushida had come to talk about Horikita again. Thinking back, I didn’t recall ever seeing Horikita smile once. Kushida took my hand in hers, closing the distance between us. Did she smell of flowers? I breathed in an extremely pleasant scent.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know, I…I want to become friends with Horikita-san,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think she guesses your feelings. At first, a lot of people tried reaching out to her, but now you’re the only one.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You seem to know Horikita-san pretty well, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not like I’m watching her or anything, it’s just that you tend to learn a lot about the person who sits next to you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eGirls were girls, after all, and they’d been really eager to form groups since the first day of school. They were also more aware of cliques and social circles than guys, and in this class of about twenty people, four held the most influence. You could claim they put up a façade, that they weren’t genuinely being themselves.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Kushida was the exception. She definitely held favor within each group, but more than that, she was tremendously popular with everyone. She was persistently warm and gentle toward Horikita, as part of her continued efforts to become her friend. That wasn’t something an ordinary student could do. That was probably why everyone adored her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePlus, she was really cute.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCuteness makes everything better.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Didn’t Horikita already warn you not to try again? I don’t know what you can say to her next time,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI knew that Horikita wasn’t the type to mince words. If approached, she would probably respond harshly. To be honest, I didn’t want to see Kushida hurt.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Won’t you…help me?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t answer right away. Normally, I would immediately agree to such a cute girl’s demands. However, since I was the type to avoid trouble, I couldn’t answer her. I didn’t want to see Horikita hurt Kushida by saying something merciless. I thought I’d turn her down to avoid any later heartbreak.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand how you feel, Kushida, but…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So that means…you can’t?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCute + Pleading + Upturned Eyes = Lethal.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I guess I don’t have a choice. Just this once, okay?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really?! Oh, thank you, Ayanokouji-kun!” she cried. Kushida’s face lit up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was cute. Even though I’d agreed to help her, I was still the kind of person who preferred to remain in the background. I shouldn’t do anything reckless.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what exactly are we going to do? Even if you say you want to be friends with her, it’s not that simple.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePersonally, I wasn’t equipped to know how to make friends.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re probably right… Well, first I think we should try to make Horikita-san smile,” Kushida said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Make her smile, huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSmiling means letting your guard down in front of another person, even if just a little. Such a relationship could most likely be referred to as friendship. Kushida seemed to understand people well, especially when it came to making them smile.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you have an idea how?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I thought \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e could help me think of something, Ayanokouji-kun.” She giggled sheepishly and lightly smacked her own head. If she were an ugly girl, I would have been totally turned off, but Kushida made it charming. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Smile, huh?” So, because Kushida had asked, I was going to help her make Horikita smile. Was such a thing possible? I wondered. I doubted it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, anyway, after class, I’m going to try inviting Horikita out again. If we wind up back at the dorms, though, I’ll have no idea what to do. Is there any place that she wants to go to?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah. Well then, how about Palate? I’ve gone to Palate often, and Horikita might have overheard us talking about it before.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePalate was one of the most popular cafés on campus. I had heard about Kushida and the other girls going there often after class. And if I’d heard about it, then Horikita must have also been aware.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How about if you two went to Palate and ordered, and then ‘bumped’ into me by chance? Would that work?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Probably not. I think that might be expecting a little too much. What if your friends helped out, Kushida?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe instant Horikita noticed Kushida’s presence, she would probably get up and leave. I thought it’d be better to create a situation that would make leaving difficult. I told Kushida my idea.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ooh! That certainly sounds like it would work! You’re so smart, Ayanokouji-kun!” she cried. Kushida nodded in agreement while she hung on my every word, eyes sparkling.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, no, I don’t think my plan has anything to do with being smart. Anyway, that’s what I was going for.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand. I’m excited for the result!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eNo, don’t expect too much. That’ll be trouble.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you try inviting her, Kushida, she’ll probably refuse you outright. So, how about I invite Horikita?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay. I think that Horikita-san trusts you, Ayanokouji-kun,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why do you think that? What proof do you have?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I guess it just looks that way to me. She seems to trust you more than anyone else in the class, at the very least.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eThat doesn’t mean I’m best suited for this task, though.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s only because I was able to talk to her, but that was a coincidence.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d just happened to be seated next to her on the bus. If that hadn’t happened, then I probably wouldn’t have talked to her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But don’t you meet almost \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eevery\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e person for the first time by chance? And then they can become your friend, or your best friend…or even your boyfriend or girlfriend, or your family.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s true.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed that was one way to look at it. Coincidence had allowed me to talk with Kushida like this. Therefore, it was possible that Kushida and I might eventually become lovers.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e5.2\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eC\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003elasses had ended.\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe other students left for their various after-school activities, talking to one another about where they would go. Meanwhile, Kushida and I exchanged looks, signaling each other to go ahead with the plan.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Horikita. Do you have some free time after class today?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t have any time to waste. I have to go back to the dormitory and prepare for tomorrow.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePrepare for tomorrow? I was pretty sure all she did was study.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wanted you to go somewhere with me for a little bit.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you after?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you think that by inviting you out, I’m after something?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, when you invite me so suddenly, I naturally have my doubts. However, if there is a specific matter that you wish to discuss, I wouldn’t mind listening.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t have anything to talk about, of course.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, you know that café on campus? The one with a ton of girls? I don’t have the guts to go there all by myself. I kind of get the feeling that guys are banned from entering there or something. Don’t you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I certainly can’t argue that most of their customers seem to be women, but aren’t men also allowed to patronize the café?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah, but no guy goes there alone. Only if they’re with friends who are girls, or if they’re someone’s boyfriend.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita tried to recall what Palate was like, seemingly lost in thought for a moment. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You may very well be right. It’s unusual for you to express such a well-reasoned opinion, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But I’m still interested in it. So I wanted to invite you to come along with me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose that’s natural, since you supposedly have…no one else to invite, correct?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That makes it sound like I’m imposing on you, but yeah. Basically.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And if I refuse?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that would be that. I’d have no choice but to accept. I can’t force you to give up your private time, after all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand. Your issue with the café is certainly accurate. I can’t stay there for too long, though. Is that all right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure. We’ll be quick.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn my mind, I added the word “probably” to that last thought. If she knew that Kushida was involved in this, Horikita would probably have some strong words for me. I’d begun to think that, since I was able to talk to Kushida, I might be able to make friends with Horikita myself. Besides, whether it was a café or a lecture hall, Horikita always came with me, even as she complained about it. For someone like me, who had difficulty making friends, this was probably a miracle.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe two of us left the classroom and made our way to Palate on the first floor. Girls began to congregate there, one after another, enjoying their time after class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are so many people here,” Horikita said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is this your first time doing anything social, Horikita? Oh, yeah, I suppose it would be. You’re always alone.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Was that supposed to be sarcastic? How childish.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d meant to engage in some playful ribbing, but apparently that was impossible for Horikita. After we placed our order, we both got our drinks. I ordered the single serving of pancakes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you like sweets?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just wanted to have pancakes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t particularly like or dislike cakes and stuff, but I needed a believable reason. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There aren’t any open seats, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess we’ll just have to wait a bit. Oh, never mind. There are some open seats over there.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI noticed that two girls quickly got up from their table, and I hurriedly went to secure our spot. Horikita passed around the table. I set my bag down on the floor, took my seat, and looked about casually.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, I just thought of something. If the people around here see us like this, they’ll probably think we’re a couple…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita remained expressionless, or rather, cold. Being in such crowded surroundings was making me anxious. As I considered what was about to happen, my stomach started to hurt.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI thought I heard the two girls sitting next to me say, “Let’s go,” before grabbing their drinks and leaving. Another patron sat down immediately. It was Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, Horikita-san. What a coincidence! And Ayanokouji-kun too!” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida had given us a simple greeting, maintaining the ruse that this was a coincidence. Horikita regarded Kushida with narrowed eyes, then slowly turned her gaze toward me. Of course, this was something that Kushida and I had planned out in advance. Kushida’s friends had already secured four seats for us ahead of time. When I arrived at Palate, I sent them a signal so that they could make two seats available. After some time, the other girls next to me left, giving Kushida a chance to come and sit down. As a result, our meeting looked like it’d come about via coincidence.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you come here together, Ayanokouji-kun? Horikita-san?” Kushida asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, we just happened to. Did you come by yourself?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. Today, I—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m leaving,” Horikita said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-hey, we just got here, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t need me now that Kushida-san is here, though. Right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hold on, that’s not a problem. Kushida and I are just classmates.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You and I are just classmates, too. Besides…” She gave Kushida and me an icy look. “I don’t like this. What are you plotting?” She’d seen through our plan and was trying to get me to admit it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“N-no, it was just a coincidence,” Kushida said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida shouldn’t have said such a thing. Asking, “What do you mean?” and acting ignorant of Horikita’s prodding would’ve been the better response.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When we sat down earlier, I saw the two girls seated here were from Class D, along with the two girls seated next to us as well. Was that just a coincidence, too?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, wow, really? I didn’t notice at all,” Kushida said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Also, we came straight here after classes ended. No matter how much those girls rushed, they could only have been here for about one to two minutes at the most. It was far too early for them to get up and leave. Am I wrong?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita was even more incredibly observant than I’d thought. Not only did she remember our classmates’ faces, but she’d quickly grasped the situation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um, well…” A bewildered Kushida signaled for me to save her somehow. Horikita noticed. Any further deception on our part would just make it worse.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, Horikita. We planned this.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought as much. I thought this whole thing was a little suspicious right from the start.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita-san. Please be my friend!” Kushida just came out and asked her directly, no longer trying to hide anything.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve already said this many times. I want you to leave me alone. I have no intention of becoming friends with anyone in class. Can you not understand that?” Horikita said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Always being alone is a very sad way to spend your life. I just want to get along with everyone in class.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wouldn’t deny you your wish, but it’s wrong to try forcing people into something against their will. Being alone doesn’t make me sad.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-but…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides, do you think that I would be happy if you forced me to become your friend? Do you think that feelings of trust would arise out of something forced?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita wasn’t wrong. It wasn’t that she couldn’t make friends, but that she considered them unnecessary. Kushida wanted something, but Horikita would not reciprocate.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s my fault for not being clear enough with you, so I don’t blame you this time. But if you try this again, please keep in mind that I will not forgive you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs she said that, Horikita took her untouched latte and stood up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita-san, whatever you say, I really want to be friends with you. When I saw you, I felt like it wasn’t the first time we’d met. I wondered if you felt the same way,” Kushida mumbled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is a waste of time. I find everything you’re saying unpleasant.” Horikita raised her voice, cutting Kushida off without mercy. Even though I’d told Kushida I would help her, I had absolutely no intention of butting in. But…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I kind of understand your thoughts on the matter, Horikita. I’ve actually often wondered if friends are really necessary,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eYou’re \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003esaying that? You’ve been trying to make friends since day one.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I won’t deny it. However, you and I are similar. I wasn’t able to make friends until I came to this school. In junior high, I never knew anyone’s contact information or hung out with anyone after class. I was always alone.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida was visibly surprised when she heard me say that, like she couldn’t believe it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think that partly explains why I was compelled to talk to you,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s the first time I’ve heard something like that. However, even if you and I share some things in common, I think we took different paths to reach this point. You wanted friends but couldn’t get them. I considered friends unnecessary, so I didn’t make any. Saying we are similar would be incorrect. Am I wrong?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. But telling Kushida that she was being unpleasant is going too far. Are you really okay with this? If you choose not to get along with anyone else, you’ll be alone for the next three years. That sounds pretty painful.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It will be my ninth year in a row of being alone, so I’ll be fine. Oh, and if you include kindergarten, it would actually be slightly longer.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHad she just nonchalantly dropped a bombshell? That she’d always been alone for as long as she could remember?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can I go now?” Horikita asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe sighed deeply and looked straight into Kushida’s eyes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kushida-san, if you don’t try to force me into anything, I won’t be rude. I promise. You’re not stupid, so you understand what I’m telling you, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith one final simple “\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWell then\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e,” Horikita left. Kushida and I remained in the noisy cafe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that was a failure. I tried to lend a helping land, but it was pointless. I guess she’s gotten too accustomed to being alone,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida wordlessly collapsed into her seat. However, she instantly recovered, and her usual smile returned.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s okay. Thank you, Ayanokouji-kun. It’s true that I wasn’t able to become her friend, but…I was able to learn something important. That’s enough for me. I’m sorry, though. I feel like Horikita-san might hate you now because you helped me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry about it. I just wanted Horikita to consider the benefits of friendship.” Thinking it’d be inconsiderate for the two us to hold up table space for four people, I moved to sit next to Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even so, I was shocked when you said that you didn’t have any friends, Ayanokouji-kun. Is that true? I didn’t think you were like that at all. Why were you all alone?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm? Oh, yeah, it’s true. Sudou and Ike are the first friends I’ve ever made. I still don’t really know if that’s my fault or the fault of the circumstances I was in.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But when you made friends, did it make you happy? Is it fun?” Kushida asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. There are times when I find it annoying, but sometimes I feel like I’m happier than I was before.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida’s eyes sparkled as she smiled at me, nodding her head in agreement.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita has her own way of thinking. There’s probably nothing that we can do about that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you really think so? Is it not possible to make friends with her?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why are you desperate to be her friend? Kushida, don’t you already have more friends than everyone else? There’s no reason to focus on Horikita.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if it meant that she wouldn’t be friends with everyone in class, she didn’t need to try so desperately.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wanted to be friends with everyone. Not just the people in Class D, but the students from other classes, too. But if I can’t become friends with one girl in my class, then that means I’ll never achieve my goal…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Think of Horikita as a special case. You'll just have to wait for some special circumstances to come around.\"\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNot something forced, but a natural event that would connect the two of them. When that time came, they might possibly become friends.\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 5: Friends\",\"volumeId\":\"v1\",\"chapterIndex\":11,\"prevChapter\":{\"volumeId\":\"v1\",\"chapter\":10,\"title\":\"Chapter 4: Ladies and Gentlemen, Thank You for Waiting\"},\"nextChapter\":{\"volumeId\":\"v1\",\"chapter\":12,\"title\":\"Chapter 6: The End of Everyday Life\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Title Page\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Credits and Copyright\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue :  The Structure of Japanese Society\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: Welcome to the School Life of Your Dreams\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: The Students of D Class\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: Ladies and Gentlemen, Thank You for Waiting\",\"href\":\"Text/section-0008.html#auto_bookmark_toc_top\",\"index\":10},{\"label\":\"Chapter 5: Friends\",\"href\":\"Text/section-0009.html#auto_bookmark_toc_top\",\"index\":11},{\"label\":\"Chapter 6: The End of Everyday Life\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_top\",\"index\":12},{\"label\":\"Chapter 7: Classroom of the Elite\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_top\",\"index\":13},{\"label\":\"Chapter 8: The Association of Failures\",\"href\":\"Text/section-0012.html#auto_bookmark_toc_top\",\"index\":14},{\"label\":\"Chapter 9: The Failures Mobilize Once Again\",\"href\":\"Text/section-0013.html#auto_bookmark_toc_top\",\"index\":15},{\"label\":\"Chapter 10: Midterm Exam\",\"href\":\"Text/section-0014.html#auto_bookmark_toc_top\",\"index\":16},{\"label\":\"Chapter 11: The Beginning\",\"href\":\"Text/section-0015.html#auto_bookmark_toc_top\",\"index\":17},{\"label\":\"Chapter 12: Victory Celebration\",\"href\":\"Text/section-0016.html#auto_bookmark_toc_top\",\"index\":18},{\"label\":\"Epilogue: Postscript\",\"href\":\"Text/section-0017.html#auto_bookmark_toc_top\",\"index\":19}],\"volumeTitle\":\"Light Novel Volume 1\",\"detailsLink\":\"/select/year-1/v1\",\"returnLink\":\"/select\",\"currentSpineIndex\":11,\"nextVolumeLink\":\"/select/year-1/v2\",\"nextVolumeTitle\":\"Light Novel Volume 2\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://classroom-of-the-elite-reader.vercel.app\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"COTE Reader\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"en_US\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:image:w
