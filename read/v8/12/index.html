\" font-size: 1.00em;\"\u003e“Ah ha ha ha! Come on, I was joking. Couldn’t you tell?” she asked, laughing almost to the point of tears, lightly smacking me on the shoulder.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So if Nagumo’s ever defeated, that would be trouble, huh?” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust in case she still thought I was joking, I decided to strengthen my tone. If Asahina was the type of person who would pull back and report to Nagumo now, then this was the end of the line. Even if she reported back to him, it’d end with her thinking that I was just some uppity first-year.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, are you serious?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So you were joking, senpai?” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, look. This isn’t something a first-year can do anything about,” she replied, apologizing for joking around. But I continued speaking in the same tone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Among all the second-years I’ve met until now, you seem to be the most straightforward one, Asahina-senpai.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The most straightforward?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s hard to get any information from the second-years, outside of ‘Nagumo Miyabi rules us all.’”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s some dangerous talk. I’m a second-year too, you know. Miyabi and I have a pretty deep relationship, understand?” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not about being shallow or deep. What matters is how much you’ve been influenced by him.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince they were in the same class, they couldn’t be enemies, not truly. No matter what Asahina privately thought of Nagumo, she wouldn’t want her class to suffer for it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think those are similar things, though,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, think of this as nonsense from a first-year.” I bowed. “Please excuse me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, wait. Somehow, I feel like I’m the bad guy here,” she replied, releasing a deep sigh. Her smile disappeared. “I see you’re not joking around. As an apology, please let me repay you for picking up my charm. If there’s anything you’d like to know, I’ll tell you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you sure? It might be seen as rebelling against Nagumo-senpai, you know.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To be honest, I don’t think anything drastic will happen just because I talk to you,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe seemed to be certain that telling me something about what was going on with the second-years wouldn’t have a major impact. In other words, anything she told me would be information that didn’t matter, even if it was leaked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Out of the girls in your grade level, how many would you say are especially close with Nagumo-senpai?” I\u0026#160;asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Girls who are close with him? Like, all of them. They trust Miyabi more than other guys, y’know.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI already knew he was no ordinary opponent, but this was an extraordinarily broad range of skills.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What about the people who act as Nagumo-senpai’s eyes and ears?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You really think I’d tell you that?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, as a senpai, it’s okay to help a first-year out a bit,\u0026#160;right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, you’re cheeky,” she replied, laughing. She didn’t seem upset, though. “Well, if I do say so myself, the second-years have a really strong sense of unity. Honestly, we were more successful at dividing into groups than the first- and the third-years, you know? After they explained the test to us back on the bus, Miyabi said to immediately share that information with the other classes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I’d suspected—though they’d started out as enemies, the four second-year classes seemed on the way to becoming actual allies. Asahina told me the names of the four class representatives. The four classes kept in contact with one another and had even discussed the formation of their small groups with each other, to a certain degree. Apparently things had gone similarly for the girls.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What about when you met up with the first- and third-year groups? Did you decide things randomly then\u0026#160;too?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo had proposed a draft selection system, which the first-year guys had carried out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For the most part, yeah.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For the most part. So something was different?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAsahina crossed her arms, appearing deep in thought.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why do you ask?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could tell Asahina was starting to have doubts. The silence lingered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you not going to tell me?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I will. It’s just…when we were deciding on the large groups, some of the second-year girls made a small request. Or more like…they wanted some adjustments. At that time, the small group was made up of members that Miyabi could count on.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf the group formed based on Nagumo’s orders, then he’d likely given them a special role. You wouldn’t think that unless you knew what was going on within the second-years. From an outsider’s perspective, it would simply look like friends coming together.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are there any first- or third-years who were selected to join that girls’ large group that stand out in particular?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if you ask me that, I hardly know anything about the first-years. From the third-years, I guess there’s Tachibana-senpai, who was Horikita-senpai’s secretary. Ah, but their representative is a different person, though. Miyabi said nothing weird would happen. He said he was going to do this fair and square.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You have a lot of faith in Nagumo-senpai, huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita’s brother also seemed to place a certain degree of trust in what Nagumo said. If I were to believe him and Asahina, then this line of reasoning might be considered a feint. Nagumo had promised to fight fair and square, but at the same time, he was making us jump at shadows. We feared he might be up to something behind the scenes, and he was using that to break our concentration.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He always sticks to his word. He won’t use dirty tricks. Besides, even if that group of girls does try to lay some kind of trap, it won’t have any effect on Horikita-senpai and Miyabi’s fight.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. It would be completely irrelevant.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAsahina was spot-on. Nagumo had proposed that only his group and Horikita’s brother’s group compete. The girls had nothing to do with it. Even if some of the second-year girls who were close with Nagumo happened to be in Tachibana’s large group, it was irrelevant. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo was he making it look like he had something underhanded going on, while actually fighting above the board? That would mean the seemingly meaningful words he’d uttered when he met up with the third-year student from his group, Ishikura-senpai, were just a fake-out too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed that if you were investigating him normally, you’d get the sense that these clues were popping up and then disappearing all over the place. An interesting way of doing things. This was different from Sakayanagi and Ryuuen: a unique strategy.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What I can tell you, I suppose, is that whoever cares too much is the one who loses.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You were a big help,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was grateful to Asahina for humoring my unreasonable request to discuss her class’s internal affairs. Of course, she’d probably done so because she didn’t think I could be an obstacle for Miyabi. She couldn’t even imagine me being his opponent.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, do your best to try and give Miyabi a run for his money, boy,” Asahina. “I’ll be rooting for you, even if it’s only a little bit.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, just one more thing…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I combined what I’d just learned with the information I got from Kei, my understanding of the situation was becoming much clearer. I decided to push a little harder.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e6.6\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eO\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eN THE NIGHT\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e of the sixth day, a sour mood hung over the entire group. If we let the day end like this, the group might fall apart entirely tomorrow. These rancor between us would just continue to intensify, making it all the harder to secure a high score on the test that was now just two days away. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eReturning to the room after my bath, I found the atmosphere tense as ever. Ishizaki had walled himself off and was now refusing to speak to anyone else. Keisei, blaming himself, had fallen silent and retreated inward too. The Class B students kept trying to chat in an attempt to liven things up, but the awkward atmosphere was too much for them to bear, and they eventually went silent.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEventually, after confirming that it was getting close to lights-out time, Yahiko flipped the switch and sent the room into darkness, seeking to bring this day to a merciful end.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Ishizaki. You got a minute?” Hashimoto broke the long silence as we sat in the pitch darkness.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No,” replied Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJudging from the sound of rustling sheets that followed, he’d probably turned his back to Hashimoto, refusing to engage. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At this rate, our group will be in extreme danger. We have the advantage of our team not being too big, but that also disadvantages us when it comes to the exam itself. In the worst-case scenario, Yukimura and someone else will be expelled,” said Hashimoto.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eYou’re going to be the one who goes down with him when that happens, Ishizaki. You know that?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e was the unsaid implication.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shut it. Even if I get expelled, whatever. I don’t care. Shit happens.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dude, come on…” Hashimoto sighed deeply, as if giving up, at this refusal of his helping hand.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t see Hashimoto’s face in the darkness. Had we passed the point of no return when it came to our group’s unity? Maybe it was time we gave up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I played soccer in elementary school and junior high. Our school was pretty prestigious, so our team competed in national championships each year. I wasn’t an ace player or anything, but I played in most games and did pretty well,” said Hashimoto. He didn’t direct the words to any one person in particular but addressed the room as a whole.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, you’re not part of the soccer team now though, are you? It doesn’t look like you got injured or anything,” Yahiko pointed out, his voice cutting through the dark.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I’m not. I know it’s not really popular these days, but I used to smoke.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So they found you out and kicked you out of soccer?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. I hid my smoking habit well. Only my family\u0026#160;knew.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if smoking is disgusting, it’s not a reason to quit soccer.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYahiko’s doubts were justified. If no one had known, then it couldn’t have been an issue.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess I just felt this sense of alienation or something. Everyone else would be working together to win the national championships, and part of me would just kind of observe them coldly. I knew I didn’t belong. Also, I didn’t really like soccer all that much. I decided to quit playing and just focus on my studies. I was pretty smart to begin with, so it wasn’t that hard to keep getting good grades.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What, now you’re bragging? I ain’t listenin’ to this,” interjected Ishizaki nastily.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For better or worse, my only saving grace was that I could do reasonably well out in the world, I suppose. But there are still times when I feel regret. Whenever I see Hirata and Shibata practicing out on the field, I think it could have been me out there. Even though I didn’t even like it that much. Strange, huh?” said Hashimoto. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe chuckled self-deprecatingly to himself. “What about you? What was your childhood like, Ishizaki?” asked Hashimoto.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Why you askin’?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No reason.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmph. Well, I ain’t got anything to say.” Ishizaki refused, to no one’s shock. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKeisei opened his mouth, the next to join our conversation in the darkness.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ever since I was little, all I ever did was study. Maybe I was influenced by my older sister. She was a lot older than me, and she wanted to be a teacher, which meant I always had to play the role of the student. My sister was pretty ridiculous. She was always giving me these stupidly difficult problems to solve, even when I was in elementary school.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So that’s why you’re so good at studying, huh?” replied Hashimoto, responding as though he were trying to draw out the conversation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. And on top of that, I’m terrible at sports. No matter what I did, I generally came in near last place, just barely squeaking by. I decided to just focus on developing my strengths rather than conquering my weaknesses. I\u0026#160;used to think there was no point in training your body if you weren’t planning to become a professional athlete. Enrolling in this school made me begin to doubt that for the first time…but I still believed that I could study hard and be considered an appropriate pick for Class A,” said\u0026#160;Keisei. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe stopped speaking for a moment, as if he were remembering that time. Being put in Class D must have caused him immense despair.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But then all these things I couldn’t accept just kept happening. I don’t agree with the solidarity system, and living on the deserted island made even less sense to me… In my own class, Sudou was like the polar opposite of me. He was great at sports, but he couldn’t study. At first, I thought I’d been saddled with some ridiculous baggage. But on the uninhabited island and during the Sports Festival, Sudou’s skills were far more useful than mine. I\u0026#160;could see him shine, right beside me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was a hint of regret in his voice.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s still a part of me that can’t accept it, to be honest. But I’m slowly beginning to realize that if all you can do is study, or all you can do is sports, then that’s no good. That’s the thing about this exam. If you can’t do \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eboth\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e of those things, then you can’t score high. Am I wrong? Ishizaki?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seriously, are you askin’ me—?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I feel completely humiliated. Just like back on the uninhabited island and during the Sports Festival. I’m dragging the group down. I hurt myself, which has meant being a burden on others, and more importantly, I dragged down the group’s morale. I have absolutely nothing to show Ishizaki, who, despite his complaints, has been contributing to the group just as much if not more than the average.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki seemed about to mock him, but then he swallowed his swords. I couldn’t see his face. But it was precisely because we were in the darkness, unable to see each other, that we could be this vulnerable.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry, Ishizaki… I’m sorry that your representative, who should be setting an example for the rest of you, is in this condition.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could tell Keisei was trying to hold back tears. None of us were insensitive enough to cut in and say something. These were bitter tears.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Stop screwing around. Why are you apologizing? I mean, I’m the one who blamed you,” said Ishizaki. He let loose a chuckle, seemingly aimed at himself, before continuing on. “I mean, you were the one who agreed to be representative when no one else was willin’.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if we’d tried to push the role on Keisei, he could have refused it. As a matter of fact, Ishizaki had done so himself. He probably realized the good faith gesture Keisei had made by accepting the role now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It pissed me off, gettin’ ordered around by you. But if you didn’t give those orders, our group probably would’ve been way worse off. For makin’ breakfast, and for the marathon.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No doubts there,” said Hashimoto, laughing. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSome students do well in academics, and some don’t. Some excel in sports, and some struggle. When all these different students, with their own interests and backgrounds, come together to form a single class or group, they bring their problems with them. All the friendships and rivalries and everything of the sort. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYahiko and the other students started chatting themselves, speaking up little by little. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was the first night we started to feel like a real group.\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 6: Ubiquitous Things\",\"volumeId\":\"v8\",\"chapterIndex\":12,\"prevChapter\":{\"volumeId\":\"v8\",\"chapter\":11,\"title\":\"Chapter 5: The First Half of the Girls’ Battle: Ichinose Honami\"},\"nextChapter\":{\"volumeId\":\"v8\",\"chapter\":13,\"title\":\"Chapter 7: What Is Lost, What Isn’t\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\
