[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T15b18,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 6:\u003cbr/\u003eUbiquitous Things\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eS\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eUNDAY CAME AND WENT\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e in a flash, and it was now Monday, the fifth day of the test. All four hours of our morning lessons were devoted to exercise. We had to walk or run an eighteen-kilometer course that was going to be used for the long-distance relay race, and then be back for our afternoon lessons. Since it was a relay race, each person would only be running a kilometer or two. But we were in the mountains, and the way could be rocky and steep.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe walked for about five kilometers, exhausting our stamina. The other day, we’d only worked up a light sweat. The difference between then and now was incredible.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seriously, how much higher does this slope go?! This is friggin’ nuts, dude. This is way too hard,” spat Ishizaki as we passed a sign telling us to be wary of wild boars. He turned back toward me, with a look in his eye that suggested he’d spied something unpleasant. “Speaking of wild boars, are the ones here pretty big? Like this guy?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Truly amazing. I underestimated you, Ayanokouji.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto and a bunch of other guys started complimenting me, which just made me extremely uncomfortable. Knowing they were going to use this joke to mess with me for a while was profoundly awkward. Albert even went so far to applaud. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut soon, they were out of time to tease me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though the road that led to the summit was paved to allow vehicles, the incline was extremely steep. Simply walking up it was going to strain our legs. On top of that, since we’d been getting up early to make breakfast, we were more tired than the upperclassmen. We only got a break on Sunday because the school showed some mercy.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How long is it gonna take for us to get back?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The average person’s walking speed is four kilometers per hour. It’s a distance of eighteen kilometers. If we walk the entire time, it’ll take four and a half hours.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve gotta be screwing with me. We ain’t gonna have any time left to eat lunch!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then we have to run, Ishizaki. The more we run, the sooner it’ll be over,” said Class B’s Moriyama, rather bitterly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough our whole large group had started out together, most of the second-year and third-year students were moving faster than us. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t talk crazy. No way in hell I can run eighteen kilometers.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t tire yourself out by talking for no reason. We’re all here because you agreed with my strategy, right?” warned Keisei, panting heavily as he spoke.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStudents with decent stamina could have started to sprint right away, but doing that continuously for eighteen kilometers certainly wasn’t the best idea. Keisei’s strategy was that we would walk for the first nine kilometers until we reached the turnaround point and run from there. We’d mostly be going downhill by then, something that Keisei had factored into his proposal.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We ain’t even started runnin’ yet. Like hell we’ll be able to hold out until the turnaround point.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shut up… Just be quiet and walk.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKeisei wasn’t very good with physical exertion. His legs must have been hurting him already, because his composure was starting to fray. With thirteen kilometers or so to go, we might not be able to make it back within the stipulated time. It was only natural to want to keep talking to a minimum and focus on walking. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat said, this exercise had made me begin to understand who the runners were. Yahiko and Keisei were definitely not suited to this task. Kouenji, who was lagging behind us, could probably be an asset to the group. But I doubted he’d take it seriously enough to run.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Be quiet and walk, huh? You’re actin’ all high and mighty for someone who looks like a zombie, Yukimura.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki kept at it. It didn’t seem like there’d be any cutting back on the chatter.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m saying this for the sake of the group, as the representative. Please don’t talk.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, as the representative? Screw you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMaybe because of all the stress he was under, Ishizaki just kept verbally assaulting Keisei. Moriyama and Tokitou from Class B couldn’t let that slide.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Enough, Ishizaki. Yukimura’s right.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSensing someone behind me was getting further away, I turned to find that Kouenji had veered off the byroad and gone into the forest. No one else had noticed. They were solely focused on looking ahead. Ishizaki wasn’t our only problem child. I couldn’t see Kouenji anymore and there wasn’t any sign that he was coming back; this probably wasn’t a minor detour.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it is what it is…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI considered quietly chasing after Kouenji, but everyone might think I’d ditched too. So I spoke up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kouenji went off on some other path back there. I’ll go call him back.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? What in the hell is that weirdo doin’?!” With no students around who seemed capable of stopping him, Ishizaki’s voice seemed to just get louder and louder. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t let him distract you, Ishizaki. If you don’t ignore Kouenji, you’ll only be hurting yourself.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKeisei’s strategy was to treat Kouenji as if he were invisible. A sound strategy, but ignoring him completely was easier said than done. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, Kiyotaka. Can I leave this to you?” asked Keisei apologetically.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could tell Keisei didn’t have the energy to go back and look for Kouenji. I told him I’d do it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, this is Kouenji we’re talking about. Won’t he be kind of a handful? Want me to help?” offered Hashimoto. However, I politely declined his offer.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No matter who goes, we might not be able to bring him back. Getting as many people as possible to finish the run would look better to the school. I don’t see how I could get lost on this route, anyway.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re probably right. Come back the moment you think it’s a lost cause, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI nodded my assent and went in pursuit of Kouenji. I hadn’t planned on actively making a move, but I wasn’t often in a position to speak privately with Kouenji. If I was going to talk to him, this was probably my only chance.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e6.1\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE NARROW PATH\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e was just a dirt road. Despite the poor terrain, I picked up my pace. If Kouenji was on foot, I calculated I could catch up to him in a minute or two. However, he must have gone faster, because there was no sign of him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What a pain in the neck…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eGoing faster was one thing, but running down a dirt road was troublesome. I increased my pace, looking for any tracks Kouenji might have left behind on foot. After a hundred or so meters, I finally spotted him up ahead.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I looked at his back, I remembered a similar situation back on the island, when Airi had been there. Kouenji had left us in the dust back then too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kouenji,” I called, closing the distance between us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, ho, if it isn’t Ayanokouji Boy. This isn’t the correct route, is it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m here to keep you from potentially getting expelled via the solidarity rule. Why did you take this detour?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I caught a glimpse of a wild boar. I dare say I was interested. So I gave chase.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat certainly wasn’t what I’d expected to hear. I refrained from asking what he planned to do if he found it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Rest easy. I shall return in time. It shouldn’t take someone like me even thirty minutes,” he added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLooked like I had no choice but to trust him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Incidentally, do you have any other business with me?” asked Kouenji. He must have sensed something was up because I hadn’t walked away. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“About the exam. I want you to help the group.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m getting so tired of hearing people say that to me. I feel like my ears will start to bleed if I have to listen to those words just once more.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t doubt Keisei and the others had been trying to persuade him when I wasn’t around. And yet, Kouenji hadn’t budged a single inch.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t have to get an outstanding score. Just do what you’re supposed to.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You do not get to decide that. I do. You know that, don’t you? I will see you later,” said Kouenji, motioning that he was about to leave. But I grabbed his arm and stopped him. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe tried to take a step forward, leaving me no choice but to hold fast and dig in my heels. I expected him to resist, but for some reason Kouenji went slack.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh. I see. So that’s how it is then, Ayanokouji Boy,” said Kouenji, turning toward me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean? What’s how what is?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The person who tamed the Dragon Boy.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dragon…who?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m talking about that mischievous rascal, Ryuuen.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What does Ryuuen have to do with me?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re quite good at playing dumb. You don’t let your intentions slip through at all when you feign indifference.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I really don’t understand how you arrived at this conclusion.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because of your touch on my arm. I can tell by the heat being transmitted through your skin.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d already figured Kouenji wasn’t normal, but apparently he was even more of an eccentric than I was. He got all that from me grabbing his arm?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, but this is a huge misunderstanding,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really? Judging by the way Delinquent-kun looks at you and acts around you, and the reactions of all those around you, I would think it’s a certifiable fact.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji didn’t have a single shred of evidence, but he sounded overwhelmingly confident in his observations. It’d be pointless to attempt any further deception.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh. Relax. I have no intention of revealing what you’re keeping hidden. Even if you do happen to be exceptional in your own way, you’re still a small fry to me. One of many. So, whether I’m right or wrong, there should be no problem as long as I don’t spill the beans. Correct?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I do want to clear up this misunderstanding.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Too bad. That’s not going to happen, Ayanokouji Boy. Even if you have third parties vouch for you, assuring me that you had nothing to do with any of it, my mind is made up. I’m certain of what I know.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Well, can we get back to the matter at hand?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re talking about me doing my part as a member of the group, yes?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve said this repeatedly. I refuse.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe answered clearly and decisively.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I will act in accordance with my own wishes. That is my philosophy. Will I take the exam, or won’t I? What grade will I achieve? All of those things depend on how I feel in that moment.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had considered various means of persuasion, but haphazardly trying anything out here would probably backfire. I was going to have to leave things to chance, but there was a strong possibility that doing so would cause the least harm. It was clear as day that Kouenji wanted to avoid being punished with expulsion. I had no choice but to gamble on that. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was nothing I could do for now but watch Kouenji walk away, chasing the wild boar. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think there’s anyone in the world who can make that guy do anything.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt didn’t matter if it was Horikita’s brother, or Nagumo, or even his own classmates. Such was my honest impression of my classmate, whom I had known for about a year\u0026#160;now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e6.2\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eFTER LEAVING KOUENJI,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I returned to the course.  Even though I’d been gone for less than ten minutes, I was probably in last place now. I didn’t see any students from the group in front of or behind me, so I decided to rush a bit and catch up. A short while later, I sighted a group of first-year students—Keisei and the other guys. Tokitou noticed me first right away, and then everyone else looked over to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, for the record, I did find him, but…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No dice, huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto, who predicted that would happen, wore a bitter smile on his face. The other students didn’t blame me either and just groused about Kouenji’s absence. Somehow or other, we eventually made it to the turnaround point, happily badmouthing Kouenji as we went. Chabashira was waiting for us there, arms crossed. I hadn’t seen her in a few days, but it seemed she’d been tapped pretty regularly to help out with various lessons.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The second-years and third-years have turned back. You guys are all that’s left,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What time is it, sensei?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s almost eleven o’clock now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat meant we still had an hour to go until our lunch break. If this were a flat road, it wouldn’t be too hard to make it back in time. However, we had already trudged nine kilometers up an incredibly steep, winding slope. Our stamina had been depleted considerably. If we didn’t run at a solid pace, this exercise was going to take a bite out of our lunch break.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m going on ahead. I don’t want to be late for lunch.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait. We’ll be taking roll call before you head back down. Each person has to state their class and name.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA board was brought out, probably for the purposes of recorded students who’d made it to the turnaround point. Once Ishizaki signed, he turned on his heel and ran, leaving the group behind. Looked like it would be every man for himself, group be damned. Albert followed afterward.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s go, Kiyotaka.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You go on ahead. I’d like to wait and make sure Kouenji comes back.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s all well and good, but…we only have an hour left.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m fast enough. Don’t worry.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Short-distance running and long-distance running are two different things, you know. Well, I guess I’m not really one to talk,” said Keisei, letting out a self-derisive chuckle before running awkwardly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m going,” said Hashimoto.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yep.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto, the last member of our group, stretched and then ran off. Chabashira and I were the only two people left. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It doesn’t seem like you have anything you want to discuss with me,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m just waiting for Kouenji. If we don’t get the tail end moving, it’ll be trouble.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Trouble?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t really a big deal. If you had stamina to spare, like Ishizaki, who was quick to take the lead and clear the race, you’d never notice the students who gave up partway through. This wasn’t a timed trial. We just had to clear the course by the set time; whether we did that in one hour or four didn’t matter. Keisei didn’t have much stamina himself, but it was obvious he was pushing himself hard to keep from holding us back.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAbout twenty minutes later, Kouenji finally showed\u0026#160;up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This seems to be the turnaround.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe’d gotten around a bit, apparently. Traces of leaves and dirt were stuck to his jersey.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re the last one, Kouenji. You have forty minutes left.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That seems to be the case. I wish I’d taken my time\u0026#160;a bit more, but my encounter with the wild boar ended a\u0026#160;bit sooner than expected.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wild boar?” asked Chabashira.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe clearly had questions about that particularly strange and sudden part of what he’d just said, but Kouenji turned around and ran off.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Roll call, Kouenji. You’ll be disqualified otherwise,” said Chabashira. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My name is Kouenji Rokusuke. Remember it well, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eteacher\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e,” said Kouenji, without even turning around. His boisterous laughter echoed down the hill.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that okay, sensei? He didn’t state his class.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, he gave his name. Let’s cut him some slack.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right. I’ll be heading off myself.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wondered how much time had passed. Coming up on the sign warning us about wild boars again, I saw two male students’ backs. One of them was Keisei, about what I’d expected. Rather than having exhausted his stamina, though, he seemed to be leaning on another student, who was propping him up. It looked like his left leg was hurt. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe other student was Hashimoto, who, as I’d anticipated, had stayed back to help pull Keisei along. As I ran over to them, the situation became clear.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you get a sprain?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji? Yeah, looks that way. I’m guessing his ankle was at its limit by the turnaround point,” said Hashimoto, explaining on Keisei’s behalf.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt had to be tough to support another person’s weight, but he didn’t seem to mind. He walked slowly, close to Keisei, and didn’t seem displeased whatsoever.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh, I’m so pathetic. Why can’t I even do something like this?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKeisei seemed frustrated, but I could still tell he’d changed. The old Keisei had found it hard to comprehend physical sports or anything other than written exams; he’d thought a student’s life and work centered on academics. This Keisei had stretched before resuming the downward trek, and he’d gone last for the same reason I had.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll help too,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTwo would be better for this job than one. I went to the other side and supported Keisei. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait. If you do this, you’ll both be late for lunch,” said Keisei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we just abandon you, you’ll start running, won’t you? You’d hurt your leg even more. That would spell trouble for all of us when the final test comes around. If we can ease your injury just by missing out on one lunch break, that’s a small price to pay. Right, Ayanokouji?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re probably right about that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It was just good timing that the two of us were running near you,” I said. “Don’t feel embarrassed.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto corrected me. “Three of us, actually. Although, man, that Kouenji dude runs insanely fast, huh? Dude’s a monster.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I get the feeling he has limitless stamina. There’s no doubt he’s number one in our grade level.” I wasn’t flattering Kouenji, just being honest.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe his horrible personality saved us from being saddled with Kouenji in Class A. Being in a group with him has made it pretty clear that he’s an inconvenience for Class C, rather than an asset.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was true that if Kouenji ever utilized his full potential, he’d be a huge threat. I couldn’t say he made a good secret weapon if he wouldn’t cooperate, though.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the end, it was around 12:40 by the time we got back to camp, carrying the injured Keisei between us. After we arrived, Keisei got medical treatment at the infirmary. Hashimoto and I waited for him in the corridor. About ten minutes later, Keisei returned.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How is it?” asked Hashimoto. Keisei smiled bitterly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s just a light sprain. Thanks to the two of you, it ended up being a minor injury.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile he was favoring his left leg a bit, it did seem like he was walking pretty normally.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s not much time until the exam. Don’t let it get any worse,” said Hashimoto, lightly patting Keisei on the shoulder.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, I know you helped me out, but…” said Keisei. Hashimoto immediately understood.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry about it. We’ll keep this between us. That’ll be more convenient, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe’d gotten what Keisei was trying to say without having to hear it put in words. Keisei patted his chest and let out a sigh of relief.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e6.3\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eS\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eINCE I MISSED LUNCH,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I was more excited than usual for dinner. After nabbing my seat, I immediately started eating.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Kiyopon, the seat next to you free?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was Haruka’s voice. When I turned around, I saw that all of the members of the Ayanokouji Group were together. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sheesh, Kiyopon. We’ve had a hard time trying to find you these past few days. You’ve been in weirdly difficult places to spot.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry. I guess I just don’t know what to do in a cafeteria this huge.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBecause of the way the groups were set up, it wasn’t that easy to get the usual crew together. Since there weren’t enough seats here, we moved a bit to find a spot where all five of us could sit.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-It’s certainly been a while, hasn’t it, Kiyotaka-kun?” said Airi bashfully.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt certainly was unusual for us not to talk for almost a full week. Even during the long holidays, we’d call or meet up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“More importantly, you doing okay, Miyacchi? You’re with Ryuuen, right?” Haruka asked, directing her question at Akito. She must have heard about that from somewhere.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I guess. I’m keeping my guard up, but it doesn’t seem there’s been any change. He’s actually taking the classes seriously and participating.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Like, even \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ezazen\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e and the relay?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. He’s acting so normal, it’s almost scary. If anything, he’s handling himself way better than the awkward guys. It’s just, well, I’ve tried talking to him a few times, but he doesn’t seem to want to hang out with anyone.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe he kind of went crazy from the shock of losing a fight?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I dunno. I think this is just the way he’s always been.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAkito braced himself, as if saying that he couldn’t drop his guard.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, how about you? Are you getting along well with your group?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not much to say, personally. I’m not close with anyone in it, but I’m not fighting with anyone either. Airi and I are in the same group, so I’m good.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m really glad that Haruka-chan is there for me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo Haruka and Airi were in the same group? It must be reassuring to have even one close friend with you.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems like our group has the most problems, Kiyotaka.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You might be right about that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka and Airi exchanged looks, like this was the first they were hearing about it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, Kouenji won’t follow orders, and Ishizaki snaps at people at the drop of a hat. Maybe it’s because he has Albert with him, but we can’t control him either. They’re a pain in the neck.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So Kouenji-kun is with you too… Are you all right, Kiyotaka-kun?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He’s not actively harming us or anything.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If anything, I’d say Ishizaki’s the real problem child. Maybe he’s gotten carried away since Ryuuen-kun was defeated. Not so long ago, he was just a lackey.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTo tell the truth, I felt like one of the main reasons for Ishizaki’s bad behavior was being put in the same group as me. I imagined feeling all this anger and frustration that he had no outlet for was causing him to lash out at anyone who wasn’t me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In any case, I have to work hard as the representative,” said Keisei. Even with the metaphorical equivalent of a bomb strapped to his leg, he kept doing his best to unite the group. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You boys sure have it rough, huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“S-somehow, I feel like we’re kind of out of place.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, it’s all right. I mean, if you girls are doing okay, that puts us at ease. Right?” said Akito. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTrue enough. Even with Kei funneling me information on the girls, there were still plenty of areas I couldn’t see. If Haruka and Airi were together and moving along without issue, we boys could focus more on ourselves.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e6.4\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT WAS NOW\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the sixth day, Tuesday. On that day, I started to hear something a little odd from the guys.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey missed the opposite sex.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was the current topic of conversation. I got the feeling that most of them were looking forward to dinnertime. While being surrounded by guys made me feel more relaxed, it wasn’t exactly as fun. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Agh, goddamn it. I feel like I’m losin’ my mind being around guys all the time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I were at an all-guys’ school, I’d be dead, man.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThose were just some of the opinions I heard.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dude, havin’ only guys around \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003estinks\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. Like, literally.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed it was inevitable that they were buying into the cliché that all guys had bad hygiene. The truth, however, was that there weren’t many sweaty or smelly people here. They should be thankful this wasn’t summertime. And, well…personally, I felt more relaxed being around only guys. That fact bore repeating.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ow, my hip…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile we were in the middle of dusting, Keisei yelped in pain and crouched down. We had cleaning and breakfast duty to deal with every day, regardless of the lessons that continued at the same time, and we’d reached the point where you could see the weaker students starting to hit their limits. Keisei was complaining about his pain. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe area we’d been assigned to clean today was pretty big, forcing everyone in our group, which was already short-staffed to begin with, to work harder than usual. When even one person got injured, you had to make up for it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whaddya mean, your hips hurt? Do your job.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki grabbed Keisei’s arm and forcefully yanked him up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I know. I’ll do the work. Let go.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then do it right,” spat Ishizaki, before heading back.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKeisei immediately tried to resume cleaning, but he just wasn’t moving well. His sprained leg in particular was clearly stiff.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe grunted quietly. He seemed to be enduring the pain, but if he pushed himself too hard, it’d affect him tomorrow.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Grab a breather. I’ll take your spot.” There was no helping it. I’d clean Keisei’s section for him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, Kiyotaka.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, we help each other out when we’re in trouble.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eProblem solved.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUntil…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey. You \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ejust said\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e you’d do it yourself!” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently he didn’t like that I was lending Keisei a hand. But he still made sure not to meet my eyes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll handle it,” I replied. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki didn’t seem satisfied. He looked right through me, continuing to rain harsh words on Keisei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re the representative, ain’t you? Don’t bitch about somethin’ like cleaning.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I get it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKeisei felt responsible. When pressed, he’d fold.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eget \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eit. You’re tryin’ to push your job onto someone else right now, aren’t you? I don’t like that. Do it yourself.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I get it. I’ll do it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right then, there you have it. Do \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003enot\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, under any circumstance, give him a hand, Ayanokouji.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki spoke to me for the first time, then immediately backed away, as if he was making his escape.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if Keisei injures himself as a result?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If he gets injured, that’s that,” answered Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, Ishizaki wouldn’t permit any attempt to help Keisei, even though he knew it wasn’t good for the group. Albert silently approached Ishizaki, looking as though he was trying to tell him something. But Ishizaki didn’t seem to be listening.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, Kiyotaka. Guess I have no choice but to hang in there.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKeisei probably feared the group’s mood would worsen if he didn’t keep working. Ishizaki was already riled by Keisei’s attitude over the past few days; he probably couldn’t stand Keisei having someone else helping him out. Keisei understood that, which was precisely because he took Ishizaki’s warning to heart and decided to do the job himself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStill, if Keisei pushed himself too hard, we might pay for it later. Even if he held out today, there was no telling what tomorrow would bring. The actual exam included multiple physically demanding tests, like \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ezazen\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e and the long-distance relay. He might suffer even more than he did now. I wanted to make Ishizaki understand, but I doubted it’d be simple.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Ishizaki. You’re taking this a little too far,” said Yahiko, unable to just sit back and watch the situation play out. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s his own fault for not being able to clean properly,” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know that. But what about \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehim\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e? Go warn him too.” Yahiko pointed at Kouenji, who had never once cleaned anything at all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t even communicate with that dude in Japanese. I ain’t got time to persuade a gorilla,” replied Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t as though Ishizaki hadn’t warned Kouenji at least once before. He’d confronted him many times, to no avail, and given up. In that sense, you could say that the difference between Keisei and Kouenji was that Ishizaki was able to have an actual conversation with Keisei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you have a problem, then you try and argue with him. It’ll just be a waste of time, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fine. If I have to go, I’ll go,” said Yahiko, grabbing a broom and walking over to Kouenji.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s pointless. You’ll see.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki gave a derisive snort. Yahiko thrust the broom at Kouenji, trying to press him to clean. But after a few minutes, he walked away, totally exhausted. We might be in the same group, but we were all still enemies. Clearly, that hadn’t changed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMost of the students probably wanted this group activity to end as soon as possible. But the important thing to remember was that not every group was like ours. Even if it was only on the surface for now, some groups had to have members who were deepening ties with one another, forming real friendships and alliances, as if they were actually classmates. It wasn’t just the first-years either. The same phenomenon could be observed among the upperclassmen who had managed to stabilize the relationships between their classes. They understood that everyone benefited if they cooperated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSome students could plan ahead, while others were slaves to their darker impulses. Without a drastic gulf in skill to shake things up, it wasn’t difficult to imagine the outcome of this battle.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aagh! I don’t wanna do this! This is just \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eso friggin’ dumb!\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Why do we even gotta play nice? Pretend like we’re friends with dudes from the other classes? Right, Albert?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlbert didn’t agree or disagree, but Ishizaki continued.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seriously, dude. I hate this group so friggin’ much, I could die. There’s that gorilla Kouenji, and the annoying loudmouth Yukimura who talks a big game even though he can’t even run a friggin’ marathon. Then there’s those Class B dudes who just smile and laugh without a care in the world, and those do-nothin’ Class A jerks. Idiotic.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWHACK!\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki kicked the broom.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re free to curse us all you want, but keep cleaning.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shut up. Kouenji ain’t doin’ nothin’, so why do I gotta?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then you have no right to say anything to Yukimura, do you?” said Hashimoto. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut Ishizaki wasn’t listening. He abandoned his cleaning duties and left, muttering something about going to the bathroom. Keisei bit his lip, frustrated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Keisei, you need to stop trying to shoulder everything alone. You can’t change anything in the one or two days we have left. If you make an error in judgment now, you might regret it later,” I said, giving Keisei some advice…or rather, hoping to confirm that he understood me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand, but there’s nothing else I can do. If I lean on someone else for help, Ishizaki will just alienate the rest of the group even further. If I do nothing, it’s highly likely that our group will come in last place. So I have to do something, even if it’s reckless.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf the two options Keisei had just listed \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewere\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the only options available, then acting recklessly probably would be the better choice. If you had no other paths to take, you just had to forge a new one for yourself. But Keisei didn’t seem capable of forging anything right now, let alone a whole new option.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe needed someone who was capable of both understanding the group and also taking action for the sake of others. I looked over at Hashimoto, who was quietly continuing to clean. He’d stopped Ishizaki from snapping at Kouenji on the second day, and he’d responded perfectly to the situation during the marathon practice. I had the impression he could to hold the group together firmly, at the right distance. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was unclear how much Sakayanagi and Katsuragi valued him, but I imagined he was a highly capable man—if I evaluated him as a hypothetical enemy, anyway. He was harder to read than the aggressive Sakayanagi and the conservative Katsuragi, which made him a tougher opponent.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Look, just don’t forget that I’m here. If you’re in trouble, I’ll help.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you, Kiyotaka. Just hearing you say that puts me at ease.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf those words helped Keisei, I was happy to say them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e6.5\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eD\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eURING OUR NEXT CLASS,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e it was clear the situation in our group had not improved. Keisei, feeling responsible, couldn’t successfully give orders as the representative, and Ishizaki wouldn’t even talk to anyone except Albert anymore. Even during mealtime, the only period when it was possible to create some kind of peace and harmony, our group never came together. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI decided to forget about them for the time being. There was nothing I could do for this group, anyway. I\u0026#160;could give some advice to the struggling Keisei and the belligerent Ishizaki, but I had no intention of taking any direct action to help. Getting in deeper would defeat the purpose of trying to fade into the background. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRemembering Haruka and Airi, I decided to investigate what was going on with the girls again. However, it wasn’t like I could just keep directly contacting Kei over and over again. She had responsibilities of her own, and if I kept contacting her, it might cause others to have their suspicions about the nature of our relationship.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBesides, the information I wanted wasn’t related to the first-years. I wanted information on the second- and third- years. I needed to confirm Nagumo’s true intentions toward Horikita’s brother.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis meant my number of helpful contacts was very limited indeed. I took a small risk for that reason, attempting to contact Kiriyama by leaving a clue for him to find…but Kiriyama was in Nagumo’s group. Even if he resented Nagumo, he probably couldn’t help me this\u0026#160;time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had to attack from a direction Nagumo didn’t expect. One person came to mind. I had Kei investigate a certain second-year girl for me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat person was named Asahina Nazuna.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was in Class A, alongside Nagumo Miyabi, and was personally quite close with him. I’d seen Asahina eating meals with her friends in the cafeteria many times. Even now, I was monitoring her movements from afar. She wasn’t on the student council but had a relatively high level of influence within her class. She also seemed to have a lot of influence over Nagumo. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were other guys and girls who were close to Nagumo, but I chose Asahina for two reasons. The first was that, contrary to her rough exterior and way of speaking, she had a reputation for being dutiful and conscientious. She also didn’t worship Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe other reason was that the two of us had just so happened to bump into one another by accident. The difficulty in trying to dig up information on Nagumo came from the fact that virtually every single second-year supported him. If I clumsily attempted to make contact, I ran the risk of exposing information about myself instead. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had to narrow my possible contacts down to someone who was least likely to leak information. This made our “accidental” meeting a powerful weapon. Information that only I know. Information that only Asahina could understand. I would use what that accident had birthed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat accident do I mean? Well, it came from a good luck charm.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAsahina had accidentally lost it a while back, and I had just so happened to pick it up. At the time, I’d returned it without thinking much of it. To my surprise, though, the item was apparently very important to her. I could tell because she had brought it with her even to this camp. She always wore it on her person, with great care. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAn accidental connection can sometimes be stronger than one created intentionally. Taking advantage of that connection, I wanted to ascertain whether or not she could be a useful source of information regarding Nagumo. The very circumstances of this camp made contacting her easy. All that remained was how to change our indirect connection into a direct one.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I openly approached Asahina, then someone—even if it wasn’t Asahina herself—might report it back to Nagumo. I wanted to avoid that. I’d been waiting for the right time, but Asahina spent almost all of her dinner hours with other people. I couldn’t find a chance to be alone with her. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut today, that golden opportunity finally presented itself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m going to the bathroom. Be right back.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust like that, Asahina got up, mid-meal. No other students accompanied her as she left, which was strange for a girl. I quickly followed her. I couldn’t bother her while she was in the bathroom, so I patiently waited for her to come back out. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe’d probably have five minutes to talk at most. If I took up much more of her time, she might grow annoyed. I had no idea how much I could get done within those five minutes, but I had to remind her that we’d met earlier by chance. Emphasis on \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003echance\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSoon, Asahina exited the bathroom. As usual, she was wearing her charm on her left wrist.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI pretended to be passing by.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm?” I muttered, quietly enough that Asahina might have thought I was just saying that to myself or that I was calling out to her. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I said that, Asahina turned around. If I didn’t respond quickly, she would probably think I’d been talking to myself and keep on walking. I decided to act.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, sorry. I was just thinking I’d seen that charm before. Please don’t mind me,” I said, motioning as if to continue walking. If she didn’t respond, I was prepared to start a conversation myself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They don’t sell this charm at the school anymore, though,” she replied. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut she \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ereply, so without hesitating, I kept the conversation going.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, that so? Did you happen to drop it a while back, by any chance?” I asked. She should understand what I meant right away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, are you…the person who found my charm?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe… I picked it up on my way back to the dorm, uh…when was that, again?” I replied, pretending not to remember.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I think I’m right. I see. So it was you,” said Asahina, smiling happily. She drew nearer. “Thank you. When I realized I’d lost it, I was so upset. Ever since then, I’ve been scared I’ll lose it again, so I’ve been wearing it more often.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe looked bashfully at her wrist.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This charm, well, I bought it after I started school. It’s not like I have any strong attachment to it in itself or anything. It’s just…how do I put it? It’s like emotional support. When I have it at hand, I just feel safer, you know? When I lose it, I get all anxious that something bad is going to happen, like it’s a bad omen or something.\u0026#160;I was so relieved that someone found it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, bringing good luck \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewas \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eessentially a charm’s purpose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I never imagined you’d be the one who found it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you know me?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I know about you. You got a lot of attention in that relay race against Horikita-senpai. Oh, and Miyabi. Wait, you might not know his first name. Student Council President Nagumo talked to you a while back, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait. Were you there too?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, I knew the answer to that. Ichinose had also been present.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAsahina seemed like the person who’d put up her guard if I told her I knew she’d been there, so I pretended not to remember. Just like picking up her charm, this meeting, where we just happened to cross paths, had to be accidental too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m pretty fast, but to be honest I don’t really have anything else going for me. Maybe I’ve caught President Nagumo’s eye through some kind of misunderstanding,” I told her, making my voice sound troubled. Asahina nodded back repeatedly, showing that she understood.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nagumo really respects Horikita-senpai. Or, like, he’s made Horikita-senpai a sort of goal. I think he was probably jealous that he didn’t get to challenge him during the relay.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t sense any ulterior motive in Asahina’s words. For better or worse, she seemed the honest type. I decided to step things up a bit.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How can I get Nagumo-senpai to stop paying attention to me?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, how about you beat him at something? You could cut that smug Miyabi down to size. Personally, I’d love to see him lose for once,” she replied, chuckling. She was probably joking, but I pretended to take what she said at face value.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol8_INTERIORIMAGES_7\" src=\"/hola-lector-agua/images/books/v8/OEBPS/Images/ClassroomElite-Vol8_INTERIORIMAGES_7.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. That might be one option,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAsahina’s eyes immediately darted back to me, an awestruck look on her face. Then a few seconds after, she burst into laughter.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=
