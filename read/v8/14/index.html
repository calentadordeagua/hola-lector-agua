[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T2f68,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 8:\u003cbr/\u003eThe Second Half of the Girls’ Battle:\u003cbr/\u003eHorikita Suzune\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE FINAL TEST\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e would be the next day. The rest of the student body was busy gobbling down their dinner when I, Horikita Suzune, made contact with a certain someone inside our room. With everyone else in the cafeteria at the time, it was simple for the two of us to make contact.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Look, Horikita-san. To be honest with you, I don’t think you’re seeing the current situation for what it is.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStanding before me was Kushida-san, a serious look in her eyes. In the cramped confines of the camp school, with eyes and ears everywhere, I couldn’t neglect to keep tabs on her—even though it was her public-facing persona that stood before me now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not seeing the current situation? What do you mean by that?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You forced me to be in the same group as you, for the purpose of keeping me under surveillance…or to have me acknowledge you as a comrade. Is that right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe spoke in her normal, friendly tone of voice, clearly operating on the assumption that someone might enter the room at any moment. But there was something more forceful than usual to the way she said it, almost certainly because she felt secure that I couldn’t pull any tricks like recording our conversation with my smartphone in our current situation. Personally, I welcomed her honesty. If she always kept her true nature hidden, we’d never move forward.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I won’t deny that those objectives are part of it,” I said. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI made sure to emphasize \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003epart\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e quite strongly, but Kushida-san ignored it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You seem to be acting on your personal feelings. I\u0026#160;wonder how that will work as a strategy. It’s certainly true that you and I don’t get along, Horikita-san. But if you were thinking about the group’s scores…no, if you were thinking about your \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eclass\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, shouldn’t you keep your personal feelings out of it?” said Kushida-san, crossing her arms with a sigh, as if thrusting her honest opinion at me. “You’ve made me, and me alone, your priority. Winning and losing are just secondary concerns. Am I wrong?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t deny that either.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So you admit it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrankly, there was no way I could deny it. Ever since the Paper Shuffle, I’d considered Kushida-san my primary concern. I even invited her out for tea during winter vacation. I was doing things I’d never done before.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It doesn’t matter what you do,” she said. “Enough already. I want you to understand that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unfortunately, I’m afraid I can’t let this go.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo long as my problems with Kushida-san went unresolved, I couldn’t move forward.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Look, it’s not my place to say this, but have you forgotten about how you dragged me out in front of the student council president and made me swear I wouldn’t do anything? Putting aside my own feelings, which I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewill not get over,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I promised I wouldn’t do anything to sabotage you, Horikita-san. I thought you’d at least trust me that much. Or did you think I’d break my promise right away?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t answer her question with words. Kushida-san probably understood my feelings. What she said was half correct; even though I expected she’d keep her promise, however reluctantly, I also thought she might be working behind the scenes to get me expelled. Those two instincts clashed within me. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I truly trusted Kushida-san, I wouldn’t feel the need to stick by her all hours of the day. Moreover, while my brother isn’t the sort who would say anything to anyone else, once he graduated, the oath she swore would be meaningless. If I were to take action, it would have to be soon. Time was of the essence.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I want you to trust me,” I told her, deciding to get straight to the point.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, you’re blunt.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite apparently taking what I said at face value, Kushida-san wore a thin smile on her face. But it wasn’t a smile of agreement. I couldn’t let myself be mistaken on that count.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No matter what, I will not say anything to anyone about your past. What do I have to do to make you believe me?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unfortunately, there’s no way you can convince me,” replied Kushida-san flatly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I gain nothing by telling people.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re certainly right about that. If I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e find out you told someone, I’d show no mercy. I might even destroy the entire class, just like I did back in junior high. As someone who’s aiming for Class A, you obviously wouldn’t put yourself in jeopardy. At least, that’s what you’d assume,” said Kushida-san. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe seemed to understand. So what was the problem?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But if you ask me, our current environment’s a little \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecramped\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Cramped?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For example, would you obey a stranger who puts a knife to the back of your neck and says he’ll hurt you if you don’t cooperate? There’s a difference between a situation where you can’t be hurt even if someone tried to and a situation where someone \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecould\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e hurt you if they wanted to. You understand, don’t you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida-san didn’t trust anyone. She didn’t make her decisions based on whether they advantaged or disadvantaged her; she simply couldn’t stand anyone else holding power over her. That’s why she wanted to eliminate me. The problem was I couldn’t let go of the knife, even if I wanted to.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aren’t you just strangling yourself with your own two hands then?” I said. “As a matter of fact, the number of people who know about you are slowly but surely increasing.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. I will admit that the situation has gotten more dire.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re clever. You’re above average in both academics and athletics, and you have the best communication skills in our grade level… No, depending on how you look at it, you might even be able to say you’re the best in the school. Even talking to you now, I’m impressed by your quick thinking. You could be an incredible asset to our class if you simply cooperated with us. You’d be even more beloved by your peers too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you honestly not get that your know-it-all tone irritates me more than anything else? You’re talking this way because you know my true personality. I can’t stand that. If you didn’t know anything about me, you wouldn’t be saying these things.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe would never accept anyone knowing about her past. Her resolve was clear.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re smarter than me. Wouldn’t you do just fine even at another school? Besides, you came here so you could be at the same school as your older brother. Right, Horikita-san? But your brother will be graduating soon, so you won’t need to force yourself to stay. You could study at a different school, go on to college or land a job. Wouldn’t that be fine?” asked Kushida-san.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was trying to cut our conversation short, as though saying that trying to talk to her any longer would just be a waste of time. I let out a quiet sigh.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll be quiet for now. But I will never trust or cooperate with you, Horikita-san. Until either you or I are gone from this school, we’ll never be okay. No matter how many times we have this conversation. You’d do well to remember that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand. I’ll leave things for today.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not just today. This is the last time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida-san walked out of the room, leaving me with those parting words.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I really am powerless, aren’t I?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had very few comrades I could trust. Ayanokouji-kun seemed like the one I could most often rely on, but he and I had grown more distant of late, probably because I forced him to talk about the student council in front of Kushida-san. But I couldn’t back down. I had to keep her close to protect myself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if it cost me his cooperation, I would choose Kushida-san. No—I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003emust\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e choose her.\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 8: The Second Half of the Girls’ Battle: Horikita Suzune\",\"volumeId\":\"v8\",\"chapterIndex\":14,\"prevChapter\":{\"volumeId\":\"v8\",\"chapter\":13,\"title\":\"Chapter 7: What Is Lost, What Isn’t\"},\"nextChapter\":{\"volumeId\":\"v8\",\"chapter\":15,\"title\":\"Chapter 9: Blind Spot\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0
