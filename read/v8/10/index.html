 after five o’clock in the morning.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aah, I’m so goddamn tired!” shouted Ishizaki at the outdoor cooking area. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So is everyone else. Ah, please measure the ingredients correctly—don’t mess up the amount of miso,” said Keisei, flipping through the breakfast menu the teachers had given us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shut it. Why do I even gotta help make food in the first place?!” Ishizaki groused, though he kept stirring the miso to make it dissolve.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Look, we don’t have a choice. We could get hit with a penalty if our whole group’s not here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whatever, dude, like hell I care. God damn it. Oh.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What was that?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nothin’.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, that was something. Where’s the salt you were just holding?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I put it all in.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKeisei turned off the fire in a panic. He tasted the soup and choked. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You put in way too much! \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAck!\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e It’s not even edible.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf we’d given that soup to the seniors, it would have invited a \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003elot \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eof criticism. Not to mention it was probably unhealthy too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You have to start over.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Screw that. You do it. Or what about Kouenji?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not like I know!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re in the same class, aren’t you?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto shot a backward glance at the two of them fighting over the miso soup, his hands occupied by skillfully wielding a frying pan on the camp stove.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dude, you’re really good.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve always cooked my own meals,” said Hashimoto without a trace of arrogance. As he continued to cook up a storm, Albert approached him silently, carrying a bowl filled with whipped eggs.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you. If you’re up for it, could I ask you to cut up some vegetables too?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite his bulky frame, Albert skillfully brought the kitchen knife down on the cutting board, dicing vegetables with ease. We’d be feeding a lot of people, so Hashimoto kept churning out fried eggs. Clearly, he and Albert were our team’s trump cards, as far as cooking went. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMeanwhile, I’d lucked out by landing the easy job of preparing the raw vegetables and tableware. There were a \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003elot \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eof vegetables to be prepped, and although I couldn’t help with the frying, I felt I could at least pitch in on the dicing and chopping. I stood beside Albert and tried to communicate with him silently, just using my eyes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eCan you handle cutting? Vegetables?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eProbably, yeah.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSomehow, we seemed to understand each other—at least enough that Albert handed over a kitchen knife. Thankfully, living in the dorms had led me to develop some skill with a knife. I began to dice vegetables, keeping pace with Albert.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhere had Kouenji gotten to, anyway? It’d already been half an hour since he went to the bathroom. Classes A and B each sent one student to look for him, but since they hadn’t returned, it was a safe bet they hadn’t found\u0026#160;him. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the end, Kouenji didn’t return until breakfast. When he did return, all he would say was that he’d been holed up in the bathroom due to a stomachache. Needless to say, his relationship with Ishizaki was wrecked beyond hope of repair at this point. \u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e4.1\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eS\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eOMETHING HAPPENED\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e while I was studying morality during our third period that Saturday. I heard a girl’s cheerful voice outside, and peering out the third-floor classroom window, saw Ichinose race spiritedly through the yard. She’d had a difficult time getting the groups coordinated on the first day, but she seemed cheerful now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi had enthusiastically declared she would crush Ichinose, but I saw no sign of that happening. Of\u0026#160;course, I could only see what was on the surface.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol8_INTERIORIMAGES_4\" src=\"/hola-lector-agua/images/books/v8/OEBPS/Images/ClassroomElite-Vol8_INTERIORIMAGES_4.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I watched, I was able to discern, to a certain extent, the people who were members of Ichinose’s group. Surprisingly enough, I spotted only one person from Class C among them. The Class B students were all unfamiliar to me, with the exception of Ichinose. Had they gone with the same approach as the boys—picking the minimum number of people from Class B in order to have an even mix of people from all four classes? \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wasn’t really sure who the Class A and D students were, but I did spot the girl who had suffered a severe injury by running into Horikita as a part of Ryuuen’s ploy during the Sports Festival. Fortunately, she must have made a complete recovery, for she seemed to be running just fine. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe only student from Class C, meanwhile, was a girl named Wang Mei-Yu.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe’d come to Japan from China during elementary school and had remained here ever since. At least, that’s what I’d heard. Her nickname was Miichan, though only close friends ever called her that. All I knew was that she did well in class and was especially proficient in English. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough there were some slight differences in their scores, overall, she was as academically adept as Keisei. Strangely enough, she was just as athletic as him too—which was to say she was currently dead last by a wide margin, despite struggling desperately to keep up with the group. She staggered along, breathing heavily and looking up at the sky, seeming ready to collapse. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose noticed Miichan lagging behind and slowed down. She matched Miichan’s pace to run supportively alongside the other girl, encouraging her. Soon after, another girl came up beside them. It was Shiina Hiyori from Class D. She didn’t seem especially athletic either, but she had a smile on her face as she ran alongside the other girls.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAccording to Ryuuen and the people around him, Shiina had taken on the role of leader of the Class D girls. If that was true, then I was looking at a girls’ group with two class leaders in it. With that in mind, it wouldn’t have been strange for Horikita and Sakayanagi to be together too—but they were apparently in different groups.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFeeling a surge of curiosity about how those groups had come together, I gazed out the window instead of focusing on the lesson. When our instructor spoke up, though, I could tell that things were about to become difficult.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We will now begin self-introductions. However, you won’t simply be introducing yourselves. Please keep in mind that this will be one part of your lesson. From now on, you will all be giving a speech every day. The themes will differ between grade levels, but the four fundamental criteria on which you will be judged are volume, posture, content, and communicativeness.’”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe word \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003espeech\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e had indeed cropped up in the syllabus we’d been given back on the bus, making this undoubtedly one of the subjects we’d be tested on as part of this special exam. I was willing to bet every member of our large group would have to deliver a speech they’d composed themselves at some point. This part of the exam would be hell for people who lacked public speaking skills. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe instructor went on to notify the first-years that they would be giving speeches on what they’d learned in their first year of school and what they’d like to learn in the years to come. The second- and third-years had to speak about their plans for the future, like attending university or getting a job.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For real? Talk about a shit exam,” spat Ishizaki. I understood how he felt, but he was being much too loud. Even the teacher seemed to have heard him, though he didn’t take Ishizaki to task over it. We could do as we pleased, but we needed to remember that our actions would ultimately affect the group. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen free time rolled around, a young man approached the first-year group. Ishizaki, who had had his legs sprawled on top of a desk, instantly corrected his posture. The new arrival was Kiriyama from second-year Class B, who served as vice president on the student council under Nagumo Miyabi. He used to be in Class\u0026#160;A, but had been demoted after losing to Nagumo, and it seemed that, deep down, he wished for Nagumo’s downfall. Horikita’s brother had put us both in touch.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think you should adjust your attitude a bit,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“S-sure. Well, I wasn’t really makin’ any fuss or anythin’.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not just talking about you, Ishizaki. That applies to you, too, Kouenji.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMuch as he might crave Nagumo’s downfall, Kiriyama still had to play the part of a dutiful vice president. He had to address anything that might affect the large group’s overall scores.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re going to be evaluated based on the test on the final day, right? I don’t think taking these lessons seriously is that important.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The written test isn’t everything there is to this special exam. Haven’t you considered the possibility that our instructors will be taking your behavior in class into account? And how exactly do you plan to score well on the test if you don’t take the lessons seriously?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Simple is best. This is \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eme\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e we’re talking about, no?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. You’re saying getting a high score is easy for you, eh? Well, we’ll see if you can make good on those boasts when the special exam comes around. You’re part of this group—shouldn’t you want to avoid acting in ways that make your teammates uneasy?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A group that’s made uneasy by my actions is a group that has no value.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t get to decide that, Kouenji.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then who, may I ask, does?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No one person. The whole group does. Every student here decides.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki couldn’t help but grin after hearing that, probably because he loved seeing Kouenji get told off. However, common sense wasn’t going to work against Kouenji.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m worth far more than the rest of you combined. An average person cannot correctly judge the exceptional.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re too ignorant and infantile to even be called a high school student,” Kiriyama said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji didn’t flinch, but before I knew it, nearly half of the second-years had begun to encircle us. Even Ishizaki’s smile faded, his face growing stiff. Threatening words could be heard being murmured around us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides, it’s not just Kouenji. There’s a number of you who’ve been causing all sorts of problems.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe probably meant Ishizaki, but I honestly couldn’t think of anyone else. We’d all been taking the lessons seriously, in our own way. Kiriyama was probably lumping us first-years together because he wanted us to focus, letting us know that we’d be earning our seniors’ ire if we continued to behave impertinently. Kouenji was merely the straw that broke the camel’s back.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think that’s enough, Kiriyama.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnable to stand by and watch the situation unfold, Ishikura, a third-year, stepped in to help. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know you’re just trying to coach them, but the way you’re doing it could come off as bullying. If that happens, you’ll be the one in trouble. The first-years understand the situation well enough. Isn’t that right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshikura looked to us for confirmation, and every one of us, including me, nodded. Except for Kouenji, of course.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Excellent, Ishikura-senpai. You really got a handle on things, didn’t you?” said Nagumo happily. He’d been watching the whole thing go down from the sidelines. “You really are too good to be kept in Class B. Maybe you’re just really unlucky, Ishikura-senpai.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Luck, huh? Much as I hate to admit it, I think it’s just that my skills aren’t up to par.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think that’s true. The only reason you haven’t been able to rise to Class A is because there’s a genius like Horikita Manabu in your way. I know you’ve fought the good fight for three years. There’s a 312-point difference between Classes A and B right now. Even though graduation is around the corner, I think you’re closing in on\u0026#160;them.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you saying you’ll lead this group to victory?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Exactly. If you’re willing to trust me, Ishikura-senpai, we’ll win this special exam. And, as I’m sure will bring you no small amount of delight, I’ll help you get to Class\u0026#160;A. We might even be able to get Horikita-senpai removed from the school. Hmm?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unfortunately, Horikita doesn’t seem to be a group representative. And you aren’t either, are you, Nagumo? There’s nothing you can come up with that would be enough to drag him down.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It doesn’t matter if he’s the representative or not. There are many ways to crush him,” said Nagumo with a laugh.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry. But I can’t trust you. Not with the fate of Class\u0026#160;B.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s unfortunate.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo had simply laid out all his plans in front of everyone. Was he genuinely that guileless? Or was he just trying to make himself \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eappear\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e guileless? I doubted it was the former. \u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e4.2\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT DINNER,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I decided to make some minor moves.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOr so I say, though all I was really trying to do was get a better handle on the girls’ situation. Ichinose and Shiina being in the same group had caught me slightly off guard, and I wanted to understand what was up with the other groups.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wanted to better understand the girls’ situation, because Ichinose and Shiina being in the same group had caught me by surprise. I wanted to understand what was up with the other groups. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei was eating in the same place as she had since the beginning, which made it easy to get in touch. I hadn’t even asked her to do that. She truly was reliable. I, on the other hand, had been grabbing random seats that just happened to be open, wanting to avoid openly engaging with Kei, just in case.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eVery few students knew about my strange relationship with Ryuuen and other members of Class D, or with Kiriyama and Kei. Besides, there were enemies on the inside of whom I needed to be cautious. I checked my timing and then sat down near Kei. Just as I was racking my brain over how I would get her to notice I was there—\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei made some kind of noise, I think as a greeting? It\u0026#160;was very soft. Apparently, she’d noticed me, even though she was enjoying a meal with her friends. In that case, I would wait patiently until she got rid of them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe proceeded to eat her meal slowly, letting her friends head back to the room ahead of her. I’d been considering postponing this meeting if there was a chance of being interrupted. She couldn’t shake her friends, but she’d cleverly manipulated them into leaving. Finally, no one was paying attention to us, and our conversation could start. Of course, we’d immediately cut it short if someone did come.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So? It’s the third day, and you finally feel like asking for my help?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. I have too little information on the girls.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No surprises there. Someone with a communication impairment like yours can only make contact with so many girls.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was giving me the cold shoulder, right off the bat. A small price to pay if it helped Kei feel she had an advantage, and keep our relationship going…but I decided to be a little mean in response.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol8_INTERIORIMAGES_5\" src=\"/hola-lector-agua/images/books/v8/OEBPS/Images/ClassroomElite-Vol8_INTERIORIMAGES_5.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’ll make it through this special exam even if you get no help from me?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“O-obviously. I mean, who do you think I am?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Then there’s nothing to worry about.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, maybe you can analyze my situation just to make sure there’s nothing to worry about. Okay?” said Kei, looking anxious.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tell me how the girls’ groups are divided.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, before we talk about that, something’s been on my mind.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Make it quick.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf we spoke too long, people might become suspicious.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’d say it’s pretty important… What’s going on with that Ryuuen guy?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you worried?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah. Even the girls are talking about it. Like why he quit being the leader and all. No one knows what really happened.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I wouldn’t ever call Ryuuen ‘gentle as a lamb,’ but he’s been somewhat domesticated.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So raking him over the coals worked?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Raking him over the coals?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei hid her vulnerability beneath a tough façade, though her fear occasionally came into view. Her curiosity probably stemmed from anxiety over the fact that Ryuuen knew her weakness. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry about Ryuuen. He won’t do anything careless. At the very least, he won’t be doing anything to you, Kei,” I said, to reassure her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei didn’t respond. Was someone else approaching us? I’d been on my guard in case that happened…but that didn’t seem to be the case. I immediately sensed what was going on.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry. It’s nothing,” she said. I could tell she was lying.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It doesn’t seem like nothing, Kei.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I’m telling you, it’s nothing.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that really true, Kei?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Wait a minute. You’re doing this on purpose, aren’t you?!” She didn’t look at me, but her voice sounded threatening. Maybe I’d pushed her too far. “Ugh, God. I shouldn’t have given you permission to call me by my first name.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re the one who started that in the first place.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-well, yeah.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMore importantly, if she was satisfied by what I’d told her about Ryuuen, I wanted to get down to business. We were well hidden among all the hustle and bustle, but if someone happened to notice us, they might become suspicious of my relationship with Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’ve gathered as much information as I could, more or less. Want to hear it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m going to say this up front, though—I wasn’t able to get a complete picture of all of the groups like you wanted.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand. I wasn’t expecting that much from you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, that’s a super rude way of putting it. Even someone like you couldn’t know everything about who was put into what group, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm. I wonder about that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What? You’re saying you’ve memorized where everyone is?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t say that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What group is Shibata-kun from Class B in?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He’s in the group of mostly Class B students led by Kanzaki.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What about Tsukasaki from Class A?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He’s with mostly Class A students led by Matoba.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Th-then what about Suzuki-kun?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He got assigned to a different small group than the one I’m in.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehave\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e memorized everything!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just the people whose names I know. But if I see their faces, I can remember where they belong.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was grateful that this exam had forced me to memorize the names of all of the first-year students. Once we were done here, I’d probably be able to match names to faces with nearly 100 percent accuracy. As long as I hadn’t missed or misunderstood something, of course.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSigh\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. How is your memory this good? Don’t tell me you’re one of those nerdy four-eyed try-hards who spends all his time studying or something.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnfortunately, I had no idea what Kei was saying.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s get down to business. What’s going on with Sakayanagi and Kamuro’s group?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They’re in the same group. It’s made up of students from three classes, with nine students from Class A. Class\u0026#160;A was the first to put their groups together,” explained Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, the girls had picked a similar strategy to the Class\u0026#160;A guys. Only they went with nine students instead of twelve.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The fact that they’ve only got three classes means someone didn’t join in. Or maybe Sakayanagi didn’t let them in?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They wouldn’t accept anyone from Class B. They rejected the idea right off the bat. They said they couldn’t trust Ichinose or something. Well, Sakayanagi didn’t say that. Kamuro did.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not able to trust her, huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess you wouldn’t fully trust any student from another class, but they specifically named Ichinose. But isn’t that kind of weird? I mean, even \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI’ve\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e heard nothing but good things about her.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I were asked to name a trustworthy student from another first-year class, I’d have named Ichinose, without a doubt. Of course, there were probably more than a few people who’d name Kushida, if asked the same question… At any rate, I estimated Ichinose was in the running for the most trustworthy person in our grade level. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut if Sakayanagi and Kamuro’s group only had members from three classes and the minimum number of students, their point multiplier would be greatly diminished. It was a strategy where absolute victory was impossible, but so was absolute loss.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not fair, right? Class A should just protect themselves. They were really forceful about how they made the groups.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seems that way.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA solid, reliable strategy. Sakayanagi had almost certainly devised that plan. It was surprising that someone as aggressive as her would adopt a defensive strategy like\u0026#160;this. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So what should I do now? Set a trap or something?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Cheap tricks won’t work in this exam. There are some people I’d like you to monitor, though,” I replied, naming some of the major players.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm. That’ll be pretty tough, but I’ll try.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe obediently followed orders. That was Kei’s strong point.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, what’s up with this exam? Do we really have to worry about things like manners and ethics?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder. If this were a story, I’d say it was almost like a MacGuffin.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? MacMuff—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not what I said.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I know that. So what is it?” She had no idea.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s an element that’s important because it motivates the characters but is otherwise unimportant to the story itself.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t understand. Look, I know you’re a smart guy, Kiyotaka, so just explain things in a way that’s easy to understand.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m saying manners and ethics may be necessary but aren’t really important in and of themselves.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDinnertime was almost at an end. Students started to disperse.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But this exam… Let’s just say a storm is coming.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A storm? What do you mean? Are you saying something bad is going to happen?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Relax. At the very least, I say no harm will come to you.” Things probably wouldn’t get too bad for the first-years this time. I grabbed my tray and stood. “If I need you again, I’ll call.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Understood.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, I decided to return to the room.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e4.3\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eS NIGHT FELL\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e on our third day, I entered the large  bathhouse. Several guys were gathered in one corner; I saw not only Yamauchi and Ike but also some Class B students like Shibata. I exchanged glances with Kanzaki, who entered the bathhouse at the same time as me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is a pretty unusual combination of people,” said Kanzaki, surveying the gathering with surprise.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, sure seems that way.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How’s your group? Any trouble?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dunno. But I can’t say it’s going all that well,” I replied honestly. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKanzaki seemed unsurprised. “Well, if you have a small group made up of an uneven number of students from four different classes, there’s bound to be tension.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wish that were all it was.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Moriyama and the others told me. Sounds like you guys really have your hands full with Kouenji.” A natural assumption, under the circumstances.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m trying my best as a classmate, but I have absolutely no control over him,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Speaking of control, have you heard about what’s going on with Ryuuen?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I haven’t heard anything.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was three days since Akito had entered Ryuuen’s group. Even though we saw each other in the bath, on the way to the toilet, or during mealtimes, we hardly ever spoke. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If he were scheming or something, there’d be reports. But I haven’t heard anything.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Kanzaki—Class B’s second-in-command—said no rumors were going around, then it was probably true. As someone who knew the full extent of the situation, I doubted Ryuuen would try anything, but the other students probably weren’t going to let their guard down for a while. Many probably suspected he would spring some kind of trap by the end of the exam.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re ever in trouble, find me. I’d like for our good relationship with Class C to continue. Ichinose feels the same way, of course.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I sincerely appreciate that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ichinose seems to have a really high opinion of Horikita. More so for her honesty than her ability, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Her honesty? Huh.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t know if I would call Horikita “honest” myself, but Kanzaki’s definition of the word might be slightly different from my own. He probably meant she had integrity. She was a firm believer in keeping her promises. You couldn’t expect anything of the sort from Sakayanagi or Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, Kanzaki! Hey, over here!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShibata waved.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji! You come over too!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi signaled for me. Unable to decline under the current circumstances, I went.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s up?” said Kanzaki to Shibata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just having a blast with Yamauchi and the guys here. Bein’ totally honest and talking about something kinda weird.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kinda weird?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’ve been talking about who has the biggest thing in our grade.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What thing?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dude, isn’t it obvious what we mean? You know, down there,” said Shibata with a laugh, pointing at the center of the white towel wrapped around his hips.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Sounds like you’re having fun.” Kanzaki released an exasperated sigh at the childish competition that Shibata was engaged in.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, yeah, it’s childish. But hey, it’s surprisingly\u0026#160;fun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKanzaki and I didn’t get what was so fun about it. We exchanged glances and decided to keep our distance. When Shibata and the other started their discussion once again, Kanzaki left. Soon after, I got up to leave too. However—\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, who’s the current size king?” Sudou, probably having overheard the conversation, showed up. He\u0026#160;radiated confidence as he grabbed tightly me by the shoulders, preventing my escape.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have no clue.” I dodged the question. While the majority of us wore towels, Sudou was proudly naked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh. That’s what I’d expect from Sudou,” said Shibata. I could tell that he was anxious.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kaneda from Class D’s the current king.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kaneda? That gangly four-eyes?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou pushed past Shibata. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Move it,” he said, before joining up with Yamauchi and the others. Kaneda, who seemed to have no intention of joining in, looked uncomfortable. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, dude, Ken, you came! You’re the only one we can count on!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Leave it to me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou, representing Class C, confronted Kaneda, who looked perplexed at being dragged into this competition.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You wear glasses even in the bath?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I don’t, my vision is so bad that I can’t see well enough to walk.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That so?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t an aggressive competition. They simply stood next to one another. The outcome of their showdown was decided in an instant.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hot damn!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou confidently pumped his fist as he posed. He shouted in triumph, his voice echoing throughout the bath. Kaneda fled, the sentiment “Finally, the game is over” written on his face. I was sorry he’d gotten dragged into it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That settles it. I’m the king!” Sudou declared.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was unlike anyone would challenge him, having seen the power he was packing. I hoped this pointless competition was at an end, but…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“King? Don’t make me laugh, Sudou,” said Yahiko, challenging Sudou with a loud laugh. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou just glanced at Yahiko’s naked crotch before dismissing him. “You ain’t no match for me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I’m not. But \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI’m\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e not your opponent.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It don’t matter who I’m up against. The result’s the same. The king is Class D’s—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, Ken, we’re Class C now. Class C.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, that’s right. The king is Class C’s Sudou Ken-sama!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re just above average. You can’t win against Class A’s Katsuragi-san!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently it wasn’t Yahiko challenging Sudou but rather the person that Yahiko idolized—Katsuragi. The man in question was sitting on a stool nearby, reaching for some shampoo. Since he was completely bald, I wondered where exactly he was going to apply the shampoo, then decided not to ask that question.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Knock it off, Yahiko,” said Katsuragi. “I have no interest in such nonsense.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We can’t let this pass. We have to win. This is about a man’s pride. No, Class A’s dignity is on the line!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What a stupid competition…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But that’s not really true. Is it, Katsuragi?” said Hashimoto. Yahiko just looked disgusted. “Like Yahiko says, Class A’s pride is on the line. What you’re packing makes you the only one here that can measure up against Sudou.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto had personally checked out Katsuragi’s “thing.” He clearly had confidence that Katsuragi could win, laughing boldly at the possibility of victory.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi, however, made no move to stand.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Bring it, Katsuragi.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi remained calm in the face of Sudou’s provocation. However, everyone else was getting fired up. They cheered, wanting to see Katsuragi and Sudou square off.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For crying out loud. I can’t even wash my head in peace,” said Katsuragi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo that meant that he really was planning on applying shampoo on his head after all, huh.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The contest will be over in a second, Katsuragi.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Have it your way.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi, having determined the best way was to accept the challenge, slowly got up. Everyone let out a sigh of admiration at the sight of his large frame.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Th-this is…?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi, who was the judge, crouched down. He scrutinized each combatant, looking from one to the other, but the differences seemed almost nonexistent. Sudou offered his opponent praise as he waited for Yamauchi to pass judgment.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nice, Katsuragi. That’s the reason they call you Class A’s trump card.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is ridiculous…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, and the judges say—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi stood up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s a draw!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnlikely as it might seem for such a thing to happen in a competition like this, Yamauchi had determinedly they were evenly matched. Ike, Shibata, and the others gathered around, ready to object, but Yamauchi’s judgment seemed sound, because they couldn’t determine who was bigger either.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are we done?” said Katsuragi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClearly done with being made a spectacle, he pushed past them and went back to where he was sitting.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I hate to admit it, but I guess the two of us share first place,” Sudou said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t think anyone would object to that…but we \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003estill \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eweren’t done.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I had the honor of watching your valiant battle. But my, how naïve you are,” said Ishizaki from Class D.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Don’t make me laugh, Ishizaki. You ain’t a match for me,” said Sudou with a dismissive laugh. Ishizaki was pretty much on Yahiko’s level.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I ain’t your opponent.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You fool! Class D possesses the ultimate trump card!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No way. You don’t mean Ryuuen?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No!” shouted Ishizaki. “Albert! You’re up!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe moment Albert’s name was called, there was an uproar. The thought of Albert had certainly crossed everyone’s minds, but they’d avoided mentioning him. Now that unspoken rule was broken.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, that’s not fair!” Even Sudou, who’d been dubbing himself a king moments ago, couldn’t hide his nervousness.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Deal with it. If we’re measuring who’s number one in our grade, then Albert is on our team!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki had a point, but no one could deny a fight that crossed into international territory put us at a disadvantage. Japan’s professional baseball players, for instance, were highly skilled—but if you looked at foreign players in the major leagues, the difference in physicality was obvious. Foreigners were just made differently from us, both in terms of build and genetics. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlbert approached silently. Sudou and Katsuragi were well built, but they couldn’t compare to his muscular frame. Also, for some reason, Albert was still wearing sunglasses in the bath. Maybe they had some kind of anti-fogging solution applied to the lenses, because he moved with no problem.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Damn, he’s huge…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlbert had a bath towel wrapped around his hips, so Sudou’s muttered words had to be referencing his physique. Now that I saw them side by side, the difference was clear. It was like the difference between a junior high student and a college student. It followed that the same should apply to the weapons they wielded. Though it might be precious little help to him here, all Sudou could do was pray Albert wasn’t packing more firepower than\u0026#160;him. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Bring it on!” Sudou shouted, showing no fear. As the king, he couldn’t run away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlbert didn’t say a word, but he was plenty intimidating, even so. He let Ishizaki remove his bath towel. The veil had been lifted. Everyone, not just King Sudou, watched with rapt curiosity. Was this a weapon worthy of a final boss? Or, in a stunning upset, would he be wielding something minute? \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a clash between beasts—the most primal kind of battle.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Go, Albert!” cheered Ishizaki as Albert’s fighting prowess was made clear. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Th-this is…?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnveiled before the eyes of the current king was Albert’s true form, which he’d kept hidden so far. The crowd fell silent.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I…lost.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTwo simple words from King Sudou. He collapsed to his knees, struggling with overwhelming defeat. Unlike the contest with Katsuragi, there was no need for judgment here. The difference was just that extreme.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This means Albert’s…the final boss!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi, Shibata, and the others folded like Sudou had, their spirits crushed. No one was capable of challenging Albert. The winds of despair began to howl. Albert slowly bent over, maneuvering his large bulk as he picked up the towel and walked off. Everyone fell to their knees in despair, recognizing their horrible defeat.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ha ha ha. You are all amusing yourselves like \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003echildren\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, it seems.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji’s voice cut through the dreary mood like a knife. He’d been observing the commotion from inside the hot tub.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The hell, Kouenji? Aren’t you frustrated, too? Look at the state Sudou is in right now!” shouted Yamauchi. Sudou was still too anguished to be able to stand back up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know. But Red Hair-kun put up a good fight.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The hell, dude? Are you tryin’ to say you can square off against Albert?” said Sudou, the life gone from his eyes. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I am a perfect being. As a man, I possess the ultimate body.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t dodge the question. What are you saying, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003especifically\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji ran his hand through his hair, without getting out of the tub.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There is no need for a competition, precisely because I know that there is \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eno one \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003esuperior to me. So, there is no need to war over something so pointless.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So you say. But it’s not true, is it?” said Yamauchi, baiting him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Kouenji showed no signs of nervousness.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You truly are a fool. However, it might be fun to play along with you on occasion.” He swiped his hair back from his face, looking as though he intended to accept the challenge. “Now then, shall I assume that Aaaalbert-kun is my opponent in this little competition?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhy did he say Albert’s name like that?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. It’s Katsuragi-san!” shouted Yahiko.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Leave me out of this, Yahiko…” said Katsuragi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no way Kouenji can win if he goes up against Albert! On behalf of the Japanese people, I’m begging you, Katsuragi-san, you must defeat him!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, I supposed Yahiko and Kouenji \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewere\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e in the same group. Even though he’d been seated nearby, Kouenji probably didn’t know in detail the kind of fighting power that Sudou and the others held. If Katsuragi, who was an even match for Sudou, stepped forward…then maybe he stood a decent chance of victory.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For crying out loud… All right, just this once,” said Katsuragi, exasperated. He stood to represent the Japanese people, his package swaying left and right as he did. The guys gazed at it as if they were looking upon something divine.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A-as I thought, he really is huge. I mean, even he can’t go up against Albert, but if Kouenji—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh. I see. So you’re not called a king for nothing, eh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please just end this.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, you are no match for \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eme\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e.” But Kouenji made no attempt to get out of the bath.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, hey. You ain’t \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003escared\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e or nothin’, are ya, Kouenji? Or are you all talk, hidin’ your thing away in the tub?” Ishizaki said, trying to needle Kouenji into making a move.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not so foolish as to direct my blade toward an unworthy opponent.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh. In that case, we’ll break your spirit ’til there’s nothin’ left. Right, Albert?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlbert, the great foreign threat, stood next to Katsuragi. When he did so, a strange phenomenon occurred: Katsuragi’s thing looked small in comparison. Upon seeing that, Kouenji’s expression changed dramatically for the first time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Bravo!” He clapped his hands. “I see, I see. As I would expect of the one representing the rest of the world, it would appear that you aren’t all talk.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you get it now, Kouenji? How much of a clown you are?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve had enough of this,” said Katsuragi. After he finished washing off his body, he entered the tub and kept his distance from Kouenji. Everyone ignored him, now completely absorbed in the battle between Kouenji and Albert.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Normally, it is not my policy to show it to men. But this is a one-time deal.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji stood, grabbing a towel and wrapping it around his hips to conceal his weapon.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“S-so you really gonna do it, Kouenji?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe ultimate eccentric and the king were going head-to-head. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve known the outcome of this battle from the start. Now everyone here shall bear witness too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji struck a pose as he removed the towel that had been concealing his lower half. In that instant, a dazzling light hit everyone’s eyes. A mighty sword, complete with a dyed blond lion’s mane. No, it was too enormous to simply be called a sword.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI heard Albert mutter softly in English beside me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, my God,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And thus, I have proven that I am a perfect being.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe guys who’d just borne witness couldn’t even utter a sound.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you even human?” said Sudou. That was all he could say in the face of a power so overwhelming, it crossed national borders. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Sudou and Katsuragi were rifles and Albert was a bazooka, then Kouenji was a tank. Nobody could win against such overwhelming firepower. Its colossal size, armor, and destructive power would take down anyone in its path. There wasn’t a single student in this massive bathhouse that could defeat Albert…which meant none of them who could stand up to Kouenji either. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen, just as everyone was about to hand him the crown…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ha. Hold it, Kouenji.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA voice emerged from the vicinity of the tub that Kouenji had been in moments ago.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“R-Ryuuen…?” someone stammered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen, the former leader of Class D himself, was warming up in the whirlpool bath, near Kouenji. There was fire in his eyes. He must have been watching Albert and Kouenji’s battle.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\
