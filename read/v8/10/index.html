u003e“You can’t possibly think you’re a match for me,” Kouenji said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. Not even I can win against that thing you’re packin’. However, there might be at least one person here who could give you a good fight.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone started looking around at each other as he said that, even though there was no way such a person could exist. Then I realized what he meant.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen had caught me in his trap.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, ho? And \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewho\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e might that be?” asked Kouenji. His interest must have been piqued.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can’t say. But if I’m not mistaken, there is still one person here covering himself up with a towel, hiding his true power.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaving dropped that bomb, Ryuuen entered the bath and turned his back to us. Fortunately, only a few people seemed to buy what he’d said…and yet, everyone’s gazes were intensifying. Somehow, I felt like not just the current occupants of the bathhouse but people all throughout Japan were now paying attention.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No way. A guy like you? No way, dude,” said Yahiko, glaring at me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you really taking what he said at face value?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t intend to, but…it’s kind of curious that you’re the only one still covering yourself up all this time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Curious or not, I just never had any intention of joining this game.” I took a step back.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, fine. But let us check, just in case.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi and Yahiko approached, as though they were trying to flank me. Ryuuen wore a smug smile on his face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI’m gonna make you taste defeat.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat’s what his look and smile said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as I thought…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen, who had no way of knowing what my member looked like, had intentionally set this up. He was intent on making me lose, one way or another. It was a malicious sort of attack, very much like Ryuuen. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could use all my strength and bolt from the bathhouse, but then I’d have to forego bath time while here at the camp. Sooner or later, the veil would be lifted. I\u0026#160;could try to turn the tables and punch out every student here, but that strategy was hardly worth consideration. Either way, I lost. There was no way I could avoid this incomprehensible battle anymore. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji, seeing I wasn’t budging an inch, laughed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ha ha ha! No need to feel embarrassed, Ayanokouji Boy. Even if you happen to be wearing \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eprotection\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, that’s something a lot of Japanese children do. It’s an important thing to protect.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re not protecting anything though, Kouenji.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s because I possess overwhelming strength, you see. I have no need for armor.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had to get out of this. Think. Find a means of escape—\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You guys, do the chant. The chant.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite having dropped out of this competition himself, Ryuuen spurred everyone else on from where he sat in the bath, setting off another of his traps. He countered my strategy, ensuring I could no longer escape.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Take it off! Take it off! Take it off!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAll the guys started chanting, calling for me to take it off. The identity of the person goading them on didn’t matter one bit to them. I was trapped, all thanks to Ryuuen. And all I’d wanted was to wash away my fatigue after a tiring day…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSometimes, you just had to fight. I had no choice but to admit that now was one of those times. And as a man, if you had a weapon, you should wield it. Winning or losing didn’t matter, and nor did pride.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs a man with a weapon, if you have to fight, then you should fight. What was important here wasn’t winning or losing, nor was it something like pride.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fine, whatever.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you want me to put you out of your misery, Ayanokouji? Read you your last rites?” asked Sudou. I\u0026#160;waved him away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone kept calling for me to take it off, so I removed the towel wrapped around my hips, and then…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe chanting suddenly dropped. There was complete silence, as if the unruly noise earlier were just a dream.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“F-for real, dude? Ayanokouji, he…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t believe it…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe guys spoke in whispers. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, well. I’m honestly impressed, Ayanokouji Boy. To think there exists a Japanese person who can hold their own against me. Truly, a margin of a few millimeters might as well be nonexistent.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s like a showdown between two T-rexes…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe guys looked on with admiration and exasperation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You are all living witnesses to history,” said Kouenji, tossing his towel over his shoulder with a laugh. “However, victory is mine. If they are both T-rexes, as you put it, then the difference lies in the number of prey they’ve devoured. In other words: experience.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWithout supplying any further details, Kouenji dipped back in the tub.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol8_INTERIORIMAGES_6\" src=\"/hola-lector-agua/images/books/v8/OEBPS/Images/ClassroomElite-Vol8_INTERIORIMAGES_6.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e4.4\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT WAS 1:00 A.M.,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e well past lights-out, and I was lying awake in my bed. Everyone else was sleeping soundly. I\u0026#160;should have been sleeping in order to prepare for tomorrow. That reason I was still awake lay in the single piece of paper beneath my pillow with the number 25 written on it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe note’s simplicity didn’t leave much to the imagination. The memo represented 25:00—in other words, one o’clock in the morning. I didn’t have any clue about who had put the note there, but I was awake now so I could find out. If it were just a simple prank or something completely different from what I was imagining, then, well, that would be that. I could just use this time to calm down and think about things.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat lay at the heart of this special exam? The bigger picture was slowly coming into view, bit by bit. Of course, this was all speculation, since we hadn’t been told exactly how the test would be scored. But I did know for a fact that there were going to be several things included in this exam. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eZen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe would be graded on everything from our manners at the start of \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ezazen\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to the posture we held during it. If we behaved inappropriately or did anything that got us smacked by the zen stick, we’d probably have points docked for it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eLong-Distance Relay Race.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat sounded simple. A test of our speed. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSpeech.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEvery person in the large group would deliver a speech on four criteria, aforementioned. The grading system for this had already been disclosed. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWritten Exam.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI expected this would focus on the subject of ethics. It sounded like it would be a standard essay-based test.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were other things that concerned me, like “cleaning” and “cooking meals,” but I couldn’t determine how those would be scored yet. In some cases, things like tardiness or causing trouble might also be included in our assessments. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA lot of students were probably agonizing over how to approach this completely different special exam. A strategy, while vital, could only be devised once you understood something’s true nature. The goal of this exam was ostensibly to make us work as a group, support each other, and earn a high average score. Simple, on the face of it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut though it might sound easy at first, you could tell just from watching the groups be formed that this was going to be an uphill battle. It was extremely difficult for students who were normally hostile toward one another to truly cooperate. Horikita and Hirata, to speak of our own class, or Ichinose and Katsuragi, to speak of others, were probably focusing on encouraging such cooperation. Wielding influence within your group and having leadership skills made all the difference. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSelecting the members of your group was important, of course, but it was nearly impossible to tell right off the bat which students were capable of scoring well in this exam. Although Keisei’s academic prowess was nothing to scoff at, and thus, he could be expected to do well in that regard, he seemed to struggle with even the two five-minute sets of \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ezazen\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e on the first day. Some students couldn’t cross their legs at all. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was still too early to tell whether academic or athletic skill would be a good measure of how students would do from here on out. Rather, it was the most adaptable students who were likely to come out on top.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAdditionally, it was probable that more than a few students were opting to pursue strategies that deviated from the basic one of encouraging cooperation. I’d sensed when the rules were explained to us that even the school had struggled to prepare for this rather unorthodox special exam. This had been true of every special exam, of course, but there had always been loopholes in the rules to exploit. Blind spots that the school couldn’t see. Such as how Ibuki and Horikita had traded blows back on the uninhabited island, even though violence was prohibited.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, if you did happen to get caught committing breaking the rules, then the consequences would be huge. The majority of the students probably wouldn’t risk it, with immediate expulsion at stake. Besides, the situation was far too complex for a mere rule violation to secure you a victory. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCould you find a barely existing blind spot, exploit a loophole, and take a shot that would somehow outdo the people following the traditional strategy? A high hurdle to overcome. I’d tried a lot of things in the special exams we’d had so far. On the uninhabited island, I had Horikita retire and switched up leaders. On the cruise ship, I had the trick with my phone. I purposefully drew attention to myself during the Sports Festival. And I shut Kushida down during the Paper Shuffle. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut this time, I’d decided not to take action. I would just sit and observe, continuing to collect information. I had determined that was what I had to do in order to fade into the background and graduate like any ordinary student. Even if that meant Class C took some hard blows this time around, I wouldn’t do anything. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI also wanted to show Sakayanagi and Nagumo, who both had a certain degree of interest in me, that I had no intention of fighting…though I had my doubts about how well that would work. Horikita’s brother couldn’t really blame me for anything if all I did was observe. However, there was one measure I could take, and it was defense. If there were a student out there who was trying to get me expelled, then it was only natural that I would defend myself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was already past 25:00 now, and I had yet to see anything out of the ordinary. If that was the case, should I go back to sleep?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut just then, something happened.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe hallway door cracked open slightly and a little bit of light came through. It was Morse code. They were communicating via the flickering light. Since it was extremely dark in the hallways at night, several flashlights had been made readily available to us, and the person out there was probably using one. Light made no sound. The perfect way to signal me to come meet with them. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI got out of bed and silently stood. Our rooms weren’t equipped with toilets. Getting up to go to the bathroom in the middle of the night was a perfectly natural thing to do.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e4.5\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE CORRIDOR WAS\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e pitch-black, but I could tell someone was moving from the faint sound of footsteps. I followed that sound, and the person holding the light turned out to be Horikita Manabu.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh, to think you’d contact me. Isn’t that kind of conspicuous?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn order for him to place a note on my bed, he’d have to know where I slept. In that case, there were only a couple people who might have helped him. It was probably either Ishikura or Tsunoda, the third-year students who’d played cards with Nagumo. They could have told Horikita which bed was mine.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“More than a few students meet in secret when others are fast asleep. There are probably two or three schemes being implemented during this exam, after all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone—first-, second-, and third-years alike—was pulling out all the stops in order to win. That being said, such clandestine meetings rarely led to anything good. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you know why I called you here?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because Nagumo is acting weird. I can’t think of any other reason.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Exactly. I thought you might have something on him, since you’re in the same large group. Plus, I wanted to respond to the message you sent me back on the bus.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll say this up front: prepare to be disappointed. There’s no sign Nagumo is up to anything strange.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was lying. There \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewere \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eseveral things about Nagumo’s behavior that concerned me. He’d directly challenged the elder Horikita to a contest in front of a huge crowd of people, and losing that contest would be a pretty poor showing for the second-years. Both his upperclassmen and underclassmen would view him with skepticism in the future. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf you were going to do combat in public, you should do so only when you were sure the odds were in your favor. I didn’t sense that was the case here. Since Horikita’s brother had instructed Nagumo to fight fair and square, I’d expected Nagumo to be strict about making sure everyone in our large group paid attention to our lessons…but there was no sign of him doing anything of the sort.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was probably making Horikita Manabu anxious. If not, he wouldn’t have taken the massive risk of contacting me like this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then you think Nagumo is going forward without any kind of scheme?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who knows? I think not involving any third parties really limits what you can actually do.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if you could remind people not to talk in class, doze off, or be late, that wasn’t going to improve test scores by leaps and bounds. At most, it might avoid having points docked. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Currently, our large group is more unified,” Horikita’s brother calmly assessed. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTrue, his group was mostly composed of Class A students, including those from the first year. Whatever the test was, there was a strong chance they’d win. That had to be why he felt anxious about Nagumo’s inaction.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are the odds he’ll go back on his word?” I said. “Maybe he wants to see you lose no matter what it takes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nagumo shows no mercy to those who defy him. He’s employed underhanded methods like Ryuuen more than once. He’s also directly responsible for the second-years’ unusually high expulsion rate. However, he’s never once broken a promise.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You believe he’s serious about not involving any third parties?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita’s brother nodded decisively. He and Nagumo had served together on the student council for nearly two years, and he must have seen how the other boy operated. I had my doubts, but hearing the certainty in his voice gave me that answer. An answer that applied not just to Horikita’s brother, who was before me right now, but perhaps to all the second- and third-year students too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter hearing those words of absolute certainty from him, I felt doubt at first, but then I had arrived at my answer. I could say that for Horikita’s brother, who was in front of me right now, and perhaps for all of the second-year and third-year students as well.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI should give Horikita’s brother some advice here and now. But it probably wouldn’t do much good. He’d already determined that his best defense was to trust in his enemy’s principles.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This has been a waste of time, apparently,” said Horikita’s brother, turning his back to me. “Oh, to answer your earlier question… The student council can influence the special exams. The council is supposed to represent the students’ perspectives and can therefore make significant revisions to penalties or meddle with the rules. However, the council cannot make these decisions on a whim.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, Horikita left.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He might lose,” I muttered, unable to keep it in.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, perhaps that was the wrong word. Horikita’s brother would make no mistakes. He would doubtlessly manage his group well. But even so, we clearly didn’t fully understand this exam. It was possible this would drastically change the course of our third semester.\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 4: A Premonition of Defeat\",\"volumeId\":\"v8\",\"chapterIndex\":10,\"prevChapter\":{\"volumeId\":\"v8\",\"chapter\":9,\"title\":\"Chapter 3: Human Nature Put to the Test\"},\"nextChapter\":{\"volumeId\":\"v8\",\"chapter\":11,\"title\":\"Chapter 5: The First Half of the Girls’ Battle: Ichinose Honami\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Title Page\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Copy
