"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T140fe,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 3:\u003cbr/\u003eHuman Nature Put to the Test\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT WAS PAST SIX\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e in the morning when lighthearted music began to reverberate throughout the room from speakers, clearly a signal for us to get out of bed. The room was still dark. I couldn’t even see sunlight through the thin curtains.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The hell? God, shut up.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki’s grumblings were the first words that we heard. Some students lay in bed even after hearing the music, but most of us slowly started to rouse, sitting up in bed, putting on our glasses, and so on.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess we’re getting started,” Hashimoto muttered with a sigh.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For the time being, it’d be best if we all get up. If even one of us is absent, we’ll get hit with a deduction,” said Keisei, putting on his jersey. As long as we shared a room, collective responsibility was unavoidable.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Kouenji’s not here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good morning, gentlemen. Were you about to search for me?” said Kouenji, entering the room covered with a thin layer of sweat, wearing a pleasant smile. Apparently, he’d gotten up even before we did.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Doesn’t seem like you went to the bathroom or anything.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh. It was such a nice morning, I went ahead and did my training.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What training? There’s no telling what we’re facing today. I can’t approve of you pointlessly exhausting your stamina,” said Keisei. Not that Kouenji was listening. On the contrary, he offered a gleeful rebuttal.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even after a full session of training, I have unimaginable reserves of stamina to spare. This is nothing, really. Besides, if you are so worried about stamina, shouldn’t you have warned the group yesterday?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t…think there’d be any kind of training happening.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, no. I’m afraid that’s not going to cut it. I remember sharing a room with you back on the cruise ship. Surely you recall that I am the sort of man who never skips out on training,” spat Kouenji, as if it were outrageous Keisei would forget such a thing.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Enough with the high-and-mighty act, Kouenji,” said Ishizaki. He wasn’t trying to defend Keisei—everyone was just fed up with Kouenji, who’d been behaving selfishly from square one. He was probably used to being a disruptive element.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe didn’t have time for this now. The thing I most wanted to avoid was being late on the first day. Someone like Hirata would have gotten the group in order, but without a clear leader…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Enough already. Promise us you’ll cooperate.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean, ‘promise’? Have you sworn allegiance to this randomly selected group? I don’t see it that way.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well I don’t wanna cooperate, either,” said Ishizaki, scanning the room and unintentionally settling his gaze on me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because of Class A? Is that the reason why you hate this?” asked Hashimoto, coming down from the top bunk to stand next to me. Ishizaki’s gaze settled on him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tch. It ain’t just ’cause of A. It’s everyone,” said Ishizaki. He turned back to Kouenji. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You seem to be heading down the same delinquent path as Red-Hair-kun,” Kouenji said. “It’s been amusing to watch, but now that I’ve dealt with you directly, I’ve frankly had my fill. Shouldn’t you hurry along to the meeting place? Leave before your incompetence is exposed.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe fact that the only person here who grasped what was happening was Kouenji just added fuel to the fire. He was choosing his words to agitate Ishizaki, and it was working.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, bring it on! Yaaaah!” shouted Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKeisei checked the clock as Kouenji mentioned time and started panicking. “We don’t even have five minutes until assembly. Leave the fighting for later.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ain’t my problem. If we’re late, it’s his fault!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt looked like no amount of water could douse the fires of Ishizaki’s anger now. On the contrary, the flames were just growing hotter. Keisei could see what was happening, but he didn’t know how to manage their feelings in a way that would let him wrap this up. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve got a one-track mind. That’s probably why you got demoted to Class D,” Yahiko commented, only adding more fuel to the fire. The Class B students just watched, waiting for the situation to blow over.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is pitiful. I don’t know whether we’ll make it with these clowns.” Hashimoto sighed. “Well, guess there’s no helping it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe way he said it made me think he was washing his hands of the matter, but then he punched the wood of his bed frame with his balled fist. Everyone except Kouenji reacted to the sound.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just calm down, you lot. It’s fine to duke it out, but this is the worst possible time and place. Get it? If our furniture gets banged up, we’ll be held responsible. And if someone’s face gets bruised, we’ll be in trouble for it. Right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaving cut through the silence with a sound other than his voice, Hashimoto said what needed to be said. Ishizaki, who had been hollering about how our problems didn’t concern him, had to understand now that he was putting even himself in jeopardy.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Four Eyes-kun. What’s your name again?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yukimura.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. It’s just like Yukimura-kun said. There’s no time. So how about you bury that anger deep, deep down, and we go to assembly? If you’re still mad after breakfast, you can decide if you want to beat each other up. That’s what being a group is about, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You should be happy, Kouenji. You get to live a little longer.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, my, yes. I happen to be a pacifist,” said Kouenji.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust what you’d expect from Class A, huh? I didn’t know exactly where Hashimoto fit in the class hierarchy, but he’d expertly solved this problem for us. The fire was still burning, but it was contained for now. We left the room, still cradling a bomb with a lit fuse.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe boys from all three grade levels gathered in one classroom. Approximately forty people, give or take. You could almost say it was like we made one class. The first-year students all extended brief morning greetings to the second- and third-years. Not too long afterward, the teacher entered the room.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m Onodera, the instructor in charge of third-year Class B. We’re going to take roll call now, and then you will go outside and clean your designated areas. After that, you will clean the school building. These cleaning duties will be part of your morning routine for the next week. In the event that it rains, you will be exempt from working outside but not let off work; you’ll just spend twice as much time cleaning indoors instead. As for your lessons—they won’t just be taught by school instructors. There will be individuals coming in to cover a variety of different topics. Please give them a proper welcome and behave yourselves.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that brief explanation, our group went off to clean.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e3.1\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE SCENT OF SOFT RUSH\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e from the tatami mats tickled my nostrils. The space before me made me feel strangely nostalgic. The teacher had escorted us to a spacious dojo, where it seemed we’d be working alongside some other groups.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Starting today, you will practice \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ezazen\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e here in the mornings and evenings.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eZazen\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e? I myself have never before engaged in such an activity,” said the Professor from the other side of the dojo. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe man in charge, hearing this comment, approached the Professor.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-whatever do you want with one such as I?” asked the Professor, looking up at the man. He looked unnerved by the silent, almost intimidating aura the man radiated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The way you speak. Is that something you were born with? Or is it a hometown dialect?” asked the man.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Mayhap I would say that is not the case…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re not a time traveler from the Muromachi Period or the Edo Period, are you?” asked the man.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? No, of course, I myself have never engaged in the luxury of time travel…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. I don’t quite understand what you think you’re achieving by talking like that, but here’s some advice. Fix that ridiculous speech pattern and grow up.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What would someone think of you if you spoke that way to them upon your first meeting? Do you need me to elaborate?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t know why the Professor chose to speak that way, but even I could tell it was a deliberate affectation. He certainly wouldn’t be permitted to speak that way in the real world, or at the very least, in a formal setting. There were no rules against it, of course, but it went against socially accepted codes of morals and manners. You could dig in your heels and defend it as a personal quirk, but very, very few people could successfully get away with that. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, listen up, and listen well. There are people out there who sling their words and actions around without consideration for others in an attempt to stand out. To show that they’re special. This is true not only for the young, but also for the elderly too,” our instructor said sternly. “You don’t need to change your personality to be a part of society. You’re free to express your individuality, of course, but you must take other people’s feelings into consideration as you venture out into the world. These lessons will help you cultivate that mentality, using techniques such as \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ezazen. \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBy bringing your words and movements to a halt, you will be unified with the people around you, merging with the group. Consider others, and finally, think. What kind of person am I? What can I do?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe deliberately directed his gaze over toward the Professor, as if to say, ‘Get it now?’\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I have felt fe—ack, gotta be careful.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe might not be able to get rid of his speech pattern right away, but practicing \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ezazen\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e might teach the Professor to look inward—for instance, at why he’d slipped just\u0026#160;then.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe groups were seated individually and then given a brief explanation. This room was called the \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ezazen\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e dojo. While in here, we were to ball either our right or left hand into a fist and wrap the other hand around it. We had to keep it that way whether walking or standing. Also, we needed to keep it at the height of our solar plexus. That was a stance known as \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eshashu\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. Depending on which sect you were in, there were different rules about how to form your hands. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe received an explanation on one more thing regarding \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ezazen\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. Simply, it was nothing more than one form of meditation. Practicing \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ezazen\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e wasn’t about emptying your head but about forming an image. There was also something known as Ten Bulls, a series of poems and accompanying pictures that illustrated the path toward enlightenment. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was new to this \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ezazen\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e stuff, myself. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“After you’ve crossed your legs, place your feet on your thighs. Practice a lot, because sitting in the lotus position will have an effect on your exam results.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ow. Wait, for real? I can’t even get one leg up.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you are unable to do it at the start, you may instead use half-lotus position, with just one leg crossed.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe man in charge demonstrated the pose. I was able to cross my legs without any problem, so I decided to go with the lotus position. Surprisingly, it seemed a lot of students couldn’t do it…though Kouenji, who was starting to intrigue me, had his legs crossed effortlessly. He wore a faint smile, looking as though he’d already entered a state of zen. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince his posture needed no correction, the man in charge moved past him without complaint. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He can really do it, huh,” said Tokitou in a hushed voice. He was also able to pull off the lotus position.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He doesn’t appear to dislike this kind of thing. That’s a relief.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOur instructor was a scary-looking guy, but this was Kouenji, after all. He might have simply refused to do the lesson. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that all of the students had grasped the general idea, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ezazen\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e time began. However, since we’d spent quite a bit of time having things explained to us, our first session was limited to just five minutes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e3.2\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eFTER MORNING CLEANING\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e and \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ezazen, \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eit was  around seven o’clock—breakfast time. But we were led outside instead of into the large cafeteria we’d used yesterday evening. There, we found a spacious eating area prepared for us. Several groups had already arrived.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The school will provide a meal for you today, but starting tomorrow, provided that the weather is clear, you will be making breakfast with your group. You must discuss how you wish to divide the work with your whole group.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For real? I ain’t ever cooked a meal before,” grumbled Ishizaki. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut if that was the rule, then there was no avoiding it. Preparations for breakfast were underway while we received instructions on how to prepare food from tomorrow onward. It looked as though the breakfast menu had already been set, and handouts on how to prepare the items were being distributed. At least we’d know what to cook.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh, is this all there is?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe meal was simple. A Japanese breakfast, consisting of soup, rice, and three other dishes. For students with hearty appetites, this wasn’t going to be enough. While it seemed we could choose to swap in other dishes, we’d need to prepare everything ourselves.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank goodness for that island test. Compared to that, this is luxury,” said Keisei, sounding somehow relieved, as he began eating.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we’re going to do this fairly, let’s have each grade level take turns at cooking,” said a third-year boy who appeared to be a representative, addressing his mealtime rotation proposal to Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. I’ve got no objections. I’d like to start with the first-years.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How about it, first-years? Any objections?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no way anyone \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecould\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e object. Assuming we had clear weather for the remainder of our time, we’d be making breakfast six times. The order in which we’d be cooking would be different, but that wasn’t reason enough to complain. I wouldn’t say it was unquestionably the kind of thing underclassmen should knuckle under and accept, but I was fine with it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We accept,” said Keisei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Since we’ll be cooking breakfast, what time should we wake up tomorrow?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To make sure we have enough time, let’s wake two hours early,” proposed Keisei. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki vigorously rejected the idea. Keisei’s proposal meant he’d have to be up and ready to go by 4:00 a.m.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Still, we don’t have any choice. If we can’t prepare breakfast, it’ll be awful.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then you guys do it. I’ll be sleeping.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki had never made such statements while under Ryuuen. But in this group, he’d already risen to the top of the hierarchy. It was interesting how his behavior had changed when his status did. Being celebrated as one of the \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edistinguished\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e few who had overthrown Ryuuen probably had something to do with it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t really blame him for being standoffish with me, given I knew what had really happened. Also, being placed in the same group as me must have shaken him. His actions and words weren’t just hurting other people; they were hurting him too. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki and Albert weren’t cut out to be leaders or strategists. They were more suited to be third in command., the ones corralling the rest of the students. Ryuuen should have made sure they kept those roles—though, to be honest, Keisei and Yahiko were similar. They weren’t as foolhardy as Ishizaki, but they weren’t qualified to be leaders, either. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI would’ve thought Class B would take a more active role, but they’d been unusually quiet so far. Maybe they weren’t as proactive as I thought, with the exception of certain individuals like Kanzaki and Shibata. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat made Hashimoto the person most qualified to hold the group together. His prestigious Class A position, together with his ability to assess situations clearly and communicate effectively, were all key. However, he didn’t seem willing to lead.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e3.3\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eFTER OUR PLAIN—\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eno, our \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehealthy\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e morning meal— the real lessons began. Our large group gathered in a classroom that was a bit more spacious than those in the Advanced Nurturing High School. I wondered if it was supposed to resemble a college classroom. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no assigned seating, so it was inevitable that students from the same grade level would cluster in small groups. You could sit in the corner by yourself, but that might gain you unwanted attention from other grade levels. You might even get a warning. Since the second- and third-year small groups hadn’t arrived yet, we first-years had our pick of seats.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Would it be better to sit up front?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, we should probably wait before taking out seats. Shouldn’t the seniors take their seats first, and then we grab whatever’s available?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKeisei didn’t want to run the risk of getting chewed\u0026#160;out. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t go being selfish again, Kouenji. You might end up sitting off by yourself.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we’re free to choose our seats, I believe I shall sit wherever I please.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite saying that, Kouenji showed no sign of sitting down. So he wasn’t \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eentirely \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ean agent of chaos after all. He did actually listen quietly during our normal lessons too. The man just lived by his own rules. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seems like you first-years are struggling a bit,” said a second-year student. “Need any help?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re okay,” replied Keisei, lightly bowing in response. “Ugh. Why do I have to be the representative?” he muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter all, communicating with the second- and third-year students was the representative’s responsibility. Keisei seemed to be under a large amount of stress. If I left him hanging like this, it would only be a matter of time before he exploded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e3.4\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eN THE AFTERNOON,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e we had PE—or rather basic physical fitness conditioning. We were told the main focus would be marathon training, and that a long-distance relay race was scheduled for the last day, undoubtedly part of the final exam. We’d practice outside for a few days, and then later on the track.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huff huff,” panted Keisei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe many tasks we’d already completed since morning had depleted our stamina, and he was struggling. I could have helped him with a knowledge-oriented problem, but when it came to physical fitness, there was nothing I could do but watch.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSurprisingly, Ishizaki and Albert had more stamina than the average student. They made it through practice easily, perhaps because, delinquents though they were, they didn’t smoke.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All I’ve done since morning is analyze things.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor whatever reason, I was growing tired of this. Putting aside the question of whether I intended to play an active role, I’d come to the realization that I wanted to improve our group’s performance enough to keep us safe from expulsion. If we came in last place and scored beneath the minimum threshold set by the school, then Keisei would be expelled. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe likelihood of him taking me down with him was almost infinitesimally low but not zero. If we lost, he might resent me for not offering a helping hand despite seeing him struggle. Should I provide the bare minimum of assistance necessary to save him? Or should I work to put the group on the right track? Maybe I should just observe everything and hope that the problem resolved itself? No—I quickly eliminated that last option.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji’s presence would be a cause for concern too. I should probably make a move sooner rather than later.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI slowed down in order to run alongside Kouenji, who was jogging nonchalantly. Even as I approached, he didn’t even glance at me. He wouldn’t leave his own private world unless I forced him to.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Kouenji. Can’t you go a little easier on them all?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“By them, you are referring to the group, Ayanokouji Boy?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. They’re confused. Not everyone is as incredible as you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ha ha ha, I certainly am one of a kind. However, wouldn’t it be the absolute height of stupidity to hold myself back in order to keep pace with common riffraff?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well…I don’t know if that’s right. But…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you trying to say?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would be nice if the group could score reasonably well. I’d like to avoid expulsion.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If that’s what you want, then you must work hard to make it happen, hmm?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m saying this to you because I intend to work hard.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji didn’t respond, leaving our pounding feet as the only sound we heard. He’d gone right back into his own little world. Guess talking to him was a wasted effort after all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHalf-assed threats or pleas were meaningless when it came to Kouenji. Reflecting on everything that had happened so far told me that much. It didn’t matter if the class joined forces to plead with him or if the teachers put their weight behind us—if he didn’t want to do something, that was that. He was an obstinate, utterly self-involved person.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e3.5\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eP\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eERHAPS BECAUSE\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e it was our first day of classes, or because our marathon training had been so demanding, the rest of the lessons consisted solely of explanations for what to expect this week. It was, however, made clear to us that the primary goal of these lessons was to teach us socialization skills. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, the first-years had no idea what that meant. The second-years, on the other hand, seemed to take it calmly in stride. The experience gap between us was impossible to ignore. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOur final lesson for the afternoon, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ezazen\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, had ended. Keisei collapsed, unable to move.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you okay?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d like to say I am, but my legs feel all numb. Please…give me a minute.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLooked like the lesson had been unexpectedly hard on Keisei. He remained stiff and motionless for about two minutes, waiting until the numbness in his legs subsided. Ishizaki hadn’t done so well with \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ezazen\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e either. He bent forward in agony.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Damn. Okay, food and bath. Yeah, bath. Give me a hand, Albert.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlbert approached Ishizaki, grabbed his arm, and pulled him up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Gah! More gently! Let go!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eThud!\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Ishizaki collapsed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Gaaah!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t help but be amused by watching that interaction play out. The rest of our group, however, just found Ishizaki and those like him a pain in the neck. Keisei moved to leave, ignoring them, but I purposefully held my ground.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They’re an amusing duo, huh?” I asked, deliberately drawing Keisei’s attention.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kiyotaka, just leave them alone. They’re goofing around. Don’t look at them too much or you’ll draw their attention.” Keisei moved in front of me, blocking my view. “He might not be as bad as Sudou, but Ishizaki’s still the type to punch first and ask questions later. This might end up being like Ryuuen all over again.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Still, we’re in the same group. I’m sure they won’t mind a certain amount of contact, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI pointed. Ishizaki noticed us and glared. Keisei flinched, but Ishizaki just left the dojo, dragging Albert with him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re surprisingly bold, Kiyotaka.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was because I knew what was really going on with Ishizaki and his posse. I wanted to find a way to indirectly tell Keisei not to worry too much about it. As long as he was in charge of our group, he had to maintain a certain degree of control over the students from other classes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Keisei, we need to peel another layer off this school.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A layer? What do you mean?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We might need to befriend Ishizaki and Albert to at least some degree.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s ridiculous. We’re in the same group, but we’re still enemies. I can’t befriend them.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLike Keisei, I’d also believed there was no way rival classes could ever get along when I first enrolled here. In fact, the school encouraged us to compete with each other. Lately, however, I’d begun to imagine another way forward.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems Student Council President Nagumo has been able to bring people together, irrespective of class,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s…because he’s charismatic,” said Keisei. “Or he’s just special. I don’t have that kind of talent… In fact, that’s not something anyone outside of Class A could even do, right? We don’t know what Nagumo-senpai’s planning, or if his methods will work all the way to graduation. But no matter how much he unites the second-years, the ones who graduate from Class A will have the last laugh. The rest will be left in tears.” With that, Keisei left the dojo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e3.6\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eFTER DINNER,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I decided to head back to the room  before the others. There were a few people gathered in the hallway, both guys and girls, making me think something was wrong.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, sorry. Are you okay?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. No need for concern.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi, a member of my class, reached his hand out apologetically. It looked like he’d knocked over Sakayanagi Arisu from first-year Class A. She didn’t take Yamauchi’s hand but instead tried to get up herself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol8_INTERIORIMAGES_3\" src=\"/hola-lector-agua/images/books/v8/OEBPS/Images/ClassroomElite-Vol8_INTERIORIMAGES_3.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe couldn’t do it unaided, though, so she grabbed her cane, which lay on the ground. Then, leaning against the wall, she slowly got back up. It didn’t take her long, but with everyone staring at her, it probably felt like an interminably long time to Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi awkwardly retracted his hand.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, uh. Guess I’ll be going?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. Don’t mind me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi smiled lightly and looked away from Yamauchi. Everyone began to disperse, looking relieved the issue hadn’t escalated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sakayanagi-chan sure is cute, but she’s also clumsy,” muttered Yamauchi. Apparently, it hadn’t even occurred to him she might’ve fallen because \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehe \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ebumped into her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSomehow, Sakayanagi’s gaze had found mine. “Are you okay?” I asked her as I approached.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you ever so much for your concern. However, it’s nothing major.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll talk with Yamauchi later.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, he didn’t do it on purpose. I just fell, that’s all,” said Sakayanagi with a chuckle. But her eyes weren’t laughing. “Well, then. Please excuse me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKamuro was usually by her side, but wasn’t here. She’d probably been placed in a different group. I had no way of knowing how things were going with the girls, and I didn’t care, either. However, as Sakayanagi started to leave, she stopped and glanced back at me. Did she feel me staring?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I remembered something I wanted to discuss with you, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe tapped her cane once, a thin smile on her lips.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Class B is quite unified. Ichinose Honami-san has earned the trust of her comrades by giving it her all. However, what if they’re trusting her too much?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That has nothing to do with me,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut Sakayanagi continued, not caring what I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There was a rumor going around about her. She’s said to possess a tremendous number of points, despite her lack of significant achievements—enough points to even warrant an investigation by the school, I hear. It shouldn’t be possible for a single student to earn so many points alone. She’s likely the treasurer for Class B. Don’t you think?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who knows? Only Ichinose or her classmates could answer that question. Why tell me this?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m saying, is it wise to entrust her with all of those private points? For example, if she suddenly needed a large number of points to protect herself after making some mistake, or to save a classmate, no one would blame her for it. Perhaps she’s acting as treasurer for that purpose.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Probably, yeah.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, if she squandered a large sum of points purely to serve her own goals, the school might investigate on the basis of fraud.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn any case, this wasn’t about me. This applied to no one else but Ichinose and the students of B Class. If Ichinose really was acting as their treasurer, then the students who had deposited their points with her would be the ones who had the right to complain about it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t imagine Ichinose using private points for selfish reasons, though,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose that’s true. At the very least, no one doubts her. Yet.” In other words, she was implying that might change. “I do so look forward to finishing this special exam and going back to school.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLooking satisfied, Sakayanagi turned and walked away without looking back.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e3.7\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHERE WAS ABOUT \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eone hour left until ten o’clock, which was lights-out time. None of us really had anything to talk about, so we sat around in our shared room in silence. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBreaking the ice was proving to be surprisingly difficult. Even if you made an effort to initiate conversation with someone from another class, it could easily feel forced. Ideally, someone would bring up a topic we could all chime in on, but seemed like it might be too much to hope for.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTrying to force conversation would be off-putting. If only someone would strike up a conversation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA knock came at the door. Apparently we had a visitor.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who could that be?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone looked perplexed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe it’s a teacher,” said Ishizaki disinterestedly. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was certainly a possibility. Keisei got up, went to the door, and asked who it was. The answer was surprising.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you still awake?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Student Council President Nagumo! Is something wrong?” asked Keisei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I came to check on you since we’re in the same group. Can I come in?” asked Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere probably wasn’t a single first-year student brave enough to refuse him. Keisei immediately complied. Apparently, Nagumo hadn’t come alone. Vice President Kiriyama and two other third-year students accompanied him: Class B students named Tsunoda and Ishikura. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce inside, Nagumo scanned the room.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It appears all the rooms are identical, senpai,” he said to Ishikura with a grin.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It looks like it. Now, how exactly do you plan to deepen our bonds of fellowship by bringing us to the first-years’ room?” asked Ishikura. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe question was directed at Nagumo, but Keisei, not understanding what he meant, spoke up. “Bonds of fellowship?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I already told you, didn’t I? I came to check on you, since we’re in the same group. We don’t have TV or computers or smartphones. There’s nothing remotely resembling entertainment. But it’s not like we have nothing to play with,” said Nagumo, pulling a small box from his jersey pocket.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Cards?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re probably thinking, ‘Cards, in this day and age?’ Well, cards are a staple game at camps like this.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo sat down in a random spot, peeled the plastic tape from the sealed box, and opened it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Take a seat, senpai. Sorry first-years, but there isn’t much space. You stay in your beds,” said Nagumo as some of the first-years began to get up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not playing,” said Tsunoda. He turned his back to Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, don’t say that. Let’s play. It might help us chat a bit more freely,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTsunoda stopped in his tracks, seemingly giving up, and took a seat. Ishikura sat beside him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We should bet something to make the game more exciting. Any ideas?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe first-year students, nervous in the presence of upperclassmen, said nothing. They didn’t know how to address the student council president, and Nagumo, of course, had anticipated they would shrink back that way.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We decided on the order in which people will making breakfast, right?” he said. “Let’s bet on that. If, for example, you lose constantly, you’ll be on meal duty until the end of camp. On the other hand, if you never lose, then you never have to cook breakfast.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Nagumo. Shouldn’t we discuss that with the entire group?” said Ishikura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s only breakfast duty. Come on, give me that much. Please.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was the acting student council president for our school, and yet he was so completely casual in how he talked, even to seniors. The other third-years seemed unable to respond. They probably knew of the tension between Nagumo and Horikita Manabu and didn’t want to get involved.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fine. Let’s decide by playing cards.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re okay with this?” Keisei asked the other first-year, sounding slightly apprehensive. Ishizaki, Hashimoto, and the others nodded, as did I. The others eventually nodded too—except Kouenji.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kouenji, you object to this?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo should’ve just ignored him. Their little exchange in the gymnasium this afternoon probably made him want to poke the bear.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I neither approve nor object. The majority has already spoken.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t care about the majority. I want to know what you think.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then allow me to answer, student council president. I haven’t the slightest interest in this exchange. I don’t care enough to either approve or object. Does that satisfy you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji’s comments seemed designed to cause more problems. However, Nagumo let loose an unexpectedly amiable laugh.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why don’t you join the student council, Kouenji? I’d love to have someone as interesting as you aboard. I’ve heard you’re fairly accomplished in both academics and athletics too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone in the room, including the third-years, was shocked. Kouenji was the only one who didn’t react.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s quite unfortunate. I have no interest in the student council.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose you wouldn’t. Well, you’re welcome any time. If you do happen to develop an interest, call me. Now then, how about we get this card game started?” Nagumo looked away from Kouenji.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What game exactly are we playing?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How about something simple. Old Maid? The person holding the joker in the end loses. Two players from each grade will participate in six games total.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wasn’t very familiar with cards, but even I knew about Old Maid. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The participating students are free to switch out. Just don’t switch in the middle of a round,” said Nagumo, shuffling the deck.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce he was done, he handed the cards to the third-years so they could shuffle as well. To truly ensure that no one could tamper with the cards at all, the deck was then handed over to the first-years to shuffle. Keisei shuffled while he looked at us, seeking one other student to participate. Since there were no volunteers, Hashimoto raised his hand with a look of resignation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e3.8\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eO\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eUR GAME OF\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Old Maid with first-, second-, and third-years had begun. Each grade level was scheduled to take two turns at rising early to make breakfast. So if you played six games of Old Maid with five wins and one loss, you’d still be fine. Four wins and two losses would be okay too. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Playing silently isn’t fun at all. Let’s chat,” proposed Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe received the deck back from Keisei and dealt the cards.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll deal the first round. From the second round onward, the loser has to shuffle and deal.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe players nodded in agreement. Nagumo hadn’t looked at me once since entering the room. Even though we’d already met during winter vacation, I apparently didn’t exist to him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, first-years who aren’t playing…just relax. Pretend we’re not here. Being nervous around your seniors all the time will affect your performance this week.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo could say that, but we couldn’t be as relaxed as we had been a little while ago. Except Kouenji, who ignored them completely and went to sleep.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI decided to quietly observe the game to the end.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even though it’s just a game, we can’t lose to the first-years, senpai.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unfortunately, I don’t have the best luck. If you expect too much of me, you’ll be disappointed.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’ll be fine. I think my senpai are all pretty strong. You won’t lose the first or second game.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite this being a game where chance dictated much of the outcome, Nagumo brimmed with confidence. They were already approaching the game’s halfway point.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Done.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshikura successfully got rid of all of his cards. Vice President Kiriyama was next, and Nagumo was third. The second-years clinched victory quickly, adding pressure to the first-years.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Done.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto put down two cards with matching numbers, bowing to the third-years as he did so. The remaining players were Keisei and Tsunoda, a third-year. For\u0026#160;such a tense game, the players seemed rather calm. Keisei had two cards left and Tsunoda one. That meant Keisei was holding the joker. If the third-year picked the joker, Keisei would be the winner. But after some deliberation, Tsunoda picked the winning card.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That settles it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I lost.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe first round ended with Keisei’s defeat. The first-years had to make breakfast at least once.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s keep calm. Losing once or twice isn’t a big deal,” said Hashimoto. Keisei nodded but seemed apologetic. He was probably worried he’d lose another round.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, I already told you, didn’t I? The loser collects the cards and deals them,” Nagumo said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“S-sorry,” said Keisei, collecting the cards in a panic.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe second round soon began. From where I was seated, I could see one of the third-years’ cards. He had the joker. He held it until about halfway through the round but eventually passed to another student.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe final two players were Kiriyama and Keisei. Keisei couldn’t help but look incredibly nervous at being in the one-on-one showdown for the second time in a row. On top of that, judging from the number of cards remaining, I knew that Keisei was holding the joker. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKiriyama slowly, hesitantly picked a card. Keisei struggled to keep his poker face, but he hung his head in defeat. Within the span of a few minutes, the first-year students had suffered two consecutive defeats. Yahiko, who had been watching the situation unfold, signaled to Keisei that it was time to switch.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Probably for the best,” said Nagumo. Hearing that, Keisei obediently tagged out and let Yahiko in.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not good at games like this. Sorry, we’re counting on you,” Keisei said, settling down to watch the first-years battle. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, Yahiko was probably nervous to face off against seniors. However, perhaps because he was used to treating Katsuragi with the deference due an older student, he seemed relatively calm. Still, composure might not have helped much with Old Maid. I didn’t know how much skill was involved, but you probably needed at least some luck not to draw the joker.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think it’s time to let the first-years have one,” said Nagumo, perhaps feeling slightly bad that we’d lost multiple times in a row. “By the way, Ishikura-senpai. How’s the club been lately?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought you weren’t interested in basketball.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I am. I mean, I’m not as interested as I am in\u0026#160;soccer.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We had some pretty athletic first-years join, so we might expect some good things next year. We didn’t really achieve much this year, pathetic as it is to admit that, as the captain.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSeveral first-years had joined, but he was probably referring to Sudou, whose skill had even caught the attention of even a retired third-year.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m looking forward to it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You seem like you’re devoting all your time to the student council. Don’t you have any lingering attachment to soccer?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wasn’t planning to go pro or anything. Besides, I can continue playing soccer wherever. Being student council president here was really appealing.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s good that you’re putting in effort as president, but I don’t like you picking fights with Horikita.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t mean to pick a fight. I simply want my senpai to acknowledge me, especially when I’ve admired him for a long time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshikura shot Nagumo a glance but then looked away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m first this time,” said Ishikura, laying his cards down flat.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m in, too,” said Yahiko right afterward. He happily placed his final two cards down. For the first-years to win, Hashimoto had to pull through. The number of cards in his hand was decreasing, but all that mattered was who held the joker.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter another second-year student took third place, Hashimoto also got rid of his cards.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, ho, looks like the firs-years survived this time. Congrats.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you very much, Nagumo-senpai.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe final players were Nagumo and Tsunoda. However, Nagumo had the advantage, with a 50 percent chance of victory.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Here goes,” said Nagumo, claiming the card on the right. However, he’d grabbed the joker. “Too bad.”\u003c/span\u003e\u003c/p\u003e\r\n\
