e=\" font-size: 1.00em;\"\u003e“…What does that mean?” said Ishizaki, seemingly directing his question at Keisei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It means we play fair and square, based on our abilities and nothing more. To put it simply—no dirty tricks. No kicking our opponents while they’re down, like Ryuuen likes to do,” Keisei answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIgnoring Keisei and Ishizaki, Horikita’s brother and Nagumo continued with their discussion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you don’t agree to my conditions, I won’t accept your challenge,” said Horikita. In all likelihood, the ultimatum was meant as a way to hamstring Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So I can’t win by attacking Horikita-senpai’s pawns, huh? Fine.” I’d expected him to object, but surprisingly, Nagumo agreed readily enough. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Horikita’s brother wasn’t finished.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This isn’t limited to my group. I refuse to acknowledge any methods that cause harm to spill over to other students either. Our competition is invalid the moment I determine you’ve been meddling in others’ affairs.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just as I’d expect, senpai. You miss nothing. I’d considered recruiting other groups to launch a joint attack, but…” Nagumo smiled audaciously. “Well, since I’m the only one who really wants to compete, I don’t mind agreeing to a certain number of conditions. All right. Fair and square, let’s see who scores higher and works better as a group or whatever. Ah, let me say this, though—no need to penalize the loser, yeah? After all, our pride is what’s on the line here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita’s brother said nothing to either confirm or deny that. That probably meant he didn’t even intend to put his pride on the line for this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e2.4\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eW\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eITH THAT,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the long opening act was finally at an end. But then Nagumo called out to our small group, stopping us in our tracks.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey. Now that the seniors are gone, it looks like you guys haven’t decided on a representative yet.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? How could you tell?” asked Keisei, sounding slightly panicked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When I suggested everyone play rock-paper-scissors, it took a minute before you stumbled out. If you’d had a representative picked, he’d have stepped forward right away. I noticed one other group had a delayed reaction too. I’m thinking the groups that couldn’t decide on their representatives were probably the ones with a more balanced mix of three or four classes,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo probably didn’t know each and every one of the first-year students. Even so, he had correctly deduced how our groups were divided, which wasn’t something just anyone could do. Any delays on our part had been minor. We hadn’t discussed it; I’d just shoved Keisei and he’d immediately stepped up. Most people would never have noticed anything wrong.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d been trying to avoid exposing what could be construed as a weakness in our group. I guess my attempt had been in vain. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought the school didn’t mind if we decide on a representative later.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. But we want to know who the first-year representatives are. I want everyone to be aware that it’s better to select a representative early on. The later someone assumes that role, the more time they have to spend playing catch-up.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wasn’t sure how accurate that was, but Nagumo’s meaning was clear. He wanted us to select our representative now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…What do we do?” asked Keisei, directing his question to the group. Other than me, he wasn’t very familiar with its members and probably didn’t want to be pushed into the role.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However you decide is fine. Pick a representative now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf the student council president was giving us a direct order, then even ostensible delinquents like Ishizaki and Albert couldn’t object. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No one’s gonna volunteer for this. How about we go with rock-paper-scissors again?” said Ishizaki, balling up his fist. I agreed. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe nine of us formed a circle. Nine fists. That meant we were short one person. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Kouenji,” said Keisei. Kouenji was looking out a window and didn’t even bother acknowledging us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Blondie. Hurry it up,” said someone from the second-years, their voice containing a hint of anger. Kouenji finally turned around—and said nothing about rock-paper-scissors. Only his hair. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh. You find my hair to be a truly exquisite shade, do you not?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kouenji, get serious.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“About what? Is a game of rock-paper-scissors what you’d call serious?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, first-year. Kouenji, right? Are you mocking us seniors?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs expected, Kouenji was already drawing attention to himself. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Mocking you? I am not mocking anyone. I have absolutely no interest in you at all.” He might have intended to convey that he wasn’t mocking them, but of course, this had the exact opposite effect. “I will not participate in rock-paper-scissors. I have no interest in being representative.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not interested in being representative either. Neither is anyone else. But this is the only option,” said Keisei exasperatedly. But Kouenji showed no sign of complying.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You say bizarre things, boy. If you don’t want to do something, then there’s no reason to participate. Don’t you agree?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. Those are the rules.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The rule is that someone from the group must become the representative. In that case, someone other than me will do it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Stop screwing around. Being selfish ain’t gonna fly here,” snapped Ishizaki, who once had fought with Kouenji, together with Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh. In that case, why not go ahead and make me the group representative?” said Kouenji, brushing his bangs aside. Ishizaki froze.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then you’ll be the leader. You’re okay with that?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You are free to push that job onto me. I have no intention of objecting to each and every little thing. If we have no representative, then the group will be punished, yes? If you’re afraid of that, I’m fine with this option,” said Kouenji.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, what he said next left everyone dumbfounded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I will do whatever I want to do. If I don’t want to do something, then I absolutely will not do it. This means I won’t be fulfilling the duties of the representative. It doesn’t matter who seeks to consult me; my resolve will not waver. I may even boycott the exam. Even if that results in our scores dropping below average. Even if that results in someone being expelled. Okay?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s… If you do all that, you’ll get expelled too!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh heh. Yes, I suppose so.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was like he didn’t fear expulsion at all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, this talk is really just silly. Even if I do get a zero on the exam, our average score is unlikely to drop to dangerous levels as long as the rest of you put forward your best efforts,” said Kouenji, combing his hair.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut there was no guarantee that was true. It was just Kouenji’s self-serving interpretation that the exam wouldn’t be that difficult. Or perhaps he just wasn’t thinking it through, because he just didn’t care. In any case, his brand of \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003euniqueness\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e had been thoroughly proven for all to see.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Talk about a weirdo. He must have a few screws loose,” muttered Ishizaki, taking a step back and nodding.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, I’d noticed a contradiction in Kouenji’s words. Ishizaki and the others probably didn’t see it, because there were no falsehoods in what Kouenji was saying and doing. Which meant that if he’d intentionally created that contradiction, then…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTo find out for sure, I’d have to risk waiting until exam\u0026#160;day.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well whatever. He probably doesn’t have the guts to get a zero or anything. Just make him be the rep.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki wanted to force the troublesome and risky role of representative on Kouenji if he could. Looking at it from another class’s perspective, this meant losing the chance to earn double points. There was also the possibility of someone getting dragged down via the solidarity rule. But if Kouenji really did boycott the exam, the consequences would be dire…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Knock it off, Ishizaki. If you keep that up, you’ll be the one getting dragged down,” said Hashimoto.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But… Damn it. All right, fine, if you can get whatever you want by being a stubborn asshole, then I definitely ain’t bein’ representative either.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right,” said Hashimoto, nodding in exasperated acceptance.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNobody thought that our group would take first place, evidenced by the fact that no one wanted the role of representative. This might prove to be more difficult than I’d imagined. If Kouenji continued to act like, well, himself, we’d lose a considerable number of points. He was the chaotic element the second- and third-year students hadn’t factored into their calculations. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut then someone stepped forward and interrupted our conversation to comment on Kouenji’s bizarre behavior.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even I’ve heard rumors about you, Kouenji.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo, who’d never have a reason to interact with Kouenji under normal circumstances, approached him as though he had found something of great interest. Well, this was unexpected.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know about you too. You’re the new student council president, are you not?” asked Kouenji, brazen as always.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Act the fool as much as you like, but do you really not care about being expelled?” asked Nagumo. “The way this school’s set up is a pain, but despite that aimless attitude of yours, you’ve gotten this far. It must be ’cause you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edo\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e want to graduate from here. But you’re fine with having the role of representative foisted on you? \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAnd \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eyou say you’ll boycott the exam? Bullshit. You just don’t want to put in the effort to reach Class A. But you don’t want to be expelled either.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh heh. You say some rather amusing things. How can you be so sure of my ‘bullshit’?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was with Nagumo on this, though. Shortly after Kouenji had enrolled here, he’d been asked whether he had any intention of trying for Class A. He said he wasn’t interested. That he only wanted to graduate.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe didn’t want to get expelled, but he didn’t want to climb the ranks either. Much the same as what I was hoping to get out of this school. Even if he held back on the exams, he’d be fine. That’s why he was so self-assured.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s written all over your face,” said Nagumo teasingly. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji laughed cheerfully. “Bravo, bravo.” He applauded. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eClap. Clap.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen he answered honestly, almost as if delivering a confession.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I lied because I don’t want to be the representative. Please allow me to set the record straight. I have no desire to aim for Class A, but neither do I have any intention of getting expelled. In light of both those desires, I think an aimless attitude is perfectly acceptable,” said Kouenji.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo apparently wasn’t ready to accept that. “You have no interest in Class A, huh? That’s a lie too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My, oh, my. Have I already been branded as a liar?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re not lying, then I’m curious about something, Kouenji. As of now, do you have a surefire way of graduating from Class A?” asked Nagumo abruptly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone was shocked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh? You do say some rather \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003einteresting\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e things. Please, dazzle me with your logic.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You sure? If I explain the logic, then that surefire plan of yours will become unusable. No. I’ll \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003emake \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eit unusable. Understand?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh. I don’t mind. I want to know whether or not you have any idea what you’re talking about.” Rather than act frightened, Kouenji smiled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You plan to be promoted to Class A by using twenty million points,” Nagumo said. “It’s a strategy everyone’s considered at least once, but of course, it’s not easy to accumulate that many points. Not impossible either, though. Right after you enrolled here, you looked into what happens to third-year students’ remaining points when they graduate.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Keep going.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Upon graduation, private points are ‘cashed in,’ meaning they can be used even outside of the school. Their cash value in the outside world is naturally less than the equivalent on campus, but it’s still quite an extraordinary system. You intend to buy private points from third-years by paying them more money than they could earn by cashing them in. Right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone looked understandably thrown for a loop, unable to hide their shock. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji, hearing his strategy explained to him, gave a satisfied nod. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Precisely. I came to that conclusion shortly after enrolling here. No matter how far I plummet during my time here, if I can obtain private points through legal means, I can graduate from Class A. Ever since then, school has become boring to me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA miraculous gambit, and one available to him precisely because he was rich. Buying private points from students who’d given up on Class A, or from those whose victory was already secured, or from students close to graduation… It wouldn’t surprise me if many students opted to take such a deal in exchange for guaranteed cash. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat said…buying points for the same price they’d net if cashed in, alone, would be twenty million yen. Not the kind of funds a high school student could reasonably be expected to have access to. Would people even believe him if he said he was good for it?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fortunately,” Kouenji continued, “before I enrolled here, I had my picture and profile posted on the company website, proving I’m next in line to be president. I have tens of millions of yen at my disposal. It was easy to convince people to trust me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. I’m aware some second-years are planning to sell their points to you, and I bet a fair number of third-years are, too. You’ve gotten people to keep mum about it, but more than a few second-years have put their absolute trust in me. Some of them consulted me, asking if they should take you at your word. Of course, I said it was all right. It’s not without risk, but you seem to be a fairly rich guy.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo looked over the assembled second- and third-years.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, that ends today,” he said. “Even if he really is rich, Kouenji isn’t a man you can trust. As you just saw, he lies without batting an eye. It’s best not to do business with him, even by mistake. Oh, and by the way, I intend to raise this issue with the school. Purchasing private points prior to graduation shouldn’t be allowed in the first place, after all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s fine by me. I’ve merely been making plans to move up to Class A. I hadn’t decided if I was going to carry it out.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji seems to have envisioned this as but one strategy of many. What an outrageous idea. Well, truth be told, it was just the one-of-a-kind strategy that only a rich kid like Kouenji could pull off.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought you were weird, but you came up with that strategy all on your own, huh? Impressive,” muttered Hashimoto, sounding both impressed and exasperated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s Kouenji planning to do by abandoning his own strategy then?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSeveral gazes fell upon Kouenji’s classmates: Keisei and me. We had no idea…though one thing came to mind. A rich kid like Kouenji didn’t \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eneed\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to graduate from Class A. Even if he hit upon a way to make it to Class A, he didn’t need to actually implement his idea. If his only goal was to graduate—irrespective of class—then making allies and cooperating with other students \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewould\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e be rather pointless. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt would explain why he didn’t care if Nagumo blew the lid on his plans. Maybe he’d even enjoy coming up with another strategy. Nagumo’s insight into Kouenji’s affairs was quite remarkable. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This was the first time I’ve ever seen Kouenji get busted,” muttered Keisei. I had to agree.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd yet…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, Student Council President, this only proves I have no real reason to play rock-paper-scissors for the position of representative. Now that my plans have been revealed, I can simply say I have no intention of taking on the role.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhatever tricks Kouenji might still have up his sleeve, his stance hadn’t changed. On the contrary, he had exposed his own lie—which was also his only vulnerability—and tossed it out himself. This left us with no way to force the role of representative on him against his will. Someone with his degree of wealth and privilege had no reason to fear expulsion; I couldn’t imagine his future being tarnished at all by such an event. We \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecould \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ehypothetically resort to drastic measures to railroad him into being the representative, but no one in our group dared try something of the sort. If we lost, he might take one of us down with him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess I should do it,” said Keisei, raising his hand resignedly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSome of the students from other classes reacted to that. But with delinquents like Kouenji, Ishizaki, and Albert in the group, and because we had little chance of winning, no one challenged Keisei for the nomination. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s settled.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo dismissed the group, and we left the gymnasium as instructed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e2.5\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003e“T\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHIS SEEMS…\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ea lot older than I thought it would be.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe small groups were shown to their dorm rooms, each of which had wooden bunk beds matching the number of people in the group. Ishizaki immediately walked to the bed at the back of the room and climbed to the top bunk.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This one’s mine.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you talking about? You can’t just stroll up and take what you like. That’s not fair,” snapped Yahiko.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know what they say. The early bird gets the worm,” said Ishizaki. He snorted and lay down, sneering at Yahiko.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We should discuss who gets which bed.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKeisei, our representative, tried to rein in the situation. Ishizaki probably meant to defy him just as he had \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYahiko, but I was standing right next to Keisei, and his gaze met mine for an instant. He’d been trying to avoid making eye contact with me, but being in the same group made that a foregone conclusion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tch…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor a moment, Ishizaki looked terrified. He hopped down off the bed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, so. How exactly do we decide?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKeisei tilted his head to the side, looking puzzled by Ishizaki’s sudden change of heart. Ishizaki may have interpreted Keisei’s warning as being a warning from \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eme,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e which was frankly paranoid. Honestly, I didn’t think it was all that strange to claim our beds on a first-come-first-served basis, really—although naturally, coming to mutual agreement after fruitful discussion would be more ideal.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh heh. Well, I suppose I’ll go ahead and help myself,” said Kouenji, leaping up onto the bed that Ishizaki had been occupying.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What the hell, man?!” shouted Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut this was Kouenji. Common sense didn’t apply to him. He ignored Ishizaki and relaxed into the bed; within moments, he was as at ease as if this were his own bedroom.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“God damn it. To hell with discussion.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter what Kouenji had done, people started to call dibs on beds. Ishizaki gave up on arguing with Kouenji and claimed the top bunk of a different bed. Everyone seemed united in their preference for a top bunk, save Albert, the only heavyset person here, who settled into the bunk beneath Ishizaki without any complaints.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe unspoken consensus seemed to be that discussion was no longer how we were doing things. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Guess this is the only spot I can take,” said Keisei, securing the bed underneath Kouenji. Unsurprisingly, no one else wanted to take it. The others might not have noticed, but it was significant that Keisei was willing to do the things no one else wanted to do. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the end, I settled on a bottom bunk beneath Hashimoto from Class A.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nice to meet you. Um…” Hashimoto reached his hand down from the top bunk in greeting. He didn’t seem to know my name. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m Ayanokouji. Nice to meet you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hashimoto.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe shook hands lightly, as if promising to get along.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe were now free for the rest of the day and, as such, abandoned all pretense of group unity to just do whatever we wanted. A natural-born leader like Hirata might have tried to get us talking, but…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs for me, my feelings were fixed. While it was unfortunate that I wasn’t getting to know any students from other classes better, it was also a relief to not have to deal with annoying small talk. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This might be a stupid question, but can Albert speak Japanese? He understands Japanese, right?” Hashimoto lay on his top bunk, directing the question to Ishizaki and Albert.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course he does. Right, Albert?” answered Ishizaki, peering down at his friend. However, Albert just continued to stare straight ahead in silence. “Or maybe he doesn’t.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aren’t you guys classmates?” Hashimoto laughed. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know, all right? Ryuuen-san’s normally the one giving orders,” replied an irritated Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ryuuen-\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003esan\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki’s respectful—and contradictory—use of the honorific was interesting.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is it true you guys had a fight and ousted him as leader?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“God, shut up. Of course it is. Calling him ‘san’ was just…old habits, that’s all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRather than come together as a group, we were already sniping at each other. I decided to escape the escalating conflict and take a walk around the building.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e2.6\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eF\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eINALLY, IT WAS \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003emealtime. The first time we’d seen the girls since getting off the bus that morning. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe cafeteria was quite spacious, so much so that it even had stairs to a second floor with a view of the first. From what I saw, this place could apparently fit about five hundred people. And it was currently packed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not easy to meet up with someone when we don’t have our phones.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita and Kei were probably looking for me, but I didn’t set out to search for them. If they did happen to run into me, their reactions would probably be polar opposites. Horikita would probably snap at me for avoiding her, while Kei would wait and see what happened, understanding that since I hadn’t sought her out, there was no reason for us to make contact right now. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTouching base with various students on the first day was to be expected. I doubted many people had eyes on me, but it was quite possible that Sakayanagi and Nagumo were watching. Even though I could say that Hirata and Satou had only been hanging out with us over Christmas, Nagumo understood that I had a special relationship with Kei. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wanted to avoid conspicuous contact.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI stayed solo, observing who was hanging out with who. But first, it was time to eat. The strict allotted hour was precious. I carried my tray over to my seat and sat down alone. Back at school, students would be separated by grade level to a certain extent, but here, first-, second- and third-years mixed together.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMany of the small and large groups stuck together, but there were more than few students scouting for information. More importantly, this was the only place and time we got to see the girls, making it the only time couples could spend together.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSiiiigh\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI heard a cute, exhausted sigh be released near me. It belonged to first-year Class B’s leader, Ichinose Honami. A bunch of guys and girls were crowded around her. I\u0026#160;decided to sit nearby and listen in on their conversation, confident I’d remain relatively unnoticed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Pathetic to be proud of taking up so little space,” I muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose and the others didn’t react to me at all. Well, the cafeteria was crowded. They couldn’t pay close attention to every single student.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good work, Honami-chan. Was it tough?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah ha ha. Well, I suppose it was, yeah. I thought deciding on a group wouldn’t be so bad. But when people wanna fight, they’re gonna fight.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nothing we can do about that. The other classes are enemies.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But according to Kanzaki-kun, the boys came to a decision pretty quickly.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Really? It took us until past noon.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe boys hadn’t had an easy time of it, but it sounded like the girls had struggled even more than we had. Maybe the instructors had anticipated that, which explained why there weren’t any classes on the first day.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you think someone might get expelled?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I can’t say there’s no reason to worry. Even though no one’s been expelled from the first-year classes, we can’t let our guard down.” It seemed Ichinose was acutely aware of the danger.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What should we do if someone gets taken down by the solidarity rule?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’ll be okay, Mako-chan. As long as we take this seriously, it’s not going to come to that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you sure?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If that time does come, we’ll all help each other out,” said Ichinose gently. Though she looked the most exhausted of them all, she remained stout-hearted as ever. “Ahh… I’m beat.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe laid her head on the table. Unfortunately, that change of position allowed her to notice me. \u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol8_INTERIORIMAGES_2\" src=\"/hola-lector-agua/images/books/v8/OEBPS/Images/ClassroomElite-Vol8_INTERIORIMAGES_2.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kuuun!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eOh, hey, Ichinose. Didn’t notice you there.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e If I said that, it’d come off as unnatural. It was probably best to just answer honestly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sounds like you were having fun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Some girls find power in gossip,” said Ichinose, flopping over once again. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t really understand what she meant. This listlessness was kind of surprising, coming from her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose I probably shouldn’t do that, huh?” said Ichinose, sitting back up straight. I stopped her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s normal to do something like that when you’re exhausted,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry for making you kind of uncomfortable.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wasn’t uncomfortable at all, but I couldn’t speak those words aloud. “Sounds like you got put in a tough group,” I said instead.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess you could say it’s been tough just getting the groups together… Like, girls are really up-front about their likes and dislikes. Or rather, there are more than a few girls who are willing to just tell another girl they don’t like her to her face. I suppose guys tend to keep their personal feelings on the down-low, huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They’re pretty up-front about hating Ryuuen, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I feel bad for laughing at that, but I guess there’s no helping it. Still, isn’t Ryuuen-kun tired of it too? Being disliked by everyone has to be draining.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe wasn’t wrong, but the logic probably didn’t apply to Ryuuen. If anything, he seemed to be taking it pretty easy now that he was no longer shouldering the burdens of an entire class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t work yourself too hard.” Concluding that it would be pointless to linger, I stood up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m okay, I’m okay. My energy’s the only thing I have going for me. See you later, Ayanokouji-kun.” Ichinose waved gently in farewell. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOne hour per day. That was the only time we’d have to talk to the girls. Even though boys and girls couldn’t directly intervene in each other’s affairs, I imagined this hour was designed for sharing information. The school likely intended us to use the time to gather information, strategize, and continue to fight, making it an area where well-liked and well-trusted students with strong communication skills excelled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not suited to this at all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust like on the deserted island, there was basically nothing I could do to help.\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 2: A New Special Exam: Mixed Training Camp\",\"volumeId\":\"v8\",\"chapterIndex\":8,\"prevChapter\":{\"volumeId\":\"v8\",\"chapter\":7,\"title\":\"Chapter 1 - Prologue : Horikita Manabu’s Soliloquy\"},\"nextChapter\":{\"volumeId\":\"v8\",\"chapter\":9,\"title\":\"Chapter 3: Human Nature Put to the Test\
