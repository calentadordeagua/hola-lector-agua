e bus, an unfamiliar teacher approached, instructing us to wait a short distance away from the bus.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dude, it’s cold!” shouted Ike, hugging himself tightly. Probably because we were in the mountains. It was certainly colder here than at school. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, the sight before us made us forget the cold for a moment.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoa. What \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eis \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ethis place? This seems a lot for a ‘school camp’…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEnormous grounds spread out before us, with some \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eextremely\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e old-fashioned school buildings visible in the distance. Our home for the next week. They were huge, probably because they had to accommodate the students of all three grade levels.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt felt similar to the test on the uninhabited island. As with that test, I really didn’t have much experience living out in the wilds like this. People like Ike, who had been a boy scout, were going to be useful here. So would those like Sudou, with their physical strength. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe girls filed off the bus next. It seemed like Horikita wanted to come talk to me, but unfortunately, we were already being queued up into separate lines. The boys and girls each headed for our respective school buildings, with the boys being directed to the larger one, referred to as the main building. Once inside, I found my nostrils tickled by the nostalgic scent of the wood-paneled interior. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This really is a traditional wooden school building, isn’t it? It’s old, but still beautiful. It must be exceptionally well maintained,” said Hirata. Everyone else agreed. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlong the way, we saw what appeared to be a classroom. There was no air conditioning, only a single stove placed in the center of the room. We’d most likely be having classes from tomorrow in rooms like that. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFinally, we arrived at what seemed like a gymnasium. The guys from Class A and Class B, who were already there, looked over our way. The Class D students showed up right after us, so the second- and third-year students were probably on their way in next. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe were ordered to form a line and await further instruction. Classes A and B looked calm and didn’t chat amongst themselves. They’d probably already finished strategizing on the bus, huh?\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e2.2\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eB\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eOYS FROM EVERY\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e grade level assembled inside the gymnasium. The bashful first-year students clumped together to wait in silence, and soon after, a teacher from one of the senior classes took to the stage, microphone in hand. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m going to assume you all understand the contents of the exam after the explanation you were given on the bus ride,” he addressed us. “Each grade level will now hold internal discussions and form into six small groups. The large groups will be formed at 8:00 p.m. today. That is all. As a reminder, the school will play no part in the formation of these groups, whether large or small. Nor will school officials act as mediators.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOkay, then. I wondered what the other classes’ strategies were? They should have some plans in place already, but…we’d see how it went.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEach grade level—first-, second-, and third-years—distanced themselves from one another, and the discussions began. I was curious about what the seniors were doing, but it was hard to make out any details from here. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I attempted to observe them, though, there was already movement taking place within the first-year classes. I’d thought we’d try to feel each other out a little longer, but Class A got straight to work, forming one large group. A pretty attention-grabbing move, given the stalemate we were in.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were twenty boys in first-year Class A. Fourteen of them formed up into a single group, then made the following declaration to the people in Class B and below. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As you can see, we in Class A intend to form a single group in this fashion. We have fourteen people at present and need one more person to meet the requirements. We are looking for someone to join us.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe person who said this was a Class A student named Matoba. I saw Katsuragi among the fourteen boys in the group, but if Matoba was the leader, did that mean Katsuragi wasn’t the representative either? At any rate, this made it clear that Class A’s strategy was to form a group made up of as many of their own people as possible.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, hey! What the hell are you selfish punks doing? It ain’t fair if you’re the only ones who go and do something like that,” said Sudou, glaring angrily at Class\u0026#160;A.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is it selfish? Our group would comprise students representing only two classes. Even if we take first place, our modifier will be low. I don’t think this is a greedy proposal at all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-well, sure. But it’s unfair that there’s fourteen of ya.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“On the contrary, it’s very fair. Since the remaining three classes can create three groups of fifteen people each, you can all make groups similar to ours. Right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh, I guess?” said Sudou, not quite understanding. He looked to Hirata for help.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That is correct, yes,” said Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then this discussion is pointless. By the way, we’ve agreed that the six remaining boys from Class A will happily join whatever groups you make, no matter their makeup,” said Matoba, smiling broadly. He turned to Class B’s Kanzaki and Shibata as well.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um… Well, I guess this isn’t really a bad deal at all. What do you think, Kanzaki?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, I need more time to answer that,” Kanzaki said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t imagine that Class A students would go so far as to deliberately drag the other classes down, but I suppose it’s best to be cautious…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass A was pushing everyone to come to a decision right away, but Kanzaki didn’t seem inclined to rush. In response to his stalling, Matoba came back with a strongly worded statement. “You have five minutes. Please make your decision by then.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A time limit? We’ve only just begun to discuss this. Class A gave us an opinion, not an order—you don’t get to make an unilateral decision here. A five-minute window is absurd.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite Class A’s claim that going along with their proposal meant each class could make their own group of fourteen people, it would be a lie to say that this was fair for all classes. If you thought about it, Class A was the only class that could afford not to care about a low reward modifier. They were currently ranked first and leading in points. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose it wouldn’t be fair of us to make this decision solely by ourselves,” Matoba said. “But you misunderstand. We’re not saying we won’t negotiate after the five minutes are up. We’re just offering special terms for someone within that five minutes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Special terms?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMatoba continued to control the conversation, precisely because the other classes had yet to solidify what they wanted. This was certainly close to what you’d call a preemptive strike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Class A is going to form one group of fourteen people, meaning we require one student from another class. Setting aside the merits of this strategy, it’s certainly true that we’re selfishly pushing this idea on you. As such, the single person whom we will welcome into our group will receive special treatment,” he explained eloquently. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis had to be the strategy they’d come up with on the bus.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The student who joins our group will bear no risk whatsoever. Katsuragi-kun will act as the group’s representative, and in the unlikely event that we place last, he will take full responsibility. No one will be dragged down via the solidarity rule. Of course, this only applies so long as the special entrant doesn’t intentionally lower our scores or hurt our friends. If your exam scores are genuinely poor despite your best efforts, that’s fine.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo these were the special terms, huh?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you serious…?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe proposal had its merits. Gathering skilled team members in one place to create a group with a high point modifier might be necessary to advance a class, but it was those skilled people—the people at the very heart of the class—who bore the risks of such a strategy going sour. From the perspective of an average student, who grappled with fears of expulsion, Matoba’s proposed system of special treatment wasn’t a bad idea at all. It would guarantee they made it safely through this special exam.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStill, why wasn’t Katsuragi the one suggesting this? Was this the fallout of him losing status within the class?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We intend to take first place, meaning there is a strong possibility that our special entrant will be rewarded with private points. Aren’t many of you nervous about this special exam?” asked Matoba, looking around. His words clearly resonated with the less secure students. “However, if you cannot decide within the five-minute window, the special offer expires. In the unlikely event that our class does receive a penalty, we will not hesitate to drag that student down with us.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s an interesting proposal. But after the five minutes have passed, the value of joining your group plummets significantly. No one wants to join a team with such a high risk of taking them down with it,” said Kanzaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, that’s right. Who’d be crazy enough to do that?” said a student who’d been briefly charmed by the idea of the special terms.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t mind what you think. But these are our terms,” said Matoba, taking a step back. His group moved with him, signaling the end of the discussion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think we’re better off ignoring them. Once five minutes have passed, no one will want to join their group. They’ll be back,” said Kanzaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Suppose so,” said Shibata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaving said that, they moved calmly away. I didn’t see Kaneda and the other newly demoted Class D students making any strange movements either. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata, however, seemed to be the sole person who felt differently about Class A’s proposal. He approached Keisei, Akito, and me, asking, “What do you think?” in a low voice.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“About their strategy?” replied Keisei, taking the lead in the conversation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. Surprisingly enough, I don’t think it’s a bad deal. It is absolutely essential that everyone in Class C makes it through. We’ve only just been promoted, and I don’t want any of my classmates to be expelled. If a student who’s nervous about this exam joins Class A’s group, they should be able to rest easy,” said Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs a defensive strategy, Class A’s proposal had its merits. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course, it remains to be seen whether Class A will keep their promise of special treatment. If they wind up taking last place, they might use the solidarity rule to take someone down with them, after all,” he added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata’s anxieties were understandable. Verbal agreements \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewere\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e binding in nature, but even if we confronted Class A about it in the wake of a betrayal, they could trap us in endless arguments that went nowhere. If they feigned ignorance, then things would get complicated. After all, their promise hinged on no one intentionally sabotaging the group. If a student’s exam scores were low, it would be difficult to prove whether or not it was intentional. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStill, we couldn’t exactly get it in writing; there weren’t any pens or paper at hand. The teachers had been ordered not to help, so asking them to bear witness to a verbal promise would probably be useless too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat being said, Matoba’s words had piqued the interest of all of the first-year students. He stood to gain nothing by going back on his words. It might be okay to trust Class A on this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…It might be possible to have them protect one person,” I stated, joining Hirata and Keisei’s conversation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. If we make a move now, that just leaves the question of what B and D decide…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAccepting the offer would be seen as siding with Class A, who had opted for a heavy-handed approach. Even though we only had a tiny window, Hirata seemed to want to think this over until the last possible second. Roughly three minutes had passed since Class A’s sudden proposal. We didn’t know whether they were dutifully counting every second, but Matoba and the others seemed to be leisurely standing by. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMaybe they were expecting someone to raise their hand. Or maybe they were thinking up another strategy. We watched them carefully for the remaining two minutes, waiting for them to make their move—though what they would do, of course, depended on the leaders of classes B and below. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kanzaki-shi. I have a proposal. Would you care to hear it?” said Kaneda. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRather than whisper, he raised his voice boldly so that everyone could hear, beckoning Hirata to join them too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve determined that this is an opportunity we should seize,” he said. “Thanks to Class A forming up like this, even if their group does happen to win in this exam, they only get a point modifier for representing two classes. Moreover, if we accept their conditions, we can assign the remaining Class A students as we see fit. We could configure the remaining groups to include students from all four classes, meaning the higher those groups ranked, the greater the likelihood of their members closing the gap between their class and Class A. Correct?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s only if we can rank higher than them, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t know what the exact scores were, but during the Paper Shuffle, Class A had destroyed Class B. In a test of academic skill, this could end badly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s certainly risky. However, this isn’t merely a question of academics. What do you think? I say we try to overthrow Class A here and now,” said Kaneda.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, have B, C, and D cooperate to lay siege against Class A here.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Letting Class A have a group of fourteen of their people is a small price to pay, compared to the point multiplier for representing all four classes in a single group. With their offer of special treatment on top of that, it should work out perfectly.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. I like Kaneda-kun’s strategy,” said Hirata. Kanzaki, more cautious, continued to ruminate on the benefits of having people from all four classes in a single group.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But who’s going to join Class A’s main group?” he said. “I doubt any Class B students want to team up with them. Myself included.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if the special entrant would be protected from expulsion, he’d be spending the week in a group made up only of Class A students. It was safe to say it wouldn’t be the most comfortable time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s ask students from Classes B and D. Would anyone like to step forward?” said Hirata. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe looked at each other. But no one raised their hand.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then I’d like to ask Class C. Would anyone like to step forward?” asked Hirata, directing the question to our own class this time. But he got the same reaction. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSome were likely considering the offer because of the special quota but also anxious about having everyone’s eyes on them. Not to mention being behind enemy lines for a week.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is just my opinion,” said Hirata, “but I think Class A will keep their word.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How can you know that?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because they’re Class A, I suppose. If they do force a lower-ranking student into expulsion despite their promise, no one will ever trust them enough to make a deal with them again. We’re only in the third semester of our first year. To lose credibility now would be a significant setback.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata’s words made sense. If this were a final, decisive battle, Class A might act without care for their reputation. But they still had over two years to go. If they were seen to keep their word here, they could continue to use similar methods in the exams to come. Hirata was saying they wouldn’t do anything too reckless just yet.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not to praise an enemy, but this is Class A. Their grades are simply better than ours. I doubt they’ll come last or drop below the average. Your safety would be guaranteed.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke and the others could understand that temptation well.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fortunately, there don’t appear to be any Class B or D candidates. I’d like to choose someone from Class C to join A’s group. Even if they do win, our class would benefit, and someone would avoid the chance of expulsion. How does that sound?” said Hirata. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe specifically directed his gaze to Ike and Yamauchi, no doubt wanting to protect students who were anxious about their abilities. He made sure to confirm the truth of what he was saying with Matoba too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if the special entrant scores below the group’s average, do you promise you won’t seek to punish them?” he asked Matoba.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course. We ask nothing of that student. If they uphold the conditions I outlined earlier, they have my word.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose I’ll do it,” muttered Ike. Upon hearing that, Yamauchi said the same.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think I would like to volunteer myself as well,” added the Professor, bringing us to three candidates.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To keep things fair, how about we settle this with rock-paper-scissors? The winner joins the group,” suggested Hirata. They did just that, with Yamauchi emerging victorious, making him the person chosen to join Class A’s main group. And thus, the first group was formed. They reported to Mashima-sensei, leaving the six remaining Class A students behind. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now we can form the remaining groups however we wish. I suppose we could do as Class A suggested and form three groups of fourteen people from the same class. And, just like Class A, we could pledge not to invoke the solidarity rule against the one person from another class. Personally, however, I would prefer we do as I had suggested earlier and blend all four classes together.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. Now that we’re goin’ with Class A’s plan, I think we should blend ’em.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No objections here. What do you say, Class C?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKanzaki and Kaneda’s strategy was one designed to secure the highest point multiplier.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we’re aiming to win, this is what we need to do. No argument from me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait a minute, Hirata. Is this really okay? Like, I don’t wanna join a group with someone like Ishizaki in it,” interrupted Sudou. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t just Sudou either. Keisei and other Class C students felt similarly, and grumbled complaints could be heard from a number of Class B and D students too. Having students from all four classes got you a high multiplier, but it also courted conflict. If students who fought like cats and dogs got stuck in the same group, it might even affect scores.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand. I don’t think this is something we can decide immediately. What works for Class A may not work for us.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eGiven how satisfied the Class A students looked, they’d probably agreed to split the rewards equally among all their classmates. They might even have promised to give the six students excluded from their main group a greater share of the rewards to offset the greater risks they faced. They could afford to do so precisely because they were Class A and in a relatively safe position.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why don’t we form hypothetical groups for the time being? If anyone objects, we can stop and start over.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sounds good. Trying to feel things out wastes precious time and won’t get us to a consensus, and Class A’s already moved onto the next step.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eArguing back and forth would get us nowhere. The other students must have been leaving matters to their respective leaders, because there were almost no dissenting opinions.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No objections here,” said Kaneda, accepting the offer without any resistance. We began to form groups smoothly and efficiently. Even though no one had spoken up, though, many students still wore skeptical looks on their faces. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen, not Kaneda, had been Class D’s original leader. Everyone here was aware of that. But Ryuuen wasn’t participating in the group discussion at all. In fact, he was keeping his distance from everyone and didn’t even look like he was paying attention. Now that the third semester was underway, it was common knowledge that he’d vacated his position of authority a while ago. Among the students who didn’t know the specific details behind his fall, there were several who suspected that the whole thing was a charade.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d like to ask you something. Did Ryuuen tell you to do this?” asked Shibata, voicing the question Hirata and even Kanzaki didn’t dare to.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaneda removed his glasses and blew dust off the lenses. “No. This was my idea. His opinions are irrelevant. And even if he and I were collaborating behind the scenes, I’m the one talking to you right now. Any problem with\u0026#160;that?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHis expression turned somewhat grim.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just wanted to make sure. Sorry if I offended you,” Shibata apologized.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You didn’t. Now let’s continue with our discussion. We don’t have the time for chit-chat.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDesigning these groups was a tricky task. Each group would have to work as a team, while their individual members tried to avoid expulsion and assist their class at the same time. It might sound easy, but it wasn’t. The process of group formation involved securing capable players while trying not to get stuck with any duds.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe needed to make sure the students who were likely to drag the rest down wound up in someone else’s group. Hirata, Kanzaki, and Kaneda chose to act as representatives for their respective groups, shelving the matter of the remaining small groups for now. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eImmediate volunteers from Class C flocked to Hirata. Having a classmate as your group representative meant you were probably safe from being dragged down with them via the solidarity rule, and you already knew them well to boot. A good way to minimize interference from other classes. People clustered in this fashion, with Class B showing similar trends. Their group members were decided faster than I could have imagined.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass D was the last to form up, and they did so slowly. I probably wasn’t the only one keeping my eye on them. Prominent students like Kanzaki and Shibata were observing them, of course, but so were many others, all curious to know exactly how Ryuuen Kakeru fit into the Class D puzzle right now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo one trusted Class D at all. Understandable, given how many times Ryuuen Kakeru had tried to entrap us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you going to do, Kiyotaka?” Keisei and Akito came over to check in with me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What about you?” I asked, batting the question back at them while donning a conflicted expression face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m thinking of sticking with Keisei. I mean, using my head really isn’t my strong suit.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…A group composed mainly of C Class students is appealing. It’s just, well, to be honest…I’m not really satisfied with Hirata’s way of doing things.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Meaning?” asked Akito, not understanding what Keisei was getting at.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hirata focuses on protecting his comrades, rather than winning. That’s not a bad thing, but it doesn’t advance us as a class. Also, Ike, Onizuka, and Sotomura are hoping to join Hirata’s group. How they perform will depend on the nature of the upcoming tests, of course. They might even score better than me. But it’s far more likely that they won’t, given what this exam is shaping up to be like.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s true…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Class A isn’t an unruly mob. Even if Yamauchi drags them down, it’s doubtful Hirata’s group could win against them. The only thing we accomplish under his strategy is avoiding being taken out by the solidarity rule. Given that, I think that I’d rather be the minority in another group. We should aim for victory, using an elite few.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If this whole thing comes down to average scores, that’s a solid approach, I suppose.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were eighty boys in the first year, twenty in each respective class. If we divided them up, here’s how the four main groups would look:\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eGROUP A\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e (14 A, 1 C) = 15 people\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eGROUP B\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e (12 B, 1 A, 1 C, 1 D) = 15 people\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eGROUP C\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e (12 C, 1 A, 1 B, 1 D) = 15 people\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eGROUP D\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e (12 D, 1 A, 1 C, 1 B) = 15 people\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat left twenty people (three from Class A, six from B, five from C, six from D) who would probably have to form two groups. However, while the majority of students were doing as their class leaders directed, some didn’t seem inclined to cooperate. One such student was unmistakably Class D’s Ryuuen Kakeru, who had avoided interacting with anyone, standing around alone as if he had no interest in participating in this exam in the first place.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite being alone, it didn’t look like he was wallowing in loneliness, or anything. If anything, he looked like he was proudly waiting out his solitude. Either way, one of the remaining groups was going to have to take him in. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was only one student I could imagine doing such a thing in a situation where even Ishizaki, Ryuuen’s classmate, wouldn’t talk to him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ryuuen-kun. Would you care to join our team?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, it was Hirata. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could understand why someone like Ryuuen, who’d halfway retired from inter-class competition, would find a mandatory-collaboration exam like this one annoying. That said, he probably wouldn’t imprudently defy the school’s will either.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, Hirata! Taking Ryuuen? That isn’t funny!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone who’d joined Hirata’s group resisted. Who’d want to work alongside the ultimate ticking time bomb? Ryuuen was the single most unnecessary element of a strategy to climb to Class A. The students understood this—but at the same time, they had doubts rising within them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDoubts, that is, about the scenario where they graduated “from a class other than A.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFailing to graduate in Class A meant they would never benefit from this school’s too-good-to-be-true guarantee of getting you into any institution or career you wanted. What was even the point of graduating if you couldn’t do it in Class A? \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat question haunted everyone at this school. It was the same kind of mingled unease you got when good news and bad news reached you at the same time. Without Class A, you’d be labeled an underperformer. Universities or workplaces might outright refuse to admit or hire those who didn’t have what it took.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, there were undoubtedly many who held graduates of the Advanced Nurturing High School in high regard. Spending three long, hard years in the pure meritocracy of a government-sponsored school had its own value. Graduating from this school at all was still a substantial achievement, as long as you didn’t get your hopes up too high.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs for the second-year students, Nagumo was already top dog of Class A, far ahead of Class B and below. With a year left to go, other classes could still turn things around, but it was an uphill battle. The third-year students had it tough, too. While their situation certainly wasn’t as one-sided as the second-years, I had heard that Class A, where Horikita’s brother was placed, had never once surrendered its lead and was still going strong.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt this point, there was almost no chance for the second- and third-years in Class D to make any kind of comeback, barring some kind of miracle… Maybe if this were one of those quiz shows where you could shoot to first place simply by getting the crucial final question right. But I doubted that would happen here.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePutting aside the first-year students who hadn’t yet grasped the bigger picture, everyone was likely terrified of expulsion. I couldn’t imagine a university or employer welcoming an expelled student with open arms.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe systems in place for this exam, like the solidarity rule, were deterrents at best. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe systems in place in this exam, like the representative being able to drag someone down with them, was at most a deterrent. It was a rule created to ensure that students wouldn’t be getting forcefully expelled. However, being vigilant was still important. There was still a possibility that there was a student out there who didn’t mind getting expelled, and in the off chance that a representative gets expelled, they probably wouldn’t hesitate to bring someone else down with them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis meant everyone would be wise to score higher than their representative, even if only by one point, to escape the solidarity rule. Also, it was important not to incur the representative’s wrath. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, ho, ain’t you a big shot, Hirata, takin’ me in. But it doesn’t look like people are on board,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat’s right. They wouldn’t agree, and the group wouldn’t form unless Hirata managed to talk them into\u0026#160;it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Keisei. Wouldn’t being part of an elite crew be pretty risky?” muttered Akito, looking at the remaining members.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, maybe more than I thought.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKeisei let out an exasperated sigh. Aside from me, the remaining five Class C students were Keisei, Akito, the Professor, Onizuka, and Kouenji. The Professor and Onizuka had wanted to join Hirata’s group, but that group was full up. As for Kouenji, he did his own thing, so to speak. He didn’t participate in any discussion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe could argue that we’d like those five to all stick together, but then we’d have two groups of ten remaining, meaning the other classes wouldn’t be able to make the same move. On top of that, since there were practically no students left who would proactively step up and take on the role of representative, students’ movements became rigid, as if time had come to a halt. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As long as I’m not in a group with Ryuuen, I’m good,” said a Class B student.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d also like to avoid Ryuuen,” said Keisei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone was on team Not Ryuuen, probably because they had no idea what he might do next. Even his old allies, like Ishizaki, kept their distance. Shiina Hiyori, who hadn’t been involved in that rooftop scuffle, might have supported Ryuuen, but she wasn’t here.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This isn’t going to be easy.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The best plan would be to put him with the Class D group.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That would be great, sure, but we’re in a bit of a bind right now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I heard they had a falling out. But I don’t have enough evidence to know if that’s true.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was understandable that Kanzaki—no, that everyone here—would have doubts. They probably saw this whole situation as Class D intentionally cutting Ryuuen loose in the hopes he’d sabotage someone else.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kanzaki-kun,” Hirata said. “If Ryuuen-kun really is having trouble, I think that we should do something about it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“By ‘do something about it,’ you mean Classes B and C should help him. Is that it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if it helps out Class D, two other classes would be hurt in the process. If you weigh the risks, it’s not a good idea.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKanzaki was right. If including Ryuuen meant taking a risk, then that risk should be shouldered by his own class. Kaneda and Ishizaki might not like the situation, but they had no right to saddle another class with Ryuuen, and we didn’t need to take responsibility for their problems.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMind you, if we’d been competing in pairs, Hirata would probably have paired up with Ryuuen in the blink of an eye. But this was a group test. One person’s goodwill couldn’t carry the day, as evinced by the silence that followed. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed forming groups was going to take longer than expected. The paranoia and suspicion emerging from the three groups that had formed right off the bat as a result of excluding Ryuuen didn’t help.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e2.3\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003e“A\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eLLOW ME\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to suggest something. The problem we’re  facing right now is Ryuuen. We’re fighting over which group to put him in, right? In that case, I’d be willing to act as a group’s representative in exchange for that group taking Ryuuen,” said Akito, who had been carefully observing the situation next to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, declaring that he would accept Ryuuen when no one else wanted to instantly raised people’s suspicions.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you plotting?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s simple. In return, I want the lion’s share of the reward for first place.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t think people would resist the idea, but then again, they all understood that taking in Ryuuen came with great risks. It was just that, well…I never imagined \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAkito would make a move with the intention of getting the reward. I suspected he was simply trying to come up with a reason to take Ryuuen in, since no one else was willing to do so. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you proposing, exactly? You’re not planning to use the solidarity rule to take someone else down with you if it comes to that, are you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unless someone tries to blatantly sabotage me, I won’t do that. And the rules say I can’t, anyway.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe members of the hypothetical groups fell silent after hearing Akito’s well-reasoned argument. And so, despite encountering a few bumps in the road, the first-years finally managed to form six groups. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis included my group, which was composed as follows:\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom Class C, we had Kouenji, Keisei, and me. Three people.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom Class B, we had Sumida, Moriyama, and\u0026#160;Tokitou. Three people.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom Class A, we had Yahiko and Hashimoto. Two people. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen, from Class D, we had Ishizaki and Albert. Two people.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTen people in total.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOur group was clearly unlike the other five. We had a far more even mix of students from different classes, though I supposed the group Akito was representing wasn’t too far off. However, my group still needed a representative. None of us seemed to have great leadership skills, and no one was stepping forward to claim the role. With no one around to take the lead and guide everyone toward a consensus, we all sat there, not knowing what to say.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnyway, we had to at least report to the school that we’d successfully formed our group. We could select the representative later. So the ten of us—group number six—headed over to report to the school officials.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even though we managed to avoid having Ryuuen, I’m still worried about getting a decent average score,” said Keisei anxiously.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wasn’t certain how good the other students were either. Personally, I’d wanted to avoid being in the same group as Ishizaki and Albert, but there was nothing to be done about it at this point. Ishizaki was blatantly refusing to meet my eyes, but that didn’t necessarily mean that a third party was going to notice anything was up. Most people would assume he simply thought nothing of me. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kouenji is going to be a problem too,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Kouenji would take things seriously, he’d be unstoppable. His athletic and academic abilities were impressive. But “take things seriously” was where things fell apart.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, he’s Kouenji, but he wouldn’t really do something that gets us penalized, right? If he does, maybe it’s all over.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had a feeling Kouenji would score above average, but would do it in an aimless, noncommittal way. The only certain thing about him was that his motives were impenetrable. If he remained unmotivated, our future was uncertain. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen we finished giving our report, I noticed a group hanging around. It was the one with mostly Class A students, who should’ve been long gone. At first, I thought they wanted to find out how the remaining five groups had organized themselves, but it seemed that wasn’t the case. There were second- and third-year students waiting around, too. More importantly, so was Student Council President Nagumo Miyabi, who ruled the second-years with an iron hand. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter confirming that all the first-year students had formed their groups, he called out to me. “You guys were surprisingly quick. I thought that would take you longer.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed the second- and third-year students were almost all done composing their small groups too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have a proposal for you first-years,” Nagumo said. “How about we form a large group right now?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aren’t we going to decide that tonight, Nagumo-senpai?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s just the school being flexible. They didn’t expect that the small groups would form so quickly. Since all grade levels have finished, wouldn’t it be best if we moved on to the next step?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, his suggestion was unexpected—even to the teachers. Sensing that we were about to start forming large groups, the teachers began to move in a hurry. Since the student council president himself had proposed this, the other students could hardly refuse.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t mind, do you, Horikita-senpai?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t. This is more convenient for us too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDiscussions were underway, with Nagumo at the center.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, how do we do this? Should we have a draft-pick system? One person from each of the first-year small groups plays rock-paper-scissors against the others. The outcomes determine the order in which people make their picks. Based on that order, they can choose which second- or third-year small groups they want, and thus we’ll get large groups. A fair and quick process.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The first-years don’t have much information to go on. That doesn’t seem fair.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s never going to be completely fair. We all have different amounts of information, in the end.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA brief but important conversation between Nagumo and Horikita’s brother followed. There was no way a first-year could interrupt.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol8_INTERIORIMAGES_\" src=\"/hola-lector-agua/images/books/v8/OEBPS/Images/ClassroomElite-Vol8_INTERIORIMAGES_.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you first-years think? If you have any complaints, speak up,” said Nagumo, knowing full well that no one would talk back to him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We have no objections,” answered Matoba, apparently now representing the first-years.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. In that case, how ’bout we get started?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo smiled, and then joined up with his own small group. The second- and third-year students reformed their groups so that it was easier for us to tell them apart. Then the representatives of five small first-year groups stepped forward. Nagumo regarded us fondly, like we were adorable children.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now all that’s left is \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e group.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy small group was the only one that had yet to pick a representative, so naturally, none of us were stepping up to play rock-paper-scissors. I lightly pushed Keisei, making sure I wasn’t noticed. He looked puzzled but then reluctantly raised his hand.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe six representatives formed a circle and started playing. Keisei was selected to pick fourth. First up was Matoba’s group, which was mostly filled with Class A students. Second was Hirata’s group, consisting mostly of Class C students. Third was the Class D group, represented by Kaneda. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can discuss among yourselves which group you’d like to pick.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTwo groups that immediately stood out as top choices: the group containing the leader of second-year Class A, the student council president Nagumo, and the group led by Horikita’s brother, a third-year student. But someone like Hirata, who had many friends and acquaintances across different grade levels, might be able to spot an excellent group that didn’t appear to be one at first glance. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMatoba’s group, the first to pick, chose the third-year group containing Horikita Manabu without hesitation. Next, Hirata carefully assessed each of the eleven groups. In the end, he didn’t go with one of the two obvious choices I mentioned but picked a group of third-years that didn’t have a single person I recognized.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Hirata, you sure that’s a good idea? Shouldn’t you pick the student council president’s or something?” Ike interrupted, unsurprisingly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I’m sure. I think this is a good choice. Exceptional people have their appeal, sure, but they can bring trouble in their wake. Besides, the seniors I chose aren’t half bad,” replied Hirata, nodding with apparent confidence.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke decided not to push the matter, a sign of the trust Hirata had cultivated with our class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe majority-Class-D group was next. Kaneda consulted his classmates—which is to say he simply informed them which group he wanted to choose. There were no objections, and he made his selection immediately. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I would like to join second-year Gouda-senpai’s group, please.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce again, Nagumo’s group had been passed over. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder why they’re avoiding Nagumo,” I muttered doubtfully. Akito, standing next to me, offered an answer.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because aside from Nagumo-senpai, the other members are kind of iffy.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that so?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I suppose they’re not \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eall\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e iffy, but there are a lot of C and D guys. The second-year group with lots of Class A students is the one Kaneda picked.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, it wasn’t that Kaneda had avoided picking Nagumo—just that he had chosen reliable, strong allies. I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewas\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e curious as to why Nagumo hadn’t formed a group of mostly Class A students. I knew he controlled all the second-years; bringing members of his own class together seemed like a more reliable option.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFinally, it was Keisei’s turn. “Is it okay for me to decide?” he asked the rest of the group.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t care. Don’t really get it, anyway,” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed Ishizaki, and by extension the Class D students, were fine with leaving the decision to Keisei. The Class A students had no real opinion on the matter either. The Class B students said nothing at first, but after thinking it over for a while, they made the following request.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please pick Nagumo-senpai’s group.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough Nagumo’s group was mostly composed of Class C and D students, I was guessing it was the presence of the council president that made them rate it so highly. After hearing the Class B students’ request, Keisei chose Nagumo’s group.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter that, discussion came to an end. The six large groups had formed successfully.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita-senpai, since we’re in separate large groups, how about we have ourselves a little contest?” proposed Nagumo. Horikita shot him a sharp look.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI heard a somewhat exasperated sigh, and a third-year named Fujimaki stepped forward to admonish Nagumo. I recognized him as the person who’d taken charge during the Sports Festival, meaning he wielded a certain degree of influence. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nagumo. How many times have you done this? Enough already.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whatever do you mean, Fujimaki-senpai?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You keep challenging Horikita to competitions. I’ve never interfered before, but this is a large-scale special exam that includes the first-year students. You cannot treat this like your own personal game.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why do you say that? Distinctions like first and third year no longer apply right now. Challenging someone under such conditions is hardly unusual, is it? There’s nothing in the special exam rulebook to forbid it.” Rather than cower before Fujimaki’s impressive bulk, Nagumo chose to taunt him. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re talking fundamental morals here. Even if something isn’t expressly against the rules, some actions are good, and some are bad. That’s obvious.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t really think so. If anything, it’s precisely seniors like you who hinder the growth of younger students by refusing to do battle with them, wouldn’t you say?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You may be student council president, but that doesn’t mean you can do as you please. You need to be aware of the fact that you’re overstepping your authority.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you think that’s the case, then please, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003emake\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e me aware of it. How about \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e be my opponent, Fujimaki-senpai? You’re third-year Class A’s number two, aren’t you?” replied Nagumo, stuffing his hands arrogantly into his pockets, acting as though Fujimaki were an afterthought.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was cheap provocation, but it seemed to successfully antagonize some of the third-years. A few students started to step forward. However, Horikita kept them\u0026#160;back.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have rejected your demands until now,” Horikita said. “Do you know why?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm, let’s see. I’d say it’s because your friends are scared you might lose, but that can’t be right. You are superior to every other person I’ve met, Horikita-senpai. You’re not afraid to lose. You never even \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethink\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e that you could lose.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe second-year students listening to Nagumo wore worshipful looks on their faces. He wasn’t a friend or a patron. He was a rival, a hated enemy, but also someone they deeply respected. It seemed he inspired a variety of powerful emotions, anyway.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the two years he’d been at this school, Nagumo had accomplished many things that no ordinary person could. Not even the third-year students could comprehend the extent of his achievements. The first-year students even less so.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m the same as you, Fujimaki-senpai. I don’t want any futile conflict either.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The conflict you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edo\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e want gets too many other people involved.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But that’s just how this school works. And I think that’s the best part of it… Well, I suppose it comes down to a difference of opinion. At any rate, I wish we could have had a little showdown in that relay during the Sports Festival, senpai. Alas, that didn’t happen. I’m still really frustrated about that, y’know?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t imagine what a showdown between the second- and third-years would do to help us in this exam.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re probably right. You’re that kind of person, senpai. But all I want is a battle between the former student council president and the current student council president. You’re going to graduate soon. Before that happens, I want to see whether I’ve surpassed you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no telling if Nagumo would ever stop. It was like he was possessed by some kind of unceasing longing. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What would the battle even be?” Horikita asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe third-year students looked shocked at the implication he might be about to accept Nagumo’s challenge.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How about which of us can get the most students expelled?” replied Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone, from first-years to third-years, started murmuring amongst themselves.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Stop joking.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I really do think that would be interesting. But if you insist…how about which group can earn the higher average score? Simple and easy to understand.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Very well. I accept.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you. I knew you wouldn’t disappoint, senpai.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, this is a personal battle between you and me. Don’t drag anyone else into it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t drag others into it? Given the rules of this special exam, I would think getting someone to drag your opponent’s group down was a valid strategy.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s the very opposite of what the essence of this exam is meant to be. This is, at most, an exercise to test our group’s unity. The point of the test isn’t to exploit a weakness in an opponent’s group, even if you happen upon one by accident.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan styl
