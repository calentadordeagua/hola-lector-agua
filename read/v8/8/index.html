"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T2bcef,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 2:\u003cbr/\u003eA New Special Exam:\u003cbr/\u003eMixed Training Camp\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eO\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eN A THURSDAY MORNING,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e shortly after the start of the third semester, several buses traveled in a row down the highway. The buses carried not only first-year students, but second- and third-year as well—the entire school jointly embarking on one big road trip.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe bus that carried us—the first-year Class C students—entered a tunnel. My ears were assaulted by the pressure change. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was the second time I’d ridden a bus since enrolling at this school. No one had explained where we were headed or what we were doing. All we knew was that we had to wear jerseys, and it was strongly recommended we pack several spare jerseys and changes of underwear before we left. This didn’t sound like a vacation, though.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince the bus ride was about three hours or so, everyone had brought along fun items considered acceptable by the school. Cell phones were a given, but people had also brought books, playing cards, and snacks and juice. Some had even brought along game consoles.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOur seats were designated, with our names written on them, and I was seated next to Ike Kanji. I’d intended to get along with him when I enrolled here, but our relationship was still at the “just fellow classmates” stage, and opportunities to hang out with him had decreased dramatically. Instead of talking to me, his literal seatmate, he knelt on his seat, turned around, and had a loud conversation with Sudou and Yamauchi, who were seated further away. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI occasionally heard the girls tell them off for being annoying, but they didn’t pay much mind. It was uproarious in here, anyway, so it was no wonder that they weren’t holding back. I felt a bit lonely, but there was nothing I could do about it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOn the bright side…the recent round of exams had let me grow closer to students like Akito and Keisei. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe atmosphere on the bus was pleasant, but I could tell this wouldn’t be a mere field trip. If we’d done this in the middle of winter vacation, I might have held out hope of it being just a fun outing, but the third semester was already underway. It would probably be for us to anticipate an exam like the one we’d had on the deserted island, just so we could prepare ourselves mentally. It wasn’t as though Ike and the others hadn’t matured at \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eall \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003esince then. Probably.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira observed the students doing as they pleased with a look of deep interest. She stood close to the driver, rather near my seat, as she stared at us. Since I didn’t want our gazes to meet, I decided to stare out the window. This was a long tunnel. It’d been two or three minutes since we entered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as I thought that, it began to get brighter. We’d made it through. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira, who had been waiting for us to emerge from the tunnel, started to move. At the same time, the pain in my ears increased. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry to interrupt your enthusiasm, but be quiet,” she said, addressing the students through a hand-held microphone. “I thought you might like to know where this bus is headed, and also what you’ll be doing once we arrive.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah, ’course we’re curious. We’re not going to another deserted island, are we?” asked Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira answered quickly. “I see that special exam is still seared into your collective memory. Allow me to give you some peace of mind; we don’t hold special exams on that grand a scale very often. Nor are we so cruel as to put you through something like that when it’s no longer summer. However, as you can already guess, there \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eis \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ea new special exam ahead. Compared to the island, though, you’ll be in significantly better living conditions.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo she said—but I didn’t trust her. The island aside, every special exam we’d faced so far had been insanely difficult from an average student’s perspective. Hanging over our heads was the ultimate penalty of failing one of these special exams: expulsion. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now, the special exam that you Class D students will—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira paused. My classmates smiled with a touch of pride as, immediately after, she bowed her head in apology.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry. You are Class C now. Allow me to give you newly promoted students an overview of the special exam.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaving been formally promoted to Class C in the third semester, our class seemed to be trying its best to calmly face the upcoming exam. Receiving an explanation of how that special exam worked on the bus meant we could prepare countermeasures, or at least \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003etry \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eto. We couldn’t just get up and walk around while the bus was in motion, but the bus was small enough that everyone could hear you if you spoke, and we could always use our phones to correspond privately with specific people.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke and the other noisemakers shut up, listening to what Chabashira had to say. Proof that they \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehad \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ematured, if only a little. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We are taking you to a school camp in the mountains. We will arrive in just under an hour. The less time I have to spend explaining, the more time you’ll have to strategize,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAn hour until the exam started, huh? In other words, if it took twenty minutes to explain the rules, we’d have forty minutes left over to plan. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t students normally attend school camps and stuff in the summer?” asked Ike, who used to be a boy scout. He knew quite a bit about the mountain range we could currently see from our seats as we traveled down the highway. It was covered in white snow, even now. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please be quiet and listen. Remember, this is the only time you have,” Chabashira rebuked, but she sounded gentle, rather than angry. Ike scratched his head sheepishly and apologized. A brief moment of laughter ensued.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSchool camp. I’d never heard of it, so I looked it up on my phone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Typically held in the summer months on days when the weather is nice. Commonly held in locations where greenery is abundant, such as the mountains. Group activities are conducted with the express purpose of promoting the development of healthy bodies. Can also refer to an educational facility.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as Ike had said, it sounded like these school camps were usually held in the summer. Clearly, however, they could also take place any time of year.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Normally, opportunities to connect with senior students are few and far between, especially for those not involved in club activities. At this school camp, you’ll participate in inter-class group activities for eight days and seven nights, making this a step beyond the Sports Festival. The name we’ve given this special exam is the ‘Mixed Camp.’ Since I’m sure a verbal explanation won’t satisfy you, I’ll be distributing printed materials now,” Chabashira continued.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe handed a stack of printouts to the students sitting in the front row, who each took one and then passed the rest back. The syllabus consisted of about twenty pages. Since she hadn’t specifically told us not to look, I began to flip through it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were clear photographs of what I assumed to be the camp, including the dormitories, public baths, cafeteria, and so on. It was actually kind of exciting to look at these; I felt like I was paging through a travel guide. The all-important words \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003especial exam\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, however, curbed our enthusiasm.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStill, this was twenty pages of documentation on top of a verbal explanation. We’d only received a brief verbal explanation for the Paper Shuffle, which meant this exam was probably shaping up to be pretty annoying. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter confirming that everyone had received the handouts, Chabashira resumed speaking.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Feel free to keep reading, but I’m going to explain the Mixed Camp now. These materials will be re-collected before you get off the bus, so please make sure you clearly understand the rules. Questions will be accepted at the end, so pay attention. Do you understand?” asked Chabashira, looking at Ike as she spoke. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke nodded. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The main goal of the Mixed Camp is to foster your mental development. In order to accomplish this, we’re going to start with the fundamentals of participation in civilized society—ensuring you can build stable relationships with people you don’t know very well. Each and every one of you will learn these skills.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo that was why they were making us do group activities with senior students, huh? \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs Chabashira had just said, students who were in clubs might have already developed relationships with their juniors or seniors. Even so, those interactions were mostly limited to the club activities themselves. As for students who \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eweren’t \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ein any clubs, hardly any of us had interacted with upperclassmen at all. You might think the school would want us to fraternize voluntarily, without need for exams or club activities to serve as incentive. Of course, it wasn’t that simple in reality.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, how did they plan to get the upperclassmen involved in this? Unless the need for direct contact was a high priority, most students would probably keep their distance from one another, just like we had during the Sports Festival. Well, we \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewere\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e headed into the mountains to a place designated as a camp, so that might be easier said than done… \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt any rate, if the rules for the special exam weren’t set in stone, it should be easy to find loopholes. There was a marked difference in maturity, both physically and mentally, between first- and second-year students. A year is a significant period of time in the life of a teenager. I\u0026#160;couldn’t say how extreme the gulf would prove to be, but the reality of the situation was that we wouldn’t be on a level playing field.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Once we arrive at our destination, we will divide you by gender. Next, we’ll hold a school-wide discussion with all grade levels and then further divide you into six groups.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Divide men and women, then make six groups…” muttered Ike, as though he were trying to memorize the information. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira continued, “The minimum and maximum numbers of people in each group have already been decided. Take a good look at the guidelines on page 5 of your handout.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe students all looked at once. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eGroup numbers are calculated based on the total number of students, then separated by grade and gender. For instance, if there are 60 or more male students in the same grade level, the minimum number of participants in a group is 8, and the upper limit 13. If the total is 70 or more, the limits are 9 and 14. If the total is 80 or more, the limits are 10 and 15. However, in the event the number of students is under 60, please refer to a separate table.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLet’s assume the ratio of boys to girls in a class didn’t vary between grade levels. If there were 40 students in one class, with a boys to girls ratio of 1:1—20 boys and 20 girls—then that meant, basically, that there were a total of 80 boys across the four classes of a single grade level. That would mean between 10 and 15 people per group, with a total of six groups overall. But the fact that the syllabus referenced the total number of students first meant that these numbers would change depending on how many people had been expelled across all grade levels. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re probably already aware of this, but sorting you into six groups divided by gender means that students from different classes will be mixed together. For the duration of the test, your group members will be your allies. You’ll be in the same boat, as it were.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Isn’t it kinda ridiculous to ask us to be in groups with people from other classes? I mean, they’re our enemies,” muttered Ike loud enough so that Chabashira could hear\u0026#160;him. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe’d probably been unable to contain himself any longer. But his own words must have jogged something in his brain, because he brightened. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, that’s it! We don’t really have to do that, do we? We can divide Class C into two groups. That’ll take care of it, right? Ayanokouji?” he asked, lowering his voice.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was certainly true that Class C could form two groups of ten. However, Ike’s idea just wouldn’t work. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A good idea, but things aren’t that simple. The rules forbid forming a group with students from just one class. As long as groups abide by the approved headcount, you are free to team up with any class you wish. But each group must have a combination of students from at least two classes. More importantly, these groups aren’t selected through discussion. They must be agreed upon unanimously,” said Chabashira. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat she’d just said was written plainly in the syllabus. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Every group must consist of students from at least two or more classes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So this means we have to make friends with the enemy?” Ike blurted out. It was less of a question and more of something that had just slipped out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, exactly,” replied Chabashira, looking slightly exasperated. “Of course, you could form a group that consists \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ealmost\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e entirely of students from your own class. If you can get just one student from another class, you’ll meet the requirements.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, we could form a group of ten people—the lower limit—and then have nine of those students be from Class C. I couldn’t imagine that kind of group composition would be unanimously approved when we held our school-wide discussions, though. Very few students would be willing to join a group almost entirely composed of people from another class. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, I doubted a group like that would meet unanimous school-wide approval. Very few students would likely be willing to join a group that only had members from another class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlso, was it better to have more people, or fewer? The same number? If the difference in numbers could create an advantage or disadvantage, a smaller group was a risk. But we couldn’t know which number would be superior without learning the test’s conditions. Our luck would depend on the nature of the exam.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure you’re wondering if it’s better to have more people in a group or fewer. Numbers will certainly be significant to this test, as you’ll see if you turn to the section marked ‘Outcomes’,” said Chabashira wryly. “I will explain it now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, it was easy to tell we’d all been thinking the same thing.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Excuse me, but could you please continue explaining the rules first? I want to learn about the outcomes, but before that, I’d like to know what we’ll be doing as a group,” asked Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose you’re right. If I respond to every one of Ike’s concerns, we won’t get anywhere.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke scratched his head apologetically again.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Each group will function like a temporary class. I say temporary, but your time together will be significant. Group members will take classes together, of course, but will also cook and clean, bathe and sleep together. You’ll be sharing a variety of life experiences.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBoth guys and girls let out agonized wails when they heard the words ‘bathe and sleep together.’\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I really don’t feel like I could live with people from the other classes though,” grumbled Ike. I understood how he felt. Though we’d cooperated with another class during the Sports Festival, that had been a brief and temporary alliance. we hadn’t spent much time together. We hadn’t exactly been together through thick and thin.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, this exam was about to collapse those boundaries. Depending on how things went, some groups might even wind up with a mix of people from all four classes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As for outcomes, those are determined by a comprehensive test given on the last day of camp. The contents of this rather significant test are outlined on page 7 of your handouts. Give it a look.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone checked that section.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eEthics\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eFortitude\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eDiscipline\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eInitiative\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThese weren’t typical school subjects. This exam was going to be something removed from the course of normal classes like English or mathematics, which tested academic ability, huh? Unfortunately, I doubted the tests we were about to face would have clear answers. The four concepts outlined in the syllabus were abstract ones. I\u0026#160;had yet to see any concrete details of how the test would be conducted. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe schedule laid out in the syllabus only proved my point. After waking up, we’d do morning assignments. Then we would gather at the dojo and engage in \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ezazen\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, meditative discipline exercises (such as cleaning), followed by breakfast, then by various lessons in a classroom setting. After lunch, students would work on afternoon assignments, and then practice more \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ezazen\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. Then we would have dinner, bathe, and go to bed. Quite the departure from our lifestyle up until now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIncidentally, unlike our usual school routine, there would be additional lessons on Saturday mornings. We’d only have Sunday off.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“More details about your schedule will be announced upon arrival at camp. Right now, I cannot tell you what kind of exam you will face on the final day,” added Chabashira.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo we’d need to stay on our toes and play things by ear during the special exam. Maybe the final day would test us on things like \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ezazen, \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eincluding fine details like posture and manners. Words like \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSpeech\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e and \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eProduction\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e jumped out at me as I scanned the syllabus. They didn’t feel like good signs.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Choosing your groups will be of the utmost importance. All six groups must work together and get through the week-long school camp as a unit. No matter the reason, you cannot withdraw from your group at any time, nor can members be changed. If a student has to withdraw due to illness or injury, then their group must simply deal with their absence and operate as though that student is still part of the group.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, we’d get nowhere if there was discord within the group, or if we antagonized each other. It was looking more and more like we were going to have to juggle vying with other classes with balancing the internal functioning of our own group. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eGoing by the schedule, lessons began tomorrow morning, which was Friday. We’d be in session until Wednesday of next week. Next Thursday, all grade levels would take the final exam.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Once the first-year students have finished creating their groups, they will rendezvous with the second- and third-year students, who will form their own groups at the same time. In the end, we will have six final groups, each consisting of a mix of approximately thirty to forty-five first-, second-, and third-year students.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was already tough forming a group within the same grade level, but now we were adding other grade levels on top of that. The bus got weirdly quiet.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To put it more simply,” Chabashira said, “think of groups formed of students in the same grade level as small groups. The groups formed from students in all grade levels, on the other hand, will be large groups.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEach of the six groups formed by students in the same grade level would be a small group. Then those small groups would join with the second- and third-years to ultimately form six large groups.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Outcomes will be determined based on the average exam results of all members of the six individual large groups. The strengths and weaknesses of the other grade levels will heavily influence your results.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat concerned me here was the difference in group membership numbers. The large groups would consist of about forty people. Averaging out our results \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eshould \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ehelp reduce inequality, but depending on how the smaller groups were formed, there might be significant differences in the number of people in the large groups.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHow we chose to form those large groups was now the most important thing. If this were an academic exam, a large group with only exceptional students in it would easily win. Conversely, students who were deemed unexceptional would inevitably be excluded from the top groups, thus forced to form a lower ranked group. However, this exam couldn’t be won by simply gathering the academically gifted in one place.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think you’ve probably got the gist of things now. I’ll conclude with the most important piece of information—that is to say, the results of this special exam.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eGood question. What did we stand to lose?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The members of large groups whose averaged scores take first through third place will receive both private points and class points. Large groups whose average scores place fourth or below should expect to have points deducted,” explained Chabashira.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe details were, naturally, outlined in the syllabus.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eBasic Rewards\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e1\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 0.75em; vertical-align: super;\"\u003est\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e Place: 10,000 private points. 3 class points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e2\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 0.75em; vertical-align: super;\"\u003end\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e Place: 5000 private points. 1 class point.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e3\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 0.75em; vertical-align: super;\"\u003erd\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e Place: 3000 private points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eThe aforementioned rewards will be distributed to each individual student.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo if a small group of ten people included nine people from the same class, that class would be awarded twenty-seven class points as a result of the group taking first place. Of course, that was describing an ideal scenario, but it would be best to aim to have as many students as possible from our class take first place. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, the more students from the same class there were in a group, the more points that class would have deducted if the group ranked fourth or below. And the larger the group, the trickier it would be to control everyone. The negatives at stake outweighed the relatively few positives.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e4th Place: –5000 private points. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e5th Place: –10,000 private points. –3 class points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e6th Place: –20,000 private points. –5 class points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eThe aforementioned penalties will be deducted from each individual student.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePrivate points and class points couldn’t fall below zero, but the deductions would remain as a cumulative deficit that would be applied against any points awarded for future exams. It was something the school had never done before. If the rewards seemed relatively small, compared to the risks, it was because there was a trick to it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira read the next section aloud.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Depending on the number of classes represented in a small group, rewards may be multiplied. They may also be multiplied based on the total number of people in a small group. Please relax, though. These multipliers only apply to rewards gained from placing first, second, or third. They do not apply to the point deductions for fourth place and below.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThese potential reward multipliers went as follows.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf a small group comprised students from two classes, they would receive only the base rewards. However, a small group comprising students from three classes would be rewarded with double the amount of class and private points. A group comprising students from all four classes would be rewarded with triple the amount of class and private points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFinally, the multiplier changed depending on the number of people in a small group. A group of ten people got the base reward. A group of fifteen people got 1.5 times the reward. In the special event that a small group had only nine people, their reward would be 0.9 times the default.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, if a group comprising students from all four classes obtained first place, they’d hit the 3× multiplier. If that same group \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ealso \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ehad the maximum number of allowed members, i.e., fifteen, they’d earn an additional 1.5× multiplier. Rounded to the nearest whole integer, this meant each member of the group would be awarded 45,000 private points and fourteen class points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo far, this seemed like a standard special exam; tricky but interesting. But what came next changed everything.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Also…” Chabashira said. “There is a significant penalty for the large group that comes in last place.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A penalty…? No way.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. The penalty is expulsion.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo surprises there.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Granted, not every member of the large group that comes in last will be expelled. If we did that, we’d be expelling nearly forty students at once. Expulsion will only apply to the small group within that large group whose average score falls below the threshold set by the school.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo overall rankings were calculated based on the average score of each large group, but when it came to expulsions, it was the average scores of the small groups that were taken into account. That was troubling.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If a small group fails to meet that standard, then that small group’s representative will be expelled.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How do we pick the representatives?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You will discuss it with the members of your small group and appoint somebody. That is all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The hell? Who’d willingly want to be the representative knowing they might get expelled?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI doubted there’d be many volunteers.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are significant benefits to being a group representative. The representative and the representative’s classmates will receive double the rewards.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you say double?” muttered Horikita, who had been silent until now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. To secure the highest possible payout from this exam, you would have to form a group comprising twelve Class C students and one student from each of the remaining three classes. If you then appoint someone from Class C as your representative and take first place…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what do we win?” asked Yamauchi, unable to perform the calculations himself. He was practically hyperventilating.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’d get 1.08 million private points and 336 class points.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Th-three hundred thirty-six?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf that happened, it would overturn the class rankings entirely. Even jumping all the way to A Class as a result of this exam wasn’t out of the question, depending on how the other groups scored. The more risks we took, the greater the rewards—and the odds of securing the highest achievable reward weren’t too low, either.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Once the small groups have been decided, you will have until tomorrow morning to appoint your representative. In the event a group cannot choose a representative, that group will immediately be disqualified, and every single one of its members will be expelled. Of course, no group would ever be so stupid as to make such a mistake.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo the school wouldn’t be picking representatives—it was solely up to us to decide who to appoint. A difficult decision, to be sure. If no one volunteered, we might wind up having to draw straws or play rock-paper-scissors…an inevitable conclusion in light of the fact we’d all be expelled otherwise, but in an already fraught situation such as this, it would put a strain on the group’s unity.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Finally, the representative who is expelled may choose one other person from within their group to share their fate. We’re calling this one the solidarity rule. Think of it as going down together.’”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-huh?! What’s with that?! That’s just crazy! So, if we appointed some random dude as the representative, they could take down the leader of another class?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t imagine it would be that easy. Selecting a representative would involve a certain degree of screening. We probably wouldn’t be picking obvious sacrificial pawns to fill the role, and if we did, it would be the group’s fault. It was unlikely we’d find someone willing to both sacrifice themselves for the group’s sake and take down a student from an enemy class in the process…unless, of course, we were talking about someone who’d been trapped in Class D for years and was on the verge of dropping out anyway. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut if there were students who were contemplating giving up in that way, their peers were probably aware of the fact.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry,” Chabashira said. “The representative can’t just take \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eany\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e student down with them. Only students whom the school deems contributory to the group’s failure can be selected for expulsion in this way. Unless you deliberately score poorly or boycott the test, you’ll be fine.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, that was something, at least. However, I had my doubts about the representatives for this exam. This was unlike any previous situation we’d been in—particularly the fact that this time, the exam was the same for all grade levels. The other classes were probably receiving the exact same instructions right now. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, many different strategies were currently in the process of being formed. This wasn’t just a fight between the first-years. The second-years were battling other second-years and third-years other third-years. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI sent off a text message to a certain individual, hoping to clear a few things up. I wanted to know if the student council was somehow involved in creating this special exam.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“One more important detail. If a student is expelled, that student’s class will be penalized accordingly. The specifics of the penalty change depending on the exam. In the case of this test, one hundred points will be deducted from the class. If the class has insufficient class points to pay off the penalty, they will be in debt. Until that debt is paid off, their total will remain at zero.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe benefits were enormous, but the negatives were just as vast. The promise of doubling your points by being a group representative was tantalizing, but it came with the risk of being expelled. No one would willingly volunteer for such a role unless they were confident in the abilities of their small group. Nor, however, would they want the spoils of the representative’s victory to go to another class. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen there was the solidarity rule, which was clearly designed to leave you at an impasse.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That concludes my explanation. I will now open the floor for questions.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata immediately raised his hand.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If someone were to be expelled…would there be any way to help that person, like a lifeline?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re expelled, you’re expelled. Nothin’ ya can do ’bout it,” replied Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata rejected that outright. “That can’t be true. You were almost expelled once, Sudou-kun, but were saved thanks to Horikita-san’s quick thinking. It would be strange if there was nothing we could do.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira smiled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s correct. You can buy a Revocation of Expulsion using private points as a last resort. Naturally, the price will be high. The Revocation of Expulsion costs twenty million private points \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eand \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ean additional three hundred class points. This lifeline will only prevent a student’s expulsion. It won’t cancel out the penalties suffered by the class as a result of that expulsion. Of course, if you don’t have the points to pay for the lifeline, then that option is unavailable.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAn exorbitant price. It meant a minimum of four hundred class points would be required to save a student on the brink of expulsion, which made it a lifeline we were unlikely to extend. The whole class would have to pay a great toll to save one person.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Regarding the twenty million points you mentioned, can the entire class pitch in?” asked Hirata, who was clearly considering a future where we might use the lifeline.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, everyone may pitch in. But this is completely irrelevant, since you have only a few points available.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, Chabashira was done reviewing the materials.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There isn’t much time left before we reach our destination. You are free to use the remaining time however you like. Right before we arrive, I will re-collect the handout. Also, the use of phones will be forbidden for a week. I\u0026#160;will be collecting those shortly. Other than that, you are free to bring daily necessities or playthings along with you, but not food. Perishables must be consumed before we arrive, or you’ll have to throw them away before you get off the bus. That’s all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStudents who hadn’t reacted to the dangers of the special exam now let out agonized wails at that last comment. We’d already gone through this on the uninhabited island, but I supposed it was painful to have your phone confiscated for a whole week.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have a question!” Ike raised his hand energetically. “You said that guys and girls would be separate, but, like, exactly how spread out are we gonna be?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira wore a wry smile. “There are two buildings at the camp. The boys will use the main building, and the girls will take the other. The buildings are next to one another, but you’ll be living apart from each other for a week. You will not be allowed to go outside during recess or after school without permission either.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So we won’t be able to talk to each other?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, boys and girls will take meals together in the cafeteria in the main building for one hour a day. The school issues no directives to students during that time period. You can do as you please then. Understand?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes!” Ike rejoiced, probably happy he’d be able to talk to girls. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI sat up slightly and glanced at Shinohara, who was sitting nearby. While she looked slightly exasperated, her face brightened at Ike’s words. Maybe their Christmas dinner had gone well.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If there are no further questions, that’ll be all,” said Chabashira, probably anticipating a lot of silly questions coming her way.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sensei. May I borrow your microphone?” asked Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course.” Chabashira handed it over and returned to her seat. Hirata took her place at the front of the bus.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Based on what sensei said, we’re running out of time. Still, I’d like to try to hear everyone’s opinions. How can we get through this exam? What kind of groups should we shoot for?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wouldn’t it be best if we tried to get as many of our classmates in as possible? Pick twelve toppers and then get one person from every other class. That’d be perfect,” said Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That would be ideal, but I doubt three students from other classes would want to join that group. They’d naturally be on their guard.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt would be obvious that such a group wanted to win badly. I couldn’t imagine single students from each of the other classes being willing to join them. Besides, if such a group ranked poorly, the damage to the class would be considerable.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, if all the smart people get in one group, then the rest of us don’t stand a chance,” said Yamauchi. Apparently, he still hadn’t figured out that this wasn’t about academics. “I mean, we really wanna get some private points ourselves.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHis complaints were understandable. This issue had come up during the exam on the cruise ship too. The large group who ranked first would earn private points, but the students in the bottom groups gained nothing. In fact, they would lose a great deal. Given that, most people obviously wanted to bet on the winning horse by joining a large group that was likely to win.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If everyone here agrees, I’d like to propose an even distribution,” Hirata said. “We don’t know which group will come out on top. If any of us gain private points from this exam, we’ll distribute those points evenly across the class. That should be fine, since point transfers are allowed.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd if we got hit with a deduction, it wouldn’t be so bad, since everyone would be sharing the load.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, I see. That’s okay.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, the more exceptional students would complain about this, but considering what was at stake, a consensus seemed likely. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter hearing Hirata’s proposal, Chabashira chuckled, facing away from him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t tell you this because you didn’t ask, but as a reward for your promotion to Class C, I will give you one bit of helpful advice.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAdvice?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata looked cautious, not ready to accept this reward at face value.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When the rules don’t forbid it, you’re certainly free to transfer points. Be it in the middle of an exam or in the course of your daily life—you can transfer points as much as you please, as long as you don’t break any rules in the process. However, private points are not pocket money. You’d do well to remember that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you saying we could, like, transfer to any class we wanted if we accumulated like twenty million points? Or\u0026#160;is this about the lifeline?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m saying there are many different ways of using private points. Having as little as one point can help you in a time of need. Getting along and supporting each other isn’t always going to be the correct answer, you understand? For example, let’s say Ike made a mistake that would lead to him being expelled unless a million private points were paid right away—and the school disallowed transferring points in that instance. Ike would have to produce the million points himself or be expelled. What then? If you divide your points up equally, you might end up doing something you can’t take back.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke gulped loudly when he heard himself used as an example.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can’t count on other students to save you, because every single one of them might find themselves in need the next moment. The only one who can protect you is you, yourself,” said Chabashira. “People who work hard are rewarded. That much is obvious. Once you enter the real world, it’s exceedingly unlikely you’ll find people who’d gladly share their salary and bonuses with friends.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps we should be grateful for the advice…but this was just going to make it harder to unite the class. I didn’t doubt everything she was saying was true; I couldn’t imagine any teacher at this school would stir up trouble just because there was no precedent for something. Chabashira always played by the rules.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat said, there was more to this conversation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was sure there had been prior instances of individuals saving up private points. But conversely, I was equally sure there had been incidents where students were saved because their classmates had accumulated a great many points. How did I know this? Well, from personal experience. In the past, Horikita and I worked out a solution to provide Sudou with points when it seemed he was about to be expelled. That then set a precedent. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUltimately, sharing points evenly among ourselves could be seen as a preventative measure to be deployed in unforeseen situations. Having individual students hold onto a large number of points raised the risk of that person embezzling those points or betraying the class. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira had just said something that disrupted her own class’s chances at cohesion. I couldn’t reject the possibility that it was just school policy, of course, but…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, shall we put it to a majority vote? I’d like to at least hear what everyone is thinking. Can the people who want to split the rewards please raise your hands? It’s okay if you change your mind later,” said Hirata. He lifted his hand at once.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnly a few hands went up. Most of my classmates looked worried. Coming together as a class was important, sure, but when push came to shove, you had to have a way to protect yourself. Most students probably had only somewhere between ten thousand to a hundred thousand private points. Given that, it was no wonder many wanted to keep those points as a safety net.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStudents who lacked confidence in their own abilities, on the other hand, were more likely to want points to be shared across the class. There were a few more such students than I’d expected, but in the end, less than half the class raised their hands.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe majority was against point splitting. Hirata’s motion had failed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Was my advice unnecessary, Hirata?” Chabashira asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I’m thankful for it. It’s valuable information at this stage.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy phone vibrated. Thinking the certain individual whom I’d messaged might have replied, I took my phone out of my pocket—but it was his little sister, Horikita, who’d texted me. Naturally, it was about the special exam.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Do you have any ideas?”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e she wrote. Jeez, always trying to make me do things.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“None,”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I replied. After thinking it over, I sent another message. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Guys and girls are going to be separated in this exam. I can’t help with anything. Do your best.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy attempt to offer her some encouragement. I was sure Horikita had a lot she wanted to say in return, but I didn’t want to listen. I closed the text thread and checked on another of my group chats: that of the Ayanokouji Group (named after myself, but not in a boastful way).\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKeisei, Akito, and even Airi and Haruka all happily discussed the exam. I read through their texts, closed the chat without adding any comments, and resumed listening to Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We don’t have enough time to come up with a strategy,” he was saying. “If the boys and girls are going to be separated, sending advice to each other will get tricky.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No way…” The girls looked understandably uneasy at the prospect of being unable to turn to Hirata, who held the class together and had always been a guy they could rely on.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Since the boys won’t be able to lend a hand, I think the girls should decide on a leader right now. Will you accept the role, Horikita-san?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata had probably been chewing over this since Chabashira began to explain the exam. He’d singled out Horikita because she was the only one capable of handling the role.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Very well. If anyone’s having difficulties, feel free to approach me at any time. I don’t mind,” replied Horikita. She showed no signs of displeasure, but, even though she was gradually becoming more of a person our classmates could depend on, she didn’t warrant anywhere near the level of trust that Hirata did. Of course, being Horikita, she was surely aware of that. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, I’m sure quite a few of the other girls will find me lacking,” she continued. “I don’t like to say this of myself, but I have a somewhat abrasive personality.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYeah, that really wasn’t something anyone would want to admit.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Which is why I’d like Kushida-san to assist me. What do you think?” said Horikita, directing this to Kushida, who sat near the front of the bus.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-will I even be useful?” asked Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course. Everyone in our class trusts you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um… Well, okay. If you’d like, I’ll help.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you. In the event someone finds it difficult to speak directly with me, you can do so via Kushida-san. I don’t mind. I will respond to any issue, no matter how trivial.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile Kushida’s trustworthiness was a matter of some concern, this strategy was unquestionably the best we had right now. The exam rules made it fairly difficult for guys and girls to meddle in each other’s affairs. Despite being held in the same general facility, our classes and tests would take place in separate locations. The guys would have no opportunity to participate in any of the battles being fought on the girls’ side. With our phones being confiscated to boot, our only opportunity for contact would be the one hour we had for dinner.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat being said, it was vital we be able to gather as much information as possible. I was going to need a gofer to funnel information to me from the girls. Kushida worried me. This left Horikita or Kei as options, and the former had a lot on her plate right now. I also had to consider the fact that she tended to read too much into my intentions and take unnecessary actions. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMore importantly, if she was going to be fielding consultation pleas from the other girls, she probably wouldn’t have energy to spare for much else. I supposed I’d have to use Kei after all, though I couldn’t force her to survey the entire group by herself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI sent the bare minimum of necessary information over to Kei’s phone. She immediately replied with a blank message to confirm receipt. Given we’d just learned that the unique nature of this test would force the guys and girls to do battle separately for a while, she must have assumed I’d be contacting her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei probably wanted some advice herself right now. Considering the rules of this exam, particularly the ones about the representatives and their ability to take someone down with them, it wasn’t outside the realm of possibility that Kei might wind up as a sacrificial pawn. I\u0026#160;couldn’t say she was doing well at the moment, whether in terms of her test scores or her behavior in class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was why I was going to teach her a few tricks to protect herself. They weren’t things that every student could pull off, but they could keep you safer, if only slightly so.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs for me, I couldn’t really care less about the special exam. I had no intention of executing any winning strategies. All I wanted was to make it through safely and without incident.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis didn’t mean I wouldn’t be making any moves at all—like what I’d just done by giving Kei advice. In a worst-case scenario, this special exam could lead to several students getting expelled from C Class. I couldn’t protect the entire class by myself. I had to narrow down the list of people I wanted to safeguard.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBesides myself, I wanted to protect Kei, who’d become a staunch ally, and Hirata. Considering my involvement with the student council, I needed to ensure that Horikita stuck around, too. Then there were my friends: Keisei, Akito, Haruka, and Airi. They couldn’t be my top priority, but as their friend, I certainly hoped they wouldn’t be expelled. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFinally, given this rare opportunity for grade levels to intermingle, I should keep an eye on Nagumo’s movements. Any other minor skirmishes that occurred around me were beneath my notice.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e2.1\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE BUS GOT OFF\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the highway and began to drive up the paved mountain road. I wondered why our school outings always took place in nature, like this location or the ocean. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt any rate, a new special exam was about to begin. Given they were confiscating our phones, this was certainly going to be that annoying kind of test where you had to gather information either on your own or by using your connections. And, since more information would be leaked the more carelessly you acted, prudence and discretion would be vital.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not cut out for this…” I muttered, letting my honest thoughts slip forth. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo matter how many special exams we went through, I just couldn’t get used to them. I’d so rarely had to cooperate with other people before.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We will arrive shortly,” Chabashira said. “Once there, you will form your groups. Then, as soon as room assignments have been completed, you will have lunch, followed by free time in the afternoon.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That means… Yay! We don’t have to study!” Ike beamed at me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTrue, but this wasn’t vacation. It was a school day. Even taking the travel time into account, it was odd that they were letting us off the hook this afternoon—it felt almost like a normal field trip, which couldn’t be right.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe bus pulled into the stop and slowed to a halt.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When your name is called, hand over your phone and get off the bus. Ayanokouji. Ike—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira started with the boys, calling our names in syllabary order. I turned my phone off and put it in a plastic box that sat next to our teacher. As I disembarked from th
