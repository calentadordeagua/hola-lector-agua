[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:Tf4dc,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 7:\u003cbr/\u003eWhat Is Lost, What Isn’t\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT WAS EARLY\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e in the morning on the seventh day. The last full day. The final test would be held the next morning. Although Hashimoto’s quick thinking had kept our group from collapsing, the alliances we’d slowly developed as we came together would end with that test. There were probably more than a few people here who felt a hint of reluctance to part ways. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt the end of the day, despite their dislike for Kouenji, I thought most of the students in our group were getting along well. Well, Ishizaki probably hated me even more than he did Kouenji, but he was doing his best not to let that show. He probably wanted nothing more than to confront me but knew exactly what would happen if he tried it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki was like Sudou, in that they were both quick to lose their tempers and had a coarse way of speaking. However, Ishizaki was cannier than Sudou. I also got the impression that he respected his opponents and earnestly acknowledged their strengths. That was probably why Ryuuen had kept him close. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat didn’t mean Sudou was inferior to Ishizaki. He was more athletic by far, and at this point in time, probably doing better than Ishizaki academically too. As long as Horikita was helping him, Sudou would probably continue to improve. He and Ishizaki might be similar, but they had different weapons at their disposal.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I want to talk about the long-distance relay tomorrow. Please hear me out.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone, still in their beds, looked over at Keisei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s only ten of us, so each person will be shouldering quite a bit of responsibility. But depending on how things play out, we might be able to turn this to our advantage.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean? Isn’t it better to have more people, so each of them has to run a shorter distance? Wouldn’t that be easier?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s certainly true that if fifteen people had to split the burden equally, each person would have less to do. But the larger the group, the higher the probability that you’ll have slow students on your team. I can count the number of people who are good at running long-distance marathons on my fingers.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, you’ve got a point.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In other words, this is our chance to close the gap.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But that’s assumin’ our entire group’s athletic, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki looked around. I could be classified as athletic, but since we couldn’t really count upon Kouenji, that meant the only other runner in the group was Hashimoto. We didn’t exactly have a surplus of speedy people. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is going to sound pathetic, but…despite saying all that, I probably won’t be of any use,” said Keisei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe knew his limitations best. Of everyone in the group, Keisei had the worst stamina and speed. But as the representative, he came up with a plan.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The long-distance relay is eighteen kilometers. The rules state that every person has to run a minimum of 1.2 kilometers. So in a group of fifteen, everyone would have to run the same distance: 1.2 kilometers each. However, in a group of ten people, you can make significant changes to how you allocate the distances.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We can’t just say someone’s injured and can’t participate, can we?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Any absence on that day due to injury or illness will result in a penalty. Not only will that cause more trouble for the remaining people, it also costs us time. That’s no good. Plus, the changeover point has to be every 1.2 kilometers.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe school was working hard to squash any loopholes. Students would have to do what was required of them. So Keisei and Yahiko, who lacked confidence in their speed, would have to run the minimum distance of 1.2 kilometers. The three guys from Class B might be placed at that bare minimum too. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlbert was reasonably fast, but the problem was his stamina. Even if everyone else in the group ran the bare minimum distance, the remaining four people would each have to run an average of 2.7 kilometers, if not more…but students who were skilled in long-distance marathon running might very well be capable of that. Which meant the thoughts crossing my mind were exactly what Keisei was getting at.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, I’ll run 3…nah, I’ll do 3.6 kilometers,” declared Ishizaki. He was certainly one of the few members in our group who could handle it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnother person raised his hand.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, it looks like I gotta do the same thing. I’m not too shabby when it comes to running long distances myself,” said Hashimoto. Two of the most qualified members of the group had earnestly promised to shoulder a significant burden. That meant we’d covered 7.2 kilometers.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKeisei bowed in gratitude. If this was how things were going, I supposed I needed to cover a certain amount myself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then…I’ll try to do what I can. I don’t know how fast I can run it, though,” I told Keisei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that okay, Kiyotaka?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just don’t expect too much from me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, the crucial part was what came next. The man known as Kouenji—the person with the highest potential here, the person who topped our class in stamina and athleticism, whom not even Sudou would hold a candle to. The more Kouenji ran, the easier it would be for the other students. He would probably run the minimum distance of 1.2 kilometers, but he had yet to promise to do anything more than that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMore importantly, there was no telling if he would \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eseriously\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e run. Even if the nine of us ran our hearts out, we’d be done for if Kouenji decided to stroll along.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kouenji. I would like you to run too.” It was precisely because Keisei was aware of being the weakest link himself that he bowed his head even lower when addressing Kouenji. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji sat in bed, looking at his own fingernails and smiling.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kouenji.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKeisei calmly called his name once more.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I will run, of course. However, unlike those fellows, I am not so inclined to run long distances,” said Kouenji.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, it wouldn’t have been like him to agree right off the bat. Ishizaki glared at Kouenji but didn’t attempt to hound him. The last few days had made him begin to understand Kouenji’s actions better, including their apparent meaninglessness. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I would like to avoid our group placing last.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose so. I understand what you’re saying, Glasses-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShifting his gaze away from his fingernails, Kouenji glanced at Keisei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if running long-distance is impossible, I will at least run 1.2 kilometers with serious effort.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone in the group looked at Kouenji.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I cannot make any promises. Even if our group does place last, it’s not as though I will be expelled. Only you, the representative, will be. You surely wouldn’t do something so \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003einhuman\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e as drag a classmate to ruin with you. Isn’t that right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf the representative had been someone like Ishizaki or Yahiko, then perhaps Kouenji would have run. But since it was Keisei, a classmate, he figured he was safe. If we threatened him with expulsion regardless, there was a slight chance we might be able to get him to run here and now—but only at the cost of never having his cooperation ever again.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then tell me. What do we have to do to get you to cooperate? If paying you private points will help, I’ll do that,” said Keisei. Again, it was precisely because he understood he was the greatest liability in that group that he was willing to pay out of his own pocket.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t carry that burden alone, Yukimura,” Hashimoto said. “I don’t have much, but I’ve got points.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll pay too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYahiko and the other guys joined in, agreeing to help out. I guess it was like they said, every little bit counts. If the nine of us pooled our points, we’d end up with a fairly large sum. How would Kouenji react to the unified wishes of the entire group?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unfortunately for you, I’m not exactly struggling as far as private points are concerned. Besides, I could lead a fulfilling life at school even if I didn’t have any points, you see.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I’d anticipated, he wasn’t even slightly moved by our promise of cash. Asking him to do his best for the group’s sake was clearly pointless, too. Everyone in the group, myself included, had racked their brains for the last few days, trying to figure out how to get Kouenji to cooperate. Our seniors had tried too. And every attempt had ended in failure. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you saying that you won’t run for us?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I suppose so,” said Kouenji after a moment’s thought. “It doesn’t seem that I will be an asset to you all,” he added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki, who’d held himself back so far, stood up to go for Kouenji, but Keisei stopped him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, rest assured about one thing. While I don’t intend to do anything more than what is required, I will do the bare minimum. I have my own way of doing things, you see.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So that means…you’ll produce average results?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That is correct. Of course, even by doing the bare minimum, I will still most likely produce superior results. I suppose this is good news for you all, isn’t it?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had a feeling that everyone present understood what he meant when he said that. We’d started to feel like a team at long last, even if it was just barely so. We’d started thinking about what we could do for each other, as friends. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy analysis of the situation told me that the reality, however, was that Kouenji was acting from purely selfish motives. He’d behaved in completely unprecedented ways in every exam we’d had so far, but none of those things he did were enough to get him expelled. Kouenji had figured that there was a 99 percent chance that Keisei wouldn’t drag him down with him, but that still left the possibility, no matter how slim, of it happening. If he did perform poorly, the school would make note of it, and then he’d have no way of escaping the solidarity rule if it was invoked against him. A guy like him wouldn’t make that mistake.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whaddya mean, excellent results? You can’t even do something like \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ezazen\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e right.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh. I mastered things like \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ezazen\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e in my early childhood. It’s \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eno problem\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What was your childhood like?” someone asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji just laughed, ignoring the question. Still, this might be good enough for Keisei. Even though Kouenji had no intention of cooperating with us, he promised to do the bare minimum. That alone was huge. As his classmates, we knew the sheer extent of his potential.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were still several unknowns, like \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ezazen\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e and the written test, but we could at least place our faith in Kouenji’s physical fitness for the marathon.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e7.1\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eW\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eITH ONE PROBLEM SOLVED,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e it was time for our morning dusting. When Keisei was about to start cleaning, Ishizaki went over and picked up the dustcloth.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Take a break. If you can’t run in the relay, that’ll be worse.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, but—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Rest. In exchange, do your best on the written exam. Get at least 120 percent, will ya?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay. It’s impossible to get 120 percent, but I’ll shoot for 100…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed Ishizaki finally understood what it meant to give and take. Keisei thanked him gratefully and sat down.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Quite prudent of you, Delinquent-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shut your piehole or I’ll kill ya, Kouenji. You haven’t done a single damn thing since the first damn day!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that so? Ha ha ha!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji didn’t take a dustcloth or broom. Instead, he left, strolling outside to be in nature. Even with the second- and third-years watching, he acted brash.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That dude is a disease. Can you guys even make it to the upper classes with him along for the ride?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven the Class D folks felt sorry for us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I can’t say I’m confident.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKeisei had always felt strongly about climbing the ranks, but Kouenji was a most bizarre variable. His performance tomorrow would have a huge impact on our scores. He’d promised to do the bare minimum during our morning discussion, but that guaranteed nothing. It was entirely possible he’d skip out on his duties as soon as he was out of sight. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf he refused to even participate in something like cleaning, there was a very real chance that we might come in last place. If that happened, even the upperclassmen who’d turned a blind eye to him so far might suddenly bare their fangs at him. While I generally thought of Kouenji as a calculating person who wouldn’t do something so foolish, his complete and total irrationality made me wary of the possibility that he might betray my expectations.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSensing Keisei’s anxiety, Ishizaki approached.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry. We just gotta compensate for him.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That sure doesn’t sound like you. You’ve become much more understanding in only a day.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shut it, Hashimoto. What, you got a problem?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No problem. Our group’s ranking impacts my own plans. I’d like for us to score at least one spot above the lowest rank. Isn’t that right, Yahiko?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah. Since our group’s a handful, we have no choice but to do our best. If we get a poor score, Katsuragi-san will be disappointed in us,” said Yahiko.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto had a wry smile on his face as he smacked Yahiko, who was focused on Katsuragi as always, lightly on the shoulder. Yahiko had to be aware he’d hold us back during activities like the marathon. He’d been behaving pretty humbly since the test started.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve squared off against Katsuragi many times on Sakayanagi’s orders. You probably resent me for that, but right now we’re allies for real. Please forget about the past.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm. Maybe.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYahiko didn’t shout or make a scene, but I got the sense his trust in Hashimoto had its limits. Some part of him likely couldn’t forgive Hashimoto for the way Katsuragi had been hindered by his own classmates so far.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Didn’t you set up Katsuragi-san to be the representative?” asked Yahiko.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I had nothing to do with that. That was Matoba’s plan.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYahiko didn’t seem convinced. But he controlled himself, choosing not to disrupt the group. I had to give him credit for that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e7.2\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT WAS OUR FINAL DINNER\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e before the exam. I spotted Ichinose walking past, carrying a tray, and called out to her. I wasn’t attempting to draw information out of her. It was just that, well…something seemed a little off about\u0026#160;her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is something bothering you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Oh, Ayanokouji-kun. Nothing, really. I was just thinking about this and that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re facing a difficult problem, huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose seemed about to walk away but then stopped. “The final test is tomorrow. What do you think about this exam, Ayanokouji-kun?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s a really roundabout question.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I want you to tell me your honest thoughts.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess it seems different from the exams we’ve had until now. A little tougher. There’s a high risk of expulsion.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. But we’re in our third semester now. Isn’t it only natural that things would get more difficult?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Speaking of risks, this whole representative system is scary, huh? Becoming the leader of a group.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Being the representative is very risky, but…becoming the representative for the sake of winning is also important, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t argue, just listened intently to what she had to say.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if you say there’s the risk of expulsion, I guess it’s kind of like…that’s all up in the air somehow. Like it doesn’t really feel real. …To be honest, there’s a great deal that’s still hidden from me. But what I’m really scared of isn’t losing class points or private points.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re talking about your classmates?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. The risk of losing one of them is unfathomable.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If a classmate were expelled, what would you intend to do?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What would I do?” Ichinose slowly looked up, a thin smile on her face. “Ayanokouji-kun, you really are a smart guy, aren’t you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why do you say that?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, normally, there’s nothing you can do if someone’s expelled, right? But you know there’s always a way.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It was a hypothetical question.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If it were really a hypothetical, you wouldn’t have used the word \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eintend\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, would you? You’d say, ‘What would happen?’ or phrase it completely differently, like, ‘Would your class be okay?’ or something.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry. You’re giving me way too much credit. My language skills aren’t that advanced.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Still. I think you have a very respectable sense of intuition.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe then told me she’d gotten too caught up in chatting and that she’d see me later. Ichinose walked off, probably burdened with plenty of things she needed to ponder alone. I watched other students call out to her as she went. Being popular was rough. Even when you just wanted some time to think, people wouldn’t leave you\u0026#160;alone. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStill, Ichinose always had a smile on her face. But that didn’t seem to be the case today.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. Sorry, I’m just not feeling up to it today,” said Ichinose, walking away from two girls whom she was close to. She sounded dispirited. “Sorry. I just have some things going on. I feel like I’d like to be alone for today.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was no act. She seemed like a completely different person from when our first day at this camp.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSeeing that, I understood. Sakayanagi had made her move. The coming storm wasn’t just going to hit the guys. The girls might just be in for it, too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e7.3\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eS\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eINCE IT WAS THE FINAL DAY\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e before the exam, things had changed dramatically. The mood in the cafeteria remained unchanged, but you could clearly tell who was laughing and who was depressed. In short, there was a clear distinction between those whose groups were doing well and those whose groups were not.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I stepped out into the hallway, Kei was there, leaning against the wall near the entrance to the cafeteria. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe casually slipped me a piece of paper as I passed by, then immediately entered the cafeteria, probably going to meet up with her friends. As we parted ways, I looked at the slip of paper, then shredded it and divided the pieces up between several trash bins placed all around the building. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe’d held on pretty well throughout the week, but it seemed she was finally at her limit. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI walked to a corner of the school building, where the person whom Kei had been keeping an eye on for me was trying to grab some alone time. Solitude was a limited resource at this camp. There was the middle of the night, sure, but others would notice if you were gone from your shared room for a long period of time. Your best option was to make use of the time when everyone was gathered in the cafeteria. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I followed the person in question, she crouched down, like she was trying to hide. She didn’t notice me there. I watched her trying to hold back tears, and I hesitated, wondering what to do. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut no matter how hard it might be for someone to find this place, there was no telling when another student might just show up. I should wrap this up fast.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re in some kind of trouble…maybe you should talk to the former student council president?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThird-year Class A student Tachibana Akane looked up at me. Panicked at being seen in such a pathetic state, she quickly wiped her tears away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol8_INTERIORIMAGES_8\" src=\"/hola-lector-agua/images/books/v8/OEBPS/Images/ClassroomElite-Vol8_INTERIORIMAGES_8.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what is it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nothing. Just exactly what I said.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not in any trouble or anything.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re crying even though you’re not in trouble, that might be a problem in and of itself.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not crying!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs she said that, Tachibana averted her eyes from me. She probably wasn’t moving from the spot she was in because she knew her reddened eyes and the wetness on her face would be clearly visible if she went somewhere brightly lit. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sometimes I just want to be alone.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“True. We don’t get much private time, huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBathroom breaks were it, more or less, and you could only use those for so long. There were always students coming and going, seeing you there.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For the record, I’m on Former President Horikita’s side.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was a lie. But if I said that, Tachibana would trust me more.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Doesn’t matter. You’re not going to be any help.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell…when she put it like that, I had no response. In fact, I might accidentally give away something I didn’t want to if I kept going.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just consider the fact that it’s better if we’re not enemies.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, can you stop talking to your seniors in such a casual way? I haven’t said anything about it to you until now because Horikita-kun was there, but…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRather than the rebuke, what piqued my curiosity was the fact that she called him “Horikita-kun.” She usually continued to refer to him as President Horikita, which was odd in its own right, given he was no longer in office. She could tack on the word \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eformer\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e before that title, but the way Tachibana referred to him was strange.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You… It must be nice being a first-year. So carefree.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, you sound pretty scared. Are you anxious about the test tomorrow?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t feel anything. The representative’s at stake and all, but things aren’t bad between people in our group or anything. If anything, things are going great.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, why are you crying?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I told you, I wasn’t crying!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I pointed at Tachibana’s eyes, she panicked and touched her face to check for any fresh tears that might have welled up. When she realized I’d fooled her, she glared at me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita-kun…is the one that I’m worried about,” she\u0026#160;said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was a lie…and at the same time not. But I wouldn’t touch that just yet.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Worry, huh? Is there really anything to worry about when it comes to that guy?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita-kun… Horikita-kun has been fighting alone for a long time. He’s been fighting the second- and third-years all this time. You can’t possibly understand how difficult it is to have to face everyone all by yourself.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTrue. I’d never understand that, even if I tried.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know a little bit about how the second-years, particularly Nagumo, are his enemies,” I said. “But he has enemies among the third-years too? Not many people would want to rebel against the former student council president, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you take Horikita-kun for some kind of dictator? Even when he was student council president, he never did just as he pleased, like Nagumo-kun. You can never afford to let your guard down in any test.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had never gotten the opportunity to learn about the third-years’ internal affairs. I didn’t know a single thing about the elder Horikita’s background. But if she said they couldn’t afford to let their guard down in any exam, that meant…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait. You mean the class conflict among the third-years is still ongoing?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If Horikita-kun fails, then Class A will definitely fall.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo had said the same thing. He’d mentioned the gap between third-year Classes A and B was only 312 points. If Horikita’s brother was the main weapon at Class A’s disposal, or if Class B had a remarkably skilled student up their sleeve, it was certainly possible their lead might be overturned. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So even he’s just a normal student.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita-kun is…! Nothing. Forget it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe raised her voice unintentionally but then quieted herself. Tachibana began to speak, slower this time, as though letting her frustration spill forth.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s because the rest of us in Class A are always holding the class back. We lost a ton of class points that we shouldn’t have, and even private points, too… He’s always sacrificing himself to protect his comrades.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf what Tachibana was saying was true, then Horikita’s brother was much like Hirata—which surprised me, to be honest. Of course, if Tachibana, who was actually \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ein\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the third-year Class A, said it…there had to be some degree of truth to it. If I had to guess, there had probably been a lot of occasions when the elder Horikita handled things behind the scenes, so no one saw what a virtuous person he was. And the person who’d seen him do those things, by his side more often than anyone else, was this girl here.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So you’re depressed by the current situation?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even I’ve heard about what’s going on with the boys. Including the fact that Nagumo-kun challenged Horikita-kun to a contest, and because of that, he can’t make a move. We can’t help him at all.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That depends on how tenacious you are, doesn’t it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFresh tears may have welled up in her eyes, because Tachibana wiped them with her arm once more. Her concern for Horikita’s brother may have been one reason for her tears, but I was betting there was more to it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re in some kind of trouble, aren’t you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not. Not really.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not really?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re persistent, aren’t you? I’m not in any kind of trouble.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you say so, I must be mistaken.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You are. Please don’t say anything weird to Horikita-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that stern warning, Tachibana headed back to the cafeteria. She probably didn’t want Horikita’s brother to learn the truth of whatever was going on with her. But she’d made an error in judgment. This wasn’t a problem you could solve by sacrificing yourself. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose this means it’s checkmate if I don’t make a move, huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWatching Tachibana’s frail, slender back as she walked off, I was sure of that fact.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e7.4\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT WAS MIDNIGHT\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e when I was woken up by a slight creaking sound. A lone student was moving in the pitch darkness. Of course, despite the lack of visibility, I still knew who it was—Hashimoto, who was supposed to be sleeping in the bunk above me right now. He descended from the top bunk without making a sound and left the room without even bringing a flashlight with him. When he was gone, I slowly sat up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was most likely a bathroom break, but there were other possibilities too. What caught my attention was the fact that, over the course of the last week, Hashimoto hadn’t once slipped out of the room in the middle of the night to go to the bathroom. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter giving him a slight head start, I got up and followed. On the off chance that he happened to be standing outside the door, I’d just say I’d gotten up to use the bathroom too. We shared the same bunk bed; Hashimoto would just think he’d woken me up. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI stealthily went into the corridor. Even though the only illumination came from the emergency lighting and a sliver of moonlight, I could walk without a flashlight. Hashimoto headed toward the bathroom, then disappeared from view. I started following him. I quickly saw him turn left, even though the bathroom was straight down the hall.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo he didn’t need the bathroom, apparently. Hashimoto descended to the first floor and went outside, still wearing his indoor slippers. I hid myself, hugging the wall. There were no other students around. Maybe he simply came outside to get some fresh air because he couldn’t sleep. Or perhaps he was waiting for someone?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI learned the answer to my question right away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSensing that he was going to turn my way, I moved to a different spot when I saw another shadow, which I assumed was his target. The shadow moved along the same path as Hashimoto and went outside. It was so quiet you couldn’t even hear insects, which meant even a whisper sounded clear as a bell.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Ryuuen,” Hashimoto said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The hell do you want with me?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just wanted to chat. I mean, you stand out way too much in the cafeteria, dude. The only time I can talk to you is the middle of the night.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“On the last day?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. I called you here \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ebecause\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e it’s the last day. Right now, everyone else is sound asleep.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Guess you got a point.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo students would deliberately stay up late into the night when there was an exam the next day. Still, Ryuuen and Hashimoto…that was a pairing I wouldn’t have expected. Then again, Ryuuen had formed a relationship with Class A back during our time on the uninhabited island. I wouldn’t be surprised if Hashimoto had played the part of intermediary. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Look, I’m not good at talking about stuff in a roundabout way. So I want to hear a straight answer. Did you really quit being the class leader?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hee hee hee. Doesn’t seem like you believe it, huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At the very least, I don’t buy that Ishizaki and the others worked you over,” replied Hashimoto, zeroing in on the detail that stuck out to him. True, the idea of Ishizaki beating Ryuuen was pretty dumb.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ishizaki aside, Albert’s trouble. If we really went head-to-head with one another, it’d be brutal.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Well, Albert’s certainly a threat, I guess. But the Ryuuen Kakeru I know isn’t the kind of guy to cower before an opponent. If anything, he’s the sort of guy who’s always thinking up counterattacks, isn’t he?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRather than diminish Hashimoto’s suspicions, what Ryuuen had said only heightened them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just got tired of trying to unite people who keep rebelling against me. As long as I continue to bleed you Class A folks dry, I’m in the clear. I ain’t got any obligation to those other guys.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. So that’s it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did I convince you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not sure. I’m still fifty-fifty. Personally, I think I want you to fight back against the situation you’re in.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So you can score some more pocket change?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yep. I want the ‘promise of Class A.’ Just like you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf you could save up twenty million points, then you could buy the right to move into A Class. A student with the means to do that could rest easy—an enviable situation. Making that goal a reality was difficult, but it seemed Hashimoto was one of the students aiming to do just that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If the promise of victory is what you crave, I’m guessing you’re prepared to dispose of Sakayanagi?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If necessary.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto continued.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Selling out Sakayanagi doesn’t come cheap, Ryuuen. Right now, she’s at the top of our class. I’m on the winning team. Get it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’ll see how much of an opportunist you really are.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m pretty good at making my way in the world. You should know that I can come out on top pretty well. Anyway, I’m glad I could talk with you directly. Doesn’t look like you’ve lost your fire.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto yawned, then added one last thing.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol8_INTERIORIMAGES_9\" src=\"/hola-lector-agua/images/books/v8/OEBPS/Images/ClassroomElite-Vol8_INTERIORIMAGES_9.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When you got overtaken by Hirata’s class, I wondered what the hell you were even doing. But they might be a tough bunch after all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you examine each member with a level head, you can see they’re pretty evenly matched. I’d like for them to be crushed as soon as possible.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh. To think a guy like you would be sizing them up. Any particular guy caught your interest?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kouenji is a threat, at the very least. To be honest, if he started acting to his class’s advantage, there’s no telling what would happen to Class A. They also have academically gifted students like Hirata and Yukimura, and Sudou, who’s easily one of the most athletic students in our grade.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know about those other guys, but I can’t imagine Sudou will do anything terribly special.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto chuckled in agreement.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, there’s no telling what will happen, but here’s something to keep in mind. Even if Hirata’s group does manage to make it all the way to Class A, I’m fine as long as there’s room for me to slip in there too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I doubt you have that much power. Try not to get burned,” said Ryuuen mockingly, as if to end the conversation there.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s shitty, but dragging this out is just a hassle.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI thought they’d wrap up there, so I prepared to move. Hashimoto would probably head back to the room. If I wasn’t asleep before he got back, he might suspect something. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut I sensed someone else approaching and stopped in my tracks. One of the two people who drew near immediately noticed Ryuuen and Hashimoto and called out to them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s up, first-years? Having a secret meeting at a time like this, huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo Miyabi and Horikita Manabu stood before the two conspirators. Ryuuen paused for a moment, then immediately seemed to lose interest and made to leave. He walked right toward Nagumo, who didn’t budge.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Outta the way.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo laughed, like he found Ryuuen’s glare amusing. Meanwhile Hashimoto, who had come back into the corridor to see what was going on, locked eyes with Nagumo. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve heard you’re quite the delinquent. Your name’s Ryuuen, right? I’m going to have a little chat with Horikita-senpai, but you should come along.” Nagumo beckoned Hashimoto, summoning him to join them too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ain’t interested,” said Ryuuen, shoulder-checking Nagumo as he passed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, you’re confident. Not scared of me, Ryuuen?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Doesn’t matter if you’re student council president or whatever. I’ll crush anyone who gets in my way.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo seemed to have a certain degree of interest in Ryuuen, who wasn’t bothered a bit.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t dislike people like you. But you’re not really fit to be part of my student council.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs Ryuuen tried to walk away, Nagumo called out to him once again.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, how about you join this wager, as a third party? Which group do you think will place higher in today’s special exam, mine, or Horikita-senpai’s? How about ten thousand points a head? No matter which side you bet on, I’ll pay up if you’re right on the money. If you’re wrong, though, you gotta pay up.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s dumb. Not interested in that kind of money.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ten thousand is ‘that kind of money’, huh? You’re in Class D, meaning you’re always short on cash, right? Can’t hurt to earn a little more.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, make it a million. I’ll play along if you’re willing to pay up,” said Ryuuen, turning around.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hahaha! You’re a funny guy, Ryuuen. Talk about a ballsy joke. You can go now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, he thought Ryuuen’s proposal was a joke.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you don’t got the guts to pay up that much, don’t bother asking me to make a bet.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, you. First-year. You think Ryuuen can pay that much?” Nagumo asked Hashimoto.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince Hashimoto was aware of Ryuuen’s secret arrangement with Class A, he knew Ryuuen definitely had enough. But…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not sure. We’re in different classes, so I can’t really say.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we had our phones, we could check. I wouldn’t mind playing along then. Too bad.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLooked like the wager wasn’t going to happen then. Hashimoto moved to make his escape, and Nagumo shifted his gaze over to Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita-senpai. Please abstain from taking the exam tomorrow,” Nagumo said abruptly. Ryuuen continued walking, seemingly uninterested, but Hashimoto stopped in his tracks.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Abstain?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s an even worse joke than Ryuuen’s.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Actually, I’m being quite serious.” Nagumo added something else. “It’s for your own sake, senpai.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please explain it to me in a way I can understand. You have a habit of just saying everything in your head, and it seems like you have yet to address that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry. Being able to see too far into the future is a curse. Anyway, if you don’t kindly abstain tomorrow, senpai, you’ll regret it. What I’m saying is that I’m trying to help you. I could just put the hurt on you without warning, but that would just be heartless, wouldn’t it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you planning? Depending on what it is, I may not accept.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand. The rules of our contest are that we have to fight fair and square, without involving any third parties. But the way things are, if the exam takes place, we won’t know which of us will win until we get a look at the results. Of course, it’s only to be expected that this will be a close race. But that’s exactly why I want to win. And I’ve been taking steps to ensure I do.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that why you want me to abstain?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. Because abstaining will allow you to get through this with the least amount of damage, senpai. Are you aware of the strategic groundwork that I’ve laid? No, you aren’t, are you? There isn’t a single student at this school who can read my thoughts. That’s what this is. Even your little favorite is the same… Who was that first-year again?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo looked intentionally at Hashimoto. But there was no way Hashimoto knew.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, that’s right. If I recall, he’s in the same group as that first-year. Ayanokouji Kiyotaka.” Nagumo clearly emphasized my name, as though he were trying to make Hashimoto aware of it. “What do you think, Hashimoto? About Ayanokouji.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do I…? Well, I think he’s just a normal student.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto was visibly shaken after unexpectedly hearing my name come up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know, right? But Horikita-senpai here seems to value Ayanokouji over all other first-years.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe because he performed well at the relay during the Sports Festival?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that would make sense. But that doesn’t seem to be all there is to it. See, Horikita-senpai prizes Ayanokouji above even Sakayanagi, even Ryuuen, even Ichinose. Since you’re in the same group as him, I thought you might have noticed something.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why is that, senpai? Please, I think it’s about time you tell me the reason.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re reaching, Nagumo. When have I spoken highly of Ayanokouji? There is nothing to be gained by spreading lies. Stop teasing the first-years.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, senpai. I suppose you’re right. My bad, Hashimoto. That was a little joke.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that so…?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t like where this conversation was headed, but it was time I got out of there. The three of them were blocking the corridor, so I needed to use the stairs on the opposite end of the building. It meant taking a detour, but I decided to go the alternate route. I had to be back by the time Hashimoto returned, or it might end up making him suspect there was something to what Nagumo was saying. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA few minutes after I returned, Hashimoto quietly entered the room. I felt his gaze fall upon me from the top bunk, but only for a moment. Afterward, he went to sleep.\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 7: What Is Lost, What Isn’t\",\"volumeId\":\"v8\",\"chapterIndex\":13,\"prevChapter\":{\"volumeId\":\"v8\",\"chapter\":12,\"title\":\"Chapter 6: Ubiquitous Things\"},\"nextChapter\":{\"volumeId\":\"v8\",\"chapter\":14,\"title\":\"Chapter 8: The Second Half of the Girls’ Battle: Horikita Suzune\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Title Page\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Horikita Manabu’s Soliloquy\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: A New Special Exam: Mixed Training Camp\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: Human Nature Put to the Test\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: A Premonition of Defeat\",\"href\":\"Text/section-0008.html#auto_bookmark_toc_top\",\"index\":10},{\"label\":\"Chapter 5: The First Half of the Girls’ Battle: Ichinose Honami\",\"href\":\"Text/section-0009.html#auto_bookmark_toc_top\",\"index\":11},{\"label\":\"Chapter 6: Ubiquitous Things\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_top\",\"index\":12},{\"label\":\"Chapter 7: What Is Lost, What Isn’t\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_top\",\"index\":13},{\"label\":\"Chapter 8: The Second Half of the Girls’ Battle: Horikita Suzune\",\"href\":\"Text/section-0012.html#auto_bookmark_toc_top\",\"index\":14},{\"label\":\"Chapter 9: Blind Spot\",\"href\":\"Text/section-0013.html#auto_bookmark_toc_top\",\"index\":15},{\"label\":\"Epilogue: Postscript\",\"href\":\"Text/section-0014.html#auto_bookmark_toc_top\",\"index\":16}],\"volumeTitle\":\"Light Novel Volume 8\",\"detailsLink\":\"/select/year-1/v8\",\"returnLink\":\"/select\",\"currentSpineIndex\":13,\"nextVolumeLink\":\"/select/year-1/v9\",\"nextVolumeTitle\":\"Light Novel Volume 9\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://classroom-of-the-elite-reader.vercel.app\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"COTE Reader\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"en_US\"}],[\"$\",\"meta\",\"7\",{\
