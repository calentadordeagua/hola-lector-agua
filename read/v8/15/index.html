yle=\" font-size: 1.00em;\"\u003e“No. The ironclad condition of Nagumo’s strategy was that he would pay all the private points himself. If he didn’t, there’s no way they’d cooperate.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMost likely, Nagumo had contacted Ishikura on the bus and paid him the twenty million points in advance. The proof of that could be seen in Ikari’s and Ishikura’s calm behavior. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The second-year class is a monolith. If he collected money from the entirety of the second-years, he wouldn’t even need fifteen thousand per person. Saving one student from expulsion could be bought on the cheap.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What a \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eseriously\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e insane way of fighting. That is definitely \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003enot\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e normal.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s how Nagumo Miyabi does things. That’s all there is to it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe didn’t come up with a strategy after seeing what the exam was like. He came up with a strategy and then created the exam. Class A, led by Horikita’s brother, would get stuck with paying twenty million private points in total, as a single class. Quite a bit of damage. They might have to face one or two more special exams before they graduated, and they’d just lost a staggering amount of money.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Horikita’s brother were expelled in the next exam, he wouldn’t have enough money to save himself. That lifeline would be dead in the water.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think it’s time we head our separate ways.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, one more thing.” Kei was persistent. “I can’t think of any way to counter the way Nagumo-senpai’s\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ethinks. The method he used to set Tachibana-senpai up for expulsion… It’s, like, the perfect trap or something. Is that why you didn’t make a move, Kiyotaka?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s quite a formidable strategy. Nagumo had a checkmate set up by the time his enemy got in the game.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was a good precedent to set. Private points could be powerful.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Say, what if I wind up in the same situation that Tachibana-senpai was in…? In a situation where you can’t even use a lifeline? I mean, there’d be nothing you could do at a time like that, right?” asked Kei in a soft voice.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t even need me to answer, do you? I won’t let you get expelled. No matter what methods I have to use.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the end, Horikita Manabu chose to part with Class A’s class and private points, thus saving Tachibana Akane. As I’d predicted, Ishikura from Class B did the same to save Ikari. An extremely unusual happenstance: two classes utilizing the lifeline option at the same time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom this point on, students across all grade levels at the Advanced Nurturing High School were going to be expelled, one after another.\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 9: Blind Spot\",\"volumeId\":\"v8\",\"chapterIndex\":15,\"prevChapter\":{\"volumeId\":\"v8\",\"chapter\":14,\"title\":\"Chapter 8: The Second Half of the Girls’ Battle: Horikita Suzune\"},\"nextChapter\":{\"volumeId\":\"v8\",\"chapter\":16,\"title\":\"Epilogue: Postscript\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Title Page\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Horikita Manabu’s Soliloquy\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: A New Special Exam: Mixed Training Camp\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: Human Nature Put to the Test\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"C
