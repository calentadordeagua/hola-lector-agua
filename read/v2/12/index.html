okay?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, yeah. I’m fine.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wondered if she was nervous. She seemed composed, if not completely calm.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought that things would be tough if I were absent today, so…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe understood that the entire class would be upset if she were absent, so she’d made the painful decision to come to school. I imagined it would be impossible to tell her not to think about Sudou and the others.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t forget what I said yesterday. Testify for your own sake, more than anyone else’s.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. I’ll be okay.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke and Yamauchi looked over at Sakura with great curiosity. Of course, that was because they now knew of her idol identity. Sakura was probably sensitive enough to notice this. She looked like she’d guessed that Ike and Yamauchi had discovered her identity. Oh no… \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut Sakura just wore a thin smile and quietly mouthed the words, “It’s all right.” She was aware that we knew of her double life. Maybe working as an idol had made her sensitive to subtle changes in a room.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e6.1\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003es the bell rang for the end of class, Horikita and I stood up. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Have you prepared for this, Sudou-kun?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah… I’m good. I was born ready.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs if mentally preparing himself for what lay ahead, Sudou closed his eyes and folded his arms. But then he slowly opened his eyes again.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You might call me a complete idiot and make fun of me, but I’m me. If you have something you want to say, say it now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t do anything selfish. Actually listening right now would be the clever thing to do, yes?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh, you always act so high and mighty, lady.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen you saw them like this, it did seem as though they fought like cats and dogs. But at the very least, Sudou didn’t hate Horikita. If he did he would’ve absolutely refused her help, no matter how advantageous her offer. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do your best, Horikita-san. Sudou-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita didn’t respond at all, but Sudou pumped his fist to show resolve. I turned to check on Sakura who was still sitting down, her body rigid. She stood, her lips trembling slightly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah… I’m okay. Thank you…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura was far tenser than I’d expected. If she was in this psychological state before the meeting had even begun, she might not be able to speak satisfactorily. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s go. We’ll make a bad impression if we’re late.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe discussion was scheduled to begin at 4:00 \u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003ePM\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. It was already 3:50 \u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003ePM\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. We couldn’t afford to take it slow. When the four of us got to the faculty room, a teacher waved at us to come on inside.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yahoo! Hello, Class D students!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe homeroom teacher for Class B, Hoshinomiya-sensei, gave us this happy-go-lucky greeting. “It seems like something rather incredible has happened, hmm?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer eyes sparkled, as if she enjoyed sticking her nose into other people’s business. (Well, she did).\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you doing this time?” Chabashira-sensei muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh no. I’ve been found out already, huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei glared over at Hoshinomiya-sensei as she exited the faculty room. “Whenever you sneak out, that’s around the time I start to feel suspicious.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHoshinomiya gave a cute wink, as if saying, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eTeehee, you got me! \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So I guess I can’t join in, huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course you can’t. You know that outsiders cannot participate.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aw, that’s too bad. Well, that’s all right. The results should be out within the hour, I guess.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei forcefully pushed Hoshinomiya-sensei back into the faculty room.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, shall we be going?” she asked us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re not going to do this in the faculty room, are we?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course not. This school does have rather complicated rules, but in cases such as these a settlement is reached between the homeroom teacher of the class in question, the concerned parties, and the student council.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita froze the very moment she heard the words “student council.” Chabashira-sensei turned and glanced sharply at Horikita’s face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you want to stop, now’s the time, Horikita.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou, who didn’t understand why Horikita would react that way, looked confused. It was almost as if a giant question mark was floating above his head. Our teacher, as usual, had revealed an important detail right at the last minute.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll go. I’m fine.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita quickly glanced at me. Her look probably meant something like, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eDon’t worry on my account.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e We left the first-floor faculty room and walked up three floors to the fourth. A placard that read “Student Council Room” was affixed to the wall near the doorway. Chabashira-sensei knocked, and we went inside.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though Horikita had winced, she immediately followed us. Inside, long tables had been arranged in rectangular formation. The three students from Class C had already arrived and were seated. Beside them sat a bespectacled male teacher in his 30s. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry we’re late,” our sensei said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s before the scheduled start time. There’s no need for apologies.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Have you already met?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou, Horikita, and I did not know the teacher.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is Sakagami-sensei, the homeroom teacher for Class C. Now then.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOne lone male student seated in the back of the room attracted everyone’s attention.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is the student council president.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita’s older brother, without so much as even a glance at his sister, pored over the documents on his desk. Horikita directed her gaze at her brother for a short time, but when she realized that she wasn’t his focus, she lowered her eyes and sat down in front of the Class C students.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, I would now like to discuss the violent incident that occurred last Tuesday with the members of the student council, the involved parties, and their homeroom teachers. You may begin the proceedings, student council secretary Tachibana.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSecretary Tachibana, a woman with short hair, gave a slight bow.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course, considering the magnitude of this dispute, there are times when the student council president will take over. There are several unusual things about this incident. Other than that, the bulk of the proceedings will be handled solely by Tachibana, as usual.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because I am quite busy, there are certain agenda topics upon which I will defer. As a general rule, though, I would prefer to attend to these issues, as I’m entrusted to lead this student council.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, this is all by chance?” Chabashira-sensei smiled as she said that, but Horikita’s older brother never wavered. On the contrary though, Horikita—Horikita the younger sister, I mean—couldn’t hide her trembling. Considering they were brother and sister, the odds were not in our favor. In fact, I couldn’t help but think that this situation was extremely disadvantageous, as Horikita couldn’t demonstrate her usual prowess here. Our expectations had been thoroughly shattered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf the student council president acted, there’d be nothing we could do, even if we didn’t like it. He’d enrolled in Class A and immediately taken office as secretary for the student council. In December of his first year, he became the student council president after receiving an overwhelming amount of support in the election. Although some senior students had naturally voiced their displeasure, our current, hopeless situation spoke to his incredible abilities. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSecretary Tachibana summarized the situation from both sides in an easy-to-understand manner. There wasn’t any need for further explanation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Based on the aforementioned facts, we would like for you to identify which version of events is true.” After completing her explanation and the preface to the proceedings, Secretary Tachibana turned her eyes toward us in Class D. “Komiya-kun and two other members of the basketball club went to the special building after Sudou-kun called them there. There, they claim to have been beaten up in a one-sided brawl. Is this true?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What those guys said was a lie. I was the one that got called over to the special building,” Sudou said. “That day, after practice, Komiya and Kondou asked me to go to the special building. Honestly, I thought it was kind of annoying, but I also thought it might’ve been because they were always hostile towards me. So, I went to meet them.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou wasn’t one to mince words. Normally, Horikita would have been disgusted by his casual way of speaking, but judging from her trembling she didn’t hear him at all. Sakagami-sensei, Class C’s homeroom teacher, stared in wide-eyed amazement.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s a lie. Sudou-kun called \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eus\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e over to the special building.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t screw with me, Komiya! You were the one who called me, you jerk!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t seem to remember your position here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou, irritated, impulsively struck his desk. Immediate silence followed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please calm down, Sudou-kun. Right now, we’re merely listening to what both parties have to say. Komiya-kun, we ask that you too please show some restraint, and not interrupt.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Puh, fine…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Both parties insist that the other called them over, so the accounts conflict. However, the stories share some commonality. There \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewas\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e a dispute between Sudou-kun, Komiya-kun, and Kondou-kun, correct?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wouldn’t call it a dispute. Sudou-kun’s always picking fights with us.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“‘Picking fights’?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sudou’s better at basketball than we are, so he’s always bragging about it. We practice with everything we’ve got, but it doesn’t exactly feel good when he makes fools out of us. So we often butt heads.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t really know the details of Sudou’s club activities, but when I saw the veins popping on his forehead, it was rather obvious that they were lying. Next, Secretary Tachibana spoke to Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not one bit of what Komiya said was true. Those guys are just jealous of my talent. When I practice, they constantly get in my way. That’s the truth.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNaturally, both sides claimed that the other party was at fault.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Both sides have given their grievances, but now we have to come to a judgment with the collected evidence.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sudou-kun beat us senseless. It was a one-sided fight.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass C seemed intent on focusing the discussion on their injuries. The three students \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eseem to have black-and-blue faces. That was undeniable.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s a lie. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eThey\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e attacked first. It was self-defense.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Horikita,” I whispered to Horikita, who remained mute and kept her head down. Clearly, this situation was really bad. If we wanted to stop Sudou from getting carried away, we had to take action sooner rather than later. However, she showed no reaction. It was as if her mind was gone. Did her brother’s mere presence truly have this much of an effect?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI flashed back to those two talking behind the dormitory. I didn’t really understand the depth of the situation, but I suspected that Horikita had chased after her extremely talented brother, enrolling in the same school to make him recognize her abilities. But regardless of her hopes and talents, the younger sister in Class D was still very far away from her brother, the Class A student council president. To prove herself, she’d have to rise up to the same arena as him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If Class D has no further proof to offer, would you mind if we continued the proceedings?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf the student council and the teachers continued to sit in complete silence, their judgment would almost certainly be merciless. To prevent that, we needed Horikita to rouse herself into action. However, our team’s most crucial member withered and shrank before her older brother.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would seem there’s no objection, given the arguments we’ve heard thus far.” The student council president finally spoke. Horikita’s older brother seemed as though he wanted to draw a conclusion as soon as possible.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Regardless which party called the other over, the fact remains that it was a one-sided fight between Sudou and the other students. We can clearly see that from the injuries they sustained. We have no choice but to come up with a conclusion based on that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-wait! I can’t accept that! It’s just because those guys were a bunch of wimps!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe moment that Sudou uttered those words, I saw Sakagami-sensei smile.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then can it really be considered self-defense when fighting against opponents of such unequal strength?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-but, hey. I was fighting against three people! Three people!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But only the Class C students were hurt.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was getting worse. I resigned myself to the fact that I might be killed later for doing this, but I got up slowly from my folding chair and stood behind Horikita. I stretched my arms out and grasped her sides as hard as I could.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hyah?!” Horikita cried out in an abnormally girlish voice. However, this was not the time or place for me to focus on that. Since she hadn’t yet regained her sanity, I grabbed her more forcefully and tickled her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-wait. S-stop, stop!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo matter how upset or dazed a person was, if you stimulated the body enough, they’d come back to her senses. Even if they didn’t like it. The teachers seemed somewhat taken aback by my actions, but right then I didn’t care. When I believed I’d roused her enough, I let go. Horikita, looking like she was about to cry, glared at me with startling intensity. I’d had to force her, but I knew it was essential to return Horikita to her usual self.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Get a grip on yourself, Horikita. We’re going to lose at this rate. You have to fight!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tch…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita, looked at Class C, then the teacher, and then her brother as if finally understanding our situation. It seemed to dawn on her just how desperate our situation was.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Excuse me. May I ask a question?” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you mind, president?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll allow it. However, please answer more quickly next time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita slowly rose out of her chair.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Earlier, you said that Sudou-kun called you over to the special building. But who exactly did Sudou call, and why?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKomiya and the other Class C students looked at one another, as if saying, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWhy is she asking that question \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003enow?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please answer.” Horikita added those last two words to reinforce her aggressive style of questioning. Secretary Tachibana allowed it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kondou and I don’t know why he called us over. When we’d just finished up for the day and were changing, he said he wanted to talk to us for a minute. Wasn’t the reason just that he didn’t like us?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So then, why exactly were \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e in the special building, Ishizaki-kun? You’re not on the basketball team, so you have no connection to this case. I’d think your presence there would be rather odd.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s… I came as a precaution. There were rumors that Sudou was violent. He’s also in better shape than we are, physically. I had to go, didn’t I?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So in other words, you felt the situation might turn violent?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah.” They answered in unison, almost as if they’d expected these questions. It appeared that the Class C students had thoroughly rehearsed for this conference.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. So you brought along Ishizaki-kun as your bodyguard, since he was reputed to be rather good at fighting. Just in case there was an emergency.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It was to protect ourselves. That was it. Besides, we didn’t know that Ishizaki-kun was known for being good in a fight. We just considered him a reliable friend.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita quietly listened to their responses, as if running various simulations in her head. Then she immediately made her next move.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I do have some knowledge of martial arts, if only to a certain extent. I understand that when you’re fighting against multiple enemies, victory becomes exponentially more difficult. So I don’t understand how you were defeated so handily, how the fight could be so one-sided, when you had a skilled fighter like Ishizaki-kun with you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because we didn’t intend to fight.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The primary factor in triggering a fight is the collision of the ‘energy’ between opponents. In the event that you don’t have any intention of fighting, or that you’re nonviolent, the probability that you’ll be hurt should be very low. Especially when there are three of you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita’s opinion was very objective, grounded in evidence, rules, and her own logic. On the other end, Komiya fought back with his own weapon, real evidence.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That way of thinking doesn’t apply to Sudou-kun. He’s exceptionally violent. Even if \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewe\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e were nonviolent, he’d still be mercilessly violent. That’s what happened.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe peeled off the gauze that covered his cheek, exposing the scrapes underneath. No matter how many reasonable arguments Horikita made, his injury gave powerful evidence.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you finished with your claims now, Class D?” said Horikita’s older brother coolly. After staying silent while Horikita gave her argument, his words were few and icy. His look seemed to suggest that if \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e was all we had to say, it would’ve been better not to say anything at all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s true that Sudou injured the other students. However, Class C started the fight. There is one student witness who saw the entire incident and can attest to this.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, Class D—if Class D’s witness would please enter?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura, looking worried and restless, walked into the student council room. She looked down at her feet, as if scared of danger.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“1-D, Sakura Airi-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought I’d heard something or other about a witness, but you’re a Class D student?” Sakagami, the Class C’s homeroom instructor, snickered while wiping his glasses.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is there a problem, Sakagami-sensei?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, no, please. Go ahead.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakagami-sensei and Chabashira-sensei exchanged looks.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You may begin your testimony, if you wouldn’t mind, Sakura-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yes, okay… Well… I…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe stopped speaking. A period of silence followed. Ten seconds. Twenty seconds. Sakura steadily looked further downward, and her face became increasingly pale.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sakura-san…” Horikita, unable to take any more, addressed Sakura. Unlike before, the words didn’t seem to reach her. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Apparently she didn’t witness anything. More of this would just be a waste of our time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why are you in such a hurry, Sakagami-sensei?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I want to speed this along. If we waste time, my students will suffer. These students are the joyful heart of their class, so I’ve no doubt that their many friends are worried about them. Also, they’re striving to improve their basketball skills, and we’re depriving them of valuable practice time. As a teacher, I can’t overlook this.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. You’re probably right about that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYou’d think that Chabashira-sensei would ally herself with Class D, but that didn’t seem to be the case. Instead, she nodded in apparent agreement with Sakagami-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re certainly right that this is a waste of time, so I suppose we have no choice. You can come down now, Sakura.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei ordered Sakura to leave, almost as if she’d lost interest. The student council members didn’t ask for a delay or anything. The writing was clearly on the student council room wall, and it spelled Class D’s defeat. Sakura closed her eyes tightly, as if she couldn’t bear it anymore, as if she regretted her own weakness. Even Sudou, Horikita, and I felt like this was impossible for Sakura, and mentally resigned herself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen, it happened. An unexpected voice reverberated throughout the room.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I definitely saw what happened!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was certainly Sakura’s voice, though it took me several seconds to recognize it. What most struck me was the volume of her voice.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The students in Class C threw the first punch. There’s no mistake about that!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol2_INTERIORILLUSTRATIONS_14\" src=\"/hola-lector-agua/images/books/v2/OEBPS/Images/ClassroomElite-Vol2_INTERIORILLUSTRATIONS_14.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura’s words had a force that belied the image she’d presented at first. She spoke so desperately that you wanted to believe she was telling the truth. She certainly made me believe it. However, much like a magical spell, the effect lasted for only a few minutes. If the audience remained calm, it wouldn’t be difficult for them to see through it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Excuse me, but may I say something?” asked Sakagami-sensei, raising his hand.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Normally, teachers are asked to speak as little as possible, but this situation is just too pitiful. Student council president, do you mind?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll allow it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In regards to what you’ve said, Sakura-kun, I do not necessarily doubt you. However, I have one thing to ask. You’ve stepped forward to testify as a witness, but you were rather late in doing so. May I ask why? I would think if you really \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e see something, you would have come forward much earlier.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakagami-sensei harped on the same point that Chabashira-sensei had.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s… Well, that’s… I didn’t want to get involved…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why didn’t you want to get involved?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because I’m not very good at talking with other people…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. I understand that. However, I’d like to say something else. You’re not good at talking with others, and yet when the week was nearly out you stepped forward as a witness. Doesn’t that seem rather odd? To my mind, it seems Class D secretly put a story together and are having you act as a false witness to give phony testimony.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter conferring together, the Class C students answered that they’d thought so, too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s… I’m just…telling the truth…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No matter how poor your communication skills might be, I can see you haven’t testified with much confidence. Is that because you’re tormented with guilt, because you know what you’re saying is actually a lie?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“N-no, that’s not it…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not blaming you. You were probably forced to lie for your class’s sake, to save Sudou-kun. Weren’t you? If you come forward and confess honestly to us now, you won’t be punished.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe teacher’s relentless psychological attacks just kept coming. Of course Horikita raised her hand.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That is not the case. It is certainly true that Sakura-san is not good at speaking before others. However, it is precisely because she witnessed the incident that she is standing here today. Otherwise, she most likely would not, even if we’d asked her. Don’t you think that if we needed someone who could speak boldly, we would have found a replacement?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think so. There are excellent students in Class D, students such as yourself, Horikita-san. By setting up a person like Sakura-san as your witness, it would establish a sense of realism that you yourself could not.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakagami-sensei probably didn’t actually believe this. However, no matter what response we volleyed back, I was convinced that he’d do anything to block us. Just as I’d felt from the start, a Class D witness did not carry enough weight. No matter how many times we stressed the truth, they would say that we were lying. If the testimony came from someone on your side, they wouldn’t accept it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHad we run out of options? Sakagami-sensei gave a hostile grin as he began to sit back down.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you want proof… I’ll give it to you!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakagami-sensei froze in response to Sakura’s words.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please, let’s not force this situation to continue. If there really \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewas\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e evidence, you would have presented it at an earlier stage—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura loudly slammed her hand on the desk, and threw down what looked to be a few small, rectangular pieces of paper. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are those?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBecause she’d produced something other than words, Sakagami-sensei’s expression stiffened for the first time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is proof that I was in the special building that day!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSecretary Tachibana walked over to Sakura. Though she hesitated at first, she then reached for the paper. No, those weren’t pieces of paper like I’d thought. They were photos.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“President.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter looking at the photographs, Secretary Tachibana handed them over to the student council president. Horikita’s older brother, after looking at the pictures for some time, laid them out on the desk so that we could see. We saw Sakura in those pictures, but this Sakura wore a lovely expression that looked both similar and dissimilar to the Sakura with us now. It was the idol, Shizuku.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m…I was looking for places where no one was around so I could take pictures of myself. The pictures also show the date and time, which proves that I was there when I said.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe date on the pictures definitely showed that they’d been taken in the evening one week ago. That would’ve been around the time that Sudou and the others finished their club activities for the day. Horikita and I unintentionally gasped in response to this new evidence. We began to see changes in the three Class C students, who up until now had been playing the part of victims. They were visibly shaking.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What did you use to take these photos?” asked Sakagami-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A digital…camera.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can alter the date rather easily with a digital camera, though. If you manipulated these photos on a computer, you could effectively set them at the time and date of the incident. This are inadequate evidence.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But Sakagami-sensei, don’t you think this photo is different?” Horikita’s older brother slid out one of the photos we hadn’t yet seen, and handed it to the teacher.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Th-this?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe photo showed the fight itself; clearly there was no need to nitpick the time. The setting sun bathed the hallway in dusky light. The picture seemed to show what had happened immediately after Sudou hit Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think that you’ll believe I was there after seeing…this.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you, Sakura-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis picture had absolutely saved Horikita as well. To rescue such an overwhelmingly disadvantageous situation…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Well, you do seem to be telling the truth about witnessing the incident. That much I simply must accept. However, I can’t ascertain how the situation started from this picture. This doesn’t prove that you saw the entire incident.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was certainly true that this picture made it look like the fight had already ended. We couldn’t call this definitive evidence.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what do you think, Chabashira-sensei? Why not look for a compromise here?” Sakagami-sensei asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Compromise?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m convinced that Sudou-kun lied in his testimony.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You jerk!” Sudou stood up, looking ready to fly out of his chair, but finally grabbed hold of his own arms and pinned himself down.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No matter how long we go back and forth, we’ll never reach an agreement. We won’t change our testimony, and your side won’t give up or admit that you conspired with the witness. In other words, you won’t stop. It’ll be an endless cycle of saying that the other side is lying. In addition, the picture is too inconclusive to be considered definitive proof. Therefore, I suggest we compromise. I\u0026#160;do think that the students from Class C are responsible for some of the blame here. There were three students up against Sudou, and one of them has a history of fighting, which is a problem. So how about two weeks of suspension for Sudou-kun, and one week of suspension for my students? What do you think of that? The weight of the punishment is different, of course, but I think that matches the difference in sustained injuries.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita’s older brother stayed silent as he listened to Sakagami-sensei. It seemed that Class C was willing to compromise only halfway. If we hadn’t had Sakura’s testimony or evidence, Sudou-kun probably would have been suspended for over a month. Asking for less than half of that made this a considerable concession.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t screw around! This isn’t a joke!” Sudou raged.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Chabashira-sensei. What do you think?” Sakagami-sensei didn’t even glance at Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We seem to have already reached a logical conclusion. There’s no reason to refuse Sakagami-sensei’s proposal,” Chabashira-sensei said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHis proposal was certainly a reasonable compromise. Horikita looked up at the ceiling, as if quietly mulling over everything that had gone on so far. No matter how much we resisted, Sudou wouldn’t be acquitted entirely without conclusive evidence. Horikita had known this from the very beginning.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe had concluded that we needed to reach a compromise. For a Class D student, Horikita was quite impressive.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, if she was aiming to make it to Class A, she couldn’t give up here. I hadn’t intended to speak out until the very end, but I decided to lend a helping hand, perhaps out of respect for Sakura’s earlier courage.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita, are we really out of options?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…………”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita did not respond. Well, did she even have any words left?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not very smart, so I can’t really come up with a solution. I do, however, think that we probably should accept the compromise that you have offered us, Sakagami-sensei,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Right,” Sakagami-sensei replied with a smile, pushing his glasses back up his nose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We have no definitive proof of Sudou’s innocence. I suppose I should say such evidence just doesn’t exist. If this event had occurred in a classroom or the convenience store, a greater number of students would have been around to see it, and there probably would have been sound evidence. There’s no record of anyone watching this scene unfold. Since this event took place in the special building, where there weren’t any people around, there’s nothing we can do.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI sighed deeply and shook my head. I looked straight into Horikita’s eyes, and she gazed back at me. I spoke as if we were accepting defeat.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand why we’re having this discussion. No matter how much we appeal to the contrary, Class C won’t admit that they lied. Sudou won’t admit that he lied, either. We really would just keep going back and forth. Honestly, it’s getting to the point where I would’ve been happier never having had this discussion in the first place. Don’t you agree?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita cast her eyes down. I wondered what she was thinking. If she took my words only at surface value, then things would end here. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, that’s it, yes? Well, Class D representative Horikita-san. Please give your opinion on the matter.” Sakagami-sensei had taken what I’d said literally. In other words, as a declaration of defeat. For Class C, victory meant not allowing Sudou to be acquitted. The teacher’s expression indicated that he had won this match.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand…” Horikita answered, slowly looking back up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita!” Sudou cried. It was the roar of a man who, more than anyone else, did not want to admit defeat. He couldn’t. However, Horikita did not stop there. She continued with her closing remarks.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think that Sudou, who caused the incident, has a problem. He doesn’t ever stop to consider his actions, which inconveniences everyone around him. He has a history of getting in fights. He’s the type to raise his voice and fists right away whenever something displeases him. In the event of an uproar such as this, well, it should be obvious who caused it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-hey!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You need to understand, Sudou. Your attitude caused all of this.” Horikita glared intensely over at Sudou, almost as if to outdo Sudou’s own ferocity. “This is why I wasn’t motivated at all to help Sudou-kun in the beginning. I knew that even if I forced myself to lend a hand, he would just repeat the same mistakes again and again.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A very honest answer. The matter seems settled now, wouldn’t you say?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you very much. Please take your seat now,” Secretary Tachibana said to Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA period of silence followed. After that came Sudou’s clearly irritated bellow. And then, even after five, then ten seconds of waiting, Horikita did not sit back down.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Will you take your seat now?” Secretary Tachibana asked Horikita to sit once again, as if she suspected that Horikita couldn’t hear her. Yet Horikita still did not sit. She fixated on the teachers, continuing to stare right at them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He should reflect on his actions. However, not in this particular case. When I say he should reflect, I mean that he should look back on his past actions. In regards to this particular incident, however, I don’t think Sudou-kun did anything wrong. This was not an unfortunate event that occurred merely by chance. I’m convinced that this was a deliberate move made by Class C. I have absolutely no intention of meekly accepting defeat.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita broke the long silence with these haughty words.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So then…what do you mean?” Horikita’s older brother looked at his younger sister for the first time. Horikita did not shrink under his gaze. She probably felt that this wasn’t the time to be frightened, that she had to be brave in front of Sakura. Or perhaps she could see the path to a final resolution?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you did not understand, I will say it once again. We claim that Sudou-kun is completely innocent. Therefore, we cannot accept his suspension from school, even for just one day.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ha ha… What can I even say? We did this intentionally? What a bizarre claim. Apparently, the student council president’s younger sister can’t help but spew nonsense.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sudou-kun is the victim, just as the witness testified. Please do not make any errors in your judgment.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe Class C students began to shout insistently.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t screw around! \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI’m\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the victim here!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou, compelled by the shouting, raised his own voice again. The objections came fast and furious. Everyone understood that we would not find a solution this way.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s enough. Continuing this discussion would just be a waste of time.” Horikita Manabu looked at us as if we were just swapping lies in a giant mudslinging match. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What I’ve learned today is that each side has an exact opposite claim. In that case, one side is propagating an extremely malicious falsehood.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eD or C? Which class was lying to the school? If this fact became known, the consequences would be greater than suspension.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll ask you, Class C. Have you lied to us today?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of…of course not!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, what about you, Class D?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I haven’t lied. Everything we’ve said has been the truth.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then we will regroup here for a retrial tomorrow at 4:00 \u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003ePM\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. If by then it hasn’t been clearly established which party has lied, or in the event no one admits that they were at fault, we will pass judgment based on the evidence we’ve collected thus far. Of course, in that case we may have to consider the possibility of expulsion from this school. That is all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter offering that statement, Horikita’s older brother ended the proceedings. If the trial was set to reopen at 4:00 tomorrow, that was a very small window of time in which to uncover new evidence. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Would be possible to have a little more time before we reconvene?” Horikita asked, raising her hand. She hadn’t protested, but she had made an offer.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If this matter required some extra time before retrial, then the student council president would have offered a sufficient grace period. In other words, the amount of time granted should be enough for this case. Extensions are only offered under special circumstances,” answered Chabashira-sensei, folding her arms. It appeared she’d taken the student council’s intentions into consideration.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe were told to leave. Everyone looked dissatisfied as they exited the student council office. Sakagami-sensei approached Sakura, who seemed to be on the verge of tears. He said something very cold to her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I want you to reflect on the fact that many students will be involved in this due to your lies. Also, if you think that we’ll go easy on you if you start crying, then I am afraid you are being foolish. You should be ashamed of yourself.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakagami-sensei and his students left, leaving those words hanging in the air. The Class C students repeatedly complained that the witness’s lies were far too much on their way out, almost as if they wanted Sakura to hear them. Silence enveloped the student council room immediately afterward. Sakura, trying to stifle her voice as best she could, burst into tears.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I tried my absolute hardest to speak up during the discussion, but do we even have a chance? Horikita?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I won’t give up. I will keep fighting to support your testimony until the end,” Horikita said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You understand that we won’t solve this problem just by being stubborn. Won’t that just hurt more people in the process?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have no intention of losing. Well then, I must excuse myself.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, Horikita turned and left. Sudou followed. I left the student council room alongside Sakura. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry, Ayanokouji-kun… If I’d only stepped forward in the very beginning, everything would have been fine, but… Everything turned out this way because I didn’t have the courage.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would’ve ended the same even if you had stepped forward at the beginning. They would’ve fought to discredit your testimony simply because the witness came from Class D. The result would be the same.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf they suspected Sakura to be a liar, she probably wouldn’t be able to save Sudou by herself. Overcome with emotion, Sakura started crying, large tears rolling down her cheeks. If Hirata were here, he probably would’ve kindly offered her a handkerchief. Strangely enough, this scene seemed to mimic the time Horikita had collapsed briefly when reunited with her brother. It was a moment of deep déjà vu.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhy was this world divided into winners and losers? I’d already witnessed many victories and defeats, and had seen how closely joy and sorrow seemed to be linked to those outcomes. I couldn’t just abandon Sakura, so I decided to wait until she could move.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re still here?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita’s older brother and Secretary Tachibana came out of the student council room. Secretary Tachibana began locking the door with a key.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you planning to do?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought that when you came here with Suzune, you’d unveil some kind of master plan.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not exactly Zhuge Liang or Kuroda Kanbei. I don’t have any plans.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So does that mean when Suzune claimed Sudou was completely innocent, she was merely getting carried away?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hyperbole, you mean? I don’t think so.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStrangely enough, though my exchanges with Horikita’s brother up to now had been short, our conversation continued. Though he’d left a bad impression on me during our first meeting, I found him easy to talk to now. Perhaps this was to be expected of someone who had climbed the ranks to become student council president. He had a superior understanding of human nature.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then there’s what you said, Sakura.” Horikita’s brother turned to Sakura, who’d stifled her crying. “Eyewitness testimony and pictorial evidence certainly carry weight during deliberation. However, please keep in mind that how much we value the evidence is determined by how much we trust in its believability. No matter what you do, the evidence’s legitimacy is reduced because you are a student from Class D. No matter how detailed your account, we cannot accept it as one hundred percent true.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBasically, he was calling Sakura a liar.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I…I just…told the truth…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you can’t prove it, then it’s little more than nonsense.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura hung her head low in frustration, crying once again.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I believe her. I believe Sakura’s testimony,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Since she’s a Class D student, it’s only natural that you would want to believe her.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t say that I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewant\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to believe her. I said I believe her. Those mean different things.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So can you prove it? Can you prove she’s not lying?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not up to me. Your sister will prove it. If Sakura isn’t lying, then she will find a way to convince everyone.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita’s brother chuckled softly, then smiled, as if to suggest such a thing couldn’t be done. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter Horikita’s brother and Tachibana left, I approached Sakura, who still was not able to move.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on. Chin up, Sakura. There’s no use in crying forever.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But…it’s all my fault… \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHic\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You didn’t do anything wrong. You just told the truth. Right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But… I…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll say it one more time. You didn’t do anything wrong.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI crouched slightly so I could meet Sakura’s eyes. She lowered her head once more, like she didn’t want anyone to see her tears.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I believe in you. I’m grateful that you came here today. Thanks to you, we now have a chance to save Sudou and our classmates.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But… I… Wasn’t I completely useless?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust how little confidence did this girl have in herself?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I believe you because you’re my friend.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI put my hand on her shoulder. Turning her around somewhat forcibly, I tried to make her look me in the eye.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI repeated it with conviction. I told her, “Do it for yourself.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e6.2\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003e“I\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e let you see something so embarrassing…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura, walking next to me, had stopped crying. She now wore a sheepish smile.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s been such a long time since I cried in front of someone. I feel a little relieved, actually.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m glad. When I was a kid, I used to cry in front of people all the time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I had no idea that you were like that, Ayanokouji-kun. That’s completely unlike the image I have of you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I cried a lot. Maybe 10 or 20 times in front of other people.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d been frustrated and embarrassed, but I’d been unable to stop crying. However, people who cried could grow stronger and move forward. Sakura seemed to be the type who bottled up her feelings. This incident might have been an important step forward for her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was really happy…when you said that you believed me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not just me. Horikita, Kushida, and Sudou do, too. All of our classmates believe you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah… But you came out and told me directly, Ayanokouji-kun. You said it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura wiped her eyes once again, probably because the tears blurred her vision.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Forma
