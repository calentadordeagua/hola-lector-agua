tting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You gave me courage. I was happy,” she said, with a small smile.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I heard that, I felt relieved. Even if we could’ve saved Sudou just by forcing Sakura to come forward and pushing her into an uncomfortable situation, it wouldn’t have been a perfect solution. The two of us lapsed into silence. Neither of us was very good at making conversation. However, it didn’t feel strange or unpleasant.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“U-um, well… I don’t think I should be saying this now, but…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as we neared the entranceway, Sakura opened her mouth.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Actually… I… Right now…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yahoo! You’re really late, huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose and Kanzaki were waiting for us by the entranceway. They must’ve been on tenterhooks about the trial’s results.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Were you waiting for us?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We were wondering what happened.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI stopped and turned to Sakura. “Sorry, Sakura. Can we continue this later?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura opened up her shoe locker and looked inside. She turned her face to me. “Oh, no, it’s nothing. I just…wanted to say that I would try my best. I’ll be brave.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith this quick answer, she lowered her head and left.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sakura?” I tried to stop her, but she hurried out the door.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry. Was this a bad time?” Ichinose asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, it’s fine.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI described the events that had transpired in the student council room.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. So, you rejected the compromise, huh? Class D is insisting on Sudou’s innocence until the very end?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, if Sudou even got as little as one day’s suspension, Class C would win.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, the compromise had been a trap. A sweet trap set to lure us to our defeat. The two of them didn’t seem convinced, though. Kanzaki in particular insisted that we’d made the wrong choice.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The fact remains that he hit the other students. Your opponents made a concession because of corroboration from the witness and her evidence. You should’ve accepted the compromise.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But like Ayanokouji-kun says, Sudou’s suspension would be a loss for Class D. If Sudou were suspended due to his bad behavior, then his chances of being a team regular would probably vanish. He’d be back to square one.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He might not just be sent back to square one. It might be worse, actually. If the school knew both sides shared the responsibility, they’d take that into account when assigning punishments. However, if Sudou’s share of the blame increases tomorrow, it’ll be bad news.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNeither of them were wrong. Either we appealed for his innocence, or we accepted the deal. One of those was the correct answer.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. I think so, too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you think so, shouldn’t you have stopped it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re brought back into a retrial, you’ll inevitably lose. Just like Kanzaki says, obtaining a not-guilty verdict is virtually impossible.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo matter our testimony, no matter how passionately we made our claims, we couldn’t win on that point. It wasn’t about just winning or losing anymore. We’d come to an impasse on the battlefield.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you still going to fight? Even without new evidence or testimony?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Our leader gave us her decision. We’ll fight to the bitter end.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita wasn’t stupid. She already knew well enough that this extension wasn’t a victory. Yet she’d still made the choice to press forward, intending to fight on. That Class D was prepared to face the difficulties ahead was proof of our readiness.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm. Well, I don’t think we’ll be able to obtain any more leads, but I’ll go check what information I can gather from the Internet.” Though it wouldn’t have been odd for her to wash her hands off us at this point, Ichinose laughed and still offered her cooperation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll do my absolute best to look for more evidence or another witness.” Even though Kanzaki would have opted for compromise, his cooperation also remained unwavering.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re still willing to help us?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re in too deep now. Besides, it’s like we said before. We can’t forgive liars.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKanzaki nodded. These were really good people.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I sincerely appreciate the offer, but it’s not necessary.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita, who I thought had returned to the dorms, suddenly stood alongside us. Had she been waiting for me?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not necessary? What do you mean, Horikita-san?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We cannot get Sudou acquitted. Even if a new witness were to come from Class A or B, it would be impossible. However…there is something I would like you to prepare for us. It is the only possible solution.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Preparing something?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita proceeded to explain to us what she wanted. The previously calm Ichinose’s expression now stiffened.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh… That’s going to be a \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ereally\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e hard request.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Ichinose was this hesitant, perhaps it truly was unreasonable. Kanzaki fell silent and appeared deep in thought.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand that I’m in no position to ask this,” Horikita said. “The burden I’d be placing upon you is exceptionally great. But—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, no. Well, this should be within the range of what we can do, I think. That’s because I plan to figure out what’s happening to Class D. I’ve got tons and tons of things I want to know, but… Well, maybe it would be better for you not to tell us why?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re certainly right about that. Well then, if I can convince you, will you cooperate with us?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita continued to explain the details of her solution to Ichinose, Kanzaki, and me. Why was it necessary? What would we use it for? What was its purpose? After Horikita had finished, Kanzaki and Ichinose stood lost in silent thought.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You should understand the risks as well as the usefulness of this strategy,” Horikita said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When did you come up with this?” Ichinose asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just before the deliberation ended. Only by chance, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That…an incredible move. I went to the scene of the crime and even I didn’t think of that. Or, I guess I should say, I was completely in the dark about it. It wasn’t even close to what I could imagine.” Ichinose appeared to understand the plan and its intended effect. However, her expression was still distant, and she still seemed to be thinking.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“An unusual idea. You can probably anticipate the results, too. But does such a thing even exist?” she asked Kanzaki, who seemed a little shocked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It might be contrary to your ethics and morals, Ichinose.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ha ha, yeah. You might be right. It’s a change for me. But…it’s certainly one way of doing things.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. That’s what I thought as well. It’s something that never should have been done.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWere they going to lend us a hand? There were lies baked into this strategy. For someone like Ichinose, who hated lying, it was a harsh request.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, since a lie started all this trouble, maybe it’ll take another lie to close the books on this incident. That’s what I think, anyway.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Mmmhmm, I see. An eye for an eye, a lie for a lie, yeah? But is that even possible, I wonder? I can’t imagine such a thing would be easy to obtain.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry about that part. I’ve confirmed it,” Horikita said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHad she left the student council room immediately to ascertain whether or not it was possible to collect the proof she needed?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you ask the Professor to assist us, it should be good. I’ll talk to him.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita gave a slight nod. She apparently didn’t have any objections.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Kanzaki-kun. Did you help us so that we would outpace Class C?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. That’s right.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But I was just thinking, perhaps what we’re doing right now might end up coming back to bite you in the ass later?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That could happen.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Man. I completely neglected to calculate the fact that Class D has a girl like you.” Ichinose, after complimenting Horikita, took out her cell phone with a look of slight amazement. “I’ll lend this to you. Please return it later.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, she affirmed her willingness to help.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure. I promise.” Horikita, grateful for the assistance, accepted it without any hesitation. “Well then, Ayanokouji-kun. There’s something I’d like you to help me with.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If it’s not something really bothersome, sure. I’ll help.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Helping others is fundamentally bothersome and time-consuming.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, I needed to prepare myself. I didn’t see a way out of this, so I hesitantly decided to yield to Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, let’s g—?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI received a shocking blow to my side. The pain was sudden and intense. I tumbled into the corner as if blown by a stiff breeze.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll forgive you for touching me this time. However, next time I’ll pay you back double.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wha— Ah, ah!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe pain stole my voice, as if I weren’t allowed to argue. Wait, when she said she’d pay me back “double,” she meant her blows would be twice as hard as now? That was unimaginable! \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDumbfounded, Ichinose watched the whole spectacle. She looked at Horikita as if the girl were something terrifying. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eRemember that well, Ichinose.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Horikita was a woman without mercy… \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eGulp.\u003c/span\u003e\u003c/p\u003e\r\n\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol2_INTERIORILLUSTRATIONS_15\" src=\"/hola-lector-agua/images/books/v2/OEBPS/Images/ClassroomElite-Vol2_INTERIORILLUSTRATIONS_15.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 6: Truth and Lies\",\"volumeId\":\"v2\",\"chapterIndex\":12,\"prevChapter\":{\"volumeId\":\"v2\",\"chapter\":11,\"title\":\"Chapter 5: Each and Every Prediction\"},\"nextChapter\":{\"volumeId\":\"v2\",\"chapter\":13,\"title\":\"Chapter 7: Only One Solution\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Title Page\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Sakura Airi’s Soliloquy\",\"href\":\"Text/section-0005.h
