ting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There it is! The repairs counter.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe store was crowded with a huge number of products and difficult to navigate, but towards the back was the place where they handled repairs.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor some reason, Sakura suddenly stopped in her tracks. When I glanced over at her, I noticed she was wearing an expression of blatant fear and revulsion. It seemed that something had upset her quite a bit. However, when I followed Sakura’s line of sight, I saw nothing out of the ordinary.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s the matter, Sakura-san?” Kushida asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe also must’ve thought Sakura’s behavior was strange.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, umm… Well…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough it seemed like she was about to say something, all Sakura did was shake her head and take a deep breath.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s nothing.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe donned an earnest smile, and walked to the repair counter. Kushida and I exchanged looks, but decided to follow her. Maybe it really was nothing, like she said. Kushida talked to the store clerk and asked him to repair the digital camera. Meanwhile, incredibly bored, I checked out the appliances on display.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida’s worldly wisdom was certainly impressive. Even though it was her first time meeting the store clerk, she was soon talking to him as if they were longtime friends. Sakura, the camera’s owner, spoke only when she needed to give her consent or to clarify something. Even so, the store clerk appeared pretty fired up. He aggressively engaged Kushida in conversation, without even pausing for a breath. Although I could just barely hear the conversation, it sounded like he was asking Kushida on a date. He asked if she wanted to see a certain female idol’s concert, which was being screened over in the theater. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe seemed like quite the otaku, judging from how passionate he was about a wide range of subjects, from idol elections to idol magazines. Because Kushida didn’t show any signs of disliking the conversation, he probably thought he could successfully ask her out. However, I believed she would try her hardest to sidestep the invitation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe seemed to be getting excited over talking to such a cute girl, but their conversation didn’t proceed any further. As I’d expected, Kushida began to feel awkward. In order to conclude their business, she urged Sakura to hand over the camera. When the store clerk opened up the camera to confirm the contents, he saw that part of it had been damaged from the fall. That was why the camera wouldn’t turn on properly. Fortunately, because Sakura still had the warranty card, the item could be repaired free of charge.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFinally, all Sakura had to do was fill out her contact information, and we’d be done. But Sakura’s hand suddenly stopped as she filled out the form. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sakura-san?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida, thinking that something strange was going on, called out to Sakura. She seemed to be hesitating for some reason. I didn’t intend to say anything at the time, but her attitude seemed to weigh on my mind. And also—\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe store clerk, who had previously been absorbed in his conversation with Kushida, now stared directly at Sakura. Both Sakura and Kushida were looking down at the form, so they didn’t notice. But the clerk had unsettling eyes. Even men would find it a little creepy.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can I see that for a second?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStanding next to Sakura, I reached for the pen she was holding. She didn’t seem to understand why I wanted it, but she anxiously handed it over.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When the repairs are finished, please contact me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-hey, wait a minute. Contact you? She’s the owner, isn’t she? That would be…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The manufacturer warranty explicitly shows where the item was sold and the date of purchase. Also, I doubt there’d be any legal problems with me putting my information down. It should be perfectly fine if the user’s name is different than the purchaser’s.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBefore the clerk could say “I understand”, I’d entered my name and my dorm room number into the required fields.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Or, is there a reason why she specifically has to enter her information?” I added, still without looking back up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“N-no, not at all. I understand. There’s nothing to worry about,” the clerk said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShortly after I’d completed the form, I handed it over with the camera. Sakura gently patted her chest and sighed in apparent relief, but when she learned it’d take two weeks for the camera to be repaired, she grew discouraged. Her shoulders slumped.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That clerk sure was something else. He talked with such incredible passion, I was just so shocked,” Kushida said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Didn’t you feel kind of disgusted?” Sakura asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“N-no, I wasn’t disgusted by him. Do you know something? About that clerk?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura gave a meek nod. I guessed that something had been off even when she first purchased the camera. Turning to me, she asked, “What do you think, Ayanokouji-kun?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, he had this sort of vibe, like he’s kind of hard to approach. Especially for girls.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That was kind of what I was trying to get at before… I was scared to go to the repair shop alone because of that…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida seemed to have an epiphany. She turned to me with wide eyes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you know about this, Ayanokouji-kun?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, she’s a girl. I thought she might be reluctant to write down her address or cell phone number.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBeing a guy, I wouldn’t be troubled if my information got out there.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Th-thank you…Ayanokouji-kun. You really…saved me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah, I didn’t really do anything. I just wrote down my address. When they contact me about the repairs, I’ll get in touch with you right away, Sakura.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura nodded, looking glad. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eIf that’s all it takes to please you, then it actually makes me sorry for you.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You really looked out for Sakura-san,” Kushida said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, you’re making it out to be bigger than it was. Honestly, I was only watching out for that rather weird clerk. I guess he gave the impression that he really, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ereally\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e loved girls.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ha ha… That’s certainly true.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven Kushida appeared nonplussed. For someone like Sakura, though, who wasn’t accustomed to fawning male attention, I thought it was the right answer.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Since you were with me today, Kushida-san, we completed our task without me having to talk at all. Thank you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Sakura had faced that store clerk one-on-one, she probably would’ve run away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, no need to thank me. If you’re okay with my help, then I’m happy to lend a hand any time. Sakura-san, you really like your camera. Don’t you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah… I’ve liked cameras ever since I was little. My dad bought me one before I entered junior high, and I absolutely fell in love with it. Or I suppose you could say that I just love taking pictures… I’m not really well-informed when it comes to this stuff, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think being knowledgeable and liking things are separate matters. It’s wonderful to be so passionate about something.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sakura, you usually take pictures of landscapes, right? Do you ever take pictures of people?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura stepped backwards, looking quite flustered. Did she find that question unpleasant? It’d seemed like an extremely natural question to ask. Like, did she \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ejust\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e take pictures of landscapes or were they her specialty? Sakura shut her mouth, and her body stiffened.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Th-that’s a secret.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell then. It sounded like she didn’t want to go into the details with me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-well, it’s just… It’s embarrassing,” replied Sakura, her cheeks reddening. She looked down as she spoke.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough my imagination ran wild, I couldn’t let it show on my face. I had to remain neutral.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh hey, that reminds me. Sorry to ask, but since we’re here, is it okay for me to look around the store?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Was there something you wanted?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t so much that I wanted something, as there was something on my mind.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The two of you can wander around, if you want.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think we’ll come in, too. Right?” Kushida said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“S-sure. After all, I feel bad you both had to come with me… Besides, I do have the time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t exactly want them there, but apparently they’d decided to come along. Kushida and Sakura. When I watched the two of them walk side by side, I realized that they’d managed to grow closer in just one day. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eKushida, I wish you’d share a little of your people skills with me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince they seemed to be having girl talk, I decided to leave them alone and went to look for what I wanted. I\u0026#160;went into my phone’s contacts. Back when Ike had involved me in the whole gambling thing, I’d exchanged contact information with some people. Even though I still only had a few names in my address book, it was clear that my number of friends was increasing. I selected the name “Sotomura (Professor)” and called him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey Professor, do you have a minute?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm? It’s rare to get a call from you, Ayanokouji. What do you need?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSotomura’s nickname was Professor, which undoubtedly made it sound like he was rather intelligent. In reality, he was just a huge otaku. He gathered information daily, comprehensively spanning a wide variety of topics, from dating sims to anime and manga.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Professor, did you buy your laptop computer from the school, with your points?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I most certainly did. It cost 80,000 points. But what of it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m looking for something among the electrical appliances sold by the school.\"\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI explained the gist of what I wanted. Although many similar products sat on the displays in front of me, I\u0026#160;didn’t know which one to choose. It probably would’ve been faster to just ask the store clerk, but I didn’t want to for various reasons.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji. Though I am considerably well-versed in that particular electronic field…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s okay if you don’t know.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please wait,” said the Professor as I was about to end the call. “I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edo\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e know. In fact, I have two of them at my parents’ home.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No way! You’ve had them since junior high? Isn’t that bad?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do not misunderstand me. They were only for experimentation, for the sake of my language studies.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, could I trouble you to help me set it up?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Puh, leave it to me. I’m sure that someday I will have a favor to ask of you in return.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClearly, he was the man for the job. When entering a subject that I didn’t understand, it was important to find an expert.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry to keep you waiting,” I said to the girls.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Have you already finished?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Today was just a preliminary inspection. I don’t have enough points to buy anything.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSuddenly, Kushida froze while glancing over at Sakura’s profile.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sakura-san, have we met somewhere before?” Kushida murmured.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? N-no. I don’t think so, but…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry. It’s just that when I look at you, I get this feeling that we’ve met before, Sakura-san. Hey, weird question, but could you try removing your glasses?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?! B-but that’s… My eyesight is so bad, I wouldn’t be able to see a thing…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura put her hand up and waved it, signaling to Kushida that she did not want to.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We should hang out together again, Sakura-san. Not just with me, but with my other friends, too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura looked like she wanted to say something, but she couldn’t find her way to the end of the thought. She said nothing. Kushida seemed to feel that it would make trouble if she pressed the issue, so she kept quiet. Or rather, she didn’t ask anything else. In the end, we returned to where we’d started.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Umm… Thank you for everything today. You really helped me out,” Sakura said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s okay, it’s okay. There’s no need to thank us. Actually, Sakura-san, you can talk to us normally, you know? If it’s okay with you. We’re in the same grade. It sounds a little weird when you speak so formally to us.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was certainly true that Sakura’s speech patterns weren’t exactly what you would expect from a peer. But changing that might be easier said than done for her; she was visibly perplexed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t mean to sound that way. I wasn’t aware of it… I sound weird?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not really a bad thing! I mean, I’d be happy if you didn’t speak so formally to me, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah… O-okay… I…I got it. I’ll do my best.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI thought that Sakura would have rejected the notion, but she managed to squeak out a few words of agreement. It seemed like she wanted to accept Kushida’s proposal. Perhaps this was how people became friends, little by little. Even Sakura, who seemed to have hardly interacted with another person ever, was steadily growing closer to Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s okay, though. You don’t need to force yourself.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-It’s okay. I…will.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura kept her eyes down as she spoke. Partway through her sentence she began to sputter, and her words faded so much that we couldn’t hear them. However, it didn’t seem as though she felt uncomfortable. Kushida smiled in satisfaction, but didn’t try to coerce anything more from Sakura. That specific distance felt exactly right for where they were at the moment. If you tried to strong-arm people who weren’t good at socializing, it could backfire. Rather than be grateful, they’d probably find it off-putting. Rather than draw them nearer, being overbearing would probably end up pushing them further away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, we’ll see you at school. Okay?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, Kushida thought the conversation had ended. However, rather unexpectedly, Sakura didn’t move.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura spoke in a small voice, but looked straight at us. When our gazes met, however, she immediately averted her eyes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“About Sudou-kun… As my way of saying thanks for today, I… Well, that might be a little misleading, but if you like…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe paused, and started again more clearly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I may be able to help you with Sudou-kun’s case.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn her own words, Sakura told us that she was the witness. Kushida and I exchanged glances.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, does that mean that you saw Sudou-kun fight with those other students?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. I saw everything. It was a total coincidence, though… I’m sure you don’t believe me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, we do. Why did you decide to tell us now, though? I mean, I’m happy you did, but I don’t want you to force yourself. You don’t have to do this just because you’re grateful, you know?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura couldn’t seem to get her words out. She lightly shook her head. The fact that Sakura had waited until now to talk proved that she was more concerned about Sudou’s case than anything else. I wondered if getting a foothold on friendship made her want to cooperate.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that really true? You’re not forcing yourself?” Kushida asked. She must’ve been thinking the same thing as me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura nodded sheepishly, as if she could feel that we were worrying about it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s okay… I think that if I kept quiet, I’d probably come to regret it. I…don’t want to cause trouble for my classmates. But, if I spoke up as a witness, then…I would definitely stand out. I hated the thought of that… I’m sorry.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile Sakura apologized to us repeatedly, full of remorse, she also promised Kushida that she would testify.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you, Sakura-san. I’m sure Sudou-kun will be really happy.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida took Sakura’s hand, and Sakura looked at Kushida’s smiling face. I wondered if a new friendship had been born right here, right now. At any rate, we had Sudou’s witness.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e4.11\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ehat night, I clutched my phone tightly. My hand was sweating so much you’d think the air conditioning in my room wasn’t working.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We got closer to Sakura, but… Is it really okay for me to say that?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yesterday I would’ve said no, but our chances are better today. Ahh… I think we still have a way to go yet, though. You’re making yourself all frazzled.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d guessed that Sakura would probably grow closer to Kushida, specifically. But I had a feeling that Sakura had erected a rather high wall between herself and other people. Unless we could get her to climb over that wall, calling on Sakura as a witness would be difficult.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That reminds me, why did you try to get Sakura to take off her glasses?” I asked Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I mean… I thought saying so might be kind of cruel, but… I just feel like her glasses don’t really suit her, for some reason. It’s like she doesn’t really need them, or something. I don’t understand it myself. I also thought that we’d met somewhere before, but that was probably just a misunderstanding.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, perhaps that was just your imagination, Kushida? I mean, Sakura is pretty far from being stylish, right? I mean, so am I, but she even chooses clothes with plain colors so she stands out as little as possible.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, there’s that. I don’t think that she’s concerned with fashion or anything. But I wonder why?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBack when her camera fell and Sakura had bent down to pick it up, I’d seen her glasses from the side. Something about them had struck me as being out of place.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I felt like there’s something a little off, like she’s wearing fake glasses.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Sakura-san wears fake glasses? But she said that her eyesight was really bad…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Although real glasses and fake ones appear similar at first glance, there is definitely a difference between them. Real glasses show some distortion on the lenses. There wasn’t any distortion on Sakura’s glasses. At first, I thought that there was definitely some link between those fake glasses and Sakura’s fashion sense, but then I found myself puzzled over something she said today.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Appearing fashionable with glasses? Hmm, that doesn’t sound normal.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf she wanted to liven up her appearance with decorative items, she should have bought other clothes or make-up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Or maybe it’s to cover up some kind of complex? Like how someone thinks they’ll appear intelligent by putting on glasses?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s that. Wearing glasses \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edoes \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003emake you look smart.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In Sakura’s case, though, she probably wears them because she doesn’t want others to see her true self. She’s always slouching and won’t look people in the eye. I doubt it’s simply because she dislikes other people.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI felt like there was some hidden way to get over that wall. Something.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I knew it was right to bring you along, Ayanokouji-kun. I feel like you’re very observant of people.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was a little embarrassed. The best part of interacting with Kushida was how we were able to connect and converse naturally. People who didn’t know how to get closer to another person would bungle and compromise until they got to a point where they just gave up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So then—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as Kushida was about to gently nudge me to keep the conversation going, my phone buzzed. I checked the caller \u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eID\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e without letting her see. If it were Ike or Yamauchi, I’d call them back later. But if it were Horikita…I’d have to think about it. That’s what I was prepared for, but…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe name on the screen read “Sakura.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry, Kushida. Can I call you back in a bit?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, sure. Sorry for talking so long.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough there was a heavy regret in those parting words, I didn’t have the time to address it. I answered Sakura’s call before it cut out. After pressing the call button, I waited several seconds, but the line remained silent.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um… Hello. This is Sakura…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is Ayanokouji.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though we’d exchanged contact information, I\u0026#160;found it a little strange that she’d called me. Even when I formally exchanged contact information with someone, they would never call me nine times out of ten. If I did need to contact someone, I'd just have Kushida do it for me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you for coming out with me today,” Sakura said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, no problem. It wasn’t really a big deal. Don’t worry about it. You shouldn’t fuss so much and keep thanking me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSilence followed, but it wasn’t Sakura’s fault. I didn’t really know how to respond to her. I thought of how Kushida took the lead in our conversation. Still, I had to do my best on this call.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s the matter?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Umm…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMore silence. What should I do? \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ePlease, Hirata. Teach me.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What were you…thinking about?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura asked me a rather ambiguous question. What was I thinking about? She likely didn’t want to know my thoughts on how cute Kushida looked in casual clothing, or how exceptionally interesting I found Sakura herself. I\u0026#160;had no idea what Sakura was expecting.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did something happen?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSomething about the emotion behind her words made me uneasy, so I cast a verbal line to see if I could reel in anything else. However, the line tautened and snapped as soon as it touched water. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry, it’s nothing. Goodnight.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura ended the call without even giving me a chance to reply. No “please wait” or “hold on.” I thought about calling her back, but I couldn’t understand why I’d failed in our conversation. I thought about it carefully while washing my face. I’d spent about 10 minutes talking with Kushida, but during that time, there weren’t any signs that Sakura had tried to call or left messages. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps Sakura had planned on calling Kushida after talking to me? I had a hard time imagining that. Normally when you had to call two people, the first person you’d call would be the one you knew better. In this case, I was the only person she could call and see, so I was the reasonable choice. Just to be sure though, I went ahead and sent a chat message to Kushida and asked her if she had heard from Sakura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA few minutes later, Kushida confirmed that she hadn’t heard back from Sakura. Just as I’d thought.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was asked to invite you as well, Ayanokouji-kun. Did you talk to Sakura-san?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I’d met Kushida that morning, she’d said something like that. Because Sakura got really nervous when she was alone with Kushida, I had thought she’d just invited someone else who was suitable for the task, but…was it not like that? Aside from a crazy dream like it being love at first sight, was there some reason \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e had been chosen to go? I remembered something I’d felt while talking with Sakura today.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura and Kushida struck up most of the conversations, but I’d broached a topic. Namely, the clerk at the store who’d helped with the repair order. I hadn’t brought up anything else. What if that’s what she’d meant when she asked, “What were you thinking about?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAll of the puzzle pieces I’d collected were too small, and too few. I was able to conjure up several scenarios and speculations, but they all lacked credibility. I didn’t have enough information to come to a definitive decision.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNormally I’d have thought that asking around at school would be fine, but in Sakura’s case, things wouldn’t be so simple. If I just went up and started talking to Sakura, who normally didn’t talk to anyone, it would make her stand out. She wouldn’t like that. I prayed that the anxieties I’d developed over the phone call were unfounded, and decided to get ready for bed.\u003c/span\u003e\u003c/p\u003e\r\n\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol2_INTERIORILLUSTRATIONS_9\" src=\"/hola-lector-agua/images/books/v2/OEBPS/Images/ClassroomElite-Vol2_INTERIORILLUSTRATIONS_9.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 4: An Unexpected Witness\",\"volumeId\":\"v2\",\"chapterIndex\":10,\"prevChapter\":{\"volumeId\":\"v2\",\"chapter\":9,\"title\":\"Chapter 3: Weak Point\"},\"nextChapter\":{\"volumeId\":\"v2\",\"chapter\":11,\"title\":\"Chapter 5: Each and Every Prediction\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Title Page\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Sakura Airi’s Soliloquy\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: The Sudden Beginning of Our Tumultuous Troubles\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: Weak Point\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: An Unexpected Witness\",\"href\":\"Text/section-0008.html#aut
