[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T3942d,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 4:\u003cbr/\u003eAn Unexpected Witness\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ehe next morning, students busily exchanged information with each other. Those from Hirata’s group and those with Kushida had spent yesterday searching for the witness. Ike and Yamauchi hated ladies’ men like Hirata, but seemed excited about all of the girls who hung around him. They happily tried to chat them up. As I listened in, though, I heard that Hirata and his group hadn’t obtained any valuable information. They’d recorded the names of the people to whom they’d spoken, and occasionally taken notes on their cell phones.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMeanwhile, I was alone, like always. I could talk to Kushida, but felt disadvantaged when it came to a big group. I couldn’t really talk, so I asked Kushida to fill in me later. Meanwhile, my neighbor—who continued to reject Kushida’s invitations, no matter what—sat with a nonchalant expression as she prepared for class. Sudou, the person of interest, still hadn’t arrived.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Man, can we even prove that those Class C guys were in the wrong?” Ike asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As long as we can find a witness, it’s not impossible. Let’s keep trying our best, Ike-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Before we try our best, though, is there even a witness in the first place? Didn’t Sudou only say that he \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethought\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e someone might’ve been there? Wasn’t that just a lie? I\u0026#160;mean, he \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eis\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e violent, and he does provoke people.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we keep doubting him, we won’t make any progress. Am I wrong?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess, you’re probably right about that, but…if Sudou is in the wrong, then our hard-earned points are all going be stripped away, right? We’ll be at zero. Zero! We’ll be back to having no pocket money at all. Our dreams of screwing around to our hearts’ content will remain unrealized!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then it would be a good idea for everyone to start saving up again,” Hirata said. “It’s only been three months since we started here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOur classroom hero didn’t waver as he delivered his magnificent speech. The girls immediately blushed in response. Karuizawa wore a particularly proud expression, perhaps because \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eshe\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e was the one he’d chosen to be his girlfriend.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I do think our points are important. They’re tied to our motivation, right? So, I will defend our class points to my last breath. Even if it’s only 87 points.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand how you feel. However, it can be dangerous to cling to our points and lose sight of reality. The most important thing is to treasure our friends as much as possible.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke, who considered Hirata a goody two shoes, eyed him suspiciously. “Even if Sudou was at fault?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBeing punished when you’d done nothing wrong was horrible. That much was obvious. However, Hirata nodded without a moment’s hesitation. It was as though he believed self-sacrifice was unimportant. Ike immediately looked downward, as if pressed under the weight of Hirata’s noble intentions.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think what you’re saying is reasonable, Hirata-kun, but I still want my points. The students in Class A get nearly 100,000 points every month. I’m super envious of them. There are girls in their class who buy lots of stylish clothes and accessories. Aren’t we just the bottom of the barrel compared to them?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa’s legs dangled over her desk. People looked bitter when she pointed out the stark difference between our classes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why couldn’t I have been in Class A from the start? If I were in Class A, I’d probably be loving every second of my student life.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wish I was in A, too. I’d be doing so much fun stuff with my friends.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBefore I knew it, the meeting to save Sudou had transformed into a grievance session, with students pleading for a way out of the class. Horikita spontaneously broke into derisive laughter in response to Ike and Karuizawa’s delusions. As her neighbor, I was the only one who noticed. She seemed to be implying that they couldn’t have started in Class A if they’d wanted to. Horikita immediately took out a library book and began reading, almost as if she was trying not to be distracted by the noise. At a glance, I saw she was reading Dostoevsky’s \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eDemons\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. A good choice.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would be awesome if there was some secret trick we could use to switch Class A in an instant. Saving up class points is way too hard.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was a 1000-point difference between Class A and us. An absurdly huge difference.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then cheer up, Ike, because there \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eis\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e one way to instantly reach Class A.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei spoke from the classroom entranceway. She’d arrived just five minutes before class started.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait. What did you say, sensei?” Ike nearly fell off his chair before recomposing himself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I said that there’s a way to reach Class A without class points.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita looked up from her book, probably trying to gauge whether Chabashira-sensei was lying.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, now. Don’t tease us, Sae-chan-sensei!” Usually, Ike would’ve sunk his teeth into that information. This time, he laughed it off, as if saying he wouldn’t be fooled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s true. At this school, there are certain special methods you can use,” answered Chabashira-sensei. Judging from her answer, she didn’t appear to be joking.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think she’s saying that just to confuse us.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei sometimes withheld information, but she didn’t lie. Ike’s guffaws gradually stopped.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sensei, what \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eare\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e these special methods?” Ike inquired politely, as if not to offend her. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAll of the students fixed their eyes on Chabashira-sensei. Even those who didn’t see a substantial benefit to reaching Class A appeared curious.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I told you on the day you arrived. I said there’s nothing you cannot buy with your points at this school. In other words, you can change classes by using your personal points.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei shot a quick glance over at Horikita and me. We had tested out that very method ourselves by buying a test point from the school. That supported the truth of her claim. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass points and private points were linked. If we didn’t have any class points, then we wouldn’t get the private points, either. However, it wasn’t a perfect one-to-one correlation. Based on what we’d heard, you didn’t necessarily have to lose out on points. Because students could transfer points, it was theoretically possible to collect private points even if your class points were at\u0026#160;zero.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“S-seriously! How many points do we need to save up to do that?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Twenty million. Do your best to conserve points. Do that, and you can enter whichever class you like.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter hearing that absurdly high number, Ike tumbled out of his chair.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you just say twenty million? That’s impossible, though!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone in the class started booing. Their disappointment was to be expected. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Normally yes, it would be impossible. However, as it’s an avenue to Class A, it’s naturally expensive. If I were reduce the number by one digit, there would probably be over 100 people in Class A come graduation. Then there’d be no point to our system.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven by maintaining our monthly allotment of 100,000 points, that still wouldn’t be an easy number to reach.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just out of curiosity, has anyone successfully changed their class like this before?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was an obvious question. The Advanced Nurturing High School had been in operation for about 10 years. A thousand and some students had struggled to make it through. If anyone had managed to achieve success by that method, there would’ve been talk about it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unfortunately, no. No one has done it before. The reason why is as clear as day. Even if you perfectly maintain your class points upon starting school here, after three years you’d only have 3.6 million. Class A could raise points enough to reach four million. Normally, you simply wouldn’t be able to do it.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, doesn’t that just mean it’s impossible?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ealmost\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e impossible. However, that does not mean it actually \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eis\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e impossible. There’s a big difference, Ike.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, around half the class had already lost interest in what she was saying. For students in Class D, who dreamed of a mere 100 or 200 private points, reaching 20 million was a faraway dream. It was beyond the scope of our imagination.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“May I ask one question, please?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe watchful Horikita raised her hand. She looked quite determined, considering this was a potential road to Class A.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What is the highest number of points that a student has saved since the opening of this school? I’m just asking for the sake of reference.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A very good question, Horikita. About three years ago, one student from Class B saved nearly 12 million points before graduating.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“T-twelve million?! A student from Class B?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He was expelled before graduation, however, so he was unable to save those 20 million points in the end. He was engaged in a large-scale fraudulent operation to save up points.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fraudulent?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He took advantage of the newly admitted first-year students who didn’t yet understand the system. He went to them one by one and scammed points out of them, so he could reach the 20 million points necessary to move to Class A. There was no way the school could overlook such reckless actions, however. I don’t think that his goal was particularly bad, but people who break the rules must be punished.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was more than a mere anecdote. That story made the possibility of success sound truly impossible.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re saying that even if we were to use criminal methods, 12 million points is about the limit?” Horikita muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Give up on that method. Strive to save up your points responsibly.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita returned to reading, likely feeling idiotic for bothering to raise her hand at all. In this world, stories that seemed too good to be true were just that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, that reminds me. None of you have gotten any points yet from club activities, have you?” remarked\u0026#160;Chabashira-sensei, with the air of suddenly remembering.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are cases where individuals may win points based on their efforts in club activities, or their degree of participation. For example, if someone in a calligraphy club were to win a contest, they could receive corresponding points for that award.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis new information took everyone aback.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-you mean we can get points for participating in clubs?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. The other classes should have already been well informed of this.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what the hell? That’s so mean! Why didn’t you tell us earlier?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I simply forgot, sorry. However, extracurricular activities aren’t there just as a way to earn points. So it shouldn’t make any difference when you learned this information,” said Chabashira-sensei without a hint of timidity.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, no, no! That’s not true at all! If you’d told me before, I—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you saying you would have participated in extracurricular activities? Do you really think you would’ve been able to see any results after joining a club, results like winning prizes or being in games, with such shallow feelings?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well…you might be right about that, but… It was possible!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI understood both Chabashira-sensei and Ike’s viewpoints. If someone were to join a club simply for the sake of earning points, he or she probably wouldn’t see great results. If anything, joining a club for such a lazy, indifferent reason would probably make you a nuisance for the students who \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewere\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e serious about it. On the other hand, someone who joined the club for the sake of points might discover that they possessed a talent for it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt any rate, I deduced that our homeroom teacher was being extremely and deliberately mean.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know, if you think back on it now, it was obvious from the start.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean, Hirata-kun?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Think back. Remember what our P.E. instructor Higashiyama-sensei said when we went to the pool? He said the student who got the best time during our first class would get 5000 points. That was a stepping stone to prepare us for other opportunities. It seems plausible, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke scratched his head and slumped. “I don’t remember,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I got points for it, I probably would’ve joined calligraphy club, or some other kind of art club.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed like Ike could only see the positive side of things. I thought there naturally must be a downside.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere might be cases where if someone didn’t participate in their club seriously, he or she would be penalized. The easy route would probably destroy you. However, learning that our points would reflect the efforts we made in club activities was encouraging.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita. Doesn’t this mean there’s some value in saving Sudou?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We should save him because he’s in a club?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sudou told us that he may be picked as a regular on the team even though he’s a first year, right?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita gave a small nod.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If he was telling the truth…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe sounded somewhat doubtful.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s better to have a lot of private points, right? He can supplement his own grade if he fails, and he can save others.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have a hard time imagining that he’d use his points altruistically, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m saying that it’s better to have points saved up, just in case. Right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhether class points or private points, it was better to have a lot of them. There were absolutely no negatives to that. Also, we knew very little about how else to earn points at this stage. If our chances improved with Sudou in the class, then that was reason enough to make an effort. Horikita fell silent. Even she didn’t have the ability to create any points for us right now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I won’t say that I’ll help, but I suppose I ought to acknowledge Sudou’s existence, at least a little.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita’s language was harsh, but she acknowledged the connection to her own interests. I considered it unnecessary to say more, so I stopped talking. Horikita pondered the issue in silence.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e4.1\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eO\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eur class became temporarily excited by that fairy tale, but we were soon pulled back to reality. After school we resumed the search for a witness. I hung behind Kushida, Ike, and the others, trailing them like a ghost. I was impressed, surprised, and in awe of their natural conversation skills. It was clear as day that I, someone who couldn’t even converse with my fellow classmates, was not well suited to this task. How could they talk with people they’d never met before and behave like old friends? Monsters.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn this investigation, we sought not just names, but also contact information. Perhaps they felt compelled to give Kushida their information because of her personality. What a wonderful talent…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough Kushida and the others spent a good amount of time going to the second-year classrooms and talking to upperclassmen, they didn’t turn up any good leads. As time passed, the number of students who remained after class was dwindling. With a lack of new students to speak with, we decided to stop our investigation for the day.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks like we didn’t have any luck today, either.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone went back to my room to reevaluate our strategy. Sudou came by shortly afterward and joined our discussion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What happened today? Did you make any progress?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“None at all. Sudou, are you sure there was a witness?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI understood Ike’s doubts. Even though the school had said that’s what happened, there wasn’t any new information.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? I never said there was someone there. I said that it \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003efelt\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e like someone was there.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh. Is that so?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s certainly true that Sudou-kun didn’t say he saw anyone. He said that he had a feeling that someone was there.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe Sudou was hallucinating? He must be taking some pretty potent drugs or something.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMan, that was going a bit too far. Sudou put Ike into a headlock.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Gyahh! I give, I give!” Ike cried.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile the two of them messed around, Kushida and Yamauchi were wracking their brains. After discussing the matter for about 10 minutes, Kushida spoke up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We might want to change our methods a little. For example, let’s look for someone who might have found a witness.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Look for someone who \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003efound\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e a witness? I don’t get what you mean.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you going to look for the people who went to the special building on the day of the incident?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. What do you think?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat wasn’t a bad idea. Not many students went to the special building, but the entrance was well within eyeshot. In other words, if someone testified to seeing another person enter the special building, we’d be much closer to finding the witness.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That sounds great! Let’s start asking right away.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI noticed then that the person of interest, Sudou, was completely engrossed in some kind of digital basketball game on his phone. It was completely draining his battery. I think the game was called \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eGeneration of Miracles\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e or something, but I still didn’t quite understand. After he won the match, he struck a victory pose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though Sudou couldn’t really help, Ike and Yamauchi still appeared disgruntled at the sight of him. However, they concealed their dissatisfaction, probably because they were scared of Sudou’s counterattack. They both chose to ignore him instead. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTomorrow was Friday. Ferreting out information would be no easier when Saturday came around. That meant we actually had less time than we thought. Just then, my doorbell rang and a visitor appeared. The small group of normal visitors was mostly accounted for already. While I considered who this new visitor might be, she peered through the door.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Have you made any progress finding the witness?” asked Horikita, looking as if she already knew the response.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. Not yet.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m only telling you this because it’s you, but I may have found out something—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile she was talking, Horikita noticed that there were several pairs of shoes lined up by my door. She stopped and made a hard heel turn, apparently ready to run. Kushida peered over at the entrance, probably concerned that Horikita wouldn’t return.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, Horikita-san!” Kushida said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida smiled and waved to Horikita. Horikita, upon noticing Kushida, naturally let out a sigh.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks like your only choice is to come in, huh?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks that way,” Horikita grumped.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLooking exasperated, she entered my room.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, Horikita!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, Sudou was happiest to see her. He paused his game and stood.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you decide to help out? I’m super glad you’re here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t particularly plan on helping. You don’t appear to have found the witness yet, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida nodded despondently. “If you didn’t come here to help, then why \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e you come?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was wondering what kind of plan you’d come up with.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’m happy if you just want to listen to us talk. I\u0026#160;hoped you could give some advice.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida then relayed her plan to Horikita, whose expression remained neutral from start to finish.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wouldn’t say it’s a bad plan. Provided you have sufficient time, your labors may actually bear fruit.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTime was indeed the issue here. Considering we had a mere few days left, it was doubtful we’d see any results.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well. Now that I’m abreast of the current situation, I’ll be leaving.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the end, Horikita was going to leave without ever having sat down. She was no lingerer.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you come up with something? Like information about the witness?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen Horikita had shown up at my door, it seemed like she’d wanted to say something. She wasn’t exactly the friendly type, certainly not the sort who’d come to my room for casual conversation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll give you just one piece of advice, to help your pathetic odds,” she said. “It’s hard to see what’s right in front of you. If someone actually witnessed Sudou’s incident, then that person is close by.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita’s information was much more significant than I’d imagined. She spoke as if she had already found the hypothetical witness.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean, Horikita? Are you seriously implying that you found this person?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou appeared more shocked and doubtful than joyous. That was understandable. No one, myself included, really believed her…until we heard her next words.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sakura-san.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita spoke a most unexpected name.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sakura-san? From \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eour\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e class?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi and Sudou exchanged looks. They didn’t seem to know who Sakura even was. That was probably to be expected, though. To be honest, I had to wrack my own memory for a moment.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She’s the witness. She saw the incident.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why do you say that?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When Kushida-san said that she was looking for a witness in class, Sakura looked down. A lot of students were staring at Kushida-san. Sakura was the only one who didn’t appear interested. She wouldn’t have acted that way without some connection to the incident.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI hadn’t noticed that at all. I was genuinely impressed by Horikita’s observational prowess. She’d noticed a classmate’s very minor gesture.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Since you were one of the people who also stares at Kushida-san, it’s not surprising you didn’t notice,” Horikita said to me, her tone heavily sarcastic.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So you’re saying that there’s a high probability that this Sakura, or Kokura, or whoever  is the witness?” inquired Sudou. A sharp observation, something a fool would be unlikely to say.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, Sakura-san is undoubtedly the witness. Her actions confirmed it. Although she may not admit to it, she is definitely the one.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile we’d been paralyzed by uncertainty, Horikita had stepped up and taken control. That Horikita had done so for our class’s sake was particularly moving.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you really do this for me, after all?!” Sudou looked especially moved.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t misunderstand. I just didn’t want to waste more time looking for the witness, and letting other classes see us in such a shameful light. That’s all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Umm. But still, the point is that you saved us, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You are free to interpret things however you wish, but I’m telling you that you’re wrong.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, don’t lie! You’re a \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003etsundere\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, Horikita!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke went to hit Horikita’s shoulders playfully, as if teasing her. Horikita grabbed his arm and tossed him to the ground.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oww!” he cried.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t touch me. This is your one warning. The next time you try it, I’ll despise you all the way to graduation.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I won’t touch you. Not even if I wanted to…ow, owww!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe put him in a headlock. It was unfortunate for Ike, but you reap what you sow. Anyway, those weren’t the defensive moves of a normal girl. Since I knew that her older brother practiced karate and aikido, she might have learned something, too?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ooh. My arm!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ike-kun,” said Horikita as Ike writhed on the floor in agony.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI thought she was taking things too far.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Should I amend my previous statement, and say ‘I shall continue to despise you long past our graduation’?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ohh! So mean!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter delivering what seemed to be his last words on the matter, Ike’s energy was exhausted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura, though. Of all people, the witness was from Class D. It was difficult to know whether this was good news or not.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Isn’t this great, Sudou? If the student’s from Class D, then we can definitely get her to testify!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. I’m happy there’s a witness, but who’s Sakura? Do you know her?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou didn’t seem to have any idea. Yamauchi appeared quite surprised.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you serious? She sits behind you, Sudou!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, that’s not it. She sits diagonally ahead of you and to the left, I thought?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, you’re both wrong. She sits diagonally ahead of Sudou-kun to the \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eright\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e.” Kushida corrected them, a slightly pouty look on her face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Diagonally ahead to the right? I can’t remember at all. I’m sure there’s someone there, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was obvious. A permanently empty seat would have been bizarre. Sakura certainly didn’t stand out very much. The fact we didn’t really know her was a problem.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I probably know her. I feel like I’ve heard her name somewhere before,” I offered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI felt like I almost had something, but not quite.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can you tell us about her?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I suppose there’s one thing. Would it help if I said she has the biggest boobs in class? Her boobs are insanely huge.” Ike, having returned to the land of the living, discussed one of Sakura’s chief physical characteristics. Personally, I couldn’t identify her based on that information alone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, she’s that plain girl with glasses, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHow did you jump to that?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I was a little stunned.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not good to remember people based on something like that, Ike-kun! That’s pathetic,” Kushida cried.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“N-no, no, it’s not like that, Kushida-chan. It’s just, you know. I wasn’t trying to say anything indecent or anything. You know, it’s like how you can remember a tall guy because of his height, right? It’s the same kind of thing, but I’m just remembering her based on another physical characteristic!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida was rapidly losing faith as Ike frantically tried to smooth things over. It seemed like it was too late.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Damn it! No, it’s not like that, it’s not! I absolutely do not like plain girls like her! Don’t get the wrong idea!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI doubted anyone had the wrong idea. While Ike broke down in tears, the rest of us started talking about Sakura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then we should see how much Sakura-san knows. Any ideas?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“None. We just have to confirm with her directly.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can’t we just go to Sakura’s room right now? We don’t have much time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI thought that Yamauchi’s proposal seemed innocuous, but it all came down to Sakura’s personality and behavior. Sakura was an unusually shy girl. It wasn’t difficult to imagine that if unfamiliar people suddenly showed up, she’d be perplexed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, so should we try calling her?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI recalled that Kushida already knew everyone’s information, including Horikita’s. She listened to her phone ring for about 20 seconds, but then she shook her head and hung up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No luck. The call didn’t go through. I can try again later, but this may be a delicate matter.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean by delicate?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She gave me her contact information, but she doesn’t know me very well. She might be confused if I tried to call her. Also, she might not even have been there to answer the phone.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura might just be pretending to be out, too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So she’s kind of like Horikita?” Ike said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhy would you say something like that when the person you’re talking about was standing right in front of you, Ike? Horikita probably didn’t care, though. Really, she seemed pretty uninterested in what Ike said at all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Goodbye.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, Horikita-san!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita stood quickly and headed for the door. By the time I managed to get up, the door had clicked shut.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What a \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003etsundere\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou wore a happy smile, chuckling and scratching his nose with his finger. She wasn’t \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003etsun\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e and she wasn’t \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edere\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. She wasn’t anything, I thought. She was a non-\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003etsun\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, non-\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edere\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. Since we couldn’t prevent Horikita from leaving, we resumed our conversation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I get the feeling that Sakura-san’s just a shy person. That was my first impression of her.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was strange to discuss someone you’d never talked to.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She’s plain, that’s it. Talk about a waste, man. Like pearls before swine.” While Yamauchi spoke, he gestured with his hands near his chest, to represent Sakura’s breasts.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, for sure. Her boobs are huge, though. It’s really cute!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke seemed to have already forgotten the shame of his earlier remarks, and was now excited again. Kushida gave him another bitter smile. After noticing Kushida’s expression, Ike’s regret returned. He was the type of hapless creature that made the same mistake over and over.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though I hadn’t said anything, I felt like I was being lumped into the same category as Ike and Yamauchi. Kushida’s bitter smile seemed to say, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eYou’re \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ealso \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003efixated on boobs, aren’t you? You disgusting pervert.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Granted, that was my persecution complex speaking.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What about Sakura’s face, though? It’s no use, I just can’t remember anything.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could barely match Sakura’s name to a face. I recalled seeing her back when we were making bets. The bet had been about boobs, though. I guess we \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewere\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e birds of a feather after all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy image of Sakura was of her quietly sitting by herself, hunched over her desk.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know if Sakura talks to anyone. Yamauchi?  Wait, hold on… Yamauchi, you said you confessed your feelings to her before, right? If you did, then you can talk to her easily, yeah?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOh, Ike was right. Yamauchi had said that. They’d mentioned it before.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh, ahh…well, I may or may not have said something like that.” Yamauchi feigned ignorance.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So you were lying?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“N-no, I wasn’t. I wasn’t lying. It was just a misunderstanding. It wasn’t Sakura; it was a girl from the next class over. Not a gloomy and ugly girl like Sakura. Err, hold on. Sorry, I got a message.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi dodged the question by whipping out his phone. It’s certainly true that Sakura was plain, but she wasn’t ugly. I’d never gotten a good look at her face before, but she seemed to have very nice features. Even so, I couldn’t say that with complete confidence, probably because Sakura had so little presence.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’ll try to talk to her myself tomorrow. I think she might be on her guard if a lot of people approach her,” Kushida said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That sounds good.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Kushida couldn’t manage it, then I doubted anyone else would be able to get through to Sakura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e4.2\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003e“I\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003et’s hot.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOur school didn’t change uniforms with the seasons, so we had to wear blazers throughout the year. The reason was simple: every building came equipped with heating and cooling systems. The heat was only an issue going to and from school. The morning commute. Sweat had begun to trickle down my back in the few minutes that it took to get from the dorms to school.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI took refuge from the heat inside, where the nice, cool air greeted me. It must have been hell for the students with morning practice. Those boys and girls all gathered around the classroom’s source of the cool air. From an outsider’s perspective, it was like bugs flitting about a light bulb. Perhaps that was kind of a bad example.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good morning, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata called to me, his expression as fresh and friendly as usual. The sweet yet subtle fragrance of flowers always emanated from him. If I were a girl, I’d probably unintentionally shriek, “Hold me!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kushida-san told me about it yesterday. She said that you found the witness. Sakura-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata looked over at Sakura’s seat. She hadn’t yet arrived.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you going to talk to Sakura?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Me? No. I’m going to greet her, that’s all. I’ve wanted to talk to her since she’s always by herself, but as a guy I\u0026#160;don’t want to come off as forceful or anything. Also, if I asked Karuizawa-san to talk with her, that might cause a few problems.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA conversation between the super assertive Karuizawa and Sakura-san was difficult to imagine.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think that for the time being, we’ll just wait for more information from Kushida-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That sounds great, but why are you talking to me? Talking to Ike or Yamauchi would be better,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no real reason for him to tell me any of this. I wasn’t really part of the team.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not for any particular reason. I guess it’s because you have a connection to Horikita-san. She doesn’t talk to anyone except for you, so I thought you’d pass it along.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWas that my only area of expertise? Hirata smiled, agreeably. If I were a girl, I would have gone from zero to 100 right there, and my heart would have been beating out of my chest.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, that reminds me. If you’re up for it, we should hang out sometime soon. What do you think?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHey, hey, don’t tell me that you’re not satisfied with girls anymore and are looking to make \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003emy\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e heart throb. If I, a known recluse, accepted the hero’s invitation without due consideration, that would be a big problem.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure. It should be fine, I guess.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAhh, I said the exact opposite of what I’d been thinking. Damn, curse my terrible mouth. I definitely hadn’t been waiting for Hirata to invite me to hang out or anything. Yeah, that’s right. This is what’s wrong with the Japanese people: we are incapable of saying ‘no,’ so we have to respond in a roundabout way when invited out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry. Do you not really want to?” Hirata sensed my unease.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, no, I’ll go. I definitely want to,” I answered, feeling a little disgusted with myself. I tried to act like a proud guy, but I couldn’t help actually wanting to go.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you fine with my girlfriend coming, too?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm? Oh, Karuizawa-san? That’s okay.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy response was surprisingly quick. Well, there was a wide variety of “types” of couples. Since they still called each other by their surnames, they probably weren’t that close yet. I reluctantly parted from Hirata, and fiddled with my cell phone while I waited for homeroom to begin. Then, I noticed that Sakura was in her seat.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe wasn’t doing anything. She just seemed to be sitting at her desk, killing time. I wondered just what kind of student Sakura was. In the three months that I’d been at this school, I knew nothing about her apart from her surname. It probably wasn’t just me, either. The rest of the class probably had no clue.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida and Hirata were proactive and able to open up to just about anyone. Horikita didn’t feel the agony of solitude. So what about Sakura? Did she like being alone, like Horikita? Or was she suffering because she didn’t know how to connect with people, like me? Those were the mysteries that Kushida was supposedly going to unravel for us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e4.3\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eC\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003elass was over. Kushida stood up right as homeroom ended and walked over towards Sakura, who was quietly preparing to leave. Kushida seemed oddly nervous. Ike, Yamauchi, and even Sudou appeared interested in what was going on, and directed their attention over to the girls.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sakura-san?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe bespectacled girl with the hunched back peered up with a timid expression. Apparently she hadn’t expected someone to talk to her, and was flustered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wanted to ask you something, Sakura-san. Do you have a moment? It’s about Sudou’s case.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“S-sorry. I…I have plans, so…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura was obviously uncomfortable. She averted her eyes. She probably wasn’t good at talking with others. Or rather, she gave off the impression that she didn’t \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003elike\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e talking to them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol2_INTERIORILLUSTRATIONS_7\" src=\"/hola-lector-agua/images/books/v2/OEBPS/Images/ClassroomElite-Vol2_INTERIORILLUSTRATIONS_7.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can you please make some time? This is important, so I’d like to talk to you. When Sudou-kun was involved in the incident, were you perhaps somewhere nearby?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I don’t know. I already told Horikita-san. I really don’t know anything…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer words were weak, yet she vehemently denied it. Kushida could clearly see how unpleasant Sakura found this, so she probably didn’t want to press her much more. Although Kushida appeared slightly perplexed at first, her concerned expression quickly melted into a pleasant smile. Even so, she couldn’t withdraw just like that, because Sakura might have tremendous influence over Sudou’s fate.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So…is it okay? If I go back…” Sakura whispered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSomething seemed strange, however. She wasn’t simply bad at talking with people. It looked as though she was hiding something. You could see that from her behavior. Sakura concealed her dominant hand while also avoiding eye contact. Even if she weren’t comfortable meeting someone’s eyes, people generally looked in the direction of those to whom they were speaking. Sakura didn’t look at Kushida’s face at all.  \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Ike or I were talking to her, I could have understood that reaction. Though it was mostly out of formal obligation, Sakura had exchanged numbers with Kushida. Kushida’s behavior in a one on one conversation was different, though.  I don’t think Horikita was wrong to feel some discomfort when speaking with Kushida. I’d found something a bit off-putting about it myself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can’t you please spare just a few minutes now?” Kushida asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-why, though? I-I don’t know anything…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Kushida failed, we’d gain nothing from their conversation. Of course, the longer this awkwardness dragged on, the more attention they’d attract. This seemed like a complete miscalculation on Kushida’s part. Since they were already acquainted and had exchanged contact information, Kushida probably had expected this conversation to go more smoothly, and had gone into this situation thinking she wasn’t going to be rejected. That explained why this was currently falling apart.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita carefully monitored the situation. She looked over at me with a somewhat smug expression. It was as though she were saying \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI know that your powers of observation are incredible.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m really bad at being social. I’m sorry…” Sakura muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe spoke in an unnatural, strained way, and didn’t seem to want Kushida to get any closer. When discussing Sakura earlier, Kushida had described her as a shy but ordinary girl. Judging from her current behavior, though, she clearly wasn’t normal. Kushida must have felt the same, because she couldn’t hide her confusion. Kushida was normally very good at getting others to open up to her, but here she was failing. Horikita also understood what was happening. As she watched the conversation, she came to a conclusion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My, how unfortunate. Kushida failed to persuade her.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita was correct. If Kushida couldn’t do it, then I didn’t think that anyone else in our class would be able to. Kushida was good at creating an informal atmosphere, one in which socially awkward people could converse naturally. However, everyone has what they consider their own personal space. An off-limits area, in other words.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCultural anthropologist Edward Hall further divided the idea of personal space into four parts. One such zone is the so-called “intimate space.” In this particular space, you’d be near enough to hug someone. If an outsider tries to step into this space, people naturally exhibit strong signs of rejection. However, if that person is a lover or a best friend, then he or she won’t find it uncomfortable. Even if someone were only a casual acquaintance, Kushida probably wouldn’t mind letting that person into her “intimate space.” That is, she didn’t seem to put high value on the idea of personal space.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Sakura had clearly rejected Kushida. No…rather, it looked like she was running away. When Sakura was first asked, she’d said that she “had plans.” If she really \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e have plans, she’d have repeated that when asked again. Sakura collected her bag and stood, seemingly putting distance between herself and Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“G-goodbye.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura had apparently decided to run because she couldn’t find a skillful way to end the conversation. She snatched a digital camera off her desk, and started to walk away. Just then, she ran into Hondou’s shoulder. Focused on texting a friend, he wasn’t paying attention to where he was going.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura’s digital camera tumbled to the floor with a loud clack. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHondou simply kept walking, attention still focused on his phone. He apologized as he left. “My bad,” he called. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura, flustered, rushed to pick up her camera.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No way. There’s nothing on the screen…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura put h
