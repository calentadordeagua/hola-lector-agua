right and happy Shizuku is. Right? Come on, Ayanokouji.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAll of the pictures she’d uploaded were cute, so she seemed accustomed to taking selfies. However, I glimpsed one piece of incontrovertible evidence that proved Sakura and the idol Shizuku were one and the same.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, Kushida is definitely right. That’s Sakura. Here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI pointed to one of the pictures.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can barely see it, but the door to her dorm room is in this picture.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It looks like the same as the doors in our dorm.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, it was likely she’d taken that picture at school.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, so Sakura is Shizuku after all… I still don’t understand the point.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good job noticing this, Kushida.” I meant it. Even though there was a clear resemblance, I wouldn’t have noticed without Kushida drawing our attention to it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When I saw Ike-kun reading that weekly magazine, I remembered something. I had the feeling I’d seen Sakura somewhere before,” Kushida said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh my god, there’s a gravure idol in our class! I’m so turned on!” Ike exclaimed enthusiastically, unable to hide his excitement. After such an undignified reaction, I imagined Kushida would want to pull away from him. Although she was kind to an almost reckless degree, I couldn’t sense that kind of acceptance from her now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But just when Shizuku started to become really popular, she suddenly disappeared.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe lived a double life as an idol and a quiet, inconspicuous student at our school. Why had she wanted to create another life? It was like a coin with two very different sides. \u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol2_INTERIORILLUSTRATIONS_12\" src=\"/hola-lector-agua/images/books/v2/OEBPS/Images/ClassroomElite-Vol2_INTERIORILLUSTRATIONS_12.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs 9:00 \u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003ePM\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e approached, it was just about time for our group to split up for the night. I saw them all off at my door.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kushida, I still have something I want to talk to you about. Can you stick around for a little bit?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm? Something to talk about? Sure.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Ayanokouji! What do you need to talk to her about, huh?! Don’t tell me it’s…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI dismissed Ike’s fears with a wave of my hand. But even after I said we were just going to talk about Sakura, Ike got really close and whispered into my ear that he didn’t believe me. “If you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edo\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e confess your feelings to her, I won’t forgive you. You know that, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eYou don’t need to be so paranoid…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLike heck I was going to do that. Besides, even if I did, I’d get destroyed in one second. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seriously. If you’re that worried about it, then wait in the hallway. We’ll be done in a minute.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke immediately agreed to wait. He struck a pose and stretched himself to his full height, parking himself in the hallway right outside my door. After the guys had left, I started to tell Kushida about the conversation I’d had with Sakura that day.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh yeah. So, about Sakura-san?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was surprised when I found out that she was an idol, but I also kind of understood it. I wonder if that’s her real personality?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough I’d avoided just stating this idea outright, I also thought that Sakura had a hidden side, just like Kushida. However, Kushida, who had a different understanding of the facts, had come to an entirely different conclusion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think that…most likely, Sakura-san would say that her idol self is actually her false face. Well, I guess saying that it’s false isn’t right, either. I think that she’s creating another personality with makeup.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Makeup… So in other words, it’s a persona?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. I think with the right pretenses in place, Sakura-san could even make herself smile in front of people.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida sounded rather persuasive. There was something true about her words. But at that moment, I began to think about what Kushida had been trying to tell me during our last phone call.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey. Back when we were talking on the phone, what was it you wanted to tell me?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida’s shoulders twitched slightly in response. It was like she hadn’t remembered it until just now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll tell you later. Right now, our priority is to resolve this case. Besides, it’s a personal request.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A personal request?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI found her wording enticing, but it seemed like Kushida needed help with something. I didn’t really stand out in any way. I couldn’t provide something that Kushida lacked. She could study, and she had ambition.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry. If I told you now, it’d just be a bother.” She smiled bitterly and clasped her hands together in apology.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, if things with Sudou turn out okay, could you tell me then?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, that would be fine.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe turned and grabbed the door handle. However, she suddenly stopped, and remained perfectly still for a short while. Looking at her back, I had no idea what kind of expression she wore.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kushida?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSomething seemed a little off. After I said her name, Kushida turned and closed the distance between us. She stood on tiptoe, her heels lifting off the ground as she put her hand on my chest and brought her mouth close to my ear. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you listen to my request, Ayanokouji-kun…I’ll give you my most precious possession.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was like the whisperings of a witch. As if a sweet, yet potentially deadly fragrance had taken hold of my heart. I\u0026#160;couldn’t tell whether Kushida’s smile was genuine or bitter as she whispered in my ear. The only thing that I knew for certain was that Kushida was no angel. As far as she was concerned, I didn’t know how to feel. Most people had different sides to them, but in her case it was more pronounced, as if another person lived inside of her. This Kushida was just kind of creepy.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t tell at all what her game was, what she was thinking or what she wanted to do. I couldn’t even tell where the girl called Kushida Kikyou had gone. The change was so stark that I even found myself wondering if she had a split personality. The gap was that huge. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen she drew away again, I saw that Kushida had returned to being the girl with the gentle smile. When she opened the door, she called to Ike, who had been waiting impatiently outside. Not even the faintest trace of that frightening Kushida remained.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e5.7\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003efter everyone left, I sat in front of my computer and looked at Sakura Airi’s – I mean, the gravure idol Shizuku’s – blog. As I read through the past entries, I saw that she had started blogging about two years ago. Precisely around the time that Sakura started working as a gravure idol. Her hopes and aspirations for the future were spelled out in writing. I didn’t see anything that especially stuck out, no red flags. I checked out other idol blogs just for reference, but they seemed similar.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had to wonder, how would it have felt for a second-year junior high student to debut in the entertainment world? During one year, she’d updated the blog almost every single day. She wrote about what happened that day and her thoughts. She also responded to almost every single comment from her fans. But, just as I’d expected, she stopped replying after being accepted to this school.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe had strictly adhered to the rule about contacting anyone outside the school. Although she wasn’t really the direct center of attention, Sakura seemed more popular than I had imagined. She had over 5000 followers on Twitter. Many of them were fans that wanted her to return to doing gravure magazines really soon, or asked if she had any plans to appear on television. Among those many comments, a post from three months ago snagged my attention.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Do you believe in fate? I do. I believe we will be together forever.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt that had been the only message, it would’ve been the delusional fantasy of a fan. But there was more every day, and it escalated quickly. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I can always feel you close to me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“You were even cuter today, huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Did you notice when our eyes met? I noticed.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Sakura saw this, those words would probably frighten her. It was almost as if the poster wanted to be physically close to Shizuku so he could whisper these words into her ear. Were they just delusions? Within this heavily restricted school, only a very limited number of people could encounter Sakura. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStudents, teachers…or anyone who did business with the school. I flashed on a memory of the man who worked at the campus electronic store. Then, a post from last Sunday caused my hair to stand on end. I had a crushing realization.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Look, God is real after all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura had bought a digital camera after she enrolled in school. Of course, she’d probably disguised herself that day, just like any celebrity would. But while a disguise like that would make sense for her to use with fans, that clerk had recognized who Sakura was. Of course, there were only a few ways that they could have contact at that point.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, after Sakura’s camera broke, he saw her. Since she loved it so, she had to fix it. Given our circumstances it was nearly impossible for someone in Class D to buy a new one. However, because she took it in for repair, there was the possibility that she’d encounter the store clerk.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe’d been hesitant to go get her camera repaired because of the clerk. The clerk, on the other hand, had been in incredibly high spirits. After all, here was his chance to get his favorite idol’s real name and phone number on the form she had to fill out. It also might explain why she’d called me that evening and asked some rather significant questions. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I thought about it, the answer seemed obvious. I combed through the comments, searching for more he might have written.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“It’s so mean for you to ignore me! Or perhaps you just didn’t notice me?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“What are you doing now? I want to meet you, I want to meet you, I want to meet you!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrightening comments were posted one after another. Of course, other fans had simply been disgusted by these comments, but it was different for Sakura. I wondered if knowing that he was so close pushed her to the point of almost unimaginable terror? But Sakura had concealed that from us, and now she was desperately trying to fight Class C for us as a witness. She was probably hesitant to leave her dorm, considering how much this man’s existence terrified her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf they were on the same campus, her fear wasn’t surprising. However, there was hardly anything we could do, no plan we could implement to solve the issue of this stalker by tomorrow. In the end, the only option was to wait on an \u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eSOS\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e from the girl in question.\u003c/span\u003e\u003c/p\u003e\r\n\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol2_INTERIORILLUSTRATIONS_13\" src=\"/hola-lector-agua/images/books/v2/OEBPS/Images/ClassroomElite-Vol2_INTERIORILLUSTRATIONS_13.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 5: Each and Every Prediction\",\"volumeId\":\"v2\",\"chapterIndex\":11,\"prevChapter\":{\"volumeId\":\"v2\",\"chapter\":10,\"title\":\"Chapter 4: An Unexpected Witness\"},\"nextChapter\":{\"volumeId\":\"v2\",\"chapter\":12,\"title\":\"Chapter 6:
