-sensei stood up in response to this unexpected request.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you want to come to an agreement? Or did you already do something to the effect?” My older brother gazed sharply at the Class C students. However, the three boys shook their heads in unison, signaling that no, they didn’t want to compromise.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We realized that we weren’t really saying anything worthwhile about which side was at fault. Our complaint was a mistake. Therefore, we’d like to withdraw it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re withdrawing your complaint?” Chabashira-sensei chuckled as she spoke. She wore a thin smile, as if she found something amusing.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s so funny, Chabashira-sensei?” Sakagami-sensei did not seem to like her attitude, glaring at Chabashira-sensei in irritation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, excuse me. I was just surprised because I hadn’t foreseen this. I figured we would argue all day until one side collapsed, or until we could propose an acceptable compromise. However, unbelievably, they’ve said that they want to withdraw the complaint.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Teachers, members of this student council, we are sorry to have taken your time. However, after careful consideration this is the conclusion we’ve all come to.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe three’s ardent appeal signaled that their will was strong. It seemed that Ayanokouji-kun and Ichinose-san had handled things quite well. I tried to act calm and collected, without letting my relief show. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Surely you can’t accept this. You did nothing wrong. Sudou-kun caused all of this through one-sided intimidation and violence. Do you plan to just quietly sit there and take this?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs if realizing something, Sakagami-sensei turned anger-filled eyes towards Sudou-kun and me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What did you do? Threaten my students with violence so they’d withdraw their appeal?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Don’t screw around. I didn’t do anything,” Sudou said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no way that my students would withdraw their complaint unless you had. Tell us the truth. If you do that, then we can do something about it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sakagami-sensei…we’re going to withdraw the complaint no matter what you say. Our decision won’t change.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakagami-sensei, as if unable to comprehend what his students were saying, hung his head low and sat back down.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you say that you’d like to withdraw your complaint, we will accept it. It is certainly rare to cancel deliberations during a case, but we can do it.” My older brother, the student council president, tried to remain calm and composed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait. I don’t get it. Why are you guys just withdrawing your complaint like that?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI grabbed Sudou-kun’s arm to prevent him from uttering another word.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shut up.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had no time to explain, unfortunately, so I pulled strongly on Sudou-kun’s arm and sat him down. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you wish to withdraw your complaint, we have no intention of fighting it. We accept.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough I could understand Sudou-kun’s dissatisfaction at being brought to trial based on a lie, if the complaint was withdrawn there would be no winners or losers. This was what we’d been working toward.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, according to regulations, we will require a certain payment of points in order to cover of miscellaneous expenses incurred over the course of deliberations. Are there objections to this?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was the first time we’d heard of such a thing. The students from Class C looked upset, but came to a conclusion right away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We understand… We will pay.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Very well, the proceedings have come to an end. We will now call this discussion closed.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile we waited for the curtains to fall on this rather abrupt end, I wondered who could have predicted such an outcome. Meanwhile, I saw Chabashira-sensei direct a rather bold smile at me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sudou-kun,” I said. “You will no longer face suspension. The school will not consider you a problem child. You will be able to participate in club activities from today onward. Right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI looked to Chabashira-sensei for confirmation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course. The same goes for the students in Class C, naturally. Youthful zeal is a good quality. However, the next time you think about causing problems, you should remember this incident as an example. Do not forget. Okay?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe emphasized this point strongly to both sides. Sudou-kun looked rather dissatisfied, but nodded. I supposed that his joy at being able to play basketball outweighed his dissatisfaction. Kushida-san and Hirata-kun’s actions would be rewarded as well. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakagami-sensei slowly left with his students. The moment the door closed, it sounded like he started hounding his students for answers. But that didn’t matter. We wouldn’t have to deal with any more idiotic appeals after this, most likely.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m glad, Sudou,” Chabashira-sensei said, sounding grateful.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He he. Well, of course!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Personally, I think you should have been punished,” she added, rather harshly. Her words condemned Sudou-kun, who was still joyful over his victory.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The reason this incident occurred at all is because of your behavior. Who told the truth and who lied is trivial. It’s important that you don’t let this kind of thing happen again. You do understand that, yes?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, admitting your own faults isn’t ‘cool.’ So even if you acknowledge that your personality was partly to blame, you act tough. You get stronger. That’s fine. However, if you act like that, you won’t be able to make real friends. Eventually, Horikita will abandon you. She’ll leave.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s…” I wouldn’t exactly call us friends.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s strength in admitting your mistakes, Sudou.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei had tried to reach out to one of her students for the first time, as a homeroom teacher. I\u0026#160;think that Sudou-kun understood what she was saying, even if unconsciously. He hung his head low and sank in his chair.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand… If I hadn’t acted that way in the first place, then I wouldn’t have hit those guys. It wouldn’t have been such a big deal. I knew that, somewhere.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen this first came up, he’d asserted that Class C had lied, and had continued to say only that. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I always fought all I wanted for my own satisfaction. But it’s not like that anymore… I’m a Class D student, and my personal actions affect the entire class. Now I’ve experienced that firsthand…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou-kun might actually be dealing with a great deal of anxiety and stress in ways I couldn’t see.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I won’t cause problems again, sensei. Horikita.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThose were the first penitent words I’d heard out of Sudou-kun’s mouth. I wondered if Chabashira-sensei was surprised. If so, she shouldn’t be. Sudou-kun might have understood this much, but he was still Sudou-kun. A person couldn’t change in just one day.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You shouldn’t make promises so casually. You’ll cause trouble soon again.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tch!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOur teacher, who was rather perceptive about Sudou-kun’s shortcomings, rejected his promise.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you think, Horikita? Do you think that Sudou will become a model student?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I don’t.” I agreed with the teacher without hesitation. However, that wasn’t all I had to say. “However…Sudou-kun certainly made some progress today. He admitted he was at fault. So I’m sure that he’ll grow more tomorrow.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yeah…” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m glad to hear that, Sudou. It looks like Horikita hasn’t abandoned you yet.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I’ve already abandoned him. I just won’t allow him to run loose anymore.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what does that mean?!” Sudou-kun scratched his head and smiled, as if he just shaken off something heavy. “Well, I’m gonna get going. I have club activities. See you later, Horikita.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith those words, Sudou-kun hurriedly stepped out of the room and into the hallway. He was not remorseful. He was definitely going to cause trouble for us again soon. He was a nuisance.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“May I leave now, Chabashira-sensei?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait just a moment. There’s something I want to talk to you about, Horikita. You two leave first, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei urged my older brother and Tachibana-san to leave.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce they were gone, she looked deeply interested, crossing her arms before her on the table.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So. What methods did you use, Horikita?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t try to dodge the question. They wouldn’t withdraw their complaint without a reason, would they?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll leave that to your imagination.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe’d fabricated a lie because we were backed into a corner.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So it’s a secret, hmm? Well, allow me to change the question. Who came up with the strategy that defeated Class C?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why do you care about that?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji isn’t here, so I’m a little curious.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei had been rather preoccupied with Ayanokouji-kun ever since we started school. I\u0026#160;could somewhat understand why, now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t want to admit this, but Ayanokouji-kun…might have something exceptional to him.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI surprised myself by saying this, which could be taken as an admission of defeat. However, our victory would not have been as decisive without him. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. So you recognize that, hmm?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that surprising? You were the one who first put me together with Ayanokouji-kun, Chabashira-sensei. You did it because you couldn’t overlook Ayanokouji-kun’s potential, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“His potential, hmm?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Though he does try to hide his ability by pretending to be an idiot, for some mysterious reason.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYes, he was truly incomprehensible. I could not find meaning in such behavior. It was likely that he was simply being absurd.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are various things to consider. But if you want to reach Class A, I’ll give you one bit of advice.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Advice?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The students in Class D all have some kind of defect, more or less. To borrow an expression used by others in this school, Class D is an assemblage of people that could be called ‘defective products.’ You already understand this quite well though, don’t you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t intend to admit that I have a defect. But I do understand.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, what do you think is Ayanokouji’s defect?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAyanokouji-kun’s defect…One thing immediately came to mind.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’ve already established it. He already knows what his own defect is.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh? And what is it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He ‘dislikes trouble,’” I answered, with confidence. However, I felt a strange sense of discomfort that I couldn’t explain. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He dislikes trouble, hmm? Is that what you perceive when you look at Ayanokouji?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No… It’s because he said it himself.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei snorted and chuckled. She spoke again, her tone firm.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, Horikita. Let’s try to learn as much as we possibly can about the boy called Ayanokouji, without delay, shall we? Otherwise, it’ll be too late. You already seem to have fallen into Ayanokouji’s trap.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?” Fallen into his trap? That was nonsense.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why do you think Ayanokouji purposefully got scores of 50 points across on the board on his entrance examination? Why do you think Ayanokouji is helping you? Why do you think that Ayanokouji doesn’t put himself forward as a superior student, despite having superior ability? Is Ayanokouji Kiyotaka really someone who ‘dislikes trouble’?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf he truly wanted to prioritize peace and tranquility, then why score 50 points in all subjects and allow himself to draw this much attention? Had he deliberately poked his nose into this incident as well? I wondered if he ought to have been carefully monitored, like many other students. As Chabashira-sensei said, his behavior didn’t fit the pattern of someone who “disliked trouble.” That unconscious realization must have been the cause of my earlier discomfort.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In my personal opinion, Ayanokouji is the most defective student in Class D.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He’s the most defective?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Higher functioning products are more difficult to handle. If you misunderstand how to handle him, the class might be completely destroyed in short order.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Chabashira-sensei, do you really understand what about him can be considered defective?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Get to know the person called Ayanokouji. What is he thinking? What focal point does he base his actions around? What is his fatal flaw? There’s definitely an answer there.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhy was Chabashira-sensei telling me such things? As our homeroom teacher, she usually appeared unaware of and unconcerned with her class. But, if someone so disinterested thought this way, then… \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei said nothing more.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e7.6\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e waited outside the student council room until the meeting had concluded. The students from Class\u0026#160;C and Sakagami-sensei left first, with Sudou following a little while later. He wore a bright, cheerful expression.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks like it went well,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Man, I don’t understand what happened, but Horikita did something for me. Right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI nodded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I knew it. I knew she’d come through for my sake. Heh heh heh.” He looked incredibly happy. “Well, I gotta head to my club. We should have a party tonight.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe next people to exit were the student council president and Secretary Tachibana.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Excellent work.” I thought we’d just exchange a light greeting, but the president stopped in his tracks to address me. “I have approved Class C’s request to withdraw their complaint.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that so?” I said. “Well, I guess miracles do happen.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita’s brother remained still and looked me in the eyes. I couldn’t tell what he was thinking.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So this was all to prove that Sakura wasn’t a liar, as you said? I suppose if Class C withdrew their complaint, then talk would spread quite naturally. If Sudou or Sakura weren’t the liars, then Class C was.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your little sister handled things well. I didn’t do anything.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If that’s your answer, then I’m impressed. Even though it’s a simple story.” The unflappable Secretary Tachibana clapped her hands.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tachibana. Do you still have one seat open for secretary?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. A first-year Class A student applied the other day, but was rejected after the first interview.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji. If you wanted it, I would appoint you to the position.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was surprised, but Secretary Tachibana appeared even more shocked than me. “S-student council president… Do you really mean that?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you disapprove?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“N-no. If you say so, I have no objections. But…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah, I hate troublesome stuff. Besides, being in the student council is no joke. I want to lead an ordinary student life at this school,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSecretary Tachibana was even \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003emore\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e shocked by my response.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Are you refusing an invitation from the student council president?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’d just never do anything that I’m not interested in…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t do what I didn’t want to do. Besides, there was no reason to invite me onto the student council in the first place.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s go, Tachibana.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTheir interest in me had apparently run out with my refusal, so they left. A short time later, Horikita and Chabashira-sensei appeared. Chabashira-sensei just gave me a slight glance, leaving without saying anything in particular.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yo.” I raised my hand as I greeted Horikita, but was met with an intense glare the likes of which I’d never seen from her before. She quickly returned to her neutral expression, though.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What were the results?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’d already know, right?” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m glad to hear that. Looks like your strategy worked well.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Ayanokouji-kun. Am I just your puppet?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My puppet? What are you talking about?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun, you brought up the idea of surveillance cameras in the classrooms. Next, you took me to the special building and made me realize that there were no cameras. Then, you guided me to the idea of inventing false evidence, so that we could parse the truth from lies… When I look back on it now, that’s all I can think of.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re overthinking it. It’s just coincidence.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who are you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean, who am I? I’m just a guy who dislikes trouble, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI realized that I had gotten involved a little too much this time. I’d need to reflect on that. The always-sharp Horikita probably guessed my thoughts, to some extent.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had to dial it back a little. I just wanted my life here to be peaceful.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Someone who dislikes trouble. If that’s—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs Horikita started to speak, a male student walked towards us. This was not a conversation that we wanted overheard, so both Horikita and I fell silent. We waited for him to pass, but the guy stopped in front of us. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t on accident. He had black hair, styled so it was worn long. He appeared to be around the same height as me, maybe a little taller. I glanced at his profile and noted that he wore a wide grin. His smile looked ominous.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Setting up a camera? You really did something funny, huh?” The boy didn’t even turn to face us entirely as he spoke.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And you are?” Horikita asked the mystery student, seemingly perturbed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Next time, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI’ll\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ebe your opponent. I look forward to it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe boy walked on without answering Horikita’s question. We never got a clear look at him. We were only able to watch in silence as he walked away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well. I’ll be heading back now.” I had the feeling it would be better for us not to be seen together, and turned my back on Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait. We’re not done talking, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI’m\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e done talking.” I kept going without looking back.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You promised, right? You promised you’d help me reach Class A.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You sort of forced me to. You helped Sudou in this case, too. Right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not what I meant. I want to know what you’re thinking.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m thinking ‘This is annoying,’ and ‘I don’t have any motivation to do this.’ Stuff like that. That’s what I’m thinking. Even if you took back what you said just now, Horikita, I do intend to live my life quietly. Whether we aim for Class A or whatever, that’s it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d hoped that answer would satisfy her, but Horikita didn’t listen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you really hated drawing attention, you wouldn’t make all this effort to get involved. You say you’re someone who ‘dislikes trouble,’ after all. Yet you act all evasive and non-committal even while you help me. Why?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI assumed that this change in Horikita’s behavior was Chabashira-sensei’s doing. She was probably pulling the strings here. I wouldn’t be surprised if she knew about my past.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought that I should help the first friends I’ve ever made. Probably.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I kept talking, I might say something unnecessary. I\u0026#160;walked faster. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBy now, I had reached one absolute conclusion. If Horikita were truly aiming for Class A, it would be impossible under our present circumstances. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe’d received a declaration of war from some guy apparently known as Ryuuen. This could be just the start of a cunning, audacious, and brutal attack. He would probably stand in our way as a vigilant enemy in the future.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen there were Ichinose and Kanzaki from Class\u0026#160;B. They were two capable people who took only small, indirect steps. Ichinose probably had more plans lined up in her ambition to reach the top than I could imagine. It was impossible to fully understand how we’d landed in this situation, or her methods and process. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t understand what she wanted, but her goals would most likely prove a huge obstacle for us. In other words, it was fair to say that trying to reach Class A in three years was hopeless. Even if we tried to tackle this situation head-on, then…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI unintentionally let out a small noise.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI really was an idiot.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat was I getting worked up for? I had arbitrarily started analyzing Class D and considering the options. I didn’t want to. I mean, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eshe\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e was the one who chose this school, right? Horikita and Ichinose were aiming for the top, not me. All I wanted was an ordinary, regular life where nothing ever happened. Otherwise? I couldn’t do this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI knew more about me than anyone else. I knew just how defective, just how foolish I was. I was a horrible human being.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol2_INTERIORILLUSTRATIONS_16\" src=\"/hola-lector-agua/images/books/v2/OEBPS/Images/ClassroomElite-Vol2_INTERIORILLUSTRATIONS_16.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 7: Only One Solution\",\"volumeId\":\"v2\",\"chapterIndex\":13,\"prevChapter\":{\"volumeId\":\"v2\",\"chapter\":12,\"title\":\"Chapter 6: Truth and Lies\"},\"nextChapter\":{\"volumeId\":\"v2\",\"chapter\":14,\"title\":\"Epilogue: Postscript\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\
