 to talk to each other a little more here and there. Then, when Yousuke and Kei decided to break up, that’s when our relationship started to take off.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSome of the students had heard about the fact that Kei and Yousuke’s relationship ended in February of this year. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you two have been hanging out for a pretty long time then? It didn’t look like you’ve been talking on a regular basis.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We mostly chatted on our phones,” I explained.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is going to sound really nosy, but I’ve got to ask. Which one of you asked the other out?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt sounded like Haruka wanted to know more, as Airi’s protector and her spokesperson.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I asked her,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka paused at that. “Okay. I had thought maybe Airi would still have a chance if Karuizawa-san had been the one to ask you out, but wow, I never thought it would’ve been you who did… I guess that’s that, then.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe lightly slapped her forehead, and then proceeded to raise both of her arms up in the air in a gesture of giving up. Just as we neared the convenience store, Haruka spoke up once more, proposing that we stop.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, time-out for a sec. There’s just way too much information to process, and I feel like I’m losing track. Sorry, but can I swing through the store?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure. I’ll wait outside.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka gave me a brief apology for asking and quickly ran inside the convenience store, disappearing from my view. While she was inside, I took out my phone. It had vibrated in my pocket quite a few times as we were walking.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I’ll be waiting for you at Keyaki Mall after this. They’ve been asking me question after question—it’s so exhausting!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA message from my girlfriend and an invitation to come see her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Got it. I’ll contact you before I head over.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter I confirmed that my message had been read, I put my phone back in my pocket. After another short minute or so, Haruka returned with a croquette in hand.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was so busy talking with Airi during lunch today that I didn’t get to eat at all,” she explained.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That must’ve been a bother,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It wasn’t like it was a problem or anything, really…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not sure if this is the best time for me to ask you for something, but to tell you the truth, there is something I’d like your help with, and Airi’s too, if possible,” I\u0026#160;told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eOur\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e help?” repeated Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This hasn’t been officially announced yet, but we decided on one of our acts for the cultural festival.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoa, really?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Only me, Horikita, and the people involved in planning it know, so we could make sure that information doesn’t get out,” I explained. “We’re planning to host a maid café for the cultural festival.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“M…maid café? That’s, uh, kind of… Well, I’m not, like, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eshocked\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, but it is a little surprising. I can’t exactly picture Horikita-san approving that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think that she’s pretty neutral on everything, no matter what’s proposed to her. I think that she gave permission to go ahead with the idea because she simply thought that we could win this thing with the maid café idea. She wasn’t prejudiced against the concept.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. So…why are you talking to me about it then?” asked Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_2\" src=\"/hola-lector-agua/images/books/y2v5/OEBPS/Images/INTERIORIMAGES_2.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Truth is, after finding out about this project, it turns out that I’m going to be the one managing lots of aspects of it,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I said that, Haruka nodded as though she understood. “Still, considering the situation, I got to hand it to Horikita-san for entrusting you with this, Kiyopon,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was wondering if I could ask you to help staff it,” I\u0026#160;told her. “And Airi too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka listened to my request with a look on her face that I couldn’t quite describe. She didn’t exactly appear surprised. Well, I supposed that I could more or less guess what she was thinking, from the way she was talking.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If it hadn’t been for this whole thing with Karuizawa-san, I might have agreed to help right on the spot, even though I have some reservations about it,” she said. “I\u0026#160;really, really don’t like stuff like dressing up in cosplay in front of lots of people, but I don’t think I could have refused an offer if it was coming from a part of our close friend group. But…gosh, your timing couldn’t have been\u0026#160;worse.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI guessed that meant it was out of the question for me to make a request like this right now, on the very day her close friend suffered a broken heart from unrequited love. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s just well, the problem is I can’t really blame you for any of it, Kiyopon. I basically said as much earlier, but you’re free to date whoever. And I do understand that you have your reasons for not being able to say anything, I get that. Airi is free to have a crush on you, Kiyopon, and you’re free to reject her…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka clearly accepted it in theory, but her heart couldn’t accept it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t make any promises,” she said. “But I’ll try talking to Airi when things calm down a little.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You sure that’s okay?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She’s going to have to face reality sooner or later. And, well, I don’t know how you feel about everything, Kiyopon, but if Karuizawa-san is Airi’s rival in love, then Airi might not even have to give up. I mean, even if you’re devoted to her, Kiyopon, there’s still a chance she might break up with you, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I suppose you’re right,” I agreed. “I think there is a strong possibility that Kei could fall out of love with\u0026#160;me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If that time comes, then that just means Airi will get another chance. She doesn’t stand out at all right now, but she’s a diamond in the rough… And besides, your feelings may change too, Kiyopon.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was certainly true that if Airi put on one of those costumes and really gave it her all, she’d be just as good as those three other girls. Actually, no, if we took Airi’s physical features into account, then she might be without peer. Furthermore, although we weren’t talking about visitors who would be coming to our café, even the school officials might be shocked by Airi’s appearance. If\u0026#160;Airi did work at the maid café, talk would immediately circulate around the school, and it was conceivable that even visitors would hear about it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, sure, that’s true,” I said. “But I wonder if Airi’s feelings might change after what happened?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf the person you fell in love with already had a special someone, then it was natural that you’d go looking for your next love. I thought that by mentioning that I was only stating the obvious, but Haruka showed me the angriest look on her face that I had seen on her all day.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Listen. Don’t you think that you’re taking Airi’s feelings too lightly? I’ve been watching her for a long, long time, so I really understand how she feels. What she feels for you isn’t so casual that it would just change because of something like this happening, Kiyopon.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe strongly rejected what I’d said. That was wholly unexpected. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure that you’ll be going out on more dates and stuff with Karuizawa-san and stuff, but make sure you actually come hang out with us too, okay?” she said. “I\u0026#160;would hate for us to drift apart over something like this.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see,” I replied. “I understand. This group we have right now is a part of my life here at this school too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI figured it would be disadvantageous for me to lose the group because of an incident like this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka quickly finished her croquette and put her trash in her bag. “All right,” she said. “I feel a little better now. I’m gonna head back to school.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe didn’t say much about her plans, but it was clear that she was going to go see Airi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“See you tomorrow,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, see you tomorrow,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI watched Haruka’s back as she ran back the way we came. Then, I turned and changed course myself, heading not toward the dormitory but instead to Keyaki Mall.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e3.3\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE EXCITEMENT IN THE AIR\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e still hadn’t died down even after class that day. I returned to the dormitory from Keyaki Mall with Kei, the two of us chatting as we walked. When we reached the dorm lobby, we found Horikita sitting on the sofa, seemingly waiting for someone, and who she was waiting for would soon become clear. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe elevator was stopped on the first floor, above us. I pressed the button indicating that I wanted to head up. Once the doors opened, Kei and I got on, and so did Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun, may I have a word with you?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe elevator stopped on the fourth floor, where my room was located.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, later, Kiyotaka,” said Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei was the type who got easily jealous, but she was also very good at reading situations. Kei also knew that I didn’t even view Horikita as a member of the opposite sex to begin with, and since we just heard about an upcoming special exam, she probably didn’t have to give it much thought to determine that it would be better for her not to interfere.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay. I’ll talk to you later,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA year ago, I probably wouldn’t have believed that Kei and I would have become lovers and be spending time together like this. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI got off the elevator and Horikita followed suit. Kei stayed put, and when I turned around, I saw her smiling and waving to me from inside the elevator as the doors began to close. Soon, the doors were shut, and the elevator continued on to the upper floors.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How long have you been seeing her?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not sure, exactly. Who can say?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Rumor has it you started going out over spring vacation, but in truth, didn’t this relationship of yours start progressing much earlier in the year?” Horikita turned to me with a look in her eyes that made it seem like she was implying something.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhether or not there was any basis for what Horikita was saying, I was neither interested nor willing to touch on it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Enough about that,” I said. “You said you wanted to talk to me?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes… It’s about the special exam. There’s something I wanted to ask you about it. Is that okay?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure. I don’t mind.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Oh…okay.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s with that reaction?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s just, knowing you, I was expecting you to say no,” she said. “I was more prepared for that. You did look disgruntled when I had asked you to handle the maid café yesterday. Weren’t you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, Horikita was shocked by how readily I had accepted her request for a consultation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not here,” I told her. “Step into my room.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnyone could be listening if we stood around in the hallway, after all. I unlocked the door to my room, room 401, and we went inside.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re not going to ask me to help with something again, are you?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well… I’m not sure. In any case, if you’re willing to hear me out, we’ll just start there.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps Horikita was concerned that if she provoked me too much I would refuse her, because she decided to just start saying what she wanted to say. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To ensure we make it through this special exam, I was considering holding a semi-compulsory meeting of our own beforehand,” she said. “But even if we try to prepare for this special exam, it would be totally absurd for us to attempt to have the class come to a consensus on things when we don’t even know what the issues are going to be in the first place, wouldn’t it?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Depending on the situation, we will inevitably have to go with different options,” I agreed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if there were only two choices for an issue, such as for or against, it would be nothing short of reckless to decide on voting only one way before we even knew what the situations were.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve probably thought of your own way of making it through this special exam, haven’t you, Horikita?” I\u0026#160;asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think that the most efficient way to be certain we can pass this special exam is for someone to have the final say in decisions,” said Horikita. “No matter how many options there are, and no matter how the votes are split, we’ll have people promise to follow the leader’s judgment in advance and act in accordance with the leader’s wishes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was what Kushida had proposed during our lunch break. With that strategy, we wouldn’t consider whether or not any individual would be dissatisfied with the choices. It was certainly true that this arrangement would be the simplest possible solution if we could make it a reality.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I hope that we’re really able to bring everyone together that way,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, me too… There will definitely be some students who won’t be satisfied with some of the issues though… I\u0026#160;suppose if this was a dictatorship like Ryuuen’s class, then this whole discussion would go more quickly.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita and I wished that we had the type of coercive force to make students do what we wanted, but Ryuuen could exercise that force without mercy. Still, whether or not something like that would actually work in reality was another matter.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The fact that all voting is done anonymously means that students who are dissatisfied with Ryuuen can vote for the opposite opinion as him,” I pointed out. “There’s no guarantee that merely issuing an order will mean he can get things to pass.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If students are dissatisfied with Ryuuen’s methods, I suppose there’s nothing they can do but rebel against him,” Horikita agreed. “But it’s also a fact that there is nothing for them to gain by doing so. After all, if the vote is split and time runs out, the whole class will suffer for it, correct? In the end, I’m sure they’ll come together, even if Ryuuen leaves them be.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand what you’re trying to say, but you’re actually contradicting yourself by bringing this up,” I said. “No one wants to fail a special exam. In the end, people will definitely come to a consensus and vote accordingly. If that basic premise is true, then you don’t even need a strategy in the first place, do you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No student would want to let time run out to the detriment of the class,” I added. “But I think it’s still best that we don’t assume we can finish voting on all five issues if we leave things be. There’d be no reason for the school to even call this a special exam if that was the case.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes…you’re exactly right about that,” conceded Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All you can do right now is make up your mind to be flexible. For example, let’s say we’re faced with an issue where thirty-eight voted for, and one person voted against. What would you do?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I would do everything in my power to get that one person who voted against to change their vote, of course,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Right. But what if that one person who voted against absolutely, positively wouldn’t give in?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You may not necessarily always win by going with the thirty-eight in favor. While you’re trying to persuade that lone student, some of the thirty-eight students who voted in favor might even end up changing their opinions,” I added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if that one person’s ideas are detrimental to the majority of the class?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It all depends on the context, really.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wouldn’t be surprised if an issue like that was waiting for us: something that someone absolutely would not bend on.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Somehow, this feels a little bit unsettling,” Horikita said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How so?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because you gave me advice without any hesitation. I…didn’t imagine that it has anything to do with the fact that you’re dating Karuizawa-san now, but what’s your angle here?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What I told you could hardly even count as advice,” I said. “I’m sure that, in the back of your mind, you’ve already considered the possibility of something like that happening.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, you’re right… All right, then, I’ll come out and tell you about my main purpose for coming to talk to you. I have a proposal regarding tomorrow’s special exam. I could ask someone else to do this, but I wanted to ask someone who I knew would understand.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Meaning you want me to always pick a different option from you in the first round of voting?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Could you please not preempt my thoughts?” she snapped.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI moved a little further away from Horikita once I saw that she was irritated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s just that it was something I was already thinking of doing, in the event that no one suggested it,” I said. “I\u0026#160;didn’t imagine we’d have the same idea.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Really?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, the random excuse I came up with had worked, and Horikita was somewhat convinced. I could see that her anger had dissipated. Well, it was true that I had that idea already anyway, to do at least that much. I\u0026#160;guess the excuse I gave wasn’t totally bunk. It would be better to avoid the risk of making an unexpected choice as the result of biases caused by the heat of the moment.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we came to a unanimous decision through sheer coincidence, that would be a little scary. Even if it was an issue that 99 percent of the class was in favor of or against, or if it was in a situation where both options had advantages and disadvantages,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s true. If an issue passes as a result of an entirely random happenstance, we won’t be able to take it back. Still, planning to make use of that interval period every time isn’t necessarily a good idea. You should keep that in mind. There’s a risk that we might encounter an issue that we would’ve come to a unanimous decision on if we just stuck with the momentum we had from the start, only to find that things are split further when the time comes for discussion. We could end up not being able to reach a consensus. You have to factor that into your calculations.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, you’re right. You’re absolutely right,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTo delve into the argument was to plunge your hand into the deep. And if you drew an unexpected darkness out as a result, it could end up costing us a lot of time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Under the rules of this special exam, there’s no way to determine with certainty who voted for what, no matter how much we discuss it,” I went on. “Even if people make pledges, it might not be 100 percent true.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re saying that people will lie to me?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Depending on the situation, sure,” I replied. “It’s tough to say right now that the class is really united as one.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that I said that, I was sure several people came to Horikita’s mind.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re referring to Kushida-san and Kouenji-kun, right?” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kushida would probably lie without batting an eyelash, but as for Kouenji, there’s a chance that he might deliberately choose something different than his classmates. His contrarian nature could rear its head. That’s what I mean.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey…why are you telling me all of this in such detail? It really is strange. You’ve never given me advice quite like this before.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita was naturally, intuitively sensing that there was a change in me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because I judged that as you are now, Horikita, you would be able to genuinely listen to what I had to say. You\u0026#160;also have the kind of adaptability to understand it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can I…take that to be a compliment?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In a manner of speaking, sure.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah… This is kind of unsett—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust then, I briefly heard the sound of a cell phone vibrating.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Excuse me for a minute,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, Horikita took out her phone, and our conversation was put on hold. She stared down at the screen and began tapping on it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let me send her a message,” she said. “There’s a chance I might not see that she’s read it for a while if I’m careless about it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t have any intention of stopping Horikita, of course, but who did she mean by “she”? I couldn’t help but wonder about that. Though I was a little curious, I decided to just wait quietly until Horikita finished composing her rather long message. She took about two minutes to do it, but eventually, she sent her message and put her phone away in her pocket.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At any rate, I’ve said what I’ve wanted to say to you,” she told me. “I’ll be counting on you during tomorrow’s special exam.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe must not have intended to stay very long in the first place because she immediately left my room after that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e3.4\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT WAS A LITTLE BEFORE\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e six o’clock in the evening—the time when the sun would soon set and night would fall. Though today was supposed to have been an ordinary day, a special exam was announced to us. It ended up being a very trying day with an unusually large amount of information I needed to process. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt would have been much easier if I could just let things be and wait for the day to come to an end, but that wasn’t going to happen. The Unanimous Special Exam, which had been announced to us on rather short notice, was being held tomorrow.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey there.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYousuke was the first to show up as I waited in my room.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on in,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThinking about it, this was the first time I had invited Yousuke to come into my room like this, wasn’t it?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hello~!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShortly afterward, Kei arrived as well.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know, it’s kind of unusual, but it’s interesting, isn’t it?” she said. “The three of us getting together like this.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You might be right about that,” I agreed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI hadn’t told them the reason why I asked them both to come here, but I figured that Yousuke might have already guessed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought we should come up with some countermeasures for the special exam tomorrow,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Countermeasures?” echoed Kei. “But it’s just an exam where we just have to come to a unanimous decision on stuff, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“From what we’ve heard, I certainly don’t think it’ll be that difficult of an exam,” replied Yousuke. “The special exams we’ve had in the past have been much more difficult, in terms of their rules.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYousuke gestured as though he were giving the matter some thought. Then, he continued speaking, explaining the situation to Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, I think that maybe this one won’t exactly be that straightforward either, like those difficult special exams we’ve had in the past. If you think about it, if we were following along with the rules, then this would be an exam where we’d gain Class Points simply by coming to a unanimous decision. Our class coming to a consensus in itself isn’t \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e difficult.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I think so too,” Kei said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, in other words, if this exam isn’t going to be that easy, that means it’s highly likely that there are going to be issues that people will be divided on,” Yousuke concluded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHis thinking was right on the mark. Although individual students in class might have their own ways of thinking, they would be willing to be flexible to a certain extent to align their votes if it was in the best interest of the class. It might have been a different story if this exam occurred back when we were first-year students and new at this school, but now that we were second-years, the bonds between us as friends had deepened considerably. Moreover, even if we couldn’t reach a unanimous decision at first, there wasn’t a penalty for that. We could repeatedly set aside time for discussion and work things out. So, it was understandable that an exam like this, with such relief measures in place, would seem lax from Kei’s perspective.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But, like, what kinds of issues would it be difficult for us to reach a unanimous decision on anyway?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I can’t really come up with anything right on the spot,” Yousuke replied, “but…I think there would definitely be those kinds of issues…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat kinds of questions would my classmates agonize over? It seemed like Yousuke wasn’t able to come up with any ideas right away. I thought I’d speak up with one easy-to-understand issue.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Until we graduate, we can only eat either rice or bread starting now. Choose,” I told them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? What’s with those choices?” said Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Choosing between rice and bread is something that kind of makes me want to chuckle at its simplicity, but it’s actually a hard choice,” said Yousuke.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d definitely go with bread, myself\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e” Kei decided. “Going without having \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eany\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e kind of bread until graduation? Absolutely not, no way.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In my case, I’d probably go with rice… I’ve been fine having bread like once a week or so, anyway,” said Yousuke.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I had to choose, I suppose I’d pick rice too,” I said. “And, well, as you can see, we three have our own opinions on this, right? If we were to have the entire class vote on this, it wouldn’t be easy. If there were thirty people who were in favor of rice, would you be able to go along with\u0026#160;them?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No way! I mean, not being able to have any at all until graduation? I’d still vote for bread,” said Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were going to be some students who would resist, like Kei, who wouldn’t be easily swayed by the majority and wouldn’t back down. That would lead to problems.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now, if we were to consider a more realistic comparison, relatively speaking: all future special exams will either be based solely on academic ability or physical ability. What if we faced an issue like that?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I posed that problem, Yousuke and Kei exchanged looks.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For an athletic student like Sudou, he would absolutely choose physical ability,” I went on. “But a student who wasn’t so athletically gifted, like Keisei, would have to do anything and everything he could to steer the vote toward a unanimous decision in favor of academic ability.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, it was possible that Sudou could back down and vote the other way, especially since he had been pouring a lot of effort into his studies lately. Even so, he would do much better if he were evaluated based on his physical abilities. And even if Sudou could be swayed, a different student who wasn’t academically inclined at all wouldn’t be able to compromise on the decision at all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If an issue is passed unanimously, that means it’s enforced, correct?” I said. “Meaning, in other words, depending on how the situation plays out, would we need to be prepared to lose 300 Class Points as a penalty if we can’t choose an option?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know… Difficult choices will obviously have to be made, but losing 300 Class Points would mean giving up our ticket to Class A,” said Yousuke. “Our first priority should be clearing this exam.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei sighed, “I’m starting to think that this is going to be really tough…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that why you called us here?” asked Yousuke.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah,” I replied. “This next special exam is going to require a strong sense of unity amongst our classmates. The class breaking into complete disagreement once or twice is fine, but if it goes on for a long time, fights could start to break out. When that time comes, you two will be needed to conduct yourselves skillfully and sway the votes. You are the central figures of the class.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re right,” said Yousuke. “But in that case, shouldn’t Horikita-san be included in this discussion we’re having now too? She took on the role of class leader for this exam, after all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYousuke’s point was obvious. It \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewould\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e be best if Horikita led these two and controlled the class instead of me taking the initiative here. However, at this stage, I couldn’t withdraw my support quite yet.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This time, we will be supporting Horikita from the shadows,” I told them. “What we’re discussing here is strictly confidential.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why, though?” asked Kei. “I mean, personally, I don’t like the idea of following Horikita-san’s orders anyway…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kei, Yousuke, you two have the ability to read the room much better than the average student. However, starting now, I want you two to be able to respond to things with even more flexibility than you do now. If you can intuitively sense what Horikita is thinking and what she wants to do, the class will become much, much stronger.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why don’t you do it though, Kiyotaka? That would solve the problem,” said Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can’t always count on me to be able to act,” I said. “You should be prepared for unforeseen situations.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unforeseen situations?” she repeated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I could suddenly fall ill, or I could unexpectedly get expelled. That’s conceivable, isn’t it?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s… Well, I… Well, expulsion, like, no way! I can’t picture that happening,” she replied. “But it is true you could suddenly get sick, that might happen.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t back them up at any given time forever. If they couldn’t act in anticipation of situations like that, they couldn’t expect to see the class make a great leap forward.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, I understand,” Yousuke said. “We just need to follow Horikita’s lead well and make sure that the special exam proceeds smoothly, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Right. Kei, Yousuke, let me give you some instructions and some signals in advance—things that no one other than you two will understand.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince we were allowed to freely discuss and move about during the interval periods, the act of whispering into someone’s ear wouldn’t be problematic in itself. However, depending on how the situation played out, it might become necessary to send instructions to Kei and Yousuke without letting anyone else know that we were communicating. Even in situations where whispering amongst ourselves was prohibited, it was still possible to exchange signals, like by coughing, lightly tapping on our desks, and so on. I had both Kei and Yousuke generally memorize multiple patterns of signs and signals. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen, I looked over at Yousuke.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yousuke, one last thing, a warning. This won’t be necessary if we manage to get through all five issues smoothly, but if we have fewer than two hours remaining, and it doesn’t look like we’ll be able to finish the special exam in time, desperate measures may need to be taken.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI decided to tell Yousuke that now so he could prepare himself. So he wouldn’t go out of control if that time came.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e3.5\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE DAY BEFORE\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the special exam had been quite hectic in a lot of ways and it was just about to come to an end. It was now after ten o’clock at night. I was in bed looking at my phone when I received a call. Although I didn’t have the caller registered in my contacts, I recognized the eleven-digit number.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hello,” I said, answering the phone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I sincerely apologize for calling you so late at night. Might I have a moment of your time?”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s all right,” I replied. “It certainly has been quite some time since we last spoke, Chairman Sakayanagi, sir.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat’s right—the phone number belonged to none other than the current chairman of the Advanced Nurturing High School.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I realize that I have made you worry quite a bit, but I’m all right now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m just glad that you seem to be well.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“It seems that things have been quite trying for you as well. But I must admit, I cannot hide my surprise that you managed to remain safe and sound here at this school without incident. You were in the midst of an extremely disadvantageous battle.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Only through happenstance, really,” I said. “I’m sure that if \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehe\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e were serious about it, I wouldn’t be here right now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t necessary for me to mention any names out loud. I knew that Chairman Sakayanagi understood that I was referring to Tsukishiro, who had filled in for his position while he was away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Once I saw that everything was over, I certainly had a few questions of my own about his actions…but let’s not talk about that today. I’m going to support you closely from now on. I thought I’d let you know about it as soon as I possibly could.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter a pause, he continued speaking.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I’m sure you’ve heard about the upcoming cultural festival, which is a first for our institution. And yes, government officials and their families have been invited to attend. Now that things have been set in motion, I can’t stop it myself.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf the parties involved have already been notified, then it would understandably be difficult for him to withdraw invitations now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s nothing for you to apologize for, sir. I’m sure that the students are looking forward to it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough the nature of the festival was a bit like a special exam, it was within the range of things a student could enjoy. Whether it actually ended up being nothing more than a simple cultural festival for \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eme\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, though, was another story.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“On that note… I would like to tell you about something that hasn’t been announced yet. I would like to share this information with you first, and you alone.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What is it?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“It’s about the sports festival to be held in October, which is something of a prelude to the cultural festival. The sports festival is similar to the cultural festival in some respects. First of all, it has suddenly been decided that we will be welcoming some visitors on campus.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Visitors?” That was something I hadn’t expected to hear.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“If you trace the history of the event back to its origins, you’ll find that sports festivals are something that students’ parents come to watch. In that sense, the idea of welcoming guests is not in itself dissimilar to that original concept of the event…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see.” It was true that when I saw them on TV, there were families with cameras and packed lunches at events like athletic meets and sports festivals.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Suddenly allowing guests to freely come visit for the cultural festival poses some security concerns because it is a rather unprecedented event.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn a sense, it would be kind of like a test for the school. They were preparing to welcome a larger number of guests in full force later on.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Guest selection rests entirely on the higher-ups, so I can’t deny the possibility that Ayan—I mean, that your father might make an appearance. Therefore, in consideration of the danger you face in this, I would like to assign a few people to watch over you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I sincerely appreciate the sentiment, but I’m nothing more than a student at this school, the same as any other,” I told him. “I don’t want that kind of special treatment.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“In that case, how do you plan to handle the situation should you run into anyone sent by your father?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand that it’s a difficult problem.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eObviously, it was unlikely I’d be able to get through such a situation using force. That went without saying. It would be easier for me if he tried to target me in a secluded area. If he sent people to the campus posing as school officials and they instructed me to come along with them while I had friends and acquaintances around, I would have no way of refusing. I couldn’t even ask questions like, “You’re all a bunch of frauds, aren’t you? Agents sent by him?” or anything.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I think that I already understood that you are that sort of person, I suppose. But if you were to be expelled from school in some way… I’m sure that I would regret it. I would like to avoid feeling regret over not doing whatever I could have done to prevent something like that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if I were to follow your instructions, sir, it would look unnatural to have a guard watching over me,” I pointed out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“In that case, I would like to ask you to be absent from the sports festival.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You want me…to not participate?” That certainly hadn’t been within my range of expectations.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I’m sure you yourself understand that sometimes, with events such as these, people fall ill and have to be absent on the day of the exam.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. Although the class would be put at a disadvantage with me gone, there aren’t any mandatory attendance rules that would result in me getting expelled for being absent.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStudents were responsible for maintaining their own health, but even so, it was inevitable that people would fall ill sometimes. If it were a small-scale special exam, the school might adopt emergency measures like waiting until all students from each grade were present before going ahead. But for a school-wide event like the sports festival, that wouldn’t be possible.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“We will have you confined to your room with everyone operating under the assumption you already underwent a medical check-up. Then, I can go ahead and place a trusted observer outside the dormitory to keep watch.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I were ordered to rest in my room and be absent due to illness, my classmates would have to agree that I had no other choice. If there was someone loitering around the dormitory building and standing watch, other students would only see that person as just another security guard. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That might very well keep me out of his reach, if we did that,” I conceded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“There are other risks, of course. As you said earlier, there’s no avoiding the fact that the other children enrolled in your same class will be put at a disadvantage. They’d have to face the challenges while one of their fellow classmates is absent.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe fact that Chancellor Sakayanagi was offering to allow me to be absent by faking illness made it clear how generous and kind his support was. It was also gratifying to see that he wanted to keep things low-key, without showing me any excessive favoritism. Still, although it was a very kind offer, my first thought when I heard his proposal was that I would refuse. However, another idea was coming to mind.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Would you please give me some time to consider?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Of course. I cannot force you, after all, so I will leave the final decision to you. However—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand. I am seriously considering accepting the idea of being absent.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“All right. Please give me a response one week before the sports festival. There are preparations I need to make on my end, as well.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe needed to arrange personnel and such for this plan, so that length of time was quite practical. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter I ended the call, I thought about the sports festival and how it might end up going on without me. Of course, it was entirely possible that students from other classes and in other grade levels could call in sick on that day too. It wasn’t easy to get the entire student body together for every single exam and event, after all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No,” I muttered aloud to myself, “I need to concentrate on the special exam in front of me first.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis upcoming special exam… It could very well be more painful than any other special exam that had come before. One way or another, we were able to prepare for every other special exam we faced so far. But this time, there was no surefire strategy. We had to believe in our classmates and work together as one. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd after that, a sports festival, and a cultural festival. Though there were new things to worry about this year that we didn’t have to deal with last year, before everything else, we simply had to get through tomorrow’s special exam.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e3.6\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eS\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eEVERAL HOURS PRIOR.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hello, Kushida-senpai.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter class ended for the day, Kushida visited Yagami Takuya in the first-year dormitory. The evening sun was shining faintly through a slight gap in the almost fully closed curtains. Kushida gazed at the steam rising from the freshly brewed tea sitting on the table. She didn’t reach for it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t poison it or slip any drugs into it, you know,” said Yagami.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t care about the tea,” replied Kushida, making no attempt to hide her irritation. She pulled out her cell phone and held it out with a grim look on her face. “Can we please just hurry up and get on with it already?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, please excuse my rudeness,” Yagami said. “Very well then, let’s have a listen.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYagami pressed the play button on Kushida’s phone. From her device, he heard Chabashira’s voice providing a summary of the Unanimous Special Exam that had been announced to the second-year students. The recording seemed to start somewhere in the middle of her explanation. After silently listening to everything that was on the recording, including the example issues that were given to Kushida’s class, Yagami returned Kushida’s phone to her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You wish to crush Horikita Suzune and Ayanokouji Kiyotaka, Kushida-senpai. That’s what this is supposed to be about, right?” asked Yagami.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida, as if to say that she didn’t even need to answer that, remained silent.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was briefed about this special exam by some upperclassmen beforehand, but I have to say, it certainly is an exceedingly straightforward exam,” he went on. “You simply choose an option from the multiple choices available and repeat the voting process over and over again until you reach a unanimous decision. There are five issues in total, and you have five hours to get through them all. What were your thoughts when you heard about it?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That it’s simple,” said Kushida, after a pause.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, certainly,” Yagami agreed. “For something that is being billed as a special exam, it is extremely elementary. However, the punishment for running out of time is quite severe. No doubt that must be because the school created this exam on the assumption that it would be passed. You have to take into consideration the fact that a class would inevitably move toward a unanimous decision once time is close to running out. Anyone would want to avoid a heavy penalty, after all, even if it meant voting for an option that they didn’t like.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYagami reached for the steaming cup of tea that sat in front of Kushida, taking it into his hands.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now then, onto the heart of the matter,” he said. “You are already in the middle of your second year. However, while you do want those two expelled, you still haven’t had the perfect opportunity fall into your lap yet.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As far as I’m concerned, you’re a little bit responsible for that yourself\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e” snapped Kushida. “But whatever, it doesn’t matter.” She held herself back from going further, understanding that there wasn’t anything to be gained by lashing out at Yagami right here and now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Have you told Horikita-senpai?” asked Yagami.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh… You mean about being the leader? Yes, more or less. I think she would’ve gone ahead and done it on her own anyway, though, even if I didn’t say anything.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, no, it isn’t good to leave things in a state of ambiguity. It is important for you to make sure that Horikita-senpai is entrusted with the role and to get her to make a firm declaration that she would handle it, Kushida-senpai.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what now? Do you think I can get her expelled in this upcoming special exam?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt that question, Yagami let out a little chuckle before taking a sip of tea from his cup.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, certainly,” he said. “I listened to your recording to make sure that there was nothing I missed hearing or misinterpreted, just in case. After hearing what you’ve provided, things have been made clear. It is…quite possible that you could do that in this upcoming special exam.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…How could you possibly know that?” Kushida snorted. “The only instance where expulsion is given as a penalty is if someone runs over time. Do you think that Horikita would make a mistake like that? No, not just Horikita; \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eno one\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e would make that kind of mistake.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Certainly not. It’s unlikely anyone would be stupid enough to allow themselves to run over time and be expelled for it. But from what I can tell, I think that there are other ways someone could be expelled.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida blinked. “Huh?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Expel Horikita-senpai, or, depending on the situation, expel Ayanokouji-senpai. There might be a possibility that you can crush the people you wish to crush. When that time comes, you shouldn’t hesitate to guide the conversation toward targeting both of them.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYagami then proceeded to elaborate on what he meant by using an example: an issue that was expected to be given in this upcoming special exam.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that really true…?” asked Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I don’t think it’ll necessarily be exactly the same, not word for word,” Yagami said. “However. I do think there is a significant possibility that there will be an issue on the exam like the one I just told you about.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYagami hadn’t actually been told about this special exam by Tsukishiro, but after listening to the teacher’s expla
