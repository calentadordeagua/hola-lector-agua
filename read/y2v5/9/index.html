],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T240f7,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 3:\u003cbr/\u003eTwo Teachers and A Fated Special Exam\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE NEXT MORNING\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I was assigned to be the manager (?) of the maid café. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut then, when we saw Chabashira’s grim expression as she strode into our classroom, many students immediately noticed that something was off. However, this time, unlike the usual for situations like this, the words “special exam” weren’t the first to spring to mind for most of us. That was because they probably assumed the next exam would be the sports festival itself. Furthermore, the cultural festival was coming up right after that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Before the sports festival in October, you’ll be taking a new special exam,” announced Chabashira.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer statement caused a bit of an uproar amongst the students. There hadn’t been any special exams around this time last year, not while we were getting ready for the sports festival. But it sounded like this year was going to be different.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh, come on, are you kidding me?” Ike groaned. “We \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ejust\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e got through that brutal uninhabited island exam, and now we have to take another one…?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough it had already become customary for him to complain about these things, I heard Ike mutter discontented grumblings before anyone else did. I supposed that for Ike, a new special exam was a grim prospect. He had just managed to overcome the uninhabited island when his back was against the wall and expulsion seemed imminent. On top of that, he had just officially become Shinohara Satsuki’s boyfriend as well. No matter how much Ike and Shinohara deepened their relationship and grew closer, suddenly finding themselves expelled from school now was most certainly possible, depending on the type of special exam. There was no doubt that students with particularly low levels of overall ability felt a sense of urgency.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, bring it on.” Sudou, who had absolute confidence in his athletic prowess, smacked his fists together. “I say we clear this special exam quickly before we completely dominate the sports festival.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t get carried away,” snapped Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Sorry.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita’s immediate warning made Sudou feel a little dejected. He went silent. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWhat a wonderful master-slave relationship they’ve… Er, well, I suppose I could say that they’re nurturing a friendship.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I’m being honest here, there have been very few instances of special exams being given at this time of year in the past,” Chabashira told us. “In fact, a special exam will not be held for the first-year and third-year students.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSatou had been leaning against the back of her chair before, but now she pitched forward. “You mean that our grade is the only one getting a special exam before the sports festival?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira didn’t deny it at all. She simply nodded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because you second-years have been so exceptional, the school is giving you an appropriate level of recognition for your worth,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?” said Satou. “Wait, a special exam because they recognize our worth…? Isn’t that a little strange?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It is certainly true that special exams come with a level of risk you ought to be wary of\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e” said Chabashira. “Class Points or Private Points could be lost. Some students could even be expelled from school. However, on the other hand, it could be said that these give you even more opportunities to lead a more fulfilling life here at school. The more special exams that are held, the better your chances are for being promoted to Class A. And that is considered to be the most important thing of all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was true that if you wanted to earn a large number of Class Points, it was extremely difficult to do so through ordinary, everyday activities. If anything, the periods of time when there weren’t any special exams were largely about keeping our Class Points from falling any lower. Whether it was the uninhabited island special exam or any other, opportunities to move up to higher-level classes only came when a special exam was being\u0026#160;held. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Happiness and unhappiness are two sides of the same coin. So, there are benefits to those risks, right?” said Horikita, having calmly accepted the news and taken a position close to Chabashira’s.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Exactly,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That being the case, there’s nothing for us to fear,” Horikita declared. “We are most definitely closing in on Class A now. There’s a chance we can break out of the three-way tie between B, C, and D. This just means that our chance is already here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe more opportunities we had, the better. That was the commonly held belief for everyone aiming for the top.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s true, you’re right about that… And it’s not like complaining about it will make special exams go away or anything,” replied Satou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita’s words seemed to have convinced even Satou and our other lower-level classmates, judging from their expressions. Though you could say it was still a work in progress, Horikita’s growth as a pillar of support seemed to be having a clear, positive effect on her classmates. I\u0026#160;suspected that Chabashira was probably inwardly pleased by this as well, even if she didn’t let it show on her face at all. She wasn’t the sort of teacher to show her sweet side in the first place, but lately, I felt like it was coming through a bit more than usual.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You will be taking what is referred to as the ‘Unanimous Special Exam’ this time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe monitor lit up and Chabashira began explaining the exam. It was accompanied with various visual aids that had become customary at this point.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This special exam is exceedingly simple. Hence, I will be accepting questions at any time if there is anything you are curious about. This exam will be administered tomorrow, and as you can probably surmise from the name, it consists of a series of multiple-choice questions which you will answer repeatedly until the entire class comes to a unanimous decision.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tomorrow?” repeated Horikita. “That’s…rather sudden.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe certainly weren’t being provided with adequate prep time for this. Of course, there weren’t any advantages or disadvantages because it was essentially a fair contest, but our class that had just settled down was now beginning to stir once again.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As I just said, this special exam is simple,” Chabashira replied. “The school believes that there will not be any problems in going ahead with the exam tomorrow. There isn’t a need to spend time discussing things in advance.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe would vote over and over again in class until we came to a unanimous decision. Just from hearing about that part alone, I certainly couldn’t see anything particularly complex about this exam. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That means we’re not fighting against another class this time then, right?” asked Yousuke, immediately hoping for an answer on that point, considering it more important than anything else.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right,” said Chabashira. “Since this special exam only takes place within your class, you will not be competing against any rivals. On the day of the exam, the school will give you five ‘issues’ to complete. These issues are the same for all classes, with no differences between them.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf the issues were different, that would mean the difficulty level would be different from class to class. I\u0026#160;supposed that made sense.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This might seem sudden, but I’m going to jump right into it. I will provide you with an example to help you understand.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em; text-transform: uppercase;\"\u003eEXAMPLE ISSUE:\u003c/span\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003e Lose 5 Class Points, but all classmates gain 10,000 Private Points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: normal; font-size: 0.80em;\"\u003eCHOICES:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e For, Against\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe sample issue was shown on the monitor. Just like Chabashira had said, it was simple and easy to understand.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm? Wait, what’s this?” said Shinohara. “Um… We’d go down by five Class Points, but in exchange, we can get 10,000 Private Points… This is an issue? Would that be a gain or a loss?” She counted on her fingers, trying to calculate the actual gains and losses in her head.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t surprising that many unexpected questions would come to mind for people. Still, even though this was only an example, I had expected there to have been more choices to agonize over. We earned 100 Private Points each month for every Class Point. That meant that five Class Points were worth 500 Private Points. If you thought about the issue presented to us, the latter option was worth more in terms of Private Points, and by an overwhelming amount. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Class Points would continue to hold value. In one month, five Class Points was worth nothing more than 500 Private Points. However, if you calculated their worth over a longer time span, like say, over a year, then those mere five Class Points would be worth 6,000 Private Points. Considering the time we had remaining until graduation, we had eighteen opportunities left to receive Private Points, meaning from October of our second year to the March of our third year. In other words, we could consider the value of those Class Points to be worth 9,000 Private Points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut things weren’t actually so simple. Supposing the loss of five Class Points here in this exam carried through, and in the end we missed on reaching Class A by that same margin, we would look back on this decision as\u0026#160;the worst possible choice we could have made. Of course, the\u0026#160;probability that five points would make all the difference between winning and losing probably wasn’t that high. In that case, it was quite possible that there could be cases in which it’d be more beneficial for us to gain the 10,000 Private Points. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhichever point of view we took, there were advantages and disadvantages in the end.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All thirty-nine of you will vote anonymously on each issue presented, choosing from the options presented to\u0026#160;you,” Chabashira explained. “You’ll probably understand how this works the quickest by simply trying it for yourself, so let’s do just that right now. I’m sure that many of you have quite a lot of questions, but I’d like you to try and enter your votes without any time for discussion. Please enter your vote, for or against, on your tablets.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter Chabashira tapped some things on the device in hand, all of the students’ tablets’ screens, mine included, now displayed something new. Our tablets displayed the issue, and we could either select \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e or \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e on the\u0026#160;screen. This truly was an unusual special exam unlike any we’d seen before. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI decided to consider this issue seriously for a moment.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePrivate Points had no direct effect on our Class Points. The fact that all of our classmates would get 10,000 Private Points by voting in favor was a simple benefit. And, by voting in favor, we were losing only five Class Points. But still, five Class Points was five Class Points. In that case, I supposed I needed to consider how someone would think about this, in terms of human nature. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t a question of whether gaining 10,000 Private Points or not losing five Class Points was the better option. The real question was actually the opposite: could we make either of these choices without regretting it later? I decided to press \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, which was likely going to be the less popular option, to see what the results would be. I figured it wasn’t the best idea to be unanimous the first time around. The tallying must have been complete shortly afterward because Chabashira looked up from the tablet in her hands.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right. Now that you’ve all finished voting, I’d like to go ahead and show you the results immediately.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd with that, the tally was displayed up on the monitor.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eRound 1 Voting Results:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e For: 3 Votes, Against: 36 Votes\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI knew that there would be more votes against, but it was an even wider margin than I had expected.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-hey, um? Wouldn’t we get more going with the 10,000 Private Points than we’d get from five Class Points?” said Ike, puzzled. He looked around at his classmates. “We’d only get a few Private Points from those, right? Or did I mess up my math? Why’d so many people vote against?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJudging from that comment, I could assume that Ike had also voted in favor.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we’re only talking about the number of Private Points we’re getting, then yes, it’s true that we’d get more Private Points by going with the 10,000 option,” said Horikita. “But Class Points are essential if we’re going to aim for Class A. If it’s only a difference of a thousand points, then why would we deliberately reduce our precious Class Points? There’d be no need to do that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe must have voted against, and she offered a theoretical explanation for her choice.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In the unlikely event that those five Class Points end up spelling the difference between winning and losing, then I certainly couldn’t help but regret our choice if we gave them up,” she added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as I thought, many students were naturally worried about the risks in the unlikely event something happened. I also couldn’t forget that the other three classes were also going to be voting on these same issues. If the other three classes voted unanimously to keep the Class Points and we didn’t, then that meant this class would be the only one falling a step behind. I supposed it would be a different story if we could make effective use of the 10,000 Private Points gained, though.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure that you all have your own thoughts on how this went, but please, listen,” Chabashira told us. “We will be doing the vote over again because while there were overwhelmingly more votes opposed, the result was not unanimous. In the actual special exam, there will be a fixed ten-minute interval before the next vote. During that time, you are allowed to converse freely, and at times, you could even be permitted to get up from your seats and exchange opinions. But for the time being, we’re going to skip that part. Let’s commence the voting once again.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe purpose of the test was to come to a unanimous decision. If we didn’t reach one, then the results of the vote would be invalidated, and there would be a mandatory ten-minute interval before the next vote. Even if we came to a consensus quickly, that would still be a significant amount of lost time. It was safe to assume that there was probably some kind of time limit somewhere, considering the structure of this special exam. It was possible we could run out of time if we continuously failed to reach a unanimous decision…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, for our second vote, what we should do is vote \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e without thinking too deeply on the issue. If we voted that way, we could steer things toward unanimity. That was precisely why I decided to vote \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e again this time, for the second vote. I thought that by doing so, my classmates would gain a better understanding of this special exam.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eRound 2 Voting Results:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e For: 2 Votes, Against: 37 Votes\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-hey, what?” shouted Sudou. “Some of you seriously voted \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e even after what we just talked about?!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry,” said Horikita. “I’m one of the people who voted \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, Sudou-kun. I deliberately chose to avoid letting it get to a unanimous decision. Apparently, there was someone else here who had the same idea I did… Hm.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough she didn’t turn to look at me, she might have been referring to me when she said that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And here we have the results of the second round of voting,” Chabashira said. “Almost everyone voted \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, but there were still two votes \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. In this instance, there would normally be another ten-minute interval before voting resumed. This exam is designed so that voting periods and break intervals are repeated over and over until you finally reach a unanimous decision, either with thirty-nine votes \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e or thirty-nine votes \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. Of course, whatever choice you make in these issues will actually be passed. In this particular case, if there were thirty-nine votes \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, you would all receive 10,000 Private Points, but you would lose five Class Points. Conversely, if all thirty-nine of you voted \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, then the issue would be rendered null and void. Nothing would happen.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMeaning, in other words, that no one would gain or lose any points, and this issue would be over.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Although you didn’t reach a unanimous decision, in the interest of saving time, I’m going to have you move onto the next example issue.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em; text-transform: uppercase;\"\u003eEXAMPLE ISSUE:\u003c/span\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003e Grant 1 million Private Points to one person in class. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e(If the vote is unanimously in favor of the issue, a student will be selected to receive the points, and another vote will be held on that issue.) \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eCHOICES:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e For, Against \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure you must have some thoughts about this example, but during the actual exam, you will be forbidden from whispering amongst yourselves before the first round of voting,” explained Chabashira. “Meaning that, first, you must genuinely tackle this issue head-on and vote.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo it wasn’t until the second round of voting that we’d be able to discuss what we thought about the issue after reading it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eRound 1 Voting Results:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e For: 39 Votes, Against: 0 Votes\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe results were displayed on the screen. It was an obvious outcome. Even if only one person out of thirty-nine would be receiving those Private Points, there was virtually no reason to choose the latter option. Even if you were disappointed that you didn’t receive anything yourself, it’d be difficult to get the class to vote unanimously against it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re presented with an issue like this in the actual exam where a specific individual will need to be selected, the first step would be to reach a unanimous decision either \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e or \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, like you did just now in this example issue. If you voted \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, then the issue would be considered closed at that point. But if you voted unanimously \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, the issue proceeds to the next step. During the break interval, you can discuss who you would like to recommend. The names of everyone in your class, yourself excluded, will be displayed on your respective tablets.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe information displayed on our tablet screens had changed on their own, and sure enough, everyone’s names except my own were listed. However, the names weren’t listed in alphabetical order. They were listed irregularly with no rhyme or reason, not even with separation by gender.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira offered additional insight on this. “To ensure complete anonymity in voting, the positions of students’ names are changed each time there is a vote. This is also the case for options such as \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e and \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, which are also randomly switched. The reason for this is to prevent students from spying on their neighbors and guessing how they voted based on the position of their fingers.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was telling us we would absolutely not be able to guess how other students voted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Once discussion is underway, you may each vote at whatever time of your choosing,” she went on. “Simply tap on the name of the student you wish to recommend. During that period of time, you’re allowed to change your vote for another student as many times as you like by just tapping on the screen again. At the end of that ten-minute period, the majority… Well, in the case of this class, the student that has twenty votes will be designated. Let’s say, for the sake of argument, that Ike had the most nominations and was selected.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh, me?! Yeah, dude!” he exclaimed happily.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now, Ike will temporarily lose the ability to vote, and the other thirty-eight of you will vote on the issue,” Chabashira explained.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTo select a student, a simple majority was enough to pass to the next stage. I guessed that was how the whole nomination process worked. At any rate, the issue proceeded to the next step and a new round of voting had begun. We cast our votes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em; text-transform: uppercase;\"\u003eEXAMPLE ISSUE:\u003c/span\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003e Grant 1 million Private Points to Ike Kanji. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eCHOICES:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e For, Against \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eRound 2 Voting Results:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e For: 0 Votes, Against: 38 Votes\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Say whaaaa?! H-hey, why’d nobody vote for me?!” Ike exclaimed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, ’cause ain’t no way anybody would give you a million points,” said Sudou. That was what the entire class was probably thinking. “Just common sense, dude.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now, because everyone had voted against Ike in this particular issue and came to a unanimous decision, that would mean Ike would not be granted those points,” Chabashira said. “Which, therefore, would mean those one million points would be left up in the air, and Ike would be removed from the list of candidates. The vote then would continue with the remaining thirty-eight students. However, please note that if you are unable to reach a final unanimous decision before the time limit, you fail, and the one million points wouldn’t be awarded to anyone.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?!” said Ike. “Wait, so that means my chances of getting anything would just go down to zero?!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s exactly what it means. However, your name wouldn’t have been crossed off the list if just one student had voted in favor of you. Also, please note that self-nominations are accepted. If a student steps forward as a candidate during the discussion interval, they can be accepted as self-nomination on a first-come, first-served basis. However, only one candidacy per student per issue is allowed.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What would happen if no student got the majority vote within those ten minutes, or if no one steps forward as a candidate?” asked Horikita. “I would imagine such instances would be quite possible.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In those cases, a student would be selected at random from the class, and the vote would be held regardless,” Chabashira replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, the vote wouldn’t wait because we were indecisive. We would be forced to vote for someone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we’re asked to choose an individual, we might very well end up wasting our time,” Horikita observed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was exactly right. If that happened, it would be like having as many things to vote for as people in our class. That said, I couldn’t imagine it would be that simple to just make a decision with a randomly selected student.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s stay on our toes, everyone,” Horikita said. “This special exam might be more difficult than we thought…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNot all issues could be resolved through discussion. There was a good chance that we would be faced with a choice that we would never be able to reach a compromise on. I mean, if that sort of thing \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edidn’t\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e happen, then this wouldn’t make any sense as a special exam. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let me give you one last example issue,” said Chabashira. “This time, I’ll have you vote on something that would represent an actual physical change.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em; text-transform: uppercase;\"\u003eEXAMPLE ISSUE:\u003c/span\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003e An additional facility will be built within Keyaki Mall. Which of the following would you prefer? \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e(Whichever receives the most votes, based on the collective results of all four classes, will be selected.) \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eCHOICES:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Restaurant – General Store – Recreational Facility – Medical Facility \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnlike the previous example issues, which only allowed us to vote for or against, this time we had four available options to choose from. I assumed we were only going to be voting in favor of or opposed to things, but apparently that wasn’t the case. From what Chabashira had said, whatever choice we went with would be implemented. If this wasn’t an example issue, did that mean that they would actually go through with building whatever was chosen?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When an issue is passed, for example if you vote in favor of something, that means the issue in question will actually be implemented,” Chabashira said. “However, issues that affect the entire school are processed in a unique way. When these types of issues are presented, your particular class’s unanimous vote on the subject counts simply as one vote overall toward the decision. So, if this class were to vote unanimously in favor of the restaurant, but the three other classes voted unanimously for a recreational facility, the decision would be made to add a recreational facility as that would have received three votes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone in class probably understood what Chabashira meant. Basically, there were two types of issues: those that were immediately actionable after we finished voting on them, and those where our class’s position collectively counted as one vote overall. In any case, it seemed like we were expected to guide the class to unanimity with careful, discreet discussion. Whispering amongst ourselves was prohibited before the first vote, and that meant that students would make their initial choices based on their hunches.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eRound 1 Voting Results:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Restaurant: 20 Votes, General Store: 4 Votes, Recreational Facility: 15 Votes, Medical Facility: 0\u0026#160;Votes\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now, because you didn’t reach a unanimous decision, there will be a ten-minute interval,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow, we were experiencing a ten-minute discussion interval for the first time. A countdown timer started ticking on the monitor behind the podium. That timer would continue to count down until the next mandatory round of voting began. Students were free to leave their seats, and they were allowed to share their opinions however they wished, whether they wanted to talk in a loud voice for all to hear or if they wanted to whisper quietly to someone in particular. I observed my surroundings and waited for the timer to count down. Ten minutes passed without anyone giving any instructions in particular. Everyone just chatted away as they pleased.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please return to your seats just before the end of the break interval and prepare for the next round of voting,” Chabashira told us. “You’ll have a maximum of sixty seconds to vote. If everyone puts in their votes quickly, we’ll move on to announcing the results right away, without waiting for the time limit to be reached.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom what she was saying, unlike the mandatory ten-minute interval between votes, the actual voting process could be shortened somewhat with a little ingenuity.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Students who do not finish voting on an issue within those sixty seconds will be penalized without mercy for going over time. Individuals will have a maximum of ninety seconds of penalty time throughout the exam. Students who exceed that penalty allowance before finishing voting on all five issues will run out of time and be expelled.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was the school’s way of regulating us and ensuring that we absolutely would vote. Hypothetically, if a student didn’t want to vote and they sulked about it, they would quickly find themselves expelled from school thanks to this system. It was unlikely that a student would bother to do something like deliberately stall and delay each of their votes, because they would lose valuable time if they didn’t enter their votes within fifty-eight or fifty-nine seconds.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe had our second round of voting and got the following results.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eRound 2 Voting Results:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Restaurant: 23 Votes, General Store: 2 Votes, Recreational Facility: 14 Votes, Medical Facility: 0 Votes\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince we didn’t discuss the issue so we could come to a consensus, the results were roughly the same as the first round. It wasn’t going to be easy to steer things toward a unanimous decision on the first vote unless the issue was something completely obvious, but it didn’t seem to be that difficult to get thirty-nine votes for a particular option after coming to a unified opinion. However, that was only if the tasks were all within the realm of our expectations. Depending on the actual content of these issues, some of them could end up requiring considerable discussion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m going to finish the example issues there, but you should be able to understand how things work by now,” Chabashira said. “For you to pass this special exam, you need to come to a unanimous decision on five issues within five hours. If you fail to complete all of the issues within that time frame, you will suffer an extremely significant penalty. To be precise, the penalty is 300 Class Points.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Th-three hundred?!” exclaimed Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs it turned out, this was a special exam that we absolutely \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehad\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to finish.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, if you do finish in time, you will be awarded fifty Class Points.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe rewards and penalties seemed unbalanced, but when you considered the exam’s difficulty level, I supposed it was reasonable.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no need to panic, everyone,” Yousuke chimed in. “We don’t have to fight against anybody this time, we just have to come to a consensus. We can vote over and over as many times as we want, as long as time permits, with the interval periods taken into account.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure that you have a general idea of what this special exam is going to be like from these examples,” said Chabashira. “I’m now going to show you a summary of the rules. Those of you who feel that you want to hold onto them should take a screenshot on your devices.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em; text-transform: none;\"\u003eUnanimous Special Exam Summary\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eExplanation of the Rules\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAll students in the class will vote from the choices provided on each issue presented by the school. There will be a total of 5 issues with a maximum of 4 choices each.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAn issue will be voted on repeatedly until students have reached a unanimous decision on one of the choices.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf students run out of time on an issue, that issue will not pass, regardless of progress made on the vote.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf a unanimous decision is reached on a particular issue, that issue will pass, regardless of whether the class passes or fails the special exam overall.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf students finish voting on all issues, their class will be awarded 50 Class Points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf students fail to finish voting on all issues within five hours, their class will lose 300 Class Points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eSpecial Exam Flow\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAn issue will be presented, and the first round of voting will be held within 60 seconds.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf a unanimous decision is reached, proceed to step 1 for the next issue to be voted on. If not, then proceed to step 3.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e10-minute interval: During this time, students are free to move around and discuss the issue within their own classroom.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e60-second voting period: Students cannot talk during this time and can only cast their vote. Students who do not finish voting within 60 seconds will accrue cumulative penalty time. If a student’s cumulative penalty time exceeds 90 seconds, that student will immediately be expelled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eVoting results are announced. If a unanimous decision has been reached, proceed to step 1 for the next issue. If not, return to step 3.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe would repeat this process over and over and finish the special exam after going through all five issues. If by some chance we failed, we’d be penalized. Losing 300 Class Points here would essentially mean losing our ticket to Class A. That was not an exaggeration. If we lost and the other three classes completed the exam, that would increase the gap between us and them by 350 Class Points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe could discuss these issues as much as we wanted, but in the end, the problem was that the voting was completely anonymous. You couldn’t be sure who voted for what. Someone could claim that they voted against something when they actually voted in favor of it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not even we teachers have any knowledge about what kinds of issues you’ll be presented with,” Chabashira added. “Some of you may be taking an optimistic view of this, but let me give you a word of caution: do not let your guard down, not by any means. Also, you are strictly forbidden from making any sort of contract or other agreements with other students to force them into voting for a specific option in this exam. You are not allowed to engage in monetary transactions with another student or anything similar that would put them in a binding agreement for a particular choice either. Please note that this doesn’t just apply to your own class, but to the other classes as well.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, forcing someone into voting a specific way via an agreement made beforehand wasn’t allowed. Even though we were allowed to consolidate to a certain extent and come to a consensus on an issue, we weren’t allowed to back things up with contracts and guarantees. If someone signed a contract that said they could only vote for option number one, there was a risk that the exam would no longer be viable. That would be true even if only one person in a class had signed that agreement. Something like that would make it possible to deliver a vicious blow to another class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“School officials will be monitoring you closely and enforcing these rules,” Chabashira said. “If it is discovered that a third party, someone outside of the class, is somehow involved in something like forcing another student to vote in a specific way, the person or persons involved may be expelled without delay. That is a possibility, so do be prepared for that. Also, if any one of you is approached and asked to engage in illicit activities, please report it to the school immediately. We will do everything in our power to resolve the matter.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf a class ran out of time in this special exam, school officials would most definitely investigate since finishing in time was a prerequisite. Since you were likely going to be faced with a strict penalty simply for talking about doing something against the rules, not even someone like Ryuuen would be doing anything blatantly obvious. Until the special exam started, it seemed like it’d be best to refrain from getting carelessly involved with students from other classes. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Also, please note that Protect Points will temporarily be rendered ineffective for this special exam,” added Chabashira. “The reason being is that it is impossible to conduct a fair special exam if there is only one student who is protected. This means that if it’s decided that a student with a Protect Point is going to be expelled in any way, shape, or form, they will be unable to cancel that decision with the Protect Point in their possession. However, expulsion can still be avoided if either an individual or the entire class collectively pays 20 million Private Points. That is the only allowable method to counter an expulsion.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAny student who was going to be expelled was done for: it would be definite. Did this mean that the school would sometimes nullify Protect Points since they could cancel out an expulsion? If we were dealing with a special exam where we were going up against another class, then temporarily invalidating Protect Points in those cases could lead to students feeling unsatisfied. However, in this case, this was nothing more than an in-class problem. In that sense, I supposed it wasn’t unreasonable for the school to apply this special rule here. It was inevitable that people would grumble about it, but even Kouenji didn’t seem to be bothered in the slightest.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please understand that during the special exam, all communication devices, such as your cell phones, will be collected. This is because the school deemed it possible that students could use them to contact people outside of their class. In the unlikely event that a student is found to have a concealed device, then… Well, I’m sure I don’t even need to spell it out for you at this point.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe meant that expulsion was to follow, just like the other rules that we needed to observe here.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e3.1\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eW\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHEN OUR LUNCH HOUR CAME\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Yousuke immediately got up out of his seat and headed over to the podium.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, hey, I was thinking I’d like to hear everyone’s opinions before we have lunch, if that’s okay,” he addressed us. “What do you all think?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida raised her hand to answer first. “Um, aren’t there going to be conflicts because people will be divided on the options in this special exam?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She’s right about that,” said Horikita. “If we could come to a consensus on matters without fighting over anything, then there wouldn’t be any reason to go through the trouble of holding this special exam in the first place.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, wouldn’t it be a good idea to decide upon a leader in advance, in case there are times when we can’t come to a consensus about something?” Kushida said. “I\u0026#160;think that if we follow the decisions that such a leader would make, then we’d be able to get through this special exam without any problems.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s true. I agree with your opinion on that, Kushida-san. That means that the leader would have a serious responsibility, though,” noted Yousuke.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe more options and conflicting opinions there were, the more criticism that leader would face from students who supported choices that didn’t get picked. Whoever it was, it would need to be the sort of leader who could rally people together well.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Actually, if you wouldn’t mind… Would you be able to do it, Horikita-san?” asked Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Me?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. You’ve acted as the leader many times before, and more importantly, I think that you would keep everyone in line well enough that there won’t be any unfairness. Of course, it would be a serious responsibility, just like Hirata-kun said. So, if you’d be okay with it, Horikita-san, then… Well?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…You’re right,” said Horikita. “I suppose that it’s possible other classes will implement similar strategies, and it’d be a necessary measure to have in place when opinions are divided. If there’s anyone who feels hesitant to follow my orders when the time calls for it, please tell me now. This is the time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStudents weren’t likely going to make a bid for the position themselves or make negative comments now after hearing what a huge responsibility it would be. Kushida’s proposal was swiftly approved, and everyone agreed that Horikita would lead the group in case of emergency. For a while after that, various opinions were exchanged back and forth, but no other major conclusions were reached. In the end, it was simply time for lunch, albeit somewhat later than usual.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Think it’s time to get some food. Yukimuu, Miyacchi, you’re coming too, right?” said Haruka, turning back to look at them. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe two guys agreed, as usual, and got up from their seats. These were all members of the Ayanokouji Group. It was a small group of five, including me. Just as we were all getting together though, another student came running up to me. As soon as our eyes met, she called out my name.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kiyotaka, let’s go get lunch.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe said it without pausing, but she appeared somewhat nervous as she looked me in the eyes. No one had been paying close attention to Kei as she came toward me, nor were they intentionally listening in on what she said. However, now, every student in our class besides Kouenji, all thirty-six of them, turned to look at us in unison.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, guys, but I’m going to eat with Kei today,” I told them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBefore the people around us could understand what was happening, I pushed my chair back and stood up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I wanna go to the café,” said Kei. “Is that okay?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey… Wha…? H-hold up,” said Haruka. “Karuizawa-san, why are you suddenly just butting in?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not like there’s any rule against joining a conversation, is there?” Kei replied. “Didn’t you just hear what Kiyotaka said?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yeah, I heard it, but… What’s going on? I thought you promised you’d come with us already though? …Also, hold up, ‘Kei’?” Haruka asked, rambling.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter a slight delay, Haruka started to understand why Kei and I were calling each other by our given names. Well, no, I supposed she might not have been able to completely understand what was happening here.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, but I’m his girlfriend, so I’m his top priority. Okay?” said Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka paused for a moment. “Huh?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Girl…friend…?” whispered Airi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe two muttered their respective comments at the exact same time, though their reactions were completely different.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, as you can guess, Kiyotaka might have fewer chances to hang out with you guys as a group from now on,” added Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe proceeded to tug me by the arm, leading me out of the classroom. “Come on, let’s go,” Kei urged. She must have been feeling quite embarrassed, judging from the fact that her face was starting to turn bright red. As for me, I hadn’t imagined that we were going to announce our relationship in this way at all…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka, Airi, and the other students were dumbfounded, seemingly unable to follow after us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e3.2\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHANKS TO KEI’S BOLD ACTIONS\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e our relationship that until that point had only been known to a select few had immediately become public knowledge to our entire class. Words would likely spread through our whole grade by the end of the day. Actually, though, I was skeptical about how many students would really be interested in my relationship with her. The fact that Ike and Shinohara had gotten together during the summer vacation had made fewer waves than I had expected as a hot topic. If anything, it was more like people had already assumed that they would have gotten together.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSome of the guys in class seemed to be trying to put up a tough front, like they didn’t care about Ike and Shinohara being together. And, some of Ike’s friends honestly seemed a little jealous. However, it made no difference. That was because in the end, the fact they became a couple was celebrated by many. Ike and Shinohara nurtured their romantic relationship well, though it was gradual. I was also seeing them together more often lately. They walked back to the dorms from class together, they went on dates, and so on and so forth. What was at first a novel sight soon became the norm. I thought it was going to be the same with Kei and me, though I figured we might end up causing more commotion than Ike and Shinohara and for a longer period of time. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt any rate, we had now reached the end of the school day, and the entire class had come to know about my relationship. I sensed that from the time our afternoon classes started earlier, there was a certain girl in class who hadn’t looked at me once since lunch.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat girl was none other than Haruka, Airi’s best friend and her cheerleader, someone who understood her well. She approached me after class and called out to me. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Kiyopon! If ya don’t mind, would you walk back to the dorms with me?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was expecting that Kei would suggest we walk back after class together, but when I had shot her a glance earlier, she was surrounded by girls bombarding her with questions. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you sure that’s okay?” I asked her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had expected that Haruka would have definitely been offering her support to Airi right now, watching over her. Instead, Airi was slowly and silently getting ready to head back to the dorms.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know, I know, but there’s nothing I can say to her right now,” Haruka sighed. “Yeah? But, well, I guess if you tell me there are reasons you can’t walk back alone with me though, Kiyopon, that’d be a different story.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer expression hardened for just a moment.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that the fact Kei and I were going out was public knowledge, the number of opportunities that I’d have to get together with the Ayanokouji Group would inevitably decrease. Considering that, I figured it would be a good idea for me to hear everything that Haruka had to say, without restraint. Haruka and I each grabbed our things and headed to the front entrance of the building, walking all the way there from the rear exit. Haruka simply walked on ahead of me without uttering a single word as we moved along, seemingly unconcerned. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI occasionally stole glances to look at her from the side, and I saw that she had what appeared to be a look of anger and sadness on her face. Around the time that we put on our shoes and left the school building, she finally turned to look at me properly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no point in me trying to ask this in a roundabout way, so I’m just going to come straight out with it… Is it really true that you and Karuizawa-san started dating? I still can’t believe it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As you saw for yourself, yes, it’s true,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter I told her that, Haruka pouted her lips and immediately nodded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah… I guess it was plain to see, huh? Sorry, but it’s just…I was so shocked. Listen, of course you’re free to date whoever you want, Kiyopon. I just never imagined that you’d be seeing Karuizawa-san of all people. Y’know?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor those who didn’t know her, Karuizawa Kei’s reputation was by no means clean. Most people had the impression that she was a selfish girl who quickly got together with the popular Yousuke and dumped him for her own self-serving reasons. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess this is what you were talking about before, when we were by the pool. What you said about a little emotional shock. Except, you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edo\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e realize that there wasn’t anything little about it at all, right? Airi was desperately trying her hardest to keep it together in the classroom, but she was crying all through lunch.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, this is not just an ‘I see’ type of thing… Anyway, is it true that you guys started going out around spring break? Like, for real?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry I didn’t say anything. But I had a lot going\u0026#160;on.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A lot, huh? Well, I guess there are lots of rumors going around about Karuizawa-san so I can kind of understand what you mean, but…” Haruka’s voice drifted off there.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed it was understandable that people might have that perception of Kei since she had been dating Yousuke right around the time we started school here. She also likely fabricated details about her own past.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, like, it’s \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ereally\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e true then?” Haruka asked again. “This isn’t a joke or anything?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s true,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe sighed loudly. “I see. Well, it is what it is, I guess. I\u0026#160;dunno, it’s just like, I’m still so confused by it… Well, sure, I had imagined you could be dating somebody, Kiyopon, or that you were in love with someone other than Airi, but… It’s just, I couldn’t imagine it being Karuizawa-san, no way.” Haruka was deeply perplexed. Apparently, all of her predictions had been way off the mark.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I talked with Yukimuu and Miyacchi a little too, and they feel the same as me. And I didn’t hear Airi say anything about it directly, but I’m sure she must be more shocked than we are.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was sure she was right about that. Even I could imagine that quite easily.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, like, what’s the story behind it? I can’t even imagine that you would have had that many chances to hang out with her, or things in common, or anything.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt didn’t surprise me that she wouldn’t be able to figure out when exactly Kei and I came to like one another.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was in Kei’s same group when we had that special exam on the ship last year,” I explained. “Ever since then, we started having chances
