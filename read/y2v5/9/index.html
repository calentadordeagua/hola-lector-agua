nation, he figured that issues like the one he had mentioned would be on the exam.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, when an issue like that does appear, there is only one course of action for you to take, Kushida-senpai.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYagami went on to explain precisely how she could drive Horikita and Ayanokouji into a corner, should that issue come up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what do you think?” he said. “Doesn’t this make the possibility of getting them expelled look much more attainable? Of course, you’ll be reducing your entire class to tears by doing this, but that would be a small matter for you, wouldn’t it?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you… Do you really think I could do something like that?” Kushida asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In my view, you certainly have the capability. Or am I wrong in my assessment of you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You certainly seem to have a high opinion of me.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I had to test my senpai when we first met, to see if you were someone I could use.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…What do you mean by that?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you remember when I approached you that time? ‘It’s me. Do you not recognize me?’” asked Yagami.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was flustered,” she said. “What about it?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What about it? Well, normally, anyone would have had their doubts in a situation like that. After all, we were complete strangers then, Kushida-senpai. We hadn’t met before, not even once. Despite that, you immediately navigated the conversation, deftly managing to make your way through by improvising. That was exactly how I came to understand that you, senpai, are someone capable.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But what if I had said, ‘Who are you?’ back then, when we met?” said Kushida. “I might have simply forgotten if we met before.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think you would have. Because if you didn’t know where we met before, it could have turned out that we went to the same junior high. If that was the case, there’d be a possibility that I knew about your past. I’m sure it would’ve been a big problem for you in the unlikely event I were to say something like, ‘I know about \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e incident’ to you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYagami was implying that in order to reject the possibility of something like that happening, Kushida immediately improvised back then to go along with the flow of conversation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I wasn’t someone who attended your junior high, I could, for example, have gone to the same cram school. Or I could have been someone younger than you who just happened to live in your neighborhood. If you found out that it was one of those things later, then the risk of me being someone who knew about your past would be greatly reduced and you could laugh things off as a simple misunderstanding. Your first priority with any new person is to make sure they didn’t go to your junior high school, right? That way, even if someone were to bring up a topic even only tangentially related to your past, it would be easier for you to divert the conversation away from it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaving finished his explanation, Yagami drank about a quarter of the tea in the cup and set it down on the table.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who even are you, anyway?” asked Kushida quizzically. “How do you know about my past if we didn’t even go to the same school…?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand why you are so guarded, but please, just consider me a guest in a rather unique position,” Yagami said. “Yes, just so. My purpose is to play with Ayanokouji-senpai.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? To play with him?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, well, I don’t think he knows about me at all. Right now, what I’m most preoccupied with is testing out various things without Ayanokouji-senpai noticing.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What if I got upset back then, when we first met? If I didn’t give you the answers you wanted?” asked Kushida, curious about what Yagami would have said at the time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I would’ve found it interesting,” he replied. “I am sure that Ayanokouji-senpai would have noticed your discomfort, saw that something was off, and he would have eyed me with suspicion. I probably could have \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003egreeted\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e him at a much earlier stage, I suppose.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Did you and Ayanokouji go to the same junior high, by any chance?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, who can say? Anyway, that’s of little concern to you, Kushida-senpai. Let’s turn our attention to the special exam for now, shall we?” said Yagami, redirecting the conversation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know. If that issue that you’re hoping for does come up, then…at that time, I’ll try to make a move.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You will \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003etry\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to make a move? That’s not good enough.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not good enough?” Kushida spat back. “What the heck do you mean, not good enough?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYagami got up and moved in close to Kushida, grabbing her by the shoulders. The young woman reflexively tried to flee.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey! What are you doing?!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida tried to break free from his grasp, but Yagami was stronger than she imagined he’d be despite his slender build. She was utterly unable to move.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please listen very carefully,” he told her. “You are in far more dire straits than you think you are, Kushida-senpai. Not only do you have people near you like Ayanokouji-senpai and Horikita-senpai to worry about, but you have other causes for concern as well. There are others whose very presence continues to pose a threat to your safe daily life, such as myself and Amasawa-san… Isn’t that right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s…true…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs Yagami looked straight into her eyes, Kushida glared directly back at him without an ounce of fear.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It goes without saying, but it’s no easy feat to get one of your classmates kicked out of this school,” he went\u0026#160;on. “It’s also quite a challenge to drive someone toward expulsion in the course of ordinary daily routine. If you have the chance to expel them through a special exam like this one, then, without a doubt, a golden opportunity has fallen into your lap,.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand that,” Kushida said. “But if I push too far, I’ll be putting myself in danger too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That means you just need to be prepared for that,” Yagami said. “Either you remove them, or you’ll be removed yourself.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was putting Kushida under great pressure. It was essentially kill or be killed. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course, the decision is yours to make, Kushida-senpai. Anyway, if I were to say something like, ‘If\u0026#160;you don’t want everybody to find out about the way you caused your old class to fall apart, then get either Horikita-senpai or Ayanokouji-senpai expelled…’ Well, that would be nothing short of a threat, and thus a violation of the rules of the exam.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d say what you just said right now sounds like a threat,” muttered Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please pardon my rudeness,” said Yagami. “I didn’t intend to threaten you. I just think the truth is that you’re not prepared enough for this, Kushida-senpai. Be prepared to eliminate them no matter the sacrifice. If you can’t do at least that much, you will never, ever be able to drive them to expulsion.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen, removing his hands from her shoulders, Yagami stepped away and sat back down.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let me ask you once more,” he said. “You wish to have those two expelled. Is that right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen he looked into Kushida’s eyes once again, she looked back at him with a mixture of anger and frustration. She didn’t even have to speak her answer aloud. She had been wishing for that every single day for the past year and a half, almost like she were trying to place a curse on them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes,” she replied at last. “I want to have Horikita and Ayanokouji expelled. I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewill\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e definitely get them expelled…!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wonderful. I can feel it,” said Yagami. “I’m finally able to confirm that your convictions are indeed genuine, Kushida-senpai.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida had made up her mind: in order to prevent her wound from opening up any further, she needed to have Horikita and Ayanokouji expelled from school as soon as possible. And as for Yagami, who had been running his mouth freely…she would have to get him expelled as well.\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 3: Two Teachers and A Fated Special Exam\",\"volumeId\":\"y2v5\",\"chapterIndex\":9,\"prevChapter\":{\
