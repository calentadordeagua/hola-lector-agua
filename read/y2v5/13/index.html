t-weight: bold; font-size: 1.00em; text-transform: uppercase;\"\u003eISSUE #5:\u003c/span\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003e In exchange for expelling one of your classmates, gain 100 Class Points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e(In the event the class is unanimously in favor, a vote will be held to choose the student to be expelled.)\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSeeing the word “expel” startled the students, but they proceeded to cast the first round of votes in silence as they were instructed. In order to avoid any unexpected incidents, Sakayanagi, like Horikita, had given her classmates instructions in advance to ensure that votes were split among the four people closest to her. Because there were two options in this vote, that meant it was a given that there would be two \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eand two \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs such, the results showed…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eRound 1 Voting Results:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e For: 2 Votes, Against: 36 Votes\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd that was that. The results showed that, aside from the two controlled votes that Sakayanagi had engineered to be in favor, all the students were against the issue.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Welp, there you have it. So, what are you gonna do, Princess? Are we all votin’ no next round?” Hashimoto immediately looked to Sakayanagi for confirmation once the interval period began.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto was given the assigned task of always voting for the first option, so he had voted in favor of the issue.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you think, Hashimoto-kun?” asked Sakayanagi in return.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto was a little surprised by that, as he hadn’t expected his question would be met with another. He\u0026#160;read the issue once again in his mind.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we wanna head straight to a conclusion, then we should oppose the issue,” he said. “But when I step back and think about it more logically, I feel that going for 100 Class Points is surprisingly not that stupid of an idea.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Meaning you think we should move to gain those 100 points, even if it means expelling one of our classmates?” asked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well…I wouldn’t say all that, no. I’m just saying I wonder if it’s okay to completely disregard those points so casually. That’s all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If this exam had come toward the end of a competitive school year, then I would’ve likely had no choice but to adopt a policy of abandoning classmates,” Sakayanagi said. “However, as it stands now, our class is by far in the lead. With that in mind, one might say it would be quite nonsensical for us to choose to expel someone here and now to gain 100 Class Points.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course. I was just sayin’ that it’d be too bad if we were regrettin’ these Class Points later, y’know?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A reduction in the number of people also comes with its own disadvantages,” Sakayanagi said. “Simply put, the total number of Private Points our class would gain every month would decrease, the class’s morale would decline, and there would be feelings of distrust. It’s an interesting move to be sure, but we do have the option of deliberately choosing to expel a student now, only to turn around and save them by spending 20 million Private Points. That way, we could gain Class Points without sacrificing anyone. However, doing so would have an adverse effect on our assets, which would in turn affect the upcoming sports and cultural festivals. Even talking about a difference of 100 points, if we take the possibility of unforeseen factors into account, I believe that there isn’t much difference in terms of gains or losses no matter how this issue plays out. Or perhaps…is there anyone in this class who would willingly volunteer to be expelled?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi briefly surveyed the class. Of course there was no way that any of them would voluntarily drop out of Class A because, as Sakayanagi had said earlier, their class was in the lead by a wide margin.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure that the other classes must be struggling with this issue, since they’re essentially in a three-way contest right now,” she added. “Even if one of those classes makes the difficult choice of choosing someone to expel, that class may not necessarily rise in the ranks. Losing a fellow classmate is not such a simple matter, after all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd with that, Class A’s plan of action had been set. Hypothetically, if Class A had chosen to expel someone, they would have come to a unanimous decision on it without delay. And in all likelihood, whatever student Sakayanagi had chosen would be the one to be expelled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All of you, my classmates, are different from those we have lost, meaning Katsuragi-kun and Totsuka-kun,” Sakayanagi said. “I would never do anything to abandon my friends who are working so diligently for me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat Sakayanagi said was a lie. In the unlikely event that Class A was pushed into a corner, she wouldn’t hesitate to make the choice to expel students. However, if she chose to expel students carelessly in a non-critical situation like right now, it would sow the seeds of mistrust. She had simply decided that as things currently stood, she’d have more to lose by putting herself into that situation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eRound 2 Voting Results:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e For: 0 Votes, Against: 38 Votes\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey had arrived at a unanimous decision\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e Against\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, just like Ryuuen’s class and Ichinose’s class. But as those classes arrived there after a great deal of stress, Class\u0026#160;A had come to their decision in just the first interval, spending just over half of the interval ensuring that their classmates would vote accordingly. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, that’s everything,” said Mashima. “That concludes all the issues in the Unanimous Special Exam. This class has completed the exam with the fastest time. Please note that the other classes are still in the middle of their exams, so please exit the classroom as instructed. The rest of your day will be spent in self-study in the dormitories, as planned.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough the students were not allowed to leave the dormitories, they essentially had free time.\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 7: Sakayanagi Arisu’s Choice\",\"volumeId\":\"y2v5\",\"chapterIndex\":13,\"prevChapter\":{\"volumeId\":\"y2v5\",\"chapter\":12,\"title\":\"Chapter 6: Ryuuen Kakeru’s Choice\"},\"nextChapter\":{\"vo
