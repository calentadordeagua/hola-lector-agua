the hardest about it, though. You said that they were the perfect couple. But don’t worry! Even though I had a forced smile and told you to stop saying those kinds of things, I felt the same way you did.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is… Is that true… Nene-chan…?” asked a hurt Shinohara.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“N-no, it’s… I-I just, I…” stammered Mori.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, and Shinohara-san,” Kushida said. “From the sounds of things, you decided to start going out with Ike-kun after he told you how he felt about you on the boat. But I have to say… Wow! You sure made your decision quickly, considering you were going back and forth between him and Komiya-kun just before that. Or perhaps you were just going out with Ike-kun on a trial basis, to see how it went? Then, you could go after Komiya-kun instead, since he was closer to your true love.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-hey, Satsuki, wha—?!” flailed Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were countless bits of and pieces of information Kushida had that she could use to burn the whole class down. Once a fire began to spread in one place, she quickly jumped over to something new, letting her words loose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, and speaking of love and relationships, Wang-san, you came to me for advice too, didn’t you?” she said. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“P-please stop!” wailed Mii-chan.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Stop? Stop what? You mean you don’t want me to say that you love Hirata-kun like crazy, so much that you can’t stand it?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh—?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMii-chan was suddenly forced to hear the name of the object of her affections said aloud for all to hear in the classroom. Her face immediately went bright red, and she broke down in tears when she noticed Yousuke looking at her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm, think I’ll stop with the small ones,” Kushida mused. “You realized I’ve just been sharing the \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003elittle\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e secrets, right? After all, not all the things I’ve heard are like that. Next, let’s hear something a little juicier, shall we? Oh, I’ve got one… How about we go with someone like you for starters, Hasebe-san?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Kyou-chan…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, stop calling me that. It’s not like we’re close friends,” Kushida sneered. “You can’t even actually make real friends. You just call people by nicknames because it makes you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003efeel\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e like you’re getting to be closer to them. Besides, I’m sure it’s annoying to the people you address that way.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida shifted her focus to Haruka. Shinohara, and Mori and the other girls, as well as Ike and other people, continued to shout back and forth, trying to refute things. “I didn’t say that.” “No, what I really said was…” Everyone was pressing each other about what was true and what was a lie. The interval period would be over soon, and a unanimous decision to expel Kushida was drawing near…but if we continued to carelessly draw this situation out, Kushida would only continue to expose more and more information.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e8.1\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eFTER LISTENING\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to Ayanokouji-kun speak for only a few minutes, people’s opinions of Kushida’s worth had done a complete 180. It even happened with her friends, who should have had as strong a sense of solidarity as Ayanokouji-kun’s group of friends. For some reason, I couldn’t help but see their relationship as having been terribly fragile before this. Ayanokouji-kun’s narrative was so incredibly effective that even someone like me, who knew Kushida-san’s past before anyone else did, could easily move to push her out if Ayanokouji-kun asked that I make Kushida Kikyou our target. I may have just caught a glimpse of Ayanokouji-kun’s power before anyone else did.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRight now, our class was like a scene from hell. The vote for Kushida-san, who would likely get a majority of the votes once the interval was over, would soon begin. This special exam was likely almost over. Our class would get 100 points, despite our sacrifice. That would be a valuable asset to us in our efforts to get to Class A, but… Yes, I needed to sort out this situation I found myself in\u0026#160;first.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was most definitely in the same moment in time as the rest of them, and yet time was dilating for me, little by little. The passing of each second felt drawn out. The analog clock, which even didn’t look like it belonged in this classroom, was slowing down, its second-hand ticking so slowly that it almost felt like it was coming to a stop. But on the contrary, it was my senses becoming more and more heightened.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat was my purpose? I answered that question myself: to graduate from Class A, of course. That was why Class Points were so important. That was obvious. In that case, how much was Kushida-san worth? It was difficult to assign a clear value to every individual student. But at the very least, if you were to ask me if she were equal to 100 Class Points, I would immediately answer no.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn that case, I’d try shifting my thinking. If we were to fail this special exam, we would end up losing 350 Class Points. If I could protect Kushida in exchange, could I calculate that she’d be enough of an asset to be able to make up for that loss?\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_7\" src=\"/hola-lector-agua/images/books/y2v5/OEBPS/Images/INTERIORIMAGES_7.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t think it would be impossible…but it would be difficult. That answer wasn’t just limited to her either; the same was true for me. Allowing Kushida-san to be expelled because she wasn’t worth 350 points was a normal way of thinking. In that case, what did I, Horikita Suzune, want to do? What did I want to do about the student named Kushida Kikyou?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDid I want to save her, without thinking too much about it? Did I want to abandon her? By concentrating, I transcended time, even eliminating superfluous concepts like sound. Could I just leave everything to Ayanokouji-kun as things were right now? No, there’s no way I could. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eThen, think.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e What was right? What was wrong? Wasn’t there anything that only I could do? \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAcknowledge and respect Ayanokouji-kun’s abilities and think again.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA ray of light shined through the darkness, behind my eyelids.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e…Yes. I see now. \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had finally arrived at just one answer. Right now, Kushida-san was going to be expelled. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd that was not the correct choice. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt that moment, I was surely the only person who could save Kushida-san. Time had come to a stop before, but it was now beginning to unfreeze. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe second hand started ticking once again.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e8.2\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eS ONE STUDENT\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e after another started to agree with the idea of Kushida being expelled, one student stood\u0026#160;up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t go any further, Kushida-san,” said Horikita. “You won’t be able to take it back.” Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? It was finally starting to get interesting,” Kushida pouted. “Don’t butt in, Horikita-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t let this go on,” Horikita insisted. “I don’t think I can listen to any more of this disgraceful ranting.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is the real me that disgraceful?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps Kushida took Horikita’s words as a compliment. Kushida looked at her with the liveliest expression that she had worn all day.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, at the very least, I don’t think that exposing people like this is particularly beautiful,” said Horikita. “But it’s not just you that I think is disgraceful here. The same is true for the people who are clamoring for your expulsion now that you’ve revealed their secrets here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat unexpected rebuke made her classmates cry out in protest.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why do you say \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewe\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e are?! We didn’t do anything wrong!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You all told Kushida-san secrets that you didn’t want other people to know. Why was that?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-well, that’s because we thought we could trust Kushida-san! But she…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. Kushida-san was the most highly trusted person in class. Normally, it’s not easy to gain the trust of others, and there are probably only a few people in your life with whom you can share secrets that you can’t tell anyone else. Of course, I can’t praise Kushida-san for divulging those secrets…and it’s understandable for you to be surprised that she has another side to her. But that being said, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eeveryone\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e has another side to them, whether it’s big or small. Don’t they?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA person who lived truthfully without any lies or falsehoods at all would certainly be quite a rarity.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-but…isn’t the fact that she kept voting in favor still a problem? We can’t forgive her for that, can we?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re right,” Horikita agreed. “It was a very selfish choice on her part to try to get Ayanokouji-kun or me expelled. She has to feel the heavy responsibility for that. But instead of making her pay for that by having her expelled, we can have her make use of her skills for us many times in the days to come and pay us back that way.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was when Horikita started to convey what she really wanted to say to her classmates.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you saying that you’re not going to expel Kushida-san?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. I… I want to keep Kushida-san in this class.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Hold on, what are you babbling about now, after you interrupted me?” The first person who argued against Horikita’s position to not have Kushida expelled was none other than the person in question herself. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why are you defending me?” asked Kushida. “You don’t have anyone else here that you’re going to vote for, do you? What, do you just want to have fun torturing me to death? Wow, you have \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003esuch \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003egood taste, really.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unfortunately, I don’t really like to make jokes,” Horikita replied. “I’m being serious,.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, if you say you’re being serious, then I’ll go ahead and change your mind for you,” Kushida said. “Let’s reopen the gates of Hell, shall we?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“From what I could see, that spectacle earlier didn’t look at all like ‘Hell’ to me,” remarked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Heh. Okay then, what did it look like to you? Tell me that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It was idiotic, comical, and frankly disgraceful. Nothing more. You looked like nothing but a fool.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh?” said Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You certainly are more academically capable than the average person, but you are fundamentally stupid to an almost fatal degree.” Horikita sighed, insulting Kushida unsparingly. “To begin with, your classmates found out about your true nature when you were in junior high, so…you revealed their secrets and destroyed the class. Then, you came to this school to reflect on what happened back then, but unfortunately for you, you were reunited with me, someone who attended the same junior high. And right after starting school here, Ayanokouji-kun also happened to witness your hidden self? That makes me laugh. Not only that, he wasn’t even interested in your past, but you selfishly continued to insist on trying to get us expelled, all because you couldn’t stand him being here. You even told us all about it. And to top it all off, you thought you made a deal with Ayanokouji-kun, thinking you were taking advantage of him, but in the end, he turned it around and used you. And \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethis\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e is where everything ended up? You were too obsessed with trying to get us expelled by voting \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor. \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eInstead, you had the rug pulled out from under you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida’s expression had changed. Before, she had worn a vicious smirk on her face, but before anyone realized it, the look on her face transformed into the demonic fury of a woman scorned.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re just selfishly spouting off whatever you want!!!” she screamed. “You don’t know what I feel! I want to be the best! Even though I’m feeling stressed as hell, I just want to feel happy! What’s wrong with trying to make you go away when you’re in the way of that?!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know what you feel?” Horikita repeated. “How \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecould\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I know? You’re always focused solely on listening to and hoarding other people’s worries. You didn’t look for anyone you could talk to, to let them know what you felt.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida balled both of her hands into fists, clenching them so tightly that her veins were bulging out from her skin.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You have some personality issues, sure, but so do I,” Horikita went on. “And you are a much, much harder worker than I am.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t lie, it just makes me want to laugh. You always seem to say things that get on my nerves.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not lying at all. I’m telling the truth, which you seem to love. I honestly admire and envy your effort and your talent, to be able to befriend so many people, both men and women. It’s honestly incredible.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen the students who were upset by Kushida heard Horikita say that, they spoke up in disagreement.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s so great about her?” one of them shouted. “She’s been insulting us!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Being kind with lies? Pretending to be nice? So, she’s terrible because of that?” Horikita asked. “That’s honestly just frivolous nonsense. Think again just how difficult it is to be kind. Do you have the talent to smile at others? To reach out and lend an ear to everyone?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHow much stress did Kushida have to deal with daily while reaching out to her friends? Many people wanted to be like Kushida but understood that they couldn’t. Even if they just cut out the part about listening to other people talk about things that they didn’t care about, an ordinary person wouldn’t be able to go on doing what she did. Kushida had continued to do all that with a kind smile, continuing to stand behind a substantial number of students and supporting them from behind the scenes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Stop,” spat Kushida. “Just stop already. I don’t want to hear any more of this bull from you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why? You’re good at seeing into people’s hearts so you know, don’t you? You know that I’m not trying to tease you or insult you. I sincerely do appreciate you.” Horikita then preemptively blocked the other students before they could refute her, as if she were trying to get ahead of them. “She has talents that no one else does. Expelling her would be a huge loss for our class.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Knock it off!” Kushida shouted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita continued regardless. “That is why I cannot agree to Kushida-san’s expulsion. I’m willing to bet on it. I am willing to try and do everything in my power to make use of her strengths. No, I definitely \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewill \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003emake the most of her strengths.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I told you to stop!!!” howled Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There were things about you I didn’t know,” added Horikita. “But once I learned everything about you was when I started to take a great liking to you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThinking back on it, Kushida told me about the details of her past for some reason. She wasn’t trying to hide it, even though she wanted to keep it locked away. Perhaps she had done that not because she was trying to get me expelled, but because deep down, she actually \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewanted\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to tell people things. In fact, perhaps she wanted to share things about herself with other people. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHuge tears streamed down Kushida’s face. And then, like a child, she started to sob. She was no longer able to hide her frustration and regret, nor could she string words together in a sentence. She kept repeating “No, no, no, no,” over and over without end.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_8\" src=\"/hola-lector-agua/images/books/y2v5/OEBPS/Images/INTERIORIMAGES_8.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course she felt that way. Anyone who knew Kushida’s true nature would leave her. I stayed away from her myself. And yet, for some reason, Horikita—someone who had kept her distance from Kushida until now—had moved closer to her. There was no way Kushida could have expected something like that to happen. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita, someone that Kushida couldn’t help but hate, could very well be the first one to understand her. Whether she accepted that remained to be seen, but there was no denying that this had definitely brought about a change in her. I previously determined that it would have been impossible to win Kushida over, so I produced this strategy to get rid of her. Meanwhile, Horikita had decided not only not to get rid of her, but to protect her. However, if that was what Horikita was determined to do, another inevitable problem was going to emerge.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re still in the middle of this discussion, but the interval period is almost over. What do we do now?” asked one student.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat should we do? Well, obviously, someone would need to nominate themselves, or we would need to recommend someone to vote on.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re short on time,” Horikita said. “All of you who recommend we vote for Kushida-san right now, change your votes to me instead. I’ll explain later.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita appealed to her classmates to change their recommendations to her. She couldn’t nominate herself again since she already did it once before.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“S-stop fooling around!” Kushida yelled out. “I’m going to be expelled anyway! Just recommend me and vote me out!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I am not fooling around,” Horikita insisted. “Let me be clear. You are the one who created this situation, and you will be held accountable for it in the end. However, I will not accept your expulsion as your punishment. If you are expelled, I will continue to make fun of you for the rest of your life. I will make you into an eternal laughingstock.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was sure that some students were still unsure of who to recommend in the end, but that wasn’t important at this moment. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s time,” announced Chabashira. “We’ll now begin the vote for Horikita as she holds the majority of recommendations.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHypothetically, even if Kushida were chosen via recommendation, it would be meaningless as long as Horikita voted against her expulsion. Cheap provocation must have worked well enough for Kushida. Everyone finished entering their votes within sixty seconds.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eRound 20 Voting Results:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e For: 1 Vote, Against: 37 Votes\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now that we’re in another interval period, I will reiterate my stance,” Horikita said. “I am opposed to Kushida-san’s expulsion.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida was ranting and raving incoherently, but Horikita was no longer paying any attention to her. That further wounded Kushida’s pride and seemed to have the opposite effect, successfully silencing her. If Kushida had once again become a target for expulsion, she would have no more means to oppose Horikita. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut still, this was all rather unexpected. I had been planning to screw over my opponent, no matter who they were. I felt the inside of my head getting hotter. Horikita didn’t simply decide that she wanted to protect Kushida on a whim, or as a joke. She even went as far as to declare with confidence that she would overcome Kushida’s major weaknesses and make the most of her strengths.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita had set foot on the next stage earlier than I had expected from the looks of it. Of course, that wasn’t to say that there were no objections from the other students. There were many who wouldn’t mind if Kushida were expelled, since she had been propped up as the bad guy. It wasn’t like Horikita couldn’t force things ahead, of course, but it was difficult to imagine that Horikita would get through this easily now that she had raised the issue. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t rule out the possibility that she might force the class to choose not to expel someone by purposefully letting time run out, depending on how the situation played out. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSorry, Horikita, that would be unacceptable.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But Horikita-san, will protecting Kushida-san mean we’re going to choose to let time run out?” Yousuke brought up a question that needed to be answered immediately.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand that protecting Kushida-san isn’t the end of this,” Horikita replied. “I have my own answer to that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eDon’t tell me, you… Actually, wait, so \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ethat’s\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e what you’re planning, huh, Horikita?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We must avoid failing this special exam. So, it’s absolutely imperative that someone is expelled.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis meant that Horikita was not only determined to rescue Kushida, but she was also prepared to get rid of someone else. While I did certainly sense there was growth in Horikita, I acted before she could speak. There was no need for Horikita to take on the cruel role of being the one to declare who should be removed from class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI forcefully cut her off before she could attempt to go on. “Wait a minute.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo matter how justified Horikita might’ve been, making a judgment right here and now would take an intense emotional toll. I could easily brush it off as a worthwhile experience for her, but it would be a heavy burden for Horikita right now. More importantly, if she made even a single mistake, she could very well end up running out of time even if she didn’t mean to. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no one but me who could get the class to make a unanimous decision on who to expel. Wait…no. Horikita was also giving me a certain look. That’s how I understood—it was obvious that Horikita and I were thinking of the same person. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kushida, the only person who kept voting \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the whole time, is the person who deserves to be expelled,” I said. “However, like Horikita said, she’s also a capable student. So, in that case, we’ll have to consider a different approach.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-wait, Ayanokouji, hold on,” Ike protested. “We all voted in favor of the idea because we ain’t traitors to our class, right? So now we’re just gonna throw all that out the window and choose someone to expel?! I can’t buy this, not for one second!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re not the only person unhappy about this, Ike,” I told him. “We all are. But even so, we must make a decision. We have no other choice but to move forward in a way that we can describe as the fairest.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fairest…? How could there even be a fair way of doing this?” asked another student.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The option of expelling someone to gain Class Points, of course,” I replied. “The expulsion part tends to give a negative impression, but if certain conditions are met, we could turn the situation into a positive, as would have been the case if we were to vote for the traitor who voted in favor of the issue. If the Class Points gained are worth more than the student to be expelled, then that would mean the choice would be worthwhile. In other words, the only students we should consider expelling are ones who are not needed by the class at this point in time. If so, then what are our criteria? Well, that would probably be overall ability. We can disregard those with particular academic ability, physical ability, or other abilities that do not fall into those two categories. Putting it simply, think of students with leadership abilities like Horikita. Or students with the ability to rally a group of people, like Yousuke and Kei. Those sorts of people can inevitably be excluded from our list. Of course, if you think that I’m showing favoritism here, you are free to argue with me on those points.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith time running out, our classmates remained silent. No one dared interrupt with needless commentary.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s better that we don’t consider future prospects here, or how things \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003emight\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e turn out,” I added. “Determining exactly how much someone will develop is objectively difficult and requires speculation. So, if we’re going to draw a final conclusion, OAA would be an impartial means of doing so.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOAA was the school’s quantification of a student’s abilities that showed how capable a student was. Feelings were completely out of the equation. As of September 1, the lowest score in our class was thirty-six points overall. Although many students checked their own rank and scores from time to time, not many students knew who was in last place at any given moment.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Right now,” I said, “the student with the lowest score in OAA at this point in time is…Sakura Airi.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t look over at Airi as I spoke. Instead, I scanned the entire class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Huh? What are you saying…? Don’t play stupid jokes at a time like this!” shouted Haruka. She was furious. Haruka stood straight up and glared at me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m just expressing my objective opinion,” I told her. “The class can decide whether or not they agree with it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI planned to continue ahead and ignore things like personal opinions.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Objective?” yelled Haruka. “What’s objective about it?! Who even cares about OAA rankings? So, what? You’re saying that makes it okay to expel Airi? But why would you… Why would you say that, Kiyopon?!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, can you think of anyone who should be expelled?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Th-that’s—!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Someone who isn’t prepared to name a candidate outright isn’t qualified to choose if it’s acceptable, nor do they have any right to,” I interrupted her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what about someone like Ike-kun?! His academic and physical ability scores aren’t that different from Airi’s, right?!” argued Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was certainly true that he was in the running for last place with Airi in OAA. But right now, he had a total of thirty-seven points. Sure, his lead was only one point, but he was still ahead of her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, I’ll simply go ahead and ask everyone for a show of hands, right here and now. All those opposed to Airi being expelled, please raise your hand,” I announced.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka’s hand immediately shot up. Akito’s and Keisei’s went up at almost the same time. Of course, being members of the Ayanokouji Group, it was obvious that would be the case.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Three people, huh. Next, what about the students who oppose Ike being expelled?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSeveral guys, including Sudou and his friends, raised their hands. Several girls did too, including Shinohara, Mori, and other girls who felt obligated to help out Shinohara. In total, there were eleven people who opposed Ike’s expulsion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-why’d…” sputtered Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Building friendships is also an admirable skill,” I replied. “I’d have to say that means she is inferior to Ike in that respect as well.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Could you look Airi in the eyes and say that?!” wailed Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that what you really want me to do?” I asked in return.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was about to meet Airi’s frightened gaze when Haruka stopped me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“N-no! Don’t!” she shouted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We can have a show of hands for Hondou, Okiya, or another student. But they’re not going to have fewer than the three that Airi did,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What is… You have seriously got to be kidding me,” said Haruka. “Okay, sure, we don’t have that many friends in our group. But that doesn’t mean we can just expel Airi like this because of that!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf there were another choice, I would have taken it, but we were long past that point now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But, to be completely honest…losing 300 points would be fatal.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThose quiet words had come from someone from within the Ayanokouji Group—Airi’s friend Keisei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yukimuu, you’re seriously saying that right now?!” said Haruka. “Don’t tell me you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eagree\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e with the idea of Airi getting expelled…?!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“N-no! I’m not for it yet!” he flailed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not ‘yet’? So, what? You mean that you’re going to change your mind and vote for it eventually?! Is that it? I can’t believe you!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“N-no, I’m just…!” sputtered Keisei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen, as if she now understood everything that was going on, Haruka bit her lip and made up her mind.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Gross. I just can’t even. Seriously, what’s wrong with you? I thought we were friends?” she said coldly. That wasn’t just to me, but to Keisei as well as he let his true thoughts slip.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And the same goes for the rest of you too. No one wants to protect anyone. Yeah, I said it. You’re all fine as long as you save yourselves, so you don’t care what happens to Airi, the person you’re not friends with anyway. So, what? You’re gonna prioritize Kyou-chan just because you have a little use for her? And you’ll abandon a girl trying her absolute hardest, who doesn’t cause any trouble for the class? Oh yeah. This totally is just the \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ebest\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e class ever. Wow,” said Haruka sarcastically.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKeisei’s unintentional comment proved to have been careless. It completely revulsed Haruka. No other student would make eye contact with her. They shrunk back in their seats as not to get involved.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, whatever. I’m not letting Airi get expelled,” Haruka declared. “If you insist on it sooo much, you can go ahead and vote for me instead. I’ll happily let myself be expelled.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnlike the strategy that Kushida had gone with, Haruka was trying to protect Airi by volunteering to be expelled herself. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI already took all of that into account though, Haruka. If anything, your words just now only served to put the noose around your own neck.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-wait, Haruka-chan! I can’t let you get expelled either though!” wailed Airi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s fine, Airi. You need to stay here at this school. I\u0026#160;never liked this class to begin with anyway. But still, after I got to be friends with you, and Kiyopon, and Yukimuu, and Miyacchi, every day got to be fun. Even though Yamauchi-kun got expelled, I never thought something like this would happen again. I thought we could make things work, if everyone was together, but…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka then looked over at Chabashira and made a formal declaration. “I’m nominating myself for expulsion. It’s almost time, isn’t it?” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as I had anticipated, Haruka announced that she would take Airi’s place and voluntarily marched up to the gallows.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Listen up, Airi,” she said. “You need to vote in favor for me. And I’m sure the rest of you aren’t gonna have any complaints about this, right? You can protect yourselves this way anyway, so there’s no reason for you to vote against it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But, that’s… There’s no way I could vote in favor of your expulsion!” shouted Airi, telling Haruka that she couldn’t do it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s all right. If I get expelled protecting you, then I won’t have any regrets.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But—!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s enough talking amongst yourselves,” said Chabashira. “We’ll now begin the vote.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBecause of Haruka’s strong will, we were now voting on whether we were in favor or opposed to expelling her. The results were tallied and shown up on the monitor. And they showed…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eRound 21 Voting Results:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e For: 35 Votes, Against: 3 Votes\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough almost every student in class voted in favor, there were three votes against. I figured it was easy for Haruka to guess who those three people were.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Airi!” she yelled in dismay.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, one of those votes had obviously come from Airi herself, without a doubt.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But I just couldn’t do it! I just… I can’t expel you, Haruka-chan!” wailed Airi. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m doing this to protect \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e though!” said Haruka. “And Miyacchi, Yukimuu, what the hell?!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka had been prepared to be expelled, but apparently, there were some students who didn’t want that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t want you to be expelled… I couldn’t vote in favor of that.” Despite the look of anguish on his face, Akito looked Haruka straight in the eyes as he answered her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what, does that mean it’s fine if it’s Airi?!” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wouldn’t say that… But it’s just, if I had to take one over the other, then…I…” stammered Akito.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I’m sorry!” shouted Keisei, suddenly interrupting their conversation. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe stood up and bowed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I… I voted in favor… Because at this rate, our class won’t…we won’t be able to make it to Class A…” Keisei spoke up to tell Haruka how he voted, even though no one would’ve known what he voted for if he stayed silent.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Wait, so then who was the other person?! Who was the other person who voted against?!” shouted Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That was me,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh… Kiyopon, what…?! You know you don’t need to defend me, right?!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I already told you. As part of my newly instituted policy, I should cut the least capable student in this class. I will not be changing this policy from here on out, no matter who comes forward, whether it’s someone who wants to volunteer to be expelled themselves like you, or like Kushida, who tried to get someone else expelled. I\u0026#160;won’t change it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I took a step back right now, we wouldn’t come to a unanimous decision in favor.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hasebe-san… It’s a fact that Sakura-san has got the lowest scores in OAA, and besides… Cutting out the student who contributes to the class the least isn’t such a terrible thing, is it…?” said Matsushita, who prepared herself to take the risk of speaking up in this situation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve got to be joking. Think about if it were you. If your dear friend were expelled, would you be able to laugh happily afterward? I couldn’t. There’s no way I could!” countered Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Airi is the one who should be expelled. There is no other choice at this point,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No… No, Kiyopon! No matter who else is in favor of this, Kiyopon, you… Kiyopon, you and only you need to be on Airi’s side! You \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehave\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to!” protested Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI know that. It’s precisely because I know that, that I’m saying this, Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My thinking won’t change. Haruka, if you continue to go on like this, unable to agree to Airi’s expulsion, then this class will have no other choice but to end things right here,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then why don’t you just go ahead and do whatever you want, huh? I’ll continue to oppose Airi’s expulsion until the very end!” shouted Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust one person. If just one person continued to vote \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e until time ran out, then no one would be expelled. The rule was absolute. And the most effective way to break that rule was…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you, Haruka-chan… It’s okay,” said Airi. She smiled despite her voice trembling. It seemed like she understood everything.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ai…ri…?” stammered Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If there really is someone this class doesn’t need, then… Then that someone probably would be me, I suppose… There’s nothing wrong about what Kiyotaka-kun is saying at all, Haruka-chan.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Airi!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Everything he said was exactly right. If someone must be expelled, then I, the biggest burden for our class, should be the one to disappear.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe most effective method would be for the person being expelled to make their supporter give up on voting opposed, directly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t!” Haruka insisted. “There’s no way I could expel you, Airi! I just can’t! I don’t care if this class doesn’t get to A!!! We’ll all graduate with you, together, Airi!!!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No,” said Airi. “Even if you could save me that way, I’m sure that I’d regret it so, so much. I think I would regret it for a long, long time if we didn’t make it to Class\u0026#160;A because of me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s fine! You aren’t doing anything wrong! This is just me being selfish, protecting you!” Haruka protested.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you… But I couldn’t possibly put that kind of burden on your shoulders, Haruka-chan.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?! What do you… But that’s not…!” sputtered Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePreventing a student from getting expelled was not necessarily in that student’s own best interests. Now that things had reached this point, even if Haruka voted against her, it would cause Airi to suffer.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Self-sacrifice sounds nice,” I said. “It’s got a nice ring to it. I’m sure that the people in this class would be deeply relieved to have someone like you in their lives, Haruka. Okay then, if it really does help make the class run smoothly, then maybe it would be a good idea for us to make a choice like that. So, hey, Sudou, are you willing to sacrifice yourself for the sake of the class?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-well… I… Um…” he stammered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Satou, what about you?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“M-me? Well, I, um, that’s kind of…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Onodera, how about you?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I…probably couldn’t…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if we ask others, their answers will be the same. Basically, no one is going to sacrifice themselves,” I declared.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I truly am fine with getting expelled,” said Haruka. “There shouldn’t be any problem…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Suppose we rely on students who are willing to sacrifice themselves of their own volition,” I said. “Once the class learns to do things that way, the easy way, we’ll keep seeking people who will volunteer out of their own free will when we’re placed in similar situations in the future. It would mean losing our last chance to make fair judgments.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t care… I don’t care about that kind of logic!” yelled Haruka. “I want to protect Airi! That’s all!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if you protect Airi right here and stop her from getting expelled today, she could be expelled tomorrow, Haruka,” I pointed out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t talk to me about an uncertain future!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There is no certain future anywhere. So, we have to choose the best option we can.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo matter how many arguments I strung together, Haruka wasn’t hearing it, even if it seemed like she did. However, Airi \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewas\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, and that was the important part.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’ll be okay. It will all be okay, Airi. All right? I will keep voting opposed to your expulsion, definitely. No matter who else votes in favor, I’ll—!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Everyone… Please…vote for me…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAiri spoke so softly, it was like her voice would fade into the background, but it was loud enough that everyone could hear her. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka grabbed both of Airi’s arms, in a frantic display of resistance. “I hate this,” she said. “I absolutely hate this… We were having so much fun together just until yesterday, and yet…! Even this morning was just a typical morning. I met up with Airi, and we came to school. We chatted about stupid stuff, talked about things like the cultural festival, and… And today, after class, we were going to call Kiyopon, and Airi was going to unveil her surprise! You’re taking that away from me!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe had less than ten minutes remaining in the exam. This was, essentially, the final vote. No one could easily vote \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e this time, no matter who was going to be expelled. That was the weight this final voting session had. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAiri shook her head from side to side and did not grab hold of Haruka’s outstretched hand. She was rejecting her friend’s offer to save her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No! No, no, no!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka shouted and screamed, denying what was happening, rejecting it like a child. Every time Haruka protested, Airi tried to express her gratitude to her, but was still trying to persuade her to accept what was happening.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe situation could no longer be changed. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka, understanding everything at last, sat on the ground as if she collapsed right on the spot.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Someone who doesn’t have any ability accepted the situation and came forward,” I said. “We have an obligation to respond to her wishes. It would be easy for you to vote \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ein the next vote, but even if you did that, Airi likely won’t stay at this school anyway. She’d be torn apart by strong feelings of self-condemnation for having dragged her classmates into this situation, and would leave the school, unable to face forward. Haruka, the only way to save your best friend Airi is for you to vote \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e and make her face forward.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I…!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAiri hugged Haruka while she was still collapsed on the floor. “Thank you, Haruka-chan… Thank you for helping me so, so much, all this time. I couldn’t give you anything in return, but… Please, listen to my final selfish request.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I hate this, Airi… I can’t…” muttered Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Vote in favor for me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAiri thanked Haruka, gently stroking her hair as Haruka sobbed. Then, she addressed Chabashira, speaking up loud and clear.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m nominating myself. Please vote for me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen, after making Haruka get up and return to her seat, Airi returned to her own seat to accept everything that was about to happen. However, even after Chabashira had declared it was time, the vote didn’t end as normal. Even sixty seconds, seventy seconds after the vote started, the period hadn’t ended. Students had a total of ninety seconds of extra time after the sixty-second voting period. That meant that in over seventy seconds, Haruka’s expulsion would be set in stone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe thought, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eif my best friend Airi is going to disappear, then I’ll disappear too,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e may have crossed her mind. If she chose that weak option here, then that would be that. Although the class would suffer from losing another person, we’d still come to a unanimous decision without any issues, because that would mean Haruka’s vote would be eliminated. Now that 100 seconds had passed, Haruka had forty-something seconds remaining. Haruka just kept crying and showed no signs of reaching for her tablet.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“HARUKA-CHAN!!!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was anger in Airi’s voice, something I had never heard from her before. It was also the loudest she had ever shouted. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka quickly looked up in surprise, like someone had slapped her on the back. Airi looked at her crying face, smiled, and nodded. If Haruka didn’t come to a decision and vote right now, then it would be denying everything Airi was doing.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Voting has finished,” said Chabashira. “I will now show you the results.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eRound 22 Voting Results:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e For: 38 Votes, Against: 0 Votes\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira, who had been watching the entire spectacle, forgot to report the voting results aloud. She simply stared at Airi and Haruka. Airi, with her expulsion now confirmed, just looked straight ahead as though she had accepted what had happened. On the other hand, Haruka was struggling desperately to hold back her tears. She couldn’t protect her friend Airi. Despite her\u0026#160;attempts, she couldn’t hide her sobbing from the now speechless class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um… Um, Chabashira-sensei,” said the monitor. \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAhem\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. Please continue.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven the monitor, who had been silent and composed throughout, only uttering the bare minimum necessary to give reminders and warnings, seemed to have forgotten to prompt Chabashira to signal to the students that it was the end of the special exam.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Regarding the matter of the expulsion of Sakura Airi…the final issue is now complete with the class having come to a unanimous decision in favor,” Chabashira said. “The decision has been validated and you will be awarded 100 Class Points. Just as a reminder, there is only one way for you to cancel her expulsion. If you had 20 million Private Points at this moment in time and you used them to…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira was about to continue providing us with the explanation as she was obligated to do, but she suddenly stopped mid-sentence.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I suppose no further explanation is necessary,” she admitted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHypothetically, even if we were to gather up all the Private Points everyone had, there was no way we’d come close to 20 million.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The other three classes have already finished their special exams, so you will be heading back to the dormitories immediately. As for Sakura, you will remain in the classroom for now, but you will come with me to the faculty room afterward.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough Airi responded to Chabashira quietly, unlike her shouts from earlier, she still answered without hesitation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That is all. Everyone, please get up from your seats and leave the room as instructed,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter that announcement, we all got up from our seats, although not all at once. Airi, of course, remained where she was as instructed. Haruka couldn’t seem to stand up. She struggled to get to her feet, but her knees shook, and she couldn’t seem to find her balance well. Her breathing was labored, and she was starting to show symptoms of hyperventilation. Akito, unable to bear the sight, rushed over to her and helped her to her feet, forcing her to stand upright. Nothing good would have come from just leaving her here, after all. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI stepped out into the hallway right away, and my phone was immediately returned to me. Keisei came out after me and called out to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kiyotaka… I’m not going to tell you that you did the wrong thing. It’s just… Still, I… I don’t know if I can say what \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e did was right, I guess. No, there’s no point in me asking you this anyway… Just forget it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though he still had plenty of things on his mind that he wanted to get out, Keisei turned his back to me and started walking down the hall. Even if I waited around for Haruka and Akito, it would likely be pointless. Things like justifiability were irrelevant. There was no way that they \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewouldn’t\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e feel something after I had gone ahead and thrown away a precious member of their friend group.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei approached me. I noticed that she seemed upset and on edge, so I stopped her with a glance. It would probably be better to have Kei settle down quietly right now as well since she was probably grieving over the loss too. There was no need for me to incur hate from others by doing something necessary. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I remembered correctly, Chabashira mentioned wanting to meet with me after the special exam. I looked at my phone and saw that I had received a message, telling me that we were supposed to meet at six o’clock. That was a while off, so I decided that I should leave, figuring that it would be best if I didn’t stick around for too long. Still, I knew if I headed straight for the entrance, I would likely bump into Keisei and other students… In any case, since I had a
