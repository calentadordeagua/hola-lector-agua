e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T340ba,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 8:\u003cbr/\u003eHorikita Suzune’s Choice\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003e“W\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eELL THEN,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I’ll now show you the results,” announced Chabashira.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eRound 10 Voting Results:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e For: 1 Vote, Against: 38 Votes\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a sight I was tired of seeing and it simply kept repeating itself over and over. Even though there were appeals for the person to come forward, the results didn’t change. Despite our repeated discussions, they seemed to have no effect. The number of votes in favor hadn’t increased, but they hadn’t decreased either. Suspicions were running wild, making us wonder if there wasn’t actually such a thing as a fair vote after all, and if this was just the same screen being displayed repeatedly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Since the decision was not unanimous, we’ll now have an interval period,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe could clearly hear the fatigue in Chabashira’s voice as she gave us that standard announcement. Now that she had told us about her past, all she could do as an instructor was watch and see how this issue developed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How is this even happening…? Is there really someone here who keeps voting in favor of it?” asked Keisei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t any wonder why he would want to voice his doubts. Even if we wanted to continue the conversation at this point, we had already exhausted all possible ways of discussing the issue. Just how many times had Horikita and Yousuke tried to persuade this lone voter now?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Would everyone who is against the issue…please raise their hands?” asked Yousuke.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYousuke, seeing that calling for whoever was in favor was futile, requested that the students who were opposed raised their hands. Even though this proposal was a meaningless reversal of the standard question, he remained steadfast in his efforts to make some kind of breakthrough. Students all throughout the room started neatly raising their hands up in the air. I raised mine too, of course. By doing this, we could see that thirty-eight people, Yousuke included, were voting against the issue. The only person who hadn’t raised their hand was Kouenji, but…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I won’t be raising my hand. But do not worry—I am voting against the issue,” Kouenji said in response to Yousuke’s anxiety-filled look.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Like hell I can believe that, Kouenji,” grumbled Sudou. “You’re really the one votin’ for this thing, ain’t you…?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How many times have we had this argument now, hm? It seems that you never get tired of bringing it up.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven for Sudou, there was no other option but to keep going back to Kouenji. It wasn’t unreasonable, after all, if the current situation continued. As of now, it was difficult to believe that another person in class was continuing to lie. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSomewhere out there, a student was proudly raising their hand and to say they were voting \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e but was still voting in favor.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t want to think that there’s someone here with their hand raised right now who is lying to us,” said Horikita. “So, I’m going to try asking each of you, one by one, looking directly into your eyes. If there is someone here voting in favor, please, tell me… No, I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewant \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eyou to vote \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ein the next round of voting.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita struggled desperately during those ten minutes, making every effort she could. Without sparing any expense, she began confronting each individual student. She must have been as exhausted as anyone else, but she couldn’t say that. Everyone answered Horikita’s question while looking straight into her eyes. Everyone, including Haruka, Airi, Keisei, and Akito. And then Ike, Sudou, Mii-chan, and Matsushita. Kushida, Onodera, Okiya, and Mori as well. Every one of them said that they were voting \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEventually, Horikita came to me, the very last person, seated at the far back of the classroom near the door. There was a mixture of impatience and anxiety in her eyes, but they still held a fiery passion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And what about you, Ayanokouji-kun?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m voting \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, of course,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I see.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat meant we’d once again completed questioning each and every student individually. It was practically an interrogation. There hadn’t been any changes in the students’ statements. All our classmates claimed to be voting against the issue. The only thing left for us to do would be to appeal to the pangs of conscience remaining in this person’s heart and ask that they oppose the issue, but…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ten minutes are almost up,” said Chabashira. “Return to your seat, Horikita. The vote is about to begin.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eRound 11 Voting Results:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e For: 1 Vote, Against: 38 Votes\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe results hadn’t changed at all. There wasn’t anything else to say about it. The same results were being shown to us over, and over, and over.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, I can’t take it anymore!” yelled Sudou, scratching his head wildly. “I feel like I’m losin’ my friggin’ mind! I\u0026#160;don’t get what’s goin’ on here!!!” He slammed his elbows down hard on his desk. “B-but seriously, what are we gonna do? We don’t got a lotta time left, do we?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUp until this point, the students had been operating on the assumption that the person persistently voting in favor would eventually back down. The entire class, Horikita included, must have believed there was no way this person would choose to let time run out. Absolutely. Almost. Surely. Probably. Maybe. Anyway, the person voting \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ewould ultimately be afraid of letting time run out. And then, at last, that person would change their mind and vote opposed at the last minute. We’d come to a unanimous decision, and the special exam would be\u0026#160;over. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe class was sure that’s how things would turn out, and then the class would move on to the sports festival and cultural festival next. However…the person voting in favor wasn’t budging. Their answer wasn’t changing even after waiting another ten minutes, thirty minutes, an hour… \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAll that awaited us was the worst possible scenario: running out of time. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe had nine minutes remaining until the next round of voting. But those next nine minutes weren’t \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ejust\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e nine minutes because after that, the deadline would be less than two hours away. Horikita had been fighting hard to overcome this final issue for the past three hours. It wasn’t like her strategies were overly optimistic. Even if I was to do everything in my power to bring the issue to a unanimous decision opposed to the issue, it likely would have been impossible for me. Why was that? What was the fundamental reason?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBecause persuasion, negotiation, and every other kind of action would have been meaningless. This person supporting the issue was simply fighting to avoid a unanimous decision of \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. And what was most frightening of all was that whoever this person was, they didn’t see running out of time as the biggest loss. Normally, that would be unthinkable in a special exam like this. When you looked at this issue objectively, you could see that the priorities of the three possible outcomes were fixed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e ≥ \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e \u0026gt; Time Out\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was an absolute relationship, which was shared between all students from all four classes. It was precisely because this fixed priority existed that this special exam was built upon it. It was a basic premise. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever…what would happen if there was just one single student who had different priorities?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e \u0026gt; Time Out \u0026gt; \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf someone had such distorted priorities, then this issue wasn’t going to be viable. That was precisely why the school was preventing the classes from interfering with each other via strict monitoring and rules. It was to prevent students from signing contracts with the likes of Sakayanagi or Ryuuen, who might invite them to join their class or transfer a substantial number of Private Points in exchange for allowing time to run out in their own class. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis special exam had devolved into chaos because a student who wasn’t aligned with the rest of the class was thrown into the mix. If we continued to stubbornly press on ahead, all that awaited us was timing out. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf that was the case, what should we do? There was only one thing that we could do in the two hours that we had remaining.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnanimous approval.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was the optimal solution. There was no other way for us to press on ahead except for that. This idea was probably already in Horikita’s mind, but she wasn’t taking the plunge. It wasn’t easy to get rid of a classmate, and it would be infinitely more difficult for our class to select one person to expel than it would be to get a unanimous vote of \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. Once we took the first step on that path, there was no turning back. We wouldn’t be allowed to say something like, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Oh, we can’t expel someone after all, so let’s just go back and all vote \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd yet…I was still hesitating to conduct the plan even after it came time to vote. Why? The ideal route was off the table, and the ideal time for me to execute the plan was already approaching. If we used up extra time now, that would present an obstacle when it came to selecting a person to expel after coming to a unanimous decision of \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. But even so, I wanted to try to come to a unanimous decision \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e just one more time, even if it took up precious time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA rather inconvenient feeling, the likes of which I had never experienced before, started to cloud my mind. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWhat kind of decision would you make in this situation?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I thought, asking Horikita Manabu that question in my mind. Though there was no way I was going to get anything resembling an answer, I decided to add an amendment to my plan. I bet on this last chance, but without letting the exit strategy change.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, the results…” croaked Chabashira.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter Chabashira had finished tallying the votes, she stumbled on her words for just a moment.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I-I will show you the results.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eRound 12 Voting Results:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e For: 2 Votes, Against: 37 Votes\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-wait, what?” exclaimed Sudou. “No way, why?! The number of votes in favor went \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eup\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e?!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter all this time, one of the thirty-eight people who consistently voted opposed had changed their vote, now voting in favor. This would likely have a sufficient impact to make a fissure in the united opposition.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s like I’m having a bad dream…” Horikita muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe person who had cast the additional vote was none other than me. It wasn’t like it was \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ejust\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e one vote, though. It was one powerful vote in favor of the issue, cast by one of the thirty-seven people, other than Kouenji, who had previously been firmly united. Horikita hadn’t even considered this option in the slightest before I did this, but now she had her thinking cap back on. She was thinking about what we should do if we couldn’t reduce the number of votes in favor to zero.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita quickly understood that this one vote shifted so we could avoid running out of time. No matter what we ended up voting for unanimously, neither of them would be as bad as what would happen if we failed the exam overall. That would be the worst-case scenario. Even if no one were expelled in that situation, we would still lose 300 Class Points. Assuming that all the other classes finished the exam successfully, that would mean there would be a difference of 350 points between us and them. And on top of that, if there was a class that finished the exam with a unanimous decision in favor, then that would mean there’d be a maximum gap of up to 450 points between us and them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith such a huge gap, it would be impossible to count on being able to catch up to the other classes, even though we had more than a year of school remaining. Actually, no, there was absolutely no way that we could. Even if you avoided expulsion in that scenario, having to give up on reaching Class A was no laughing matter. Once that conclusion became widespread, it was inevitable that students would begin questioning the point of continuing to push for voting \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey would begin to wonder whether it would be easier to get those voting opposed to swing the other way since there was the possibility of getting everyone to change as a group rather than trying to change the stubborn voters in favor. Even if what awaited us afterwards was the immensely daunting hurdle of choosing who would be expelled, it would mean being able to take at least a half-step forward from the deadlock we were currently in.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-hey, so, uh, I guess this means we just have to vote in favor? Right?” asked Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you talkin’ ’bout?” snapped Sudou. “You know that if we do that, we’re gonna have to expel someone, don’t ya?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But dude… If we run out of time, that’s it. We’re finished, y’know?” said Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe united front was starting to gradually erode. People were shifting closer to voting \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. The first people to change their votes would be the students who thought highly of themselves and felt that there was no way they’d be expelled. On the other hand, students who tended to feel that they might be expelled would continue to vote \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. The number of votes in favor would continue to grow internally, secretly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, not a single student would come forward and actually say that they were voting in favor. That was to be expected, because after all, if it became known that someone supported the issue, they might be targeted for expulsion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eRound 13 Voting Results:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e For: 5 Votes, Against: 34 Votes\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThree more votes in favor. People were still loudly ranting and raving, asking who changed their votes, but that was as far as it went.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eRound 14 Voting Results:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e For: 12 Votes, Against: 27 Votes\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe steadily increasing stream of votes in favor wasn’t slowing down, and the number quickly continued to grow and grow. The number of votes in favor reached double digits for the first time, swelling to nearly one-third of the total vote. It was likely that the number of votes \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ewould increase even more in the next round. Now that we had reached this point, we only had about an hour and a half remaining until we reached the overall time limit.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-wait, please wait. If you really think that voting in favor is a good idea, you’re wrong!” Undeterred by the critical situation, Yousuke attempted to appeal to the students voting \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. “I understand that we can’t let ourselves run out of time, but still… That doesn’t mean that a unanimous vote in favor is going to be the resolution we’re looking for. Okay?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right,” said Horikita. “If we do this, we will then need to unanimously choose just one person out of all thirty-nine possible students in the class. That will be far more difficult than it would be to unanimously vote opposed now. We only have an hour and a half remaining. Do you understand that?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn order for us to finish this exam if we were to vote in favor, we would then have to decide who would be expelled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s still not too late,” pleaded Yousuke. “We can make it. I think we should vote against.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m of the same opinion,” said Horikita. “We can’t let ourselves be swayed.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOur classmates continued to struggle emotionally. At this late of a stage, the students were no longer able to make normal, rational judgments about whether it was right to vote \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eor \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“More importantly, I’m sure that you all know that we shouldn’t be voting in favor of this issue,” Horikita went on. “Even though twelve of you are, not a single one has come forward. Isn’t that true?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if the number of \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003evotes continued to increase through repeated rounds of voting, we wouldn’t be reaching ideal unanimity unless I intervened in a big way and forced things back on course. Originally, I was intending to steer things toward a unanimous decision in the next round, but I decided to accelerate my plans and put things into action now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Can I offer my opinion?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh…?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita must not have expected this, as she looked somewhat taken aback when I spoke up to offer my advice.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita, I voted in favor just now, in the fourteenth round,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was technically a lie—I actually started voting in favor starting in the twelfth round and just continued to vote that way, but nobody could prove that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun, why…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why? Because if we keep stubbornly trying to get everyone to vote opposed, we’re going to run out of time,” I argued. “If that’s how things are going to be, then there’s no other option but to vote in favor. I’m sure that everyone already understands that by now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSomeone had to take on this role if we were going to increase the number of votes \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. Satou, sitting over the chair next to me, anxiously stared at my face. Well, no, it wasn’t just her—I was sure that anyone who was worried about this situation was feeling the same way.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s still not going to fundamentally solve the problem here,” Horikita said. “In the end, we’ll be fighting over who to expel.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s true,” I admitted. “But it’s a way for us to break free from this deadlock. Even if we could find out who voted in favor this whole time, I don’t see that person changing their vote. In other words, we can’t expect a unanimous decision \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. However, right now, a unanimous decision \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eis possible. Then, we could put that sole defector on trial, meaning the person who originally voted in favor of it, and have them judged by the thirty-eight other people. It’s a heavy-handed move, but we’d get to a unanimous decision.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was one person who came to both my and Horikita’s minds. Of course, there was no guarantee that person was the original \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003evoter, but Horikita knew what I meant.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“On trial?” Yousuke interrupted, latching onto the latter part of what I said. “Do you think we really have the right to do that just because they were voting in favor?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We do,” I replied. “If we can’t come to a unanimous decision, we won’t be able to move up to Class A. Not a single student in this class would find a person who voted in favor while knowing that fact to be blameless.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-but, but that’s… I’m sure that once we get even closer to the time limit, they’ll definitely change their mind, and—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Closer? We only have a few more opportunities to cast votes. Are you going to take all your classmates along for such a slim chance? The more times we go through this, the fewer and fewer opportunities we’ll have of even getting out of this situation by voting \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. Doing that would mean completely cutting off our chances of reaching a unanimous decision at all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if I hadn’t deliberately spelled it out, I was sure that Yousuke and the rest of our classmates already understood the situation. That being said though, most of the students still hadn’t taken that first step forwards a unanimous decision in favor. They knew the biggest hurdle we had to face would appear after we agreed to the proposal.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure it’s true that a lot of students would be hesitant to vote in favor,” I added. “That’s exactly why I’d like for us to identify who voted that way all this time and adjust our course so only that person would be targeted for expulsion. Doing so would, in other words, mean ensuring the safety of students who are still voting against the issue now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSatou had been listening to me more intently than anyone else as she sat beside me and meekly raised her hand.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m glad to hear that,” she started, “but…if we don’t know who’s been voting \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, there’s no point. I mean, once time starts running out, in the end, we’re not going to have any other choice but to just choose someone to expel at random, and… I’m scared.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we can’t narrow down the list of candidates of who to expel, we could always choose to let time run out,” I said. “But what we need to avoid right now is letting ourselves waste time by refusing to take steps that would allow us a chance to clear this special exam.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI offered further encouragement to help the students who were still hesitating in an attempt to get them to come to a decision.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Also, as Horikita mentioned earlier, I also have some idea of who had been voting in favor since the beginning.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, why not just come out and say it right now?” said Miyamoto. “But wait, hold on, Horikita hasn’t said that person’s name, like, this whole entire time. Doesn’t that mean that she actually doesn’t have a clue? Maybe she was just thinking like, she could get ’em to vote against by bluffing, or threatening ’em a little?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHis theory was off, but it certainly wasn’t unreasonable for him to think that way.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you really got some idea who it is, then let’s all try talkin’ it out with whoever it is, together,” he added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t do that,” I replied. “That’s why we’re doing things this way. The person voting in favor won’t be swayed just because their name is brought up. They’d rather stubbornly stick it out until the very end. I want to avoid that happening.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI said that both as a way to induce students to vote in favor, and also, to offer some mercy from me to the person in question, at the very last minute. If that person had heard this much, they must’ve been keenly aware that I knew they were the one voting \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. And if that person was afraid of being exposed, they might be the only person voting against the issue in the next round.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Prepare yourself, Horikita,” I said. “Your opponent is laying a trap with the intention of taking you down. There’s no other way out of this fight. It’s hunt or be hunted.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita remained silent. Then, I turned my attention to another student.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And Yousuke—I understand your feelings quite well. You don’t want anyone from class to be expelled. If you really want that, then you need to make sure we get results before time is up. Understand?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe day before the special exam, I had repeatedly warned Yousuke about this until I was blue in the face. Even with just a sideways glance, I could tell that he was struggling deeply. I could understand why he wanted to keep resisting.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But, I—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The next vote is going to be a turning point in deciding our fate,” I told him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a difficult decision, but even so, Yousuke wasn’t the same person he was before. He had grown since last year’s uninhabited island exam, and the In-Class Vote, when he was at a standstill.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yeah, you’re right,” he conceded. “That’s… That’s just how I feel, and I can’t cause trouble for the rest of the class…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough Yousuke hung his head low, he decided to move forward of his own volition.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m going to vote in favor,” he said. “Then, just like Ayanokouji-kun said, I think that we should adjust our plans accordingly and expel the person who was voting \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e this whole time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYousuke was the backbone of the class. With his decision, the situation would change even more significantly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The rest is up to you, Horikita,” I said, turning back to her. “It’s time for you to make up your mind so that we can avoid running out of time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe next round of voting was about to begin. The discussion period was almost over.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please,” she said. “Just one more time. Just give me one more chance to come to a unanimous decision \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. If\u0026#160;we don’t get a unanimous vote in opposition in the next round of voting, then… I’ll have made up my mind.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat she wanted was not going to happen. I already succeeded in creating a new situation. Still, the last possible round for the class to come to a unanimous decision \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ehad begun. It took almost no time at all, and everyone cast their votes in seconds. Still, sometimes things diverged greatly between the ideal and reality.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eRound 15 Voting Results:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e For: 1 Vote, Against: 38 Votes\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Damn it!” shouted Sudou. “I friggin’ knew it!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat Horikita did was a dangerous way to try and force the votes back to \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eagain after they had already started swaying to supporting the idea. With the time limit fast approaching, even this last-ditch strategy to bring about a unanimous decision had ended in failure. But now, because of this, everyone understood what was happening: the student who had continued to vote in favor was prepared to run out of time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita, Yousuke, any objections?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI successfully managed to confirm that I had both of their consent. At any rate, the groundwork for a battle to have a student expelled had been set. With the intentions of Horikita and Yousuke, two main players in class made clear, a large number of votes in favor would follow. Still, it was easy to imagine that students who were worried they might be expelled would still hesitate to vote in support of the issue. Those who were resolved to cast their votes against the issue would need to make up their minds about this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If anyone votes \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ein the next round, we will need them to clearly state the reason why,” Horikita said. “We already know all too well how painful it is for us to waste ten minutes on each vote.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was no surprise that some students might still feel disgruntled about the situation since we still had some time remaining. However, our escape route had been completely cut off now since we only had one hour remaining until time ran out. It was a rough job to essentially force the students who lacked the decisiveness to make a choice on their own to come to a decision.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now that things have come to this… We have no choice but to expel someone,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, for real?” said Sudou. “We’re doin’ this?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Personally, I do not want to lose any of my classmates,” Horikita said. “But if we don’t expel someone, our class is going to suffer enormously. We must avoid that above all else.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf you looked at the developments in Class Points up until this point, you could see that the painful outcome of losing nearly 300 Class Points would sting badly. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe interval lasted for ten minutes. The students needed to summon their willpower and suppress the urge to run away and vote against the issue.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eRound 16 Voting Results:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e For: 39 Votes, Against: 0 Votes\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a unanimous decision. When these results were displayed before us, everyone’s fears and anxieties were plain to see on their nervous faces.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unanimously in favor…” muttered Chabashira, almost as though she had long been prepared for everything that was about to happen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe continued the proceedings. Now that we had made this choice, the only way forward was to either expel someone or let time run out. The latter, of course, would mean this class would simply be fighting a losing battle until graduation. That meant that of the thirty-nine students here, someone was going to be leaving the school for good in about an hour. Of course, I already had an idea of who that person should be.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Individuals can be selected either by voluntarily nominating themselves one time or by choosing a student’s name on your tablets, to cast your vote recommending them,” Chabashira explained. “However, please note that, as was explained previously, if there are no voluntary nominations and no one has a majority of the nominations at the end of the interval, the student being voted on will be chosen randomly.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNaturally, many students were looking to me and Horikita now, as it was finally time to decide who would be expelled. A certain type of pressure washed over each of us in succession, and we could practically hear their voices. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHurry! Let’s hear names now! \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was an interval that was infinitely more important and precious than any of the previous ones. While this period was still ten minutes long, we were now going to be required to choose who to nominate for expulsion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, we’ve unanimously voted in favor of the issue… I\u0026#160;would, at the very least, like to wait one interval period to let the original voter have time to come forward and confess,” said Horikita. “That’s the policy I’d like to take here. Depending on the circumstances and situation, we can choose to let time run out and help the student.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, there was no way that a proposal like the one Horikita just made would be accepted without criticism. Students weren’t about to approve of a choice like that as it would mean losing Class Points. However, Horikita was silent from that point onward and began actively listening to and enduring everyone’s complaints. For my own part, I needed to watch and wait for just the right time so I went along with it, staying quiet. It was a dark, harsh time, and students hurled their grumblings at both of us, trying to discourage us from what we were doing.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eObviously, this meant that we hadn’t chosen anyone to be a candidate, and the interval was nearing its end. I\u0026#160;was sure that if students saw their names up on the monitor, they would feel like their heart was in a vice grip. It\u0026#160;was absurd to expect the class to come to a unanimous decision on who to expel right now, especially because this was the first round of voting.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sensei, may I nominate myself?” asked Yousuke.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, I would like everyone to vote for me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd so, Yousuke came forward, nominating himself as a candidate just moments before the interval ended.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eHirata Yousuke will be expelled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor, Against\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis vote had a different weight to it than any of the previous votes we had made. If anyone voted in favor this time, it amounted to nothing else but a direct statement on their part that they wanted Yousuke gone, or at least that they didn’t care if he disappeared.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eRound 17 Voting Results:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e For: 6 Votes, Against: 32 Votes\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe silence was so heavy that you could almost hear every student breathing. While Yousuke must have felt relieved that a majority voted against his expulsion, I was also sure he’d be haunted for some time by those invisible six who voted in favor. Still, knowing Yousuke, he might be more greatly relieved that we were able to overcome this first difficult obstacle via his self-nomination.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Man, what’re we gonna do…?” said Sudou. “Are we seriously gonna expel somebody?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We don’t have any more time.” Keisei, unable to wait any longer, pressed us for an answer. “Come on you two, let’s hear it. Who has been voting in favor all along?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can name the person I have in mind, of course,” I said. “But I know that the circumstances aren’t quite that simple.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not that simple?” Keisei repeated. “We don’t have room to choose anymore. Now that we’ve decided to expel someone, we need to find out who this person is as soon as possible.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were still many students who regretted the decision to vote in favor of this issue. They were feeling anxious. Those people would be worn out emotionally and mentally, feeling like we just wasted ten minutes. They wanted something that would make them believe that voting in favor earlier hadn’t been a mistake.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, um, if things stay as they are and the clock keeps tickin’, people are just gonna get picked at random for the next vote, right…?” said Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was easy to understand why Sudou was so restless. Even Yousuke, of all people, had gotten six votes in favor of his expulsion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dude, don’t worry, Ken,” said Ike. “I’m gonna vote against it, if you’re up… S-so, buddy, you gotta protect me too, okay?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Course, Kanji. Y-yeah. If we got each other’s backs, then we’ll definitely be fine… Right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOur classmates were losing their composure. Among the many voices, a faint sound of crying could just barely be heard among them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Sniff… Hic…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA student was covering their mouth and trying to hide their eyes from sight, but it was clear who was making those sounds.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kikyou-chan… A-are you okay?” asked an anxious Mii-chan, who had rushed over in a hurry. She placed a hand on Kushida’s back.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I’m sorry…” Kushida sniffled. “It’s just, when I started wondering how we ended up in this mess, I… I\u0026#160;just couldn’t stop feeling so overwhelmed with regret, and…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I feel the same way too,” said Mii-chan. “But someone has to… Someone has got to be expelled…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMost of the students in class hadn’t come to such a realization, that this was actually happening. They felt like they were being forced to do something kind of unrealistic.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m just, I’m regretting my choice so bad right now,” said Kushida. “I should have continued to vote against the issue, no matter what…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The same goes for us too,” said Keisei. “But we didn’t have any choice. If we ran out of time, we’d lose 300 Class Points.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe decision was inevitable, which, in his mind, justified the vote in favor.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But still… That doesn’t make the regret of voting for it go away, no matter how much we justify it…!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida voiced her regret over the fact we had unanimously voted in favor, and she had played a part in it happening. Those feelings started to appear more strongly in other students who felt the same way, though they weren’t expressing it in words. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou and Ike comforted Kushida as well. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t blame yourself, Kushida-chan,” said Ike. “After all, everybody’s in the same boat… Right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s so sad… It’s just so sad…” said Kushida, tears streaming down her cheeks. As she wiped away her tears, she held herself tight, her body trembling. Then, she looked back up. “We really had a chance to unanimously vote \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e though, didn’t we? If we kept up our efforts to persuade that person, I’m sure that they would’ve understood eventually, in the end…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s… But the time is…” sputtered Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can certainly understand what Horikita-san and Ayanokouji-kun have been saying, though. We absolutely mustn’t run out of time. Yes, I do understand that… But still, even if we were going to get penalized for letting time run out, we should have been the kind of class where no one got expelled, right?” said Kushida. She was letting out all the thoughts and feelings that had accumulated in her mind.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, but hold on, it’s definitely the person who voted in favor that’s at fault here,” Ike said. “For sure.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No one should be expelled,” said Kushida. “Whether someone excels or not in academics or in sports, that doesn’t matter. It’s trivial. That alone isn’t enough to decide who should be expelled.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer real, honest intentions were to protect even the person who originally voted in favor and caused this situation to occur.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-but, wait, in that case, how are we gonna decide who?” asked Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-well, how about…somethin’ like we all draw straws?” asked Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That wouldn’t work,” Kushida said. “If someone were expelled because of that, then… I’m sure that no one would accept it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter wiping away another smattering of flowing tears with her fingertips, Kushida continued speaking. “I’m going to say something, fully prepared for the criticism I’ll face for it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe put her hand to her chest and made her appeal to her classmates.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I… I think that Horikita-san, as the leader of this special exam…or perhaps Ayanokouji-kun, who encouraged us all to vote in favor… They should be the ones to take responsibility for this situation.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had a feeling this was how she was going to play it. Kushida had made her first move. There wouldn’t be any benefit for her in a student like Ike or Sudou getting expelled here. Her words were filled with a fervent desire—that of the anonymous voter who had continued to vote in favor this whole time. I was sure of it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I feel so disgusted with myself for mentioning their names aloud that it almost makes me hate myself\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e” she said, sniffling. “But we can’t let time run out. Someone must take on the heavy burden of saying it… So, I-I’m prepared to take on the role of being hated… \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHic\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was claiming that didn’t want anyone to be expelled, but if someone had to be removed, then the selection process was inevitable. Just like those who were being removed from class, the person who advocated for this restructuring would also bear a similar suffering. So, according to Kushida, she had taken on that role herself. Naming names required both a reason and a considerable amount of determination. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer statements were expertly worded to make us look like targets to our classmates while not making them suspect that she was the anonymous supporter of the issue. Kushida was much, much cleverer than I’d thought. Considering her position, she wouldn’t be expelled no matter what, even if she remained completely silent all the way until the end of the exam. There were a number of students who would vote against her expulsion because she had many friends and people had a great deal of trust in her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, both Horikita and I had already figured out that Kushida was the anonymous supporter of the issue. In the unlikely event that either Horikita or I raised our hand and started slandering Kushida’s reputation, it\u0026#160;could lead to an unexpected development. She reasoned that it would be effective to suffer a non-fatal wound instead, using this situation as a defensive tactic. Now that she suggested Horikita and me, even if we tried to say something to discredit her, she could convince people that we were acting in revenge against her having advocated that we be removed from the class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You have GOT to be kidding me!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNeither Horikita nor I were the first to object to Kushida’s proposal. It was Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why should Kiyotaka be expelled?” she said. “All he said was that we were going to run out of time, and that we should vote in favor even though it’s a hard decision. What does he have to take the blame for?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yes, you’re right,” said Kushida. “I understand what you’re trying to say, Karuizawa-san. I honestly think\u0026#160;it’s wrong for me to even give his name right here, but… It’s\u0026#160;just, if I didn’t, we wouldn’t be able to move forward at\u0026#160;all.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I would never vote for Kiyotaka to be expelled,” said Kei. “You do know that he is never, ever gonna get expelled if it comes down to it, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, hold up, Karuizawa,” said Hondou. “That’s a little selfish, don’cha think?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Hondou-kun, didn’t you just secretly promise Onizuka-kun that you’d vote no if he got targeted? This isn’t any different,” said Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh… B-but I wasn’t the one who said we should vote unanimously in favor though…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Gosh, you’re sooo self-centered,” huffed Kei. “How can I be sure that he won’t get expelled if I don’t say it? So we can’t go to Class A if we run out of time, huh? Well, so what? Kiyotaka is everything to me. Whether we end up in Class B or Class D, whatever, I don’t care.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei was relentlessly venting her anger, but I needed to make her stop now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kei, stop,” I told her. “What Kushida’s saying is correct. It’s a fair argument.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-but!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had stopped Kei from going any further, but she continued to glare at Kushida. She made no attempt to hide her dissatisfaction and irritation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you let your emotions get the better of you and you keep arguing, then that would mean the question of who should bear the most responsibility for this situation might get confused,” I told her. “Instead of me and Horikita, the people Kushida had said should take the blame, someone else could be targeted instead. You know that much.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei deflated. “…Yeah…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf she had completely lost her composure, I could have reined her in even more aggressively, but that didn’t happen. Kei had enough sense to keep herself in check as long as I gave her a firm order. It wasn’t a bad thing that our classmates were able to speak about what they were keeping to themselves in the back of their minds as a result though.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m just gonna come out and say it,” said Sudou. “I\u0026#160;won’t ever vote in favor of Suzune gettin’ expelled. And all right, sure, we might not’ve been able to get the ideal unanimous decision here, but that ain’t Suzune’s fault. It’s that jerkoff who kept voting in favor originally, stayin’ anonymous and refusin’ to come forward at all. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eThey’re\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the one at fault. I mean, do you guys really think we can even get to Class A in the future without Suzune? Besides, we all agreed that we can count on her, and we even gave her a Protect Point. Right, Yukimura?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yes, you’re right about that.” said Keisei, adjusting his glasses. “We did decide that we should give the Protect Point to Horikita. But, still, if we fail this special exam in the end, then giving her the point will be meaningless. Wouldn’t it be the same thing as losing 350 Class Points?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But I’m sure that as long as we got Suzune here, she can get us back on track!” roared Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This school isn’t that simple,” Keisei responded. “The 300 points that Kouenji earned from the uninhabited island exam was something of a miracle. Putting that aside, think about it. How long did it take for us to get the number of Class Points we have right now? It’s just not very realistic, is what I’m saying. Sure, the loss of Horikita would leave a big hole, but not big enough to warrant losing 350 Class Points.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWould we try to compensate for the 350-point handicap we were in together with Horikita? Or would we fight against the other classes on even ground without her? While it was difficult to express the idea in simple figures, what Keisei was saying was generally correct. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t vote in favor of either Kiyopon or Horikita’s expulsion right now,” Haruka cut in. It was rather unusual for her to interrupt like that. “I think that first, we should listen to what they each have to say rather than hearing about people’s personal relationships and stuff. I mean, it’s just like Sudou-kun said, it’s the person who voted in favor originally who’s at fault here, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida looked up with a start after Haruka suddenly spoke up. Haruka’s explanation wasn’t that of someone standing up for a friend. Rather, she was just saying it was too early to decide anything.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I guess you’re right,” said Kushida. “I uh, I might’ve, um, lost my cool a little bit too… But still, if Ayanokouji-kun says who voted in favor all this time and he’s wrong about it… Actually no, even if he’s \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003enot\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e wrong and he comes out and says that person’s name, I’m sure that whatever relationship Ayanokouji-kun and this other student has is going to be completely destroyed…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could feel a kind of pressure from Kushida that seemed to be telling me, “\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eDon’t say my name, not even by mistake.” \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt any rate, the baton was passed back to me once again.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know we’re still in the middle of discussion here, but I think we should call it here,” I announced. “Ten minutes will be up soon, and we need to decide who to vote for to be expelled. If we don’t, it’ll be a random vote.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Very well,” said Horikita. “We don’t have much time left until we need to vote. I have no other choice. Please vote for me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-hey, Suzune, what’re—?! Whaddya think you’re doing?!” shouted Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we’re going to have to take a vote, then I want to make sure of something anyway,” Horikita said. “I want to verify just how many students want me gone.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita raised her hand and asked that she be the subject of the vote, as though she were testing herself. If there was a unanimous vote in favor of her expulsion, she would be gone. Conversely, if the class voted unanimously against her expulsion, she would be exempt from being targeted again. But if the class didn’t come to a unanimous decision either way, then we’d have to start all over again and someone else to vote on. And Horikita would still be included among the possible candidates.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now then, we’ll begin the vote for Horikita Suzune,” said Chabashira. “You have sixty seconds to vote.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe voted on whether we’d be expelling Horikita from school. How many students would be pushing for her expulsion, I wondered… All the votes seemed to have been cast in about thirty seconds, and Chabashira displayed the results up on the monitor.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eRound 18 Voting Results:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e For: 16 Votes, Against: 22 Votes\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWas I alone in thinking that these results were rather interesting? Objectively speaking, Sudou was the only person who would unequivocally vote against her expulsion. N
