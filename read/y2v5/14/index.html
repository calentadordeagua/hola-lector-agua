ext in line would likely be Kouenji, since Horikita was his sole ally. He wouldn’t want to let her go. On the flip side, this meant that the other students had voted purely after asking themselves if they were for or against Horikita’s removal. Horikita’s presence was deemed not that important to the invisible sixteen who voted against her. However, I supposed there might have been some segment of that group that would just be fine with anyone getting expelled, as long as they weren’t.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What the hell, are you all stupid?!” bellowed Sudou. He shot up out of his seat in frustration. “Whoever voted in favor, put your hands up! Imma knock your lights out!” He probably assumed there would’ve only been a few votes in favor at most.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Stop, Sudou-kun,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Like hell I can!” he shot back.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You making a fuss is only going to waste time,” she told him. “Let’s have a more constructive conversation.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita-san’s exactly right, Sudou-kun,” said Yousuke. “Unanimity is the ironclad rule for this special exam. Even if there are thirty-seven votes in favor, as long as you continue to vote opposed, Horikita-san won’t be expelled.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was right, there was no need for Sudou to get so upset. Just as Yousuke said even if you were dissatisfied with things, it’d be fine as long as you kept just one person on your side. That alone would absolutely prevent you from being expelled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was another peculiarity of this exam. Just a single vote… With just one unwavering vote \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eas your defense, the fate of expulsion could be avoided. On the other hand though, if you lost that one final vote, there’d be nothing you could do to prevent it anymore.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We really don’t have that much time left,” said Keisei. “It’s about time you tell us the name of the student that originally voted in favor.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know,” I said. “But before I do, I’d like to make a suggestion.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A suggestion?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. I will give you a name now, but it’s not like I’ll be able to just give a statement and that’ll be that. If I happen to be wrong about this, I won’t be able to just wave it away and say it was just a rumor.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s… Well, yes, that’s true,” said Keisei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s why I’m not going to just casually say it. And on the flip side, if it turns out that I got the wrong person, I will take responsibility for it and drop out myself.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wha… Kiyotaka?!” sputtered Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe class exploded into an uproar when they heard me say that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A-are you really sure about this?” said Kushida. “Ayanokouji-kun, you… I don’t want any of my classmates to be expelled… And that includes you too, Ayanokouji-kun, you know…?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thanks for your concern, Kushida. But I’m okay,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, you say that you’ll drop out, but Karuizawa-san is going to vote against your expulsion, right, Ayanokouji-kun? So that would mean—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I won’t let her,” I said, cutting Kushida off. “Taking responsibility also means that I’ll prevent anyone from voting against me. If the time comes, I will have Kei vote in favor of my expulsion. Okay?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I-I understand. But I still have faith that it’s never gonna come to that,” said Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I certainly accept what Kushida said about me, to a certain extent,” I added. “I was the one who encouraged the rest of the class to vote in favor of the issue, so I should take part of the blame. However, I’m still of the opinion that the person who stubbornly voted anonymously in favor of the issue the whole time should be the one to take responsibility for this.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, that’s right!” Kei came to my defense. “I mean, come on, this means there’s someone in this class who thought they’d be all sneaky and take advantage of this thing being anonymous to get somebody expelled, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I think so too!” said Airi. “That’s the person who…should take responsibility for this.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, you got that right,” Haruka agreed. “It’s the student who voted in favor all this time who is the bad guy here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAiri and Haruka offered me support. Akito joined in as well, silently coming to my defense.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, have you…made up your mind then?” Kushida gave me one final warning with an anxious look.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I’m going to be naming names, then I need to have my mind appropriately made up and pay the appropriate price,” I replied. “More importantly though, I can speak up and say this, risking my own expulsion, because I’m as close to 100 percent certain as I can possibly be.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I understand,” said Kushida. “In that case, I trust you, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs Kushida said that, she kept a strong gaze fixed on me. Since I was delaying the timing of my announcement, drawing it out like this further increased the other students’ interest. Apart from the one student who had actually voted in favor of the issue this whole time, the rest were anxious and on the edges of their seats. They were waiting impatiently to hear the name of the person who had been voting \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. They wanted a good reason to attack somebody and were waiting for the time to come, when they would shower shouts of abuse until their throats went hoarse.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That person is—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe person I thought should be expelled. The person I had decided to expel. I was going to reveal everything right here and now. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“—Kushida. You.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA silence fell over the classroom. We were now in a world where sound had completely disappeared; you couldn’t even hear the ringing in your ears. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI know, Horikita. I understand almost painfully well the reason you concluded that you had no other choice but to vote in favor, and why you still couldn’t take the plunge\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Kushida hadn’t taken any steps to meet Horikita partway. She continued to cast her vote in favor of the issue without a care, determined to get either Horikita or I expelled like this. Whether or not she realized that it had been a bad move on her part was a trivial matter now. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI decided that it was pointless to try and rehabilitate Kushida, but you wanted to face her head-on until the end. You kept yourself from saying her name for so long, even considering sacrificing the class as a possibility. You may not have been able to save Kushida, but there was no need for you to sacrifice her on your own.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t know what Horikita was thinking in this exact moment, but she was looking over at me much more calmly than I had expected. If that was the case, I had no choice but to fight. I’d be the one to carry the burden of defeating this opponent.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh…?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t just Kushida who said that. The word just spilled out of nearly every student’s mouth in unison. They were unable to understand what was happening.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“M-me?” sputtered Kushida., pointing to herself. She couldn’t believe that her name had been called.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eActually, I was sure that she was already expecting me to call her name. That was exactly why she launched that preemptive strike—she was preparing for it. But even so, I guess that Kushida just couldn’t believe I would really sell her out like this. Perhaps even more so now that she thought she had a few things over me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right,” I replied. “You were the one who stubbornly voted in favor all this time, even when you were being encouraged to vote \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOur classmates had been ready to attack whoever the mystery voter was but were at a loss for words.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“M-maybe you’re… Maybe you’re naming me because I said that you or Horikita-san should take responsibility, Ayanokouji?” said Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHondou, seeing Kushida’s eyes welling up with sorrowful tears, quickly rushed to her defense. “N-no matter how many times you say it, Ayanokouji…there’s no way it could have been Kushida-chan! You’re just doing this because you have a grudge.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That has nothing to do with it,” I said. “I was already thinking that it was her before she even mentioned me. I’ve been thinking it ever since the first round of voting on this issue.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-wait a minute,” protested Kushida. “I’ve been voting \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eup until the very last minute, you know? So why would…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re suggesting I’m making a false accusation? Well, I suppose it’s only natural it would look that way, under the circumstances.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was clear that anyone would look at what I was doing as a random outburst out of retaliation because I was about to be expelled from school.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no proof that you kept voting against the issue,” I went on. “And that’s because the voting was anonymous, of course. However, that being said, I’m going to present what grounds I have for saying that you’re the person who has been voting in favor all this time. Do you have any objections?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That is just so awful… There’s nothing I can say to that,” said Kushida. “Yes, I was the person who brought up your name and Horikita-san’s names first… I was prepared for what was going to come though. Because I decided that even if you slandered me with lies, I was going to sacrifice myself to protect the class.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo matter what Kushida said from here onward, it was all going to be lies. By putting up that line of defense now, she would be able to keep her supporters from leaving her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“First, I’ll tell you the reason I think that Kushida was the one who continued to vote in favor of the issue. That’s because there are people in this class who she desperately wants to have expelled. I’m sure you’re not going to believe me on this, of course, but just hear me out. The people she wants gone are the people Kushida herself already mentioned by name, meaning Horikita and myself.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA considerable number of people were just wondering what in the world I was talking about. Kushida should have been more distraught than anyone else right now… Well, I supposed she was keeping up appearances by looking distraught, but this was a debate where you couldn’t make even a single mistake.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe calmly spoke up once more, choosing her words very carefully. “So, since I gave your names earlier, that’s how this is going to be, huh…” she said sadly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, it’s not like that,” I said. “More than anyone else, Kushida, you’ve thought of Horikita as an obstacle ever since she started school here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that it came to this, I was sure that Kushida should understand what was happening, even if she didn’t want to. I was about to disclose everything I knew about her right here and now, and she couldn’t order me to stop. If she was continuing to play the part of the innocent good little girl, there was no way for her to cut me off.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kushida,” I said. “You and Horikita have something in common that you don’t share with the rest of your classmates. Isn’t that right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? S-something in common…?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though she already knew what I meant, it was necessary for her to act like she was ignorant, at least for the time being. I could have interrupted her act, but I deliberately decided not to. That was because Kushida’s instinct to protect herself would cause her to suffer more from here onwards.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um… Oh, are you maybe talking about, um…that we went to the same junior high? Or something?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was likely that no one else knew about that. Looks of surprise appeared on our classmates’ faces as they heard this for the first time. She had no choice but to reveal that bit of information herself now. It was something she had been desperately trying to keep hidden at all costs up until now, rather than letting me divulge it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right,” I replied. “I’m sure that no other student in this classroom knew about that, did they?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita, the very person we were talking about, was now staring straight ahead at the podium so I couldn’t see the expression on her face. However, I could easily tell that our classmates’ gazes were on me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-wait, hold on a moment,” Kushida said. “What? It’s true that I hadn’t told anyone about it, but it was just because I didn’t have an opportunity to bring it up specifically. Besides, it was a big school. We were never in the same class, anyway… It even took me a while to make sure that Horikita-san even went to my same school.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida was saying that there was no way she could have even considered wanting to expel Horikita from the beginning based on that. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt this point, students who couldn’t just sit by and watch Kushida go through this started to act.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, knock it off, Ayanokouji,” said Ike. “You said that you knew whoever voted in favor, so I shut up and listened to you. But come on, this is Kikyou-chan, y’know? There’s just no way.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOther voices quickly joined in, one after another.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, that’s right. Ayanokouji-kun, isn’t what you’re saying here just absurd?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Like, seriously? You were the one who got us all to vote in favor, and in the end you’re just taking your anger out on Kushida-san and pointing a finger at her. Come on!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, and ’sides, how the heck does going to the same junior high means she wants her expelled in the first place? Wait, or are you trying to say that you went to their same junior high too?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOur classmates were posing perfectly reasonable questions. Discontent and protests erupted, starting with just one person and growing from there. The troops rallied around her one after another without even being asked. There was no doubt whatsoever that this was a powerful weapon that Kushida Kikyou had in her arsenal.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And besides, since when were you like this, anyway? Something has been weird with you for a while now, Ayanokouji.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yeah, that’s true. It’s actually kind of scary, I mean… He always had this quiet vibe about him, and yet…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSome of the students weren’t just covering for Kushida, they also began to show distrust toward me and my unusual behavior.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t criticize him, everyone…” Kushida said. “I’m sure that Ayanokouji-kun doesn’t want to be saying this stuff either. I understand it’s tempting to lay the blame on someone in a situation like this…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe picked up on our classmates’ words with exquisite precision, attacking me while pretending to protect me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re way too nice, Kikyou-chan. You can’t just let him say whatever he wants.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida’s supporters lashed out automatically, nearly stripping me of my right to speak. But I had a weapon of my own to allow me to resist.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun has the floor right now,” said Yousuke, cautioning any student who would try to interfere. “We shouldn’t interrupt him while he has more to say.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seriously, get real, Hirata. What’s even the point of listening to Ayanokouji’s lies anymore?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We should only offer our criticisms, about whether it’s the truth or a lie after he’s said his piece,” Yousuke said. “Of course, if what he says does turn out to be a lie, I will not allow it either.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is it even worth listening to him?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, it is,” Yousuke insisted. “This isn’t just going to affect Kushida-san because she was named. This is going to greatly affect Ayanokouji-kun’s own academic career here. Isn’t that right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had told Yousuke there was a possibility I’d control the votes if our time remaining was running out. There was no way he could’ve known in advance what this issue was going to be, and naturally he was incredibly surprised about this whole conversation about Kushida. As a purely neutral person, he would have to judge things so that there wouldn’t be any errors in our conclusions.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This has nothing to do with where they came from,” I\u0026#160;said. “Or rather, there isn’t much significance to the fact that they came from the same school. However, the truth of the matter is that Kushida has a big secret, from back when she was in junior high.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida started to cry right on the spot. “Please, stop it, Ayanokouji-kun… Stop piling on lie after lie…” Tears rolled down her cheeks.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, come on, Kiyopon,” Haruka spoke up. “Look, I’m your friend and all, but… I think I’m with Kyou-chan on this one. What I’m trying to say is, is this \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ereally\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e a conversation we need to continue?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka was originally a member of the Ayanokouji Group and would defend me, as I said earlier. Haruka had few friends outside of our group, but I knew she and Kushida got along well. Wouldn’t it make sense that she’d try to stop this conflict if she cared about the both of us?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Haruka,” I said. “You were waiting for the identity of the anonymous supporter to be revealed, weren’t you? If\u0026#160;so, then you need to hear everything I have to say.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-but, I mean, Kyou-chan is…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“‘Not like that’? I understand why you’d think so, but Kushida is not who you think she is. I’m sorry, but I’m going to ask that you let me keep going. Her secret lies in her true nature, which she keeps hidden.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kyou-chan’s…true nature?” Haruka repeated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right,” I replied. “The Kushida you see, on the surface, appears to be a good person in everyone’s eyes. She’s kind, considerate, and a perfect model student. She’s someone who is capable both academically and in sports. But what if she was, in fact, the sort of person who was more jealous than anyone else, and only satisfied being the best? What if, as a result of her true nature being revealed during her junior high days, she drove her class to destruction?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Honestly? I’d say it’d be impossible to believe,” said Yousuke. “But even if that were true, it just doesn’t add up. It’s true that in Horikita-san’s case, if she went to her same school, then she might know about her past, sure. But how would you know about it, Ayanokouji-kun? I\u0026#160;can’t imagine Horikita-san would tell you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s because I had the opportunity to see Kushida’s true nature shortly after we started school,” I answered. “I witnessed Kushida acting differently, venting her negative emotions.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven after everything I had said so far, Kushida hadn’t done so much as glare at me. She continued to play the rule of the kind, innocent, good girl just watching a mean classmate tell lies about her. She thought highly of herself and believed that as long as she kept this up, she’d absolutely be fine. Of course, having someone speak poorly of you is bad, regardless if it was true or false, and it would cast a shadow over the remainder of your school life. But this was also a sign of her strong will—she was willing to make a small sacrifice here if it meant getting either Horikita or I expelled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kushida wants to be thought of as a kind person, so she wants to avoid letting people find out about how she really is,” I continued. “That being said, she can’t stomach being put in a situation where her weakness is sitting in my and Horikita’s palms. That’s because she wants to be the person holding the power, standing above others, always.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…You have about one more minute remaining until the interval ends.” Chabashira interrupted our discussion to notify us that time was almost up, just in case.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what are we gonna do?” exclaimed Sudou. “It’s almost time for the next vote!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s… Well, I guess for the time being, we’ll just have to hold a vote for me then,” I said. “Won’t we?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith the current situation being what it was, I figured it was obvious I was going to be next in line.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Stop—!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, someone stopped me. It wasn’t Kei or even Haruka. It was Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s enough… My heart can’t take any more of this…” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“K-Kushida-san?” said Yousuke.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I’m speaking from the heart here, my opinion still hasn’t changed… I don’t want either Horikita-san or Ayanokouji-kun to be expelled,” she said. “I even made Ayanokouji-kun go as far as to lie about me because I brought up their names earlier in the discussion… I don’t want to go through this stressful, painful argument anymore. That’s why… I’ll… I’ll drop out… If I do that, then everyone can go back to how they were before, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida volunteered as an expulsion candidate herself. According to the special exam’s rules for selecting a person to be expelled, a person was allowed to come forward and nominate themselves. That nomination would be accepted without the need for a vote, as demonstrated by Horikita and Yousuke earlier.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you sure about this, Kushida? Once you say you’re nominating yourself, you can’t take it back,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, it’s all right, I don’t mind… Please, everyone, vote for me to be expelled, okay? Please…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that Kushida’s name was entered, a new issue was displayed on our tablets. Kushida’s unexpected self-nomination had clearly upset our classmates.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eRound 19 Voting Results:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e For: 5 Votes, Against: 33 Votes\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTime passed and we voted. The results showed that the class overwhelmingly opposed her proposal.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“E-everyone… Why?” asked Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because there’s no way we could ever get you expelled, no matter what, Kushida-chan,” said Hondou. “Right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe thirty-three students who opposed her expulsion nodded their heads in response, as a strong show of their solidarity.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji,” Hondou added. “I honestly think it’s gross that you’ve been attacking Kushida-chan just so you don’t get expelled yourself.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePutting aside my single vote in favor of expelling Kushida, only four other students seemed to agree with me. Well, while I would have liked to have said “only” four, but to be completely honest, I was surprised that there were even five votes against her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun’s turn next then, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was true that if things continued as they were, there was going to be a vote for me with my expulsion on the line. If that time came, given the current situation, I could expect the possibility that the class would unanimously vote in favor of my expulsion. However, that was only if they could come to a decision on that within the next ten minutes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun, I hear what you’re saying, that Kushida-san’s true nature is different from how she is normally. It’s not like we can just suddenly believe that, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. Besides, has Kushida-san really even tried doing anything to get Horikita-san expelled before? If she really wanted Horikita-san gone, she would’ve done something a long, long time ago, wouldn’t she?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI knew that if I waited for just the right opportunity, people would naturally ask me what I had to say.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because it’s not easy to get a classmate expelled,” I replied. “But you know, I’ve been Kushida’s target at least once before too, in an exam structured like this Unanimous Special Exam.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWithout saying it out directly, I was able to make my classmates dig deep through their own memories, with their own hands.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, the class vote thing… If I remember right, at the time, Yamauchi-kun and Kushida-san were…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat’s right. We had a vote in our classes for the first time last year to expel one of our classmates. As a result of that exam, Yamauchi had been expelled. However, Kushida was one of the people that had been guiding him along, trying to use him to get me expelled. The events of that exam were likely still fresh in everyone’s minds.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you think it’s a coincidence?” I asked. “Both times that we’ve had this kind of test, I’ve been targeted for expulsion. And on top of that, Kushida was involved both times. Everything lines up far too neatly for it to be mere coincidence.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf the others remembered what happened at the time, then surely, they must have thought that something was strange about Kushida then.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s true that I thought it was just a coincidence. Still, Ayanokouji, if Kikyou-chan were intentionally trying to get you expelled, why would she be carrying out such a plan now after doing that?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe student was arguing that she would have done this more cleverly then to avoid suspicion in the future, but things weren’t so simple.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s because Kushida thought that I was on her side. I\u0026#160;doubt she had any idea whatsoever that her secrets might be exposed like this.” I turned to her. “Isn’t that right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…On my side?” she repeated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. Or do I have it wrong, Kushida?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I really don’t know what to do here, Ayanokouji-kun… What kind of answer are you looking for from me?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBasically, Kushida could only either deny what I said or turn around and ask me a question. If she didn’t affirm, then that meant the initiative would always sit with me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Give us some proof, Ayanokouji.” Hondou bullishly came to her defense. “If you’re gonna lay the blame on Kushida-chan any further, we are definitely gonna need some proof.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom the sounds of it, he apparently had intense feelings for Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re right,” I said. “It’s true that it’s probably pointless for me to keep going on about this without presenting anything. So, right now, I’m going to tell you the reason Kushida trusted me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t hurry. I took my time, letting everything I said sink in as everyone listened.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This happened a long time ago. After Kushida threatened me, I made a contract with her that I would give her half of my Private Points every month in exchange for her not trying to get me expelled.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven the faction that supported Kushida looked slightly shocked when they heard this story, a story that no one could have possibly imagined.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Isn’t that right, Kushida?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh…?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEither she hadn’t expected this to come up or she just hadn’t decided how to respond to it if it did, even though it was already floating around in the back of her mind. At any rate, Kushida was at a loss for words. She couldn’t honestly admit that she’s been getting additional Private Points, but on the other hand, it would also be difficult for her to deny that she had been receiving them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if she could manage to fool everyone else into thinking that she wasn’t getting points from me, the truth would come out if someone asked to confirm it later. That was because there were records in her account history that someone had been transferring points to her, and how many were transferred.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what do you have to say? Can you say with absolute certainty that you haven’t received a single point from me?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wasn’t going to let her take her time. Just as I was about to shoot a look over to Chabashira, Kushida gave me her answer, her lips quivering.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yes, it’s true that…I have been getting Private Points from Ayanokouji-kun every month…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida had denied most everything that I had said up until that point, but she had no choice but to admit it this time. If I were to turn and check with Chabashira right here and the teacher confirmed that she could see points had been changing hands, then there’d be no avoiding the fact. It would make the situation get much, much worse for Kushida in an instant. It was doubtful whether Chabashira, as a teacher, knew exactly how many points were changing hands between individuals at any given moment or if she would divulge personal information like that, but Kushida still couldn’t bet against that risk.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-but…it’s for a completely different reason! It’s because Ayanokouji-kun came to me. He said that he wanted me to hold onto the points for him… I haven’t even used a single one of those points, of course. You see?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was receiving half of my Private Points each month, and there were one or two ways at most that she could try to justify or explain that away. She could either say that she had been asked to hold onto them, as she did just now, or she could claim that they were freely given to her. Those were the only reasons she could give. If she had claimed the latter, that they were freely given to her, then she would have to supplement that claim. So, in a situation like this, someone would almost always say that they had been asked to hold onto the points in a situation like that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t give them to you to hold onto,” I replied. “I\u0026#160;was paying the price you had set so you wouldn’t get me expelled.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s a lie…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe deal we made was that I would give her half of my Private Points. I was sure that Kushida remembered that quite well. She even carefully recorded our conversation, preserving the memory of that day. However, I could shut her down, preventing her from using it, depending on how this situation unfolded. If anything, that recording could end up doing the opposite of what she intended. I could turn it into a deadly weapon that would end up piercing her instead.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A lie, huh?” I said. “But Kushida, you told me that you recorded our conversation, for insurance purposes back when we made our agreement. Did you not? If we get that recording from your phone or whatever device you used, you won’t be able to talk your way out of this.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“R-recording? I-I don’t know anything about that…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough she was being pressured, she continued to deny it for now. She probably saved the recording somewhere, but apparently it wasn’t on her phone. I guess she probably didn’t walk around carrying risky recorded data around with her. Well, this would have gone much more quickly if she did have it, but that didn’t matter.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if you hid the recording somewhere we don’t know about, it’s all the same in the end, Kushida. We formed a contract earlier this year, in February. I also recorded the details of the conversation we had at that time. That way, if anything went wrong, I could use it as a weapon.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida looked at me and her eyes went wide. She probably didn’t think I’d do that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I listened to the recording over and over and have it memorized, word for word. ‘I’ll give you half. Half of all of the Private Points I get moving forward.’ I believe that’s what I started with when I made the offer.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re lying,” Kushida protested. “I’ve never heard you say that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You responded by saying, ‘It’s certainly not a bad offer, I suppose. But unfortunately, I’m not really hurting for Private Points. It’s certainly better to have more money than none, but I’m fine where I am now.’” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I don’t know what you’re talking about,” she insisted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you prefer, I can go ahead and ask Chabashira-sensei to bring me my cell phone right now?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t really mind,” said Kushida. “But you can’t do that, can you? We’re in the middle of a special exam right now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, of course they confiscated our phones since students could cheat if they had them,” I agreed. “But I can ask Chabashira-sensei to use my phone and play back the recording for us. That way, there wouldn’t be any concern over me using my phone to cheat.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, I didn’t expect that I’d be granted any exceptions to the rules during a special exam. Still, Kushida, overcome with anxiety, couldn’t help but direct her gaze to Chabashira at the front of the classroom.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If she takes out my phone, then you’re going to be in trouble. All the hard work you’ve put in so far to desperately fool everyone will go up in smoke. But you already know that I’m not going to stop there, don’t you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida was talking less and less. I had to wonder what she was thinking right now. Her back was to me, and her eyes were fixed on the front of the room like she had been frozen in place. Kushida remembered what happened that day, of course. And, being the cautious person that she was, I was sure that she must have checked the audio file herself to make sure that she had a clear recording. She too had listened to it repeatedly. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince I had come out and uttered parts of our conversation word for word, I was sure that at least some of what I had said must have matched the audio that she saved that day.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“‘You might have more than enough points to use for spending money, it’s never a bad thing to have more tucked away for an emergency,’” I said, quoting another part of our conversation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA tremendous change was unmistakably happening in Kushida right now. She was playing the victim up until this point, but she had reached the point where it was no longer possible for her to continue to pose like she was an angel in this class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“God… Just shut up already…” she huffed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOur classmates gulped. They just heard a voice that they couldn’t understand, making them wonder just who that was. The only way for her to stop me from talking more was to reveal her true nature. But if she showed her true nature, then everything would fall apart.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“‘Chabashira-sensei said as much too, I believe. That Private Points may become necessary in order to protect yourself,’” I said, reciting the other part of what I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shut up, shut up, shut up…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI continued speaking, without paying any care to Kushida’s attempts to reject what I was saying or to stop me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“‘No matter how I look at this proposal of yours, it looks like you’re putting yourself at a disadvantage, Ayanokouji-kun. If you said that you were in danger of being expelled from school, then I could understand, I\u0026#160;suppose.’ That was what you said before we made our\u0026#160;deal. I’m sure that if I can have the rest of the class listen to the audio, right here, right now, that’ll settle the matter once and for all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhether I actually had the recording wasn’t really all that important. It was more the fact that what I was saying now matched what we had said in our conversation before was both necessary and important.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Enough already!!!” Kushida screamed. And then she fell silent again.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI knew she must’ve been feverishly going back over what happened back then. As for why we formed a contract, it happened because I wanted to know some first-year students’ weaknesses, their embarrassing secrets. Since I figured Kushida would have known any number of our classmates’ secrets, I went to her, and we formed a contract. When she asked me about quid pro quo, I\u0026#160;offered to give her half of my Private Points in exchange for helping me. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had no doubts whatsoever that the part of our conversation before I made the proposal, when Kushida expressed her wish for Horikita and me to be expelled, would be in the recording. Kushida likely thought that the audio would be a convenient card for her to play, but it was turning out to be a huge mistake. All she did was leave behind a trail of evidence that would end up strangling her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please tell me specifically, right now, where in our conversation I suggested that I wanted you to hold onto my points for me,” I said. “I want to make sure that everyone in class understands.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida’s friends were hoping that this was all some sort of mistake. They watched her anxiously.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I’m sorry.” Kushida mumbled a brief apology.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you saying sorry for, exactly?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, it’s true that I promised I wouldn’t fight with Ayanokouji-kun in exchange for half of his Private Points,” she confessed. “That’s… That is true, which is why…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe wasn’t apologizing to me. She was apologizing to our classmates, admitting that she had been lying.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-but… I don’t think that way anymore! I really do want to be friends with Horikita-san and Ayanokouji-kun. Truly. That’s why I never voted in favor of…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as Kushida was about to appeal to everyone, attempting to capitalize on the total anonymity of the exam, she suddenly stopped. Our classmates’ eyes had changed drastically. The warm looks they had been giving her until now were gone. Even if she really wasn’t the student who had originally voted in favor, it would no longer be possible for her to go about her daily life as she had been. Kushida seemed to understand that completely. But as she looked over at me and there was still life in her eyes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Isn’t the truth here that…you were really the one voting in favor all this time, Ayanokouji-kun?” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You wanted to get me expelled, Ayanokouji-kun. That’s why you acted, to force things toward a unanimous decision in favor. After all, it’s strange, isn’t it? It’s funny that you’re always so quiet and unassertive, but now you’re spontaneously working to get someone expelled…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida was, to many, almost certainly the true offender. However, she was now attempting to shift the blame away from her and onto me. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSorry, Kushida, but I already counted on you to try and use that strategy.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Karuizawa-san.” Kushida brushed back her hair as she turned her gaze to Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What,” said Kei, tersely.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It sounds like you and Ayanokouji-kun are going out. Did you know that when we started school here, Ayanokouji-kun desperately came on to me because he wanted to go out with me?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…What are you talking about?” said Kei. “What is this?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei was able to see things more calmly and objectively than the average person, but even she had her weaknesses. Namely, when romantic feelings were involved, her uncontrollable emotions exploded. Even when I nominated myself as a candidate for expulsion earlier, Kei assertively spoke up in my defense, even though she knew the risks. Kushida must have spotted an exploitable weakness in Kei’s heart then.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t want him to, but when we were in the dark, he even touched my breasts,” Kushida went on. “Did you know that?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh… Y-your breasts?! Wh-what does she mean by that, Kiyotaka?!” shouted Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You really didn’t know about that? He did such a horrible thing to me right after we started school here,” said Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStarting with the guys who had taken a liking to her and then spreading to the girls in class, a wave of disgust toward me began to spread.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I tried to stop him then. I gently admonished him… But I was so scared, I couldn’t do anything…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know this might sound self-serving, but the truth is I never touched your breasts,” I cut in.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“S-see?!” Kei exclaimed. “That’s what Kiyotaka says!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s true, but that’s all he can say in this situation,” Kushida replied. “But Ayanokouji-kun really did touch my breasts.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kushida,” I said. “I hate to say this, but isn’t this kind of shameful for you to do?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It might not be like the recording we talked about earlier, but I have evidence of my own,” she insisted. “I have the uniform with Ayanokouji-kun’s fingerprints all over it. I kept it as it was back then. What would happen if I were to present it here? You know what I’m getting at, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as I used the cell phone recording, she was trying to do something similar back to me. If her claims were later proven to be true, I would be the one in a tight spot.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Explain to me what’s going on,” said Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was listening to this story objectively, and it made sense that she would want an explanation for this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There isn’t a shred of truth to it,” I told her. “At any rate, there’s something else I wanted to comment on, before even getting to whether it’s true or false. You mentioned having clothes with fingerprints on them, but how well-preserved are they? If this happened right after we started school, then that means a year and a half has already passed. It’s not easy to pull fingerprints from clothes, and on top of that, if they aren’t well-preserved, then of course you’re not going to get anything from them. I find it highly unlikely that you would be able to get fingerprints from that uniform.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven clothing has uneven surfaces due to the stitching, and that would make it difficult to see fingerprint marks. And considering other factors such as exposure to ultraviolet rays, humidity, dryness, etc., I could say that it would be 100 percent impossible to get prints off them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Ngh.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eJust like the recordings you have, none of the cards in your hand are viable. The same goes for whatever others you have, no matter how many there are. You can’t just come up with any excuse and try to talk your way out of this. I\u0026#160;won’t allow it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides,” I added, “if you really had been victimized like that in the first place, then you should have reported it immediately.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why… Why… Why… Why…?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida came up next to me and grabbed me by the collar. Her glare was intense. She was furious, but I simply continued to talk to her in a matter-of-fact manner.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And then there’s one time you worked with Ryuuen to try and get Horikita and me expelled. What about that?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI exposed Kushida’s deeds to the class one after another, bringing them into the light of day. Even if I provided new information here that was partly wrong, it likely wouldn’t make a noticeable impact.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why? \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWhy?\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e!\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e” she screamed, gripping onto my uniform even more tightly. “Why are you betraying me?!?! Did you forget that you promised not to antagonize me?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I never had any intention of antagonizing you, of course,” I told her. “I wasn’t even interested in the fact that you have a two-sided personality. That was why I wanted to come to a unanimous decision, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, without my or Horikita’s names coming out. But since someone must be expelled, I had no other choice. I’m doing this to protect my classmates.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith a few simple words, the false bonds that Kushida had created with her “friends” she had steadily accumulated over the past year and a half all came crashing down in an instant. No one could say anything. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida relaxed, beginning to calm down. “Oh… Well… It’s hopeless, then,” she said. “It’s over.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was a look of resignation on her face, as if she understood everything now. Her face contorted in disgust at her shame. But then she quickly regained her composure, stifled a chuckle, and removed her hands from my collar. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe sighed. “Ugh… I guess this means I really was an idiot, after all. That deal was a huge mistake…” Kushida’s anger dissipated in an instant and now she spoke in a calm, detached way. “I thought I understood that you were a formidable opponent, Ayanokouji-kun, but I still never imagined that you’d betray me here. It was just outside my expectations, I guess.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-you’re kidding, Kikyou-chan… Everything Ayanokouji-kun said just now was a lie…wasn’t it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A lie?” asked Kushida. “Unfortunately, no, it’s all true.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But… Why…?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because some things must be protected at all costs, no matter the sacrifice. Don’t you understand that? Forget it, there’s no way you’d understand.” Kushida sighed again. “Ugh… I’m done with all of it now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe shrugged her shoulders and spoke confidently, like she couldn’t feel her own predicament. “It’s true. I\u0026#160;couldn’t \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003estand\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Horikita-san and Ayanokouji-kun being around. I couldn’t forgive them for knowing the secret I kept hidden. I’ve been trying to get them expelled for some time now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was certainly surprised to see what this last issue was,” I said, “but even so, you surely knew it wasn’t going to be easy to get us removed, right? You knew what would happen if you tried to force things, didn’t you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if she hated us, she still would have had plenty of time to pull back. She didn’t have to rush here. But even so, Kushida continued to vote in favor of the issue, a repeated action that could have been described as crazed. To that point, I had this nagging feeling that this was rather out of character for her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt that moment, Kushida’s eyes darted around a bit, and she seemed shaken. It quickly faded. Before the special exam, Kushida asked Horikita to be the leader of the class. It was almost as though she was anticipating that an issue like this was going to be on the exam, but…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It didn’t really matter… I just couldn’t stand the situation. People kept finding out about my past,” Kushida sighed. “I knew it was going to be extremely difficult to get Horikita-san expelled. But I couldn’t resist the urge to try anyway.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven the students who continued to stand up for Kushida could no longer find the words to speak. Still, her friends couldn’t take too much blame over what happened, even if the truth was that Kushida really had been planning to get Horikita expelled. Kushida was still guilty of making the class take the route of expelling someone by continuously voting in favor of the issue. Even so, it was difficult to say whether that was enough to get the class to vote unanimously in favor of expelling her. To make sure that she absolutely was removed from the class, we would need her to cause even more damage.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can’t get Horikita or I expelled,” I told her. “Too bad.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess that settles that. I’ll be expelled in the next vote,” she said. “So, by sacrificing me, you’ll get Class\u0026#160;Points, right? Good for you, everyone. I guess you’ll be able to become Class B thanks to this.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe spoke to everyone in such a detached tone that it was impossible to imagine that she had been good friends with all of them just until this afternoon.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no way you can turn the tables any longer,” I\u0026#160;replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah ha ha, yeah, you’re probably right about that. But…” Kushida paused there for a moment. Then she brought her face in close, approaching my neck, and whispered to me coldly. “…I can at least show a little resistance, can’t I?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though she spoke in a whisper, it was still loud enough for other students in the class to hear. It was safe to assume that Kushida was already emotionally prepared for this without the need for me to provoke her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s pointless,” I told her. “You don’t have any friends who will vote against your expulsion anymore.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re right, I don’t. But if I’m going to be expelled anyway… I just need to destroy everything on my way out.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida’s true nature, the thing which had caused her entire class to fall apart during her junior high school days, was emerging.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…What are you saying?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t you understand? There are secrets in this class that only I know. And there’s still time left in this interval. I figure I’ll go ahead and tell everyone everything.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You won’t gain anything by doing that, though…right?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But I won’t lose anything either,” she argued. “I’m sure this is going to cause trouble for you too, Ayanokouji-kun, so I think I’ll go ahead and get started.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eYes, that’s good. Let out all the secrets and the stress that you have been holding onto and letting build up. I’m sure everyone will be shocked and terrified by how twisted you are. Only when any room for sympathy disappears will there be a possibility for a unanimous decision.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s see, aside from Karuizawa-san, who I touched on earlier… Oh, that’s right,” Kushida said. “Shinohara-san, you talked to me about lots of different things, didn’t you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe first person chosen to be the target of the countless slings and arrows that Kushida had ready to aim at most of the girls in class was none other than Shinohara Satsuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-wh-what?!” squawked Shinohara.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shinohara-san isn’t particularly cute, huh. If anything, she’s a little on the ugly side, don’t you think? Maybe that’s why only the unattractive guys like Ike-kun and Komiya-kun come on to her. Karuizawa-san, Matsushita-san, and Mori-san, you all said those things. You found it \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eso\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e funny, and you were all laughing about it, weren’t you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOne attack instantly split into many, and student after student was targeted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“S-stop it! I never said anything like that! Stop lying!” Mori denied it immediately, but Kushida had no intention of laying her arms down.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh? You were the one laughing
