d no talent for drawing… (Well, that’s what I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewanted\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to say, but I was too embarrassed to be specific.) Anyway, I digress, but I cried when I saw that a girl I was good friends with wrote “being able to meet Kinugasa-kun” in the section about the best things that happened in junior high. I guess there are some things that are best left unnoticed, huh?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJokes aside, the second semester of the second-year story arc has officially started. This semester is packed with major events, and the cultural festival and school trip in particular will be new kinds of stories as they were things that didn’t happen in the first-year arc. I sincerely hope that you’re looking forward to what’s to come. Please sit tight!\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLooking back on this fifth volume, almost none of the students from the other grade levels made an appearance this time. I was thinking it really \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehas\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e been a long time since there was a story like this, with just this group of characters. The stories of the first-years and third-years will continue to develop, but this volume served as a reminder that the focus of the story is on the students currently in their second year. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMoving on, I have a little announcement to make! To be honest, one of the things that I’ve been eagerly looking forward to for a long time but that I just couldn’t seem to make a reality was a manga of the second-year arc. However, I’m pleased to announce that we’ve finally reached the stage where I can tell you all about it. The manga version of \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eClassroom of the Elite Year 2\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e by Xia\u0026#160;Sasane-san will be serialized in Japan starting in the December 2021 issue of \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eMonthly Comic Alive\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. Thank you so very much! Also, I would once again like to express my deepest thanks to Yuyu Ichino-san, who is continuing to draw the first-year arc manga. I would like to extend my gratitude to you all for turning what I couldn’t do into a reality.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLastly, there’s something else that I’ve been keeping in the back of my mind for the past two years now, and I’m hoping I’ll be able to touch upon it in the postscript for the next book, which will be volume six.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, the next time we meet, it will be the start of 2022! See you next year!\u003c/span\u003e\u003c/p\u003e\r\n\r\n\u003cdiv class=\"p.P_Centre\"\u003e\r\n\u003cp\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Epilogue: Postscript\",\"volumeId\":\"y2v5\",\"chapterIndex\":16,\"prevChapter\":{\"volumeId\":\"y2v5\",\"chapter\":15,\"title\":\"Chapter 9: Farewell to the Past\"},\"nextChapter\":\"$undefined\",\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\
