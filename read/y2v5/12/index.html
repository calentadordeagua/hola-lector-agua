pan style=\" font-size: 1.00em;\"\u003e“If you want me—no, I mean, if you want \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eus\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to vote against the issue, then step down as class leader, right here, right now. If you swear to that right in front of us all, you’ll get more votes opposing the issue for sure.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo matter how much Tokitou hated Ryuuen, he also knew how difficult it would be to get a unanimous decision in favor of the issue. That was exactly why he was proposing this compromise.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, don’t be so boring,” said Ryuuen. “You aren’t confident you can get me expelled?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t make me laugh. If the decision is unanimously in favor, you’ll be the one who gets expelled, Ryuuen.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_6\" src=\"/hola-lector-agua/images/books/y2v5/OEBPS/Images/INTERIORIMAGES_6.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“May I ask you one question, Tokitou-kun?” Kaneda raised his hand, adjusting his glasses. “It’s certainly true that, should we fail the special exam, it’s logical that part of the blame would fall upon the leader. However, if we were to come to a unanimous decision in favor of the issue and initiate the process of selecting who to expel, you would most definitely be the one to be expelled, no? Because in truth, many students have continued to vote against the issue as instructed.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTokitou wasn’t shaken in the slightest in the face of Kaneda’s calm and collected explanation of the events that he saw laid out ahead.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The votes against the issue right now mean nothin’,” Tokitou replied. “Don’t tell me you actually think all of those votes are people who submit to Ryuuen. Do you? Yeah, there’s only a few people who can openly rebel against him, but still. Right now, there are four other votes in favor besides mine. That means even though he stood up there over and over tellin’ us to vote \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, there are still four people who voted \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. That just goes to show how many people with strong backbones are here, who want \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e gone!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Compared to Yabu and Morofuji, you seem like you got a lot more sense, Tokitou.” Ryuuen gave Tokitou a round of applause in admiration and praise. Then, he continued speaking. “In that case, don’t hold back. How ’bout you and I have a go, Tokitou? One-on-one.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll force all thirty-five people who have been votin’ against the issue this whole time, myself included, to change their votes. And when that happens, we’ll start voting on who is gonna get expelled, just like Kaneda said. What’ll happen next is simple. You and I are gonna have ourselves a showdown in votes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf other students weren’t going to be eligible targets in the decision of who would be expelled, there was no reason for them to fear a unanimous vote in favor.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You sure about this?” said Tokitou. “If you eliminate all the \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e votes right now, that means it’s gonna be inevitable. Someone’ll get expelled. And there ain’t no way you’ll be the one to survive, Ryuuen.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eGiving Ryuuen the possibility of ending the exam with a unanimous decision of \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ewas Tokitou’s way of being merciful.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen shrugged. “Everybody wants to avoid runnin’ out of time. In that case, we’ll settle things with a one-on-one showdown. You against me. That would be way more interesting for all the folks in our class, wouldn’t it?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no chance that Ryuuen would accept Tokitou’s proposal. Instead, he advocated for a unanimous vote in favor.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“People are selfish, they’re gonna look out for number one,” Ryuuen went on. “Nobody’s gonna be thrilled about comin’ forward if there was a risk they could get expelled. They couldn’t do it. But if it’s just gonna be either you or me who gets expelled? Well, that’ll make their eyes light up. They’ll be all too happy to vote on it if they’re promised a hundred points as a reward.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You think the people votin’ in favor right now are gonna agree to expel \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eme\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e?” asked Tokitou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well now, who can say?” said Ryuuen. “But hey, if you’ve got a bad feelin’ about this, you can always vote no. Y’know?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To hell with that!” shouted Tokitou. “If anybody’s gettin’ expelled, it’s not gonna be me! You’re gonna be the one out of here, Ryuuen!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Then let’s get on with it and have ourselves our little showdown, one-on-one.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were the four anonymous voters who continued to support the issue, and there were also students who disliked Ryuuen but continued voting against the issue because they had no choice. Tokitou was confident that if they were voting on whether or not to expel Ryuuen Kakeru, then as more time that passed, the more votes there would be in favor of it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fine.” Tokitou said. “If you insist that strongly, then—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as Tokitou was about to go along with Ryuuen’s provocations and readily accept his challenge, someone banged on their desk. The sound echoed throughout the room.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait a moment, Ryuuen. Couldn’t you give Tokitou just a little time?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe source of both the sound and the voice that spoke up was none other than Katsuragi. He hurriedly stood up and called out to Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? What do you think you’re doin’, Katsuragi?” said Ryuuen. “I don’t remember givin’ you the right to speak. Do you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I do not intend to be robbed of my right to speak,” Katsuragi replied, unwavering. He ignored the order to shut up and then turned to Tokitou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not wrong for you to think that, because like you said, as long as there’s someone who doesn’t obey Ryuuen, there’s no need for you to worry. However, what Ryuuen says is also true. If we hold a vote on the issue with the condition that we’ll be deciding only between you and him, the class’s emotions will be greatly shaken during the remaining time we have left. If that happens, then the person who controls the majority, meaning Ryuuen, will have an overwhelming advantage.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I told you,” Tokitou replied. “Don’t just assume that he actually has the advantage here, Katsuragi. Truth is, a lot of people in class don’t love Ryuuen bein’ here. They’re just being held down by force. They’re frustrated. If time starts runnin’ out, then I’m sure more and more people are gonna stop defendin’ him. Even someone like that dog over there, Ishizaki.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The hell you just say?!” shouted Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You stood up to Ryuuen once before,” Tokitou told him. “Remember your rebellious spirit!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Th-that was—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLast year, there had been an incident: Ayanokouji was called to the roof and there was a fight. In the aftermath, the story was that Ishizaki defeated Ryuuen, and temporarily took control of the class afterward. That was what Tokitou was referring to.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know what happened back then,” Katsuragi said. “But do you think you’ll win this in the end?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I do,” replied Tokitou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then allow me to ask you another question. If Ryuuen is expelled, who is going to lead the class after he’s gone?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We can discuss it or whatever, but it’s not gonna be an outsider like you, Katsuragi.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s certainly true that as an outsider, I might not be an option,” Katsuragi conceded. “But it’s also true that if a clear leader doesn’t appear, we won’t be able to make decisive moves going forward. We will not be able to catch up to and overtake Sakayanagi.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi took a broad view of the situation, looking at the big picture. He kept trying to explain that to Tokitou, but Tokitou wouldn’t budge.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Give me a break… So what?” he scoffed. “If I wasn’t prepared to cross swords with this guy, even if I had to sacrifice myself to deal a blow, I wouldn’t have come forward, from the beginning.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eKu ku ku\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, from the beginning, huh? It looked to me like you took quite a long time just waitin’ and watchin’.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shut the hell up!” snapped Tokitou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, guess that makes sense, since you couldn’t really do anythin’ without havin’ a few like-minded people there with you,” Ryuuen said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter all, it was only after Tokitou confirmed there were several voters going against Ryuuen’s orders that he had made his move.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please, Ryuuen,” said Katsuragi. “Give Tokitou a chance.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen heard what Katsuragi said and interpreted it to be solely to his advantage.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe snapped his fingers. “All right. Tokitou, I’m gonna give you a chance. Everything’s gonna come down to your one vote in the next round. If you vote in favor, then I’m gonna have you expelled.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hah… Big talk. You think you can get me expelled?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I do.” Ryuuen said. “In the next round, every other vote except for yours will be against the issue. Which means it’ll be one vote \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, and thirty-nine \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. That’s the situation. So, if you vote against the issue, it’ll be unanimous, and we’ll be done here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, hold on. When did the four other people who voted in favor besides me disappear?” said Tokitou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eKu ku\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e… Well, I flipped those four votes during the interval.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Enough with the lame jokes. There’s no way you could’ve done that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAside from the fact that Ryuuen himself had stubbornly been in favor of the idea up until this point, he had spent most of this interval period talking with Tokitou. He hadn’t even tried to talk to any others to get them to change their votes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then let’s put this to the test,” he said. “You vote in favor as you’ve done all this time. Do that, and you’ll find\u0026#160;out.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTime continued to tick by during this interval. There was now less than a minute remaining. Although the air-conditioned room was kept at a comfortable temperature, sweat was slowly starting to trickle down Tokitou’s back. Ryuuen was merely threatening him; it was just a bluff. It was hard to imagine that anything had actually changed during the interval. But…what if all the other voters in favor really had changed their votes? That would indicate that those four other students were following Ryuuen. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTokitou could have employed the same defensive measure that Ibuki mentioned—he could vote against the issue when the rest of the class was going to vote in favor before they could come to a unanimous decision. But Tokitou couldn’t go that route now. It would be disgraceful. At any rate, a deciding vote between him and Ryuuen was likely inevitable. And if that happened, it was a certainty that Tokitou would be defeated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re prepared for expulsion, aren’t you?” said Ryuuen. “Don’t hold back. Vote in favor.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…You don’t have to tell me twice,” said Tokitou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSoon, the time would come for them to vote. Tokitou cast his vote in favor of the issue, without looking back.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, I’ll show you the results,” announced Sakagami, displaying the voting results on the monitor.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eRound 13 Voting Results:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e For: 2 Votes, Against: 38 Votes\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wha—?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen Tokitou saw those results, he was sure his heart was racing more quickly than anyone else’s. It was almost just like Ryuuen had said. Nearly all of the other people who were voting in favor had changed their votes. Only one person hadn’t.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hah. Now that’s certainly a shock… But this just means that there’s still one other student here who has got a strong will like me! Someone else who didn’t give in, no matter how much you threatened ’em!” bellowed Tokitou, as though he were declaring victory. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Ryuuen wasn’t looking at Tokitou. Instead, he was looking at someone completely different.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s the meanin’ of this, huh? You voted in favor, didn’t you, Katsuragi?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What…?” asked Tokitou, shocked to hear Katsuragi’s name.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right,” Katsuragi replied. “If I had voted \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, then it would’ve been one vote \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e and thirty-nine \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, as you declared. That means it would’ve gone on to a deciding vote. If that happened, it would’ve been impossible for us to get through this exam without one of the two of you being expelled.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s the way it should have gone, yeah,” said Ryuuen. “And depending on the explanation you give me right now, you might not get off with just an apology.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have one reason. I think that Tokitou is a student this class needs. Well, actually, not just Tokitou. Yes, I am an outsider and came to this class from Class A. However, that is exactly why I’ve been able to look at this class with an objective eye. As a result, I can tell quite clearly that there isn’t a single student here who isn’t needed.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re sayin’ that Tokitou is a student we need? Somebody who doesn’t follow directions?” asked Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. Actually, I would consider him a valuable asset. He’s someone who can disagree with your opinions without hesitation, like I do. No, actually, even more than I can. Of course, that being said, the way he did it in this particular case, in a special exam, was wrong. I wasn’t impressed by the fact that he put the class in danger just to take you down, Ryuuen.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi wasn’t only going to address Ryuuen. He turned to speak to Tokitou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you don’t like the fact that Ryuuen is the leader, make your case fairly and honestly in a way that doesn’t involve anyone else. If your argument is correct, then I will not hesitate to take your side.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Katsuragi, you…” huffed Tokitou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you fall for Ryuuen’s tricks here, you’ll be expelled from school having accomplished nothing. We’d all move forward and Ryuuen won’t even remember that a student named Tokitou Hiroya ever existed.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-but, what about the four other people who voted—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was referring to his invisible reinforcements who had helped push Tokitou to this point. The foundation for his courage.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There were no such people from the very beginning,” Katsuragi told him. “It was an illusion.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“An illusion…?” repeated Tokitou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To be precise, I suppose I should say that they were weeded out through repeated voting. Five votes in favor remained after Yajima’s was called out. That included you, Tokitou, and…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi paused and slowly turned around, directing his gaze elsewhere. He pointed at other students one by one. “Shiina, Yamada, myself, and…Ryuuen. The four of\u0026#160;us.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi gave Tokitou an answer that neither he nor any of their other classmates could understand. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh… Wait, what are you talking about? Ryuuen was…voting in favor too?” asked Tokitou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When there were only five votes \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, that meant there was really only one anonymous vote remaining. However, everything came to light when you stepped forward,” said Katsuragi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So during this entire interval, Ryuuen was just mocking me in his head, huh… That figures,” huffed Tokitou, dejected.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not true,” said Katsuragi. “While our intention \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewas\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to smoke out whoever was voting in favor, when you came forward, that matter was settled. You could have simply stayed silent and kept voting, not challenging anything. If that happened, the vote would’ve naturally resulted in a unanimous decision \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, and the next vote would have ended with an expulsion.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So you were playing word games just to insult me?!” snapped Tokitou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, we weren’t. We were giving you the possibility of \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003enot\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e being expelled,” said Katsuragi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wha…?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, you pushed on ahead, not noticing that chance. I suppose that was because you didn’t think that Ryuuen would give you one, even if it was in a roundabout way.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I…!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Still, no matter how much I try to convince you, if you won’t listen to me, that’ll be the end of it. I’m sorry that this has taken up so much time, but please give Tokitou one final chance, Ryuuen,” Katsuragi said. “I would like you to give him one more opportunity to vote \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, before having everyone else vote in favor of the issue.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“One more chance?” asked Ryuuen. “You think that I’m that nice?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You also share some fault here. You were overly argumentative and completely overlooked the idea of saving someone. Now that everything has been revealed, you can finally give Tokitou a choice.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And if he doesn’t cooperate, you ain’t gonna object to me expellin’ him, will you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I won’t. You can do whatever you like.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi closed his eyes and crossed his arms. Now, the matter of deciding Tokitou’s future was in Tokitou’s own hands. If he voted in favor of the idea, there was a 100 percent chance he would be expelled. On the other hand, if he voted against the issue, it would be a unanimous decision and he would avoid expulsion. However, voting against the issue would still mean submitting to Ryuuen in some form. It would be a serious blow to Tokitou’s pride.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now then, we’ll begin the sixty-second voting period,” announced Sakagami.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt the same time he made that announcement, the countdown began. All thirty-nine students except for Tokitou finished entering their votes within the sixty-second time limit…and the counter continued to run. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakagami looked up and glanced over at Tokitou. “As was explained to you in advance, if you exceed sixty seconds, you will accrue penalty time,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTokitou stared downward, alternating glances at the two words displayed on the tablet: \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e and \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Damn it… Damn it!” he groaned.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis should have been the signal fire marking the start of a counterattack, he realized. However, it had turned out that Tokitou had been alone the entire time. He had been dancing solo in the palm of Ryuuen’s hand through all of it. He felt frustrated, embarrassed, and pathetic. All sorts of negative emotions took hold of Tokitou’s heart and wouldn’t let go. For a moment, his pride was clear on his face, like he was saying he was not about to give in to Ryuuen here.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe could go out in a blaze of glory. Or he could intentionally vote yes instead, in order to buy himself some time. If he continued to vote opposite the thirty-nine other students, he might also be able to make the class fail the issue in the end. The exam would end not with his expulsion, but by him making the entire class fail the special exam… \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThose thoughts flashed through his mind, but Tokitou quickly shook his head to dispel them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was nothing for him to gain, not even if he did those things to try and resist Ryuuen. It would only cause more trouble for his classmates and make them hate him more than they did Ryuuen. That was not what Tokitou wanted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“God… DAMMIT!!!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTokitou lifted his arm up high in an exaggerated motion and slammed his finger down on a button to cast his vote. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…All votes are now in,” said Sakagami. “I’ll show you the results now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe teacher paused to take a breath, fiddled with his tablet, and displayed the results on the monitor.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eRound 14 Voting Results:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e For: 0 Votes, Against: 40 Votes\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s unanimous—the class has voted against the issue. This concludes the special exam.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone had thought that chances were high someone would’ve been expelled from Ryuuen’s class. But the exam ended with all students remaining. Ishizaki turned to look back at Tokitou, about to say something to the downcast Tokitou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tokitou, you—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Don’t get the wrong idea here, Ryuuen,” Tokitou spoke over him, addressing Ryuuen instead. “I don’t approve of the way you do things. If I decide that your way is gonna prevent us from moving up to Class A, I will take you out, no matter how many times I gotta come at you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then come at me any time,” Ryuuen replied. “I’ll take you on without mercy.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmph…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt would have been awkward for Tokitou to remain in the classroom any longer, so he left as quickly as he could. After watching him leave, Katsuragi walked over to Ryuuen’s side.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You overstepped, Katsuragi,” Ryuuen told him. “I\u0026#160;was welcoming the idea of someone gettin’ expelled, remember?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure half of you was. But the other half of you was open to exploring other possibilities, yes?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The hell are you on about? Do I look that nice to you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know whether you’re nice or not,” said Katsuragi, “but if your objective is complete control over the vote, it’s important to keep the students loyal to you on your side without pushing things too far. However, after the second round of voting, even though you walked around and said things to some other random students as well, you gave your true orders to Shiina. If you go around whispering only to specific students, people will think that you’re planning some kind of strategy. Then, through Shiina, you gathered together a group of people to falsely pose as supporters of the issue and vote \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. I was included among that group. The reason you did so was that you knew I would protect Tokitou, isn’t\u0026#160;it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’d protect Tokitou?” Ryuuen repeated. “And where exactly would I have gotten that information?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shiina overheard Tokitou and I talking about you. It wouldn’t be surprising if you found out about it from her reports.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was just bein’ selective in lookin’ for people who would vote in favor so he’d be misled by fake votes. And that was so I could get him expelled, of course, so I could get Class Points. Disappointing.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen left the classroom sometime later. After that happened, Katsuragi turned to look at the person who was watching him. He was honestly moved to see Shiina smiling warmly at him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, it’s possible that it was Shiina’s judgment call, one she made on her own, that brought me into it…” he muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn any case, the fact remained that Ryuuen laid the foundation for Tokitou to be saved and gave him a chance. As Katsuragi looked around at the other students, feeling relieved that no one had been expelled, he felt convinced of something. He felt like this class actually had the potential to defeat Sakayanagi and become Class A. And he wanted to pursue that path together with them.\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 6: Ryuuen Kakeru’s Choice\",\"volumeId\":\"y2v5\",\"chapterIndex\":12,\"prevChapter\":{\"volumeId\":\"y2v5\",\"chapter\":11,\"title\":\"Chapter 5: Ichinose Honami’s Choice\"},\"nextChapter\":{\"volumeId\":\"y2v5\",\"chapter\":13,\"title\":\"Chapter 7: Sakayanagi Arisu’s Choice\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Chabashira Sae’s Soliloquy\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: Signs of an Approaching Storm\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: Two Teachers and A Fated Special Exam\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: Dark Clouds\",\"href\":\"Text/section-0008.html#auto_bookmark_toc_top\",\"index\":10},{\"label\":\"Chapter 5: Ichinose Honami’s Choice\",\"href\":\"Text/section-0009.html#auto_bookmark_toc_top\",\"index\":11},{\"label\":\"Chapter 6: Ryuuen Kakeru’s Choice\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_top\",\"index\":12},{\"label\":\"Chapter 7: Sakayanagi Arisu’s Choice\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_top\",\"index\":13},{\"label\":\"Chapter 8: Horikita Suzune’s Choice\",\"href\":\"Text/section-0012.html#auto_bookmark_toc_top\",\"index\":14},{\"label\":\"Chapter 9: Farewell to the Past\",\"href\":\"Text/section-0013.html#auto_bookmark_toc_top\",\"index\":15},{\"label\":\"Epilogue: Postscript\",\"href\":\"Text/section-0014.html#auto_bookmark_toc_top\",\"index\":16}],\"volumeTitle\":\"Light Novel 2nd Year Volume 5\",\"detailsLink\":\"/select/year-2/y2v5\",\"returnLink\":\"/select\",\"currentSpineIndex\":12,\"nextVolumeLink\":\"/select/year-2/y2v6\",\"nextVolumeTitle\":\"Light Novel 2nd Year Volume 6\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://classroom-of-the-elite-reader.vercel.app\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"COTE Reader\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"en_US\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:image:width\",\"content\":\"1200\"}],[\"$\",\"meta\",\"9\",{\"property\":\"og:image:height\",\"content\":\"630\"}],[\"$\",\"meta\",\"10\",{\"property\":\"og:image:alt\",\"content\":\"Classroom of the Elite Reader Preview\"}],[\"$\",\"meta\",\"11\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"12\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\"$\",\"meta\",\"13\",{\"name\":\"twitter:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"14\",{\"name\":\"twitter:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"15\",{\"name\":\"twitter:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"link\",\"16\",{\"rel\":\"icon\",\"href\":\"/hola-lector-agua/icon.svg?icon.ae5abf30.svg\",\"sizes\":\"any\",\"type\":\"image/svg+xml\"}],[\"$\",\"$L14\",\"17\",{}]]\n"])</script></body></html>
