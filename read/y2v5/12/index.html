e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T18afc,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 6:\u003cbr/\u003eRyuuen Kakeru’s Choice\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE UNANIMOUS SPECIAL EXAM\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e began at one o’clock in the afternoon. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass D was another class of forty students. The classroom was becoming enveloped by a thick, heavy atmosphere, and this was, of course, due to the intense nature of the final issue they had finally arrived at.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em; text-transform: uppercase;\"\u003eISSUE #5:\u003c/span\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003e In exchange for expelling one of your classmates, gain 100 Class Points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e(In the event the class is unanimously in favor, a vote will be held to choose the student to be expelled.)\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eRound 1 Voting Results:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e For: 14 Votes, Against: 26 Votes\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was the moment when their voting results were revealed. Like in Horikita’s and Ichinose’s classes, the majority of voters were opposed to the issue. However, in contrast to those two, there were more than a few students in favor of expelling someone. In other words, it meant that one in every three students felt, at least at first, that they ought to prioritize Class Points, even if they had to expel someone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what do we do, Ryuuen-san?” grumbled Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter seeing the results, the very first person that Ishizaki turned to for guidance was Ryuuen Kakeru, the leader of the class. Ishizaki had done the very same thing after every other issue. Since the probability of coming to a unanimous decision in the first round of voting was low, the class used the first interval period to hear the leader’s policy on it, and they aimed for unanimity in the second round of voting and beyond. The sequence of events in this class was similar to that of other classes, but the degree of precision in this class was extremely high.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the first issue of selecting another class to face off against, the third issue where they voted on the matter of Protect Points, and in the fourth issue where they voted on test conditions, they had come to a unanimous decision on the matter after only one interval period. In those cases, they chose the answer that Ryuuen ordered them to. The only issue where Ryuuen let his classmates vote as they pleased was the second one, regarding where they wanted to go for the school trip.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen let his classmates debate for roughly thirty minutes about where they wanted to go, and in the end, they voted unanimously in favor of the destination that had the highest number of votes by that time. It was obvious now to everyone that while the content of the fifth issue was different from that one in essence, it would still work the same way. Every issue that seemed to need direction was settled by just a few words from Ryuuen. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe students were only deeply conscious of how Ryuuen voted on issues. If Ryuuen was in favor, that meant it was an absolute certainty that someone was going to be expelled. His decisions were absolute. That was the peculiarity of this class—students here were held together by a dictatorship. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen stood up from his chair and stared at the results with a smile on his face. “Well, it’s been boring as hell so far, but guess the school wasn’t gonna just let things end on an easy note after all. If they did, things wouldn’t be so interesting now, would they?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough he muttered those words to himself, he said it loud enough for all of his classmates to hear. He then proceeded to the podium. Sakagami, the teacher in charge of watching over the class, sensed Ryuuen approaching and moved away. He was well aware of the fact that this was where Ryuuen’s showboating act was set to begin. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen sat atop the podium as if it were a seat specially reserved for him. He leaned forward so that he could look out over all of his classmates. “Raise your hand if you voted in favor.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHis order didn’t show a hint of consideration for anyone. There was incredible tension in the air for everyone, regardless of how they voted. Ryuuen hadn’t directly asked everyone what they voted for in any of the previous issues. After a few seconds of hesitation, scattered hands began to rise. Among them were Nishino and Kaneda, who raised their hands while staring out the window, as if they were somewhat unwilling.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Five of you, huh,” said Ryuuen. “Well, that ain’t bad for the first time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe truth was that there were nine other students who had voted in favor of the issue who didn’t obey Ryuuen’s order and weren’t coming forward. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStudents like Ishizaki and Komiya were surprised to see this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, come on now. You know no good’s gonna come from tryin’ to hide it?” Komiya appealed to his silent classmates. “It’s not like people are gonna be mad at you for voting in favor for this one time or anything.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter all, if they spoke up now, there wouldn’t be any trouble.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides, it’s not like we were ordered to vote one way or another,” he added. “We’re each free to vote either \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e or \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was also Komiya’s way of checking with Ryuuen that he had his facts correct though, just in case. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen Ryuuen didn’t answer right away, Komiya immediately started feeling nervous. If there was a difference in their interpretation of the situation, it was possible it could lead to a reprimand. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki, not liking this change in the air in the classroom, immediately panicked and followed up on what Komiya said. “Come on!” he said, flustered. “Get your hands up in the air before you get us in trouble!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOne more student raised their hand, fearfully and apologetically, bringing the total to six. That meant that the remaining eight students hadn’t budged and left their hands down.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s all right, Ishizaki,” said Ryuuen. “If they don’t wanna raise their hands, they don’t gotta. For now, at least.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? R-really?” asked Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Komiya said it himself. Everyone’s free to vote \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e or \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. So, first of all, each one of you should think about what you yourself are gonna do. We got a little over eight minutes left. That’s plenty of time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen checked the clock leisurely. He didn’t relax his posture, and the smile never once left his face. He had only vaguely told the other students to think about it, that was it. He remained completely silent for more than two minutes, not doing anything in that time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Listen up now,” he said at last. “Don’t waste this time. Think about what choice is the right one.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was another period of silence. Ten seconds. Thirty seconds. Even after another minute passed, he didn’t say another word. In all of the issues so far, Ryuuen had forced them to come to a decision after the first interval period. Because of that, the only thought going through the students’ minds right now was, “\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWhy isn’t Ryuuen giving us instructions?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, there weren’t many students who could just speak up and voice their opinions like that, and the more time that passed, the more their mouths felt like they were sealed. Ishizaki and others like him were among the first you’d expect to say something like, “\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ePlease give us an order!” \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, even they kept their heads down. Their lips were pressed together as if they had been fixed in place with glue.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe seconds ticked by and the more they felt like they were almost losing the desire to speak at all anymore. Eventually, those who wished to say something would stop speaking up, shifting instead to hoping that someone else would say something on their behalf. And when even more time passed, students began hoping that it would be time to vote again soon, even though they had a lot of time remaining. The first interval felt incredibly long and drawn out, and it ended with the majority of time spent in total silence. Even Sakagami hadn’t expected that, and he ended up forgetting to transition to the next round, when they were a few seconds over the scheduled interval time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sakagami,” Ryuuen said suddenly as he hopped off the podium and headed back to his seat. “It’s time, ain’t it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yes, you’re right,” said Sakagami. “We’ll now begin the second round of voting. You’ll have sixty seconds.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs soon as everyone finished putting in their votes for the second round, the results were displayed up on the monitor.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eRound 2 Voting Results:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e For: 10 Votes, Against: 30 Votes\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFour of the fourteen votes in favor of the issue in the\u0026#160;first round had been swayed to the other side. For the majority of students in the class who didn’t want anyone to be expelled, this result was, generally speaking, not a bad one. One or two more sternly worded warnings from Ryuuen would reduce the number of votes in favor. And, in the not-too-distant future, they would see the class vote unanimously against the issue. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe results of the second round indicated that to those students, but at the same time, Ryuuen didn’t seem satisfied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is this the answer you came up with?” he said. “I don’t believe it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because of the small reduction in votes \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, you mean?” asked Kaneda, adjusting the position of his glasses.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen immediately denied that supposition.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, does that mean…that you’re voting in favor of the issue, Ryuuen-kun?” asked Kaneda.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen denied that as well, letting out an exasperated but amused snort. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what in the heck is up with you Ryuuen-san?” Ishizaki wailed. “I just don’t get it!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did the votes in the first and second round really reflect what you truly think?” said Ryuuen. “Your will? This last issue is obviously unique, it’s the only one like this. And that’s exactly why I wanna know your true \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eintentions\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e here. Don’t worry about what I voted for. Vote how you honestly feel.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter saying that, Ryuuen got up from his seat once again and slowly walked around the classroom.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For these next ten minutes, talk about it,” he ordered. “Intensely. Whether you want to vote in favor of it or vote against it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith those instructions, the class was unavoidably forced to debate the issue. The students began talking as much as they pleased, and the classroom was filled with a hurried, panicked commotion. As Ryuuen listened in on what the others had to say, he would occasionally lean in close to a student and whisper something in a quiet voice. He said something to Nishino and Shiina, then Yoshimoto and Nomura—he didn’t seem to be especially choosy about which students he talked to. Then, he approached Suzuki, and whispered in a similar manner as he had before.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re free to vote for or against. Vote according to whatever you think.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen Ryuuen said those words to Suzuki, however, Tokitou overheard him from two seats away. Although some students wondered why Ryuuen deliberately went out of his way to say things to some students, the discussion continued for as long as time allowed. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen, it came to be time for the third round of voting.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eRound 3 Voting Results:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e For: 9 Votes, Against: 31 Votes\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe results on the monitor were hardly any different from those of the second round. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen took a seat upon the podium desk again and decided to offer his thoughts during the third interval period.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Raise your hands if you voted in favor,” he ordered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce more, after seeing the results, Ryuuen ordered everyone to raise their hands. Only two people raised their hands this time: Nishino and Kaneda. The remaining seven refused to step forward, keeping their presence hidden. Ishizaki was visibly annoyed by these unseen supporters of the issue, but Ryuuen didn’t pay them any mind. Instead, he turned his attention to Nishino and Kaneda.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You two voted in favor three times now,” he said. “What’s the reason, Kaneda?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To win,” Kaneda replied. “While it’s not good by any means to have students be expelled, I think it’s important to get those 100 Class Points.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Didn’t you think that if you raise your hand, you’d be a candidate for expulsion?” asked Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s a stupid question, Ryuuen-kun. You would dispose of people you can’t use—people who are unnecessary. But you wouldn’t dispose of someone you need. At the very least, in this class, 100 points doesn’t match my worth.” Kaneda had measured his own value and confidently determined that he was in no danger of being thrown aside.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, looks aside, you’re a lot of use to me,” replied Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you very much.” Kaneda nodded in satisfaction, conveniently paying no attention to the remark about his physical appearance.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nishino, you the same as Kaneda?” Ryuuen asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? No way. I’m just voting yes because it’s a quick way to get more Class Points, that’s all. I raised my hand because I don’t like being all sneaky. There’s nothing wrong with voting in favor.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki was even more nervous than Nishino herself because he knew that Ryuuen was likely to glower at anyone who talked to him like that if they weren’t careful.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, I figure it’s about time I tell you all what you’ve been wonderin’ about. What \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e voted for,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“P-please tell us!” Ishizaki loudly voiced his wishes and pitched forward as he spoke.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThings couldn’t officially start until the class heard what Ryuuen’s vote was. Or, in other words, what the class’s policy would be.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right. For this issue…I voted in favor of it. All three times.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs the results currently stood, that meant that three of the nine votes in favor had come from Ryuuen, Nishino, and Kaneda.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“S-so, basically, this means…someone’s gonna get expelled from class, right?” Ishizaki asked meekly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen smiled ominously. “Don’t jump to conclusions,” he said. “I’m just tellin’ ya how I voted, that’s all. I\u0026#160;already decided that in this issue, you all gotta figure out what you want to do yourselves.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“U-us…you mean?” Ishizaki stammered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. I voted in favor three times now without hesitation.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Ryuuen had voted in favor three times, then it was safe to assume that his plan was for one of their classmates to be expelled. However, since Ishizaki didn’t approve of this plan of action, he didn’t understand what this all meant. He was at a loss for words.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The reason for voting in favor is simple,” Ryuuen told the class. “If we get rid of one person, we get a hundred points. Or, putting it another way, this is a golden opportunity to take out the trash and get Class Points for it. It’s the best possible choice. It’s one that’s gonna help us and not hold us back. But, even after votin’ three times now, there’re still more votes \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e than \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. Meanin’ that over half of the class voted against the issue, basically. If\u0026#160;that’s the case, then I’m gonna respect their wishes, and change my vote to \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen was giving up on the Class Points and setting a plan of action where they’d hold onto their classmates.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki looked relieved after hearing this easy-to-understand plan. He appealed to his classmates to follow along. “I-it’s settled! Everybody, don’t vote in favor! Vote \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e! Those’re Ryuuen-san’s orders!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hold on a minute,” said Ibuki, sounding dissatisfied. She had looked bored through this entire special exam so far. “This isn’t like you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?” asked Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re in favor of the idea, aren’t you? In that case, you could just force things ahead and make everybody vote \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e like how you always do. But \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003enow\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e you’re trying to act like the good guy and say something like how you’re gonna protect your friends?” Ibuki was implying that Ryuuen would always go for the Class Points in front of him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What, so you voted in favor too?” asked Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I voted \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e,” Ibuki replied. “But my intentions are none of your business.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If this thing weren’t anonymous, then yeah, I might’ve let it come to a unanimous decision in favor, without a second thought,” Ryuuen said. “It would’ve been quicker if I just drove one of the people who defied my opinions toward expulsion. But unfortunately, this time they’re doin’ this exam by way of an anonymous vote. As long as I can’t be sure who voted for what exactly, it’d just be faster to get everyone to vote \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e since that’s already got over half the votes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re saying that you’re not confident that you could get a unanimous decision in favor?” asked Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eKu ku\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, you can think whatever you want,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-you shouldn’t go overboard with what you say, Ibuki,” Ishizaki cut in. “Ryuuen-san said to vote \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, so isn’t that good enough? If we’d be losin’ Class Points, that’d be one thing, but we’re not. We’re just gonna finish the exam.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whatever,” huffed Ibuki. “It’s just that this is all a little out of character for him. I was curious, that’s all. Do\u0026#160;whatever you want.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that a plan had been set in place, a great deal of the interval period was spent in silence. And when the fourth round came, the results were…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eRound 4 Voting Results:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e For: 7 Votes, Against: 33 Votes\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe students had expected that, if it wasn’t a unanimous decision, then almost all the votes would be against the issue. However, there were a surprising number of votes in favor. In fact, there were only two fewer votes than last time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kaneda, Nishino, what did you two vote for?” asked Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I voted \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, as you had instructed, of course, Ryuuen-kun,” said Kaneda.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well personally, I’m still for the idea, but I voted \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e because I felt like that would’ve messed up the harmony we were going for, y’know?” Nishino said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe two people who had raised their hands before and indicated they were in favor had changed their votes. And considering the fact that Ryuuen had changed his vote as well, there was no way he’d accept these results unless he saw that the number of votes in favor had gone down by at least three. On top of that, he had given the other students an order and told them they weren’t free to vote how they wanted. They were now being coerced into voting \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. Despite that, though, there were still seven votes in favor. Ryuuen couldn’t rule out the possibility that either one person switched their vote to be in favor, or that Kaneda or Nishino was lying to him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen himself had voted 100 percent against the issue, but there was no way for the others around him to confirm that was true either. And so, a new sense of unease gradually began to spread across the room. Ryuuen calmly thought about the results. Instead of simply looking at the number of votes, he decided to try detecting the flow of votes to see through the anonymity.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who’s still voting in favor?!” screamed Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen’s orders were to vote against the issue. Ishizaki couldn’t calm himself down when he saw that seven students didn’t do as they were told, even though they were given clear orders. If Ryuuen changed his mind and voted in favor of the issue, then that meant someone would be expelled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eKu ku\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, all right, don’t scream your head off, Ishizaki,” Ryuuen said. “Actually, things are gettin’ more interestin’, I’d say. This exam is completely anonymous; there’s no way that anyone can find out exactly who voted for what. That means there’s more than a few people out there really in favor of the idea and are votin’ for it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-but people not followin’ your orders is a big problem, Ryuuen-san!” complained Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah, not really. Nothin’ wrong with tryin’ to get Class Points at the cost of our classmates. Actually, if anythin’, this means that there are seven students here greedy enough to shoot for Class A. That right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen clapped his hands with delight, as though he welcomed this development with open arms.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But if we’re gonna say it’s okay for somebody to get expelled, then there’s the question of \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewho\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e,” he added. “I\u0026#160;bet the seven people who voted in favor have a clear idea of who it should be.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-wait… You don’t mean, like, me, do ya?!” Ishizaki started to panic, wondering if he was going to be a target.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, can’t rule out the chance that there’re people who think no one needs you,” Ryuuen replied. “But is there anybody who has got the guts to come forward and say it? The kind of person who wants \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eme\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e of all people expelled, not anybody else?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen issued a challenge to those students, like he was ordering them to come forward. However, the classroom once again was enveloped in a still silence, and, of course, that meant there wasn’t anyone ready to speak up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe sighed. “Well, guess you aren’t gonna spill your guts that easy after all, huh. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eKu ku\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, then I guess we’ll do this nice and slow.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, the fourth interval period had come to an end, and it was time for the fifth round of voting. The class had already spent about forty minutes on this issue. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor this round, the results showed…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eRound 5 Voting Results:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e For: 8 Votes, Against: 32 Votes\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was now one additional vote in favor of the issue, contrary to Ryuuen’s goal of decreasing those votes. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you gonna do, Ryuuen?” said Nishino, sounding depressed. “It’s already been almost an hour now, you know?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t be in such a rush,” Ryuuen told her. “We’ve still got lotsa time, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But there’s still a lot of people going against your wishes and voting for this thing. Isn’t that, like, bad?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe number of votes in favor clearly showed that Ryuuen’s dominance wasn’t complete. He wasn’t able to control everyone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah,” he said. “And I can’t rule out the possibility that you’re still voting in favor either.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNishino was somewhat surprised by Ryuuen’s comeback, but she met his gaze and responded with firm intensity.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Maybe,” she shot back.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if I hound people about it, it’s not like I’d get any proof unless the person in question admitted it themselves.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was an exam where it was difficult to punish those under suspicion. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaving watched the situation unfold up until this point, Yabu Nanami spoke up. “Can I make a suggestion?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Speak,” replied Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What if we just vote unanimously in favor of the idea and then find someone who’d be fine with getting expelled?” said Yabu.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I take it that means you voted \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e?” asked Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. I voted \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e every time. But I’m starting to think that if the people in favor aren’t budging, then maybe it’d be a good idea to just change our plan of action instead. For example…what if we expelled Ibuki-san?” She shot Ibuki an icy glare. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFollowing Yabu’s lead, Morofuji Rika spoke up in agreement. “If Ibuki-san’s who we’re choosing, then I think I could agree to it too… Oh, but just to be clear, I’ve been voting \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e this whole time, okay?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, come on you guys,” said Ishizaki. “Ryuuen-san said that we’re voting \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, so that’s what we’re doing.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hold on,” Ryuuen said. “I welcome their opinions.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki blinked in surprise. “H-huh? Really?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“From the looks of it, I’d say it’s probably true they’ve been voting \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e this whole time. If there aren’t at least two votes added to the side in favor, then that means there’s a contradiction. You two wouldn’t slip up like that, would you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBoth Yabu and Morofuji responded to Ryuuen’s question with a resolute nod. Of course, the possibly couldn’t be discounted that one of the eight anonymous voters who voted in favor might change their vote in the next round couldn’t be discounted, but Ryuuen was well aware that was a separate issue. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides, these two were so prepared to vote in favor that they even offered a name,” Ryuuen went on. “Unlike those eight anonymous people. Judging by the looks on their faces, there are probably more people out there aside from Yabu and Morofuji who are on board with this idea.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe group of girls made up of Yabu and her close friends occupied the highest rung of the social ladder in the class. Although Yabu’s and Morofuji’s opinions were ostensibly their own, what they said could be taken as a sentiment shared by the group as a whole.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’d like to know what you think about our suggestion, Ryuuen-kun,” Yabu said. “Could you tell us your thoughts?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The biggest prerequisite for gettin’ a particular person expelled is making sure there wouldn’t be any votes in support of that person,” said Ryuuen. He addressed the class as a whole. “Who in this class wants to protect Ibuki? Who’d be willing to risk their own expulsion over\u0026#160;it?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo hands were in the air after he asked that question.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, there you have it then, Ibuki. Would you accept being expelled from school?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone was sure that if Ibuki answered that she accepted it, or if she told Ryuuen to just do whatever he wanted, then Ryuuen would set Ibuki’s expulsion in motion without hesitation. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, but I don’t have any intention of letting myself get expelled,” Ibuki responded. She didn’t so much as glance at either Yabu or Morofuji, the people who nominated her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh?” said Yabu. “I thought your stance was that you didn’t particularly care if you got expelled, Ibuki-san. Wasn’t that right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t really care about this school or whatever,” she replied. “But there is someone here who I want to get my revenge on in my own way. And besides, do you honestly think I’d accept getting expelled like this? I’m not gonna conveniently let myself be taken advantage of by people I hate.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You just don’t want to be expelled, no matter what the reason is,” said Yabu. She smiled, trying to provoke Ibuki further. “You’re trying to act tough like it doesn’t bother you, but I bet you’re scared, aren’t you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hah,” Ibuki scoffed. “You’ve become quite the big shot, huh? Even though you used to be Manabe’s flunky, hanging all around her. Does it make you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e happy to have become the leader of the girls the second that she was gone?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHearing Ibuki’s comeback, Ryuuen’s smile faded, and he glowered at her with intimidating eyes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Ibuki,” he warned. “Be aware of your position right now. Yabu has friends who’d be against her getting expelled, but you don’t have a single person to cover you. Besides, you never really had any kind of attachment to this school anyway, did you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…So what?” snapped Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t hate you, but if this means we can get you to contribute to the class by bowing out gracefully, then I’m afraid that’s a different story. It doesn’t matter to me what your intentions are, ’cause we’re the ones who’re gonna feast on your flesh and blood.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Serves you right, Ibuki-san,” sneered Yabu. “You thought you were Ryuuen-kun’s one and only favorite, huh?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, do you resent me, Ibuki?” asked Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not really. But I never cared one bit about trying to be friends with you in the first place. I know you’d do anything to win, so I’m not surprised. But like I said, I\u0026#160;have no intention of getting expelled.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki repeatedly indicated that she refused to accept the situation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen’s tone was growing somewhat scathing in return. “It doesn’t matter whether you’ve got any \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eintention\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e or not,” he said. “I’m gonna ask you one more time. The stakes here are that we’re gonna see what happens if there’s a unanimous decision in favor of it. Raise your hand if you’re willin’ to put yourself on the line for Ibuki. But you gotta decide within one minute.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki started trembling slightly in the midst of the tense, stinging atmosphere. It wasn’t out of fear of Ryuuen, but it was because the time had come for him to choose, to make a decision.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t do it, Ishizaki.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe person who stopped him was Nishino. She had come up next to Ishizaki and stood beside him without him even noticing she was there.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what, Nishino…?” he sputtered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re fighting to win,” she said. “Your half-assed idea of friendship is only gonna cause confusion.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-but, I mean, Ibuki’s, I mean, she’s our—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Time’s up,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA minute had passed, and in the end, not a single student had come forward to say they would protect Ibuki. All sorts of thoughts and feelings ran through the students’ minds in that still silence. There were scornful stares of Yabu and her friends, pitying looks from other students, and feelings of relief yet other students had over not being targeted themselves.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh. I see. In that case…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHalf in desperation, Ibuki was about to give her answer. But then, she suddenly stopped, her words sticking in her throat. She understood that she was at a disadvantage in this issue because she didn’t have a single true friend. That was exactly why she announced early on that she had voted \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. However, now that things had come to this, she had no choice but to try and protect herself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, what?” asked Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen maintained total silence in the room after asking that, as if he were waiting for what Ibuki was going to say.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I still have unfinished business at this school,” said Ibuki, after a pause.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, but I don’t intend to go along with whatever you’re hoping to do. Even if the rest of the class votes in favor, I’ll vote against it. If we don’t come to a unanimous decision, then that means we’re gonna fail this special exam.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-huh?” said Yabu. “Are you planning on forcing the class’s hand for your own sake?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s exactly it.” Ibuki had made up her mind, declared her intention to vote against the issue, and was standing her ground.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s obvious you would do that,” said Ryuuen. “Yabu, your idea of changing to vote in favor wasn’t bad, but it was way too early for you to name names. If you really wanted Ibuki gone, you should’ve waited until after we got a unanimous decision on the issue and \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethen\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e brought it up.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Gr…!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf someone knew that they were going to be expelled, they would never vote in favor.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just settle down and vote \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNishino felt like there was something strangely off when Ryuuen gave them those instructions.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, why did we even have everyone go through that whole charade just now?” she asked. “Wasn’t it just a complete waste of time?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no need for Ryuuen to ask for a pointless show of hands. Yabu and Ibuki’s arguing could’ve been stopped much earlier—it was obvious it would’ve been really difficult to come to a unanimous decision once someone was nominated out loud.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was just killin’ time,” Ryuuen answered. “We got way more time on our hands than we know what to do with anyway.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite his claim there was no deeper meaning, there were some students in class who realized Ryuuen had another purpose in doing all of that. They realized that the reason why Ryuuen went along with Yabu’s proposal, even though it was never going to pass, was so he could get Ibuki to say that she’d never vote in favor of the issue. By doing this, he was indirectly showing everyone the fact that a unanimous decision in favor would be difficult to obtain. To those students, this seemed like a skillful and composed move on Ryuuen’s part…but at the same time, it may have been a desperate measure born out of impatience and not having been able to do anything else in this situation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the sixth round of voting, the results showed seven votes \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e and thirty-three \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. The seventh round showed six votes \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e and thirty-four \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. Little by little, the number of votes in favor was decreasing, but in the eighth round, there were seven votes \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e and thirty-three votes \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e again. The results had gone back to how they were before.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEventually, the time came for the ninth round of voting.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eRound 9 Voting Results:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e For: 7 Votes, Against: 33 Votes\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe votes in favor of the issue remained steady. This figure also seemed to represent Ryuuen’s leadership at this current point in time. From the sixth round through the ninth rounds, he simply sat at the podium for ten minutes during each discussion period, not uttering a single word. He just watched everyone before him with an unsettling grin on his face. The situation only changed during the interval before the tenth round of voting began.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen had been smiling up until that point, but now, he suddenly called his class out with one short word. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe students who had been engaged more in simple conversation rather than actual discussion on the issue came to attention in a panic. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You people can’t even vote against this thing yourselves without me givin’ you an order?” asked Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEvery student immediately shut their mouth in response to the clear change in the classroom’s atmosphere.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure you ain’t afraid of how things are gonna go down if everyone votes in favor. But if you think that I’m just watchin’ you all vote for no reason at all…you’re makin’ a big mistake.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSMACK! \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen kicked the podium hard with his heel.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It might feel like you’re just sittin’ back, hiding in anonymity, but I can see it from the looks on your faces, y’know,” he said. “I’ve got a rough idea of what’s goin’ on here. And if you keep screwing around… You \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eknow\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e what’s gonna happen, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eRound 10 Voting Results:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e For: 6 Votes, Against: 34 Votes\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter Ryuuen’s intense statement, one of the votes in favor had changed. However, in truth, Ryuuen’s threats hadn’t been all that effective, considering that the votes in favor had already once fallen to six before in the seventh round. They thought they had ample time, but now they were using what time they had left like it was going out of style.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…………”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe students noticed that Ryuuen’s smile had faded quite some time ago, to be replaced by a stern look.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoever you people are, you’re stubborn,” he said. “I’m gettin’ sick and tired of dealin’ with you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were about three and a half hours left before the exam’s time limit ran out, but they had already been voting on this final issue for an hour and a half.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eRound 11 Voting Results:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e For: 7 Votes, Against: 33 Votes\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seriously, with the way things are going right now, how can we keep on waiting for things to change?” Nishino made no attempt at hiding her annoyance. She asked Ryuuen what his plans were.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. Guess it’s probably about time to end this, huh,” he replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can do that?” asked Nishino.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you people really think I’ve been watchin’ you all this time for nothin’? You realize that there’s been an odd one out, one weird voter that showed up in rounds six to ten, right? I’m talkin’ about the colossal dumbass who keeps flip-floppin’ between \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eand \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. And now I’m gonna tell you exactly who that is.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTensions were running high. Under normal circumstances, it wouldn’t be possible to see through perfect and total anonymity. However…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s you, ain’t it? Yajima.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe person Ryuuen called out was Yajima Mariko. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-huh…?! N-no!” she sputtered. She then shot upright, attempting to deny it, but she was clearly flustered and unable to calm herself down.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t think I’m gonna believe you if you deny it, just because this thing’s anonymous,” he said. “If I think you’re the one who did it, then you’re \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edefinitely\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the one. You understand what I’m getting at, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“N-no, that’s not… I…!” she protested. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I say you’re the one that did it, then you’re the one. And if I say you’re not the one, then you’re not. Since you’re the first person I called out, I’m gonna give you one chance. From here out, you ain’t got the right to vote in favor of this issue without my permission, got it? If\u0026#160;\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e decide you ain’t following my rules, you’re getting expelled, and that’s that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a high-handed threat. Even if whoever it was continued to oppose the class on this issue and waited things out, even until the class failed the exam in the end, Ryuuen was suggesting that they’d eventually be expelled via some brutal, fiendish means in the not-too-distant future. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYajima didn’t need very long to imagine that was what Ryuuen was suggesting at all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve figured out who’s votin’ in favor of this issue, though not all of ’em yet,” he continued. “So, question is, are they so stupid that they can’t understand unless they’re told directly, like Yajima? We’re gonna let the next vote decide.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd so, the twelfth round of voting had come.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eRound 12 Voting Results:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e For – 5 Votes, Against – 35 Votes\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs Yajima was now completely committed to voting \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, the votes in favor hadn’t increased. But even after the situation had come to this and with Ryuuen having issued his final warning, the votes in favor had still only gone down by two. That left a total of five in favor. The\u0026#160;class was beginning to realize that things like threats were no longer going to work against them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Five people, huh…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter muttering those words, Ryuuen checked the time and got back on his feet.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Guess I gotta admit it: these people have backbone,” he said. “But still, I ain’t so happy about this. Look, if you ain’t gonna back down here, no matter the cost, then just cut the crap already and come forward. These five anonymous people want me expelled. In that case, we just gotta wait until we reach a unanimous vote \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. I mean, it’d be boring as hell to just let things end by running out of time, wouldn’t it? So, make your move. That way, we can fight on equal terms.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe class wouldn’t pass this special exam unless they came to a unanimous decision one way or the other. And until they identified the students who hoped that they’d settle on being in favor, they would just repeat this same process over and over, endlessly. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed like none of those students in favor would show themselves at this point in the situation, but then…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay. Fine, Ryuuen. In that case, I’ll come forward… I’m voting in favor.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt long last, one of the anonymous supporters of the issue made up his mind and stood up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tokitou, you ass!” yelled Ishizaki. “Do you know what the hell you’re sayin’?!” Ishizaki charged forward, like he was intending to pounce. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi grabbed him by the arm and stopped him in his tracks. “Stop, Ishizaki. We’re in the middle of a special exam. Do you honestly intend to resort to violence right now? Make one bad move and Sakagami-sensei won’t hesitate to call this exam off. Isn’t that right, Sensei?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course,” Sakagami replied. “If that were to happen, this exam would end with your disqualification.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Grr…!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides,” added Katsuragi, “although Tokitou’s come forward and announced that he voted in favor, there is no guarantee that it’s the truth.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if they were 99 percent certain, there was no way they could be 100 percent sure since it was anonymous. They couldn’t ignore the possibility that he was pretending to be in favor while actually voting \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAgainst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s the truth, though,” said Tokitou. “Y’know, I always wondered if a special exam like this would ever come up. There’s nothin’ I could do in a regular special exam, but the instant this issue came up? It was like I got hit by lightning… I knew this was it. This was the only time I could get rid of Ryuuen.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why are you coming forward now though, Tokitou…?” asked Katsuragi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because I’ve locked eyes with Ryuuen a few times now. He probably guessed that I’ve been voting in favor. I\u0026#160;could have come forward earlier, that would’ve been fine. But the number of votes in favor weren’t goin’ down, and seein’ him get all confused was exciting.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, Tokitou,” said Ryuuen. “Your rebellious attitude ain’t nothin’ new. In fact, I’m honestly glad that you’re on the side of those in favor.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How long can you keep up bein’ so full of yourself?” Tokitou said. “You can’t afford to.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know,” Ryuuen agreed. “No matter how many times we do this vote, we’re never gonna get the votes in favor to go away. And if we run outta time, our class loses 300 points. We’d seriously be out of the running for Class A.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Exactly,” said Tokitou. “You’re the leader of this class. Which means if we fail this special exam, the blame isn’t gonna be on me, it’ll be on you. Besides, you’ve been selfish and controllin’ all the choices in this special exam from the get-go. You \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eforced\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e us to pick Sakayanagi’s class to be our opponent without even tryin’ to listen to the people who said we should fight Ichinose’s class. So, you can take responsibility when we lose, can’t you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I get it now,” said Ryuuen. “So that’s why a rebel like you’s been so obedient in all the other issues so far.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m doin’ this to teach everybody in class that this is a mistake. I don’t wanna make trouble for the class. I just don’t want you bein’ the leader.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But along came the opportunity for us to get one person in particular expelled. And you decided to take a chance on it. And?” Ryuuen taunted him. “Come on, show me some real defiance here. What do you want most?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cs
