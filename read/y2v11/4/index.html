\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBefore the trip started, what was concerning was the number of buses prepared for the students. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eUsually, it was one bus per class. In other words, if all three years participated, it would be 12 buses. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHowever, there were only nine buses gathered this time. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut the mystery was immediately solved by looking at the boarding students. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThere was only one bus prepared for the third-year students. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eApparently, the number of students gathered was very small, only about 20. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI couldn't say for sure because I didn't see everyone's faces, but as far as I could see, it seemed that five students from each of the four classes, A to D, were called from the third-year. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen instructed to board the bus, there was no specific seating assignment, and we were told we could sit wherever we wanted. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eUpon hearing this, Kei immediately clung to my arm. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'll sit with Kiyotaka.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eDespite receiving some cold stares from some of the boys, I agreed and boarded the bus, taking a seat by the window on the right side, three rows from the back. Kei sat next to me. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Wouldn't it have been better to stick with the girls?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'll do that on the way back. It's fine to be together on the way there, right?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWe spent most of our private time together, but she still wanted to be together on the bus. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI didn't know what was different, but she seemed happier than usual. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eOnce everyone had boarded, and the other buses were ready, Chabashira-sensei boarded. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p35\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-35_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 44\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“This reminds me of last year's training camp. We had a lot of exchanges with each other at that time too.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's right.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eA year had passed since then. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAt that time, neither of us thought our relationship would deepen this much. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNot only Kei, but the relationships with the people around us had also changed significantly. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Oh, that's right. I found out yesterday that my favorite movie’s going to be screened soon. Let's go see it together when it starts.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eKei showed me an image that looked like a movie poster, her eyes narrowing in delight. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eTo Kei, it was just one of the casual conversations she naturally brought up. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut there was one thing that bothered me. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“When is the movie scheduled to be released?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Um, when was it? The last time I saw the trailer, it seemed like it was going to be released in the spring.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I want to know the exact date.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Huh? Is there something wrong? Let's see. . Oh, it's listed here.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe homepage that Kei showed me stated that the movie would start screening on March 26. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eFortunately, it was before the start of the new school term, during spring break. “I see. Let's go see it.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Yay! It's super interesting. I think you’ll enjoy it too,” Kei said with a smile, but her smile froze as she looked at my face. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What's wrong?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“No, it's nothing.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eKei, who answered and took her eyes off me, started to prepare for the movie by looking at a page that seemed to be a character relationship chart while humming a song. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAfter that, the students each enjoyed the outside scenery while chatting casually. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAbout 20 minutes after the bus left the city, Chabashira-sensei held a microphone and looked at the students throughout the bus. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I think it's about time to explain the details of the training camp. As I mentioned briefly at school, it has been decided to hold a three-night, four-day experiential learning exchange meeting for all years.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNormally, this would be a tense moment, but there was no sign of tension among the students on the bus. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p36\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-36_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 45\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhile listening to Chabashira-sensei's words, they were enjoying the outside scenery or resting their bodies, creating a different mood than usual. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAs I mentioned earlier, this is not a special exam, but a simple exchange meeting. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Let me remind you not to take the exchange meeting as a special exam. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThere will be no change in class points this time. Unless you engage in behavior that deviates from student life, there’s probably no risk of expulsion. You can get private points for participating in some games, but it's more of a voluntary participation than a mandatory one.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was only natural that Chabashira-sensei was explaining this to emphasize it. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe students had become more cautious in their long life at ANHS. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThey had a habit of suspecting that there might’ve been something behind the exchange meeting. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThat was why she was announcing that it wasn’t a special exam, that class points wouldn't change, and that there were no penalties like expulsion waiting for them. This was what gave the students peace of mind. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It's unfortunate that Ichihashi had to stay home due to illness, but it was a blessing in disguise.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003e(TL Note: Chabashira is thankful that it is only a small illness. This also\u003c/i\u003e \u003ci class=\"calibre3\"\u003eallows for less students to work with which is the “blessing” she is referring to.)\u003c/i\u003e There was a surprising amount of students with poor health due to the prevalence of colds at this time of year. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I think some of you may have already noticed, but even though it's for all years, this time, only five representatives from each class of the third-years are participating. This is taking into account various circumstances.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eChabashira-sensei briefly touched on it, but she didn't go into detail. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Your main objective will be to interact with the first-year students, but it's not like you can get along with everyone just from our vague instructions. As soon as you arrive at the camp, all years will be divided into 20 groups. The 20 third-year students who will serve as representatives in each group have already finished organizing the members based on the full list of first and second-year students.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThis meant that the groups were already decided, and we just weren’t informed about which group we would be in. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I will distribute the organization chart now, so remember which group you belong to. There may be some differences in the number of people and the gender ratio, but the balance of grades and classes has been adjusted as much as possible. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe games will be conducted between groups to determine the winner.” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p37\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-37_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 46\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eChabashira-sensei handed out printouts to the students sitting in front of her on both sides. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe students took the necessary printouts and passed them on to the students sitting behind them. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“This printout also includes some rewards you can get from the games and the conditions for obtaining them. You should read it carefully.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It's not an exam, so I feel more comfortable, but I still want private points. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe win rate seems to change a lot depending on whether you get into a good group or not, right?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Yeah.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was natural to hope that you’d have as many excellent students in your group as possible. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eOf course, it was unknown what skills would be required to determine the winner. Hondō, who was sitting in front of us, stood up and handed us the remaining printouts. Kei took them and passed them further back. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I hope I'm with you, Kiyotaka.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe printouts were clipped together in groups of five, with information about the group activities, rewards for the exchange meeting, and a list of students' \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003enames from the third page onwards. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI noticed that there was also a folded card in the size of a regular business card inserted. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eFortunately, the printouts were made just for us, so there were marks on the names of the students in this class. This made it easy to find my name. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe names of those who were absent were also listed. There were two second-year students, Ichihashi and Ichinose, but there were four first-year students, which seemed to be quite a lot. Among them was Ishigami's name. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was probably a coincidence that they were in poor health. Because of that, I wouldn’t get the opportunity to get involved with them. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'm in group seven with Tanaka-senpai. You’re not there. . but.. ” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eKei, who quickly found her name in the middle of the first page, looked disappointed but somewhat relieved.  \u003ci class=\"calibre3\"\u003eI wonder why\u003c/i\u003e. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“But what?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It seems that at the training camp, I'll be sharing a room with the girls in the same group, and there’s someone I don't want to be with..  I'm glad they aren’t there,” she said. At the beginning of the printout, it was written that in addition to the games, we would be living together in a room separated by gender. That must have been her reaction to noticing that. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe didn't specify who, but there was no doubt that she was referring to Ichinose. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p38\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-38_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 47\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIn the last special exam, she was surprised to be consecutively nominated, even if it was part of their strategy. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It's not that I hate Ichinose-san or anything, but, I don't know. I'm a little scared.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe muttered this and then glared at me. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You're close with Ichinose-san, Kiyotaka. Sometimes, I have doubts about various things.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eKei whispered this to me in a voice that no one else could hear. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“So that's why you were feeling conflicted.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“There's a chance that you could end up with Ichinose, right?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSurprisingly, Ichinose's presence seemed to have grown negatively in Kei's mind. “I seem to be in group 20 with Kiryūin-senpai, at the end of the fifth page.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI quickly looked through the list of all 20 groups, and as Chabashira-sensei had previously announced, the gender ratio balance was as fair as possible, and the distribution of students by class was either a minimum of one or a maximum of three—basically, two each. It seemed to be as equal as possible. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHowever, I felt an eerie bias and inequality in some parts of each group. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSince the other students were still looking for their names, there were probably few who had noticed, but it was only a matter of time before questions would arise. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eKei, who hadn't noticed anything, was still looking at the list with a disappointed look on her face due to our separation. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI turned my attention back to the reward section at the top of the first page. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003e\u003cb class=\"calibre6\"\u003e \u003c/b\u003e\u003c/i\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003e\u003cb class=\"calibre6\"\u003e \u003c/b\u003e\u003c/i\u003e\u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p39\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-39_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 48\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003e\u003cb class=\"calibre6\"\u003e[Group Ranking Rewards]\u003c/b\u003e\u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e•   \u003ci class=\"calibre3\"\u003e1st place: 30,000 private points for each student \u003c/i\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e•   \u003ci class=\"calibre3\"\u003e2nd place: 20,000 private points for each student \u003c/i\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e•   \u003ci class=\"calibre3\"\u003e3rd place: 10,000 private points for each student \u003c/i\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e•   \u003ci class=\"calibre3\"\u003e4th to 10th place: 5,000 private points for each student \u003c/i\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e•   \u003ci class=\"calibre3\"\u003e11th to 15th place: 3,000 private points for each student \u003c/i\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e•   \u003ci class=\"calibre3\"\u003e16th to 20th place: 1,000 private points for each student \u003c/i\u003e\u003c/p\u003e\n\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003e*The private points obtained in this exchange meeting cannot be transferred\u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003e*Use is limited to shopping within Keyaki Mall\u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003e*To receive the reward, you must meet the conditions of the point card\u003c/i\u003e Because this wasn’t a special exam, we couldn’t get as big of a reward. It also wasn’t a system where only certain classes benefit. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEven for high school students, an extra 1000 or 2000 yen was not something we could ignore, so naturally, we would want to aim for the top. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAlthough there were disadvantages such as the inability to transfer or the limited places where they could use it, it also meant that it was virtually impossible to use it strategically. The ability to use it freely without hesitation was an advantage. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe students stared at the list for a while. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Um... Chabashira-sensei. May I ask a question?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSonoda raised her hand after getting a rough idea of the groups. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You have something on your mind, don't you?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Yes. If we're going to play games in separate groups, is this..  fair? I mean, even if it's impossible to be perfectly fair, it seems a bit unbalanced..  I feel that way about Nagumo-senpai's group, for example.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“OAA standards of balance are not taken into account at all. It wouldn't be strange if there was a drastic bias.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIn response to the question, Chabashira-sensei gave a curt answer. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Wow, it's true. Isn't Nagumo-senpai's group quite dangerous?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhile listening to the question and checking the list, Ike, who saw the group led by Nagumo, spoke. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNagumo was a well-known former student council president and a student who maintained all A's or above in the OAA. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut what was astonishing was that the group had faces with outstanding ability. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003e\u003cb class=\"calibre6\"\u003e \u003c/b\u003e\u003c/i\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003e\u003cb class=\"calibre6\"\u003e \u003c/b\u003e\u003c/i\u003e\u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p40\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-40_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 49\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003e\u003cb class=\"calibre6\"\u003e[First-year Students]\u003c/b\u003e\u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e•   \u003ci class=\"calibre3\"\u003eClass A Takahashi Osamu, Toudou Rin, Amasawa Ichika \u003c/i\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e•   \u003ci class=\"calibre3\"\u003eClass B Hagiwara Chihaya, Fukuchi Hinano \u003c/i\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e•   \u003ci class=\"calibre3\"\u003eClass C Namekawa Azuki, Iguchi Yuri \u003c/i\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e•   \u003ci class=\"calibre3\"\u003eClass D Tatewaki Aoi, Osaki Noa \u003c/i\u003e\u003c/p\u003e\n\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003e\u003cb class=\"calibre6\"\u003e[Second-year Students]\u003c/b\u003e\u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e•   \u003ci class=\"calibre3\"\u003eClass A Sanada Kousei, Sawada Yasumi \u003c/i\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e•   \u003ci class=\"calibre3\"\u003eClass B Horikita Suzune, Hirata Yosuke \u003c/i\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e•   \u003ci class=\"calibre3\"\u003eClass C Kaneda Satoru, Katsuragi Kouhei \u003c/i\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e•   \u003ci class=\"calibre3\"\u003eClass D Kanzaki Ryuji \u003c/i\u003e\u003c/p\u003e\n\n\u003cp class=\"P_Prose_Formatting\"\u003eAll of them were excellent in their studies, and they were either good at sports or able to follow instructions accurately. They didn’t hesitate in selecting students who could bring the group together. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf we talked about individual abilities, there were students with outstanding abilities such as Sakayanagi, Ryuuen, and Koenji, but it was unknown what kind of chemistry would occur when they were thrown in the mix together. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eIsn't this a well-rounded group formed to avoid that? \u003c/i\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAfter seeing this, many other groups would inevitably fade away. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf you were in a group that had Sakayanagi or Ryuuen, students mentioned earlier as examples, they might be able to make a breakthrough and win against the strongest group, but for most other groups, defeat is inevitable. If there was a game that specialized only in academic ability, it would be almost impossible to win in terms of overall ability. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Some of you may think the group assignments are a bit unfair, but there's nothing we can do about it. It's only natural that excellent students are attracted to stable groups.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eChabashira-sensei, holding a printout in one hand, answered with a stern look.  Sonoda, who asked, shrank back at her expression. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was a reasonable argument that couldn't be refuted once said. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003ePerhaps thinking that the warning had gone too far, the teacher softened her expression and showed a slight smile. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“But just because they're excellent doesn't mean they'll always win. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEspecially in this case.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe told Sonoda that there was hope and continued her explanation. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“This exchange meeting will be a round-robin game spanning three days. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe groups will compete against each other, but it will be one group against RoyalMTLs \u003c/p\u003e\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p41\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-41_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 50\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eanother, and the order of the matches will not be disclosed. Also, the content of the games will be randomly selected from a list each time.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eChabashira-sensei continued to verbally convey the detailed rules, but the rules of the exchange meeting can be summarized as follows. \u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p42\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-42_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 51\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003e\u003cb class=\"calibre6\"\u003e[Exchange Meeting Experiential Learning Game Overview]\u003c/b\u003e\u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e•   \u003ci class=\"calibre3\"\u003ePeriod: Conducted over three days \u003c/i\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e•   \u003ci class=\"calibre3\"\u003eDay 1: 5 matches; Day 2: 7 matches; Day 3: 7 matches \u003c/i\u003e\u003c/p\u003e\n\n\u003cp class=\"P_Prose_Formatting\"\u003e※30-minute interval between each game \u003c/p\u003e\n\n\u003cp class=\"P_Prose_Formatting\"\u003e•   \u003ci class=\"calibre3\"\u003eMatch method: Conducted as a round-robin match among all 20 groups. \u003c/i\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e•   \u003ci class=\"calibre3\"\u003eThe order of the matches is not disclosed. \u003c/i\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e•   \u003ci class=\"calibre3\"\u003eRules: For every game, each group selects five players from the third-year's\u003c/i\u003e \u003ci class=\"calibre3\"\u003egroup. \u003c/i\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e•   \u003ci class=\"calibre3\"\u003eOnly first and second-year students can be selected as participants in the\u003c/i\u003e \u003ci class=\"calibre3\"\u003egame. \u003c/i\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e•   \u003ci class=\"calibre3\"\u003eThe fundamental idea is one-on-one matches, with victory awarded to the\u003c/i\u003e \u003ci class=\"calibre3\"\u003efirst group achieving three wins. \u003c/i\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e•   \u003ci class=\"calibre3\"\u003eGames will continue for all five players even if defeat is assured. \u003c/i\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e•   \u003ci class=\"calibre3\"\u003eUnlimited participation, with no restrictions on the number of times one can\u003c/i\u003e \u003ci class=\"calibre3\"\u003eparticipate. \u003c/i\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e•   \u003ci class=\"calibre3\"\u003eGame content: The school will randomly choose from a predetermined list,\u003c/i\u003e \u003ci class=\"calibre3\"\u003ewith game details announced periodically. \u003c/i\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e•   \u003ci class=\"calibre3\"\u003eVictory conditions: Rewards are distributed based on the highest number of\u003c/i\u003e \u003ci class=\"calibre3\"\u003evictories. \u003c/i\u003e\u003c/p\u003e\n\n\u003cp class=\"P_Prose_Formatting\"\u003e※ In the case of a tie for third place or above, additional games will be conducted. \u003c/p\u003e\n\n\u003cp class=\"P_Prose_Formatting\"\u003eAs expected from something labeled as a game, the content seemed to be really light. It was clear at a glance from the list prepared by the school, with unique activities like 'flower pressing' and 'pottery wheel making,' which seemed unique to a training camp. There were also game-based activities like 'playing cards' and 'UNO,' as well as sports-based ones like 'table tennis.' Of course, there were also some that required a bit of brainpower and involved academic skills, but they didn't seem to be the main focus. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003e(TL Note: “Pottery wheel making” is the act of shaping pottery while it\u003c/i\u003e \u003ci class=\"calibre3\"\u003espins on a wheel.) \u003c/i\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThere were also activities like flower arrangement and bonsai, and looking at them, it was a truly interesting lineup. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAnd all these listed games seemed to be available for experience at any time, not just during the matches. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p43\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-43_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 52\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt also seemed possible that the same game could be selected two or three times. With the detailed explanation, it became clear. For the three nights and four days, the idea was to interact with the kōhais, make things, play games, compete for rankings, and deepen friendships. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt might be boring for students who weren’t interested, but I was honestly looking forward to being able to experience creating things. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Attached to the printouts distributed on the bus is a point card. You can collect stamps when you participate in various experiential learning activities at the camp. Filling this out is a condition for receiving rewards, so be mindful.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe point card seemed to be a method to encourage voluntary participation in experiential learning. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThere were a few rules, like a limit on the number of stamps you can collect in a day and not being able to receive multiple stamps for the same game, but it didn't seem to be something to worry about. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAnyway, I wanted to try various things that I couldn't usually do at school. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWith the content understood, it seemed that even groups with low overall OAA abilities could see plenty of opportunities. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWith these rules, it seemed safe to say that there was a chance of winning against any group. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I hope it's clear that there's no need to be too concerned about winning or losing this time. Of course, it's fine to aim for first place and work together for the sake of rewards, but as you can see from the list of various games, the main focus is on the interactions using experiential learning. It's perfectly fine to actively interact with other groups and focus on deepening friendships.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSo far, we’d been given various tasks and their rules from the school, much like special exams. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eFor the first time, they acknowledged that we didn’t have to win, and losing was okay as well. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“This trip really feels relaxed. Even if we're in last place, we'll still get 1,000 \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eyen.”  For now, many students, starting with Kei, were relieved by the contents of the trip. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's right. The fact that there's nothing wrong with losing this time is a big deal.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe classmates who received the explanation began to loosen up and spent their time relaxed. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSome even started singing in high spirits. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Don't forget to follow the school's schedule, even though you're free to a certain extent.” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p44\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-44_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 53\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThat was a bit of a downer. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eKei and I checked the schedule written on the printout. \u003c/p\u003e\n\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eWake up       \u003c/i\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eLights out     \u003c/i\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eLunch break\u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003e7 a.m. \u003c/i\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003e \u003c/i\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003e10 p.m. \u003c/i\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003e1 p.m.~2 p.m. \u003c/i\u003e \u003c/p\u003e\n\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eBreakfast      \u003c/i\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eLunch        \u003c/i\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eDinner\u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003e8 a.m.~9 a.m. \u003c/i\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003e12 p.m.~1 p.m.    7 p.m.~8 p.m. \u003c/i\u003e \u003c/p\u003e\n\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eLarge bath\u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003e6 a.m.~8 a.m. \u0026amp; 8 p.m.~10 p.m. \u003c/i\u003e \u003c/p\u003e\n\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eExchange meeting\u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eMorning session 9 a.m.~12 p.m.  Afternoon session 2 p.m.~6 p.m. \u003c/i\u003e \u003c/p\u003e\n\n\u003cp class=\"P_Prose_Formatting\"\u003eOther than the time spent on the games, we were basically free the whole time.  In extreme cases, whether to take a nap without having lunch, or to immerse oneself in making things, was left to the individual's discretion. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf the group leader ordered participation in the game, that wouldn’t be the case, but it seemed that there were no penalties for refusing. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eOn the first day, it was announced that we’d arrive around noon, and from there, we would gather by group, have lunch, and then only the afternoon exchange meeting was scheduled. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I hope you’ll behave in a way that is not embarrassing to a senpai at the training camp.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWith that, the explanation seemed to be over, and Chabashira-sensei turned off the microphone and sat down. \u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p45\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-45_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 54\" /\u003e\u003c/p\u003e\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003eAfter the bus had been on the highway for about two hours, the view from the window was completely covered by the mountains. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe bus stopped in front of a different facility than last year, and the students began to get off. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe area in front of the main entrance where the buses were lined up was much more open than I would’ve imagined. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe building where we would be staying for the camp was built like an old inn—one with a long history. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAccording to the explanation from the school, it was originally a lodging facility and activity center built during the bubble era. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003e(TL NOTE: The bubble era (\u003c/i\u003e バブル期 \u003ci class=\"calibre3\"\u003e) refers to a time of excessive\u003c/i\u003e \u003ci class=\"calibre3\"\u003especulation and asset price inflation in Japan from 1986-1991.)\u003c/i\u003e Inside, there were classrooms for each activity. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThat was probably why there were so many experiential games listed in the previous printout. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Gather in your assigned groups. From now on, for the next three days, follow your leader's instructions, have discussions, and get along with everyone.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe 20 third-year students who were assigned as leaders for each group spread out. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eDirectly in front of me stood Kiryūin, hands in her jersey jacket pockets. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Well, see you later, Kiyotaka.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI watched Kei, who was reluctant to leave, for a moment, and then headed down to Kiryūin. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I look forward to working with you for the next three days, Kiryūin-senpai.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'm counting on you.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe first and second-year members assigned to Kiryūin's group, Group 20, were as follows, totaling 16 people:  \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003e\u003cb class=\"calibre6\"\u003e \u003c/b\u003e\u003c/i\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003e\u003cb class=\"calibre6\"\u003e \u003c/b\u003e\u003c/i\u003e\u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p46\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-46_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 55\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003e\u003cb class=\"calibre6\"\u003e[First-year Students]\u003c/b\u003e\u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e•   \u003ci class=\"calibre3\"\u003eClass A Toyohashi Goro, Kosumi Dan \u003c/i\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e•   \u003ci class=\"calibre3\"\u003eClass B Yanagi Yasuhisa, Eikura Mani \u003c/i\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e•   \u003ci class=\"calibre3\"\u003eClass C Tsubaki Sakurako, Shintoku Taro \u003c/i\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e•   \u003ci class=\"calibre3\"\u003eClass D Obokata Yukiki, Jute Misora. \u003c/i\u003e\u003c/p\u003e\n\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003e\u003cb class=\"calibre6\"\u003e[Second-year Students]\u003c/b\u003e\u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e•   \u003ci class=\"calibre3\"\u003eClass A Hashimoto Masayoshi, Yamamura Miki, Morishita Ai \u003c/i\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e•   \u003ci class=\"calibre3\"\u003eClass B Ayanokōji Kiyotaka, Nishimura Ryūko \u003c/i\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e•   \u003ci class=\"calibre3\"\u003eClass C Oda Takumi, Shiina Hiyori \u003c/i\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e•   \u003ci class=\"calibre3\"\u003eClass D Hatsukawa Maho. \u003c/i\u003e\u003c/p\u003e\n\n\u003cp class=\"P_Prose_Formatting\"\u003eKiryūin was the leader of the group. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eMy impression was that there were students who could do sports and students who could study. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was a balance that would be difficult to achieve in an evenly matched competition, but this was probably only possible because it was a casual exchange meeting centered around games. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eOf course, among the second-year students, there were many who I had interacted with, but among the first-year students, I hardly knew anyone other than Tsubaki. In that sense, there must’ve been a great significance in holding an exchange meeting. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Hey, I never thought I'd be teaming up with you in this way.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAs the group gathered, right from the get-go, Hashimoto casually approached me. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I agree.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eJust the other day, I had many discussions with Hashimoto and the others, but it was strange that the four of us from that day were in the same group. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'm both happy and disappointed. I wish we could’ve been together in some high-stakes special exam.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe seemed to have high expectations for me. I hadn't said a word about whether I could meet those expectations yet, but I’d leave it at that. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Even if it's just an exchange meeting, I would be grateful to receive a decent amount of money if I can get to the top. At least exchanging contact information with the first-years is a must. I'll invite you to join the group later.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEven without asking, it was a great help to have someone who was willing to take on the coordinating role—a time-consuming job. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I might delete your name from my contact list next month, though.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Hey, hey, stop with the Morishita-like unfunny jokes.” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p47\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-47_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 56\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI know I was the one who said it, but it might’ve sounded a little like Morishita. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eI wonder if that strange existence is influencing me in unexpected ways. \u003c/i\u003e As I was thinking that, a soft voice reached my ear. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Good morning, Ayanokōji-kun.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHiyori, who had slowly walked up to the group, called my name. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Good morning. I'll be counting on you starting from today. It's reassuring to have you here.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I feel the same way. I was relieved to know that we’re in the same group.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI felt like anyone would accept Hiyori right away, unlike me, but the world that she saw was completely different from what others saw. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI was genuinely happy to have a reliable friend join me. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Hashimoto-kun, I look forward to working with you as well.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHiyori, who was standing next to me, lightly bowed her head. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I always welcome cute girls. But you know, you two look good together when you stand side by side.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What do you mean?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I don't want you to take it the wrong way, but I think you two look more natural together than when you’re with Karuizawa.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eIs it because we have things in common, like reading, that makes it different\u003c/i\u003e \u003ci class=\"calibre3\"\u003efrom Kei? \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut there was no need to take everything Hashimoto said seriously. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe person who made that claim had already shifted his interest away from us and started to focus on the entire group that had gathered. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eKiryūin was ignoring the group and was staring at the winter mountains. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSo Hashimoto must have thought he had to make a move. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Um, is that everyone? Ah, no, are we one short? One, two, three—” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHashimoto quickly counted the number of people. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Fifteen, and sixteen including me. Looks like we're still one short.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eOne short? I thought everyone was here, was I mistaken? \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“There are 17 of us here. Yamamura Miki is also here.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Oh, really, everyone was here. . Sorry, Yamamura.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHashimoto hastily corrected himself, seeming to have genuinely overlooked her.  “No.. I'm sorry.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eFor some reason, Yamamura apologized, even though she was just forgotten in the count. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBeing unnoticed by Kiryūin and overlooked by her classmate Hashimoto, her inconspicuousness was on full display, but recently, it seemed to be even more pronounced. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p48\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-48_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 57\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHowever, once her presence was recognized, a sudden change occurred where I felt her presence more because I couldn't sense her as much as others. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHowever, that might only apply to me. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen I asked Hiyori about Yamamura, she said she had never had a proper conversation with her before, so I decided to speak to her, introducing Hiyori in the process. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“We seem to be crossing paths a lot lately.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Yes, that's true. I look forward to..  this time as well.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Nice to meet you, Yamamura-san.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen Hiyori gave her a gentle, enveloping smile, Yamamura stiffened. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Ah, yes. You're Shiina-san, right...?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eYamamura greeted Hiyori hesitantly, but she seemed restless, as if she had something on her mind. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Oh? Do you have something you want to ask me?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Ah—that..  you're completely different from what I thought. .” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Me?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen Hiyori tilted her head quizzically, Yamamura muttered in a low voice. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I thought you were more. . indifferent.. ” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eYamamura, who observed people from afar, seemed to see Hiyori in such a way.  Indeed, I had the same impression of her before. It was only through talking and getting to know her that I realized the difference between what I imagined and reality. “I'm sorry. I'm not good at talking to people, so I might’ve said something rude...” “It's totally fine. I'm not good at talking to people either, so we're comrades.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Is that..  so?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEven as she answered, Yamamura didn't seem to see it that way; her eyes said so. “You don't see it? If so, I think it's thanks to Ayanokōji-kun.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Ayanokōji-kun...?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eMine? \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe same question that Yamamura had was probably floating in my head. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Yes. Even though I'm not good at it, I've come to love talking with my friends. So I think you will surely come to love talking too.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHiyori took Yamamura's hand, who was on guard, and reiterated her message. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHiyori's statement that it was thanks to me was an exaggeration, but I hoped that Yamamura would feel the same way someday. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p49\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-49_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 58\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAnyway, with that, all the members of the Kiryūin group were gathered together. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Ayanokōji Kiyotaka. Nice to see you.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThere she was, Morishita, who called me by my full name without any honorifics but in a polite manner. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Nice to see you too.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You’re—um. . Shiina Hiyori, right? I'm Morishita Ai. Hello, hello.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe bowed her head slightly. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'm Shiina. Nice to meet you, Morishita-san.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eStarting with Yamamura, the second-year students exchanged light greetings. Then they started to greet the first-year students, who were nervously gathered in one place. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eKiryūin, who had been waiting without intervening in the ongoing conversations, turned around. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Now that the greetings are over, let's have lunch. Let's disband for now.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Wait a minute, Kiryūin-senpai. Wouldn't it be better for us to have lunch together to strengthen the camaraderie of the group?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHashimoto quickly stepped in to counter Kiryūin's immediate declaration of disbandment. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIndeed, in that situation, Hashimoto’s suggestion wasn't a bad one. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIn fact, looking around, it seemed that most groups were starting to act as a unit.  “Then I'll leave it to you.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eKiryūin accepted Hashimoto's proposal, but at the same time, indicated that she wouldn’t be joining them. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThen, she left the group and disappeared into the inn alone. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Man, seriously? We've got quite a leader here.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHashimoto sighed in exasperation at the situation where the leader had gone absent. “We can ignore her. I agree with the group lunch.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was too much to leave all the decisions to Hashimoto alone, so I lightly backed him up. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's right. She said she'd leave it to us, so there's little reason to disband here.” Hashimoto decided that it was detrimental to think too long about the situation, which was confusing the first-year students, and started to act quickly. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEven if there were students among the first-years who were reluctant to have a meal with their senpais, given that this was considered an exchange meeting, objections were unlikely except from people with strong personalities like Hōsen. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Wait a minute, hey! Kōenji!” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p50\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-50_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 59\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBehind Hashimoto, who was explaining to the first-year students, there was a small issue in another group nearby. It seemed that Kōenji, who had been assigned to the sixth group, had left the gathering without following the leader's instructions. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe other second-year students in the same group, who were used to seeing this sort of behavior from Kōenji, didn't say anything to the bewildered first-year students, even though they found it somewhat nostalgic. Even Inogashira, a classmate, seemed anxious, but in the end, she seemed to have no choice but to let it go.  For a moment, Inogashira and I made eye contact, but she quickly turned back to her angry leader's voice. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I wonder what happened to Kōenji-kun.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHiyori, who apparently didn't understand, muttered as she watched Kōenji's retreating back. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“He's always acting alone. He probably won't come back.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Is that so?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Kōenji Rokusuke is a person who can't work in a group. It's something we already knew. My condolences.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt seemed that Morishita knew exactly what was going on. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe clasped her hands together as if praying for the sixth group, which was already being hit with a lack of coordination. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“If you had been in the same group, Ayanokōji Kiyotaka, would you have stopped him as a fellow classmate?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Because we're in the same class, I would’ve been sure it was useless to stop him and overlook it.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhether or not we were in the same group wasn't important. If someone had called out to him and he stopped and listened, it wouldn't have been a problem. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Alright. All the first-years have agreed. Let's go too.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHashimoto gave the order, and we, the 20th group, started walking without our leader. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAs we entered the inn with our shoes on, a slightly damp smell hit our noses. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt might not have been a place that was often frequented. The students walked in a line, heading to the cafeteria. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSince our leader was absent, it seemed inevitable that Hashimoto, who took the initiative, would bear that burden. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhile having a lively lunch as a group, Hashimoto took the lead and became the center of the conversation. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe encouraged the first-year students who were still hesitant and the less talkative ones, boosting their spirits without resorting to any foolish commotion, and skillfully broadened the conversation to include them. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p51\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-51_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 60\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHonestly, for students like me who were typically listeners, he was a lifesaver. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Um. . Hashimoto-senpai. It was written in the rules of this exchange meeting, but we don't need everyone to be present for the games, right?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Yeah. The number of people participating in one game is up to five, and the same person can participate as many times as they want. It seems pretty flexible.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAll we needed was the required number of people plus the leader to be present at the designated time. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Looking at Kiryūin-senpai, it seems like she's not interested in the exchange meeting, so we can just do whatever we want..  but I wish she had at least told us what she’d do.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSince the leader is the one who decides the players, the plan was for Kiryūin to decide as soon as the game content was announced. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHashimoto seemed to be bothered by the fact that Kiryūin hadn't asked anyone about what they were good at or anything. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“For now, all we can do is to try our best.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Kiryūin-senpai is amazing, isn't she? Maybe she already knows about us?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eA female student from the first-year Class D, Jitsute, asked Hashimoto. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEven without directly knowing her, it wouldn't be surprising to know about Kiryūin's exceptional abilities. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That’s not possible. There's no way she could know who in this group is good at flower arrangement.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHashimoto was skeptical, and rightfully so. No one would know about each other’s individual strengths and weaknesses at this point. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“There was a reason why I suggested we all eat together. Let's rate our confidence in the game contents written on the printout on a scale of one to five. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eOne means you’re not confident.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was a simple but inevitable decision that the leader should take the initiative to make. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEveryone used their phones to rate their own game-related abilities. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHowever, the difficult part was that there were many unusual things. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf it was something you had never experienced before, you could only rate it a one, and even if you felt like you could do it, you could only rate it a maximum of two. Moreover, they didn't even provide a place to practice many of those activities in advance. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThings that required impromptu creativity were particularly difficult. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEveryone used their phones while eating. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThere was a considerable amount of activities, so some people finished eating by the time it was completed. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p52\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-52_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 61\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAnyway, this way, we could gather data for everyone as a guide. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAnd it was immediately shared in the group chat that Hashimoto created. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“. .This isn't going to work.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHashimoto's first words after looking through it were harsh. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAs feared, almost all of the students gave a rating of one to two to most of the games, and there were hardly any ratings of four or above. Hashimoto seemed to have given up on the chance of winning. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Maybe we should just give up on the exchange meeting and just play around.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut it was too early to make that judgment. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThis phenomenon was undoubtedly happening in other groups as well. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I feel like there are fewer groups that are serious about it..  Well, for now, I'll show this information to Kiryūin-senpai and let her decide on the plan.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIn the end, that was what it all came down to for this exchange meeting. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf Kiryūin was motivated, the kōhais would just follow her lead. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf she wasn’t motivated, she'd just participate casually and relax at the training camp. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003ePersonally, I'd like to take it easy. \u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p53\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-53_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 62\" /\u003e\u003c/p\u003e\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003eAfter finishing lunch, I got up from my seat while looking at a message from a certain person on my phone. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was just before one in the afternoon. There was about an hour left until the first game of the day. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Sorry, but let me step out for a bit. Is it okay if we meet up in the shared room?” “Yeah, that's fine. I'll take the first-years and do some experiential learning or something.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI thanked Hashimoto, who was taking on the hassle of being a senpai, and headed to the break room marked ‘Rest Area.’ \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShortly after I arrived, I saw the person who had called me sitting alone on a two-seater sofa, looking bored out the window. There seemed to be another person, standing and glancing at the view outside the window. It didn't seem like a coincidence, considering the combination. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Do you need something from me, Nagumo-senpai?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Need? Well, it's not much of a need, but I do have something to talk about.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eUsing his fingertips, he gestured me over. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI complied and sat down on the empty sofa in front of me. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe person standing by the window, Asahina, turned around. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Hey there, Ayanokōji-kun.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThen, she left her spot, pushed Nagumo to the right end of the sofa, and forcibly sat down next to him. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I was expecting some kind of special exam, but it turned out to be just an exchange meeting. I'm honestly upset.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHis first words, facing me directly, were of disappointment in this training camp. “I really have bad luck.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNagumo lamented his misfortune and shook his head lightly with a small smile. “You think so too, don't you?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNagumo, who was leaning on the armrest with his elbow and gently resting his cheek on it, asked with a look of disgust. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Indeed, compared to last year's mixed training camp, it's undeniable that this one is a significant step down. That's probably why it's positioned as an exchange meeting rather than a special exam.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eLast year, there was a risk of expulsion, but this year, there wasn't even a penalty specified. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p54\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-54_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 63\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI could understand Nagumo's great disappointment. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“But you knew this was coming, didn't you, Asahina? Considering the timing of the training camp.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“...Yeah, I guess.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNow that it was February, it was hard to imagine having a difficult special exam involving all grades. That was what Asahina expressed. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It would’ve been virtually impossible for all the third-year students to participate, like last year.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen I muttered that, Nagumo responded. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Many of us third-years are dealing with exams and job hunting at this time. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eOnly those who have already decided their future and have spare time can participate in the training camp. No matter how many private points they can get in return, most of them would rather save every minute and second.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe third-year students had created a rule to collect and manage private points by Nagumo. If they saved up to 20 million points, someone could be pulled into Class A. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHowever, this time, the reward was non-transferable, could only be used within Keyaki Mall, and the amount was not significant. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEven if they sought to further their studies, I wasn’t familiar with university circumstances, but private university entrance exams generally started from late January. For national and public universities, it would be late February. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eConsidering that it was early February, it seemed that many students were about to face their main exams. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIn such a situation, spending three nights and four days taking care of their kōhais was too big a price to pay. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Last year, the joint training camp was held a month earlier, but wasn't it quite tough for the third-year students even then?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I think so. There were quite a few third-year students who brought textbooks. I thought that might be why it was more relaxed this year.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eConsidering this, Horikita Manabu's generation might have struggled a lot behind the scenes. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003ePerhaps the school had prepared some relief measures, but we couldn’t know that. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEven if it was a busy time and this trip was said to be more relaxed, the third-year students participating in this exchange meeting were likely limited to those who had a clear goal for further studies or employment. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Can we assume that the third-year students who are participating in the exchange meeting did so voluntarily?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIn response to my question, Asahina nodded. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p55\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-55_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 64\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“They were recruiting five volunteers from each class. If they didn't reach 20, they planned to reduce the number of groups and adjust.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt seemed that the school was also considerate of the third-year students. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I haven't asked until now, but what will you and Nagumo-senpai do after graduation?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen I asked with the flow of conversation, Nagumo looked up, surprised by the question. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Do you want to know?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe seemed pleased to have sparked my interest. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI felt that if I answered vaguely here, he might get upset, so I nodded honestly. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'm going to university. I have no intention of using the Class A privilege.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIn other words, he was confident that he could pass on his own merit. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'm also going to a university, like Miyabi. But it will be different from his. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eMy self-scoring on the common test for the university entrance exams I took recently was just under the cut-off point, and it might be a bit impossible at my level. If I can graduate from Class A, I might be able to force my way in with the help of the school..  but I probably won't.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe specific name of the university didn't come up, but the university Nagumo was going to seemed to be prestigious. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAsahina's decision not to aim too high was probably correct. Even if you forced your way into a higher-level university with ANHS’s authority, there were various risks after admission. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe Class A privilege was best used for job-related purposes, as Keisei mentioned before. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I don't see any value in the Class A privilege itself. Do you know why?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Because you have the power to achieve your goals on your own.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That’s one of the reasons I dominated the third-year and became an overwhelming presence. Whether I'm in Class B or Class D at graduation, I believe I can get into the university I want and get a job at the company I desire with my own power.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAsahina looked at Nagumo beside her with a deliberately disgusted look, but it was probably true. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“So even if everyone unites and drops you to Class B, they know what would happen. That wouldn't raise motivation, and it would be hard to maintain. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThat's what led to the current results.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNagumo nodded in agreement. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHowever, of course, it was better to have the Class A privilege. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe difference was whether you relied on those privileges or considered it as just insurance. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p56\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-56_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 65\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“By the way, Horikita-senpai is also at the university where Nagumo-senpai is going. That should show how much he admires him.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe deciding factor for the university wasn’t where he wanted to go, but where Horikita Manabu was. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Leave me alone. If you want, you can take the exam next year and come to the same university. I'll welcome you.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“If I go, I'll have to work really hard on the common test..  right?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'll refrain. I think it would be quite difficult even with my academic ability.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eUnlike Asahina, who honestly accepted my words, it didn't seem to get through to Nagumo. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe laughed at my not-serious answer and shrugged his shoulders. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Let's get to the point. Honestly, the only thing you gain from this exchange meeting is private points, and there's nothing to lose. So it's a place where there are fewer people who take it seriously. I'm not just lacking in excitement, but I decided to think positively that it's better than not having it at all.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eA game is a game, a match is a match. This will undoubtedly be the last opportunity. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I thought that was the case. You want to compete with me in this exchange meeting, right?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's right.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eFor the third-year students, this was an exchange meeting with little return. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNagumo had taken the time to make a match with me happen. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eUpon hearing those words, Asahina moved her face closer to Nagumo. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Is that what this is about? It's not fair to treat Ayanokōji-kun poorly, right?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“So, you decided to join to protect Ayanokōji? You're quite kind.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“But Ayanokōji-kun hasn't done anything wrong. It's not fair that he's being targeted by you. Why are you so persistent in targeting him?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWith her shoulders, Asahina forcefully pushed against Nagumo. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut that seemed to have slightly irritated Nagumo, who retorted with a half-smile. “Do you know why Horikita Suzune joined the student council, Nazuna?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Isn't it because she wanted to follow in her brother's footsteps?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“No, that's not it. I don't know about now, but that wasn't the case when she first joined.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Is that so? Then what was her motive?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“This guy right here. Ayanokōji was using Suzune to keep an eye on me.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Eh?” Asahina opened her mouth in confusion. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I suppose he judged me to be a bad student council president, but in the end, that wasn't the case, was it?” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p57\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-57_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 66\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eOf course, it wasn't that there were no instances where Nagumo's actions were excessive, but he didn't cause any problematic behavior that warranted strong caution from Horikita Manabu. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's true. I think what you did brough
