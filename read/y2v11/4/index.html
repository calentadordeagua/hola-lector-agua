82\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-82_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 93\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eKiryūin reluctantly told Asahina, who kept her eyes sparkling. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“If I had to choose a job to achieve something, I might aim to be a politician.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“A politician!? Wow..  but it's not common to think of becoming a politician..  even Miyabi has never mentioned becoming a politician, and I've never seen anyone around me do it.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAsahina, eager to know how she came to have that dream, listened attentively. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Do I have to talk about it?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“No? Though, I think this might be the last chance to leisurely talk with you..  I want to hear it.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAt Asahina's request, Kiryūin said it was special and revealed the reason. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“When I was little, I had a lot of opportunities to meet politicians because of my family relationships.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Oh, so that's why you wanted to become one?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“No? It was because of opportunities like that that I decided against becoming a politician. I just let their talk go in from one ear and out the other.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Ah, I’m biased, but..  politicians seem to be mostly bad people.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's right. Most of them were corrupt people who were often featured on TV and in the media. It's not a profession I admire at all.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf that was the case, there must’ve been another reason why she mentioned it as a dream. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Because it's such a corrupt world, there are also those who shine. He was one of the few people I admired.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What's the name of the politician? Do I know him?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It's Kijima-san. He's become quite important now.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Eh, Kijima? Eh? The Prime Minister?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eKiryūin affirmed. Asahina seemed quite surprised. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I thought it wouldn't be so bad to aim for the same stage as him. He’s active on the front line.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“But you're not aiming for that..  right?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I don't plan to at the moment.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It seems like you, Fūka-chan, could even become a politician.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Didn't I tell you there's a lot going on?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe more she stood out, the more she hated having the Kiryūin name follow her around. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Why don't you aim to be a politician instead of me, Ayanokōji, fulfilling my dream?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's quite an unexpected suggestion. I've never even considered a career in politics.” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p83\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-83_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 94\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“My intuition tells me you might do surprisingly well.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'm fine with being ordinary. I'll go to some suitable university and get a suitable job.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I see. Since I'm also aiming for the same path, we're both dream chasers in our own way.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Whether it's Miyabi or Fūka-chan, inviting Ayanokōji-kun, it must be something special, huh?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'm just being targeted by curiosity seekers. The next game is about to start.” If we continued talking, we wouldn't be able to avoid being late. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Oh, is it that time already? I need to hurry!” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAsahina jumped off the swing and waved frantically at us. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“See you later!” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Don't rush and fall.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I know! Whoa, whoops!” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe almost fell as she started running. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI didn't expect to see the same pattern twice in one day, let alone in such a short time. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Did you get to meet Kōenji?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I did talk to him. It was a waste of time though.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI told her the purpose of my visit here, that I couldn't get Kōenji to participate in the exchange meeting. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I see. So Kōenji is uncontrollable after all, huh?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I tried to find a way in, but there was no opening.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“So there are things even you can't do, Ayanokōji. I'm glad.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI was praised for my inability. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Did you send me to see this result?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I can't deny that I wanted to see it.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI thought it was strange to favor another group, but she was a rather mean-spirited senpai. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“But Tatebayashi is harsh. It's true that I can't bear to see a kōhai being oppressed.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It would be nice if he could be tough on Kōenji, but it doesn't affect him.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBesides, there was a huge difference in ability. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eConsidering the possibility that Kōenji might bear his fangs, it wouldn't be strange for Tatebayashi to direct his stress toward another person in the group. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Well, we can't help it. Let's move on to the second match.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe game proceeded as follows. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cb class=\"calibre6\"\u003e[Pottery] \u003c/b\u003e\u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p84\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-84_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 95\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEveryone was a beginner, so it was a low-level battle. I took the lead with my dexterity and won. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cb class=\"calibre6\"\u003e[Table tennis]\u003c/b\u003e × 2 \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was the same game twice in a row, but I had some experience with table tennis at school, so I won easily. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cb class=\"calibre6\"\u003e[Jewelry making] \u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI was worried about how it would go, similar to  \u003ci class=\"calibre3\"\u003eoshibana, \u003c/i\u003e but my opponent was also inexperienced, so I was able to compete on equal terms. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIncluding the  \u003ci class=\"calibre3\"\u003eoshibana\u003c/i\u003e, Takahashi was following all the games, probably because Nagumo had instructed him to confirm the results. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI thought I would be forced into a game with more luck elements, but overall, it was a good first day. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAnd perhaps influenced by my five consecutive wins, the group also managed to win five games in a row without losing. \u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p85\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-85_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 96\" /\u003e\u003c/p\u003e\n\u003ch1 id=\"chapter-3\" class=\"chapter-title\"\u003eChapter 3: Request from Horikita and Request from Ayanokōji THE NIGHT OF the first day of the exchange meeting.\u003c/h1\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThis was probably the biggest difference from last year's camp: The rooms assigned to each student were grouped together. In other words, the first and second-year students slept in the same room. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eDepending on their personalities, this time of the day could be the most stressful time for both first and second-year students. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThat was why Hashimoto hastily created an environment where they could break the ice. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt seemed to be working, as the first-year students had already gotten close enough to Hashimoto to be able to talk to him with a smile. Among the eight people in this room, I was the one who was the most reserved with everyone else. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You did great winning all your matches on the first day, Hashimoto-senpai.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“We didn't know who our opponents would be, so we honestly had no idea what would happen.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eToyohashi and Yanagi happily said so. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEach of them had a turn at table tennis in today's third and fourth rounds, which probably influenced their mood. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShintoku and Obokata also seemed to agree, nodding several times, but they seemed a bit shy. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'm sorry. We haven't participated even once yet.. ” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Don't worry about it. From what I saw today, about half of the students haven't participated. Honestly, the gaming aspect is really just a bonus. For those who haven’t participated, their role is just to experience the games.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe experiential learning format, where students collect stamps on a point card, was initially met with skepticism, but the system seemed to be more used than expected. It provided a good opportunity to deepen friendships by inviting friends, senpais, and kōhais. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAs far as I could see, there wasn't a single group that was eagerly aiming for a win in the five games played today. Maybe that freedom had contributed. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHowever, that didn't mean it was easy to reach first place. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eConsidering today's game progress, a tough battle was expected from tomorrow onwards. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThere were four groups, including ours, that won all five matches. Three groups won four out of five matches. There were also four groups that lost all five. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p86\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-86_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 97\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe distribution of wins and losses showed the polarizing approaches to the exchange meeting. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAmong groups that won one or two matches, there might’ve been some that were seriously engaged, but it was uncertain what would happen if they couldn't break into the top ranks from tomorrow onwards. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eFrom the second day on, it seemed that we would be competing for first place with about half of the groups. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Nagumo-senpai's group is a first-place contender, aren’t they?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eTakumi Oda, from Class 2-C, muttered, reflecting on the five matches. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I thought so too. They seem to have won all their matches as well.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eMany students in that group were serious—that was their group’s strength. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThere wasn’t a single student who thought it was okay to slack off. It was safe to say that it directly contributed to their win rate. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was easy to imagine that they had been exposed to various experiences, gaining valuable lessons along the way. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBecause it wasn’t a battle of academic ability, we were able to compete equally in that aspect. Though, it could also be said that a gap was created because many of the students were inexperienced in multiple games. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“By the way, Hashimoto-senpai, about my class—” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe conversation wasn't just about the exchange meeting, but also included trivial personal topics. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI watched the seven-people conversation, feeling somewhat detached. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEven though the group had only been together for a few hours, the first-year students already seemed to admire Hashimoto, and the conversation was naturally lively with him at the center. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAs expected of someone who prided himself on his ability, there was no other way to put it. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe was beginning to build relationships as if they had been acquaintances or even friends for a long time. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eYōsuke and others who were good at blending in with their surroundings are also similar, but he was a different type. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhat was a little disconcerting was that Oda had also managed to fit in quite well..  “But, it was a surprising day in many ways.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHashimoto groaned, holding a memo in his hand that recorded the wins and losses of each group announced by the school. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Ryūen's group lost twice, and Sakayanagi's group even lost three times. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThey might drop out of the race to the top tomorrow.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eToday, we didn't have a match with either of those two groups, so the details were unknown. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p87\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-87_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 98\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf Hashimoto hadn't taken on the role of organizing the first-year students, he might have gathered more information, but it seemed that he couldn't manage that.  “It's surprising. I've always had the impression that Sakayanagi-senpai was strong. I wonder if it's different because a third-year student is in command.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAccording to the OAA, a third-year Class D student named Iki had generally poor grades, especially in terms of academic ability. His grade was D+, which was quite unsatisfactory. From this, it seemed unlikely that he was participating as part of the college-bound group. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“If Sakayanagi wanted to win, it would be normal for her to take command, regardless of whether it's a third-year or whatever. She wouldn't back down even if her opponents were Nagumo-senpai or Kiryūin-senpai. Especially Iki-senpai, right? No matter how you think about it, she would quickly seize control..  No, even before that, she's the type who would want to leave everything to competent comrades.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt seemed that Hashimoto knew a little bit about what kind of person Iki was.  “So, is it simply a lack of ability?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eKosumi, who had been quiet until now, muttered that, but Toyohashi immediately denied it. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“At least the first-years are quite good. The second-years are probably the same, right?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAs Toyohashi said, the group Sakayanagi was assigned to was not that bad. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIki also seemed to have chosen reasonably competent members from both years and considered the possibility of winning. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSo it was only natural that Hashimoto questioned why she had lost to an opponent she considered inferior in today's match. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Whether it's a special exam or an exchange meeting, Sakayanagi always aims to win.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHashimoto, who had been by her side all along, knew this better than anyone. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eLooking at the results of the three losses, Hashimoto must have had doubts in his mind. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I think so too. I wonder if she's up to something.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eOda also seemed to be troubled by Sakayanagi's three losses and was deep in thought. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHowever, thinking about it here wouldn't yield any answers. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEventually, the seven of them started to get excited about a completely unrelated topic. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p88\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-88_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 99\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAfter a while, Hashimoto distanced himself from the first-year students and walked over to me, who had been watching from afar. On his way, he picked up the TV remote and deliberately turned on a variety show to make the room noisy. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Could it be that the damage she took from losing Kamuro was significant?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHashimoto, who wanted to confirm the reason for the three losses, asked me this.  “Maybe.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was difficult to judge based on the current results alone, but there was no evidence to the contrary. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“If she's really getting weaker, it's a good thing for me. If we go into the end-of-year exams like this, I might have a chance to win.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAs he said, Hashimoto wasn't simple enough to take these results at face value. “Can you find out what the real situation is with Sakayanagi, Ayanokōji?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's your specialty, not mine.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI tried to immediately refuse, but Hashimoto whispered in my ear just in case.  “Please spare me this time. I'm Class A’s most wanted man right now. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEspecially Kitō—he seems to be really angry. It's okay for now because Sakayanagi hasn't said anything, but who knows what will happen when my betrayal becomes clear.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe muttered as he imagined it and hugged himself. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut his expression remained faintly amused. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You don't seem to be scared, do you?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“If I can't even bluff, I wouldn’t have the right to betray the class.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThat made sense too. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Besides, I've moved on thanks to you. I'm grateful for that too.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHashimoto, who had visited my room on the day of the two-person meeting, had laid himself bare. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNow he can face forward thanks to the benefits of that conversation, but the effect was probably temporary. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eOnce the impact of his betrayal began to take effect, it would no longer be the case. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHashimoto's time was running out. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You can contact Sakayanagi directly, right?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was fine to feel a little better, but that was one thing, this was another. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You are free to wish for whatever you want, but when did I become your ally? I don't intend to stick my neck into any trouble.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'm thinking about it separately from that. But at least in this exchange meeting, we're on the same team. Even if she's lost three times, as long as RoyalMTLs \u003c/p\u003e\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p89\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-89_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 100\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSakayanagi is there, she's a first-place candidate that we should be wary of. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eConsidering that we might face each other tomorrow, it's not a bad idea to scout her out now.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe man who didn’t care much about group battles was brave in his public appearance. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's reasonable. But as long as you and I are in the same group, Sakayanagi will be more wary than usual. I don't want you to expect useful information.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I understand. I'll just consider it as a bonus, okay?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“. .Alright. I'll just do as much as I can for now.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'm counting on you.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI also wanted to know the reason for the three losses. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut whether or not I would pass on the information I gained to Hashimoto was another matter. \u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p90\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-90_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 101\" /\u003e\u003c/p\u003e\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003eThe quickest way to get in touch with Sakayanagi was, needless to say, to contact her directly. However, it would be difficult to know her current situation in detail. She might speak honestly to me, but I could also predict that there would be many things she would intentionally hide. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAnother option was to indirectly extract information from someone who knew Sakayanagi's current situation in detail. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut this also carried risks. I was interested in Sakayanagi's situation—it was unavoidable that they’d know that. Hondō and Shinohara from Horikita's class are assigned to the same group as Sakayanagi, but neither of them were the type to keep their mouths shut or were good actors. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIn the meantime, I decided to go out to the lobby to slowly organize my thoughts. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eDepending on the timing, I might have been able to find Sakayanagi out and about. “Ayanokōji-kun.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAs I moved to the lobby, one student noticed me and approached. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was Sanada from the same class as Sakayanagi. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe seemed to have just gotten out of the bath, as his hair was wet and I could see a few droplets of water on his glasses. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Can we talk for a bit? There's something I've been meaning to ask you.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I don't mind. What did you want to ask?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI was also grateful to have run into Sanada. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eOn the first day, he had won a game against the group Sakayanagi belonged to.  “It's about Hashimoto-kun from your group. I guess you've heard various rumors about him.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Like how he had a hand in Kamuro's expulsion?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I don't intend to pry into it without any solid evidence, but regardless of the truth, I'm curious about his current situation..  I wonder how he's doing.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNow, in Class A, not only Sakayanagi but also Hashimoto was attracting a lot of attention. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt wouldn't be strange if there were students like Sanada who were concerned about them. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“There's nothing particularly different from usual. He seems to be doing well, not just putting on a brave face.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I see. . That's good.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“But how about Sakayanagi? Has there been any change with her?” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p91\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-91_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 102\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eFollowing the flow of the conversation, I tried to touch on Sakayanagi. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“As far as I could see at school, she seemed to be the same as always.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I thought the fact that her group had lost three times at the exchange meeting might have had some effect.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'm not sure, but that might be the case. However, we haven't seen each other much since we came here, so I don't know the details.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAt least for now, Sanada answered that he didn't have a grasp on the situation. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“But didn't you play a game against Sakayanagi's group today?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen I pointed that out, Sanada quietly shook his head. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“She didn't participate. I didn't see her giving any instructions nearby either.” She might’ve just been absent from that game, but it seemed more likely at that point that she hadn't been involved in the exchange meeting at all. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What about you, Ayanokōji-kun? Do you know anything?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Unfortunately, no. The information I have is probably the same as yours.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIn fact, I might have had even less information. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'd be happy if you could keep an eye on Hashimoto-kun, as well as Sakayanagi-san, even a little.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“As a member of the same group, I intend to keep an eye on Hashimoto as much as possible, but I don't know the details, so it's not my place to interfere. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhat do your classmates actually think? Do they think Hashimoto really betrayed them?” “That is—” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eUnable to immediately answer, Sanada couldn't continue. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I haven't talked directly with my classmates, so I can't say for sure who thinks what. But there are definitely people who assume that's the case.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe first person who came to mind from the conversation with Hashimoto earlier was Kitō. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe was a man of few words, but he had always been obedient to Class A. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe and Kamuro seemed to get along well, as they were often together. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAfter that, I talked with Sanada a little more, and then I spotted Horikita looking at us from a distance. She seemed to want to talk to me, so I ended the conversation at a reasonable point. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAs soon as I was alone, Horikita approached me. Even though there were only 20 third-years, it seemed that the chances of running into someone were still high despite the large number of students. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'm glad I ran into you. I have a little favor to ask..  Is that okay?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHorikita, who started off with a friendly attitude, didn't seem to have a problem with the exchange meeting. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p92\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-92_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 103\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was common knowledge that Nagumo’s group had been undefeated and was in first place with five consecutive wins since the first day. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What's the favor?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen I asked back, Horikita pulled my sleeve and forced me to move to the edge of the lobby. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It's about Amasawa-san..  It's not something I can talk about out loud.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“She's in your group, isn't she? Did something happen?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen it came to confidential matters, the first thing that came to mind was trouble. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut that guess seemed to be off, as she immediately denied it. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“She talks a little too much, but she hasn't done anything problematic. She's been behaving well so far.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eRelieved at that, I waited for Horikita to continue. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Did you know how good her physical abilities are? It seems that she’s also quite skilled in martial arts.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Setting martial arts aside, I do regularly check the OAA and have a rough grasp of it.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhile giving a noncommittal response, I urged for more information since the full picture was not yet clear. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I think you wouldn't know about it unless you heard it from Amasawa-san, but I owe her a bit of a 'debt'—something I can't repay in my typical school life.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eMartial arts and the word 'debt.' \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAlthough she avoided direct expressions, it seemed that she had a confrontation with Amasawa at some point. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eLooking back, without thinking deeply, it seemed that the only stage for such a confrontation would have been the deserted island exam. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It's hard to imagine the circumstances.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI decided to say something that most people would say upon hearing this story. “Well, various things.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHorikita evasively responded, showing no intention of elaborating on the \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e'debt.' Since it wasn't something I needed to pry into, I decided to move on. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“So, what's next?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I've been doing my best every day. But I don't know if I'm at a level that can compete with her. So, I want you to evaluate my current strength.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I understand you want to repay your debt to Amasawa, but it sounds quite dangerous.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It would be under normal circumstances, but her strength isn’t normal.” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p93\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-93_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 104\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Even if you say 'strength,' I don't know how strong Amasawa is. I can't be of much help.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWithout knowing the exact strength of the opponent, preparing a measure was meaningless. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e—Well, in reality, I did know. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut I decided to keep that to myself. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You just need to judge my strength in your own way. Of course, I would be happy if you could give me some advice.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eFrom her tone, it seemed that she might’ve been more interested in my advice. “It's up to you if you want a rematch, but has Amasawa agreed?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Not yet.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHowever, Horikita quickly continued. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“If she refuses my proposal, I won't force her to do it.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eDespite her answer, it seemed that Horikita didn't consider the possibility of Amasawa refusing. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAfter all, she had gone through the trouble of confiding in me and asking for special training. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Would you..  accept my request?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Accepting is a problem in itself.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eFacing Amasawa would be quite disadvantageous. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNo matter how much Horikita had trained after her defeat, it was unlikely that the gap in their abilities could close that easily. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Why don't you ask Ibuki over there? She would be happy to help.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI called out to someone who was probably hiding nearby and listening in. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Tch, you noticed.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWith an annoyed click of her tongue, Ibuki showed her face from around the corner of the hallway. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was clear that this was a prearranged plan between the two, as Horikita didn't seem surprised. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Unfortunately, I'm tired of sparring with Ibuki-san. There's little to gain from fighting the same opponent over and over.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIbuki, standing next to her, seemed to have a similar 'debt,' showed a similar reaction. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt seemed that this was a request made after doing everything they could. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You're strong, so you should be willing to help a little.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Are you also up for it, Ibuki?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Of course. I can't stand losing to a little girl who's only been here a year.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAfter throwing a few punches, she showed off a clean high kick. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe seemed desperate to land that kick. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p94\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-94_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 105\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was nice to be enthusiastic, but even though she referred to Amasawa as a little girl, there was only a one-year difference between them, and in terms of actual physique, Ibuki was actually smaller. . \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You decided to do this during the training camp because you wouldn't have trouble finding a place to spar, right?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It would be too conspicuous to have a fighting rematch at school.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHorikita, who gave a small nod in response, seemed determined. Ibuki too, for that matter. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I wonder. . Honestly, there’s nothing in it for you. .” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Indeed, I don’t have anything to gain from this.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“But if you were to accept, I'm willing to offer private points as compensation—” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe seemed ready to offer compensation, but it was pointless to accept such a thing. “I don't know how much it will help, but if you accept my conditions, I'm willing to take it on.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI interrupted Horikita's offer and responded. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Really? I wasn't expecting that at all. .” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Whether or not both parties agree to it, there are more disadvantages to getting into a fight at school. If you want to pay back some kind of debt, you don't want to miss such a great opportunity. However, you can't just go out at night.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Thank you. I couldn't ask for more cooperation. So, what are the conditions?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThere were absolute conditions that had to be accepted in order to face Amasawa in a rematch. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“The first is to talk to Amasawa today. You're in the same group, so it shouldn't be hard to find an opportunity to do so. Of course, to avoid making a fuss, make sure no third party finds out. The timing should be early morning on the last day. You should get Amasawa to accept the rematch at that time.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe chances were slim, but if she refused, the special training would be meaningless. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Of course, I understand that. What are the other conditions?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'll talk about that once you've finished this one. There's no point in special training if Amasawa doesn't accept. Besides, we can't do it in the middle of the night at the training camp, can we?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSince this was a discussion based on the premise that she would accept, there shouldn’t be any objections even if they didn’t hear the remaining conditions. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'm ready to do it right now, you know?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You should keep quiet.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHorikita, unlike Ibuki who had quickly agreed, had proper common sense. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p95\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-95_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 106\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“If I get permission from Amasawa-san, I'll send a message.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Please do. I'll be ready in the morning.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAmasawa wasn’t the type to refuse a fight. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eOn the contrary, if these two wanted a rematch, she would be happy to accept. She would understand that this camp was the perfect place with fewer watchful eyes. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAs Horikita nodded and was about to return to her room, I stopped her. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“This isn’t related to the exchange meeting, but there's something I want you to investigate.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What is it?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf she was planning to propose a rematch, she could probably deceive Amasawa's sharp sense. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI made a small request to Horikita. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I don't quite understand, but I just need to keep that in mind, right?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Yeah. Don't tell Amasawa.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I understand. It's not a big deal.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI thanked Horikita, who readily agreed, and the meeting was over. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Well...” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI decided to look for Sakayanagi a little longer. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHowever, I wandered around the training ground aimlessly, but I couldn’t find Sakayanagi. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAround 9 p.m., as the crowd began to thin, I decided to call it a day. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen I returned to my room, Hashimoto, Toyohashi, and Shintoku were preparing to go to the bath and were waiting for me, so I decided to go to the large bath with them. \u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p96\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-96_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 107\" /\u003e\u003c/p\u003e\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003eAfter enjoying the bath at the large bathhouse for about an hour, I returned to my shared room with the three who came with me. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThen, I saw the third-year student, Tatebayashi, standing in front of a room, looking displeased and fidgeting with his right foot. He seemed quite irritated. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You finally came back.. ” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eTatebayashi’s gaze wasn’t directed at us, but further back. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was Kōenji, who had been doing as he pleased all day. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was expected, but judging from Tatebayashi's behavior, he hadn't been able to make contact even after all that time. He didn't care about the irritated senpai and went to the front of the room. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Could you move? You're in the way.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What the hell are you—” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBefore the lecture began, Kōenji pushed Tatebayashi's shoulder and entered the room. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt wasn't that he had forced his way in, but rather that he had overpowered him with his superior physique and strength. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eRumors about Kōenji should have spread enough among the third-years, but if you didn't have any direct experiences with him, you’d just feel some irritation. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWithout even trying to close the open door, Tatebayashi followed Kōenji who disappeared into the room. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Hey, are they going to fight?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShintoku, a first-year, looked at Hashimoto for instructions on what to do. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Kōenji really is a handful. Should we just watch for now?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf the door had been closed, they could have ignored it, but it was left wide open.  Everyone casually peeked inside. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eKōenji, who had entered the shared room, was already on the futon at the far end.  Three first-years and.. it seemed that all the second-years except Kōenji were out. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe started stretching as if he ignored Tatebayashi, who was standing and looking down. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI wondered what feelings Shintoku and Toyohashi had when they saw this. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I don't want to get involved with Kōenji-senpai...” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Same here. .” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eDisgusted, they said such things without thinking. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What have you been doing until now!” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p97\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-97_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 108\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eTatebayashi, who had a reputation as a leader, questioned him. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Me? It's obvious, isn't it? I'm polishing myself.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Huh? Polishing yourself? Don't talk nonsense!” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNo matter how loud he shouted, it wouldn't resonate with Kōenji. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Cooperate properly tomorrow! We're on the edge here!” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's an impossible request.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eKōenji answered without looking at Tatebayashi at all. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe eyes of the first-year students peeking in at Kōenji were beginning to turn cold. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was hard to adapt to this guy in a short period of time. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe kōhais in the same room were silent, seemingly unable to move. The atmosphere was heavy. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Impossible request? Do you even think about the group?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eTatebayashi continued his relentless attacks. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWithout caring about his group mates, Kōenji turned over the futon on the spot.  “Then I'll sleep at the edge.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Don't decide that on your own! I’m supposed to decide where to sleep!” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen Hashimoto quietly entered the room, he asked the first-years in the same room to stop Tatebayashi. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe quickly stood up and rushed to Tatebayashi's side, trying to calm him down with soothing words. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eTatebayashi, who was breathing with both shoulders, noticed the presence of the kōhais and regained a little calmness. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Okay? You still must obey the leader's instructions, right?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut— \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I refuse. I hate going through unnecessary steps. Can you be quiet now?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThat was the last straw. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eTatebayashi, who had been comforting the kōhai, pushed them aside and shouted. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It's not that I hate it!! There are first-years here too, I can't set an example as a senpai!!” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Don't you know the saying, 'One should undergo hardships in their youth even if they have to pay for it'? At times like this, young people should take the lead and give the better place to their seniors.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Ah, yes, that's right. Don't worry about us..  yes.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf a second-year student told them to give way, most first-year students would have no choice but to obey. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Then I, a third-year, will order you. Undergo hardships!” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p98\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-98_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 109\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003e(TL NOTE: There isn’t really a good way to translate this, basically just\u003c/i\u003e \u003ci class=\"calibre3\"\u003etelling them to actively seek out and embrace challenges/hardship.)\u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Come on, Senpai, calm down.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHashimoto stopped Tatebayashi, who was about to raise his fist in anger, by putting his arm around him. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe then turned his attention to us and asked us to go back to our rooms. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Let's go back.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“But, is it okay?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Hashimoto should be able to handle this situation.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eLeaving Hashimoto behind, we returned to our shared room. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eTen minutes later, Hashimoto returned to the restless first-year students. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Was everything okay?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“He calmed down. It seems he was desperate because he really wanted to win.”  Class 3-D had little money to spend freely due to the tribute to Nagumo and their low class points. Because the rest of their school life was just nearing its end, they seemed to want every bit of pocket money. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Nagumo-senpai and the other senpais took most of the good students, so they didn't have much leeway. So they took Kōenji from the leftovers and aimed for a one-shot reversal, and that's what happened.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf he could’ve handled him, he might’ve been able to make him take action. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was no wonder he was angry if such faint hope was betrayed. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It must be hard for you, Ayanokōji-senpai. . having someone like that as a classmate.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI didn't think anything of it, but I gained some newfound respect from the first-year students. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Well...” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eFrom here, we started preparing for bed, but there was still a problem that Hashimoto hadn't solved. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThat was who would sleep where. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eLike Kōenji and Tatebayashi had been arguing, it was a trivial but unavoidable part. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI remembered that when students slept together, there was often a fuss about where to sleep. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEspecially on school trips, it was a big deal when Ryūen and Kitō had a pillow fight. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Let's decide the issue fairly here. To avoid something like Kōenji, right?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHashimoto volunteered to take on the unpleasant role. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“No, we really don't mind where. Right?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Yes. If anything, Ayanokōji-senpai can decide next!” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p99\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-99_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 110\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“No, no, why Ayanokōji? You're fine with treating me badly?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHashimoto retorted with a bitter smile. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It's not like that..  Ayanokōji-senpai is our aspiration!” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Me too, Ayanokōji-senpai! I respect you!” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShintoku and Toyohashi, with their eyes shining, revered me. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“. .You seem to be admired in a short time.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Well, even if you say that.. ” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI was the one who was most confused. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eUntil just a moment ago, there was no such thing. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShintoku and Toyohashi, who had drastically changed their attitudes, were just tilting their heads, as were Kobayakawa and Yanagi, who were also first-year students. \u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p100\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-100_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 111\" /\u003e\u003c/p\u003e\n\u003cdiv class=\"calibre4\" id=\"calibre_pb_4\"\u003e\u003c/div\u003e\n\n\u003cstyle\u003e\n    body {\n        color: #e5e5e5 !important;\n        background-color: transparent !important;\n    }\n    .P_Prose_Formatting {\n        font-family: serif; /* Match standard LN feel */\n        font-size: 1.08em;\n        text-align: justify;\n        text-indent: 1.50em; /* Standard indent */\n        line-height: 1.4;\n        margin-top: 0.42em;\n        margin-bottom: 0.42em;\n        color: inherit; /* Essential: Inherit theme color (white in dark mode) */\n    }\n    .P_TEXTBODY_CENTERALIGN {\n        font-size: 1.00em;\n        text-align: center;\n        text-indent: 0;\n        margin-top: 1em;\n        margin-bottom: 1em;\n        display: block;\n    }\n    .chapter-title {\n        font-family: serif;\n        font-weight: bold;\n        font-size: 1.8em;\n        text-align: center;\n        margin-top: 1.5em;\n        margin-bottom: 1.5em;\n        page-break-before: always;\n        color: inherit;\n    }\n    a { color: inherit; text-decoration: none; }\n    img { \n        max-width: 100%; \n        height: auto; \n        display: block; \n        margin: 0 auto;\n    }\n\u003c/style\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",n
