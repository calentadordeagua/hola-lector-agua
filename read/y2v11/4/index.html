t about good changes to the school.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Maybe you were too influenced by Horikita-senpai, for better or worse?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBefore entering the school, I had no social interactions with others, so it was certain that I was greatly influenced by Horikita Manabu. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe school preferred stability, while Nagumo preferred reform. The two ideologies were never meant to converge. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Horikita-senpai did pass the baton to me, after all.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“So you admit it.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It's too late to deny it now.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Wait, wait a minute. Eh, what? This is a bit different from what I thought.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAsahina, looking flustered, opened her mouth while looking back and forth between me and Nagumo. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Despite his deadpan expression, he's pulling strings behind the scenes. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAnyway—” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNagumo paused for a moment before asking again. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I can assume you're willing to accept a match with me, right?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Why do we need to add conditions beyond the rules and rewards prepared for the exchange meeting?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I've thought about leaving it be, but it’s unacceptable. If I, who served as the student council president, were to trap you for personal reasons within the matches created by the school, it would cause problems.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAs Nagumo said, if the two of us, who weren’t even in the same year, were to impose risky bets with each other, the school wouldn’t be pleased. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Actually, calling it a match is an exaggeration. It's more like a small bet.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“A bet, you say?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Yes. If you win the bet, I'll give you a decent reward.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“So, even if I lose, I don't have to give up my private points?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Sounds easy, right?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was more like a game than a match or a bet. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHowever, it was a bit suspicious that only Nagumo was at a disadvantage. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I see no reason to refuse, but with the current rules, there's not much either of us can do. You're the leader, so you can't participate in the game directly, can you?” The one directing the students was Kiryūin, in other words, the third-year students. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAnd the ones playing were the first and second-year students. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p58\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-58_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 67\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe stage we were put on was different from the start. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Or are you going to ignore the exchange meeting and have a match in some other way?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThis experiential facility was well-equipped with places and tools to make that happen. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It wouldn't be bad to have a match outside the exchange meeting, but if we do that, there's no need to stick to this training camp.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's true. At school, we could have a more legitimate match.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“If the school says to hold an exchange meeting, I'll follow the formal rules.” Saying that, Nagumo continued. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“At first, I thought about letting you be the leader and having a match by directing the first and second-year students.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eOn the surface, third-year Kiryūin-senpai was the leader, but I would be the one who would actually give the appointments and instructions. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAnd it seemed that he had anticipated her not participating in the game. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Not bad, right?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Well, yeah. But to make it work, we'd have to allow him to choose his group members, otherwise, it wouldn't be fair, right?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNagumo had chosen all the group members himself. On the other hand, if Kiryūin were to entrust the group members she had picked on her own, it certainly wouldn't be a fair starting line. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIn fact, the first and second-years weren't told anything until we got on the bus.  “And when you open the lid, it's a round-robin. If you only have one direct confrontation after dragging it out for three days, it's going to lack excitement, right? That's why I thought I'd stop insisting on the same conditions here.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSaying that, Nagumo pointed his index finger at me. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You participate in all the games. And when you lose three times, that's your defeat.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I don't have to worry about the group's win or loss, right?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Yeah. Even if Kiryūin's group loses 19 times in a row, if you don't lose to anyone, it's a win.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAll 19 games. So the condition is to win 17 of them individually. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You're so kind to let me lose twice.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“If I make being undefeated a condition and you lose in the first battle, it would be a real turn-off, right? It's more fun to keep you around as long as possible.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNagumo said he set the line of three losses just for his own enjoyment. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p59\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-59_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 68\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Eh? Isn't that too disadvantageous for Ayanokōji-kun? Card games are all about luck.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“He has nothing to lose even if he doesn’t win, right? The right to set the rules is naturally ours.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Ah, well, yeah..  Well, that might be true.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI was a little dissatisfied, but even if I was confronted with the most harsh content, it was true that there was no reason to refuse if the risk on my side was zero.  “All I want is your defeat. It's only natural for me to demand a high probability of victory. I'm also offering private points as compensation.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Is it okay to mess around with a kōhai from a distance just before your graduation?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That’s the way I like to treat you.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEither way, it wouldn't hurt to respond to Nagumo's wishes in some way. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe'd be graduating in March anyway. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Understood. Then I'll accept your proposal without hesitation.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWith my acceptance, Nagumo responded with a slight nod. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Of course, I've told Kiryūin that you're participating in all the games.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt seemed that negotiations had been conducted behind the scenes on the assumption that I would accept. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It's not my place to say as an outsider, but you can clearly refuse if you don't like it, you know? Even if you say you won't pay anything when you lose, the fact that you lost will remain.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThat was exactly what Nagumo wanted, the matter of 'winning' and 'losing.' \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“If Ayanokōji says he'll accept, you don't need to say anything unnecessary.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAsahina, who was treated rudely, puffed out her cheeks in dissatisfaction but backed down when she saw that I was fine with it. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“But you really didn't hold back in your selection, Senpai. The students assigned to the other groups were a bit taken aback.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen I pointed that out, he didn't show any discontent, but rather smiled as if it was natural. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Even in a trivial exchange meeting, a game is a game. As a former student council president, I have to show my dignity.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt seemed that he intended to win even in the exchange meeting where he participated as a leader, apart from the battle with me. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThat was Nagumo's freedom; it was none of my business. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Even if you start winning several in a row, it's easier to stop you if I can command the group directly.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Wow. You're really ruthless, Miyabi.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“No, I don’t think so. I think Nagumo-senpai's way of thinking is correct.” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p60\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-60_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 69\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was a question of skill to be able to drag your opponent into your own ring after creating a favorable situation for yourself. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eGiven the structure of only facing each group once and the atmosphere of the exchange meeting, it was safe to say that it wouldn't be clear how many times a particular individual had participated in a game. But that was also in my favor. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt would be too conspicuous to take on a group as a second-year student, but if it was just an individual battle, it was possible to avoid attention. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhile setting the stage for himself to take advantage of the situation, he had also taken care of me. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Nazuna seems to misunderstand, but victory or defeat is not determined solely by whether one is excellent. If the person on top isn’t more capable, using a skilled person will only lead to their loss.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhat Nagumo was saying was correct. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNo matter how many pieces you were given in shogi, if your skill was insufficient, you couldn't necessarily win. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'm sorry I'm late. Has the discussion been settled?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eKiryūin showed up in the break room. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Ah, everything's going smoothly. It's going to be a match between me and Ayanokōji as planned,” Nagumo said before turning to me. “Kiryūin must have sniffed out that I was planning to challenge you and volunteered for this role.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's right,” Kiryūin nodded. “If you want, I can even give you the authority as the leader. Of course, on the surface, I'll make it look like I chose the participants. That way, we can compete as a group, can't we?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe proposed a win-win situation, but I wondered if Kiryūin simply wanted to watch my victory or defeat from the nearest seat without doing anything. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I see. That was a part that had been bothering me a little. I now understand why those three from Class A ended up in the same group.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen Hashimoto and Morishita stopped by the convenience store, they ran into Yamamura, and Kiryūin happened to be there at the same time. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThat might have been the deciding factor in choosing the same group. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf she handed over the authority to me, it was a consideration to save as much time as possible to deepen friendships. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I don't know much about your current friendships. It was a chance encounter, and I just let you choose randomly. If you're uncomfortable in the group, it would be hard to show your true abilities, right?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThanks to Hashimoto and Hiyori, it seemed like the conversation could go smoothly. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I appreciate your consideration, but I'll decline your offer. Unfortunately, I'm not good at socializing and I'm too busy trying to get along with my kōhais.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eKiryūin responded with disappointment, but she didn't seem too bothered. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p61\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-61_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 70\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I didn't expect Kiryūin-senpai to get involved in this matter.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNagumo and Kiryūin weren't exactly friends. Rather, they stood in opposing positions. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen I responded that way, Kiryūin smiled happily. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Anyway, I'm glad the match seems to be happening, Nagumo. It's a shame that third-year students can't participate in the game directly.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eKiryūin expressed her feelings about the exchange meeting, whether they were true or not. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“If there was a rule that allowed participation, would you have given it your all?”  “It's a rare opportunity involving Ayanokōji. Of course I want to meet his expectations.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Huh, you've really bought into Ayanokōji. If you want, I can challenge you individually and not just in this exchange meeting. If we're both third-years, there's no need to hold back. I'll even bet the ticket price for Class A.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Sorry, but I'll decline. That ticket price is soaked with the blood and sweat of the entire year. It's too heavy for me, who hasn't been involved, to accept, isn't it?”  Kiryūin was also the confident type who didn't consider her own defeat. Her words were strong. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe firmly implied that she’d win if she competed. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's a shame.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNagumo, however, was used to it and didn’t seem deeply interested in Kiryūin after having known her for three years. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Well then, I have some things to do as a leader, so I'll excuse myself first. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eLet's meet again later.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAfter briefly taking care of her business, Kiryūin left. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Fūka-chan is always cool.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“She's just a woman, after all.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Wow, that's a terrible thing to say, Nagumo. In this day and age, you can't complain even if you're killed.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Don't get me wrong. I just want to be on top among the same sex, there's no discrimination or anything.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe couldn't get passionate because she's a different gender. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Even so, your way of speaking can cause misunderstandings, you know.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThat was also a valid point. He wouldn't be punished if he expressed himself a little more tactfully. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen I got up from the sofa, Nagumo and Asahina also stood up. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWe all left the break room together. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You should also practice or something and prepare for the match.” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p62\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-62_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 71\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I will.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Ah, finally you're out. You're done talking, right?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eJust before we disbanded, Amasawa appeared from down the hallway, looking as if she had been waiting impatiently, and approached us. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNagumo scratched the back of his head at Amasawa's appearance and her words. “Didn't you hear my instructions? I told you to wait, didn't I?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It's okay. I’ll work twice as hard during exams.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I can't trust your words yet. If you do something on your own again, you better think you won’t be given another chance.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's harsh. I understand, I'll follow the instructions properly.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Nagumo, this girl is..  um. .” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Amasawa. From first-year Class A.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Oh, right. You're Amasawa-chan. You must be pretty good to be called into Miyabi's group, huh?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Well, not that much.. ” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt wasn't surprising, given that she had achieved the rare A in both academic and physical abilities on the OAA. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHowever, when considering overall ability and quick thinking, Amasawa wasn't necessarily the top candidate to be chosen. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“She wasn't my pick. Somehow, she heard rumors and knew about the next social gathering.” \u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p63\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-63_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 72\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN\"\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-63_2.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"Image 73\" /\u003e\u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p64\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-64_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 74\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's why I promoted myself. I promised to contribute to getting first place.” “Honestly, I was a little hesitant to recruit her.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhether it was due to Amasawa's personality, or suspicion about her relationship with me, Nagumo didn't specify. He probably decided to recruit her because he deemed it a minor issue. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You have to organize your own group too, Nazuna. You're a Class A student, so aim for the win. Can you always rely on us?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Eh, oh my gosh, it's already this late!? I have to go, but feel free to consult me if you have any problems!” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAsahina, who had checked the time on her phone, hurriedly ran off. She almost tripped on her way, but she turned the corner and disappeared. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I wonder if Nazuna can lead a group with that attitude. .?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAmasawa smirked and leaned in towards Nagumo, who was sighing in disbelief. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Could it be that you're dating Asahina-senpai?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Huh? No, I'm not.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“But you told me to wait because you had important things to discuss with Ayanokōji-senpai, but you kept Asahina-senpai by your side, right? That's special, isn't it?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt might have been a leap to equate being special with being a lover, but who knows? \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's none of your business.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Eh~ it is. Look, if I'm aiming for Nagumo-senpai, she's my rival.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You're aiming for a guy who's about to graduate?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'm a patient woman, so I'm tolerant of long-distance relationships.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Sorry, but I don't like women who pretend to be cute or flatter me.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAmasawa overreacted as if she was hurt by Nagumo's blunt rejection. He probably disliked that kind of behavior. He deliberately averted his gaze. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'm leaving now. Do your best, Ayanokōji.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAfter Nagumo left, only Amasawa and I were left in the hallway. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Am I disliked?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Well, if you say things to make yourself disliked, that's what happens.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“But look, you’re also disliked, Ayanokōji-senpai, so I wanted to be included in the same group.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eWhat kind of group is that? \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I think it's true that they aren’t dating, but their relationship does feel special, doesn't it?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Well, yeah. It seems like they've gone beyond just being friends.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI agreed with Amasawa on that point. It made sense. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p65\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-65_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 75\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“By the way, it seems you knew about the exchange meeting in advance.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“We were told in advance what kind of exchange meeting would be held.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“We” here included Yagami who that man prepared and had Tsukishiro manage. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt seemed they were told the schedule for the year upon entering this school. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf they were going to expel me, it would be better to give them information in advance. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I don't understand why you chose to team up with Nagumo.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Eh? Isn't it simply because the chances of winning seem high? After all, he was the student council president. I'm a girl of age, so I want private points.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAmasawa answered, but it was clear that she was lying. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHowever, she quickly corrected herself, as if she had no particular intention of hiding her true feelings. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I thought you and Nagumo-senpai would be competing soon. I thought it might be nice to be on your side and support you, but that wouldn't be fun, would it?”  “That's the reason?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's the reason indeed. I thought if I sided with Nagumo-senpai, we might have a good match.. ” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAmasawa sighed and held her cheek. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I can see Nagumo-senpai's disappointment. The list the school provided is just full of games. It wouldn't be satisfying to win a game of rock-paper-scissors or cards against him. I didn't need to antagonize him.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“There's nothing we can do about that.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I heard from Nagumo-senpai first, but the rules are that if you lose three times, it’s your loss, right? I could feel his desire to see you lose in any way. I'm looking forward to seeing what happens.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I hope it’s something to look forward to, but there's a good chance that I could lose three times in a row without showing any surprises.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIn reality, depending on the content, there's a high chance that I could lose without being able to do anything. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“But at least Nagumo-senpai and I don't think so.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Do you understand Nagumo's feelings too?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'm the one who made fun of it, so I wasn’t allowed to come to the discussion.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Did you come here to greet me even though you were refused?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Was it not good?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt wasn’t that it wasn’t good, but there was no reason to force contact with Nagumo and risk his resentment. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p66\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-66_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 76\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIn order to get more limelight within the group, it seemed that not only ability but also whether you were well-liked would become significant. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Well then, I've been called to my group, so I'll head back. See you later.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWith a quick turn, Amasawa cheerfully left. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was a casual conversation with Amasawa, but there was one thing that bothered me. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAmasawa mentioned that she had been informed about this exchange meeting by Tsukishiro and others in advance, but if so, there was a slight contradiction in the conversation earlier. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I wonder what she's up to.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt might be a good idea to do a little research. \u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p67\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-67_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 77\" /\u003e\u003c/p\u003e\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003eSoon the details of the first round of the exchange meeting were announced and the game began. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBefore that, I decided to tell Hashimoto, who was fiddling with his cell phone in the same room, about this matter. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHashimoto would notice the unnatural situation even if I kept silent about participating in all the games. It was a waste to probe and be probed among groupmates, and it was best to avoid that. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eI'm going to have some with Nagumo\u003c/i\u003e. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI told him a little about the contents of our match, but it was still a confrontation with the former student council president, and Hashimoto couldn't hide his surprise throughout. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAnd when he finished listening to the story, he sighed repeatedly, showing his understanding of the situation. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You always do things that are beyond my imagination. You know that, right?” “It's not the development I wanted.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Even so, it's incredible that you're competing with Nagumo-senpai. And it's not about the results of this group battle, but about your individual performance. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThat's amazing. You're being asked to win 17 out of 19 games.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe expected this situation to be tough, but Hashimoto seemed oddly happy. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That just means he’s interested in you. I knew my eyes were right.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Even if it's an informal exchange meeting, it's still selfish. It’s an act that disrupts the group's dynamic. That's why I asked to speak with you—to keep the group's cooperation intact.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“So that’s where I come in. I understand what you want to say, but I don’t think you need to worry.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What do you mean?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Think about it. If this was a fun game, everyone might compete for a spot to participate, but do you think all high school students would want to make \u003ci class=\"calibre3\"\u003eoshibana\u003c/i\u003e and embroidering to compete? No.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003e(TL Note: Oshibana (\u003c/i\u003e 押し花 \u003ci class=\"calibre3\"\u003e) refers to the traditional Japanese art of\u003c/i\u003e \u003ci class=\"calibre3\"\u003epressing flowers to preserve their beauty and create decorative designs.)\u003c/i\u003e I was very interested, but it seemed that other students weren’t. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“So it should be a welcome thing for you to participate in everything.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf things went as planned, I would be grateful. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p68\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-68_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 78\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Are you going to win the exchange meeting itself? I wonder how Kiryūin-senpai feels about it. I suppose it's okay to assume that you know because of the circumstances?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Ah, I’m not sure. I don't think she's completely uninterested, but I don't think she's as excited as Nagumo. She might even throw the whole thing to her kōhais.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eKiryūin was only interested in the match with Nagumo because of my record. Just enjoying the extra entertainment before graduation, that was all. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Even if the private points I earned this time can only be used for pocket money, I can use the private points I have now for a more effective use. I honestly want to aim for a higher ranking and get the prize money.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eFor Hashimoto, who has made enemies both inside and outside, his battle funds were indeed important. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Anyway, Ayanokōji, you should get along with the first-year students.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Get along..  huh?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Do you think it's difficult to spend friendly time with the first-year students?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAfter thinking for a moment, I nodded, and Hashimoto stood up, slapping his knee. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“All right, then, let's make the best of it. First, I'll loosen up the first-year students and try to get along with them by tonight.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHashimoto immediately declared that he had no problem getting closer to the first-year students. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'll also try to extract as much information as possible at that time, but if Kiryūin-senpai doesn't make a move, your power is indispensable. So when it gets dark, you'll have to cooperate to get along with the first-year students, okay?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI couldn't just make demands without giving anything in return, and it was only fair to help. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt seemed better to support Hashimoto, who was aiming for a win in the group. “Right.. Of course, if I could do it, I would.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut it would be better to let him know sooner rather than later that I'm not confident. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThat’s what I thought, but Hashimoto could see right through it. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Leave it to me. I'm pretty good at this kind of thing. I'm grateful to be able to act as your hands and feet. It will also serve as a check on the princess, and it's not something Ryūen can ignore.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe was cooperating with me, while at the same time promoting his own interests as well. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p69\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-69_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 79\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHaving a calculating mindset wasn't bad. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eRather, if there was a clear conflict of interest, that mindset would be much better than having the situation resolved out of goodwill. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“By the way, how much would you get for beating Nagumo-senpai?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I don't know. I didn't ask for the exact number.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Considering that he's a third-year representative, it's not just a few thousand or tens of thousands, right?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhat he wanted to know was not the amount, but where the reward money would go afterward. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I understand. If we win, I'll distribute it evenly to the rest of the group, so you can rest assured.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'm relieved to hear that. However, I'd be happy if you could give us different amounts based on our performance, not uniformly.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe made it clear that he wanted to be paid more for taking the initiative, though it wasn't mandatory. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Well then, I'll leave for a bit. I should be able to have a talk or two during my free time.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAs if cherishing every second, Hashimoto quickly left the shared room. \u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p70\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-70_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 80\" /\u003e\u003c/p\u003e\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003eThus, the first day of the exchange meeting and the first round began. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe school sent us the game and rules. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe group we were going to compete against was Group Nine. From Horikita's class, Ike and Keisei were there. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe game was '  \u003ci class=\"calibre3\"\u003eoshibana\u003c/i\u003e creation.' The location was an  \u003ci class=\"calibre3\"\u003eoshibana\u003c/i\u003e  \u003ci class=\"calibre3\"\u003ekyōshitsu\u003c/i\u003e. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003e(TL NOTE: a specialized workshop space for teaching and practicing the art\u003c/i\u003e \u003ci class=\"calibre3\"\u003eof oshibana, equipped with the necessary tools and materials.)\u003c/i\u003e Some students might have laughed when they heard it. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut I was very serious. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe question was how to compete with  \u003ci class=\"calibre3\"\u003eoshibana\u003c/i\u003e, and in this case, the quality of the finished product was of utmost importance. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe combination of many types of flowers. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhether or not you could find petals with the right amount of moisture, and the selection of appropriate flower materials of different sizes. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhether you could finish it without breaking or damaging it because they were delicate. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe winner would be decided by the total score of these factors. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI hadn't been able to experience anything since I hadn't been to the training camp yet and I was called up, so I decided to go straight to the actual facility. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWe received a brief lecture just before, but this seemed much more in-depth than I had imagined. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe work itself was done by all participants at the same time, and in the end, we would compete in a one-on-one format. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eFrom the first to the fifth, who would be in charge was decided in advance. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAt the designated production site, there were participants from both groups, ten people and two leaders, and a few spectators including Hashimoto. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAmong them was Takahashi Osamu, a first-year Class A student from the Nagumo group. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBy the way, following the instructions from that time, I participated as the third person in line. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Do you also make  \u003ci class=\"calibre3\"\u003eoshibana\u003c/i\u003e, Ayanokōji-senpai?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNanase Tsubasa from the first-year Class D, who was among the opponents, walked up to me and asked. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“No, I've never done it. I just got a little guidance from a friend.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBy the way, that friend was Hiyori. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe had been making bookmarks with  \u003ci class=\"calibre3\"\u003eoshibana\u003c/i\u003e for a long time and had a lot of experience. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p71\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-71_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 81\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I see. I thought you were good at it because you were the only boy participating.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003ePerhaps because it required dexterity, as Nanase said, nine out of ten participants were girls. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI was the only male participant, so I was a bit out of place. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI had a match with Nagumo, but there was no need to tell Nanase, who was irrelevant to our competition. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I've only done it once or twice, so I don't know if I can do it well.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Please go easy on me.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI was worried that the scoring criteria might be somewhat vague, but it seemed that the person in charge of  \u003ci class=\"calibre3\"\u003eoshibana\u003c/i\u003e, the same person running the facility, was well-informed and judged strictly. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eFortunately, the first-year girl who was my opponent wasn’t very good, so I was able to fight her head-on and win. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAnd as for the group's victory status, although the decision was tangled up until the fifth match, we barely won with three wins and two losses. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You're amazing, Ayanokōji-kun. I think you're doing very well for your first time.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'm nowhere near as good as Hiyori though.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBoth were beautiful  \u003ci class=\"calibre3\"\u003eoshibana\u003c/i\u003e at first glance, but the quality was worlds apart. If she had been my opponent, I would’ve been utterly defeated. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You have a knack for this, Ayanokōji-kun. If you enjoy it, let's make it together next time.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Yeah, I'd like to get better at this too.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI was relieved that such a formidable opponent was an ally. It was significant that I had won in the individual competition. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf possible, I would’ve liked to stay in the  \u003ci class=\"calibre3\"\u003eoshibana\u003c/i\u003e  \u003ci class=\"calibre3\"\u003ekyōshitsu\u003c/i\u003e and quietly continue making them. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI wouldn't mind competing in making  \u003ci class=\"calibre3\"\u003eoshibana\u003c/i\u003e for three days straight. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSuch feelings were welling up, but unfortunately, I had to suppress them. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eSorry, oshibana. See you later.. \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAfter the first match, Kiryūin discreetly called out to me. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“A victory’s a good start. Though, I didn't feel any tension.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Well, that's true.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhile answering, I kept quiet about how serious I had been. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhispering was allowed during the game. It was inevitable that the spectators would find it boring. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“But if it's a competition based on experiential learning, it's not strange for anyone to win or lose. If you consider the school's intentions, it's a very interesting RoyalMTLs \u003c/p\u003e\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p72\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-72_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 82\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eway to decide who wins. It's meaningless to just gather students with high OAA abilities. Every group has a chance to win.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEven the great Nagumo couldn't foresee or determine whether Horikita and the others could make good  \u003ci class=\"calibre3\"\u003eoshibana\u003c/i\u003e. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThat being said, the same could be said for us. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhat we could and couldn't do. Use the spare time to experience as many experiential learning activities as possible and improve our skills.  \u003ci class=\"calibre3\"\u003eA leader should\u003c/i\u003e \u003ci class=\"calibre3\"\u003ebe in charge of these things.. \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Hashimoto made this list for me, which makes things easier. He's surprisingly useful.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eTo avoid the hassle as a leader, Kiryūin seemed to welcome it. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWell, that was fine too. It was good to enjoy the three days without getting too serious about winning. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“If we continue like this, there will be almost no need for you to take command.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'm grateful for that. All I want to see is the match between you and Nagumo.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAs expected, she didn't seem to have any intention of doing anything. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I don't think the results will meet your expectations.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhile having such a conversation with Kiryūin, I noticed Inogashira was looking at us alone. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eJudging from the situation, she probably didn't participate in the first game. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe said she was good at sewing, and she might like  \u003ci class=\"calibre3\"\u003eoshibana\u003c/i\u003e too. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI thought she had come to experience  \u003ci class=\"calibre3\"\u003eoshibana\u003c/i\u003e in her spare time, but it didn't seem to be the case. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What's up, Inogashira?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen I asked her out of curiosity, she approached me with a bit of nervousness. Seeing this, Kiryūin stepped back to make it easier for her to talk. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Um… uh, you're good friends with Kōenji-kun, aren't you, Ayanokōji-kun?” “Huh?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI answered immediately. It was the first time I had heard that I was good friends with Kōenji. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Is that so…? I see. .” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What's the matter?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Well, Tatebayashi-senpai told me to bring Kōenji-kun back...” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eTatebayashi is the leader of the group to which Inogashira and Kōenji belong, the third-year Class D. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“He was really angry.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Yes...” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p73\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-73_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 83\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAs a member of the same group and his classmate, it seemed that the timid Inogashira was forced to take responsibility for managing Kōenji. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I thought maybe you could do something about it.. ” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe had been watching the scene earlier and our eyes had met. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe must have come to ask for help out of desperation, but the problem was that the other party was too difficult to deal with. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Why don't you ask Yōsuke?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI tried to offer the most feasible solution, but Inogashira shook her head. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I can't ask Hirata-kun to do something like this..  It's too much to ask.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eI wonder if it's okay to ask me. .? \u003c/i\u003e Well, it would be rude to compare myself to Yōsuke, who was very helpful. If asked, he would accept and if Kōenji didn't return, he would likely continue to persuade him until he did. I could understand why Inogashira would feel guilty. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'm sorry. I can't help you. There’s nothing I can do.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I see. . I'm sorry, I'll try to figure something out.. ” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eInogashira bowed her head slightly and slowly walked away. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Should we just leave it like this?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I do feel sorry for her, but that man won't act according to our wishes. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWe've tried various things over the past two years, and this is the conclusion we’ve come up with.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Of course, the decision is up to you. Regardless of the details, the fact that she came to us first is significant.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You're serious in strange ways. I won't deny it, but I'm not enthusiastic about it.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eMy thoughts and policies towards Kōenji had solidified the last time I interacted with Mii-chan. Now, without a special exam threatening expulsion, any unnecessary contact and communication would be a waste. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“There's still some time until the next game, why not give it a shot? From what I've seen, Tatebayashi's group is small and unlikely to win, but if Kōenji is competent, the situation might turn around somewhat. Right?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe didn’t seem like the type to worry about others, but it would be inappropriate for me to say that. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI wanted to try many different things, but opportunities like that seemed hard to come by. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I understand. I'll try contacting him for now. If Kōenji wins, he might appreciate the private points he'll earn.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's a good idea.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIn fact, that was the only thing that could potentially motivate Kōenji. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhile thinking that I had been asked to do something troublesome, I decided to give it a shot. \u003c/p\u003e\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p74\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-74_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 84\" /\u003e\u003c/p\u003e\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003eI wanted to find Kōenji during the 30-minute interval between matches, however, it wasn’t an easy task. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI went to Kōenji's shared room, but as expected, he wasn't there, and he wasn't in the lobby or the lounge either. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAfter wandering around the building for about five minutes, occasionally asking acquaintances for information, I obtained a promising clue about 20 \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eminutes before the next game. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI found Kōenji a little way up on a mountain path behind the building. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI arrived at an open area that used to serve as a dog park. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt seemed to have become quite a wasteland, perhaps because it was no longer in use. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It took me quite some time to find this place. I didn’t know there was a place like this here.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI found Kōenji, who was running around joyfully, kicking up the wasteland with his strong horse-like legs. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI couldn't help but wonder what he was doing here alone, but if I worried about it, I would lose to Kōenji. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSeeing a rare spectator, Kōenji slowed down and approached me. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI thought he would continue to ignore me, but I was met with a surprise. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Ayanokōji boy, do you need something from me?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI thought it was just a whim, but I couldn’t waste the opportunity. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I saw you leaving the group on your own. I thought I'd ask you about how you felt.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I see. As long as you didn't come to call me back just because someone was counting on my abilities, that's fine.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI guess this man didn’t need any pretense. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Inogashira was looking for you. She appeared quite anxious.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“So what?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Why don't you go back and help the group a little?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You already know the answer, don't you?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I don't know. Why won't you cooperate?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'll tell you something special. One plus one equals two. The answer doesn't change no matter how many times you solve it.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That depends on how you look at it. In decimal, that's true, but in binary, one plus one equals ten.” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p75\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-75_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 85\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003e(TL NOTE: The statement contrasts arithmetic in decimal (base-10) and\u003c/i\u003e \u003ci class=\"calibre3\"\u003ebinary (base-2) systems. In binary, used in computing, 1 + 1 equals 10,\u003c/i\u003e \u003ci class=\"calibre3\"\u003erepresenting the decimal value 2.)\u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eKōenji didn't lose his smile even when I responded to his ridiculous statement with a ridiculous answer. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Hahaha, you have a sense of humor. But your answer is nonsense. You see things in a twisted way, with logic-biased thinking. One plus one equals two is the answer. The world is always simple and clear.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eKōenji expressed again that he had no intention of getting along with me. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“They should win using their own tactics, even without my ability. Isn't that right?” “Your group doesn't have that power. That's why I intended to consider you. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf you’re present here, it’ll improve your impression. Won't it be easier for you in the future?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I pride myself on being the only, the best, and the strongest person. There's no need for me to show that to others. Your questions are all nonsense.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eKōenji sneered and turned his back to me. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“This time, I've decided to take a complete break. In other words, I'm not involved in the exchange meeting at all. The game can be played smoothly with just five people, right? Please make sure to convey that.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIndeed, there was no obligation for all group members to gather and hold an exchange meeting. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf Kōenji was uncooperative, it was a waste of time to invite him. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I shouldn’t really say this to others, but I can't do anything about your uncooperativeness. It’s beyond my understanding.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Hmm. Beyond understanding, is it? Do you want to know why I'm uncooperative?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAs I was about to give up and turn back, he stopped me. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Are you going to tell me?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I don't mind. But before that, can I ask you a question?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen I turned back, Kōenji started talking. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“If a paper test is conducted here without any prior notice. Let's say, a test that questions basic academic abilities, who do you think would win, you or me?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf it wasn't Kōenji, I wouldn't have answered seriously. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut here, I intuitively felt that it was best to speak from the heart. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I would win.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWithout hesitation, I answered immediately, but Kōenji wasn't surprised. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eRather, he immediately responded as if it was the answer he had expected. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p76\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-76_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 86\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Your high confidence is not bad. Let's assume that your answer is  \u003ci class=\"calibre3\"\u003eyes \u003c/i\u003e in this situation. Then, do you think that our superiority, excellence, and value as human beings are determined by that alone?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“No. That alone doesn't determine it.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was just a difference in the written test on basic academic abilities. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Then next—if you and I fight seriously, what do you think the result will be?”  A question about strength, not about brains or anything like that. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHaving watched Kōenji Rokusuke for two years, I already had the answer in my mind. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“If it's a fight based on specific rules, I think you’d have the advantage.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIn terms of physique and muscle mass, Kōenji would undoubtedly be superior. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThis was a number that couldn’t be overturned. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf rules were imposed here, such as boxing or judo, and Kōenji's skills were at least equal, I couldn’t deny the possibility that it’d be a tough battle. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's a funny answer. It's different from what I’d say, but I'll evaluate your thought as it is.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eFrom Kōenji's point of view, there was no possibility of losing, regardless of the presence or absence of rules. Of course, no one could deny that unless we actually fought. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Do you think you can judge who’s better or worse with just this information?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It's a difficult question. But if I think about it in general terms, a third party would have to objectively and fairly evaluate both sides from various comprehensive perspectives, including not only written tests but also physical aspects, and quantify them. But that doesn't mean they can objectively perceive human value.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's correct. No matter how objectively you look at it, determining human value isn’t something that can be easily judged. Even if you talk about comprehensive perspectives, you can't see everything.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“If you have to compare, I would support the method I just mentioned.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I disagree, Ayanokōji boy.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Then, how do you judge the value of a person?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAs if waiting for me to ask that, Kōenji grinned. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“The answer is extremely simple. Whether it's me or not. That determines the superiority or inferiority.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEven though he made me think a bit, in the end, it came down to that. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What's the basis for your confidence?” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p77\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-77_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 87\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'll gladly tell you. The source is adaptability. I won't succumb to any environment. I have the confidence to survive in any of them. Whether it's in a large corporation or a jungle full of beasts, I have the power to adapt perfectly and \u003ci class=\"calibre3\"\u003eperfectly\u003c/i\u003e. This is something that a third party cannot measure.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003e(TL NOTE: The latter word “perfectly,” is written in Katakana for\u003c/i\u003e \u003ci class=\"calibre3\"\u003eemphasis.)\u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe must be well aware that the “perfectly” and “\u003ci class=\"calibre3\"\u003eperfectly\u003c/i\u003e” are redundant. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“This long question and answer session was meaningless. Even if you're perfect, it has nothing to do with your reason for not cooperating, does it?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“If so, it's just that you didn't understand. Can you stand shoulder to shoulder with kindergarteners who can't do anything and work seriously? There's that much of a gap between me and the people around me. The reason I went out of my way to get first place in the deserted island test was to distance myself from such kindergarteners.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe doesn't feel like competing side by side because he looks down on those around him. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThat was Kōenji's reason for being uncooperative. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You're not suited for this school.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You and I are completely different beings, but I thought you had a somewhat similar perspective. I didn't expect you to say that. I also think it would be more meaningful to devote myself to training by revisiting China than entering this school. I had circumstances that prevented me from doing so.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNo matter how I thought about it, it was a dead end. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen it came down to it, whether to cooperate or not was a decision he had to make. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI couldn't blame Kōenji for sticking to his guns. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It's a shame, Kōenji. If you were different, you could attract more attention in a better way.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Like you, who's starting to be relied on by those around you?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'm not really attracting much attention, though.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWe had our conversation. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eStrangely enough, I often had the opportunity to talk with Kōenji like this. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI wondered if the atmosphere was similar at last year's training camp. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI was reminded again of the enigma that was the person in front of me. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You understand now that you can't control me, don't you?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Yeah, I guess so.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“So why do you bother with me? I'm not even in your group this time.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIndeed, it was a strange story. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf someone else looked at my situation now, they would all say I should just leave him alone. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p78\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-78_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 88\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt could waste time and potentially affect my bet with Nagumo. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Even though I know it's useless, I can't help but try—” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Because if you step out of the class, you won't be able to protect Horikita girl, right?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAs if linking with my thoughts, Kōenji said so. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI saw Kōenji as a hindrance to Horikita, who would continue to fight in the future. This man saw through that. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHis extraordinary instinct was truly unpredictable. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eDespite not giving many hints, he seemed to feel what was coming. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“If that's the case, there's no need to hesitate. You can try to exclude me at any time.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Didn't I tell you before that I don't feel like doing that?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Huhuhu. Well, if that's the case, there's nothing I can do.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eKōenji, who never doubted that he was the best human being. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSo far, there had been several people whom I urged to grow for the future of Horikita's class. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAnd if I thought they were beneficial, I had done the same for other classes as well. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThis man, who had excellent abilities but a difficult personality to work with, was similar. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut the reason I didn't urge Kōenji to improve was because I judged the risk and effort of the measure to be high. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eJust like how you couldn't turn an incompetent person into a competent one with a simple task like flipping a coin. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe man in front of me wouldn't change with just one or two steps. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was easier to eliminate him before he became a nuisance than to change him into an asset. That was my conclusion. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“See you later then. I'll go back to my self-improvement time.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSeeing that further conversation would be useless, Kōenji started running again. After watching his back for a moment, I decided to turn back. \u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p79\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-79_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 89\" /\u003e\u003c/p\u003e\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003eI came back near the inn to report on Kōenji's case. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut I couldn't find Kiryūin, and I didn't know where she had gone. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen I asked a few people, they told me there was a park with a handmade feel on the east side of the building, and they saw her walking there. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThere wasn't much time until the next game, so I wondered what she was doing there. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe park had several wooden playground structures. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eUnlike the rusty dog park, this place seemed to still be in use, with seesaws and balance beams that looked usable. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNow, where was Kiryūin—she was on one of the two swings. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNot alone, but with Asahina, a third-year student. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eFrom a distance, it looked like Asahina was happily talking to her, and Kiryūin was listening with a warm gaze. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI thought it was an unusual combination as I approached to tell her about Kōenji. “We don't usually have a chance to talk, so it's kind of fresh.. Really unusual, isn't it?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Are you that happy to talk to me?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'm glad. You’re always so cool, Fūka-chan. A lot of girls really look up to you.”  Asahina's eyes sparkled. Perhaps Kiryūin was the type to be more popular with girls than boys. \u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p80\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-80_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 90\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN\"\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-80_2.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"Image 91\" /\u003e\u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p81\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-81_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 92\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThis must’ve been because she rarely interacted with students belonging to the same year. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI think Kiryūin was a special case, but it seemed that this kind of interaction was also happening. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Ayanokōji, you're back.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What were you talking about?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt seemed better to tell her about Kōenji's situation later. With that thought, I asked about the content of the conversation. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“We were talking about various things, but right now, we were talking about our future plans. I was curious about Fūka-chan's future.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI remember she said she would become a scholarship student and go to university when we met before. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“So, which university are you going to?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe conversation had just started, and Asahina asked that question. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eKiryūin openly named the specific university she was planning to attend. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was a famous university that I would’ve heard of many times if I had lived normally. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It's their law department. But I'm not particularly attached to the department.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAsahina shuddered at the thought of going to such a high-level university, thinking it was impossible for her. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What do you plan to do, Fūka-chan?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Hmm? I’m not aiming for anything. I’m not trying to become anything.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eJust as she had told me before, she planned to live as an ordinary person. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe told Asahina that. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Eh~ Isn't that a bit of a waste? You seem like you could become anything.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe had no intention of showing off her talents, which would be envied by those who didn't have them. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThat might be a waste, but it might also be the ultimate luxury. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I can become anything. I don’t lack confidence, but there are many different things.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“So you don't have a dream?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I have a dream of not becoming anyone. Does that answer your question?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That might be a dream, but I think it's better to have an ambitious dream. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhether you can fulfill it or not, whether you can do it or not, isn't it something to think about?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThis was true especially if you were Asahina, who was expected to graduate from Class A. Kiryūin understood this and laughed. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's true. It's not that I've never thought about such a dream.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Then tell me. I might aim for it too.” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p
