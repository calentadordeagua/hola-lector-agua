through the experiential learning and make sure to collect the stamps to receive the reward. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe sixth game was 'Sculpture Experience.' \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was a full-fledged activity where you could use professional tools to carve a stone, which was obviously different from what you would do in a school art class. It was truly an exciting experiential learning activity. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eFor me, who was determined to participate in all the games, I didn't have much time to have an experience on my own. So, there were still many things left to learn that I hadn’t experienced yet. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf I could, I would’ve liked to stay there for a week or two, not just these three days. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI was lost in thought as I looked at the uncarved stones and tools prepared for the students. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHowever, the two groups that had gathered were not interested in the raw stones of the works—that were full of charm—but were busy chatting about this and that. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eFor ordinary students, this experiential learning is just a part of their school\u003c/i\u003e \u003ci class=\"calibre3\"\u003elife... \u003c/i\u003e  Well, it was easier for us to do it if it was a bit more relaxed, right? \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf a specific person continued to participate in the game consecutively, it would seem to stand out a bit, but it didn’t attract attention at all. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThis was because experiential learning was always taking place here and there, and the school didn’t disclose information as to who the participants of each group were. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSince there were no students who were eager to gather information, no one cared whether I won or lost. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p115\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-115_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 126\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEven if I participated in all 19 games, the only one who would know this fact would probably be Nagumo’s group, who never missed a chance to scout individual performances. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It seems that your group had a good start with five consecutive wins yesterday, Ayanokōji-kun.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eKushida said while she approached me. She was assigned to the first opposing group of the day. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It’s just that the first-year students are doing their best. You also have four wins, so it seems you're doing well too.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI found out that the only game they lost was against Nagumo’s group, who were among the top contenders for first place. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“We decided not to worry about winning or losing. But that's because we decided to do our best and enjoy ourselves. But everyone just wanted to take it easy and kept asking me for favors. This is my sixth consecutive participation.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAfter saying that, she revealed her true feelings without breaking her smile. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It's really stupid. Experiential learning is so lame. I wish this training camp would end soon.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What you say and what you do are completely opposite.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was impressive that she could spit venom without moving her facial muscles much. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I just do it because I don't want to lose out if I don't put on a good face. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHonestly, I don’t think we need to take this exchange meeting seriously. There are people's eyes everywhere, in the shared room, in the large bath, at meals, and I don't have time to relax.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe seemingly wanted to be sent home as soon as possible, not needing any rewards or anything. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt appeared that she felt extreme stress from having to act like a good girl in an environment that was smaller than school. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Don't let the stress build up and explode.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I think I'm okay for now. Lately, I've been able to let off steam by dealing with those two.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt went without saying that ‘those two’ referred to Horikita and Ibuki. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It seems you lost to that Horikita group.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Since sincerity is their only merit, isn't it because they’re working on various things with a straight face? Yesterday, Katsuragi-kun seemed to be immersed in practicing glasswork because he couldn't do it well, and he lined up many times.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen it came to making things in experiential learning, many people couldn’t participate at once due to the number of instructors, equipment, and other RoyalMTLs \u003c/p\u003e\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p116\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-116_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 127\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eproblems. If it overlapped with the game time of the exchange meeting, they could hardly use the free participation slots, and a waiting line was inevitably formed. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Nagumo is determined to win, and his members are serious, so he won't hold back.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Do you think they will win as expected?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“If we don't take action, there's a high chance of that happening.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen I answered, Kushida asked back with a curious look. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“But, even if you say 'take action,' all we can do is practice and hope that the game we can perform well in is chosen, right? Maybe the leader can choose the right person, but.. ” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“There are various other ways to increase your winning percentage to become a first-place candidate. For example, you could buy off the opposing group and have them give us the win. If you ask with a certain amount of money and sincerity, there should be plenty of room for negotiation, right?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eOf course, efficiency was another matter. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was just one example of a way to increase the chance of winning. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eKushida imagined a scene where she was approached by an opponent for consultation. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Indeed, if they give me 10,000 points, I have less reason to refuse, and I would be happy to give them the win. But if I keep doing that, won't I be in the red?”  Of course, it depended on how much you negotiated with them. If you gave 10,000 points to five opponents, it would be 50,000 points, but you could also use a bribe to the leader to settle it for 20,000 or 30,000 points. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHowever, the reason such a strategy was unlikely to spread was that there was little incentive in this exchange meeting. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEven if the Kiryūin group could win 16 or 17 games in a row by repeatedly buying off their opponents, groups like Nagumo, who were determined to win first place, would naturally reject being bought off, and we would have to clash head-on. As a result, if they ended up in second or third place, they may not even be able to recover the money they used for the bribery. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“So that's why no one does it. It's not profitable.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe only one who wanted the title of victor regardless of profit and loss was probably Nagumo. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Is there a way to do it without spending money?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It requires effort and isn't flashy, but there's also a method that involves sealing off some experiential learning activities and not letting your rivals practice. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003ePopular activities, as you said, form a line.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSurrounding the students of the rival group and repeatedly delaying them was also effective. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p117\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-117_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 128\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It sounds like something Ryūen-kun would happily use.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Yeah, but the reason there's no such movement happening at the moment is because it causes the same problems as bribing does.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“So it's not worth it, and the risk doesn’t match the reward, right?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's right.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAn instructor in overalls appeared and instructed the students to gather. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'm rooting for your group, by the way. I'd be happy if you could let Horikita-san taste defeat.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEven though they were now on friendly terms, she still wanted Horikita and Ibuki to lose. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThat was probably why the relationship between the three of them was miraculously balanced. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Does that mean you're going to give us the win in this game?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I wonder about that.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe had a cute smile on her face, but she didn't seem to be going easy on us. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eStill, the result of the game with Kushida's group was a 3-2 victory for our group. Thanks to my passion for artistic activities, which other students didn't have, I was able to win. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAfter that, the games of the exchange meeting continued solemnly without any flashy movements, both in the morning and in the afternoon. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cb class=\"calibre6\"\u003e[Trump]\u003c/b\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003e(TL NOTE: Trump refers to the card game category.)\u003c/i\u003e In the seventh game since the first day, it was the first battle where luck played a big part. As a result, the whole group, including me, suffered a spectacular defeat and recorded our first loss. This meant that I could only afford to lose one more game. However, among the rather modest exchange meeting, the card games brought quite a bit of excitement, and many students were enjoying it much more than the six games we’d played so far. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cb class=\"calibre6\"\u003e[Chalk Art]\u003c/b\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eDrawing pictures on a reasonably sized blackboard with chalk. The fact that we weren't drawing original works, but copying made it surprisingly easy to tackle. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eChalk was a bit different from colored pencils and crayons, which we usually used to decorate with color. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhile I struggled with the unique texture, it was also a moment when I touched a new world of art. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAs a result of competing for the quality of the copies, I was able to win in the individual competition, and as a group, we were able to win 3-2. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cb class=\"calibre6\"\u003e[Miniature Golf]\u003c/b\u003e \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p118\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-118_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 129\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eFrom the indoor exchange meeting in the morning, we went outside on a small golf course for experience. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBefore the start, there were many male volunteers, and taking all that into consideration, the leader's choice led to a slightly unusual situation where all the participants were male. Furthermore, everyone was inexperienced in this game. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhether this level playing field worked against us or not, the game was just as exciting as the trump card, if not more. Although I won in the individual competition, the other four lost by a small margin, resulting in our second group loss. \u003cb class=\"calibre6\"\u003e[Patchwork]\u003c/b\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was a word you might not hear often. Patchwork was a type of handicraft where small pieces of cloth were connected to make a large sheet. How much could be completed within the time limit, and the design, etc., were evaluated. The opponent who appeared here was the Tatebayashi group, which had a dispute on the first day due to Kōenji's selfish behavior. Their record so far was one win and nine losses. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAll five participants were girls and experienced sewers, a formidable enemy. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eMoreover, the misfortune of colliding with Inogashira, who excelled among the experienced sewers, resulted in my second individual loss. The group also suffered its third loss. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cb class=\"calibre6\"\u003e[Archery]\u003c/b\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe 11th game, where we wanted to avoid consecutive losses, was another outdoor sport. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEven if you hadn't done it before, you could probably imagine the rules. It's a competition using a type of archery called recurve, where we aimed at a target one-on-one. Normally in recurve archery, you shoot an arrow at a target 70 meters away, but in this experiential learning, it was set at 20 meters. Each person was given six arrows, and the total points were competed for. The center of the target was ten points and the outermost part was one point. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eMorishita, who volunteered to participate, entered the game but was unable to handle it well and couldn't hit the target even once, a slight accident, but both the group and I were successful in avoiding consecutive losses. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cb class=\"calibre6\"\u003e[Glasswork]\u003c/b\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe last match of the second day was glasswork. This facility had a large workshop prepared, and the items made could be taken home, making it a popular experiential learning activity among the students. The opponent didn't care much about winning and had a low win rate, and each person made what they wanted to make, so I was able to win in the judging for the individual competition in terms of completion and speed. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p119\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-119_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 130\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eOn the other hand, in the group competition, Hiyori showed her skill once again and contributed to the victory. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAt the end of the second day, the halfway point of the competition, the total group results of the exchange meeting were twelve games, nine wins, and three losses. \u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p120\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-120_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 131\" /\u003e\u003c/p\u003e\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was just before 6 p.m., a time to relax after the exchange meeting. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe rest area inside the building was a bit crowded. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThis was because a free drink corner had been placed so the tired students could relax. There were several types of tea and juice, and there was a row of small paper cups, stacked upside down. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Your group seems to be doing quite well.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSanada said as I ran into him. We stopped by the rest area at almost the same time.  Kiryūin’s group was tied for sixth place with nine wins and three losses. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eDepending on tomorrow’s results, it was possible to aim for the podium. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I have reliable allies helping.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI distinctly recognized how good at detailed work Hiyori was. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHer ability to handle things like  \u003ci class=\"calibre3\"\u003eoshibana\u003c/i\u003e and glasswork was far higher than that of an average student, which required not only technical skills but also aesthetic sense. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThis was something I would never have noticed if I hadn't spent time with her in experiential learning. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“How are the students of Class A? Are they cooperating well?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe asked hesitantly, seemingly concerned about his classmates. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Hashimoto hasn't participated in any activities yet. He's in more of a support role. Yamamura is participating in the matches, and her honesty is helpful.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHowever, Yamamura had seemed listless lately, but I didn't mention that. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen I talked positively about them, Sanada listened with joy as if it were about himself. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Then there's Morishita. . Well, cooperative. . no, creative, I guess.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Creative. That might be true.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eMorishita, in contrast to Hiyori, was not dexterous with her hands, but rather clumsy. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eI think she's seriously trying, but she's not producing results. There might be\u003c/i\u003e \u003ci class=\"calibre3\"\u003esomething artistic about her ability to create bizarre things. \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEven her attempt at archery was terrible. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhile talking, the two of us stood in a short line, and I took a paper cup and poured tea into it. Sanada seemed to have chosen hot coffee. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I see. Honestly, I'm glad that the three of them are in the same group as you this time.” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p121\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-121_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 132\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThere might be some elements of courtesy in his words, but something about Sanada's statement bothered me. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Why do you think so? There should be many others who are more approachable.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEven if we limited it to Horikita's class, Yōsuke and Kushida would be much more capable. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Well, it's largely because of how Sakayanagi-san sees it. Even I can tell that she treats you in a special way. After the last exam, Kitō-kun has been on edge, but I think he's still able to keep his self-control in check because you’re by Hashimoto-kun's side.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eFor Hashimoto, it had been a series of unexpected good luck since the day he came to my room. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Are all three of them blending well into the group? I think Hashimoto-kun will be fine, but I don't think Morishita-san and Yamamura-san will.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I wonder. I'm honestly leaving the girls to the other girls..  Are you worried?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eDoes he specifically have concerns about the two of them, or is he just\u003c/i\u003e \u003ci class=\"calibre3\"\u003eworried about his classmates? \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBoth have distinct personalities, so it wouldn't be surprising. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Actually, I've been watching over Morishita-san quite a bit since our first-year.” “If Miya heard that, she might cry.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Eh, what? No, not at all. I only have eyes for Miya-san!” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSanada, who was usually calm, hastily corrected himself. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHis reaction strongly conveyed his desire to not be misunderstood. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Part of it is because we sat near each other in our first-year. . She's the type to say everything she thinks and doesn't shy away from anything, so she's had her fair share of small troubles.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIndeed, she had recently made several remarks that had taken Hashimoto aback. “She seems to be an outsider in the class.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Yes..  It's a bad way to put it, but she is perceived that way.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt wasn’t like Ichinose's class, where everyone was friendly. There were people you liked and people you didn't. It was normal to show it in your everyday attitude. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'm not familiar with the situation, but Morishita doesn't care, does she?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf Morishita enjoyed being alone, it wasn’t for others to judge. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThat was probably why Sanada said he had been watching over her. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Yes, well I've never seen her seem to care. .” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p122\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-122_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 133\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I don't think you need to worry so much. But I understand what you want to say, Sanada. I'll keep an eye on her for the upcoming day and a half we're in the group.” “..Yes. Thank you.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSanada took a sip of the hot coffee he had poured into his cup, lightly cooling it with a gentle blow. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe seemed to finally be able to relax. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Sanada-senpai!” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhile we were resting shoulder to shoulder, a girl from class 1-B, Miya, spotted Sanada and ran over. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eRealizing that I was talking to Sanada, she hastily bowed. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'll be in the way, so I'll go back to my room. See you later, Sanada.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Yes, see you later.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eThey haven't been together for long, but they seem to be getting along very\u003c/i\u003e \u003ci class=\"calibre3\"\u003ewell. \u003c/i\u003e  They could always be together in the brass band club, and they must’ve been having a lot of fun together as students. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt’d be wise to leave quickly before causing any unnecessary trouble. \u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p123\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-123_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 134\" /\u003e\u003c/p\u003e\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003eAfter dinner, most students were relaxing in their rooms or baths. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eTokitō quietly left the shared room upon receiving a phone call from Ishizaki. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHōsen Kazuomi, the most problematic first-year student, was in Tokitō’s group. However, Tokitō didn't see Hōsen's existence as a problem and even criticized his arrogant attitude. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe wasn’t particularly exceptional in fighting, intelligence, or talking. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe only reason Tokitō could stand without fear was because of his rebellious spirit that he maintained under Ryūen's control. It was undoubtedly thanks to that two-year experience. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe area where the experiential classes gathered, their destination, was already deserted and quiet. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe place where Ishizaki called him was in front of the pottery class. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen he peered in through the window in the hallway, he saw a line of student-made works. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe pottery and other items made here, like the glasswork experience, could be shipped to your home after they were fired if you wished, this includes his work in the 'painting' activity that Tokitō participated in during this morning's game. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003e \u003c/i\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003e(TL NOTE: In order for clay to dry and harden, it has to be exposed to high\u003c/i\u003e \u003ci class=\"calibre3\"\u003etemperatures, typically within a kiln. This process is called “firing.”)\u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“. .You call someone out, yet you're not here.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe was about to take out his phone from his jersey pocket in irritation. That was when it happened. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Hey, sorry to keep you waiting.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What do you want, Ishizaki?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eTokitō, irritated by the leisurely approaching Ishizaki, called out to him, but Ishizaki walked up without answering his question. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Don't you know what I want?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“How would I know..  You didn't write anything specific.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe message he received only suggested urgency, saying 'Come quickly.' \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Well, I guess you wouldn't know. To be honest, I don't even know what I want.” It was strange that Ishizaki, who had called him, didn't know about it. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You don't know? I don't understand at all—” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eJust as he was about to voice his dissatisfaction, Tokitō felt a strong pressure on his back. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p124\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-124_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 135\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAnd immediately after, he realized that he had been forcefully pushed against the wall. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Hey. What the hell do you think you're doing?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eA devil whispered in his ear with a laugh. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Ryūen.. !? What do you mean? What..  what are you doing!” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSurprised, but managing to keep his shock to a minimum, he turned his gaze behind him. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I thought you needed more discipline, so I made a surprise appearance.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHeld down forcefully, Tokitō couldn't escape. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEven if he could momentarily break free from his restraint, he knew that Ishizaki, who was watching nearby, would come to help. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I don't..  understand.. ” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHis arm was tightened to the limit and the pain crept up to his back. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Do you really not understand?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThere was one thing he actually remembered, but he couldn't say it and played dumb. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I didn't do anything. .” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Really? I've got a report from my underlings about you.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“W-what? W-what is that!? What are you talking about!?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe insisted that he didn't understand, but his heart was palpitating in his chest from his anxiety. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe hoped that what he had sensed had nothing to do with him, but that hope was shattered immediately after. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Since coming to the training camp, I've received four reports that you've been trying to get along with Sakayanagi.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen the name Sakayanagi came up, Tokitō gave up on playing dumb. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I just happened to meet her, and we just chatted. I don't understand what's wrong with that.. !” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That’s possible, but unfortunately, I don’t believe it.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eConsidering how frequently they spoke—people who weren't even in the same group—it was hard to pretend it was just a coincidence. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“And you don't know what's wrong? That's a funny story.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Ugh...” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eTokitō averted his gaze, having his pretense seen through. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eRyūen pursued him, forcing eye contact as he brought his face closer. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“She's on the decline now. She'll fall and be done by the next end-of-year exam. That's why I told you not to carelessly intervene, didn't I?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eRyūen had particularly warned Kondō and Jima, who were in the same group as Sakayanagi when they were announced on the bus. There was no way Tokitō hadn't heard the warning in the silent bus. \u003c/p\u003e\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p125\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-125_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 136\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN\"\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-125_2.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"Image 137\" /\u003e\u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p126\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-126_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 138\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“So does a casual conversation..  require an intervention or something?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It doesn’t. And I told you this before too, right? Either ignore Sakayanagi or, if possible, inflict psychological damage and corner her thoroughly. Did you interpret that as some sort of light-hearted chat, Ishizaki?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Absolutely not!” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's right, isn't it? You, someone smarter than Ishizaki, should have understood.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIn reality, Tokitō did the exact opposite. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eReports had come in that he was often seen caring for and supporting Sakayanagi, not just having casual conversations. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You even told Isoyama, who saw you talking, to keep quiet, didn't you? \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eYou should’ve known whose order he’d follow, mine or yours.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIshizaki, who was listening nearby, aggressively nodded several times. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Learn your lesson, Tokitō. It'll make things easier for you. Even Ryūen-san will forgive you.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf he pledged obedience here, he would at least be released from constraint. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut Tokitō bit his lip hard and glared at Ryūen while trying to shake him off. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I... I just...” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Just what?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWith no point in hiding anything anymore, and feeling foolish for trying, Tokitō spat out his agitated words. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I just wanted to comfort Sakayanagi, who was sad about her friend being expelled…!” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Huh. You want to fuck Sakayanagi that bad?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003e(TL NOTE : (\u003c/i\u003e 楽 \u003ci class=\"calibre3\"\u003e) While not inherently sexual in any way, Ryūen purposely\u003c/i\u003e \u003ci class=\"calibre3\"\u003einterpreted ‘comfort’ as a double entendre. The word ‘Fuck’ is not a\u003c/i\u003e \u003ci class=\"calibre3\"\u003emistranslation. See (\u003c/i\u003e 犯る \u003ci class=\"calibre3\"\u003e.))\u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“No, that's not it! It's not like that!” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Is that so? It sounds like that to me.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eRyūen, laughing, continued his words. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Should I set up a stage for you to assault her then? Even that composed woman will be torn apart physically and mentally if you fuck her.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAt such a devilish whisper, Tokitō's anger shot through the roof in an instant. With a sudden increase in strength, he broke free from Ryūen's restraint. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Don't mess with me!” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eDriven by his enraged emotions, he tried to grab Ryūen with both hands, but his laughing figure disappeared from his sight. He received a kick flying up from below, gritted his teeth, and was restrained again. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p127\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-127_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 139\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Hehehe, don't take it seriously. But if you're up for it, I could let you take on the role to corner Sakayanagi.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“. .I won't obey you..  I'll never accept this.. !” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe refused to yield to the threat and seemed to have expressed his intention to continue his treatment of Sakayanagi. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eRecognizing that his spirit and determination were genuine, Ryūen didn’t stop his harsh treatment. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Then shall I make you understand with your body?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Don't mess with me, you can't—” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBefore Tokitō could finish speaking, Ryūen clenched his left fist and rammed it into Tokitō's abdomen without hesitation. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Ugh...!” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWith an agonizing yelp from the unfamiliar intense pain, Tokitō's knees buckled. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHowever, Ryūen's grip on him didn’t allow him to rest on the ground. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“There are no school surveillance cameras here. Right, Ishizaki?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Yes! I've confirmed that there are none in this area!” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“To think you'd obey such a guy.. !” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eTokitō condemned, irritated by Ishizaki's attitude. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I understand what you want to say, Tokitō. I've been rampaging with full control of the class, but I once gave up that position. You must have felt good then, right?” “Yeah.. I felt like I'd driven out the naked king..!” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003e(TL NOTE: (\u003c/i\u003e 裸の王 \u003ci class=\"calibre3\"\u003e) From The Emperor's New Clothes, refers to someone\u003c/i\u003e \u003ci class=\"calibre3\"\u003ein a position of power being in denial or unaware of their own flaws or mistakes,\u003c/i\u003e \u003ci class=\"calibre3\"\u003ewhile others are too afraid to point them out.)\u003c/i\u003e At Tokitō's merciless comment, Ishizaki put his hand to his forehead, as if saying ‘Oh dear.’ \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf you said something disrespectful, you'd be purged. That was the norm, and it was ingrained in his body. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHowever, Ryūen opened his eyes in amusement rather than inflicting any more physical pain. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's too bad. After all, I'm back in my former position and doing whatever I want. It must be frustrating.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe looked at himself objectively, without a need to think about how he was perceived by the people below him. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThat being said, Ryūen didn't change his attitude. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Do you hate me?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I hate you... to death...” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p128\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-128_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 140\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Then don't hold back. Show me you can take me down by force. I won't run or hide. But if you raise your fist, I'll corner you no matter what. The only way out is expulsion. Be prepared for that.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEveryone, not just Tokitō, understood well that Ryūen wasn’t afraid of defeat. That was why they would only rise in revolt if they were absolutely determined to overthrow him. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Got it? This is my advice. If you understand, don't ever help Sakayanagi again.” Despite the pain in his restrained arm, he gently told him that he could still turn back. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What if. . I disobey..  your order. .?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eRyūen pleasantly smiled at Tokitō's question, which didn't need to be asked. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'll crush you. Simple as that.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe same would happen even if he didn't raise his fist. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe’d relentlessly attack those who didn’t obey. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“...!” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eDespite being threatened, Tokitō continued to glare at Ryūen without losing his rebellious spirit. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's good, Tokitō. I find that part of you interesting. So let's see how long you can keep that look in your eyes.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhile looking down at his aching arm, in this inescapable situation, he made up his mind immediately. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You can rest assured knowing that I won't let Ishizaki lay a hand on you.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eRyūen, who gave Tokitō the time to catch his breath and the right to strike first, took a step back and widened his arms. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'll do it..  I won't lose. . to someone like you.. ” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe reassured himself and rubbed his fists together. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThere was a significant gap in their combat abilities. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut he was prepared to go all out and punch Ryūen in the face at least once. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf he was prepared for the backlash, he should be able to do it. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eJust as he was about to make up his mind, an unexpected person appeared. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I came looking for  \u003ci class=\"calibre3\"\u003ePaisen\u003c/i\u003e. I sent him on an errand, but he didn't come back, and what do I find here?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003e(TL NOTE: (\u003c/i\u003e パイセン \u003ci class=\"calibre3\"\u003e) Paisen, a disrespectful/slang way of saying senpai,\u003c/i\u003e \u003ci class=\"calibre3\"\u003ederived from switching sen and pai.)\u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe one who appeared on the scene, hand on his neck, was Hōsen from Class 1-D. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe had a long-standing relationship with Ryūen since middle school. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What's going on, Tokitō-paisen?” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p129\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-129_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 141\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“. .It's nothing.. ” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAlthough they were in the same group, Tokitō couldn't cry to his first-year kōhai. But there was no way nothing was going on when he was confronting Ryūen with his fist clenched. He had pride as a senpai who couldn't cry to his kōhai in the first-year, but this was also a problem within the class. He didn’t want to cause any trouble to his group because of this. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Get lost. You're in the way.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eRyūen tried to shoo him away with a light wave of his hand, saying it would spoil the mood. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“If there's nothing going on, go buy us first-years some drinks right away.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHōsen, for his part, ignored Ryūen and spoke to Tokitō in a strong tone. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Huh? Drinks? What on earth.. !” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eTokitō, who had been given the right to strike first, was dumbfounded and missed his opportunity. Ryūen's arm reached out again. He pressed his left forearm against his throat and slammed him against the wall. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Ugh...!?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eTokitō let out a scream of agony, unable to fully voice his pain. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Back off, Hōsen. I'm not dealing with you right now.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I don't care about that. I'm talking to Tokitō-paisen here. You're the outsider, so back off. Or do you want to die?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“. .Ha! You came all this way to look for him? Don't make me fall asleep.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eRyūen suspected that someone was behind Hōsen. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“No, Hōsen has nothing to do with it..  I just told Ishizaki that I was called to this place.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Huh? Hey Ishizaki, what kind of message did you send?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Huh!? It-it was just a normal one! I just told him to hurry to the experiential classroom area, that's all!” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIshizaki's careless mistake of not taking into account the potential risks in telling people where to go when they’re vacating the dormitory. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSeeing Ryūen smirk slightly through his nose, Ishizaki realized he had made a mistake. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Sorry, Ryūen-san! Hey, Hōsen, you go over there!” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIshizaki tried to make amends by grabbing Hōsen's thick right arm, but he was easily shaken off. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Don't touch me. I'll kill you.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Uh...!” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIshizaki flinched at Hōsen's intense intimidation, which was completely different from the feared Ryūen's. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eInstead of leaving, Hōsen started walking towards Ryūen and Tokitō. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p130\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-130_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 142\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It seems he wants to play. Albert, you handle this guy.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWithout making a sound, Albert appeared in front of Hōsen, blocking his way.  “As always, you can't do anything without relying on your underlings.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Fighting isn't just about charging in alone like an idiot.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHōsen yawned, then immediately spat phlegm on the floor. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I've always wanted to fight you, Albert. It might be more fun than playing table tennis.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIn the chaotic situation that was unbefitting of a training camp, Ryūen shifted his gaze from Hōsen and looked directly at Tokitō. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Now that the nuisance is gone, let's continue the fight—” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Excuse me, but could you let go of your hand, Ryūen-senpai?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Huh?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe person who spoke up to stop Ryūen, who was about to impose further punishment, was Utomiya Riku from Class 1-C. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What? Utomiya, you came too?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“W-What's going on?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe only one who was disturbed was Ishizaki. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Huh? Oh right, you were listening to Tokitō-senpai too.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I came to see if you were going to raise your hand against Senpai.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Where are your eyes? There's no way I'm going to raise my hand.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eDespite looking at Hōsen with contempt, Utomiya walked towards Tokitō \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eand Ryūen. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIshizaki tried to stop him, but he was pulled in by Hōsen's long arm, which was holding the sleeve of his jersey. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWith no one to stop him, Utomiya fearlessly closed the distance and grabbed the upper arm of Ryūen, who was still holding down Tokitō. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Tokitō-senpai is a member of my group. If he gets injured here, it could have an effect tomorrow. No matter how much it's an in-class issue, I can't overlook it.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWithout needing an explanation, Utomiya intervened to mediate the situation, sensing trouble from the tense atmosphere. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I don't care. Don't join in the barking at this shitty exchange meeting.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“. .The problem is the guy who's using his position to threaten others at this shitty exchange meeting. .” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eFar from backing down, Utomiya increased his anger and spoke out against Ryūen. “What? Then why don't you try stopping me?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Are you okay with that? You'll be embarrassed in front of your friends as a senpai.” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p131\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-131_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 143\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHaving given up on using polite language, Utomiya quickly prepared for a fight.  “Hey, hey, hey, hey! Don't start with Ryūen on your own!” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHōsen, opposing the development, yelled loudly throughout the corridor. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Shut up, Hōsen. I don't need you. Don't cause unnecessary trouble.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Huh? What's with you? Do you know who you're talking to?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Even if I talk to a big gorilla, words won't get through.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt seemed that Utomiya had come to support Tokitō, but he treated Hōsen the same way as Ryūen. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Fine, then. I'll start with you before Albert-paisen.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“How many times do I have to tell you? I'll take you on anytime.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSeeing the first-years start to quarrel, Ryūen couldn't help but burst out laughing at the unfamiliar sight. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Hehehe. This school’s getting quite noisy. I thought it was full of boring, serious people when I entered, but now, quite a few hot-blooded ones are showing their faces. I'm more than welcoming of it.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWith the addition of Hōsen and Utomiya, Ryūen released his hold on Tokitō. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe took his gaze off Tokitō, who was sitting down and coughing roughly. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'll take your revenge match right here, Hōsen. I'll take on you first-years all at once while I'm at it.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eRyūen, who no longer cared about Tokitō in this situation, said. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Sounds good. This camp is getting fun. First, disappear!” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHōsen's powerful fist was caught by Albert's hand, and Albert's lips were tightly closed. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Oh, you can endure it! That's how it should be!” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe situation was beginning to look like it wouldn't settle down unless it turned violent, but Hōsen's loud voice brought the situation to an abrupt end. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What's going on? What are you guys doing?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSeveral boys and girls, led by the third-years, began to appear in the experiential classroom area after hearing the commotion. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Tsk. It was getting interesting.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Damn it.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHōsen, ignorant of being the one who raised their voice, clicked his tongue just like Ryūen. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“This isn’t a fight, is it?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“No, it's not. We were just having a light-hearted conversation.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eUtomiya immediately went in front of the third-years and covered everything up with that claim. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSeeing how bad the situation had gotten, Ryūen and Hōsen, while glaring at each other, naturally turned their backs and kept their distance. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p132\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-132_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 144\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Let's go, Albert, and you too, Ishizaki. I'll teach you lots later.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Y-Yes! Thank you!!” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe three of them ignored the two first-year students and Tokitō who were glaring at them, and left the scene. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAs he was leaving, Albert looked at Hōsen's large back and muttered. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“His fighting ability may be equal to or greater than Ayanokoji. He's a tremendous freshman.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe weight of the punch he received was as intense as Ayanokōji's, as the numbness in his hand had told him. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was a telling statement, implying that it wasn’t a good idea to fight him. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHowever, Ryūen couldn't help but laugh at Albert's remark. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Don't make me laugh. If it's just simple power, he might be able to compete with him, but if you compare their overall strength, there's no comparison. The source of Ayanokōji's strength is not so simple.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAfter opening his fist and looking at his palm, Albert recalled the incident on the rooftop and agreed. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHis heart remembered. He was an opponent who transcended the ordinary standards of weight. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“But Tokitō, he seemed to be quite into Sakayanagi..  Don't we need to do something? Like Hashimoto’s betrayal. .” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eRyūen had already anticipated Ishizaki's anxiety without him having to put it into words. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Tokitō is not that stupid. We should leave it at that. We've already nailed him enough.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“. .Yes. If you say so, Ryūen-san.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“We'll focus on Class A. The most troublesome one right now is Kitō, not Sakayanagi. He could go berserk at any moment.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It feels like a war.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“War, huh? Indeed, anything could happen from here on out.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe end-of-year exams that will start soon. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eRyūen, who understood that turmoil would occur, began to prepare for what was to come. \u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p133\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-133_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 145\" /\u003e\u003c/p\u003e\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003eAt the time, I had no way of knowing that there was a war going on between Ryūen, Tokitō, and Hōsen. After the bath, I was sitting on the sofa in the lobby, leisurely looking at the ceiling. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was right next to the seat where Sakayanagi was sitting this morning. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe investigation Hashimoto requested—I made contact this morning and was personally satisfied with the results, but I hadn't reported anything back, so he was probably still expecting me to produce results. Even though I didn't feel like it, I thought I should at least do something that looked like it, so I came here. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Ah~! Ayanokōji-kun! Hey, can you listen to my story~!?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSatō, who was about to return to her shared room, changed her course when she saw me and approached with a frustrated look. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What happened?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It's the exchange meeting— \u003ci class=\"calibre3\"\u003ethe exchange meeting\u003c/i\u003e. I was seriously aiming for the top, so.. ” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe didn't try to hide her disappointment, and her shoulders slumped dramatically. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I wanted to buy something, and I tried my best in my own way. Ugh.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSatō's group had finished 12 matches in two days, garnering seven wins and five losses. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThey were doing well enough, but they were in a tough spot if they wanted to finish in third place. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“If you keep up the good work, there's a pretty good chance you'll finish in the top ten, isn't there?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThey could get 5000 points just by achieving that placement. Not a bad amount. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Yeah, that's definitely the goal. But what worries me is that the group's motivation has dropped quite a bit because of today's results.. ” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf they were aiming for a high ranking, it was natural to feel down. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe difference between the top and bottom was extreme in this exchange meeting. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe losing groups had 11 or 12 losses in 12 games, and they just couldn't win.  As a result, the wins were concentrated in groups like the Nagumo group, who were taking it seriously. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe difference between the third-place group and Satō's group was three wins. Quite a significant amount. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“The last game for today—I regret it. .” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p134\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-134_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 146\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Which was the last group you were up against?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI asked because I didn't know which group Satō's group was fighting against. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSatō showed a slightly regretful face, but told me. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“—It was Minamikawa-senpai's group.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe was from Class 3-C. I remember Onodera being in Minamikawa's group. It was a well-known fact that Satō and Onodera, who had been at odds to begin with, were not on good terms. If they felt they had misspoken, it seemed reasonable to assume that was the cause behind their discord. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBoth Satō and Onodera were typical female students as far as I could tell. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eFrom an outsider's perspective, it wouldn't be strange for them to get along, but that wasn’t how human relationships work. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eIs she still not fond of Onodera? \u003c/i\u003e It would be easy to ask, but it wasn’t something I should ask. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You have no choice but to carry that regret into tomorrow. There's still a chance depending on how hard you try.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“...Yeah.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAfter changing the topic and talking for a while, Satō was called by her group and left. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAfter that, without gaining anything significant, I returned to my shared room. “There's no one here.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe room was empty except for a slightly disheveled futon. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen I turned on my phone, I found a message from Hashimoto that had arrived about ten minutes ago. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003e[I'm going to the girls' room, so let's meet up there.]\u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe was quite carefree for someone who requested an investigation. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWell, going to the opposite sex's room to play might be one of the staples of a training camp. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAfter restoring the trampled futon, I decided to head to the girls' room. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAbout five minutes after reading Hashimoto's message, I arrived at the girls' \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eshared room. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe same building, the same layout, the same furniture, and decorations. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was a matter of course, but there really was no difference from the shared room the boys were using. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe only difference was the presence of the opposite sex. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eEven though it's neither more nor less than our shared room, why does it\u003c/i\u003e \u003ci class=\"calibre3\"\u003elook so different? \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhether you perceived this as a good or bad space was up to each individual. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p135\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-135_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 147\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eFrom the first-year students to Kiryūin in the third-year, all the girls were present. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAll the first-year boys looked tense but somewhat happy. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eYamamura looked a bit down, her expression darker than usual. She had no role in this exchange meeting, and I knew the least about how she was spending her time in the group. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Hey, you came.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You called me.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe boys seemed to be having more fun than I thought. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut the girls' energy was lower than I thought it’d be. In other words, they didn't seem to be having fun. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThose two pieces of information entered my brain in an instant. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHashimoto probably brought the boys to the girls' room to play, somewhat forcibly. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“We're a bit stuck. Do you have anything to liven things up? The room's atmosphere is a bit heavy, isn't it? How about a one-liner to dispel that?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I don't have such a gag, but how about this for a bit of fun?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI took out a certain case that I had stuffed in my jersey pocket and showed it to him. “Oh, that's nice. You're quite thoughtful.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSince the game list for experiential learning also included cards, there were plenty of them prepared and they could be obtained immediately. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHashimoto seemed to welcome this, reaching out his hand and asking to borrow it. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen he took it, he opened the case and took out a deck of cards. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Playing cards is the most classic of classics, isn't it, Ayanokōji?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eKiryūin, who had been sitting and looking at her phone, spoke to me without getting up. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I was once told by a blonde senpai that playing cards is a staple of training camps.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Huh? Could it be Nagumo?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe sat up, leaning back in her chair, and asked with interest. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen I nodded in confirmation, Kiryūin laughed a little as if she found the fact amusing. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That man also does such cliché things.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Besides, today was the first time our group lost in a card game, so I’m also reflecting on it.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Playing cards, huh?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eMorishita, who had been looking out the window near Kiryūin, muttered as if she had noticed something. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p136\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-136_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 148\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThen, while sitting in seiza, she approached by kicking the tatami mats with both hands. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003e(TL NOTE: (\u003c/i\u003e 正座 \u003ci class=\"calibre3\"\u003e) Seiza, where one sits on their heels with legs folded\u003c/i\u003e \u003ci class=\"calibre3\"\u003eunderneath the thighs and the buttocks resting on the heels, maintaining an\u003c/i\u003e \u003ci class=\"calibre3\"\u003eupright, straight back.) \u003c/i\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Let's do that.  \u003ci class=\"calibre3\"\u003eThat\u003c/i\u003e. The game where the person who has the Joker at the end loses.” “You seem very excited.. Do you like playing cards?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I can't say whether I like it or not. I've never done it before.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You've never done it? There really are fossil-like people who still exist?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHashimoto was surprised, his eyes wide. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“There were no people worth playing cards with.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eDoes that mean she didn't have any friends that she could do this with until\u003c/i\u003e \u003ci class=\"calibre3\"\u003enow? \u003c/i\u003e  “Wait a minute. That's strange. Didn't you give yourself a five for being good at cards?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIndeed, Morishita had given herself the highest rating, a five, for playing cards. “I thought I would excel even if I was inexperienced, given my talent. After all, it was not a confirmation of whether I was good at it or not, but a one-to-five evaluation of whether I had confidence, right? So, it's a five.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe answered confidently, puffing out her chest. She certainly seemed sure of herself. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“But you didn't seem to be called for today's game.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eOnly Kiryūin, the leader, knew the answer to why she wasn't chosen. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's right. Why didn't you choose me?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Isn't it suspicious to say you're confident in playing cards? That's why I left you out.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt seemed she made that judgment based on the rating list. Her impression was correct. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Well, never mind that. Let's play cards anyway. Please distribute them quickly, Ayanokōji Kiyotaka.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eI can tell that she really wants to play, so I don’t feel bad for bringing it. But\u003c/i\u003e \u003ci class=\"calibre3\"\u003enot everyone can play at once, so what to do? \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“How about this? Four players per game. A game for boys only and a game for girls only. Then a mixed game.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHashimoto, noticing my indecision, suggested a way to arrange the players. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's not a bad idea. Let's go with that.” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p137\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-137_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 149\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eMorishita was already eager, showing no signs of refusal. I thought the quiet Tsubaki might not have wanted to play, but it seemed that the other first-year students, Tsubaki included, were surprisingly enthusiastic. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“How about you come over, Yamamura?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI called out to Yamamura, who was sitting alone in the distance, but she shook her head from side to side. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Um... I'll... watch.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Are you sure?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eYamamura, who seemed to have no intention of participating, nodded slightly in refusal. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“There's no need to include someone who says they don't want to play. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eCome on, let's get started.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eUnder the pressure of the energetic Morishita, the girls' card game match immediately began. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“This exchange meeting is a good exchange meeting.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003e(TL NOTE: The above is intentional. That is just the way she speaks.)\u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's a cheap evaluation. Are you satisfied just because you can play cards?” Hashimoto, sitting cross-legged, muttered, resting his elbow on his knee. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'm satisfied, but please don't look at my cards from behind.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I won't reveal your hand.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I don't know when Hashimoto Masayoshi might betray us.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhile saying that, she hid her hand with her body. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eHashimoto’s smiling bitterly, but he really is a traitor.. \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“But it’s starting to become clear now.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eMorishita was having her first experience, but she wasn’t just enjoying it, she was also doing her own analysis. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“There are several strategies in this game.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSaying that, Morishita held only one card in one of her hands so that it stood out conspicuously. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Please go ahead, Shiina Hiyori. Don't hesitate to draw any card you like.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Somehow..  I'm a little curious about this one card.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Is that so? This is the advanced strategy I came up with.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBy the way, Hashimoto couldn't see it anymore, but from where I was sitting, I could clearly see Morishita's hand. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eApparently, the isolated card seemed to be the Joker. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBecause it was so suspicious, there was no way it’d be
