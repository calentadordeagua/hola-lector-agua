 the Joker—that seemed to be the aim. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eFrom a strategic point of view, it might not be a bad move. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p138\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-138_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 150\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAlthough it couldn't be proven that the likelihood itself increased, it seemed to have a big enough psychological effect to make her want to draw that one card, to make her want to try it. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What should I do…?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHiyori, who was suspicious, tried to escape to the four cards on Morishita’s right hand, but her fingertips stopped. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe seemed to be bothered by the one card in her left hand. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Please choose as you like.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eMorishita's lack of emotions, combined with her personality, made for a perfect distraction. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAfter a long thought, Hiyori was mesmerized and ended up drawing the one card on her left hand. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe pulled it towards her, turned it over, and was disappointed to find out that the card she had picked was a joker. \u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p139\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-139_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 151\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN\"\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-139_2.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"Image 152\" /\u003e\u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p140\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-140_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 153\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEveryone must’ve realized who had drawn the Joker from her obvious reaction. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You still have a lot to learn if you show it on your face.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAfter that, the game continued in silence for a few rounds. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe first one out was the first-year student Eikura, followed by Hatsukawa. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eMorishita, who had successfully passed the joker early on, ended up losing to the two first-year students in the subsequent card matching, and it came down to the final showdown with Hiyori. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAnd then it led to a scenario where Hiyori held two cards and Morishita held the last one. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Please go ahead, Morishita-san.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe smoothly held out two cards in the same way. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eMorishita, staring intently, grabbed the trump card on the right side from our perspective with her fingertips. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut she didn't immediately pull it. She asked Hiyori a question. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Is  \u003ci class=\"calibre3\"\u003ethis\u003c/i\u003e it?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“...What?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I thought it might not be the Joker.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I can't answer that.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I think it's the Joker.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I see. . then you might want to avoid it. Do you want to switch to the opposite card?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Is that okay? You'll lose, you know?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“But I don't actually know which one the Joker is.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You're naive, Shiina Hiyori. The mystery is all solved.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eMorishita let go of the card she was holding, grabbed the one on the left, and pulled it out with force. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe card Morishita showed us was… a five of hearts. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I win.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I lost.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHiyori seemed to be enjoying, even if she lost. However, she did look disappointed. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eOn the other hand, Morishita seemed to have been driven by a desire to win at all costs. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAfter that, they played a boys-only game, followed by a mixed game with both boys and girls. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Let's move on to the next game! The next game!” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eMorishita still wanted to play, but I voiced a concern that had been on my mind for a while. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Isn't it about time for Yamamura to join in?” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p141\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-141_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 154\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“...No, I'm… fine...” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe had been watching us the whole time, but her gaze didn't seem to fall on the game. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe looked distracted and not at all energetic. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI had hoped that playing cards would cheer her up, but maybe that was too much to ask. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Yamamura-san, won't you join us? It's fun.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAt that moment, Hiyori approached and invited her. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“But...” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Come on, please join us.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eUnable to refuse Hiyori's gentle demeanor, Yamamura reluctantly joined in. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut as soon as the game started, unexpected troubles arose. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Um, it's my turn.. ” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Oops, sorry, Yamashita-senpai. Please, go ahead and draw.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eYamamura, who was about to be skipped by the student next to her, hastily offered her cards. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThey got her name wrong, yet she didn't even bother trying to correct it. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEven though we were all sitting in a circle, the student drawing from Yamamura's hand skipped her. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eMaybe she had been avoiding the card game because she feared this would happen. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eA single mistake could be overlooked, but when it happened repeatedly, it was noticeable even to me, watching from the sidelines. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eWas Yamamura's presence really that faint? \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI had known about her tailing skills for a while, but it was usually impossible to overlook her when watching with the naked eye. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHowever, it was unclear whether this was because I was consciously trying to be aware of Yamamura, or because others were not paying attention to her. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI decided to ask someone the next time I had the chance. \u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p142\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-142_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 155\" /\u003e\u003c/p\u003e\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003eOn the way back from the girls' room. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen I looked at my phone, I realized that it was already quite late, with only about 20 minutes until lights-out. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Man, that was fun! But why do girls' rooms smell so good?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Right, right. . And wasn't Tsubaki-san cute?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Really? Are you a fan of Tsubaki?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe first-year students couldn't hide (or didn't want to hide) their excitement about their first visit to a girl’s room. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It looks like they had fun.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSeeing the excited kōhais, Hashimoto seemed satisfied that it was worth bringing them along. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut the next moment, the smile disappeared from Hashimoto's face, replaced by a stern expression. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Sorry, but could you guys go back first? Ayanokōji, could you stay with me a little longer?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen he instructed everyone but me, they all obediently agreed and went back to their shared room. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What's wrong?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You'll just go to sleep when you return to your room, right? I haven't heard anything about Sakayanagi.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“If you were expecting to learn something, I'm sorry to disappoint you, but there's nothing.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“But you did meet Sakayanagi today, didn't you?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIndeed, I had encountered Sakayanagi in the morning. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhether he had obtained information from somewhere or was simply trying to fish for it with a lie, I didn't need to probe. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEither way, my answer was already decided. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I did put some pressure on her, but it’s Sakayanagi. Honestly, I couldn't get much out of her. You know she's a tough opponent, right?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eRegardless of what I said, Hashimoto would likely be suspicious, so I continued speaking calmly. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Besides, I didn't have time to have a leisurely conversation.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI incorporated a subtle excuse into my words to avoid delving too deeply into the matter. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“. .Well, it's fine. Either way, the outcome won't change in the future.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThat outcome, needless to say, was something Hashimoto would communicate, not me. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p143\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-143_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 156\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Sakayanagi and Ryūen dropped out of the winning lineup on the second day. It's like a very anticlimactic end to a very anticlimactic tournament..” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSakayanagi's group had five wins and seven losses in twelve matches. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eRyūen's group had three wins and nine losses in twelve matches. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eUnless there was a major shakeup in the following day’s seven matches, their chances of ranking high were hopeless. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Well, I guess they gave up on the exchange meeting. Those two didn't show up at any of the experiential learning sessions. They probably didn't intend to receive any rewards from the start, right?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That seems to be the case, but you don't look too happy about it.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Well, of course. It's unsettling. It's weird that those two dropped out so abruptly.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHashimoto was naturally suspicious. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBoth groups disappeared from the top ranks without ever making a comeback. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI could understand why Hashimoto would be cautious just based on the results.  But that was probably an unnecessary worry. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eRyūen valued private points, but as announced beforehand, the private points available at this camp were special. They were limited to shopping. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eOf course, it was good to have them, but it wasn’t unreasonable for Ryūen not to prioritize them. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eRather, being able to move freely for three days might’ve been more advantageous from an information standpoint. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003e It would be better to keep an eye on Sakayanagi's situation for now. \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eOn the other hand, Sakayanagi, who lost in the survival and elimination special exam, should use this exchange meeting to cool down for the future. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSpending a leisurely time in nature and letting her wounds heal was one of the best courses of action. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThat was why Hashimoto should be composed, but in reality, he wasn’t. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe was trying to keep calm, but he couldn't hide his impatience. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I thought Sakayanagi, being smart, would have me investigated every now and then.. ” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEven in the relaxed exchange meeting, she might’ve been aiming to expel him—Hashimoto must have had such a sense of danger. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It's not like Toyohashi and the other first-years have already been won over by Sakayanagi, right?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe didn't verbally confirm it, but the first thing Hashimoto did was to get along with the kōhais, presumably to prevent that from happening. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p144\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-144_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 157\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Could it be that Sakayanagi had set up a spy even before we formed the group?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Don't you have a better understanding of the relationships within the first-years, Hashimoto?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eLong before the exchange meeting, kōhais had been working as Sakayanagi’s legs since shortly after entering school. That was still true. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Yeah..  probably not. . Basically, Sakayanagi didn't make direct negotiations. I was basically the one who interacted with the promising first-years. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut indirectly—” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe was desperately trying to maintain his smile, but he was pushing himself too hard. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It isn’t easy to expel someone specific except in special exams.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI tried to calm him down a bit, but while my words reached him, he couldn't fully digest them. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I know, I know, but..  it's Sakayanagi. I can't deny the possibility that she might do something I can't imagine.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAfter saying that, he stopped, perhaps realizing that he was stuck in a difficult predicament. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Let's stop. I should forget about Sakayanagi for now.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's better.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHashimoto took a deep breath, filling his cheeks with air, and forcefully exhaled to regulate his breathing. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Alright, I'll stop by the lobby toilet before I go back. You can go back and sleep first.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It's almost lights out, don't be too late.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Yeah.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eDid he find it difficult to use the bathroom in the shared room, or did he\u003c/i\u003e \u003ci class=\"calibre3\"\u003ehave another purpose in mind? \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEither way, Hashimoto went into the lobby toilet, which was devoid of people. \u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p145\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-145_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 158\" /\u003e\u003c/p\u003e\n\u003cdiv class=\"calibre4\" id=\"calibre_pb_8\"\u003e\u003c/div\u003e\n\n\u003cstyle\u003e\n    body {\n        color: #e5e5e5 !important;\n        background-color: transparent !important;\n    }\n    .P_Prose_Formatting {\n        font-family: serif; /* Match standard LN feel */\n        font-size: 1.08em;\n        text-align: justify;\n        text-indent: 1.50em; /* Standard indent */\n        line-height: 1.4;\n        margin-top: 0.42em;\n        margin-bottom: 0.42em;\n        color: inherit; /* Essential: Inherit theme color (white in dark mode) */\n    }\n    .P_TEXTBODY_CENTERALIGN {\n        font-size: 1.00em;\n        text-align: center;\n        text-indent: 0;\n        margin-top: 1em;\n        margin-bottom: 1em;\n        display: block;\n    }\n    .chapter-title {\n        font-family: serif;\n        font-weight: bold;\n        font-size: 1.8em;\n        text-align: center;\n        margin-top: 1.5em;\n        margin-bottom: 1.5em;\n        page-break-before: always;\n        color: inherit;\n    }\n    a { color: inherit; text-decoration: none; }\n    img { \n        max-width: 100%; \n        height: auto; \n        display: block; \n        margin: 0 auto;\n    }\n\u003c/style\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 5: The One Who Watches, The One Being Watched\",\"volumeId\":\"y2v11\",\"chapterIndex\":6,\"prevChapter\":{\"volumeId\":\"y2v11\",\"chapter\":5,\"title\":\"Chapter 4: A Strange Discomfort\"},\"nextChapter\":{\"volumeId\":\"y2v11\",\"chapter\":7,\"title\":\"Chapter 6: A Peaceful Resolution\"},\"toc\":[{\"label\":\"Illustrations\",\"href\":\"index_split_000.html#illustrations\",\"index\":1},{\"label\":\"Prologue: Miki Yamamura’s Monologue\",\"href\":\"index_split_000.html#prologue\",\"index\":2},{\"label\":\"Chapter 1: The Elusive Two-Party Interview\",\"href\":\"index_split_001.html#chapter-1\",\"index\":3},{\"label\":\"Chapter 2: The Exchange Training Camp\",\"href\":\"index_split_002.html#chapter-2\",\"index\":4},{\"label\":\"Chapter 3: Request from Horikita \u0026 Request from Ayanokōji\",\"href\":\"index_split_002.html#chapter-3\",\"index\":4},{\"label\":\"Chapter 4: A Strange Discomfort\",\"href\":\"index_split_003.html#chapter-4\",\"index\":5},{\"label\":\"Chapter 5: The One Who Watches, The One Being Watched\",\"href\":\"index_split_004.html#chapter-5\",\"index\":6},{\"label\":\"Chapter 6: A Peaceful Resolution\",\"href\":\"index_split_005.html#chapter-6\",\"index\":7},{\"label\":\"Chapter 7: A Settled Night\",\"href\":\"index_split_006.html#chapter-7\",\"index\":8},{\"label\":\"Chapter 8: The Courage to Move Forward\",\"href\":\"index_split_007.html#chapter-8\",\"index\":9},{\"label\":\"Epilogue: Who is the Challenger?\",\"href\":\"index_split_007.html#epilogue\",\"index\":9},{\"label\":\"Epilogue: Postscript\",\"href\":\"inde
