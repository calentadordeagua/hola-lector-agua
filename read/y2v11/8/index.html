u003e \u003ci class=\"calibre3\"\u003e[I'm awake. All the boys are still awake, so don't worry.]\u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI told Hiyori to make it easier for her to continue sending messages. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003e[Thank you. Actually, I just noticed that Yamamura-san is missing.]\u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eYamamura is missing? \u003c/i\u003e It was basically forbidden to leave the room after lights-out. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003e[You mean outside the room? What about her phone?]\u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003e[It seems to be left in the room. I was contemplating whether to go and look\u003c/i\u003e \u003ci class=\"calibre3\"\u003efor her now. . I was wondering if I could ask for your help, Ayanokōji-kun.]\u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHiyori probably wasn’t good at this kind of thing, to say the least. Especially if she couldn't act stealthily, a patrolling teacher would easily spot her. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt could be said that it was the right decision to ask for help here. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe camp was almost over, but it seemed better not to leave Yamamura alone. She had a particularly gloomy expression during yesterday's card game. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eA possible reason why came to mind.  \u003ci class=\"calibre3\"\u003eI should go and look for her right\u003c/i\u003e \u003ci class=\"calibre3\"\u003eaway. \u003c/i\u003e  \u003ci class=\"calibre3\"\u003e[I understand. I'll go and check on her, so Hiyori, please wait in your room. \u003c/i\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eWe need a way to confirm if Yamamura comes back.]\u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen I told her that it would be more useful for her to stay in the room without leaving, a reply came back with a cute animal stamp saying 'Thank you.' \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'm going out for a bit.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Eh? Hey, it's past lights-out, you know? If they find you, you’ll get in trouble.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'm going looking for something. I'll try to come back without being noticed, if possible. If something happens, you guys can get mad at me.” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p169\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-169_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 184\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen I gave my answer, Hashimoto and the others didn't try hard to make me stay. Instead, they seemed quite happy and saw me off cheerfully. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe corridor was, of course, dark and silent since the lights were off. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eNow. . where should I start looking? \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWandering aimlessly wouldn't be efficient. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThere were two possible reasons why Yamamura, who wasn’t the type to break basic rules, left the shared room: either she was called out by someone, or she left the room voluntarily. However, in this case, the possibility of the former was quite low since she left her phone behind. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI proceeded with the assumption that she left voluntarily. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe next thing to consider was why it had to be after they turned the lights off.  In contrast to the night’s silent environment, countless distracting thoughts flooded my mind. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThere might’ve been times when you’d want to run away from the surroundings after all that \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut at that time, it wouldn’t be strange to subconsciously seek a place where you could feel at ease. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe conclusion reached by the line of thought belonging to a student named Miki Yamamura—if I were to derive that… \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI quietly showed my face in the lobby. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eImmediately after, I felt someone’s presence and hid in the shadows. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt seemed that a patrolling teacher was walking around with a flashlight. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe visibility was poor, but it was easy to see where the light was shining. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe thoroughly illuminated the surroundings, but he didn't seem to be actively seeking a rule-breaking student who had left the shared room. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe was just doing it as part of his job as if he was doing it out of obligation. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eTherefore, it was very easy to get past him, and his presence disappeared from the lobby as soon as I waited a little. It seemed he went to check the dining hall.  Considering the route he took, he must’ve gone to either the shared rooms or the experiential classrooms afterward. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThere was a brief pause. I headed straight to the vending machine without hesitation. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI had a hunch that the odds were high, and I was able to confirm my guess immediately. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThere wasn't a girl sitting alone, instead, she was leaning against the vending machine, looking down. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p170\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-170_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 185\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe hallway was chilly, so she might’ve been trying to keep warm, but that might be reading too much into it. I thought she would’ve noticed me eventually, but she didn't seem to be aware of my presence at all. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThere was no change in expression, no sighs, as if nothing triggered a memory. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe just stared at a single point on the floor, not moving at all. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“The teachers probably don't even think there's a student here.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI couldn't just keep watching her, so I decided to call out to her. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Ah… Eh!?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eYamamura, startled, turned her face towards me. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHer eyes were filled with fear, but as soon as she realized it was me, that fear dissipated. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Wh-wh-wh-why are you here. .?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“They'll get mad if they find you. I came to take you back before that happens.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I was confident that… I wouldn't be found… but if you found me, I can't use that excuse, can I…?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eYamamura could certainly avoid the teachers' surveillance and even return to the shared room. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“. .How did you… notice I was gone?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“There's no special reason. Hiyori just noticed you were gone, and she told me about it. She was worried.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'm sorry… I just really wanted to be alone...” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You can’t be alone in a shared room unless you lock yourself in the bathroom.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe nodded slightly, indicating that I understood. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Can I… stay here a little longer. .?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Do you have to be next to the vending machine?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Yes. When I listen to the sound of the vending machine, the unnecessary voices in my mind disappear. .” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThis behavior seemed to be a standard way for Yamamura to protect herself. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Then I guess this is the only place. So? Did the unnecessary voices disappear?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Wh-why are you asking that.. ?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“If they don't disappear and I take you back, you might run away again. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBesides, I hate to say it, but it didn't look like it was working.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Usually, they stop immediately and it's resolved… usually.. ” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIn other words, it was different now. From Yamamura's downcast expression, I could tell something serious was going on. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“If you have something bothering you, you should try expressing it.” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p171\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-171_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 186\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“...No. I'm fine.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Really? I've been watching you here for about five minutes, and I didn't get that impression at all.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“F-five minutes!? Really. .!?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Sorry, I lied. It was about 30 seconds.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe fact that she didn't doubt even an arbitrary number of minutes suggested that she wasn't aware of her surroundings. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Do you not like talking about your troubles with others?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It's not about liking or disliking, I just… don't have that kind of experience. .” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEven without discussing it much, it wasn’t hard to imagine Yamamura's life. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe probably spent a lot of time alone from a young age and spent more time with her mouth shut rather than open. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEven though our circumstances and situations were very different, I could tell that we had similar experiences. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'm not good at talking either. If there's a small problem, I tend to keep it to myself or try to solve it on my own. So I rarely have the opportunity to consult with someone about my troubles.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You too, Ayanokōji-kun? But to me… you seem normal. You seem to have a lot of friends. And Shiina-san too. She's bright and cute… I'm jealous.. ” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf you only look at the present, it probably wasn’t unreasonable to feel that way.  However, everyone has had a less mature side in their past, different from who they are now. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Can you picture how I was during the earlier part of last year?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe probably wasn't helping Sakayanagi at the time, so she wouldn't know. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“. .Now that you mention it… I don't know anything.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Right? So you could only be sure that I wasn't a student who left an impression on many people. Fortunately, I was pulled along by my lively classmates and was able to build some relationships, but that wasn’t something I arranged myself.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“But why have you become like this now?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I wasn’t close with those around me, but at least in these last two years, I've started to try to close the distance, little by little. I think that's had an impact. I’ve started being able to express what I’ve wanted to say around that time.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eYamamura still couldn't understand it. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'm… probably scared. Of voicing my thoughts. And of those thoughts spreading unintentionally. I'm scared of being known.. ” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eYamamura's style until now had been the opposite. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p172\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-172_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 187\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003ePicking up other people's thoughts in secret and passing them on to a third party. It wasn’t unreasonable to feel a strong resistance when transitioning from being the one who knows to being the one known. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I won't force you. You should judge for yourself.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWithout making her too conscious, I slowly sat down in front of the vending machine, leaving some distance. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI could feel the slight vibration of the vending machine and the sound of the fan through my back. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eYamamura wasn’t the only one who feared loneliness. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhether it was Yōsuke, Kei, Ryūen, Sakayanagi, or any other student, human nature was the same. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eUnable to bear loneliness, they couldn't live alone. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThat was why those who stood by you without asking anything in return were important. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEven though I didn't feel it applied to me, I understood that it was an answer. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe contradiction it contained. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eNo, that fact doesn't matter now. \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe Yamamura in front of me wasn’t foolish. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe wasn’t seeking loneliness, nor did she think loneliness was right. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf there was someone who could offer a proper helping hand, she wouldn't make a mistake. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“. .Can I talk to you?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eYamamura, who sensed no hostility, began to voice what she had been holding back. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Since the last special exam ended, I've had one question in my mind.. ” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was about the details of what happened in Class A during the survival and elimination special exam. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIn a situation where defeat was certain and a dropout had to be chosen, Sakayanagi chose to draw lots. No matter how she decided, there would be pros and cons. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSince everyone didn’t have the same abilities, there would always be those who were dissatisfied, whether you directly named them or played rock-paper-scissors. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eTo Sakayanagi, who saw all students other than herself, as equals, the lottery was probably the most equitable decision. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHowever, she must’ve realized that it was a mistake. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEven if she was disliked by those around her, she should’ve kept the person that was most convenient for her. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf Kamuro had stayed, Sakayanagi's weakness wouldn’t have been exposed. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p173\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-173_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 188\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut Sakayanagi wasn't the only one who was hurt. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eYamamura was standing on a side of the scales that separated the final two choices in the lottery, life and death. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“When I hesitated to draw a lot, Sakayanagi-san said she would stop the lottery. If you didn't have the courage to draw a lot, it was the same as abstaining.. ” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf she refused to draw for a long time, it was certainly a choice she could make. But Yamamura felt that it was too quick a judgment to call it a careful consideration. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Did Sakayanagi value Kamuro and try to cut you off?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eYamamura quietly nodded. It wasn’t just a guess, but Yamamura's conviction. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I strongly felt that Sakayanagi-san wanted me to withdraw at that moment.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAnd she continued. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I understand that it can't be helped. At least, when comparing me and Kamuro-san, the value was clear. I didn't wish to have special treatment. I didn't even want to be greedy and wish to be considered a friend. But..  I was shocked to know that my existence was something that could be discarded in an instant..  even though she used me, saying I was a valuable person.. ” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSakayanagi had found Yamamura, who had always been alone, and highly valued her ability. However, when she weighed her against Kamuro, she realized that the difference between the two was so great that it wasn't even a contest. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIn the end, she knew Kamuro would be chosen, but she thought she would hesitate. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eYamamura's small wish, one that she belittled herself for, was mercilessly denied. “Sakayanagi may have indeed seen a difference between you and Kamuro, but whether she thinks you’re irrelevant or not, isn't that a separate issue?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“. .I want to believe that, but.. ” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe probably hadn't had any contact with Sakayanagi since that day. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSo she must’ve been questioning herself this whole time. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I've been thinking about talking to Sakayanagi-san during this camp, but I couldn't muster the courage. I couldn't call out to her. .” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAlthough she had spotted her several times, it seemed she had never managed to speak to her. It must’ve been a considerable hurdle for Yamamura, who usually waited to be spoken to. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“More people were clinging to her than I thought. In the middle of it all, Tokitō-kun got into trouble. . It looked like a difficult time.” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p174\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-174_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 189\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eYamamura expressed her thoughts, revealing Tokitō’s attempt to extend a helping hand to a dispirited Sakayanagi. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHowever, being witnessed led him to be summoned to an experiential classroom and interrogated. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“As a result, Tokitō-kun was..  forcibly restrained and threatened by Ryūen-kun and his group.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was probably an appropriate decision on Ryūen’s side, who was tense in preparation for the end-of-year exams. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf the opponent they were going to fight in the future was unexpectedly weak, they would either leave them alone or weaken them further. Although some parts were too radical to ignore. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe seems to have established a strong sense of alertness, intending to approach the next end-of-grade exam thoroughly prepared. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eFor Ryūen, who was confirmed to compete with Sakayanagi in the end-of-year exam, it was natural to think that he didn’t want to stimulate and revive her. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe seemed desperate to take advantage of the situation where she’d been tripped up by an unexpected defeat. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIn other words, it was proof that Sakayanagi was an opponent who couldn’t be underestimated and lacked weaknesses. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eTokitō’s purge in the flow of things was expected to come to a fast end. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHowever, Tokitō’s groupmates, Hōsen and Utomiya, joined in, and there was a risk of a brawl. It seemed that the situation was resolved when the number of students who heard the commotion suddenly increased all at once, and they dispersed. \u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p175\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-175_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 190\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN\"\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-175_2.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"Image 191\" /\u003e\u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p176\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-176_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 192\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“But I'm impressed. You watched the whole thing and no one noticed?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's all I’m able to do.. ” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eYamamura was perfectly suited to gather information, utilizing her lack of presence. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSakayanagi's skill in promptly recognizing and utilizing that ability was once again impressive. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThis time, Yamamura was able to witness the scene because she herself was concerned about Sakayanagi. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIndeed, Sakayanagi was now on a downward slope. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What do you want to do?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Huh...?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“As a classmate and as someone who’s likely to be abandoned by Sakayanagi, what do you want me to do?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I, um...” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I want to hear your feelings.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I have. . two wishes. One is..  I want to know what she thought of me then, and what she thinks of me now. “ \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“And the other one?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“... I think... Sakayanagi-san doesn't suit losing..  I don't want to see her struggle in the end-of-year exam. . I hope she wins.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThere were no personal calculations, no wanting her to win just because she was a Class A student, just a genuine concern for a student. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Is that so…? I see.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eSakayanagi might need a little push. And soon. \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Why don't you try telling her? No one has the right to condemn your actions.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What if. . what if. . she doesn't even want to listen to me. .?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“In that case, let's say, I'll get stuck in between some vending machines and talk it over.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen I told her that, Yamamura looked at the vending machine a little shyly and nodded. \u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p177\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-177_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 193\" /\u003e\u003c/p\u003e\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was just before 1 a.m. on the fourth day of the training camp. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eLong past lights-out, Nagumo was quietly walking down the hallway alone. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe knew he’d get a little warning if he was found, but there was no clear penalty. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eOf course, this wasn’t the case if he resisted, such as not returning to his room after being found. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eConsidering the risks, it had already been demonstrated using other students the day before. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAbove all, he’d investigated that the teachers' patrols would end at midnight. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eTherefore, Nagumo was hardly worried about being found. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe lights in the lobby were kept to a minimum, and only the sound of the compressors of the lined-up vending machines annoyingly reached his ears at such a time. He passed through the lobby and moved on to the cafeteria area, where no one was supposed to be. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe couldn't feel anyone's presence, but his intuition was working. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eShe's right in front of me\u003c/i\u003e, he thought. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You came as promised.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eFrom the back of the darkened cafeteria, such a cute voice reached him. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I've never refused a woman's call before,” he spoke into the darkness. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Yawn, what a cheesy line. Honestly, I hate your type.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Relax. I'm not into women like you either.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNagumo, who snorted in amusement, stepped into the cafeteria with his hands still in his pockets. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“So, there was no need to threaten me. That might’ve been an unnecessary move.” As his eyes adjusted to the darkness, a female student emerged. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Amasawa, did you really want to be alone with me that much?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Opportunities to be alone with a former student council president don't come around often, do they?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I want to confirm something. What would you have done if I hadn't come?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I would’ve beaten up your precious Asahina-senpai, Nagumo-senpai.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eMany would’ve laughed off Amasawa's response as a joke, seeing her smiling face. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAnd Nagumo did the same, but his eyes weren't laughing. He was convinced that the first-year student in front of him would’ve carried out her threat. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p178\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-178_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 194\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Did you show your skills in archery with Ayanokōji to make your threats more effective?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Well, yeah. If I don't show that I'm capable, people might dismiss a woman's threats.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Okay, let's get to the point. So, why did you threaten me to call me out?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“There's a problem that only you can solve, Nagumo-senpai. That's what I want to talk about.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You had plenty of chances to talk during the exchange meeting.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhile responding, Nagumo internally braced himself. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe sensed that the girl in front of him was not just any girl—her presence was faint. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eA student with a strange presence, similar to Ayanokōji. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAnd the owner of unusual abilities, one that he had glimpsed during the archery match. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThat was more than enough to put him on guard. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“By the way, I'm thinking of seriously injuring you, Nagumo-senpai.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Seriously injuring me? That's quite sudden.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAmasawa, who was trying to enjoy Nagumo's surprise at the unexpected proposal, laughed in disbelief. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Is it too unrealistic? Or do you think you can't lose to a girl?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I wonder. Maybe it's both.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Will you run away?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIn this situation, Amasawa used her words to corner Nagumo, to make sure he wouldn't escape. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eA measure to prevent the former student council president from running away like a scared rabbit. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut Nagumo's demeanor was confident, showing no signs of worry. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Can I at least hear the reason?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“The reason? Hmm, let's just say it's a personal vendetta.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Personal vendetta, huh?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Yes, a personal vendetta. Now, if we take too long, the teachers might find us, and it would be embarrassing if the fact that you were beaten by a girl got out, so can we start?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Just to confirm, do you really think you can beat me?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Haha, I've been waiting for you to say that. Let's give it a try.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It's easy to say, but there’s nothing in it for me. It would be a problem if I retaliated against a girl who came at me out of personal vendetta.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It's pointless to resist anyway, you can just let me beat you up. That way, you'll lose your pride, but you won't get penalized by the school. I recommend it.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Aren't you afraid of being expelled?” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p179\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-179_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 195\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Of course not. If I get expelled, I have nothing to lose.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“So, persuasion is impossible?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Yes, I have no 'value.' In other words, I'm invincible.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNagumo slowly pulled his hands out of his pockets. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf he had been holding his phone, Amasawa would’ve immediately jumped on him to prevent him from calling for help. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I didn't bring my phone.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Oh...” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAmasawa had slightly licked her own lips. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Did you get cautious because of the recording? Go ahead and answer without holding back. State the reasons behind this so-called personal vendetta.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You teamed up with Ayanokōji-senpai and expelled Yagami Takuya, right? \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt's payback.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNagumo had been considering various things, but he was completely surprised by the unexpected. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Yagami? Don't tell me, you were Yagami's girlfriend?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's not it, but we were like siblings who had surpassed that kind of relationship.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Then aren’t you targeting the wrong person? I wasn't the one who led that.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I know that. I told you, this is just a personal vendetta. Unfortunately, even if I stand on my head, I can't beat Ayanokōji-senpai, and I thought about beating up Karuizawa-senpai and expelling her, but that's a bit scary.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Scary? Of getting revenge from Ayanokōji? I don’t think he cares about what happens to Karuizawa.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Ayanokōji-senpai has his own goals. I don't want to interfere with that.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBy expelling Karuizawa, it would interfere with Ayanokōji's plan. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAs someone who knew the circumstances, Amasawa thought she couldn't do such a thing. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“People like Nagumo-senpai are well-suited for stories where the character ultimately faces their downfall at the conclusion.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It suits me, huh?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eUsually, Nagumo would’ve been displeased and angry if such words were said to him. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut now, emptiness welled up before such emotions. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThinking it was a waste to spend any more time, Amasawa stepped forward. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Last year and the year before, the one always causing a stir at this school was Horikita Manabu.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut something unexpected began, and she stopped. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“This year it's Ayanokōji. I'm sure it'll be the same next year after I'm gone. I was indeed enrolled at this school for three years. I also served as student council RoyalMTLs \u003c/p\u003e\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p180\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-180_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 196\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003epresident. Even if I attracted attention within my year, it didn't resonate at all with the upper or lower years. There's nothing more empty than that.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThat was why he desperately continued fighting. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I realized it just before graduation. It's not Horikita-senpai or Ayanokōji that’s to blame. It's me who couldn't reach that realm.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThat was why he couldn't get angry when told that downfall suited him. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf only Nagumo was more capable. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe names Horikita, Nagumo, and Ayanokōji would’ve been treated as equals. Realizing this, there would be no need to seek clarity in challenges or establish a hierarchy; they would’ve been on par. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“But… that's not the case. I wouldn't have been satisfied with that situation either.” If the three of them were lined up, he’d still want to rank them and be number one. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's why I won't quit this game. Next year I'll do it again with Horikita-senpai. And someday I'll have a real match with Ayanokōji and settle it.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eA part of him could be honest because he was talking to Amasawa, who had nothing to do with him. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAlthough he didn't vocalize it, Nagumo was grateful for this situation. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Before you put anything into action, I have a gift for you.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAmasawa, who wasn’t at all interested before, was intrigued by Nagumo laying everything bare. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSo she stopped and listened to the end. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“A gift? I'm the type to throw away presents from men I'm not interested in without opening them.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I see. Then it might end with you throwing it away without opening it. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAfter all, it's just a message from Ayanokōji.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“. .Ayanokōji-senpai.. ?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHer body stiffened involuntarily at the sound of his name. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“If it's a lie to save yourself, it will only widen the wound.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Believe my words or not, it's up to you. The message from Ayanokōji is \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003e'You still have value. Don't waste it.' \u003c/i\u003e“ \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe reason Amasawa approached Nagumo at the exchange meeting was all for this moment of vengeance. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAyanokōji noticed something suspicious about Amasawa from the first day. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003ePretending not to know the rules of the exchange event, despite having obtained all the information in advance from Tsukishiro. The emergence of a contradiction due to the lie, fabricated to prevent Nagumo from realizing the true reason for approaching him. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p181\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-181_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 197\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe moment she heard that message, Amasawa completely lost her will to fight.  “Is this just a coincidence? The message seems to have foreseen even the fact that you would despairingly declare yourself someone without 'value.'“ \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe fact that Amasawa was targeting Nagumo and that she would take drastic actions because she had nothing to lose. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhat he’d been told at the time of their parting actually happened right in front of Nagumo. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eHe's a guy I don't like. \u003c/i\u003e Nagumo cursed in his heart. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eYet, Nagumo felt a slight sense of satisfaction. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNow, it would be a waste to seriously fight Ayanokōji. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'm tired, so I'm going back first. You should return to your room before you catch a cold.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNagumo left the dining hall, leaving Amasawa standing still. \u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p182\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-182_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 198\" /\u003e\u003c/p\u003e\n\u003cdiv class=\"calibre4\" id=\"calibre_pb_12\"\u003e\u003c/div\u003e\n\n\u003cstyle\u003e\n    body {\n        color: #e5e5e5 !important;\n        background-color: transparent !important;\n    }\n    .P_Prose_Formatting {\n        font-family: serif; /* Match standard LN feel */\n        font-size: 1.08em;\n        text-align: justify;\n        text-indent: 1.50em; /* Standard indent */\n        line-height: 1.4;\n        margin-top: 0.42em;\n        margin-bottom: 0.42em;\n        color: inherit; /* Essential: Inherit theme color (white in dark mode) */\n    }\n    .P_TEXTBODY_CENTERALIGN {\n        font-size: 1.00em;\n        text-align: center;\n        text-indent: 0;\n        margin-top: 1em;\n        margin-bottom: 1em;\n        display: block;\n    }\n    .chapter-title {\n        font-family: serif;\n        font-weight: bold;\n        font-size: 1.8em;\n        text-align: center;\n        margin-top: 1.5em;\n        margin-bottom: 1.5em;\n        page-break-before: always;\n        color: inherit;\n    }\n    a { color: inherit; text-decoration: none; }\n    img { \n        max-width: 100%; \n        height: auto; \n        display: block; \n        margin: 0 auto;\n    }\n\u003c/style\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 7: A Settled Night\",\"volumeId\":\"y2v11\",\"chapterIndex\":8,\"prevChapter\":{\"volumeId\":\"y2v11\",\"chapter\":7,\"title\":\"Chapter 6: A Peaceful Resolution\"},\"nextChapter\":{\"volumeId\":\"y2v11\",\"chapter\":9,\"title\":\"Chapter 8: The Courage to Move Forward\"},\"toc\":[{\"label\":\"Illustrations\",\"href\":\"index_split_000.html#illustrations\",\"index\":1},{\"label\":\"Prologue: Miki Yamamura’s Monologue\",\"href\":\"index_split_000.html#prologue\",\"index\":2},{\"label\":\"Chapter 1: The Elusive Two-Party Int
