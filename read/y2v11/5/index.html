3e“If you don't like it, you can just go back to your room.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You're kidding. I can't let you get revenge on your own.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eRather than against Amasawa, it seemed that the main driving force wasn’t wanting to let Horikita have her way. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It seems she was happy to accept the rematch.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Yes. She agreed immediately. But I faced unexpected resistance.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Unexpected?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I asked for the morning of the fourth day as promised with you, but she negotiated to change it to the morning of the third day.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“She wanted to move it up a day earlier.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Of course, since the condition for you to cooperate was the morning of the fourth day, I told her I couldn't compromise. In the end, she gave in, but it didn’t seem like she was any less inconvenienced. I wonder if she had some plans.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“In the early morning? It's hard to say. Since she accepted it, isn't it okay to ignore it?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf you hate getting up early, there wasn’t much difference between the third and fourth day. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Since I was the one asking, I didn't dig too much into it since it was a private matter. There might be some problems unique to girls, so if you understand, could you give us permission to change it to the third day?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIndeed, there was a cycle that could potentially be disadvantageous for women due to their physical structure. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut that was the same for Horikita and Ibuki, and I didn't think Amasawa would use that as an excuse. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“If the other party has agreed despite the inconvenience, we should proceed as planned. We should not reduce the number of special training sessions.” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p101\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-101_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 112\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You're relentless.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“The morning of the fourth day is the decisive day. If you can't follow that, I can't accompany you in the special training.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“. .I understand. I feel a bit guilty, but let's stick with the current plan. Is that okay?” “Don't think about holding back out of consideration for the other party.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHorikita seemed to be troubled by something. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I understand. She probably doesn't think she's going to lose at all. She's even worried about me.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe didn't seem to like that, but there was nothing she could do about it since she was on the side that wanted revenge. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'm going to beat her to a pulp.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIbuki was fanning the flames of revenge next to me. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was up to the individual to fan the flames, but going too far could be a big problem. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Don't injure her face, okay? It's a hassle if the fight gets out.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Huh? If it's a weak point, I'll aim anywhere. Actually, the first thing I should do is kick Amasawa in the face, right?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEven if I warned her here, she would probably still kick mercilessly when the time came. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It's good that you're motivated.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eFor now, I decided to leave it at that, as she was showing a positive attitude. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Could you tell me the additional conditions for accepting the offer?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Yeah. There's only one more condition left. Promise to fight two against one if you judge it's difficult to win. Don’t hesitate.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen I conveyed what I had decided in advance, neither Horikita nor Ibuki seemed to be able to swallow it immediately. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'm sorry. What do you mean by two against one—” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Of course, you and Ibuki are the two I’m referring to. If you can't accept that, then I'm not willing to cooperate.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen I told them again, Ibuki kicked the ground and thrusted her fist at me. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Huh!? What's this two-against-one in a match? That's so lame. It's impossible.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'm not saying you shouldn't do one-on-one. I said, ‘if you judge it's difficult,’ didn't I?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It sounds like you don’t think we’d win on our own.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'd like to sugarcoat it, but yeah, that's about it. I'm sorry, but the chances of beating Amasawa one-on-one are almost zero. I'm not going to go along with something that's just a waste of time.” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p102\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-102_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 113\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHonestly, even if they managed to make it two against one, there'd be a higher chance of it turning out like last time. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I don't like it. I can't accept that condition.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I don't like it either. But from the way you talk, it seems you know exactly how strong Amasawa-san is, don't you?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's right. To be honest, it's not exactly a match, but I've seen her strength.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“. .And you think there's that much of a gap between us and her?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen I nodded, Ibuki seemed to be even more upset and looked away with a click of her tongue. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I can't do this. I don't need Ayanokōji's help, I'll do it alone. In fact, you should do the same.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Indeed..  you've put forward an unexpectedly hard-to-swallow condition.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe must’ve been planning to accept most things without hesitation before coming here. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was no wonder she was wavering now, but it was meaningless to receive special training without a purpose. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“If that's the case, that's fine. It's easier for me if I don't have to cooperate.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Let me ask you again. You understand Amasawa-san's strength, don't you?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I think I understand it better than you or Ibuki, at least. Although it's only for reference, I can also fight by estimating Amasawa's strength.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHorikita probably just wanted a simple match, but if she could fight against an opponent of similar strength, she couldn't help but find it appealing. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“—I understand. I'm fine with that condition. But what if Ibuki-san refuses?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“This conversation is over. It’s only possible if the two of you cooperate.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Will you judge after seeing my improved strength?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's right. Let's give it a try then.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI slowly pulled my foot back and drew a small circle on the ground, about one meter in diameter. Then, standing at the center of the circle, I positioned my left hand forward and my right hand back. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I won't move from here. And I'll only attack with my left hand.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Huh?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“If you can make me struggle in this state, you should be able to put up a good fight against Amasawa.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Are you mocking me?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You're free to interpret it however you wish, but you're the one who asked me to show you, right?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Funny. Well, I'll burn that arrogance to ashes first.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eWhat an interesting way to put it. \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIbuki, like the last time we faced off, fought mainly with kicks. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p103\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-103_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 114\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHer sharpness might’ve improved, but honestly, it was a negligible difference. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI quickly determined the direction of her foot and dodged. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“How cheeky! If I can grab your left arm, it's my game!” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eApparently, Ibuki intended to grab my left arm to prevent me from attacking. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf that was what she wanted, I'd let her grab it to her heart's content. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen I deliberately held my left hand in an easy-to-reach position, she seized the opportunity and grabbed my left wrist. Immediately after, I spread the fingers of my left hand and took a big step with my left foot, placed right behind Ibuki. While drawing my captured hand in an arc from left to right, I used my left foot to step out and free myself. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIbuki, who was brushed off, was left in a defenseless state with her back fully exposed in front of me before she realized it. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Eh—!?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI thrusted my clenched left fist into Ibuki's back, who was still catching up on what happened, and lightly tapped it. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“W-What the hell. .!?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It's a kind of Aikido. The result won't change no matter how many times you try.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003e(TL NOTE: Aikido (\u003c/i\u003e 合気道 \u003ci class=\"calibre3\"\u003e) A type of Japanese martial art. The use of\u003c/i\u003e \u003ci class=\"calibre3\"\u003etwisting and throwing techniques and in its aim of turning an attacker's strength\u003c/i\u003e \u003ci class=\"calibre3\"\u003eand momentum against themselves.)\u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIn a one-on-one fight, the difference in ability couldn’t be overridden no matter how many times you fought. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eTo have a chance, you needed to accept a two-on-one and outnumber your opponent. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Could you switch with me, Ibuki-san?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Do you have to experience it to understand it?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's not it. Even with the short exchange just now, I could fully recognize the extent of your strength. That's why I want Ibuki-san to see it objectively. There wouldn’t be any progress if you don't know what happened.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe seemed to want to let Ibuki gain experience on her own. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Similarly, I'll also bind your left hand. But I don't intend to let it go down the same way.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's better. It's foolish to come and purposely get defeated in the same manner.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI let Ibuki step back and now Horikita stood in front of me. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You can start anytime.” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p104\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-104_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 115\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I intend to.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI thought she might take a moment to breathe, but she started moving immediately. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe quickly tried to grab not my left wrist, but further down. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI guess she wanted to test my instincts before she said anything else. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHowever, by skillfully adjusting myself and pulling my arm, I forced her to grab my wrist. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Kuh...!” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eInstead of grabbing me, she ended up being grabbed herself. Even if Horikita recognized this, she had already started the motion and couldn't stop halfway. Even though she understood in her head that it was a disadvantageous position, she moved in the exact same way Ibuki did. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eInstead of letting her latch onto where she aimed, I forced her to take hold of what she didn't want to. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe human mind is a strange thing, and even if you knew you shouldn't grab it, your brain would still judge it would be better than to not do so. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was because she hadn't accumulated the experience that not grabbing could turn the situation to her advantage. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“So the pattern I was caught in was the same as just now.. ” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's right.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“. .I wasn’t going to let the same thing happen to me, but before I knew it, I was forcibly taken.. ” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhile oozing frustration, Horikita's eyes stared at me intensely. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“This is the difference in ability between us and Amasawa-san right now, isn't it?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Yeah. At least, unless you can make me break the rules I set for myself, I don’t see any chance of winning.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhether to drive me out of the circle or make me use my right arm. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eChallenging for revenge without achieving either of those would only be laughable. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Are you convinced now? How reckless it is to fight Amasawa one-on-one?” Horikita was still keeping her expression in check, but Ibuki was clearly showing her frustration. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eLet's assume that she’s stopped boasting about defeating her and made some\u003c/i\u003e \u003ci class=\"calibre3\"\u003eprogress in understanding her situation. \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“How much is it…?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What do you mean?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“The difference between me and Amasawa. Can't you tell me in a way that’s easier for me to understand, like with numbers?” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p105\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-105_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 116\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIndeed, just having a vague feeling of it might not be enough to maintain future motivation. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“If we talk about physical ability, if we treat you two as equals and give you a score of 50, then Amasawa would be 60, so a difference of about 10.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen I answered like that, both of them looked at each other, perhaps surprised that the difference was less than they thought. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“However, if we include technical skills, it's a different story. You two focus on one style of martial arts, while Amasawa focuses on a wider variety of them. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eTaking that into account, the difference becomes even bigger.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI used numbers as a rough estimate, but this was just a guideline. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe outcome could change due to the conditions of the day, unpredictable events, misreading, and luck. But the greater the skill difference, the more trials would be needed. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“From now on, you two will fight me at the same time.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I don't like it.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I agree with you, Ibuki-san. But you understand why it's necessary, don't you?” “I'll definitely make him use both hands. Okay?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I wonder about that. I think it's easier to drive him out of the circle, don't you?” “I don't care. You should adapt to me.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThey started arguing about how to fight before they even started. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHorikita and Ibuki were like oil and water. They probably didn't have any intention of cooperating from the very start. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eFor now, I'd let them do as they pleased without mentioning it. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“We can't adjust to each other. Fine, let's attack as we please.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I agree.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt seemed they weren’t going to compromise, but rather attack at the same time, each doing their own thing. \u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p106\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-106_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 117\" /\u003e\u003c/p\u003e\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e“Shall we stop here?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBoth of them were greatly exhausted, partly because they were forced to fight as an unfamiliar pair. When I called it a day, they both sat down at about the same time. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Even if we do this for another day, it won't make much difference, but it should be somewhat better.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf they had challenged Amasawa for revenge without receiving any guidance, they wouldn't have any hopes of winning. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“How did you become so strong.. ?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I've been learning martial arts since I was little. That's all there is to it.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I've been doing the same. I've been trying not to lose to those around me, with karate as my main focus.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eMaybe I was a little too harsh.  \u003ci class=\"calibre3\"\u003eDid I damage Horikita's confidence? \u003c/i\u003e It seemed to have been backed by her experience. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI was thinking of inserting some mental care in a hurry, but it seemed that there was no need to worry about that. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“But I've decided to think of you as an exception. The fact that my brother recognized you is now a great source of support for me.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Hmm...” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eUnlike Horikita, Ibuki, who was still grumbling, stood up and turned her back away. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'll definitely make you use both hands tomorrow.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eLeaving those words behind, she stomped on the ground and returned to the camp. “She really is a sore loser.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt wasn’t a bad thing, but it was a shame that her vision was narrowed because of it. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI wasn’t sure if she was able to absorb all the moves and fighting styles. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It's okay. I'll have a talk with her later and review today's experience. Even if I have to force it upon her.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThat was reassuring. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI walked back to the camp with Horikita. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I didn't think you would cooperate so much. I thought you would hold back more, or stay within a safe range. .” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThere were several reasons stacked up, but the main reason for not revealing too much of my hand was that I had judged it to be too harsh for the future Horikita. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p107\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-107_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 118\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Sometimes I do charity work.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It's suspicious. I can't help but suspect there's something behind it.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“There's no choice but to be prepared for when it happens.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen I said that, with deliberate implications, Horikita narrowed her eyes in disbelief. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Right. Let's be patient with each other.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAfter she accepted it, I parted ways with Horikita in front of the building and decided to return to my room separately. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt would be better if Amasawa didn't know that I was teaching them. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAnd by the time I returned to my shared room, it was just before seven o'clock. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was just then when Hashimoto was waking up and sitting in his bed. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAs we were quietly conversing, the first-year students were also waking up from their shallow sleep, and soon after, everyone in the shared room woke up. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Alright. Then I'll leave for the morning bath. What about you guys?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI decided to join Hashimoto and enjoy the bath. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Oh, is Ayanokōji-senpai going too!?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's the plan—” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Yanagi, Kobayashi, Kozumi, let's go too!” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Huh? No, we. .” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Just come! Ayanokōji-senpai is calling for us!” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eNo, I'm not calling for anyone at all. \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eI would appreciate it if you didn't say anything that could be misunderstood\u003c/i\u003e \u003ci class=\"calibre3\"\u003eas power harassment. \u003c/i\u003e \u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p108\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-108_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 119\" /\u003e\u003c/p\u003e\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003eAfter we finished bathing, Kiryūin’s group, at Hashimoto's command, gathered all the remaining members, including the girls. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThen, during breakfast, we exchanged ideas about today's exchange meeting. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThat being said, more than half of the conversation was from Hashimoto, and the rest were little bits from the other students. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I don't really understand, but the boys’ unusual excitement..  it's creepy.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eMorishita, who was whispering next to me, spewed venom. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Really? I thought it was kind of cute.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHiyori's remark seemed to neutralize it. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHaving heard the conflicting comment of calling it cute, Morishita stared at the first-year boys again. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eRegardless of whether they were cute or not, it was true that they were unusually excited. They were mostly shrinking in front of their senpais when they gathered as a group yesterday, but that had completely disappeared. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eRather, they were making incomprehensible gestures with their hands and even bursting into laughter. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Is it cute?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I think it's cute.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'm sorry, but it's still creepy. Shiina Hiyori is strange.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Is that so?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWatching such an exchange nearby, I felt that Hiyori had changed a lot since we met. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe used to be a student who didn't show her heart and was less emotional. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNo, rather than saying that her personality had changed from the bottom up, it might’ve been more accurate to say that she started to reveal her true self. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Ayanokōji-kun, is something wrong?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBecause I was unreservedly observing her, Hiyori noticed my gaze. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It's nothing. Don't worry about it.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Is that so?” She tilted her head slightly but showed a smile without suspecting anything. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Ayanokōji-senpai! Can I join you in the bath again tonight!?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Huh? Oh, I don't mind at all.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhile feeling a strange pressure, given that it wasn’t a bother, I agreed. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThen, just with that, the first-year students bubbled up again. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“In less than a day, you've tamed the first-year students so well. What kind of magic did you use?” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p109\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-109_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 120\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eKiryūin, who had finished her meal early, leaned on the table and muttered with interest. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Honestly, I'm also confused. I haven't done anything special.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Do you intend to hide it from me too?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt seemed that she thought I was keeping a secret, but in reality, I didn't understand. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Do you not get why your kōhais respect you?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHashimoto, who had been eavesdropping on our conversation, chimed in. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I might not understand it myself, but there's a part of me that admires you—or rather, fears you.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Fear?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eFear was the feeling of terror towards someone with overwhelming power. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eThough, I don't remember using any form of intimidation like Ryūen or\u003c/i\u003e \u003ci class=\"calibre3\"\u003eHōsen.. \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I was surprised too. You're really a man among men..  It's not surprising that the first-years would act this way once they found out about ‘that.’” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Huh? I don't quite understand, but it sounds very interesting. What is \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e‘that’?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Sorry, but it's a secret between men. I can't tell you about it.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Hmm, a secret between men. That's not so bad.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eFor some reason, Kiryūin seemed satisfied with that explanation and stood up from her chair. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAs she was about to pick up her empty tray, Hashimoto stopped her. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“We'll clean up. You don't have to worry about it, Senpai.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I appreciate the thought, but I can clean up after myself. Let's meet again at the next exchange meeting.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWith that, she picked up her tray and walked towards the return counter. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Whether it's easy or hard to deal with, she's a difficult senpai to understand.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHashimoto voiced his thoughts on the departing Kiryūin. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIn terms of choosing the right person to match his description, he was right. \u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p110\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-110_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 121\" /\u003e\u003c/p\u003e\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e“Good morning, Ayanokōji-kun.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAfter finishing my meal and passing through the lobby, I found Sakayanagi sitting alone on a sofa. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Good morning. You look a bit sleepy.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe seemed to be a bit out of it, so I probed her. She nodded without denying it. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Yes. It seems I'm not good at sharing a room, so I couldn't sleep well. I decided to take a short break after I had a light meal.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEven if she wasn't exactly dozing off, closing her eyes might’ve had some effect. “I see. There's no guarantee that you'll be able to relax even if you return to your shared room.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Usually, I get eight hours of sleep a day. It seems I'll struggle for a few days.” Considering her personality, it was possible that she slept exactly eight hours. “Did you get along with your group members?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I don't think there's a need to get used to them, but I'm in charge of Class A. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWithout me doing anything, they approach me, so I’m not having trouble getting into conversations with them.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt seemed she wasn't having any problems in that regard, so that was good. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“How about you? Are you having any problems with sharing a room with unfamiliar people?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Well, I’m having a good time.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Ayanokōji-kun, you're in the same group as Hashimoto-kun and Morishita-san. How is Hashimoto-kun doing?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“He's acting as usual, but he seemed to be scared of something.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Speaking of him, there's a strange rumor going around. Something about him betraying the class. I'd appreciate it if you could warn him to be careful.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I don't think a warning would help.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Hehe.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSakayanagi laughed a little, but she didn't seem as confident or relaxed as usual. “Are you getting along with your group?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“This isn't a special exam, just an exchange meeting, so I'm not doing anything special.” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p111\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-111_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 122\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's a bit different from the information I got. Hashimoto said you'd aim to win in any way.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You're not usually one to take things at face value, Ayanokōji-kun. It's probably just one of the excuses he used to have you scout me.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHashimoto's statement might have been a bit exaggerated, but it wasn't completely off the mark. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Certainly, right after Masumi-san left, there was unexpected damage. You know that too, Ayanokōji-kun. But, I won't dwell on it for long.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSakayanagi answered with such composure. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“If there's a reason why I didn't do anything at this exchange meeting, it might be because I'm focusing on identifying someone who can become my new hands and feet.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIndeed, Kamuro had been a significant presence as an assistant until recently. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was certain that her absence would make it difficult to move. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“The person I keep close to me must be someone I can trust as much as possible.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What about Kitō?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“His loyalty is unmatched in the class, but naturally, I’m reluctant to involve someone of the opposite sex. Yet, even among the girls, no suitable candidate has emerged.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe only girls in Class A that I interacted with were Yamamura and Morishita. Both of them had their strengths, but they weren’t suitable for taking care of Sakayanagi. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Have you decided on a successor?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Not yet. So I’m expecting to be on my own for a while. I am prepared to accept this as a consequence of my own misjudgment.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt seemed more like she wasn't seriously looking for a replacement, rather than that she couldn't find one. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt might’ve been an exaggeration to call it a punishment for losing Kamuro, but she seemed to be choosing to live a life of inconvenience for a while. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThat was also Sakayanagi's choice, but there was another problem that needed to be resolved. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSuddenly, I felt a presence behind me and turned around to see Kitō \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eapproaching with a scary (as usual?) look on his face. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Good morning.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“. .There doesn’t seem to be any problems.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIgnoring my greeting, Kitō spoke those words to Sakayanagi. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“There is no problem at all. Thank you for your concern.” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p112\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-112_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 123\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWatching their exchange, I understood that Kitō had approached Sakayanagi out of concern for her. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAt a time when she was unstable after losing Kamuro, not only would it be reasonable to be sensitive to contact from Hashimoto, but from foreign existences outside the class as well. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Don't take it the wrong way, Ayanokōji-kun.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I understand. It's probably best to be suspicious right now.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Good morning!” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAs I was confronting Sakayanagi and Kitō, Amasawa slid into the gap between us. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Good morning, Amasawa-san. You seem to be in good spirits this morning.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Being energetic is one of my strengths, you know.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eKitō stepped back from Sakayanagi a bit, but kept his mouth shut so as not to interrupt the conversation. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I thought I'd give you a little encouragement before the second day of the exchange meeting starts. It seems like Ayanokōji-senpai has been winning all along, but..  you lost three times on the first day, Arisu-senpai. I'm worried that you might be in a pinch already.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Unfortunately, I am not in command this time. I have left it all to the third-year.” “Hmm? So if you lose, it can't be helped? I was hoping for a little bit of interaction with other years this time, as it's a valuable opportunity.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“There's no need to set limitations within constraints. If you wish to challenge me, I am always ready to accept, so please rest assured.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIgnoring the exchange meeting, Sakayanagi conveyed that she was ready to take on any challenge at any time. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHowever, upon hearing this, Amasawa laughed it off instead of getting excited. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You're bluffing. I've heard that you lost in the previous special exam and ended up at the bottom.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe seemed to have thoroughly collected information about the second-year students and confronted Sakayanagi without hesitation. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAnd then, the moment Amasawa tried to touch Sakayanagi as if to tease her, Kitō grabbed her wrist mercilessly, demonstrating his role as a shield. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What are you doing, Kitō-senpai? Isn't this something you should do to Ryūen-senpai or someone?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe portrayed herself as a weak woman, but Kitō didn’t loosen his grip. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Whether it's Ryūen or anyone else, I'll act if necessary. Of course, I won't choose the means to do so. Be prepared for that.” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p113\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-113_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 124\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eKitō made such a statement against Amasawa, who was smiling but showing hostility. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You're like a knight protecting a princess, but it's interesting. I don't mind even if you're violent against a girl..  Maybe I went too far with my joke.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAmasawa apologized, indicating that she had no real intention of doing anything. As soon as Kitō loosened his grip, she backed away. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'll play with you again next time. Please be ready to give it your all, Arisu-senpai!” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAmasawa hopped away, turning around and waving her hand several times. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“The calm atmosphere has been ruined.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Maybe so.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAfter a little bit of that exchange, I decided to leave. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI didn't want to draw unnecessary attention to Sakayanagi by hanging around too much. \u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p114\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-114_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 125\" /\u003e\u003c/p\u003e\n\u003cdiv class=\"calibre4\" id=\"calibre_pb_6\"\u003e\u003c/div\u003e\n\n\u003cstyle\u003e\n    body {\n        color: #e5e5e5 !important;\n        background-color: transparent !important;\n    }\n    .P_Prose_Formatting {\n        font-family: serif; /* Match standard LN feel */\n        font-size: 1.08em;\n        text-align: justify;\n
