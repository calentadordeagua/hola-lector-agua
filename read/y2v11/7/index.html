rikita and Ibuki, even I would struggle if I were blindfolded. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEspecially since I was focusing on defense, it would just be taking on unnecessary risk. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Blindfolding him won't help with the training, so rejected.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Well said, Horikita.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“But if you insist, let's do it after the special training.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's not it, Horikita.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI corrected Horikita in less than a second. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I can understand your feelings, Ayanokōji-kun. But first, we should prioritize defeating Amasawa-san, right?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“...Well, yeah.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEven though I was helping quite devotedly, it was quite a thing to say. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIn any case, it seemed that they were determined to succeed in their revenge against Amasawa no matter what. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Then let's start right away—” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eJust as I was about to speak, Ibuki stopped me. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Toilet.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Haven't you finished yet?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I thought I was fine. But when it gets cold, I have to go a little, so wait for me.”  “Really..” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAlthough Horikita was exasperated, it was cruel to tell her to hold it in. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf by any chance, she moved around a lot and it were to leak, it would be a big problem. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhile seeing off Ibuki who went back to the toilet, Horikita started talking. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p146\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-146_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 159\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“There's something I realized today.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What’d you realize?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“The reason you set the revenge match against Amasawa-san on the morning of the fourth day as a condition. It could’ve been to increase the amount of special training sessions as much as possible. However, if you wanted to make time, you didn’t need to limit the sessions to early mornings; you could’ve also done them discretely at any time. The main reason you chose the last day was to manage the risk of injury, wasn't it? If I get injured in a selfish fight before the exchange meeting is settled, it would be unacceptable to those who were seriously participating.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHorikita's group was a candidate for first place, unlike Ibuki's group, which lost the chance to win on the second day. As someone who stood on top of the leaderboard, It seemed she was able to notice that. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“With your skills, you can handle these sessions without injuring me, right?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What if I get injured?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“. .Is that even a possibility?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“No, it isn't.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAs soon as I replied, she showed a slightly irritated expression. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“If a normal person said that, they would definitely get a frown in return, so be careful. Maybe I should have you fight blindfolded later?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Please don't. I don’t think you’d need to hold back against me. I wouldn't say such a thing to anyone else.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Is that something I should be happy about. .?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You should be. It's special treatment.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's not a good kind of special treatment.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eRecently, I was having more and more casual conversations with Horikita. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThere must’ve been other people in the world, past and future, who were having similar exchanges as us, getting angry and laughing at each other. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“This is completely unrelated, but who comes to mind when you think of a student with a small presence?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen I asked that, Horikita thought for a moment and then gave her answer. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You, Ayanokōji-kun.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“...Me?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“At least when you first entered school, you were one of the less noticeable ones in the class.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I see. Indeed.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAmong the 40 students at the time of admission, if you were to rank us in terms of visibility, it would’ve been overwhelmingly faster to find me if you were counting from the bottom up. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Recently, you've been gaining more presence, so it doesn't apply now.” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p147\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-147_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 160\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIndeed, compared to the beginning, I think I had changed a lot. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe surrounding environment had changed more than anything else. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I wonder what factors determine how noticeable or inconspicuous someone is.”  “Hmm, is that so? If you want to be unnoticed or don't want to stand out, I think you naturally become inconspicuous. You probably won't speak much either.” All of these characteristics fit Yamamura. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEach one may not have been a big deal, but when combined, they’d make a big impact. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Is something wrong?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“No, I was just wondering about something.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Really? Oh right, about the matter you asked me to look into—” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen Horikita brought up the topic of special training, I had asked her to do something. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHorikita was now reporting the results. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“. .That's about all I noticed..  Will it be of any use?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Yes, it will be very useful. Thanks for looking into it. You can consider the request fulfilled.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHorikita, who had faithfully complied, didn’t seem to understand the meaning from, but she didn't try to inquire deeply about my reasoning. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“And by the way, that Ibuki sure is slow.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Indeed. I wonder what she's doing.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf she had just gone to the bathroom in the lobby and returned, it wouldn't have taken this long. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Did she go back to her room and fall asleep?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'd like to think not. . but with Ibuki-san, you never know.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What about her phone?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“She said it would be a nuisance and left it in her room.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I see. I hate to say this to you, Horikita, but if Ibuki doesn't come back, we'll have to cancel today.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It can't be helped. The condition was that Ibuki-san would fight with us.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe special training from yesterday was just a drop in the bucket, but there was nothing we could do. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eIt might be best to propose to postpone it. Hopefully, there will be another\u003c/i\u003e \u003ci class=\"calibre3\"\u003eopportunity to go out together to a place with lax supervision, like a training camp\u003c/i\u003e \u003ci class=\"calibre3\"\u003eor a deserted island. \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHorikita and I were looking in the direction of the building, waiting for Ibuki to appear. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“There's an opening!!” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p148\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-148_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 161\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWith that voice from behind, a presence rapidly approached. When we moved away from the spot, Ibuki's foot was extended where we had been standing just a moment ago. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe was clearly intending to kick me by surprise. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Damn! I missed! I even took the long way back!” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It's fine to be frustrated, but don't announce your attack. You're doing the same thing as Ishizaki.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Ugh.. !? I don't want to hear that.. ! But I just instinctively shouted!” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShouting by instinct wasn’t excusable. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eUnless you were certain it would defeat your opponent, announcing your attack would only serve as a disadvantage, especially against an opponent with high odds of winning. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Ishizaki-kun? Have you had a dispute with Ishizaki-kun too?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I just witnessed a similar scenario. I wasn’t involved.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI thought I could deceive her by saying something appropriate, but it seemed to be a rash judgment. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You had a dispute with Ryūen-kun on the rooftop, didn't you? It was that time, right?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI looked at Ibuki. Her frustrated expression had changed to a malicious grin. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Hmph, I don't remember you telling me to keep my mouth shut. Even if you did, I’m free to talk about it.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I don't mind, but this makes a lot of sense now.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThis may have been the reason why she asked me to help her to take revenge on Amasawa. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I pretended not to know in front of others, but this might be a good opportunity. Do you admit that you had a big fight with Ryūen-kun and his group?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I can't deny it in this situation.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I see. But for me, it finally makes sense. I didn't doubt Ibuki-san's story, but it wouldn't be strange if there were exaggerations or mistakes mixed in.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Huh?” She tilted her head and kicked up the dirt towards Horikita's knees. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Don't act like a child.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhile scolding her like a teacher, Horikita continued as if she had been waiting for this opportunity. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Do you have anything else you're keeping from me? Like other people you've had disputes with?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“None.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Really…? I still have a few things I'm suspicious about, like the Yagami-kun incident.” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p149\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-149_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 162\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Yagami? Why is Yagami coming up now? I don't use violence against my kōhais. I'd like to exclude the Hōsen incident though.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Who's Yagami? Was there someone like that?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“. .Fine. We don't have much time, so can we start the special training?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eUnable to explain everything to Ibuki, Horikita cut the conversation short. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe began to distance herself from me. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Basically, the rules are the same as yesterday. The important thing is to understand how the two of you will move, not my movements.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf they had faced each other many times in the past, they would’ve inevitably ingrained each other's patterns in their minds. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe teamwork that was honed here would undoubtedly be higher than in the previous fight with Amasawa. \u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p150\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-150_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 163\" /\u003e\u003c/p\u003e\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003eAfter finishing their morning training, the two were out of breath for a while, but they couldn't sit there forever. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It's getting brighter. Should we head back soon?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You say that so casually. How can your body not be tired after all that action?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Are you a cyborg or something?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI had to correct their misunderstanding. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'm tired too. I just don't show it on my face.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You say that, but you're not even breathing heavily. It's not convincing at all.”  Despite her complaints, Horikita stood up, brushing off the sand. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“We do need to go back soon.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSeeing this, Ibuki also stood up immediately, even giving a high jump. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe seemed to be competing, but her efforts were not reciprocated. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“By the way, Ibuki-san, what are you planning to do today?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What do you mean?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“The exchange meeting game. Is your group planning to fight to the end?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIbuki's group was already at a hopeless two wins and ten losses. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Oh, that? I don't know. I haven't participated even once.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Then your stamp card must be blank.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIbuki snorted and crossed her arms. She probably wanted the reward, but she seemed more likely to skip the troublesome work than gain a mere 1000 points. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'm free, so I might as well go with you, Horikita.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“. .Why would you do that?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I might get to see you lose at the exchange meeting or something.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIbuki's motivation was clear, or rather, she never wavered. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eJust like Kushida, did she really want to see Horikita lose that much? \u003c/i\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Eh? Are you actually going to stick around?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Of course.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Even if you were sure to lose, would you obey the third-years if they tell you to participate?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I won't obey. I'll just have someone else do it.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI wouldn't be surprised if Ibuki pushed that role onto a first-year. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEach group had its own circumstances, so Horikita had no right to dismiss Ibuki’s thoughts. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Whatever. . do as you like, but why not go with Ayanokōji-kun? You might get to see him lose too.” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p151\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-151_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 164\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Didn't he lose twice yesterday?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eMy information was undoubtedly shared within Nagumo’s group. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Speaking of which, Nagumo-senpai was really happy. He sarcastically said it was a disappointing end to a winning streak, losing at cards, of all things. Did you lose another game after that?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe didn't seem to know much. Perhaps Nagumo didn't share my individual results with the entire group, but only with a select few students? \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I was completely beaten by Inogashira in ‘Patchwork.’” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Normally, a comeback like that would never happen. I just wanted to witness where you could be defeated, regardless of the game.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“So you're no different from Ibuki.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAt that retort, she seemed a little disgruntled, but eventually laughed and nodded. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIn other words, she couldn't help but want to see someone she disliked lose. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“He doesn't seem to mind losing, does he? He might even lose on purpose.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I don't know about ‘on purpose,’ but he does seem to regret it. At least, judging by his current state, those two defeats were genuine. Right, Red Panda-kun?” “Are you still going with that joke..” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI wish she wouldn't arbitrarily nickname me ‘Red Panda.’ \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Well, I guess I'll go with Horikita. I'd like to keep an eye on Amasawa too.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I see, that might not be a bad idea. If she's even slightly aware of you, it might put pressure on her for tomorrow.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHorikita had found merit in Ibuki accompanying her. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Can you hurry up and get back? It's getting cold.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNaturally, a body that had warmed up from exercise would cool down if it remained still for too long. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Just don't get in the way.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I can't promise that.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe couldn't help but sense Ibuki's eagerness to interfere. \u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p152\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-152_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 165\" /\u003e\u003c/p\u003e\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003eIn about 15 minutes, the opponents for the third day’s first exchange meeting would be announced. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe game was 'shogi.' \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe participants Kiryūin chose were me, Morishita, Hashimoto, Hiyori, and Tsubaki. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eDespite this, the group was about to face this match one member short. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Where the hell did Morishita go? It's her turn next.. ” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“The call doesn’t seem to be connecting.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHiyori, holding her phone to her ear, informed me that she couldn't reach her.  “When was the last time you saw Morishita?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“The last time I saw her was at breakfast. She left with you, right?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSince we finished eating at the same time, I remembered leaving the dining hall at the same time. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was over 30 minutes ago, but she said she was going for a walk. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eCould she still be on her walk, or did she get lost? \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNormally, she wouldn't lose her way, but if she had forced herself to go into the mountain path, it would be a different story. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eGiven Morishita's personality, it wasn't impossible. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“She was saying that she was absolutely confident in shogi.. ” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“She said she had trained with online matches.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's honestly suspicious.. ” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eKiryūin had chosen her based on that statement and confidence. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe must’ve wanted to redeem her disgrace in archery. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“If Morishita is out, we'll have to find a substitute. We still have a little time, so I'll go look outside. Hashimoto, can you check inside?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Okay. I'll contact you if I find her.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI eagerly set out to search and found Morishita in just a few seconds. She didn't seem lost. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBefore calling out to her, I sent a message to Hashimoto that I had found Morishita. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAfter that, I approached her. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It's almost time for the exchange meeting.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eDespite my call, Morishita didn't respond. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe was just quietly touching a tree. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eShe isn't asleep while standing up, so what’s she doing? \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Morishita?” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p153\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-153_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 166\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Could you please be quiet? I was listening to the voice of the forest.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eMorishita quietly murmured. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“...Huh?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHowever, I couldn't process her words in my head and inadvertently asked her again. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“The voice of the forest? What is that?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Don't you understand? The forest is alive. If you touch a large tree like this, close your eyes, calm your mind, and listen, then you might understand what I'm saying.” \u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p154\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-154_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 167\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN\"\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-154_2.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"Image 168\" /\u003e\u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p155\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-155_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 169\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“...I see?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSo far, I hadn't been able to understand what Morishita was saying at all. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eIt might be a good idea to try doing it. \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI stood next to Morishita and pressed my hand against the tree in the same manner. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThen, I closed my eyes. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAll I had to do was calm my mind and listen. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Do you hear it? The voice of the forest.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“No...” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Then maybe you’re still distracted by something.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eDistractions. Unfortunately, I was emptying my emotions. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eThere was no way such a thing could be mixed in.. \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAs I thought so, I couldn't hear anything at all. There was no way I could. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Breathe in through your nose and out through your mouth.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut Morishita still insisted. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Does that make any sense?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Well, when I had a cold before, I was instructed to breathe in through my nose and out through my mouth at the otolaryngologist's office.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Isn't that how you use a nebulizer…?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIn a way, I was forcibly filled with distractions. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAnyway, I couldn't hear the voice of the forest. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What are you doing?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen I opened my eyes and looked at Morishita, she was pointing her cell phone camera at me. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I was recording Ayanokōji Kiyotaka being fooled by my lies in high definition.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Hey...” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“There's no way you can hear the voice of the forest. You've watched too many dramas and movies.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You're the one who started it. You seemed to be practicing it.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Don't be shy. I'll keep it a secret that you were trying to listen to the voice of the forest.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI wished she wouldn't record me and leave evidence like that. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“But I didn't know that the aspiration machine in the hospital is called a nebulizer. I've learned some useless knowledge. Thank you.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe fact that she called it useless knowledge meant that she wasn't really grateful. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Ayanokōji Kiyotaka, you're an interesting person.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI wonder if I was the only one who thought Morishita was overwhelmingly more interesting. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p156\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-156_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 170\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“By the way, do you need something from me?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I came to look for you because you didn't show up when it was time to gather.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Now that you mention it, I feel like I might’ve been at fault.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eUpon giving a statement that seemed somewhat like an apology, Morishita stepped away from the tree. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe started walking towards the building where Kiryūin was waiting. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Can I ask you something?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI turned my gaze towards Morishita, silently urging her to speak. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What do you think about Hashimoto Masayoshi?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's a pretty loaded question.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I thought I needed to ask. I've been looking for an opportunity several times, but I couldn't find the right time.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Did you think I would come looking for you because you were with the trees?” “I did think you would come looking for me on your own.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe had a strange personality, but she was a strategist. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What do you think of him as a fellow Class A student?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I thought you'd ask. Of course, I think we should unite as a class and exclude him.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe decisively called Hashimoto a nuisance. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What if I were on Hashimoto's side? Wouldn't that be a slip of the tongue?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I thought if I lied, I would only be lied to in return. So I thought being honest was the best choice here.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe understood negotiation well. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf she had hinted at supporting Hashimoto with just some poor excuse and got caught, she wouldn’t be able to earn my trust. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHer judgment was quick and sharp, and she didn't mince her words. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAmong the students I had seen within the second-years, she was quite exceptional in this area. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIndeed, you couldn't understand such a personality unless you met and talked face-to-face. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I intend to respond to your honesty, but frankly, since I’m from another class, I don’t think it’s a problem that has anything to do with me. Whether Sakayanagi tries to exclude Hashimoto in the future, or Hashimoto tries to exclude Sakayanagi, they can do as they please.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“So you're saying you have no intention of siding with Hashimoto Masayoshi?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“None.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI nodded without hesitation, strongly appealing that this was the truth. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p157\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-157_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 171\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe might’ve doubted it, but in fact, I was speaking the truth. It wasn’t a lie. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Of course, as a member of the same group now, I will maintain an appropriate distance and a cooperative relationship.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Is that so? I feel a little relieved.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt might’ve been closer to saying I was anti-Hashimoto rather than aligning with Sakayanagi’s faction. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I just want to ask for reference, but would it be a problem if I sided with Hashimoto?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It would be, yes. I think Sakayanagi Arisu would win nine out of ten times, but if Ayanokōji Kiyotaka were to side with Hashimoto Masayoshi, that might be in jeopardy.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eApparently, Morishita seemed to value my existence more than I had imagined. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Is it strange? That I highly value you, Ayanokōji Kiyotaka.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I didn't feel that way when we first talked.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eOf course, I understood that I was being watched, but not to this extent. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Usually, there’s a difference between expectation and reality. It’s typically disappointing, so I had lowered the hurdle, but looking at the reactions and gazes around me, it doesn't seem to be the case.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt seemed to be more of a gut feeling than something she had directly seen or heard. An evaluation based on her high intelligence and senses. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eA female version of Kōenji—it would be rude to call Morishita that, but in terms of archetype, they might be a little similar. Like subtracting the eccentricity and adding more reasoning.. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eNo, no matter how I expressed it, it wasn’t right to compare her to Kōenji. \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Then, is there a possibility that you will side with Sakayanagi Arisu?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“None. Rather, she's not someone I should interfere with.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eOriginally, Hashimoto was a much weaker opponent for Sakayanagi. It wasn’t a situation where I should lend a hand. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“But...” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“But?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I do think that both Hashimoto and Sakayanagi should fight without holding back. It's best to decide the winner after they both exert all they’re able to. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThat's just my opinion though.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHashimoto was still charging ahead alone without the leisure to observe his surroundings. And since his betrayal dragged Kamuro along with it, Sakayanagi might be hindered from exerting her full capabilities. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf I could eliminate the problems they each had, I would like to do so before the match. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p158\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-158_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 172\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I understand your thoughts well, Ayanokōji Kiyotaka. Thank you.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003ePerhaps having cleared something in her mind, Morishita slightly smiled and bowed her head. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I hope this problem will be resolved as soon as possible. If the infighting continues for half a year, or even a whole year, it will only be a detriment for Class A.”  “That's true.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf that was the problem, Morishita's fears were unfounded. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe problem between Sakayanagi and Hashimoto was already set to end soon.  Morishita started walking away from under the tree. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Well, let's get going. Don't play in the forest forever. You're such a child.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You're the one who was playing.. ” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI was just a victim who got dragged into this. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eTo add, Morishita was as good at shogi as she boasted. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHer skills, honed through daily online matches, were not just for show. \u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p159\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-159_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 173\" /\u003e\u003c/p\u003e\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eAt times like this, I wonder if we’ll face Nagumo’s group in the final 19th\u003c/i\u003e \u003ci class=\"calibre3\"\u003ematch. \u003c/i\u003e That’s what you might think, but things don't always go as planned. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIn the 17th match, with two personal defeats, we clashed with the still-undefeated Nagumo group. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eFollowing a game of table tennis, the upcoming game was 'archery,' making it the second ‘archery’ match in the exchange meeting. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eIn this case, doesn’t it work in our favor that the game isn't solely based on\u003c/i\u003e \u003ci class=\"calibre3\"\u003ecraftsmanship or luck? \u003c/i\u003e Archery, a skill-based activity, provided an interesting opportunity for others to shine. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNagumo was present as their leader, but he didn't speak up. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThis time, Nagumo and I had a personal bet, but few knew about it. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEven the first-year students who had been ordered to gather information might not know the details. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“So, why are you here, Morishita?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Of course, I'm here to do archery. I came to fight.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHer results yesterday were disastrous, but she was still trying to participate without being discouraged? \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eLooking at Kiryūin, she gave a sincere nod. It seemed she had accepted Morishita's participation. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's how it is. You can think of it as being on the winning ship, Ayanokōji Kiyotaka.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Let's hope it's not a sinking ship.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe instructor started speaking again, explaining safety procedures to students who had never handled archery before and for those who had, he repeatedly emphasized the importance of learning the correct shooting form. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eUnlike the original rules, the format was to switch teams after shooting six arrows instead of taking turns one after the other. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHashimoto, who had seen the five opponents, approached and whispered in my ear. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Katsuragi apparently practiced quite a bit yesterday, and he scored a maximum of 36 points. There's a chance you could lose if you face him.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI was impressed by his thorough research as I reflected on myself. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eYesterday, my scores were 2, 2, 4, 6, 6, 9, for a total of 30 points. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI understood his concern, but to put it bluntly, I probably wouldn't lose to Katsuragi. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe problem was elsewhere. Soon, the match-ups were announced. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p160\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-160_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 174\" /\u003e\u003c/p\u003e\n\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eFirst Match: Horikita Suzune vs Yanagi Yasuhisa\u003c/i\u003e \u003ci class=\"calibre3\"\u003eSecond Match: Hirata Yōsuke vs Hashimoto Masayoshi\u003c/i\u003e \u003ci class=\"calibre3\"\u003eThird Match: Amasawa Ichika vs Ayanokōji Kiyotaka\u003c/i\u003e \u003ci class=\"calibre3\"\u003eFourth Match: Kanzaki Ryūji vs Shintoku Tarō \u003c/i\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eFifth Match: Katsuragi Kōhei vs Morishita Ai\u003c/i\u003e In the 16 matches so far, I had always fought as the third player. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Nagumo had skillfully arranged for our opponents to match our fixed positions in the lineup.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Nice to meet you, Senpai.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Your opponent is a first-year girl. You're lucky.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHashimoto, who apparently didn't have information about Amasawa, answered optimistically. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhile everyone watched, Nagumo’s group, who were up first, started aiming at the target all at once. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eYou could tell by their calm demeanor and relaxed expressions. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAmasawa had finished practicing archery yesterday and seemed to have gained solid experience. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWithout hesitation, the smoothly released arrows pierced the yellow nine-point area. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe obtained a score of 9 points, 9 points, 10 points, 9 points, 10 points, 10 \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003epoints, for a total of 57 points. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe accuracy was so high that not only the participating students but also the instructors were surprised. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“No way.. ” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eKatsuragi, who came in second, had scored a substantial 37 points, but it was incomparable. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIn order for us to win, we needed to score 10 points with every shot. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWith everyone still shaken, it was time for Kiryūin’s group, who were on the defensive, to take our turn. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIn the silent gallery, I fired the first arrow before anyone else got a chance. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt pierced the yellow eight-point area. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhile the other students were still fumbling with their preparation, I shifted to fire my second arrow and waited for permission. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThis left us with only one point of leeway, but that didn't matter. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eImmediately upon my first shot, I corrected my trajectory, which was slightly off. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe second arrow pierced the yellow ten-point center. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p161\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-161_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 175\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf this had been a 70-meter distance, it might have been impossible due to factors like wind, but at 20 meters, there were no drawbacks. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAs the instructor collected the arrows, I shot without a moment's delay. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI repeated the same motion like a machine. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe same motion, the same position—I just needed to maximize the repeatability. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWithout worrying about how many points the others had, I just kept shooting the remaining four arrows straight into the center. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe score was 58 to 57. I took the victory into my own hands. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI received a strong applause from Amasawa, with whom I had a close match. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You're amazing, Senpai. It's frustrating, but I lost, didn't I?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“The rules helped me in many ways. The target was close, but if it had been the regular rules where we had to take turns, it wouldn't have been strange for the game to go either way.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eOnce Amasawa had a fixed score of 57, she couldn't make any other moves. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe had no choice but to surrender to my results. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I was trying to put pressure on you, but it didn't work, did it?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI had blocked out all the surrounding noise, so I didn't know. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You hadn’t practiced archery other than yesterday's game, right?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I watched some tutorial videos in the middle of the night.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNot just archery, but everything I experienced at the camp. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It's amazing that you can produce results like that. Nagumo-senpai might get angry.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEven though she lost, Amasawa scored 57 points, so Nagumo probably couldn't blame her. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIbuki, who had been watching from afar, blatantly looked away in boredom. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHorikita won against Yanagi, Amasawa lost but scored an overwhelmingly high score, and then I won against Amasawa. It must not have been interesting at all.  “It wasn't risky at all. You were so consistent..” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAfter watching Amasawa return to report to her group, Hashimoto expressed his admiration. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“But she was strong after all.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe archery match between Nagumo’s group and Kiryūin’s group ended with one loss and four wins. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Indeed. They were worthy opponents, the top contenders, but it was a close game.” Morishita, who had given it her all, showed a satisfied look on her face. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBy the way, the only one who scored a total of six points and suffered a big loss in this game was Morishita. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p162\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-162_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 176\" /\u003e\u003c/p\u003e\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003eAfter that, the round-robin tournament ended, and the 19 total games came to a close. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eKiryūin’s group’s final record was fifteen wins and four losses within the 19 \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003egames. My personal record was seventeen wins and two losses. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eOur final ranking was fourth place. It could be described as a great success. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAnd Nagumo’s group, which had been commended as the top contender from the beginning, came in first with eighteen wins and one loss. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe one defeat was due to a card game that was picked in the final match, and they were unlucky the whole time. They were defeated by a group that had only won three times so far, which was a fitting end to the game. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIn the empty rest area, Nagumo and I were alone. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Allowing me to lose up to two times was what caused your defeat, wasn't it?”  “Indeed, I'd like to say so, but since you were the only one who participated in more than twelve games and had two or fewer losses, it would be absurd to complain about that.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNagumo could get detailed information from each group’s leader at any point, so it wasn’t strange that he seemed to know the individual results from all of the matches. Contrary to his appearance, he was very observant. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Your most skillful player, Amasawa, had a great performance though. She hits her targets quite gracefully.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Don't flatter me. You were purposely going third, weren't you? It was obvious that you were setting it up so that I could be somewhat satisfied when I faced you.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I wish you would sincerely accept the intentions of a kōhai who’s trying to praise you, Senpai.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Then do it better. It sounds like you're just provoking me.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eI see. . Maybe I should’ve used a more natural and skillful way of speaking. \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I managed to win against Amasawa in the individual match, but in terms of the group match, we were completely defeated. Everyone in our group was giving it their all, but it was clear that everyone in your group was playing the game skillfully.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHis group members thoroughly gained experience over the three days, directly leading to their victory. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“When I decide to win, I strive towards it without mercy. It's only natural. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWell, we both got played by the card games, didn't we?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Indeed.” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p163\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-163_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 177\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe showed up at an exchange meeting that he didn’t have to come to, and even used his own money to make our personal match happen. Regardless of his victory or defeat, I couldn't imagine that it was satisfying for Nagumo. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What do you think would’ve happened if you and I had been competing based on group performance from the start?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Knowing the conclusion, I don't think I could’ve won even if I had been in charge.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI honestly admitted defeat. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Is that so? Couldn't you, with your ability to manipulate things behind the scenes, have proceeded in a more solid and reliable manner?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHowever, the man in front of me didn't believe in my defeatist statement any more than I did. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Your group won fifteen times without your interference, so you're doing great, but wasn't there a way to win the other matches? Or were you just not willing to take me seriously?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's irrelevant. Even if I tried to pick up a win by buying my opponent’s defeat, if you were serious, you’d buy it back. You could’ve also tried preventing it in advance. You have control over all the third-years, so you should be good at that kind of thing.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf I tried to influence things, Nagumo would naturally sense it and try to influence things as well. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI couldn't win even if I stood on my head in a battle of financial power. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Even if we were able to buy out three wins, we would’ve been stuck in the 17th game of archery anyway.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It doesn't sound like you're serious about that either.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Well… if I was told to win at all costs, I might’ve manipulated Horikita and Yōsuke to miss the target so that I could win.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThey were students who took it seriously, but depending on the reason, I might’ve been able to get them on my side. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEven if Nagumo had made a contract to ensure that they’d do their best, he couldn't corner them if he was betrayed at that point because there was no guarantee that they’d always hit the target. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I guess so.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“But if you could foresee that, you would’ve switched the assigned members.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was only natural that he’d select students who weren’t affected by my negotiations. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“So what would you do on top of that—no, this is just unnecessary talk that doesn't mean anything anymore.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eFeeling empty, Nagumo ended the conversation himself. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p164\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-164_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 178\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eLooking at reality, this was just an exchange meeting. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was nothing more than experiential learning that we didn’t have to stress about, something that the school also acknowledged. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt wasn’t something to invest a lot of money in or something that required a lot of negotiation. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThis conversation was just a fantasy, something that never came to fruition. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I enjoyed the experiential learning, seriously. If a fair fight couldn't be realized, I thought it would be polite to reveal the truth as it is.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNagumo had always wanted to know my strength. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSo, in some form or another, he must’ve been able to see my true self without any of my clumsiness since his group members, such as Takahashi, were glued to all the games. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe must’ve recorded and checked the matches. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's right. The game of archery was especially impressive. I could tell that your hands are unnecessarily dexterous.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I don't know if you were satisfied with this approach.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Satisfied? There's no way I could be.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNagumo tilted his head in disbelief and laughed. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“But you've become quite talkative and more outspoken.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I was blessed with a good senpai that allowed me to learn a lot.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNagumo took out his phone and flicked the screen with his fingertips. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I have no intention of belittling your victory. I've transferred the money. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eCheck it.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I trust you on that. But is it okay? Those funds could be used to save some of the third-year students.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“How long do you think I've been reigning at the top of Class A? I have several million yen just in my personal pocket. What's the problem with paying from part of that?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAs he put away his phone, Nagumo took a glance outside. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Do you remember what I told you when I came here? About going to college.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Of course.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I was quite serious about inviting you. We can't have flashy battles at university like we do in ANHS, but on the other hand, we can do more things side by side, right?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Maybe.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“If you want, come to the same university. I'll make your boring personality a little better.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'll keep that in mind.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSaying that, Nagumo gently patted my right shoulder as he passed by. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p165\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-165_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 179\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“See you.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Can I ask you to pass on a message for me, Nagumo-senpai, since you’re graduating?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Huh? A message? To Horikita-senpai?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That wouldn't be bad, but no.” \u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p166\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-166_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 180\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN\"\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-166_2.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"Image 181\" /\u003e\u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p167\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-167_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 182\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen Nagumo stopped, I showed him the message for a certain person. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHaving heard it, Nagumo, who still didn't fully believe it, listened to the end without making fun of it. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's a strange message.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I hope you can convey that. After that, the decision is up to the other party.” “I certainly heard it, but is this your farewell gift to me? If you kept quiet, who knows what the outcome would’ve been. There are people who wouldn't be happy about me graduating from Class A as it is.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“At the very least, I think you’ve left enough achievements and qualifications to graduate from Class A.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThat was the reason I entrusted Nagumo with the message. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'll go a step ahead and start the second phase at Horikita-senpai's place.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e‘Feel free to join if you feel like it.’ Those last words contained a message from such a senpai. \u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p168\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-168_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 183\" /\u003e\u003c/p\u003e\n\u003cdiv class=\"calibre4\" id=\"calibre_pb_10\"\u003e\u003c/div\u003e\n\n\u003cstyle\u003e\n    body {\n        color: #e5e5e5 !important;\n        background-color: transparent !important;\n    }\n    .P_Prose_Formatting {\n        font-family: serif; /* Match standard LN feel */\n        font-size: 1.08em;\n        text-align: justify;\n        text-indent: 1.50em; /*
