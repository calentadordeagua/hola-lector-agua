e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T102a2,"])</script><script>self.__next_f.push([1,"\n\u003ch1 id=\"chapter-1\" class=\"chapter-title\"\u003eChapter 1: The Elusive Two-Party Interview\u003c/h1\u003e\n\n\u003cp class=\"P_Prose_Formatting\"\u003eA LITTLE TIME HAD passed since the survival and elimination special exam ended. Due to her close position to Sakayanagi, Kamuro becoming a new dropout surprised the second-year students. However, since Kamuro didn't have any close friends from other classes, the shock didn't last long. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut that wasn't the only reason. They were getting used to the feeling. That implication couldn't be ignored. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThey were becoming increasingly desensitized to the pain of losing a comrade. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAs soon as February came, the date and details of the announced two-person interview were announced. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was said that they’d talk for about 15 minutes per person over the span of five days. The time needed for the interview was secured by making the afternoon classes self-study and using after-school hours, and students were called to a separate room as needed. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eDue to the setting sun, the view outside the classroom window had greatly changed. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eToday was the fifth and final day, the day of my two-person interview. I was assigned to the last slot. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhile waiting in the classroom, I received instructions from the teacher on my phone to come to the career counseling room, so I decided to go immediately. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThere were hardly any students left in the school, and the only ones I passed by were students returning from club activities. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen I arrived in front of the career counseling room, I lightly clenched my hand and used the first joint of my finger to gently knock three times. Naturally, I heard a voice from Chabashira-sensei allowing me to enter. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Excuse me.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen I quietly opened the door, I saw Chabashira-sensei seated at her desk, running her fingertips over her tablet. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You're finally here. Have a seat.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAfter a quick glance, she looked back down at her tablet. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You seem busy.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“As a homeroom teacher, I can't help but be busy during this time. But I feel a little better knowing that the two-person interviews will be over today. It was a good decision to leave the two oddballs for last.” \u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p12\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-12_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 20\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN\"\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-12_2.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"Image 21\" /\u003e\u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p13\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-13_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 22\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAfter answering, she instructed me to sit down, so I sat in the empty seat across the desk. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Two oddballs, you say?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What, are you shocked to be treated on the same level as Kōenji?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'd be lying if I said I didn't think anything of it.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eChabashira-sensei laughed and placed her tablet on the desk. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Do you think Kōenji is more of an oddball? Well, I can understand why you'd think that, but to me, there's not much difference. You're quite the oddball yourself.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt seemed that was how I was perceived from a teacher's perspective. I didn't lack the desire to deny it, but I decided to bear it and let it slide. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Well, I don't have many opportunities to talk with each student. Before we talk about your future plans, let's talk about your school life. If there's anything you want the school to improve, I'd like to hear it.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I don't have anything in particular. As an individual, I'm satisfied.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I see. Do you have any trouble in your relationships with friends, or anything you want to consult about?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I don't.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWithout hesitation, I continued to respond, and Chabashira-sensei showed a slightly bitter smile. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Most students give one or two opinions, or at least show some sign of thinking, even if they don't have any. I don't think you're holding back.. ” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe seemed a little confused by my faster-than-expected response, but there was nothing she could do. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I actually don't have any complaints.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf I had any requests, I probably would’ve conveyed them without hesitation. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Well, if that's the case, it's fine. . but you really don't have anything?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAs a homeroom teacher, her concern came forth, and she kept checking over and over. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“There's nothing. I'm satisfied with my school life and there's no particular trouble.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe seemed unable to fully hide her concern, but for now, she seemed to have decided to take her student's words at face value. She began typing that into her tablet. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Chabashira-sensei, you've changed quite a bit too.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003ePerhaps she felt that it made sense to her, as she showed a bitter smile along with a sigh. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I don't think I've changed. But I might’ve become more honest than before.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe unanimous special exam she experienced as a student herself. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p14\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-14_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 23\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAnd the unanimous special exam she experienced as a teacher. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhat she gained and lost from those two experiences. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAt the beginning of the school year, it was nostalgic to think that I couldn't even imagine the teacher in front of me smiling. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“. . Anyway. If there's anything you're concerned about in your school life, don't hesitate to tell me.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Understood.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAfter I answered, the opening conversation ended shortly thereafter, and we moved on to the main topic of the two-person meeting. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'd like to know whether you're hoping to go on to higher education or get a job. If you've made up your mind, please tell me.” For high school students, that crossroads was a major turning point in life. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThat was why teachers had to show students the right path, so they don't get lost.  However, I probably wouldn't be able to meet Chabashira-sensei's expectations. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I think my family will decide what to do about my future. I don't think there's anything to discuss here.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Your family will decide? In other words, you'll follow your father's plan?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe school data showed that my mother wasn’t present. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Yes.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I see. It's a rare case, but it's not like there are no students who prioritize their parents' wishes. But usually, they’d inform us in advance whether they wanted to go on to higher education or get a job. This school’s always open to communication from parents, and there are many cases where parents actually convey their thoughts to their children. But so far, we haven't received any consultation about going on to higher education or getting a job from your family.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIndeed, it would be strange if I had no set plans, even if I followed my parents. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut for me, who won't go on to higher education or get a job, it would be unnecessary to inform them. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHowever, it would be impossible for Chabashira-sensei to understand that scenario. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I think it's fine.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You say it's fine. . but if you want to go on to higher education, you should’ve already started planning. The effort to take exams at a level that matches the level of the university you want to go to.. ” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eChabashira-sensei started talking as if she was exasperated, but she stopped mid-sentence. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThen, she straightened her posture and looked me in the eye. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p15\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-15_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 24\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I don't know much about your past. I think it was wrong of me to pretend to know about it and try to leverage that. But now, as a homeroom teacher, I want to fully understand the abilities of the students I'm in charge of. That's my duty.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I understand. I have no intention of interfering with that.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI can't see the screen of the tablet well because of reflections, but if she leaves answers blank, Chabashira-sensei will be blamed when she submits it to the school. And it was probably up to the school, but whether a student's future plans came true or not, whether they could go on to a high-level university or job, that can sometimes be linked to a teacher's grades and evaluations. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“So tell me, if your parents want you to go on to higher education, can I assume that you have the ability to do so?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNo matter what I answered, the future wouldn't change. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut it was cruel to unnecessarily lower her evaluation because of a foreign existence like me. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf anything, it was probably best to give Chabashira-sensei a useful answer. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I think I can pass any university.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“. .Really? Normally, I would caution against such a ridiculous statement, but since it's you saying it, it must be true. I can conclude that much.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eChabashira-sensei, who relented without any objection, continued. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It seems you've received quite an elite education. If you’re smart enough to claim that without hesitating, I wish you would contribute more to the class on a regular basis..  but let's leave that aside for now.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHaving finished typing what we had just talked about on her tablet, Chabashira-sensei looked up. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I understand the current situation. But Ayanokōji, what's your opinion? I understand that you're considering your parent’s wishes, but don't you have a future vision you want to aim for?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I don't. Even if I did, unfortunately, I don't have the right to decide.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAs far as that goes, it was a pointless discussion to spend time on. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'm sorry. That might have been an unpleasant question.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I don't mind. In fact, I just don't have any dreams or hopes at the moment. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf I find something I want to aim for in the future, I'll ask about it.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I see. So for now, you'll follow your parent’s wishes. Then the three-person meeting will take place during the spring break after the third term. Is it okay to officially decide on the plan then?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's right.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHowever, a three-person meeting involving a parent probably wouldn't happen. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p16\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-16_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 25\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAt best, that man's messenger will come and have a meaningless conversation. It was obvious. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThere was no way he would bring up anything related to the White Room. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Your three-person meeting is currently scheduled for April 1st. You'll see your father for the first time in a while. If necessary, we can also take more time. I want you to think of it as a good opportunity to talk freely about your future.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe spoke as if she didn’t have a single doubt that my father would come. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eNo, is that actually the case? \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“. .Can I ask you something?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI thought it was unlikely, but I decided to ask because I thought it was worth checking. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Hmm?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Is my father actually coming? Not someone else? Not a proxy?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eUnable to grasp my intention, Chabashira-sensei nodded while looking puzzled. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Yes, that's what I heard.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I thought he would’ve immediately rejected the idea of a three-person meeting?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhile looking puzzled, Chabashira-sensei soon showed some understanding. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Indeed, when I first informed him of the three-person meeting by email, he replied that he intended to send a proxy due to his busy schedule. In that sense, your statement is correct. However, when I informed him of the specific date for the three-person meeting on that premise, the situation seemed to have changed.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhile reconfirming on her tablet just in case, she continued. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“He called me and I received a reply that your father would visit directly. I heard it straight from him; there's no mistaking it.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“. .That's unexpected.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eWhat kind of twist is this? That man wouldn't retract his previous response\u003c/i\u003e \u003ci class=\"calibre3\"\u003ethat easily. At least that was the case with us White Room students. Despite\u003c/i\u003e \u003ci class=\"calibre3\"\u003edeclaring that he wouldn't meet me at this school, why would he bother attending a\u003c/i\u003e \u003ci class=\"calibre3\"\u003ethree-person meeting? \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eFrom the fact that he initially refused, it should’ve developed the way I imagined it. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eHowever, he changed his mind and expressed his intention to come himself? \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was impossible not to think there was a catch. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You said you got a call from my father, what exactly did you talk about?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What? We didn't have any deep conversations. He had appointed a proxy, but he said he could attend the three-person meeting because he had time. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHowever, he said he wanted to be informed if there were any changes to the RoyalMTLs \u003c/p\u003e\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p17\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-17_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 26\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eschedule he had been given, even a little. That’s not unusual for busy parents, is it?”  “That's right.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNormally, he wouldn't have had time to attend a three-person meeting, but he looked at the set schedule and decided that he could make it, so he contacted the school. It was easy to understand and there was nothing strange about it. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“But..  oh no, that isn’t something I can just tell you.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eChabashira-sensei started to say something but then stopped. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“But what?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI was looking for a hint, so I asked for the rest of her sentence. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It's not a big deal. But I thought it was a bit strange. It's natural to want to be contacted if the schedule changes, but that's usually limited to changes in the date and time of your child's meeting. However, your father said he wanted to be contacted if there was even a slight change in the schedule of the entire class that I was given.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Even if, for example, the meeting of an unrelated classmate on a different day is switched?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's right. I thought he was being a bit paranoid, but there's no inconvenience in just informing him.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSo Chabashira-sensei agreed without thinking too deeply. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHowever, if that man had a reason to participate in the three-person meeting, there was a motive. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Could you show me the schedule for the three-party meeting, if possible?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“The schedule? Well, I suppose there's no harm in showing it.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eChabashira-sensei operated her tablet and turned the screen towards me. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“This is the schedule for the three-party meetings of the entire class. It's basically structured the same way as the two-party meetings. That is, you’re scheduled for the last slot.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eMarch 26th, 28th, 30th, and April 1st. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThat was the schedule for the three-party meetings that would take place over the span of four days. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAs Chabashira-sensei had said, my name was listed at the end of the day on the 1st, at 5 PM. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“There's nothing special to see. Are you done now?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Yes, thank you.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eChabashira-sensei turned the screen of the tablet she had been showing me back to herself. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I won't tell you not to be nervous about your relationship with your parent. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI don't know the details, but there's no parent who doesn't love their child. He must’ve felt like he couldn’t leave you alone.” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p18\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-18_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 27\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That might be true.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI answered as such, as there was no point in discussing her thoughts and that man here. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut in reality, I couldn't imagine him showing up for the three-party meeting for such a reason. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eDid he want to expel me with his own hands, unable to leave it to others? \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEven so, he should’ve already realized from the previous time that it was pointless to confront me directly. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI still didn't know for what purpose he agreed to attend the three-party meeting. \u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p19\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-19_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 28\" /\u003e\u003c/p\u003e\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003eSo, I had to prepare in about an hour. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eFirst, I had to go back to my room and wash my hands. As I was getting off the elevator while making detailed plans in my head.. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Hey, you're late coming home, Ayanokōji.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eA rare figure was waiting, leaning against the door of my room. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was Hashimoto Masayoshi, a student from Sakayanagi's class. He tapped his knee lightly, as if he had been waiting for a long time. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Seeing as you came up alone, it doesn't seem like you were on a date.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe asked, confirming that the closing elevator was empty. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Today was the day for the two-party meeting, so I was late.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Oh, I see. . I hadn't considered that possibility. I have something to talk to you about. Do you have time?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe brought up the reason he had been waiting while reflecting on his own oversight. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It doesn't seem like a conversation suited for standing.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You're right. It would help me if you could consider that.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThen I had no choice but to consider his intentions. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“If you don't mind my room, you can come in.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt seemed like it would cut into my dinner preparation time, but I could set aside a little bit of time. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI couldn't find any other reason to refuse, so I decided to invite Hashimoto in.  “Sorry about this.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I can listen to what you say, but don't expect too much hospitality.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's more than enough for me right now.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe laughed self-deprecatingly and lightly tapped my back as I inserted the key into the keyhole. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen I opened the door, I glanced at the emergency stairs for a moment. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI felt a presence watching me, but it was difficult to determine whether Hashimoto was aware of it or not. For now, I entered without worrying about it. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Excuse me. . oh, a boyfriend's room is indeed different.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAs soon as he stepped into the room, he whistled at the traces of Kei scattered around. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Can I sit on the bed? Or is that too much?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Too much? You can do whatever you want.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWith that, Hashimoto wavered but slowly sat down on the bed. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe seemed to hesitate to sit on someone else's bed. He was considerate. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p20\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-20_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 29\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“So? What's the story?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It's a pretty heavy matter. I'm struggling with what to do with myself. I want you to listen to my concerns.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe seemed to get straight to the point without any detours, but I felt a snag early on. However, it would be rude to interrupt him right from the start, so I decided to let him continue. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What do you mean by 'what to do with myself’?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Haven't you heard already? What caused Kamuro-chan to drop out?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I've heard some rumors. Someone leaked information to Ryūen during the special exam. As a result, Class A ended up at the bottom.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Exactly. If the information leaks, there's no chance of winning.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAs Hashimoto said, the decisive factor in the defeat was the betrayal caused by the information leak. If there hadn't been a leaker, there was a high possibility that Class A could have avoided being at the bottom. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I was the first one to be suspected. Now, every day, I'm being looked at with suspicion by various people in the class.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIn fact, it was not limited to the class. The act of betraying one's own class was a shock and a threat. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“To be honest, I've heard such rumors too. I sympathize with the current situation.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eCurrently, the most circulated rumor was that Hashimoto betrayed Class A. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe had supposedly contacted Ryūen and made a secret agreement. Considering the suspicious movements he’d shown in the past, it was a natural conclusion. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHowever, I hadn't heard anything with concrete evidence. At present, by a process of elimination, it was being suggested that it might have been Hashimoto. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Do I have no choice but to accept this? Is it because of my everyday behavior?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“If you don't want to accept it, you can take action to prove your innocence.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I wonder. They say ‘innocent until proven guilty,’ but I think that’s possible in the real world. If you raise your voice in a situation where you are suspected, the suspicion will only deepen. Those who have decided in their heads that you are the culprit without any basis will even doubt your cries of grief.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThis was exactly what was referred to as the echo chamber phenomenon. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eStudents with similar opinions gather and mistakenly think they’re correct. This tendency was particularly strong in this isolated school. Unfortunately, unless Hashimoto himself could produce decisive evidence that he wasn’t the culprit, there was nothing he could do about that phenomenon. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You might be right. I chose to remain silent.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“See?” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p21\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-21_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 30\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eUnless you have clear evidence to the contrary, opening your mouth won't change the situation. Rather, a careless remark might only arouse more suspicion. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It makes me want to cry.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEven as he pretended to press his eyes, I spoke up. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Isn't that enough of an opening? Why did you betray Sakayanagi?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAt these words, Hashimoto's movements stopped abruptly, and his fingers slowly moved away from his eyes. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Hey, let me build it up a little. I feel like an idiot for putting on the poor-me act.”  “I just thought it was a waste of time. It's already late, and I'd like to prepare dinner as soon as possible.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI told him this, keeping to myself that Kei would be coming to my room later tonight. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What, do you have a date with your girlfriend afterward?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Something like that.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What do you mean 'something like that'? Our friendship should be thicker than a woman's.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Sorry, but it's impossible to change my schedule around. Besides, I don't remember us having a deep friendship either.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen I told him the truth, Hashimoto put both hands on the bed and took a breath. “Well, if you understand the situation calmly, that's fine. It's more convenient for me now.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAfter a pause, he immediately touched on the crux of the matter. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Why do you think I betrayed Sakayanagi?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBefore I could hear the answer, Hashimoto asked me to think about it myself. “I don't know that much. The only thing I can think of is that you received a large amount of private points in return.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI voiced a scenario that outsiders would imagine. However, I was skeptical whether it was worth it. Certainly, Sakayanagi was hurt, but only once. And the class only lost 100 class points. Although Kamuro, a close aide of hers, dropped out, it was only a by-product of the ordeal, and the likelihood of it being included in the negotiations and rewards was low. The price to pay for betraying the class is expensive; 500,000 or 1 million, or even more, would be too cheap. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What I want to hear isn't an answer anyone could come up with, but your opinion.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHashimoto seemed to be well aware that I wasn't answering seriously. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'm sorry, but I'm not in the mood to express my opinion.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Huh? Why? Because there's no connection between you and me?” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p22\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-22_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 31\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's not it. It's because you're not talking seriously.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Huh? I'm seriously asking for advice. I'm desperately looking for a way out.”  “If you're really saying that, it's too late.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Too late. .” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Someone who can't decide how to conduct themselves and is lost from the start won't betray the class.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eDrawing a bow against Sakayanagi was tantamount to aiming for the general's head. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt wasn’t something you decided on the spur of the moment, but after considering all the subsequent responses. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I see. Indeed, asking for advice on how to conduct myself is foolish.. ” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThis was the snag I felt as soon as the discussion began. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHashimoto apologized repeatedly for his mistake and then started the conversation over. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“The reason I betrayed Sakayanagi was because of your existence, Ayanokōji. The trigger was my attempt to persuade Sakayanagi to pull you into Class A at all costs.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Persuade? It's hardly persuasive. It's just self-harm involving the class.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Interesting expression. Well, it's mostly correct.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHashimoto answered with a laugh, but I couldn't tell if he was relaxed or not. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI sensed that he was deliberately hiding his feelings to hide his vulnerabilities. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe probably didn't want to show any weakness to me. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEven though he was telling me something that contained the truth, I had a feeling that he was still hiding many secrets inside. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“The questions just keep piling up. To begin with, betraying Sakayanagi by weighing me in the equation? Don't you think it's a story that would make other students scratch their heads in disbelief?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Those who scratch their heads are incompetent. There's no need for modesty in this situation. I've been working harder than anyone else to gather information and I'm convinced that you're the best. I can explain from scratch if necessary, but it’d be a waste of your precious time.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Even if I deny it, you won't be convinced, will you?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I won't. You have the ability to turn the class ranking upside down by yourself. That's why I threatened Sakayanagi that if she doesn't secure you, I'll betray her again. If she had listened to me, you would’ve come to Class A and it would’ve been solid. The winning formula would’ve been complete.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHashimoto clenched his fist tightly, but his plan was too reckless and unrealistic. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p23\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-23_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 32\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I hate to say it, but it's too much of a pipe dream. Even if I had the ability you imagine, it would be meaningless if I made Sakayanagi my enemy. Besides, when I was invited before, I remembered saying that I would consider it positively, but I don't remember saying that I would officially go.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe acted unilaterally without securing a commitment, clearly jumping the gun.  “So, even if I manage to secure a transfer, you still won't come to Class A?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I can only say that's the case right now. I'm not interested in confronting Sakayanagi.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen I conveyed what I had naturally thought, Hashimoto seemed shocked, but muttered, 'I guess that's the way it is.' \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“The best answer would’ve been 'yes', but I guess it's not that easy.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe fact that he answered calmly suggested that he had fully considered the possibility that I wouldn’t choose Class A. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eIf so, what was the purpose of this betrayal? \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was difficult to deduce clearly from the information I currently had. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Hey, do I look like the kind of guy who would betray the class? Sakayanagi was the first to suspect me.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's your character.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Defend me a little. . Just kidding. Even though I initiated it, I received a direct declaration of war. Normally, there's not a chance in a million that I could win.”  Considering that Sakayanagi must have stronger feelings towards the traitor who caused her to regretfully abandon Kamuro than Hashimoto thinks, it was understandable. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“But, was this betrayal all my fault? I thought I was suggesting the best way to graduate from Class A. I just took a heavy-handed approach because she didn't listen. Where's the fault?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You're defiant. But your intuition isn't wrong. There's certainly no guarantee that you'll be able to stay in Class A in the future if you just continue to follow Sakayanagi's orders with their current power.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe difference in class points was gradually narrowing in reality. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I see.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“But you've also made a big mistake.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Is it making Sakayanagi my enemy?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Correct, but wrong. It's not that making Sakayanagi an enemy is bad. The mistake was that you acted without any assurance of winning, even if you made Sakayanagi an enemy. If the chances of winning were slim, you should’ve taken a different approach.” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p24\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-24_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 33\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I thought about it in my own way. But I concluded that this was the only way.” “The answer you calculated and derived within you—I can't say for sure that it's the right answer.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHashimoto didn't deny and imagined what would come next. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“If I can't undo it, do you think I'll be devoured by Sakayanagi as I am?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's likely. If you don't want that, the only remaining option is to beat her.”  “Do you think I can fight and win against Sakayanagi?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Just to confirm, by defeating Sakayanagi, you mean getting her expelled, right?” Hashimoto nodded. In other words, there was no path to reconciliation. If so, there was only one answer. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“No matter how much I favor myself, the odds are too bad even with my help. I can't say anything because it depends on the special exams in the future, but in a sense, Sakayanagi should want to expel you more than Ryūen now. To put it bluntly, even if you retaliate and force Sakayanagi to drop out, you might be taken along with her in a mutual kill.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf that happened, Ryūen could avoid accepting the troublesome existence of the traitor Hashimoto, and at the same time, he could bury a strong enemy, which would be killing two birds with one stone for Ryūen. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNo, even if you were prepared for a mutual kill, it was difficult to defeat Sakayanagi. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThere was an overwhelming difference in ability between Sakayanagi and Hashimoto at this point. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe opponent was always one or two steps ahead of Hashimoto and even had a Protection Point. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIn other words, you’d have to stab her twice to defeat her. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAnd now, Hashimoto was only thinking about fighting Sakayanagi. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut that was a naive thought. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI understood the feeling of wanting to say that the problem would be solved all at once when the game was settled. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut even if he defeated Sakayanagi, it'd be just the beginning. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eRebuilding a collapsing class. Those who’d come for revenge. Problems would overflow one after another. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe betrayed the class knowing that he’d be at a disadvantage against Sakayanagi without any assurance that I would become an ally. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhat else could I call this other than strange behavior? \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Something that stood out in our conversation is that you don’t trust people.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe didn’t reveal everything, and he judged and acted on his own. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p25\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-25_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 34\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt would be fine if he were successful, but if he were about to fail, he wouldn’t have anyone to rely on. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I won't deny it. But Ryūen and Sakayanagi are the same, right? Other people are useless.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“They have the power to fight on their own without personally acting themselves.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's where the situation comes back.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHashimoto wasn’t one without the power to foresee the future. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe felt that he’d eventually lose if I were the enemy. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThat wasn’t bad. But, until now and from now on, he would continue to think and make conclusions all on his own. The disadvantage of being unable to rely on others was what landed him in the predicament. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf Hashimoto had multiple people he could trust from the bottom of his heart, this current situation might’ve been a little better. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I don't want you to think that I rebelled against Sakayanagi without any chance of winning. I'm not that foolish.” Hashimoto muttered that he had his own chances of winning. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI tried to listen to him continue, but he just looked at me and didn't attempt to elaborate. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Before I let you hear what's next, there's something I really want to confirm with you.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAnd so, Hashimoto threw a question at me. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eWhy did he betray Sakayanagi at that time and decide to take a big gamble? \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eA question to start the story. \u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p26\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-26_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 35\" /\u003e\u003c/p\u003e\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e“Sorry. Karuizawa is coming after this, right? I've talked too long.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It can't be helped. It wasn't a topic that could be cut off in the middle.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Can I interpret this as a meaningful time?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen I nodded affirmatively, Hashimoto also nodded back in response. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHis face was different from before, which showed ups and downs, and was somewhat clear. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt seemed like he’d vented something he’d been holding back. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI decided to go out while seeing off Hashimoto. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'll buy dinner at the convenience store today.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen I told Hashimoto, who was about to press the elevator call button, he stopped his finger before touching the button for the upper floor and immediately pressed the button for the lower floor. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Can I join you then? Of course, no more heavy talk, okay?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNaturally, Hashimoto also looked quite tired. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eFeeling the need for a quick meal, I decided to head to the convenience store with him. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWe got into the elevator and descended to the lobby. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eJust then, we ran into Hashimoto's classmate Morishita, who seemed to have just returned home. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What a coincidence, Ayanokōji Kiyotaka.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Indeed, a coincidence.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was a moment when I could feel the change in my human relationship. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI had crossed paths with Morishita many times during my two years of school life. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI used to not care about crossing paths with her, but now when we meet, we both naturally stop and start talking. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“And the traitor, Hashimoto Masayoshi, is here too.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Hey, hey, don't start with that. Give me a break.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Sorry. I haven't found definitive evidence yet. I will correct myself.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEven if she corrected her statement, the fact that he was thought of in that way couldn't be changed. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe was indeed a traitor, but Hashimoto must’ve thought it was good that I was there with him. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Ayanokōji Kiyotaka, you don't seem surprised.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It's been a rumor for a while now. Besides, unlike the people in Class A, I'm not that interested in the truth.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I see. I thought you might’ve been consulted by the traitor.” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p27\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-27_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 36\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe bluntly stated what she was thinking and speculating, relentlessly pushing me. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHashimoto intervened as I was admiring her audacity. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Stop it. It's okay to suspect me of being a traitor, but it's better not to involve outsiders without instructions from the princess.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe stopped Morishita with a confident tone that didn't seem like one belonging to a traitor. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I see. But it's getting late. Where are you going now?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eInstead of forcing Hashimoto to engage further, Morishita directed her question at me. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I’m going to the convenience store and buy dinner.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Me too.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I didn't ask you, Hashimoto Masayoshi, but I see. However, I thought you were a person who usually cooks for himself, Ayanokōji Kiyotaka—did you get caught up in a conversation with someone and lose track of time?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eI had been cooking for myself a lot lately, but where’d she get this\u003c/i\u003e \u003ci class=\"calibre3\"\u003einformation? \u003c/i\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eMorishita's suspicions seemed to be growing stronger, and she very deliberately voiced her doubts. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I just happened to be in the elevator with Ayanokōji. It seems he was late because of a two-person meeting.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003ePerhaps thinking it would be troublesome to be asked about it, Hashimoto casually answered. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHowever, Morishita seemed to become even more suspicious. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's strange. Ayanokōji Kiyotaka's two-person meeting should’ve ended a long time ago. It seems you two have been talking a lot today.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhether she had been investigating Horikita’s class’s internal affairs, she had a good grasp of things that even Hashimoto didn't know. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe attempt to casually brush it off seemed to have backfired. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“No, like I said, I have nothing to do with it. I have no idea what Ayanokōji was doing.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“But you've been together since you got on the elevator on the fourth floor, haven't you?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAs if to block any escape routes, she said this, while glancing at the elevator monitor. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Damn, were we being watched.. ?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It might not matter to others, but it seems you were unlucky with who saw you today.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHashimoto showed a bitter smile at the defeated situation. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut he didn't seem flustered or panicked by this encounter. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p28\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-28_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 37\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Is this how you act as a traitor?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Huh? What do you mean, traitor?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It means a backstabber.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen she explained the meaning, Hashimoto exaggeratedly dropped his shoulders as if he was disappointed. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Give me a break, Morishita. This is a completely different matter.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What do you mean by ‘different matter’?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I can't tell you that. There are things that only guys can talk about, right?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSensing that he wanted backup, I decided to go along with it. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“If it's a matter of gender, I can't pursue it any further. That’s an easy way to escape confrontation.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“No matter what I say, it's no good.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHashimoto shrugged, giving up. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eJust as we were talking about a moment ago, the more he opened his mouth, the more suspicion he aroused. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Well, it's fine. Can I accompany you to the convenience store too?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's fine, but do you have any particular reason?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Yes, I'm sure there will be one if I go. I should be able to think of something.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe was revealing that she had no specific motive, but I had no right to refuse her. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEven if I refused, she would just follow us anyway. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Alright. Well, since it's come to this, let's go together as a group of three.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Then I'll follow you.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eMorishita, who had turned around, started walking ahead. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Why is she taking the lead..  She's as incomprehensible as ever. Sorry about this, Ayanokōji.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It's fine. It's not a big deal.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSuddenly, I wondered how Morishita was perceived in Class A. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHer academic excellence must be well known from the OAA. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut honestly, I didn't know anything else. It might be a good idea to ask. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What kind of student is Morishita in class?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“She’s just as you see her. She's smart but eccentric, and she always acts alone.” “Does she have any close friends?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Not that I can recall.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eJudging that the statement was made by someone always busy gathering information, it seemed highly credible. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWatching Morishita's back, Hashimoto touched his chin with his index finger and thumb, looking puzzled. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p29\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-29_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 38\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's why it's so unusual. She's not usually the type to start a conversation like this.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAfter muttering that, he gave me a sidelong glance, so I took the initiative. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Isn't she just keeping an eye on the traitor?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Well..  that's not impossible. . but you're not holding back either, are you?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“If I need to be considerate, I'll be considerate.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Damn. What I'm curious about is that, to my understanding, Morishita doesn't seem to be an extreme follower of Sakayanagi. She's neither close nor distant to her. But she's not the type to take the initiative and solve problems on her own. In other words, I can't see a reason for her to probe.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eMorishita isn't the type to take initiative? Is that really the case? \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAlthough our interactions had been limited, my impression was the opposite. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe seemed more like a person who actively worked alone to solve problems. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eOf course, it was possible that Morishita changed her mind after witnessing Sakayanagi’s defeat, who had been steadily defending their position until now. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHowever, it was hard to believe that Hashimoto was completely unaware of that detail. He spoke without showing any signs of deception, mixing truth and lies in similar proportions. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEven the current situation, the three of us walking together, might not be a mere coincidence. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHashimoto might’ve wanted to make Sakayanagi indirectly realize that he’d contacted me. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt might be safe to assume that he had such a plan. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf he didn't want to be found out, he wouldn't have waited in front of my room where he could’ve been noticed. We both knew each other's contact information, so we could discretely communicate as much as we wanted. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHashimoto, the traitor, had a purpose in making Sakayanagi aware of the fact that he contacted me, either directly or indirectly. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eOf course, only Hashimoto knew the truth, but there were other things that I could deduce. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe truth and lies that Hashimoto revealed in my room. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAll his actions were tied to his own benefit. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe wanted to be the only one to benefit. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe wanted to be the only one to survive. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe wanted to be the only one to win. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf a pacifist knew of this, Hashimoto would probably be despised as an evil entity. The more I knew about Hashimoto, the more I sympathized and agreed with him. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p30\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-30_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 39\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBecause he lived according to his nature. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNormally, to carry out such evil, one needed undeniable power. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut Hashimoto didn't have that power. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSo, like a chameleon, he learned to change colors to match his environment. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eTrying to blend into the environment to survive. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThat was exactly what he was doing at that moment and what he had been doing up until then. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWe left the lobby and the three of us walked to the convenience store. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThen we went inside, picked up a basket, and I contacted Kei on my phone. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhile listening to what she wanted, I decided on dinner for myself as well. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe convenience store's microwavable side dishes were quite delicious. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhile shopping, I ran into someone who came in after us in the beverage section. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Ah... H-hello. .” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe one who greeted me was Yamamura Miki, a girl from the same class as Hashimoto. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I didn't expect to see you here.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Yes, I suppose so.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eYamamura agreed, looking somewhat uncomfortable at my response. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt seemed that it was indeed Yamamura who had been watching Hashimoto on the emergency stairs. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEven after leaving the dormitory, I’d hardly noticed her presence and didn't know who she was. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThat was why I thought it might be Yamamura, and it seemed I was right. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI didn't know whether she was acting alone or if Sakayanagi was hiding behind her, but considering that she’d been on standby before I returned to my room by elevator, it was more likely that she’d been watching Hashimoto. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eMoreover, I couldn't find any particular reason why Yamamura would be secretly watching me. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Oh, it's Yamamura. What a coincidence.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHashimoto, who’d noticed us talking, approached us with a curry-flavored cup noodle in his hand. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Good evening..  Hashimoto-kun.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“This is the first time I've seen you use a convenience store.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI wondered if this way of speaking was just a habit or if he’d sensed something. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhile voicing information that he didn't know the credibility to, he observed Yamamura's reaction. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Um, I. . I use the convenience store quite a bit..  about once or twice a week..  but I don't stand out..  I'm sorry.” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p31\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-31_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 40\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Oh, no, I'm sorry if I did something wrong. .” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHashimoto seemed to have tried to probe her but ended up apologizing in a hurry since he pointed out Yamamura's lack of presence. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It's rare to see Yamamura Miki talking to a boy.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Are you really one to say that, Morishita?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'm just a little curious about Hashimoto Masayoshi. Is it love?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Don't deliberately throw me under the bus like that..  Well, I guess Yamamura is suspicious of me too.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eIs that so? \u003c/i\u003e In response to such a probing gaze, Yamamura looked down and averted her eyes. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe heavy silence didn't match the convenience store's atmosphere or the upbeat music, creating a discordant sound. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe one who broke the silence was not Hashimoto nor Yamamura, but Morishita. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Let's shop together since we're all here. You don't mind, do you?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Eh, um, yes..  if that’s okay with you..  I mean.. ” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHer not reading the room from the get-go seemed to have paid off here. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWithout waiting for her answer, Yamamura ended up shopping with us. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWell, after all, a convenience store was a place to shop. It wasn’t a strange thing for us to do. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI didn't often see Yamamura talking to other students, but she even seemed to struggle talking to her own classmates. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe was being led around by Morishita and forced to pick up items she recommended. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAnd without being able to refuse any of them, she put three or four items in her basket. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You shouldn't push her around too much.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Why not? Yamamura Miki is happily accepting my recommendations.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I don't think she's happy at all. She looks troubled to me.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Is that so?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Um, uh...” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNot knowing how to respond to either side, Yamamura was at a loss for words. “Am I forcing you to buy anything?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“No, that's not.. ” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eYamamura backed off at the mere pressure of words, and any words of defiance were swallowed up. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Do you dislike this? Well, let me give you my next recommendation. It's a secret from everyone else.” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p32\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-32_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 41\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEven though she wasn't a convenience store employee, Morishita was trying to get her to buy the next product. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe tried to take out a juice box from one of the reach-in coolers. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Sorry to interrupt your friendly chat, but could you move a bit?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhile they were talking amongst each other, a new customer stopped by the beverage corner. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eMorishita seemed to have noticed her, but Yamamura, who was nearby, seemed to have overlooked her, and their shoulders slightly collided. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Oh, I'm sorry.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe convenience store wasn’t very spacious, so if several people gathered, it could get in the way of other customers when they were choosing items. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt wasn't a big shock, but Yamamura apologized and made way. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“No, I'm the one who didn’t notice. I'm sorry.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe gently fluttered her long silver hair and took out a bottle of green tea. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I like this brand's tea. You can feel the umami and aroma as if it were brewed in a teapot, right Ayanokōji?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe one who turned her gaze to me, speaking like a beverage brand's promoter, was Kiryūin Fūka from class 3-B. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I've never had that brand before, so I can't answer.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's a shame. You should try it if you have a chance.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Are you going home now, Kiryūin-senpai?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Yes. It's getting a bit late. I thought I'd just stop by the convenience store today. Is this female student… your new girlfriend?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“No, she's not.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Ah, um... I'm Yamamura...” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'm Morishita Ai.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Yamamura and Morishita, huh? Are you in the same class as Ayanokōji?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“No, they are in Class A.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Oh? It's good to have a wide circle. You should cherish your friends.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Are you one to say that, Kiryūin-senpai?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThat was unexpected advice from someone who stood out among the third-year students for being aloof. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Nice to meet you, Kiryūin-senpai. I'm Hashimoto, also from Class A.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHashimoto greeted her, interrupting Kiryūin who was looking at Yamamura, and extended his hand. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eKiryūin nodded, lightly brushing off his hand. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'll remember all three of you.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAfter a brief exchange, Kiryūin finished paying first and left the convenience store. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p33\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-33_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 42\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was a bit surprising that Kiryūin, who didn't seem to be interested in others, said she would remember the three of them, even if it was just a formality. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt might not have meant much. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Are you close with Kiryūin-senpai? She's famous for not hanging out with anyone.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I wouldn't say we're close.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHashimoto continued to watch Kiryūin's back as she headed towards the dormitory for a while. \u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p34\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-34_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 43\" /\u003e\u003c/p\u003e\n\u003cdiv class=\"calibre4\" id=\"calibre_pb_2\"\u003e\u003c/div\u003e\n\n\u003cstyle\u003e\n    body {\n        color: #e5e5e5 !important;\n        background-color: transparent !important;\n    }\n    .P_Prose_Formatting {\n        font-family: serif; /* Match standard LN feel */\n        font-size: 1.08em;\n        text-align: justify;\n        text-indent: 1.50em; /* Standard indent */\n        line-height: 1.4;\n        margin-top: 0.42em;\n        margin-bottom: 0.42em;\n        color: inherit; /* Essential: Inherit theme color (white in dark mode) */\n    }\n    .P_TEXTBODY_CENTERALIGN {\n        font-size: 1.00em;\n        text-align: center;\n        text-indent: 0;\n        margin-top: 1em;\n        margin-bottom: 1em;\n        display: block;\n    }\n    .chapter-title {\n        font-family: serif;\n        font-weight: bold;\n        font-size: 1.8em;\n        text-align: center;\n        margin-top: 1.5em;\n        margin-bottom: 1.5em;\n        page-break-before: always;\n        color: inherit;\n    }\n    a { color: inherit; text-decoration: none; }\n    img { \n        max-width: 100%; \n        height: auto; \n        display: block; \n        margin: 0 auto;\n    }\n\u003c/style\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 1: The Elusive Two-Party Interview\",\"volumeId\":\"y2v11\",\"chapterIndex\":3,\"prevChapter\":{\"volumeId\":\"y2v11\",\"chapter\":2,\"title\":\"Prologue: Miki Yamamura’s Monologue\"},\"nextChapter\":{\"volumeId\":\"y2v11\",\"chapter\":4,\"title\":\"Chapter 2: The Exchange Training Camp\"},\"toc\":[{\"label\":\"Illustrations\",\"href\":\"index_split_000.html#illustrations\",\"index\":1},{\"label\":\"Prologue: Miki Yamamura’s Monologue\",\"href\":\"index_split_000.html#prologue\",\"index\":2},{\"label\":\"Chapter 1: The Elusive Two-Party Interview\",\"href\":\"index_split_001.html#chapter-1\",\"index\":3},{\"label\":\"Chapter 2: The Exchange Training Camp\",\"href\":\"index_split_002.html#chapter-2\",\"index\":4},{\"label\":\"Chapter 3: Request from Horikita \u0026 Request from Ayanokōji\",\"href\":\"index_split_002.html#chapter-3\",\"index\":4},{\"label\":\"Chapter 4: A Strange Discomfort\",\"href\":\"index_split_003.html#chapter-4\",\"index\":5},{\"label\":\"Chapter 5: The One Who Watches, The One Being Watched\",\"href\":\"index_split_004.html#chapter-5\",\"index\":6},{\"label\":\"Chapter 6: A Peacef
