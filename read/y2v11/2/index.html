 loading=\"lazy\" decoding=\"async\" alt=\"Image 5\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN\"\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-3_2.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"Image 6\" /\u003e\u003c/p\u003e\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p4\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-4_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 7\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN\"\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-4_2.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"Image 8\" /\u003e\u003c/p\u003e\n\n\n\n\n\n\n\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p5\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-5_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 9\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN\"\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-5_2.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"Image 10\" /\u003e\u003c/p\u003e\n\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p6\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-6_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 11\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN\"\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-6_2.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"Image 12\" /\u003e\u003c/p\u003e\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p7\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-7_1.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"Image 13\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p8\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-8_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 14\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN\"\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-8_2.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 15\" /\u003e\u003c/p\u003e\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p9\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-9_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 16\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN\"\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-9_2.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 17\" /\u003e\u003c/p\u003e\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p10\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-10_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 18\" /\u003e\u003c/p\u003e\n\u003ch1 id=\"prologue\" class=\"chapter-title\"\u003ePrologue: Miki Yamamura’s Monologue\u003c/h1\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI REALIZED THAT I was alone. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt wasn't that anyone particularly disliked me. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI just didn't catch anyone's eye. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI was inconspicuous, lacking presence. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBefore anyone could like me, they couldn't even hate me. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThat was why I was always alone. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was the same in kindergarten, elementary school, and junior high. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI didn't have any friends, and I spent a lot of time by myself. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI couldn't develop the ability to talk to people, so I remained invisible. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEven after becoming a high school student, nothing changed. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut I thought that was okay. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI forced myself to believe that it was my strength… \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI thought it would be okay to live quietly alone even as an adult. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEven so, I am certainly here. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“. .After all..  I don’t think losing suits Sakayanagi-san...” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Why don't you try telling her? No one has the right to criticize your actions.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eWhat is this sensation, this emotion that is seeping into my heart? \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI didn't know. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI just didn't know. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e—Until this day. \u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p11\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-11_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 19\" /\u003e\u003c/p\u003e\n\u003cdiv class=\"calibre4\" id=\"calibre_pb_0\"\u003e\u003c/div\u003e\n\n\u003cstyle\u003e\n    body {\n        color: #e5e5e5 !important;\n        background-color: transparent !important;\n    }\n    .P_Prose_Formatting {\n        font-family: serif; /* Match standard LN feel */\n        font-size: 1.08em;\n        text-align: justify;\n        text-indent: 1.50em; /* Standard indent */\n        line-height: 1.4;\n        margin-top: 0.42em;\n        margin-bottom: 0.42em;\n        color: inherit; /* Essential: Inherit theme color (white in dark mode) */\n    }\n    .P_TEXTBODY_CENTERALIGN {\n        font-size: 1.00em;\n        text-align: cente
