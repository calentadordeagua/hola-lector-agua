e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T17530,"])</script><script>self.__next_f.push([1,"\n\u003ch1 id=\"chapter-8\" class=\"chapter-title\"\u003eChapter 8: The Courage to Step Forward\u003c/h1\u003e\n\n\u003cp class=\"P_Prose_Formatting\"\u003eIT WAS SUNDAY, the fourth day of the training camp. Today was the day to say goodbye to the familiar campsite. We had to leave the accommodation at 10 \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eo'clock. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe fight with Amasawa was set before breakfast, at 7 o'clock. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBefore 6 o'clock, after waking up, I came to the still dimly lit lobby. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI had some time to spare until Horikita and Ibuki showed up from their shared room, and considering the risk of waking up the sleeping students, I decided to use my phone to kill time. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe lobby was chilly and cold, perhaps because the heating had just turned on.  “It seems everything is fine.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIn the silent corridor, I muttered to myself while looking at my phone screen. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe only message left from Nagumo, which had arrived in the middle of the night, was 'I won't say thank you.' \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf Amasawa had committed a crime, the rest of the camp would’ve been a big mess. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAfter a while, as I watched the sunrise through the window, I heard footsteps. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It's still quite early in the morning after all, isn't it?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe one who approached me with a sleepy voice was Tsubaki from the same group. The probability that it was a coincidence was pretty high, but… \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“For the past two days, I heard from Hashimoto-senpai that you’ve been getting up early in the morning.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEspecially since going out in the morning was something I didn’t need to hide, even if someone were to ask, the impact would be negligible. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEven if Tsubaki noticed the special training, the probability of the information reaching Amasawa wasn’t that high. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“So, you came looking for me?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Not so much looking for you, but I just thought I'd check if you were here.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eTsubaki, who didn't change her attitude towards anyone, looked at me with a slightly suspicious look. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“But if you were here, that would change things quite a bit.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I don't think there's any reason for you to come see me anymore. The special exam given only to first-year students has been canceled.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe student who expelled me would be given 20 million private points. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p183\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-183_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 199\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThat was the hidden special exam known only to a few, as Tsukishiro was involved. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I wasn't interested in the prize money from the start, but I'm disappointed. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI'm lamenting the loss of the right to expel you in a dignified manner.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's dangerous talk. I don't remember you ever resenting me.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI looked back on my school life, but of course, there was nothing to worry about. “Don't you think there are more things you don't realize? People unknowingly incur resentment, you know?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI could somewhat understand what Tsubaki was trying to say. It was true that there were both people who knew they’d be resented and still chose actions that led to resentment, and those who didn’t think they would be resented but ended up being resented anyway. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I can’t tell if you're joking or serious.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Someone might come here, so why don't we take a walk?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It's still dark outside.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was getting a bit brighter, but it was still hard to see and it was quite cold. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It's not inconvenient for you, right?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Well, okay.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAnyway, I was planning to go outside to accompany Horikita and Ibuki for their final special training. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe two of us left the lobby and started walking outside in the cold. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I thought it would be snowing quite a bit in the mountains of Tochigi, but it's not as much as I thought.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“February has a drastic temperature difference. Maybe it's because we've had a few warm days recently.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIn reality, it wasn’t completely snow-free, and there was a bit of snow left on the side of the road. The water droplets on the cars, presumably belonging to the staff here, were slightly frozen and covered with a thin film. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Do you like snow, Senpai?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I don't particularly like or dislike it. I just think I enjoy the scenery when it snows. Do you like snow, Tsubaki?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“. .I guess I do. At least more than you, Senpai.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe squatted down on the side of the road, picked up a bit of the remaining snow with her fingertips, and stood up. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe placed snow on her palm and showed it to me. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Can you look at this?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen she asked, I stared at the snow on her palm. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBecause it was a small amount, it melted and disappeared quickly due to the warmth of her hand. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p184\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-184_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 200\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Being in this school feels like being cut off from the outside world, doesn't it? Who do you want to see first when you graduate next year, Senpai?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You ask strange questions.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Maybe.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eFor me, the only people I knew beyond their faces in the outside world were my father and his associates. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI didn’t have any one-sided feelings of wanting to see any of them. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Probably just my family.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSo I chose a safe answer that wouldn't surprise anyone. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Family. . Anyone else?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Not really. I don't have any close friends, so that's about it.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I see. . Then, can I ask you one more strange question?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eTsubaki kept asking questions that seemed to have meaning and yet didn't. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Imagine if you had a brother, and you didn't know about his existence because your parents hid it from you for years. But one day, you were told he was actually family, would you be able to love him as a family member? Of course, assuming there is a genuine blood connection.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's a difficult question.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAs far as I knew, I didn't have any siblings. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut, this was a hypothetical situation where they’d be hidden, so in reality, it was possible. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eIf that man had a son other than me. . I wonder how I would feel when I met\u003c/i\u003e \u003ci class=\"calibre3\"\u003ehim. \u003c/i\u003e  I was interested in the thought for the first time, but that didn't mean I felt any unexpected emotions. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I might not feel anything. Of course, I think it would greatly depend on the other person's personality and situation.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf we were raised completely separately, it would be difficult to suddenly accept and interact with him as a family member. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I see. I think I would probably feel the same way as you. But, if I knew that the other person had special circumstances and a sad past, I would want to grow closer. I would like to know more about my sister, who I had been separated from.” She’d asked me about a brother, but Tsubaki used a sister as an example. It wasn’t unreasonable to imagine that she was just comparing it to the same gender, but the way she expressed her emotions sounded like it was based on her own experience. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I am confused. Ayanokōji-senpai, from this school—” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003e(TL NOTE: This sentence appears to be intentionally vague and\u003c/i\u003e \u003ci class=\"calibre3\"\u003efragmented.) \u003c/i\u003e\u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p185\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-185_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 201\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eJust as she was about to continue, Tsubaki's gaze shifted to the building behind us. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe promised time was approaching, so Horikita and Ibuki appeared. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAnd for some reason, Kushida was also there. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“We've been interrupted..  Let's talk again later.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eTsubaki seemed to have no intention of letting the other students hear her story, and she returned to the building, shivering from the cold. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe gently nodded to Horikita and the others as they passed by, but she didn't say anything. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That was Tsubaki-san, right? What were you talking about at this hour?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“She said she woke up early. The training camp is over today, so we were just chatting. Though, why is Kushida here?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Ibuki-san here carelessly leaked about her rematch with Amasawa-san. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eCarelessly\u003c/i\u003e.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe emphasized the word 'carelessly' twice, expressing how foolish it was. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It's not my fault! It's Kushida's fault for tricking me into it!” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's what you call being defiant.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Shut up! It doesn't matter if there's one or two more spectators!” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“So that's it. I heard that you're going to fight with Amasawa-san, and I got interested.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“If both of you agree, I have nothing to say, but who are you cheering for?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eMy personal interest lies there. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“For me, it's like a win-win situation no matter who loses.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe had a dispute with Amasawa during the cultural festival. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIn other words, no matter who won or lost, it would be a satisfying match for Kushida. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eKushida looked back at Tsubaki, who had already disappeared from our sight.  “About Tsubaki-san earlier, was it about love? I've been thinking for a while, but Ayanokōji-kun, you're surprisingly popular, aren't you?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Is that so?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eTsubaki's goal was completely different, but it seemed Kushida had assumed such.  In sync with that, Horikita also started talking. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“But you're aware of it, right? You're dating Karuizawa-san after all.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“On the contrary, let me ask you in return, are you confident that you’re popular?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Why me? I'm not popular.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“At least Sudō has shown some interest, hasn't he?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Really? Horikita? Haha, you'd make a good match with that idiot.” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p186\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-186_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 202\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Stop calling Sudō-kun an idiot. He's become several times smarter than you now.” “But I can knock him down with my kick!” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI didn’t understand how the basis of comparison turned into combat ability, but if he really tried, Sudō would probably be stronger. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Well, but—” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAfter looking at me from top to bottom, Ibuki spat out forcefully. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“How this guy’s so popular—I just don't understand at allllllllllllllllllllllllll.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was the first time I had seen someone hold such a prolonged ‘l’ sound in their words. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You feel the same way as well, don't you, Kushida?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Eh?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Not 'eh?' I'm asking, you don't understand Ayanokōji's appeal either, do you?” “..Well, it's not that he doesn't have any appeal, right? If you look around, you can see that there are no other decent men, right? Compared to such riffraffs, he might look better.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt seemed like a compliment, but it probably wasn’t. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I think they're the same to me. .!” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Then, if you had to date either Ryūen-kun or Ayanokōji-kun, who would you choose, Ibuki-san?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAt Kushida's question, Ibuki fell silent for a while, maintaining a puzzled expression. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEventually, she broke the silence and came to a conclusion. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I can't choose between curry-flavored shit and shit-flavored curry.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHorikita and Kushida quickly distanced themselves from Ibuki to avoid getting involved. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNo one wanted to hear such a topic out loud. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf I ran away, she’d probably chase after me, so I had no choice but to become a human shield. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What kind of comparison is that?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI decided to retort for the time being. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What do you mean, ‘what kind’? It is what it is.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI didn't mind any analogy, but that comparison hurt a bit. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAnd I wondered whether I was the former or the latter. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eNo, I don't want to be either. \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut… I deliberately thought about it. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf I had to eat one of them, I would choose the latter. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEven if the taste was improved, it would be extremely dangerous to ingest a large amount of E. coli. On the other hand, the latter would cause great damage to RoyalMTLs \u003c/p\u003e\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p187\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-187_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 203\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eyour taste and smell buds, but it’s still fundamentally curry. In other words, the adverse effects on the human body would be greatly limited. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHowever, if your brain were to determine that it was dangerous solely from your sense of smell, you may suffer unexpected health risks.. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What's wrong, Ayanokōji? You're spacing out.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It's nothing.. ” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI thought too deeply and felt a little unwell, so I decided to forget about it. \u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p188\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-188_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 204\" /\u003e\u003c/p\u003e\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003eSince the rematch was right after the special training, we finished after some warm-ups. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“We've done what we can. Now let’s see how far you’ll get in the real match.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWithout taking too much time, I called out to the two of them as their breathing calmed down. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Yes, thank you. Thanks to you, our chances have increased.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHorikita, who bowed her head politely, urged Ibuki to thank me as well. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhether she had no intention of following suit, Ibuki turned away and snorted. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I won't say thank you. I think my way of thanking you is to kick you someday.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“If that's your idea of gratitude, I don't want it in the future.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Really. .” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Well, I'll go back first, so do your best.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Eh? Aren't you going to watch, Ayanokōji-kun? I thought we were going to watch together.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eKushida, who had been watching from a distance, seemed to think we’d be together the whole time. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“If it's revealed that I'm involved in this matter, it will only harm Horikita and Ibuki.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf I made Amasawa suspicious, the surprise attack wouldn’t work. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eTo increase the odds of winning by even one percent, it was better not to be present. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I see. Then I'll make sure to watch it all. I even brought my phone as well.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe probably thought that it’d be a great opportunity to take photos if anything embarrassing were to occur. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSince Kushida declared that she’d be the witness, I decided to leave that role to her. Besides, I had one more thing to do this morning. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eJust before 7 o'clock, naturally, there were hardly any students using the park.  That was why the student I had called here was sitting on a bench, waiting for me to arrive. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It's cold, isn't it? You didn't have to come earlier than the promised time.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Don't worry about it. It’s not often that you call out to me, Ayanokōji-kun. I enjoyed waiting.” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p189\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-189_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 205\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Can I sit next to you?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I've kept it open for that purpose.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSakayanagi, who was smiling, welcomed me as usual. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'll get straight to the point. I've got Yamamura waiting in the dog park nearby.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Eh? The dog park? Yamamura-san? What do you mean?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Didn't you expect Yamamura's name to come up?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“She was in the same exchange meeting group as you, wasn't she? Did she do something problematic?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003ePretending not to know, Sakayanagi made up a reason. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You knew about it. That Yamamura and I were in the same group.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's a surprise. Naturally, I had already figured out which group each student in the class was assigned to when we got on the bus. I was just observing this time, so I didn't interfere with the exchange meeting.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eOf course, I already knew that Sakayanagi had figured out where all of her classmates were assigned. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSo, once I told her what I was about to say, Sakayanagi wouldn't be able to escape. “On the second day of the camp, when we talked in the lobby, do you remember what you said? 'Hashimoto-kun and Morishita-san are in the same group. How is Hashimoto-kun doing?' That's what you said. It's impossible for you to overlook Class A’s group assignments, as you seem to pride yourself on. Yet, you didn't even mention Yamamura's name, did you?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThis proved that Sakayanagi was subconsciously avoiding talking about Yamamura. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's—” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNo matter what excuse she made, she couldn't twist the conclusion that she \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e'avoided' it. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“. .Yes, that's right. I admit that I didn't mention Yamamura-san's name at that time. But it's none of your business, is it, Ayanokōji-kun?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Indeed, it's none of my business. I’m probably meddling in others’ affairs by doing this.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut I continued. Sakayanagi knew everything, so I didn't beat around the bush.  “You lost Kamuro. And at the same time, you were entrusted with her feelings. But that doesn't mean everything is back to normal. You haven't even finished choosing who to keep by your side, have you?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBeside me, a white breath escaped from Sakayanagi’s lips. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Indeed, I haven't decided yet, but are you suggesting that I should appoint Yamamura-san?” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p190\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-190_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 206\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That’s not what I meant. People have their own strengths and weaknesses.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was hard to imagine Yamamura boldly supporting Sakayanagi. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“The survival and elimination special exam—there are some people that still seem to be trapped in that exam.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“. .Are you talking about me and Yamamura-san?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's right. Yamamura is suffering and can’t move forward, even though her situation is very different from yours.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe two who had yet to complete the survival and elimination special exam. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf Sakayanagi was the light of Class A, Yamamura was the shadow. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was safe to say they had an inseparable relationship that couldn't be cut off.  “If you're still bothered by that, you should resolve it.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“. .What you’re saying is strange, Ayanokōji-kun.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Strange?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I thought you were just going to stand on the sidelines from now on. Isn't your unnecessary intervention excessive?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's right. I also thought until a little while ago that I should just stand on the sidelines from here on.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSakayanagi no longer needed any further assistance. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was enough to wait for her to stand up on her own. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHowever, the situation had changed significantly since before the special exam that led Hashimoto to betray them. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThat was why I was doing what I thought needed to be done now. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I don't particularly want you to have anything to do with Yamamura. I don't have any such hopes at all. Whether you want to get closer or more distant, or even cut ties, is up to you. But if you're going to talk, now is the only time.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNeither parties would benefit from postponing the issue. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Wouldn't it be smartest to leave everything behind at this training camp?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“...But...” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSakayanagi's frustrating resistance. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI wasn’t one to talk, but she was just as bad at friendships. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe didn’t know what to do because she had no prior experience. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“As I said earlier, I have Yamamura waiting in the dog park. She's been waiting for you in the cold for over 20 minutes now.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“If that's the case, aren't you being a bit mean, Ayanokōji-kun? The time you promised to meet me was 7 o'clock. We haven't even been talking for ten minutes yet. Doesn't that mean she's been waiting since before that?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eFrom Yamamura's perspective, waiting for an unnecessarily long time would make the experience quite tough. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p191\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-191_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 207\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eFrom Sakayanagi's perspective, she would be overwhelmed by guilt for making Yamamura wait. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“This is also part of my strategy.” I told her. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe was quick to notice these kinds of things. It was indeed Sakayanagi. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I guess there's no choice. I can't let her catch a cold because of me. Let's go pick her up for now.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSakayanagi, who couldn’t admit her weakness straight away, stood up for an appropriate reason. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eThat was fine. \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf she spoke one-on-one with Yamamura, they’d be able to talk honestly. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It's a bit of a distance, but even you can walk there in about five minutes. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eGo ahead.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI also stood up and told her so. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHowever… Sakayanagi didn't step forward. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What's wrong?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eMy question was met with no response, and a brief silence ensued. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eDuring that time, Sakayanagi tried to start walking, but she didn't move forward at all. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“...My... leg...” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eHer leg? Could it be hurting? \u003c/i\u003e I thought for a moment, but.. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“My leg..  I can't move it..  I wonder why.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was immediately clear that it was not a physical problem, but a mental one.  Even though she acted bravely through her words, as she’s typically like, her body didn't seem to agree. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt seems that the change in her heart, the change that Kamuro brought to light, was also evident here. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Don’t feel like you can show this side to anyone else?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“. .Yes, that's right.. ” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI grabbed Sakayanagi's left hand as she stood bewildered, unable to walk. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHaving waited for me before the set time, her fingertips were very cold. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Then, just for now, I'll be your legs. That should make it easy for you to walk.” “...I'm sorry.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It's okay. It's my own meddling that started this.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAfter that, we moved forward slowly without exchanging words. \u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p192\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-192_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 208\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN\"\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-192_2.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"Image 209\" /\u003e\u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p193\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-193_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 210\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEventually, the dog park came into view. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSeeing Yamamura standing in the shadow of the big tree in the distance, Sakayanagi raised her hand slowly to make her presence known, despite her confusion. When I gently pushed Sakayanagi's back, she started walking on her own, albeit with a cane. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eFrom there on, it wasn’t my place to interfere. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSakayanagi and Yamamura would have to talk and find their own solutions. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eExpecting a bright future, I turned away and left. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThus, the three-night, four-day exchange meeting came to an end. \u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p194\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-194_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 211\" /\u003e\u003c/p\u003e\n\u003ch1 id=\"epilogue\" class=\"chapter-title\"\u003eEpilogue: Who is the Challenger?\u003c/h1\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWITH THE END OF the exchange meeting, an event that brought changes in relationships, our usual school life resumed. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eRecently, it had become customary for me to meet up with Kei in my room or lobby every morning and go to school together, but today was different. I left on my own this time, about 20 minutes earlier than usual. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI got off the elevator, arrived at the lobby, and went outside. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was unusually cold today, perhaps because of the strong wind. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSoon, February would be over. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNext month would be busier than ever. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eFirst, I had to deal with the issue concerning Karuizawa Kei. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNothing special was needed for this. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI just needed to proceed with the process as originally planned. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNext, the issue concerning Ichinose Honami. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe leader of a class that was struggling to compete with the other three, with nothing special among the four classes. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eMy prediction was correct—Class D was in decline as the end of the second-year approached. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHowever. . unlike Kei's problem, some adjustments might’ve been needed. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI could decide after the end-of-year exam results came out. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNo matter how much Ichinose grew, there would be no major changes. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI thought I just needed to proceed with the plan as I originally intended. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut… \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eOne problem arose that wasn’t in the plan. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThat forced me to, in turn, make changes. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThere would be some negative effects as a result, but not all changes would be bad. As soon as I started walking to school, I stopped. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You're early.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIn my field of vision, I spotted the person I was meeting up with. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThere was still some time until the scheduled appointment, but they were already waiting. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThey didn't notice me and occasionally breathed out white clouds as if they were cold, but they soon noticed my gaze. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Good morning, Ayanokōji-kun.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAs I approached, a morning greeting came flying. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Good morning. Sorry for calling you out so early.” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p195\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-195_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 212\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It's okay. So, what do you want to talk to me about? Something hard to say over the phone?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAs classmates, we knew each other's contact information. Normally, we could communicate using our phones. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe questioned why I didn't do that. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“In a way, maybe.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHorikita lined up next to me and soon started walking by my side. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“In a way? That's a scary way to put it.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“There's nothing to be wary of.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Really?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe looked at me with doubt in her eyes, but there was no prickliness like when we first met. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was a natural friendship, with a tenderness that could be described as such. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I often talk to you about special exams and class-related matters, but sometimes I want to talk about things that have nothing to do with that.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Huh? Sorry, I don't understand. What do you mean?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI regretted that my words were clumsier than I’d imagined. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI had thought of a more casual way to say it, but I decided against it because it might bother her depending on how she took it. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I wanted to have a meaningless conversation with you, unrelated to our interests. Does that make sense to you?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“...I see?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe seemed to be in thought for a moment, but apparently, she didn't understand. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“We’ve been classmates for a while. It's not like we'll have the opportunity to talk forever.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Forever is an exaggeration. Sure, that's true, but we still have over a year until graduation, right? We don't have to arrange meetings like this, I can chat anytime.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What if I were to be expelled at the end-of-year exam?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's a jump. I don't think you'll be expelled. But seeing how easily you get common sense questions wrong, maybe there's a possibility.. ” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAfter giving a serious answer, she laughed a little, finding her own words amusing. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Are you really worried that you might be expelled? Is that why you wanted to talk so early in the morning.. ?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“The last special exam has become a bit of a trauma for me.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Then why don't you try to remember more common sense questions? \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eYou're good at studying.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe retorted, expressing that I was aware of my weak points. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p196\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-196_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 213\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“So, can you memorize game and anime terms as effectively as studying for other subjects?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Huh…? I wonder. When Onizuka tried pushing me to play a game before, they were talking about DP. . something, DEF something, cooldown something, but my brain refused to remember those words and their meanings.. ” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It's a similar feeling. I just can't seem to want to remember it.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI wanted to absorb as much information as I could, but I also had such preferences. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Don't worry. From a class perspective, your existence is essential. Even if you struggle with common sense questions, I'll always back you up. In other words, you won't be expelled.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHorikita made that clear. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's reassuring.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI tapped Horikita’s shoulder with a gentle chop from my left hand. She was taking this conversation seriously. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Do you really worry about your own expulsion? It doesn't seem like it. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhat's the real issue?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Actually, I'm not worried about myself, but about the possibility of your expulsion.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“In reality, that seems more likely.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe showed a slightly annoyed expression, but it didn't seem serious, and she quickly returned to normal. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eCompared to when she first entered, Horikita's emotions had become much more varied. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“The last special exam resulted in only Kamuro’s expulsion. However, next time, there might be more.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“. .You're expecting new dropouts.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Yeah. At least one from our year. Depending on the exam content and its developments, we could lose several people.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“...That many?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It's better to think that way. The school has said it before—second-year students are progressing through school life with few to no dropouts.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“So they're going to force an exam to increase the number of dropouts? \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThat's..  a bit extreme. Our year didn't have that many weak spots. It should’ve been a good thing.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf you looked at it positively, it was true. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut sometimes, a sieve was needed. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It depends on how it looks from the outside. For example, the government is also involved in the school’s operation. If the goal is to drop ten people a year, and we second-year students do not meet that standard, then it would be nice if RoyalMTLs \u003c/p\u003e\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p197\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-197_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 214\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003ethey simply saw us as exceptional, but it's unknown how much the people at the top are aware of and acknowledge the finer details of those numbers.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“To comply with the government's policy, they'll make the rules more strict?” “Last year, because there were no dropouts, it was forcibly changed from zero to one expulsion. I wouldn't be surprised if several people will get expelled in the upcoming end-of-year exam.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe third-year’s advice from winter break—that might not have been just for the survival and elimination special exam. But in reality, the third-years probably didn't know about the second-year students’ future. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Aren’t you overthinking. .?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Of course, it's just speculation. I just feel that way based on what I can see right now. I can't provide any concrete evidence.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“In that case, I guess so. I'd like you to work hard too.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe requested cooperation half-seriously, half-jokingly. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eMy answer to that was already decided. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“If there's a situation at the end of the school year where I can help, I intend to cooperate as much as possible.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's a rather unusual answer for you. Between the special training and now, you've been a bit too cooperative lately. Even with the Amasawa-san situation, you didn't look displeased even once.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I’ve left many things to others so far. I have to lend a hand at least a little.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's a noble reason, but..  it's still not like you to become so cooperative.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I wonder. There might be a catch.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'd rather not have that, if possible.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAt that point in the conversation, Horikita and I made eye contact. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWe probably both thought of the same thing simultaneously. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Haha, you invited me to chat, but in the end, we're talking about the exam.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Right. There's no point in calling you here if it's like this. Alright, let's end the discussion about the exam.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWith that, I put an end to this topic. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I heard about the results from Kushida, it seems you fought well, but you lost.”  “She's really strong, isn't she? Even if we fought two against one, we still couldn't win in the end.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHowever, I heard that Amasawa, after being hit a few times, was able to analyze them. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You should be able to have a better fight next time.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Two against one?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Do you dislike it?” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p198\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-198_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 215\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Well, yes. Ibuki-san said she wouldn't team up with me again.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It's fine. She forgets things quickly.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHorikita laughed at my exaggeration. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“By the way, it looked like Amasawa-san noticed your influence right after the fight started. But she seemed very happy. What's your relationship with her?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“She's my ex-girlfriend.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Are you serious? Or was that a joke?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It was a bad joke.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“If that's the case, it wasn’t funny at all.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eA harsh response came back. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Someday, I want to hear the truth from your own mouth, Ayanokōji-kun.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'll think about it. But don't expect—” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'm not.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHorikita narrowed her eyes and smiled in response. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAt that moment, Horikita, who was changing colors, showed a smile. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI guess I was also learning a lot from Horikita. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThis relationship between us would end soon. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHorikita would have some tough experiences in the future. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut there is no need to keep worrying. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHer growth and the support of her classmates should guide her. \u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p199\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-199_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 216\" /\u003e\u003c/p\u003e\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003eRewinding time a little from my commute to school with Horikita and the exchange meeting. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was when Hashimoto came to my room asking for help shortly before the exchange meeting began. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eWhy did Hashimoto commit this seemingly reckless act of betrayal? \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eWhy did he take the risk at that time? \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe circumstances were explained in detail by the person himself. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“. .Before I tell you what's next, there's something I really need to confirm with you.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHashimoto must’ve had an extraordinary determination to make such a decision. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhat he wanted to confirm. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was how much information I had at the moment. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThat was an important factor that this man couldn't miss. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I've been tempted to betray Ryūen since before the previous special exam. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNot just temporarily teaming up, but moving classes based on that premise.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was obvious, but there was no merit for Hashimoto, who was in Class A, to move to Ryūen's class. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eExcept for cases like Katsuragi who lost his place, if you were to look at it from a while ago, Class A should’ve established a more stable position than its current status. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Of course, I didn't take such an invitation seriously at first. However, right after that, I heard from Ryūen that if I didn’t move classes, I’d definitely regret it at the end of the school year.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Regret? Is it because Ryūen himself is confident that he’ll win?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It seems that even you don't know about the content of the bet that Ryūen and Sakayanagi agreed on.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“A bet, huh? I don't know if it applies, but I've heard a little about the exchange in the last deserted island exam. Unfortunately, I don't know the details.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAfter I told him what I knew, Hashimoto rubbed his fingers together and made a sound, as if to prove that this was what he wanted to confirm in advance. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'm glad. Then there was a reason for me to come here.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAccepting that the key points of the story matched, Hashimoto slightly raised the corners of his mouth and smiled. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAfterward, Hashimoto detailed the bet that the two made. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“When I first heard about it, I thought it was a joke, but it turns out it's serious.” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p200\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-200_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 217\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I see. So you had a reason to betray them during the survival and elimination special exam.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was clear that it wasn't a spur-of-the-moment idea at that point. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It's not unreasonable to doubt the bet itself, right? No matter how you look at it, Sakayanagi is at a disadvantage.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's true. However, Sakayanagi wouldn't choose to reject the bet just because of the disadvantage.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe was the type who, like Ryūen, believed in her ultimate victory without a doubt. \u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p201\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-201_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 218\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN\"\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-201_2.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"Image 219\" /\u003e\u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p202\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-202_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 220\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Do you think Sakayanagi simply conceded or were there certain conditions set?”  Hashimoto, unable to suppress his overflowing emotions, leaned forward and asked. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Both are possible, but the details of the bet will eventually come to light. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eConsidering that, it must be the latter. She must’ve allowed Ryūen to accumulate private points.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Nice. That's fast. Yes, if that's the case, there’s plenty of room to maneuver.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Who else knows about this bet besides you and the parties involved?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Unless Ryūen was lying, no one. You're the fourth. Well, both would hate to lose the bet by having it leaked.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThat speculation was probably correct. It would be preferable to make it public after everything had been confirmed. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe only one Ryūen leaked it to was Hashimoto, but that must’ve been a considerable risk. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf it was around the time the deserted island exam ended, about half a year had passed since then. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It took a while. . for this day to come.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHaving kept the secret hidden, Hashimoto had been worrying alone. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Whether Sakayanagi wins or Ryūen wins, honestly, I couldn't make a judgment..  No, I was kinda thinking that Sakayanagi might win.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAs if he had momentarily lied, Hashimoto immediately corrected himself. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“But even then, it's like 55 to 45. Seriously, it's not decisive, is it?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI agreed. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eUnless it was a nine to one chance or at worst a seven to three chance, you couldn't tell which way a match would go. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“So I've been looking for a decisive factor, and what I thought that would be was—” Slowly, Hashimoto's gaze turned to me. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Me?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“If you were to follow Sakayanagi, I would’ve been ready to die with my current class without hesitation. That's why I advised Sakayanagi. . to recruit you as an ally.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAnd Sakayanagi refused. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eSo he decided to betray them. .? \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhile it seemed to make sense, it was still unclear at its core. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI understood that the outcome of the confrontation between Sakayanagi and Ryūen was unpredictable. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI understood that he thought Sakayanagi could win if I joined. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p203\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-203_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 221\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut that didn't change the fact that it was too reckless. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I will make Ryūen win. No matter what the content of the end-of-year special exam is, I will thoroughly assist them. If I miss this opportunity, I will most likely be the one to disappear.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eOf course, Sakayanagi would be on high alert against Hashimoto and wouldn’t share any information. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut if there was a confirmed traitor within the class, it would inevitably be a handicap. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf the class’s accumulated exam scores were to determine the outcome, it would be a tough situation if Hashimoto intentionally scored zero. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“If Sakayanagi had followed my instructions, whether that would be before or after I betrayed her in the previous special exam, I was planning to betray Ryūen and join her at the end of the year.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe spoke with a lot of determination, but I wasn’t sure how much of what he was saying was true. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eRight now, the only thing I could be sure of was that everything he said was ambiguous. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It's fine if you want to make Ryūen win, but did you propose the same thing to him as you did to Sakayanagi?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You mean about recruiting you? Yes, of course. The answer was the same as Sakayanagi's, but there was a condition. If we could defeat Sakayanagi in the end-of-year exam, he would recruit the both of us to his class.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eRyūen said that? \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eConsidering the past, Ryūen was the same as Sakayanagi. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was clear that he wasn’t the kind of person who would try to win by recruiting me. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAnd it would take a whopping 40 million to recruit two students from different classes. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eDid Ryūen's shallow lie fool Hashimoto? \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eNo—that probably wasn’t it. \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHashimoto wasn't telling the whole truth. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf I were Hashimoto, I’d make sure to have a safety net in place for my reckless betrayal. I wouldn't decide to betray solely based on the possibility that Ayanokōji Kiyotaka might move to the class I had in mind. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt’d be strange if the reward for betraying Sakayanagi wasn't enormous. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe contract to transfer 20 million private points— \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThat would make sense. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf he helped defeat Sakayanagi in the end-of-year exam and took the credit, he’d gain that privilege from Ryūen. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThat would make the challenge worth it, even at the cost of betrayal. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p204\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-204_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 222\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEven if Ryūen couldn’t immediately prepare that large sum, he could collect the private points that come into the class every month, and it would be enough to pay by graduation. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIn the end, it didn't really matter to Hashimoto which class won or where I was. As long as he had the privilege to be part of Class A, that would be Hashimoto's victory. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEverything was for himself. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was the answer he chose based on the patterns he had mentally simulated. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBy betraying the class in the survival and elimination special exam, Hashimoto confirmed Sakayanagi's true intentions. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf she decided to accept me there, things would be simple. If she collected private points from each of her classmates, there was a high possibility that she could easily reach 20 million points. If I accepted the class change, Hashimoto would’ve chosen to fight alongside me and Sakayanagi as the two main players. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf he was rejected, he could make a secret agreement with Ryūen and get 20 \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003emillion private points. However, though the latter had an advantage in terms of graduating from Class A, he couldn’t avoid risking expulsion due to his betrayal. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNot only would Sakayanagi become an enemy, but he would also be at risk of being targeted by a third party. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe reason he approached me and told me the details of the betrayal was all for himself. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What do you want from me?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen I asked, Hashimoto smiled nervously. \u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p205\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-205_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 223\" /\u003e\u003c/p\u003e\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003eWith the end of the exchange camp, time was slowly but surely passing. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSakayanagi was quietly spending time while waiting for someone to come, sitting on the sofa in the career counseling room. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNext to her stood her homeroom teacher, Mashima, with his arms crossed in confusion. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What are you planning to talk about? And with whom?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eMashima, who had been brought here without being told anything, sent a quizzical glance. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEven though he didn’t understand the situation, he definitely sensed something unusual. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You seem restless, Mashima-sensei. Don't worry, you'll understand soon.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“But...” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eMore than ten minutes had passed since the two of them entered the room. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“. .Here he comes.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSakayanagi sensed it immediately after. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe moment a hand was placed on the door, she knew that man would appear. “You're five minutes late, Ryūen-kun.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“The star of the show always makes a late entrance.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe one who opened the door to the counseling room was Ryūen Kakeru. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAnd behind him was the figure of his homeroom teacher, Sakagami. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What's going on here, Mashima-sensei?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Well. . I'm also trying to gauge the situation.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe two teachers who ran into each other couldn't understand the situation and looked at each other, puzzled. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eRyūen sat down in front of the sofa where Sakayanagi was sitting, spreading his legs wide. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAn odd situation was created—two students were sitting and the teachers were standing. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Even if you were to deceive Hashimoto-kun, you made him do something quite bold.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen Sakayanagi asked, Ryūen immediately responded. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“He must be feeling insecure under you, can't blame him.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That would be fine. But he must’ve been tempted by a cunning villain’s sweet words. He believes lies to be true and truth to be lies. He might be another victim.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe exchange of words between the two began, leaving the teachers behind. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p206\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-206_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 224\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You seem energetic for someone who's sunk so low.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I indeed felt emotions I had never experienced before, but if you thought that was the end, it’s too early.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Heh, Ayanokōji did something unnecessary too.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eRyūen naturally grasped that Ayanokōji had approached Sakayanagi at the exchange meeting. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAfter the meeting, Sakayanagi had returned to her usual self. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNo complex reasoning was needed to connect the dots. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“As you say, I was saved by him… by Ayanokōji-kun.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eTaking Sakayanagi's gaze head-on, Ryūen felt it on his skin. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eA change in her gaze, which until now had only looked down on others. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSakayanagi also felt it. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe man before her had a conviction that had grown even larger than when they first met. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“So you were also saved by Ayanokōji-kun.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Huh, don't make me laugh. We'll never get along. I don't remember being saved by Ayanokōji. Rather, what I got was hatred. Hatred for revenge.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHis trampled strength and pride. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe had been defeated miserably in the ring where he had absolute confidence. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I see. Hatred—so that's what drove you here.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Are you any different?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIn response to Ryūen's counter-question, Sakayanagi inadvertently smiled. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What's so funny?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'm sorry. If my smile seemed rude, I apologize. I was simply happy that you’ve come to recognize Ayanokōji-kun's strength in the process of getting here.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eUnlike her fury towards Hashimoto, which was not based on personal experience, the Ryūen before her had directly experienced the cause of his emotions. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe thought he was qualified. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNo, Sakayanagi immediately revised her thoughts. It wasn’t just that. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShe felt a change in her emotional switch within her, starting with the incident involving Kamuro and Yamamura. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Are you saying you had your eye on him earlier?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt was a well-known fact that Sakayanagi had been paying attention to Ayanokōji from the start. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut Ryūen didn't know where their first contact was, so he tried to find out. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Yes. You unfortunately only learned of his existence at this school. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHowever, unlike you, I’ve been following him with my own eyes since childhood.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAt such a triumphant attitude, Ryūen stopped moving. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p207\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-207_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 225\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“. .Quite an interesting statement, isn’t it? You know about his childhood?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I know it well. I consider him as something like a childhood friend.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eUpon hearing that statement, Mashima also remembered the story Sakayanagi had told him before. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAnd there was nothing ruder than interrupting the two of them. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I lost to Ayanokōji. I thought it was okay to lose as many times as I wanted as long as I won in the end, but that man mercilessly crushed that indomitable spirit. I was so drained.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut over a year later, he was trying to return to that stage. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Although our motives are different, it seems that our final goals are the same, Ryūen-kun. I have been wishing to fight him since long before you. We only have one year left in our school life. I need to get rid of any obstacles before then.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I completely agree. I'll defeat you quickly and take my revenge on him.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSakayanagi, who had always looked at others with cold eyes, certainly felt her heart warming up. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNot towards Ryūen. She was thinking of Ayanokōji, who was waiting ahead. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eRyūen felt the same way. His emotions were surging to defeat Ayanokōji, who was waiting beyond Sakayanagi. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Your revenge will not be fulfilled. You will stumble just before it.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You're probably planning for a showdown on the throne, but that scheme will fail.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eUnable to remain silent in the face of the escalating exchange, Mashima intervened. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You seem to be moving the conversation along on your own, but could you explain the situation?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I apologize.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIn response to the slightly indignant Mashima, Sakayanagi apologized softly and started speaking. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It would be better not to waste any more time. Shall we get to the point?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Yeah, that's right.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSakayanagi lined up the two teachers and turned them towards her. \u003c/p\u003e\
