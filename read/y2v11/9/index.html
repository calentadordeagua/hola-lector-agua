n\u003cp class=\"P_Prose_Formatting\"\u003eIn front of Sakayanagi, who stood up on her cane, Ryūen also stood up and turned around, facing the teachers. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“We’re about to make a big bet. Normally, we would make some kind of verbal promise for ordinary matters, or if we couldn't trust each other, we would make a contract. This time, however, because of the nature of its content, we decided it would be safer to have the teachers in charge of both classes present.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eFrom the course of the conversation they had heard, both Mashima and Sakagami felt tense. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What are you planning to decide among yourselves?” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p208\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-208_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 226\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSakayanagi announced the details of the bet. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“For the end-of-year exam, the loser will leave this school—that's what it’s about.” “The loser will leave..? What are you talking about? The content and rules of the exam haven't been announced yet. We don't even know if there's a way to expel students within the exam yet.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eConfused, he answered sternly, explaining that there was no guarantee of a method to expel the opponent. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Mashima-sensei, what are you misunderstanding? The content and rules are irrelevant. We are only betting on the outcome of the end-of-year special exam. As a result, the loser will voluntarily drop out. That's all there is to it.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You teachers were made witnesses to this exchange just to ensure certainty. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEven if Sakayanagi cries and screams, proceed with the expulsion process according to the contract. Of course, if by any chance I lose, the same applies to me.”  Both parties accepted the dangerous condition—accepting expulsion—upon defeat, cutting off 100% of their retreat. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eDue to its coercive power, the school’s cooperation was essential for the bet’s smooth execution. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eMashima, who had taken in the situation, tried to speak, but the words didn't immediately come out. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Do you really intend to make such a bet? You have a Protection Point—” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eCompared to Mashima, the calmer Sakagami voiced his doubts. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“A Protection Point is meaningless if we’re voluntarily withdrawing. For fairness, it’s been decided that we’d request additional private points to fill the difference that the Protection Point makes, but the amount is kept to a minimum. If we take away his money, his class will really have nothing left.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It’s like counting your chickens before they hatch. If you lose, there's no need to calculate money.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eMashima understood that this wasn’t a joke. The contract was serious. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe straightened his posture and made a stern expression. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Are both of you really okay with this? If we agree, we will have to enforce the expulsion forcibly based on the end-of-year results. Both of you are in important positions; you two play the leader role in your classes. Major disruption is inevitable.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Yes. It will be virtually impossible to repair the defeated class, and it will be impossible to avoid dropping out of the four-way battle before advancing to the third-year.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAs she said these words, Sakayanagi thought of Ayanokōji again. \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p209\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-209_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 227\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe competition between the four classes that Ayanokōji idealized had become impossible when the bet with Ryūen was decided. Even if Ayanokōji transferred and steered towards balancing the forces, considering Ichinose’s declining class, there wouldn’t be enough players. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Please don't hope for a draw to invalidate the bet, okay?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I won't recognize a draw. If that happens, we can decide by lottery, just like how you abandoned Kamuro.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“That's also fun. Let's look forward to it.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBoth parties cut off their method of retreat. Though, since the beginning, they didn’t anticipate a draw occurring. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt could only be victory or defeat. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eA relationship similar to the two sides of the same coin. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe bet was officially established when Sakayanagi and Ryūen acknowledged it, and both homeroom teachers understood it. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe loser would disappear. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe end-of-year special exam, with stakes set on expulsion and no escape… \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003ewas about to begin. \u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p210\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-210_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 228\" /\u003e\u003c/p\u003e\n\u003ch1 id=\"postscript\" class=\"chapter-title\"\u003eAuthor’s Postscript\u003c/h1\u003e\n\n\u003cp class=\"P_Prose_Formatting\"\u003eSomehow, I was able to release this in four months. I'm Kinugasa with a hernia. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThank you all for your support this year as well. A year really goes by quickly, and before I know it, one of my children will be starting elementary school this spring. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI believe that playing with all their might every day at kindergarten or daycare is a child’s social role, but the fact that they are about to jump into a society that includes studying. . As a parent, I'm half excited and half worried. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWell, let's put my story aside for now and talk a little about 'Classroom of the Elite.' Following the previous time, the story has entered the third term of the second-year. After the hard-hitting development during the previous volume, I provided something slightly more relaxed this time. And next time, it will finally be the last special exam of the second-year, the end-of-year special exam. Those who have already finished reading the main story will understand, but I am planning a story that will greatly affect the main characters up to this point. And currently, the third season of the 'Classroom of the Elite' TV anime is airing. I would be happy if you could check that out as well! \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eFinally.. As I wrote at the beginning, about the condition of my herniated neck. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThese days, there's nothing I can do about it, and my work pace has slowed down considerably. The pain is so severe that I hate sitting in a chair. When I was healthy, if the ratio of work time was six and rest time was four, I made it nine for work and one for rest to somehow cover the slowdown. But there's no way I can keep this ratio forever, and I think my body is at its limit..  So I'm considering taking a little time off to completely rest in the future and focusing on recovery. In that case, the release of the next volume may be delayed. I intend to work harder than ever when I recover, so I would appreciate your understanding. 'Classroom of the Elite' is of course the first priority, but I have many other things I want to do besides that. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWell then, everyone, hoping for the quickest possible reunion—see you again! \u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p211\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-211_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 229\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eShiina Hiyori’s Short Story: \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eMemories I Don't Want to Forget \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eMORISHITA-SAN, HOLDING A card in her left hand, swiftly extended her arm.  Four cards were held in her right hand. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Please go ahead, Shiina Hiyori. Feel free to draw any card you like.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIn this game, the person left holding the Joker at the end loses. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eSo..  does that mean the single card in her left hand is suspicious? \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Somehow..  I'm a little curious about this one card.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Is that so? This is the advanced strategy I came up with.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eBut would she make it that obvious that she’s holding the joker? \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What should I do…?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eInstinctively, I felt I should choose one from the four, but Morishita-san's composure was palpable.  \u003ci class=\"calibre3\"\u003eWas she trying to make it seem like a one-in-four chance\u003c/i\u003e \u003ci class=\"calibre3\"\u003eby isolating a safe card instead of making me draw the Joker from a one-in-five\u003c/i\u003e \u003ci class=\"calibre3\"\u003echance? \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eNo, perhaps that was exactly her plan, and that was the Joker? \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e—I had no idea. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAs I was seriously contemplating, I happened to glance over at Ayanokōji-kun, who was sitting behind Morishita-san. His eyes were focused on Morishita-san's cards. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAnd then, at that moment… \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eEven though there was nothing apparent in his expression.. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI strangely felt like I could read Ayanokōji-kun's thoughts. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e‘The isolated card Morishita-san was holding was the Joker.’ \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI felt like he was looking at it that way. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Please choose as you like.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThat was why I felt a bit guilty and couldn't choose from the four. I just pulled out the isolated card. \u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p212\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-212_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 230\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN\"\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-212_2.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"Image 231\" /\u003e\u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p213\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-213_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 232\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen I turned it over. . that card was indeed the Joker. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI was a bit shocked, but more than that, I felt relieved. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI felt validated that what I sensed from Ayanokōji-kun wasn’t wrong. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI continued to enjoy the game after that. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSchool life, where I could spend precious time with friends I couldn't have imagined when I first enrolled. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSpending precious time with the person I cared about. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eMemories I wanted to remember forever. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI couldn't help but wish that this school life would continue for even one more day. \u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p214\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-214_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 233\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSae Chabashira’s Short Story: \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe Student in Front of Me \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAFTER SCHOOL, the one-on-one meeting with Kōenji Rokusuke ended, and the career counseling room fell silent. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Phew..  Kōenji is such a troublesome student.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe conversation wasn't making sense, and the sections that the teacher was supposed to fill in were a mess. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI sighed, staring at the tablet screen that I wanted to look away from. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHis career aspiration was to be a free person, he didn't need human relationships, his only concerns were about improving his own body, and so on. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“If I submit this, who knows what the higher-ups will say.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut I couldn't just rewrite it and lie. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eMy only option would be to submit it with some minor modifications to the wording. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“If only Kōenji was the only oddball, it would be easier for me. .” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe last one left was Ayanokōji, who could be equally as troublesome as Kōenji. Honestly, I couldn't imagine what kind of one-on-one meeting it would be. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAs I was adjusting Kōenji's profile, there was a knock on the career counseling room’s door. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Excuse me.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWith that serious tone, Ayanokōji entered the room. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You're finally here. Have a seat.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI switched from Kōenji's profile to Ayanokōji's, displaying a blank list. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI wondered how much of this would be filled in during the upcoming meeting. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“You seem busy.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“As a homeroom teacher, I can't help but be busy during this time. But I feel a little better knowing that the two-person interviews will be over today. It was a good decision to leave the two oddballs for last.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eFirst, I instructed Ayanokōji to sit down, facing each other. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Two oddballs, you say?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What, are you shocked to be treated on the same level as Kōenji?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eTheir personalities were completely different, but there was no doubt that they were both oddballs. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'd be lying if I said I didn't think anything of it.” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p215\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-215_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 234\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Do you think Kōenji is more of an oddball? Well, I can understand why you'd think that, but to me, there's not much difference. You're quite the oddball yourself.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eOne thing was for certain, he didn't want to be compared to Kōenji. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Well, I don't have many opportunities to talk with each student. Before we talk about your future plans, let's talk about your school life. If there's anything you want the school to improve, I'd like to hear it.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I don't have anything in particular. As an individual, I'm satisfied.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I see. Do you have any trouble in your relationships with friends, or anything you want to consult about?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I don't.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHe was definitely an oddball. Unlike Kōenji, he was concise and efficient, but like Kōenji, he lacked substance. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Most students give one or two opinions, or at least show some sign of thinking, even if they don't have any. I don't think you're holding back.. ” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI tried to draw out as much as I could as a teacher, but Ayanokōji's responses didn't waver. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I actually don't have any complaints.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Well, if that's the case, it's fine. . but you really don't have anything?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“There's nothing. I'm satisfied with my school life and there's no particular trouble.” \u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p216\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-216_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 235\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN\"\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-216_2.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"Image 236\" /\u003e\u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p217\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-217_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 237\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I see. . Well, that's very good.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Chabashira-sensei, you've changed quite a bit too.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eMy hand, which had been typing on the tablet, stopped. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI felt as if Ayanokōji was interviewing me, which was strange. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I don't think I've changed. But I might’ve become more honest than before.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eThe student in front of me is a whole generation younger than me. Yet, why\u003c/i\u003e \u003ci class=\"calibre3\"\u003edoes he sometimes seem like someone who’s lived as long or even longer than me? \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt took courage for me to accept this feeling. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIf someone was in trouble, I would lend a hand, and if someone was wrong, I'd correct them. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eA teacher's gaze upon the children in the class must always be equal. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut... \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAyanokōji would casually cross that boundary. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThere were times when I felt like I wanted him to know my weaknesses. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThough, this was originally the feeling that we wanted students to have toward their teachers. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“. . Anyway. If there's anything you're concerned about in your school life, don't hesitate to tell me.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI cleared my throat to dispel unnecessary thoughts. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe person in front of me now was an important student. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNothing more, nothing less. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I'd like to know whether you're hoping to go on to higher education or get a job. If you've made up your mind, please tell me.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI decided to move the conversation forward to distract myself from that strange feeling. \u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p218\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-218_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 238\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAi Morishita’s Short Story: \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003ePlease Listen in My Stead \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eTHE EXCHANGE MEETING was already on its third day. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI was keeping my eye on Ayanokōji Kiyotaka to track Hashimoto Masayoshi's movements, and by chance, we happened to be in the same group. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eYet, I was having trouble because I couldn't get any information. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI wondered if those two had connected. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eHave they decided to team up, or is it just me needlessly worrying? \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI wanted to know. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNot to protect Sakayanagi Arisu, nor to protect Class A. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI did it for myself. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAnd to satisfy the approaching needs for esteem. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eSurely, detectives who came across murder scenes must’ve been fighting such impulses every day. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“It's almost time for the exchange meeting.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI heard a voice from behind. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Morishita?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWhen I didn't respond, my name was called. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eBut I ignored it and tried to pick up the voice from the part of the tree where I had placed my hand. \u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p219\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-219_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 239\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN\"\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-219_2.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"Image 240\" /\u003e\u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p220\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-220_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 241\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Could you please be quiet? I was listening to the voice of the forest.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI shook off the disturbance from behind and focused my attention. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“. .Huh? The voice of the forest? What is that?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eHow noisy. \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIt seemed he fell into the trap I set, but he was a bit of a nuisance right now. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Don't you understand? The forest is alive.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eI continued to give a simple explanation. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“If you touch a large tree like this, close your eyes, calm your mind, and listen, then you might understand what I'm saying.” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“...I see?” \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eIt seems he didn't get it. \u003c/i\u003e \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eWell, that was fine. It seemed I'd successfully lured him out. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAyanokōji Kiyotaka was a very interesting existence. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNo matter how close I got, I couldn't see his true nature as a human being. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eThe line between how much was serious and how much was a joke wasn’t clear.  I wanted to know. I wanted to know more about him. I couldn't help but want to know. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003ci class=\"calibre3\"\u003eLet's have him listen to the voice of the forest instead of me. \u003c/i\u003e \u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p221\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-221_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 242\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eRoyalMTL’s Afterword \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHey there everyone, Cast here again. I’ll jump straight into it by saying that this volume definitely turned out well. There were some points in the story that didn’t sit right with me like the fact that Horikita and Ibuki’s fight with Ichika was done off screen, or the lack of detail surrounding Kiyo and Nagumo’s match. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eNevertheless, this was still a very good volume all around and I want to give a massive thank you to my team for helping produce the best quality translation that we could under the circumstances for this volume. As some of you may have noticed, the digital version of the Japanese release for Volume 11 came out about a week later than usual. This did throw some holes into our schedule for the translation but luckily, we were still able to complete it in a timely manner for you all. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eOnce again, thank you so much to the author, Shogo Kinugasa, for writing this series. Everyone, please consider buying one of the official copies for Classroom of the Elite so that we may be able to support the author even more. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eIn his postscript, Kinugasa seems to be dealing with some health issues so let’s all hope for his speedy recovery. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eHope you guys enjoyed this volume and thank you for your continuous support! \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eKeep checking in on our website to be updated on Classroom of the Elite translations and consider joining our discord events and early access! \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e-Cast (Translator) \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca href=\"https://royalmtls.com/\"\u003ehttps://royalmtls.com/ \u003c/a\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca href=\"https://discord.com/invite/royalmtls\"\u003ehttps://discord.com/invite/royalmtls \u003c/a\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eAlso follow us on Twitter for updates and potential leaks. \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca href=\"https://twitter.com/royalmtls\"\u003ehttps://twitter.com/royalmtls \u003c/a\u003e\u003c/p\u003e\n\n\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p222\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-222_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 243\" /\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eCredits \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eYasaseru – Japanese Reader\u003cb class=\"calibre6\"\u003e \u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“They didn't let me cook enough on the TL Notes..  but what's more important is how Kinugasa ruined Ichika \u0026amp; Arisu's characters even more. .” \u003c/p\u003e\n\n\u003cp class=\"P_Prose_Formatting\"\u003eD3nj4l – Japanese Reader \u003c/p\u003e\n\n\u003cp class=\"P_Prose_Formatting\"\u003eDoSomething – Editor \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Huh? Ichika v.s. Hori/Ibuki happened? When? Where? Who even is Ichika?” \u003c/p\u003e\n\n\u003cp class=\"P_Prose_Formatting\"\u003eSuperSkillz – Editor\u003cb class=\"calibre6\"\u003e \u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“What did I get hyped up for… I'm about to start endless yapping if I continue ranting” \u003c/p\u003e\n\n\u003cp class=\"P_Prose_Formatting\"\u003eUnknown – Editor\u003cb class=\"calibre6\"\u003e \u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“I can feel Kinu cooking something big” \u003c/p\u003e\n\n\u003cp class=\"P_Prose_Formatting\"\u003eSpoopykay – Editor\u003cb class=\"calibre6\"\u003e \u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Shit better be fire next volume or this fr turning into lobotomy kaisen.” \u003c/p\u003e\n\n\u003cp class=\"P_Prose_Formatting\"\u003eMeyobos – Editor\u003cb class=\"calibre6\"\u003e \u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“JJK manga is popping off hard rn Yuta is the GOAT, also shout out to my fellow TL team members.” \u003c/p\u003e\n\n\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003ca id=\"p223\"\u003e\u003c/a\u003e\u003cimg src=\"/hola-lector-agua/images/books/y2v11/index-223_1.png\" loading=\"lazy\" decoding=\"async\" alt=\"Image 244\" /\u003e\u003c/p\u003e\n\n\u003cp class=\"P_Prose_Formatting\"\u003eKall_tho – Editor\u003cb class=\"calibre6\"\u003e \u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Hail the glorious king Ayanokoji… ‘Put Chabs back in the bunny suit’ - \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003eMeyobos” \u003c/p\u003e\n\n\u003cp class=\"P_Prose_Formatting\"\u003eBudos – Editor\u003cb class=\"calibre6\"\u003e \u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Please be kind to each other. RIP Hana Kimura 5/23/2020.” \u003c/p\u003e\n\n\u003cp class=\"P_Prose_Formatting\"\u003eReito – Editor\u003cb class=\"calibre6\"\u003e \u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“After reading Hiyori SS, I think that bookworm might even be more relevant than I had originally considered her to be.” \u003c/p\u003e\n\n\u003cp class=\"P_Prose_Formatting\"\u003eAsh – Editor \u003c/p\u003e\n\n\u003cp class=\"P_Prose_Formatting\"\u003eSnOrT NeSqUiK™ - EPUB Maker  \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Brug #3” \u003c/p\u003e\n\n\u003cp class=\"P_Prose_Formatting\"\u003eZF - Illustrator\u003cb class=\"calibre6\"\u003e \u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“ʍɥɐʇ ıs ƃoıuƃ ou ıu ʎ2ʌ11¿” \u003c/p\u003e\n\n\u003cp class=\"P_Prose_Formatting\"\u003eReversi – Illustrator \u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e“Ichika Goddess… Akira Toriyama R.I.P.” \u003c/p\u003e\n\n\n\n\n\n\u003cstyle\u003e\n    body {\n        color: #e5e5e5 !important;\n        background-col
