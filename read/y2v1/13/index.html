e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T1e713,"])</script><script>self.__next_f.push([1,"\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 7:\u003cbr/\u003eExpulsion Approaches\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT WAS NOW\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e just after eight thirty in the evening on Sunday. The day Nanase had chosen was finally here, and it was highly likely that the discussion we would have tonight would determine whether we could work with Class 1-D. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, no. We needed to make \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003esure\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e we could work together. Most students outside both our classes had already found partners. If we couldn’t come to an agreement, we might be forced into making some rather major compromises to avoid being hit with penalties. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was decided that me and Horikita would handle this discussion, with Sudou accompanying Horikita after he strongly requested to join her. I was sure he did just want to be around Horikita, but also that a big part of his reason for doing so was that he was wary of Housen. Depending on how things played out, Housen might very well raise his hand against a woman without batting an eye. So Sudou was there to be Horikita’s bodyguard, to protect her. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita protested of course, saying she didn’t need him there, but Sudou insisted. This time around, though, Horikita didn’t actually give Sudou permission herself, no matter how many times he asked. These negotiations were expected to be just that serious, and she had decided Sudou’s presence would be a hindrance.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, I made her reverse her decision. The reason I gave was that Sudou could act on my behalf, in the unlikely event something unforeseen occurred and things got dicey. Sudou’s abilities should be more than enough to keep the situation in check. In the end, Horikita gave Sudou permission to accompany her, on the condition that he absolutely not lose his temper during the discussion and not threaten anyone.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I went down to the dormitory lobby to meet up with him, Sudou was already there, sitting down on the sofa, waiting. He smiled cheerfully and happily at me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yo!” he shouted.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eActually, I should make one small correction to what I said before. It seemed like he didn’t just want to be with Horikita. He \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ereally \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ewanted to be with her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are your studies going pretty well? For the test?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Course, man. Still won’t be great, but I’m thinkin’ I\u0026#160;should at least get two-hundred-and-fifty points this time ‘round,” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Sudou, who currently had an academic ability ranking of E, got two hundred and fifty points or more on this text, that would be a fantastic achievement. I was sure his rating in the OAA app would probably jump up to somewhere around C starting next month. Sudou wasn’t just all talk, either. He was putting in enough effort that his claims were backed by confidence. He was arriving at class late far, far less frequently, and demonstrating a good attitude \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ein\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e class, taking his studies seriously.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seems like you’ve changed a lot… It’s like you enjoy studying now or something,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it ain’t really like I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003elike\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e it or anythin’. But it is pretty fun solving problems. On top of that, when Suzune compliments me, I feel like I get so amped up that I could just study and study all the time.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe prickly, snappy attitude he had when he first started school here seemed to have calmed down. It did seem like his tendency to quickly lose his temper wasn’t going to be so easy to fix, but if Horikita’s presence was enough to keep him grounded, that was good enough. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou stood up and looked at the screen showing footage from the camera inside the elevator, as if he couldn’t contain his excitement. Then he sat back down on the sofa, fiddling with his phone and with his hair. Shortly afterward, he stood back up again. He kind of looked like a young man who was about to go out on his first date.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Ayanokouji,” muttered Sudou, still looking at the camera footage. Maybe he had realized that I had been looking at him. “If I were to tell Suzune how I feel about her today, do you think she’d be, well, okay with me?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe expression on his face was visible, even as I looked at his side profile. He looked serious. Seeing Sudou look that way, there was no way I couldn’t give him an honest answer.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Probably not,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile that might have left him feeling dejected, those were my honest thoughts, looking at it as a third party. I had thought for sure he wouldn’t have been satisfied hearing that answer from me, but…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, you’re right.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou agreed with me without batting an eye, almost like he already knew the answer himself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know that Suzune ain’t the type of person to talk ’bout stuff like love and romance and all that. But it’s not just that, either… I mean, there’s no way she’d be attracted to me right now. How much trouble has my cockiness made for her? How many times? No, not just her—how many times have I made trouble for everyone in our class?” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe seemed to be saying that there was no way Horikita would date him after taking all that into account. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And yeah, I’m really tryin’ my best now and all, sure. But I don’t think that cancels out all the burdens I put on our class or anythin’, of course. So over the next two years, I’m gonna work on improvin’ my strengths, and also on fixin’ my weaknesses, little by little. If I do all that, then I’m sure that by the time we graduate, I’ll have been useful to our class,” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Yeah, you might be right about that.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou could definitely become a valuable asset to our class, thanks to his exceptional physical abilities. I was sure he could come to be an essential part of our team, like Yousuke and Kushida. He’d also grown to be able to look at himself calmly and objectively, which was precisely why a question came to mind that I wanted to ask him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, so what if you put in a lot of effort and become the most admirable, exemplary person in our class…but even then, Horikita still doesn’t look your way. What would you do then? Would you start to hate stuff like studying?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was the possibility someone could fall apart when they learned all their efforts had been for naught. That was particularly possible in Sudou’s case, since he was putting in all this effort \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003efor\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah, I’m sure I’d wanna just stop everything, y’know? I mean, I’d probably even feel like I wanna die. Maybe I’d even want to go out and punch somebody. But if I actually went out and did any of that stuff, I’m sure Suzune would be real disappointed in me. I mean, givin’ up on studying, going on a rampage? That’d be super lame. I definitely don’t wanna do any of that, no thanks,” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAn excellent response. I was sure he really believed it, too. Of course, the real truth of his words would be tested when that situation became a reality. No matter how much you claimed you were resolved to handle being faced with a negative outcome, chances were good you’d feel differently once the pain actually hit. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut that being said, if he was able to say all that right now, at this point in time, then there probably wasn’t anything for me to worry about for the time being.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, looks like she’s here!” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe camera showed Horikita getting on the elevator. Sudou must have been feeling restless or something, because he walked away, turned his back to the elevator door, and started taking deep breaths while stretching his arms out in an effort to calm himself down, like he was doing warm-up calisthenics or something.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShortly afterward, the elevator arrived at the first floor. Sudou was still taking deep breaths.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry to have kept you waiting. What is Sudou-kun doing?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks like he’s taking deep breaths,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita had a puzzled look on her face for a moment, but she quickly went back to her usual stiff expression. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe were going to meet up in one of the karaoke rooms in the Keyaki Mall today. On both regular weekdays and on weekends, these were popular places for people to hang out late into the night, since we were allowed to use those rooms until 10 p.m. Karaoke was, of course, one of the recreational facilities we had on campus. It was often used for things like stress relief or to chat with friends. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut at this school, it had another major purpose. The rooms were private, which made them terrific locations to have detailed discussions, without running the risk of being seen or heard by others. They were the easiest places to have secret meetings on campus without being noticed. Of course, in terms of confidentiality alone, nothing beat the privacy of one’s personal room in the dormitory. But you were inevitably limited to only being able to meet certain people that way.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith the exam coming up next week, there didn’t seem to be that many people around at this time of day. So you could say this was the best time to meet with Housen in secret and have a discussion.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, are you really sure we can get that cocky new kid to help us out?” asked Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wouldn’t have spent so much time on this if I didn’t think we could make a cooperative relationship work,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eExactly. It was precisely because we had determined it was possible that we were here today.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At this current point in time, many of the gifted first-year students have been taken by Sakayanagi-san and Ryuuen-kun. And Ichinose-san has offered herself up, providing salvation for the weak. The only weapons in our arsenal are points or trust,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Guess you’re right, yeah… We ain’t gonna beat Sakayanagi or Ryuuen in points, and we ain’t beatin’ Ichinose when it comes to trust,” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Precisely. Which is exactly why Housen-kun presents both an opportunity and a problem for us.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHousen wouldn’t be swayed by the appeal of Class A’s reputation, nor by some paltry sum of Private Points. And he wouldn’t so much as even notice Ichinose’s offer of salvation. Which was why we, Class D, had a chance. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, the point is seein’ how much we can push them into makin’ a deal with us, without havin’ to make too many compromises on our end,” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Right. The more time that passes, the more it’ll be us second-years who start to panic. With so many students having already found partners, we’ll be at an unavoidable disadvantage.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf we declined the terms Housen presented us with, he’d show no mercy. He’d simply change plans and let us end up getting paired with people at random. He didn’t care whatsoever about his own classmates being penalized. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was interested to see how Horikita intended to challenge him.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e7.1\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003e“H\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eEY, UH\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e come to think of it, ain’t the meetin’ at nine? Aren’t we kinda early?” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was still well before nine now. We had about thirty minutes until we were scheduled to meet.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s all right. I just wanted to get there ahead of time,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou didn’t quite understand Horikita’s reasoning on that, but he kept quiet, and followed along. I wondered if Horikita wanted to come early to have time to calm herself, or because she was wary there might be some kind of trap? While Sudou seemed to think of our opponent as just a new kid, Horikita showed no signs of dropping her guard. It might seem like she was being cautious to the point of excess but considering that this was Housen we were dealing with, I supposed you couldn’t criticize her for being careful. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe got a slip of paper with a room number and reservation information from the employee at the reception desk, then went on inside.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Could you please let Nanase-san know that we’re here?” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Got it,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI sent Nanase a message, basically telling her that we had already arrived. As expected, she replied saying they would arrive at the time we had planned on.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s go ahead and order our own drinks, then,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shouldn’t we wait for ’em?” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s fine.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter each deciding what we wanted to drink, we looked at the food menu next.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can go ahead and order, if you’d like anything. What do you want?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, fries, I guess. Is that okay?” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita, using the landline phone installed in the room, ordered the food and drinks that we had wanted. After we placed our orders, Sudou seemed to be a little less tense. He picked up the microphone.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, um, well, I think we got some time until we’re supposed to meet. How about a song or two?” he said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not going to sing,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, really, you’re not?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe had arrived at the karaoke room early, before the meeting, and had ordered food and drinks. I supposed Sudou had assumed the next step would be to start singing, since that was typically how things went at a place like this. He looked disappointed now, probably because he’d wanted to hear Horikita’s singing voice.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sudou-kun. I’m warning you once again. Do not say anything unnecessary,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I got it, yeah. But hey, shouldn’t you tell that to Ayanokouji, too?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He doesn’t speak more than necessary. Actually, if anything, he’s the sort of person who doesn’t speak even when he should,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, that was far from a compliment. She was just airing her grievances about me. Sudou pouted, seemingly not too happy with the answer Horikita had given him. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen it was time for our meeting, the first to arrive was Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry to have kept you waiting,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Outta the way, Nanase,” huffed Housen Kazuomi from behind her, forcing her to walk further inside.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, you’re right on time. And here I was sure you’d be really late,” said Horikita, suggesting she wouldn’t have been surprised if he’d arrived late on purpose, just to irritate her. Rather like how Miyamoto Musashi had arrived late to his duel on Ganryu-jima.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, I’m always on time when I decide I’m gonna go somewhere. And I don’t like folks who give me a hard time just because I’m a little late. Anyway, looks like you got here pretty damn early… What, did you really hate the thought of waitin’ for me that much? Come on, don’t be so nervous,” teased Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can you please not let your imagination get the better of you? Don’t misunderstand. We were simply enjoying ourselves, since we came all the way to karaoke. Understand?” said Horikita, telling Housen that he needed to broaden his mind.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUpon the table were some partially consumed drinks, and half-eaten food. She had staged the scene to look as though we’d been having fun at karaoke right up until the last minute.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks that way,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhich meant that the negotiating had already begun.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, whatever. I’ll find out whether you’re bluffin’ soon enough, when we get to talkin’,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe plopped down hard on the couch, as if he were some kind of big shot, so much so that it was difficult to\u0026#160;imagine he was a new student. He spread his legs wide, taking up enough space for three people all by himself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, so? Nanase explained everythin’ to me. She said you wanted my class to help you out,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eMy\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e class, he said. From the sound of it, Class D was already completely under Housen’s control, then. It had only been a couple of weeks since school had started, but I sensed no weakness in his statement.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not exactly. What I’m saying is that our two classes will work together. No one will be above or below the other. We’ll be on equal footing,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That so? So, you’re not bringin’ up the fact that you’re one grade level above us then, huh. Gotta say, not patronizin’ us, that’s a wise choice.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase quietly observed what Housen was saying and doing. She didn’t speak up or refute any point in particular. Considering she’d been playing the role of mediator, and the fact that she was the sole person he’d brought here with him, we could probably be certain Nanase was someone Housen valued. I wasn’t sure if that was because he admired how she had the guts to say she wouldn’t give in to Housen’s threats of violence, or if there was something else. In any case, there was a way for us to cut right through and force Nanase over to our side.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand there are still a certain number of students in your grade who don’t feel an intense sense of commitment to their peers, and wouldn’t think anything of it if their classmates got in trouble. However, you should begin to understand how things are after seeing us. There will most certainly come a time in the future when you will need the help of your classmates,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So…you’re sayin’ we gotta together to get through school without anyone gettin’ kicked out, huh?” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you really do have so much authority over your class that you view it as your private property, that’s actually rather convenient to this arrangement. With just one command, a substantial number of your classmates will follow, right?” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHousen brought his left pinky up, stuck it inside his left ear and started twisting it around a bit. Then he removed his finger and held it up, pointed it at Horikita, and blew off what was on it in her direction. Sudou’s face tensed up, but he remembered Horikita’s warning, and kept himself in check. His clenched fists were shaking as he held them down on his lap. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita simply endured Housen’s openly vulgar conduct, without turning away. “Can you please stop?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, so, in the first place,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed what she’d said just went in one ear and out the other, because he started speaking as though he were talking to himself. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s fair to say that you’re the leader of Class 2-D, right?” said Housen. He was now rewinding to check for weaknesses in the very premise of this discussion.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You could interpret it that way,” replied Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think there’s anything strange about Horikita-senpai being the leader, considering her abilities,” said Nanase, addressing Housen. That was the first time she had opened her mouth during this entire conversation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, then, I’ll give the leader here a warning. I\u0026#160;sure as hell ain’t planning on working with you under this so-called ‘equal footing’ garbage or whatever,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed he wasn’t going to make things that easy, after all. I supposed there was no avoiding the disparity between us. We wanted to protect our classmates no matter what, whereas Housen didn’t really care one way or another about tossing his to the wolves. The relative severity of the penalties we faced were also worlds apart, with us facing expulsion and them losing out on three months’ worth of Private Points. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That sounds about right. You are that kind of person, I suppose,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you know that already, then out with it. Stop being such a penny pincher. I’ll hear you out if you’ve got a good offer for me,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ll hear me out? What exactly are you expecting? Do you seriously think we’re going to pay you to get you to help us?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though we were in a disadvantageous position, Horikita didn’t budge an inch nor make any compromises. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, you’ll pay. You will. Because hell, you can’t really \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003enot\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e pay, can you? Nanase, water,” barked Housen, ordering Nanase around while he looked over the karaoke menu.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase nodded, picked up the phone, and ordered some water from the reception desk.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I realize that I’m repeating myself here, but our proposal is one of equal partnership. In any case, we’re absolutely not going to hand over money, goods, or any other form of compensation to you in return for this,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, guess that means I’ll be headin’ on back without gettin’ my drink of water then, huh?” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWithout any hesitation at all, he slapped his thighs once, indicating to us that he was leaving.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please wait, Housen-kun. I think we really ought to hear what Horikita-senpai has to say.” Nanase, who was still standing next to Housen and listening in on the conversation, stopped him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hear what she has to say? Yeah, ain’t no need,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, we do need to. At this rate, our class will never be able to come together as one,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita examined Housen and Nanase as they had their brief exchange of words, not moving. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, and who cares? Anyone who can’t follow orders might as well be tossed out with the trash. I ain’t exactly gonna shed a tear if we get rid of the wimps,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That is not okay,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nanase. You a total moron or somethin’?” replied Housen, letting out a deep sigh. He sounded more exasperated than angry. “There just ain’t any advantage to us acceptin’ their terms outright.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand what you’re trying to say, Housen-kun. It is certainly true that Horikita-senpai and her friends are desperate to protect their classmates, and I’m sure they have good reasons for doing so. If we don’t offer them a helping hand, students will be in danger of being expelled. Even if they’re putting up a strong front right now, eventually, they’ll have to make some concessions. That’s what you’re waiting for, isn’t it?” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt didn’t sound at all like Nanase had interrupted the conversation because she didn’t know what Housen was doing. She knew. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen, she continued speaking. “I don’t think your strategy is a bad one, Housen-kun. While the other classes looked for partners, you deliberately chose not to make a move, deciding to forego the early initial negotiations. All to put yourself in a more advantageous position, to give yourself more bargaining power.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs the deadline loomed closer and closer, the more impatient the second-year students would become. Even students who normally wouldn’t be worth paying for would come to be valuable.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you get what I’m doin’ here, then how about you try explainin’ to me the advantage of throwin’ Horikita a\u0026#160;bone? What’s in it for me?” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That would be a relationship built on trust,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe looked over at Horikita, who nodded back to her in response.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, don’t make me laugh. A relationship built on trust? That’s useless bullshit. Just flowery words.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you really sure about that?” Nanase directly rebutted Housen’s response to the idea of a relationship built on trust. “It’s certainly true that we may not need to make many concessions ourselves in this special exam. However, we cannot be sure the same will hold true in the future. If you make all the second-year students your enemies, Housen-kun, you may end up in the unfortunate situation of not being able to find a partner yourself, no matter how many points you have. And while you might be fine if the only penalty was points, what do you think would happen if the person you were partnered up with intentionally scored poorly? Expulsion would be unavoidable.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hah. You seriously think there’s somebody out there who’d go that far to take me out?” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know, I’ve heard this school apparently has something called Protection Points,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe looked away from Horikita and shifted her gaze towards Housen for the first time that evening. She’d brought up the very thing that I had mentioned to her back in the library during our conversation on Friday. Although Horikita was a little surprised, she quickly grasped what was going on, and nodded.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, that’s right. They’re a unique kind of point that can cancel out an expulsion, just one time,” she said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJudging from the look on Housen’s face, there was no doubt this was the first time he’d heard of it. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s no wonder you don’t know about them, since you only just enrolled. Which is why you should really make a point of remembering them. When a test similar to this comes up in the future, if the person you’re partnered with happens to have a Protection Point, then… Well, depending on how things play out, you could most definitely, unavoidably, be expelled,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe more enemies you made, the more likely that scenario would become. And the more someone hated Housen, the more forceful they would become in their attempts to get Housen expelled.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Which is precisely why I think we need to work on building a relationship based on trust, starting now,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Looks like you came prepared to try and boss me around with this stupid bullshit, huh?” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I am a first-year student. So naturally, my top priority is Class 1-D. And because I recognize that you are a necessary component of our class, Housen-kun, I don’t want to see you make the error of looking only at the short term,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita had made sure she had the measure of Housen before she set her sights on Nanase. Then, after getting Nanase to cooperate with her in splendid fashion, they delivered a blow to Housen. We’d been in a tough situation, but things were starting to turn around for us. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAll that remained was to see how Housen would respond, now that he understood. Namely, to see if he’d still try to wring some compensation out of us, resolved to face whatever consequences it might spell for him later.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sounds like you really racked your brains on this one, whoo boy. But, sorry to say… I still ain’t planning on any kind of equal partnership,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase and Horikita had laid out our argument to get him to say yes. But Housen shook his head and declined without even pretending to give it any thought.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Housen! Dude, are you seriously ready to just go ahead and make enemies out of all us—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou was just about to lash out, but Horikita held out her arm, stopping him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He hasn’t left the negotiating table yet,” she said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, she’s right. Don’t go jumpin’ to conclusions now,” said Housen, replying to Sudou. He remained planted firmly in his seat, cocksure and bullheaded as ever, making no pretense of leaving.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But what do you intend to do, then? We aren’t going to change our stance. We’re asking for an equal partnership,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I’ve seen enough to know that. I’ll give you credit, you got guts, lady.” Housen clapped his hands five times, apparently in a show of admiration of Horikita’s tireless efforts. “But that bein’ said, this whole equal footing thing… I can’t really believe it’s all that equal.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So if we can offer you proof that it \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eis\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, you’ll work with us?” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, somethin’ like that, maybe,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m afraid that doesn’t quite add up. We would both be operating under the same conditions. What reason do you have to feel that it wouldn’t be equal?” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re sayin’ all this stuff about a relationship built on trust, but trust goes both ways, don’t it? That don’t mean I should just be grateful and take whatever you’re dishin’ out. The fact that you’re suggestin’ that our class could be in a similar situation next year? That we could be in trouble? Yeah, that’s somethin’ I should be \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eso\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e grateful for, honey. I’m tearin’ up over here. But that’s just a self-serving prediction for your benefit. It ain’t an absolute certainty of somethin’ to come in the future,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHousen certainly had a point. Horikita’s proposal was built on the fundamental premise that we would be supporting one another. However, our class was the one that was looking for help right now. The idea was that in exchange for their help, when the time came that they needed something, we’d help them out. In that sense, it was like an insurance policy, so to speak. And there was a good chance they’d never actually have to use it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose. Well, if you’re going to go that route, why don’t you tell me what you’d like, then? Just for reference,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hand over a million Private Points to me as collateral. Then, if we ever are in trouble and come to you guys for help, I’ll gladly pay you back in full,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was actually a fairly reasonable sum, considering the number of points we’d spend dealing with other classes. However, if his class never actually used the insurance policy, that meant we’d basically be handing over a million points for nothing. In short, that meant all those points would end up in Housen’s pocket.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, if this whole relationship built on trust or whatever is going to be so important in the future, like you say it is, then that ain’t too steep a price, no?” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut if his class really \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e come seeking our help sometime, we’d get the million points back.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If ya need, I can put it in writing. How ’bout it?” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf we put the agreement in writing, the legitimacy of the deal would be recognized by the school, who could enforce it. But this was all built on the premise that Housen would come looking for our help eventually. It was possible Housen might invoke the agreement if he were in danger of being expelled himself, but I doubted he’d give up those points to help out his classmates. Which made this more dangerous than handing over points and signing contracts on an individual basis. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHousen had hit us with a good counter. Apparently, simply being good in a fight wasn’t the only thing he could boast about. He was a skilled negotiator, a formidable foe who could be quite conniving, just like Ryuuen. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s true that what you’re saying isn’t entirely unreasonable. However, I cannot accept your terms,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see, I see. Well, that’s too bad. Here I gave you a nice, easy way for us to resolve all these issues, and you go back to playing hardball,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems that way.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, Horikita had no intention of giving in and agreeing to a cooperative relationship if that meant letting Housen reap all the rewards himself. But that meant that we’d end up having partners decided at random, which, in turn, meant we’d have to do our best to mitigate risk by getting our poorer students partnered with the other classes, even if that meant throwing money at the problem.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHousen let out a short laugh.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHa!\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe leaned forward on the sofa, moving from his seated position for the first time since he sat down. Then, he reached his large arm out and grabbed Horikita by the collar of her shirt. The first to react to this was Sudou, who had been standing watch right beside Horikita. He grabbed Housen’s thick arm forcefully and give him an intense glare.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey… Don’t you think about layin’ a hand on a girl,” snarled Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh ho. What, now it’s the idiot’s turn, huh?” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Calm down, Sudou-kun,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But…!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s all right. The negotiations aren’t over yet.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt might have appeared like negotiations had broken down, but it was also true that the words “I’m done negotiating” hadn’t actually passed Housen’s lips yet.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Man, you got a confident look in your eye. Do you seriously think I won’t raise a hand against a chick? Or do you think that you can beat me, by using your social standin’ as a woman or somethin’?” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To think that someone would actually talk that way in this day and age, my goodness. Why don’t you try to rein in that misogyny a little?” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, how’s about I give you a better option. If\u0026#160;you can really work me over in a fight and get me to say uncle, I’ll agree to your offer for an equal partnership, no strings attached. Whaddya say?” replied Housen, making a rather ridiculous proposal.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“’Kay, then. In that case, I’ll step up and fight you. You ain’t got a problem with that, do ya?” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hell, sure, Sudou can fight me. Even that weirdo Ayanokouji over there, lookin’ at me with this blank face and all—he can, too. Or even you, Horikita. I’d welcome fightin’ you with open arms,” said Housen. “Actually, if you want, I’ll take on all three of ya at once.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sounds good to me, Horikita. If I win, we’ll get that contract made… And besides, I’m already sick to my stomach dealin’ with this guy.” Sudou was clearly reaching the limit of his patience with Housen, who still had his hands on Horikita’s collar and hadn’t let her go.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Determining whether or not we enter into a cooperative relationship based on a fight? That’s completely absurd. Even if that was the only bargaining chip we had in this negotiation, we still shouldn’t take it,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why not though? I mean, if this Housen guy says he’s fine with it, then there ain’t no problem,” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita ignored Sudou, and then quietly spoke her mind, telling us her thoughts on the matter.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I really thought you’d be a little smarter than this, Housen-kun. That time you first showed your face on our floor, I picked up your intentions from what you said. You said you were willing to join forces with our class, and I agreed with that sentiment. I thought it would be wonderful if we could work together, forming a partnership, class to class,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah, guess I might have said somethin’ like that,” he replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But… That was just a misunderstanding on my part. You weren’t actually thinking anything of the sort at all,” said Horikita. She briefly closed her eyes and let out a deep breath, before continuing, “These negotiations are\u0026#160;over.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t Housen who signaled the end of these talks, but rather Horikita herself. Up until this point, Housen had seemed to be enjoying himself quite a bit, but the moment Horikita said we were finished, anger flashed across his face. He let go of his grip on Horikita’s collar. Seeing that, Sudou went to sit back down, holding in his\u0026#160;anger.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd in that next moment…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSplash!\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Water flew across the room. Housen had picked up a cup in his large hand and splashed its contents right in Horikita’s face. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita could never have predicted this happening. Before she could even utter a single word, Sudou lunged at Housen, almost jumping over the table.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Son of a bitch!” snarled Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe’d already been pushed to his limits, desperately trying to keep his feelings in check. But when Horikita got splashed with water, that completely overrode any rationality he possessed. It seemed Housen was going to carry on behaving the way he always did, making fun of other people right to the very end. No one could blame Sudou for getting angry after seeing the girl he liked be humiliated.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Stop!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was none other than Horikita who stopped Sudou in his tracks, the instant after he bellowed loudly with rage. If she had been even a single second later, Sudou’s fist would have collided with Housen’s cheek.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sudou-kun… Don’t thoughtlessly play into his hands,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I know, but still!” he shouted.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita looked at Housen, not even bothering to dry her wet hair. “If you’re upset about the fact that negotiations have broken down, then perhaps you should have conducted yourself a little better.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe’d wanted to establish a cooperative relationship with Housen, no matter the cost, for the sake of our class. Had she determined pressing the matter any further was ultimately not worth it, then? \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHousen kept his eyes locked on Horikita, but she looked away, as if to say that she had seen enough.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s go,” she said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A-are you sure?” Though clearly frustrated, Sudou asked to make sure.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you really okay with this, Housen-kun?” asked Nanase, checking with Housen at almost the exact same time that Sudou asked his question.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?” replied Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think we should have agreed to work with Horikita-senpai,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHa!\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Hey, they’re the ones who walked away from the negotiatin’ table. I ain’t gonna meet them halfway,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHousen and Nanase didn’t protest Horikita bringing the negotiations to a close, but accepted that we would be going our separate ways. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI shot a sidelong glance at Horikita to see how she was doing. The fact that our negotiations had failed was a great setback, but from what I could tell of Horikita’s expression from her side profile, she didn’t seem disappointed yet. If anything, she looked like she wasn’t done. Like we were still in the middle of negotiations.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e7.2\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE THREE OF US\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e left the karaoke place after Horikita took care of the bill. It seemed that would be the end of it, but Housen and Nanase followed us. Sudou turned back to glare at them menacingly from time to time, but since we had to take the same route back to the dorms, it wasn’t like we could really complain about it. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps because he understood the situation now, Housen called out to us in a somewhat odd fashion. “Hang on.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no reason for us to wait. We’re already finished talking.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita gave him the cold shoulder. But Housen showed no sign of backing down. Apparently, Horikita’s all-or-nothing gamble had turned out to be a good move.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, it’s just like you said, Horikita. That day, I went out to meet your class. ’Cause I knew right away that at this school, Class D is the bottom of the barrel, the lowest of the low. And rather than let the other classes treat us like a joke, the quickest way to deal with ’em would be for us to work together, Class D to Class D,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe’d sent us a signal back then, just as Horikita had interpreted. However, whether he wanted to form the same kind of equal, cooperative partnership that was thinking of was an entirely different question.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So?” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So? Whaddya mean, so? Come on. What, you really okay with just lettin’ negotiations fall apart? You and I are alike, y’know. We’re leaders who thought up the same kinda thing. You get me?” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As you intend to keep making ridiculous demands, nothing is going to change,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re plannin’ on goin’ into this special exam as is, then? Leave things as they are, get partnered up at random, and get hit with the penalty?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. We are prepared to be penalized, if necessary,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt would be painful, for sure, but it wasn’t like this test was insurmountable. Thanks to the efforts of Kushida and some other people, we’d already started to secure the safety of the students in our class who were near E-rank and D-rank in academic ability.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, I gotcha. In that case, how about this idea?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough Horikita had said nothing about restarting negotiations, House just carried on by himself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll order everybody in my class to team up with ya. And you’ll hand over your points. Two million,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was far from a compromise. He’d reopened negotiations in aggressive fashion, demanding an even higher number of points than before.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Two million? Well, I suppose you’ve shown your true colors now,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, yeah, you can say whatever you want. But it’s the only way you guys can be sure to avoid gettin’ expelled. Most of the people in other classes have already settled on their partners and all. Come on, there ain’t nothin’ for you to gain by being a tightwad who won’t pay up. Or maybe you wanna be crushed by yours truly?” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt this point, we had arrived at the junction where the path branched off in two separate directions for the first-year and second-year dormitories. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita stopped and turned around to respond to Housen’s question.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Crushed? And how exactly do you plan to do that? You can’t intentionally score poorly on the test because of the rules, so you can’t get us expelled that way. Rules that you must follow, by the way. You don’t exactly have the courage to \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ebreak\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e those rules, do you? In that case, all we have to do is make sure teams get at least five hundred and one points, no matter the combination of students,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I ain’t gonna do it in such a roundabout way. I’ll crush you with \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethis\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e,” said Housen, brandishing his fist with a menacing smile.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Control through violence… I suppose there really are people everywhere who think like you do,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t care if you don’t like it. This is how I do things,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose so. In that case, it seems we may never be able to understand each other.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita started walking once more. Even at the very end—at the last possible minute—she wasn’t giving in. Or rather, I supposed I should say, Housen was the kind of opponent she \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecouldn’t\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e give in to. Because if she did, we’d never get the partnership she wanted.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hold it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What is it now?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I got it. I’ll keep what you just said in mind.” At the last minute, Housen said something we hadn’t expected.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you talking about?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, it’s only natural that you’ll try holdin’ onto the advantage in a negotiation as long as you possibly can, right?” He was basically admitting that he’d been trying to get Horikita to give in and compromise.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, are you saying that you’re agreeing to a completely equal partnership?” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Think of it more like our little chat’s about to go into overtime. Anyway, there’s a chance people might spot us talkin’ here. Let’s have ourselves a change of venue,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was almost ten at night on a Sunday now. Most students should have gone back to their dorm rooms, but even so, I supposed there was no escaping the fact that if someone did happen to come by, they’d be able to hear our conversation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even so, we can’t exactly take this inside the dorms,” replied Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn consideration of curfew, there were probably no suitable meeting places left for us tonight. But with time running out for both groups right now, this was a problem we didn’t want to put off any longer.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anywhere’s fine. Back at the dorms, anywhere, wherever. If we just have a little time, we can talk things out,” said Housen. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe looked so completely confident that Horikita wasn’t going to turn him down. She’d been hoping he would come chasing after her, even though she gave him the cold shoulder earlier.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Very well. You have ten minutes,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“C’mon, over here,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe led us over to the dormitory building used by the third-year students last year, which was now being used by the first-years. We went around to the back of the building, a remarkably dark and quiet place that was used for no other purpose other than disposing of trash. It was unlikely anyone would see us here.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, let’s continue where we left off, then. The terms we’ve set haven’t changed. Is that clear?” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, let’s see…” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHousen, after appearing lost in thought for a minute, briefly folded his arms. Then he immediately uncrossed them and held up the index, middle, and ring fingers on his right hand.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Three million. You guys pay me, and I’ll save all those friggin’ idiots you got right now,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter hearing his suggestion, everyone present, myself included, could only respond with stunned silence.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you talking about?” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWas this what it was like to feel completely exasperated? Even Horikita couldn’t help but let out a couple of sighs. We were supposed to be getting the negotiations back on track after they broke down earlier. But now Housen was asking for even more points than before. This defied all logic.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What, don’t you get it? I said I’ll work with ya for three million,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dude, stop screwin’ with us. We already told ya before that we ain’t handin’ over a single point!” shouted Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I ain’t screwin’ with anybody. I mean, I gave you another opportunity to negotiate with me, didn’t I?” He spoke as though he were the one who’d set up everything about these negotiations.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would appear…I made an error in judgment in deciding to listen to you,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe chance that Housen would make a reasonable decision had been a faint ray of hope for Horikita. But in the end, her wish wasn’t granted. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait. You really think ya can just leave?” snarled Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe smacked his fist lightly against the wall, putting on a threatening display.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What? You think that because we’re in a secluded location, you can solve things with violence? Your usual go-to?” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At the very least, I can beat you half to death. How ’bout that?” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Go ahead, do whatever you please,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe shook her head and moved to leave, probably because she didn’t think Housen would actually resort to getting physical. But Nanase, who had been standing next to him, turned her face aw
