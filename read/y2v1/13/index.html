ay slightly, almost as if she anticipated what was about to happen next. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHousen moved.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Suzune!!” shouted Sudou frantically, rushing over to Horikita and pulling her out of the way.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHousen’s foot whipped by the very spot Horikita had been standing in just moments ago. And then, suddenly, his gigantic form barreled down on her. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, wha—!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita realized Housen was seriously trying to hurt her, but she still couldn’t get her body out of the way. Sudou stepped in to protect her, catching Housen’s repeated blows.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Grh!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHa ha!\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e C’mon, show me how much you can take!” shouted Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fine by me! Bring it, chump! Any jerk who raises a hand against Suzune will get no mercy from me!” shouted Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHousen, laughing like he was having the time of his life, launched an attack on Sudou. And Sudou, already well past the limits of his patience, responded in kind.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what are you thinking…?!” shouted Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t surprising she was so upset about the fight that had just suddenly broken out in earnest. No matter how unmonitored this place might be, it would definitely be a problem if we were found. Forget suspension—we could very well be expelled.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita-senpai, perhaps the circumstances at this school have changed a little from how they were before?” said Nanase, watching this incomprehensible turn of events with a cold look on her face. “Similar to how you are intimately familiar with how things were last year, we new students understand the current situation better than you do.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean…?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A few representatives of the first-years were summoned to the student council room by Student Council President Nagumo, who explained the state of things to us in person. He told us that starting this year, this school was going to be more meritocratic. And therefore, the students would be given a greater degree of freedom,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you saying fighting is one of those freedoms?” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not what I’m saying. However, as far as Housen-kun was able to confirm, a certain amount of fighting between students is considered inevitable. And President Nagumo has promised he won’t be as harsh in his judgment as he was last year,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnlike Horikita’s older brother, Manabu, Nagumo had a much more permissive mindset when it came to fighting. The student council acted to mediate disputes between students, so if it was true they intended to allow a certain degree of fighting, this incident was much less likely to cause trouble. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile Horikita and Nanase talked, the match between Housen and Sudou was quickly coming to a head, with the victor starting to become clear.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Orah!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though Sudou had been blessed with an impressive physique, Housen managed to shove him against the wall with more force than Sudou could muster. He then grabbed Sudou by the collar with both hands, raising him high enough into the air that Sudou’s legs no longer touched the ground.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-hey!” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though he was on the ropes, Sudou tried desperately to fight back. But suspended in the air, all he could do was defend himself, not attack. Housen was exerting so much pressure on him, it was almost like he was trying to force him physically \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003einto\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the wall.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ngh! Y-you ass!” shouted Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe grabbed both of Housen’s arms, and despite being held in place with a limited range of movement, struck Housen with his knee. Housen staggered slightly, and Sudou managed to break free of his grip. But immediately afterward, Housen hit him with a repeated series of kicks. While Sudou didn’t flinch, the force of the blows slammed him back into the wall.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBefore the fight broke out, they’d seemed a match for one another. But now that they’d really gotten going, the difference was considerable. Sudou made enemies rather easily and had probably been in quite a few fights himself. Thanks to his athleticism and his physique, which had been honed through playing basketball, almost no one had been a match for him in his life.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Housen was in a different league. He’d probably been in many, many more fights than Sudou. A countless number of them, in fact. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAnd \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ehe’d probably survived some extremely violent, dangerous situations. The difference in their experience was obvious. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAdditionally, his arms were so strong and thick that it was hard to believe he and Sudou were only a year apart. And yet, despite his size, his movements were quick and nimble, demonstrating a kind of innate agility. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was a reason that even Ryuuen, of all people, had stopped himself from fighting Housen. Namely, he knew that Housen wasn’t the kind of opponent you could beat in a straight hand-to-hand fight. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven so, Sudou wouldn’t go down so easily. He was one of the strongest students in the entire school—head and shoulders above most of the rest. But that only meant he would end up taking Housen’s blows for a much, much longer time. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHousen continued to whale on him, barraging him with blows from left and right. Much as Sudou wanted to break through and find an opening, the best he could do was simply take Housen’s furious punches. If he tried to counter in any way, his guard would be broken in an instant, and Housen would put him down.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No one stands to gain from this!” shouted Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer words didn’t reach Housen. At this point, it was impossible to stop Housen with words alone. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, they \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e reach Sudou’s ears. Though for only a brief instant, Sudou glanced at Horikita. Hearing the voice of the girl he had to protect somehow lit a great fire within him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oraaaah!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou tackled Housen with the determination of someone ready to put his life on the line, pushing him away from the wall and trying to force him to the ground.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh ho, you wanna do a test of pure strength, huh?” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe caught Sudou’s large frame, smiling, latched onto him and lifted him into the air again.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-whoa?!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHousen flipped Sudou around so he was now up against the wall. He pushed him away, and then taunted him, beckoning him to come over with his left hand.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, poor baby, was it hard being all cramped up against the wall? Hey, that’s just the right kinda handicap for me, though. Bring it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve had enough of you!” howled Sudou, his engines now running at full throttle.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was about to launch another all-out attack against Housen, when—\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Sudou, check out Horikita over there. Man, she’s glarin’ at you something \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003efierce, \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003edude, she’s pissed. Dontcha think?” said Housen, unclenching his fists and pointing a finger at Horikita, behind Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the middle of their fight, Housen had done something that left him completely defenseless. Sudou realized he had completely lost his temper and gotten himself into a full-on brawl. In a panic, he looked away from the powerful foe in front of him and back at Horikita. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, Horikita wasn’t thrilled about Sudou getting in a fight. But she wasn’t glaring at him, either. Her expression was one of worry, agonizing over what she should do, unable to do anything but shout at them to\u0026#160;stop. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe moment that Sudou turned to look back at Horikita, he was distracted. He left himself open. By the time he realized what had happened, it was already too late. Housen, a wicked grin on his face, landed a furious blow on Sudou’s cheek while Sudou was still looking the other way. A hard blow that took him completely by surprise. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though Sudou was most certainly a strong fighter who could take a lot of punishment, the smack he’d just taken was probably the most painful thing he’d ever experienced. If he’d been an ordinary student with an ordinary neck, it might have been more than just painful—it could’ve seriously hurt him. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou’s large body was sent flying backward. He skidded along the ground, unable to catch himself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nghh…?!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe let out an almost inaudible groan, all but passing out in agony from the pain. Housen, who had controlled the whole fight so far without using any dirty tricks, had deliberately lured Sudou into a simple trap. To hurt him not just physically but mentally as well.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough Sudou didn’t seem to have lost consciousness, he was writhing in agony on the ground. I found myself wondering again what kind of person Housen Kazuomi was. I wondered what Housen was thinking about, what was going through his mind, what had brought him to the negotiating table today. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was true—just as Horikita had said before—that it had sounded like he wanted something from our class back when we first met. And as Housen himself had admitted earlier, he’d thought it would be useful to team up with another Class D. Until this point, he had just been using his superior position as a bargaining chip in our talks, and there wasn’t anything particularly wrong with that. However, once he saw how hard a line Horikita was taking, he realized that trying to keep pressuring us was going to be difficult.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe realized that if he continued to be this pushy in our negotiations, Horikita would just give up on the idea of working together. But even so, instead of trying to compromise and meet us halfway, he just grew even more aggressive, violent and belligerent. He threw water in a woman’s face and was still seriously attacking Sudou, right now.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHow could he be so violent and aggressive when he risked being suspended or expelled? That was what I’d been thinking about all this time. Did Housen really think he could turn the tides in his favor by sheer force? No, I couldn’t imagine someone like him would be that foolish. In that case, what was he looking for? What exactly was Housen hoping to gain from this fight?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, all right, all right. Your faithful bodyguard is eating dirt. Who’s next?” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe drew closer, taking turns looking at Horikita and me. Even though he had just finished fighting with Sudou, he didn’t even seem out of breath. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you think we… Do you think we will submit to your acts of violence?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll just keep pounding you into the ground. Maybe even make you sign a binding pledge or two while you’re cryin’ your eyes out. And if you refuse to do any of that, then I’ll just keep comin’ after you relentlessly, till I drive you to your death,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo matter how tolerant they claimed the student council intended to be of fighting, there would be consequences if this went too far. Besides, if Housen forced Horikita to sign something under these circumstances, there was no way it could actually hold up as legitimate. Horikita could pretend to obey his command and play along to defuse the situation, but I didn’t think she would do that. Because she simply couldn’t give in to Housen’s way of doing things.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Very well. I’ll stop you,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe steeled herself and took up a fighting stance.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hoo boy, now ain’t this somethin’. Well, now, if you wanna do this, then I’m more than happy to take you on,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHousen probably wasn’t expecting Horikita to have any kind of martial arts experience. However, he wasn’t the kind of opponent who’d fall for cheap tricks. That was something Horikita still didn’t understand. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSuddenly, without warning, Housen thrust out his large arm. Horikita nimbly dodged and launched an attack of her own, aiming straight for Housen’s chin. She was hoping to settle things with one sudden, decisive knockout right out of the gate. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh ho?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Housen caught hold of Horikita’s delicate fist with almost alarming ease.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, now, that was a pretty good move, lady. But too\u0026#160;bad.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe took a wide swing, repeatedly slapping Horikita across the face. Horikita tried to defend herself or dodge the attacks, of course, but in the face of Housen’s overwhelming speed, there was nothing she could do but take the hits. She was sent flying backward, almost as if she’d been punched with a closed fist instead, and tumbled along the ground but then caught herself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“S-Suzune!” shouted Sudou, gritting his teeth, trying to stand back up. But his legs just wouldn’t cooperate, and he couldn’t do it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Horikita. Sign the contract,” Housen threatened Horikita, who had collapsed on the ground and was looking up at him while struggling through the pain. “Five million. Five million, and everything will be all right. Okay?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe price had skyrocketed. It had jumped so high as to be impossible to pay.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-you must be joking… Ayanokouji-kun, call… call the teachers…” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt this point, adult intervention was probably the only way this situation could be contained. Alternatively, if a crowd gathered, even Housen would have no choice but to stop.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Pft, so after figurin’ out you’re no match for me, you go and say that…? Well, whatever. You sure you wanna go that route? Even if not all of you tried to take me on, fact is, some of you threw punches back, didn’t you? What about that? You sure you wanna get suspended right alongside me?” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if we appealed to the school and tried to make the case that we were justified in fighting back, it was inevitable we’d also come under fire. Nevertheless, if we wanted to avoid any further tragedy, we really should get a third party to intervene.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You asshole!” shouted Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Stay down!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou had managed to get back up and launched himself at Housen once again. But Housen took him down with a merciless kick, and then he finally set his sights on me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How long are you just gonna stand there and watch, huh?” he said. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“R-run… Ayanokouji…kun…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Run? Yeah, don’t do that. If you run away, Horikita and Sudou’s injuries are about to get way, way worse,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven now, I kept thinking. What did Housen want to do here exactly? Was he really going to try using violence to advance a demand that was never going to be met? No. That was just illogical.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita. I’ll give ya one last chance.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Last?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Submit to me right here and now, and fork over your points. Do that, and…I won’t kill Ayanokouji.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs Housen said that, he put his hand into his pocket and took something out. For a moment, I couldn’t tell what it was because of the cover of darkness. But when he removed what was covering it and revealed the pointed edge, I saw something shining silver.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-you’ve…!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“C’mon, you got eyes, you can tell what this is. It’s a knife, man. A knife. And a real one, no doubt,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom the way it shone, it was clearly different from the retractable knife toys you saw used as party props.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You say no to my offer, and I’ll stab Ayanokouji with this,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Stop this nonsense!” shouted Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What nonsense? Nothing nonsense ’bout it. If I can get points out of it, I’ll \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003egladly\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e go this far. You get me?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe slowly approached me, holding the knife in his right hand.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“After all this, though, I still don’t get it. What makes you so special?” he said, looking me in the eyes. He sounded both dismissive and exasperated. “Hey, maybe I didn’t even need to do all this, take on such a big risk and all.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat he was saying made it sound almost like this absurd series of events was all a result of him taking precautions. Being wary of something. Step by step, Housen drew closer to me. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe one who stepped in and tried to stop him was the person from his class. Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please stop. Don’t do anything else. I just can’t… I can’t accept your way of doing things, after all,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe got between us, spreading her arms out wide, stopping Housen in his tracks.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Move, Nanase. You’re supposed be standin’ watch to make sure no one runs away. So go stand watch,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought that if it were for the sake of our class, I could lend you my support until the end, Housen-kun. No matter how terrible your strategies were, I was convinced of that. But it seems I was wrong.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though Nanase was standing in front of Housen and barring his path, she directed her gaze squarely at Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_8\" src=\"/hola-lector-agua/images/books/y2v1/OEBPS/Images/INTERIORIMAGES_8.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It was impossible for you to work something out with Housen-kun all along, Horikita-senpai. You got the idea of forming a partnership after Housen-kun came to your floor and said something about your class. But…that was nothing more than a ruse, all along. Even if you did pay them a ridiculous sum of points, like the five million he’s asking for, you would still have suffered the same fate,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter hearing this shocking truth from Nanase, Horikita couldn’t help but feel even more shaken and upset. No matter how hard she pressed Housen to negotiate, no matter how much effort she put into it, he was never going to actually listen to her. And this wasn’t Horikita’s fault at all. There was no one on our side who could have predicted things would turn out this way. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis inexplicable series of events was probably the result of an unequal distribution of information. There was information that was given to Housen and Nanase, but not given to us. Under such circumstances, there had never been a way for us to have any real negotiations.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Damn, all your yappin’ is really pissing me off. You’re the one who said you’d let me handle everything in the first place, remember? If I take out Ayanokouji, our class is gonna get tons of cash. It’s obvious how much of an advantage that’ll give us,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I suppose you’re right. But I still cannot figure out why it’s only Ayanokouji-senpai who needs to be targeted like this,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That ain’t any of my concern. If you’re gonna get in my way, then you can just piss off too!” shouted Housen. His huge form barreled down on Nanase and slapped her out of the way just like he’d done to Horikita before.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I stood there by myself, watching this spectacle, I came to one single conclusion. And with that, everything made sense.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Here I come, Ayanokouji!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHeld in Housen’s right hand was, quite clearly, a dangerous weapon. Naturally, everyone assumed he had meant to use it against me. Housen, smiling, raised the knife. I pitched forward, readying myself, while at the same time feeling my thoughts becoming clearer.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun…!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile everyone else thought I should obviously run from Housen in a situation like this, I was, instead, rushing toward him. I bet they were all thinking the same thing in that moment—that I had lost my mind. After all, facing off with someone holding a knife wasn’t exactly the mark of a sane person. And Housen wasn’t some weak, two-bit opponent, either. He was already formidable to begin with. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut seeing this, Housen’s smile widened. He probably thought I was an idiot for leaping toward him. But I wasn’t actually trying to stop him from stabbing me by rushing at him like this. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHousen, sensing that I was getting in close, accelerated the downward arc of his arm. What he was swinging the knife at—what he was aiming the blade at—wasn’t my\u0026#160;body.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHousen Kazuomi was aiming for himself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs he was mid-swing, I used my left hand to stop the knife from reaching its intended destination. I didn’t do so by grabbing his arm. Nor did I try to get out of the way. Instead, I thrust my palm forward.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wha—?!” shouted Housen in surprise.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat I’d just done was something he clearly hadn’t expected. Well, I supposed it would’ve been nearly impossible for him to predict my actions. No one would assume I’d purposefully let myself be stabbed. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe arm Housen had swung down came to a complete stop, and the smile on his face vanished in an instant.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You… Ayanokouji!!” he snarled.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was baffled, naturally. Anyone would have been perplexed by my decision to deliberately allow myself to be stabbed. My actions must have seemed desperate and reckless. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFresh blood spurted from where the knife had impaled my palm.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That knife. Or to be more accurate, that petty knife. It’s the one I purchased,” I told Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" id=\"INTERIORIMAGES_9\" src=\"/hola-lector-agua/images/books/y2v1/OEBPS/Images/INTERIORIMAGES_9.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\" width=\"100%\"/\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you on about…?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You were going to stab yourself in the leg using that knife. A knife that belongs to me. Afterward, all you had to do was make a fuss about being stabbed, and then you’d have me expelled, using your wound as physical evidence. That was your plan, wasn’t it?” I asked him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJudging from the way Housen had held the knife as he swung it, it was clear he wasn’t intending to stab someone else. He was keeping the blade at a height that made it look like someone else was stabbing him, and it was obvious he swung the knife while holding the handle in reverse, so he could thrust it into his leg with more force.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHa\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e…! So, you figured all that out, but still let yourself get stabbed, huh? You outta your mind?” replied Housen with a dry chuckle, though he was certainly a little shaken.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because this was the best way to stop you completely. Besides, you had a similar plan in mind, anyway. You came here prepared to receive a severe injury.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if you understood it to be a valid strategy, most people couldn’t bring themselves to commit such a dangerous act of self-harm. Which was exactly why he would’ve been able to stab himself and claim I’d been the one to do it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems there’s some other kind of special exam going on. One that was given to a limited number of you first-years. And judging from your conversation with Nanase, the nature of that exam is about getting me expelled. The idea was to somehow lure me out to this place and force a fight to happen. You’d torment Horikita and Sudou, then say I flew into a rage and came at you with a knife that I happened to be carrying, just in case, and stabbed you. Then you’d have me expelled… That’s your entire absurd plot,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if the school was supposedly being more tolerant of fighting, going so far as using a knife wouldn’t be met simply by suspension. It would probably lead not just to expulsion, but also to criminal charges.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I heard you weren’t nobody to mess with. But to be real with you, I didn’t get the feelin’ that you were all that tough, so I didn’t think much of you. I mean, I never imagined you’d just let yourself get stabbed like that… How’d you even know this knife belongs to you?” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve been doing some research of my own. As of yesterday, I was still the only person who’d purchased a petty knife here. And yet, you have one. Which means the answer is pretty obvious.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt would have been simple enough for me to slip under Housen’s swing and grab his arm. However, that wouldn’t fundamentally solve the problem at hand. All he had to do was get his distance from me and try to stab himself all over again. The only way to stop him for certain was to make sure he couldn’t pull off his strategy at all. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHousen tried to pull the knife out of my hand, but I kept his fist locked in place with the sheer strength of my grip.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…What the hell… are you…?” huffed Housen. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaving understood the extent of my strength, he completely lost the composure he had just moments ago.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, then, what’re you going to do now?” I asked him. “Even though I’m the owner of this knife, you’re the one who stabbed me. And on top of that, I know you tried to buy one yourself ahead of time. If you can’t talk your way out of this, you’re going to be expelled, Housen.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy fingerprints were on the handle, but so were Housen’s. And the fact that the knife was sticking through my palm right now couldn’t easily be explained away. The very strategy Housen had devised had come back to bite him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, you saw this far ahead…?!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter Housen had finished glaring at me, he let go of the knife and put some distance between us. The knife remained embedded in my palm. And now, the tables had completely turned. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the meantime, Horikita and Sudou slowly stood back up, beginning to recover their strength.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A-are you all right… Ayanokouji-kun?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji…” said Sudou, amazed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was understandable that my two classmates were perplexed by everything that was happening, but that would have to wait. It was essential for me to completely shut Housen down right now.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Damn, how much do you even know…? Wait, Nanase! Don’t tell me you went and blabbed to him. Did you?” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t say anything,” replied Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I first felt like there was something odd back when I was shopping with Amasawa at Keyaki Mall,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Amasawa-san? Are you saying she’s involved in this…?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. When Housen was about to buy a knife, she stopped him. The store clerk saw it happen. You’re the one who came up with this absurd plan, Housen, but Amasawa was the one who perfected it. If you stabbed yourself with a knife that you’d bought, the school would investigate and you’d be in trouble. But if you could somehow make sure \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ehad bought the knife instead, there was a good chance you could completely turn the situation around.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe reason Amasawa had deliberately chosen the petty knife was because it was the only one that came with a sheath, which likely made it the most convenient choice for Amasawa and Housen. Of course, there were other ways to conceal an exposed blade, but if you considered that you’d be carrying it around with you, buying one with a sheath was the easiest and most reliable option. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had felt like there was something off when Amasawa had picked out this knife, without any hesitation whatsoever, in a store that she should have never been in before. That was the first thing that struck me. Then, Amasawa visited my room on Friday. She said she’d lost her hair tie, but the only reason she’d come by was to recover the knife. It was safe to assume she’d deliberately planted the hair tie or was simply lying about it. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlso, it was possible I’d notice the knife was missing if she came to retrieve it too soon. So she made sure to wait until the last possible minute, seeking the right time. She took the knife out of my room without getting her own fingerprints on it and offered it to Housen. If she hadn’t been able to recover the knife, they probably would’ve postponed their plan.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eTch\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. Guess workin’ with that rando was a mistake, huh?” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, not really. It was thanks to Amasawa that your plan came together. If it were just you acting alone, everything would’ve fallen apart,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whatever. Anyway, looks like you’ve got the upper hand here now though, Ayanokouji-senpai.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe blood from my wound had also gotten on Housen’s clothes. There was no way he could talk his way out of this. Even if he took the knife back now and stabbed himself in the leg, he wasn’t going to be able to spin this in his favor. Of course, if he \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003etry to do that, I’d just use my full strength to stop him. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHousen, standing across from me right now, could likely sense this much himself. The important part was what came next.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita, Sudou, and I can keep this matter between us,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you plottin’? You’re just gonna throw away this valuable chance to get me thrown outta school?” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In exchange, I have two conditions.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Two?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe probably knew the first one without me having to say it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ll agree to initiate a fair, cooperative partnership with Horikita, between our two classes.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, ain’t like I got much of a choice, since if I say no, I’ll get kicked out. What’s the other condition?” asked Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I want you to partner with me for the upcoming special exam.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom the moment I’d first laid eyes on Housen, I had thought that if I were in a position to select whatever partner I wanted, he’d be the guy I’d pick. While I had several reasons for thinking so, the biggest one was that he didn’t seem to care one bit about attracting attention to his problematic behavior. If I were in Tsukishiro’s position, I would have instructed whoever he sent after me to avoid doing anything to stand out. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf negotiations with Horikita didn’t work out, I’d considered reaching out to Housen privately and trying to come to terms with him. In that sense, this chain of events was actually quite convenient for me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…You serious?” asked Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve only just enrolled here. There are still countless things you haven’t done yet. If you get expelled right now, it’ll be all over. You’ll never get to enjoy any of them. I\u0026#160;don’t know how things were back when you were in junior high, but all that talk about how you’re a match for Ryuuen will end up being just that—talk. People will say you really weren’t that big a deal. And based on what I’ve seen from Ryuuen over the past year, you can’t even begin to compare to him as you are now. He’s strong,” I\u0026#160;replied, taunting him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You…!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHousen Kazuomi was an incredibly proud guy. He thought highly of himself, considering himself a strong person. Even though he might be physically stronger than Ryuuen, it would infuriate him to be told Ryuuen was actually better than him. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMore importantly, though, there was no way he could stomach the idea of being outsmarted by me. If Housen, who had a B+ in academic ability, were to deliberately score a zero on the test, he would inevitable be expelled.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, it was entirely possible he’d try and take me down with him as revenge. While I was as certain as I possibly could be that he wasn’t the White Room student, it was also true that I wasn’t \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e100% \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ecertain. I could never fully clear him of that one suspicion, no matter how thoroughly I investigated and examined. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, that had changed now. Even if Housen did deliberately cut corners on the test, the fact that I’d been stabbed remained. If it was clear there’d been something bizarre happening behind the scenes, not even Tsukishiro would be able to force my expulsion right away. The school would certainly want to investigate the matter to figure out exactly what had happened, and why Housen got a zero on the exam. Whatever tricks Tsukishiro tried to pull, I’d hold my ground until expulsion was no longer a possibility. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, all right, pretty good there, Ayanokouji-senpai! Never had an opponent that got my blood pumping like you before. You should know, I ain’t gonna be tryin’ to just make you surrender with brute strength anymore. I’m gonna really beat ya to death, so I hope you’re lookin’ forward to it,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat slight hint of him wavering was now a thing of the past. Housen had already changed gears and was focusing on the next battle.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll stay here. There are still some things I should explain to Ayanokouji-senpai,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? What are you plottin’, Nanase?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve decided it would be in the best interests of Class 1-D for me to tell him some things. Ayanokouji-senpai and Horikita-senpai are intensely wary of us right now. If that’s the case, don’t you think it would be a good idea for us to make sure they’re cautious of all of the other classes, too?” she answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile I didn’t understand exactly what Nanase was getting at, Housen seemed to accept her proposal.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whatever, go ahead,” he replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd with that, he was the first to leave, heading for the dormitory.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e7.3\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT WAS NOW\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e just Horikita, Sudou, the first-year student Nanase, and me. While I was sure there were a few things for us to discuss, there was something else we needed to attend to first. Namely calming down Horikita, who had lost her cool after seeing the knife piercing my left hand.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what should we do…? The…the knife, I mean, should we…should we take it out?” she stammered. The normally cool and collected Horikita had probably never been in a situation like this before.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. I know it’s probably not great to look at, but we should leave it alone for the time being.” If we just carelessly pulled it out, it might result in me losing a lot more blood. “More importantly, what about you two? Are you okay?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looking at your injury, I’d say I’m practically unscathed…” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah… I’m definitely okay too,” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe came closer, until he was standing right beside me. His face contorted in disgust when he saw the miserable state of my left hand.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dude, how can you be so calm with your hand like that?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm, dunno. I wonder.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI just did what I normally did. Nothing special.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But, dude, like…you are \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecrazy\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e good in a fight, wow…” added Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just forced myself to stop the knife is all,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…That ain’t how it looked to me though, man,” said Sudou, speaking his mind about what he’d thought when he saw me charge at Housen just a little while ago.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou had been in a number of violent situations in his lifetime. I didn’t think I could fake him out, and I probably couldn’t deceive Horikita, either. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI took out my phone with my right hand and dialed the number that would connect me with Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m going to need a little help. I’m behind the first-year dormitory building right now. Can you hurry on over? Discreetly, of course. Oh, and also, please bring a bath towel,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough Chabashira seemed a little baffled by my sudden call, she sensed the urgency of the situation and promised to head over right away. In the meantime, it would probably be best not to move from this spot. It\u0026#160;would be awkward if we tried moving locations and another student happened to see my hand.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven so… Nanase showed no signs whatsoever of being upset. She was completely unfazed, remaining calm and collected even after seeing the knife impaling my hand and the spurting blood. She didn’t seem bothered one bit by the graphic, visually arresting spectacle.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, Nanase, can you tell us what’s going on?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I don’t, it seems it would only put my class at more of a disadvantage,” she answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You were aware things were going to turn out this way… Is that correct?” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s correct. The idea was that Housen-kun would stab himself in the leg and have Ayanokouji-senpai expelled,” said Nanase. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe didn’t seem to feel guilty or ashamed at all. She explained what they had planned in the same polite tone she usually used.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you saying that the friendliness that you showed us—it was all just part of the act?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, that’s not true. I really do want to join forces with you, Horikita-senpai, and for our classes to support one another. It’s just… The plan to target Ayanokouji-senpai was our top priority,” said Nanase. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhich meant that the reason why Housen and Nanase were so obsessed with our class was because I was in it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why would you do all of that? Also, unlike Ayanokouji-kun, I don’t recall ever forgiving you for what happened tonight. Depending on how things play out, I might consider reporting you to the school right away.” Horikita, unable to understand why I’d been targeted, pressed Nanase to answer.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think there were problems with how we did things, yes, but trying to get Ayanokouji-senpai expelled from school itself is not counter to the school’s wishes. Very few first-year students know about this, but it’s possible to earn a considerable number of points by having Ayanokouji-senpai expelled,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow, the reason why I’d been targeted by Housen finally became clear.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We were given a special exam. For this exam, we were told that anyone who managed to get Ayanokouji Kiyotaka from Class 2-D expelled would be paid twenty million Private Points,” explained Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you talking about? This makes no sense. Who in the world came up with such an incredibly stupid, outrageous special exam?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase didn’t answer that question.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I’ve told you what I needed to say, for now. I’m sure this will make you far more wary of every class in my grade level, not just us now. Won’t it, Ayanokouji-senpai?” she said instead, turning to me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase hadn’t said much. Really, she’d only told us the bare minimum she needed to. She and Housen obviously knew what was going on, and needless to say, Amasawa was aware of the second special exam, too. Given everything I’d heard, it was reasonable to assume that some students in Class 1-B and Class 1-C probably knew about it, too.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How do you think we could possibly be satisfied with an answer like that? The truth of the matter is, Ayanokouji-kun was seriously injured, and—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m fine. Just getting an understanding of the situation is enough. Thanks for your help, Nanase,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I chose to cooperate with Housen-kun\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003efor the good of the case, despite knowing how unjust this is. Because the fact remains that if the twenty million points were to fall into the hands of another class, it would create a significant gap between us,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTwenty million points was essentially a single ticket to Class A. But when you considered things like this current special exam, the more financial power you had, the more advantages you’d gain.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, that is not the only reason why I lent Housen-kun a helping hand,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe spoke softly and calmly, but there was something about the way she looked at me, like she was staring daggers at me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“’Cause I really didn’t… I mean, because I did not think that Ayanokouji-senpai was someone suitable for this school,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor the first time, she openly stated her intense hatred for me. But I couldn’t really figure out why. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNot too long afterward, Nanase bowed to us and left.\u003c/span\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 7: Expulsion Approaches\",\"volumeId\":\"y2v1\",\"chapterIndex\":13,\"prevChapter\":{\"volumeId\":\"y2v1\",\"chapter\":12,\"title\":\"Chapter 6: Class D and Class D\"},\"nextChapter\":{\"volumeId\":\"y2v1\",\"chapter\":14,\"title\":\"Chapter 8: A Deepening Mystery\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Operating Behind the Scenes\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: True Ability\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: A New Stage\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: These New First-Years are Nothing But Troublemakers\",\"href\":\"Text/section-0008.html#auto_bookmark_toc_top\",\"index\":10},{\"label\":\"Chapter 5: Ichika’s Test\",\"href\":\"Text/section-0009.html#auto_bookmark_toc_top\",\"index\":11},{\"label\":\"Chapter 6: Class D and Class D\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_top\",\"index\":12},{\"label\":\"Chapter 7: Expulsion Approaches\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_top\",\"index\":13},{\"label\":\"Chapter 8: A Deepening Mystery\",\"href\":\"Text/section-0012.html#auto_bookmark_toc_top\",\"index\":14},{\"label\":\"Epilogue: Postscript\",\"href\":\"Text/section-0013.html#auto_bookmark_toc_top\",\"index\":15}],\"volumeTitle\":\"Light Novel 2nd Year Volume 1\",\"detailsLink\":\"/select/year-2/y2v1\",\"returnLink\":\"/select\",\"currentSpineIndex\":13,\"nextVolumeLink\":\"/select/year-2/y2v2\",\"nextVolumeTitle\":\"Light Novel 2nd Year Volume 2\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://classroom-of-the-elite-reader.vercel.app\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"COTE Reader\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"en_US\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:image:width\",\"content\":\"1200\"}],[\"$\",\"meta\",\"9\",{\"property\":\"og:image:height\",\"content\":\"630\"}],[\"$\",\"meta\",\"10\",{\"property\":\"og:image:alt\",\"content\":\"Classroom of the Elite Reader Preview\"}],[\"$\",\"meta\",\"11\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"12\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\"$\",\"meta\",\"13\",{\"name\":\"twitter:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"14\",{\"name\":\"twitter:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"15\",{\"name\":\"twitter:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"link\",\"16\",{\"rel\":\"icon\",\"href\":\"/hola-lector-agua/icon.svg?icon.ae5abf30.svg\",\"sizes\":\"any\",\"type\":\"image/svg+xml\"}],[\"$\",\"$L14\",\"17\",{}]]\n"])</script></body></html>
