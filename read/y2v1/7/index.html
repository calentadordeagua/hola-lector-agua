],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T24af,"])</script><script>self.__next_f.push([1,"\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 1 - Prologue:\u003cbr/\u003eOperating Behind the Scenes\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eL\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eET’S GO BACK IN TIME\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e about two months, to a certain day in February. In a meeting room in a certain facility somewhere in Tokyo, a man who looked to be in his forties read information off a screen as he explained something. A child was quietly listening to him speak. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis child was fifteen years old. They would soon be entering high school—and they were no mere child. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis child had been raised in a top-secret facility known as the White Room and received a rather special education.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That is all the detailed data we have on Ayanokouji Kiyotaka and the other one hundred and fifty-six students in the second year. Have you committed all of that to memory?” asked Tsukishiro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe screen in the room displayed all the data on its students that the school had collected over the past year. Data that included names, birth dates, and what schools they had previously attended, of course, but also, parents and siblings, their grades from early childhood, even their friendships. This was a top-secret meeting. The kind of information being shared here was the kind that even homeroom instructors wouldn’t normally be able to access.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure you’re already well aware of this, but the important thing here is to get Ayanokouji-kun kicked out of school and then bring him back to the White Room before the end of April. We cannot afford to delay our plans any longer. However, please be smart about how you execute this operation. You must never make anything public. If the government does happen to hear about our actions, then, his—sensei’s—name could be dragged through the mud,” added Tsukishiro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter hearing this explanation, the student from the White Room slowly raised their hand. “In other words, don’t do anything to attract unnecessary attention?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Precisely. Which is exactly why only someone like you, who can pose as a student to infiltrate the school, can do this. I will provide you with as much support as possible, but Sakayanagi will likely be much more cautious from this point forward. You won’t be able to do anything careless,” said Tsukishiro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe student seemed to have gotten a grasp on the situation, but their expression also seemed to contain a hint of frustration. Tsukishiro did not miss that.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The look on your face is telling me that you’re not exactly happy about this,” said Tsukishiro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter briefly glancing at Ayanokouji’s picture on the screen behind him, he turned his gaze back to meet the child’s.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I take it you know that he—that Ayanokouji-kun—is touted as our facility’s magnum opus, our masterpiece? Not only was I sent, but they’re even sending someone from the White Room. Meaning they interrupted the experiments being conducted in the White Room, which had finally resumed operations. I have to say, it truly seems like an excessive and rather generous response. I\u0026#160;suppose that to someone who has been raised in the same facility, there might be nothing more humiliating,” said Tsukishiro, strongly emphasizing that last point as he continued his explanation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was trying to get the student to show what they were capable of by fanning the flames of their student competitive spirit. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAyanokouji Kiyotaka is our masterpiece\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. Whenever the students heard those words, some emotion lurking deep within their hearts came bubbling up to the surface. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTsukishiro had conducted himself flawlessly. But the one thing he had misread was what that emotion was. Something those who were raised in the White Room had drilled into them so thoroughly that they grew to hate it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Become someone who can surpass Ayanokouji Kiyotaka.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA feeling of intense hatred, which an unrelated third party who hadn’t been raised in that facility could not understand. Sometimes, that feeling would swell to the point where it could no longer be contained, and it would spark an outburst. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The stage has been set. All I want you to do now is demonstrate the full extent of your ability. Based on the data I’ve looked at, I see no issues. If you have \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethis\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e level of ability, then it shouldn’t take much effort at all for you to get him expelled, now, should it?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter Tsukishiro was done giving his explanation, as well as a rather perverse form of provocation, he powered the screen off. The room was engulfed in darkness for a moment but was filled with light once more shortly afterward, as the ceiling lights came on.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now, then. If there are no questions, let’s stop for the day. Time is quite precious, after all,” said Tsukishiro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe child, after hearing that, turned their back to Tsukishiro and moved to leave the room as though nothing had happened. He felt slightly bothered by their calm and collected behavior. His instincts were telling him that he had misspoken earlier when he was giving his explanation. However, he couldn’t take back any of the words that he had already said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“One more thing. There’s something I forgot to check,” said Tsukishiro, calling out the child from behind, stopping them from leaving the room. “You’re not hiding anything from me, are you?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was well aware that even though they were on the same side, the organization wasn’t a monolith. If their ideas didn’t align to start with, things wouldn’t work out so well. That was what he was trying to confirm. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe student, without even looking back, just gave a small nod and quietly continued walking away.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter the student had left the room, Tsukishiro turned the lights down once more and brought the screen back up. Shown on the screen was all the data about Ayanokouji Kiyotaka that had been recorded in the White Room.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t like to use a word like this so casually, but… He really is a monster,” said Tsukishiro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNeedless to say, he had an elevated level of academic ability. And on top of that, his physical abilities were so incredible that he could put adults to shame. With his achievements and record, even if he were put up against a professional fighter in a no-holds barred fight, it would be over in an instant—with Ayanokouji’s victory. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A battle between two White Room students… If they had a fair, direct competition, I wonder what the results would be?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, Tsukishiro had already devised a plan to ensure that he would win. But even so, there were no absolute guarantees. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hunt or be hunted, huh? This is a game between children, but it seems like it could get interesting.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTsukishiro, an adult, wasn’t panicking. All he did was carry out the task he had been given, methodically, without hurrying.\u003c/span\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 1 - Prologue : Operating Behind the Scenes\",\"volumeId\":\"y2v1\",\"chapterIndex\":7,\"prevChapter\":
