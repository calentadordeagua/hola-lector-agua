ose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not giving up,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I see.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was afraid she’d only end up wasting her time and going in circles, but I supposed it was a good thing that she was motivated.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e6.3\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eS SOON AS I\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e set foot in the library that weekend, I could sense the atmosphere was different from the other day. Many students, both first- and second-years, had gathered there. Most of the students had their tablets and notebooks spread out in front of them and were engaged in what looked like a study session. It seemed a lot of students were starting to move forward and take steps they needed to take, rather than let themselves get complacent after having found a partner. I vaguely recalled that we had a study session here in the library too, about a year ago.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is a bit of a bother. With this many people around, we might end up attracting unnecessary attention,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, it’d probably be a good idea for us to try to blend in.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFortunately for us, the seats we had used at the back of the library yesterday were still available. Since it wouldn’t have been surprising if they’d been taken, I fixed my gaze on a certain part of the room. Shortly afterward, I saw Hiyori, waving to me with a gentle smile on her face.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought that you might be coming today, Ayanokouji-kun, so I made a special request that those seats be reserved for you,” said Hiyori.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Was that okay?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I suppose it would’ve been a different story if the library were full to capacity, but there’s no need to worry,” said Hiyori.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was a spacious library, so there was quite a bit of room. That being said, it was still a kind gesture on her part to do that for us.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please, go ahead and take all the time you need,” said Hiyori.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe must not have intended on staying for awfully long, because Hiyori left immediately after saying that.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She really is quite kind, isn’t she? Do you think she heard our conversation the other day?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hard to say. Considering how far away we were, I think it would’ve been hard for her to eavesdrop.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince the seats had been generously reserved for us, we sat in the same spot we did yesterday. Then we took study materials from our bags, and acted as though we were there to study. However, no matter how long we waited, there was no sign of Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nanase-san is late,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe had promised to meet after class, at four thirty in the afternoon. But it was already past five now. We had sent her multiple messages, but there was no sign she’d read any of them. It might be a good idea for us to go and check on her right about now, but that was tricky, since we didn’t know where she was.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Should we go looking around the first-year classrooms for the time being…?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as we were about to go and do that, though, Nanase appeared, looking rather flustered. Once she noticed us, she approached, looking out of breath.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I’m sorry. I kept you waiting for so long, and…!” huffed Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s all right. We were just worried that something might have happened,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was negotiating with Housen-kun, trying to see if I could bring him along with me one way or another,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that so…? It seems like you were unsuccessful, unfortunately.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere wasn’t any sign that anyone else was coming through the library doors.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Still, he didn’t try to stop you from coming here to talk with us today?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He did not. Most likely because he doesn’t think that anything could be decided without him,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo matter how much Nanase tried to do on her own, Housen had the final say. I supposed if he had that kind of confidence, there was no need for him to warn her or try to stop her every time she did something.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seems like we have no choice but to try and force a meeting with him after all,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I realize we won’t be able to resolve matters so easily. But if we don’t try and discuss things face-to-face, we’ll never reach any kind of agreement,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eToday’s discussion certainly seemed like the kind of thing that she wouldn’t want to rush into without thinking.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, you’re certainly right about that… but, well…” said Nanase, trailing off.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe looked unsure of what she wanted to say, but then came to a decision and started speaking once more.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita-senpai, you want to establish a collaborative relationship with our class, at any cost. I’m not incorrect in saying so, am I?” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not all. You’re absolutely correct.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case… Will you please listen to my proposal?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase seemed to have come up with some ideas of her own, in her own way. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s clear that even if you propose to Housen-kun that we establish a fair and equal partnership, he will reject your offer flat-out. I believe that would most likely be the case even if you met with him in person, Horikita-senpai. In that case, how about proceeding to negotiate with me, in secret?” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Proceeding to negotiate with you, Nanase-san? But it’s not like your classmates would go along with our plans without Housen-kun’s involvement, would they?” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re right. However, that’s only because I have yet to step forward as leader,” said Nanase, coming right out with a rather unexpected proposal. “I’ve decided we cannot continue going by Housen-kun’s methods. Though these are desperate measures, I’m hoping I can become the leader of my class before his dangerous ideas spread too far. And to that end, I would like to establish a relationship with your class, Horikita-senpai.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita had never expected Nanase to propose something like this, of course. And neither had I, for that matter. Nanase Tsubasa would become leader of Class 1-D, deposing Housen. If that plan could be realized, Horikita’s goal of a collaborative partnership would quickly become a reality.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We don’t really have enough information to determine whether you or Housen-kun would be a more appropriate choice as leader, Nanase-san. However, one thing that I can tell you is that we don’t have much time,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe special exam period was already nearing its end. There wasn’t enough time to fight over leadership. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Many of my classmates don’t agree with Housen-kun’s way of doing things. In fact, after talking things over with them—like how we discussed things yesterday and today—I’ve successfully managed to get seven students to agree to help,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And you’re sure it’s not just students with a low level of academic ability?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. There are about three students with an academic ability ranking of B- or better who are willing to negotiate,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I see.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita thought for a moment. Three people certainly wasn’t perfect, but if we could get just a few more, it might not be a bad idea for us to try to go ahead and form this partnership, with Nanase as the focal point. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Won’t it spell trouble for us if Housen-kun finds out about this?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There would be quite a bit of trouble, needless to say, yes. Which is why we’ll need to keep every part of this arrangement secret all the way up to the day before the special exam, which is the deadline for when partners need to be selected. If partner applications are submitted at the last minute, he won’t notice anything,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But that might make it difficult for us to win over the more academically-inclined students from your class, won’t it?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no changing the fact that those students would want Private Points.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We will help compensate you for that. The students in my class who struggle academically will be saved thanks to you and yours, Horikita-senpai, thereby avoiding the three-month penalty. Therefore, we can float you some points. Even if you needed two hundred thousand points to gain the cooperation of the more academically gifted students from our class, we would still be able to help you recoup. Although we wouldn’t be able to reach the five-hundred-thousand-point per-person price that Housen-kun would like, I think it would still be within an acceptable range,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, they’d basically be sorting out this mess themselves, then. We’d originally intended to use our own points to try to entice the honors students from their class, but this way, the less academically gifted students from their class would essentially be using their own points to get their classmates to help out.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This way, we won’t inconvenience you and your class, Horikita-senpai. Of course, Housen-kun will surely be angry once he finds out, but I intend to take full responsibility for everything to ensure the kids who cooperated with me will not be harmed in any way. What do you think?” asked Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s… No matter how much you might say this would be your responsibility as a leader, don’t you think that this proposal places far too much on your shoulders?” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s quite all right. I don’t want to lose this opportunity, and I don’t want to lose your trust, Horikita-senpai, after you’ve offered me a helping hand.” Nanase seemed to be saying this was a small price to pay to save her classmates. “Besides, even if my class doesn’t recognize me as its leader, I can at least save \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyour\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e class in this special exam, Horikita-senpai.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf you were to only consider the immediate benefits, then Nanase’s proposal was by no means a bad one. I had to wonder how Horikita would respond.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Something is very clear to me now. Namely, that I want to form a real partnership with your class,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, are you saying that you agree with my proposal?” asked Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. I’m afraid I cannot accept it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But there’s no other way…” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All your class’s problems will be resolved if we get Housen-kun on our side. You don’t actually want to be the leader. You just don’t like the way Housen-kun does things. Isn’t that so? In that case, if Housen-kun is willing to do this without pay, there should be plenty of other students who’ll support him, right?” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yes, I suppose. Certainly,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Plus, if you and Housen-kun were to oppose one another, it’s possible your class would end up fracturing in two rather than being united as one. We cannot allow that to happen. So how about you allow me to help you change his mind?” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, this conversation with Nanase had helped Horikita to realize something as well—that as long as we got Housen, the rest of our problems would be solved.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s a risky gamble. If it fails, it might not be possible for our classes to collaborate again in the future,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I am prepared for that… Well, no, that’s not quite right. I believe that it’s entirely possible that we can work with one another. And it’s not just me, either. I’m sure Housen-kun is thinking the same thing,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even though he spoke to you so rudely over the phone before?” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll just take that as him playing hard to get. At least for now.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase seemed to understand what Horikita was trying to say. She quickly voiced her agreement.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see that making time to meet with you today was the correct choice, Horikita-senpai, Ayanokouji-senpai. It would seem my hunch wasn’t wrong, after all.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean? I rejected your proposal, didn’t I?” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, you didn’t. Actually, you and I have been of the same mind from the very beginning, Horikita-senpai,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait… Do you mean to say that you’ve been thinking of trying to persuade him, too?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Correct,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, the idea Nanase had pitched, about her becoming a leader, was completely made up. It was a test. If Horikita had chosen to ignore Class 1-D’s future for the short-term profit of our own class, and taken Nanase up on her offer, she probably would’ve turned around and refused to help us.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just as you said yourself earlier, we do not have time, Horikita-senpai. We cannot move forward unless we bring everyone together to negotiate, even if that means we need to be a little forceful. Would you please allow me to handle setting up this meeting? I will be sure to bring Housen-kun to you the day after tomorrow, on Sunday, Horikita-senpai,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt didn’t seem like a test this time, considering she was bowing deeply and asking Horikita for help. If this meeting took place on Sunday, it would mean we’d have even less time remaining, as a result. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita turned her gaze towards me, looking for confirmation. Thinking it was all right to take this gamble, I nodded in response. The hesitation in her eyes vanished.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I believe you. I look forward to seeing you and Housen-kun the day after tomorrow, on Sunday,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes… Absolutely. However, we would like to avoid meeting in a public place. It’s quite possible that Housen-kun might act out indiscriminately, depending on how things go,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I suppose you’re right. In that case, karaoke might be a good place for us to meet. I don’t mind meeting at night either, if Housen-kun wishes,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was certainly true that meeting late at night on a Sunday would substantially lower the risk of being seen by anyone.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Understood. I’ll be sure to let him know,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as the conversation got to a point where our plans were taking shape, Horikita’s phone rang. She looked at the message she’d received and let out a sigh.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s up?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s time for the study group. It seems like they’re short on people, with me not there,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt had already gotten to be five thirty before I even realized it. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think that we’ve wrapped things up here. Can I ask you to handle the rest?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita gave Nanase a quick, polite bow, then gathered up her things and headed to the study group with our classmates. Trying to support our entire class required her to run all over the place and do all kinds of things.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She is quite busy, isn’t she? Horikita-senpai, I mean,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s what it’s like to keep a class together,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I hope I can become as impressive as her a year from now…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita didn’t ask for any details, but just wondering—how do you intend to draw Housen out, anyway?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well… I’m happy to answer that question, Ayanokouji-senpai, but I’d like you to tell me something about yourself.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Something about me?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe sun was starting to set outside, the world glowing a brilliant orange color.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita-senpai is the class leader. But you’re different, aren’t you, Ayanokouji-senpai?” asked Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI see. \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed Nanase wasn’t sure I was the appropriate person to be here right now. If I said I was only here because Horikita forced me to come along with her, it would probably backfire and cause Nanase to clam up.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Senpai… What kind of person are you?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I didn’t answer her questions, Nanase propped her arm on the desk in front of her, showing me her side profile. It looked like some kind of defensive strategy on her part, to prevent anyone but me from reading her facial expression and mouth movements.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can you please answer me?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, Nanase, it sounds like what you want to ask me isn’t what kind of relationship I have with Horikita,” I\u0026#160;replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was asking something entirely different. She was asking me what kind of human being I am. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. I believe you’re an evil, disgusting human being, Ayanokouji-senpai\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e That’s what I think,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThose were some incredibly dramatic, intense words that she hurled at me. But despite the content of her statement, Nanase looked straight at me without hesitation, and with almost an overabundance of honesty. I\u0026#160;honestly had no idea what I’d done to make her look at me like that. Considering all the interaction we’d had so far, she should only have had trivial, surface-level information about me. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlso, despite the issues that arose from my lack of chemistry with people, I didn’t recall ever having been called evil before. Nanase Tsubasa might be the person I was looking for. The one sent from the White Room. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were reasons why I thought that. Even though getting me expelled was the most important directive for the agent, it wasn’t like they would carry that task out routinely or robotically. Rather, they’d come into close contact with the person known as Ayanokouji Kiyotaka and observe him. That was what I thought. They wouldn’t just want to get me expelled. They would want to prove that they were definitively better than me. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, I supposed that if they didn’t do as much, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehe\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e would never approve of them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I were on their side and had to get Ayanokouji Kiyotaka expelled, I would probably think that way. However, what she’d just said to me also sounded rather out of character for someone who came from the White Room, like I did. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When I’m talking with you like this, you look like a normal person to me, Ayanokouji-senpai,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Does that mean you usually see me as someone who isn’t normal?” I asked in return.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…No. That’s not what I’m saying,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe denied it, but I wondered if that was what she really thought, deep down. I’d run into Nanase four times now, and sensed her giving me a strange look in each of those encounters. I felt like I was about to find out where her loyalties lay, but the opportunity quickly slipped from my grasp.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry, but please just forget we ever talked about this. What’s important right now is whether our classes can cooperate with one another,” said Nanase. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe both got up from our seats and left the library. Just as we were about to go our separate ways, I remembered something I had wanted to ask her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, come to think of it, when we were talking about losing three months’ worth of Private Points, you said you’d only lose two hundred and forty thousand. Why is that, anyway?” I asked. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I asked her that question, Nanase no longer wore the expression she had only moments before. Her face was back to normal.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why? I simply calculated that if we were to retain the eight hundred Class Points which we were granted when we started school here, then we would end up with two hundred and forty thousand points as a result is all…” she said, sounding perplexed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, this year’s batch of new students had a different starting line than we did.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Last year, we were given a total of a thousand Class Points at first,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? So, you’re saying that we were given two hundred points less, then?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s exactly what I’m saying. I wonder what things are like for Class A and Class B in your grade level.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think that they started with eight hundred points as well. That was how Shiba-sensei explained things to us,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhy wasn’t there any official notification put out for that, though? I imagined that if you knew that you were being given fewer Class Points than previous years had gotten, you would feel like it was a little unfair. Did the school officials simply decide that it wasn’t worth showing that much consideration for the new students, because they felt like eighty thousand Private Points was quite a lot of money as is? \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo—even if that were the case, they should have informed everyone right at the start, rather than try to hide it out of laziness and risk having students find out and come back to complain about it later. The students would have been more satisfied if they had put out some statement ahead of time. There were a number of other things that we knew were different from how they were last year. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You do know that what you do every day has an effect on your Class Points, right?” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe homeroom instructor for Class 1-D, Shiba-sensei, had said something earlier that made me think they already knew. He said, “\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI’m also quite sure that the school rules have been drilled into you so much by now that your head feels like it could explode\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. We were told that, ‘Tardiness, absences, and chatting during class time will influence your Class Points,’” replied Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWas it possible that the school had reduced the number of Class Points they were awarded after taking into consideration the fact that they’d gone to the trouble of disclosing the rules to the new students right at the beginning? We knew that societal contribution was an important metric in OAA, so even if it was hidden, the students probably would’ve found out anyway. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough I was about to tell her that I understood and accepted her answer, I saw that Nanase was lost in thought for a bit. Then she got a look on her face like she’d just thought of something, but only for a moment. Immediately afterward, the look disappeared. It was a very subtle gesture. I noticed it precisely because I had met with her quite frequently over the past few days. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, since Nanase didn’t say anything, I decided that I’d refrain from pressing her about it. We walked out of the library together and made it to the entranceway. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, then, senpai, if you’ll please excuse me,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as she was about to go, though, I called out to her and stopped her in her tracks.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nanase, this isn’t meant as a thank-you for telling me about the whole Class Points thing earlier or anything, but have you heard about something called Protection Points?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Protection Points? No, I haven’t heard about those before,” she answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s a system where students who have those Protection Points can essentially use them to protect themselves from penalties that would normally end in expulsion. But\u0026#160;considering the fact that very few people in our grade level have them, it’s understandable that you wouldn’t know about them,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm, I see… Why are you telling me this, though?” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because you gave me information. I just thought I should give you a little bit in return.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter saying my piece, she and I parted ways. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had decided to test Nanase’s skills. To see if she could make use of what I’d just told her.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e6.4\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eLTHOUGH IT HAD TAKEN\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e some time for everything to come together, it was decided that we were going to have a discussion with Housen (albeit forcefully), thanks to Nanase’s dedicated cooperation. The situation was still entirely unpredictable, but it was still a definite step forward.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA little before six o’clock that evening, my doorbell rang. Kei must have only just gotten back to the dorms from the school building, because she was wearing her uniform, not her regular clothes.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know, there’s lots of people coming and going at this time of day, so I had to be pretty careful. Like, I had to use the stairs and stuff\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e” said Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere probably weren’t many girls who’d be coming to a boy’s room, and even fewer who would visit for an extended period of time. That kind of thing didn’t happen often unless a guy and a girl were dating. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, let’s get started, then,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?! Come on, aren’t we like, gonna do some other stuff first?” wailed Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe didn’t take out her study materials. It sounded like she had wanted to chat instead. But time was limited. The later it got, the less time there would be to study.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If there are no problems with your academics, then we can chat as much as you want,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmph…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“First of all, we need to find out what you’re good at and what you’re not so good at.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How are you going to find that out?” asked Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“With these,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI took out five test sheets. Keisei had made them for our group, to check what everyone’s strengths and weaknesses were. They were extremely useful to have, considering how much time it would’ve taken to have carefully screen through the number of questions needed to get things started. Horikita and Yousuke had used these sample tests in their own study groups, too.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Most of our classmates have already been tested with these,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s a ten-minute time limit per sheet. Go ahead and get started.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fine,” she huffed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite her grumpy response, Kei got started on the tests. After fifty minutes had passed, she collapsed onto the table like a limp noodle. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh, I’m so worn out…!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You did good. So you are able to concentrate on regular tests, after all.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh come on. I’ve been studying all day today, it’s tiring. It’s not like I can just flip a switch,” she huffed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs she grumbled, I quickly finished grading her tests. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay. I think I have a good understanding of what your abilities are, Kei,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-how’d I do?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe didn’t seem to know that herself, because she was looking at me with eyes filled with both expectation and anxiousness. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You will definitely be going to Yousuke’s study group from tomorrow,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s nothing to panic about. But to be honest, if you don’t keep up your studies, you’ll be in imminent danger of getting expelled.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-But, hold on, my partner’s Shimazaki-san. He’s got a B minus, right? So, I’ll be okay, won’t I?” asked Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The passing score for this special exam is five hundred and one points. Someone like you, Kei, who doesn’t study enough, would probably get about two hundred points, give or take. Whereas Shimazaki would probably get around three hundred and fifty. It’s hard to imagine that getting an assumed total of only five hundred and fifty points puts you entirely in the clear. And on top of that, if this Shimazaki dislikes studying like you do, then it’s actually quite possible that he could end up scoring less than three hundred points,” I told\u0026#160;her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd if that were to happen, there was a very good chance that she would fall below that five-hundred-point threshold.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m starting to feel really scared all of a sudden…” said Kei quietly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Which is why it’s important we get you to a place where you can definitely get a score of two hundred and fifty points on the test, as soon as possible.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis test was designed in such a way that even a D+ student should be able to score that well if they studied efficiently.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um, hey, I kinda have a question, though,” said Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A question?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, you’re gonna tutor me and all, but don’t you have a C in academic ability, Kiyotaka? So, doesn’t that mean you’re average? But I bet in reality, you like… You can do way better than that, can’t you?” said Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Something like that.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s just like how you’re really good at fighting, too. Why do you hide it all so much?” asked Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t want to stand out. So I don’t try to get high scores is all,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, so, like, how many points do you think you could get if you were serious about it?” asked Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No idea.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, don’t mess with me. Just tell me!” said Kei, forcefully but playfully pushing my shoulder and smiling at me as she pleaded.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll be more than happy to answer your question if you show up and put in the work at the study group from tomorrow onward.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll go, totally. I feel, like, a sense of impending danger from what you just told me,” she admitted.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Instead of telling you how many points I can get, though, I’ll tell you how many points I’ve decided I’m going to get,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what’s that supposed to mean? That’s a pretty incredible claim to make,” said Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were a total of five subjects. I had no intention of slacking off in any individual subject, considering I had to compete against Horikita in one. However, if I actually put everything I had into each subject, then my reputation amongst my peers would change dramatically.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Four hundred points,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Wait, for real? Four hundred points, that’s definitely…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The equivalent of an A rank.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was a level only a select few bright students in our class, like Horikita and Keisei, could reach. It would’ve been more accurate for me to have said \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003enear\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e four hundred points, but there was probably no need to amend my statement now.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A-and you’re saying that you can get that score if you want to?” asked Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course. There hasn’t been a single problem that I thought I couldn’t solve since I enrolled here.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t know how many highly difficult questions would be included in this exam, but compared to the kind of studies I’d undergone in the White Room, it seemed fair to assume it was going to be pretty easy. Noticing Kei seemed to have a blank look on her face, unable to understand what I was just telling her, I decided to pull her back down to Earth.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now that you can see the big picture, I want you to keep that sense of impending danger in mind, and focus,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay… I guess I’ll study here for a bit and head back to my room then…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was only a little after seven at night, so there was nothing wrong with her sticking around for another hour or so. It would also be helpful for me, so that I could tell Yousuke more clearly what kind of level Kei was at tomorrow.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay. Well, then, let’s get started right away.”.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, over here,” said Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had intended to get started while we sat across from one another, but Kei lightly patted the floor next to her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tutor me from right here, next to me,” said Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e6.5\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eW\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eE SPENT A LITTLE OVER\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e an hour together in my room. During that time, I gave Kei advice while she studied. I got the impression that she fundamentally had a good head on her shoulders, but the fact that she hadn’t taken her studies seriously all this time was holding her back. I didn’t plan to point that out to her, though.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Kei had just been neglecting her studies from an early stage, I could’ve admonished her over it, but in her case, it was the abuse she had suffered in junior high that had prevented her from getting a legitimate education. So because she didn’t properly learn the ‘basics’ in junior high, she was struggling in her classes in high school. When I considered all of that, I’d say she was actually doing quite well.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eGuiding her with compassion and giving her advice was probably the correct decision. If she could come to feel that studying wasn’t a painful experience, she might even start growing and maturing in a big way, just like Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_5\" src=\"/hola-lector-agua/images/books/y2v1/OEBPS/Images/INTERIORIMAGES_5.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um…” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s up?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei suddenly started looking down at the floor. Then, after what seemed like a few seconds of continued staring at the floor, she reached out and grabbed something. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had thought maybe a small piece of garbage or some dust was laying there or something, but…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What… is this?” asked Kei, holding her arm out to show me something she was holding between her index finger and thumb.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a single strand of long red hair.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks like a hair,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I came right out and said what I thought, Kei’s face gradually transformed more and more into that of a raging demon’s.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ered\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e hair! And…and…it’s a long one! No matter how you look at it, it’s gotta be a girl’s hair!” she shouted.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, yeah, she was probably right about that. It was physically impossible for that to be my hair, considering the length. And my hair also had a completely different quality to it, of course. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe person the hair belonged to immediately sprang to mind. It had to be Amasawa Ichika, who had made me cook for her the other day.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who did you have over?!” asked Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was probably asking me because she had no idea who it could have come from, out of our classmates or others.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, is this that thing? Jealousy…?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, is that a bad thing?! I’m your girlfriend, Kiyotaka! I have the right to keep an eye on you when it comes to this stuff!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was the first time I had heard of a right like that. In any case, I supposed there was one lesson I should take from this. Namely, after inviting a girl into your room, you should clean thoroughly. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d thought the lesson would end there, but the disaster was still ongoing. While I was racking my brain over how best to explain myself, my doorbell rang without warning. The sound echoed throughout my room. And then, an image of the lobby was displayed on the monitor. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI, the resident of this room, wasn’t the only one curious about who had just rung my bell. Kei was, too. We both peeked at the video on the monitor. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOn the screen, we saw the figure of Amasawa, waving, with a big grin on her face. The first person to react wasn’t me, but rather, Kei, still clutching the red hair in her hand.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Red hair. A girl I haven’t seen before…” she muttered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was almost like she was solving a mystery on a children’s detective show. Kei reached out and pressed the call button before I could do it myself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hello, who is it?!” asked Kei, her voice containing rather overt tones of anger.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAmasawa was, of course, visibly surprised.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Wait, this is… room four-oh-one, right? Ayanokouji-senpai’s room?” she said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI forcefully pulled Kei’s arm away, and I took over.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry. It’s me. What do you want?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was an unexpected visitor, but I couldn’t just let Kei deal with it. Putting the matter of Amasawa aside, there was also the problem of people coming and going in the lobby being able to hear that Kei and I were together.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, is someone there with you? Should I come back later? There was something I wanted to talk to you about, so I thought I’d drop by,” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though Kei was glaring at me, she gestured for me to let her come on up, rather than turning her away. Apparently, she wanted to be certain the hair belonged to Amasawa. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah, it’s okay. Come on up,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI pushed the unlock button and let Amasawa come in through the lobby.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you sure this is okay? Other students are going to know you’re here,” I said to Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Oh.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, she’d gotten so angry that the blood rushed to her head and she lost track of things. Kei was the one who’d told me we should keep the fact that we were boyfriend and girlfriend a secret from everyone else for now, still. If we casually bumped into someone else while together, there was a chance rumors of that sort might start going around.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s a little late for all that. We’ll just have to try and hide it,” said Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn any case, Amasawa had already heard Kei’s voice, and rushing to get rid of her wouldn’t really have much of an effect. In fact, we had to consider the possibility that doing so would lead to some strange speculation. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAbout a minute or so later, Amasawa must have reached the fourth floor. The doorbell for my room rang.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll let her in, so just sit here and wait for now,” I told\u0026#160;Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“O-… Okay.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI went to my front door and welcomed Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry for dropping by so suddenly, Ayanokouji-senpai,” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter examining the look on my face, she took a look at the shoes near the entranceway, in calculating fashion. How to put it…? The way she looked around the room… It seemed like what they called a woman’s intuition.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Girlfriend?” said Amasawa, asking me straight out, with a big grin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you want?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aww, you didn’t bite. Well, to tell you the truth, senpai, I think I might have forgotten something in your room.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You forgot something?” I repeated.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My favorite hair tie. I can’t seem to find it anywhere…” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo she’d come by my room after realizing it had gone missing, huh? \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, come on in,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t exactly make her just stand there and wait, so I decided to let her come inside. I thought it would be quicker to let Amasawa explain things than for me to try to come up with petty excuses about the hair.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry to barge in like this!” Amasawa entered my room, completely unconcerned about the presence of the other guest who had arrived before her. She must have been on her way back from school, because she still had her book bag in her hands. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe then came face to face with Kei, who had been sitting and waiting. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, hello! I’m Amasawa Ichika,” she said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hi.” Kei looked clearly unhappy about this, but she seemed like she was putting up with it, in her own way.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, you’re my senpai too, right? I’d love to know your name.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Karuizawa Kei.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Karuizawa-senpai, huh? Oh, looks like you two were studying together. Are you his girlfriend, by any chance? Ayanokouji-senpai dodged the question earlier when I tried asking him, so I wanted to try again,” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a bit of a gift to be able to just come right out and ask whatever you wanted, without hesitation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s really none of your business, is it? Actually, hold on, what about you? What’s your relationship with Kiyotaka?” asked Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough the fact that Kei called me by my first name naturally made Amasawa suspect even more that there was something going on, she looked around my room.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll answer your question in just a sec, so hold on, okay? Hmm… I don’t see it anywhere at first glance. I’m sure I took it off when I was last here, though. Hmm… Maybe it rolled along the floor somewhere?” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePaying absolutely no mind to Kei glaring at her, she got down on her knees, trying to peek under the bed. As she did so, her skirt rode up, naturally accentuating her rear end, which was positioned facing us.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh… senpai? I feel like this might look a little bit \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003enaughty\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e,” teased Amasawa, looking back at us. Her tone suggested she was doing it on purpose. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei reacted quickly and immediately, turning her head to direct her glare at me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll try looking for it,” I told them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI started searching, seeing if the hair tie had gotten under the bed somehow.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, can you not ignore me? Answer the question,” said Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm, let’s see, I guess Ayanokouji-senpai is my… Hm, what’s the best way to put it? My personal chef?” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Wait, what?” Kei, unable to understand what she was talking about, looked over at me once again. And she was glaring at me more intensely than she was moments before.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She’s Sudou’s partner. Some stuff happened, and we became acquainted. I ended up serving her a meal once,” I told Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, sorry, but I really don’t get what you’re saying at all. Why did you cook for Sudou-kun’s partner?” asked Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, considering she’d only heard the general outline of what happened, it was understandable she’d be confused. I responded by explaining the situation more in depth, while continuing to search for the hair tie underneath the bed. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, can I go and look in the kitchen too, just in case? I might have taken it off there when I was washing dishes. Oh, but please keep looking in the room yourself, senpai. Like maybe under the closet or something?” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t find anything under the bed, so I started looking around the closet next. Kei then came up close to me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, hold on a second… This whole thing about her hair tie maybe being here… What is \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e supposed to mean?!” said Kei, in a hushed voice, trying to confirm what was going on.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I already told you. I invited Amasawa over and cooked a meal for her the one time. That’s all.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-is that \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ereally\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e all that happened?” said Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course it is,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Really?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed like even if I said as much, she wasn’t going to believe me so easily.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m gonna check with that girl and make sure that’s true,” said Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as she tried to stand back up, though, I forcefully grabbed her arm. Then, I quickly brought my index finger up to my lips and gestured to her to be quiet. Kei was quick on the uptake at times like this, and didn’t cause any fuss.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I want you to search the area too,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“O-Okay,” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though she didn’t understand my intentions, she seemed to understand that it was important, and she started helping me search. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh! Ayanokouji-senpai, it’s here!” said Amasawa, her voice echoing from the kitchen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen Kei and I both peeked into the kitchen at the same time, Amasawa showed us the hair tie, held in the palm of her hand.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks like it fell in the gap between the counter and the fridge,” she said, smiling happily as she spoke, tucking the item into her pocket. “Anyway, it feels like I kinda got in the middle of something here, so I’ll be going now.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry for all the commotion,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, it’s okay. I shouldn’t have forgotten it in the first place. Anyway, sorry again about bothering you!” said Amasawa, quickly grabbing her bag and putting on her shoes in the entranceway. “But y’know, you really are a smooth operator, senpai, aren’t you? I never imagined you’d have yourself such a cute girlfriend.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe put a finger up against her cheek, as if pretending to think something over.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, come to think of it, that’s a good point. Next time I have you cook for me, it might not be a good idea for us to be alone together,” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Obviously!” yelled Kei.\u003c/span\u00
