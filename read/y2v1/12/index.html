3e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case… Karuizawa-senpai will just have to eat with us, then. Anyway, goodbye!” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe arrived like a whirlwind and departed in the same manner.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seems like you’ve gotten acquainted with a pretty cute kouhai, huh, Kiyotaka?” said Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re probably not going to listen to me no matter what I say, are you?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe atmosphere was no longer conducive to tutoring. I couldn’t do anything but explain what had really happened over and over to Kei until she was satisfied.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e6.6\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eF\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eRIDAY CAME AND WENT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e and now Saturday, our day off, was here. I’d had many opportunities to interact with the younger students during the week as a result of the special exam. There was my encounter with Amasawa from Class 1-A, which in turn led me to having to make her a home-cooked meal to secure a partner for Sudou. Then there were the discussions with Nanase regarding entering into an agreement with Class 1-D. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOther than what was going on with me, Kushida had had a discussion with Yagami from Class 1-B. Thanks to Kushida asking him to introduce people to some of his friends, we had managed to secure partnerships for Kei and other students in our class. While the importance of this special exam depended on your point of view, I was sure it would be deeply significant in terms of interaction between grade levels. Many students already knew the names and faces of the students in the grade above or below them, and even knew what kind of grades they had. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe had also ascertained what kind of tendencies each class had. Class 1-A did not have a clear leader at the moment. I got the impression each student was essentially free to do what they wanted. One of the reasons they were allowed to do so was the class’s overall excellent grades. True to their name, they had the highest number of students with a B- or better out of the four classes in their grade level. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMany of the more academically inclined students had already individually negotiated their own terms with Class 2-A or 2-C, using points. And though there were naturally some students in their class who had been classified as D- in terms of academic ability, they were also picked up by Class 2-A because they excelled in other areas. Of the forty students in Class 1-A, thirty-four had already confirmed partnerships.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass 1-B exhibited similar trends to A, in that they still didn’t have a clear leader. Also, the good students were selling themselves off individually one after another. The difference was that most of these partnerships weren’t with Class 2-A, but with Class 2-C. I wondered if that was due to the fact that Ryuuen and his ilk were offering a larger sum of points than Sakayanagi was. The exact details of the situation were unclear at the moment, but currently, thirty-three of their students had settled on partners. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs for Class 1-D, Housen had total control, ruling his class with an iron fist. If I had to compare it to anything in our year, I’d say it was almost exactly the same as how Ryuuen used to do things. What was interesting to me was that Class D was also the class with the least number of partnerships out of everyone. We would probably find out more details when we meet on Sunday.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd finally, there was Class 1-C. The class I had hardly interacted with at all over the past week. I had already committed the names of their students to memory, but their class had never come up in conversation, not even from Horikita. What was the primary reason for this? Well, it was the meet-and-greet event spearheaded by Ichinose from Class 2-B. As a result of that, many students from their class had confirmed partnership agreements. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTen students from their class still hadn’t finalized their partnerships yet, but of those ten, none had a D- or lower in academic ability. In other words, almost everyone in their class had successfully managed to secure a safe position. Perhaps there was someone helping organize things within their class, and they had successfully managed to save their classmates by way of the meet-and-greet event. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust past noon, I booted up the OAA app, and looked up the partnerships that had been formed as of today.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A hundred and five partnerships formed. Close to seventy percent then, huh?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf you looked at the number of people in the library yesterday, you could see most students had wanted to get things wrapped up before the weekend. There was more movement in Class 1-D, and now a total of eight students from their class had confirmed partnerships. I\u0026#160;wasn’t sure if the fact that it was the weekend now was making Housen impatient…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, at any rate, the remaining number of first-year students who hadn’t yet picked a partner was fifty-five, and for second-years, fifty-two. If there was a White Room agent hiding among those remaining students, then the odds of me getting partnered with them were pretty high. To be honest, there was no guarantee that I wasn’t going to end up choosing the White Room student, because they weren’t showing themselves at all.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d been dragging things out, hoping something would present itself along the way so that I could determine if someone were a safe choice or not, but I was reaching my limit now. I was going to need to decide before my options dwindled down even further. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough we were close to negotiating with Class 1-D, I wanted to have other options available to me. I decided to head over to Keyaki Mall on Saturday afternoon to expand my possibilities.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e6.7\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eN\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eATURALLY, THE MALL\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e on a Saturday was positively packed with students, particularly ones who’d already confirmed their partnerships for the special exam. Since they had no need to panic in that regard anymore, they were just studying with their friends in preparation for the written exam next week, and having fun, to relax a bit. I hadn’t come into contact with any first-year students yet, but even so, I felt like if there was a White Room agent nearby, I would’ve encountered them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStill, I didn’t have a gut feeling that anyone I had met was the agent. If I had to pick one example of such a feeling, I’d have to say it was the feeling I got back when I was talking with Nanase in the library. Most likely, Tsukishiro or someone else close to them had thoroughly taught the agent how to really act like a “student.” The problem wasn’t whether they had a personality with some quirks or not. The problem was whether they could completely mask the scent that betrayed them as someone from the White Room.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d been in a comparable situation myself a year ago, when I first came to this school. There were disadvantages and drawbacks of being raised without any knowledge of the world. Namely, I didn’t know what it was like to be a student at all. That was naturally something we weren’t taught in the White Room, as they had never intended for us to be sent to school. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhich was why, after coming here, I had briefly tried coming up with a character that I could “act out” appropriately. I tried various things, like being more talkative than I usually was and changing my tone of voice. Being a somewhat cocky student with a kind of cynical, shrewd view of the world. Well… \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the end, I found it kind of tedious to put on an act, so I quickly went back to being my regular self. Because I had come to realize that I could still be a “student” here without hiding my original self. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut the person the White Room had sent in now was different. They were putting up a front, camouflaging themselves as a student to prevent me from finding out their true identity. I had no idea if they were playing the part of a quirky student or if they were playing a blank slate. Either way, I probably wasn’t going to see through their act all that easily. Anyone who had managed to survive in that world could not be underestimated, regardless of their gender.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though I was confident I could win when it came to individual skill, I was in an overwhelmingly disadvantageous position due to essentially being forced to go on the defensive. My opponent could get me expelled in any way they chose, while the only thing I could do was defend myself by trying to detect what they were planning. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter I finished dropping into Humming and was on my way back, I happened to bump into Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My, it seems you’re being quite proactive in engaging with the new students, hm? Ayanokouji-kun?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s because this exam leaves students with low scores no choice but to fight desperately for their lives. I’m just helping Horikita find partners for Sudou and Ike.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. It’s certainly true that if either of those two drew the short straw, so to speak, and ended up with a poor excuse for a partner, expulsion would be imminent.” Sakayanagi seemed to accept what I’d said, but our conversation didn’t end there. “But is that really all there is to it?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Meaning what?” I asked in return.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I was wondering if perhaps…the White Room, or something similar to it, had sent in an assassin among the first-year students to get you expelled, Ayanokouji-kun? Even if you were to get a perfect score on the exam, if your partner got zero points, then both you and your partner would be expelled. I hope you don’t mind my saying this, but I just happened to let my imagination run wild about this special exam, and came to the conclusion it might be particularly troublesome for you,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI tried to play dumb, but this sounded like it was more than just an idea that had popped into Sakayanagi’s head as a mere possibility. She spoke as if she had known from the very beginning that such a scenario was inevitable. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can’t possibly continue to live a quiet life here at this school forever, can you? If your opponent were so inclined, they certainly wouldn’t mind making your true abilities known to everyone, Ayanokouji-kun. Though I suppose if you can maintain an enjoyable life here at school regardless, this will all prove to be needless apprehension on my part,” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, you don’t have to worry about that.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“May I inquire as to your reasoning for saying so?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m going to abandon my old way of thinking. The way I’ve been thinking until now. I’m not planning on holding back anymore.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRight now, continuing my life here at this school was my top priority. If I kept doing things halfway, I might find the rug pulled out right from under me. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Well, I suppose you’ve shown some of your abilities to Mashima-sensei, so it might be more convenient for you to boldly go ahead and lay everything bare now,” replied Sakayanagi, apparently quite thrilled to hear this. “Well then, I’ll get right to the point. If you haven’t settled on a partner for yourself as of yet, may I lend you my assistance to save you the trouble? I have only a vague idea, mind you, but there are certainly some first-year students still available who come to mind. They are children who will not adversely affect you, should they offer to partner with you, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt sounded as though Sakayanagi had gone to the trouble of doing some digging herself, trying to determine which students were safe choices for me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s very generous of you. But I’ll have to decline your offer,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you not trust my judgment?” she asked in return.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe had already seen right through me quite some time ago. She knew I needed to come to a decision soon.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I acknowledge your abilities. But I’ll be the one to decide my own fate.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I failed after entrusting my fate to someone else, I’d have nothing left but regret.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides, I have a pretty good idea of how I’m going to fight this,” I added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, is that so? Well then, I will refrain from saying anything uncouth. I will watch you from afar to see how you acquit yourself in this battle, Ayanokouji-kun. And I look forward to the day we can fight again in the near future,” said Sakayanagi, bowing to me before walking off somewhere.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe didn’t even consider me getting expelled a possibility. In that sense, I supposed she had immense faith in me, huh?\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e6.8\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eW\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHILE I WAS ON MY WAY BACK\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to the dorms from Keyaki Mall, I heard a somewhat slow, strained voice call out to me from behind.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Excuse me, do you have a minute?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I turned around, I saw a boy and a girl staring back at me. The girl seemed to be alternating looking at me and looking at her phone. She was Tsubaki Sakurako, from Class 1-C. Her companion was from the same class. His name was Utomiya Riku.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re…Ayanokouji-senpai, from Class 2-D, right?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t see the screen of the girl’s phone because of the angle, but she most likely had the OAA app open.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My name is Utomiya, and her name is Tsubaki. May we talk with you about a partnership?” asked Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“About a partnership?” I repeated.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. We’re going around looking for senpai with Cs or higher in academic ability, to see if anyone can help us,” he replied.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_6\" src=\"/hola-lector-agua/images/books/y2v1/OEBPS/Images/INTERIORIMAGES_6.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince I had been out and about looking for a partner myself, this felt too good to be true. It was almost like they were waiting for me to show up. Should I see someone who blatantly walked up to me as dangerous? Or conversely, should I see them as safe? Well, no—the most dangerous thing would be for me to make a judgment based on the issue of their timing alone.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve been having a pretty tough time finding a partner myself. Can you tell me a little bit more?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith the app, you could understand what a student looked like and what their name was, as well as what grades they had. But you couldn’t get a sense of their personality, which was precisely why it was necessary to meet face-to-face, so that each party could determine if the other was trustworthy. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIncidentally, Utomiya had already found a partner, but Tsubaki had yet to find one for herself. Her academic ability certainly wasn’t high. Only a C-. I was sure she wanted to be partnered up with someone who had a C or better. It seemed these two were out together looking for someone from my grade level with a C or higher, but were they looking to help Tsubaki find a partner? Or were they looking for someone for another classmate?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d prefer not to stand around here and chat though. How about we talk at the café?” Utomiya took the lead in the conversation, speaking to me quite respectfully and suggesting we talk somewhere else.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis definitely wasn’t something that could be decided upon in a minute or two, so I accepted his proposal to change venues.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was crowded, but we found an empty space in the corner of the café and sat down there.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I apologize for being hasty, but we’d like to get right into it, if you don’t mind,” said Utomiya. He then looked over at Tsubaki and motioned for her to speak up.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t like having to owe anyone anything, and I don’t like anyone having to owe me anything. I’m not a fan of debts. So, I want a relationship that won’t come back to bite me,” said Tsubaki, looking at her nails as she spoke. She sounded both laid-back and candid.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was true there was little difference between a C- and a C, meaning the person with the higher ranking couldn’t really feel superior in such a situation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can I ask you something that’s been bothering me?” I\u0026#160;asked in return.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, go ahead,” said Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The majority of students are around C rank. Why didn’t she find a partner sooner, then?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSure, you wouldn’t get a high score that way, but you could avoid getting expelled. I was sure some second-years would have gladly partnered with Tsubaki. The fact that she remained available all this time, through the first half of the exam period, was worrisome.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUtomiya started to speak, but then went silent for a moment, the words getting stuck in his throat. Upon noticing him struggling, Tsubaki turned and looked at me, actually making eye contact for the first time during this entire conversation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s my bad. I never said anything,” said Tsubaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUtomiya used what she said as a starting point and supplemented it with his own explanation. “Tsubaki didn’t talk to anyone about finding a partner. I’m guessing she got impatient once Friday rolled around, because she came up to me for the first time and asked me what she should do…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, Tsubaki’s classmate Utomiya had begun helping her find a partner in a race against the clock. It seemed most of the students in their class had already found partners. Even though there was still a week left in the exam period, it was understandable that they’d be panicking.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Considering Tsubaki’s academic ability, the five percent penalty could be a problem,” said Utomiya. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat seemed to be why they had approached me, a student with a C ranking. If this were a normal situation, I might have readily agreed to their request. However, there was a reason I couldn’t just make a snap judgment and say yes to them right off the bat. That was because what was happening here was strikingly similar to a scenario I had imagined when the special exam had just begun. Namely, the fact that the students I had the highest probability of getting partnered with were people with the same academic ability ranking as me. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd now Tsubaki, a student with a C- ranking, had come to me in search of a partner. I had only just met Tsubaki and Utomiya for the first time. So, the first thing I needed to do was get a feel for what they were like.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wanted to ask you something. You said you were going around looking for a partner. How many people did you talk to before you came up to me?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI thought I’d start with finding that one. But the response I got from Utomiya was rather unexpected.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry. I suppose it might have been a bit underhanded of me to say that. To tell you the truth, you’re the first person we’ve talked to, Ayanokouji-senpai,” said Utomiya, apologizing to me directly, as jumping ahead of what I might be speculating. “If that means you’re not willing to partner with her, Ayanokouji-senpai, we’ll just look for someone else.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, okay. You’re saying that I just happened to be the first person you talked to, is all.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It was a coincidence that we approached you, but there is a reason you’re the first, Ayanokouji-senpai. We thought if we asked a student from Class 2-A or 2-C, we might need to strike a deal using Private Points,” said Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI see.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e It was certainly true that first-year students were being bought up by second-year students right now. In a situation like this, if they were to request that someone partner with Tsubaki, it wouldn’t be surprising if a certain number of points were involved in the transaction. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut she wasn’t requesting to be partnered with a student with excellent grades or anything. There were still quite a few students remaining, so there was probably a good chance she could easily team up with someone. It was unlikely they hadn’t already considered all of that. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat being said, it would probably sound a little strange if I responded to them by saying something like, “I think it’ll be okay, so why don’t you try Class 2-A or Class C?” Objectively speaking, there wasn’t a single reason for me to be reluctant to accept the offer to partner with Tsubaki. The options available to me were limited. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t currently have a partner, but I have found a potential candidate. We’ve discussed things a few times to see if we can actually work together,” I told them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat I said was only half true, but there was no way the two of them could know that for sure. Furthermore, if saying that was enough to make them back off, it was highly likely that Tsubaki was a safe choice as a partner.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, so you have… I see,” replied Utomiya, sounding somewhat troubled, casting a glance over at Tsubaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, guess there’s nothing we can do, right? It’ll probably be faster to just start looking for someone else,” said Tsubaki, deciding to back off as soon as she heard I already had a candidate in mind.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just for reference… What first-year student are you planning on teaming up with?” asked Utomiya, somewhat insistently, though Tsubaki herself had already disengaged from the conversation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can’t say. The one thing I can say for sure is it’s not someone in Class 1-C,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough I didn’t go into detail about the reason I couldn’t tell them, I was sure they could hazard a guess. Namely that if I were dealing with someone from a rival class, I couldn’t exactly give out any information about the student I was working with to a potential enemy of theirs.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s go, Utomiya-kun. We shouldn’t take up any more of Ayanokouji-senpai’s time,” said Tsubaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yes, I suppose so.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was grateful they had approached me, but I couldn’t make a snap decision. I just had far too little data on Sakurako.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just in case, here’s my contact info,” said Utomiya, handing over a piece of paper with his information written on it, which he must have prepared ahead of time.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This might be kind of self-serving of me, but if the person I’m talking with turns down my offer for partnership, I might call you. If she’s still okay with partnering up with me at that time, I’d be happy to work something out,” I told them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand. Let’s go, Tsubaki,” said Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTsubaki uncrossed her arms and stood up from her seat. She gave me a gentle bow before leaving with Utomiya, probably in search of other candidates besides me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tsubaki Sakurako and Utomiya Riku. I’ll have to remember them,” I told myself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that I had thrown away my chance of securing a partnership right here and now, my actions from this point onward would be quite important. It wouldn’t be a laughing matter if I ended up getting partnered with a different student who proved to be the wrong choice.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e6.9\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eWO GIRLS\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e from Class 2-D walked together, side by side. Me, Karuizawa Kei, and my friend Satou Maya-san. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUntil a few months ago, we used to hang out a lot. But lately, we’d been seeing each other less and less frequently. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eMuch\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e less frequently. It wasn’t like we’d quarreled or anything, though. It was just that, subconsciously, I’d started to feel guilty as of late. Which made it really hard for me to reach out to her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry for calling you out of the blue, Karuizawa-san.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, no, it’s totally fine, don’t worry. I was just thinking I wanted to hang out with you too, Satou-san. Besides, it’s been a long time since we went out and did anything together, hasn’t it?” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, definitely, it has! I felt like when we first started here, we were hanging out like all the time.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was walking a little bit ahead of Satou-san. I turned to look at her and asked what we were going to do today. “So, what’s up? What do you wanna do? I think it’s kinda early for lunch right now.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was only a little after eleven in the morning right now. Satou-san had called me and suggested we take a walk together around Keyaki Mall. However, just as we approached the mall entrance, she quickly spoke up, sounding kind of flustered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, um, hey.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s up?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can we, um…go this way?” she asked, pointing to the path that continued on to the school building, in the exact opposite direction from the mall.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, toward school? Is there something you need? But we’ve got the day off today, and I’m pretty sure you can’t go in wearing casual clothes, right?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t have anything I need at school, but… I just wanted to go somewhere where there aren’t other people around right now,” said Satou-san.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI furrowed my brow in confusion, not really understanding what it was she was trying to say. Well, no, actually. I had an idea of what this might be about. But I pushed it to the back of my mind, trying to convince myself that that couldn’t be it. I kept pretending I didn’t notice anything.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s up, Satou-san? This doesn’t really sound like you. You feeling okay?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I just wanted to talk a little bit is all,” she answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had a bad feeling about this, but I couldn’t really turn her down right now. So I agreed to her request, and the two of us headed away from the mall and toward the school building. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere wasn’t really anyone around, as you would expect. No one who might hear our conversation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, out with it. We are friends, right?” I said, getting straight to the point.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat I’d just said wasn’t gentle at all. It was cruel. But even though I was aware of that, I couldn’t stop myself from saying it. Because I was Karuizawa Kei. The leader of the girls in my class. A self-centered person who didn’t think about how anyone else felt, just herself. If I didn’t act that part, everything I’ve done would fall apart.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was guessing Satou-san’s mental image of me lined up with the way I was talking to her now. That was why she didn’t appear dejected or angry. She would draw her own conclusions from my behavior, seeing Karuizawa Kei as someone who didn’t care and wouldn’t see what she wanted to talk about as anything worth paying attention to. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI hoped that maybe, just maybe, she’d be satisfied with that and this conversation wouldn’t keep going. I hoped that if I acted mean, it would make her want to avoid potentially souring our relationship, and so she wouldn’t bring the topic up after all. But Satou-san didn’t back down.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Karuizawa-san… Why did you break up with Hirata-kun?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Didn’t I already tell you the reason?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though her question wasn’t directly related to the subject of Kiyotaka, it was close enough to make my heart jump in my chest. Even so, I managed to keep those feelings from showing, thanks to everything I’d gone through until now.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, yeah, I’ve heard the reason, more or less. It’s just…something about it doesn’t feel right to me.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really? Y’know, I was thinkin’ it was kinda a waste, how it went down and all. Hey, do you maybe have your sights set on trying to become Hirata-kun’s girlfriend or something?” I asked her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSatou-san was no longer interested in Kiyotaka. That was what I was hoping to hear, which was why I said what I did, like I was trying to confirm that she was now after someone else. But Satou-san didn’t respond to that. Instead, she came back at me with a question that felt like a surprise attack.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was thinking… Is it possible you broke up with Hirata-kun because you actually had a different goal in mind?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOh, so she had noticed, after all. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eShe knows that I’ve fallen in love with Kiyotaka, and that our relationship is changing…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’re you talking about? I have no clue what you’re trying to say.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven now, I was forcing myself into a box. Trying to force myself to be the “normal” persona I’d created. Sooner or later, the day would come when I had to reveal my relationship with Kiyotaka. And when that day came, I’d have no choice but to run away, because I had decided I needed to keep all of it secret. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo matter what Satou-san might say to me, I was determined to, at least on the surface, smooth things completely over. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, no. I supposed I should say I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethought\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I was determined to do so.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Karuizawa-san… Are you dating Ayanokouji-kun?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh…?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBecause I got hit with an entirely unexpected gut punch. My reaction was delayed, like I’d just gotten smacked from behind. If I had been talking to any other girl, it would’ve been different. But since I was talking to Satou-san\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e, \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ethat delayed reaction was basically a fatal blow. She saw right through me, as if my answer was totally obvious.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_7\" src=\"/hola-lector-agua/images/books/y2v1/OEBPS/Images/INTERIORIMAGES_7.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf she’d asked me if I liked him or something, I could have handled it. But what Satou-san said went further than that.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…So, I was right after all, huh?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, wait, uh, no, no, why would you even think that?!” I wailed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI denied it, of course. Whether I actually intended to deny it or not, I did it anyway. Because there was no way I could admit what was going on to her right now.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why would you, I mean, I, uh…” I stammered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI kept trying to deny it, but I just got lost in Satou-san’s eyes. She looked like she was about to cry, but she looked angry, too. That was totally fair. She’d trusted me and come to me asking for advice on how to get Kiyotaka into a relationship. And I’d cooperated with her, while hiding the fact that I was attracted to him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I were in Satou-san’s shoes, I would’ve slapped me in the face for going out with Kiyotaka after all of that. Even if I didn’t come out and admit to it, I was sure it was already becoming a certainty in Satou-san’s mind.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you already have your eye on Ayanokouji-kun when I said I wanted to get to know him better and asked you to help? Or did you like him before then?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-hey, wait, hold on a second. I…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had no other choice but to stand there and take everything that Satou-san was throwing at me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I… I said the same thing to Matsushita-san and the others, too. That I think that you broke up with Hirata-kun because you like Ayanokouji-kun. But it’s not like I was just throwing that out there randomly, you know? I’ve felt fairly sure about it… So, yeah, that’s why I brought it up,” said Satou-san.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had already heard Matsushita-san had some suspicions about my relationship with Kiyotaka. I couldn’t talk my way out of this situation anymore.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please tell me the truth. If you don’t, I… I don’t think I could see you as my friend anymore, Karuizawa-san,” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe intensity of her emotions could be heard in her words. If anything, it felt like she was trying her hardest to keep being my friend, until the very end.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I…” I stammered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSeeing how serious that look in her eyes was, I just couldn’t bring myself to lie to her anymore. Where should I even start? Well, I supposed there was no point in hiding anything. The least I could do was apologize to Satou-san by opening up and telling her everything.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m… Ayano… Well, it’s just like you guessed, Satou-san. I’m going out with Kiyotaka,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNaturally, she reacted quite strongly when she heard me say that. Even though she’d been rejected when she told him how she felt, she still liked Kiyotaka. It was because I’d fallen for the same person that I understood how she felt. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you call him Kiyotaka, huh,” said Satou-san.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wanted to run from her somewhat cold stare, but I couldn’t. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We started going out at the end of spring break. Really not very long ago,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What I want to know most is when you started liking him,” said Satou-san.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…To tell you the truth, I’m not sure exactly when. But when you came to me earlier, talking about how you wanted to go out with him, I was starting to think of Kiyotaka as more than a classmate,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t think she was very satisfied with my answer.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re mad at me, aren’t you?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSatou-san had been looking me in the eye until moments ago, but now I couldn’t seem to return the favor.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I don’t exactly feel good about it. You knew how I felt, but you went behind my back and started to get closer to Ayanokouji-kun yourself.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere wasn’t a single thing I could say back to her about that.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But still, Ayanokouji-kun did turn me down after I told him how I felt about him, so… I’m not really in a position where I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecould\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e be mad at you. But it’s just…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA spring breeze gently blew past us. I was startled by a sudden, dull sound. The next moment, I realized I’d been slapped on the left cheek.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, so I guess that means we’re square… Can we forget all of this ever happened and go on being friends, Karuizawa-san?” asked Satou-san.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHonestly, the fact that she had slapped me was a little unexpected. I guessed that was just how hard to forgive my actions were, in her mind.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You want to give me one more shot?” I replied in a friendly way, offering my right cheek to her. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter all, the pain she’d felt was a lot greater than what I was dealing with right now.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I don’t, I mean… I really don’t think I could do that. I’m sorry for hitting you…” said Satou-san.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I’m the one who’s sorry. I mean, falling for the same guy as you. Satou-san, and\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e…\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e” I replied, trailing off.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, I don’t blame you for that. Ayanokouji-kun is really cool, and he’s way hotter than Hirata-kun,” she replied, teasing a little.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWithout even thinking, I spread both my arms wide and hugged Satou-san tight.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoa, hey, Karuizawa-san, what are you doing?!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I’m so sorry!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“R-really, it’s okay, you don’t…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough I felt so sorry about everything that happened, I was overjoyed, too. I hugged her tight, unable to hold back my emotions anymore. Falling for the same person was really tough, but I guessed this meant that we both understood his charms. This wasn’t a situation where we could talk about who won and who lost. I\u0026#160;mean, I was sure that from here on out, the number of people who discovered Kiyotaka’s charms would only keep increasing.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd I had to keep fighting to make sure I didn’t lose to any of them. If I didn’t take being his girlfriend seriously, I was sure someone would swoop in and snatch him away from me. Satou-san might even end up being that rival for me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wanna go grab a bite?” I asked her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSatou-san, still in my arms, nodded in response to my self-serving request.\u003c/span\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 6: Class D and Class D\",\"volumeId\":\"y2v1\",\"chapterIndex\":12,\"prevChapter\":{\"volumeId\":\"y2v1\",\"chapter\":11,\"title\":\"Chapter 5: Ichika’s Test\"},\"nextChapter\":{\"volumeId\":\"y2v1\",\"chapter\":13,\"title\":\"Chapter 7: Expulsion Approaches\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Operating Behind the Scenes\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: True Ability\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: A New Stage\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: These New First-Years are Nothing But Troublemakers\",\"href\":\"Text/section-0008.html#auto_bookmark_toc_top\",\"index\":10},{\"label\":\"Chapter 5: Ichika’s Test\",\"href\":\"Text/section-0009.html#auto_bookmark_toc_top\",\"index\":11},{\"label\":\"Chapter 6: Class D and Class D\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_top\",\"index\":12},{\"label\":\"Chapter 7: Expulsion Approaches\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_top\",\"index\":13},{\"label\":\"Chapter 8: A Deepening Mystery\",\"href\":\"Text/section-0012.html#auto_bookmark_toc_top\",\"index\":14},{\"label\":\"Epilogue: Postscript\",\"href\":\"Text/section-0013.html#auto_bookmark_toc_top\",\"index\":15}],\"volumeTitle\":\"Light Novel 2nd Year Volume 1\",\"detailsLink\":\"/select/year-2/y2v1\",\"returnLink\":\"/select\",\"currentSpineIndex\":12,\"nextVolumeLink\":\"/select/year-2/y2v2\",\"nextVolumeTitle\":\"Light Novel 2nd Year Volume 2\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://classroom-of-the-elite-reader.vercel.app\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"COTE Reader\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"en_US\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:image:width\",\"content\":\"1200\"}],[\"$\",\"meta\",\"9\",{\"property\":\"og:image:height\",\"content\":\"630\"}],[\"$\",\"meta\",\"10\",{\"property\":\"og:image:alt\",\"content\":\"Classroom of the Elite Reader Preview\"}],[\"$\",\"meta\",\"11\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"12\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\"$\",\"meta\",\"13\",{\"name\":\"twitter:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"14\",{\"name\":\"twitter:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"15\",{\"name\":\"twitter:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"link\",\"16\",{\"rel\":\"icon\",\"href\":\"/hola-lector-agua/icon.svg?icon.ae5abf30.svg\",\"sizes\":\"any\",\"type\":\"image/svg+xml\"}],[\"$\",\"$L14\",\"17\",{}]]\n"])</script></body></html>
