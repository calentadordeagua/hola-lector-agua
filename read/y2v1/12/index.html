e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T2cfd7,"])</script><script>self.__next_f.push([1,"\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 6:\u003cbr/\u003eClass D and Class D\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT WAS NOW THURSDAY\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e and the weekend was drawing near. After class ended, I went to the library with Horikita in tow. It was where we’d be having our discussion with Class 1-D, who Nanase would be bringing with her today. On our way there, we chatted about the special exam.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Have you checked out today’s update yet?” I asked her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seventeen more partnerships have been finalized. Which brings the total number of partnerships to seventy-three,” replied Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile there wasn’t anything about the number of partnerships itself that was particularly noteworthy, there was one substantial difference between this last update and the previous two. Namely, the fact that two students from Class 1-D had decided upon partners. There were now some visible signs of activity in a class which had, for the past three days, seemed motionless.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m a little flustered. I thought Housen-kun was planning to wait and see how things would play out a little longer. I tried talking to some Class 1-D students today during lunch, but they just brushed me off, saying they didn’t really know anything about the students who decided on partners,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s hard to tell if they really don’t know, or if they’re just under some kind of gag order.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wouldn’t be too surprising if there was some kind of rule in place, forbidding them from partnering with anyone or even talking about the whole situation unless one of the smart kids in class got offered a lot of points.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s true. At any rate, it’s great that we’ll be meeting with Nanase-san now. I’m sure she might be able to tell us something about this situation,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita had only ever met Nanase once, and they’d never actually ever had a proper conversation. Even so, Nanase, the person who’d stood beside Housen, seemed to be someone with whom we could communicate. Personally, I’d gotten a strong impression that she was an honest person when we talked. She had a very firm, upright character, vaguely reminiscent of Ichinose somehow.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita and I arrived at the library. When we set foot inside, the first person to greet us wasn’t Nanase, but rather Shiina Hiyori, from Class 2-C.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, hello there, fancy seeing you here,” said Hiyori.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, this bookworm had come to the library right away after class today.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We might be making a little noise today. We’re going to talk to some first-year students about the special exam,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, is that so? In that case, it might be a good idea for you to use the seats in the far back. I don’t think you’ll bother the other patrons then, and you should be able to talk a little. Also, you’ll quickly notice if someone does try to approach you,” said Hiyori.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI decided to take the advice she had so kindly given me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are things coming along okay in Class C?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, they are. It seems there’s a lot going on right now.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince our classes were competing with one another, we couldn’t exactly clue each other in on their inner workings. So with that brief exchange of pleasantries, we said goodbye to Hiyori and decided to go take our seats. While I was still kind of curious about what was going on with Hiyori, I went with Horikita toward the seats at the back of the room.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Putting Nanase-san aside, now that we’re getting involved with Class 1-D, it raises the question of whether Housen-kun is going to show up,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. I guess that whether he shows up or not is going to make a substantial difference to how this goes.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince we hadn’t given Nanase restrictions, there was no guarantee she wouldn’t bring Housen with her. If she did bring him along, we’d just have to go for broke and negotiate for all we were worth, flying by the seat of our pants. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I hope you don’t mind if I ask you something before we start a full-blown discussion. Have you been studying?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, a little bit, here and there. Why, what about it?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was just wondering whether you’re getting enough time for your studies, considering I have an advantage in this situation by being able to choose the subject.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, what’s this? Taking pity on your enemy?” I teased.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As if. I’m not so nice as to willingly give up advantageous conditions. This is a contest I must win,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven so, she was apparently concerned about whether I was studying properly or not. Which was to say, she was \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eactually \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eworried that I’d come up with some excuse that I was too busy dealing with the special exam to study, or something like that.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re one to talk, you know. You’re spending a lot of your time getting our class organized,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I always make sure to devote time to my studies. I\u0026#160;have no problems whatsoever,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe seemed to be quite confident that she had managed her time well, with everything she had to do in her daily routine.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, relax. I don’t plan on losing,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s all well and good, I suppose…” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe didn’t seem to trust me, strangely enough. She didn’t seem to think that I was taking this test seriously. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTo that point, there \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewas\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e one other thing that I wanted to ask her about. Horikita had a lot of roles to fill, in addition to keeping our class organized. She had to spend time on her own studies and on top of that, she tutored others. I had no idea if she could keep going at that pace all the way up until test day. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as I was about to ask Horikita about that though, Nanase showed up at the library, alone. She quickly located us, rushed over toward us, and bowed her head. From the looks of things, Housen wasn’t going to be showing up to this initial discussion.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry to have kept you waiting,” said Nanase, politely.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah, we just got here ourselves,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita prompted Nanase to sit down in the seat directly across from her and opened the discussion with a brief introductory greeting.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, well… Once again, my name’s Horikita Suzune. Thank you for making the time to talk with us today,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, and I’m… Err, I mean yes, I am Nanase Tsubasa. I haven’t done anything worthy of your thanks, though. If anything, I should be the one thanking you,” replied Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe were all in Class D, so we all started from an exceptionally humble position. Horikita, after listening to Nanase’s polite and proper words, decided to immediately get down to business. “I’m sorry for how sudden this might be, but do you mind if I ask you some questions?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not at all, please go ahead,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“First, just to establish a baseline, I’d like to ask what your class’s policies are. Two students in your class confirmed partnerships today, while the status of the remaining thirty-eight students in your class remains to be seen. You were one of the two students who confirmed a partnership, aren’t you, Nanase-san?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile it wasn’t clear if it was Housen or someone else, it was clear a member of their class was giving orders here.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s correct. I had a feeling you’d ask me about that. I’m assuming you asked Kajiwara-kun that same question today, yes?” replied Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKajiwara was the name of another student in Nanase’s class. Apparently, she already knew that Horikita had reached out to Class 1-D students during lunch today. If that was the case, I supposed we ought to assume she also knew that we had reached out to Shiratori and his friends on the first day of the exam period.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m surprised. You seem to have a very good handle on this situation,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Many students are already acting on Housen-kun’s orders,” said Nanase matter-of-factly, openly admitting that Housen was the one taking the lead, rather than being evasive about it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is it because of his aggressive attitude? No, I can’t imagine that’s all there is to it. What methods did he use, exactly?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase looked like she was lost in thought for a brief moment. Then she opened her mouth to speak.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I am terribly sorry, but unfortunately, I can’t tell you exactly what kind of methods he used. Housen-kun brought the class together. Whether the way he did that was right or wrong, I do not know. But letting word of it get outside our class would be an act of betrayal,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. You’re correct in saying so,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn response to that, Nanase thanked Horikita again and bowed. I supposed that just because we were Nanase’s seniors, that didn’t necessarily mean she was going to tell us anything. Just like in our conversation the other day, she seemed to have firm thoughts and convictions as a member of her class.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, I’ll get right to the point. Is it safe for us to assume we will be able to work with your class, just like those two students who settled on their partnerships yesterday?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As I’m sure you’ve already heard from Shiratori-kun, our offer is always open. As long as you offer us a set number of Private Points with your proposal, we will accept whatever partnership requests you make, without hesitation,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo our chat with Shiratori and his friends had reached Housen after all. From that, we could infer a high number of points were paid out to the two students from their class who had gotten partners.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But what I’m asking you about today is different from establishing a partnership contract based on points,” replied Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I know. I’ve already heard a little about your offer from Ayanokouji-senpai. A collaborative relationship where we would cover for each other—that is to say, mutually work to protect the less academically inclined students in our classes, yes?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. If you’ve come to this discussion understanding all that, there must be some room for negotiation, yes?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There is… Or at least, I’d like to think so.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase’s face darkened. Then she continued speaking.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Housen-kun’s way of thinking is rooted in ideas of intense individualism. And he enforces that ideology. If things continue at this rate, the less academically capable students will be unable to find partners, and get left behind. If they only got their Private Points withheld for three months, that wouldn’t be too bad. But I fear they’ll end up being branded as incompetent for their failure to find partners. Well, no… I suppose that might not be too bad, either. What I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ereally\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e don’t want to happen is for this intense sense of individualism to dominate our class in the future, to the point where we lose any sense of unity,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita listened to everything Nanase had to say, and then mentally calculated what might happen to Class 1-D in the future.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Right, that is a valid concern,” she said. “If no one in the class helps each other out, the trend toward individualism will naturally accelerate. Once there’s no one around to assist other students, everyone will feel like they must do things on their own. Once that ideology has sunk in, even if someone does ask for help, no one will step in. Which means that if your class were faced with a test that required you to function as one, you’d lose that battle.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhich was precisely why Nanase took it upon herself to negotiate with Horikita alone. She was trying to avoid that fate.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re not afraid of Housen-kun?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No,” replied Nanase, firmly, without a second’s delay.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe hadn’t glanced much at me until this point, but now looked over in my direction. It was the same look she’d given me twice before. I remembered that when I asked her something similar, she responded with \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I will never yield to violence.”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were things about her that bothered me, of course, but Nanase might be the only person who could get her class on our side. If this really was nothing more than a chance encounter, I was honestly grateful for it. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, I’d like to ask you a slightly more in-depth question. How many students in your class are currently struggling to find partners? Please tell us about as many as you can, regardless of academic ability,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe OAA app could tell you which students had yet to finalize partnerships, but not how likely they were to find a partner or not. To learn that, you could only ask someone directly related to that class.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At this current point in time, I think that there are close to fifteen students who would have difficulty in finding a partner on their own,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fifteen… That’s more than I thought,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, many students in our class hadn’t found partners, either. If we came up with good combinations of people, there was still room for our classes to work well together.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nanase-san. If you’ll allow it, we would like to come to a rather significant arrangement with your class,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A significant arrangement?” she repeated.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m hoping you and I can come up with fifteen partnership pairings and take care of this matter all at once, Nanase-san. It doesn’t matter if they have an E or an A in academic ability. There are no conditions. And of course, no points will be involved. An equal partnership based on mutual collaboration, where we both strive to help those who need it,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, give-and-take. The idea was that we would mutually give and take what we needed, without getting points or feelings involved. Establishing such an agreement would likely greatly reduce the probability of students getting expelled.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut both Horikita and Nanase knew that it wasn’t going to be that simple.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is all based on the assumption that we can come to an agreement. But there’s no guarantee that we can save the students in your class who are near E-rank in academic ability, Horikita-senpai. Most of the students in our class who are struggling to find partners are around C and D level,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if the highest-ranked student they had available had a C+, they’d still be at significant risk if they were paired with an E-ranked student from our class. You might say the benefits of such an arrangement were almost nil.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, I’m going to need to ask you to do your absolute best to make sure things don’t turn out that way for us,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I suppose you’re right. Even so, I don’t think we’ll be able to come to terms that easily,” said Nanase, not denying that there could be issues, but openly admitting to it. “Housen-kun would never approve of helping you for free. Especially not now.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass 1-A had held onto a great many points ever since they started school last year, and they had ample funds saved. Even though Class C had blown through a considerable number of points in order to save Ryuuen, they still had a stable supply of funds thanks to their contract with Class A. I was sure Ryuuen’s classmates probably had a fair number of points saved up, too. Considering the current situation, where 2-C and 2-A were throwing around lots of points in a bidding war, it was not at all surprising that the new students would want to sell themselves to the highest bidder.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo you could say that Housen’s way of thinking was correct. But even if he tried to put a high price tag on the kids from his class, the truth of the matter was that they were asking for more than the other classes. The small number of students from his class who had settled on partners spoke to this.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if it would be for the good of his class?” asked Horikita. “There should be no downsides to this for him.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt would be more of a downside if some students were unable to find partners and thus deprived of Private Points they were supposed to have raked in. Though I was sure that went without saying.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know what you’re trying to say, Horikita-senpai. I\u0026#160;understand much of what you’re saying very well,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe seemed to be responding quite positively to Horikita’s proposal. However…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But… I don’t think Housen-kun will allow it, after all.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was a slight pause. I had a general idea of what she was thinking about. So I took a guess.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, there’s one thing we can be sure of. Housen isn’t taking the points for himself\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought the reason Housen was only allowing partnerships to form if people paid a high number of points was because he was taking the points for himself. However, if that were really the case, then he’d be more proactive about trying to set up even the lower-ranked students. And in extreme cases, he’d be telling those students to hand over what points they have so he could go find a partner for them.” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, you’re certainly right… Three months’ worth of Private Points is nothing to scoff at. It would be much better to pay Housen-kun half your points and be saved, rather than get a failing grade and not get any points at all for all that time,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was nothing to suggest that Housen was doing anything of the sort, though. Not in what we’d seen their class do so far, nor in our conversation with Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-senpai’s deduction is correct. Housen-kun has not received any kind of compensation from our classmates,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was controlling his class and imposing rules upon them. Presumably, if a student broke those rules, they would be completely ostracized by Housen and his followers. Which was why they didn’t dare try and find a partner without permission. They couldn’t. And the reason why no one from their class showed up to the meet-and-greet was because they knew it would be pointless.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Couldn’t you use your influence to control even a few of the more academically gifted students?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no form of quid pro quo of any kind in Horikita’s proposal. She was only asking for students from both of our classes to help one another. Unlike the students in our grade level, though, the new students naturally had less emotional attachment to their class and to their friends. It was unreasonable to expect them to have formed strong emotional connections only a couple of weeks after enrollment.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I tried talking to a few of them, but none of them said they’d even consider it,” replied Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It sounds like some form of quid pro quo is a requirement after all, then,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we only need a couple people, couldn’t we work out an arrangement using points?” I asked, turning to Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf our goal was to fight with our wallets, like Class A and Class C, we’d need a huge amount of funds in order to recruit a significant number of students. But if we focused only on getting a few students, just enough to stop anyone from being expelled, our costs would be reduced accordingly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s true… I suppose that if we really run out of options, we’ll have no choice but to go that route. But relationships created using Private Points can only be maintained using Private Points. I want a relationship that goes beyond that,” said Horikita, responding to me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe then turned to look right at Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean by that?” asked Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Our grade levels are on different playing fields. First-year students have no risk of being expelled, so you’re in a better position than us. However, that dynamic won’t last forever. The day will come when you have to do battle while facing possible expulsion, not too far from now. If you only establish relationships based on points, what do you think will happen when the time comes that you need to pay up and are out of funds?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSome students might still make it through, but it wouldn’t be surprising if many of them did not. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Which is precisely why I’d like to establish an equal partnership, not a dynamic based on points. And I want to build trust. The special kind of trust that comes from us being from different grade levels,” added Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was essentially saying that by doing things this way, establishing this kind of partnership, we would be able to discuss things as equals when students from Nanase’s class had problems in the future. In short, a strategy that valued trust, just like what Ichinose was doing. The main difference between us and Ichinose, though, was that we were partnering exclusively with Class 1-D, while she was helping students from every class. Instead of trying to appeal to everyone, Horikita had zeroed in on Class 1-D, wanting to establish a collaboration with them. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe were already on the fourth day of the special exam period. We couldn’t afford to waste any more time. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase must have understood how driven Horikita was. Even so, her darkened expression didn’t light up.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand very well what you’re trying to say. But I don’t think that my peers understand the same. Many of the first-years are already frantically working to save up Private Points. They would see partnering with someone for free as a loss, simple as that,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe only way they’d understand would be with time, as they came to know the system this school operated on.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Right now, there are two major obstacles in the way of us partnering up with your class, based on what you’re telling us. We need to convince Housen-kun, and we need to persuade the honors students who want points. Well, I suppose the latter point could really apply to students from any class, not just yours, but…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was certainly true that, at least on the surface, the many obstacles in our path made it seem like it wasn’t particularly beneficial to team up with their class. One of those obstacles, in particular—dealing with Housen. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut that wasn’t actually true. I wondered if Horikita was aware of this fact.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please allow me to discuss things with Housen-kun,” proposed Horikita, having decided that it would be impossible for us to proceed any further without Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I suppose that’s reasonable… If we’re going to try to establish an equal partnership, there’s no avoiding the fact we’ll need to talk to him,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If it’s all right with you, I’m ready to meet with him immediately,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand. I’ll try calling him,” replied Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe took out her phone and headed toward the library exit.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems like Housen-kun’s control extends even further than I had imagined,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seems like it,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My idea about teaming up with Class 1-D isn’t…wrong, is it?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looking to the future and trying to build a relationship with them isn’t a bad strategy,” I told her. “If anything, I’d say it’s a prerequisite for what we need to do. Sakayanagi and Ryuuen are trying to buy the trust of skilled first-years by using their class’s reputation or using points. Ichinose lacks for points, but she’s also working to build trust by saving those in need of help. You’re doing something similar to Ichinose, but you’re focused on building a relationship with just one specific class. Right? It’s the same thing, but with different methods and in a different form. You’re already becoming a leader who can compete with those three.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita nodded after hearing what I had to say. Now, we just had to see how well she could handle negotiations.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs we waited, I saw Nanase beckoning us over towards the exit, bowing to us.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder if something happened,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s go and find out.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe left the library and joined up with Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please excuse me, senpai. Um, well… Housen-kun is on the line,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe handed her phone over to Horikita. It was currently set on mute. Horikita took it from her and then put it on speakerphone before beginning her conversation with Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry to have kept you waiting,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Sup. I heard a li’l bit from Nanase.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If possible, I’d like for us to meet in person so I can explain my proposal to you directly,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Ain’t no need. Don’t gotta bother meetin’ up,” \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ereplied Housen, with a laugh.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, does that… mean that you’re not willing to negotiate?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Exactly what it means. Wasn’t even any point in talkin’ to ya on the phone, but Nanase wasn’t havin’ any of it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Housen-kun, I think that it would be a good idea to consider her offer,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Shut the hell up. What right do you got to talk to me like that, huh? HUH? I’ll kill you.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have no intention of letting you kill me. Please meet with Horikita-senpai at least once,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“If you can’t cough up enough points, then don’t bother contactin’ me again.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase tried to continue the conversation, but Housen quickly ended the call. She immediately called him back, but no matter how many times she dialed his number, he didn’t answer.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I’m so sorry!” shouted Nanase, apologizing to Horikita and me while bowing her head as low as she possibly could.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t like she’d done anything wrong, though. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, lift your head. My plans and Housen-kun’s are completely different. It was clear things weren’t going to work out that easily. I’m incredibly grateful that you went out of your way to assist us so much,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It really wasn’t much…” replied Nanase, bashfully.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think that’s all for today. Now, we need to think of a way to get Housen-kun to talk to us. But I’d like to try and get this over with by the end of this week,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf this got drawn out any longer, she’d have to start looking beyond just Class 1-D. Nevertheless, I hoped that it wouldn’t come to that. It would be quite a painstaking task for us to try and snatch up students from the other three classes, when they’ve already been thoroughly picked over.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m awfully glad to hear that you still haven’t given up, Horikita-senpai. But…” Nanase trailed off, swallowing the words that were about to come out of her mouth. She was probably going to tell us we’d never be able to form a real partnership with Housen, but had decided it would be all over if she actually came out and said that.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At the very least, we conveyed to Housen-kun what I want to do. That’s enough for now.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though Horikita was running out of both time and patience, she still spoke encouragingly to her junior. Horikita then suggested we all walk back to the dorms together, but Nanase apparently had somewhere else to be, so she left, after telling us that she’d like to meet us again in the library tomorrow. Maybe she went to go meet up with Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s head back. I’ve still got a full schedule ahead of me today,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom the sounds of it, she was going to hold a study session with Sudou and some other people after she got back to her room.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, and I think I’d like to hear more about your partner situation now, if possible. Like if you’re going to be finding a partner on your own or if you’re planning to let me handle it for you. It might have an impact on things down the line,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf we were going to start negotiations with Housen, I was sure we’d probably need to adjust the specific number of people involved.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s someone I think I might be able to work with,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Does that mean you actually have a specific person in mind, rather than looking at academic ability rankings? Who?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s a secret,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A secret…? What do you have to hide from me?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve only just scratched the surface of what this person is like, I don’t know anything beyond that about them yet.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that really that much of a problem? We all have to fumble around and do our best to help each other, right?” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I guess so. I thought it would become clearer to me today, but… Well, I guess I’ll know by the end of the week, at the latest.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose that’s all well and good, but…I don’t know how much I can help you even if you come crying to me at the last minute, you know.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll keep that in mind. Oh, more importantly, I forgot to ask you earlier. Are you feeling okay?” I asked her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Are you worried about me?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I probably don’t need to worry about your energy levels right now, but there are still quite a few days to go before the special exam,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf she got dizzy and worn out in the final stretch, it could affect how things went on the day of the test. In addition to her daily study sessions, she’d also spent a fair amount of time preparing for Amasawa’s cooking challenge late Tuesday night. It was obvious that fatigue was gradually accumulating.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s true that I might get worn out in the final stretch. But I don’t have the time to rest right now. I’m not planning on collapsing until after the special exam is over,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRather than just trying to look tough, she was beginning to show the mentality of someone who knew they were leading their class into battle. Yousuke and Kushida were already helping. They needed no introduction. But even other students with a high level of academic prowess, like Keisei and Mii-chan, had offered to help Horikita right away this time. So she decided to push ahead with her plan, which was based on the premise of working with Class 1-D now and into the future.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf a leader acted without thinking, or delayed making a decision, it could only have a negative impact on the ones they led. In this race against time, the speed at which we could settle things was critical to our class.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e6.1\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT WAS A LITTLE CHILLY\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e that night. I stood in the kitchen, cooking something with the vast quantities of untouched groceries I had been forced to buy the other day. This time, of course, I was using recipes and videos as a guide while I cooked. I wanted to try the tom yum goong I’d made for Amasawa for myself. The name of the dish, tom yum goong, was a combination of three Thai words, which meant “to simmer,” “to mix,” and “shrimp.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s got a unique flavor, but it’s not bad,” I said aloud.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe way the spicy and sour flavors filled my mouth, and the way the aroma shot up my nose, definitely made it seem like a dish that would be a hit with people who were into these flavors and sensations. After I was done cleaning up, I turned on the ventilation fan to get rid of the smell that had filled the room. Even though the sound was drowned by the noise from the fan, I eventually noticed my phone vibrating on my bed. I thought I’d just let it go and I’d call back later, but it just never stopped ringing, so I picked it up.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You sure took your time answering the phone,” said the person on the other line.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was Kei. This was the first time I had gotten a call from her in several days, since the special exam started. And the first thing that came out of her mouth was a complaint.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aren’t \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the one who told me to call you around this time? Get your act together,” added Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry. So, did you look into the thing I had asked you to this morning?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m only calling you because I did a great job of it. Don’t you think you’re not being nearly grateful enough to me?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I am grateful. So?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t really feel like you’re grateful at all, but… Well, whatever. Anyway, according to the clerk, only one’s been sold since April this year. It seems it barely sells at all, compared to similar things, and they’re lucky if they sell or one two a year. Oh, but get this, there was some new kid who tried to buy one,” said Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI already knew exactly who the person who’d bought one was. So I was more interested in hearing about the new student who \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003etried\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to buy one.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When you say they ‘tried’ to buy it, that means that they didn’t actually buy it in the end, right?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no way someone would be functionally incapable of buying that product, unless they did something absurd like spend all of their points right after starting school here. And if you were in the batch of new students that had arrived this particular year, I couldn’t imagine you would do something so foolish.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, anyway, yeah, I tried asking the clerk about it. Apparently, right as the kid was trying to check out, someone else came up and said they shouldn’t buy it, that they should put it back. And the student who tried to buy it was—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I listened to Kei give me details about this student, I analyzed the situation in my mind. It was a little… actually, no, it was quite a bit different from what I had originally envisioned. I’d never expected that \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethey\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e would be involved in this. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do we know who prompted the student to not buy the item?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nope. The clerk didn’t know who it was. They just said they were pretty sure that it was a girl, though,” said Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStudents presented their I.D. when making purchases, so the clerk would’ve known the name of the one who tried to buy the item. But they wouldn’t have known who stepped in and stopped them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Was my info useful?” said Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. Actually way more useful than I originally thought it’d be.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHeh heh\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. Well, I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eam\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e pretty capable, after all. You need to really show me some gratitude for this. But why’d you have me look into something like this, anyway? I honestly don’t get it at all,” said Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Neither do I.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had thought having Kei look into this would give me something to help make sense of this person’s incomprehensible behavior, but this development went far beyond what I had imagined. In fact, it was so disconnected from what I had imagined that it made me wonder if it was actually completely irrelevant.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, that reminds me, I heard that you got yourself a partner for the special exam,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, yeah. Shimazaki-san from Class 1-B, I think his name was. I feel like Kushida-san\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ereally came through and saved the day for me,” said Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that we’d dealt with the item of business, I figured I’d change the topic.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think your partner’s too bad or anything, but are you making pretty good progress on your studies yourself, Kei?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, well, uh, how do I put this…? I guess I was thinking I could start doing it at the last minute, maybe?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI knew it. I hadn’t heard anything about her going to the study group yet, so I figured as much.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This exam isn’t something you can get through completely on your own, you know. Kei, your grade is a D+. If you don’t consider the fact that you’re not really in the best position here, you could be in for a world of hurt,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know, I know that. It’s just, I dunno, I just don’t feel motivated to do anything… And if I do go to study group, you won’t be there, Kiyotaka,” said Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What? So, you’re saying that you’ll study hard if I’m there?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yeah, so? I’d work hard in front of my boyfriend,” said Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wasn’t sure if that was true or not, but if that’s the way it was, there was a quick and easy solution.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, how about we… Yeah. How about you come to my room around six o’clock tomorrow?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eConsidering the fact that we had a meeting with Nanase after class, that should be plenty of time.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can come hang out with you?!” she exclaimed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re not going to hang out, we’re going to study,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eDon’t you “huh” me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll help you study. That should help you get a little motivated, right?” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFirst of all, I’d try to get a concrete sense of where Kei’s actual abilities were at. Then, if I found she was at a level where additional study sessions were essential, I’d have to strongly encourage her to go.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re worried ’cause you’d be sad if your girlfriend got expelled, aren’t you?” said Kei rather suddenly and happily, almost like she thought she had the upper hand on me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could have answered her in a somewhat mean or teasing way, but Kei would probably be more motivated if I told her I was worried.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course I’m worried. If the girl I just started going out with got expelled, that wouldn’t make me happy,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I see… I mean, I know, right?! Well, in that case, I guess I don’t have any choice now, do I? I actually did have tons of things planned, but I’ll make a special appearance, just for you,” said Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile it wasn’t exactly the most honest answer I could’ve given her, it was a small price to get her to make progress.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What should I bring with me?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Everything you’ll need is already here in my room. As long as you aren’t late, there’s nothing else we’ll need,” I\u0026#160;told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay,” said Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, I’m hanging up now.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-Wait, hold on! Wait! We only talked about the special exam and studying and stuff though!” wailed Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, she wanted to talk about something unrelated to those matters.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I suppose you’ve got a point.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Jeez, you really are a piece of work,” said Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor a while after that, we no longer talked about the exam or about studying. Instead, she continued to shower me with criticism.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.09em;\"\u003e6.2\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eO\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eN FRIDAY\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the fifth day of the exam period, eighty-one partnerships had been confirmed. Which meant that a little more than half of all students had found partners, including more and more students from within Class 2-D. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe same held true for those close to me. Yesterday, Kei had gotten herself a partner. And now Airi and Haruka from the Ayanokouji Group had both confirmed their partnerships, too.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe driving force behind those partnerships was Kushida. She worked with her kouhai from junior high school, Yagami, to introduce some of the students in our class to kids from Class 1-B. That was a big deal. However, it didn’t solve all our problems. Although Yagami was rising to prominence within his class, he seemed to have no intention of taking on a leadership role, and was only cooperating with Kushida as an individual, at most. It wasn’t like he could provide us with enough students to cover everyone in our class who was struggling. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYagami had only one condition for his cooperation. Namely, that he had to be Kushida’s partner. That had apparently come to pass yesterday, as reflected in the OAA update. Having Kushida partner with Yagami basically used up one of our more academically gifted students, but Horikita didn’t seem dissatisfied by the exchange, considering the level of support we’d gotten out of it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were still quite a few capable people left in our class, including Horikita herself, Yousuke, Keisei, Mii-chan, Matsushita, and others. In any case, just because a student had chosen a partner didn’t mean they could rest easy. You had to study hard. That was completely unavoidable. If anything, it could be said the competition only really got started once you found a partner. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though I wasn’t speaking to anyone all that much, I could sense a feeling of unity in our class, with people working together. This was possible precisely because we were friends who had been through thick and thin together for a year. And in the midst of all of that…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOne of the students stood up and tried to leave. Then\u0026#160;Horikita, as if she were waiting for the right moment, walked over and called to him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems like you still haven’t found a partner yet, Kouenji-kun.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And what of it?” replied Kouenji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was an act of intervention on Horikita’s part, with the single, solitary person who wasn’t contributing to our class’s togetherness.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just thought I’d talk to you and see how your situation is going, as your classmate. So, how are things?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYou generally knew what even the students who worked independently were up to, because they would talk to the people around them. But since Kouenji didn’t say anything at all, we couldn’t tell what was going on with him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re smart. You’ve never even considered the possibility that you might get expelled, have you?” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course not.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose not, no. Even if you were partnered with a student with grades like Ike-kun’s, you would still score close to four-hundred points quite easily. I think you’d be safe,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eGenerally speaking, you’d think we might want to position Kouenji as one of our most valuable assets, since he was a smart student. I supposed that was the purpose behind Horikita reaching out to him like this, but still…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFu fu fu\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. What I’m saying is that I am not going to do anything in this special exam. The important thing is that whoever my partner will be gets a score of one hundred and fifty points or higher on the test. As long as that minimum-level requirement is satisfied, it will be quite \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eeasy\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e for me to get a high enough score to pass, you see,” replied Kouenji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAccording to what Chabashira told us, everyone should be able to at least get one hundred and fifty points on this test. So, unless you teamed up with an assassin from the White Room, it was unlikely you’d have to worry about your partner getting a zero on the test, like I did. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, you still had to rely on your partner. And no matter how hard you looked, you probably wouldn’t find a student who could state with absolute, one-hundred-percent certainty that they would score a certain amount on the test. Students from both grade levels had to work on the assumption that their partners would score at least one hundred and fifty points. It was a ninety-nine-point-nine-percent certainty at best. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn order to make that as close to one hundred percent as possible, the school had implemented a rule stating that students who scored low enough that it appeared to deviate from their expected level of academic ability would be expelled. Because of that fact, Kouenji could afford to be confident. Which meant there was no need for him to go through the trouble of trying to talk to anyone or to build a relationship. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You mean you’re fine no matter who you get partnered with? In that case, why don’t you allow me to decide your partner for you? I understand you think you’ll be safe regardless of who you’re with, but I imagine you’d rather not get hit with a five percent penalty,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a rather simple offer. She was offering to handle everything for him. A proposal which could fundamentally only be beneficial to him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, certainly, it is as you say. However, I must decline your offer,” said Kouenji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Why? Can I ask you to tell me the reason for that?” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because I am who I am.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSimply put, he didn’t like the idea of being used for Horikita’s convenience. No matter the situation, Kouenji was Kouenji. If I was ever in a situation where I needed to use Kouenji in order to win, I would find myself thinking I should’ve gone with a different strategy to avoid being put in such a situation in the first place. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Satisfied?” asked Kouenji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter hearing what Kouenji had to say back to her, Horikita couldn’t keep pushing. Kouenji wasn’t the kind of person who would budge at all, even if you tried to force him. It was a waste of effort.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, for now. But you can’t carry on like this forever, you know. When the class needs to come together, we will need your cooperation,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe wasn’t talking about this particular special exam. Horikita was looking ahead to what might come in the future. It seemed she wanted to say something now for him to keep in mind.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I can understand why you’d want to rely on someone as \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eperfect\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e as I, but I don’t think I can offer you any advice,” said Kouenji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd then he left, as if he couldn’t be bothered to listen anymore, headed off to who knew where, like usual.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kouenji sure is impossible, huh,” I said aloud to Horikita, jumping in and adding my two cents almost without even thinking about it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m just irritated by the fact that if he took things seriously, our class would be that much stronger,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was hardly anything as frustrating as having a secret weapon that you couldn’t use. It was precisely because she had those feelings of expectation that she felt despair when things ended unsuccessfully. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I were in your shoes, I wouldn’t have counted on him to start with,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt would probably be easier to think of Kouenji as a special case from now, and just leave it at that.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Pr
