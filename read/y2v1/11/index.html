e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T229fc,"])</script><script>self.__next_f.push([1,"\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 5:\u003cbr/\u003eIchika’s Test\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eW\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eEDNESDAY ARRIVED\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e marking the third day of the\u0026#160;special exam period. At eight in the morning, the OAA app was refreshed for the second time, and the number of partner options we had inevitably dwindled.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thirty-four new partnerships have been decided, huh?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCombined with the ones decided on Monday, that came to a total of fifty-six partnerships. Considering that\u0026#160;there was a maximum of one hundred and fifty-seven possible pairs, that meant that 30 percent of students had already settled into partnerships. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe number of partnerships established yesterday were largely driven by Class 2-B, meaning many of them had something to do with Ichinose. It seemed several first-year students had carefully thought through their options after the meet-and-greet, and then decided to partner up afterward. Basically, I could confirm that many first-year students with a low level of academic ability had partnered with Ichinose and others from her class. Also, considering that some honors students’ names were now gone from the list of first-years, and some names of Class 2-C students were also gone, I could infer that Class C had successfully negotiated a few using points or the like.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn my own class, five partnerships had been decided, starting with Kushida. I checked Class 1-B’s page and saw that Yagami Takuya also had a partner. He might have paired up with Kushida. But the strange thing was that not a single person from Class 1-D had formed a partnership yet. Looking at the entirety of both of our grade levels, this was unique. If I didn’t get out there and really make a move now, I would probably be stuck. There wasn’t a single student here who could look at my scores objectively and tell me, ‘Hey, let’s team up.’\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was only natural that a student, regardless of whether they were academically gifted or not themselves, would want to team up with someone smart. Unlike the second-year students, who had learned to act for the sake of the class, the first-year students probably weren’t going to care that much about anyone else. They were more likely to see even their own classmates as rivals.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt the very least, people would put off looking at me until the high achieving students were taken. That was exactly why Tsukishiro must have told his agent not to let this opportunity slip by. Naturally, any student who came to me looking for a partnership or allowed me to partner with them would arouse my suspicion flag. However, if I remained indecisive forever and didn’t settle on a partner, my chances of getting paired up with Tsukishiro’s assassin would increase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI needed to be certain that my partner wasn’t Tsukishiro’s assassin, but that probably wasn’t going to be easy. In truth, I couldn’t even imagine what kind of act this person was putting on to pass off as someone else. I could look up everyone’s face, name, and scores in the OAA app, but there were no clues to be found there. If all one hundred and sixty first-year students were my enemies, then that would be checkmate for me. No hope of escape.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was such a ridiculous notion. I didn’t think even Tsukishiro could possibly pull all that off, but…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo, that wasn’t it. The important thing was for me to figure out a way to survive, even if everyone was my enemy. For now, I needed to pick a safe choice from the remaining one-hundred and four available students. There was no discrimination on the basis of sex for students raised in the White Room, making it impossible to narrow down the list of suspects on that front because they adhered to gender equality as a principle. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo how should I exclude people as possible suspects? One conceivable way would be based on physique. Meals served in the White Room were strictly controlled, down to the finest details. It was basically unthinkable that any child raised in that environment could become obese. Meaning that if I were to pick an obese student as my partner, I could avoid the White Room agent… That was one simple plan that came to mind.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut that wasn’t an absolute guarantee. It was entirely possible that the student from the White Room had been preparing to get me expelled for several months now. With that in mind, it wouldn’t be impossible for them to plump up or slim down if they wanted to. That would be easy for someone who endured the rigorous curriculum of the White Room to pull off.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut even if I were to put all that aside, I still had some doubts about choosing a student with a sub-standard physique. Granted, it was hard to be sure, because full body pictures weren’t displayed in the OAA app. There were only two students who were clearly obese, but I couldn’t rule out the possibility that either of them could have been sent by Tsukishiro. That was because I had to assume that the assassin might not just be someone from the White Room, but also someone from the general student population. They might have been offered the chance of going to a better college upon graduation if they got me expelled, for instance. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy next thought was to see if I could narrow down the list based on academic ability. That would also be difficult. If the student came from the White Room, then it wouldn’t be a problem at all for them to get a perfect score on the entrance exam. They could easily get an academic ability ranking of A or A+ without even trying. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, they could freely control what scores they got. And I was sure whoever this agent was had heard about the OAA app being implemented. It wouldn’t even be surprising if the agent had gotten an academic ability ranking of E and was lying in wait for me. Similarly, it would be impossible for me to narrow it down based on whether they had been sorted into Class A or Class D.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI understood all that, but right now, I had nothing to work with. No way to narrow down the list of suspects, no matter what angle I came at this situation from. There was something I needed to do now. Namely, I needed to look at students with my own two eyes and confirm their authenticity. If I knew for sure that they weren’t not my enemy, I could partner with them or ask them to become a collaborator. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI set myself one goal. Starting today, whenever I arrived at class in the morning, during lunch, and after class ended, I would reach out to the first-year students that I saw over the course of the day, in the order I saw them. Then, I would try to gain their cooperation. There was no way Tsukishiro had sent someone I could detect at a glance, so I had no choice but to fight back with the element of chance, which was something he couldn’t interfere with.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy academic ability ranking, C, was by no means high. I wouldn’t be able to use that as a weapon. But it wasn’t like there would be \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eno\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e students willing to partner up with me. If I did some digging, I’d probably find some people.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e5.1\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eWALKED OUT OF THE DORMS\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e and headed to the school building. While on my way, I quickly spotted a couple of first-year girls walking along and chatting with one another. Their names were Kurihara Kasuga and Konishi Tetsuko. They were both in Class A, but unfortunately, also academically gifted students who had solidified partnerships on the first day. It would be impossible for me to ask either of them to be my partner.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, I supposed the fact that they’d already decided on their partners wasn’t that much of a problem. If anything, it made them the best kind of students to turn into collaborators. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt’s just, well, it was kind of difficult for me to actually talk to them…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though there was the fact that I’d be approaching them under the pretense of needing to find a partner for this special exam, how exactly would a second-year guy approaching a couple of first-year girls appear to an observer? I couldn’t help but wonder. I didn’t really have the guts to just start talking to them and go “Good morning!” like Yousuke or anything. It was probably out of the question for me to just stroll up to them and confidently ask them to introduce me to a friend I could pair up with,\u0026#160;too.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt any rate, I couldn’t afford not to at least try. Giving in right here and now wouldn’t exactly be smart. Right. Precisely so. I’d made up my mind. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut what was the best time to make my move? Rather than insert myself into their conversation while they were happily chatting, I thought I should wait until that conversation died down a bit.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile I was observing the two girls, another voice called out to me from behind.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good morning, Ayanokouji-senpai.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was Nanase Tsubasa, the girl who was with Housen the other day. She was now the third first-year I’d seen today, and she was giving me a sunny smile.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_4\" src=\"/hola-lector-agua/images/books/y2v1/OEBPS/Images/INTERIORIMAGES_4.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, hey. Morning.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI hadn’t expected someone to come up and try to talk to me, so there was a bit of an awkward pause.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you need something from those two girls? Would you like me to talk to them?” said Nanase, suggesting she reach out to them on my behalf.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase was a first-year student, too. If she did call out to those girls, it was highly likely I’d end up talking to all three of them at once. That would be an even greater hassle.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah, it’s okay,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, really?” said Nanase curiously. She walked by me, just about keeping pace.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as I was trying to figure out how to approach those other two girls, I’d unexpectedly started up a conversation with Nanase. I was extremely grateful she’d saved me the hassle of trying to talk to somebody, but…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no way a first-year student coming up to talk to me was a coincidence. It was quite possible she’d been waiting for me to come to school, timing her move just right. And that possibility didn’t just apply to Nanase, but any and every first-year student who took the initiative to come up and talk to me. Just like Amasawa yesterday, she was a student who’d approached me, rather than the other way around. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I apologize for Housen-kun’s rudeness the other day,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah, no worries. He didn’t do anything to me. There’s no need to apologize,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Still, that doesn’t change the fact that he caused trouble for you. Even though I was there to stop Housen-kun from doing things like that, I’m now keenly aware that I’m, well, powerless,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnlike the wild, aggressive Housen, she was extremely personable and spoke in a polite manner. Her highly preferable attitude, combined with the fact that she had a B in academic ability, made her a fantastic candidate for a partner. It wouldn’t have been surprising if she’d been scouted by people other than me. But here we were, on the third day of the exam period, and she still hadn’t partnered with any second-year students. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, that was probably due to Class 1-D’s policy. Aside from her academic ability, she had scores of C+ or greater in physical ability, adaptability, and societal contribution. Very well-balanced scores. At first glance, I\u0026#160;couldn’t see anything about her that remotely resembled a flaw. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhich was exactly what begged the question of why Nanase Tsubasa was placed in Class D. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBasically, the idea of Class D was that students who were assigned to it tended to have some kind of problem. For example, people like Yousuke and Kushida might appear perfect on the surface, but when you dug deeper, you realized that wasn’t the case. Meaning I couldn’t deny the possibility that Nanase also had hidden problems of her own. However, there was also no guarantee that this year’s batch of Class D students would necessarily follow the same trend. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePersonally, I didn’t mind if someone had a few problems with their personality or their values. Whether I asked her to be my partner or my collaborator, the only important thing was whether Nanase was on Tsukishiro’s side or not. I was concerned about the look she gave me when I met her for the first time the other day, when she was with Housen, but…that look was gone, now. The way she looked at me now seemed normal. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Have you decided on a partner for the upcoming special exam?” I asked her, deciding to press forward to try and find out more about the person known as Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Me? No, I haven’t decided yet,” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, have people been coming up to you, to ask?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, they have. So far, I’ve been approached by upperclassmen from Class A and Class C,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs expected of someone who had a B in academic ability. It seemed like people had been talking to her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why haven’t you agreed to partner up with anybody?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t know if it honestly had to do with academic ability, or if it was about points, but decided to press the matter anyway.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry, but I can’t answer that,” Nanase apologized, bowing her head.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, you don’t have to answer any questions that you don’t want to. There’s nothing to apologize for.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt didn’t seem likely I’d get any answers about whether this was a personal problem on Nanase’s part or a problem with Class 1-D at this stage. In that case, I figured I’d try attacking this situation from a slightly different angle.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If it’s okay with you, how about we have both our classes work together to help find suitable partners? Class D to Class D?” I suggested.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe proposal I made included finding a partner for myself. Horikita also considered Class 1-D the key to this exam, and Housen seemed to harbor some kind of feelings towards Class 2-D. It probably wasn’t a bad suggestion.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Have our classes…cooperate with one another?” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. A lot of students are trying to team up with people who are academically gifted for the sake of getting good scores on this test. But if they do that, the students who struggle academically won’t get picked, and a lot of them will be left behind. If the students who struggle academically pair up together, those students will be in danger of being expelled. That includes both us second-years and you first-years,” I reasoned.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. I understand that. I’d like to avoid that happening as well, if possible,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. In order to make sure that doesn’t happen, we need a proper balance. Even though we won’t be able to secure one of the top spots, we need to find partners who can make sure no one gets a failing grade.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe were Class D. In terms of public image, we were by far the worst off. Which was exactly why Class 1-D, which had the same position as us in the hierarchy, should be likely to agree to this proposal. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you think?” I added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I agree with you. I would like to cooperate with you, Ayanokouji-senpai, if possible. It’s just…” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s just?” I repeated.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know how many of my classmates would be willing to lend a hand. And on top of that, some of the students who are more confident in their academic abilities are already in the process of deciding who their partners will be, privately,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMany of the students who could be major players in this exam and really help with our efforts were instead looking for solid partners of their own, aiming to get top scores on the exam. The two girls walking up ahead of me fit that description to a tee. The reason that students hadn’t settled on a partner yet was probably because of other issues, like points. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter all, the important thing to know about this test was that the top thirty percent of scorers would be rewarded. So, the act of rescuing students with poor grades meant throwing away your chances at those rewards.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We don’t exactly need everyone to cooperate though. If we coordinate things well, we should be able to make it through this special exam just fine,” I said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if some of the students had already set up partnerships, it wouldn’t be a major problem.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s true. However, it’s not as though there are no other problems.” Nanase seemed to agree with the core idea of my proposal, but she had a grim look on her face. I didn’t need to think hard about the reason why. I could see it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You mean… Housen, I think his name was, right? It sure seems like he’s a major player in Class D.” I pried further into the internal affairs of Class 1-D, bringing up something that I was almost completely certain about, thanks to the interaction I had with Shiratori the other day. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. Many of the boys and girls in our class have already started obediently following Housen-kun’s orders,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo what was once just speculation had now become certainty. It seemed Housen had already seized control of his class and was trying to keep it in his grasp. Which meant their strategy of blocking partnerships from being easily established might have been put forward by Housen, too. If that was the case, then Housen wasn’t just a student with significant strength. He also had the insight, observational skills, and composure to take stock of what was going on around him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you in a kind of a special position or something, Nanase? I didn’t get the feeling that you were all that subservient to Housen.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s because I will never yield to violence,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer words were so forceful that it was hard to believe they came from her mouth, given her appearance. The statement wasn’t something she threw out there casually. There was something significant behind it. I thought I sensed something—maybe confidence—reflected in the frank depths of her eyes.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Senpai, what…do you think about violence?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do I think?” I repeated.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, are you pro-violence or anti-violence?” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf she was looking for my thoughts about Housen’s way of doing things, then there was only one answer I could give her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose if I had to choose between those two answers, then I would say pro,” I stated, clearly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was expecting some kind of immediate reaction after I said that, but I was met with silence. When I turned my gaze toward Nanase to check her expression, I noticed that the reserved look she had moments ago had disappeared. Now, she had the same eyes as when she looked at me the other day, when she was walking away with Housen. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter a couple seconds of waiting, Nanase finally spoke up. “If I had to pick one, I’d also choose pro.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t sense any emotion behind the response. What she’d just said could be either the truth or as a lie. Had Housen acknowledged the force of her conviction to not give into violence, and placed her by his side? \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo… That wasn’t the only reason. Back then, Housen reacted strongly when Nanase had mentioned “that,” whatever it was. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no guarantee whatsoever that Housen was necessarily a stronger person than Nanase. I was curious about that, but this probably wasn’t the right time to ask about it. She didn’t seem like the kind of student who would talk unnecessarily about things that shouldn’t be said. I shouldn’t carelessly do anything that might make her even warier. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShould I pull back for the time being? There would probably be a chance to try again, with Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In any case, if Housen’s the one deciding what your class does, this plan might be difficult to pull off.” I\u0026#160;started to ponder the idea of contacting other classes while still maintaining a good relationship with Nanase, but…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, um, pardon me, but if you’re all right with it… Would you like me to try to help set up a meeting?” Nanase offered, perhaps because she thought my suggestion about forming a cooperative relationship between our classes was a good plan.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I really appreciate the offer, but are you sure that’s okay?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. But I don’t know how many students will cooperate, so I cannot make any definitive promises. In the worst-case scenario, it might just be me. Is that all right with you?” asked Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLet’s put aside for a moment the question of what I thought about Nanase. It was important, for the time being, for Horikita and I to have as many opportunities as possible to develop connections with Class 1-D, for the sake of our classmates.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course. I’m sure Horikita will be overjoyed, too.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is Horikita-senpai the leader of Class 2-D?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. She’s the one keeping our class together right now.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI decided to tell Horikita it would be a good idea to set up a meeting between both Class Ds, with Nanase’s help. I didn’t know the best way to go about doing that, though, since talking openly about it in the classroom would definitely get people’s attention. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, uh… I might not be able to give you a response immediately. Is that all right?” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, that’s fine. I’ll try to get things set up on my end as soon as possible.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase and I then exchanged contact information, agreeing to get in touch later.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e5.2\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eFTER CONFIRMING\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e that Horikita still hadn’t arrived at school, I decided to wait near the entranceway. I\u0026#160;figured it would draw too much attention if I were to casually start talking to her about this subject in the classroom. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShortly afterwards, Horikita showed up. She gave me a puzzled look, not even considering that I might be there waiting for her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good morning. Are you waiting for someone?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, something like that, I guess. She just got here,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe briefly turned and looked over her shoulder. When she noticed there was no one else around whom I seemed to be particularly acquainted with, she turned back to me once more.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Me?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. There’s something I wanted to run by you really quick.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m guessing it must be something important, if you were standing around waiting for me,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe started walking.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Important…? Yeah, I suppose so. I think it could be important. As it happens, I had the chance to speak with Nanase Tsubasa, from Class 1-D a little while ago, funnily enough. So I tried proposing a little something to her class,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh? And what kind of proposal would that be?” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought I’d try bringing up the idea of our classes working together, Class D to Class D.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Knowing you, that’s quite a bold move,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was sure Horikita had been agonizing over how to form a relationship with Class 1-D, herself. I was prepared for her to get angry with me for going ahead and proposing a partnership without her permission, but…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Have you checked the status of Class 1-D’s current partnership situation?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. None of them have settled on any partnerships yet. I’m sure Sakayanagi and Ryuuen are probably putting them on the backburner as potential candidates, too,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was only natural that they’d focus their attention on high achievers from the upper-level classes who were willing to cooperate for a reasonable number of points, rather than the students from Class D who were asking for an exorbitant sum.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure that’s not all, either. It would take a certain amount of work to comply with Housen-kun\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e’s\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e aggressive policies. I’m sure that from the perspective of the upper-level classes, dealing with him would just consume a great deal of extra time and effort,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you make this proposal to Nanase-san after understanding the difficulties that would come with trying to confront Housen-kun? Or did you perhaps reach out to her in the hopes of forming a collaboration in secret, so that Housen-kun wouldn’t find out?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you think?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI deliberately turned the question back around on her, without really giving her an answer myself. If she was no longer planning on teaming up with Class 1-D at this point in time, then I was fine with calling everything off.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve re-analyzed our situation in this special exam, in my own way. Would you care to hear me out?” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not confident I can really give you any pertinent advice, though.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not expecting any.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, she just wanted me to hear what she had come up with. It probably had something to do with what I mentioned to her today about Class 1-D.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“First of all, when you look at the first-years as a whole, it’s obvious that the most popular students are the ones with exceptional academic ability,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. If I remember right, Shiratori said he’d been approached by both Class 2-A and Class C about drafting an agreement with him, using points,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But no one among Shiratori-kun and his friends has formed a partnership yet. I think it’s fair to assume they were unable to come to a settlement based on points, then. At any rate, the sum they asked us for, five hundred thousand points, was far too steep a price,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen you considered the fact that the reward for placing in the top five was one hundred thousand points, and the reward for placing in the top thirty percent was ten thousand points, even asking for two hundred thousand points was way too much.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder how many points Hashimoto-kun and the others offered them,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who knows? But it’s probably safe for us to assume that it was a far cry from five hundred thousand,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was impossible to know the answer to that, unless you happened to be the person involved in the negotiations.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I would guess there probably wasn’t that big a difference between the offers Class A and Class C made. If I had to say, Class A’s offer might have been a little smaller,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe had probably deduced that by checking the OAA app constantly, up until this morning. Between Class A and Class C, more students in Class C had finalized their partnerships.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In terms of public image, Class A naturally has the advantage over Class C. Most people would choose Class A, unless there was an enormous difference in the number of points they were offering. With that in mind, we can guess that Class A is hoping to snatch up first-year students by leveraging both points and the value of their status as Class A, while on the other hand, Class C, is offering more points to offset their inferior public image and win students over,” reasoned Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI nodded, showing that I agreed with her conclusions.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But I find Ryuuen-kun\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e’s\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e thought process a little strange. If you want to win in this exam, then drawing the top-scoring students over to your side is at least the bare minimum you need to do. But that would inevitably mean having to compete against Class A to snatch up talent. And if Class C pits their wallets against Class A, I can’t imagine Class C would stand a chance of winning. Trying to shoot for first place in overall scores just seems reckless,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen had said that he was going to threaten people. But the truth was that his class didn’t stand a chance of winning that kind of competition.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He should be going after the students Class A isn’t interested in, even if that means lowering his standards a little,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStudents who had a B- or even a C+ in academic ability would do well enough. It would be much safer to shoot for second place in overall scores.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I suppose trying to make sense of what he’s thinking is probably pointless, but… Anyway, I’ll get back on track now. The remaining class, Class B, is trying to create relationships built on trust with the first-year students, drawing in people without regard to academic ability, to save the weak. First-year Class D aside, we can assume that many students with an academic ability ranking of D or below have been saved by Ichinose-san,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe briefly turned around to make sure that no one was eavesdropping on our conversation. After she made sure no one was listening in, she continued speaking.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Which means our current objective is to reach out to the mid-tier students in each class. The people who have an academic ability ranking between C+ and B-,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe students in that range probably wouldn’t be approached with big offers, and there would probably be quite a few of them still available. Going after those students while Class A and Class C were scrambling to snatch up the top-scoring students was a good move. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So does that mean you’re retracting your plan of forming a partnership with Class 1-D?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. That plan is still on. In fact, if anything, I should say it’s seeming more and more like the optimal choice for us,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’ll abandon trying to get the average students from other classes?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat could certainly be called a drastic decision. Since we were behind the other classes in our grade level, we needed to establish a lot of partnerships, as soon as possible.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not like we’re going to sit around and do nothing, of course. This might be a somewhat malicious way of doing things, but I intend to pretend to play the money game in order to buy us some time. The mid-tier students think they aren’t going to get tempting offers of huge sums of points, unlike the high-achievers. In that case, we’ll give those students a little taste of what it feels like to be desired. We’ll make them think that they can do a little haggling of their own,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You mean your goal is to make Sakayanagi and Ryuuen have to spend their points not just on acquiring the top-scoring students, but on getting the mid-tier students, too?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’m skeptical about just how effective it’ll be, but I figure I can probably draw some of their attention that way. And in the meantime, I intend to cut a path into Class 1-D. Which is exactly why what you’re telling me now is just what I wanted to hear. I’ve been thinking of contacting Nanase-san myself\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But isn’t Housen exactly the person who wants to play the money game?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, that’s certainly true. But I have to wonder, are points really all he’s after? When he came up to the second-year floor, he said, and I quote, ‘You can’t even form pairs unless we pick you. So, I figured, hey, I’ll lend you incompetent, braindead morons a hand.’ Which means his goal is our class. Would he have really phrased it that way if he was only after points?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita asserted that there should be some room for negotiation, aside from using Private Points. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The fact that he purposefully said, ‘See you later,’ directly to me just before he left seemed to indicate something, too.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, that’s certainly true. I think it’s safe to say that Housen only has his sights on our class,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn exchange for giving up on trying to secure the top spots, Horikita had set three core principles: “No one will get expelled,” “We’re not participating in the money game,” “Aim for third place or better in overall scores.” It wasn’t an easy task, but that was exactly why we were focusing on Class 1-D.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At any rate, Housen-kun is certainly not going to be easy to deal with through ordinary methods. I have a backup plan.” Apparently, Horikita had devised some plans I didn’t know about. “I’m currently in talks with some people in Class 1-B about setting up a collaborative partnership.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, speaking of 1-B… Do you mean you talked with the guy who went to the same junior high you and Kushida went to? Yagami?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI thought back to what I saw in the OAA app this morning after it updated. How Kushida and Yagami had confirmed partnerships.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kushida-san and Yagami-kun partnered up together yesterday. Unfortunately, I don’t remember anything about any of the students younger than me at my old school, but he could be important. He seemed to place a good deal of trust in Kushida-san. And we’ve already been negotiating with him behind the scenes. Hopefully, if things go well, we can find more collaborators,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough this was good news, there was something that worried me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you giving Kushida instructions?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eGiven how much Kushida hated Horikita, I wasn’t sure how seriously Kushida would try to help us.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m well aware of how difficult that would be for me, all things considered. Which is why I’m working through Hirata-kun as a go-between,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. I suppose Kushida can’t afford to slack off then.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Kushida’s negotiations with Yagami resulted in even just a few students being brought over to our side, it would mean some of our partnership problems would be solved, and we could focus more on studying.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e5.3\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003e“G\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eOOD MORNING\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Horikita-san. Do you have a minute?” asked Yousuke, coming over to Horikita’s seat after first period ended and the break began.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could see what was happening from my own seat, more or less. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I went around and talked to a few people yesterday, but it seems I can’t really get anyone to work with us that easily, after all. There were some kids who said they’d consider teaming up with us, but, well…” said Yousuke, trailing off.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though he talked to people who played soccer, just like him, it sounded like things hadn’t gone so smoothly. Besides, no matter how good Yousuke was, it would be difficult to get first-year students who had only just joined the club to really open up.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The first-years asked for points, didn’t they?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYousuke nodded. Horikita continued speaking.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, they have the chance to sell themselves for a high price, so I suppose that’s not surprising.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as we had imagined, the problematic point buyout idea was running rampant all throughout their entire grade level. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They told me they were approached by Class 2-A, wanting to partner with them. And that Class C came asking to partner with them too, in exchange for points. It wasn’t just the kids I talked to, either. From the sounds of it, almost every single student who got approached by Class A also got an invitation from Class C, too,” said Yousuke.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose that’s only natural, considering the competition over who gets the smart kids is quite stiff.” Horikita had already predicted this would happen. However, the words that came out of Yousuke’s mouth next were not what she expected.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But apparently, even some of the kids with C and D ratings have been approached. I heard some stories about how the invitations came with offers of pretty hefty sums of points, too,” said Yousuke.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Meaning they’re not necessarily prioritizing the students who are more capable academically?” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As far as I can tell, yeah,” said Yousuke. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. If you can remember any specific names, could you share those with me?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYousuke proceeded to list off names of first-year students who were known for a fact to have received invitations from Class A. Horikita looked up their names in the OAA app, and quickly understood what was going on. The students who were being invited excelled in some other area, even if their academic abilities weren’t so great. They were valued for their high physical ability rating, or for their adaptability rating or societal contribution rating.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see… Well, actually, I expected as much,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe they’re looking ahead to the future, and not just focusing on short-term results, then,” said Yousuke.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis wasn’t necessarily the only special exam where we’d be cooperating with the first-year students. If there were more instances where we had to work together, we might need skills other than academics at the time. Save the students who had concerns about their academic prowess, and make use of them later in their field of expertise—I was sure that was what Class A was thinking. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat being said, it was interesting that even Class C, led by Ryuuen, was doing the same thing. They weren’t just going after students with a high level of academic ability. They were following in Sakayanagi’s footsteps, right behind her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would be great if we could do the same, but, well…” said Yousuke, trailing off.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That would be difficult, I know,” replied Horikita, finishing his thought.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe were Class D. Sakayanagi was Class A. Even the kids who had only just started attending this school already knew which class had the better reputation. When considering their future, it was only natural that they’d favor the superior class, which could help them out more.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you. Can you keep looking into things for me?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure. If I find anything, I’ll be sure to let you know.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYousuke gave Horikita a bright, cheerful smile and then returned to his seat. Shortly afterward, I got an instant message from Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“So, there you have it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed like Horikita had sensed that I was eavesdropping on her conversation with Yousuke.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Hirata-kun certainly is dependable, isn’t he?”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“For sure,” \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe and Horikita had gotten into a spat once before, but that was in the past now. Yousuke worked tirelessly for the sake of the class, making him very dependable. His communication skills and high intelligence were assets, of course, but his greatest strength was his high degree of trustworthiness. He had a great track record. If Yousuke was involved, people believed he had things in hand. That was exactly why Horikita was willing to discuss her strategy with him so openly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“We’re at a disadvantage just because we’re Class D. It’s going to be a tough road ahead,” \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003esaid Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Even so, we gotta make do. Good luck.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“You do realize you have a part to play too, right?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“You mean the thing with Nanase?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Yes. I’d like a response as soon as possible. Tell her that we’re ready to go whenever she is.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, she was saying we ought to move quickly and seal the deal. To strike while the iron was hot, as they say. After all, if we didn’t, the other classes would keep taking more and more of the best people out there.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“It’ll probably be the day after tomorrow, though. I have to take care of that other problem first,” \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Of course. I know that,” \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003esaid Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e5.4\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eC\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eLASS ENDED\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e for the day\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e and we still hadn’t gotten a response from Nanase yet. Even if she did respond now and tell me we were on for today, Horikita and I wouldn’t be able to do anything. There was a more immediate problem that I urgently needed to take care of—namely, the rather sudden promise we’d made Amasawa the other day, to serve her a home-cooked meal. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I managed to score a passing grade, then we could get her to partner up with Sudou. An extremely enticing offer. But the hurdle I had to clear was by no means low.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I arrived at the entrance of Keyaki Mall ten minutes prior to the scheduled time of our meeting, it seemed Amasawa wasn’t around yet. So I just stood there, not bothering to check my phone or anything, but just nonchalantly watching the students come and go. Students of all grade levels came into the shopping mall, talking about this or that while they walked around. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe temperature this morning was a little higher than normal, but as evening approached, it gradually got cooler. It seemed the temperature was going to drop a little more at nighttime. Eventually, just when it was about the time we had agreed to meet, Amasawa appeared.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Perfect, Ayanokouji-senpai,” she said as she approached me with a big smile, nodding several times, as if she were satisfied about something.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you talking about?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You waited at the place you were supposed to, before the girl got there. And you didn’t even like, do anything else, either” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was unexpectedly sharp. Or rather, I should say she understood my actions quite well, even the trivial ones. When she said I didn’t do anything else, she probably meant that I wasn’t messing around on my phone or calling anyone while I waited. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSoon, Amasawa would put me to the test. Meaning, I had to serve her a meal. When I considered that fact, I supposed I could have spent the time I stood around waiting for her to look up various kinds of recipes, trying to devise a plan at the last minute. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut, if I had to express it in a way that was easy to understand, that would be like staring intently at your textbook right up until the bell rang on the day of a written test. Of course, looking up information on my phone wouldn’t have violated any of the rules Amasawa had set. However, it probably would’ve made me appear like someone who wasn’t confident in his cooking.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe same went for making a call, which would make her think that I was seeking someone’s help. Therefore, I deliberately chose to do nothing to make it appear as though I were cool and collected. I had intended to try to implant that impression into Amasawa’s subconscious mind, but she had detected what I was doing right off the bat. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then Ayanokouji-senpai, shall we?” said Amasawa, lining up next to me, and quickly taking me into the mall with her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To buy ingredients, right?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yep! Well, that too. You gotta buy the stuff for what you’ll make for me. Do you have any cash?” asked Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A reasonable amount.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn truth, I really didn’t have that much. But I wasn’t going to say anything excessive in front of an underclassman. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ooh, yay! I won’t be shy then, in that case. Um, let’s see, I think I’ve heard from my classmates that they sell all the essentials here and stuff, but… I wonder where they keep the shopping baskets?” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRather than heading straight for the supermarket, she headed over toward “Humming,” a store that specialized in carrying everything you needed at home. She picked up a blue shopping basket that she found near the entrance to the store. What she said earlier, “that too,” stuck in the back of my mind. I knew I was going to cook a meal for her later, but did that mean there was something else I needed to do besides buy the ingredients? \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAmasawa stopped by the kitchenware section of the store. When I first started at this school, I’d come by here a few times to buy the things that I needed. Aside from students, the teachers and other adults who worked in the café and the cafeteria and such also needed these products, so there was a particularly large section of the store dedicated to kitchenware. I remembered not being able to find what I was looking for right away when I first came here.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed like all sorts of new products had hit the market since I’d been here last, which was some time ago. Considering the fact Amasawa had stopped here, I wondered if she was planning to buy some kind of special appliance or utensils. There were countless tools here after all, like peelers, graters, mortars and pestles, etc. Some of those things, of course, I didn’t have. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat I found strange was that Amasawa never asked me what tools or utensils I already had. It would’ve made sense for us to at least discuss what I already had and didn’t have. If she were worried about losing time, we would have had plenty of time to talk about it while we walked around, but I held back my desire to check with her, choosing to let Amasawa run the show for now. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eInstead, I tried to bring up a topic that had nothing to do with cooking utensils.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you not cook for yourself, Amasawa?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Me? Oh, I don’t think I’ve ever cooked before. I’m not the kinda person who really cooks and stuff. I’d rather be fed than feed someone else,” explained Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust then, she stopped in her tracks, apparently having arrived at her intended destination. The process so far had gone incredibly smoothly. Amasawa looked away from me, towards\\ the shelves of merchandise. She crossed her arms and pondered something for about half a minute, as if struggling to decide something. Then she must have come to a decision because she muttered, “All right,” to herself and nodded.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, so, first of all, we’re gonna need a cutting board, right? Then, like, a kitchen knife? Then we’re gonna need a bowl, a whisk, and then also, also, we’re gonna need a pot and a ladle,” said Amasawa, throwing the items into the basket one after another as she listed them off.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe last item she tossed into the basket was a big spoon. Apparently, it was called a ladle. I had a hunch that something was off.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, hold on a second. I pretty much have almost all of those things in my room already though,” I told her hurriedly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, no worries, no worries! I’m just having you buy these things for \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eme\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. For when you cook for me,” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was just having me get all these for her…? Even the cutting board she picked out was much better quality that the one I had back in my room. It looked like it was made from Japanese cypress and it cost a little over four-thousand points. The rest of the cooking utensils she picked out were high-quality items, too. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed she still had other items to cross off her list, because she moved over to check out the next set of shelves. As soon as she got there, she picked up a fruit knife without a second’s hesitation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For someone who claims to be a good cook, having a good petty knife is a must, right?” said Amasawa in a somewhat casual tone before tossing the item into her basket.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was a total amateur who had no idea that fruit knives were called petty knives. Oh, and by the way, the petty knife was also a high-priced item, coming in at nearly three thousand points. Even though there were several cheaper options right there on the shelf next to the item she’d picked up, she didn’t pay any attention to them. As far as I could tell, the only differences were whether they included a sheath and whether they were made in Japan. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce again, the product she’d chosen was quite an extravagant one. Apparently, people skilled in the art of cooking were expected to have mastered handling small kitchen knives like these. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, uh, just asking, but who is paying for these…?” I\u0026#160;asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, come on, you are, of course, Ayanokouji-senpai! Obviously,” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI already knew that. But the total cost of all these items easily exceeded fifteen thousand points. I supposed that meant I might as well just throw away the cheap stuff I was using now. If I thought about the fact that I could use this high-quality cookware when I cooked for myself in the future, maybe it would help me stomach this?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, and I already told you this just a bit ago, but remember, you’re buying these to
