 her face right now, thinkin’ she’s won.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She’s just seen right through what you’re doing. Even if you could actually compete with her using Private Points, there’s still the difference in our reputation,” said Ibuki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Meh, Class A’s reputation is all show right now, nothin’ more. Considering how much those guys depend on their reputation, the amount of trust they’ll lose when that reputation falls apart is gonna be unfathomable,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, but even if that’s true, what about the points? I\u0026#160;mean, I guess if the offers balloon all the way up to\u0026#160;three or four hundred thousand, that won’t be \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003etoo\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e bad, but there’s no way we can pay everyone,” countered Ibuki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ain’t no need to pay. I ain’t planning on giving anything to these punk kids who keep askin’ for more and more, like the sky’s the limit,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Huh?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I ain’t planning on forkin’ over any points. I’m sussing out exactly what kinda people these new kids are. You know what they say—money talks. But the people who are willing to cooperate if you put up the cash are the people you can bring over to your side any time. When you really need ’em to help out, just pay ’em, and that’s that. The \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ereal\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e important people are the ones who intuitively understand the things other than points,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry, I’m totally not gettin’ any of this…” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sakayanagi probably thinks I’m after first place overall. But I never planned on goin’ after such a pitiful number of Class Points from the start. If we’re gonna completely crush Class A, we’ve just gotta wait for the right time. The time when Class Points are \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ereally\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e gonna fluctuate wildly, way more than now,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, does that mean that you did all of this just to find out which of the new kids would roll over for points?” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It was obvious from the start that we could fish for brats with points, if we offered more. But there are already some kids who have partnered up with us. Why do you think they chose to partner up with Class C?” asked Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh… Yeah, actually, now that you mention it, I gotta wonder. Why?” asked Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe first offer that Ryuuen had made was for fifty thousand paid up front, plus an additional fifty thousand after the exam. But even though that offer wasn’t too high, some students had already accepted it and joined forces with Class C.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That reminds me. You always did meet one-on-one with people when you were making a partnership agreement legit… Were you threatening them or something?” asked Ibuki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah, a little. You’re right on that count,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, the students, after being lured in by a generous sum of three or four hundred thousand points, would fold after being interviewed by Ryuuen. In the end, the agreed-upon price was far less expensive than it appeared to be on the surface. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m screenin’ the new kids to see if they can understand that I’m better than Sakayanagi,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was selecting people who could instinctively identify the winning class without factoring points or reputation into the mix. Those were the people Ryuuen was really looking for in this special exam. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was looking far into the future, well past the next year. His goal was to take Sakayanagi and the rest of Class A down.\u003c/span\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 5: Ichika’s Test\",\"volumeId\":\"y2v1\",\"chapterIndex\":11,\"prevChapter\":{\"volumeId\":\"y2v1\",\"chapter\":10,\"title\":\"Chapter 4: These New First-Years are Nothing But Troublemakers\"},\"nextChapter\":{\"volumeId\":\"y2v1\",\"chapter\":12,\"title\":\"Chapter 6: Class D and Class D\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Operating Behind the Scenes\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: True Ability\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: A New Stage\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: These New First-Years are Nothing But Troublemakers\",\"href\":\"Text/section-0008.html#auto_bookmark_toc_top\",\"index\":10},{\"label\":\"Chapter 5: Ichika’s Test\",\"href\":\"Text/section-0009.html#auto_bookmark_toc_top\",\"index\":11},{\"label\":\"Chapter 6: Class D and Class D\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_top\",\"index\":12},{\"label\":\"Chapter 7: Expulsion Approaches\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_top\",\"index\":13},{\"label\":\"Chapter 8: A Deepening Mystery\",\"href\":\"Text/section-0012.html#auto_bookmark_toc_top\",\"index\":14},{\"label\":\"Epilogue: Postscript\",\"href\":\"Text/section-0013.html#auto_bookmark_toc_top\",\"index\":15}],\"volumeTitle\":\"Light Novel 2nd Year Volume 1\",\"detailsLink\":\"/select/year-2/ r\"}],[\"$\",\"meta\",\"14\",{\"name\":\"twitter:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"15\",{\"name\":\"twitter:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"link\",\"16\",{\"rel\":\"icon\",\"href\":\"/hola-lector-agua/icon.svg?icon.ae5abf30.svg\",\"sizes\":\"any\",\"type\":\"image/svg+xml\"}],[\"$\",\"$L14\",\"17\",{}]]\n"])</script></body></html>
