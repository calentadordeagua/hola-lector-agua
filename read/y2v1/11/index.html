 use them for me, and for me only. So don’t go wearing them out with everyday use, okay?” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you some kind of evil demon?” I asked her, vocalizing my rather unpleasant thoughts.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnpleasantly enough, it seemed she’d been expecting me to voice my concerns and say something vulgar in the process.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you wanna call it off, it’s okay. You can quit any time, y’know,” she teased provocatively, while clutching the edge of the shopping basket.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was taking ample advantage of the fact that I was in a vulnerable position and couldn’t refuse. Still, if I thought of this as a way to get Sudou partnered with an A-rank student, then fifteen thousand points or so was an incredibly good deal. I just had to think of it that way.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I understand. I accept all of your conditions, so feel free to pick out whatever you want, and I’ll buy it,” I\u0026#160;told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you think I’m a bad girl?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I don’t.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAmasawa stared intently into my eyes. Then, she smiled. I couldn’t tell if that was because she knew something, or because something was eluding her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then we’re all good, senpai,” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd so I had to buy everything, from the pot to the ladle and everything else. And with the horrifying condition that they all be used only and exclusively for Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e5.5\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eFTERWARD\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e we went to the supermarket to buy the ingredients, which was the main purpose of our coming to the mall in the first place. In the end, the trip cost me about twenty-thousand Private Points. Needless to say, this was the first time I’d ever bought so much stuff. The plastic bags I carried in both hands were so heavy that the handles were digging into my fingers.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo matter how hard I racked my brain, I couldn’t narrow down exactly what Amasawa was going to have me make for her. based on these ingredients. She’d had me buy all kinds of things, from vegetables to meat to fruit. However, there were some dishes I could identify as possibilities. For instance, the fact that she had me buy fish sauce and chili peppers gave me some ideas.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was just that, well…if she intended for me to use all these ingredients, that would be fine. But it was also quite possible that she was mixing in some extra ingredients to fake me out, just to give me a hard time. Considering the things Amasawa said and did today, I couldn’t help but suspect that was a possibility. It would probably be close to impossible for me to narrow down exactly what she was going to have me do at this current stage.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, that’s everything! Well then, shall we get going back to your room, senpai?” asked Amasawa. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe sounded as enthusiastic as a girl talking about going to hang out with her boyfriend in his room. But there was no way I could feel even a speck of giddiness, myself. After all, if I couldn’t make a dish that satisfied her, this arrangement would most likely be broken off. And on top of that, making delicious food for someone was a rather abstract task. If this was a test where she’d already made up her mind to fail me, then it would just end up being a waste of both my points and my time. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, I had no choice but to quietly accept these developments for now. I’d never imagined Horikita’s spur-of-the-moment decision could lead to something so exhausting and bothersome. I didn’t discuss things like the cost of ingredients beforehand with Horikita and Sudou, but considering my expenses, I’d like to bring this up to them later. I supposed I’d just tuck that thought in the back of my mind for the time being. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor now, to help me accept this situation as openly as I possibly could, I decided to go ahead and ask Amasawa a question I’d been wondering about.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, isn’t it kind of strange to want to ask a guy you don’t even know to cook you a meal and feed you, though? I mean, wouldn’t someone normally feel a strong sense of opposition to that kind of thing?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was just my own personal opinion, of course, but I thought most people would feel very reluctant to do such a thing. I mean, you didn’t just look at your food. You actually had to put it in your mouth and swallow it. You’d be concerned about things like taste and hygiene, and therefore, want to know who was making your food, how they were preparing it, and so on. As you got to know a person, a relationship based on trust would form, and those concerns would gradually fade.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You think? But isn’t it kinda like eating out at a restaurant? I mean, you have no idea what goes on in the kitchen at a restaurant, since the one cooking your meal is a stranger, after all,” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, it was certainly true that we didn’t know exactly how food in the school cafeteria was prepared or anything. But while the restaurant scenario and this situation might seem similar on the surface, they were quite different in reality.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But even if they’re only making you a single rice ball, restaurants strictly adhere to sanitation regulations. That’s completely different from having some random stranger cook for you, isn’t it?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really? If anything, I feel like I’d rather be in a situation where I could see the person cooking right next to me, though. You can see everything about them then—what they look like, how they move about, how they prepare stuff, everything. You can even tell how careful they are about stuff like hygiene. On the other hand, in some restaurants, you can’t see the kitchen at all,\u0026#160;right? I\u0026#160;mean, there are some places out there that are super nasty. They’re so unsanitary that they’ve got bugs and stuff\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e” argued Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was saying that if she could actually see the person, she didn’t care if he was a stranger.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides, I think I’ve got a general idea of how things work at this school. In the unlikely event that I end up dropping to zero points, I’d have to pinch pennies to get by, right? But I wouldn’t have to worry about all that if I get senpai to cook for me,” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI see. In other words, if I managed to make something tasty for her now, she was planning to have me do it again. This wasn’t a one-and-done situation. Her intention was to make sure she had a steady meal plan in case of emergency. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs for me, well, I supposed it would be a good opportunity to improve my cooking skills. But I had to wonder if she’d be willing to pay for the cost of the ingredients.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, can you see where I’m coming from?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“More or less,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAmasawa flashed a toothy grin. However, I still had my doubts about whether it was the best thing for her to ask a senior student, and a boy on top of that, to do something like this for her. I would think it would be a lot easier for her, down the road, to make such a request of a classmate or someone of the same sex whom she was good friends with. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, I supposed I shouldn’t complain, since I was going to benefit from this. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, I am like, super particular when it comes to taste, y’know. So, if it’s not really good, then the deal’s off. Okay?” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I know. I know just cooking something isn’t enough to meet your requirements.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt certainly wasn’t a low bar for me to cross, but I just had to do the best that I could. The cooking skills Horikita had taught me in one night would be vital, though I had to wonder how much I’d really be able to make use of techniques I’d learned in the short amount of time since we accepted Amasawa’s proposal yesterday. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven so, Amasawa probably wasn’t an opponent I could deceive all that easily. I could tell from the ingredients she had me buy that she was eager to put my skills to the test.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShortly afterward, we arrived at the dormitory building. Amasawa placed her palm over her brow, trying to keep the sun out of her eyes as she looked up at the building.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m actually feeling a little nervous, going into the second-year’s dorms,” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though she said that, she didn’t look very nervous. If anything, she looked like she was enjoying herself. Like she was just going out to have fun, like normal.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, but I guess the building’s like, exactly the same as ours,” said Amasawa, giving me her impression after taking a long look at the exterior of the building and then around the lobby when we got inside.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I suppose they probably are,” I replied, casually agreeing with what she said, though I had never once gone to the dormitory buildings for the other grade levels before.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe got a few looks as we passed some of the students from the other classes. I suppose that was only natural, since I was walking with a first-year girl (not to mention the fact I was carrying tons of groceries). Amasawa casually waved at the senior students as they passed by, but her doing just drew more eyes to us, so I wanted her to stop it. I hurriedly went into my room with Amasawa in tow before any strange rumors got started.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thanks for having me! Oh, wow. It’s, like, super tidy in here. And real clean, too!” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, I just cleaned up in a hurry last night, since I was inviting an underclassman over and all.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d done that so she wouldn’t smell anything that would make her think I’d practiced cooking in the middle of the night. Now, then… The next steps were extremely important. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter I set my book bag and the bags containing the food and kitchenware on the floor in front of the kitchen, the first thing I did was start to boil water in the electric kettle. Then I walked into the living room area with Amasawa and encouraged her to take a seat. I could have had her sit someplace where she wouldn’t have been able to see the kitchen, but I deliberately chose not to do that. It was important I ensure she could see me from the side if she looked over at me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll put on some coffee. You can go ahead and watch TV if you’d like to,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thanks, senpai,” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI proceeded to make her some coffee with the water I had brought to a boil just a few minutes before. I told her to wait a bit before drinking it. Amasawa picked up the remote control I’d left on the table nearby and started randomly flipping through channels. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile it wasn’t an ironclad plan, there was a reason why the sound of the TV was very convenient for me. Subtly guiding her to watch TV and having the remote control placed nearby had been the right decision.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI headed into the kitchen, showing her I intended to get to work as soon as possible. If she casually tried to stand right next to me and monitor what I was doing, I\u0026#160;would have had to stop her, but it didn’t seem she was going to do that after all.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, and looking stuff up on your phone is against the rules, ’kay?” warned Amasawa, looking over at me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Man, you’re strict. I think a lot of people look up stuff on their phones while they cook nowadays, though.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So you’re not feeling confident?” she teased.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t say that.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then good. Because in my mind, a good cook is someone who knows recipes by heart,” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though she hadn’t explained any of that to me yesterday, I casually went along with it. I’d already predicted it would be something she looked for.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, I’ll put my phone next to my bed,” I told\u0026#160;her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI plugged in the charger cable and set my phone down next to my bed. Amasawa nodded, a look of satisfaction on her face, and picked up her cup of coffee.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d like to get this show on the road before it gets too late. So, what am I making?” I asked her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, I’ll tell you! What I’m going to have you cook, senpai, is… tom yum goong!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tom yum goong…?” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat seemed to explain why she had me buy fish sauce and chili peppers, since those were considered essential in Thai cuisine. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can you do it? Pleeeease, senpai?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe dish that Amasawa had tasked me with making was tom yum goong. I had never made it before in my life, of course. Actually, I’d hardly ever heard about it, let alone tasted it, in the first place. It wasn’t a dish ever served to us in the White Room. I had seen on TV that it was popular with women, but that was about the extent of my knowledge.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I were to try and make it right now, relying only on my existing abilities, I’d probably fail. Not only did I not know the specific ingredients needed to make it, but I also had no idea what steps were actually involved in preparing everything. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo what exactly had I done all of last night then, you ask? Well, nothing rash like trying to memorize the recipes of all sorts of cuisines from every era and country. And I didn’t master basic cooking techniques, either. Considering there was the possibility Amasawa might permit me to look at recipes on my phone, it would’ve been nonsensical for me to spend my time memorizing recipes. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce it was decided that I was going to be the one cooking for Amasawa, Horikita had set two plans of action into motion. The first part of the plan was to teach me the basics. How to handle fundamental tools in the kitchen, like knives and such. I spent most of my time practicing things like slicing, julienning, dicing, and chopping. The techniques that would be more obvious, visual indicators of your skill in the kitchen. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, my skills were nowhere near the level of a professional’s. I was, at best, at around the skill level of an average person who just so happened to know their way around the kitchen a little. It would be impossible for an ordinary person to master cooking in just half a day, but I was confident in my ability to pick up skills quickly. At the very least, I’d probably gotten to the level of someone who cooked several times a week. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d been able to accomplish that precisely because I didn’t spend even a second on learning things like recipes or how to cook anything. Of course, that meant there was no way I would know how to make the dish Amasawa had just tasked me with cooking.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhich was where Horikita’s second plan of action came in. A way to check the recipe in real time, using a phone. But Amasawa had forbidden me from looking at my phone, and my poor phone was being held hostage right by my bedside. Even if I had a tablet or something at the ready, hidden somewhere, there was a chance Amasawa might spot it. In fact, she occasionally turned her watchful gaze over in my direction from time to time.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThose things were all factored into our calculations. I took something less than two inches long out of my right pocket, which was in Amasawa’s blind spot. At first glance, it looked like a normal earplug. I casually inserted it into my right ear, where Amasawa wouldn’t be able to see it, then cleared my throat, to give a signal. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita’s voice came from the small wireless earphone that I had inserted into my right ear.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I’ve heard everything you talked about, loud and clear. I\u0026#160;never imagined she’d ask you to make tom yum goong,” \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003esaid Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe idea was that Horikita, who had free access to her computer in her room and could look up information, could give me instructions on how to cook the dish in real time. Sudou’s phone was inside the bag placed down on the floor by my feet. And audio streamed from Sudou’s phone to the wireless earphones. I had been on the phone with Horikita since before I went shopping with Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDuring the time that Amasawa and I were shopping at the mall, Horikita went back to her dorm room and got everything in order. The wireless earphone was something we had bought yesterday. In the unlikely event that Amasawa got up and walked over to see how I was doing, I could casually pretend to scratch my head, remove the wireless earphone and put it back in my pocket. Since I was in a position where Amasawa could easily observe what I was doing, that meant that I could see what she was doing, too.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThanks to all that, I could make this dish without having to worry about the recipe. We had already worked out several signals to use in situations like if Horikita went through her instructions too quickly, or if I needed her to repeat a step. From this point on, how well Horikita and I communicated over the phone was going to be extremely important. Even if I knew what ingredients and utensils I’d be using, I had no visual references to go off of. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had to cook a dish called tom yum goong somehow, and left on my own, I would have been at a complete loss. What remained to be seen was just how well Horikita could give me specific instructions over the earphone, and how well I could produce something based on those instructions.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“By the way, there’s something I’d like you to check with Amasawa-san first,” \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003easked Horikita, who proceeded to tell me her question through the earpiece. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt would be annoying if Amasawa asked me to make additional things for her later, so I did as Horikita instructed and asked her, repeating the question in my own words. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Amasawa. You don’t need a whisk to make tom yum goong, and you don’t need to use a Petty knife, either. If you’re going to ask me to make you something else besides that, I’d like you to tell me now,” I told Amasawa, with a glare.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I was gonna ask you later, but I was thinking of having you peel some apples for me,” replied Amasawa. Apparently, she \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehad \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ebeen intending to place an additional order. “The rest of the food is stuff for you to enjoy later, senpai. Oh, and as for the utensils that you don’t use this time around, you can use them the next time I pay you a visit.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt sounded like the petty knife was actually going to see some use today, though I’d originally doubted whether I’d need it at all. But some of the other things were going to go in storage for a while.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Double-checking was the right call, then. I taught you how to handle the fruit knife the other day. You can manage, right?”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had no idea how well I could apply techniques I’d only learned overnight, but I figured I’d probably manage just fine.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Let’s shoot for about fifteen to thirty minutes of cooking time. Okay?” \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003esaid Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eNow, then, let’s see just how well I can make this.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e5.6\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eLTHOUGH IT TOOK SLIGHTLY LONGER\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e than expected, I somehow managed to make the tom yum goong, just as I had been instructed. And now the time had come for me to serve the completed dish to Amasawa. I’d never imagined I’d be serving a home-cooked meal I made myself to someone I’d only just met. And a girl, no less. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI placed the tom yum goong on the table and then came back with an apple in hand. I probably needed to show Amasawa that I could handle using a Petty knife, right in front of her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I normally use a regular kitchen knife to peel stuff, so I’m not really used to doing it this way. So I might be a little off\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e” I said, putting that out there as something of a\u0026#160;disclaimer before I got to work on peeling the apple.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, awesome! Incredible! You can handle it so well! You definitely pass on knife skills,” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was nowhere close to a professional, but I supposed it didn’t look like this was the first time I had ever picked up a knife in my life, at the very least. I laid out the apple slices that I had finished cutting up.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“By the way, when I think of tom yum goong, I usually think of cilantro. Do you not like it or something?” I asked her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCilantro wasn’t among the items that she had me buy today.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm, well, yeah. I guess? But I figured that if I had you buy cilantro for me, you would’ve guessed I was going to have you make tom yum goong,” replied Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom the sound of it, she had been on her guard the whole time then, and deliberately chosen to skip the cilantro. I supposed that was because she was trying to prevent me from pulling off any tricks, after all. I could understand why she’d tried to avoid giving me opportunities to exploit, but it was still pretty excessive.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you mind if I go ahead and start cleaning up?” I\u0026#160;asked her as I brought the cutting board and Petty knife I’d used to cut up the apple back into the kitchen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh, yes I do mind! You’ve gotta plant your butt right here and wait for my verdict,” replied Amasawa, directing me to sit down in front of her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince I couldn’t exactly defy her demands, I gave up on cleaning for the time being, and returned to the living room from the kitchen, as she had instructed me to do.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right. Time to dig in!” said Amasawa, slowly bringing a spoonful of piping hot tom yum goong to her mouth.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe didn’t seem to have any qualms whatsoever about having someone watch her eat. But I supposed I was like her in that regard, as I didn’t mind having people around me, either. At any rate, once she was done eating, Amasawa slowly brought her hands together in a gesture to show that she was quite satisfied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you for the meal,” she said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe didn’t seem to have eaten like a bird or anything, considering the bowl looked like it had been licked clean. But, well… though I’d tasted the dish myself before I served it, I had no idea whether the flavor was right. I\u0026#160;hadn’t made any mistakes with the measurements or anything, so I didn’t think there were any problems. Even so, if Amasawa said she wasn’t satisfied, then this battle would be over. It would end in our defeat.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, senpai, your tom yum goong is…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAmasawa paused for a moment before giving her judgment.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I guess it’s so-so. It wasn’t particularly tasty or anything, but it was good enough that I don’t think I’d mind having it again,” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe didn’t touch on the thing I was most immediately concerned about—namely whether I had passed her test.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, I’ll help you clean up,” said Amasawa, picking up the bowl and spoon she had used and heading into the kitchen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe didn’t just clean up her dishes, for some reason. She started to actually help me clean up everything, for real.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll handle it,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, no, I’ve got it, really! Besides, I forced you into making all this for me, so let me do at least this much. Take a seat and relax, senpai. I’m definitely no cook myself or anything, but I contribute at home by helping my mom with cleaning up, so I’m pretty good at that part of the job,” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, then, I’ll take you up on that. Oh, by the way, what’s my score? How’d I do?” I asked her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAmasawa fell silent for a brief moment as she continued to clean. Only the sound of the evening news on the TV could be heard throughout the room.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, yeah, that’s right. I guess I’ve gotta tell you what your score is. Hm, not sure…” said Amasawa, hesitantly, looking like she was pretending to think it over.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe must not have liked how the ribbon on the right side of her hair was sitting, because she kept adjusting it while she pondered, checking her reflection in her phone, taking the ribbon off and then putting it back on. Not long afterward, she finished adjusting her ribbon, and then proceeded to give me her verdict.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As I just told you a little while ago, it was so-so. The execution wasn’t bad, and the flavor wasn’t bad either,” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, I just barely passed then. Wow, harsh.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eam\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e very particular when it comes to food, y’know,” said Amasawa, looking at me with a big smile on her face. “I guess that means whether I come back here to eat again depends on how hard you work, senpai.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed that meant my cooking skills weren’t at the level where it made her want to drop by and have me cook her a meal that often, then. Still, “so-so”… That was harsh. I was a little hesitant to ask her if that meant we failed, but I decided to go ahead and do it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So does that mean we failed? You’re not going to help with Sudou?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, while I can’t really say you\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e passed\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, it’s true that you can cook. Still, I need to repay you, since you bought all this expensive stuff for me and you did let me eat for free. So I’ll team up with Sudou-senpai, in recognition of your efforts, senpai,” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt didn’t seem like she was satisfied, exactly, but I’d apparently just barely managed to meet her standards. Just as I was starting to think things were going to get difficult, I was met with welcome news. I breathed a sigh of relief. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll be done cleaning up in just a bit, so hold on a bit longer, okay?” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t exactly just sit there and stare at her while she was hard at work cleaning up, so I just quietly watched the news playing on the TV while I waited. Amasawa came back out of the kitchen shortly afterward, so she must have felt like she’d done the job to her standards. Then, she started fiddling with her phone, showing me the screen all the while. She submitted a partnership request for Sudou. As long as Sudou responded to her request sometime by the end of day, then their partnership would be a done deal. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sudou’s busy with club stuff right now, so I’ll let him know what’s up later. Is that okay?” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, the truth of the matter was that Sudou couldn’t respond right away, since I had his phone. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, totally okay. Well, I feel bad for dragging this out so late, so I’ll head back to my room now. See you later, Ayanokouji-senpai,” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEverything had proceeded without a hitch. She moved toward the exit to head back to her own room.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Amasawa. I’m grateful to you for pairing up with Sudou. You’re really doing a big favor for Sudou, and Horikita, too,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s all right, no biggie. But you can go ahead and shower me with your appreciation still, okay?” said Amasawa flippantly as she put on her shoes.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you don’t mind, there is something else I’d like to ask you, since I’ve got you here.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as I was about to come out and ask, though, Amasawa, who’d finished putting her shoes on, turned back to look at me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You want to know if I’ll be middleman between our classes, you mean?” she said quickly, without missing a beat.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, it wasn’t like she was in Class A and had an academic ability ranking of A for nothing. She was quite quick-witted.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, exactly. There are lots of people in our class who are struggling to find partners, like Sudou. If you could introduce us to even just one student who was willing to help, it’d really be appreciated,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, but I think that’s probably a no-go,” said Amasawa, clasping her hands together and apologizing.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe promptly turned down my request.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, but it’s not because you or Horikita-senpai did something wrong, okay? I do think I can trust you guys, y’know. But, well, I don’t really get along with my classmates all that well. I mean, when we met up yesterday, I was all by my lonesome, remember?” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now that you mention it, yeah. You’re right.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBack then, there’d been lots of students going around the mall with their friends. But Amasawa was by herself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess it’s because people say I lack tact or something, or that I tend to be pretty blunt. It’s kinda hard to make friends with that kind of personality. Which is why I can’t really help you all that much. Sorry, okay?” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah, the fact that you’re partnering up with Sudou for us is more than enough. If you have any issues, let me know. I might be able to do something to help.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, okay, thanks! Okay then. See you later! Bye bye!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile I’d failed to establish a connection with Class 1-A, this was probably enough for the time being.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I guess that’s that,” I muttered to myself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI hung up Sudou’s phone, which had still been on a call this whole time, then proceeded to call Horikita using my own phone.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good work. It seems things worked out well, somehow,” said Horikita, words of gratitude coming out of her mouth almost as soon as I got on the call with her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I get the feeling we were saved by Amasawa’s kind-hearted judgment.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even so, this means that Sudou-kun\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e’s \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eproblem has been solved. That was an excellent outcome,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was wrong of us to have used such a dirty trick on Amasawa, but in the end, it had helped. All we had to do now was make sure Sudou picked up his phone and accepted the partnership request before time was up. Considering the time, he’d probably be showing up any minute now.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why did you ask Amasawa-san to act as an intermediary between our class and Class 1-A, though? Putting aside the matter of her personality and the number of friends she has, didn’t you consider it would be difficult to negotiate with them, since we’re Class 2-D?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita had never said anything about trying to work with Class 1-A as part of her strategy for this special exam, simply because it was too difficult to build a collaborative partnership with them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just asked that as a formality. The truth of the matter is that we’re having trouble finding partners. So it would’ve been suspicious if I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edidn’t\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e say something to that effect,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf we appeared as though we had no other options, we’d be giving people the impression we were really grasping at straws when we talked to them and asked for their help. If we didn’t give people that kind of impression, but instead made them think we \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e have some options, they would suspect we had some other strategies that we were working towards.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Meaning… you didn’t want Amasawa to realize that we were giving up on Class 1-A from the very beginning, and targeting B and D instead?” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita hadn’t even considered using Amasawa to win her class over to our side, since she’d already decided to focus on those two other classes. This whole time, she’d only been hoping to take advantage of the unexpectedly fortunate opportunity that had fallen into our laps and get a partner for Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“None of us really know anything about what Amasawa is actually like. Which is exactly why what happened today could end up getting out to the rest of the new students, or even to everyone in our grade level. I took that into consideration. I might just be worrying too much, though.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter hearing me say all that, Horikita went silent for a few moments.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s wrong?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s just…your thought process, it’s… How do I put it? It’s extremely calculating and clever,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not really all that big a deal.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, it very much is a big deal. Sure, it sounds obvious when you spell it out to me like that, but the fact that you thought that far ahead is a different matter entirely. I’m starting to understand why my big brother was paying so much attention to you, I think. But the old you wouldn’t have explained everything to me so clearly. What happened?” Horikita seemed to have some concerns about how I was acting, and the possibility that I’d changed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t really have an ulterior motive or anything. Anyway, the next issue is what to do about the remaining students. I’ll let you know when I hear back from Nanase,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yes, you’re right. I’ll be waiting until I hear from you then,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter I got off the phone with Horikita, I decided to check how things looked in the kitchen. It had been thoroughly tidied up. Not only had the dishes been washed, even the sink and such had been carefully cleaned and wiped down. Everything looked as good as it did when I first came to this room a year ago. The cutting board, dishes, kitchen knife, Petty knife, pot, ladle, etc., that I had used had all been neatly put away. Everything looked perfect. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though this whole situation had sprung up out of a proposal Horikita had made, this was the first time I’d interacted so closely with a first-year student. If Amasawa had come from the White Room, it wouldn’t have been surprising for her to try and pull something, but I saw no signs of that. I was certainly quite cautious myself, but I had to wonder.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eConsidering the way she talked and how she acted, it certainly seemed like she was a normal high schooler. The kind of knowledge she had seemed pretty on par, too. If someone had just left the White Room, it would probably be difficult for them to behave like Amasawa. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“More importantly, Amasawa got paired up with Sudou. I suppose that means that eliminates her as a White Room suspect then, huh?” I asked myself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat would be my conclusion if I had to make a judgment based on the information available to me at present, including what I knew about which other first-year students had already settled on partners. It was probably too soon to come to such conclusions, though, regardless of who I was talking about. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt did seem like partnering with me would put me on the fast track to expulsion, but that being said, it wasn’t the only way the White Room agent could go about getting me expelled. It was possible that whoever this person was, they were intentionally passing up this big chance to get me expelled, this special exam, in order to find another opening to exploit. Someone couldn’t gain the kind of knowledge a normal high-schooler would have overnight, but it was a different story if they were given more time. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBesides, it wasn’t like there was nothing at all that bothered me about Amasawa. There were some things she’d said and done that stuck out to me. It might not be anything I needed to worry about, but it would be best if I could deal with anything and everything that gave me cause for concern. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wasn’t just referring to Amasawa by that, either. I was also referring to Housen and Nanase, who I’d most likely be coming into contact with in the future. Out of the many second-year students around, those two made eye contact with me first, right away. Any student who came into such close contact with me should be regarded as suspicious, regardless of whether or not we’d actually had a conversation. And from this point onward, I was going to be venturing into dangerous territory by searching for candidates for partners.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLater that night, I received a message from Nanase. It said, “\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eLet’s meet tomorrow after class.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e”\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e5.7\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHAT VERY SAME DAY\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e around when Ayanokouji was cooking a meal for Amasawa, three students from Class 2-A gathered in one place to have a discussion. They were Sakayanagi, Kamuro, and Kitou. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It happened again. It sounds like the students we reached out to all got invitations from Class C. And on top of that, it sounds like they’ve been offered ten thousand points just to turn down any offers from our class, no strings attached,” said Kamuro, relaying what she was hearing from Hashimoto over the phone. She added her own thoughts. “Wait, ten thousand points just to decide not to partner with us? That’s so dumb.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass 2-C was offering a hundred thousand points in advance just to agree to partner up with them. Then, after getting confirmation of a combined score of five hundred and one points or more on the test, Class C would offer another hundred thousand points on top of that, for a total of two hundred thousand points. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFu fu\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. Well, it seems Ryuuen-kun really intends to throw down the gauntlet with me,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what are you going to do? Do you want to fight back using points too?” asked Kamuro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, if we have a contest of financial power, we’d certainly win. But don’t you feel like winning through the same strategy as your opponent lacks a certain artistic quality?” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A certain artistic quality…? But if we need to be handing out a hundred thousand or even two hundred thousand points, shouldn’t we be getting in on this too? I mean, it’s clear that the new kids think the benefits of getting points is huge,” said Kamuro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWord had already gone around the school that the new students were in an advantageous position in this exam. A standard had been set where the honors students asked for points in exchange for partnering up with people. After hearing Kamuro’s advice, Sakayanagi simply smiled back at her, but didn’t express agreement with what she’d said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what? Are you fine with losing, then? To Ryuuen?” said Kamuro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“First of all, there is quite a significant difference in academic ability between Ryuuen-kun’s\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eclass and our own. If he’s going to make up for that difference with the help of the new students, he’ll need to draw on quite a few people to do so. And even if he does manage that, it’s not as though his victory is assured,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, sure, you might be right about that. But that doesn’t mean we’re definitely going to win either, does it?” replied Kamuro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Correct. Even if Ryuuen-kun were to gather students with academic ability rankings in the A range, that would make him just barely capable of competing with us, wouldn’t you say? Even if we did nothing at all, I would say that our chances of winning would be a solid fifty percent,” said Sakayanagi. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, put another way, that also meant they had a fifty percent chance of losing. It wasn’t like Kamuro was getting heated up because she particularly wanted to win or anything, though. It was because she couldn’t possibly believe that Sakayanagi, the girl sitting right in front of her, would just sit there and do nothing.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you imagine might happen if we said we’d pay out the same amount?” asked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What would happen? Well, Ryuuen would pay out even more, yeah?” said Kamuro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Exactly. I’m sure he would probably increase what he was offering to two hundred or three hundred thousand points,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But if we tried to outbid him, we could definitely get the smartest kids on our team,” countered Kamuro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And the cost of doing so would be a fair number of points. There’s really no need for us to deliberately risk losing millions of points. Don’t you agree?” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what, are you saying we can snatch up students even if we offer them less? I can’t really imagine the new kids are going to have a deep understanding of Class A’s reputation, though,” snapped Kamuro, though Sakayanagi still showed no signs that she was going to engage in a bidding war at all.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can tell quite clearly that Ryuuen-kun is determined to win first place overall. He seems to have completely changed his policy from last year, when he was simply out for money, like when he made that arrangement with Katsuragi-kun,” said Sakayanagi. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He was planning on saving up twenty million points so he could win himself, right?” said Kamuro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He’s undergone quite a significant change of heart, it seems. He’s realized the importance of Class Points. Well, no. I suppose I should say it’s more that he’s changed gears to make sure his class wins,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi and Ryuuen hadn’t had a single face-to-face interaction during this special exam yet. However, it almost seemed as though they were discussing things with one another, bouncing strategies off of each other.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So… you’re fine with this? With not offering to pay up Private Points?” asked Kamuro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, my, Masumi-san. I don’t recall ever once saying I wasn’t going to be using points, hm?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? But didn’t you just say that competing by using points lacks a certain artistic quality or whatever?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d like you to pass a message to the new students. Tell Hashimoto that we’re prepared to match Ryuuen-kun’s offer,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKamuro pursed her lips at this puzzling order.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However… even if the first-year students agree to our offer, please do \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003enot \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003etell them the deal is sealed,” added Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Wait, what? I seriously am not understanding what’s going on here,” replied Kamuro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFu fu fu\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. Ryuuen-kun, your strategy is actually quite convenient for me,” said Sakayanagi to no one in particular.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For the love of… I have no clue what’s what anymore,” sighed Kamuro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Ah come on, what’s the harm? If the princess says we gotta, then we just gotta do what we’ve gotta do, right,” \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ereplied Hashimoto over the phone in an amused tone, having been listening in on the conversation the whole time.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I mean, I guess it’s fine, whatever,” said Kamuro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi had instructed her followers not to confirm partnerships, even if they found first-years who agreed to accept the set number of points they were offering. Kamuro couldn’t wrap her head around what it all meant, but she passed the instructions on to Hashimoto, word for word. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi, looking over at Kamuro almost lovingly, seemed to feel a little sorry for behaving too meanly earlier. She started to explain her reasoning, giving her a few hints.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ryuuen-kun’s strategy of engaging in an extravagant deal-making spree isn’t necessarily a bad one. By deliberately going around and striking up so many deals with students, he’s succeeded in forcing me to engage with him in a bidding war. However, targeting the same students we already contacted, making us directly compete to recruit them, was a clear error on his part. Since Class C is inferior in terms of overall ability, he should be focusing solely on students with a high level of academic ability,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Ryuuen wasn’t doing that. He wasn’t just trying to reach out to the high achievers, but also to students that Class A was going to need in the future. Students who had skills in areas other than academics.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Does that mean that he’s got a ton of Private Points saved up or something?” asked Kamuro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I have to wonder about that. Even if he does have the minimum points required to pull this strategy off saved up, the number of points he can actually move around might not be all that significant. Understand?” replied Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, no, that’d be crazy though. He can only make offer after offer to all these kids because he’s got the points, right?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But you can make all the offers you like, even if you don’t have a single point. He only needs to pretend he has the points on hand.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKamuro didn’t immediately understand what Ryuuen stood to gain by doing such a thing.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If it weren’t for Ryuuen-kun, we could have successfully brought quite a number of talented new students over to our side by using our class’s reputation alone. However, he has forced us to engage in a bidding war by trying to buy these students out. And what will he do next? He’ll try to raise the stakes even higher. Try to make us pay lavish sums, as much as we can possibly spend,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see… Huh, so that’s it, then.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if Class A ended up nabbing the most talented students for themselves, the fact that they would be forced into paying two or even three hundred thousand points would work to Class C’s benefit when it came to the competition between the second-year classes.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But we’re at a disadvantage right now, aren’t we? I mean, he’s been pulling off one success after another,” said Kamuro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no need for us to panic at this stage. Some students have been bought up by Ryuuen-kun, that’s all. We can let him feel like he’s winning, feel like he’s got a feather in his cap. He’s made a few errors in judgment. Namely, he underestimates the power of Class A’s reputation. He thinks it can be nullified if we were to stumble. And he’s under the misapprehension that he can get any number of collaborators over to his side if he offers them enough money,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t really get it, but everything will work out as long as we do what you’ve told us, yeah?” said Kamuro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. That’ll be enough for now,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t really like this. I feel like we’re being forced to play along with Ryuuen’s plans. If we keep getting dragged into the messes he creates, I’m not sure what’s gonna happen.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please do not worry. It won’t come to that. We’re going to win this game without any problems.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKamuro let out a sigh, once again finding herself unable to wrap her head around what Sakayanagi was telling her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no point in trying to rack your brain over it at this point in time, so please don’t let yourself get riled up by Ryuuen-kun. This special exam is nothing more than a prelude. We’re both trying to sound each other out right now, while also keeping each other in check,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t wrap my head around any of this. I think I’m about ready to give up,” said Kamuro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But… If at all possible, I’d prefer this didn’t end in Ryuuen’s self-destruction. It’s really no fun to finish this so easily,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe looked out the window, praying that the enemy coming after her was worthy of being her opponent.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e5.8\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eO\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eN THAT VERY SAME DAY\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e just two hours after Sakayanagi and Kamuro had their discussion, Ryuuen sat with Ishizaki and Ibuki in one of the karaoke rooms.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seems like the Class 1-B kid we were hopin’ to snatch up for two hundred thousand has put our offer on hold, Ryuuen-san,” said Ishizaki, reporting his findings to Ryuuen after checking his phone.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The hell? What, is two hundred large not enough to satisfy ’em or something?” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, uh, it seems like Sakayanagi said Class 2-A will offer the same number of points, so…” Ishizaki trailed off.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They don’t wanna lose to us. How can we even win if we keep playing this game? We’re at a disadvantage,” said Ibuki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think Class A has a bunch of points. So yeah, we probably are at a pretty big disadvantage…” added Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven after hearing that news, Ryuuen simply fiddled around with his phone. He didn’t seem to be panicking at all.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“R-Ryuuen-san?” asked Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Relax. I already know everythin’ they’re up to,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe shot a glance toward his empty glass, which prompted Ishizaki to hurriedly fill it back up with water.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tell these kids we’ll pay ’em a hundred thousand up front, plus another two hundred after the exam,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“D-dude, seriously?” balked Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA total of three hundred thousand. The number of points being thrown around had grown even greater.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Most of the newbies probably aren’t gonna come to a decision, though. They’re gonna be waitin’ for Sakayanagi’s counteroffer,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, aren’t we basically nuking ourselves by doing this?” said Ibuki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf they became short on funds, then there’d be nothing else they could do.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe it’s hopeless to compete against Sakayanagi after all… Maybe we ought to try goin’ for second place…” added Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think so, too. Even if we had the same number of points to throw around, we’d lose in terms of our class’s reputation,” said Ibuki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter hearing Ishizaki and Ibuki analyze the situation, Ryuuen laughed. “\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHa\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e! I’m bettin’ that Sakayanagi chick probably has a smug grin on
