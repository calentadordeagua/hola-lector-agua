cil president was wrestling with his own anxieties, I mused. I wanted to go back to the dorms, but I couldn’t. I had to wait for Katsuragi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e3.4\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ehirty minutes after I’d spoken with Horikita’s older brother, I watched Katsuragi approach. He wore the same thing he’d had on yesterday and held some kind of shopping bag. Perhaps it contained his purchase.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWhat’s this all about?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I wondered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was still some time left before the twenty-ninth. But if Katsuragi was carrying the gift with him now, that probably meant he planned on handing it over immediately. Right? \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt any rate, I still wanted to know why he was wearing his uniform. Maybe he planned to meet with this person in formal wear, but I honestly couldn’t imagine doing something so important while wearing a uniform in the heat. I held my breath as I watched Katsuragi arrive at the crossroads.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe didn’t take the path toward the upperclassmen’s dorms. Unbelievably, he headed in a direction I hadn’t expected: towards the school. I followed, taking care that he didn’t notice me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s why he’s wearing his uniform, huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI finally understood. He wasn’t doing so because he liked the uniform—it was to enter the school building. Katsuragi walked straight through the main entrance, and I couldn’t just follow. Entering the school building while wearing casual clothes was forbidden.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eDid you meet Katsuragi?!\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy cell phone vibrated with a rather thoughtless chat message, undoubtedly sent by someone back in their room. I deliberately put my phone away, then changed my plan of attack. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI headed toward the shop where Katsuragi had picked out the present yesterday at the Keyaki Mall. Curious about the kinds of things sold in the other stores, I initially entered a shop that catered specifically to girls, but couldn’t understand the difference between the items on sale. In the end, I returned to the shop where Katsuragi had been the other day. I stood before the stacks of chocolate boxes and tried to picture him buying the gift for a man, but it didn’t seem very likely. The boxes had flourishes such as hearts and other designs that would appeal primarily to girls.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ha ha ha! I know, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSome boisterous female students passed behind me. I felt a light thump on my back.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oof.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eReflexively, my elbow brushed the stacks of boxes. The chocolates came tumbling down in an avalanche. The girls, completely absorbed in their conversation, did not notice the tragedy that had just unfolded. They kept on walking.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Jeez,” I muttered. I'd like them to notice me at least a little…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you doing?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Geh!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I frantically tried to re-shelve the boxes, a giant man called out to me. It was Katsuragi. He looked extremely perplexed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I came here to buy…a birthday present,” I stammered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was the only answer I could come up with. Katsuragi looked down at the scattered boxes, then bent and started picking them up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, it’s okay. I can do that,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry about it. I think this mess might make other customers uncomfortable. It’s best we clean up quickly. Two are better than one.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere wasn’t any hint of dislike in his voice. I’d probably only spent around thirty minutes in the mall. I wondered if Katsuragi had finished his business at school so quickly. However, he still held his gift bag. I stealthily peeked inside and saw a thin, gift-wrapped box. The present. He hadn’t given it away yet.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe finished cleaning up before we knew it. Fortunately, neither the clerks nor the other customers had noticed us tidying.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thanks a lot.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi was a good guy. Even on the uninhabited island, he’d shown a strange goodwill toward us when we discovered the corn. I didn’t expect him to be merciful if push came to shove, but he didn’t appear to be a bad person.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you giving your girlfriend a present?” he asked me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Uh, no, I don’t have a girlfriend. The present is just for a classmate. I think I’ll buy something next time, though,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI moved farther from the shelves. Katsuragi, as if in sync with me, also moved backward. I decided I’d try to extract more information.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you buying a birthday present?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm? Why would you think that?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re holding a bag from this store,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Well, yes, you’re certainly right. I suppose I didn’t think about it,” Katsuragi mused.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHis eyes met mine.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I couldn’t find what I wanted. The selection’s not great. What did you buy?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nothing major. One of the boxes of chocolates. I don’t think the selection in this store is bad at all, but I suppose it comes down to individual preference. I ought to look around elsewhere,” he replied. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi walked toward the door, and I followed him. We left the store together before I could ask who the gift was for.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why are you wearing your uniform?” I inquired. I wouldn’t have broached the topic yesterday, but he’d been wearing it for two days straight. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re required to wear your uniform if you enter the school,” he replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you went to the school?” Of course, I knew that already. What I really wanted to ask was who the present was for. I’d thought the information would be easy to obtain, but unfortunately, it didn’t seem like things were going my way. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh, well, I’ve various private matters to attend to,” he replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough Katsuragi was being vague, he seemed to have something on his mind. He glanced in the direction of the school briefly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, have you ever thought about the disadvantages of attending this school?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Disadvantages?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. I don’t mean being divided into classes. I mean something that affects all students equally.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI considered his mysterious question. The class system had its downsides, of course, but the problems it created mostly affected the lower classes—like Class D’s current points shortage. It was hard to imagine Class A in a similar situation. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince Katsuragi said the disadvantage applied to all students equally, that probably wasn’t it. But then, what in the world was he talking about? Nothing came to mind. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know. The stipulation that you can’t contact anyone on the outside,” he explained.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, I see.” I personally considered that an advantage, but it was probably bad from a normal person’s perspective.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t you want to contact your parents or siblings?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Eh. Well, I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edo\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e get the feeling that lots of students would agree with you,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eQuite a few girls, in particular, said they felt lonely. The school was strict about controlling the flow of information, so it forbade communication with the outside world. Breaking that rule could mean expulsion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But the benefits you get from the school are tremendous. That one disadvantage isn’t enough to make you feel dissatisfied, right?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“True. Both the points system, and the quality of the facilities here, are things that ordinary students can only dream of,” he replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOn top of that, Katsuragi would also graduate from Class A. Wait, why was I talking so casually with Katsuragi? And during summer vacation, no less.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re close with Horikita, aren’t you?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that misconception making the rounds or something?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Misconception? I saw you working together earlier.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s just one of those things. It’s not exactly what either of us wanted, but we were kind of forced into a partnership, I think. We really only talk because we’re seated next to each other,” I explained.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi seemed to understand. He nodded. “Ah, so that’s how it is. Well, despite seeming like I know a lot about other classes, there’s quite a bit I don’t know. If I offended you, please forgive me. I had no ill intent,” he replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah, I get that a lot. Don’t worry about it. Horikita’s pretty active, and she does a lot,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It does appear that way.” Katsuragi didn’t seem as though he was going to elaborate any further. Instead, he changed the subject. “To tell you the truth, this is the third time I’ve visited this store. I’m the kind of person who tends to agonize over things. Even if it’s just a single present, I can’t make a snap decision when someone’s feelings are involved.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSomeone he agonized over giving a present to? Who in the world could that be? I decided to try digging a little deeper.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re a really sincere person. I mean, to go out and buy someone a birthday present,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is it strange to celebrate someone’s birthday?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLooking at the giant chrome dome in front of me, I did feel like his forbidding appearance contradicted his kind actions. But that was entirely my own bias. I mean, the world even contained delinquents who’d save a cat left out in the pouring rain.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, I’ll just ask straight out. Who’s the gift for?” I asked. Questioning Katsuragi in a roundabout way would get us nowhere.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who am I giving it to?” He seemed perplexed. “It’s personal. It’s not for you to hear.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe’d dodged the question. If we’d been best friends, I might have been able to push further, but as it was, I couldn’t do much. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please excuse me,” he added. With that, Katsuragi headed back toward the dormitory.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d managed to solve the mystery of why he was wearing his uniform, but more mysteries had sprung up in its wake. Why was Katsuragi going to the school building? Why had he returned to the store? I had no idea at all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e3.5\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003e“H\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eey, Ike. I investigated the Katsuragi case.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoa, seriously? Man, way to go, Ayanokouji! I’m seeing you in a new light!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke slapped my shoulder as he complimented me. Had I really done something that warranted him reevaluating his opinion of me? Maybe he hadn’t thought much of me to begin with.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unfortunately, I couldn’t find out who the present was for,” I explained.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTo be more precise, I couldn’t find a girl who fit the bill. As I said before, no one in our grade level had that birthdate. I couldn’t think of any student from another year whose birthday was the twenty-ninth, either. Therefore, the person in question might not be a student at all. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi looked up with wide eyes. “Oh man, no way. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI know what’s going on. Whom Katsuragi wants to give that present to.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRather than looking overjoyed, he had a sorrowful expression. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Kanji. Didn’t you think that Valentine’s was hell, back in junior high?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what the hell are you asking me for? Well, sure. Yeah, it was tough. What about it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think this is basically an extension of that. I think he actually bought the gift for himself,” said Yamauchi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No way, that—n-no, wait, I guess it \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eis\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e possible. I can’t imagine that baldy is very popular…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe pair of them seemed convinced. I hadn’t considered that possibility, so doubts popped into my mind. “You’re saying that he bought the present for himself? For his own birthday?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You think it’s for something else then, Ayanokouji?” They glared at me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePeople didn’t normally buy themselves birthday presents, did they? Maybe if you thought of the present as a reward—like when you treated yourself to something delicious, or went out and bought something for yourself. This was different, however. Katsuragi specifically purchased chocolates with girlish packaging, and had them gift-wrapped. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf he had a sweet tooth, there were probably other ways he could treat himself. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You seriously don’t get it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unfortunately, no.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay. Katsuragi doesn’t seem popular with the ladies, right? But right now, he \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eis\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the leader of Class A.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI refrained from commenting on that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He’s got a lot of pride. He’d definitely want people to think that he’s popular. It’s all an act.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, he’s going to play this off like someone else bought the chocolates for him?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke and Yamauchi must’ve felt pretty sure of this conclusion, because they both nodded in agreement. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I did the same thing, back in junior high,” Ike said. “Made it look like I got a present from the cutest girl in school.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When you put it like that, it sounds hollow.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah, of course. But, that way, you’re saved from the absolute despair of not getting any gifts!” Ike sounded angry. Apparently, he considered Valentine’s Day and birthdays to be significant events.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides, you’re the same as me,” he added. “Right, Haruki?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? No, no way. I was popular with the ladies. Didn’t you know?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, why would you come to a conclusion like that? It’s because you thought Katsuragi was doing the same things you did!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah, that’s not true. In junior high, there was a really unpopular guy like you, Kanji. I knew about him. That’s it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi was obviously bluffing, but I didn’t have time to prove it. “Aren’t you just speculating?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No! That’s definitely what’s going on!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey seemed to like this theory, and they didn’t appear to have any intention of debating further.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Haruki. Maybe we misunderstood the bald—I mean, Katsuragi. You think?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. We treated him like an enemy from Class A, but I suddenly feel closer to him.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you were an unpopular dude who bought himself presents, huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wrong. He just reminded me of my classmate. I felt sorry for him.” Yamauchi stubbornly denied Ike’s jabs.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, do you want to help me out?” Ike asked me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was a sudden shift. “Help with what?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re going to get him a birthday present.” Ike’s newfound sympathy for Katsuragi appeared genuine. “It’s better when you get something from a girl, but that’s impossible in this case. I suppose getting a birthday present from anyone would be a blessing, wouldn’t it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat logic seemed strange, but I couldn’t completely deny it. People would rather receive a present from someone else than buy something for themselves. That said, they might not appreciate pity. If Katsuragi really had bought himself a gift, would it be a good idea for these two to “help” him out? \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke and Yamauchi had already started discussing what to buy, but doubt still nagged at me. There weren’t any girls with a birthday tomorrow. However, we hadn’t eliminated all the other possibilities. There were still the teachers and other academic staff, as well as quite a few campus employees. If we broadened our idea of who the girl might be, plenty of candidates remained.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBesides, if Katsuragi \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ebuy the present for himself, why had he purchased it so openly? He had been wearing his uniform in the middle of summer vacation. He had clearly stood out. It was easy to imagine people feeling suspicious if they saw him. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji, you contribute some points, too. If we put about 1,500 points together, then we should be able to get something good.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d had this conversation yesterday, though. My expenses were going to double. A thousand points wasn’t a small amount.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji, this might be a little fast, but let’s celebrate Katsuragi’s birthday tomorrow.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke and Yamauchi acted almost as if a switch had been flipped. They went from hating Katsuragi to liking him in two seconds.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you really buying something?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course. Don’t you want to save a lonely, unpopular man?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was getting troublesome. I realized I’d better not refuse them. We decided to meet up the next day, and dispersed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e3.6\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eW\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ehen we gathered the following afternoon, Kushida was there, too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hello, Ayanokouji-kun,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“O-oh, hey,” I responded. Why was she there? \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke answered my unasked question. “You see, I had a chat with Kikyou-chan yesterday. When I told her that we were going to buy a present for Katsuragi, she said she definitely wanted to help. She was like, ‘Please let me help,’ and all. Anyway, Katsuragi would probably be happier to have a girl celebrate with him, rather than a bunch of guys.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke blabbered on and on about what a good person Kushida was, but he probably just wanted an opportunity to get together with her. Also, in her eyes, this would probably make him look like a good guy—the type who cares about his friends.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Katsuragi-kun has done quite a bit for me, too. I’ll help out with the present’s cost, of course,” added Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke looked at her lovingly. Yamauchi also seemed happier with her around. Kushida’s charms affected him, too, even though he was aiming for Sakura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“By the way, Ayanokouji-kun, why are you wearing your uniform?” asked Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Meh. No reason.” I’d taken off my jacket because it was hot, but the uniform still made me stand out, unfortunately. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, let’s get going!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke and Yamauchi walked on either side of Kushida, while I followed behind. Moments after we started walking, they managed to get a conversation blossoming. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs we walked, I saw someone I didn’t usually see outside.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, sorry. Could you guys go on ahead? I want to stop here for a sec,” I told them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure, but don’t keep Kikyou-chan waiting too long,” Ike replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI left them and approached Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol4_5_INTERIORILLUSTRATIONS_3\" src=\"/hola-lector-agua/images/books/v4.5/OPS/ClassroomElite-Vol4.5_INTERIORILLUSTRATIONS_3.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"/\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t you look carefree? Are the four of you just casually going shopping? Even after we suffered so much at Ryuuen-kun’s hands?” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that just means that Class C did something right. There’s no use worrying about it now.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose not. But I’m still uneasy about certain things.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Such as?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Never mind.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe turned away with complete disinterest, like a haughty actress.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When are we? Right now?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, at what point in the school year are we now? Do you know? The month?” I continued.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you talking about?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Look, we just finished the first semester of our first year. We don’t need to ricochet between happiness and despair, with nothing in the middle, simply because they’ve got a small lead on us now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But, even so, we suffered a severe loss. If we don’t think of a way—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Although you can’t see what’s directly beneath your feet, you’re always looking far ahead. If we’re talking academics, then you’re certainly peerless. But when it comes to unusual tests, well, you just kind of run in circles. That’s my impression, anyway.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know that,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re aware? I think that it’s preferable for you to fall until you hit rock bottom,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was good to be thoroughly beaten down from time to time, as long as you eventually crawled back up. I thought Horikita had the potential to do that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s an order to things. It’s probably better for you not to panic, but to take things slowly. Right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You say there’s an order to things, but if that’s true, why did you go to all that trouble back on the island? Isn’t that contradictory?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, probably.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt made sense that Horikita found that confusing. She had no clue about my dealings with Chabashira-sensei. During the test on the island, I was forced to show off my abilities. I’d had no choice but to act. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, I had no pawns at my disposal during the test on the cruise ship, which made it extremely challenging. Various other methods had been available to me, but no good could come of overexerting myself and getting sloppy, so I’d refrained from employing them. I was fundamentally disinterested in things like class rankings. By giving Chabashira-sensei only a partial display of my abilities, I’d bought some time without making too much of a splash. From that perspective, the tests had been hugely successful.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“More importantly, don’t you have any questions about the way I look?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I think your clothes are ill-suited to this weather, but I don’t really care,” Horikita replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe wasn’t interested in others, as usual. “What are you reading today?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“None of your business.” Apparently, she didn’t intend to show me the book’s title.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, whatever. I’m keeping Ike and the others waiting. Do you want to come?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re kidding, right? I refuse.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d known all along that that would be her answer.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e3.7\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003e“W\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ehat are you\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eall doing?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi, usually so calm, couldn’t hide his surprise when Ike and the others surrounded him. Kushida quickly spoke up. After the last test, Katsuragi would be most familiar with her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry for bothering you, Katsuragi-kun. Do you have a moment?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kushida? What’s going on?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To be honest, I heard about all this from Ike-kun and the others. Isn’t it your birthday today, Katsuragi-kun?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yes, but…I’m surprised you found out.” Katsuragi wore a slightly puzzled expression, as if he couldn’t remember telling anyone his birthday. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The four of us wanted to celebrate with you, Katsuragi-kun,” explained Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, that’s all right. There’s no need for you to do anything special.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFar from being welcoming, Katsuragi appeared guarded. That was to be expected. He probably thought this was a trap laid by Class D. The fact that he hadn’t immediately shot us down was likely due to Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you have plans today?” asked Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, no. Not exactly.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida clapped her hands and smiled, almost as if she were saying, “I’m happy to hear it!” If an ordinary guy saw that smile, he would’ve been smitten right then and there. Katsuragi, the leader of Class A, probably wasn’t quite as easy a target.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m terribly sorry to be rude, but we’re not exactly close friends. If you have an ulterior motive, please tell me,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, we don’t have an ulterior motive. We really just wanted to celebrate your birthday, Katsuragi,” said Ike, wearing a serious look. He probably felt genuine sympathy.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hrm.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi’s mouth tightened, and it looked like he was about to turn us down. Then I realized that he still held the birthday present bag from yesterday. He’d purchased it two days ago; why was he was still walking around with it? Ike and the others didn’t seem to share my suspicions (or pretended not to).\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry, but I have some business in the school building. Excuse me,” Katsuragi said. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“School? You know, that reminds me. You’ve been wearing your uniform a lot recently. What’s going on?” asked Ike. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean by that?” Katsuragi asked. His expression changed, as if he had switched into battle mode.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? What do you mean, what do I mean?” Ike looked startled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How did you know I’ve been wearing my uniform?” Katsuragi glared so intently, it was like he was devouring Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Well, no. That’s not—” Ike gulped reflexively.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“After you and I talked yesterday, I met up with Ike and the others. I told them. Was that bad?” I asked. Given no other choice, I offered Katsuragi an explanation. “I thought it was rather unusual to wear that uniform during summer vacation.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Well, when you put it that way, I suppose you’re right,” Katsuragi answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. That’s what I was getting at, dude,” added Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, why are you going to school?” I asked. I’d successfully changed the topic, at least for the time being.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s personal. Nothing to do with you,” he replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, maybe I’m prying too much, but is something bothering you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You were also carrying that bag around yesterday, weren’t you? It’s a bit unnatural to take that with you to school. You’ve been holding it since we met at the store yesterday. I think I must’ve seen you with it at least three times so far. Right?” I asked. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have some business with the student council. That’s all,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce again, a certain organization’s name had come up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Were you wearing your uniform yesterday because you were going to the student council room?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. However, they were out,” answered Katsuragi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I remember correctly, the student council room was being renovated until yesterday. It should’ve been unusable,” I told him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi looked surprised. He asked how I knew.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I happen to have a slight connection to the student council president,” I told him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re an acquaintance of his?” Katsuragi asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I wouldn’t say we’re really well-acquainted, but…something like that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, I see. Horikita from Class D is the president’s little sister, hmm?” Katsuragi had arrived at that conclusion rather quickly. “In that case, it might be better for you to accompany me, if time permits. Would you mind?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, I more or less understood what Katsuragi was after.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What a coincidence. I also happen to have some business with the student council,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that why you’re wearing your uniform?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, I’d only worn it to discover Katsuragi’s intentions. Now, however, I thought I should be able to slip into the student council room easily and get close. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi nodded. Leaving the others behind, we headed toward the school building.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Pardon the intrusion,” said Katsuragi in a loud, clear voice, as he knocked on the council room door. Student council president Horikita Manabu and Secretary Tachibana greeted us. The older Horikita immediately noticed my presence.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would seem we have some unexpected visitors.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI bowed slightly in greeting. Secretary Tachibana looked disgusted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I came here today with a request. I heard that student requests go through the student council,” began Katsuragi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Apparently, you stopped by yesterday. The day before, as well. We were absent because the room was being renovated. I apologize,” explained the elder Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh no, it’s quite all right. It’s summer vacation. The fault is mine. However, I’m glad to meet with you today. I was afraid I’d have to go directly to your dormitory to find you,” Katsuragi continued.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhy did Katsuragi want to come to the student council office in the middle of summer vacation? What exactly was he after? \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The school forbids students to establish contact with anyone on the outside while we’re enrolled here. I’ve come to inquire further into that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It sounds as though you’ve looked through the school regulations. No, outside contact is not allowed, unless there is a compelling reason such as severe illness or injury.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Right. However, I’d like to send a package and message to my family off-campus. Of course, I don’t expect a reply,” said Katsuragi. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was describing one-sided communication, then?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if communication is one-sided, it’s still not permitted,” the president replied, in a very professional manner. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Katsuragi wouldn’t have come to the student council room if he could be discouraged that easily. “I heard that the rules about cutting off contact don’t apply to packages. Surely, if what is sent doesn’t include any text, information, or communication, that wouldn’t break the rules, would it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The rules prohibit it. The restrictions exist for a reason. When the school was founded, the rules weren’t quite as strict as they are now,” the elder Horikita explained. He looked at Secretary Tachibana and nodded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s just as the president says. Originally, shipping a package would’ve been permitted. However, several students broke their promises. They hid letters in their packages without first seeking permission. So, such contact is now completely banned,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And there you have it,” added the elder Horikita, dashing Katsuragi’s hopes with complete and utter rejection. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi wasn’t ready to back down. Even though he was a first year, he was still tasked with leading Class A. He immediately reassessed the situation and composed himself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I must ask you once again. Please allow me to request direct shipping at the store itself. I will pay for the package to be sent to an address of my choosing, and nothing else. I won’t even touch the item. Under those restrictions, there’s no way for me to commit fraud.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But that still violates the rules—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Violates the rules? This school is all about fostering one’s abilities. I’ve heard that you can do anything, with enough points. You can buy test scores, or even trade with other students. Points have many uses. Am I wrong?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClearly, this birthday present was of great importance to Katsuragi.\u003c/span\u003e\u003c/p\u003e    \r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That makes things slightly different.” Katsuragi’s words changed Horikita’s brother’s attitude. “Before we discuss an expenditure of points, can you tell me whom you’d like to send this to?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My twin sister. Since we’re orphans, I’m the only one who celebrates her birthday,” replied Katsuragi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat reason was entirely different from the sleazy theories we’d passed around earlier. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I must make one correction to your theory. The point system is not all-powerful. It’s certainly possible to use points to buy test scores or barter with other students, but those things are never explicitly mentioned in the rules. The things that \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eare\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e explicitly prohibited can’t be easily altered using points. Without the school’s permission, it’s just impossible,” Horikita explained.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA tricky situation. Let’s use test scores as an example. I’d used points to buy a point on a test score for Sudou a while back, an act that was not illegal in and of itself. You were allowed to buy test scores with points. Trying to cheat on an exam, however, was against the rules, and could not be made legal through the use of points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The school rules must be upheld.”\u003c/span\u003e\u003c/p\u003e \r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s odd. If that’s true, the rules are full of holes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s nothing odd. The school purposefully made rules that allow for loopholes,” Horikita responded immediately, as if this were easy to understand.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…………”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe president was a tricky opponent, even for a quick-witted man like Katsuragi. The difference in their positions was stark. Horikita, who was a third year, in Class A, and the student council president, had no weaknesses.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re saying that there’s nothing I can do?” asked Katsuragi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Correct. If school rules forbid something, you cannot circumvent them, even with points.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi had probably been prepared to spend a large sum, but this looked like the end of the line.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re finished, please leave.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. I understand. Well then, if you’ll please excuse me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi glanced over at me just once. When I gestured that I was going to stay behind, he quietly left the room.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re not going?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Earlier, you were talking about what happens when a rule violation is exposed, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you remember an incident that occurred a while ago? Sudou, from our class, fought with some students from Class C.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita nodded. It’d been a huge deal, after all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Back then, the case went to trial precisely because the Class C students appealed to the school. Katsuragi, on the other hand, hasn’t done anything wrong. He only wanted to ask about doing something that could potentially break the rules. Only you two, Katsuragi, and I are aware of this. Shouldn’t you be able to overlook this particular instance?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI chose my words carefully, but I was sure they understood what I was getting at. Say you committed a traffic violation; you’d be questioned by a police officer, but you could bribe the officer to overlook the issue.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shipping a package would normally be difficult, but it’s probably a simple matter for you. Right?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. You want to resolve everything without involving the school,” Horikita replied. Someone as upstanding as Katsuragi would probably never think of using such a loophole.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Violating the rules! What a terrible delinquent you are,” Secretary Tachibana cried. I did my best to ignore her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How did you arrive at this conclusion?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The school rules state that violent acts are forbidden. However, when we first met, you showed no mercy, did you? You proved that, as long as the school doesn’t know, you can get away with anything,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePresident or not, Horikita definitely shouldn’t have raised his hand to strike someone in public.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. There’s only one way to contact someone on the outside. But Katsuragi didn’t realize that, and he missed his chance,” admitted Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Will you help him now?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not at all. I won’t violate the rules for his sake.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re pretty strict.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you think so, you should have told Katsuragi about the loophole before he left. But you didn’t.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDealing with such a clever guy was a pain. He saw through me completely. He understood that I had avoided warning Katsuragi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’m done cooling off. I’m gonna head back,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I could ask Tachibana to prepare some tea, if you like?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No thanks. I have no idea what you’ll put in it, anyway.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what an incredibly rude first-year student!” Tachibana stammered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor some reason, as I left, Horikita’s brother accompanied me to the exit.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Officially, I didn’t meet with Katsuragi today. Even if you act behind the scenes, I won’t investigate. Do what you will,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t really feel like doing anything, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m simply telling you that I won’t get involved.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had the go-ahead to deceive the school as best I could. Horikita’s gaze cut right through me. He probably saw everything. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Jeez, the president is shrewd,” I muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e3.8\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eW\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ehen I returned to the dorm lobby, Katsuragi was sitting there, looking depressed. He immediately noticed me coming and stood.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry for involving you in such a strange errand,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, don’t worry. I insisted on tagging along. Sorry I couldn’t help,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh no, not at all. It was hopeless, anyway,” said Katsuragi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed Katsuragi had given up. He’d wanted to get the present to his sister, no matter what, but the school regulations deterred him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Here. Eat these with your friends. I don’t really care for sweets,” he said, handing over the present. However, I didn’t take it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s wasted on me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. I suppose you wouldn’t be happy with a secondhand gift.” Katsuragi bowed slightly and began to head back to his room.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Katsuragi.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI stopped him in his tracks.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s the matter?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe I can help. I’ve thought of a way to deliver the present to your sister.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But the student council rejected me. I can’t imagine there’s a solution.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s because you don’t want to break the rules,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not going to do something that risky,” answered Katsuragi flatly.\u003c/span\u003e\u003c/p\u003e\r\n \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed that was too much for someone like Katsuragi, the Class A leader, to accept. Especially if it were coming from someone like me.\u003c/span\u003e\u003c/p\u003e   \r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think it’s worth hearing me out. Especially if giving your sister that present is important.” Katsuragi had gone repeatedly to the student council room during summer vacation to get permission. This clearly wasn’t trivial to him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is this something we should be discussing in public?” Katsuragi looked around at the people and security cameras. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose you’re right. Want to come to my room?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePeople waltzed in and out of my room all the time, anyway. Fortunately, we didn’t encounter any students as we made our way there. I opened the door and turned on the lights.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on in.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You have quite a clean room. Or, rather, I should say it’s spartan. It looks the same as when we first arrived at the school,” mused Katsuragi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I get that a lot.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter he sat, I turned on the air conditioner and poured some tea.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Earlier, you said something about the school rules?” asked Katsuragi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s say that you wanted to send a package from school. Since that’s generally prohibited, it’s not a simple thing to do. You probably wouldn’t be able to go through the post office, either.” There \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewas\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e a post office on campus, but it was mainly for teacher use. Students didn’t go there. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But then, there’s nothing I can do. Or are you saying that there’s another means of delivery?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There is. If you just carry the present off campus, you’ll be fine.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t be ridiculous. Who could do something like that? You’re not thinking about a campus employee, are you?” asked Katsuragi. Only employees at the various campus shops were allowed to freely come and go. “The people who work here are employed under strict regulations. They wouldn’t take a risk like that for a mere student. They might report us to the school.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf they did, Katsuragi would be punished severely. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not going to happen. I don’t think there’s anyone we could trust to act as a go-between.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait. You’re not saying \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewe\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e should leave the school grounds without permission, are you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course not. The punishment would be incredibly severe.” The entrances and exits were rigorously monitored. We’d be expelled if discovered. “You’re right that we can’t use an employee. However, a student is a different story. There are several we can trust.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A student? That’s even more unlikely, though. Students aren’t allowed to leave without a compelling reason.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aren’t there exceptions related to those ‘compelling reasons’?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Exceptions? If the student could leave the campus, then… No, it couldn’t be!” Katsuragi quickly arrived at the conclusion I’d been leading him toward. “Club tournaments, hmm?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDuring club tournaments, the school had to allow certain students to leave the school grounds and travel to outside venues.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re certainly right. In a situation like that, it \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewould \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ebe possible. However, the school would definitely anticipate that kind of thing. There will be bag inspections,” reasoned Katsuragi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course. But there are ways to get past those, aren’t there? It’s not like the Olympics testing athletes for steroids. They wouldn’t search every square inch of your body.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s true, but…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi appeared to be seriously considering the idea.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That would be a huge risk for the student. However, judging by what you’ve said, Ayanokouji, you have a talented, trustworthy individual in mind. Yes?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yep, that’s right. However, you need to trust me if we want this to work.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"/\u003e\r\n\u003cp
