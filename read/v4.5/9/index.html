],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T25b68,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 3:\u003cbr/\u003eKatsuragi Kouhei is\u003cbr/\u003eSurprisingly Troubled\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003elthough most Japanese people aren’t typically mindful of religion, Christianity has influenced them strongly through events such as Christmas and birthday celebrations. You could say that was a result of people’s faith, but also that it came from clever marketing luring them in. The recent trend of celebrating Halloween could be chalked up to the same influence.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat I’m trying to say is that birthdays were rather significant events at this school. The convenience stores, shopping malls, and other campus facilities had special kiosks set up for that single purpose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis particular story began one week before Ibuki and I ended up stuck in an elevator, when I received a message from Kushida, the class sweetheart. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe message read, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eNext Wednesday is Inogashira-san’s birthday. Would you care to celebrate with us?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe had sent the message to our group chat. Inogashira was a somewhat quiet, plain girl from Class D, rather like Sakura. She didn’t have many friends, so the idea seemed to be to help her make some. Of course, Ike jumped at the invitation, for a blatantly obvious reason: he liked Kushida and wanted to be in her good graces. He’d probably use this event as a way to get closer to her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe messaged us. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eYou got a message from Kikyou-chan too, right? Let’s get some presents for Kokoro-chan!\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi’s response was slow in coming. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWell, I don’t got any money. I should be getting some next month, though\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was right—the Class D students were basically broke. We’d netted good results in the last special exam, and certain students had been promised rather large amounts of private points. Sadly, those points wouldn’t be deposited until September 1. By that time, the elevator incident had happened, so I’d used up a lot of points on the fortune-teller and had almost nothing left.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI would be finishing summer vacation as a poor man. Did these guys plan on buying individual gifts? If this were a close friend’s birthday, that’d be one thing. But none of my friends were close with Inogashira.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eIsn’t it all right if the guys just pool their points and buy her one present? In that case, we should be able to buy her a proper gift\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eeven if it’s just 500 points,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I proposed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI thought Yamauchi would agree to that, but apparently his financial situation was dire. He was just barely scraping by, living a life of poverty. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe had been awarded 8,700 private points at the start of August. Compared to an average high schooler’s allowance, that was a little unsatisfactory, but you could get by on it by if you were smart. Fortunately, the school provided a free meal plan, and water was free. So, if you were frugal, it was possible to get by without spending a single yen. Still, most students ran out of money once the end of the month approached, just like when we’d started school there and received 100,000 points in that first month. If people had money, they liked to spend it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the end, all three of them agreed with my proposition. We decided to go out and buy the present together.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e3.1\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003es I felt the boiling heat on my skin, I wiped sweat off my forehead.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But…why is Kikyou-chan not here?! Huh, Ayanokouji?! She’s the most important person!” shouted Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe first thing out of Ike’s mouth when we met was his concern regarding Kushida’s absence. I wished he wouldn’t turn to me for an explanation. I wasn’t in charge of Horikita and Kushida’s schedules. Perhaps Ike found me easy to vent to, but I was honestly getting sick of it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Try to calm down. Remember, Kushida never said that she’d go with us.” Kushida had seemingly invited her other girlfriends shopping, rather than spend time with a bunch of overheated boys. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not convinced! If Kikyou-chan isn’t here, there’s no point!” Ike shouted.\u003c/span\u003e\u003c/p\u003e\r\n \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was going too far. I wished he'd stop trying to reject the entire gathering.\u003c/span\u003e\u003c/p\u003e   \r\n    \r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now I have to shop for a present I don’t even care about with a bunch of assholes!” Yamauchi complained.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI understood why he wanted to shout, but it wasn’t like \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ewanted to hang out with a bunch of dumb guys, either. Well, I supposed I was enjoying this a little. It was the first time I’d hung out with other guys during summer vacation, besides the special tests. Normal people generally do things like shop or go the movies with their friends.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s pretty lame to go shopping for a birthday present when it’s just us three assholes, huh? Haruki, I’ll leave the rest to you. Go ahead and pick something Kokoro-chan would like,” said Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Screw that. You wanted to go, so you should do the shopping!” countered Yamauchi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe two of them bickered until I stepped in.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How about you two calm down? It’ll be better if we shop together, right? Sudou’s also entrusted us with his share of the points,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s true, but I don’t think it’s necessary for the three of us to go,” Ike whined.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’ve come all this way. Let’s hurry up, buy the present, and head back,” I replied. “We’re wasting time and energy just standing here and complaining in this heat, don’t you agree?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Enough, I get it already. Let’s just buy it and head back. Ah, this is so boring!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn contrast to the other two guys, I was a little excited as we headed to the store. Passing all the shops lined up on campus, we came to a store that girls frequented. The clerk was an older beauty, and the interior was completely pink. Frivolous objects like stuffed animals and cell phone accessories lined the shelves. It felt as though the shop was trying to squeeze private points out of the students.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, since the school gave us points in the first place, it’s not really a loss,” I murmured.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you muttering about? Come on, help us pick what we should buy,” said Ike. The two of them should have been ashamed of themselves. They were ogling the beautiful store clerk and the other girls as they shopped, clearly having a good time. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe split up and hunted around the store to find a birthday present. Of course, I’d never intended to pick it myself. I had no idea what to choose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Something Kokoro-chan would like, huh? Honestly, I have no clue,” I murmured.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was my first time giving someone a birthday present, but I wasn’t sure whether I could categorize this as an individual “first” for me, since the present was supposed to come from the three of us. At any rate, I had no experience with birthday-present shopping. The only ideas I came up with were things like a bouquet of roses, or a ring, which were hardly sensible. Those weren’t even birthday gifts; they were what you’d bring to propose marriage. I wanted to find something safe. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter circling the shop, I met up with Yamauchi again. He held a small, white stuffed bear. I, meanwhile, had a cell phone case. When Yamauchi saw that, he grimaced.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just put that phone case away. Kokoro-chan definitely has one already. Besides, it’s so completely different from what she likes, I think it’d just cause trouble, honestly,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Well, how about this screen protector?” I showed him what I’d picked out as a backup plan. Yamauchi frowned even more deeply.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, no, no. She doesn’t need something like that. You really have no sense when it comes to this stuff, Ayanokouji.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But wouldn’t stuffed animals just clutter her room?” I asked. It wasn’t like a stuffed animal would be useful. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure, it might be in the way, but she can use it to decorate. It matches her interior. Kokoro-chan likes the white bear series, so she should be happy with this present. Besides, I don’t want to hear any sass from the guy who picked out a screen protector,” Yamauchi snapped.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen he made fun of me like that, it really came as a shock. Still, I was honestly impressed that he’d researched the tastes of the gift’s recipient. I had enough trouble just trying to remember Inogashira’s name and face. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, where’s Kanji?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe found Ike standing completely still over by the keychain section. He looked strangely serious, so we approached quietly. Ike was holding some kind of object with an orange character motif. He also held a cloth with the white bear character Yamauchi had mentioned on it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Kanji.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wha—?! D-don’t surprise me like that! Jeez!” Flustered, Ike dropped the keychain. Then, for some reason, he immediately put it back on the shelf, as if trying to hide it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“D-did you already decide?” Yamauchi asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I thought we’d buy this white bear towel. Ha ha ha,” Ike replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not that. Why were you looking at keychains?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? It’s not like I have an ulterior motive or anything. Anyway, let’s see what’s over there.” Ike tried to change the subject. Yamauchi eyed him suspiciously. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait. If I remember correctly, didn’t Shinohara like that orange character?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI certainly hadn’t expected to hear Shinohara’s name. She was a girl from Class D. During the test on the uninhabited island, she’d clashed with Ike numerous times. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“R-really? That so? No, I was just wondering what Kikyou-chan would think, is all,” Ike bluffed. Despite his words, he was obviously shaken. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait a minute. You’re not thinking about Shinohara, are you?” Yamauchi inquired.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?! What?! No way in hell, dude! That ugly chick? No way!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was certainly true that you might say Shinohara was plain, compared to Kushida. But she was plenty cute in her own right. She had a somewhat forbidding personality, but even that could be thought of as appealing. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you for real? Something seems super suspicious here, don’t you think, Ayanokouji?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that certainly didn’t seem like a typical Ike reaction,” I answered. Even though Ike was generally thrilled to see any and all girls, he seemed to openly dislike Shinohara. Perhaps he thought about her more than he was letting on, and didn’t want to admit to it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Look, don’t get the wrong idea!” Ike shouted. “Shinohara isn’t cute at all, and she has too much attitude! If I went out with a girl like her, I’d be too embarrassed to show my face anywhere!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi and I had both noticed another presence in the store. We frantically tried to get Ike to change the subject.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure, sure. We got it. We understand what you’re saying. Let’s go pick out Kokoro-chan’s birthday present,” urged Yamauchi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edon’t \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eget it. You want to know how ugly I think Shinohara is? Listen up. It’s not just her face, her personality is ugly too, you know? Not to mention she’s practically a stick—she has, like, no curves. Even among other ugly chicks, she’s probably the ugliest!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A-all right, we get it already. Knock it off, Kanji! Look behind you!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke slowly turned. Shinohara stood behind him, looking as though she was about to start breathing fire. Glancing around the store, I saw her friends, including Kushida, some distance away. I supposed that was only natural. They were probably at the shop to pick out a birthday present for Inogashira, like us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can just go ahead and die, Ike!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith those heated words, Shinohara stormed out of the store. Ike watched her leave, seemingly unable to respond. He just stood there, dumbfounded, looking at Shinohara as she left. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what does she mean, ‘die’? That’s rich, coming from an uggo. R-right, guys?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite his shock, Ike tried to pretend he was still composed. We couldn’t really do anything, so we just nodded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-hey, check it out, Ayanokouji! The baldy is here!” Yamauchi grabbed my shoulder.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe clearly wanted to change the subject. I immediately knew who he meant. A giant man whose forbidding appearance contrasted starkly with this cute store looked at a shelf lined with goods. His back was turned to us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was Katsuragi from Class A. He meandered around, wearing an intensely stern expression.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You think he’s gonna shoplift?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI really doubted that. Still, I hid without thinking, and watched him with Ike and Yamauchi. I was concerned by his appearance. Wearing a heavy student uniform in this kind of heat? Why would he do something so pointless? Katsuragi’s expression remained unchanged, but he glanced around as if worried about something. He certainly looked like someone thinking about stealing.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI unconsciously grabbed my phone. If I caught Katsuragi in the act, that could be useful later… No. I rejected that idea.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why would I think something like that?” I asked myself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? What’d you say, Ayanokouji?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nothing.” If Katsuragi tried to shoplift, that had nothing to do with me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-hey. What’s baldy got there?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi and Ike were anxious to witness a crime, almost as if they were anti-shoplifting undercover cops. However, Katsuragi returned the thin box to the shelf. He took down a similar item, then went through the same motions again. It looked less like he wanted to steal anything, and more like he was just confused about what to buy. Ike noticed the discrepancy as well, and looked puzzled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe he doesn’t want anyone to see what he’s buying?” Ike suggested.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, you’re probably right.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, Katsuragi came here to buy a present for someone. He seemed to be nearing a decision. Eventually, he picked a box off the shelf and made his way to the counter, moving cautiously, as if he didn't want the people around him to know.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol4_5_INTERIORILLUSTRATIONS_2\" src=\"/hola-lector-agua/images/books/v4.5/OPS/ClassroomElite-Vol4.5_INTERIORILLUSTRATIONS_2.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"/\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke and Yamauchi rushed over to where Katsuragi had selected his present. The boxes looked like thin boards. They grabbed one, turned it over, and glanced at the product information.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is…chocolate.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke and Yamauchi trembled, as if something had fired them up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-wait, don’t tell me that baldy already has a girlfriend?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seriously?! So, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat’s\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the power of Class A?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke and Yamauchi were evidently trembling with jealous rage over something so trivial. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It might just be a present for a friend, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who gives a present with such cute wrapping paper to a friend?! Would \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e?! No, you wouldn’t!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess not.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was certainly difficult to imagine giving such a cute little box, adorned with ribbons, to a friend. At the very least, I couldn’t imagine that you’d give it to someone of the same sex. It had to be for a girl Katsuragi was intimate with. That \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e suggest that he probably had a partner. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke and Yamauchi glanced at Katsuragi again as they hid behind the shelves, collecting information.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is this a birthday present for someone?” the clerk asked Katsuragi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Would you like to include a birthday card?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, please. The birthday is August 29.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi answered the clerk’s questions. Who in the world was the present for? Ike and Yamauchi started whispering.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you hear that? Which girl has a birthday on the twenty-ninth?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I have no idea. I mean, today’s Sunday, the twenty-first, so…her birthday would be Monday next week, right? Do \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e know who it might be, Ayanokouji?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No clue.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf those two didn’t know, there was no way I did.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e3.2\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003e“H\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eey. I guess I’ve already brought this up, but why exactly are we in my room?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor some reason, part of our usual group had gathered in my room after dinner that night. Ike and Yamauchi were there, as they’d promised. Kushida also came, as did Sudou, after he finished his club activities. If Horikita had been here, too, it would’ve been perfect.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kikyou-chan, do you know the other girls’ birthdays?” asked Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. I think I’ve memorized the birthdates of everyone who’s told me, more or less. Whose birthday did you want to know?” she answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, the thing is, it might not be someone from Class D,” Ike added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If it’s an upperclassman, I don’t know most of them, to be honest. But if it’s a first year, I’d probably know them,” said Kushida, just as I’d expected.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Which girls have birthdays on the twenty-ninth of this month?” asked Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A girl whose birthday is on the twenty-ninth? Hold on just a minute,” said Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe pulled out her phone and went through what had to be a birthday list. After she scrolled for a little while, she looked back up at us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, but it doesn’t seem like anyone I know has a birthday then.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think it’s probably a girl from Class A.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Class A? Hmm… I know all their birthdays, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Kushida didn’t seem to know one girl’s birthday, which was the day after tomorrow.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If it’s a first-year girl, I should know everyone, but I can’t think of anyone who fits,” mused Kushida. If even her overwhelming social network couldn’t produce a name for us, it probably meant that the girl was from a different class. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Does this mean it’s probably an upperclassman?” said Ike, throwing his arms up in defeat and collapsing onto his back.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s the matter with the girl born on the twenty-ninth?” asked Kushida. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke responded matter-of-factly. “Just listen to this! You know that baldy in Class A, Katsuragi?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. Katsuragi-kun is famous. He’s the class leader. I was in the same group as him during the test on the ship,” answered Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that baldy is giving someone a birthday present on the twenty-ninth. Even though he’s bald!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke kept repeating the word “baldy,\" causing Kushida to give him a word of warning. “Katsuragi-kun lost his hair completely when he was young, due to illness. You really shouldn’t make fun of him.\"\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eScolded, Ike fell silent. He should’ve been fully aware that mocking the ill was shameful. Doing so for a cheap laugh made him less likable.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, so, from now on, you’ll address him properly, won’t you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“O-of course. I’m sorry, Kikyou-chan.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s okay, as long as you understand now.” There was a brief pause. It seemed like Kushida had one more thing she wanted to talk about. “Also, about what happened today with Shinohara-san…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke had apparently forgotten about the incident, but Kushida hadn’t. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You understand what you should do about it, right?” She didn’t touch on the subject directly, but simply asked that question in a gentle manner.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll apologize,” Ike answered sullenly. He looked dissatisfied, but he sounded genuine. He glared at Yamauchi, who was chuckling. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good. If you do that, I think Shinohara-san will forgive you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke might actually have matured a little bit, thanks to Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you were talking about Katsuragi-kun giving someone a birthday present?” asked Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, yeah, yeah. I was wondering if you might know something about that, Kikyou-chan.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida seemed to be mentally scanning her social network, but couldn’t come up with anything. “Hmm. I never got the impression that Katsuragi-kun was the romantic sort,” she mused. “At least, not before.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Could the gift be for an upperclassman?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose so. There’s still a lot I don’t know, after all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt would be pretty impressive if Katsuragi had started going out with an upperclassman just a short while after beginning school. I genuinely admired the leader of Class A. That said, should we really be narrowing our search at this stage? We seemed to have already decided he had a girlfriend. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Since it’s come to this, let’s locate Katsuragi’s girlfriend at any cost!” Ike urged.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI felt badly for interrupting when they were in such high spirits, but felt I ought to point out another possibility. “Should we really conclude that Katsuragi was shopping for a senior girl?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kikyou-chan said she doesn’t know any girl with a birthday on the twenty-ninth, so there aren’t other options, are there? Or am I missing something? It couldn’t possibly be Horikita-san, could it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a completely baseless assumption, but I couldn’t exclude that possibility.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I guess that’s possible.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Come on, you’re messing with me, right?” Sudou, who’d been listening quietly to our conversation, suddenly grabbed Ike by the collar and glared at me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Guh! C-come on. I just said ‘possibly’!” Ike shouted, panicking.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Ayanokouji. When is Suzune’s birthday?” Sudou growled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dunno,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The hell, dude? You’re worthless,” he barked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI still didn’t know when Horikita’s birthday was.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t really think anyone at our school knows her birthday,” I replied. The only person who might know was her older brother Horikita Manabu, the student council president.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Yeah, I guess you got a point. Just because I don’t know, and Ayanokouji doesn’t know, don’t mean that \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehe\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e knows, I guess.” Sudou shrugged.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know Horikita-san’s birthday. It’s on February 15. I don’t think that has anything to do with this,” Kushida announced. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just as we’d expect of you, Kushida,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d praised her without thinking. I hadn’t expected even Kushida to obtain information about stubborn loners like Horikita and Ibuki, especially Horikita. I was one of the few who knew that Kushida hated Horikita, and Horikita hated Kushida. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI hadn’t thought they were on such good terms that they’d tell each other their birthdays. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“February 15, huh? Sounds like I’ve snagged some good info,” Sudou chuckled. He wore a wide grin. Ike, still in a headlock, tried to tap out as his face turned blue. “Oh, sorry. My bad. Kinda forgot about you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ken, you really gotta be more careful. You’re stupidly strong!” Ike groaned, wheezing. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You asked for it,” Sudou answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then you should’ve done that to Ayanokouji, too! Why’d you only hurt me?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“‘Cause you were closest.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You single-celled organism!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou moved to grab Ike by the collar again, and Ike panicked and put distance between them. I wished they wouldn’t cause a ruckus in someone else’s room. Or at least, not in my room.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, the conversation kind of got off track, but I have a different idea. There are other potential candidates for Katsuragi’s present as well. It could be for a teacher, or one of the Keyaki Mall workers. I mean, the people we saw while we were shopping today were all beautiful, right?” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I see. When you put it like that, you have a point.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWho knew whether an adult would even consider dating a first-year high school student? From a legal and moral perspective, there was almost no way they could become a couple. I was sure that Katsuragi understood that, too. However, we couldn’t exclude the possibility. We had to be careful not to arbitrarily decide it was an upperclassman.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wanted Ike and Sudou to understand that it was probably best just to leave things alone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How about we quit while we’re ahead, and not get too carried away looking for whoever Katsuragi’s partner might be, okay?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you seriously okay with that?! Even if that baldy has a girlfriend with huge boobs, who’s also really into him, even though she’s older?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, he’s in Class A. It wouldn’t be strange if he’s popular with older girls.” And if he did have this idealized girlfriend, I didn't wish him ill because of it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe, on the other hand, were from Class D. Just being slightly attractive or having a good personality weren’t enough to make us popular. That said, Hirata was popular with both our class and upperclassmen. Kouenji seemed to have a degree of widespread popularity, too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the end, the one thing I had in common with Ike and the other guys was that we weren’t exactly popular.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I absolutely hate the idea of Katsuragi beating me!” Ike whined.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Look, there’s nothing we can do, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That ain’t true! Just because we’ll probably lose to him doesn’t mean we don’t have a chance of winning!” Sudou shouted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe peered at us, slapping his shorts-clad thighs.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In basketball, you can use plays that are just barely allowed. You can even commit a foul, if it’s absolutely necessary to win. A strong desire for victory is what really matters. If Katsuragi giving a present to some girl will bring them closer, then we gotta stop him from doing it,” Sudou continued. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was high-handed. In an athletic competition, Sudou's logic might have made sense, but what he was saying right now wasn't coming from a place of jealousy, not rationality. It wasn’t good, although Sudou seemed fiercely motivated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That reminds me, your tournament’s coming up soon,” Yamauchi told Sudou. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. It’s on Thursday. I don’t know if I’ll get put in the game, but I’ll be ready, for sure,” Sudou replied. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSmack\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e! He slammed his right fist into his open left hand.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, that’s it! I’m gonna get in his way!” Ike jumped on board with Sudou’s plan to interfere with Katsuragi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kushida, please say something to him,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kanji-kun, you can’t interfere,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? But… Kikyou-chan, you’re interested in knowing who Katsuragi’s girlfriend is, too, aren’t you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course I’m curious, but getting in the way is not okay.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust like that, Kushida extinguished Ike’s excitement like she was dousing a fire. Ike looked disappointed. He turned toward me, perhaps dissatisfied that Kushida had rejected his scheme to interfere, or remembering what had happened with Shinohara before.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay. You, then, Ayanokouji. You find out the mystery person’s identity. Find out who Katsuragi is giving the gift to.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Impossible.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You gotta do it. I mean, you got free time, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t deny that, but I preferred that Ike just investigate the matter himself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, sure, you want me to find this person. But I’m not even in the same class as Katsuragi, and we’re not friends, either,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTrying to investigate someone whose name I didn’t even know, let alone gain their contact information and room number, was going to be a Herculean task.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have Katsuragi-kun’s contact information. Do you want me to give it to you?” Kushida asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…………”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t strange that she’d know Katsuragi’s contact information. Kushida was a beautiful girl with a huge social network. She even knew when Horikita’s birthday was, after all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How do you know Katsuragi’s number?” I asked her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We were placed in the same group during the last special exam, remember? I asked him for it.” To casually exchange contact information like that was honestly amazing. “So, you want me to tell you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, that’s okay. If I suddenly contacted him, I think even Katsuragi would be surprised,” I reasoned. He might just ignore an incoming call from a number he didn’t recognize. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You stopped me from interfering in Katsuragi’s plans, so you gotta take responsibility,” Ike told me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, but even if you tell me to take responsibility…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m curious, too. You gotta investigate,” added Sudou, giving me a rather high-handed order.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t you think you should do it yourselves?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? I have a big tournament on Thursday. I don’t got any free time until after. I only got a few more days left to practice, you know?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I remained silent, Sudou glared. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Should I force you?” he asked. He swung his arms around, starting to wind up. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt looked as though he intended to put me into a headlock. There’d be no escape if he decided to make an example of me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, I understand. I’ll do some digging tomorrow. Just don’t expect too much. I have no idea how this is going to go,” I told them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor the time being, I supposed it was better to just grin and bear their request. If I reported back to Ike and Sudou later, and said I couldn’t find anything, that would be the end of it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e3.3\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003e“I\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003et’s so hot. It’s so hot, I feel like I could die…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe next day, I parked myself at the crossroads connecting the paths to the various dorms, choosing a spot under the trees that lined the road. The crossroads were unavoidable if you wanted to meet up with a senior student. They also intersected with the path to the Keyaki Mall and the school building. No matter where Katsuragi decided to go, I wouldn’t miss him. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt would’ve been better to wait in the cool lobby, but unfortunately, some girls from another class had decided to get together and have tea there. Discovering that had felt like entering a restaurant and finding no spots readily available. I wasn’t confident enough to try to slip into the lobby, then sit down and relax when a seat opened up. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, all the students were dressed casually. That made me think of Katsuragi yesterday, still wearing his uniform. No rule stated that you couldn’t wear your uniform over summer vacation, but even if you didn’t care much about fashion, the uniforms did get extremely hot. Katsuragi had even worn the long-sleeved uniform shirt, rather than the short-sleeved summer one.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince I was typically low on points, I’d been unaware until recently that summer clothes were sold at rather high prices. There were girls in our class who wanted them, but had to do without. There were definitely reasons why people might purposely wear their school uniforms —and not just people like Katsuragi, though he was the first my mind went to. Quite a few people other than him seemed to prefer it, too. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA couple walked out of the upperclassmen’s dorms—a guy and a girl. When they saw me, they changed directions and walked toward me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey. It’s been a while.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was just wondering who would wear their school uniform in this insane heat. I guess the answer is Horikita’s brother,” I muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnlike Katsuragi, these two wore summer uniforms. Still, I couldn’t help feeling like something was out of place.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoa. President, this student really has a sour look on his face,” said the girl next to Student Council President Horikita Manabu. She spoke in a loud, exaggerated manner. She was a third-year student, Secretary Tachibana.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe girls’ uniforms looked as though they didn’t get as intensely hot as the boys’. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The student council seems rather busy, even during summer vacation,” I said. Secretary Tachibana was holding a notebook. For a moment, I almost had the impression that the second semester had already begun. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We decided to do some reorganizing work in the student council room,” explained Secretary Tachibana.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know, that was a really stupid response. You should be careful what you say, you know? Do you even know who you’re talking to?This is the fearsome student council president!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYeah, I knew that. I also knew Horikita Manabu probably wielded an incredible degree of influence. I’d considered using a more respectful tone, but discarded the idea. Horikita’s older brother didn’t seem to expect it of me, anyway.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMeanwhile, Secretary Tachibana was quite different from how I’d imagined her to be. I'd taken her for a more serious person, but she was actually rather soft.\u003c/span\u003e\u003c/p\u003e  \r\n    \r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you want to penalize me? Because I’m really running low on points.” I shrugged off what Secretary Tachibana said. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d thought that Horikita’s older brother wouldn’t give someone like me the time of day. But the student council president narrowed his eyes and said, “Ayanokouji, if you have no prior engagements, I’d like you to accompany me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“P-President?” Secretary Tachibana was caught off guard by the invitation. So was I. But…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve got a packed schedule. Sorry.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?! \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eYou’re\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e turning \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehim\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e down?!” Secretary Tachibana sounded completely flabbergasted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whenever you’re free is fine. I don’t mind finding a time that works for you, even if it’s after the semester begins,” Horikita said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, he had no intention of giving up. Avoiding the problem would not help. I didn’t want to waste my time later on. It might be more convenient to get his request out of the way.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right. Let’s just do this now. I have time before my next engagement, anyway,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But didn’t you just say you had a packed schedule?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI ignored Secretary Tachibana.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Where were you planning to go? I don’t mind changing my schedule to accommodate yours,” Horikita said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh, I was waiting for someone. If at all possible, I’d prefer not to move.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But isn’t it really hot here? This spot isn’t suitable for a meeting.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m well aware of that.” I didn't mind a little suffering. If I might be allowed to toot my own horn a bit, I thought that was even kind of bad-ass.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I suppose we can just talk here. If you feel uncomfortable, you can head back to the dorms ahead of me,” the president told Tachibana.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. My instinct says not to leave you alone with this boy, President!” Secretary Tachibana gave him a salute, as if she were his bodyguard.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita turned back to me. “The student council has received reports of the results from the island test, and the test on the ship. Were they difficult?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The student council really has a lot of pull, huh? I mean, to think you’d be able to get those results,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I don’t know how detailed the reports really are. The individual actions taken during the tests remain unclear.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m glad.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re glad that the president hasn’t discovered your failure, I bet,” Tachibana muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSecretary Tachibana really didn’t seem to like me. Perhaps that was understandable, given how casually I talked back to the student council president.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“One way or another, some information always ends up leaked. I know that you outsmarted the other classes on the island, and that Class D’s VIP in the Rabbit group successfully avoided detection,” said President Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe’d said that things were unclear, but it sounded as though he knew quite a bit. I suspected collusion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita continued, “The name Horikita Suzune came up after the island test. I heard that she became her class’s true leader and outsmarted everyone. However, I think that you were responsible.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aren’t you overestimating me?” I muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In the end, the leader’s name was changed to yours. How do you explain that?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You even know about all that, huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The special examination committee and I are the only ones who know this. Well, and now Secretary Tachibana. The homeroom teachers don’t have this information, so you can relax.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust how much pull did this guy have? Student organizations were usually decorative. They had no real authority. For them to have access to information the teachers didn’t? Unthinkable.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What exactly \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eis\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the student council?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The student council itself has no power. The abilities of the person seated at the top are paramount.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, that’s an impressive statement. You really are in Class A, aren’t you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Isn’t that obvious?!” snapped Tachibana.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But there’s something I still don’t understand. I mean, the difference between Horikita and me is vast. If you examine the data, Horikita is far superior. Why would you bother with some Class D loser like me?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You misunderstand. I don’t consider the people in Class D stupid. This school doesn’t just shove all the students with superior abilities into Class A,” he replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um, President? You might have said too much,” Tachibana said. “Aren’t you going a little too far?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no problem. I’m sure this young man understands that already.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe student council president had seemed hyper-focused on me ever since our first encounter. Just how long did he plan to keep this up?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, why do you reject Horikita? Isn’t it because she’s in Class D?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know everything there is to know about my little sister’s capabilities. She’s a failure who belongs in Class D. Nothing more, nothing less,” he replied. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe clearly viewed his younger sister in an incredibly harsh light.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Everything was Horikita’s idea. Your sister doesn’t have any friends except for me, so she had to employ me to play the necessary parts,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not true. She’d never think of something like that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed as though he had a perfect understanding of Horikita, perhaps because they grew up together. Even so, I now understood something. This guy probably had his eye on me for the same reason as Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf the president had noticed that I scored exactly 50% on all my entrance examinations, he might also have noticed the difference between my resume and my student report.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Stop fishing for information about my personal life. I just want to spend my days here quietly,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn response, the student council president pushed up his glasses and said something completely astounding.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I asked you once before. Will you join the student council?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSecretary Tachibana’s eyes widened in shock. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, that sounds super easy. What, there are still positions that haven’t been filled or something?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“P-President?” Secretary Tachibana stammered. “Didn’t we just accept a first-year girl onto the student council the other day? We’ve also gotten new appointments from the second-year classes. All the seats should be filled.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s still one open position, isn’t there?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“One? Y-you can’t mean—?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji, if you wish, I’ll appoint you vice president,” the president said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-wait a minute!” Secretary Tachibana seemed to recover her resolve in an instant. An interesting person. “This is completely unprecedented! He’s a first year, and from Class D to boot! We can’t suddenly appoint this rude boy to the vice presidency!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve said this already, but I refuse any position,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And on top of that, he just refuses!” Tachibana wailed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was all rather odd. I couldn’t imagine that the president was joking; his evaluation of me seemed honest. Horikita’s older brother certainly did have access to information, and I could understand why he’d choose me, rather than people like Ike and Yamauchi (no offense to those guys). But he should’ve started with people like Katsuragi and Ichinose, or even Hirata. There were also other candidates with strong latent abilities, like Kouenji.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe president had no motive to fixate on me. There had to be a reason why.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know that this is for me to say, but starting next year, the school will change dramatically. Not for the better. When the time comes, I’ll need the power to combat that change. It might already be too late. The need grows stronger every day.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“President, you’re talking about what’ll happen when Nagumo-kun is elected president, right? I can’t imagine he’d change the school that much for the worse,” Tachibana said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d never heard the name “Nagumo” from any first-year students. If the president said that the change was coming next year, that probably meant Nagumo was a second-year student.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There can be two student council vice presidents. There is typically only one in any given year, but if you wanted the position, it wouldn’t be impossible,” he told me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“N-no, no no no, President! That’s impossible…! There’s no way Nagumo-kun would permit something like that,” Secretary Tachibana interjected.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Look, I don’t know about vice presidents, or this Nagumo guy, or whatever. I’m not doing it. Besides, you’re going to graduate, right? There’s no need for you to worry about the students left behind. Or is there?” I paused for a moment, using that brief silence to stress the importance of what came next. “Well, if you want me to help you because you’re worried about your sister, I might be able to squeeze you in for a consultation.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita Manabu seemed to have given up on me. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry for taking up your time. Please feel free to stop by the student council whenever you like. I would be happy to offer you tea,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven someone like the student coun
