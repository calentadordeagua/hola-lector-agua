That included today. Soon, the second semester would begin. I’d spent the days off rather simply. I didn’t call anyone, and no one called me. In other words, it had been lonely.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I don’t really care,” I said aloud.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe freedom was enough. I wouldn’t ask for more. Having too many friends wasn’t necessarily a good thing. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe more people I connected with, the more troublesome it would become to manage all those relationships. If a friend called me, I might have been thoroughly overjoyed. But there was also a chance that I wouldn’t have been.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven alone, there were many things for me to do. I was doing one of those things today: using my phone to check my remaining point balance (106,219 points). \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI transferred 100,000 of those points to someone from my class—Sudou Ken. Soon afterwards, Sudou called me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yo, Ayanokouji. What are you doing right now?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nothing much. Was just thinking about what to have for dinner.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Gotcha. I just ate some chicken tenders a little while ago. Pretty basic stuff. Tastes all right, but I’d definitely get tired of them if I ate them too often, so I try to change things up a bit. I can fry ’em, boil ’em… Wait, what the hell am I talking about? I wanted to talk to you about fortune-telling.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFortune-telling? I never expected those words to come out of Sudou’s mouth. He was the sort of guy who saw the world in black and white. He liked simplicity, like the chicken he just ate.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Truth is, I’ve heard there’s this crazy-accurate fortune-teller over at the Keyaki Mall, but they’re only gonna be there during summer vacation. I guess it’s big among the seniors. Even when I’m doing club stuff, all anyone talks about is that fortune-teller. I got some extra cash, so I felt like having some fun, you know? Let’s check it out together. My treat, of course.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe Keyaki Mall was a complex on the school grounds that students often went to. Because students were forced to live on the school grounds, the school was equipped with all sorts of facilities, although it couldn’t give us all the options of the outside world. We didn’t have idol concerts, amusement parks, or zoos. Our world was small. When something new cropped up, it naturally became a hot topic among the students. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven so, fortune-telling was unexpected. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince no one had invited me to hang out in a long, long time, I couldn’t hide my happiness. “When are we going?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tomorrow morning. Sounds like it starts at ten, but apparently, if you don’t get in line early, you’ll be waiting forever. I wanted to get there around 9:30,” said Sudou. Apparently, he’d already planned out a schedule. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m fine with that, since I don’t have plans. But will your club be cool with it?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. Tomorrow’s my day off. The tournament ended, so it’s fine. Besides, we’ve done nothing but train our butts off. If they don’t let us rest a little, our bodies will fall apart,” he told me matter-of-factly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou had just played in a basketball tournament. Even though I saw him quietly practicing day after day in preparation, I was admittedly kind of curious about the tournament’s results. One more thing to think about.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you have any \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003etrouble\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e at all?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI made sure to stress the word “trouble.” Sudou understood what I was referring to.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. It was pretty tough. I mean, they supervise you way more—you have the team captain and the coach watching you. It’s nothing like playing in junior high. I can’t open my mouth at all, except when we need to talk during a game. The school puts a ton of restrictions on us, even on bathroom breaks. I thought it was going to be impossible,” Sudou said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though club activities were separate from coursework, the school rules were still strict.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, it all worked out. I did pretty well, ’cause I got the chops,” he added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Well, that’s a relief. What about Yamauchi?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I made sure to delete the data before heading back,” Sudou said, once again referring to our secret business. “I wouldn’t worry. I mean, even I’m not that dumb.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou’s school life rode on this. He probably wouldn’t do anything reckless. Even so, it might be a good idea to get in touch with Yamauchi later, to confirm that the data was successfully deleted. Just in case.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“By the way, did you actually get to play in the big game?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. I was the only one out of all the first years to play. I even scored. We still lost in the end, though, so I’m not exactly that proud.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t really understand the intricacies, but a first-year student playing in a game like that seemed like a pretty big deal. I sensed acceptance, rather than frustration, from Sudou. He’d probably practiced hard for the tournament, and saw this as steadily making progress.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe had to have practiced hard, since the first-year students left the school grounds to participate in those special exams. That meant Sudou had had less time to practice than the older students.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what are you gonna do? Fortune-telling—you gonna go or not?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I don’t really have anything planned. So, sure, I’ll go.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that I’d agreed, Sudou cut straight to the chase. “Definitely invite Suzune out, too. Definitely. Understand?” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, Sudou didn’t actually want to go see the fortune teller with me, but rather, with Horikita. He probably knew that, if he invited her himself, his chances of success were rather slim. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s just… I can’t imagine that she’s interested in fortune-telling,” I added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even so, invite her. This is like your one special skill, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWhat kind of special skill? I really wish he’d quit trying to use me as some kind of Horikita Invitation Machine.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’ll give it a shot. But don’t expect anything,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Giving it a shot isn’t good enough,” he answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not good enough?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou’s emphatic words contained traces of anger. He seemed to plan on Horikita definitely being there tomorrow. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You absolutely need to do it. If you don’t invite Horikita out, there’s no point,” he told me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Look, I don’t know what plans she might have tomorrow. And I don’t know if she even has any interest in fortune-telling. Wouldn’t it be easier to invite her to go shopping or check out a film festival?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s nothing to worry about. All girls love fortune-telling,” he answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was an extremely broad generalization. I couldn’t really imagine Horikita showing any curiosity about things that ordinary girls liked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Got it? Later, after you invite her, get in touch with me. Okay? You gotta.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, Sudou abruptly ended the call. I’d thought it was strange for Sudou to invite me to check out a fortune-teller. Well, it seemed as though he was really after Horikita. While I did feel a little disappointed, I needed to call Horikita right away. If Sudou found out later that I ignored his request, it would be a huge headache. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita answered her phone immediately.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Horikita. Do you like fortune-telling?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf there was one woman in the whole world capable of destroying anyone’s preconceived notion that all girls liked fortune-telling, it was Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You open conversations in the strangest way,” she answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTrue. But I didn’t really have anything else to say. “You’ll be saving me if you give me an answer.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, if I don’t answer you, there’s a possibility that you won’t be saved?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was certainly a possibility. The image of Sudou putting me in a headlock stuck in my mind.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, are you going to save me?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re comfortable owing me one,” she answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d have to owe her one \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ejust\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e for answering a question? I was filled with the urge to hit the “end call” button, but I pictured Sudou’s angry face and resisted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fine. If you answer me, I’ll owe you,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita, realizing her answer’s value, paused for a moment. “I see. Well, I’m not exactly an enthusiast or anything, but it would be a lie to say I dislike fortune-telling.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was unexpected. “Have you ever had your fortune told before?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course I haven’t. I’ve simply noticed horoscopes and such in the morning news.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was probably talking about the daily horoscope things that were usually based on your birth month. I had a hard time picturing Horikita as the type of girl who would go change her clothes, or buy new accessories, if someone on TV said her lucky colors were red and white.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you addicted to getting your fortune told, by chance?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, that’s not it. There’ve been some rumors going around lately about a fortune-teller. Have you heard?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A fortune-teller?” Horikita fell silent for a while, then eventually answered in a tone that sounded as though she understood. “Yes, there does seem to be quite the uproar. I’ve heard about it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I was a little curious. They say that the fortunes are really accurate, so I was wondering \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehow \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eaccurate. But I can’t honestly imagine that something like fortune-telling would be so spot-on.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI expected her to agree with me, but she apparently held a different opinion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Indeed? I think that someone with real power could be accurate.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No way. You’d have to be psychic,” I replied. The power to predict the future by reading a person’s face or hands, or based on their birthdate? That was ridiculous, and I didn’t believe it existed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, that’s not what I mean. Fortune-tellers don’t have the power to divine the future. That’s obvious, isn’t it? That would be as foolish as someone saying that they believe in ghosts. However, the big difference between fortune-tellers and psychics is that fortune-tellers give readings based on a massive amount of past data. In other words, they interpret patterns to understand people.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita wasn’t a fanciful girl. Her answer was grounded in logic and reason. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In other words, you’re talking about fortune-tellers’ ability to cold read, right?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re rather cheeky, but I guess you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edo\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e know some things.” Horikita sounded slightly amused. “We can’t evaluate ourselves objectively. However, a good fortune-teller can extract information from the person they’re reading through a short conversation. They can pick up on things that the person themselves hasn’t noticed. Don’t you think so?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCold reading. Quite literally, that term meant reading someone’s mind without prior preparation. It referred to a technique which extracted information through casual conversation, and thus, gave the person being read the impression that you knew more than you did. You used observation and deduction to obtain information about your target, then made the person believe that you could see their past and future. It sounded simple, but actually, being able to extract information without the mark noticing was incredibly difficult. It required a high degree of skill.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m a little interested,” I admitted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s good. I think you should go,” Horikita said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How about you come along?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you joking?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I’m quite serious.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I refuse,” she answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe’d shot me down instantly, but I couldn’t just accept that. “I’m a total novice when it comes to fortune-telling. I thought it’d be good to have you along, Horikita, so I understand better.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, but I’ll pass. You know I don’t enjoy dealing with crowds, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was certainly true. Fortune-telling was so popular, a lot of very excited students were bound to be there. Some adults from campus might go, too. I certainly couldn’t imagine Horikita wanting to enter a crowded place like that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I pushed any further, I’d probably just end up souring Horikita’s mood. As far as I was concerned, I’d received her message loud and clear. Sudou probably wouldn’t be that big a problem, anyway. Probably. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter I ended the call, I shot him a brief message. I immediately noticed the “read” marker pop up. Shortly afterward, I received a disgruntled reply.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then forget about it,” the message read.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI existed only as a means for Sudou to invite Horikita. Since I’d failed to invite her, Sudou had no further use for me. Well, it probably would’ve been a little weird for two dudes to see a fortune-teller together.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even so… A fortune-teller, huh?” I murmured aloud.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter that conversation with Horikita, my interest was piqued. I decided to head over tomorrow and check the fortune-teller out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e2.1\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eW\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eho in their right mind thought it’d be a good idea to go see a fortune-teller?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I might have messed up,” I muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe intense late-August heat blazed down upon me. I saw a shimmering heat haze ahead, above the concrete, and through the roadside trees. The dorm rooms came equipped with air conditioning, so we didn’t feel the heat much indoors. However, it \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewas\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e summer, and in direct sunlight, you instantly started sweating buckets. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe heat reduced people to complete lumps. I desperately sought out shade. Fortunately, the school boasted a rather expansive campus littered with tons of trees. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was 9:30 A.M., well before most student activities, as I made my way towards the fabled fortune-teller. Fortune-telling services were supposed to begin at ten, but I didn’t plan to stick around for long. I’d quickly get my fortune read, then leave just as quickly. That was my plan. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut, as I neared my destination, I realized that my plans were about to be shattered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI expected Keyaki Mall to be nearly empty. Instead, numerous students lounged around in their summer clothes. I prayed that they weren’t all there for the same reason I was, but I suspected they were. I decided to at least escape the blazing hellscape by entering the building, and started looking for the elevator, since the fortune-teller was on the fifth floor.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Geh.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI let out a grumble. Nearly ten students were hanging around in front of the elevator. I wondered if any of them would understand my plight. Whenever I took elevators alone, I was the sort to push the “close” button repeatedly. I wasn’t good at riding elevators with large groups of people my age. I’d need a great deal of courage to mingle with that crowd.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough it’d be inconvenient, I decided to take a detour and get on a different elevator. Another elevator, across the way, was far less crowded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Calm down,” I muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eGetting to the other elevator took more time and effort, but the peace of mind it brought me was a lifesaver. After I reached the fifth floor, I made my way toward the fortune-teller. However, an even more uncomfortable situation awaited me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are couples everywhere.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBoys and girls stood in pairs all over. A number of them seemed to be in relationships. Of course, there were groups of only boys and only girls, but those were far fewer. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSeeing a fortune-teller about a couple’s future and romantic compatibility was common, I supposed. However, it made this visit significantly more awkward than I’d anticipated. Not many people had come alone to have their fortune told. Single guys were fewer still.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn any case, a line was forming. I decided to queue up. When I did so, a woman scanning the area called out to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good morning. Will your partner be joining you later?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Partner? Uh, no, it’s just me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, it wasn’t exactly odd for her to ask me that question, but she’d put it rather strangely. I wished she’d be more sensitive to single people.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Umm…” The line attendant looked at me with a sheepish expression. “I’m sorry. I’m afraid that, in order to have your fortune read today, you need a partner. So…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t have my fortune read if I’m alone?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe gave a small nod and pointed at a written notice. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eGuidance is for couples only. We humbly ask for your understanding\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI now saw why Sudou had insisted on inviting Horikita. He and Horikita would’ve had to line up together and talk to each other.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That means he never wanted me along, from the very start,” I muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou’s behavior took on an entirely different meaning, now. He’d never really wanted to invite me. He probably would’ve found some excuse to send me packing once he had Horikita to himself. That was pretty sad.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Out of curiosity, is the rule the same for the line next to me?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. Ukon-sensei is only reading fortunes for couples,” the woman answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI bowed my head and slipped out of the line. The students behind me advanced one step forward. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t believe I’d fallen for something like this. I’d pictured a lone woman sitting on a street corner, being paid in small coins, but reality had other plans. Apparently, this sort of romantic divination was all the rage right now. I would’ve liked to try the fortune-teller’s services, but there was nothing I could really do. Trying to invite Horikita again would have been a waste of time. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI decided to just slink away quietly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? So, I can’t have my fortune read alone?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI heard an angry voice. Another victim of singleness was apparently standing in the next line. Feeling somewhat sympathetic, I glanced over. Unfortunately, I caught that person’s eye.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was Ibuki Mio, a Class C student. When I pretended I hadn’t seen her, she chased after me. I quickened my pace.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait!” Perhaps Ibuki thought that I was trying to run away (which I certainly was). She grabbed me by the shoulder.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you want something?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Where’s Horikita?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe looked around as she asked this. Ibuki was sort of like Sudou; she saw me as little more than a Horikita whisperer. I wished she’d just go see Horikita directly and not involve me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not like I’m with her all the time or anything. I’m alone today,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, I see.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDuring the deserted island test, Ibuki had been sent to infiltrate Class D. Her mission was to spy on us and stir up chaos, and she and Horikita ended up trading blows in a fistfight. Since then, Ibuki had been rather hostile toward Horikita. She probably considered them archenemies.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough Ibuki was her usual crabby, unsociable self, she had pretty good fashion sense. She looked great. With a slightly different attitude, she could have been popular.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fortune-telling is usually something you do one-on-one, isn’t it? I really didn’t expect this at all. Don’t you agree?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. That’s what I thought, anyway.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, are you going to invite Horikita or something?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFirst Sudou, now Ibuki. It seemed like Horikita was the sole topic of conversation whenever I was involved.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I’m not. If you want to talk to Horikita, why don’t you reach out to her yourself? Try telling her that you want to go have your fortunes read together.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Absolutely not. It’s not like I have anything to talk to her about.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eIf that’s true, then I really wish you’d stop bringing her up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol4_5_INTERIORILLUSTRATIONS_\" src=\"/hola-lector-agua/images/books/v4.5/OPS/ClassroomElite-Vol4.5_INTERIORILLUSTRATIONS_.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"/\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wasn’t really that interested in having my fortune read in the first place, so I’m fine. How about you?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d be lying if I said that I wasn’t annoyed, but…” Ibuki shook her head in frustration. “Well, I don’t really have any choice but to give up. I’m bad at making conversation, anyway.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat answer sounded fishy. Ibuki said she was bad at conversation, but unlike Sakura, she had never struck me as a person who struggled with that kind of thing. In fact, she seemed comfortable talking to me on equal terms—or comfortable being condescending, at least.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You could invite Ryuuen,” I offered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI said that half-jokingly, but Ibuki shot me a scornful glare packed with disgust. “You’re joking, right? I hate seeing his face, even when I have to. I’d rather avoid him during my holidays.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But you were always together back on the ship, weren’t you? Isn’t it normal to think that you two might be close?” I pointed out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki looked away. “That was because it was my fault that I didn’t discover Class D’s leader,” she answered quietly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf that were true, Ibuki had only been working with Ryuuen to atone for her failure. That didn’t explain everything, but I supposed only Class C knew the real reason. That said, Ibuki \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehad\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e learned our leader’s identity during the survival challenge on the island. She discovered that Horikita was the leader, and she hadn’t been wrong. She would have contributed significantly to her class if I hadn’t thwarted her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wanted to ask. During the survival test, who was Class D’s leader?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who knows?” I shrugged.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“‘Who knows?’ It’s not like you don’t know.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if I did, I couldn’t tell you. Honestly, I don’t know. Most of us in Class D have no idea. I think Horikita acted in secret, and somehow managed to pull everything off on her own. That’s the only way I can explain what happened.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki seemed to look right through me. However, I wasn’t the sort of person to be easily exposed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If Ryuuen’s not an option, why don’t you invite a girl from your class? I’m sure you must have a friend or two,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I did, I wouldn’t be in this situation. I absolutely despise the girls in my class,” she answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki was just like Horikita. Actually, she was probably even more antisocial than Horikita. With the right opportunity, the two might get along.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know, you’re making conversation with me just fine right now. Shouldn’t you be able to talk to anyone else, too? I don’t think you’re bad at dealing with people,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not true. When you talk to me, you feel something, don’t you? I’m all prickly.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah. I guess so.” Interacting with Ibuki always made me feel like meat being sliced by a sharp knife. That was the closest I could come to describing her desire for isolation. I’m sure other students felt the same way.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No matter what I do, the mood always seems to turn sour. Understand?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI still had my doubts about Ibuki actually being bad at making conversation, but she was undoubtedly standoffish, even with her own classmates. I could imagine her headstrong attitude challenging the fortune-teller.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re bad at communicating, I’m surprised you’d want to get your fortune read.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s the problem. I’m like someone who loves cats, but has an allergy,” she answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat certainly sounded frustrating. “But you did really well spying on Class D,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCrabby and unsociable as she might be, Ibuki hadn’t seemed at all disagreeable while she was working as a spy. Our class had accepted her without suspicion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s different. In any case, talking to people makes me anxious. And when I’m anxious, it puts me on edge. I hate it. It’s not like I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewant \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eto be this way—wait, why am I even telling \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ethis? People might get the wrong impression about us!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFlustered, Ibuki abruptly turned away. Really, that should’ve been my line. Everyone who’d been queueing near us had moved ahead, and it was just the two of us. The other students might easily have misinterpreted that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, talking to people made Ibuki anxious, huh? If that were true, the solution might be unexpectedly easy. Even if I didn’t know the root cause of her anxiety, I could work with this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Earlier, you said that being a spy was different, didn’t you?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. Because it’s a fact.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s the difference between then and now?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki fell silent for a little while. “I don’t know. It’s just different,” she said finally. It seemed like she’d given up on trying to articulate the difference.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You haven’t given it much thought,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s not like I can explain why they’re different. I was just acting.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I think it’s simple. The difference between you now, and you then, is awareness.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Awareness?” Ibuki turned toward me, her interest slightly piqued.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your anxiety comes from being hyper-aware of situations. You project your insecurities onto others, so you freeze up when you meet someone for the first time,” I explained.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you talking about? I mean, maybe it’s different for people who are good at communicating, but pretty much everyone gets nervous when they meet someone for the first time, don’t they?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course. I’m the same way. But would you still feel nervous if you were talking to the clerk at a convenience store?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The clerk at a convenience store you visit often. ‘Do you have a point card? Would you like that warmed up?’ You don’t get anxious when the clerk asks you those questions, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, th-that’s…” she stammered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf you thought of communication as a skill, like athleticism, it was simple. You had to train your talents. Ibuki got nervous because she was acutely aware of who she was talking to\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e. I wonder what they think of me. I want them to like me. I hope they’re a good person.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen Ibuki infiltrated Class D, she probably didn’t have time to consider those things. She was playing a part, not thinking about how people would react to her real self. And she usually gave off an outcast vibe anyway, which worked as the perfect disguise.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose, when you put it that way, you have a point,” she muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You were ready to talk to the fortune-teller face-to-face. It’s natural to feel anxious, but there’s no reason to. If you don’t think about communication too hard, that should relieve some of the tension.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Wait, why the hell are \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e lecturing me?” Ibuki glared, looking ready to pounce. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When you’ve been a loner for a long time, you understand these kinds of things. You wonder why you can’t make friends, and you think about the differences between the people who make you nervous and those who don’t. Finally, you think about where people come from and where they’re going.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re creepy. You seem like the sort who’ll turn out to be a mass murderer later in life. Were you always like this?” Ibuki asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“More or less.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThings had veered into rather awkward territory. I probably came across as a weirdo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’m heading back. How about you?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll probably head back, too. I can have my fortune read alone, anyway. I was really interested in \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003etenchuusatsu\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, though,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eTenchuusatsu\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat wasn’t exactly the kind of word you heard all that often.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait. You came without even knowing what that is?” Ibuki sighed in exasperation. “Put simply, it’s a type of fortune-telling that tells you what times are unlucky for you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWas it really possible to pinpoint an aspect of someone’s destiny like that? My knowledge of fortune-telling was limited to superstitions like “wear the color red,” and “be careful not to lose something this month.” However, Ibuki made it sound like there was far more to fortune-telling.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s why I came. Fortune-telling isn’t all about romance and such.” Ibuki sounded disappointed as she looked back at the long line. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe some of them came here to check out \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003etenchuusatsu\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, or whatever it’s called,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even so, I get the feeling that the romance stuff is what they’re after, since the fortune-teller is forcing us to visit in pairs,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd with that, Ibuki left.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e2.2\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003efter I returned to my dorm room, I did some research into \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003etenchuusatsu\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. It was an incredibly deep subject. Before 1980, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003etenchuusatsu\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e had been something of a hot topic worldwide. However, as its popularity boomed, people started to doubt its credibility. There was a news story about a famous fortune-teller who was forced to retire after he dropped \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003etenchuusatsu\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFortune-telling might have some value, even if depending too much on it was bad. From a true believer’s perspective, it probably seemed fairly accurate.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that thought in mind, curiosity overcame me. Yet I couldn’t believe what I read online. It was impossible to divine the future. I wanted to try \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003etenchuusatsu\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e out for myself, to see if it was a lie. I wanted what the fortune-teller was doing to be simply an extension of cold reading.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder if \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003etenchuusatsu\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e is only being offered this month?” I muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, the fortune-teller’s crew was leaving when summer vacation ended. There was no information on whether they’d return. A fortune-teller might never visit this school again.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t have anyone to invite. I was completely out of options. Horikita would just turn me down if I asked, and I didn’t have the courage to invite Kushida. I felt like Sakura would probably come with me, but if I brought her to a place positively teeming with couples, it’d make her uncomfortable. After that were the guys, like Sudou, Ike, and Yamauchi, but they probably didn’t want to spend their few precious remaining days of summer vacation getting their fortunes read with another dude.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m stuck, huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBesides, I didn’t like this couples-only requirement. Ibuki and I agreed on that. It seemed like a huge turn-off for people with a genuine interest in fortune-telling. I gave up and stopped my online research.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e2.3\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ehe day after I’d given up, though, I found myself moving toward the fortune-teller again. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYet another bizarre meeting; fate had reunited me with Ibuki. We happened upon the same place at the exact same time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why did you come here again? And by yourself?” Ibuki looked disgusted. I got the impression that I thoroughly repulsed her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I could ask you the same question,” I countered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I said that I like fortune-telling, didn’t I? I thought maybe I could have my fortune read, even if I’m alone,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, Ibuki came here hoping the rules had changed since yesterday. I wondered if she really \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e like fortune-telling that much, and if so, which part.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m going to ask you something directly. Ibuki, do you believe in fortune-telling?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you saying I shouldn’t?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. But it’s generally not something people start to believe in all of a sudden, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNot everyone understood that fortune-telling was the mere application of techniques such as cold reading. Many genuinely believed in divination’s mysterious power.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose a lot of people start out thinking that way. But if you can’t move past that, fortune-telling’s probably not for you,” Ibuki said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re saying that nonbelievers aren’t qualified to have their fortunes read?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, that’s not it. Let me put it this way. It’s not like I believe in fortune-telling unconditionally. However, people who are overly skeptical from the very start won’t get anything out of it. People who make fun of fortune-telling often lead lives riddled with contradictions themselves. They’ll say they don’t believe in kami or in Buddha, for instance—but when they’re in trouble, they call on a higher power for help, don’t they?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was a good argument. Gods didn’t exist, and neither did things like ghosts. Yet many who made caustic statements like “God doesn’t exist” would still visit shrines to bring in good fortune for the New Year. They’d pray for freedom from disease, success in business, or fulfillment in love. They’d clasp their hands and say, “Please, Kami-sama, listen to my prayers.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat you believed in and what you wished for were infinitely different, and no one could deny that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat said, fortune-telling wasn’t the same as the existence of a higher power. Fortune-tellers were just people, like you or me. Really, I couldn’t help but be skeptical.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you understand?” Ibuki asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI still had lingering doubts, but I got the gist. I decided to make a suggestion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The fortune-teller only offers readings to pairs, but they’re not only reading for romance, right?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, obviously.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, why don’t we go together? We’re both genuinely interested in fortune-telling. If we’re not in a relationship that might have future complications, I don’t think we have anything to worry about.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI honestly felt absolutely nothing for Ibuki. My emotions were a flat line, neither good nor bad. It was like dealing with a first-time customer in a store.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I don’t mind. I would like to have my fortune read, after all. Are you okay with this?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if Horikita were here, she’s only a friend.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not what I meant. Some students still hold a bit of a grudge toward me because of what happened on the island.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki was looking out for me, in a way. She was worried that, if my classmates saw us together, they might resent me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think you really need to worry about that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki craned her neck like she was puzzled. “I don’t understand.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If everyone at this school got along, then yes, what you did would be considered a massive moral violation. However, the school believes that ability is everything. Besides, the classes were competing against one another. Spying and sabotage were natural tactics to employ under the circumstances. Am I wrong?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But a lot of people operate based on feelings, rather than logic, and they won’t be convinced of that. Not everyone’s quite as mentally flexible.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think people like that would be admitted to this school in the first place.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki crossed her arms and looked deep in thought for a moment. “You’re surprisingly shameless, aren’t you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All I am is an unremarkable student. I have no interest in either trying to crawl my way up the ladder or being kicked off it. If working with a student like Horikita lets me coast by, then I’m lucky.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not uncommon, though. Every student in this school has their eye on the special privileges that come with graduation. But no one foresaw that the school would make us compete like this, so I’m sure most students are bewildered.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, Class C students weren’t really that different from Class D. That probably meant that Ibuki, who’d caught Ryuuen’s eye early on, must be formidable. In fact, after her identity as the spy was discovered, Ibuki was at Ryuuen’s side on several occasions. She said that she was only helping him to make up for her failure, but it seemed like he trusted her, at least to some degree. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki and I both got in line. The clerk I’d run into the other day came by once again to confirm that we were a pair, then handed us tickets. There were eight couples ahead of us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks like we’ll be waiting for a while,” I sighed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf only one fortune-teller was available, Ibuki and I would have to wait longer than an hour, even if they managed the time efficiently. How would the two of us endure that? I probably couldn’t carry on a conversation for that long.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re only together to have our fortunes read, so we don’t really need to make pointless chit-chat, right?” Ibuki asked me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess you have a point,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe’d picked up on what I was thinking. Good. I’d been saved a lot of hassle.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e2.4\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003e“N\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eext, please.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was the middle of the afternoon when I heard that small voice come out of the temporary tent.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry to have kept you waiting.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the end, fortune-telling for each pair took approximately fifteen minutes, which forced Ibuki and me to stand in line for even longer than anticipated. Just as I started to wonder if I even cared about fortune-telling anymore, I passed through a curtain and entered the room where the fortune-teller waited.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I entered, I found a chamber that looked like something out of a television show. It was dark inside, probably around 30 lux. The fortune-teller appeared to be an elderly woman, but a hood obscured her face, so I couldn’t make out her expression. She sat with a thick book, the contents of which I couldn’t guess, and some kind of crystal ball. It looked like one of those balls you chuck around in the hammer throw in track and field. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was excellent atmosphere.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe crystal ball immediately began to glow, as if it would reflect my and Ibuki’s futures. There were two backless seats in front of the fortune-teller. When we sat down, the fortune-teller chuckled lightly and moved her right hand.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“First…you must pay,” she commanded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe pulled out a small card reader from under the table and placed it before us. Such a product of modern civilization felt out of place, especially in contrast to the scene around me. Not that I expected the reading to be free, of course.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What kind of fortune are you going to read?” asked Ibuki, presenting her student ID card. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It can be about your academics, career, love life, or anything you like,” the fortune-teller answered with an unsettling grin. The expression lent itself nicely to the atmosphere, but she seemed less like a fortune-teller, and more like a witch. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe list of prices she showed us seemed oddly mismatched. They were separated into several categories. The “Basic Plan” package seemed to include the services the fortune-teller had already mentioned. There were several packages, one of which seemed to be related to \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003etenchuusatsu\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. There were even options that let you see the end of your life. Of course, since this was a couples’ activity, many options were related to romance.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wondered what a couple would do if the fortune-teller divined that they had poor romantic compatibility. Regardless, every option was rather expensive. We’d be spending well over 5,000 points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s a lot of money,” I sighed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor a Class D student like me, who struggled with points daily, this was a tough pill to swallow. Even so, it probably would’ve been pointless to go home without finding out more about \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003etenchuusatsu\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. I could just listen to Ibuki’s fortune and head back, but then I wouldn’t know how reliable the fortune-teller was. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust in case, I checked my private points balance on my phone. I had roughly 6,000 points remaining: barely enough.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll do the Basic Plan,” said Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite her unexpected interest in fortune-telling, she didn’t seem to want a detailed fortune.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And you?” asked the fortune-teller.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll take the same,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt felt as though I was placing an order at a restaurant. I presented my student ID card, and the card reader beeped, indicating that it had deducted points. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Very well, let’s start with the young lady. What’s your name?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ibuki. Ibuki Mio,” she answered flatly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When I tell fortunes, I see the face, the hand, and then the heart of the person I’m reading. I may see something that you won’t like. Are you prepared for that?” asked the fortune-teller.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do whatever you want,” Ibuki replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI saw a bit of the fortune-teller’s wrinkled skin under her hood, along with the sharp gleam in her eye. She instructed Ibuki to extend both hands, then revealed her fortune.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“First, a palm reading. You have a long lifeline. You have a long, long life to look forward to. I cannot see you suffering any major illness so far,” the fortune-teller began.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA typical start. I couldn’t imagine that a person could divine such things just by looking at the lines on someone’s palm. Maybe the fortune-teller based her readings off personal experiences?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf it were me, I’d simply base my answer on the customer’s apparent health. I’d come to a conclusion based on their complexion, build, and so on. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut the fortune-teller continued her reading at length, carefully providing Ibuki with predictions about academics, financial success, love, and so on. The predictions sounded ordinary and innocuous to me, but Ibuki listened with seeming satisfaction. The fortune-teller didn’t have anything particularly negative to say. Most of her predictions were of a bright future. She occasionally issued warnings, but they didn’t seem to pose a significant threat.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you very much,” said Ibuki. She bowed her head gratefully. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt now seemed to be my turn, a chance for me to understand this fortune-telling business. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe fortune-teller followed the same process she’d used with Ibuki, and the answers I received were largely indistinguishable from Ibuki’s. Things seemed fundamentally good, but the fortune-teller said that there would be a future time when I would need to be careful to avoid disaster.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see… It seems that you had a harsh childhood,” she continued.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA rather broad statement. Most people would claim to have gone through one or two harsh experiences during their youth, especially boys. I wanted her to give me more concrete answers. More importantly, I found it mysterious that a fortune-teller, who should have been divining the future, was instead talking about the past.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki sat without once inter
