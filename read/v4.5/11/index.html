e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:Td4f2,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 5:\u003cbr/\u003eA Day of Girl\u003cbr/\u003eTroubles and Disaster:\u003cbr/\u003eA Devil Smiles Like an Angel\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003e“Y\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eou’re gonna do what I say today, Ayanokouji!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWoken by the doorbell, I sighed when I saw my visitor. “What’re you yammering about this early? You sure are energetic, Yamauchi.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry for the bother!” he shouted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThankfully, Ike and Sudou weren’t with him. But what in the world did he want with me?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What, were you sleeping or something? Dude, you’re acting pretty chill, even though summer vacation is over in a couple days,” Yamauchi said. “Anyway, I decided that today’s gonna be special. Let me in.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was being chill precisely because we only had a couple days of vacation left. Still sleepy, I didn’t exactly follow Yamauchi’s train of thought, but I let him in anyway. I prepared a cup of barley tea for him and set it down.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, am I involved in this special day of yours?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not gonna let you weasel out of this, Ayanokouji. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRemember when I wanted to know Sakura’s phone number?” he pressed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi’s determination was obvious. His eyes were slightly bloodshot.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t just turn him down. The whole situation was kind of my fault, after all. Some time ago, I’d gotten Yamauchi to make a fool of himself by promising him Sakura’s number. That had damaged his perceived market value, especially in Horikita’s eyes. I definitely owed him one. Still, since I’d made that bargain without Sakura’s consent, I wasn’t about to give Yamauchi her number.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI did need to repay my debt to him, though.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, if you’ve come to ask about Sakura’s number, I think that might be kinda difficult.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh no. That’s not it. I’ve given up on that.” Yamauchi produced a letter. “I’ve written down all my feelings for Sakura on this paper!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Written down… Wait, this is a love letter?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Right! I’ve written about just how much I love Sakura! Here, read it!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi showed me the note in the unsealed envelope.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eDearest Sakura Airi-sama, you’ve been on my mind for a long time now. Please go out with me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s really…simple. And overly formal at the beginning,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi looked pained. “Even if I write something long, that doesn’t mean it’ll be good, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was probably true. Still, this was too little to go on. I could honestly picture the letter’s recipient—especially Sakura—being uncomfortable.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait. Why is it printed, instead of handwritten?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not really proud of this, but my handwriting sucks. I printed the letter to make it easier to read. I was kind of worried she might not be able to understand it, you know?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi scratched his nose with his index finger, looking a bit proud. I didn’t think that pride was merited.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides, even resumes are printed nowadays, right?” he added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you really want to convey your feelings, handwritten is better. Also, why’d you use such a scary-looking font?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was the kind of font you’d choose for something like “A strange demon appears!” It looked as though it was made for casting curses. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s got impact, right? The letter’s got this whole ‘I’ve been thinking of you for a long time’ vibe.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For the sake of argument, I’ll let that go. The problem’s the last part,” I replied, pointing out what he’d written to add to his appeal.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eIf you go out with me, I’ll give you all my points every month as tribute!\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s no good.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whaddya mean? Don’t they say that cute girls like men who can support them? If going out with Sakura means I gotta hand over all my points, I’ll do it. That’s how I’ll communicate my passion.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t deny that girls loved financial stability, but it kind of seemed as though Yamauchi was offering to pay Sakura to date him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s fine, dude. Even if she was only after the money, it’d be all right. I want to date her. Is that bad?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I affirmed that it was indeed bad, Yamauchi began to grasp just what I was getting at. “Are you seriously planning on confessing your love to her?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. Starting with the second semester, I’m aiming for my dream school life! I’ve already asked Kikyou-chan to help. I got her to call Sakura.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was all perfectly normal to Yamauchi, and I found I couldn’t bring myself to rebuke him. I should probably have stopped him, for Sakura’s sake, but at least his methods were direct and honest. I considered offering him a helping hand.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what should I do? Proofread the letter?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah, but I have one more really important role for you. I want you to deliver the letter to Sakura.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?” I thought I’d misheard him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I want you to deliver the letter. Look, I’ve been feeling super nervous all morning, all right? The last time I felt this nervous, I won the final match at the Ryougoku Kokugikan Sumo Hall. That’s why I don’t have the confidence to give the letter to Sakura myself,” he explained.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWait, what final game had he participated in at Kokugikan? I wanted to interrogate that probable lie further. It was honestly a weak statement, and uncharacteristic for Yamauchi. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you say the letter’s the problem, then I’ll rewrite it. Please!” Yamauchi clapped his hands, bowed his head, and begged me to help. “Any past problems between us will all be water under the bridge! If you’re ever in trouble, Ayanokouji, I’ll help you!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you insist, I guess I’ll help,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But what matters is how Sakura feels. Do you understand?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I’m not an idiot. I know my chances aren’t that high.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt least Yamauchi understood that his chances of success were low. In fact, Sakura actively shied away from men, which made his chances \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edespairingly\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e low. Even so, he was determined to try.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand. I’ll deliver your letter. Okay?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji! You’re a lifesaver!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi grabbed my hand and lowered his head in reverence, as if worshipping a god. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFirst, I’d need to review the letter carefully. Considering that it was for Sakura, it needed to be gentler if it was going to work. Honestly, this was still rather premature. Confessing his love, when he and Sakura hadn’t even exchanged contact information, was just risky. If Yamauchi wanted to increase his chances of success, he needed to actually talk to her. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen again, maybe Yamauchi had a point. Romance happened spontaneously. People often went from zero to sixty very quickly. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLike Yamauchi, I had zero romantic experience, but I thought that I should at least do something to help.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, that reminds me. I want to add one more thing to the letter. I want to hear Sakura’s response to my confession behind the school building,” added Yamauchi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Behind the school building? After Gym Number Two?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, yeah. It’s like, there’s this rumor, y’know? If you confess your feelings there, it’s sure to go well.”\u003c/span\u003e\u003c/p\u003e\r\n \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSounded similar to the legendary “under the tree” confession. Urban legends seemed to spring up everywhere.\u003c/span\u003e\u003c/p\u003e   \r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, that’s the stage you’ve chosen for this whole production?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, it’s not just a rumor. They say, if a student confesses their love, it’s gotta be behind the school. That’s like the golden rule.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t see any connection between telling someone how you felt and the back of the school building. However, I understood his thinking. \u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e5.1\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003et took just under half an hour for me to contact Sakura. How would she react to Kushida’s invitation, I wondered? She probably wouldn’t take this with equanimity. I, on the other hand, was on standby at the agreed-upon spot, waiting for Sakura to arrive. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy phone vibrated in my pocket. I answered it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hello?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-how’s it going? Can you see Sakura yet?” Yamauchi asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nope. I mean, she’s probably not going to show up until about ten minutes beforehand, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I see. Damn, I’m so nervous!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi waved from where he stood, some distance away. Even though he didn’t want to be seen, he’d probably gotten curious, and come closer to have a look.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Yamauchi. Should I really hand the letter over for you? I think it would be better if you gave Sakura this yourself.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Th-that’s impossible, dude. Whenever I’m really nervous, my hands start to shake. I’ve carried that trauma ever since I was a little kid.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMost people probably shook under extreme stress, though.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand that you don’t want to mess up, but think about it. Does an indirect love letter really have any value?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know when a cute girl asks you to meet her after school, but when you go, a completely different girl from the one you expected shows up, and it’s this plain Jane confessing to you instead? This plan is sort of the reverse. I asked Kushida not to tell Sakura that I’m the one asking her to meet. In other words, when Sakura realizes you’re waiting for her, she’ll be disappointed. But once she learns that it’s really me confessing, my chances will be a lot better when she compares us, you know? So, when you hand over the letter, don’t mention me at all. It’s better for Sakura to think you’re the one confessing,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi didn’t seem to care that he was completely trash-talking me. I had no room to criticize his goals, but he really needed to consider Sakura’s feelings. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Look, I just think getting a confession of love from someone you can’t see is scary,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Th-that’s—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wanted to get him to change his mind. With a confession of love, you had one shot. I figured that even Yamauchi shouldn’t do it in a way that might leave him with regrets.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s still time. I think you should reconsider. That’s why you wrote this letter, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I suppose, but… Ugh, should I confess to Sakura in person?” Finally, the proper conclusion seemed to form inside Yamauchi’s head.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun?” Just then, I heard the faint sound of footsteps, and a voice called out to me. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s Sakura! I’m leaving the rest to you!” whispered Yamauchi. Panicked, he hung up. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, there probably wasn’t much else I could do at this point. All that was left was to hand over Yamauchi’s letter.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is a coincidence, right?” Sakura asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kushida called you here, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yes. She said that she needed to talk to me about something. She said it was important,” Sakura replied meekly. She looked around, but of course, she could see no one but me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To tell you the truth, I asked Kushida for a favor. She called you out here for me,” I said. Strictly speaking, that wasn’t true, but I couldn’t help it if Sakura got confused.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You, Ayanokouji-kun? I-I see. That’s a relief. I don’t normally talk to Kushida-san, so I was worried I did something to make her angry.” Sakura put her hand to her chest and sighed in relief. She no longer seemed anxious. I decided to be direct.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even so, you’re pretty early. It’s still about half an hour before we were supposed to meet,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was feeling anxious, so I came early.” Sakura still looked flustered. “But it was you, after all, Ayanokouji-kun. I’m really relieved.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen she patted her chest, her expression became calmer.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But why get Kushida’s help, Ayanokouji-kun? If you want something, you could just ask me directly.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, um. About that. It’s a complicated situation.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A complicated situation?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHow would I explain? I knew quite enough about the biological differences between men and women through my studies, but I had no practical knowledge whatsoever of romance. Also, the issue wasn’t just our different genders. I had to factor in Sakura’s personality and feelings, too. Even in our modern, effective, intelligent society, this little dance remained a complicated mystery.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTime passed while I considered what to do. The longer I stayed silent, the more guarded Sakura would become.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The truth is, I had Kushida call you here because I wanted to give you this.” I offered her Yamauchi’s letter.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s this?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you read the contents, you’ll understand well enough,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“O-okay.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFeeling something akin to guilt, I averted my eyes. Sakura looked back and forth between me and the letter, as if trying to grasp the situation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A l-letter…behind the school… A boy…” she whispered. Whoa! She thought that \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e was confessing my love. This was bad.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Someone who wants to stay anonymous asked me to give you this. He said that, if you read it, you’d understand. He has bad handwriting, but he really poured his heart and soul into this letter,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, ahhh. Th-this is… Oh my. Oh my. Ahhh!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura’s composure was gone. She stared into space as if looking into the future. I was apprehensive about her reaction if she opened the envelope and read the letter, so I decided it was best that I skedaddled. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, well. I’ve handed the letter over. All that’s left is for you to decide how to respond. You can text or call me if answering directly is too hard,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis being Sakura, she might have trouble saying yes or no. I should help her if I could.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I, I, I, I, I, I, I, I—!” she stammered. “I-I just, well…I can’t! I mean, th-this is a l-love—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, a love letter.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Eek!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol4_5_INTERIORILLUSTRATIONS_6\" src=\"/hola-lector-agua/images/books/v4.5/OPS/ClassroomElite-Vol4.5_INTERIORILLUSTRATIONS_6.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"/\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoa!” I rushed to support Sakura as she came dangerously close to toppling over. “Are you all right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could tell she was too warm just by touching her back. This must’ve been really unexpected for her. She was probably trying to figure out who sent the letter.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um, um, um!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura’s eyes shot open. She stiffened and stood up straight. Once I was sure she was steady, I let go of her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What about…Horikita-san?! Do you think she’ll be angry?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Horikita?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhy should Horikita get angry? If she saw me deliver a letter in Yamauchi’s place, she’d probably just sigh in exasperation, and say something like, “Oh my, how difficult it must be for you not to get involved in something idiotic.” It certainly wouldn’t make her angry. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDid Sakura still think I was confessing? I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehad\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e made sure to say that I was only the messenger. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Umm.. Ahh…” Sakura’s face continued to redden. She looked as though she might pass out. I couldn’t imagine that the letter was the only thing making her react that way. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf she \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003estill think I wrote the letter, I understood why she’d brought up Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sakura. Just to repeat myself, this letter is from another guy. Do you understand?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura’s shoulders trembled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Eh? I-It’s not from you, Ayanokouji-kun?” she stammered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I already told you that I’m the messenger, didn’t I?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I see. Of course that’s what… B-b-b-but, what do I do with this letter?!” she cried.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just read it and answer.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI tried to walk away, but Sakura grabbed my sleeve. “But I can’t…I can’t do it! I can’t…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Has no one ever confessed their feelings to you before?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Never!” Sakura replied instantly. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHHuh. I would’ve thought she’d been confessed to countless times, given how cute she was. Then again, that was how she was \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003enow.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e It might not always have been that way.\u003c/span\u003e\u003c/p\u003e\r\n    \r\n    \r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This letter… Will you read it with me? Together?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTogether? Well, Yamauchi had actually written the thing with my help. However, if Sakura didn’t have the courage to read the letter alone, I couldn’t really help her. Yamauchi probably wouldn’t like that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can you try to read it by yourself? As the messenger, it’s my job to ask you that. I hope you understand.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura didn’t seem even slightly happy about that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe the letter’s from someone you like,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not possible now,” she said sadly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, no! That’s just, well, that’s because I don’t like anyone! I mean, I-I’ll try reading it!” she stammered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura hung her head, looking a little depressed as she turned and headed back to the dorms. She would probably read Yamauchi’s letter in her room.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi rushed over as soon as Sakura had safely left the area. “H-how’d it go?! How’d she react?! Did she look happy?!” he asked nervously. I understood his sense of urgency, but really, it indicated that he should have been the one to deliver the letter.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She hasn’t read it yet. We’ll just wait for judgment,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“D-don’t use a scary word like ‘judgment’! I believe it’ll absolutely be fine!” Yamauchi responded, frantic.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Out of curiosity, what’s your basis for that belief?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How she acts when she talks to me, I guess,” he answered sheepishly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How she acts?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know, how she looks away, all embarrassed. She can’t look me in the face because she’s really aware of me, don’t you think?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eActually, I thought that was probably because Sakura lacked people skills.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not all. Whenever she talks to me, she always kind of sighs heavily afterward. Isn’t that a sigh of love? You know, when you think about the person you like, and then you sigh, like ‘Ahh!’ It’s like a sign, dude,” said Yamauchi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura probably sighed from exhaustion after dealing with someone as high-energy as Yamauchi. People were naturally oblivious to reality and logic when it came to the girls they liked, though.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e5.2\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003et was the middle of the night, and I was settling in for bed when my phone vibrated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAre you awake?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e It was a rather short message from Sakura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI looked at my phone for some time without touching it, but saw no indication that there’d be more messages. Sakura probably thought I was sleeping. I opened the chat window, marking the message as read. Soon, I received another message.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eDid I wake you?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e it said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSorry, I was doing some laundry. It’s okay.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e A small lie.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe must have felt relieved, because the next message was slightly longer.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI have to meet with Yamauchi-kun at five tomorrow, but…can I meet you before that?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I could’ve refused. However, Sakura didn’t have anyone else.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWhere are you meeting him?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eThe same place as yesterday: behind the school building.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI already knew that, but I’d wanted to confirm. Not wanting to inconvenience her, I promised Sakura that I would meet her at the same location behind the school. Then it was time to sleep. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI turned my phone’s screen off and set it down. It vibrated again, though.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eUm. I’m sorry for bothering you over and over. Is it okay if I call you?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer anxiety radiated from her message. It would probably be better if I didn’t leave her hanging. When I called her, Sakura answered quietly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can’t sleep?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. When I think about tomorrow, I get so nervous. Ahh…” Sakura sighed over the phone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe sounded depressed. She was probably considering how she’d answer the confession.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I don’t know anything about Yamauchi-kun. That’s a bit scary,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just realized that liking someone, or hating someone, actually comes with a ton of responsibility.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed that to Sakura, who had distanced herself from those around her until now, that must have come as a shock. In this case, though, my ability to help was rather limited. Sakura would have to make this decision. Yamauchi would live with the consequences. Even someone like me, a complete novice when it came to romance, understood that. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t advise Sakura on whether to reject or accept Yamauchi. I could only listen quietly to what she had to say.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yamauchi-kun hasn’t done anything wrong, but this… I think I just don’t want this. Still, I do feel sorry for him, since he likes someone like me…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLove was a rather complicated matter.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve been thinking about it for a while now, but I just don’t know what to do.” That was understandable. Even over the phone, Sakura’s confusion was palpable. “Why me? That’s what I’m wondering. Why do I have to suffer like this?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I’d expected, she sounded troubled about the situation, rather than happy.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun, this… Well, this might be something you don’t need to hear, but…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ask me anything. If I can answer, I will.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well… I’m sorry to bother you, but are you perhaps dating anyone at the…present time?” For some reason, Sakura was being rather formal.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, definitely not. I’ve never dated anyone, and I’m not dating anyone currently.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“R-really?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You sound happy about that, which makes me feel like you’re being sarcastic.” It stung a little to hear her so delighted about a man never having dated anyone before.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“O-oh, no, that’s not… I didn’t mean to make fun of you! I was happy because you’re like me, that’s all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was just teasing,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, you!” It was only a little joke, but it seemed to lighten Sakura’s spirits. “Well, has anyone ever confessed their feelings to you? Or have you ever confessed your feelings to someone else?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was really grilling me. Well, I had nothing to hide.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have zero experience, same as you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, I see!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura sounded happy again. We chatted for a while about this and that. After some time passed, she seemed to get drowsy, and we ended the call. I hoped she could sleep soundly. Speaking of which, I thought it was about time for me to get to sleep as well.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e5.3\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eO\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eur meeting time was\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003efour in the afternoon. I showed up ten minutes early to find Sakura already waiting, with a pained, complicated look on her face. She was probably juggling several preoccupations, since her expression kept shifting. She looked crestfallen, then nervous, then worried. I wondered what she was thinking about.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did I keep you waiting?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura approached me hesitantly. I hoped I could ease her burdens a bit.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you for coming here, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah, it’s nothing. So, what’s the matter?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s about the letter you gave me yesterday.”.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did something happen?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMaybe Sakura was still hesitant to talk about it. She didn’t seem able to get the words out. I was about to tell her not to hold back when I saw several people walking our way down the path. They must’ve been doing club activities, since they wore jerseys. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry. How about we walk around a little?” I asked Sakura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Oh, okay,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t a good idea to let someone see us right then. We headed toward the tree-lined spot at the back of the school building. This was a hidden spot where most people didn’t come, but it looked well-kept.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt’d be a huge pain in the butt if Yamauchi happened to come early and spot us there, so I knew we should wrap things up quickly. Sakura tilted her head, extended her right arm, and looked toward the sky.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s the—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA single water droplet landed on my cheek. If it didn’t come from a sprinkler, then—\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s raining,” said Sakura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe skies had been clear just a moment ago, but now, it was pouring rain. It would probably pass soon, but the downpour was intense. Our clothes were soaking wet in minutes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s head back to the path!” I shouted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura nodded. I led her back the way we came, and we took shelter behind the school building. We were only in the rain for a bit, but it came down so hard that it completely soaked Sakura’s clothes. Even her hair was drenched.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Man, talk about unlucky. Are you okay, Sakura?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I’m fine. What about you, Ayanokouji-kun?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m all right.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI let out a little sigh while I watched the rain, which grew even more intense. What bad timing.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Here, you can use this.” Sakura meekly handed me a handkerchief. It was the same one I’d borrowed back on the island.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m fine. Use that yourself. You’ll catch a cold,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t dry myself off when a girl was absolutely soaked. Even so, Sakura stood on her tiptoes and wiped the excess water from my hair. Her scent, carried by the rain, tickled my nose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m surprisingly tough, you know,” she said. She mopped the water from my face, then my cheeks and neck.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…………”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI looked over at Sakura, who stood beside me in silence. I felt as though I could understand what Yamauchi was after now. Sudden rain. The two of us panicked, sheltering under the roof. It would have been even more magical if Sakura and I had been in our school uniforms, rather than casual clothes, since it was the middle of summer vacation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere’d be nothing to hide from each other. We’d talk until we ran out of things to say. Then, our eyes would meet. We’d each hear the other person breathing deeply. It was the kind of scenario boys dreamed about. For some reason, I could picture it very clearly. Maybe what Yamauchi desired was something like this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder if it’ll pass?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I looked up the weather on my phone just now. Sounds like this is just a passing shower. It should stop soon,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry. I let you get soaked, even though you had something important to do after this,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh no, it’s fine. It’s really not important,” Sakura replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, that meant…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I…I wonder what I should do…” she continued.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just answer based on how you feel. You can accept Yamauchi, or reject him, or you can start by being friends,” I said. What she wanted was up to her, not me. “Of course, you can always hold off on answering, too. And if it’s too embarrassing, I can tell Yamauchi for you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi wouldn’t want that, but if Sakura asked, I’d do it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I’ll do it myself. I think I probably have to,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. I suppose you should, for Yamauchi’s sake.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. I know. I’m going to turn him down.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see.” I’d already guessed as much. It was important that she tell him herself, though.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s just… Well, I don’t think I’m qualified to reject someone. I think it might be presumptuous of me, but…but…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura appeared overwhelmed by guilt, for some reason.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You have nothing to apologize for. When you get down to it, this crush is one-sided. There’s nothing strange about turning someone down if you don’t feel the same way. In this situation, there’s no such thing as being unqualified.” I spoke with some force, not wanting her to misunderstand.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe rain was still coming down hard. I thought it should stop soon, but there was no telling when Yamauchi would show up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s best if I head back now, I think,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“N-no! If you’re not here, Ayanokouji-kun, I won’t be able to say anything. So, please…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura grabbed my sleeve tight.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please don’t leave me alone,” she pleaded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If that’s your preference,” I replied. Sakura had helped me many times before, after all. I decided I should return the favor. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAbout fifteen minutes later, Yamauchi arrived, his expression much stiffer than I had ever seen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-why are \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e here, Ayanokouji?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry. Sakura said she didn’t have the courage to talk to you alone, so she asked me to stay. Don’t mind me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’m sure Yamauchi didn’t feel comfortable having me there. However, he had no choice except to deal with it. He looked suspicious, but then, focused his attention on Sakura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“S-sorry to have kept you waiting. So, did you read my letter?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. Um. Please, let me ask you one thing.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure, anything.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura grabbed her skirt and spoke as though she was squeezing her voice out of her throat. “Wh-why do you like…me? Plenty of people are cuter than me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I like \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, Sakura!” Yamauchi shouted. Sakura flinched in response. “S-sorry. I didn’t mean to shout. S-so, what’s your answer?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eListening in, I could see a number of potential ways to handle the situation. But Yamauchi was so incredibly nervous, his heart about to leap out of his chest, that he probably couldn’t think of any of them, let alone pick the best option.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I…I’m sorry!” sputtered Sakura, bowing deeply, her eyes slightly red. An awkward answer for an awkward confession. Yamauchi’s last spark of hope crumbled to dust and blew away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I, it’s just, w-well, I can’t, um, return your feelings,” Sakura added. It must have taken her a lot of courage to unleash those words. I was witnessing a form of romance for the very first time, albeit from uncomfortably close up. Yamauchi probably didn’t want to be rejected in front of a third-party, either. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see,” Yamauchi replied. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt sounded as though he was desperately trying to digest what had happened. His voice shook, just like Sakura’s. I couldn’t bring myself to laugh at him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you, Sakura. For coming all the way here, um, to tell me in person,” he added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“G-goodbye!” Sakura, no longer able to bear the situation, bowed and ran away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah,” sighed Yamauchi. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe extended his arm weakly, as if to try to catch Sakura as she left. I couldn’t do anything but stand there quietly, watching the first romance I ever saw in person break down. Yamauchi endured the frustration in silence for a few minutes, but eventually, he lifted his head and looked at me. Maybe he was about to shout at me, shower me with abuse, just because I was there and in his way? Take his anger out on me, instead?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“M-man, talk about embarrassing. Getting rejected by a girl in front of your buddy. I feel like my face is on fire.” Yamauchi sighed, not blaming me at all. I still saw the shock of rejection on his face, but that wasn’t all. “Whew. It’s like… How do I even put it? I almost feel relieved, you know?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi sounded nearly cheerful now. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Like, I was a real idiot. I was just causing Sakura trouble. She tried so carefully not to hurt me, a guy she didn’t like. I feel incredibly guilty. I mean, I’m free to like her and all, but I’ve learned that conveying your feelings to someone comes with responsibility.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI realized that Yamauchi’s clothes were wet. Clearly, he’d been standing outside well before he and Sakura had arranged to meet. Perhaps he’d been contemplating the confession nervously. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re not as upset as I thought you’d be,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s a shock, but it’s not all that bad. Sakura’s cute, and I wanted her to be my girlfriend. But I was just looking at her face and her body, you know? That’s a cheap thing to do. I think, like, I didn’t really love her. If I really liked her, I would’ve felt worse when she rejected me.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t dare say anything. I just listened quietly. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s why I’m moving on. I’ll find a girl that I really like.” Apparently, Yamauchi had matured a bit after Sakura rejected him. In record time, too. “I’m grateful to you, Ayanokouji. Sorry for involving you in something so weird.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s okay, because…we’re friends,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Here, I’ll lend you this. You said you wanted to borrow a phone, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Didn’t you say it depended on your confession being successful?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m making an exception. But you better return it right away,” he added. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, Yamauchi ran off after Sakura. That was when I noticed rays of sunlight shining down through the spaces between the rainclouds.\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 5: A Day of Girl Troubles and Disaster: A Devil Smiles Like an Angel\",\"volumeId\":\"v4.5\",\"chapterIndex\":11,\"prevChapter\":{\"volumeId\":\"v4.5\",\"chapter\":10,\"title\":\"Chapter 4: Dangers Lurk in Everyday Life\"},\"nextChapter\":{\"volumeId\":\"v4.5\",\"chapter\":12,\"title\":\"Chapter 6: A Gathering Between Classes\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Table of Contents Page\",\"href\":\"section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Title Page\",\"href\":\"section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Copyrights and Credits\",\"href\":\"section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Summer Vacation is Nearly Over\",\"href\":\"section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: Ibuki Mio has Surprisingly Good Sense\",\"href\":\"section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: Katsuragi Kouhei is Surprisingly Troubled\",\"href\":\"section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: Dangers Lurk in Everyday Life\",\"href\":\"section-0008.html#auto_bookmark_toc_top\",\"index\":10},{\"label\":\"Chapter 5: A Day of Girl Troubles and Disaster: A Devil Smiles Like an Angel\",\"href\":\"section-0009.html#auto_bookmark_toc_top\",\"index\":11},{\"label\":\"Chapter 6: A Gathering Between Classes\",\"href\":\"section-0010.html#auto_bookmark_toc_top\",\"index\":12},{\"label\":\"Chapter 7: Ike, Yamauchi, and Sudou’s Summer Vacation (Extra Stories)\",\"href\":\"section-0011.html#auto_bookmark_toc_top\",\"index\":13},{\"label\":\"Epilogue: Postscript\",\"href\":\"section-0012.html#auto_bookmark_toc_top\",\"index\":14},{\"label\":\"About the Author and Illustrator\",\"href\":\"section-0013.html#auto_bookmark_toc_top\",\"index\":15}],\"volumeTitle\":\"Light Novel Volume 4.5\",\"detailsLink\":\"/select/year-1/v4.5\",\"returnLink\":\"/select\",\"currentSpineIndex\":11,\"nextVolumeLink\":\"/select/year-1/v5\",\"nextVolumeTitle\":\"Light Novel Volume 5\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://classroom-of-the-elite-reader.vercel.app\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"COTE Reader\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"en_US\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:image:width\",\"content\":\"1200\"}],[\"$\",\"meta\",\"9\",{\"property\":\"og:image:height\",\"content\":\"630\"}],[\"$\",\"meta\",\"10\",{\"property\":\"og:image:alt\",\"content\":\"Classroom of the Elite Reader Preview\"}],[\"$\",\"meta\",\"11\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"12\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\"$\",\"meta\",\"13\",{\"name\":\"twitter:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"14\",{\"name\":\"twitter:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"15\",{\"name\":\"twitter:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"link\",\"16\",{\"rel\":\"icon\",\"href\":\"/hola-lector-agua/icon.svg?icon.ae5abf30.svg\",\"sizes\":\"any\",\"type\":\"image/svg+xml\"}],[\"$\",\"$L14\",\"17\",{}]]\n"])</script></body></html>
