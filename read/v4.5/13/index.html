e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:Tc5ca,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 7:\u003cbr/\u003eIke, Yamauchi, and Sudou’s\u003cbr/\u003eSummer Vacation\u003cbr/\u003e(Extra Stories)\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ehis might be a sexist question, but what should a man aim for in life? If you asked men from all over the world, you’d probably see a pattern emerge: find a partner and make love, produce offspring, raise those offspring. Amusement parks, movies, and video games are all very well. However, the plethora of entertainment options available to us these days is just a blip in the grand scheme of human history. Nearly all living beings have sought to pass the torch on to the next generation since ancient times.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, young high school boys have no understanding of what it means to bring forth the next generation. Instead, they simply seek any and all immediate available sexual gratification. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now then, I’d like to hold a strategy meeting regarding Operation Delta.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke, from Class D, knelt on the floor. He used his clenched fist to wipe the sweat that began to trickle down his forehead. “I’d lay my life on the line for Operation Delta. Haruki, how about you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I feel the same as you, Kanji. If this operation is a success, I won’t even mind dying!” Yamauchi shouted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou, who’d silently observed so far, chimed in. “Honestly, I’m against it. I’ll make a decision after I hear you out.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So then, Ayanokouji, you’re joining in too, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is it okay if I turn on the air conditioner?” I asked. No good would come of the room reeking of sweat.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure. It’s hot.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey’d denied my first request to switch it on—something about “setting the mood”—but since we were meeting in my room, I’d had enough.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why is it always, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ealways\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e my room?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Didn’t I tell you before? It’s because you have the neatest, cleanest place. Other people’s rooms have tissues and shed hair and junk everywhere, and they’re dirty. There ain’t even enough room to put a foot down in Yamauchi’s place.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sudou, your room’s the same, right? I mean, you got clothes and underwear and stuff all over.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wished they’d think about tidying up, rather than comparing their levels of filthiness.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know, no matter how much time passes, this room still doesn’t feel lived in. Nothing’s changed since enrollment, y’know? How about, when you get some points, you go out and buy something?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The next thing you buy should be carpet, dude. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eCarpet\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. My ass hurts,” said Sudou, sitting on the floor. He’d made similar statements in the past.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t just go out and spend precious points.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor some reason, Sudou kept hounding me. “We got points for the island test, thanks to Suzune. Someone as useless as you shouldn’t hoard points,” he shot back.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s definitely true. Actually, with Horikita on our side, it’s just a matter of time until we get up to Class C’s point total, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThings had changed since our hopeless situation back in May. Now, with a fresh new surge of points, we were closing the gap between us and the upper-level classes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, guys. Let’s think about the tough stuff when we’re in second semester. Right now, it’s Operation Delta.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was why the three idiots were gathered in my room—to discuss Operation Delta, a plan that originated over chat the night before.\u003c/span\u003e\u003c/p\u003e   \r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you guys seriously doing this?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Very seriously. I mean, this is the prime of our youth, right? Or are you saying you don’t like Operation Delta?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Call it whatever you want, but it’s basically just peeping. Right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe strategic operation with the serious name was indeed all about peeping. It was a stupid plan, born out of the guys’ desire to see women naked. However, only Ike had the details.\u003c/span\u003e\u003c/p\u003e    \r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To peep at girls’ naked bodies… What’s wrong with that?! That’s youth!” Ike shouted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eActually, it was a crime, and a horrible one at that. It was the kind of thing that would land Ike on the news if he were ever caught in the act.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’ll you do if the girls find out? They’ll be worse than angry, you know.” I tried to discourage the three. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou seemed to sense my doubts, because he voiced the same concerns. “It’s dangerous, like Ayanokouji says. This isn’t the same as changing into our gym clothes in the classroom, back in elementary school, or peeping at the bath in some old-fashioned inn during a junior high field trip.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry. The supercomputer known as Ike Kanji-sama devised this plan,” said Ike. He got up and confidently, arrogantly, began to explain it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When will we be peeping, and from where? Those are your questions, right? Don’t worry. I’ve thought everything out. Please calm down, and just listen to what I’m about to say. First, we will carefully select our target. It would be a complete waste of energy if we ended up half-assing the operation and peeping on some uggo. Also, we’ll choose from the girls in Class D. You can only achieve maximum arousal by seeing the naked body of a cute girl you know in everyday life,” said Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I agree, but none of us have really taken things to the next level with any of the girls, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s okay. We’ll just get ourselves to the next level. You must achieve these kinds of milestones yourself,” replied Ike. He tapped his phone and turned the screen toward us. “Did you forget? The pool’s been open since yesterday!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“R-really? Okay then, yeah. If that’s true, we can peep! Right? I’ve never been there before. The pool, I mean,” Haruki yammered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLooking at Ike’s phone, I saw a notification saying that the pool was open for public use for the last three days of summer vacation. Operating hours were from 9:00 A.M. to 5:00 P.M. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I get that inviting the girls to the pool means they’ll have to change into swimsuits. But I don’t see how that’s going to give you an opportunity to peep,” I said.\u003c/span\u003e\u003c/p\u003e  \r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d never gone to the special swimming facilities before, but there would likely be surveillance cameras. Not \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003einside\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the locker rooms, of course, but in the hallways. If a suspicious man approached the women’s locker rooms, staff would confront him. \u003c/span\u003e\u003c/p\u003e    \r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke remained calm, arms crossed. His expression didn’t change. “Damn, dude. That makes me sad. Do you really think I’m so stupid that I wouldn’t think of something like that? I’ve been making preparations for a long while now, dreaming of this day.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A long while? Okay, then, tell me this crucial peeping method,” snapped Yamauchi, unable to stomach more of Ike’s boasting.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, you want me to show my hand, eh? All right. Feast your eyes on \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethis\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e,” said Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe’d actually drawn up a map of the facility. Seeing the depths of his resolve, Sudou and Yamauchi gasped in apparent wonder. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoa. You even prepared something like this?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was surprised, too. The map was even pretty detailed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut something was odd. The handwriting on the map was different from Ike’s. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Check it out. The special pool is at least twice as big as the one we use for our classes. As you would guess, there are surveillance cameras.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe pool was a large-scale facility with locker rooms for men and women. Naturally, the locker rooms were on opposite ends of the hallway. The surveillance cameras’ locations were marked on the map.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e\"Hmm. Looking at this, there's definitely no way for us to peep.\" \u003c/span\u003e\u003c/p\u003e  \r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDiverging paths separated the locker rooms, similar to men’s and women’s baths. Even if we took a single step toward the girls’ locker room, we’d be noticed. On top of that, since it’d be the last day of summer vacation, there’d probably be a lot of people around. Our chances of success were slim to none.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, I don’t think we’re gonna be able to just stroll over and peep. Here’s the crucial point: the ventilation route that runs along the floor. That vent connects the men’s \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eand \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ewomen’s locker rooms. What’s more, they divide the lockers by year, from first-year to third-year students. The men’s and women’s lockers rooms are connected by their respective year, which means the first-year men’s room is connected to the first-year women’s. It’s a miracle!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI understood. If things went according to plan, we’d be able to see the girls change through the vent.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, could the vent fit a person?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The vent’s fifteen centimeters high and forty centimeters wide.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No one could pass through that.” In the worst-case scenario, you’d get stuck and be unable to get back out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh heh. I took everything into account. We also have this!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke pulled out a small toy car out of his bag. An antenna stuck out the top.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“RC!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA radio-controlled car that you could move freely via remote control. A camera was installed on the car’s roof. It was linked to a small display on the remote control. After Ike put in some batteries and started it up, the camera feed appeared on the remote. It wasn’t high-resolution, but it was enough.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke really had been preparing for a while.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This should fit into the vent. After that, all we need to do is move the car while watching what’s on the camera. We can even save the images on the memory card!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke had concocted this lust-filled plan in the depths of deepest darkness. I wondered just what terrifying things he imagined on a regular basis. This was a criminal act, thank you very much. Not even Yamauchi could be okay with this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh! Awesome! Dude, this is perfect! Right, Ken?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, Yamauchi agreed. He was happily, gleefully going along with it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Guess so. Kinda feels over the top, doesn’t it?” asked Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?! This is perfect!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was certainly true that we could probably get away with this without being noticed. Really, Ike had taken meticulous care in his preparations. I hazarded a guess.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did the Professor have a hand in this peeping operation, by any chance?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could hardly imagine that Ike came up with this all by himself. An RC car wasn’t cheap.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-how did you—?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNone of this was Ike’s forte. Besides, only someone who knew the locations of the surveillance cameras and ventilation routes could dream this up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Damn it. Guess there’s no hiding it. You’ve found me out. You’re right, I asked the Professor. Shit, dude, and after all the trouble I took to make you think I planned the whole thing.” Ike groaned.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what’s the plan?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBooted back to square one, Ike started explaining again.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“First, we’ll invite the girls we want to peep on to the pool tomorrow. Then, we’ll enter the locker rooms at almost the exact same time they do. Got it? Inside, we immediately go to the vent in the back. If someone is using that spot, Sudou will threaten them, and make them move. After that, we pull out towels, act like we’re going to change, and form a human wall around the vent so that no one else can see. Then I’ll remove the hatch and insert the RC car. I’ll operate it, so I need you guys to hide me. I’ll stop the car right in front of the girls’ locker room, and start recording. Once we’ve determined that they’re done changing, we’ll get the car back out,” explained Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe steps were relatively simple and easy to understand. However, some parts felt a little iffy. I couldn’t just ignore them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, I threaten people who get in our way, and make them move. I also need to make sure people don’t get close to us, right?” That role was appropriate for Sudou. Given his reputation, other students probably wouldn’t approach us casually.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You guys see just how incredible Operation Delta is?” asked Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-but, Kanji. This is a crime, dude. Like, the sin is gonna weigh heavier on me than the actual peeping.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re certainly right. It’s a crime. Strictly speaking, that is. However, think about your past. You’ve committed crimes before, right?” Ike gloated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? The hell does that mean? What crime did I ever commit?” Sudou snapped.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let me ask you this, Ken. If you’re aggressive, and hurt someone, that’s a crime. Right? If an adult punched someone, the news would report it, wouldn’t they? And you’ve used violence before, haven’t you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s… Fightin’ and violence are two different things,” answered Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’ve never been violent in my life,” said Yamauchi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But, Haruki, back in elementary school, didn’t you once lick that girl’s recorder? The girl you had a crush on? And you sniffed her gym clothes, too. Or did you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003enot\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e do those things?” pressed Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh…” Yamauchi seemed to be recalling an unpleasant memory.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If an adult did those same things? Crime!” shouted Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Th-that’s true.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In other words, it’s different when it’s another minor peeping on, and secretly photographing, girls without their knowledge. If we don’t do this now, when can we?!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHis convincing rhetoric pierced Yamauchi and Sudou’s hearts. It was enough to cleanse them of guilt over committing a criminal act. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You in, Haruki? Let the chips fall where they may,” asked Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yeah. Okay, I’m on board,” said Yamauchi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You guys sure about this? Seriously, it \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eis\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e illegal,” I repeated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo matter how much Ike tried to sugarcoat it, a crime was still a crime.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Look, I’ve been saying this for a while now, Ayanokouji. Licking a flute is a crime, and directly peeping on someone changing clothes is also a crime. Secretly photographing someone without their knowledge is a crime. But this is what youth is for! Boys peeping on girls getting changed don’t go to jail; we only get a warning. That’s what I mean! You get it?” Ike repeated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’m not convinced. Technology aside, experiences like these turn boys into men, all across the world. Shoplifting when you’re in elementary school and shoplifting when you’re in high school both carry the same weight. They’re the same crime.”\u003c/span\u003e\u003c/p\u003e  \r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis wasn’t even about wanting to see the girls changing anymore. Ike was aggressively trying to justify his actions.\u003c/span\u003e\u003c/p\u003e     \r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we keep this to our current modern, high-tech era for argument’s sake, peeping like this is still secretly photographing without consent. If you get found out, you might not be arrested, but you could get expelled. Right?”\u003c/span\u003e\u003c/p\u003e   \r\n \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m terrified of getting expelled. Like hell am I gonna peep!”\u003c/span\u003e\u003c/p\u003e  \r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou and Yamauchi threw their arms up in the air as if in terror.\u003c/span\u003e\u003c/p\u003e     \r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All that’s left is you, Ayanokouji. You’ll be cooperating, of course. Right?”\u003c/span\u003e\u003c/p\u003e       \r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not interested,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Still, you’re cooperating. If you three form a wall, we definitely won’t be spotted,” said Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was really going to do this, even if I backed out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right. I’ll cooperate. But promise me one thing, Ike. This plan is risky. If we’re caught, we’re going to get more than just a slap on the wrist. So, success or failure, promise me that Operation Delta is the only time you’ll try this. If you don’t, I won’t cooperate, and I might report it to the school, too.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I just flat-out objected, Ike and the others would carry out the crime regardless. By placing a condition on my offer to cooperate, I could ensure that this was a one-time event. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf we were discovered, Class D might actually come apart at the seams. We needed to understand that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right already. I get it. I don’t think it’s good to try doing something like this multiple times, anyway,” Ike whined.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s fortunate, because you’ll be staking your future high school career on this,” I replied. Then I added, “Let me suggest one thing. If the pool opens up at 9:00 A.M., then it’d be best to arrive right on time. If we get there first, nabbing the spot in the back of the locker room will be simple.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see! Let’s go with that!” Ike agreed. “A red-blooded young man’s just gotta peep! Let’s do this, fellas!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd that was the story behind Operation Delta.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e7.1\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eO\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003en the day we went to the pool, we were the first people to enter the locker room. We went all the way to the back and spread out our towels. The boys who entered afterward were lost in their own conversations and paid us no attention.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hurry up, Ike,” urged Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou spread his towel and pretended to change while Ike crouched in front of the vent. Ike took out the RC car and screwdriver set that he’d wrapped in the towel and removed floor vent’s metal fittings. He immediately put the RC car inside the vent and started operating it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe RC car came equipped with a pen light. It rolled forward, transmitting footage of the path ahead, which the monitor displayed faintly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“D-damn it! Just like I thought, it’s dark!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith only the pen light for illumination, the visibility on the monitor was getting worse. Even so, the RC car moved forward, little by little, toward the light that lay ahead. Even if we went too far, there were metal bars in place that would stop the car, so we weren’t worried about it falling. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, just a little farther!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe monitor now displayed the locker room. Although the image quality was terrible, we could see Horikita and the others clearly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-whoa!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke’s (or rather, the Professor’s) plan had succeeded brilliantly. Class D students, as well as Ichinose, were visible. If we watched, we’d be able to see them changing in real time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, show me too, Kanji. I can’t see it at all, dude!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You idiot! Show me, too!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou and Yamauchi kept up their demands. At this rate, there was no way we’d avoid drawing suspicion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can record this, right? Isn’t it better not to push your luck? People are gonna get suspicious,” I warned.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“D-damn, you’re right. I guess, right now, it’s better for us to just get changed,” muttered Yamauchi. He clicked his tongue and grimaced in frustration. Even if we didn’t peep through the monitor, the memory card was recording and storing everything. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke manfully endured the temptation. He put the remote control in his locker and focused on changing.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-how many minutes should I wait, I wonder?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d like to keep it there for twenty minutes, at the very least.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf we pulled the car too quickly, we wouldn’t see the girls changing. On the other hand, if we took too long changing, that might arouse suspicion. This would undoubtedly be the longest twenty minutes of these guys’ entire lives.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll go on ahead,” I told them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-wait a minute, Ayanokouji! Are you betraying us?! If you ask us to show you afterward, we’re not going to!” snapped Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not it at all. If twenty minutes pass without a single guy coming out of the locker room, the girls will get suspicious.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh. Yeah, I guess you’re probably right. Okay, do a good job out there.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Got it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLeaving the other three guys to recover the RC car, I went ahead toward the pool.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e7.2\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003et the exact same time that I left the men’s locker room, something happened in the girls’ area. It was the kind of spectacle those three idiots longed to see. The camera recorded all the sounds and images.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is kind of neat, isn’t it? Using the school pool outside of class, I mean,” said Kushida, putting her bag in her locker.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose, who was changing right next to Kushida, quickly grabbed her clothes. “Yeah. It feels kind of like when you go to the public pool just to goof off,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ichinose-san, you have such an amazing figure. You’re so well-proportioned,” said Kushida, sighing as if lovestruck. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose, seeming a little embarrassed, looked over at Kushida. “You have a great figure too, Kushida-san. I wouldn’t compare us.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003echinose was the clear winner in terms of breast size, but Kushida could hold her own. Meanwhile, Sakura, whose breasts were just as big as Ichinose's, if not bigger, kept her distance from the other two as she started changing. Even being around other girls made her deeply self-conscious. It was inevitable she'd be nervous at the pool. Unlike in swim class, though, her salvation was the rash guard that would completely hide her upper body. For someone shy like Sakura, the item was a lifesaver. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ichinose-san, could you please not stare at me?” said Horikita, noticing Ichinose’s passionate gaze. She stopped changing, as if revulsed. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, sorry, sorry! It’s just… How do I put it? Your skin is so flawless and clear, Horikita-san. I was entranced. I thought I’d admire a cute girl, as a fellow girl, you know? Kikyou-chan, you agree with me, right?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, Horikita-san is really cute,” replied Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“………”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita resumed changing with a beleaguered sigh.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know, you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e come out with us today. I didn’t think you’d be interested in something like this,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not here because I like this kind of thing. Sometimes you just have to grin and bear it, regardless of your wishes,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" id=\"ClassroomElite-Vol4_5_INTERIORILLUSTRATIONS_9\" src=\"/hola-lector-agua/images/books/v4.5/OPS/ClassroomElite-Vol4.5_INTERIORILLUSTRATIONS_9.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\" width=\"100%\"/\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"/\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm? That’s kind of confusing, Horikita-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNaturally, Horikita couldn’t tell anyone how Ayanokouji had called in a favor to make her come along. She would take the humiliation of trapping her arm in a water bottle to her grave. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWhy did I panic? And why did I call him?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e she kept asking herself, lamenting the fact that Ayanokouji had learned of it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why don’t you try changing without talking to me?” she retorted, instead of explaining her comment. \u003c/span\u003e\u003c/p\u003e    \r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRejected by Horikita, Ichinose looked around for her next target. She sighted Sakura, sneakily hiding in the back of the locker room. Ichinose, who subscribed to a philosophy of \"Nobody gets left behind!\", wanted to be friends with everyone. This included Sakura, who was clearly trying to hang back. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though Ichinose wasn’t familiar with Class D’s internal politics, she could easily tell that Sakura needed gentle handling. Ichinose wouldn’t push enough to make her uncomfortable, but didn’t want to completely ignore her, either. At first glance, Sakura looked to be the withdrawn, mature type, and Kushida and Horikita clearly weren't trying to talk to her more than they had to. But even if Sakura was shy, Ichinose was sure she could open up to people she came to trust over time. If that were true, Ichinose could eventually become friends with Sakura as well.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s been a while since we last met, hasn’t it, Sakura-san? I suppose, since we’re from different classes, we don’t run into each other all that often,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yeah, I suppose so,” replied Sakura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Honami-chan, you already know Sakura-san? That’s surprising,” said Kushida, feeling doubtful of the relationship between Sakura and Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We know each other from a while back. Right?” said Ichinose.\u003c/span\u003e\u003c/p\u003e \r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yes,” said Sakura, looking more rigid than expected. She avoided eye contact while she spoke.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer shy mannerisms threw Ichinose for a loop, but she persisted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But even so…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose gave Sakura’s body a quick glance, without staring too openly. Sakura’s facial features really were cute. She was slender, but still had some meat on her bones, and her breasts looked like something you’d see on a magazine model. Ichinose looked her up and down with a man’s attentive gaze. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith looks like these, Sakura—who was the type of girl most people found themselves wanting to protect—could probably have become the most popular girl in the school if she’d just been more outgoing.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That reminds me, Honami-chan. You were with Kanzaki-kun today, too. Could I ask you a little about that?” said Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? What about Kanzaki-kun?” replied Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura, recognizing that this was her chance to escape, shifted away from Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, a girl in our class is interested in Kanzaki-kun. I wanted to ask you a few things,” said Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow. Kanzaki-kun is surprisingly popular. Girls in our class seem to like him, too. But I don’t think he’s dating anyone right now,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. In that case, I think I’ll tell her to call him.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, yeah. Kanzaki-kun will like that, I think. Probably.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why ‘probably’?” Kushida laughed at getting such a vague answer.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He’s a man of few words, you know? Which is fine, I suppose, but he completely lacks assertiveness. I don’t understand him well,” added Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. I guess he is hard to interpret, isn’t he?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt that point, Ichinose seemed to notice that everyone else was almost done changing. “Whoa, we need to catch up!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe started pulling her clothes off quickly, without grace, as if she were a boy. Her breasts jiggled. Even Horikita, who was trying not to show any interest, shifted her attention for a moment. Ichinose's proportions were devastating enough to one-hit KO most men. It was hard to believe she was a first-year high school student. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When did you get those breasts?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? You mean, when did they get big? I guess in my third year of junior high. They just kept growing bigger and bigger. Why?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, I understand. That must be why you don’t know what to do with them.” If Ichinose had developed rapidly, in under a year, it was no wonder that she still hadn’t adjusted to her body’s changes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose finished putting on her swimsuit and grabbed her locker key. “All right! All done changing!” she shouted at the other girls lagging behind. “I’m going on ahead!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose left at a run, her excitement to get to the pool clearly bubbling over.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She’s like a human typhoon, isn’t she?” said Horikita. She was neither praising nor criticizing Ichinose, just making an observation. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita wasn’t speaking to anyone in particular, but Kushida responded. “When Ichinose-san is around, everyone seems to smile.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita glanced briefly at Kushida, but didn’t answer. Meanwhile, Kushida, always sensitive to her surroundings, shifted her attention to the other girls who’d just entered the locker room.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, Karuizawa-san? Good morning! You came here to hang out?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What a coincidence! We’re here to swim, too.” Kushida couldn’t hide her surprise. Karuizawa almost never swam during class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that brief response, Karuizawa and the two girls who entered with her headed toward the lockers all the way in the back of the room. She touched the grating across the vent, and it came off without much effort. That wasn’t due to her superhuman strength. Someone had entered the locker room yesterday and carefully unfastened all the screws with a Philips screwdriver.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh. They’re seriously doing it. These guys are the lowest of the low—complete perverts,” Karuizawa muttered. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe found the RC car up against the vent opening. Its camera’s gleaming lens captured the girls’ locker room at an excellent angle. The light next to the monitor glowed a faint red, which meant the camera was in the middle of recording. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDoing as Ayanokouji had instructed her ahead of time, Karuizawa removed the memory card. She replaced it with a new memory card with no data, and put the car back in the vent.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That takes care of that.” Soon, the RC car would return to its owner. “He’s the only one who really…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs exasperated as Karuizawa was by the guys’ grossness, her thoughts turned to the only person who acted to stop them from carrying the plan out: Ayanokouji. If Ayanokouji hadn’t done something, her classmates, and even girls from other classes, would’ve had their naked bodies seen without their knowledge. Even worse, those images would’ve been saved forever.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kei-chan, is everything okay?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSonada, Karuizawa’s classmate, spoke behind her. Ishikura, the third girl, also looked at Karuizawa with an uneasy expression.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, yeah. Thanks. I’m good now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa had used her friends to shield herself from view as she bent down to the vent, just like the guys had done in the other locker room. She’d even procured the keys to all the nearby lockers beforehand, so people would see them marked as full, and not use them. Now, Karuizawa calmly and carefully returned those keys one by one, taking care not to look too nervous. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe didn’t explain what she was doing to her friends. They were people who obediently followed instructions without requiring explanations. They were not strong-willed, and they feared being ostracized. Karuizawa kept such people around on purpose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter she finished changing, and confirmed that no other Class D students were around, Karuizawa thanked the girls she was with.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have a little business to take care of later. Will you two be here?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, yeah. We were thinking of swimming. Right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe two girls nodded to each other. Karuizawa said nothing in response.\u003c/span\u003e\u003c/p\u003e  \r\n\u003cdiv style=\"page-break-before: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e7.3\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003efter swimming to the point of exhaustion, I left the pool and went back to my room. When I arrived, three excited guys were waiting in front of my door.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re late, Ayanokouji! Hurry up and let us in!” Sudou, his patience gone, kicked my door. That would only annoy my neighbors and draw the dorm manager’s attention.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hurry up, Ayanokouji!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI opened the door. A bunch of guys unable to contain their arousal pushed it from behind. Ike held the memory card he’d recovered from the RC car. On that memory card were images of the girls changing—or so the guys thought, anyway. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePushing ahead of me, they turned on my computer without permission.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-If there are some incredible pictures, let me copy them.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, guys. First, I need to confirm somethin’. You guys don’t got any right to see Suzune’s naked body.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Calm down, you two. We’re all in this together. Heh heh heh!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey no longer paid any mind to me, impatiently waiting for the computer to turn on. Since it’d been an exhausting day, I sat down on my bed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you could give that back to me after checking the contents, it would be a big help,” I told them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The hell, Ayanokouji? What are you trying to be all mature for? You want to see, too, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you want to turn back, now’s the time,” I warned them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, I get it. Well, if you’re going to act like a good little boy, you definitely shouldn’t look. Heh. Or maybe I’m just not going to show you,” said Ike. He stood in front of the computer screen, arms outstretched as if to block it from view.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ain’t no guy alive who’s not excited about seeing a naked woman. Be honest,” said Sudou, already relaxing, as if this were his room. I didn’t really feel any need to go to such lengths to look at a naked woman, however. It wasn’t worth risking expulsion, at the very least.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?! Wh-why-why is nothing there?!” screamed Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe computer loaded the data from the Professor’s memory card—only there wasn’t any data saved on it. The RC car had never recorded properly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“N-nothing. The data…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, that can’t be true. I-I mean, it was recording, right? Right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe three clicked on the folder, opening it over and over in a panic. There was no data, though. Karuizawa had taken out the real memory card, and replaced it with an empty one. No matter how hard the guys looked, they couldn’t find a file that didn’t exist. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why isn’t it \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethere\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e?!” shouted Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd with that, an act of sabotage annihilated the ambitions of those three idiots.\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 7: Ike, Yamauchi, and Sudou’s Summer Vacation (Extra Stories)\",\"volumeId\":\"v4.5\",\"chapterIndex\":13,\"prevChapter\":{\"volumeId\":\"v4.5\",\"chapter\":12,\"title\":\"Chapter 6: A Gathering Between Classes\"},\"nextChapter\":{\"volumeId\":\"v4.5\",\"chapter\":14,\"title\":\"Epilogue: Postscript\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":
