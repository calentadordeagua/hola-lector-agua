[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:Tf60c,"])</script><script>self.__next_f.push([1,"\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 8:\u003cbr/\u003eWhat You and I Lack\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE BELL RANG\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e and the second half of the sports festival began. It was time for the recommended participants’ events. Only elite students from each class would take part in the remaining four competitions. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re participating in the scavenger hunt, right, Ayanokouji-kun?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d rather not, if possible.” There was nothing I could do about it, though. I’d lost at rock-paper-scissors. Six people from each class were going to participate in the scavenger hunt. Due to the low number of participants, there was one group of four people running in the race. Thus, the number of points you could obtain was greater than what you could get during the individual competitions.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The problem is that Sudou-kun’s not here.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe’d decided Sudou would participate in all the recommended-participant events, but he was gone, so he’d simply be marked absent. Had we prepared a substitute competitor? Horikita also had yet to return to our camp. Hopefully, that meant that things were proceeding well.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If it’s all right with you, I’d like your opinion on something, Ayanokouji-kun. I would’ve asked Horikita-san as well, but she’s not here.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hirata, you don’t need my opinion to make a sound decision, right?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRight, Horikita had yet to return to our camp. I’d thought that in the worst-case scenario, she would have returned to the camp alone before the afternoon events started, but this was unexpected. Maybe things were going well after all.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think we need a substitute. In the individual competitions, our class ranks right at the bottom. To win in overall points, we need to win the next events,” he replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, who do we choose as the substitute?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We need 100,000 points to put in a substitute. I’ll figure something out with the points. I think we’d do well substituting Ike-kun or Yamauchi-kun,” said Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s because, if they do happen to take first place, they’ll be able to put points toward their tests. Right?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. We can use that to our advantage.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was a good plan for the scavenger hunt, in which luck had a significant part in the outcome. Ike and Yamauchi played a round of rock-paper-scissors. In the end, Ike won, and triumphantly joined the scavenger hunt team. “All right. I’ll do my best, for Sudou’s sake!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe seemed to have fighting spirit to spare, at least. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe referees explained the competition before it started. “Some items in the scavenger hunt are quite difficult to procure. To pick a new item, you can request a redraw, but there will be a thirty-second waiting period. You must make your redraw request to the referee when you draw your lot during the competition. The game ends when three players reach the goal. That’s all.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter that explanation, we started getting ready for the second-round scavenger hunt, which I was participating in.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey.” Someone called to me. I didn’t even need to look to know that it was Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, that muscle-headed moron won’t be participating in the scavenger hunt, huh? I thought he’d take part for sure. Suzune’s not here, either. They couldn’t be doing each other backstage, right?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No idea. That has nothing to do with me,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What a shitty answer.” Losing interest in me, Ryuuen left. It looked as though he would be running in the second race, too. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePretty soon, the first race started. The other classes had put forward their more athletic students, so Ike was overtaken right at the start. But speed wasn’t all that counted in the scavenger hunt—the real deciding factor was which item you drew. Ike chose his lot and checked the contents.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe students in the lead searched this way and that way, leaving the field to find their items.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoooooooa!” Ike struck a victory pose and took off running back toward the starting point. “Ayanokouji! Lend me your left foot! Your left foot!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My left foot?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your shoe, dude! Your shoe! That’s my item!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke showed me a slip of paper with the words \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Your classmate’s left foot (shoe)” \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ewritten on it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I give it to you, I can’t run anymore, though.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Geh?!” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe’d run over to me since I was close by, but he couldn’t use a competitor’s shoe. Ike panicked and rushed toward the camp. However, it looked as though the other students were also having a hard time with the scavenger hunt, since no one was heading toward the goal. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThanks to his luck during the draw, Ike—somehow—ultimately found his way into first place. “Not bad, not bad at all,” he said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMoments later, Class A came in second, followed by Class B, and then Class C in last place. Soon afterward came the signal for the start of the second race. I went to draw a lot, lagging slightly behind the other students.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI reached inside the box, touching several slips of paper in turn. Carefully, I took one out and undid the four folds it. “Now then, what will mine say?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Ten friends.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re kidding, right?” I felt myself blacking out. Just one friend would have been bad enough, but ten? They had to be screwing with me, right? I couldn’t even think of ten people I was on speaking terms with.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dude, why are you spacing out? Hurry up, Ayanokouji!” Ike sounded a little full of himself, still on a high from taking first place. But there was nothing I could do. Two of the only classmates I could count as friends, Horikita and Sudou, were absent. Since Ichinose and Kanzaki were currently my enemies, I couldn’t count them, either.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d like to request a change.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe other students were already running off to find their items. In accordance with the rules, I waited thirty seconds, then redrew my lot.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“A person you love.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, no, no. No, no, no, no.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat in the world was up with the slips I had drawn? They were screwing with me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ch-change, please.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could sense Class D’s confusion, but there really was nothing I could do. What on earth would someone else have done in my position? If I showed that slip of paper to a member of the opposite sex, it would have been the same as confessing romantic feelings for them. Even if I lied and asked them to play along, it would have been incredibly embarrassing. So, before I could even start looking for my item, I had to take on a one-minute handicap.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“A table clock.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy third draw finally produced something I could actually obtain, but I’d have to go inside the school to find a table clock. I checked the teachers’ tent, just in case, but came up empty-handed. While I did that, the other three contestants reached the goal.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This isn’t good.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLady Luck had snubbed me, and I came in last. It wasn’t a question of holding back; I just couldn’t do a thing about it.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e8.1\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE AFTERNOON COMPETITIONS\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e would be starting right about now. At least I’d found the red-haired student I was looking for sitting on a sofa in the dormitory lobby.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sudou-kun.” I called out gently, so as not to startle him. He turned to look at me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita.” He appeared surprised. He probably simply hadn’t expected me to show up. “Why are you here? Don’t tell me you came to persuade me to go back?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do I look like the type to come all the way here to persuade you?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That… No, you don’t. So, did you come here just to scold me or somethin’?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know about that. I must admit that I’m not sure what to say at all.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?” Sudou-kun tilted his head like he didn’t quite understand. I wondered why that was. I’d finally found Sudou-kun, and I felt as though I couldn’t really say anything. I tried to remember why I’d tried so hard to find him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you stay out of the competitions, Class D has no hope of winning.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Probably not. Guess we’re in a lot of trouble right now, huh?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. We’re at the very bottom of the rankings. To turn things around, we need to take first place in all the recommended-participant events. Even then, we won’t make the top spot.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite having excellent athletes like Sudou-kun, Class D as a whole was clearly inferior in this sports festival.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And after I carried everyone on my back. That Hirata,” Sudou-kun huffed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He did nothing wrong by stopping you from going on a rampage. On the contrary, you should be grateful to him. If you’d hit Ryuuen-kun, you might have been disqualified,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just couldn’t stand being on the receiving end of that. What Ryuuen did was foul play.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You may be a bit of a problem child, but you certainly gave it your all today,” I said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou hadn’t acted like himself. That alone was a miracle. For his classmates’ sake, he’d been as good a leader as he knew how to be. He was hot-headed, as usual, but at the root of that was a desire to win. He’d performed excellently in the group events, and I needed to acknowledge his worth.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That said, there’s still a lot you need to work on,” I continued. “The fact that you’re here alone right now is proof.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The heck does that mean?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If people could truly rely on and trust you, you’d have a lot of classmates coming after you, not just me. People who wanted to convince you to come back, I mean.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou-kun kicked the table in irritation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s the problem right there,” I continued. “You try to bully your way through Class D. It happened during the midterm exams, and during the dispute with Class C. Now you’ve snapped and flipped out. If you keep doing these kinds of things, no one will follow you.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re seriously tryin’ to preach to me? Give me a break, Horikita. I’m really pissed,” Sudou grumbled. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAgitated by my lecture, Sudou-kun fidgeted, his legs shaking as he desperately tried to let out his frustration.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Look, I messed up, but I just can’t stop myself from doin’ it. Nothing to do in that case, right?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought you said you were going to carry everyone in the class?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I never said that. The other guys were asking me to, remember?” he replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even so, you have a certain degree of responsibility.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“God. Shut up, already. I don’t care about that,” he huffed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re as childish as always. That’s not going to work in the real world, is it?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shut up!” He shot me a fierce glare, as if trying to intimidate me into being quiet. But I wasn’t going to give up. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tch… What’s with you?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf anyone else had been here, they probably would have caved. Seeing that I didn’t waver, Sudou-kun lost his patience and looked away. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your weakness is completely obvious,” I said. “What will happen if you don’t study? What will happen if you lash out? You lack the foresight to think ahead.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, enough already. Come on! Just leave me alone and knock it off! Your preaching is gonna make me puke!” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI believed that Sudou-kun wanted to stay at this school and do well. There had to be a reason he was so quick to get violent. Unless I found the source of that problem, he would be trapped in an endless cycle.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if he wanted to be alone, even if he might hate me, I couldn’t leave him. Right here and now, I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewould\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e make myself understand him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you don’t like it, feel free to hit me,” I said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? What? You… There ain’t no way I could do somethin’ like that!” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because I’m a woman? I’ve said this before, but I am quite strong. I’ll knock you to the ground before your fist reaches me.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ll fight me? Man, you really are a weird lady. Well, like you said, no one else came after me. But you did. Just\u0026#160;you.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAyanokouji-kun had pushed me into it, but I didn’t feel the need to tell Sudou-kun that. Perhaps Sudou-kun was tiring. He mumbled in a low voice now, as though his anger was leaking away. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I took the leader job because I thought the sports festival would be easy as pie. I haven’t lost to anyone from the other classes. If we did the individual competitions again, I wouldn’t lose to anybody. But when people are draggin’ ya down in the team contests, there’s nothin’ you can do. We lost capture the flag and the cavalry battle ’cause of those useless guys. I couldn’t stand that.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI stood his complaints. Sudou-kun’s athletic ability was frankly incredible, even if you took all the grade levels into account. But almost no one was capable of keeping up with him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can tell just by looking at you that you hate losing when you’re good at something. But is that all there is to it?” It wasn’t just that he hated losing. He had taken on the position of leader despite struggling in team competitions. Something else was going on here. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou-kun appeared lost in thought for a moment as he tilted his head, then replied, “Maybe I just wanted to see how it felt for people to pay attention to me and give me some respect. I guess I wanted to show all the people who made fun of me. Pretty lame, right?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs he admitted his desires, and that he’d abandoned his goals, he scratched his red-dyed hair.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, now I’m completely alone, huh? Well, that’s fine. Things’ll go back to exactly how they were in junior high,” he added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…………”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wondered if my words would reach his heart. Ayanokouji-kun had verbally destroyed me in an argument, Ryuuen-kun had defeated me, and my brother had abandoned me. I couldn’t believe for an instant that I had any right to reprimand Sudou. I’d always considered him beneath me, but now I felt as though that wasn’t true. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou-kun was clumsy, the type of person to act impulsively. He had a volatile personality. But, if I changed my perspective, I could see that he had also been fighting all alone. The fact that he’d had the courage to confront his loneliness meant he was far superior to me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI awkwardly continued our conversation, worried that my words weren’t going to reach him. “You know, it’s strange. My feelings are basically the same as yours.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Whaddya mean?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The feeling of wanting to be respected. The desire to fight alone. I understand those,” I told him. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe and I were similar in the sense that we both carried a certain contradiction, yet we continued to fight against solitude.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When I think back, there were signs. During the midterm exams, I felt irritated at the students who couldn’t study, you included. I got angry when they couldn’t do something so obvious. I didn’t want to work with them at all. But in the sports festival, you performed impeccably. You did a lot to carry our unathletic classmates.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAcademics and sports. Different as they were, the principles at the heart of both were the same. What I’d felt toward Sudou-kun and the others during the midterms was probably what Sudou-kun was feeling quite strongly right now.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then you understand how I feel. Right now, I wanna be alone,” he replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And I truly, truly want to leave you be. But if we lose you now, Class D’s defeat will be set in stone.” This wasn’t just Sudou-kun’s problem. It would impact our whole class.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You abandoned the class, though, just like me. Right? So, you don’t got any right to lecture me,” he replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I suppose not.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was why my words held no weight. Until this very moment, I’d thought the same thing as Sudou-kun. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re disappointed in me, right? I’m used to it,” he said, dejected. “I was born to worthless people. That’s why I’m worthless, too. I came here because I definitely didn’t wanna end up like my parents, but I’m turning out just like them.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou-kun looked over at me, and I saw in his eyes that he’d given up all hope. Perhaps he was planning on returning to his room. I wondered what to say. I really wasn’t sure.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s incorrect to conclude that someone with worthless parents will inevitably turn out worthless themselves. You can’t blame other people for how you are or will be. I reject your hypothesis.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If the little sister of a genius is a genius herself, will her path in life be assured…?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re still a nobody. Who you will become, though, depends on you and only you. At the very least, you possess incredible athletic ability. You have a rough manner of speaking, but you helped advise a lot of students during practice. That shows me you’re not a worthless person. Right now, though, you’re trying to run away. If\u0026#160;you keep doing that, then you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewill\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e be worthless.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fine. Then just brand me worthless, already. Go ahead. I don’t even care anymore,” he replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re going to throw in the towel because things aren’t going your way?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo matter what I said to him, he wouldn’t respond. Perhaps I was incapable of getting him to open up. The bell rang, signaling the end of lunch. The afternoon competitions were about to begin. Sudou-kun definitely wouldn’t make it back in time for the scavenger hunt.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Go back, Horikita.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. Not unless I bring you with me.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fine, do what you want.” Sudou-kun headed toward the elevator.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll wait here. Forever.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do what you want.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t take my eyes off him until the elevator doors closed.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e8.2\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003e“U\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eGH.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Well, that was unfortunate. Just a bit more, and we might’ve beaten Class B.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven with a substitute for Sudou, riding on a slim hope of victory, our opponents crushed us in the four-way tug-of-war. As a result, we’d been knocked down to the bottom ranking.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe tried to coordinate better as a class, but Hirata got hit the hardest. He’d shouldered the burden of paying for the substitutes, which cost him a lot of points. We were in a desperate situation, and Sudou—our ace—was still absent. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think Sudou-kun’s coming back.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hirata, are you going to pay for the next competition, too?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I am. We need it,” he replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata had paid three times so far, twice for Sudou and once for Horikita, who’d also planned to participate in the four-way tug-of-war. That was no small expense. If\u0026#160;he had to pay for the next competition, the total would be 500,000 points. No matter how many private points he said he had, that was still far too much.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, Sudou aside, Horikita should be able to repay you,” I said. I couldn’t say that Hirata was capable of paying all of that. Fortunately, Horikita had obtained a ton of points from the last exam, much like Hirata. “Shouldn’t you just let them bear the point burden this time? The participants, I mean.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You might be right, but 100,000 points is a lot, and it’s hard to save that many. Also, I’m the one who gave the go-ahead to use substitutes, so I can’t exactly go asking for points,” he replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t you think the people who withdrew are the ones to blame?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBesides, Sudou had punched Hirata. But Hirata didn’t really dwell on that.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose there’s the class’s victory to think about, but if we place well here, our winnings will give us an advantage on future tests. It’s better if people participate. But if they have to pay their own way, a lot of students will probably pass on subbing for Sudou.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe students who most needed points for tests also suffered frequent financial troubles. If they ranked poorly in the sporting events, they’d be at a disadvantage for the exams, so of course they’d be hesitant. They couldn’t risk losing both money \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eand\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e test scores.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe only competitions that remained were the mixed-gender three-legged race and the last event, the 1200-meter relay. Hirata was going to see if anyone wanted to participate, but at that moment, Kushida came running over to him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um, Hirata-kun, would you mind if I helped too? I’d like to participate in the three-legged race. Of course, I’ll pay the points for it. Is that okay?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSurprisingly, it was Kushida who put her own name in.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t let you bear this burden alone. Besides, I want to try my best for the class, and for Horikita-san and Sudou-kun’s sake.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Since you’re pretty good at sports, Kushida-san, your offer is welcome.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you. I’ll go tell Chabashira-sensei that I’ll participate in Horikita-san’s place, then,” said Kushida. With that, she ran off.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now for a guy. I’ll ask around,” said Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Hirata. Could I go in as Sudou’s substitute? I’ll pay the points. I can’t guarantee I’ll be much help, but I’ll try,” I said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well… Yeah, sure. I don’t mind, of course, but…are you okay with that?” asked Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t feel right making you shoulder this alone. Besides, I’m a little anxious about the next test. I’d like to get at least one extra point.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith Hirata’s permission granted, I chased after Kushida, interrupting the conversation she was already having with Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re going to be Sudou’s substitute, Ayanokouji?” Chabashira-sensei asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Rather unusual, since you tend to prefer watching on the sidelines.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re taking Sudou-kun’s place, then, Ayanokouji-kun? I’m looking forward to racing with you!” said Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, same. I’m not all that fast, though, so you’ll have to forgive me,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In the three-legged race, coordination’s more important than simple speed,” said Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile we were having our conversation, we were preparing for the next competition.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yoo-hoo! Ayanokouji-kun! Oh, Kikyou-chan, too. Looks like we’re competing in the same group, huh?” said Ichinose, walking up to us. Beside her was her partner, Shibata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, wow, real tough opponents!” Kushida said. “To think the two of you are teaming up…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, Shibata-kun might be tough, but I’m really not all that special, you know? I haven’t gotten first place in anything yet,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really? Wow, that’s unexpected,” replied Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I placed second one time, but I got fourth or fifth for all the rest of my events. To tell you the truth, someone else was supposed to participate in this three-legged race, but I guess she sprained her ankle in the 200-meter dash before lunch. Quite a few people got injured this year,” said Ichinose. Apparently, Class B had some absentees of their own. That meant these two were actually an impromptu team.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Shibata-kun,” Ichinose said to her partner. “Is it okay if I tie the cord now?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe Class B pair cheerily tied their legs together.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_14\" src=\"/hola-lector-agua/images/books/v5/OEBPS/Images/INTERIORIMAGES_14.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, I suppose we should… Um, would it be okay if you tied us up? It’d be weird for a guy to do that,” I told Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure. But isn’t that strange? I mean, you tied the cord when you practiced with Horikita-san, didn’t you, Ayanokouji-kun?” Wow, she really had been observing the class like a hawk.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She’s…well, an exception. I can’t act the same way around other girls.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you saying Horikita’s special, then?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt’d be more accurate to say she was someone with special status, but that would be difficult to explain.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, I can’t believe Horikita-san went off looking for Sudou-kun like that,” Kushida commented. “It’s just that, well, she absolutely never cuts class. She’s very conscientious. Don’t you think it’s odd?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I was surprised.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You didn’t really look all that surprised, though.” As Kushida said that, she crouched down and pulled the cord around my leg.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose it’s hard for people to read my face. Always has been.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You mean, you have a good poker face?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kushida.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hold on just a little longer, okay? I’ll be finished soon,” Kushida said sweetly while she expertly tied the cord around our legs.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI decided to cut to the chase. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s you. You’re the traitor who leaked Class D’s participation table to Class C.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, Ayanokouji-kun. What’s the matter with you? Even as a joke, that’s a cruel thing to say,” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I saw you. You took a picture with your phone of the participation table we drew on the blackboard.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I did that to record the information, so I would remember. It would’ve been a big problem if I forgot my own events, after all.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Didn’t we all decide to write down our turns by hand, though?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, really? Sorry, I forgot.” As Kushida finished tying us together, she slowly stood, beaming her usual smile. “Is that all that made you suspect me?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, but I’m sure I’m right. If it weren’t true, Class C couldn’t have massacred us like this,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was rare for me to be standing this close to Kushida, just the two of us. This was the perfect opportunity for a chat. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um, but even if someone leaked Class D’s participation table, that doesn’t necessarily mean Class C could crush us, right?” Kushida asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right.” Class C hadn’t been completely unmatched in every competition, which made it difficult to level any accusations. Even if they’d figured out Class\u0026#160;D’s entire order, they still wouldn’t have known everything about Classes A and B. However, the leak would’ve significantly raised Class C’s chances of winning.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Ayanokouji-kun. Assuming that I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eam\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e responsible for leaking Class D’s information… If my taking a picture led you to determine that, it must mean you knew the participation table was leaked, right? In that case, why didn’t you change the table after I took the picture? Couldn’t you have submitted a new participation table later as a countermeasure? If you did that, the picture I took would’ve been useless, don’t you think?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Pointless. That wouldn’t matter if the traitor was a Class D student.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Say we altered the participation table just like you said, Kushida. Even if we submitted the new table secretly, as long as the traitor was from Class D, they could inspect the new list at any time. Anyone in our class had the right to see it,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf you were just looking at the participation table, you could’ve done it whenever. In other words, even if we had done some scheming behind the scenes, you would still find out the order as long as you kept checking it. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida… No, Ryuuen definitely would have done that.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But if you hid the table until the last possible minute before submitting it, even if someone \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e happen to see it, they wouldn’t have had time to meddle. You still should’ve been able to prevent leaks.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s true enough, I suppose.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, but doing something like that might end up throwing the rest of the class into chaos later. That wouldn’t be good, either.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida was right. In order to prevent spying, we would’ve had to exercise caution from the beginning. If we’d waited to submit the table just before the deadline, like she said, we’d have reduced the likelihood of traitors—but also severely confused our classmates. Likewise, the other students would’ve resented us if we secretly changed the roster without consulting them. The ideal countermeasure would have been to consider the possibility of a leak from the very beginning, come up with multiple versions of the participation table as a class, and submit one at random. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf we had done that, then no matter which one we submitted, we would’ve been able to compete. Additionally, it would be a countermeasure against leaks, and there wouldn’t have been any pushback from within the class.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand what you’re getting at, but I’m not the culprit, okay? I don’t want to suspect any of my classmates, either,” said Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, how about we check with Chabashira-sensei? I’m sure she can tell us whether any students specifically asked to see the participation table after we submitted it,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was especially true for Kushida. If Kushida had gone to ask about the list after she admitted that she had taken pictures with her phone, then she would have seemed even more suspicious.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…………”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida shut her mouth. For the first time that day, her smile disappeared. She’d just implicitly confirmed my suspicions. However, a thin smile crept back onto her lips right away.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hee hee. You really aren’t an ordinary person, are you, Ayanokouji-kun?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe laughed. This was a face I’d seen before. The face of the secret Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose there’s nothing I can do, now that I’ve been found out. Yes. I leaked the participation table,” she told\u0026#160;me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You admit it?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. If you asked Chabashira-sensei, you would’ve found me out anyway. It was just a matter of time. Besides, even if I tell you the truth, Ayanokouji-kun, I’m confident I won’t be exposed. You haven’t forgotten, have you? About my uniform, which you touched? If I revealed that to everyone, wouldn’t that be a big problem for you?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was threatening me. If I were to tell anyone that she was the traitor, she would submit her uniform, which had my fingerprints on it, to the school officials. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. I can’t expose you as the culprit. That’s certainly true. Incidentally, this reminds me—during the exam on the cruise ship, we ended up with the results we did because you had Ryuuen tell all the students that you were the VIP, right? Then you asked Ryuuen for a favor in exchange for that information.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And what would such a favor be? What could I want enough to betray the whole class?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve been acting so brashly throughout the festival that I would’ve seen through you even if I didn’t want to. It’s what you asked me about before, isn’t it?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah ha ha! Yes, that’s it. You really figured it out, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, why \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewould\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e you betray your class? I’d like to hear it from your own lips,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wanted to expel her. Expel Horikita Suzune. That’s what,” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just don’t understand why you’re going after Horikita so relentlessly.” I’d hoped for the two of them to resolve their issues before the sports festival, but it hadn’t worked out that way.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, but I’m going to get Horikita-san expelled, no matter what you say. I won’t change my mind,” said Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And you’re okay with sabotaging Class D to do that?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. I don’t care if I never make it to Class A, if it means Horikita-san gets expelled. Oh, but don’t misunderstand me—once she’s gone, I’ll unite everyone, and we’ll work toward reaching Class A together. I promise,” said Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, there was no changing her mind. She was entirely focused on her goal. If she had to, she’d probably rope in people like Katsuragi, Ichinose, or Sakayanagi to aid her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, but I reconsidered one thing. I added you to the list of people I want expelled, Ayanokouji-kun. After you and Horikita have been eliminated, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethen\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I’ll aim for Class A,” said Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe still wore that gorgeous smile. Her expression was almost dazzling.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Have you considered that Ryuuen might expose you?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not an idiot. I obviously wouldn’t do anything that left any evidence behind. Ryuuen-kun is a liar who entraps people without batting an eyelash. Well, I gambled on whether or not he would betray me,” said Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wanted to tell her that there were plenty of ways to deceive someone. It appeared as though Kushida was serious about wanting to crush Horikita. With the way this school was designed, if there was a traitor amidst your allies, then you would repeatedly end floundering in desperation. The order of our participation table, our strategy—all of that information had been leaked. Trying to win with that in mind would be unreasonable.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA real mastermind would have found a way to make someone else the traitor in their stead. A pawn to help them achieve victory.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita-san’s taken a real beating in this sports festival,” Kushida added. “It’s too bad you couldn’t save her, isn’t it?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wasn’t so sure about that. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that conversation done, we ran the three-legged race, silent hostility in the air between us.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e8.3\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eLMOST AN HOUR\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e had passed since Sudou-kun left. That meant the final competition would begin any minute now. I imagined that Hirata-kun and the others would put up a fight, but they couldn’t really expect much. We were all feeling Sudou-kun’s absence.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was helpless. I could do absolutely nothing except stand around in a pointless daze. I’d spent an hour right in front of the elevator.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if I returned to camp and withdrew, I didn’t have the funds to get a substitute. Ryuuen-kun was getting all my points using blackmail. But that wasn’t why I couldn’t leave. If Sudou-kun returned to find me gone, he’d be heartbroken. Besides, despite the fact that Class D’s defeat was practically set in stone, I wanted to do whatever I could. I believed Sudou-kun would come back. That was all there was to it. And then…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did…did you seriously wait around here?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You came back, Sudou-kun.” I kept my cool, but inside, I was glad—so much so that I’d called out to him as soon as I saw him board the elevator. I was happy they had installed cameras inside the elevator; I was able to take some time to calm down.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s already over, isn’t it? The sports festival, I mean.”\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_15\" src=\"/hola-lector-agua/images/books/v5/OEBPS/Images/INTERIORIMAGES_15.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It might be. But if we go back right now, we may still make it in time for the last competition,” I said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So? What’s the point? We’ve already lost,” said Sudou-kun.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re right that the outcome is bleak. I had to withdraw due to my injury, and Kouenji-kun was absent from the start. And you left partway through, Sudou-kun. Compared to the other classes, our classmates don’t stand a chance at winning.” The recommended-participant events I’d wanted to compete in would’ve ended disastrously, anyway. “Since you’ve come back, can I assume you want to return to the competition?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nope. I just came down here to see if you were still hanging around, is all.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Well, while I waited for the past hour, I’ve gone over some things. What kind of person I am, what kind of person \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e are… Things like that. I concluded that you and I really are similar after all.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I was alone and had calmed down, I felt like the answer had finally become clear to me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We ain’t got anythin’ in common. You and I are way too different.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. We’re very similar. The more I think about it, the more I see that it’s true.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI spoke from the bottom of my heart.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Always alone. Always solitary. But you believed you could do it, and you tried,” I continued. “If there were a difference between us, it would be that one of us wants acknowledgement from a single person, and the other wants it from a large group. You already know a bit about the student council president, right?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, that prim-and-proper guy?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He’s my older brother.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh? So… Wait. You said something about fighting with him, right?” asked Sudou-kun. He fumbled a little with his words.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI started talking to him about my brother, like I was giving a monologue. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My relationship with him is far from good. Because I lack talent, we aren’t close. My older brother is incredible, and dislikes being associated with someone incompetent like me. That’s why I’ve tried my absolute hardest to become an incredible person, too. I put everything I had into trying to achieve that goal, from academics to athletics. Even right now, I’m trying.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-wait a minute. Aren’t you already really smart and good at sports?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“From the average person’s perspective, I suppose. But compared to my brother, I’m nothing special. I just do what’s expected of me.” He had likely reached my current aptitude while he was in junior high, or perhaps even earlier. “That’s why I’ve been running straight ahead, chasing after my brother without caring what anyone else thinks of me. When I turned to look back, no one was following me; I’ve always been alone. I thought that was fine, though. I believed that, as long as I was an astounding student, my brother would care about me. I thought that, if I participated in a ton of competitions during the festival, he would stop and look at me. That was why I told you that I wanted the anchor position in the relay. I\u0026#160;had this idea that, if I was the anchor, he might cheer for me. Worrying about the class or even my own feelings came second.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBy confronting Sudou-kun’s weakness, I’d also confronted my own.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He really doesn’t acknowledge you? Even though you’re tryin’ so hard?” asked Sudou-kun.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He doesn’t. But I finally realized something: I’m not incredible. Ryuuen-kun’s thoroughly beaten me just like he planned, and I haven’t gotten one single result I’m satisfied with, either. I want to make it to Class A to earn my brother’s respect. That hasn’t changed. But the methods I’ve used to achieve that goal have been wrong. I’m \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003enot\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e alone. If I have allies, I’m closer to my goal.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re not givin’ up?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If there’s a difference between you and I, that might be it. I will never, ever give up. I’ll strive to become someone who isn’t a disgrace, someone worthy of my brother’s admiration,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That sounds like a painful path to take.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose. If you were the only person in the world, you’d be able to live peacefully. But we aren’t alone in this world. There are billions of people on this planet, and innumerable people in our lives. We can’t ignore them.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA person couldn’t survive alone. They absolutely had to move forward with someone, together. The sports festival had certainly been an ordeal for our class, but at the same time, it had been revelatory. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I said that you’d turn to violence again, then coldly pushed you away. But that wasn’t the right answer. If you ever stray from your path in future, I’ll bring you back to it. So, until we graduate, please lend me your strength. I promise that I’ll lend you all mine, too.” I looked him right in the eye and didn’t avert my gaze. I wanted him to accept my determination.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just a little while ago, it didn’t seem like that was the case at all. Why do your words seem so serious now?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It might be because I’ve finally admitted the truth, which is that I’m a worthless person. I’ve avoided that fact.” I wouldn’t have said that to just anyone; he was just like me, so he was an exception. “I’ll ask you again, Sudou-kun. Lend me your strength.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou-kun balled his hands tightly into fists, then hit himself on the forehead.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah. What the hell am I feelin’ right now?! I don’t get it, but it’s like…I feel like I’ve finally had my eyes opened.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe stepped toward me. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll work with you, Horikita. I…I feel like someone’s finally noticed me outside basketball.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs he said that, I felt myself smile. I’d never experienced this before. I wondered what the intense throbbing in my chest was. I knew that it wasn’t friendship, or love. It was something else. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEmbarrassing as it still felt to admit to myself, I now had an ally. That was different from Ayanokouji-kun, or my brother. It was something I’d lacked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI still had a ways to go, to be sure. But perhaps I had just taken my first small step forward.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_16\" src=\"/hola-lector-agua/images/books/v5/OEBPS/Images/INTERIORIMAGES_16.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 8: What You and I Lack\",\"volumeId\":\"v5\",\"chapterIndex\":14,\"prevChapter\":{\"volumeId\":\"v5\",\"chapter\":13,\"title\":\"Chapter 7: For Whose Sake?\"},\"nextChapter\":{\"volumeId\":\"v5\",\"chapt
