c.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not talking about random chance, though,” Horikita said. “I’m talking about something definite. I\u0026#160;mean, a method that doesn’t \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ejust\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e rely on luck—one that still relies on athletic skill. On the island and cruise ship, there were secret clues and pathways we could have detected. This feels the same. This time, surely…” Maybe because of her shame over her mistakes on the island, Horikita was now even more obsessed with victory.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you think makes this different from the previous special tests?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Different? I think it’s the same kind of special exam.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I won’t deny that they’re \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003esimilar\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, but I doubt that the school considers them the same.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t understand. You think it’s different because we’re cooperating with Class A this time? But we had to work with students from other classes on the ship, too, and a battle broke out.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, that’s not it. The basic premise is different.” I\u0026#160;could tell that Horikita was growing frustrated with my coyness, so I explained. “The school has never once called the festival a ‘special exam.’ Only the first-year students have been calling it that. The teachers, including Chabashira-sensei, all referred to it as a sports festival. That third-year student, Fujimaki, called it that, too. The words ‘special exam’ weren’t anywhere in the handout,” I\u0026#160;told Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe didn’t seem to have realized that, but even if she had, she still wasn’t convinced. “Well, why does that even matter? The structure that dictates how the sports festival plays out, and the large potential increase or decrease in points, make it function pretty much exactly the same as a special exam.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s true, there’s no real difference in the content. But there \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eis\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e something different at its core. Putting aside the fact that you can buy and sell test points, the regular written exams are meant to test our abilities. I think the sports festival is supposed to do the same with our \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ephysical \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eabilities and our senses. It’s not about employing cheap tricks, or coming up with a strategy or tactics—no, I think that the class that genuinely challenges themselves in this festival will demonstrate their true worth,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, that didn’t necessarily mean there’d be \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eno\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e cheap tricks. Once the sports festival began, however, things would be locked in place. It would be much like how, even though you could do things before or after a written exam to help your results, you were rather limited during the exam itself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The crux of the sports festival is that we should properly prepare for the event. Then, once it starts, we need to get results. That’s all there is to it; simple is best,” I said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I already said that I want us to prepare. I definitely want Class D to win,” Horikita retorted.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wrong. You’re not talking about preparation. You’re trying to find a crafty strategy and look for loopholes.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t understand the difference in our strategies,” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When I say ‘preparation,’ I mean figuring out who’ll participate and in what order, knowing which students in other classes are athletic or unathletic, and so on. Finding out what order \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethey’ll\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e participate in. And also, making sure that they don’t discover those things about \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eus.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e On the other hand, ‘looking for loopholes’ means trying to force someone to bow out of a competition or withdraw. Look, you want to have a strong hand here, right?” I\u0026#160;asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed that was a natural thing for Horikita to think, considering that she had always tried charging in head-on until this point and had kept losing. It was normal to want to do something to ensure that you wouldn’t be overtaken by your opponents in the sports festival. If it were a simple matter, though, then no one would be agonizing over it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re saying that we need to fight clean and fight hard to win?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had no intention of confirming or denying whichever answer Horikita chose. As for the reason why, well, that’s because the strategy to win didn’t just consist of one part, there was always another side to it. Whether it was the uninhabited island or the cruise ship, or even this sports festival. It was possible to win by “attacking head-on” or to win “via a loophole.” The point is, it’s important to choose a fighting style that suits the person.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRight now, she doesn’t really favor one side or the other, she isn’t either heads or tails. At this stage, she could become one or the other. If I had said that Katsuragi and Ichinose were heads, and Ryuuen and I were tails, which side of the coin would Horikita choose? I understood why she currently wanted to resort to “tails,” considering that the people who’d won thus far were sneaks.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, I was warning her precisely \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ebecause\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e going with “tails” in the sports festival would be extremely difficult. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What you do is entirely up to you. What advantage do you think Class D has right now, Horikita?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, a dispute between Classes B and C will probably help us.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI thought about ignoring it, but I had to address the real problem. Horikita Suzune lived her life in such solitude that she had tunnel vision. “You’re not thinking big enough,” I said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you think we should dismiss the fact that Ryuuen-kun refused to cooperate with Class B? I think that’s a positive thing for us.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ereally\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e think that?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, they might still reconcile and work together. It’s not as though Ichinose-san particularly \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003elikes\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Ryuuen-kun, but for the sake of victory, she might put aside her own feelings. Can’t we acknowledge that it’s a good thing for now, though?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s exactly what I mean by ‘not thinking big\u0026#160;enough.’”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s rude. Fine, do enlighten me.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you know about Ryuuen? He’s always looking to win. No matter how he behaves, or how polite he is, he’s always coming up with strategies. So, why did he suddenly refuse to cooperate with Class B? Do you think he never considered it?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait. Are you saying that Classes B and C are working together behind the scenes?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was on the right track, but I had to stress the main point here. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Our relationship with Class B is different than Ryuuen’s. There’s a good chance that he has a plan in place. If he didn’t, he’d have no reason to leave. Even if that was a bluff, on the surface, he would gain more by talking with Class B, right?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think that’s right. It seems unlikely,” replied Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, because earthquakes and fires are unlikely, there’s no need to have emergency measures in place, just in case? I don’t think you get how important it is to be prepared for catastrophe.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf nothing happened, then nothing would come of it. But in the event that something did happen, you’d be ill-prepared for assuming everything would be fine.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think that Ryuuen has, at the very least, one or more tactics in mind.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But if that’s true, it’s crazy. We only just learned about the festival. To have a whole plan in place so soon…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s why we need to understand his kind of crazy. What would a frontal attack from Ryuuen look like? What loopholes could he find? Can \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewe \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ecome up with something similar? Are there precautions we can take? We have to think like that to rise to Class A’s level,” I\u0026#160;said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf we thought about what winning strategies that he had come up with at this point, then we would naturally narrow things down. Of course, that was something I’ve started to see after getting a clear read of Ryuuen’s strategies and thought processes ever since the fight that nearly got Sudou expelled. Could Horikita still not see that? \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I suppose it’s fine as long as we do what we can. Let’s craft a plan in case someone makes a mess and we have to clean it up,” said Horikita. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003enot\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e jump to the conclusion that someone’s going to make a mess?” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was looking forward to finding out just how far ahead she could think.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e2.3\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eFTER CLASS FINISHED\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e for the day, I remained in the classroom alone. Outside the window, I could hear students engaged in their club activities. With the sports festival drawing near, each and every one of them was in high spirits. No one slacked at all in their daily training regimen. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI plugged in my earphones and opened the file I’d received earlier on my phone. “I see…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI basically had a good understanding of the situation now. I’d thought that I might have to lay a few traps, but it seemed that wouldn’t be necessary. Pleased with this turn of events, I decided to return to my dorm. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I passed through the main gate, I ran into Chabashira-sensei. She was spraying water around with a hose.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_3\" src=\"/hola-lector-agua/images/books/v5/OEBPS/Images/INTERIORIMAGES_3.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You stayed behind longer than usual, Ayanokouji.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose you’re right. Are you on duty today?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Something like that. You could say this is sort of my post,” she replied. She kept spraying water in a manner that suggested she was used to the task. “Working adults tend to multitask, unlike children. That’s especially true now that the sports festival is imminent. Anyway, what were you doing today? This is the first I’ve seen you roaming around after class alone.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t you think that’s an exaggeration?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you prepared for the sports festival?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think the last homeroom explained everything, more or less. Didn’t it?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei should have heard about all of our strategies, including Hirata’s, Horikita’s, and Sudou’s. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In your case, I would have thought that you’d already have some eccentric idea or strategy in place,” she said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, nothing like that,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nothing? But—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen her eyes met mine, she stopped talking. Discussing these things publicly wouldn’t help anyone.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I haven’t forgotten what you told me, sensei. However, I’m free to decide my own path.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, you’re certainly right. I shouldn’t interfere with you unnecessarily. All this ends the moment you try to kick back and take it easy, though. If you don’t show me some results soon, I’ll stop covering for you. It goes beyond the scope of an ordinary teacher’s duties, after all,” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t know what she expected from me. Feeling irritated about her invading my day-to-day, I decided to leave. I shouldn’t have gotten myself tangled in such an aggravating situation. No…really, this confrontation had just been a matter of time. It would come to a head sooner or later.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Excuse me.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure. Take care.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eNice of her to urge me to “take care” on my arduous return trip of a couple hundred meters.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI went back to the dorm.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_4\" src=\"/hola-lector-agua/images/books/v5/OEBPS/Images/INTERIORIMAGES_4.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 2: The School Sports Festival Begins\",\"volumeId\":\"v5\",\"chapterIndex\":8,\"prevChapter\":{\"volumeId\":\"v5\",\"chapter\":7,\"title\":\"Chapter 1 - Prologue : Sudou Ken's Soliloquy\"},\"nextChapter\":{\"volumeId\":\"v5\",\"chapter\":9,\"title\":\"Chapter 3: Class D's Objective\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Title Page\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0004.html#auto_bookmar
