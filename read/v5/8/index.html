"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T14e5e,"])</script><script>self.__next_f.push([1,"\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 2:\u003cbr/\u003eThe School Sports Festival Begins\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003e“T\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE STUDENTS’ SURNAMES\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e were the key to figuring out the VIPs’ identities. They were assigned in the order of the animals of the zodiac.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe sat at a table all the way in the back of the crowded café, Pallet. Summer vacation had just ended, and I was seated with a bizarre crew that included Hirata, Karuizawa, and Horikita. We were trying to review the special exam that’d been held on the cruise ship during our vacation. We were checking our answers in the search for the VIPs, comparing notes on the test that divided us up into groups based on the twelve zodiac signs.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The rabbit is fourth in the zodiac. If you put the names of the students in the rabbit group in alphabetical order, it would be Ayanokouji-kun, Ichinose-san, Ibuki-san, and then Karuizawa-san,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. In that case, yeah, I’d be fourth. That’s why I was chosen as VIP,” said Karuizawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa nodded, seemingly impressed. At first glance, you’d have thought that the two girls sitting with me were completely incompatible, but Hirata’s presence made the discomfort between them mysteriously disappear.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But isn’t that really, really simple? I mean, practically anyone could figure it out. Like, the fifth person in the dragon group, the one Horikita-san was in, that was Kushida-san. So, she was the VIP, right?” asked Karuizawa. She poked a straw into her milk carton and took a sip.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. It \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewas\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e that simple. However, figuring that out in the middle of an exam wasn’t so easy. With only three VIPs in your own class, you wouldn’t have had enough solid proof of any rules behind the selection,” explained Horikita. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf we’d known the names of the three VIPs in another class in addition to our own, perhaps we’d have been in a position to see the possibilities? However, even if we’d had a theory about the names corresponding with the order of the zodiac, there was no changing the fact that we could only answer once, and it was risky. If our answer was off, we could have taken a considerable amount of damage. On the other hand, if we’d bet on it and won, then we might’ve turned everything around in one fell swoop.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m worried about Class C, though. I think Ryuuen-kun figured it all out in the middle of the test,” said Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata was probably correct. If that wasn’t the case, then Ryuuen wouldn’t have been able to do much at all.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s weird, though. If that’s true, why did he mess up?” asked Karuizawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wondered about that, too. Even though there was a huge risk involved, if he understood the rules, he should have managed to discover all the VIPs in the end. In other words, he shouldn’t have made any mistakes,” said Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDepending on how you looked at the situation, Class C had given the wrong answer, yeah. Horikita offered a different perspective on the matter.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Though it appears Ryuuen-kun rules Class C alone, perhaps they’re not a monolith after all? There must be more than a handful of people who’re deeply dissatisfied with his dictatorship.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s definitely true. All students had the right to put forward an answer, so one of the students who didn’t cooperate with Ryuuen-kun’s plans, or whom Ryuuen-kun couldn’t control, must have been the one who put forward something incorrect. If they had given the correct answer, they would have stood to gain a lot of points, right?” Hirata said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita and Hirata were onto something, but we still couldn’t be sure. If there was a traitor, Ryuuen would’ve searched for them relentlessly. Even if that person had deleted the email and managed to make it through the situation, Ryuuen would probably have gone so far as to check people’s private points.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you think, Ayanokouji-kun?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata and Karuizawa looked to me at the same time. I broke out coughing, discomfited by the force of their combined attention.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dunno. I honestly don’t have a clue,” I lied. Horikita and Hirata looked away, losing interest all at once. Only Karuizawa still stared at me. I met her gaze, and she diverted her eyes.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In any case, our first priority is to cement this relationship. I’m glad we’re discussing this, Horikita-san and Ayanokouji-kun,” said Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita had never cooperated with Hirata before. However, her attitude had finally begun to change after the two special exams. Being driven into a corner made her start to realize the truth: that she couldn’t do this alone. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, we don’t really have a choice. The zodiac exam was a special case; it couldn’t be done alone. If we assume that future exams may have similar elements, though, then a certain degree of cooperation will be necessary,” replied Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat seemed to be the biggest factor in why Horikita had changed her mind. She was absolutely correct; there were limits to how much of a fight you could put up alone. These many tests were like a microcosm of what the real world would bring, and we certainly couldn’t take it on by ourselves.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even so, you evaded Ryuuen-kun’s clutches quite well.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe last part was aimed at Karuizawa, who had been my group’s VIP and managed to get through the exam without being discovered. Class D had been well rewarded for that victory.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I guess. I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edo \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ehave a surprisingly good poker face. Right, Yousuke-kun?” asked Karuizawa. She hugged Hirata’s arm and looked at him with upturned eyes. You’d never have thought that their relationship had been strained, though whether that was genuine or an act didn’t interest me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Someone else gave the wrong answer before Ryuuen could answer himself. It was all thanks to that,” I said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWait a minute—\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eYousuke\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e? When had Karuizawa suddenly started calling Hirata by his first name? I kind of wanted to call him by his first name, too, but it was impossible. Hirata and Karuizawa had forged a new relationship out of their complicated situation, which most likely made them closer friends. Hirata returned Karuizawa’s smile, then turned to Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I actually have a proposal. Want to hear it?” Hirata asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita gave no response—her way of telling him to speak.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“First, to bring our class together, I’d like to rope in Kushida-san as an ally. I think she’ll complement our group well and add qualities that the four of us lack. She’s one of the few who could potentially unite a lot of the boys, starting with Ike-kun and Yamauchi-kun.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTrue, Kushida was probably a well-qualified candidate to keep our classmates in check. However, I didn’t know whether Horikita would agree to that so easily. Ever since we enrolled in school, the relationship between the two of them had been pretty poor.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unnecessary,” replied Horikita. “I won’t deny the fact that she is capable of control, but we can do anything she can on our own. That’s why I selected you and Karuizawa-san. With your combined talents, we can solve any problem that faces us…unless you plan to be uncooperative, like a certain someone.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe side-eyed me. How rude.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s certainly true that Ayanokouji might not follow our lead,” added Karuizawa. She and Horikita nodded, though Hirata did not.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Look, you’re mistaken if you think \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI’m\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the uncooperative one. I’m the guy most likely to quietly go along with a group. I’m exactly the sort of person you can control. I have no presence,” I said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Those who claim that they have no presence usually cast long shadows,” replied Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay. So, are \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e someone with no presence?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Me? There’s no way \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ecould have no presence. How dare you? Do you take me for a fool?” she demanded.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yeah, okay.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe whole conversation was devolving into some half-baked comedy sketch, although Horikita didn’t appear to be joking around. You could never quite tell when she was playing, but I thought she was definitely serious.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e2.1\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eO\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eUR AFTERNOON CLASS\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e became a two-hour homeroom period. When Class D’s teacher, Chabashira-sensei, arrived, she began to instruct us in a detached, matter-of-fact manner. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Starting today, classes begin again. However, from September to the beginning of October, we will be holding more physical education classes to prepare for the school sports festival. We’ll distribute new weekly schedules, so please review them carefully. In addition to the new schedules, we’ll also distribute materials related to the festival. Students seated at the front, please pass handouts to those behind you, and so on.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe moment Chabashira-sensei uttered the words “sports festival,” the class erupted in an uproar. Some students were undoubtedly excited by the prospect, but just as many loathed the idea of anything focused on physical exertion.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The details on the printed handouts can be found on the school homepage as well. Please refer to them if necessary.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sensei, is this festival another of the special exams?” asked the class representative, Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe expected Chabashira-sensei to say “Naturally,” but her response was vague.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re free to interpret this however you wish. In any case, this event will massively impact each and every class.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe students who loathed exercise continued grumbling. At an ordinary school, you could find a way to sit out or skip a sports festival. If this festival affected the entire class’s fate, however, then even the least athletic of us had to participate.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOn the other hand, some students were really fired up about this. Particularly those who, like Sudou, were confident in their athletic abilities. This was probably the first exam that would let them contribute to the class meaningfully. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun, here!” While everyone else agonized over what was happening, Horikita—who’d been reading through the handout—pointed something out to me. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI flipped the page over and checked what Horikita was referring to. It was, rather unexpectedly, a description of the sports festival’s testing method. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor an instant, I felt as though Chabashira-sensei was looking at me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Some people may have noticed this already, but for this year’s festival, we’re going to divide all the students across all grade levels into two groups and have them compete against each other. You in Class D are assigned to the Red Team. Class A is also assigned to the Red Team, so they will compete alongside you. That means they’ll be your allies this time around,” explained Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClasses B and C were assigned to the White Team. It would be Red versus White.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoa! Seriously?! We’re really doing that?” shouted Ike. It didn’t come as a shock that he’d be surprised.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhether it was a written exam or a special exam, the fundamental idea was that this was a competition between classes. He’d probably assumed that this exam would pit all four classes against one another, same as always.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat would a team battle be like? This sports festival required a different strategy than we’d had during the special exam on the cruise ship. It demanded cooperation between students from different years.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita appeared calm on the outside, but I was sure she was panicking internally. Her older brother, Horikita Manabu, was a third-year student from Class A. Depending on the circumstances, we might have to work with him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At least you have an opportunity to get in touch with him now, huh?” I said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t talk about that here,” Horikita muttered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though I had only lightly touched on the subject, I’d apparently hit a nerve. She glared at me. Her pencil tip shook like a cornered rattlesnake’s tail, and I wished she would stop.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“First, let’s review the sports festival’s potential outcomes. I don’t want to have to explain them to you repeatedly, so please listen carefully,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe went over the text on the printout, tapping the paper forcefully to indicate where to look. Still listening, I lowered my eyes to the handout.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eSports Festival Rules and Team Division \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe sports festival divides all students, across all grade levels, into two teams: Red and White. The breakdown goes as follows: Classes A and D are on the Red Team, Classes B and C are on the White Team.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003ePoint Allocation for All Competitors (Individual Competitions)\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePoints will be allocated as follows: first place will be awarded fifteen points, second place will be awarded twelve points, third place will be awarded ten points, and fourth place will be awarded eight points.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOne point will be deducted for coming in fifth place, and one additional point will be subtracted for each place below that. (During a team competition, the winning team will be awarded 500 points.)\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003ePoint Allocation for Recommended Competitors\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePoints will be allocated as follows: first place will be awarded fifty points, second place will be awarded thirty points, third place will be awarded fifteen points, and fourth place will be awarded ten points. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTwo points will be deducted for coming in fifth place, and two additional points will be subtracted for each place below that. (The final competition, the relay race, will offer three times the point values.)\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eRed Team vs. White Team Outcome\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter reviewing the combined overall scores for each class, 100 class points will be deducted from the first-, second-, and third-year batches of the two classes on the losing team. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eThe Effect of Ranking by Grade Level\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFifty class points will be awarded to the class that scores highest in each of the three grade levels. Classes that achieve second place in their grade level will not see any changes to their class point totals. Classes that achieve third place in their grade level will have fifty class points deducted, and classes that achieve fourth place will have 100 class points deducted.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s simple. It just means that we have to stay focused and go into this competition with everything we have. The penalty for the losing team isn’t just a light slap in the wrist.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaving 100 Class Points taken away was a huge deal, but there were other things on the handout that I was concerned about too.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um, sensei, how many points does the winning team get? That doesn’t appear to be written anywhere,” said Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei’s response to that naïve question was cruel and brief. “None. Their reward will be not having any points deducted.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh, are you kidding me?! That doesn’t sound good, like, at all!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCries of agony sprang up all over the classroom. It was complete pandemonium. Of course, that was hardly surprising. Up until then, whenever there was an enormous risk, there had been an enormous reward to spur us on. However, that hardly seemed the case in this sports festival.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please keep in mind that points are awarded and subtracted, not just by team, but on a class-by-class basis. So, even if the Red Team wins, you’ll still be hit by the 100-point penalty if Class D holds the lowest combined overall score,” added Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, we’d end of losing unless \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eall\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e of us took this seriously. This system definitely required a “give it all you got” mentality.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStill, even with that being said, it would be pointless if only Class D took action. Supposing we scored highest among the first-year classes, and received fifty points? If we lost to the White Team, we’d still get a 100-point penalty. If we ended up taking fourth place among the first-year classes \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eon top\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e of being on the losing team, we’d be penalized 200 points in total. Our class would have to do our utmost if we wanted the Red Team to win. In that regard, this test was definitely stricter than the rest, but there were some real bonuses too.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eIndividual Competition Rewards (may be applied to the next midterm exam)\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStudents who achieve first place in an individual competition will be awarded either 5000 private points, or the score equivalent of three points on a written test. (In the event that a student accepts the test points, they will not be allowed to give those test points to another student.)\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStudents who achieve second place in an individual competition will be awarded either 3000 private points, or the score equivalent of two points on a written test. (In the event that a student accepts the test points, they will not be allowed to give those test points to another student.)\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStudents who achieve third place in an individual competition will be awarded either 1000 private points, or the score equivalent of one point on a written test. (In the event that a student accepts the test points, they will not be allowed to give those test points to another student.)\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStudents who score lowest in an individual competition will have 1000 private points deducted from their total. (In the event that a student has less than 1000 points, they will instead receive a one-point penalty on a written exam.)\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eRegarding Rule Violations/Foul Play\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRead and comply with every competition’s rules. Those who violate the rules will be disqualified. Anyone engaging in foul play may be forced to withdraw from the festival. In such cases, the school may render all previously awarded points invalid.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eMVP Reward\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe student who receives the highest total score across all competitions will be awarded 100,000 private points.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eMVP Rewards for Each Individual Grade Level\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe three students from each grade level who receive their grade’s highest total score across all competitions will be awarded 10,000 private points.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt first glance, this sports festival appeared worse than previous tests we’d taken, but there was a wide range of potential benefits. We needed to pay close attention to the risks and rewards of the individual competitions. Information that hadn’t been previously disclosed could trip us up.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“S-sensei, sensei! What are the perks you get for first or second place or whatever? What does it mean that we can receive points for written tests?” shouted Ike, hungry for details.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps because the situation was strange to start with, Chabashira-sensei let out a slight laugh—an unusual sight.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s exactly what you think it is, Ike. In the sports festival, you can earn test points as a prize, which you can then apply to a written exam. That means that you’re free to use the points that you’ve earned as you like. You struggle with English and mathematics, right? Extra points would prove incredibly useful for you in the next test.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePeople couldn’t help but let out cheers of joy. The most athletic students among us looked especially excited about that. If they went all-out in the sports festival, they could supplement their scores in the event of a failing grade. Students at risk of failing would be thrilled to hear this; surely it was exactly the kind of saving grace they were hoping for.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wouldn’t do an excellent student like Hirata much good, but even in that case, private points were incentive enough. No matter how you looked at it, the reward was something to be grateful for. The three idiots aside, more than a few students were anxious about their academic abilities. Expulsion was always looming over them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, as we soon found out, there was no such thing as a free lunch.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter all competitions end, the school will calculate each student’s point total and assign penalties to the ten lowest-scoring students in each year. The exact nature of the penalties will vary depending on grade level, so please consult the homeroom instructor in charge.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was a major red flag.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sensei, what kind of penalty would we get?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For you first-year students, the penalty would be a point deduction on your next written exam. The ten students with the lowest overall scores will each receive a deduction of ten points,” Chabashira-sensei explained. “I can’t give you any more info on that right now; it’ll be explained when the exam comes around. Same goes for the bottom ten.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whaaa…?! Seriously?!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, if Ike happened to score at the very bottom for his grade level, then he would have 10 points deducted from his next written test, putting him all that much closer to a failing grade. The exam would be incredibly distressing for him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that we’d heard the rules, it was time to look at the different kinds of events in this sports festival. They were divided into two categories: “all participants” and “recommended participants.” “All participants” was exactly what it sounded like: an event that literally all the students in a class participated in. Individual events like the 100-meter dash fell into that category, as did group events like the tug-of-war.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMeanwhile, only certain select students would participate in “recommended participant” events. The word “recommended” implied that a person was nominated, but a student could put themselves forward if the rest of their class agreed. A single person could also participate in a competition meant for multiple people. Events in the “recommended participants” category included the scavenger hunt, the co-ed three-legged race, and the 1200-meter relay race. Most likely, only the best of the best would be involved in these.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePoint gains and losses were determined purely by the event results, making the rules pretty easy to understand. However, the combination of team competitions and individual competitions made the festival tricky. We had to be wary of our enemies, Classes B and C, but also mindful of our allies, Class A. Class D and Class A would be helping each other, but to get first place in the combined scores across every grade level, our own class needed to take the top spots in multiple competitions. The tests on the deserted island and cruise ship had also been rather complex.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Details of the events are noted in your handouts. There will be no changes whatsoever,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh, this is crazy hard, though! This is on a completely different level than junior high!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eEvents for All Participants\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e100-Meter Dash\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHurdle Race\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCapture the Flag (boys only)\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBall Toss (girls only)\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTug-of-War (separate events for boys and girls)\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eObstacle Course Race\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThree-Legged Race\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCavalry Battle\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e200-Meter Dash\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eEvents for Recommended Participants\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eScavenger Hunt\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFour-Way Tug-of-War\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThree-Legged Race (mixed boys and girls)\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e1200-Meter Relay Race (mixed grade level, all three years)\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThirteen competitions in total—a grand lineup. The numbers indicated the order the competitions would be held in. There was some dissatisfaction over the large number of events for all participants.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There would normally be, like, three or four events for a single person! Besides, is it even possible to do all these in one day?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I appreciate your concern, but the school already considered that,” answered Chabashira-sensei. “No events require specific skills, such as cheerleading, dancing, or coordinated group gymnastics. The sports festival will be a thorough test of your general physical ability and stamina.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe unathletic students’ resistance was in vain. Chabashira-sensei had anticipated their every complaint.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Another important thing to note is the participation table. Fill it out with the order you’ll participate in, and I will submit it to the school on your behalf. I don’t imagine any junior high has adopted a system like this, so do be extra careful not to make any mistakes.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait. So, we can decide the order in which we’ll participate? Exactly how much freedom do we have?” asked Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was an obvious question, and Chabashira-sensei answered quickly. “Your class must come to a consensus on everything to do with the sports festival, such as which students will participate in which events. No changes will be allowed once the deadline passes, no matter the reason. That is the most crucial rule of this sports festival. The submission window opens one week prior to the festival and ends at 5:00 pm on the day before it begins. If by some chance you miss the submission window, you will be assigned randomly. So, be careful.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis meant that we had to come up with a winning strategy on our own, then? Obviously, the participation table was the class’s lifeline.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Excuse me, but I have a question. Is that all right, Chabashira-sensei?” Horikita, who’d sat quiet until then, politely raised her hand.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Feel free,” replied Chabashira-sensei, offering the girl a thin smile. “Now’s the time.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBoth Hirata and Horikita had a rough idea of how the school operated. The more questions they asked now, the better they’d understand later. We didn’t have to worry about losing points yet, after all. If we wanted more information on the day of the festival, it might be too late for an answer.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I realize that no further changes will be accepted once the submission window closes. However, in the event of someone’s absence, what do we do? In the case of an individual competition, I assume that would be treated as an absence, but for group competitions? Especially in games like the cavalry battle and the three-legged race, we might not be able to compete at all if one important person is missing.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Should you fall short of the minimum required number of people for competitions for all participants, you will be deemed unable to continue and disqualified. Using your example of the cavalry battle, someone’s absence would make you a bit short of a full formation. But you’d just have to perform with them missing, wouldn’t you? The same goes for the three-legged race. It’d probably be wise to choose a healthy, hearty student to be your partner.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOur fates were linked, then. It was crucial that we chose a student who excelled in athletics, and they had to be healthy and free of any injuries.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For recommended-participant events, however, you are permitted to arrange a substitute. Don’t even think about picking someone willy-nilly or lying your way through it—we’ve put a measure in place to prevent that. To establish a substitute, you must offer points as compensation.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWe’d have to pay to prove we weren’t cheating, huh?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“While we’re on the subject…if an athlete’s health suffers, or they’re severely injured, will it be possible for that person to continue participating if they wish? Or will they have to stop and see a doctor?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We leave that to the students to decide for themselves. Knowing your own limits will be an indispensable skill in the working world. For instance, you can’t simply take a day off just because you have a fever on the date of an extremely important conference. You’ll just have to grin and bear it,” replied Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, personal responsibility might trump personal health if the stakes were high enough.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, if someone’s health gets truly poor, then they’ll have to drop out,” Chabashira-sensei added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand. Well, how many points are needed to assign a substitute?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A substitute requires 100,000 private points per competition. That’s expensive or cheap, depending on your resources,” replied Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Thank you very much.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe could afford that, but it wasn’t exactly cheap. Depending on the circumstances, though, a substitute could be necessary in the future.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If there are no more questions, we’ll wrap up,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe looked around the classroom. Students glanced at one another doubtfully and whispered, but made no effort to speak up. This was likely our last chance. Chabashira-sensei didn’t seem super open to questions to begin with.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Next period’s location will move to Gymnasium 1, where you’ll meet with students from other classes and grade levels. That is all,” Chabashira-sensei said flatly. She checked the time. “You have twenty minutes of homeroom remaining. You’re free to use that time however you wish, whether it be a friendly chat or a strategy meeting.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith the teacher’s permission, the silent classroom exploded into chaos. Groups formed, all chattering about the sports festival on their own. Sudou, Ike, and Yamauchi gathered around Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s figure this out, Horikita,” said Sudou earnestly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, yeah, let’s think of a way to win!” Ike added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita sighed deeply, looking at the boys as if they were someone else’s problem. “Why do only guys like these come to me?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s a sad fact of reality,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough Horikita muttered “For crying out loud,” she seemed to take the matter seriously. She flipped open her notebook. “Fine. I’ll hear you out for now,” she stated.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes! Yes!” Ike immediately raised his hand. Horikita pointed her pen at him, urging him to speak.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d like to have fun and win!” he shouted.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not a valid opinion. Could you refrain from stating the obvious?” Horikita smacked him down at once. Ah, well. I supposed there was no helping it, even if it meant Ike’s hopes were cut short.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Class D can win this,” Sudou said confidently.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not really expecting you to dazzle us with your logic,” Horikita replied, “but I’ll listen to what you have to say.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not sure about the ‘all participant’ stuff, but you know I’ll enter the recommended-participant competitions. If I do that, we’ll win,” he answered. Sudou was more confident in his athletic ability than anyone else.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s about as helpful as Ike’s contribution, but there is some merit to it. Within our class, you stand out as someone with superior athletic skill. It certainly wouldn’t be a bad idea for you to participate in all the recommended-participant competitions,” Horikita said. “It’s not as though it’s against the rules.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI agreed, but Ike and Yamauchi seemed dissatisfied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We want to have a chance, too! Come on. If we place in the top three, we can get some points.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’d advance your personal agendas, even if that lessened Class D’s likelihood of winning?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s a good point, but…it’s just, like, we want a chance to win something!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When it comes to the recommended-participant competitions, you want people who are \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003egood\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e at sports. You’re not, Kanji,” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, you don’t know that for sure!” Ike shouted. “I\u0026#160;mean, miracles happen all the time, right? ’Sides, this should be fair!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose bringing the entire class into this discussion will complicate matters even further,” said Horikita. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe might be able to argue Ike down, but other students probably felt the same way. However, it seemed her remark had lit a fire under Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The athletic students can participate as many times as they want. That’s the first thing, right? Let’s not be naïve, Suzune,” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI understood what Sudou probably wanted to say, and Horikita’s silence suggested she did too. Even from the perspective of an honor student who could simply study, having a student like Sudou actively participate in the sports festival would be ideal. Few would complain if Sudou, who was always at risk of getting a failing grade in the written exams, racked up a number of perks.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStill, not \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eeveryone\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e would agree to it. The potential rewards of winning were very attractive to poorly performing students. Those who were constantly at risk of expulsion probably wanted this chance so badly they could taste it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sudou, I sympathize with your desire to participate in all the events,” Horikita said. “However, that doesn’t mean I can support throwing caution to the wind by entering you in every competition.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whaddya mean?” Sudou balked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Stamina isn’t an unlimited resource. If you participate in one event after another, you will naturally become exhausted. It will be difficult to clinch consecutive wins.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But it’s better to leave it to me than put forward someone unathletic, right? Even if I get tired out, I can still move better than those guys,” Sudou huffed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe glanced over at the guys—me included—and gave a snort. Ike and Yamauchi appeared frustrated, but said nothing. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re not coming to any decisions right now. Let’s talk more in our next homeroom period,” said Horikita, quickly bringing our discussion to an end.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e2.2\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eCROWD OF OVER\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e four hundred people, including the instructors and the entire student body, gathered together in the gymnasium during our second homeroom period. Students from every grade level were divided cleanly into the Red Team and the White Team.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita scanned her surroundings restlessly. She was probably looking for her older brother, Horikita Manabu, who served as the student council president. However, with this many people around, she wouldn’t be able to spot him easily.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was worried about causing trouble for her brother, but took care not to draw too much attention as she searched for him. If she loved her older brother that much, then it would have been better for her to take some initiative. But being vulnerable was harder than anything else for Horikita. Now that I thought about it, she’d never gone to meet with her brother before. He’d always been the one to initiate contact. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen we sat down on the floor, several students came forward. Everyone focused their attention on them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m Fujimaki, from the third-year Class A. It’s been decided that I will assume command of Red Team.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, Horikita’s older brother wasn’t going to take charge. I would’ve thought that he’d take the lead, being student council president. This just made me wonder when he would make a move. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d like to give the first-year students one piece of advice. It goes without saying, but the sports festival is extremely important. Your experiences here will most certainly be applicable to real life. In fact, many of your future exams may look like games at first glance. However, each and every one of them is a crucial battle in which you stake your survival at this school,” said Fujimaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHis words were somewhat vague, yet still helpful.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You may not feel motivated right now, since you’re still feeling it out, but we’re going to try and win this thing. I want you to hold on to that feeling,” Fujimaki continued. “We all need to.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe looked around the assembled Red Team members once again, then said, “The only competition which all classes from all grade levels will participate in together is the final event—the 1200-meter relay race. Aside from that, all the other events are divided up by grade level. So, please, feel free to gather and discuss your strategies, starting now.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn response to Fujimaki’s words, the first-year students from Class A, led by Katsuragi, began to assemble in droves. The first-year Class D students, on the other hand, appeared to flounder. They felt nervous in the company of such elites. In the first semester, Class A’s grades had been overwhelmingly better than Class D’s. None of us had even come close.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, the circumstances may be rather bizarre, but I’m looking forward to working with you. I hope we can join forces without any problems,” said Katsuragi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I feel the same way, Katsuragi-kun. I look forward to working with you,” replied Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe two of them had openly expressed their desire to cooperate. From Class A’s perspective, there was no benefit in teaming up with the lowest-ranked class of all. However, if our classes didn’t work together, we’d drag each other down. We weren’t agreeing to trust one another like siblings, but we were making a pact not to get in each other’s way.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, check out that girl,” whispered Ike, standing beside me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI understood why he was whispering. I felt the same way, and I figured Horikita did too. He was pointing at a Class A student, a girl whom I’d never seen before. She stuck out like a sore thumb, but no one said anything. It didn’t feel like we \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecould\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e say anything right now.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Every individual class has its own strategies, but—” Katsuragi just continued talking, blithely ignoring Class D’s concerned looks and furtive whispers.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you don’t intend to hold a discussion?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA girl’s rising voice echoed through the gymnasium, interrupting Katsuragi. Everyone’s attention switched to what was happening. The speaker was a first-year Class B student named Ichinose Honami. In front of her, almost an entire class was in the process of leaving the gymnasium. Among those students, Ryuuen Kakeru, Class C’s leader, turned around with his hands in his pockets.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You understand that I’m leaving out of goodwill, right? Even if I offered to cooperate with you, I can’t imagine that you’d believe me. In the end, you’d just probe me for information to see whether I can be trusted, right? It’s a waste of time,” he said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. So, you’re just saving us the hassle, then,” replied Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yep, that’s it. You should be grateful.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen sneered and continued walking, with all the Class C students trailing behind him. The spectacle merely confirmed Class C’s status as a dictatorship.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Ryuuen-kun. You really think you can win without cooperating?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe had fired off one last question during Ryuuen’s departure, as if she was intent on trying to cooperate with him all the way to the bitter end. But Ryuuen continued walking.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh. Hmm, I wonder.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe chuckled to himself and led his Class C entourage out of the gym.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs Class D watched, Karuizawa’s expression soured for just an instant. During the special exam on the cruise ship, she’d gotten in a scrap with Manabe and some other girls from Class C, which had led me to discover her history as a victim of bullying. She’d been keeping it hidden all this time. Yukimura was the only other one aware of her past, but not the extent. For just a moment, Manabe looked back at Karuizawa. Then she immediately averted her eyes, as if nothing had happened, and followed Ryuuen out.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Class B seems to have it really rough, getting paired with Class C and all.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t as though Class D would’ve had any way to take charge either, but compared to being with Class C, this was better for us. The spectacle we’d witnessed was a reminder that Ryuuen really did hold all the power in his class. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi offered Horikita some advice. “Since we’ll be allies from here on out, I should warn you. Don’t underestimate Ryuuen. He’ll laugh while he attacks you in the same instant. Don’t let your guard down.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I appreciate the warning, but I wonder if you’re speaking from personal experience,” replied Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve warned you.” Katsuragi left it at that and returned to the topic of the festival.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder if he’s going to make a move right away,” someone whispered, looking in the direction Class C had gone. It was the girl I’d been curious about a little earlier. She was petite, and sat quietly all by herself, her eyes downcast. She held a thin cane. It was clear that she had trouble walking.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_2\" src=\"/hola-lector-agua/images/books/v5/OEBPS/Images/INTERIORIMAGES_2.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe one who offered us an explanation wasn’t Sakayanagi herself, but rather Katsuragi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s Sakayanagi Arisu. She’s disabled. Please be sensitive about that,” said Katsuragi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So that’s Sakayanagi…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis girl was Class A’s other rumored leader, who had supposedly split the students into two distinct factions between herself and Katsuragi. She was so thin that you could assume her condition was why she had been absent during the test on the uninhabited island. It seemed she had a chair specially prepared for her, most likely because moving around could be a struggle for her. Although everyone around her was staring, the girl paid no attention to them. She had short, silver hair, a particularly eye-catching feature. I wasn’t sure whether she dyed it. Her skin was pale, and her name—Arisu—reminded me of a certain mysterious girl who fell down a rabbit hole to Wonderland.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dude, she’s super cute!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed it was no surprise that the Class D boys would be smitten by Sakayanagi. She was as cute as Kushida and Sakura, and had a dreamlike quality that made people instinctively want to protect her. Yet none of the boys made a move to hit on her or crack jokes like they normally would have. Though she appeared weak, she emanated strong willpower. You could see it in her large eyes. The guys probably felt like something bad would happen if they got too close to her. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi smiled at us, aware of the stir she’d created. “Unfortunately, I won’t be very useful in this competition. I’m afraid I’ll be consistently absent,” she said. Apparently, she recognized her own weakness. “It seems as though I will be causing trouble for not only my own class, but for Class D as well, then. Please accept my humblest apologies.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You have nothing to apologize for. No one’s going to give you a hard time over that,” said Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom Hirata to Sudou, no one was going to blame her for something outside her control.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The school sure is harsh. They should’ve come up with some accommodation for you.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, that’s right. You don’t need to worry!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your kindness overwhelms me,” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eContrary to what we’d expected, Sakayanagi seemed extremely polite, mature, and gentle. She gave no hint of aggression. Her presence wasn’t particularly strong at all, despite the things that set her apart. However, Katsuragi watched her quietly. Students like Ike and the rest, who didn’t know anything, probably thought Class A and Class D were sitting with their classmates as normal.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, I could see from the way the Class A students arranged themselves that there was a clear line between Katsuragi’s and Sakayanagi’s followers. The class definitely had two factions. I’d considered Katsuragi’s faction equal or even superior at first, but I wasn’t so sure anymore. There were some boys and girls with Katsuragi, including Yahiko, but nearly all the students sat with Sakayanagi. Perhaps she was deliberately demonstrating her own power.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi had not participated in the island or cruise ship tests. Though the school hadn’t made a statement about it, it was certainly possible that she’d incurred a penalty for not participating on the ship, yet she’d managed to gain this many allies. Rather than attracting others with her cute countenance, she had most likely earned her classmates’ trust by steadily racking up various other accomplishments. Meanwhile, Katsuragi’s own failures had probably affected his popularity.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wasn’t fully aware of the other classes’ circumstances, but Katsuragi was a firm and deliberate kind of guy. He wasn’t the type to slip up repeatedly. I wondered if the girl was somehow related to his failures. After apologizing for her shortcomings, Sakayanagi showed no sign of wanting to speak further. Instead, she quietly observed Katsuragi, Hirata, and the others. Maybe I was overthinking it. Maybe she stayed quiet because she knew she wouldn’t be of any use in the sports festival. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi, ignoring Sakayanagi, continued to talk with Hirata. “About our alliance—I was thinking that it’d be best if we just keep out of each other’s way. You don’t mind, do you?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you won’t share any details about the competitions you’re participating in?” Hirata asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Right. Letting that information slip might lead to unnecessary conflict down the road. For example, if info were leaked to Class B or Class C, then we would begin to doubt Class D—which would inevitably put a wrench in our alliance. Constantly comparing ourselves to each other will only increase the divide between us,” said Katsuragi. “We will cooperate equally and fight side by side to the bitter end. It’s the ideal strategy.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I suppose you’re right. It’s pretty hard to trust other people in this school, Katsuragi-kun. Also, even though we’re allies in a way, I suppose there’s no changing the fact that we’re still competing with one another,” replied Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe looked to the rest of our classmates for the final decision. No one voiced objections. Neither class could just suddenly start trusting the other and reveal all of their plans. Keeping each other at an appropriate distance would be the safest option. Even Horikita didn’t say anything, so she must’ve been convinced, too.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At any rate, we’ll need to meet like this sometime soon to discuss the group competitions. Is that all right with you?” Hirata asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, that should be fine. I’ll consult with everyone\u0026#160;else.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thanks. I’m counting on you.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey certainly didn’t waste time. It seemed as though everything was going smoothly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you think the trick is here, Ayanokouji-kun? What are they playing at?” Horikita, on the other hand, seemed to have some ideas of her own.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s a sports festival. The school’s probably trying to find out which students are athletic and which aren’t.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re fundamentally correct, of course. This competition is going to determine our abilities. But what’s another factor, other than athleticism, that might influence the results?” asked Horikita. “Mere luck?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Luck, huh?” That suggestion was out of character for her, but she may have been right.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unlike our other written and special tests, opponents on this test will be chosen at random. We don’t know who’ll take on whom. Luck is a huge factor.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTrue, much would be decided by the matchups. In that regard, it was down to luck. Even Horikita, who would normally win against 80 percent of the people in the gymnasium, could lose if she happened to go up against someone from the remaining 20 percent. On the other hand, somebody very unathletic, who could only best a measly 10 percent of their opponents, might actually win if they were lucky enough to be matched up with someone even less athleti
