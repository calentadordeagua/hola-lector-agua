[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:Ta35c,"])</script><script>self.__next_f.push([1,"\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 4:\u003cbr/\u003eEveryone’s Calculations\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eS\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eTARTING FROM OUR NEXT\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e homeroom period, we’d be practicing independently to prepare for the sports festival. During Class D’s free period, we changed into gym clothes and made our way to the athletic grounds.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoa, check it out.” Ike, wearing an unpleasant expression, stared at the main school building. Several students were watching us through the windows of their classroom.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, they’re from Class B, right? Guess they’re already spying,” mused Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eScoping out the other classes to gauge their athletic abilities was totally understandable, whether we were enemies or allies.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Class A is checking us out, too.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf we wanted to train in such a conspicuous place, it was only natural that we’d be watched. Even if we held back, so the others wouldn’t see our true skills, that would only hamper our practice and hurt us in the end.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They started right away.” Horikita had also noticed the curious stares. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor my part, I was more worried about Class C. Not a single one of them was looking at us. It was like they were saying that Class D wasn’t any threat to them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you worried about Ryuuen-kun?” Horikita asked\u0026#160;me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, a little.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m surprised that he doesn’t seem to be carrying out some kind of reconnaissance. However, he \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003erefuse to cooperate with Class B. He doesn’t appear interested in any sort of strategy.” Horikita shot me a look that seemed to say, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI understand, \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ebefore continuing. “Or so I would have thought if you hadn’t warned me. Surely the other students must think they’re safe, though.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe glanced at the students, who were throwing themselves into practice.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What you mentioned earlier, about Ryuuen-kun already having a strategy? I suppose this means that his plans are already in place. Reconnaissance isn’t necessary for him.” Horikita no longer appeared optimistic. On the contrary, she now looked clearly bewildered. “Anyone would want information on the other classes. They should want to know who is physically gifted, who’ll participate in which contests, and so on. But him…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat in itself proved that Ryuuen already had a secret strategy.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The important thing is not to be satisfied just with knowing that Ryuuen has a plan,” I explained.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Normally, when someone has a secret plan in place, they do whatever it takes to ensure that their enemies don’t figure it out. However, Ryuuen’s not even trying to hide the fact that he’s up to something. He’s making it obvious by not bothering to do any reconnaissance,” I\u0026#160;said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s almost like he’s showing off then,” Horikita replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThinking more deeply about the implications of Ryuuen’s behavior would reveal his thought process. I\u0026#160;wondered how much of it Horikita could see at present.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know, I can’t help but wonder where your powers of observation came from. But, since you’ve forbidden me from asking questions, I suppose I must be quiet.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat a disagreeable and Horikita-esque way of putting it. Of course, no matter how much she poked and prodded, I wouldn’t budge.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Suzune. You have a minute?” asked Sudou, startling Horikita with his late arrival. Sudou interrupting her train of thought clearly irritated her. Something else seemed to be bothering her, too.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve told you numerous times. Please do not call me by my first name.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aw, what do you mean? Does it really bother you that much?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. I don’t want someone I’m not close to using my first name,” said Horikita. As always, she went right for the heart, sparing none of Sudou’s feelings. “If you continue to call me ‘Suzune’ after this warning, I’ll have to take more direct action to make you stop.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA terrifying proposition, truly. If at all possible, I didn’t want to hear the details. He no doubt desperately wanted to call her by her first name, but he would really suffer if she came to hate him. Whatever his thoughts were, I wouldn’t find out, because Sudou changed the topic.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, if I get the best results out of anyone in Class D during the festival, will you let me call you by your first name?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eOh?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e It was a rather modest request for Sudou, but I didn’t know whether Horikita would acknowledge it. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hard work is its own reward. Why should I agree to such an idiotic bet?” Horikita probably wasn’t aware of Sudou’s feelings for her. I wondered how he intended to answer.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s just… Not too long ago, you saved me. That’s why I want to do things properly, to show you how I feel… No, I think I’d like to be friends with you, first. This is the first step,” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t understand why you’d go out of your way to request something like that. But fine. If you produce the best results, I will allow you to use my first name. However, I won’t be satisfied if you’re just the best in our class. Show me that you can be the best out of everyone in our grade,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe’d given Sudou an incredibly high hurdle to clear. But Sudou showed no sign of balking. “All right! It’s a deal, then. If I place first in our grade level, I’ll call you by your first name,” he said happily.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, in the event that you don’t get first place, I’ll forever forbid you from saying my first name. Prepare yourself,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yeah.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a Herculean task, though not impossible. He nodded vigorously in response. Based on what I’d seen of the other classes, Sudou’s skills were top-notch. I\u0026#160;doubted he’d have any trouble during the events. The only person who might rival him was Kouenji, but he was totally unmotivated and most likely wouldn’t be a problem. That meant it was just a matter of how many competitions Sudou could dominate.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e4.1\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eW\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eE STARTED TESTING\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e everyone’s aptitude in earnest. Although Hirata’s policy didn’t encourage forced participation, roughly 90 percent of the class took part in the various tests. Only a few, like Kouenji and the Professor, sat them out.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hah…ah…phew!” Sakura finished in last place, looking as though she was about to collapse, both hands on her knees.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good work, Sakura. You really gave it your all.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A-Ayanokouji-kun. Ah…hah…” Sakura wheezed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura had always been rather unathletic, so she wasn’t terribly proactive when it came to sports. But recently, she’d worked hard to contribute to the class. Unfortunately, her lack of physical endurance was still a problem.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, hey! Let’s go!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMeanwhile Sudou, usually the least serious class member, worked harder than I’d ever seen. There was a certain magnetism to him. He couldn’t afford to disappoint after talking such a big game, but he needn’t have worried. When he was in top form, Sudou was unbeatable. No student in our class could stand as his equal.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, just like we’d expect, Sudou-kun! You always end up taking first place in our class, no matter the event. That’s amazing!” said Kushida. She jumped up and down in excitement as Sudou finished running the 100-meter relay race. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh, guess so. Even so, I dunno what’ll happen if \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehe\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e runs.” Sudou glared at Kouenji, who showed no interest whatsoever.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know, that reminds me. I’ve never seen Kouenji seriously run before.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBack when Kouenji had faced off against Sudou in swimming class, he’d beaten Sudou’s time. His skill was obvious, but he wasn’t going to budge unless he wanted to. He’d let us do whatever we pleased while he sat on the sidelines, not lifting a finger.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But, seriously, you’re amazing. Really, Sudou-kun, you’re definitely the sports festival leader,” said Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Leader? Me?” Sudou repeated the word, appearing to be a little taken aback.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes.” Hirata, who was recording everyone’s scores, apparently agreed with Kushida. “After all, the sports festival really is an athlete’s time to shine. You’re especially qualified, Sudou-kun. Would you mind leading our class for this?” Hirata himself was qualified, of course, but he had judged Sudou to be the far superior choice.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I ain’t really suited to be a leader or anythin’…” Sudou looked over at Horikita for her opinion. He seemed a little bewildered, as he only ever acted alone or within a\u0026#160;small group.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re not the type of person to speak eloquently. As a communicator, Hirata-kun is certainly the superior choice,” she said. “However, based on your sprint earlier and your other athletic records, I can see Hirata-kun’s point. You shine when showered with attention. Besides, brute strength will be necessary to pull our class along. I\u0026#160;wouldn’t object to you serving as leader in this.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe didn’t encourage him, but she didn’t reject him, either. She’d acknowledged him. After all, she wasn’t arbitrarily participating in practice; she was trying to get a firm grasp of everyone’s talents.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay! I’ll lead our class to victory,” said Sudou. Perhaps being so lovestruck was foolish, but he clearly wanted to live up to Horikita’s expectations.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t get overconfident and sloppy, because I’ll make you pay for that,” warned Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe walked away and returned to practicing. Sudou blushed, clenching his fists as he watched her go.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e4.2\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eS\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eUDOU WAS SERIOUS\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e about being a leader. The next day, he began coaching the other students, starting by teaching them how to win the tug-of-war. I watched from a slight distance away.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re just pointlessly strainin’ yourself. There’s no strength at all in your pull. At this rate, you wouldn’t win, even if you could,” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe grabbed the short length of rope tightly to give us a practical demonstration. Ike and Yamauchi faced off against him. The looks on their faces suggested that they expected to win, but when the match began, Sudou pulled with an overwhelming amount of strength. A disappointingly short time later, Ike and Yamauchi fell down and sat on the ground.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“See? You ain’t putting any power into it at all.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t get it. Hey, Sudou, is there some kinda trick or something?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, power’s important, but also, don’t just use your arms. Use your hips, too,” said Sudou. His manner was rough, but he gave each and every student thorough guidance. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Sudou-kun. Can you come look at this for us? We’re not doing well with our carriage for the cavalry battle.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure. Wait a sec. I’ll be right there.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were more than a few unathletic students, which meant that several people asked Sudou for help. I was honestly surprised that even girls asked him for his opinion.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, he seems to be taking this rather seriously.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s the first time that people have relied on him. Leadership might actually suit him, don’t you think?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn theory, it probably felt nice to be relied on. That was doubly true for students like Sudou, who lived their lives in solitude.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As for me, though…well, I wouldn’t mind praising him, but—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBefore she could finish the thought, we heard an angry voice.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Look, I’m tellin’ you that ain’t it!” Sudou kicked at the dirt, sending it flying toward Ike and Yamauchi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Gah! Puh…yuck! Dude, c’mon. Stop!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita sighed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou’s rashness was still a problem. A leader needed to understand the fact that others were fundamentally different from them. A leader also had to be patient, like Hirata, who always employed gentle teaching methods. He was currently checking some girls’ positions in the carriage formation for the cavalry battle to make sure that they were comfortable.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I think this formation is great. But don’t you feel a little cramped?” Hirata asked them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. My shoulders hurt a little, I guess.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s change the positioning a bit. If you just move a few centimeters, it’ll feel different.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, wow, you’re right! That feels much more comfortable. Thank you, Hirata-kun.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, can you help us out, too, Hirata?” another cavalry group asked, and he responded with a broad smile.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why don’t you help teach the girls, too?” I asked Horikita. She was one of our top athletes; she had a lot going for her as a teacher.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t want to teach them. Besides, I don’t think anyone wants me to teach them, either.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that bold statement, she started warming up by herself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m already trying my hardest to produce results for myself. How can you be so laid back? I suppose, if you’re sure you can win, that’s fine,” added Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nope, I’m not confident.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That sounds about right. You always get average scores. You’re neither fast nor slow. Your results don’t stand out at all.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know that?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I try hard to uncover my classmates’ true abilities.” She had observed me closely, even during physical education. “I’ll ask you this just once, but…are you holding back, like you did with your test scores?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Would I do something so pointless?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The odds of that are about fifty-fifty to me. So, do\u0026#160;you?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry to disappoint, but what you see is what you\u0026#160;get.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re neither good nor bad. That means I shouldn’t expect great results, hmm?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yep, that’s right.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then you should practice more, starting now.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I could improve in such a short time span, this wouldn’t be a problem. Unlike studying, trying to do this all at the last minute the night before is kind of pointless.” Physical ability only improved through repeated conditioning.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wouldn’t it be a good idea to focus on events where you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecan\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e improve quickly, though? For example, just learning how to grip a rope or form a carriage will increase our chances of victory.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d tried to slack off and cut class, but Horikita had firmly boxed me in. Well, there wasn’t any getting around it. I needed to practice for the recommended-participant events I’d somehow gotten roped into.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey,” Horikita called out to me again as I walked away.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Every class’s physical abilities will determine who wins and who loses. Right?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is a sports festival. Physical abilities are key.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. Still, that kind of thinking is limited. If I focus on my own performance, I’m confident that I can produce good results, but something’s been troubling me for a while. I might not be able to reach Class A just by improving my own skills,” said Horikita. It was an uncharacteristically timid remark coming from her. It seemed that she’d been deeply affected by her mistakes in the prior tests. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay. Let me ask you this. What should we do in the sports festival to produce results? To reach Class A?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn reply to my question, Horikita just gave me a confused look.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Could it be that you’ll win if you enjoy it? This is the long-awaited sports festival, after all. Forgetting that this is a test and having fun is an option,” I said, as if trying to change the topic.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You promised me that you’d cooperate, didn’t you? You said you’d help me reach Class A,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s what I’m doing, isn’t it?” I spread out my hands, showing that I’d nothing to hide. “I’ll participate in the festival. That’s cooperating.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you serious?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You said so yourself, didn’t you? Physical ability will determine victory or defeat.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But there are other aspects to the competition,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, she meant something besides athletic ability that would influence the outcome.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay. So, on the day of the festival, should I give the Class B and C students stomachaches and make them bow out? If I do that, we’ll have a total victory. We’ll win by an overwhelming margin,” I said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Stop joking.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s about the answer you expected from me, though, isn’t it? The sports festival is a challenge to be taken head-on. Clumsy little schemes will backfire. Each person should strengthen their abilities and strive to outdo the competition,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was what the school would be looking for.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you wanted me to expand on your way of thinking, it’s like you’re saying athleticism alone won’t be enough,” I added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you agree that something else is required?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ll learn the answer to that soon enough,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSomebody was walking toward us. “Horikita-san, you’re up next for three-legged race practice.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaving been called for, Horikita left. Apparently, she was partnering with Onodera, a girl from the swimming club who was supposedly a great sprinter. Each person’s athletic abilities were important, sure, but so were their abilities to cooperate with their fellow classmates. As I watched them tie their legs together, I wondered how Horikita would handle it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe five pairs of girls lined up at the starting line, then launched into the race. When it came to their overall skill level, Horikita and Onodera were the best pair. However, the results had yet to be seen. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey weren’t slow, but they weren’t fast, either. They came in third. The worst team was Sakura and Inogashira, a most unathletic pair. They were slow as molasses.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDissatisfied, Horikita and Onodera decided to practice the three-legged race again. They felt the hopes of the entire class weighing on them. Their time was no better than the first, though.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Those two’re kinda slow, huh?” mused Sudou, unexpectedly. He was offering an outsider’s perspective while all eyes were on them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFinishing their second run, the pair immediately untied the cord and faced each other. “Hey, Horikita-san, can’t you try to keep pace with me better?” Onodera sounded slightly annoyed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s certainly true that we aren’t moving in sync, but that’s not my fault. You’re too slow.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shouldn’t you strive to match the faster partner? Deliberately slowing my pace to suit yours makes no sense,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed that my worst fears were being realized. Trying to keep pace with the speedy Horikita was no easy\u0026#160;feat.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay. How about we\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003egive it a try, Ayanokouji-kun?” asked Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Roger.” I didn’t have time to waste on Horikita, who was fighting with her partner. The three-legged race was a first for me, too.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To begin with, let’s just focus on running. Then we can try and fix whatever goes wrong. Okay?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI nodded and tied our legs together per Hirata’s instructions. It was too tight for my liking, and made me feel shackled. Honestly, even if we were both guys, it was a little embarrassing to be that close to somebody. Particularly Hirata, the darling of all the Class D girls.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay then. Let’s take our first step,” said Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI nodded, and waited for Hirata to move his leg so I could match him. Keeping up with his rhythm, I stepped with my outer leg.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is really uncomfortable.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It is, isn’t it? But, as you run, try matching your breathing to our movements. Okay? I’m going to start running.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata picked up his pace slightly, and I copied him. Really, my run was only at about power-walking speed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, that’s it. That’s it! You’ve got it!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnyone could’ve kept the pace, but being complimented really did make things easier. As I got used to three-legged running, I realized that it was surprisingly simple. If both partners understood each other and maintained a similar pace, everything got smoother.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata and I ran a small lap, came back, and untied the cord. Loud, high-pitched cheers could be heard from the girls. “So fast! Just like we’d expect from you, Hirata-kun!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s really, really easy with Ayanokouji-kun as my partner. Let’s all practice and do our best during the festival, okay?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYeah, he really was supportive. He’d just finished his own practice, and now he was heading off to give other students advice again. Just another day in the life of Hirata, a truly superior man.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e4.3\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT WAS MID-SEPTEMBER\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e and the sports festival was less than two weeks away. Sudou, who couldn’t study to save his life, remained steadfast and practiced tirelessly. Tempering his spirit day in and day out with basketball had made him tenacious. Some students among us were holding back and cutting corners, but Sudou always gave everything he could without flaunting.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis degree of effort was probably the bare minimum that the school was looking for in the sports festival. That was especially true for direct competitions where we’d be facing off against other opponents, like in the cavalry battle or the tug-of-war. The outcome could probably be greatly influenced just be our formation or strategy. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, Hirata hadn’t forgotten about our relationship with Class A. He periodically held meetings with Katsuragi during which they discussed how best to compete. Class D, normally just an inch away from disaster, was doing almost too well. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLooking at the big picture, I saw two remaining issues at hand.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFirst, Horikita Suzune. She could become an invaluable asset to the class, but she wasn’t quite there yet. No matter how many times Horikita changed partners, they always ended up fighting and dissolving the partnership. Eventually, Horikita decided to compete paired with the girl who best matched her speed, but even that had fallen apart. Now she just spent her time silently alone.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you have a minute?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?” Perhaps because of stress, she seemed even pricklier than usual.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think it’d do you some good to compromise a little more,” I said. I’d watched her practice, but had seen no sign of improvement. Horikita’s overly forceful nature was getting in the way.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Many people have told me that,” she said, rubbing her forehead in exasperation. “I won’t compromise because I’m trying to get the best time. Isn’t that a good thing? The three-legged race is different from a normal one; even someone who’s slow should be able to keep up.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you have no intention of yielding?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. I don’t intend to accommodate someone else’s slowness.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But that’s why no one wants to practice with you.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen it came time to practice the three-legged race, Horikita was left outside of the circle our class had formed. If things continued like this, she’d have no hope of improving her time.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t understand. If I’m expected to yield, my partner must put in the effort first. I can’t work with someone who refuses to even try to improve,” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI understood what Horikita was trying to say. The girls who paired up with Horikita suggested dissolving their partnership as soon as they realized their timing didn’t match. There was a fundamental reason behind it, however.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Stick your foot out.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you getting at?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Partner with me for the three-legged race.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why should I?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s a mixed-gender three-legged race. Can’t we determine how compatible we are as partners?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you think you can keep pace with me? You’ll only drag me down.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“According to your theory, my speed isn’t the issue, only my effort.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fine. I’ll tie us together.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita crouched and tied the cord around our legs, as if telling me not to touch her. Everyone nearby was focused on practicing, and no one paid attention to us. Even Sudou, who’d probably get angry if he saw this, was too busy with other people.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, let’s go!” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt the beginning, I mirrored Horikita. However, as we picked up speed, I started going at my own pace.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-hey!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite Horikita’s panic, I mercilessly went faster. She did everything she could to keep up with me, but her stamina and strength were far inferior that of a boy’s, she couldn’t match mine.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You said that keeping up with your partner isn’t difficult, right?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s… I know!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was obstinate, and she refused to give up. I decided to shift gears. In the three-legged race, speed alone wasn’t enough; that much was clear now that I’d tried it myself. The important thing was to find a tempo that suited both partners, then find your best stride. If you tried to pick up the pace without doing this, you’d end up with a mismatched hobble.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tch!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEventually, Horikita had to admit defeat. I grabbed her by the shoulder as she stumbled, then came to a stop. She breathed raggedly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This wasn’t about fast or slow. Your practices went wrong because you didn’t look at your partner,” I told her. Without saying another word, I untied the cord around our legs. “The important thing is to work with your partner. How about letting them take the lead?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Think about it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita’s athleticism meant that she needed to discern her partner’s ability level and then work with it. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t know whether she would learn and mature. That was up to her. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida Kikyou was the second problem. She was something of a supporting character—working backstage, but never taking the spotlight. Although Hirata and Karuizawa often outshone Kushida, most of our classmates liked her, which gave her a level of influence even those other two didn’t have. In addition to Kushida’s exceptional communication skills, she was both academically and physically gifted, and had been blessed with an incredible figure. In a sense, her assignment to Class D in the first place was quite the mystery.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, I knew about the darkness within her. Not too long after starting school, I caught her angrily ranting to herself on a secluded rooftop. And, although I didn’t yet know why, it was a fact that Kushida hated Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut both Horikita and Kushida were vital to Class D’s improvement. Therefore, the only way to resolve the issue was to have them confront one another.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_6\" src=\"/hola-lector-agua/images/books/v5/OEBPS/Images/INTERIORIMAGES_6.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 4: Everyone's Calculations\",\"volumeId\":\"v5\",\"chapterIndex\":10,\"prevChapter\":{\"volumeId\":\"v5\",\"chapter\":9,\"title\":\"Chapter 3: Class D's Objective\"},\"nextChapter\":{\"volumeId\":\"v5\",\"chapter\":11,\"title\":\"Chapter 5: There's a Reason for Their Relationship\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Title Page\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Sudou Ken's Soliloquy\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: The School Sports Festival Begins\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: Class D's Objective\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: Everyone's Calculations\",\"href\":\"Text/section-0008.html#auto_bookmark_toc_top\",\"index\":10},{\"label\":\"Chapter 5: There's a Reason for Their Relationship\",\"href\":\"Text/section-0009.html#auto_bookmark_toc_top\",\"index\":11},{\"label\":\"Chapter 6: The Curtains Rise\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_top\",\"index\":12},{\"label\":\"Chapter 7: For Whose Sake?\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_top\",\"index\":13},{\"label\":\"Chapter 8: What You and I Lack\",\"href\":\"Text/section-0012.html#auto_bookmark_toc_top\",\"index\":14},{\"label\":\"Chapter 9: The Turning Point\",\"href\":\"Text/section-0013.html#auto_bookmark_toc_top\",\"index\":15},{\"label\":\"Epilogue: Postscript\",\"href\":\"Text/section-0014.html#auto_bookmark_toc_top\",\"index\":16},{\"label\":\"About the Author and Illustrator\",\"href\":\"Text/section-0015.html#auto_bookmark_toc_top\",\"index\":17}],\"volumeTitle\":\"Light Novel Volume 5\",\"detailsLink\":\"/select/year-1/v5\",\"returnLink\":\"/select\",\"currentSpineIndex\":10,\"nextVolumeLink\":\"/select/year-1/v6\",\"nextVolumeTitle\":\"Light Novel Volume 6\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description
