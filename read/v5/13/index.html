id to myself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAyanokouji-kun had been absolutely right, and I’d had nothing to say in reply.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tch.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt any rate, if I would be chasing after Sudou-kun, I had to take care of my leg, which still wouldn’t move as well as I wanted. Emergency medical treatment was available on the field, with personnel monitoring the students, but I wanted to avoid standing out as much as possible. Instead, I headed to the nurse’s office at the school.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I got to the infirmary, I saw that someone else was already there. Of the three available beds, one was curtained off. I couldn’t see who was in it. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How’s it look, sensei?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDuring our brief break before lunch, I’d had an emergency first aid staff member tape my leg, but that only had a minimal effect.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter inspecting my leg, the nurse looked up. “I already said this, but participating in more competitions will be difficult.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe nurse had diagnosed me with a sprain, and it didn’t seem to be getting any better or worse. At this point, I could only barely run, but at least I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecould\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e run. I\u0026#160;just couldn’t summon up enough strength to win a race. I’d desperately fought to make it through the individual competitions, but the events for recommended participants would likely be even more difficult. If I took part, I’d never win. I couldn’t let that happen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you plan to take part in the recommended-participant events?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was planning to, but I think I’ve changed my mind. If I tried to participate with my leg like this, I’d only drag the rest of my class down,” I said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s a wise decision.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFortunately, I’d obtained numerous points during previous exams. Even if I withdrew, I could compensate for my absence. If I prepared a substitute participant to take my place for all three competitions, the total cost would come out to 300,000 points. That was no small expense, but if it would raise our class’s chances of victory even a little, then I had to pay it. My dream of running alongside my brother would end, though.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, worrying about personal issues was meaningless. What mattered was who my substitute would be.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you very much.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce I had received medical care, I gave my thanks and then left the infirmary. I headed toward the main entrance to make my way back to the field. In the window, I saw my limping reflection. Feeling pathetic, I bit my lip. I did suspect Kinoshita-san of tripping me after she’d called out my name, but I was to blame for falling and getting injured. There was no changing that. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI tried my hardest to appear calm and collected, so that others wouldn’t notice my pain. When I was just about to leave through the main entrance and go back outside, Kushida-san ran up to me in a panic. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m so glad I found you, Horikita-san! I need to talk to you about something,” she said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What is it? I have some business I need to take care of, so please make it quick.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay. This isn’t a good place to talk, though. Sorry. Would you mind coming with me? Things are going to get difficult,” said Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can’t you explain here? I’ll decide after hearing how difficult this is,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter Kushida-san looked around, she whispered in my ear. “It sounds as though Kinoshita-san actually suffered a serious injury. It’s bad enough that she can’t even get up right now. So, that’s why…well, Kinoshita-san wants to talk to you, Horikita-san.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t hide my surprise. It certainly did seem like she’d been injured, but to think that things had taken such a turn…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Where is she?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This way.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida led me back to the nurse’s office.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e7.1\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eW\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHEN I RETURNED\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to the infirmary, Chabashira-sensei was there.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good. I was just saying that you’d barely missed Horikita-san,” the nurse said to her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I had Kushida fetch you. Looks like she was quick about it,” said Chabashira-sensei. Kushida-san listened to the adults talk, appearing uneasy.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What in the world is going on?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBehind that closed-off curtain I’d noticed earlier, I could hear someone sobbing. Chabashira-sensei pulled the curtain open, giving me a glimpse of Kinoshita-san, who lay in the bed. Then she let the curtain fall back into place and gestured me into the hallway.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kinoshita fell on the obstacle course this morning. Do you remember that?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course. She bumped into me,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat incident had thrown a wrench in my plans for the sports festival.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, Kinoshita says that you deliberately knocked her down, Horikita.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor an instant, I couldn’t understand what Chabashira-sensei was saying.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not true at all. It was completely by accident. If\u0026#160;anything, it—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“‘If anything, it’ what?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d been about to say that it was part of Ryuuen-kun’s strategy, as Ayanokouji-kun stated. I believed that Ayanokouji-kun was completely right, but we had no proof.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Never mind. It was just a coincidence, that’s all.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d like to believe that, but the situation isn’t good. Kinoshita claims that, during the race, you repeatedly looked back at her. We checked the video footage, and you certainly did look back twice,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s because she called my name,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She called your name? I see. Even if that’s true, though, she claims you kicked her. In fact, she’s been absent from all the subsequent competitions. We had a teacher inspect her injuries, which appear rather severe. They believe those were caused intentionally.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if she’s badly injured, she’s still lying. I didn’t do anything,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I believe you’re innocent. However, Japan is a country that favors uplifting the weak. Our school is no different in that regard. As long as we have no proof one way or the other, we must consider the possibility that it was intentional. We’ll have to deliberate on the matter,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s idiotic.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not all. The other teachers already know about this, of course. But, if this drags on, the student council will hear of it. Things will only get more difficult from there. You haven’t forgotten what happened to Sudou after his fight, have you?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf this continued, my brother would hear about the incident. He’d feel irritated and ashamed of his idiotic little sister. However, since I was innocent, I had no choice but to plead that innocence. Whether this was Ryuuen-kun’s strategy or just an unfortunate accident, I couldn’t lie.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you called me here to ask what happened, I told you the truth. I didn’t do anything. Now, I have some business to take care of, so if you’d excuse me?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI needed to find Sudou-kun as quickly as possible and bring him back. But, as I turned to leave, Chabashira-sensei spoke.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Under the circumstances, it would probably be easy for the school to believe that the incident was intentional rather than accidental. Kinoshita-san has been absent from festival events ever since the obstacle course. If we prove that you committed foul play, that will invalidate the scores you’ve acquired thus far, and you won’t take part in the recommended-participant events. Well, with your leg in that condition, I suppose participating would be impossible anyway, but… Kinoshita is an athletic student. In terms of speed, she’s as good or better than you. It’s hard to believe that her injuries are a mere coincidence.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf even she told me all that, I was innocent, so there was nothing I could do. I could easily continue my appeal, but I didn’t have time to deal with this any longer.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was going to withdraw from the recommended-participant events anyway. Ever since the obstacle course, my rankings haven’t been terrible. I don’t mind being marked absent for those events, like Kinoshita-san. However, I didn’t intentionally cause her to fall and get injured.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wondered whether that would be enough, looking to the teacher for approval.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kinoshita won’t accept that,” Chabashira-sensei replied. “She says she’ll report this incident to the school. Her testimony, and the footage, make this fairly damning. From her perspective, she’s suffered a massive loss. Class C is also in a tough spot due to Kinoshita’s absence, and it seems unlikely that they’d sabotage themselves like that on purpose. You understand what this means, right?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s a case of the Devil’s Proof, isn’t it?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA logical dilemma as old as time. To prove that aliens existed, all you had to do was capture one alien. But to conclusively prove that aliens \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edidn’t\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e exist, you’d have to search every inch of the entire planet and of outer space itself, which would frankly be an impossible task. That was the definition of the Devil’s Proof.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei was saying that, if it was impossible to prove my innocence, I’d need to prepare myself. Rather than confirm or deny, she crossed her arms in silence.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How did you hear about this, Chabashira-sensei? Who else knows?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kushida consulted me on the matter. She said she didn’t want it to blow up, but didn’t know what else to\u0026#160;do.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, Horikita-san. Kinoshita-san asked me to talk to a teacher,” said Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I appreciate your concern. If a teacher from another class heard about Kinoshita-san’s claim, this might have escalated quickly. However, I have some questions. Why exactly did \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e hear about this from Kinoshita-san?” I pressed Kushida-san.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe anxiously looked toward the infirmary. “I’m good friends with Kinoshita-san. When I went to check on her during our break, she told me.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a believable reason, considering that Kushida-san had a vast social network. At any rate, the only ones who knew about the accusation right now were Kinoshita-san, Kushida-san, Chabashira-sensei, and me. I wanted to resolve this here and now.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“May I speak with Kinoshita-san?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not sure about that. She seems frightened, and might be emotionally unstable,” replied Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please. I don’t want to aggravate things,” I said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI bowed, and Kushida-san bowed her head in return.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please allow me to do this, sensei,” I said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay. I’ll let you try,” replied Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt that moment, I heard the sound of footsteps in the hallway. Someone was walking straight toward the nurse’s office. He had both hands in his pockets, strutting around as if he owned the place.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks like things have gotten really serious.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ryuuen-kun…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhy was \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehe\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e here? I did my best to shake off any confusion, trying to appear calm and collected. However, Ryuuen-kun sneered and stopped right in front of us. He saw through my act.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I rushed over after Kinoshita asked for me. To think someone did this on purpose…” He passed us and entered the nurse’s office.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe followed him in a panic. Ryuuen-kun ignored the nurse’s attempts to stop him and opened the curtain to Kinoshita-san’s bed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Kinoshita. You all right? Looks like you’ve had a rough time,” he said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKinoshita-san looked startled upon seeing Ryuuen-kun. She trembled in fear.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I heard your leg was injured. Show me.” He pulled Kinoshita-san’s leg out from beneath the sheets. “Whoa, this looks bad. I’m impressed you’ve held up, considering all you’re dealing with.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKinoshita-san’s right leg was bandaged tightly. Her injury looked painful.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry. I tried my best, and I wanted to take part in the next competition, but…my leg just won’t listen. That’s why—hng!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t blame yourself, Kinoshita. I know you wanted to participate in the three-legged race,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We ran into each other by accident, Kinoshita-san. Why are you saying that I made you fall?” I interjected, giving her a slight glare.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKinoshita averted her eyes. Ryuuen-kun stood in front of me. “You really did this on purpose, didn’t you?” he asked me. “Sure sounds like it, according to her.”\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_12\" src=\"/hola-lector-agua/images/books/v5/OEBPS/Images/INTERIORIMAGES_12.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Stop joking around. You think I’d do something like this?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can never really know someone, can you? Convenient, isn’t it? Kinoshita-san, who just so happens to be better at sports than you, suffers a serious injury and has to withdraw. She was going to compete in all the recommended-participant events, too. Meanwhile, you continue taking part despite your injuries. I’m not supposed to find that suspicious?” he said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI understood all too well the significance of losing a teammate. But, after hearing the eloquent speech Ryuuen had prepared, my doubts about him only grew. Had Kinoshita-san purposefully run into me on his orders? Had he chosen her specifically to collide with me, since she was more athletic than I, and Ryuuen could deflect any suspicion?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut what did he stand to gain from having Kinoshita-san run into me, when she had a higher chance of winning the race to begin with? Furthermore, if she’d planned to take part in all the recommended-participant events, Class C would lose about 400,000 points paying for her substitute competitors. He had hurt his own classmate, paid the price, and lowered his chances of winning. Would Ryuuen make such a huge sacrifice simply to defeat me and bask in his superiority?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo matter how hard I thought, I couldn’t find any benefits in such an ineffective plan. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you thinking?” Ryuuen-kun asked. He leaned toward me, hands in his pockets, looking as though he saw right through me. “We can keep going back and forth on this, but it won’t settle anything. Isn’t that right, Kinoshita?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen-kun was practically forcing Kinoshita-san to speak.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita-san…” Kinoshita hesitated. “When I fell, you said…that I definitely wouldn’t win.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I said no such thing. Why are you lying?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita, you only looked behind you when you raced with Kinoshita. Why did you do that?” Chabashira-sensei asked me again.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I admit that I looked back at her. But that was only because she kept calling my name when she was behind me. At first I ignored her, but then I thought something was strange, turned, and looked back.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that true, Kinoshita?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis time, Chabashira-sensei directed her question at Kinoshita-san rather than me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I never called her name,” Kinoshita said, denying it completely. “Not once.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She denies it, sensei. Besides, even if Kinoshita \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e call Suzune’s name, what’s the big deal? That doesn’t constitute foul play. It was probably a cry of desperation, born from a desire to win. I mean, Kinoshita has way more spirit than anyone else. She’s strong-willed and hates to lose. That’s not a crime,” said Ryuuen. “If you reacted to stuff like that each and every time, there’d be no end to\u0026#160;this.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis argument would go on forever. Besides, I was positive that Ryuuen and Kinoshita had rehearsed this whole act in secret.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um…Kinoshita-san, Ryuuen-kun, I think this is all just bad luck. I can’t imagine that Horikita-san would deliberately hurt her opponent.” Kushida-san spoke up quietly in my defense.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But Horikita-san said that she definitely wouldn’t let me win! She said that!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t you think your desire not to lose just got to you? I mean, I think that Horikita-san was really upset when she fell. I think she was just trying her best,” said Kushida.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t say anything. I endured in silence. However, Kinoshita-san spoke again.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t forgive Horikita-san for this. Now I have to take a break from track and field practice,” she said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t you feel any shame at all?” I asked. “Is lying like this to entrap someone fun for you? Or did Ryuuen-kun devise all this? I can’t imagine it was coincidental that he just happened to show up right now.” Kinoshita-san was lying. I couldn’t accept the legitimacy of her claims just because she was in tears. I needed to wrest control of the conversation from Ryuuen before things got worse. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re ignoring your own wickedness and saying it’s \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003emy \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003efault that Kinoshita got hurt?” Ryuuen asked me. “You really are a piece of work, aren’t you?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please. You messed with Sudou-kun earlier. Don’t pretend you forgot about that. You’re just trying to use the same trick this time around.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I had nothing to do with that. It’s ridiculous to try and tie those things together, anyway.” Ryuuen wasn’t about to admit anything. “It’s clear you did this, isn’t it? You bumped into Kinoshita deliberately. It’s an open-and-shut case. There’s no room for any further debate, so let’s report this to the higher-ups right away.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s… Would you let me talk things over a little more with Horikita-san, please?” Kushida begged Ryuuen-kun. I wanted to tell her that concern was unnecessary, but I didn’t want this issue to get more out of hand. I was trapped in a spider’s web, and all I could do was struggle. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen-kun appeared to consider her request, then made a proposal.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t have the time to drag this out,” he said. “The recommended-participant competitions are coming up right after lunch. I’ll be competing in those, so I’d like to finish this. It’d be easiest to leave the judgment to the higher-ups.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLooking at me, Kushida-san, and Kinoshita-san, Ryuuen-kun continued. “We can strike a quick deal, though.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Strike a deal?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You should compensate Kinoshita and Class C for any losses.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This isn’t a joke. I don’t have to listen to this,” I replied. If he wanted that, the cost wouldn’t be cheap. Besides, it would mean accepting their lie as truth.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You won’t strike a deal, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eand\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e you don’t want us to report this to the higher-ups? No way; that’s way too convenient for you. We’re done here.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What exactly do you want, then?” Kushida-san asked Ryuuen-kun.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At least one of you has a good grasp of things. Let’s see. If you hand over a million points, I’ll have Kinoshita withdraw her complaint. That way, we can prepare a substitute for the recommended-participant events, and Kinoshita will receive some incidental income. Simple, right?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t be ridiculous,” I said. “I haven’t done anything wrong. I don’t need to pay one single point.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then go ahead and prove that, Suzune. Lay it all out in black and white for us.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You two sound sure of yourselves. You think your lies won’t be exposed?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We can prove that we aren’t lying. Let’s hurry up and have the student council president render his judgment,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen-kun knew about my relationship with the president, my older brother, and was provoking me. I\u0026#160;absolutely couldn’t do anything to trouble my brother. If the rumor spread that his little sister deliberately hurt someone, it would do immeasurable damage to his reputation. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a dirty trick, but there was no way out of it. Back when the boys from the basketball club had attacked Sudou-kun, they lied and pretended to be victims. Their mistake had been thinking that no one else was watching. However, this was different.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis time, the entire student body was a witness. Ryuuen had the advantage. Kinoshita-san was just as athletic as I was, if not more so, and there was video evidence that showed me looking back. Also, Kinoshita-san had planned to take part in all the recommended-participant events. She’d sustained injuries severe enough to prevent her from competing. There was nothing I could do to save myself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWorst of all was the timing with which they’d sprung their trap, which had been better than I had imagined. They hadn’t done it right after Kinoshita-san was injured. Instead, Ryuuen had her lay low, so that her performance would be more convincing. By having her stoically bear the pain, they made their plot look like the truth.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, she was unable to endure the pain, so she withdrew. Afterward, she secretly told others that I had deliberately caused her to fall and pretended to be afraid of facing retaliation from me. That was their plot. After coming here, I was certain of it. Everything they’d done had been meant to ensnare me, as though they were weaving a net to catch me in. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe situation had already passed the point of no return. They’d been plotting since the moment I entered the festival. I understood the full extent of my mistake now, although I still felt baffled by the many remaining mysteries.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um…could I use my points, Ryuuen-kun?” Kushida-san asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t believe Horikita-san would do something like this on purpose. That’s why I don’t want this to turn into a big deal. But…I don’t think Kinoshita-san would lie, either. Couldn’t it just be an unfortunate accident?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, that’s quaint. Sorry—using your points is a no-go. I believe Suzune did this out of malicious intent, to hurt Class C. This apology is meaningless unless we get money out of her. Of course, I won’t stop you if you’re willing to pay up too,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe longer this went on, the worse things would get. But I couldn’t break.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Very well. Kinoshita, we’re going to report this to the teachers, then to the student council.” Ryuuen-kun ordered, as if to snap her awake. Kinoshita, her face twisted in pain, sat up. “The school officials should understand how serious this is,” he added. “They certainly wouldn’t stand for something so mean-spirited and vicious.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had to choose. I could pursue the truth, disputing Ryuuen-kun and his lackey’s claims. Or I could compromise right here. I wanted to do the former, but I had no evidence to prove the truth. I would only be wasting time and everyone’s trust.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had to strike a deal with Ryuuen-kun right here.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait.” I squeezed out the word.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen-kun and Kinoshita-san stopped walking. “What is it, Suzune?” he asked. “Have anything to contribute?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I pay you, you’ll make it so this issue never happened, right?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re admitting to foul play?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, because I’m not a liar.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, why exactly are you paying us?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your strategy beat mine. That’s why,” I said. It was humiliating, but it was true. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you hear that, Kinoshita? She doesn’t think she’s in the wrong. Can you forgive her?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I can’t,” Kinoshita-san replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, there you go.” he told me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Grr…” I growled.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Still, I know that you have your pride, too,” he added. “I understand that you don’t want to admit you’re the bad guy in front of your teacher and your friend. That’s why I’ll accept your offer. I have a kind heart, after all. However, whether Kinoshita will accept your apology is another story.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe flashed me a wicked grin. He was pulling all the strings here, toying with my emotions. I wanted to be free of this.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I pay you a million points, you’ll act like nothing ever happened. That’s what you said. No other conditions, right?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That was certainly the previous offer. You declined it once, right? If we’re going into a second round of negotiations, I have more conditions.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust how much did Ryuuen-kun intend to torture me?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How about you get down on your knees and beg? Maybe then my feelings, and Kinoshita’s, will change.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ryuuen. This is going too far.” When Ryuuen asked me to prostrate myself before him, Chabashira-sensei finally spoke up.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Teachers should stay out of this. It’s a problem between students,” Ryuuen-kun replied. He showed no fear at all. “Well, I won’t force you to decide right away,” he told me. “The teachers are watching us, too. I’ll wait to hear your answer when the sports festival ends. Will you kneel before me and offer a million points, or will you let the school deliberate? Which will you choose?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe added, “Don’t think that this ends with the sports festival, either. I’m not done with you yet; I’ll bring it up as many times as it takes. Kushida, bring Suzune to me after the festival.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen-kun and Kinoshita-san both left. I stood there, at a loss.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you okay? Horikita-san?” Kushida-san asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m okay. More importantly, how long has it been? Sensei, how much time is left for our lunch break?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You still have about twenty minutes. You haven’t eaten yet, right? You should hurry up,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI hadn’t realized it was already so late. It wasn’t awful, but I didn’t have the time to sit down and eat now. I had to find Sudou-kun as soon as possible.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Excuse me.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI left the two of them behind and ran from the nurse’s office.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e7.2\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHIS WAS ALL\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e due to my carelessness. I’d only thought of myself. I hadn’t anticipated that Ryuuen-kun would get hold of our participation table with the primary intention of taking me down. I wasn’t prepared.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was confused and miserable, unable to come up with a solution. My stride felt heavier than before.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m so pathetic.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIndeed, I really was pathetic. As I approached the school entrance, I saw two people walk inside. I ordinarily would have ignored them, but these two were different.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Big brother…” I barely whispered it, my words quickly disappearing into the ether. Perhaps he heard it, perhaps he didn’t. The school’s student council president, my older brother. With him was a girl from the student council, Secretary Tachibana.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTachibana noticed me, but my brother didn’t even glance my way. I was used to that treatment from him. Honestly, I wanted to talk to him, but as a Class D disgrace, I didn’t have the right. I cast my eyes downward. My brother wasn’t going to stop for me, anyway.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt least, that was what I thought. But then…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you understand Class D’s situation right now?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was speaking to me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m starting to,” I responded.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was an honest answer. I’d done everything wrong, made every mistake. In every possible way, Class C had outsmarted me. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry. I won’t bother you, big brother.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had to avoid that at all costs. This situation was the result of my own failure, so I’d do what I had to do. Ryuuen wanted me to kneel before him and offer up a million points. Considering that Chabashira-sensei had witnessed that whole thing, he probably wouldn’t change his mind at the eleventh hour. I was all right with that, as long as it meant I wasn’t causing trouble for my big brother. But I wanted to have a proper conversation, not something like this. I’d hoped to have that chance during the final relay. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat dream had vanished when I injured my leg. I\u0026#160;couldn’t expect any sympathy from my brother, even after informing him of my suffering. I had to face things head-on. Now that I’d endured this much, I had nothing left to lose. Besides, there was still one last thing I could\u0026#160;do.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please excuse me,” I said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI rushed through the entranceway and headed outside. Despite the pain in my leg, I ran everywhere, looking for Sudou-kun. However, it would take more time than I had to scout a campus this large. When only ten minutes remained, I returned to the field. Maybe Sudou-kun had come back after all. He’d been trying his hardest to take first place out of the entire school. I hoped he still wanted\u0026#160;that. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut it was no use. He wasn’t on the field.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, he didn’t come back.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I thought about places I still hadn’t checked, my mind went to the Keyaki Mall and the dorms. He also could have been somewhere in the school building. It was proving to be very difficult; I couldn’t seem to find\u0026#160;him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen, he…Ayanokouji-kun…appeared right before me. I wondered if he had finished eating his lunch.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You sound like you’re out of breath,” he said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m looking for Sudou-kun. He hasn’t shown up, has\u0026#160;he?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nope. Does this mean you want to talk to him?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. He’s a valuable asset. I accept it, even though I don’t like it,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And that means?” Ayanokouji-kun seemed to notice how poorly I was doing, but there was no use telling him about Ryuuen-kun. What could he have done, anyway? I wanted to keep that embarrassment between Kushida-san, Chabashira-sensei, and myself. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOur break was nearly over, but no one had seen any sign of Sudou-kun. Class D was in dire straits already, but in Sudou-kun’s absence, our defeat became a certainty. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you have any idea where Sudou might be?” Ayanokouji-kun asked me. “Time is almost up.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I don’t. But there’re only so many places he can go. If he wants privacy, he probably returned to his dorm room,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is your leg all right?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, but I can run. Are you coming?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll pass. I’d only end up getting in your way.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see.” It might be more convenient for me as well. I\u0026#160;swallowed the pain and started walking.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_13\" src=\"/hola-lector-agua/images/books/v5/OEBPS/Images/INTERIORIMAGES_13.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 7: For Whose Sake?\",\"volumeId\":\"v5\",\"chapterIndex\":13,\"prevChapter\":{\"volumeId\":\"v5\",\"chapter\":12,\"title\":\"Chapter 6: The Curtains Rise\"},\"nextChapter\":{\"volumeId\":\"v5\",\"chapter\":14,\"title\":\"Chapter 8: What You and I Lack\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Title Page\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Sudou Ken's Soliloquy\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: The School Sports Festival Begins\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: Class D's Objective\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: Everyone's Calculations\",\"href\":\"Text/section-0008.html#auto_bookmark_toc_top\",\"index\":10},{\"label\":\"Chapter 5: There's a Reason for Their Relationship\",\"href\":\"Text/section-0009.html#auto_bookmark_toc_top\",\"index\":11},{\"label\":\"Chapter 6: The Curtains Rise\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_top\",\"index\":12},{\"label\":\"Chapter 7: For Whose Sake?\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_top\",\"index\":13},{\"label\":\"Chapter 8: What You and I Lack\",\"href\":\"Text/section-0012.html#auto_bookmark_toc_top\",\"index\":14},{\"label\":\"Chapter 9: The Turning Point\",\"href\":\"Text/section-0013.html#auto_bookmark_toc_top\",\"ind
