[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T12dcd,"])</script><script>self.__next_f.push([1,"\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 9:\u003cbr/\u003eThe Turning Point\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE LAST EVENT\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e of the sports festival, the 1200-meter relay, was about to begin. Everyone—other than Class\u0026#160;D—was amped.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The final event, huh? I guess we need to choose a substitute for this one, too.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh…! Puh…! Hey, sorry to keep you all waiting! What’s going on?” Sudou, completely out of breath, returned with Horikita lagging slightly behind him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sudou-kun, you came back!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, sorry. My bad. It took way longer to take a dump than I thought.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou looked as if he was in a bright, cheerful mood—all smiles. However, many students glared at him icily. He didn’t flinch from their stares.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry. I punched Hirata and crashed our morale because I lost my temper. It’s my fault that Class D is about to lose,” he continued before anyone could blame him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou bowed deeply. The Sudou of an hour ago couldn’t have done that, even if it were an act. Something must have happened. After a stunned moment, Hirata laughed happily. His cheek was slightly swollen, and looked painful, but he didn’t seem to care about that.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The heck, Ken? This isn’t like you,” said Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I gotta admit, I did somethin’ wrong after doing somethin’ wrong. I want to apologize to you, too, Kanji,” Sudou replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not like it’s your fault I lost or anything. I’m just no good at sports, really. Sorry I wasn’t useful,” said Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOne apology gave way to more. The students who’d been glaring at Sudou really hadn’t been able to perform as well as he had.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you haven’t decided on a sub for the relay, please let me run,” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re the only person we’d want doing this, Sudou-kun. Right, everyone?” said Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBoth guys and girls would run the final 1200-meter relay. Three guys and three girls from each class had to participate.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can I ask for a substitute? I wouldn’t run very well with my leg like this,” said Horikita. She sounded apologetic.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you okay with that, Horikita?” Hirata asked. “You really wanted to be in this relay.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s nothing I can do about it. In the state I’m in right now, I’m not sure I could even win against Ike-kun. Sorry,” Horikita replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe bowed deeply, as Sudou had done earlier. I wondered if she’d ever been that honest before. Ryuuen had crushed Horikita’s body and spirit. She’d craved the anchor position, reached for it, because she envisioned herself running alongside her brother. Now—though her hands trembled in apparent frustration—she accepted the reality that, if she forced herself to compete, then Class D would lose the relay. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata nodded, and decided that Kushida would take Horikita’s place. Our list included Hirata, Miyake, Maezono, and Onodera, with Sudou at the top. With Kushida as Horikita’s replacement, that made six people. There really weren’t any other sprinters in Class D who stood a chance. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter confirming the team members, Hirata and I locked eyes. He opened his mouth to speak. “Um, I apologize for the suddenness of this, but…” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, some other guy cut Hirata off. “Sorry, but…would you please let me withdraw, too?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMiyake was speaking. He looked as though he was dragging his right leg a little.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To tell you the truth, I twisted my ankle before lunch during the 200-meter dash. I thought it would feel better after I rested, but it still hurts.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, we still had students who had sustained injuries.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, it looks like we’ll need a replacement from the boys as well.” Hirata looked around, but no volunteers came forward. Clearly, no one was confident enough in their speed. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI decided to speak up. “In that case, would it be okay if I ran? I’ll pay the points to go in as a substitute, of course.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You will, Ayanokouji?” Miyake asked. “Wait, though. Are you that fast?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo one really thought that I was, of course.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I support him. I’ve been watching everyone, and I think Ayanokouji will do well,” said Hirata. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was all it took to shut down dissenting voices. As he was someone who had earned the trust of his peers day in and day out, Hirata’s words had weight.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, we can’t really say that Class D is putting forward its best runners,” Hirata said. “That’s why getting a head start on the competition should be our strategy. What do you think, Sudou-kun? If you get us off to a good start and overtake the other runners, I think we might be able to put some distance between us and the other classes. I’ll maintain that lead and make sure the next student keeps things going.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt last, it was time for the final relay. Lanes couldn’t be prepared for each of the twelve competing students, so we had to start side-by-side. The rules stated that you could take an inner lane from an opponent after you overtook them. In other words, your initial position was the most important one. If you could get ahead of the others during the starting dash, you wouldn’t end up in a chaotic free-for-all.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, guess we don’t got much choice. There ain’t any other way for us to win,” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe would go first. Hirata, sufficiently speedy himself, was second. After that the three girls—Kushida included—would have their turns, and then I’d go last. Class D must have been counting on me more than I expected, to have made me the anchor. They must have wanted me to make up for the slower students before me; it would save us some time.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe chosen elites assembled in the middle of the field. Horikita’s older brother, and that second-year student Nagumo, were among them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re leaving it all to you, Sudou-kun!” shouted Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida and the other runners also cheered. Sudou, looking motivated, got into his lane. The first-year students appeared to be in a slightly advantageous position, since Class D had the innermost lane. They’d arranged it so that the third-year Class A students were in the outermost lane. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were three girls on the lanes for the third years, so one might imagine we would have an overwhelming starting advantage. The excitement was finally reaching its peak. Class D didn’t have any chance of winning the festival, but if we were victorious here, it might help us down the line. That was the hunch people had, at least. Supportive cheers came roaring from our camp.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Man, that was close. A couple seconds more, and I would have withdrawn,” said Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. Miyake’s injury was unexpected,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe plan from the start had been for me to participate in the final relay as Hirata’s substitute. Of course, only Hirata and I knew about that.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is okay, right, Ayanokouji-kun?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. Sorry that you had to make all the arrangements.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s only natural for me. Besides, I’d hate it if Ryuuen-kun beat us again. Think he’ll be surprised that you’re running?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll do my best not to disappoint you. More importantly, though, let’s cheer Sudou on.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe instant the signal sounded, Sudou got off to a strong start. He didn’t look nervous whatsoever. His starting dash had the best time of any I’d seen thus far. He launched himself forward with such momentum that, after his first stride, he managed to pass eleven people. I\u0026#160;could tell that he was moving at an incredible speed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoa!” the racers shouted. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dude, he’s so fast!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven Shibata, who had been standing beside me, was so impressed that he had to praise Sudou. The second-year guys and girls were left to struggle desperately for a position, and got caught up in a chaotic free-for-all. Sudou, taking advantage of that opening, continued to leave the others in the dust. When he finished his leg of the relay, he’d secured an advantage of at least fifteen meters.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s up to you, Hirata!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass D brimmed with excitement. Sudou passed the baton to the next runner, Hirata. As a man who excelled in both studies and sports, he was glorious. The racers chased Hirata, one after another, but they couldn’t reduce the gap we’d created. We maintained our lead as we transitioned to the third runner, Onodera. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was where problems might start. For a girl, Onodera was fast, but the guys chasing her were starting to close in. A guy from the second-year Class A overtook her as she ran.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNew students ran one after another. One third-year Class A guy also passed Onodera, and other third- and second-year Class A students after that. By the time Onodera passed the baton to our fourth runner, Maezono, our lead was almost gone. Despite our hopes for first place, our upperclassmen were truly strong. That was the competition for you, huh?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, the race was full of surprises. A girl from the third-year Class A, who was her team’s fourth runner, took a spill and fell about fifty meters behind the runner she was supposed to pass the baton to. Panicking, the girl tried to get back in the race, but a Class A second year took advantage of that opening and created a significant gap. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBy the time Maezono passed the baton to Kushida, our fifth runner, Class A had overtaken Class D, and we’d fallen to seventh place. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, the other classes surpassed our abilities, eh? I had set my sights on the winner’s podium, but this was really becoming an arduous battle.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe first-year students just couldn’t compete at the same level as the seniors. Only Class B’s first-year students had managed to get into third place, and their ace, Shibata, had apparently received the role of anchor. He was waiting his turn, just like me. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs the fourth runner from the third-year Class A tumbled, the situation between the guys in the anchor positions changed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks like victory is ours this time, President Horikita. I would’ve liked to run against you directly, if possible.” Nagumo laughed as the second-year Class A’s top runner approached him. There was a thirty-meter gap between him and the third-year Class A student in second place. If they were equal, there was no way for the second-place student to clinch it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks like we’re going to win in overall points, too. Guess this is the dawn of a new era, eh?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you seriously plan to change this school?” the student council president asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re too traditional. And even though you’re strict, you’re weak. Your rules are too generous, and they stop people from getting expelled. All I’m going to do is help make this school the ultimate meritocracy,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_17\" src=\"/hola-lector-agua/images/books/v5/OEBPS/Images/INTERIORIMAGES_17.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe walked forward as he spoke, getting in position to receive the baton as it came his way. Not too long after Nagumo nabbed it, Shibata also received his baton. “All right! Nice! Leave the rest to me!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFire blazing in his eyes, Shibata chased down Nagumo. My eyes met Horikita’s brother’s for an instant. I could tell this man was fighting some internal struggle.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To think that you’re the anchor,” he said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m just a substitute for someone who’s been injured. Originally, your sister planned to be in this position,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. I suppose she’s struggling to make it through,” he responded.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita had probably dreamed of running alongside her brother Manabu, even for a moment. While she couldn’t have a conversation with him, she may have at least told him how she felt.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve observed your class,” the student council president told me. “Up until a short while ago, I thought there was no hope for you. However, I don’t get that impression from you at all in this relay. What happened?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t really need to pay attention to first-year Class D, though. Right?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I keep an eye on every class. No exceptions,” he replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose, if anything’s changed, it would be your sister.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see.” No look of surprise. He looked as composed as always. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll ask you one thing. What about you? I can’t feel any excitement from you.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not interested in the sports festival. I already know the outcome.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe class’s feelings.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou’s feelings.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita’s feelings.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had no interest in any of those. All I had was a single premonition.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You probably won’t be around to see this, but our class will become stronger,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not interested in such a fanciful future,” Horikita’s older brother replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe shifted his gaze toward his teammate, who was drawing near.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI spoke. “In that case, would you be interested in learning exactly what kind of person I am?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe should’ve been getting ready to start running. However, just as I had expected, he stopped. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’d like, I’ll race against you seriously,” I added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You really say some interesting things. Did I have the wrong impression of you? I thought you hated standing out or getting involved. You seemed like you’d just watch things play themselves out. Why change that now?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you give up your chance at second place in order to race me, I’ll accept your challenge. It’s not often that a first-year and third-year have the opportunity to compete like this, is it?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita’s brother stood still and turned to face me. “Interesting.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe didn’t seem as though he was going to move at all. His team’s fifth runner passed him the baton, looking perplexed, but the older Horikita took it and stood completely still. “You did well. Great work,” he said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh, thanks. Hah…” The third-year student left in a mild state of shock. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone in the audience noticed this bizarre spectacle. One after another, other runners passed the third-year Class A, and Horikita just stood there. Finally, Kushida approached me at full speed. She’d be here in seconds. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll say one thing to you before we race.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?” Horikita’s brother asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs the two of us got ready, I said only, “Run as fast as you can.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI got the feeling that the older Horikita, whose face was in my peripheral vision, wore a slight smile. Finally, the baton passed to me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun!” Kushida cried.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI bolted down the track at full throttle. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d never, ever run seriously in my entire life. Until then. It was as different as could be from all the times I’d run in that cold, sterile room. It was still only the beginning of October, but the cold wind washed over me. I didn’t really care about overtaking the runner in front of me. All that mattered right now was competing against the man next to me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe ran at full speed, almost as though we were cutting through the wind, and closed the distance between us and the frontrunners.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoa! No way!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe passed a shocked student and left him in our dust. I could no longer hear the cheers. Strategies and resourcefulness were irrelevant. There was only this one-on-one battle against Horikita Manabu, who ran next to me. Beyond the first curve, beyond the straight line that followed, and then to the last curve.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAll right. I’m going to go even faster.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCheers that sounded like angry bellows resounded across the grounds.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e9.1\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003e“Y\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eOU WERE SUPER FAST.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter the competition ended, Karuizawa spoke to me, her eyes elsewhere.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wasn’t it just that my opponent was slow?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, no. No way! Can you really say that after seeing everyone’s reactions?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Jokes aside, I still didn’t beat the student council president in the end, did I?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, there wasn’t really anything you could’ve done about that. The runner in front of you fell down, after all.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTrue, we’d closed in at an astonishing pace. That guy had panicked and ended up blocking my path when he fell. I’d avoided hitting him, but the slight delay was a significant loss, and Horikita’s older brother had pulled \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eahead. I didn’t know what would’ve happened without that accident, but I didn’t really care.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt the very least, I was certain that I’d probably gathered the whole school’s attention during the final competition. Many students looked at me with puzzled expressions.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji! You really are super fast, dude. Whoa! Have you been holding back until now?!” As he came running up, Sudou slapped me on the back with all his might. It really hurt.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Running’s pretty much my only specialty, but I overdid it. That’s the power of being fired up, huh?” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNot just Sudou, but several other students who were surprised at my efforts came up to me to chat.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That still doesn’t explain it, though. That \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003espeed\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. You liar.” Horikita walked up to me, still dragging her leg slightly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You guys, this isn’t how you should treat a soldier who fought with everything he had,” I whined. Horikita jabbed my abdomen. “Ow, that hurts!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa moved out of the way, so as not to get between Horikita and I. Sakura was also looking at me from afar, but because there was a big crowd around me at this point, she didn’t get close.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’d run like that from the very beginning, this situation would’ve been different. But why go so hard? Now you’re going to be basking in lots of attention,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was right. Unlike Hirata or Shibata, students who were already acknowledged as being fast some time ago, or Sudou, who had been seriously giving it all since the very start of the sports festival, I had been entirely half-assing everything. The gap between then and now would have some effect, sure, but it depended on your perspective. Still, it shouldn’t have been too hard to claim that the tampering with the participation table and keeping me in reserve were part of Hirata and Horikita’s strategy, masterminded behind the scenes. That tactic was particularly effectively against someone like Ryuuen, who tried to outsmart his opponents. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks like they’ll announce the results soon. Let’s get going.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe results would be announced during the sports festival’s closing ceremonies. All the students looked toward the gigantic electronic scoreboard.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’ll now announce the results of this year’s sports festival!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Red Team”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e and \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“White Team”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e were displayed as separate entries on the scoreboard. The tallied numbers started to rise, showing the total points the teams had acquired from all thirteen events. The winning team was…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe words \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Red Team Wins”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e appeared on the board along with the team’s score. The competition had been incredibly arduous, but the Red Team D/A coalition appeared to be victorious. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Next, we will announce each class’s overall points.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe board divided the twelve classes into three categories, and it displayed the overall points for each class all at once. We didn’t really care about the details of the second- and third-year scores. What was crucial for us was Class D’s position. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“1\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 0.75em; vertical-align: super;\"\u003est\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e Place: First Year, B Class\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e2\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 0.75em; vertical-align: super;\"\u003end\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e Place: First Year, C Class\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e3\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 0.75em; vertical-align: super;\"\u003erd\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e Place: First Year, A Class\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e4\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 0.75em; vertical-align: super;\"\u003eth\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e Place: First Year, D Class”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugggh! I knew it! We lost!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I thought things would end this way.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe were overjoyed that Red Team had won, but apparently, us first years had dragged the team down significantly. That was probably inevitable, though. Two absentees, Kouenji and Sakayanagi, had factored majorly into that. The second- and third-year Class As took first place with overwhelming leads. Their Class Ds secured second and third place, which indicated stability. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnfortunately, even though we’d won as part of the Red Team, the first-year Class A only placed third in terms of overall points. That meant they’d be hit with a fifty-point penalty. Because Class D had come in last place, we faced a 100-point penalty. Since the White Team had lost, Class C would also lose 100 points. Class B had won first place in terms of overall score, and so gained fifty points; however, they would also lose fifty points because the White Team lost. None of the classes had really won.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone was thoroughly exhausted and overwhelmed. Even though we’d tried our best, our class points had decreased. Of course, the students who had won individual competitions would have an advantage on future tests, so the sports festival wasn’t completely pointless.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Lastly, we will announce the MVP for each school year.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was probably the part that Sudou was most looking forward to. If he could take first place, Sudou would likely be all smiles, since he would get permission to call Horikita by her first name.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, the words \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“First Year MVP: Shibata Sou” \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eappeared on the electronic scoreboard.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Gaaahh! I knew it!” Sudou let out an agonized cry. Shibata had consistently taken first or second place in each of the events. Sudou placed first in all his individual competitions, but being absent must have had a major influence on the results. The fact that we lost a heavily weighted event like the relay was probably a big part of it, too.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou continued staring at the scoreboard in apparent frustration even after the closing ceremonies ended.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You didn’t take the top spot for our school year, Sudou-kun. You remember our promise, right?” Horikita asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah,” Sudou replied. “It’s unfortunate. But a promise is a promise. I’ll call you Horikita from now on.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your dedication is impressive.” Horikita laughed in a slightly teasing way. “I forgot to tell you one thing, though. You pushed those conditions on me, so they were rather one-sided. I never mentioned whether I had any conditions of my own.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whaddya mean?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you took first place, you could have used my first name. Isn’t it only natural that I make a request of you in return?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah. I guess so.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, I’m going to give you a penalty for not achieving your goal. You are forbidden from ever using violence without a justifiable reason ever again. Can you promise me that?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s my punishment, right? I promise,” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course, you’re not the one who gets to decide what a ‘justifiable reason’ is. That’s up to me or a third party.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou obediently accepted that condition as well. He might have realized his own foolishness and decided to act more mature. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita slowly turned and started to walk away, then stopped.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, that reminds me. During the festival, I wasn’t able to live up to everyone’s expectations, either,” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? That’s just ’cause you were injured, though. Nothing you could’ve done about that,” replied Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Be that as it may, I can’t forgive myself. I need to be punished, too,” said Horikita. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter she said that, she turned around and spoke up once more.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, if you want to call me by my first name, I don’t mind giving you permission.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? H-hey!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s my punishment.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was Horikita’s compromise.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even though we did get last place, I have hope for the battles to come, thanks to you. I’m truly grateful,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou bashfully rubbed his nose, as if he blamed the setting sun for the redness of his cheeks.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“OH YEEEAH!” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith an impressive shout, he raised both arms to the sky, as if to let out all of his exhaustion at once. “The sports festival is the best! It’s the best, Suzune!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m happy for you, Sudou.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry about cutting in while you’re celebrating, but do you have a minute?” someone asked as we headed back toward the school.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was a calm, composed girl. I didn’t know her name, but she was a Class A student I’d seen back in the cavalry battle.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Would you mind coming with me after you finish changing?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why me?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because I have something to talk to you about. At five o’clock, go to the front gate.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-hey, Ayanokouji. Wh-what’s going on, dude?” said Sudou. “What’s this?!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor a moment, I imagined that the request would lead to something like a romantic confession. However, I didn’t get that kind of impression at all from this girl.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, what do you mean?” I asked. But the girl left without paying me any more attention.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What was that? Has springtime come for you, too?” Sudou asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It doesn’t look that way to me.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, there’s a chance that girl fell in love with you after she saw you run as the anchor.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For crying out loud,” I huffed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy heart wasn’t hard enough to ignore being called out like that. After the girl—whom I didn’t know very well—walked off, I changed into my uniform in the locker room and returned to the classroom. Half of the students were already on their way back because we’d been ordered to disperse during the closing ceremony. Horikita, now also clad in her uniform, entered the classroom slightly later than I did and sat next to me. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This time, we were defeated soundly. Completely.” Yet, as Horikita said that, she didn’t appear depressed. “But I feel like I grew today. I never imagined a day would come when failure would nourish me, but…that’s really how I feel.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. If you grew from it, then that’s good, right?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This class is going to get stronger. Then we’ll definitely climb the ranks to the upper classes,” replied Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Honestly, this optimism is kind of freaking me out. It’s not like you,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose not. It’s different, isn’t it?” She bashfully averted her eyes, possibly perplexed herself. “We’re facing a ton of challenges. There are also problems I need to take care of. But I suppose, first of all, I have to get down on my knees.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“On your knees?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe phrase concerned me, but Horikita didn’t expand any further. “It doesn’t involve you. Thank you for today,” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e9.2\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE STUDENTS\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e having used up all their energy during the festival, began to leave the classroom one after another, looking completely drained. Because there weren’t any club activities today, Sudou-kun left while chatting with Ike-kun and the others. Ayanokouji-kun must have been heading back as well, since he got up from his seat rather quickly. He looked over at me, so maybe he was curious about what I was up to.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re not going back yet?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. I’m…well, I have some trifling matters to take care of,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You usually head back right away, though. This is unusual.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, these things do happen. Thank you for everything,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure. See you tomorrow.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone left the room one by one, and before I knew it, I was the only person left. Why? Well, it went without saying that I was prepared to respond to Ryuuen-kun. During the sports festival, he had me dancing in the palm of his hand. By the time I had realized what was happening, it was too late. With no planned countermeasures in place, I was thoroughly defeated.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut, somehow, I felt cheerful. I also felt as though I’d been thoroughly crushed. I understood that I was much, much more pathetic that I’d imagined, and I felt I needed to thank Ryuuen for teaching me that.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe debt that I needed to pay was by no means a small expense. It wasn’t just me; a lot of students had to bear that burden. The fact that I had to transfer one million points over to Class C meant that I needed to keep the possibility of struggling in the future a secret.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry to keep you waiting, Horikita-san. I got caught up talking with a friend.” Kushida-san came back in, putting her hands together in an apologetic gesture. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s fine. We still have a little while before the appointment. Shall we go?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e9.3\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003e“S\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eO, YOU DIDN’T RUN AWAY\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Suzune. You came,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I had run away, I truly would’ve been hopeless. I’m going to face my problems,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve got a good heart. You’ve become a finer woman than before,” said Ryuuen. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wasn’t exactly pleased to hear that from him. “Before we talk, why don’t we put an end to this ridiculous charade, Kushida-san?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Charade? What in the world do you mean?” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs the setting sun colored the school building, I stared directly at her. “If you want to pretend to be a good person, I don’t particularly care. But you’re not, are you? You leaked the information. That’s how Class C was able to \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003epull off what they did. That’s why I’m here right now, like this, with Ryuuen-kun. Am I wrong?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, now. Who did you hear that from? Hirata-kun? Ayanokouji-kun?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Neither. These are my own feelings on the matter. I couldn’t shake off my uneasiness. Ryuuen-kun’s the only one here right now. Don’t you think it’s time we cut to the chase and confront each other?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Confront each other? What do you mean?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Way back at the start of our first semester, I saw you trying to convince Kouenji-kun to give up his seat on the bus. To be completely honest, I didn’t recognize you. But immediately afterward, I remembered.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI looked Kushida-san square in the eye as I spoke. If\u0026#160;she was working with Ryuuen-kun, she’d continue to conspire against me. The only reason she hadn’t yet acted more directly was that she thought she didn’t have\u0026#160;to.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kushida Kikyou-san, you attended my junior high,” I\u0026#160;said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor the first time ever, I saw her expression change, but then another smile crept onto her face.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course you remember. I was quite the problem child, I suppose,” Kushida-san replied. She lowered her eyes in silence.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think that’s entirely accurate. You weren’t a problem child. Everyone trusted you, just like everyone in Class D now trusts you. But—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can you please stop? Stop bringing up the past.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose. It’s meaningless to talk about what’s already been done,” I replied. Ryuuen-kun smiled while he listened to our conversation, looking as though he was enjoying himself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, you understand what I’m after, right? You know what I want to do?” Kushida-san asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. I’ve already realized what you want. You want to chase me out of this school. Aren’t you taking quite a large risk, though? If I exposed the truth, you’d lose your popularity.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Me or Horikita-san? It’s obvious which of us is more loved. I suppose you could say I’m someone who hedges her bets,” Kushida-san replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if no one believed what I said, there’d still be lingering doubts. You can’t deny the fact that we attended the same junior high,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose you’re right. But if you do happen to tell anyone about me, I will hunt you down. That is, I’ll drag the brother you so love and respect into this,” she said.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_18\" src=\"/hola-lector-agua/images/books/v5/OEBPS/Images/INTERIORIMAGES_18.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI reflexively stiffened in response. That was the perfect defense against me. I already knew Kushida Kikyou’s past, so I feared that she really would get my brother involved if I incurred her wrath. There wasn’t a single opening I could exploit.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Kushida-san couldn’t take action easily, either. If she \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewere\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to openly involve my brother in all this, she’d know that I had nothing left to lose, and be afraid that I’d do anything in my desperation. That was precisely why she came up with this strategy to chase me out instead.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can’t you simply ignore me?” I asked. “You know I don’t involve myself with other people or stick my nose where it doesn’t belong, right?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For now. But there’s no guarantee for the future. I\u0026#160;want anyone who knows about my past to disappear, so that I can be me. Otherwise, I’ll be in trouble,” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Since Ryuuen’s seen your true face, does that make him your prey, too?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I suppose so, depending on the circumstances,” she answered. It was a bold move, since she and Ryuuen-kun were supposed to be allies.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh heh. What a shrewd woman. Well, I guess I decided to work with you because I like this side of your personality.” Ryuuen-kun snickered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let me tell you one thing, Horikita-san. I will have the school expel you. If I need to make a deal with the devil to do so, so be it,” Kushida-san said. She walked past me and stood next to Ryuuen-kun.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s really a shame, Suzune,” he told me. “Betrayed by such a trustworthy ally.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You were a step ahead of me this time, Ryuuen-kun. No…I suppose you’ve been a step ahead for a while. The test on the cruise ship, the one on the island, and the incident with Sudou-kun… I’ve just kept on losing and losing,” I told them. The words poured out of my mouth easily, without pause.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then I think the time for talk is over. The two things you’ll wanna do here are get down on your knees and give me those points,” he replied. “I’ll tell you this, though: Kinoshita running into you earlier was a total accident. She didn’t have any ulterior motive or ill intent. That’s just the way the world is. You know, like how people settle accidents outside of court.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Perhaps so. There’s no evidence, so it was obvious that I’d be framed as the aggressor,” I replied. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAn appropriate level of preparedness and power were required to claim innocence. This time, I just needed to admit it openly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But let me say \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethis\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, in turn. You were behind that incident. You ordered Kinoshita-san to make sure I took a fall. I’m sure of it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re delusional,” he answered. “That’s your persecution complex talking.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t care if I’m being delusional. But I’d like to ask you about the kind of trap you set for us at the sports festival. Why did you do it?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s quite a long process just to get you to kneel. If I had to imagine the kind of nonsense you’d come up with, I suppose this would be it.” Ryuuen-kun laughed as if he was enjoying himself. “Before the sports festival, I had Kushida get her hands on Class D’s complete participation table. I put the right people in the right places to ensure good matchups, and took the wins. Of course, that’s not all. I thoroughly researched Class A as well,” he added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Brilliant leadership. You beat us both,” I replied. Although they’d fallen short of Class B in terms of overall strength, there was no doubt that Class C had fought well. “But couldn’t you have won more effectively? To crush me, you pitted two of your aces against me, and even had one of them withdraw after she was injured. That’s incomprehensible.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh. I wanted to crush you. That was reason enough. I had no interest in winning the sports festival,” he replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But your strategy also relied on luck. Good for you. When you ordered Kinoshita-san to knock me over, two coincidences saved you. One, that I just so happened to be unable to continue participating, and two, that Kinoshita-san injured herself. You couldn’t plan for either of those factors,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was where the gears in my head had started malfunctioning because my world had fallen apart. If Kinoshita had only been slightly injured, the situation wouldn’t have gotten this serious.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your injury was coincidental, yes. If Kinoshita deliberately aimed to injure you, that would’ve been obvious. If she had messed up, then she would’ve suffered for it. That’s why I had her carefully practice hitting an opponent and making the fall look completely natural,” said Ryuuen-kun.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat had he done to make her obey him to that extent? Normally, someone would resist.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Actually, about Kinoshita’s injury,” Ryuuen said. “Do you really think it was an accident?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She certainly did fall, yes. But injuries that serious don’t just happen at the drop of a hat. That’s why I had her pretend to be in pain and then drop out of the sports festival. Before she got medical treatment, I injured her myself. Like this.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe stomped on the floor with all his strength. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eBAM!\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e The sound echoed unnervingly through the hall.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You injured…her?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She agreed when I told her that I’d pay her 500,000 points. Man, the power of money is a terrifying thing, isn’t it?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, he’d decided from the very beginning that Kinoshita-san would sustain a serious injury. His schemes, and his ability to execute them, were both terrifying. He’d do anything for the sake of winning, but I was shocked that he’d speak of that so openly. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is it really okay for you to just blab on and on?” I\u0026#160;asked him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I happened to be recording your confession, what would you do?” As I asked that question, I pulled out my phone.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you come up with that bluff just now?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I bet everything on it. Still, I’m surprised you told me so much.” I pushed a button on my phone and played back the recording from a specific point.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Before the sports festival, I had Kushida get her hands on Class D’s complete—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you complain about me, or demand that I pay you points or bow before you, I’ll use the evidence I now hold in my hands. If I do, which of us will be in trouble?” I\u0026#160;asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wha—?!” Ryuuen-kun’s smile disappeared for the first time. His words failed him. “Suzune…you…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t want to cause any panic. That’s why I’d like to settle things.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh heh! Ha ha ha ha!” Ryuuen-kun suddenly burst out in laughter. “You really are an entertaining woman, you know that? I said so from the very beginning, didn’t I? The contents of our current conversation are, at best, complete fiction. I was just humoring your delusions. All I did was anticipate the story you conjured up inside your own head,” he replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I could delete the part where you said it was a delusion and edit the recording, couldn’t I?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf the first half of the conversation was there, there would be no way to determine if it was the truth or a lie.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, in that case, I’d just have to hand over the original recording. Then there would be no problem at all.” Ryuuen, smiling boldly, took his own phone from his pocket. “Do you know what this is? The full audio recording, from beginning to end. In fact, I actually took video.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs he said that, he aimed his phone camera at me. It was a kind of insurance more reliable than audio. Ryuuen-kun had already imagined that I’d try betting everything on one final move…which meant that I was between a rock and a hard place.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I submitted the audio data to the school with the inconvenient first part of the conversation removed, there would be an investigation. Ryuuen-kun and his accomplices would be under suspicion, but it wouldn’t be possible to declare them guilty. If I tried to pass off his claims that I was delusional as truth, then I would be the one under scrutiny.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, do you admit it, Suzune? The reality of your defeat, I mean.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida-san also smiled boldly now. I fully understood what a fool I was. Ryuuen-kun wasn’t the kind of opponent that my strategies could take down. My last hope had ended up misfiring.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Abandon your pride and get on your knees, Suzune.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI quietly knelt. “I understand… I admit…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eDing\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e! A strange sound came from Ryuuen-kun’s phone, which was right in front of me. I thought he wouldn’t pay much attention, but for some reason, he looked at the screen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen-kun’s face stiffened for a moment. He started fiddling with his phone without even so much as glancing at me. Mixed together with a variety of other sounds, I heard a recording.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Listen up, you guys. We’re going to set a trap for Horikita Suzune. I don’t care what it takes to completely crush her. I\u0026#160;have a plan in mind. I’ll show you something interesting.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was Ryuuen-kun’s voice. Was it from a previous conversation? In the recording, he went into detail about what he’d so proudly explained to me just moments ago.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI heard Ibuki-san’s voice. It sounded like she interrupted Ryuuen-kun.\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e “Look, I’m not discounting your strategy or whatever, but give me a chance to fight Horikita.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen-kun’s voice again. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Run against Suzune during the obstacle course, and collide with her. Do whatever it takes to knock her over. Afterward, I’ll injure you myself and get you some money from her.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t know what in the world was happening right now.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s going on, Ryuuen-kun? What’s with that recording?” Kushida-san seemed puzzled.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. I see, I see. I see now! Heh heh! Isn’t that interesting? Do you know what this means, Kikyou? There’s a traitor in Class C, too. They made not just you and Suzune dance in the palm of their hand, but me as well. This person predicted everything, including your betrayal and Suzune’s debasement. Ha ha ha ha! Interesting! So\u0026#160;interesting! The person pulling the strings is incredible! The best!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eComplimenting the string-puller’s handiwork, Ryuuen-kun swept his hair back with a deep belly laugh.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You were used, Kikyou. They predicted that you’d betray your class and leak the participation table. They read us like a book.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, somebody anticipated the betrayal from the very beginning? Who could be responsible for this? Could it be Ayanokouji-kun? I mean, I didn’t think he was that fast, either,” said Kushida-san.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, he’s one candidate, but I’m not drawing any conclusions yet. Someone managed to get this recording without leaving a trace behind. Suzune, Ayanokouji, and—depending on the circumstances—even Hirata might have been positioned where they were because someone was puppeteering them. I’m going to investigate this thoroughly. I’ve failed to get points from Suzune or have her kneel, but I’m happy with all that I procured,” said Ryuuen-kun.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no doubting it. I didn’t know how he’d done it,
