ld. The strategy was simple, boiling down to “line up in order of height.” By doing so, we could apply our strength without any unevenness. The opposing team would see this, but even if they tried to imitate us, they couldn’t line up by height in such a short time span. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, our Class D/A coalition already had another problem. Unlike the guys in Class D, half the Class A guys didn’t budge an inch.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Katsuragi-kun, stop ordering us around,” said one boy.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean by that, Hashimoto?” asked Katsuragi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto took one step forward. A tall, somewhat distant-looking guy, he had his long hair swept to the back of his head. He wore a gentle expression, but he had harsh, cynical eyes.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Exactly what I said. It’s your fault that Class A is in a slump now. Are you sure this strategy will let us win?” asked Hashimoto.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto was officially challenging their leader, and I couldn’t imagine that he was acting alone. The timing was too strange. While Class A focused on Katsuragi and Hashimoto, I looked back toward our camp, searching for Sakayanagi. Sakayanagi, who’d been observing from the very beginning, wore a thin smile. Even from a distance, she could clearly see that the boys were fighting. It\u0026#160;could only mean one thing.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe instigated this whole situation. Perhaps she intended to do whatever it took to crush her opposition, Katsuragi. Her behavior was unsettling, but in a different way than Ryuuen’s. Personally, I found it inefficient.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you say, Katsuragi-kun? Can we really win?” asked Hashimoto.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite the fact that he’d been betrayed, Katsuragi didn’t appear to be panicking. “We’re upsetting Class D. We should proceed calmly,” he replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not an answer.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi had tried to calm them down, but the half of Class A following Hashimoto showed no sign of obedience.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Katsuragi-san’s telling you to do something. Hurry up and do it! Enough with the shameful behavior!” Yahiko, from Katsuragi’s faction, shouted at Sakayanagi’s faction. He thrust the rope toward one of the rebels.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand the doubts you might have about my leadership. But if we lose because of meaningless bickering, it won’t be our lack of cooperation or skill to blame. It will be Sakayanagi’s fault. Do you want that?” asked Katsuragi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You really are blind, huh, Katsuragi-kun?” Hashimoto sneered. The referee approached us, looking as though he was about to give us a warning. Hashimoto gripped the rope and settled into his designated position. “Shall we? Like you said, it would be \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eever \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eso annoying if we made you think we weren’t cooperating.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass A’s internal strife seemed to have subsided for the time being. We got into position.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Man, those Class A guys really are bloodthirsty, aren’t they?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m really, really worried now. They might just be a bunch of noodle-armed nerds, after all.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven Sudou could tell that Class A’s internal conflict was dangerous. At any rate, everyone followed Katsuragi and Hirata’s orders, and lined up in order of height. Sudou, the most confident in his strength, was the farthest back. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOn the opposing side, the B/C group didn’t seem to be cooperating, their forces cleanly divided by class. Class B took charge at the front of the rope, but they chose the strategy opposite ours, lining up with the tallest in front. Since Class C had lined up completely at random, their lineup would just fall apart. They did have some tough-looking students in the far back, I supposed, but I couldn’t shake the feeling that they were a mess.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh! Class B put their biggest dudes up way up in front. They just don’t get it at all, do they?” Sudou gloated.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wouldn’t necessarily say that’s true. When you’re pulling the rope, an elevated position is advantageous,” said Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCooperation between the two classes wasn’t possible, so instead, Class B aimed to take advantage of their alignment.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even so, that don’t change the fact that we got the advantage. Come on, let’s do this!” shouted Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust then the signal went off, and we immediately pulled on the rope.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And pull! And pull!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe D/A coalition worked together with great vigor, shouting the standard tug-of-war battle cry. At first, it looked as though the two sides were evenly matched, but after a few seconds, the game started to shift in our favor.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Go, go, go! Come on, easy!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBefore long, we heard the signal that the match had ended, and that the D/A team had scored a point.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hell yeah! You see that?! Serves ’em right!” Sudou howled.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn response, the Class B guys confronted Class C, their discontent obvious. “Hey, it’ll be really bad if we don’t work together, you know? These guys are crazy strong,” Shibata said to Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut Ryuuen ignored him. “All right, time to switch things up. Line up with the shortest in front,” he barked at his class instead. He clearly had no intention whatsoever of taking Class B’s opinion into account. He issued directions to the scattered Class C, adjusting them so that they stood in order of height. We now formed a perfect bow shape.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShibata shook his head, shouted words of encouragement to his class, and grabbed the rope once more.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We got this. With those guys lined up like that, there’s no way they’ll win,” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We can’t say that for sure. Everyone, keep your guard up. The next round won’t be like the first,” said Katsuragi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why, though? It was an easy win, man. Look, they ain’t even lining up by height, like we are,” said Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke guffawed, laughing it up and making light of the situation as he gripped onto the rope. Katsuragi tried to speak up once more, but the break between rounds had ended, and it was time for round two.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe signal went off.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And pull! And pull!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe D/A coalition pulled, just like we did the first time. However, facing a new level of resistance caused our group to panic a little. No matter how hard we pulled, the rope didn’t budge. Anxiety started to creep in.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, you guys better stick this out. If you lose here, I’ll kill you,” warned Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe felt an intense surge of power come from our opponents’ side, starting to drag us over the line. It couldn’t possibly have been that their strength welled up just from Ryuuen’s one command alone. Something about the bow-like shape of this arrangement gave them more leverage.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Geh! Ow! Oww!” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could hear pained cries from Ike and the others holding the rope in the rear. I was also pulling with everything I had, but the resistance I felt was completely unlike the first round. This game of tug-of-war was pretty evenly matched. I wondered if our difference in willpower was determining the results. The D/A coalition was dragged forward, little by little, until we lost. We’d just dominated the last round, so some of the students thought it was our fault.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The hell? Why was it different from before?! Hey, is someone holding back?!” The students on our team started to turn on their allies. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi immediately stepped up and spoke.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Calm down. We lost because our opponents used the right formation to beat us. Of course, it’s probably true that some students on our side felt overly confident going into the second round. Understand that, even if our opponent’s teamwork is in shambles, they can still put up a fight. Brace yourselves, focus your minds, and make\u0026#160;sure to check your position. Also, when you pull, make sure that you do it at an angle.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi gave us a light reprimand, some sound advice, and instructions to get back into position. He was doing the best he possibly could with what little time we had. On the other hand, even though the opposing side wasn’t able to achieve cooperation between both classes, each class came together individually. There was Class\u0026#160;B, which was wholly focused on pulling the rope, and Class\u0026#160;C behind them on standby. If Ryuuen gave them the order, they would definitely be spurred to action.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, you did fairly well. We just have to do the same thing one more time. Those pieces of garbage think they can win. Let’s teach them a thing or two,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI should have expected that they’d be able to succeed, even though they weren’t given any kind of concrete instructions.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce both sides were ready, the crucial third round began.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And pull! And pull! Pull!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust like before, things weren’t decided immediately. The white flag attached to the rope fluttered above the center line without moving.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Keep on it, guys! We’re definitely going to win!” shouted Sudou. At his words, everyone started working together in unison. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And pull! And pull!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe white flag moved slightly toward the D/A coalition’s side. No matter how strong they were, victory probably wouldn’t be determined by strength alone.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No slacking off! Come on, one more pull! Puuullll!” shouted Sudou, bellowing a war cry. He was pouring everything he had into one last tug—but that ended up being our downfall.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSuddenly, the incredible resistance we’d been facing vanished, and everyone on our side tumbled over backward. The students, including Sudou, were unable to grasp what had happened right away. While still on the ground, they started yelling at one another. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOur opponents had let go of the rope.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, what the hell? Don’t screw with us!” Some Class B students had fallen over, too, so they clearly hadn’t expected this turn of events. Before long, everyone directed their ire toward Ryuuen and his group.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I decided to take a break, since I thought we couldn’t win,” said Ryuuen. So, they’d given up? He turned to us and sneered. “Good for you. You managed to pick up a meaningless win. It’s hilarious to see you all crawling on the ground.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though he’d lost, Ryuuen smiled, clearly enjoying himself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Jerk!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe opposing teams’ attitudes alone would’ve made it difficult to tell who the winner was here. Sudou stood up and charged at Ryuuen from his backline position, still angry over the capture-the-flag incident. However, Katsuragi, who had been in front of me, hurriedly grabbed Sudou’s arms and stopped him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Stop, Sudou. This is all part of Ryuuen’s plan. He wants to make us waste our energy. He might also be trying to egg us on to violence, so that we’re accused of foul play.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What they did was unsportsmanlike, but it wasn’t a violation of the rules,” said Katsuragi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi wasn’t in Class A for no reason. His control was masterful. Ryuuen turned his back on us, perhaps because he knew that further provocation would get him nothing.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, get up!” he shouted at his group. The boys from Class C immediately stood. I imagined Class B had their own complaints.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It looks like we got lucky. Thank goodness we don’t have to try working with Class C,” said Katsuragi as he patted Sudou on the shoulder.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Man… We won, but I don’t feel good about it at all. Damn it,” Sudou grumbled.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI understood his feelings. We’d finally won a team competition, but Ryuuen managed to put a damper on it. Far from feeling ecstatic about the win, we were all frowning a little. With the tug-of-war ended, we went back to our tents. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOn the way, Katsuragi came up to Hirata and offered him a quiet apology. “Sorry for earlier. I wasn’t able to lead my class,” he told Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, please, don’t worry about it. It’s our fault we let our guard down in the second round. Right?” Hirata looked to me for confirmation, so I nodded.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Things are rough in Class A, huh?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi didn’t elaborate any further on the matter. All we knew for certain was that he seemed to be in quite a difficult position. Meanwhile, Sudou had already shifted gears to thinking about the upcoming competition. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Next up is the obstacle course race. If anyone does bad, I’m gonna lay ’em flat,” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh. Why do you have to hit us?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“’Cause I’m the leader. I need to kick the asses of the people under me. It’s a tough job,” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo one really wanted such a leader, but you couldn’t exactly oppose Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For reference, what outcomes would you consider disappointing?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ain’t that obvious, dude? I won’t accept anything besides victory!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Harsh!”\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e6.5\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003e“H\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eAH…HAH…\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMan, I ran my heart out, and I still only got sixth place! H-has Ken not gone up yet? Puh…” Ike breathed heavily as he fell to his knees. He was probably terrified of Sudou’s wrath. “You don’t think he’d get, like, fourth place or something, do you?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI understood Ike’s concern. If Sudou didn’t win his own race, he’d surely take that out on the rest of the group. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What place did you get, Ayanokouji?” Ike demanded. “Will you get Sudou’s death penalty?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just barely managed third place,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh, no way. Seriously? Man, talk about being saved by the lineup,” said Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHe goes along with Sudou’s nonsense yet again.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Well, it seemed like invoking Sudou’s ire would be a hassle. That was why I decided to put in a little effort.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks like Sudou-kun is going up against Shibata-kun.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh, yeah.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShibata was doing light warm-up exercises as he waited for his race to start. Sudou had a formidable opponent.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?! Wait—the other guys Ken’s up against are Nomura and Suzuki! Dude, not fair!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke looked genuinely frustrated upon seeing what a fortunate lineup Sudou had. The two Class C students in question were said to be especially unathletic. The two Class A students in the group weren’t really that good, either, so Sudou’s victory was pretty much guaranteed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Shibata was different. He was rumored to be Class B’s fastest runner, and he was undoubtedly going to fight to reach first place. In the two competitions leading up to this, he had won first both times.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who do you think’s going to win?” I asked Hirata. He knew Shibata well.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know, honestly. Shibata-kun is quite fast, so I don’t think he’ll lose that easily. If it were a purely straightforward match, Shibata-kun might take first place, but Sudou-kun overcame all the obstacles without much difficulty during practice. I think it’s going to be an incredible race.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKnowing both their abilities, Hirata wasn’t sure. Sudou thought that there was no possible way he could lose. Hopefully, his pride wouldn’t get in the way of his running. I put aside my worries as the race started.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBoth Sudou and Shibata got off to a good start. They were neck and neck as they headed toward the first obstacle, the balance beam. Though Sudou was tall and large, he was able to cross the narrow balance beam faster than anyone else. He had incredible balance. Shibata was in second place. Despite the fact that he lagged slightly behind Sudou, he also managed to safely cross the beam.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter sprinting a short distance, they crawled through a net placed on the ground. Sudou advanced like some kind of wild beast. Shibata chased after him, looking as though he was having fun. The last obstacle was a sack race. Everyone jumped in their sacks and started hopping. Sudou managed to clear the race with dexterity that belied his large frame, but Shibata was closing the distance between them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is the most intense match so far today,” said Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou and Shibata seemed to be physically matched, so it looked as if they were trying to change up their strategies. Shibata kept a steady pace. Sudou started to rush for the first time. He probably heard Shibata closing in on him. However, Sudou managed to stay ahead, and in the end, was the first to cut through the tape at the finish line. Going all out like that clearly affected him. Even from this distance, you could see him breathing heavily.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou and Shibata had been evenly matched in speed. It was like Hirata had said: in pure speed alone, Shibata might actually have been superior. Sudou wasn’t invincible after all; his performance depended on the competition and the timing.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn any case, Sudou had managed to win first place three times in a row. He was, without question, one of the best athletes in our entire school. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou, making his proud return, immediately confronted a shrinking Ike. “Hey. I was watching you, Kanji! The hell, man, sixth place?!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-hey, you almost didn’t get first just now, dude! We’re practically equal!” blubbered Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis equality was utterly imaginary. Sudou pinned Ike’s arms behind his back, putting him in a nelson hold.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Phew. Got first place. Still, though, that Shibata guy was really fast. Thankfully, I managed to beat ’im,” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShibata dropping down to second place after clinching first twice in a row was great for Sudou, who was aiming to be best across every grade level.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e6.6\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eW\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eE DIDN’T HAVE ANY TIME\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to slack off before we needed to prepare for the three-legged race. Meanwhile, it looked as though things were getting rocky for the first-year girls on the obstacle course. Horikita was doing her best to make up for her earlier results, but the two Class C students had put some distance between themselves and her right at the start of the race.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve seen this happen before.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks like she’s in the same group as Yajima-san and Kinoshita-san again.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita was gifted at both athletics and academics, but trying to beat someone who specialized in one of those two wasn’t an easy task. When the race started, Kinoshita had dashed forward, bolting straight toward the balance beam. She made it there first and put a lot of distance between herself and those behind her. Yajima was now in second place. Horikita followed in third.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnlike the 100-meter dash or the hurdle race, both of which relied purely on speed and stamina, there were numerous unknown variables in the obstacle course. After the girls passed the balance beam, the distance between them shrank until they were practically all neck and neck.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks like she’s got a chance.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou cheered Horikita on, his hands tightly balled into fists. By the time the girls started crawling through the net, Horikita had taken the lead. However, Kinoshita was fast. In between obstacles, she closed and shortened the distance between herself and Horikita. She managed to stay in second place.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYajima wasn’t about to be thrown out of first. Horikita sprinted forward with everything she had to try and steal second place. When Kinoshita was thrown off balance during the obstacle course’s final leg, the sack race, Horikita closed the distance between them. When she passed the girl, Horikita raced forward as quickly as possible. The distance between herself and Kinoshita could only have been one or two seconds.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita ran at top speed for the final fifty meters of the race. However, she must have been concerned about Kinoshita closing in on her, because she repeatedly glanced over her shoulder. That caused her speed to drop, and soon the two were once again side by side. Suddenly Horikita, who’d been trying to slip past Kinoshita, and Kinoshita, who was trying to catch up, became entangled and fell down.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoa! Hey, something big just happened!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was too far away, so I couldn’t tell who had run into whom. It looked to have happened as part of their mad scramble. While they got back up, other students passed them by, and Horikita and Kinoshita plummeted to the bottom of the rankings. They both desperately struggled to get back on their feet amid a cloud of dust.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough they kept going, the incident affected them. In the end, Horikita finished in an unbelievable seventh place. Kinoshita ended up getting last place due to significant pain in her leg, which rendered her unable to continue to run. She must’ve been pretty unhappy about it since she’d expected to place first.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita had placed first, then third, and now seventh. We had no choice but to say that it’d been an unfortunate accident.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…………”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s the matter, Ayanokouji-kun?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If an ‘accident’ were to happen again, that might be too much to believe,” I answered. This was the first time I was mentioning it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You think so, too? I’d say the others are also starting to realize that. This doesn’t bode well,” Hirata replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnfortunately, he was right on the money. “I wonder if other students have noticed this. Can I leave you to take care of everyone?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course. That’s my role, after all. But isn’t there something we can do?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wish,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a relief to see Hirata accept the task without even a hint of disgust. I headed over to Horikita, who had a sullen look on her face. Her body language also clearly conveyed her dismay.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Does it hurt?” I asked her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A little. But it won’t affect the competition. If I rest, I’ll be okay.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe tried to look tough, but she was having a difficult time just sitting down. Preparing myself to be pummeled, I lightly touched her injury.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ow!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This isn’t going to affect the competition, huh?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t just go touching me. Leave me alone. I’ll grin and bear it,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTo be in a position of so much responsibility could be hard. Especially for people like Horikita, who took pride in her ability to produce results.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I suppose you won’t get any points if you withdraw. I understand your desire to hang on.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI expected her to glare at me for poking her, but she changed the topic. “More importantly, that girl’s a sneak. It’s like she was looking to hurt me,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“While she was running behind me, she called my name over and over.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, that was why Horikita had looked behind so many times during the race.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I found it strange, obviously. As soon as I turned back to see her, we ran into each other. It looked like an accident, but if so, then why was she calling my name? I\u0026#160;wanted to speak up about it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was a good chance this had been an orchestrated attack to make Horikita fall.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Honestly, I can’t keep up with this. To think that we’re still in the middle…” she muttered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was the third student to be injured. One second-year had fallen during the race, and had to withdraw because of the pain, but that at least had seemed to be an isolated incident among the upperclassmen. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway,” Horikita said. “Don’t worry about me. Worry about yourself. Your results are worse than mine, aren’t they?” She currently had thirty points. I had twenty-seven. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll do everything I can. But don’t push yourself, all\u0026#160;right?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll participate, even if I have to crawl,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI left her and started preparing for the next competition, the three-legged race.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How’s Horikita-san doing?” asked Hirata. He sounded worried.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s pretty serious. It’ll probably affect other events,” I\u0026#160;replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is bad,” he responded.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata and I continued talking while he tied our legs together for the first-year boys’ three-legged race. The races followed right on one another’s heels. It was incredible execution on the school’s part, structured as effectively as a live television program.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBecause a three-legged race meant two people per team, only a scant four teams could run at once. Sudou, who was one group ahead of us, was starting the race. He was partnered with Ike, and clearly still suppressing a lot of bottled-up rage. This partnership might’ve appeared risky, but with a certain method, they could seize victory.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn a sense, this was the ultimate three-legged race. Sudou bolted down the track with all his strength, practically carrying Ike with him. He’d been ferocious and determined from the very first step.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aaahhh!” Ike cried in agony. It came close to foul play, but still just barely counted. They successfully nabbed first place, Sudou forcibly supporting Ike so that he wouldn’t collapse.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sudou-kun can be incredibly reliable, can’t he?” asked Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI felt sorry for Sudou since Ike had been chosen to be his partner, but he probably felt satisfied with the outcome.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, he certainly is. But if we want to win, then Sudou alone isn’t enough,” I replied. If Sudou was uncontrollable, he could very well be a double-edged sword that would hurt us.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, we’re up next,” said Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe started the race. Fortunately, no other notable people were running with us. Since we were highly compatible partners, we ended up finishing in first place. No one could complain about that.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whooo! Hirata-kun’s so cool!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, it was painful to listen to all the girls cheer only for Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNext came the first-year girls’ three-legged race. Horikita, who was learning to compromise, and Kushida, always willing to compromise, were paired and set to go for the second round. It was time for them to demonstrate the results of their practice.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe two of them talked very little. Their relationship was especially awful, but maybe a desire to win would bridge that gap. To me, they were a truly bizarre pair. To be fair, I was the only one privy to their situation. To the rest of Class D, they probably looked like a safe, reliable team. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey got off to a good start, taking second place. Not bad. Cheers came from the onlookers.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Go, Suzune!” Sudou got a little carried away and called out Horikita’s still-forbidden first name. His voice probably didn’t reach her, though, so he was likely safe. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Horikita and Kushida slowed down, and their ranking dropped. Before we knew it, two girls from Class A took first place. They were beautiful young women with the same haughty aura as Horikita. The Class C team, which included Yajima, came second.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Something seems off,” I muttered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? What does?” asked Sudou, who’d been cheering for Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, Horikita’s movements look stiff,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now that you mention it, yeah. They do,” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDuring practice, Horikita had always pulled her partner along, but in the actual event, Kushida was taking the lead. At first, I wondered if it was because she’d been partnered up with Kushida. But just as I’d expected, Horikita’s leg pain was affecting her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was desperately pushing herself to keep up, but her body just couldn’t handle it. The gap between the first and second place teams began to widen, rather than shrink. In last place came the Class B pair. Horikita and Kushida shifted into the next lane so that they wouldn’t lose. Were they trying to obstruct Class B?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass B doggedly tried to slip past, but couldn’t, since they were moving at the same speed as Horikita and Kushida. The audience cheered at this struggle for third place. Focusing too much on obstructing Class B meant that Horikita and Kushida let their guard down for a moment, which gave Class B a chance to turn things around.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Awww, that’s so disappointing!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey did their best, but Horikita and Kushida came in last. Our victory was, once again, far out of reach.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e6.7\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eW\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eE HAD A TEN-MINUTE BREAK\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e so people went to the bathroom, or off to get a drink of water. Horikita said that she was going to the nurse’s office for a poultice and headed toward the school. I supposed it was better than nothing. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t go anywhere. Instead, I stayed and observed the other classes. It was possible to pick up all sorts of information just by observing from afar. Class A was especially interesting, as I’d suspected.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe rivalry between Katsuragi and Sakayanagi was visible from my location. The two distinct factions were obvious; there was practically no contact at all between them. It was by no means strange for a class to have two appointed leaders. Even though Hirata was the head of our own class, we still had Karuizawa and Kushida, and Sudou was leading us in this sports festival. Despite many upheavals, however, Class D wasn’t fractured by infighting the way Class A was. We hadn’t witnessed it in any of the prior exams, but their blatant hostility was incredibly clear during this festival.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Amazing that they’ve gotten this far with such internal discord,” I said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi’s faction had greater numbers. When Hirata came back from washing his hands, I decided to ask him a question. “What kind of student is Sakayanagi?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re also curious about her, Ayanokouji-kun?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah. I got curious when I heard that she matched Katsuragi as a leader,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t understand Sakayanagi’s mindset, her way of doing things. During this festival, she hadn’t given a single order, remaining completely silent. Still, she looked as if she were plotting to get in Katsuragi’s way. She wasn’t interested in fighting with other classes; her focus was on Class A alone. It looked as though she was willing to lose out on points if it meant Katsuragi’s downfall.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, there was the possibility that she was inciting this hostility so that she could dominate the class. However, it called to mind the phrase “the enemy of my enemy is my friend.” Cooperation was expected in order to defeat the other classes.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She’s very polite, she’s good with people, and she’s mature. I didn’t think there was anything especially strange about her. Students from other classes probably feel the same, but it seems like Class A disagrees. I’ve heard people say that Sakayanagi is aggressive and ruthless,” said Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, we couldn’t just take the word of her opponents as gospel, either. We hadn’t even had a conversation with her yet. Besides, it’d be hard for her to interfere in the sports festival. Since her body prevented her from physical exertion, she might not intend to act openly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think we need to be concerned about Class A right now. We’re allies here, after all.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, that’s true.” At the very least, Class A probably wasn’t scheming to get in our way or anything. Nothing like that had happened so far. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOn the other hand, I wouldn’t have been surprised if Class C was plotting to disrupt us somehow. I looked toward their camp and saw male students gathered around Ryuuen, as if he were a king holding court. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRight now, his strategy was the most alien of all. Even in the sports festival, he was trying to cause psychological harm. He wanted to create lasting damage. Sudou, in particular, had been on the receiving end of Ryuuen’s tactics, and was deeply unsettled. I was sure Ryuuen had more tricks up his sleeve.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFinally, I wondered how Class B was doing. Working together with Class C while the possibility of betrayal was very real, and going against Class A, a formidable opponent, had to be intense. Ichinose and the others, cheerful and fair, were giving the competition their all. At a glance, they hadn’t changed their usual behavior. Watching their smiles and happy gestures, it basically seemed as though they were genuinely enjoying the festival.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e6.8\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eFTER OUR SHORT BREAK\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the contests ran in reverse order. It was time for the first-year girls’ cavalry battle. They began gathering at the center of the grounds. This would be yet another showdown between the D/A and B/C coalitions.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe cavalry battle ran on a time limit, and the rules were the same for boys and girls. They dictated that points would be awarded based on the number of enemy units your team defeated in a three-minute period, and how many allied units you had remaining. There were four horsemen to every cavalry unit.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFour students from each class were horsemen, which meant it was an eight-versus-eight battle. Extra students were kept as reserve units, to be substituted as needed. Each horseman was worth fifty points. One horseman in each class was designated the “general,” and they were worth 100 points. You could still get points, even if your opponent was left standing, so long as you stole their headband. If we had a particularly powerful warrior on our side, we might get as many as 400 or 500 points in one go.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita had been chosen to jockey for Class D. Ishizaki, Komiya, and Kondou were supporting her. They weren’t bad at all. Mori, Kushida, and Karuizawa were the other jockeys.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe problem was that Mori’s unit was filled with unathletic students. There was a good chance that they’d go down first. Their strategy was to make a weak horseman the general, which meant that the weakest link could stay out of the fight, and the three remaining horsemen could protect them. Perhaps they were planning to go for a counterattack if the enemy came after them?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce the signal went off, the Class B and C horsemen quietly began to close the distance to Classes A and D. Unsurprisingly, Ibuki was out for blood. A jockey herself, she issued an order and headed right for Horikita. However, Ibuki wasn’t the only one.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-hey, what the hell?” shouted Ike as he watched the match. Sudou clenched his teeth.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass C didn’t bother attacking Class A at all. They didn’t even pay attention to Class D’s general or other horsemen. Horikita was their sole target. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFour horsemen attacked her. Was their plan to crush us individually, one after another? Or did they only care about defeating Horikita? If Ryuuen was in command, both seemed possible. The Class D horsemen were outnumbered, but Class A showed no sign of even trying to help. Perhaps they intended to use us as bait, and swoop in to get the points after we were done.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They’re just going after Horikita, aren’t they, dude?!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Damn. Ryuuen probably ordered that. Scumbag!” Sudou growled.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s nothing we can do about it. Everyone knows that Horikita is Class D’s best player on this field.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen’s tactics weren’t bad. Whether in war or competition, the best bet was taking out the opposing side’s leader. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa and her horsemen rushed to Horikita’s rescue first. Shinohara hurried over to support Karuizawa. However, Class B’s general, Ichinose, blocked their path. Unlike Class A, Class B was actively supporting their ally team. Now they were on a collision course: Karuizawa versus Ichinose. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa’s unit was the first to mount an attack. I\u0026#160;supposed that was inevitable, considering that they needed to settle this as quickly as possible in order to support Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_10\" src=\"/hola-lector-agua/images/books/v5/OEBPS/Images/INTERIORIMAGES_10.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnfortunately, the three girls supporting Karuizawa weren’t exactly athletic. Their unit had formed so that they could hang out with their friends. Bad tactics. Meanwhile, Ichinose’s unit contained some of the best and most capable people in Class B. Showing no fear, Class B dodged the attack.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose went for a direct attack, but her movements weren’t sharp. Karuizawa managed to react well and launch a counterattack. It was a contest of unity versus maneuverability, and looked as though it would drag on for a while. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dude, this is an awesome game!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe audience cheered. As Karuizawa’s group made their move, a horseman’s headband was snatched off. Horikita’s, as I’d expected.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFour horsemen had attacked her simultaneously. Unable to avoid their relentless assault, she had been defeated. She fell off her unit quite dramatically, collapsed to the ground, and tried to get up, looking frustrated. However, she had nothing to be ashamed of. In a situation like this, even someone like Sudou couldn’t have won. Class A and their lack of defense were responsible for her defeat.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn any case, that was that. Horikita’s loss triggered an all-out melee. Class D, now down a horseman and pursued by Class B, lost any semblance of coordination in the blink of an eye. Some players fell off their horses, while others had their headbands snatched. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe two horsemen other than Karuizawa tried to resist, but in vain. Karuizawa, who was locked in a fierce battle with Ichinose, found herself in an eight-to-one fight for a moment. Then, at the very end, she managed to snatch a headband from a Class B horseman thanks to her near-suicidal resolve. Thanks to that, their match ended with a mutual KO.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though they’d lost a horseman, Classes B and C attacked the remaining Class A units and completely wiped them out. Our opponents had only lost a total of two horsemen, but the A/D coalition had suffered a great loss.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita returned to camp grinding her teeth in frustration. Sudou called to her right away.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, don’t worry ’bout it. It was hopeless. Besides, it’s the others’ fault for being so slow,” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That doesn’t change the fact that I lost. Their momentum completely overwhelmed me,” replied Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass C had primarily targeted Horikita, though. Under those circumstances, no horsemen could’ve stood a chance.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Leave it to me. I’ll get ’em back for you,” said Sudou, trying to sound cool.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNormally, his words wouldn’t have reached Horikita at all. However, in her weakened condition, they seemed to resonate. “I’d expect no less of you,” she replied curtly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right! Let’s go, you guys!” shouted Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe boy’s cavalry battle began. I took the role of a horse on the right of my unit. Sudou was squarely in the middle, and Miyake was on the left. Hirata was our jockey. Thus, our class’s strongest unit was born, a warrior without peer, capable of achieving victory even if our allied horsemen were defeated.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Hirata. Focus on not getting your headband stolen, and don’t get knocked down. Okay?” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, we’re using that strategy, huh?” asked Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s ’cause we lost horribly at capture the flag. We got beat really bad. This time, we’re gonna show ’em no mercy,” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t see the expression on Sudou’s face, but he must have been smiling. They were probably planning on trying to destroy the competition by using the strategy that they had practiced over and over during class.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have an idea, if it’s okay with you guys. While I was watching the girls’ match earlier, I thought of a way to win. I already told Katsuragi-kun about it. We can’t keep losing at this speed,” said Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen the signal went off, Hirata gave the order. Class D’s horsemen joined Class A’s. We became one large mass of people, the two classes indistinguishable from each other. Though Class A had basically abandoned Class D entirely during the girls’ match, they weren’t rooting for us to lose or anything.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass C’s general, Ryuuen, laughed fearlessly. He couldn’t bear to cooperate, so instead, he resorted to crudely ordering others to fall in line.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOn Katsuragi’s orders, eight horsemen from the D/A coalition rushed at the enemy.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aim for that shitty Ryuuen’s head! Raaah! Send him packing!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the blink of an eye, Hirata’s horse, Sudou, bolted ahead at top speed. A horseman from Class B tried to get in the way.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Sudou slammed into the enemy with full force, knocking them off-balance. “Get outta my way!” he roared.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uwahh!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe enemy, lacking Sudou’s superior physique and ability to fight back, could only collapse, jockey and all. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, how about them apples?!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLike a wild beast, Sudou looked down at the defeated enemy, then turned toward his next prey. Normally, hitting someone would be considered foul play. However, the school had already said that this battle’s rules were a bit different. Our strong opening salvo instilled fear in the other team, making them flinch.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a strategy that we couldn’t have implemented without the necessary brawn and attitude to go along with it. However, this strategy did have its drawbacks. If we knocked down a jockey, it would count as a self-KO, not stealing a headband. Those fifty points would vanish into the ether. Still, if we focused solely on stealing headbands, it would be risky.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou clearly relished this strategy, but we couldn’t drop our guard. There was a good Class B general whose unit consisted of Kanzaki and Shibata. There was also Ryuuen, and he was riding guys with a lot of power and muscle mass.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe D/A coalition couldn’t win unless we took those two out, but it was so hard to read Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sudou-kun, let’s defeat the opponents around us first and leave Ryuuen-kun for last.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? C’mon, don’t be boring, man. Let’s aim right for the general’s head!” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI got what he was trying to say, even through his bestial shouts, but the wall in front of Ryuuen was dense.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we get emotional, we’ll play into his hands. Let’s do what’s necessary to win,” said Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tch!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTwo Class C horsemen launched their attack at us. Sudou, despite his grudge against Ryuuen for being stomped on, listened to Hirata. I marveled at Hirata’s ability to keep the guy under control.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, all right. Let’s kick the crap outta these guys!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe needed focus, and our wits about us. During capture the flag, the enemy’s power had overwhelmed us, but things were different this time around. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou defeated three enemy horsemen with ease. Keeping the momentum going, Katsuragi and other Class A students successfully took down Shibata and Kanzaki’s unit, despite losing three of their own players. Ryuuen was the sole remaining enemy. Both Hirata and Katsuragi’s units had survived, and one additional Class D horseman remained. We had a chance.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah! It’s three on one now, right? We got this!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs we surrounded Ryuuen, Katsuragi and Hirata exchanged looks. The other horsemen kept their distance, but still targeted Ryuuen. Since he’d been able to steal a headband, I realized just how powerful Ryuuen’s unit was. But, even so, we outnumbered him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Ryuuen didn’t panic. In fact, it was the opposite; he looked as though he was actually enjoying this. He looked neither defenseless nor defeated.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Hirata and Katsuragi attacked him at the same time, one of them could snatch Ryuuen’s headband, even if that meant sacrificing the other. In that case, our victory would be practically guaranteed. This was the moment to go for the kill. However, Ryuuen was far too skilled at finding the gaps in his enemy’s armor.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, I remember your name. Sudou. When I stepped on you earlier, it looked quite painful,” Ryuuen sneered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, keep talkin’. I’m gonna return the favor,” replied Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You talk a pretty big game for a simple beast of burden. I have to say, it feels good to look down on you,” said\u0026#160;Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh. Just because you’re ridin’ on top don’t mean you’re a big deal yourself,” snapped Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh? I guess this is all meaningless, unless we settle things one-on-one,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you can only beat me when it’s two against one, I suppose that’s that. However, ‘winning’ only means something when you beat somebody one-on-one,” said Ryuuen. “But could you handle that? Or, what, are you planning to defeat me with a pincer attack?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The heck?!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sudou-kun, don’t listen. This is a bad idea. Let’s cooperate with Katsuragi-kun,” said Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You just don’t get it,” Sudou told Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e don’t get it, Sudou. You’ve taken down those who got in your way before, but you used cowardly means to do so. You could never beat my trusted subordinates with a frontal attack,” Ryuuen gloated. Some of his unit happened to be members of the basketball club, the ones who’d started a fight with Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Stop screwing around. Those dudes are weak garbage who can’t even fight,” snapped Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tough words, but with nothing to back them up. If\u0026#160;you’re so very strong, then face me one-on-one. If you can beat me then, I’ll kneel before you,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fine. Don’t forget what you just said, Ryuuen! You heard all that, Katsuragi? Don’t you dare stick your nose in this!” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you talking about? We can’t let this chance go. We should use a pincer attack to defeat him,” replied Katsuragi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Stick your nose in this, and I’ll bust up your unit!” said Sudou. He’d taken Ryuuen’s bait hook, line, and sinker. Ryuuen understood what a hothead Sudou could be, and took full advantage of it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re determined to fight him on one-on-one, Sudou-kun? Fine. If you’re doing this, then win,” said Hirata. He understood that, once Sudou’s switch was flipped, there was nothing to be done. Knowing that continuing to try to persuade him would be fruitless, Hirata allowed him to engage Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right. Hirata, make sure your headband doesn’t get snatched!” Sudou commanded.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith a bitter expression, Katsuragi watched the battle unfold as Sudou charged forward, ramming into the enemy. However, their horsemen weren’t knocked down. Their power was just about equal to ours. The horse protecting Ryuuen in the center was the half-Japanese guy, Yamada Albert. His strength was incredible, just like the rumors had said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou clicked his tongue, and I wondered if he was ticked at the stalemate. Miyake and I, who were supporting Hirata from the sides, couldn’t bring as much strength to bear as Sudou. If you supposed Sudou had ten horsepower, both of us had maybe half that. However, in Ryuuen’s unit, Yamada might’ve had nine or ten horsepower. The other guys were nearly as tough, too, probably with seven or eight horsepower apiece.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_
