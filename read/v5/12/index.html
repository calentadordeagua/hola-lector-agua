Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on; come on then. Or are you going to lose to my Albert?” Ryuuen gestured for us to attack him. He had been fortunate with his opponents up until now and had taken first in every single competition. He was no underdog when it came to athletics. He observed our movements while managing to smoothly dodge Hirata’s extended hand.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I supported Hirata, I watched his battle with Ryuuen as best I could. From what I could see, they were almost evenly matched. However, Ryuuen only attacked with his words, not wasting any effort on physical attacks. He conserved his stamina, responding with only one attack for every three of Hirata’s. This battle was just the halfway point for him, then; he was saving his energy for Katsuragi’s unit on standby. Apparently, he didn’t expect to lose now.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn that case, we needed to strike as soon as there was an opening. If we attacked repeatedly, Hirata would have his chance.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not yet, Hirata?” Sudou sounded pained, since he was the only one on the receiving end of most of the enemy’s attacks.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just a little more!” Hirata extended his arm, feinting, before launching an attack. As Ryuuen tried to sway and dodge, Hirata grabbed hold of his headband, but only managed to snag the edge. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata tried his hardest to pull the headband off. He couldn’t snatch it away, and the headband slipped out of his hand.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you doin’, Hirata?! Take it! I’m usin’ up an awful lot of strength here!” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry. My hand was slippery!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou, breathing heavily, launched another attack. Ryuuen waited fearlessly. Meanwhile Hirata, who had only been on the offensive so far, was breathing heavily.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s wrong? That all you got?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh! Sorry, Sudou-kun! Fall back for now!” said\u0026#160;Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe put some distance between Ryuuen and ourselves. We were exhausted compared to Ryuuen, who had barely even moved. He was probably conserving his strength to fight Katsuragi after he defeated us. Sudou, his breathing ragged, repositioned himself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Make the next try the last, Hirata… Make sure you snatch it!” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Got it. I’ll try my best!” Hirata took a deep breath and focused.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Eat this!” shouted Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou summoned the last of his strength and slammed into the enemy, but they still didn’t fall down. Once again, a fight between the jockeys ensued. However, Hirata took a gamble and, assuming that Ryuuen wouldn’t attack, extended his arm and left himself open. The results were well worth the risk.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Got it!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata’s aim was straight and true. Again, he successfully grabbed hold of Ryuuen’s headband. However, once again, the headband slipped.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen took advantage of Hirata’s bewilderment. He reached out to grab Hirata’s headband, gripped it tightly, and effortlessly snatched it from Hirata’s head. Sudou sensed that we had lost and dropped to his knees, causing Hirata to fall.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen raised Hirata’s headband up high. Soon afterward, a referee came over and warned us to leave the field. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Damn it!” Sudou, looking wild and unruly, glared at Ryuuen. If Sudou didn’t start moving, I didn’t know what kind of warning we’d receive next. I pushed him, directing him to leave the field.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How pathetic,” Ryuuen sneered. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was too early for us to accept defeat, though. Katsuragi, a survivor from Class A, challenged Ryuuen with a determined expression. He gave orders to the jockey, Yahiko, while fortifying his defenses. Now that Sudou had withdrawn, Katsuragi’s unit joined the remaining Class D horsemen to start a two-against-one strategy. However, when they grabbed Ryuuen’s headband, things played out in a similar way. They couldn’t pull the headband off. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the end, Yahiko and another Class D jockey lost their headbands. Even though he’d moved as little as possible, Ryuuen demonstrated superb strength and survived until the very end.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs we heard the signal heralding the end of the game, Ryuuen took off his own headband and swung it around, reveling in his victory. That was another piece of provocation—another piece of his strategy.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dang it, he’s the one guy I didn’t want to lose to! Get your head in the game, Hirata!” Sudou’s frustration was at an all-time high, especially against his current nemesis, Ryuuen. I half-expected him to go on a rampage and tear the place apart.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, Sudou-kun. His headband was so strangely wet, I couldn’t seem to pull it off,” said Hirata. “At first, I\u0026#160;thought it was sweat, but something was a little odd.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe showed us his hands. When I touched his fingertips, I saw some kind of clear, slightly sticky fluid gleaming on them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not sweat,” I said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou touched it for himself to confirm. “Wait, that means… That jerk!” He charged over to confront Ryuuen. “That’s foul play! You slathered your headband with something!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know what you’re talking about. If there’s anything on my headband, it’s probably just hair gel. Don’t be a sore loser,” chided Ryuuen. He didn’t seem afraid in the slightest.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMaybe he’d been able to clean his headband while he showed off his victory, or maybe he wiped it on the ground. Either way, Ryuuen’s headband just looked dirty. The evidence was gone.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sudou, we’re going to cause a scene. Let’s head back to our tent,” I said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe referee glared at us. We couldn’t prove that Ryuuen had coated his headband in anything. In truth, Ryuuen probably \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehad\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e used hair gel. Anything else would be too risky, bordering on foul play. He wasn’t stupid.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know what? You’re at fault here, too, Ayanokouji! You need to provide more support!” snapped Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven after we returned to the tent, Sudou didn’t calm down. I kept my distance to let him cool off. Karuizawa called to Hirata and me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Isn’t this bad news, Kiyotaka?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What is? Wait. Why’d you use my first name?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why? Well, I call Yousuke-kun by his first name, so I thought I’d try using yours,” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen why had she dropped the honorific in \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003emy\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e case? Was she implying that I was lower than Hirata? I probably didn’t need to give it too much thought, so I decided that was all there was to it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At any rate, I want to discuss Horikita-san. Hasn’t she been struggling for a while now? Even during the cavalry battle, she was in really rough shape. I tried to offer her support, but it was just a complete mess,” said Karuizawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita was in a bad way, and not just in the team contests. Her rankings had fallen greatly across every event. The reason was clear: the fall during the obstacle course had injured her right leg. We normally would’ve suggested that she withdraw, but if she did, then Class D would be penalized.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t really think I can blame her, though. Her opponents were just too much,” said Karuizawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eTrue.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Horikita had gone up against difficult opponents each and every time. If she kept facing off against students who were the best in their respective clubs…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was far too much to be mere coincidence. “It’s no use. She’s being targeted,” I said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Targeted? So, it’s not accidental that she keeps facing all these incredible students?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s the only reason I can think of. You know how athletic she is, too, right?” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita wasn’t bad at sports at all; it was just that all of her opponents were better. By placing in the bottom ranks repeatedly, she couldn’t help but stand out to both her enemies and allies. More and more people had started to take notice of her, and she’d been targeted during the cavalry battle. There was just one person who might order such a thing: the man acting like a king over in the enemy camp, Ryuuen Kakeru. Only he would prioritize humiliating Horikita over leading Class C to victory.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He’s definitely harassing her,” I said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Someone is harassing Horikita? But why?” asked Karuizawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not just Horikita. They seem to know all our strategies for the competitions, and the composition of all our teams. They sent weaker students to go up against our top athletes, like Sudou and Onodera, and they had students who could just scrape by against our weaker players, like Sotomura, Yukimura, and Ike. Don’t you see? We’re being played like a fiddle.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBy “they,” I of course meant the students from Class C.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, information about our class got leaked? Someone sent out our participation table?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. They handed all that information over to Ryuuen,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s… Well, actually, Horikita was always up against Yajima-san and Kinoshita-san. Does this have anything to do with the traitor you were talking about?” asked Karuizawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI gave her a small nod. I’d convinced her just how bad the situation was.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But, wait, how did you find out? Honestly, it wouldn’t surprise me if you just came out and said you were the traitor or something… I mean, that’s not what you’re saying, right?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unfortunately, no,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePutting aside the question of “who” for now, the crucial bit was that the traitor had leaked our class’s information. Ryuuen knew everything, from the order in which we’d competed in all the events, with Hirata at the helm, to our strategies. With all that information, he had crafted two countermeasures.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFirst, he’d intentionally set up his weaker students against our more talented athletes, like Sudou and Hirata. Then he put his more athletic students up against our hopelessly unathletic competitors, like Ike and Yamauchi. That way, he could snag even more wins by beating them. Of course, we ’d taken that into account when we were coming up with our pairings, but Class C could just bide their time and eventually overtake us.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSecond, Ryuuen was targeting Horikita. However, that really had no direct bearing on leading his class to victory. He wanted to crush Horikita for the sole purpose of destroying her. And, in truth, Horikita \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehad\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e been crushed. She’d completely lost face. If we were to create rankings for Class D alone, then Horikita was sinking to the very bottom.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThese strategies revealed much about Ryuuen Kakeru. He could have switched around his players to keep us from figuring out his plans, but he \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewanted \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eus to know. He wanted to rile us up.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re not going to help her?” asked Karuizawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How would I do that?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well…I don’t know,” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The participation table is already set in stone. There’s nothing I can do.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re saying that Class D is going to lose?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Guess so.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Isn’t there anything we can do?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You should ask Hirata about that.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s…well, that’s true, I guess. But…I thought if I talked to you, you’d think of something.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe sports festival was playing out right in the open. Thus, there weren’t many chances for subterfuge, like there had been on the island. It would be a Herculean task to pull the wool over the entire school’s eyes. Our two options were fighting fair, and taking opponents like Ichinose and Katsuragi head-on, or using cowardly tactics while taking dangerous risks.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen was only committing these acts of foul play after careful rehearsal and lots of practice. Nearly all these results had been decided before the sports festival even started.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you think of Horikita?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What? I don’t like her. She’s all high and mighty and full of herself,” Karuizawa replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But you’re worried about her.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well…maybe I kinda understand what she’s dealing with.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa knew the bitterness and agony that came of being targeted by a bully. In that way, she could empathize with Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Class D is in last place right now, yeah? Is there no way for us to win?” asked Karuizawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry. Everything so far has been going according to plan,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I knew it. You \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e think of something. Then how do we win this thing?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Win? I have no intention of winning. What’s important right now is to do nothing,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?” Karuizawa’s mouth hung open in shock.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just do whatever you can in the sports festival. If you do that, it’ll help us later.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, what do you⸻”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as I was trying to think up a way out of this incessant questioning, we heard a very angry roar.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m seriously going to beat the crap out of that jerk!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou, bristling with all the aggression of a demon, was storming toward Class C. All Ryuuen’s provocation, from stepping on Sudou to targeting Horikita, seemed to have finally had its intended effect.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata got in Sudou’s way. “I understand what you’re saying, Sudou-kun, but you need to calm down. You know what’ll happen if you get violent with Ryuuen-kun.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou shoved him aside. “Shut it! He’s the one who should be sorry! He’s done nothing but cheat!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, yes, I do think he’s been cheating. But isn’t that difficult for us to prove?” asked Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTrampling someone during capture the flag and letting opponents fall over in tug-of-war weren’t very sportsmanlike conduct, but they were a gray area. As for Ryuuen using hair gel on his headband during the cavalry battle, that was only speculation. The evidence was gone. Sudou completely losing his temper and confronting Ryuuen wouldn’t solve anything. In fact, it would probably have the opposite effect. If he openly attacked another class, there was a good chance that things wouldn’t end just with Sudou’s disqualification.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m the leader here! So, listen up, Hirata. Let’s confront Ryuuen together,” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eknow\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e you’re the leader. If we’re talking about the sports festival, you’re the leader without a doubt. But look around you. What do you think the class wants from you, as their leader?” asked Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou looked around, starting with Ike and the others, who cowered in fear. Most of the students kept their distance from Sudou now. They didn’t want to suffer his wrath. Even Horikita looked at Sudou with worried exasperation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCurrently, Class D was swimming in fear and discomfort. We needed to accept it and be better.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But I’m trying my hardest for the class’s sake.” He managed to squeeze out those few words despite his anger. However, students around Hirata raised their voices in response.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that really the case?” Yukimura interjected cuttingly. “It seems like you just want to show off how amazing you are. At least, that’s what I think. Your emotions are completely out of control, and they’re making all your decisions for you. If we could win like that, we wouldn’t be suffering now, would we? If you’re going to pretend you’re the leader, then you need to act like it and help all of us.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite the fact that he had been struggling throughout the sports festival himself, he had been earnestly giving it everything he had.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shut up.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I feel the same way, Sudou-kun. It’s precisely \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ebecause\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e we’re relying on you that I want you to see the bigger picture, and take all your teammates’ feelings into account,” said Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shut up!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You should be able to do that, Sudou-kun. That’s why—” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m tellin’ ya to shut up already!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSMACK!\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI saw Hirata, who’d been standing next to Sudou, topple over and hit the ground. Sudou, his eyes bloodshot, didn’t appear to realize the mistake he’d just made. The next person to speak would probably get decked too. Actually, he looked on the verge of punching Yukimura anyway.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, hitting Hirata earned Sudou everyone’s attention, whether he wanted it or not. The teachers were now eyeballing him as well. Even if we tried to cover it up by saying it was a class dispute, things went south really quickly when violence was involved.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s going on?” Our overseer, Chabashira-sensei, approached Hirata, who still lay on the ground. When she saw how enraged Sudou looked and the red mark on Hirata’s cheek, it was pretty easy for her to deduce what’d happened. “Did you hit him?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWithout even asking the reason, she demanded the truth. Sudou didn’t deny it at all. “So what if I did? What then?” he huffed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata quickly climbed back to his feet and corrected her. “No, that’s not it, sensei. I just fell down, that’s all.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It hardly looks that way.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, you’d be wrong to think he hit me. Look, I fell, so there shouldn’t be a problem,” said Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe couldn’t afford to let the truth come to light. Hirata had made a wise decision. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter a moment, Chabashira-sensei spoke again. “If the victim says that nothing happened, then there’s no problem. However, I can tell there’s something going on here. Keep your distance from each other. I’ll be giving my superiors a report later as a preventative measure.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no trouble here at all, but I don’t wish to exacerbate the situation. I understand,” said Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThanks to Hirata’s calm response, that was that. Meanwhile, Sudou, unable to contain his anger, kicked a nearby chair and sent it flying. Beating up Class C while under Chabashira-sensei’s supervision just wasn’t possible.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whatever, do what you want. Go ahead and lose for all I care, you scum. This sports festival thing can go to hell,” Sudou growled.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe glanced over at Horikita for just an instant, but quickly averted his eyes and started walking back toward the dormitory.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Things have gotten pretty bad, Ayanokouji,” Karuizawa said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That has nothing to do with me, though,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji was absent, and now Sudou had walked off. Class D’s chances looked really bleak.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you okay, Hirata?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I’m okay. Man, he really got me good, though,” said Hirata. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFortunately, it seemed like only had a small cut on the inside of his mouth; he had no external injuries to speak\u0026#160;of.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do we do now? This is really bad.”\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e6.9\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eW\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHILE CLASS D\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e dealt with its own problems, the second- and third-year students’ cavalry battle proceeded. Horikita kept staring at her brother, whom she couldn’t approach.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou didn’t return to camp even after the cavalry battles ended and the final event, the 200-meter dash, began. The show went on, no matter who was absent. Absentees would simply be disqualified, unable to earn any points. The rules were clear. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen approached us. “Hirata, what happened to Sudou? He taking a dump?” Ryuuen had to have seen it all happen, but spoke as if he didn’t know anything. Was he trying to mess with Hirata?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Something came up. Sudou-kun is taking a break. He’ll be back soon,” said Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh. I really don’t think lying suits you,” replied Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter he heard his name being called for the second race, Ryuuen began walking off toward his lane.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve taken first place in all the individual competitions so far, right, Ryuuen-kun?” asked Hirata calmly. He seemed placid, but you could hear him getting riled up.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It looks like the only reason you’ve come in first is because you went up against much weaker people. You’re quite lucky, Ryuuen-kun.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Guess luck is on my side.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know how much longer your luck will last, though. Anything can change,” said Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know what you’re thinking,” Hirata continued.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen snorted, indicating that he had no idea what Hirata meant. Hirata continued.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You got Class D’s participation table, and you obtained detailed information about all our students’ athletic abilities, too. You’ve made good use of that information. We’re not stupid. We have a few tricks hidden up our sleeves.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ooh. I’d be scared if that weren’t such an obvious bluff. Look at how far apart Classes C and D are now. Doesn’t it fill you with despair? Even if you know the truth, it does you little good now,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just have one thing to say to you. Before the day ends, I’m going to show you something interesting,” said Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Something interesting, huh? I’ll be looking forward to it.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen didn’t sound fazed in the slightest. He probably had no reason to be, considering that he went on to handily take first place in the 200-meter dash.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s a little over an hour left until Sudou’s turn, huh?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe 200-meter dash continued for the second- and third-year students, followed by a fifty-minute break. If Sudou didn’t return before the break ended, it’d be checkmate. With our ace in the hole gone, we’d never win. Only one person in our class could get to him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wondered if Horikita understood just how vital her role was. After I placed third in the 200-meter dash, I waited for her to finish her own race.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita, do you know what happened with Sudou?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“His leadership came into question, and he realized what a disappointment he was, then ran away.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well…yeah, I guess that’s true.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why are you here? You’re not going to request that I bring Sudou-kun back, are you?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you already know, then don’t ask. Do you understand you’re the only one who can help?” I inquired.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think so. There are other people who can do something. There’s no way \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e possibly could,” she said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWas she serious? Yeah, she probably was. She had no idea that Sudou had a crush on her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides, I’m not exactly in a position to worry about other people right now,” Horikita added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was indeed suffering. Not only had she struggled in all of her matches, but she was also bringing down our class’s point totals. She had a lot to deal with on her own. I understood her feelings. Besides, pretty much no one wanted to go find Sudou after he’d acted so selfishly. They’d abandoned him, although they knew that he could save us in the sports festival. Everyone’s trust in him had evaporated. If Hirata or Kushida had stormed off, the entire class would’ve gone looking for them. In that sense, he was similar to Kouenji. As a matter of fact, aside from Horikita and Sudou, everyone else had just ignored Kouenji entirely. No one took the absence of a member very seriously.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Here’s how I see it,” I said. “You can’t take care of your classmates, and you can’t control yourself. What’s the point of you, then? You’re nothing but a burden.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI knew my question cut her deep, and I was fully prepared to endure her anger.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s an awful thing to say. I’m sorry I got hurt, but I had bad luck. Some things you can’t control, right?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Bad luck, huh? You see your injury as just that—an injury. You haven’t realized a thing.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t make fun of me. I understand the seriousness of the situation. Clearly, we have a traitor who leaked our participation table to Ryuuen-kun. I never thought that someone in our class would want to destroy us, but there’s nothing I can do about that right now,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What else have you noticed?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What else? I know that Ryuuen-kun provoked Sudou-kun.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. Even with all the information in the world on Ryuuen’s side, Sudou—our class’s MVP—was still nearly undefeatable. After all, Sudou’s still powerful on a team and dominates on his own. So, Ryuuen needled and provoked him on purpose, until he got Sudou to drop out. With Sudou out of the picture, Class D’s morale tanked.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, and that’s why our class is in shambles right now.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Have you noticed anything else?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, you can’t mean… You want to speculate?” asked Horikita. “Do I think that Ryuuen-kun set a trap for me? Yes, I certainly do. I guess he told Kinoshita-san to trip me. But it’s hard to blatantly, deliberately cause injury when we’re under such heavy scrutiny. I can’t imagine Ryuuen and his team would intentionally injure me so badly I couldn’t satisfactorily continue with the competition.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I had wanted to, I could have offered her evidence that the injury was certainly intentional. But that wasn’t really important. Instead I said, “How long do you plan to be useless, Horikita?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnless I took drastic measures, Horikita Suzune would never wake up.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“On what grounds do you call me useless?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m calling you useless because you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eare\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e useless.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How dare you? I’m a highly capable student \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eand \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eathlete. I have the utmost confidence that I can triumph over any of these good-for-nothings. Besides, since the information on our class already leaked, isn’t it too late for us to do anything? It’s not just me—we’re all powerless here. So, why label me useless?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you were an ordinary student, it would be fine for you to say that. But that’s not the case, is it? If you’re aiming for Class A, and want to lift your classmates up with you, then it’s about time that you develop an ability to see the big picture.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s why I asked you for evidence!” Horikita shouted. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOur classmates turned toward us to see what was going on.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“‘We have a traitor who leaked our participation table.’” I repeated Horikita’s words back at her. “‘Ryuuen-kun provoked Sudou-kun,’ ‘I guess he told Kinoshita-san to trip me.’ It’s certainly true that you can’t do anything about those things—because you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edidn’t \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003edo anything about them. And, as long as you continue to do nothing, nothing is going to change. Do you plan on whining like this when Ryuuen pulls off another brilliant scheme? You don’t, do you?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s… But, what could I possibly…?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can either prioritize improving your own ranking while Sudou remains absent, or you can let your ranking plummet while Sudou returns and helps pull the class forward. Which of those best serves Class D?” I asked. “There’s no need to answer that, is there? You aren’t nearly as valuable as Sudou right now. It’s time you get the fact that you’re completely useless through your skull. Sudou’s methods are clumsy, sure, but he’s contributed more to our class than anyone else in this festival. And he’s been trying his absolute hardest to win. Is it really okay for you to give up on him just because you claim you can’t afford to care about other people? You’re going to let him sit this out?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita had to understand that much. Even if what I said hurt her, she needed to wake up. I wanted her to acknowledge exactly what she had to do from this point\u0026#160;on.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is so obvious that even an elementary school kid should get it. There’s only one thing we can do to prepare a counterattack.” Ryuuen had strategically taken out Sudou, which meant that we had to strategically get Sudou back.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re throwing away a chance to obtain a weapon that belongs to you, and you alone,” I said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A weapon for me alone?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re aiming for Class A, there’s a limit to how much you can do on your own. Right now, you’re in a situation where you can’t do much of anything. You’re going to face more and more exams like this in the future. When those take place, Sudou will definitely become a valuable asset. For you to make use of that asset, what should you do right now? Pray that your injured leg heals miraculously?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as I used Hirata and Karuizawa as my weapons, Horikita had the opportunity to obtain a weapon of her own. It would be foolish for her to let that chance go by. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll let you think about it. That’s my only advice.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was nothing more for me to tell her. I would neither offer her a strategy to defeat Ryuuen nor teach her how to get through it. Right now, Horikita needed defeat and rebirth.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e6.10\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE MORNING HALF\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e of the sports festival ended with Class D stuck in the worst-possible position. Since we were free to do what we wanted during the break, some people ate lunch in the cafeteria as usual, while others ate at a designated space on the field. The festival seemed to afford more opportunities to eat together with upperclassmen regardless of gender. There was a strong sense of solidarity between students.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOur classrooms were currently unavailable, so we had to eat elsewhere. If we were asked what we liked best about the sports festival, it would probably be the lunch. A mountain of bento boxes had been provided. The meals weren’t made in the school cafeteria, but were high-quality catering brought in from outside campus. Only one type of lunch was free, so nearly everyone chose that option. Some students left the field without touching the lunchboxes, though, and Horikita was among them. Perhaps my words had finally reached her, and she was looking for Sudou. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida also abstained. After telling some other girls that she was going to look for Sudou, she took off.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Gah! God, I’m so tired! Why do I gotta suffer through this, dude?!” Ike cried.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because you lost!” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter losing at rock-paper-scissors, Yamauchi went off to grab everyone’s lunches. “Man, I’m starving. I’m gonna inhale this!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke and Yamauchi showed no real interest in Sudou’s whereabouts. Since they’d known Sudou since day one, they understood his personality all too well. They weren’t going to chase after him. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt most, Sudou would lose out on private points, although his absence would be bad for the Red Team. Then again, some people probably felt grateful that his reign of terror had ended. Most of the girls had seen him punch Hirata. Any minor goodwill people might have developed for Sudou had gone completely out the window. The fact that there had hardly been any change despite the absence of our MVP was honestly a little unsettling.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s just find someplace to eat for now.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs the three of us decided to move, Hirata showed up with several guys and girls in tow. “Is it okay if we come along, too?” he asked Ike and Yamauchi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi and Ike were momentarily shocked that Hirata was reaching out to them, since the three weren’t normally close friends. However, with cute girls in Hirata’s group, they had no reason to object.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, dude.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOur group now contained ten people, including both guys and girls. After finding a suitable spot, we started eating. As people finished up, Hirata and Karuizawa approached me. Smartly done; with a bunch of classmates around, it wouldn’t look odd or unnatural for such a trio to form.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks like Ryuuen-kun’s making his move, as expected,” said Hirata, his voice cutting through all the noise around us. Then Karuizawa had opened her mouth and interjected, as if she had been waiting to speak up.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, who’s the traitor? You know, don’t you, Yousuke-kun?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata just gently shook his head. “There are several things I don’t understand. I wonder if it’ll be cleared up.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I can’t say who the traitor is,” I told them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Why?” asked Karuizawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because, right now, we’d only throw the class into even more turmoil by identifying them. We need to deal with the traitor quietly and calmly,” I told them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay. I won’t hound you. But why did you submit the participation table to the school when you knew there was a traitor? Couldn’t we have adjusted the table ourselves and avoided all this strife? We could have flipped the script on Class C,” said Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Probably,” I said. In truth, I’d wanted Horikita to discover the spy and deal with it appropriately. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait. The traitor might be someone nearby, right? It might even be someone among us right now. Can we afford to take it this easy?” asked Karuizawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe scanned her surroundings, suspecting everyone at the gathering. Traitors were certainly troublesome, but depending on the circumstances, it could be more convenient just to leave them alone. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBesides, even if we’d used Hirata’s strategy, it probably wouldn’t have worked against Ryuuen. Right now, it would be difficult to make Hirata and Karuizawa understand why, so I lied instead.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve taken stock of the traitor’s moral fiber,” I said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Moral fiber?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think they want to reform without being cornered.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata stared at me intently. “And this is all on Horikita’s orders, right, Ayanokouji-kun?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Hirata was already suspicious of me, then he would soon no longer trust me. Even so, I needed him to believe me right now, if only for appearances’ sake.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. Everything is going according to Horikita’s plan.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata didn’t question me any further. He nodded once, seemingly convinced.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, where \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eis \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita-san? What’s she doing?” asked Karuizawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Something only she can do. At least, I hope that’s what she’s doing,” I said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait. Are you talking about Sudou-kun?” Hirata glanced around, noticing that Horikita and Sudou were nowhere in sight. His intuition was on-point.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Without Sudou, it won’t be easy for us to win the second half of the sports festival, right?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. We’re relying on Sudou-kun,” said Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa looked a little dissatisfied by the prospect, but she understood. The sports festival’s outcome now depended on Horikita. If my words hadn’t reached her, it was game over.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_11\" src=\"/hola-lector-agua/images/books/v5/OEBPS/Images/INTERIORIMAGES_11.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 6: The Curtains Rise\",\"volumeId\":\"v5\",\"chapterIndex\":12,\"prevChapter\":{\"volumeId\":\"v5\",\"chapter\":11,\"title\":\"Chapter 5: There's a Reason for Their Relationship\"},\"nextChapter\":{\"volumeId\":\"v5\",\"chapter\":13,\"title\":\"Chapter 7: For Whose Sake?\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Title Page\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Sudou Ken's Soliloquy\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: The School Sports Festival Begins\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: Class D's Objective\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: Everyone's Calculations\",\"href\":\"Text/section-0008.html#auto_bookmark_toc_top\",\"index\":10},{\"label\":\"Chapter 5: There's a Reason for Their Relationship\",\"href\":\"Text/section-0009.html#auto_bookmark_toc_top\",\"index\":11},{\"label\":\"Chapter 6: The Curtains Rise\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_top\",\"index\":12},{\"label\":\"Chapter 7: For Whose Sake?\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_top\",\"index\":13},{\"label\":\"Chapter 8: What You and I Lack\",\"href\":\"Te
