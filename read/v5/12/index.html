[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T2dadd,"])</script><script>self.__next_f.push([1,"\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 6:\u003cbr/\u003eThe Curtains Rise\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT LAST\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the day had come. The curtains were about to rise on the sports festival, and it looked to be a long day. The entire student body, all wearing their jerseys, marched together as one. Well, we called it a march, but most people just strolled along, taking the movement just seriously enough not to disrupt the order.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, time to really show off for Kikyou-chan!” shouted Ike as he walked directly behind me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHow did he plan to show off when he was bad at sports? The guy was all bark and no bite.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFujimaki, from the third-year Class A, gave a speech during the opening ceremony. Although there weren’t many, a number of spectators watched from the school grounds’ outskirts. They were probably adults who worked on campus. The school didn’t seem to have put any strict restrictions in place regarding who could attend the festival. Occasionally, one of the spectators smiled or waved.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMeanwhile, the teachers themselves watched us without the vaguest hint of smiles. Medical personnel could also be seen setting up some kind of cottage. \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e could fit around twenty people and was equipped with an air conditioner and water cooler. The school’s preparations were as meticulous as they had been on the deserted island. They provided tents for the Red Team and White Team; the tents faced each other on opposite sides of the track. The school didn’t want the teams mingling with each other, except during competitions.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Man, they sure are prepared. They even went so far as to install cameras to help them make the final decisions.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe first event of the festival was the 100-meter dash, and I saw that a camera had been installed and pointed toward the finish line.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That way, they’ll definitely avoid any incorrect judgments or vague results.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe line between victory and defeat could come down to a hair’s breadth in competitions like these. I supposed that was why they hadn’t included events like cheerleading, which were challenging to score.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e6.1\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003e“W\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHAT GROUP\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e are you in for the 100-meter dash, again?” Horikita asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seventh,” I answered, looking over at the program table, which had the participation order and schedule.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hopefully no one exceptionally good turns up. I’ll be cheering you on for the class’s sake.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll do my best not to come in last, then,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that unambitious goal, I headed to the track with the rest of the first-year boys. The festival ordered events such as the 100-meter dash by grade level, starting with the first-year boys and ending with the third-year girls. Then there’d be a break, after which the order would switch. We’d resume competitions in the opposite direction, starting with third-year girls and ending with first-year boys. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe competition was about to start. All the pairings had been decided according to the printouts each class had received in advance. Now we’d finally learn who would run from which class, and in what order. The first-year boys formed ten groups in total; mine was seventh. Each group contained eight people, two from each class. Sudou was in the first group.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAll of Class D watched, holding their breath. This festival’s outcome depended greatly upon Sudou. If we won this premiere event, we’d have Sudou run first for us so he could take the wind from our opponent’s sails. Everyone on our team could use that momentum to get hyped. If Sudou did poorly, it would probably put a dent in our spirits.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“From my point of view, nobody here’s really that big a deal. I see lots of fatties and twigs. Sudou’s got first place covered!” shouted Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t see any students of note from the other three classes in Sudou’s group. Like Ike had said, Sudou’s victory was probably assured. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then again, depending on how you look at it, this could be a big loss for us.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIdeally, if we were using an incredible athlete like Sudou, then it would have been better to have him compete against fast opponents. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, there’s nothing we can really do about that. It’s\u0026#160;just luck.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was definitely Something about seeing Sudou hunched and ready at the starting line inspired feelings of absolute confidence. Even if he did happen to take a spill in the middle of the race, he’d still be all right. He could do this.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs soon as the signal sounded, Sudou shot forward like a bullet. He quickly outran all the other boys, leaving them in the dust. He reached the goal with such an overwhelming lead that no one else came anywhere close. He\u0026#160;won by a landslide.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile everyone watched, Sudou took first place, as anticipated. Meanwhile, the Professor—the second Class D student in the first group—managed to come in last. We’d anticipated that, too.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe signal to start the next race came right away, without any time to bask in the afterglow. The signals came at about twenty-second intervals, which meant that it would take four minutes for all the first-year boys to finish running. This event would repeat for all the boys and girls in all three grade levels, which meant that the 100-meter dash should finish in about thirty minutes.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just as we’d expect from Sudou-kun.” Hirata, my partner, seemed genuinely impressed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. Feels like the other classes were pretty dumbstruck, too.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe didn’t simply take first place; he’d also left a strong impact on everyone. Just like Sudou and the Professor, we in the seventh group also had our roles to play. Hirata, who belonged to the soccer club and was a fast runner, was sure to place high. I’d take a spot at least one place after him, so there was really nothing to be anxious about. It was just a question of how to stand out while remaining inconspicuous. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were several students from other classes to be wary of. I wondered which groups had athletic students like Kanzaki and Shibata, and which boasted students with a strong presence like Ryuuen or Katsuragi. The third group hurried to the starting line.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, Baldy’s—I mean, Katsuragi’s—in the first lane,” said Ike, pointing at Katsuragi’s head.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSunlight shone on Katsuragi’s scalp, lending it a brilliant sheen. Next to him, I saw another guy I knew: Kanzaki from Class B. He looked pretty calm. So, Katsuragi and Kanzaki would be competing against each other, huh?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe formidable Kouenji was also supposed to be in the third group, but there was no sign of him in Lane\u0026#160;5, which he’d been assigned. No one from the school bothered to search for him. They just marked it as an absence and immediately started the race.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI thought that the third group would be a close match, but Kanzaki was fastest. Katsuragi was by no means slow, just outclassed. The race ended without much fuss. Kanzaki took first place and Katsuragi third. As the races continued, Hirata noticed something.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun. There,” he said, gesturing at the temporary cottage that had been erected.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I strained my eyes to look, I saw Kouenji inside, fussing with his hair. He certainly hadn’t just come back from a run. Still, it was too soon for him to just withdraw.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Apparently, he’s not participating.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji had cooperated all the way up until the opening ceremonies, but in the end, it appeared that he planned to bow out of the competitions. Kouenji would probably make some kind of excuse to get out of it, saying his feet hurt or he wasn’t feeling well. If he wasn’t participating in any of the competitions at all, then that meant he wouldn’t be able to get any points, not even last place. His absence weighed heavily on both our class and the Red Team. Class A had Sakayanagi, who also wouldn’t participate in any events, but at least she had a valid reason.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Classes B and C had no absentees, the Red Team would need to make up for their two missing members. That was quite the handicap. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe rest of the competition progressed smoothly, and soon it was time for the seventh group. I went and stood in Lane 4, with Hirata next to me in Lane 5. There was also Yahiko, from Class A, but the rest of the competitors were guys I wasn’t familiar with. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was the first sports festival of my life. I started off with a medium dash, neither fast nor slow. Hirata slowly but surely passed me and joined the top runners. I saw four people’s backs in front of me, which meant that I was in fifth.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBecause there wasn’t a huge difference in speed between us, we all kind of clustered together. As we continued to run, our order didn’t change. In the end, I finished in fifth place. Hirata narrowly took the top spot.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whew. Good job,” he said, taking a deep breath.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry. I dragged us down,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not true. Everyone was fast. It was a good race,” said Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite my disappointing results, he didn’t blame me at all. Instead, he gave me a smile. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe hurried off the track and headed over to the tent. The next group would be starting, and we were in the way. After the first-year boys finished running the 100-meter dash, they returned to their seats and focused on watching the girls with a predatory intensity. They cared about the race’s outcome, of course, but they also just wanted to watch the girls run.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Where’s Sudou?” I asked. He should have returned to his seat by now.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who knows? Maybe the toilet? Dude, we’ve got more important things to look at. Check out those jiggling boobs, man, those \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eboobs\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e!” said the chipper Ike. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI immediately had a bad feeling about Sudou’s absence. He should have been cheering Horikita on, so his disappearance was strange.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No way.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI looked over toward the cottage to see that my intuition was correct. Sudou was approaching Kouenji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This isn’t good. I need to stop them,” I said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah,” replied Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaving both noticed the same thing, Hirata and I ran toward the cottage, where things were apparently already heating up. His hand balled tightly into a fist, Sudou confronted Kouenji. “Hey, you. What’s the big idea, sitting this out?! Don’t disregard the rest of us, jerk!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen we opened the door, we could already hear Sudou’s threatening voice. He seemed ready to throw a punch any second now, but Kouenji pretended not to notice. It was a bold move. He just kept admiring his own reflection in the window, which only made Sudou angrier.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks like you ain’t gonna understand unless I beat you up, Kouenji,” Sudou growled.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. You can’t do that, Sudou-kun. If the teachers find out—” Hirata tried to stop them, but Sudou wasn’t the kind of guy to be deterred.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t care. This is a class problem, right? It don’t even matter if I beat him up, long as this punk doesn’t go crying to the teachers,” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re quite foul, aren’t you? I came here to enjoy some me time. Alone. As you can see, I’m feeling quite ill today. I decided to withdraw so that I wouldn’t be a burden,” said Kouenji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t give me that bull crap! If this was just practice, that’d be one thing, but you’re skipping out on the actual event!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI understood why Sudou was shouting. Kouenji looked to be in perfect health. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. Don’t, Sudou-kun!” Hirata panicked. But before he could intervene, Sudou threw a punch. He probably intended to knock sense into Kouenji, but Kouenji stopped the blow, catching the other boy’s fist in his palm. He was always doing the unexpected.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA dull \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eslap\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e echoed through the cottage.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Stop. You cannot hope to beat me.” Kouenji didn’t even look at Sudou as he spoke.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou hadn’t held back with that blow. Now that the other boy had blocked it easily, he had to realize Kouenji’s real strength, but that only seemed to fire him up even more. “Bring it on. I’ll smash in your nose,” Sudou growled.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Goodness. Both you and that girl seem to consider me unreliable,” replied Kouenji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“‘That girl?’ Who?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That cold girl who’s so inflamed your passion. She’s been telling me over and over that she wants me to seriously participate in the sports festival.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, Horikita had foreseen the possibility that Kouenji would be absent from the start. Considering the fact that he had retired right away back on the uninhabited island, it made sense. Even so, I didn’t know that Horikita had been working on Kouenji without my knowledge. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In any case, leave now. I’m not feeling well,” said Kouenji, waving us away.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You jerk!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTo prevent a second punch from flying, Hirata stepped between Sudou and Kouenji. “Let’s all just calm down a little. Kouenji-kun’s attitude is a problem, but if he says he’s not feeling well, then he has the right to rest. Besides, violence is bad, no matter the circumstances.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But he’s definitely lying! He said the same thing back on the island,” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That is a baseless accusation. My proud carriage serves to disguise how poor my health is,” said Kouenji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re planning on skipping the rest of the competitions, too, huh?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I recover, I will of course participate. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eIf\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I recover,” replied Kouenji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou couldn’t contain his anger anymore, but we couldn’t wait around on Kouenji forever.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The next competition is about to begin, Sudou-kun. You’re our leader, so your absence impacts our morale,” said Hirata, switching tactics.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fine. I’ll head on back,” groused Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you,” said Hirata. He escorted Sudou from the cottage, and I followed a little way behind. We made it to the Red Team tent, where Sudou sat back down, clearly still irritated. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Damn! Next time, I’m seriously going to punch that jerk,” he huffed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHis anger, rather than dissipating, only continued to swell. In keeping with the adage that “a wise man keeps away from danger,” people started giving him a wide berth. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke, however, was too engrossed in the girls’ race to notice Sudou’s frustration. Before I knew it, the girls’ 100-meter dash was nearly over. The final group had just entered the track.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you doing, Ken? The girl you like is about to start, dude!” Ike cheerfully slapped Sudou on the back. Sudou grabbed his arm and forced Ike into a headlock.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Gah! Dude, the hell?!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Stress relief,” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ouch, ouch, ouch! I give, I give!” shouted Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a pitiful sight, but taking his anger out on Ike seemed to help Sudou. He began to calm down a little. Meanwhile, Horikita got onto the track as the race for first-year girls began. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose that I feel better watching Suzune, at least…” said Sudou. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf that was all it took to heal him, then I’d let him heal. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I watched Sudou, Sakura appeared next to me, completely out of breath.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ahh…ahh…! I-It hurts…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe must’ve used up all her energy when she ran. She was breathing very deeply, as though she was in a lot of\u0026#160;pain. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-were you watching me, Ayanokouji-kun?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_9\" src=\"/hola-lector-agua/images/books/v5/OEBPS/Images/INTERIORIMAGES_9.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe looked up at me, her eyes sparkling behind her glasses. Unfortunately, Sakura’s race took place while I was chasing Sudou, so I hadn’t seen a thing. Of course, if I told her that, she’d probably be really sad.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You did well,” I said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy response was brief, but filled with emotion. One fact that I could be absolutely certain of was that Sakura definitely gave everything she had.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Th-thank you! This is the first time I didn’t come in dead last.” She beamed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhenever we’d practiced, Sakura was always the slowest out of everyone by far. It seemed that she’d finally beaten someone else—because of her own hard work, too, not an opponent’s mistake.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just don’t push yourself too hard. You might hurt yourself,” I said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“O-okay!” she replied with a smile.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura stood beside me, still breathing heavily, and looked over at the next race. I focused on the other girls who would run against Horikita. In the third lane was Ibuki Mio, a Class C student. Horikita was in the same group as her most bitter rival. What a bizarre coincidence.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita didn’t even look at Ibuki, but Ibuki wore a furious expression, as though fire shot from her eyes. She was determined never to lose to Horikita, no matter what.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, I wonder if Ibuki-chan’s good at sports?” the other boys speculated.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hell if I know. All I know is Horikita’s gonna win, no doubt.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no way the other guys could have known, but Ibuki was highly athletic. Personally, I couldn’t say for certain who would win. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen the signal sounded, seven of the girls launched themselves forward. Between the two I focused on, Ibuki had the better start. Horikita’s reaction was slightly delayed, so she lagged behind the rest of the group. However, she immediately picked up the pace and began to catch up to Ibuki, who seemed distracted. She glanced behind, perhaps curious about Horikita, and the distance between them closed. Ibuki remained stuck in the middle of the group, neither increasing nor decreasing her distance from Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs they neared the end of the race, Ibuki’s expression stiffened. She and Horikita were neck and neck, running side-by-side. Horikita, looking quite pleased with herself, managed to nudge ahead of Ibuki by a narrow margin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh oh, is she in trouble…?” muttered Sudou. His hunch turned out to be correct.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki ran harder, fighting to close the distance between herself and Horikita, who was in the lead. Horikita tried to shake her off, Ibuki just chased her down even harder. Horikita managed to cross the finish line first. After an incredible race like that, everyone erupted into cheers. I\u0026#160;wouldn’t have been surprised if the judges would need to replay the video to be sure.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNext to the out-of-breath Horikita, Ibuki kicked the ground in frustration. I got the feeling that if she hadn’t been so concerned about Horikita, the race results would have been different. A slight gap in her awareness was the reason Horikita won.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Those two completely outran everyone else,” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was still watching Horikita even after she had finished running. Even though Horikita and Ibuki were just about evenly matched, excluding Class D, the other four girls had been pretty slow.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter the first-year students’ 100-meter dash ended, we went to check the results. Athletic people like Sudou, Horikita, and Hirata had taken first place, as expected. However, the mid-tier students we’d hoped would do well hadn’t performed so great after all.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on. Get it together, everyone. Especially you! Your speed’s the only thing you’re proud of, right?” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yeah, but that Shibata dude’s just too good, man.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nothing we can do about it. Shibata-kun’s even faster than me, after all,” said Hirata. That was true. I’d seen it during club practice. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though we’d gotten off to a good start overall, tracking our scores would get more complicated from here. No notebooks or phones were allowed, and though we could talk to one another about the results, we couldn’t know what the other classes were planning. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI approached Horikita, who’d just gotten back.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That was close,” I said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I suppose. Ibuki was faster than I expected,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps she had noticed Ibuki walking up to her, but Horikita breathed a sigh of relief.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you reached out to Kouenji,” I said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who told you that? Well…it seems like it was meaningless anyway.” Horikita looked over toward Kouenji’s little hideaway cottage. “I was worried he’d skip out on the competitions, and that’s exactly what happened.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems like he doesn’t care about reaching Class A.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe would continue to loaf around as long as he didn’t get expelled. It was his decision, and nobody could convince him otherwise. However, Horikita wasn’t entirely convinced.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe if I were popular like Kushida, I could have gotten to him.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know about that. I don’t think he’s the type to listen to Kushida, or even Hirata,” I replied. Then again, those two wouldn’t have tried to berate Kouenji in the first place. Even though Kouenji was clearly lying about his illness, they wouldn’t have called him a liar to his face.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To think you’d wish you could be more like Kushida,” I chided.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I never hated her or anything.” Horikita realized that she’d slipped up, and immediately clamped her mouth shut. “You didn’t hear that,” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, she marched off to watch the third-year students’ races, which would start soon. She was concerned for our class, but most likely also worried about her brother. Of course, it wasn’t as though her brother, the student council president, cared about his little sister’s feelings in the slightest.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita’s older brother, as part of the second group to race, naturally took first place.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He’s just as fast as I imagined,” I said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s because my brother is perfect. No matter what he does, he’s always number one,” Horikita answered. She wasn’t bragging. She said it as if it were a simple fact. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter each grade level finished the 100-meter dash, the final results were tallied. The first round of points for the\u0026#160;Red and White teams were announced. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRed Team: 2011 points. White Team: 1891 points.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe competition had just begun, but the Red Team was slightly ahead.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e6.2\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE HURDLE RACE\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e came next. It was like the 100-meter dash in that it was based on speed. However, that wasn’t all there was to it. You also needed to clear hurdles while running. If you knocked down or touched a hurdle, your time was penalized. If you knocked the hurdle down, the penalty was 0.5 seconds. If you only touched it, 0.3 seconds. There were ten hurdles in all, placed at ten-meter intervals. If you knocked them all down, you’d have five seconds added to your time. It’d be completely hopeless. Thus, you couldn’t rush; you had to carefully clear every hurdle.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou was starting in this competition’s final group. “If you guys place last, I’m gonna slap you,” he said, arms crossed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe unathletic students trembled at the pressure.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dude, what kinda tyrant are you?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, um, is Sotomura-kun here? If he’s absent, he’ll be disqualified,” said the referee at the starting line.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“R-regrettably, it would appear that my stomach is upset. Would it be permissible for me to take an absence?” asked the Professor. He’d just barely cleared the hurdles during practice, and looked as though he was chickening out.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Dude, it’s fine if you knock all the hurdles down. Finish the race at any cost!” shouted Sudou. He stuck his face close to the Professor’s and glared.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Egad! O-okay, I will!” shouted the Professor.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was a significant difference between coming in last and being disqualified. If you were disqualified, you wouldn’t get even one point. Participation was vital.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the end, the Professor didn’t clear any hurdles. He knocked them all over and finished in last place. “Ugh, he’s useless. It’s ’cause he just sits around on his butt that he’s so fat,” grumbled Sudou. “Still, that Shibata guy is pretty good.” While he watched, he spoke as though he were telling us to be wary.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShibata had come in first without much difficulty, and was shaping up to be Sudou’s main rival. Furthermore, like Ichinose, his leadership qualities made others rally around him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we face each other head-on, though, I’ll win,” he declared.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Shibata kept this up, Sudou’s goal of being first out of every student across every grade level would become a distant dream, especially since no one knew what the team competition results would be. It was concerning.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Next up is the fourth group. Please get ready,” said the referee.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI got into the same lane as before, and saw Kanzaki standing in the second lane.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We meet again,” said Kanzaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Go easy on me,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ichinose says you’re pretty fast,” he replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t know where Ichinose had gotten that idea. Then again, back during the incident with Sakura’s stalker, she might have seen me running. I hadn’t been sprinting at full speed or anything, but she must have seen enough to judge.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose had also been observing me back when I amused myself by playing with her in the pool. I supposed I couldn’t avoid her singling me out throughout the events and exams.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She’s exaggerating. Didn’t you see my ranking in the 100-meter dash earlier? I got fifth.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure, but it didn’t seem to me that you were taking the race seriously,” Kanzaki replied. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no advantage to gain from holding back, right? You just lose,” I responded.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When you think of it as a strategy, it’s not completely meaningless,” he said flatly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, Ichinose and Class B really did their homework. They didn’t just know my ranking; they also understood my thought process.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know, you’re really calm for a high schooler,” Kanzaki added. “It’s scary.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, feel free to judge me however you want.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA boy from Class C got between us, cutting our chat short. With the exception of Kanzaki, I didn’t really know anyone in the fourth group, which meant that I didn’t know how fast the other competitors were. If my ranking rose even a little bit, it could be bad.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen the signal came, I started running about as fast as I had before. Kanzaki overtook me, but because only one other student got in front of me, I ultimately ended up winning a fairly respectable third place. There were a lot of variables to consider, but for better or worse, I’d been able to maintain my inconspicuous position. I\u0026#160;walked back to camp.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aah, jeez. I can’t keep up,” groaned Yukimura.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was grumbling to himself, seeming downtrodden. From the looks of things, he hadn’t gotten good results during his second event.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That bad, huh?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji? Agh, I’ve been cursed. Seventh and seventh,” he grumbled. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eTwice a consolation prize winner, huh?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e That was pretty rough.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It all depends on your mindset, Yukimura. Even if you fail here, you can ace the written tests. Right?” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I won’t fail, but my scores will plummet. Besides, I’ll drag down my class and my team,” said Yukimura.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince Yukimura wanted to make it into Class A more than anyone else, he also felt the burden of responsibility more intensely than anyone. And because he normally criticized students with low academic ability, like Sudou, he was probably reluctant to show any weakness here. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t want to say the wrong thing, so I decided to give Yukimura space, and focused on the girls’ hurdle races instead. Two people I knew were running in the first race: Horikita and Sakura. Horikita, who expected to win, didn’t seem to feel any pressure. On the other hand, as bad as it sounded, we had zero expectations for Sakura. She appeared to be trembling.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, um, Horikita-san. This matchup isn’t very good, don’t you think?” said Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really?” replied Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata, who knew a lot about the other classes, voiced his concerns after seeing the groups. The competition was just about to begin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Class C’s fastest students are Yajima-san and Kinoshita-san from the track and field club. They’re both in your group,” said Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the debut event, the 100-meter dash, Horikita had been able to emerge victorious after a fierce battle against Ibuki, but it seemed like her trials hadn’t ended yet.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Winning might be difficult.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata turned out to be right. Horikita threw everything she had into the race, but the two from Class C got ahead of her, and she ended in third place. After the race finished, Hirata looked over at me. I could tell that he felt uneasy about the way the composition of Horikita’s group had turned out.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e6.3\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE NEXT COMPETITION\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e was capture the flag. Though simple, it was still a fierce and slightly dangerous event.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right. We’re definitely winning this one, guys. Since that moron Kouenji ain’t here, we’ve gotta get that much more fired up!” shouted Sudou. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was trying to inspire the Class A and D guys assembled in front of him. They were facing off against the guys from Class B, led by Kanzaki and Shibata, and from Class C, led by Ryuuen. Some particularly formidable-looking Class C students were in that group, although we didn’t know them. There were Sakazaki and Komiya, two students who had been involved in that fight with Sudou a while back. There was also a large, brawny half-Japanese and half-black student named\u0026#160;Yamada. I’d\u0026#160;seen\u0026#160;him\u0026#160;around school on occasion, and wondered just how strong he really was.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, regardless of our numbers, there was nothing to do but fight with everything we had. According to the game rules, the group that made two captures would win. During their earlier discussion, Katsuragi and Hirata had decided that our classes would swap back and forth between offense and defense. Dividing us up into offense and defense would have been too risky. This way, it would be easier to understand and to cooperate.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass D would be on the offensive first, while Class A would protect the flag. If we successfully got a head start, we’d prioritize keeping that momentum and continue with our roles.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, don’t worry. I’ll beat our enemies to a pulp single-handed,” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh, but aren’t you supposed to go after the flag?” I\u0026#160;was getting a little worried.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can’t make any promises. I’m all pissed off, thanks to Kouenji. Grr,” Sudou growled.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe flipped the other team off, not even trying to hide his hostility. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Better keep my distance,” Ike muttered. He and the others backed away from Sudou, afraid of getting involved. I thought that was wise.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe offensive team (mainly Sudou, though) waited impatiently for the starting whistle, standing at the ready. On the other hand, the defensive team—consisting of Katsuragi and the others—checked the status of their formation several times over, making sure to establish a solid defense.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBlatant violence, like punching and kicking, was naturally prohibited. However, the school would overlook a certain degree of roughhousing. Pushing, grabbing, and such were expected.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh. I’m starting to feel a little scared. This is the first time I’ve played capture the flag.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait. Didn’t you have it in a junior-high sports festival or something?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No one ever told me that it was gonna be dangerous! Have you played this game before, Ayanokouji?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nope. This is a first for me, too,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The hell, dude? A first for you, too?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile we were still in the middle of our boring conversation, the signal went off. Sudou charged in headfirst, ahead of everyone else. Soon the more assertive players followed right after him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dude, this is bad! Let’s go, Ayanokouji! I really don’t want Sudou to kill me for trying to skip out!” Ike wailed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe less-aggressive students included Ike, Yukimura, and myself. We slowly brought up the rear. Like us, the B and C group had neatly divided their forces between offense and defense. Cooperation was more difficult for them than it was for us, after all. It looked as though Class B was defending the flag in the first round. They waited for us up ahead. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was forbidden for an attacking team to come into contact with the other side’s attacking team. The rules stated that the offense had to focus as much as possible on capturing the flag.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyone who wants to die, bring it!” Sudou let out this outrageous roar as he dove right into the opponents’ defensive line. Using his height, and a level of power unimaginable for a first-year high schooler, he tore through the students around the flag, one after another.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Stop him! Stop Sudou!” shouted someone from Class B. A number of students on the defending team surrounded Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, you guys. Come quick! Here, I’ll clear the way!” yelled Sudou, not even looking back while he shouted instructions to his advancing allies. Of course, it wasn’t that simple. As the situation grew increasingly chaotic, the players kicked up dust to cloud the air. The playing field was turning into a battleground. I decided to make myself as useless and inoffensive as possible, and relied on the Class B students to overcome the situation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shit. Just how many of you are gonna come after me?!” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThree or four guys pushed up against Sudou, managing to overpower him. The advancing group got cut off just as they were on the brink of breaking through. Class D’s problem was that, despite Sudou’s offensive and penetrative powers, no one else could claim to be particularly strong. Students who were especially unaggressive, like the Professor and me, inevitably became a weak link in our offense. By contrast, many Class B students had above-average strength.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dude. This is bad, Ken! Class A! That one half-Japanese guy, Yamada or whatever, he’s going on a rampage!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou turned around to look. The Red Team’s flag, which Class A had been protecting, looked slightly askew. Class C was full of violent people like Sudou. Actually, it was full of students who were almost martial artists, in a way. Our defenses must’ve looked easy for them to break through. It was pretty clear who held the advantage. If Ryuuen ordered them to attack us, we’d end fighting like our lives depended on it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe needed to do something. But four or five people blocked Sudou—our side’s crucial player—so he was helpless. We were completely locked down. Sudou desperately tried to race for the flag, but unfortunately, the whistle blew. I couldn’t help but admire his tenacity for trying to take them all on at once. In the end, the White Team managed to get the first point.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, come on! What are you guys even doing?! C’mon, fight like your lives depend on it!” shouted Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile he glared at the tragically toppled flag, he directed his anger at the rest of Class D, since we hadn’t mounted a successful attack.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dude, you telling us that doesn’t help. It’s just, like, those guys are really strong, you know? Ouch! Uh, I got a scrape, man.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, it’s just a scratch! Grit your teeth and man up. I don’t care what you do. Bite, kick ’em in the knees, but do something to fight back, man! You’re useless!” shouted Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI understood how he felt, but either of those actions could be considered foul play, and a way to get expelled in one go.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no use complaining. They won the first round. Next time, let’s make sure to protect our flag properly,” said Hirata, gently patting Sudou on the shoulder. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tch. All right, this time we’re \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edefinitely\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e gonna protect our flag. Right, everyone?!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yeah, we got it. We’ll do whatever we can.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, don’t just ‘do whatever you can.’ We’re \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edefinitely\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e protecting it, for sure. Even if it’s for an hour—or \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003etwo\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e hours!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass D also lacked things like unity and motivation. That included yours truly, of course, but most people were really lacking in ambition. Meanwhile, Class B was completely united. The students were highly motivated, so they made formidable foes.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji, don’t let the flag go down, even if you die! Even if it’s just a joke, you’re still number two in the class!” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, ranking right below Sudou in terms of strength meant that I needed to protect the flag alongside him. I couldn’t slack off with him watching. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, no screwing around! We can’t let ’em get another win! I’m gonna send that jerk Ryuuen flying!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDuring the first round, Ryuuen had been on the attacking team. However, he had really just stayed back and observed, probably because they were already dominating our side. Sudou likely hated that.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right. Come on and attack, C. Come and attack us, C,” Sudou muttered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe could mutter all he liked, but if Class C assembled and launched an attack, we’d be in trouble. It would be better for us if Class B went on the offense. The second round was about to begin. Then, sure enough…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They’re coming! They’re coming, they’re coming!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, things were progressing exactly as Sudou wished—though it came as a bit of a surprise to me. The powerful Class C students geared up to launch their attack, Ryuuen laughing fearlessly from the rear. As if he were a general commanding his troops in battle, he gave the order to charge immediately after the starting signal. A simple “knock it over” came from his lips, and his terrified soldiers stormed toward us.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStudents who looked as big and brawny as Sudou rushed us headfirst. The Class D students screamed. Our outer wall of defense was rapidly crumbling. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Stand! Grab their legs and pull them down!” Our opponents’ angry roars drowned out Sudou’s words of encouragement. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe Class C students repeatedly used elbow strikes, which were nearly foul play. In practically no time at all, they broke through to the center. Katsuragi from Class A had also advanced to where he could nearly touch their flag, but I wondered if he’d make it in time.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Gah!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI heard an agonized cry from Sudou, who was supporting the already-tilted flag. The half-Japanese guy, Yamada, had gotten up close. His physical mass far surpassed Sudou’s. The flag we were supposed to be protecting was already slightly slanted. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who the hell punched me in the stomach?!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the chaos, someone had attacked Sudou directly. Judging by how angry and pained he sounded, it probably hadn’t been just once or twice, either. However, there was nothing Sudou could do about it. With our flag in his hands, all he could do was bear it and brace himself, like a turtle trying to hide in its shell. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ow. Damn. That hurts, you jerks!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Class C showed no sign of stopping. Sudou fell to his knees in pain. I commended his fighting spirit as he continued to protect our flag. Then, someone stomped on his back with all their might. It was as if the assailant were trying to assert his dominance, like he was a king.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Gah?!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a fiendishly low blow, even in the midst of a particularly messy and chaotic match. Of course, the perpetrator was none other than Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-you bastard! Ugh!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen bore down hard again mercilessly, with such force that I feared he might break Sudou’s spine. When Sudou collapsed, the flag lost its support, producing a cloud of dust as it fell to the ground. In the blink of an eye, it was over.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStill collapsed on the ground, Sudou glared up at Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh-uh, you jerk. That was foul play!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm? Oh, I didn’t notice you,” replied Ryuuen. He picked up the flag without any hesitation. Sudou tried to go after him, but due to the pain, couldn’t yet stand back up. The Class D and A coalition had suffered a great loss.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, is your back okay?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh. I think I’m all right, somehow. Damn! Goddamn it!” Sudou’s anger at having been the victim of such foul play seemed greater than his pain. He couldn’t contain himself. “That smug ass! The next time I run into him, I’m gonna lay him out flat!” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’d only cause another scandal. Do you want a repeat of last time?” I asked. I was referring to the day when Sudou got into a fight with Class C students, and was almost expelled as a result. If he initiated a fight here, then he would be punished.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, it’s okay when \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehe\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e does it, but not when I do it?! Look at my back!” Sudou shouted.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I get it, but they’ll probably just claim it happened in the heat of the moment,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen and Sudou were both trying to do the same thing, but there was an overwhelming difference in their technique. This time, the act had taken place in the middle of the competition, when the students were all entangled in a dusty, chaotic mess. At any rate, he’d been clever about his tactic.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, I’m so pissed! And here I was, planning on winning every contest!” he grumbled.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe Class A students could hear this, and some guys sent glares Sudou’s way. Katsuragi stopped them before they could retort. “I apologize that we weren’t of much use,” he said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eshould apologize. It’s because we couldn’t protect the flag. Let’s do our best in the next game,” replied Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnly Katsuragi and Hirata had calmly accepted the outcome of the event. For the time being, we disbanded and returned to our own tents.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e6.4\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eW\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eITH NO TIME TO REST\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the first-year boys got ready for the tug-of-war. Meanwhile, the first-year girls were making steady progress in their ball toss. The team competitions continued. I hadn’t paid much attention at first, but the competition order was fairly arduous. It took a lot out of us.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How much of a gap between the teams do you think there is now?” asked Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dunno. Things just got started. No use thinking about it yet,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s true, I guess. Still, a loss is a loss. They’re one step ahead of us now, right?” said Sudou. He fidgeted, his legs shaking while he watched the girls’ match, unable to stand the fact that we’d lost. “It’ll be good if the girls win this one, at least,” he muttered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBecause we were some distance away, we couldn’t clearly discern how the ball toss would end. All I could think was that it looked like a close battle. The game finished soon afterward, and the teacher in charge counted up the points while clearing away the balls.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“With fifty-four points total, the Red Team wins.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe girls had canceled out the boys’ disappointing capture-the-flag results. Our relief was fleeting because the referee called us over to start the tug-of-war. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, let’s do this!” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, is your back okay, Ken?” asked Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“S’okay. I’m tougher than most, so I’m all right. Besides, even if it hurts, there’s nothing I can do about it, so it ain’t no problem,” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though we were worried, Sudou stood strong. The rules for tug-of-war were extremely simple. It was almost exactly the same as capture the flag; the first team to get two points won. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we make a comeback in the tug-of-war, we can turn the team competitions around. Besides, in tug-of-war, there’s no physical contact. That means both sides have to rely purely on their own strength. It shouldn’t turn into some ridiculous brawl,” said Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata was always mindful of those around him. Sudou looked pleased.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Guess you’re right. That’s exactly why we can’t lose this,” Sudou said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA pure test of strength; our power and wits against theirs. Who would triumph? As the four classes gathered, we split into two groups to the left and right. Katsuragi drew near Hirata and whispered something quietly into the other boy’s ear.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay. Just like we discussed, we’ll use our strategy to beat them in a single stroke. Sound good?” asked Katsuragi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. Got it. All right, everyone. Get in position,” said Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe’d come up with a strategy under their leadership, like we did for capture the flag. After Hirata gave us instructions, Class D split up and took our positions on the fie
