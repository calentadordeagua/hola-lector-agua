[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T1941e,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 5:\u003cbr/\u003eEach and Every\u003cbr/\u003eDifference\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eW\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ee had reached the final day of the test. Unlike on the island, time passed quickly aboard this ship, surrounded by luxury. While Ryuuen focused on his united frontal assault, and Katsuragi continued ahead with his iron fortress strategy, Ichinose Honami from Class B had not come up with a countermeasure.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Gah! I drew it again! Am I seriously this awful at Old Maid?” Ichinose spread out her remaining cards and collapsed into a heap before my eyes. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though this was our fifth discussion period, Ichinose had suggested playing cards once again. I would have questioned this approach, but no one in Class A entered into the conversation, so no one stopped her. A small group of people had simply determined that it was better to spend their time playing cards than doing nothing.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was a little concerned that Manabe and her friends would try to confront Karuizawa, but it seemed like the picture I’d sent them had had the desired effect. They were being obedient. Karuizawa was acting normal, too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I were to look at things from Manabe’s perspective, she had to be thinking that the person who sent her those mysterious messages via chat must have been either me or Yukimura, someone who was there during the incident in the emergency stairwell. Of course, when I sent her the picture, I added that I had received it from a classmate. She could imagine that someone had sent the picture to someone else, and it had circulated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the end, Manabe couldn’t conclude with absolute certainty that it was me. That meant she and her friends wouldn’t be able to make a move against me. There was no point in looking for whoever took those pictures.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is it okay to just sit here like this?” Yukimura sighed. He sat next to me, sounding disappointed and melancholy.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re being a downer today, Yukimura-kun. You ought to play with us and shake off that gloom and doom. Come on, let’s have a rematch!” urged Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No thanks. I don’t really feel like it. Really, is this okay, Ichinose-san? I mean, just doing this until the test ends. I\u0026#160;thought you were the one leading the group here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose stopped in the middle of shuffling the cards. “Isn’t that excuse too convenient, Yukimura-kun? If you seriously want to win this thing, don’t you think you should rely on yourself, rather than someone else?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. Good point,” he answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYukimura understood full well that he couldn’t cope with having that responsibility thrust upon him. Despite that, he still wanted a way to change all this. If this test were measured solely on academic ability, then Yukimura would have been at the top of any group. However, being gifted academically didn’t make you a natural leader. It didn’t mean you could come up with novel ideas, either. Some things couldn’t be solved by memorizing words and formulae.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the two tests we’d had over the summer vacation, everyone had experienced the bitter sense of their own powerlessness, even Horikita. I wondered if Ichinose and Machida felt irritated about being locked into a stalemate. However, that frustration can become your strength if it doesn’t break your spirit.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e5.1\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003e“W\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eell, the test will be over after our next meeting. How do things look on your end, Ayanokouji-kun?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was having my last meeting with Horikita. The world outside was already cloaked in darkness. Carrying a conversation through chat would leave a traceable record. To avoid that, we’d met in person.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There haven’t been any significant changes. At this rate, it looks like the VIP is going to get away. How about you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t think I could expect anything from Horikita, but then…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll win,” she replied flatly. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You sure you haven’t made a mistake?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not sure who might be listening to us right now, so I won’t go into detail. I’ll just ask that you believe in me. Everything will be fine.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d already heard from Hirata that Kushida was the Dragon group’s VIP. Of course, I imagined that Ryuuen and Kanzaki had done everything in their power to figure that out, but it appeared Horikita had overcome the odds. If she was this confident, there probably wasn’t anything to worry about. Nothing left to do but wait for the 500,000 points to pour in later. You could call this a solid victory for us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you want to consult with me?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No need. Make whatever moves you like.” Even if she told me about the Dragon group, I couldn’t do much to assist her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So what did you want to talk about? I thought we both agreed to avoid unnecessary contact.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps she was…concerned about Ryuuen, who pursued her frantically? Nothing about her behavior right now could be called kind, exactly. Then again, coming from Horikita, kindness would just be troublesome.\u003c/span\u003e\u003c/p\u003e\r\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can’t keep being scared of Ryuuen forever, you know,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Judging from how you phrased that, I’m guessing you can do something about it?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt didn’t seem like she expected much from me, since she appeared surprised when I nodded. “I’ve brought Hirata over to our side. I think we’ll see a lot of cooperation from him.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t particularly want that,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s fine. Besides, I’m not saying you have to get involved with Hirata. I’ll handle him and maintain things. All you need to do is keep up.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t really like how freely you’re operating in the shadows,” she answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d thought she’d say something like that. “In that case, show your face when we discuss things. Even if you don’t talk, you can follow along, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I suppose so,” she sighed. She sounded dissatisfied, but if I gave Horikita the option to participate, she wouldn’t be able to argue with me. Besides, Hirata had a huge amount of pull in our class. After seeing his leadership skills in action, Horikita would likely come to understand.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d like to introduce you to someone else later. Hirata, too. Make sure to keep some time open before they announce the results,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ereally\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e don’t like this. I don’t want you to just go ahead and recruit people as you see fit,” she snapped.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Think of it as compensation for putting yourself on the front lines. Anyway, this person will be useful to us.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have a general idea of what you’re thinking, but… Well, fine. At any rate, let’s meet back here after the test is over.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, I looked at the time. There was half an hour until the final discussion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder how many traitors will come forward in this test,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who knows? I was surprised the test ended so suddenly for the Cow group, but I can’t imagine we’ll see a repeat of that. In the end, the likeliest outcome will be that the VIPs escape, and time will run out.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I think so, too.” Horikita briefly averted her eyes, the sort of unconscious gesture people made when they were worried about something.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s wrong?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nothing. It’s just, well… Something about this test doesn’t make sense. But there shouldn’t be any mistakes. I definitely shouldn’t lose,” she replied. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSome of Horikita’s anxiety was finally leaking out. Even if I offered her kind words, she’d tell me they weren’t necessary, so I just kept quiet.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e5.2\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ehe Rabbit group was about to enter our sixth and final discussion period, still without any hope of making a breakthrough. I’d wanted to quietly and carefully gather my thoughts, so when Hirata and the others left our room, I headed to the meeting alone. Since there was still about half an hour until the discussion started, I assumed no one would be there yet. However, my expectations were dashed by someone’s presence.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She must have gotten here early, huh?” I asked out loud.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose slept soundly on the floor. Why should the mere sight of her tickle a man’s heart in such a way? Ah, this was dangerous; it was really bad. Since she was lying on her side, I could see her plump thighs clearer than usual. There was also the exquisite sight under her skirt, from which I couldn’t avert my eyes. Any man who didn’t like what he saw right now would have to be gay, or at least strongly prefer men or something. Eh...I supposed there were all kinds of people in the world. No man could\u0026#160;\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecompletely\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e\u0026#160;escape these urges, though.\u003c/span\u003e\u003c/p\u003e\r\n \r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though I knew I shouldn’t, I couldn’t help but look at her thighs, then her legs, then her face, and then her breasts. Then back to her thighs. While my adolescent desires got the best of me, something near the back of her head grabbed my attention. It was Ichinose’s cell phone. She must’ve been using it just before she fell asleep.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOur assigned phones held quite a bit of information. Not only did they play a vital role in this test, but they also allowed you to confirm details, like how many points someone had. Of course, in order to confirm this, you needed an individual’s ID and password. But in order to avoid the hassle of having to log in each and every time, some students just saved their information. In other words, if I snuck a peek at Ichinose’s phone right now, it might be possible to find out all kinds of information. Like Ichinose’s living situation, or the number of points she had. And I had confirmed earlier that Ichinose saved her ID and password on her device.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI approached cautiously and carefully, one step at a time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ooh…ah…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I closed the distance between us, Ichinose stirred slightly, perhaps sensing some change in the air. But she fell asleep again, and her breathing relaxed. It seemed I hadn’t woken her. I tried to get closer again.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Mmm…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol4_INTERIORILLUSTRATIONS_12\" src=\"/hola-lector-agua/images/books/v4/OEBPS/Images/ClassroomElite-Vol4_INTERIORILLUSTRATIONS_12.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat in the world was I doing? Even if this was an effective way for me to gather information, if anyone saw me, they’d think I was a pervert. What if Ichinose woke up? There’d be a huge misunderstanding. Even though it was okay for me to enter the room half an hour early, it \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewas\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e weird for me to wait around so openly while a girl\u0026#160;slept. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, I didn’t have anything to feel guilty about. Therefore, I would remain calm. Step by step, I drew closer to Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ooh…um…” She muttered something unintelligible.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis wasn’t good. Every time I moved, Ichinose began to wake up. As a test, I tried moving my foot back and forth on the same spot, without moving forward. If Ichinose showed any response, I’d assume she was an exceptionally light sleeper. They say many light sleepers are highly strung…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eCreak, creak.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I put my right foot forward, and then moved it back to its original position.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eGod, I’m pathetic.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhy did I have to sneak around like this? I’d definitely be branded a pervert if someone saw me right now. Realizing my actions were completely stupid, I gave up trying to sneak a peek at her phone, and instead moved away. I sat down on the other side of the room. From here, I couldn’t glimpse the hidden place beyond her thighs. I\u0026#160;didn’t think I’d accidentally wake her, either.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMost importantly, it was still early. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWhy in the world is she here?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I wondered. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAbout twenty minutes before the discussion period was supposed to begin, some cute-sounding music played throughout the room. It came from Ichinose’s phone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Mmm…” she mumbled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose, eyes still closed, grabbed her phone. She unlocked the screen and stopped the music, which apparently was her phone’s alarm. Ichinose, still looking rather sleepy, started to sit up. Almost immediately, she noticed me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d wondered if she would be disgusted by my presence, but she wasn’t concerned in the slightest.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, good…\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyawn\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e…to see you, Ayanokouji-kun. Sorry, did my alarm startle you?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, no. Looks like you slept well.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ha ha ha, sorry about that. I just passed out; I slept like a log. You’re here early, though. Don’t we have twenty minutes until the discussion?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I should be asking you the same thing. When did you get here?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“An hour ago, I think. I wanted some peace and quiet. Since my friends are going in and out of my room, it’s kinda noisy.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, this was the best place for a nap.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides, I wanted to gather my thoughts,” she added. Rather than looking refreshed by her nap, she seemed struck by sudden inspiration.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Any results?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“More or less.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe stood up. Then, for some reason, Ichinose walked over and sat down next to me. The two of us were alone in the room. The space between us was shrinking. Even though I couldn’t hide my nervousness, Ichinose didn’t seem to notice. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s still some time left until the discussion starts. Why don’t we have a little chat? If it’s not a bother, that is,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh no, it’s not a bother. I don’t mind.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay. To tell you the truth, Ayanokouji-kun, I want to ask you something. I’ve asked all my classmates this question, including the boys. But I’ve been thinking about asking the other classes for a while now. I’ve just been kind of curious. Ayanokouji-kun, do you want to ascend to Class A?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d been wondering what she would ask me, but the question was something surprisingly ordinary. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah. Of course I do. I’ve thought about getting up to Class A. No, wait…I guess it’d probably be more accurate to say that I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003emust\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e aim for Class A.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because of the guarantee of college or a career?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn our school, students from Classes A through D competed against each other. The greatest privilege— being guaranteed to advance into any school or career path—was only limited to those in Class A. Many might think that sounded like a trick. The school pamphlet was rather ambiguous, so the details were murky.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nowadays, you can’t just enter college or get a job that easily. Jobs, especially,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think so, too. But don’t you think placing too must trust in the system could be dangerous? There’s something about that 99.9% percent they’re not telling us. Something dangerous,” Ichinose said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose was referring to the “99.9 % college and job placement” rate that the school touted. She had a point about hidden pitfalls. Let’s say I wanted to be a professional baseball player, but had no experience playing the game. How would the school go about making me a pro? Even with their professional connections, they were limited. And even if you did play regularly in school, that didn’t guarantee you’d go pro. Even if you graduated from college or went on to graduate school, that didn’t guarantee you any sort of future. Really, only a fraction of people really managed to accomplish what they set out to achieve. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStatistically speaking, only one of every six students can achieve their dreams. At first, you might think that’s a high percentage, but the data’s ambiguous and the statistics are fuzzy. Being a professional baseball player isn’t the same thing as becoming a top-ranked player. If you gathered up everyone who qualified as a professional baseball player, including trainees, you’d have about 900 to 1,000 people. However, if the dream is to play as a regular on the team and take down your opponents on your first attempt, then maybe a hundred people max could do it. Finally, even if you secured a spot as a regular player, you must continue playing against your rivals, always a linchpin for the team.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, no matter what you chose, it’s unlikely you’d achieve your dream. And it’s an extremely difficult thing to do. Many students just continue boring, tedious lives, with vague lip service paid to dreams as the years pass. To actually achieve a dream requires a lot of effort and luck.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But this school… Well, it does have an incredible amount of influence, right? Most people who get anywhere in life succeed because someone influential helps them. Or are you not interested in that, Ichinose?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I’m not saying that. I want to graduate from Class A. I have a dream I want to make real,” she answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though she was smiling, her eyes were unwavering and serious. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The school system’s all well and good, but if you can’t graduate from Class A, it’s a mark of failure. This school is all about ability, and if your abilities can’t carry you here, it’s unlikely you’ll ever be labeled an elite. Students are ranked based on perceived superiority or inferiority. Right now, between the two of us, Ayanokouji-kun, only one can achieve their dream. Ah, but then again, we could both lose out on our goals.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though we were chatting like friends, only one of us could win. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve heard there are exceptions to the rules, though.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm? You mean when someone manages to accumulate twenty million points?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. There hasn’t been a single student in the school’s history who’s successfully pulled that off, but it is theoretically possible.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh yeah, for sure. I suppose if we factor \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e in, it’s possible for both of us to graduate from Class A,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Be that as it may, whether or not you can really earn twenty million points is another problem. Even if you score well on the exams and save your points, it probably wouldn’t be enough,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eGoing by this test alone, it seemed possible to earn a great number of points, depending on how hard you worked, but we’d only had two such exams. From this point forward, it was possible that the number of such tests would be reduced, and the chances of being penalized could increase.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s true. Even if you’re extremely economical, it’s unlikely someone could manage to save even half that amount,” Ichinose mused.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. Class D’s financial situation is especially awful. Even though Horikita’s trying her hardest, the points from the island test have yet to be deposited. Actually, it’s entirely possible we’ll lose them in this test,” I said. “Are you a thrifty person, Ichinose? You don’t strike me as someone struggling to get by.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm, I wonder about that. Personally, I’ll use points sometimes and save them sometimes, just like anyone else would. Even though I’m in Class B, I don’t really have that many points saved.” Ichinose responded to my question with ease. I didn’t see any indication she was hiding something from me, but…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose suddenly turned toward me. She looked me right in the face. “It seems like you saw it, a while back,” she remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t look away from her beautiful eyes. It was almost as if they were drawing me in. Ichinose was even cleverer than I’d imagined. I guess she’d seen right through my plans.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry. When you were using your phone earlier, I just happened to look at the screen. I was a little curious, so I was thinking of asking you about it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ha ha, you don’t need to feel guilty or anything. It’s not like I’m blaming you. I mean, it certainly \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eis\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e a lot of points, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYeah, it was. Before the first semester had ended, Ichinose had already amassed an insane amount of points. Even if I saved all the class points that were doled out on the first of every month and didn’t spend a single one, I still wouldn’t have been able to save that many.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But I can’t really give you any details. Sorry,” she added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No need to apologize.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course, if you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e manage to obtain that information, Ayanokouji-kun, and even if you shared it with Horikita-san, you wouldn’t go blabbing to everyone, would you? I mean, even though you saw my phone, if\u0026#160;someone else decided to ask about it, you wouldn’t tell, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t plan on telling anyone else. Besides, I might’ve been mistaken. I won’t pry.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e pry, it wasn’t like I’d get a satisfactory answer.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Have you found a way to win this thing?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm, I think so. At least, I think I’ve found a hint.” I didn’t think she would answer that honestly, but Ichinose sounded relaxed and confident. She seemed the type of person to act on her own initiative and not waste time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, this contest will come down to a battle between A and B, I suppose.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We won’t know that until the end. My path to victory is—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRight before she finished her thought, members of our group poured into the room, one after another. The Class A students were first to arrive, but they took their seats without giving us so much as a greeting.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, what’s this? You’re here already, Ayanokouji?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All alone with Ichinose-dono? My word, how suspicious. A clandestine rendezvous, wouldn’t you say?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYukimura and the Professor bombarded me with questions as they walked into the room together. I couldn’t especially tell if they were impatient or depressed, but it seemed they’d given up on winning. On the other hand, the Class B students seemed rather relaxed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is the end, huh? So, have you found any hints?” asked Hamaguchi. He spoke gently to me as we waited for the final discussion to begin.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To be honest, I have no idea. We haven’t really been able to talk, which means we haven’t been able to engage,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was my official answer, but I’d already executed the strategy I’d been plotting since the test began. My plan involved the phones we all received from the school. I had switched the VIP’s phones as a means of camouflage. Kushida was the Dragon group’s VIP, but what if Kushida and Horikita switched phones? If someone spied on her phone, they’d suspect that Horikita was the VIP.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen, if a traitor submitted Horikita’s name as their answer, they’d be making a mistake. We would win.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good evening. Nice to see you all,” Ichinose said warmly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was smiling, just like always. I set the trap immediately. We didn’t know who else had a hidden agenda, after all. I’d been waiting for Ichinose to talk, and decided to cut in before she spoke up again.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um, excuse me. If everyone’s okay with it—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have something I’d like to ask—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBoth Hamaguchi and I started talking at the same time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, sorry. Go ahead, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, no. You can go first. I don’t mind,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHow annoying. Well, this didn’t get in the way of my plan, but any unexpected trouble could make things unstable. I decided to let Hamaguchi speak first. I’d chime in after thinking things through. Then, Hamaguchi shattered my plans in an unexpected way.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For the past three days, I’ve been thinking of how we could achieve Outcome #1,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHamaguchi launched into an explanation of his plan which, surprisingly, was quite like mine.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There is a way for everyone here to achieve Outcome #1,” he continued.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA faint glimmer of hope shone in everyone’s eyes. “Is that really true, Hamaguchi?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. I came up with this idea after listening to everyone here, including Ichinose-san and Machida-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t believe it. There’s no way we can arrive at Outcome #1 without discussion,” Machida huffed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s hear him out first. Hamaguchi-kun isn’t the sort to speak without thinking,” offered Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m going to show you all my phone. Of course, the school sent us all an email. I think you all understand what I’m getting at? Because we’re prohibited from tampering with or misrepresenting the emails we’ve received in any way, there’s no way to deceive one another. That’s why the answer is simple. We show each other our emails, and then we find out who the VIP is. That’s how we’ll discover the truth.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is dumb. Why would anyone show their phone just because you told us to? Someone could betray us all the moment we show our emails. No one would do this,” answered Machida flatly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a hopeless plan. Naturally, Machida-kun was flabbergasted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s certainly true that if the VIP knows they could be betrayed, they wouldn’t show their phone. However, from the perspective of someone who isn’t the VIP, there’s no risk in exposing your identity. The test will be over soon. If we don’t make a move, we lose our chance of winning. Suppose there’s a class working together to cover for the VIP. It’s true that none of them would show their phones. But this way, it’s possible to narrow down the list of candidates.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if you find out the VIP’s identity or the class they belong to, the moment someone decides to betray you, it’s over. The problem hasn’t been resolved. Or are you suggesting that the first to betray us wins?” countered Machida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThrough Hamaguchi’s strategy, it was possible to successfully weed out the VIP. But that was it. In the end, people weren’t going to play nice.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, please be quiet and just watch. If you don’t participate, Machida-kun, it’ll still be fine,” Hamaguchi answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHamaguchi showed everyone the email that he’d received.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I agree with Hamaguchi-kun. I’ll show mine, too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter Hamaguchi showed his phone, Beppu from Class B followed suit. This didn’t seem like some spur-of-the-moment idea. This seemed like a strategy Ichinose had come up with. Strangely enough, her plan was exactly the same as mine. However, I didn’t know how far she’d thought this through, or what her moves were. If she simply believed everyone would go along with this, then it was quite simply reckless.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think it’s a surprisingly good strategy. I don’t have any objections,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSmiling, Ichinose reached for her cell phone in her skirt’s left pocket. “I’ve been agonizing over this for a long time now, but after hearing Hamaguchi’s plan, I get\u0026#160;it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose pulled out her phone. I decided to step in and interrupt before she could execute her strategy.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re serious about this, huh? Well, if you’re all going to bet on that, I think I’ll join in, too,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBefore Ichinose could show everyone the contents of her email, I took out my own phone and offered it up. But it wasn’t actually my phone; I’d switched it with someone else’s.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun…are you okay with this?” Ichinose asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure. After hearing Hamaguchi out, I honestly don’t think we have another option. I’m really bad at communicating, so all I can do is show you the truth,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, Ayanokouji. There’s no way this kind of strategy is going to work,” said Yukimura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe tried to stop me, but I showed everyone the email on my phone. Everyone saw that I wasn’t the VIP. An incredible amount of water was building behind this unseen dam. If even the tiniest hole opened up, the dam would collapse, and we’d be left with a muddy stream of water. My actions opened that hole.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol4_INTERIORILLUSTRATIONS_13\" src=\"/hola-lector-agua/images/books/v4/OEBPS/Images/ClassroomElite-Vol4_INTERIORILLUSTRATIONS_13.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. Okay. So you’re not the VIP, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay. I’ll show mine, too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAmong the large number of people still scoffing at Hamaguchi’s strategy, a lone girl agreed. It was the person I’d least expected: Ibuki Mio.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you nuts? We don’t get anything out of this!” shouted Manabe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Ibuki’s response was well-reasoned. “Anyone who isn’t the VIP or who’s not in the same class as a VIP gains nothing if things keep going like this. Class B understands that. If we sit around, we won’t catch up to the classes above us. That’s why they’re showing everyone their phones. I agree with their idea,” she answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Or maybe \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou’re \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ethe VIP,” said Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki didn’t talk to Manabe as if she were an ally. She spoke like addressing an enemy.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“N-no. I…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, show everyone your phone.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki’s words threatened her classmates. Manabe and her friends, as if accepting Ibuki’s order, showed everyone their phones. The hunt for the VIP had begun. Karuizawa took out her phone, which had a strap attached, and handed it over.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait. It’s not just Ayanokouji-kun? \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eYou’re\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e going along with this, Karuizawa? You agree with this?” Yukimura was puzzled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m doing this for my own sake. I want those private points,” said Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer email said she wasn’t the VIP. Karuizawa was in the clear.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um, so what should I do?” muttered the Professor.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Think for yourself, Sotomura. This is voluntary.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh…well, I don’t want to get wrapped up in this, so I’ll just get it over with.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe Professor, seeing how the tide had turned, reached for his phone. Yukimura grabbed his arm and stopped him. “Do you really think that showing everyone your phone is the right move?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know, you’ve been really jumpy. You’re not the VIP, are you?” Ibuki asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYukimura’s expression stiffened.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoa, seriously?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yukimura isn’t the VIP. I heard as much earlier,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, some of the students burst out laughing.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You expect us to believe that? You could be lying.” Manabe cast a doubting look over at Yukimura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I continued denying that he was the VIP, it would only invite further suspicion. But I couldn’t make my move yet. That’s because Yukimura was…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s too early to draw any conclusions. Yukimura-kun has a point,” Ichinose said. Once again, she reached into her pocket and took out her phone. “I got a little caught up and missed my chance earlier, but I’ll show you now,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose proved that she was not the VIP.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, Ichinose. Earlier, you said you’d been keeping quiet about something until now?” Machida clearly hadn’t forgotten.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, that? I had the same thing Hamaguchi said on my mind earlier, and wanted to talk about it. That’s it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The same thing?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As Class B’s representative, I’m a little jealous that Hamaguchi-kun beat me to the punch.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBy now, everyone except the Class A students and Yukimura had proven themselves to not be the VIP.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone understood the meaning behind Yukimura’s long silence. Machida and the other Class A students stared at him inquisitively.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fine. I’ll show you. All I have to do is show you, right?” he muttered. Yukimura, no longer able to deal with the pressure, pulled out his phone. “Before I do so, I want you to promise me one thing,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Promise? What do you mean, Yukimura-kun?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t want anyone here to turn traitor. Especially you, Class A. I want you to take out your phones and put them in front of you. That goes for everybody. Everyone, put your phones where I can see them,” he demanded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe directed his statement at Machida, who responded with a snort. “What are you talking about?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Exactly what I said. Nothing more, nothing less.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, fine. Whatever. If you want to see my phone, here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe Class A students, who’d been sitting some distance away, calmly came over and placed their phones on the table. After they did that, Yukimura made his move, looking downcast. He pulled his phone out and turned it on. He entered the six-digit password, and logged in. Yukimura opened the school’s email and lifted it up so we all could see.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry for lying to you, Ayanokouji,” he muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass D was the most surprised by the revelation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m the VIP.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA different email from everyone else’s was displayed on the screen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wha— Y-Yukimura-dono, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou’re\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the VIP?!” the Professor stammered. He looked astonished, as if he couldn’t believe what he was seeing. This basically meant we’d given up the 500,000 points that Class D had gained. However, I’d exchanged phones with Yukimura in secret.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I’d known things would turn out like this, I would’ve talked from the start…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa looked genuinely shocked and uneasy. To look at her and the Professor, you’d think the two of them could never have imagined that Yukimura was the VIP. Machida stood and peered at Yukimura’s phone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The email seems authentic. All of the other personal emails are Yukimura’s, so there’s no room for error.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMachida, after checking Yukimura’s private email and chat logs, confirmed the truth. He still appeared doubtful, and Ichinose tried to explain the situation calmly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no way it could be fake. After all, the school explained the rules, right? Copying and transferring the email is forbidden. As long as the email was sent from the school’s email address, there’s a 0% chance it’s a fake.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was right. Creating false information was strictly prohibited. If you broke that rule, expulsion awaited you. Therefore, everything laid out here had to be the truth. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So that means it’s definitely Yukimura-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eManabe nodded. The important thing here was the process that had led to Yukimura’s revelation. Whether the person holding that phone was actually the true owner of that phone was irrelevant. In other words, judging whether or not that phone belonged to Yukimura was a surprisingly difficult task. The idea that someone had switched phones wasn’t outside the realm of possibility.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, showing everyone the process of entering the six-digit password and unlocking the phone was a different story entirely. There was no way a student could know someone else’s phone password. Everyone unconsciously acknowledged that Yukimura must be the owner of the phone. This wasn’t the result of deduction, but rather of preconceived notions.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry, Yukimura-kun. This happened because I came up with this idea at the very last minute,” I muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, it’s okay. It’s probably for the best. I thought I could lie my way out of this, but I was wrong. I’m sure you, Sotomura, and Karuizawa would agree this was for the best,” said Yukimura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone now thought of him as the sort of person who wanted to secure points for only himself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, now everyone knows the answer. It’s me,” Yukimura said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf we all cleared the test together, everyone in our group would receive 500,000 points. Outcome #1, which at first had seemed impossible to achieve, now appeared to be in our grasp. Ichinose nodded, and pleaded with Class A more strongly than before.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please. Cooperate with us. Don’t let Yukimura-kun’s courage go to waste. I don’t want you to betray us.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’ve been acting on Katsuragi-san’s instructions from the very beginning. We won’t do anything on our own,” answered Machida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe said that, but the group would disperse right before the test ended. During that thirty-minute window of time, we had to trust not only in our own classmates, but in students from other classes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I want to believe… No, I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edo\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e believe in everyone.” Yukimura begged fervently.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe begged everyone, from every class. I wondered if the students who’d spent so much time together over these past few days had started to form bonds of friendship. I wondered if they would accept Yukimura’s wishes, and if everyone would work together.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo, they wouldn’t. I was sure of that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSomeone would turn traitor. I had no doubt.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd if that happened, then the ones who had switched phones—Class D—would take the victory.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYukimura must have believed that, too. I imagined that he was practically dying from holding back his laughter. However, his joy disappeared when the phone started vibrating with an incoming call. Panicking, Yukimura lunged forward to snatch the phone, but dropped it. By sheer coincidence, the phone fell face-up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince the phone was on silent, the table shook as it continued to vibrate. The caller ID said “Ichinose.” Ichinose, holding her phone to her ear, looked at Yukimura and me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you doing, Ichinose? There’s no point in calling Yukimura’s phone at a time like this,” said Machida, looking suspicious.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnly Yukimura and I understood what was going on. She quietly hung up the phone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The school said that altering or copying the emails is forbidden, that’s true. That’s why the email we saw was the real thing. However, there’s no rule saying that you can’t trick people with the phone itself. Do you understand what I’m getting at?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose picked up the phone and handed it to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The person this phone belongs to, the real VIP…that’s you, isn’t it? Ayanokouji-kun? I called you just now, not Yukimura-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d exchanged numbers with Ichinose some time ago. And even in the event she hadn’t known it, she would’ve done her research just to be safe. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-but isn’t that odd? Yukimura unlocked the phone right in front of us. I checked his private email history just to be sure,” said Machida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That was all fake. He could’ve easily gotten the password ahead of time by simply asking Ayanokouji-kun. Besides, it’s possible to replicate call history, email, apps, and so on, though it would take a bit of effort,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMachida’s face flashed a different, angry color. He snatched the phone out of my hands.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not easy for people to lie like that, especially when the goal is within reach. In those last moments, either through negligence or nervousness, they’ll leave some kind of opening. Yukimura-kun lied, and his gestures and behavior seemed different from the way he normally acts.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose had completely seen through my attempts at subterfuge. Yukimura turned pale as she spoke. It was doubtful that he even heard her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’ve been thinking about this for a while now, too. If the VIP was in your class, one option would be to swap phones. You could mislead people by showing off the password to unlock the phone.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, Ichinose and the others had come up with the same strategy that I had.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But you see, there’s a weak point to that strategy: a phone number. Even if you perfectly duplicate everything from call history to apps, you can’t change the number. Hamaguchi and I had tried swapping SIM cards once to see what would happen, but the SIM cards are locked to their designated phones. If you’d swapped them, I wouldn’t have been able to call you. It doesn’t matter who switches with whom: Once I hear the phone ring, I can find the owner. If I couldn’t do that, I wouldn’t have proposed this idea in the first place,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose and Hamaguchi had been two steps ahead. They’d probably orchestrated everything, agreeing that Hamaguchi should be the one to broach the topic. In one second, the truth had come to light.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You did everything almost perfectly. But you didn’t anticipate that our SIM cards are locked to specific devices, did you?” Ichinose gloated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAn announcement came through the speakers, telling us we had five minutes left before the discussion period was over. We were told to break in the next five minutes and return to our rooms.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Damn it!” shouted Yukimura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Too bad, Yukimura. It was a surprisingly good try, though,” said Machida. He and the others laughed, furthering the mockery. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey glanced over at me, the one also complicit in this plan. Yukimura was still visibly upset and shaking, and so was the rest of Class C. Classes C and A appeared shocked. I’m sure they had many questions, but the rules prohibited us from talking any further.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, we’ve confirmed that Ayanokouji-kun is the VIP. Machida-kun, promise me that we’ll aim for Outcome #1, and no one will betray anyone else,” urged Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, of course. You can trust me. Let’s go,” Machida said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe three Class A students left the room right away, before anyone else.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s so much to gain by working together. That’s why we’ll never turn traitor. That’s why I want you in Class C to do the same. Please, just bear with it for thirty minutes,” Ichinose pleaded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eManabe and the others nodded and left the room. Yukimura looked at the phone I was clutching.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was wrong to go along with your plan. This sucks,” he fumed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOne by one, everyone left the room, leaving me alone with Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now all we can do is to trust everyone,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. Guess so,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re really calm, Ayanokouji-kun. Aren’t you worried?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol4_INTERIORILLUSTRATIONS_14\" src=\"/hola-lector-agua/images/books/v4/OEBPS/Images/ClassroomElite-Vol4_INTERIORILLUSTRATIONS_14.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not especially. I can’t do anything but believe, anyway. I’m heading to my room.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was nothing to gain by staying here.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, wait a sec.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose placed a hand on my shoulder. In that instant, I felt the tension between us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who came up with the idea of swapping phones?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita, of course.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Please tell Horikita-san something for me. Tell her that her plan was a huge success.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A huge success? Don’t you mean a crushing defeat? We failed, hard. You saw through everything.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ha ha ha. You didn’t expect us to have come up with the same plan, did you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry. Sorry for trying to deceive you like that, especially after I agreed to be your ally. Are you angry?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course not. We went ahead with our own plan without telling you, so we’re even.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. If you mean it, I’m sure Horikita will be relieved.” I grabbed my phone and headed for the exit.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-wait, wait a second. We still haven’t gotten to the critical part yet,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The critical part?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on. You’re surprisingly bad at dealing with people, Ayanokouji-kun. It’s true that the SIM cards are locked to their respective devices. But there \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eis\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e a way to release that lock. Isn’t that right? I checked with Hoshinomiya-sensei to confirm. She said that with enough points, you can unlock the device right away,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn that instant, I felt a faint electric current run down my spine.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“After a falsehood comes to light, most people will take the answer that comes after it to be the truth. Yukimura-kun was determined not to be the VIP, even after he showed ever
