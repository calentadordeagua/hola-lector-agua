yone how he unlocked your phone using the password. The moment that lie was revealed, the truth that you’re the VIP came to the surface. The SIM card was the deciding factor. No one would suspect anyone else as the VIP now. But that was the trap. I said the idea of swapping phones was an imperfect strategy, but that was a lie. That’s because swapping phones is extremely effective. Of course, it must be a double-layered trap in order to work. In that case, the truth will remain in the darkness. There wouldn’t be any way for anyone to determine, with 100% accuracy, the real VIP’s identity.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose had seen through my plan. She’d seen through the plan behind the plan. She realized the truth I’d kept hidden even from Yukimura. First, she knew I was not the VIP, but that I’d approached Yukimura under the pretense of being exactly that. As proof, I used the real VIP’s phone to contact him. But the real target—the real VIP and the owner of that phone—was Karuizawa. She’d hidden that fact very well. The only person she’d secretly told was Hirata. Hirata kept that from both me and Yukimura at first. That’s why he pretended not to know who the VIP was when we spoke about it. However, after I learned about his and Karuizawa’s pasts, Hirata told me the truth. Then, after I used Manabe to bully Karuizawa, I took the opportunity to swap our phones.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, I replicated the email and call history, just as I did with Yukimura. Naturally, I then used my points to do a SIM lock release. Doing so wasn’t illegal and could be done free of charge at any major retailer. We may have been on a ship at sea, but I’d been positive that the school would have something prepared to replace or repair our phones should they be damaged. That’s why, while using Karuizawa’s phone, I was able to transfer over my number as well. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen, I swapped that phone with Yukimura’s. Of course, I had told him it was my phone, and he believed me. If my deception were revealed, he’d be extremely angry. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA simple person would have never noticed that Yukimura and I switched phones. A clever person would have noticed the swap and accused me of being the VIP. But they never would have come to the conclusion that Karuizawa was the real VIP. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If the VIP wasn’t in Class D, what would you have done?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The same as you. I would’ve tried to find out who the VIP was, borrowed that person’s phone, and had another one ready. Then, I’d step forward and claim to be the VIP myself.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf the real VIP then came forward to point out the lie, the writing would be on the wall. Simply believing that Ichinose was the VIP meant that the test would end with the traitor making a mistake. In the latter situation, Class B would be awarded no points, and the gap would either decrease or increase between the classes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So I’ve been found out, huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose started pulling phones from both pockets. One belonged to the VIP from a Class B student’s other group, and the other was a phone from a different student who, most likely, wasn’t a VIP.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is just my prediction, but based on how today’s discussion went…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose quickly typed a short message on her own phone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The real VIP is Karuizawa Kei-san. Am I right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe showed me her phone. That was the betrayal message she was going to send to the school. However, before anything could happen, both my phone and Ichinose’s rang at the same time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“The test has now ended for the Rabbit group. Please wait for the results announcement.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ahh, I guess someone turned traitor, huh? I wonder, was it Class A or Class C?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why did you think it was Karuizawa?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The same reason as Yukimura-kun. She’s been behaving unusually. She normally doesn’t seem to care much about you, Ayanokouji-kun, but she kept looking over at you, and her face tightened. But there’s still the possibility that she isn’t the VIP, so I couldn’t have sent that email.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, Ichinose had completely seen through my plan.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why didn’t you say anything? At the very least, you could have exposed my lie,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose smiled. The smile she wore now was perhaps the most genuine I had ever seen from her. “That’s obvious. If either Class A or Class C makes a mistake, that’s a win for us. From the very beginning, I never intended to clear Outcome #1, or to turn traitor and get Outcome #3. The moment I knew the VIP wasn’t in Class B, I knew I would let another class betray us. I think the traitor was probably from Class A,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Machida?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, no. Morishige-kun. He’s a member of Sakayanagi’s faction. I doubt he’d just quietly go along with Katsuragi’s plan. He probably figured that, if anything, it was better for him to betray the group and take the points. Don’t you think?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose laughed and turned her back to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun, you’re amazing. You know that? Our conversation just now proves how cunning you really are, doesn’t it?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You ought to praise Horikita. She just gave me directions, that’s all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed I needed to re-evaluate Ichinose Honami. She’d managed to thoroughly avoid risks while devising a strategy that led her to victory. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’ll be leaving then. It would be bad if we broke the rules, wouldn’t you say?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, the moment Ichinose said that, both of our phones played a unique sound. It played four times, quickly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what does this mean?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe seemed completely shocked as she slowly looked from her phone’s screen over to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e5.3\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eO\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eur ship floated on the dark, lonely sea. As we got closer to 11:00, more and more people began to gather. The café, which had been completely silent, started to fill up with people. Eventually, the place was packed. I secured four seats well ahead of time. A lone girl approached me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry to keep you waiting,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa Kei approached me rather meekly. Something about her expression seemed different.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry for calling you so late.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, it’s okay.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince I didn’t really have anything to talk to her about, I silently gazed at the nighttime scenery. However, Karuizawa looked as if she had wanted to ask me something. I glanced at her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, um. I was just wondering if everything really went okay,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry. I’m positive that one of the guys from Class A sent the school an email with my name,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d had one more piece of insurance up my sleeve, besides the double phone swap. But because I’d laid my plans well, there was likely nothing to worry about.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How can you say that for sure?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m guessing you’re talking about that piece of paper you gave me. Right, Ayanokouji-kun?” Hirata’s approach from behind made Karuizawa jump in shock. Well, that was understandable. After all, Karuizawa had screamed at him and said they were breaking up the other day. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Excellent work on this test, both of you. May I sit?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa shifted in her seat, clearly uncomfortable. She looked away, but didn’t show any sign that she would refuse him. It was 10:55 p.m. In just five more minutes, an email should be sent to all the students.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s just about time. Is Horikita-san still not here? Shouldn’t we contact her?” asked Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She’s the type to come at the very last second. We have another four minutes,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, looks like she’s here,” said Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, Horikita had arrived earlier than I’d expected.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ahh. When I see you people, I can’t help but sigh,” muttered Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re finally here. Hey, who’s that behind you?” I\u0026#160;asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ignore him. Think of him as a ghost that attached itself to my back,” Horikita said flatly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aw, come on. Don’t say that, Horikita. I just thought you might be nervous during the test, so I was worried about you. That’s why I came to check on you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou Ken. I hadn’t seen him for several days. He stood so close to Horikita that they were practically attached.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re in the way. Get lost,” she spat.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-hey, don’t say that. I gave this test everything I had, you know.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, do you believe you’ll end up with good results?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was just one step behind, that’s all. Looks like someone else sent the email before me,” he muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita stopped paying any attention to his lame excuses and sat down in the vacant seat. Sudou quickly went to grab a chair from a nearby table.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re in the way,” Horikita grumbled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on. It’s fine, isn’t it? I’m just going to listen. You wouldn’t cut out a classmate, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was a rather unusual group of people. Sudou didn’t seem to show interest in listening to anyone else.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, about the chain of emails we received earlier,” Horikita began.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. I was hung up on that, too,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe were talking about what’d happened two hours earlier. Just as I was about to part ways with Ichinose, we’d received four emails at almost the exact same time, in rapid succession. They’d informed us about the end of the test for several groups. The test had ended for the Rat, Horse, Rooster, and Pig groups. They’d all had traitors.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Minami-kun was the Horse group VIP, right?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. Someone discovered his identity,” I reasoned.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did one of us send an email for the other groups?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was anxious. If you guessed incorrectly, the penalties were high. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was a little apprehensive about that, so I went around and asked people in the individual groups earlier. None of the guys said they turned traitor,” Hirata answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHopefully, they hadn’t lied to him. I thought we could trust them to a certain degree.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is Yamauchi okay?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, he’s probably okay. Yamauchi-kun was in the Rooster group. It seems he \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e try sending an email but agonized over it for too long. The test ended before he could actually send it,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know who it was, but betraying the group before he could was a fine move,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita had predicted that if Yamauchi sent the email, he most likely would’ve gotten the answer wrong. She was probably correct. He might consider himself a reckless, daring guy, but the moment he hesitated to send that email, it was all over for him. He wasn’t the cocksure guy he imagined himself to be.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But I don’t know about the girls,” Horikita said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve already checked. No one sent an email,” said Karuizawa without hesitation. As controller of the Class D girls, she could be as certain as Hirata of her information.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see,” answered Horikita flatly. Of course, since Horikita did not have the necessary social pull, she had no choice but to accept what she was told.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Still, I wonder why only a small group of people were given explanations for this exam, in the end?” muttered Hirata, as if he still had lingering doubts that he couldn’t quite shake.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This exam was all about testing our thinking. It’s not like every single question would have an answer,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMaybe we’d only truly grasp everything after seeing through all the meaningless bluffs. The truth hid among those many doubts.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What I’m worried about is that those four emails came in at almost the exact same time. The school said we had a timeframe of thirty minutes at the end of the test to betray someone, but all the emails came within one to two seconds of each other,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Isn’t that just a coincidence?” asked Sudou. Apparently, from Sudou’s perspective, everything was a coincidence. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When Kouenji-kun sent the email to betray his group, the school responded without delay. If you think about how fast it was, it must have been automated,” Horikita began.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So it’s likely that all of the emails were sent together. In other words, the betrayal emails all came from one class.” Hirata finished her thought.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was it. I couldn’t think of any other reason.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They might have sent the emails at the exact same time as a way of showing off their supremacy,” Hirata added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. And there’s only one person I can imagine who’d do such a thing.” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita and Hirata had a natural rapport. I was grateful they were able to do this without me having to jump in. Meeting in this particular café, a place we’d used so many times before, had been a deliberate move on my part.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So. You’re all here after all, huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was so I could invite a particular sixth guest to join\u0026#160;us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ryuuen!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou, after noticing Ryuuen, stood up as if to threaten him, but Ryuuen didn’t pay any mind. He simply grabbed a vacant chair, forcefully slamming it next to Horikita before taking a seat.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought I’d enjoy finding out the results with you all. Thanks \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eso \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003emuch for gathering in such an easy-to-find place,” he said mockingly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. I chose this space because even an idiot like you would be able to find it quite easily. You should be grateful,” answered Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, Suzune, you’ve got a rather large group with you. Have you grown more sociable?” muttered Ryuuen, looking out at the other four people gathered around the table and ignoring Sudou completely.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I disliked your persistent harassment. I was talking to them about it,” said Horikita flatly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t you hang all over Horikita!” roared Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sudou-kun, be quiet,” Horikita snapped.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh,” he muttered dejectedly. Sudou obediently sank back into his chair. He was surprisingly docile.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t think you actually had any friends,” Ryuuen teased.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was a defensive strategy I’d devised specifically to deal with Ryuuen. By increasing the number of people in Horikita’s social circle, I had successfully set up a dummy. With more people to keep an eye on, he would be unable to catch everything. He’d become negligent.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The results will be announced any minute now. Are you expecting any results?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“More or less. You look rather relaxed,” Horikita said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh. I wouldn’t be here if I wasn’t. Looks like the same crowd as the last time,” replied Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And I remember that the last time they announced results, you were acting all high and mighty. But then you lost big,” Sudou chided, pointing a finger at Ryuuen and laughing.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita, as if agreeing with Sudou, gave Ryuuen a disgusted look.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Stop it, Suzune. You know if you get carried away now, you’ll just be embarrassed later. I already know our group’s VIP,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhether he was lying or not, Horikita wasn’t shaken in the least. She was convinced that she wouldn’t lose to Ryuuen. “I’m quite glad to hear that. I look forward to the results,” she replied with confidence.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no need to wait for the announcement. Want me to tell you who the Dragon group VIP is?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry, but I’m hearing the irritating whine of a loser. The test has already ended, and no one in the Dragon group has turned traitor. That can only mean one thing,” she answered. The exam had ended without Ryuuen figuring out that Kushida was the VIP. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you could only understand the depth of my mercy, you’d be moved. So moved that you’ll get wet between your thighs.” Ryuuen laughed, as though such vulgar language was funny.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, tell me then. Who is the Dragon group VIP?” asked Horikita. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen, as if he’d been waiting for her to ask, covered his smiling face with his hand. He peered at us through the gaps in his fingers, like some kind of beast in a cage. He looked ready to tear out his prey’s throat.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kushida Kikyou.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?” Horikita, who had been unconcerned until that point, cried out and stiffened. She’d been confident that he’d never get it right. Hirata, also in the Dragon group, was flabbergasted as well.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry, but I’ve known Kushida was the VIP since the second day of the test,” Ryuuen said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re joking, right? If that’s true, you would have turned traitor and sent an email. But the test didn’t end like that. That must mean you realized that fact after the exam had ended. There’s no other way. Am I wrong?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just felt so sorry for you. You were oh-so-incredibly confident in your victory that you looked down on others. You were desperate to get your stories straight, assuming no one would get the answer right. That’s why I went along with it until the end.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How did you figure it out?” asked Hirata. His question contained a mixture of curiosity and fear. He must’ve been curious both because he’d so carefully protected Kushida, and because Ryuuen hadn’t betrayed anyone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unfortunately, the answer to that… Well, it involves you, Suzune,” answered Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Me?” she asked, dumbfounded. Horikita must have been desperately trying to remain calm while replaying the test in her head. When, where, and how had he gotten the answer? \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I figured it out because of your body. The movements of your eyes and mouth. Your breathing. Your behavior. Your tone. Everything about you told me that you were lying,” continued Ryuuen in an eerie voice. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Stop with the jokes!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Jokes? If it’s a joke, then how do I know the truth?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s… I’m sure you could’ve just heard it from someone else,” Horikita stammered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand how you feel. You don’t want to admit that you’re the most incompetent person in the group. But don’t beat yourself up, Suzune. You merely chose the wrong opponent. Besides, this exam was supposed to be pure chaos. At any rate, Class A is in for an especially rude awakening. Relax.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What? What did you do?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ll understand soon enough.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, Ryuuen had played a major part in the four betrayal emails. Once the clock struck eleven, we received notifications at the exact same time. All of us, save Ryuuen, checked the results:\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eRat: Outcome #3. The traitor answered correctly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eCow: Outcome #4. The traitor answered incorrectly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eTiger: Outcome #2. The VIP’s identity was not discovered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eRabbit: Outcome #4. The traitor answered incorrectly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eDragon: Outcome #1. The entire group answered correctly at the end of the test.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSnake: Outcome #2. The VIP’s identity was not discovered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHorse: Outcome #3. The traitor answered correctly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSheep: Outcome #2. The VIP’s identity was not discovered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eMonkey: Outcome #3. The traitor answered correctly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eRooster: Outcome #3. The traitor answered correctly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eDog: Outcome #2. The VIP’s identity was not discovered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ePig: Outcome 3. #The traitor answered correctly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eBased on those results, the increase or decrease in class and private points are as follows. “Cl” and “Pr” are used to denote “class points” and “private points,” respectively.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eClass A: Minus 200 cl; Plus 2 Million pr\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eClass B: No Change cl; Plus 2.5 Million pr\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eClass C: Plus 150 cl; Plus 5.5 Million pr\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eClass D: Plus 50 cl; Plus 3 Million pr\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Class C…came out on top,” muttered Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone looked stunned by the results.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Isn’t this great, Suzune? Thanks to your blunder, the Dragon group managed to clear this test with Outcome #1. Because of that, all the classes should receive a boost in points,” Ryuuen crowed. He clapped his hands and wore a satisfied grin. “If you beg for it, I’ll tell you the answer. How about it?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who would—” Horikita started to snap, but quickly shut her mouth.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ooh, that look you have. It’s pretty sexy.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen took out his phone and placed it on the table. On the screen was a list, and on that list were the names of the VIPs from Class A in the Rat, Rooster, and Pig groups.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I made some adjustments and arrived at the root of the test. Then, I just focused on the Class A students,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen had managed to clear the test without targeting Classes B or D at all. No one should have been able to pull off something like that, but Ryuuen did.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry to tell you, Suzune, but you’re my next target. I’m going after you with everything I’ve got. I won’t stop until I tear you to shreds, both in mind and body.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita, unable to attempt a comeback, simply kept staring at the results. After obtaining such a huge number of points, Class C had gained an overwhelming lead. Looking over the results, it became clear that Kouenji saved our asses, even though we thought he’d been screwing around. If he hadn’t done what he did, this victory would’ve belonged exclusively to Class C. Of course, Kouenji’s actions had ended up causing stray bullets to go flying at other VIPs.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m looking forward to the second semester,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen, his payback for the island administered in full, walked away with satisfaction. The rest of us weren’t exactly in a celebratory mood. If someone saw the stern looks on our faces, they’d imagine we’d suffered a crushing defeat.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand that Ryuuen-kun managed to discover the VIPs in Class A, sure, but I’m not convinced he has some kind of preternatural talent. Still, how did Dragon Group end up with that result?” asked Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo one answered, perhaps because no one could figure it out. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, it’s not really a difficult problem. If you just put your mind to it, it’s relatively simple,” I told everyone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Putting aside how Ryuuen found out the VIPs’ identities, all he had to do was tell everyone ‘Kushida is the VIP’ before the end of the test, right? Of course, no one would believe what someone like Ryuuen says. Especially a group of such intelligent, gifted people. However, the final half hour was different. Even if you answered incorrectly, there wasn’t any risk to class points. As such, even someone who’d been playing defensively like Katsuragi could vote, right? If there was even a 1% chance that Kushida was really the VIP, then they would’ve gotten Outcome #1, which was the most convenient for everyone involved.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf he’d just planted the seed earlier, it would’ve been extremely simple. But something like that would’ve normally been impossible. It was a tightrope act; something that couldn’t have happened unless every single person trusted that Kushida was the answer. Was it even possible? As I thought about it, I still had doubts. I never would’ve imagined he could succeed. How had he gained everyone else’s—excluding Class D, of course—trust? I\u0026#160;was genuinely curious. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps if he had absolute proof?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita. I think that we might be in trouble,” I said. There was no quick fix to our problem. Depending on how things went, Class D might be stuck with these obstacles for the long haul.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“By trouble, you mean Ryuuen-kun? It’s true he did very well in this test, but there’s no guarantee he’ll be dangerous in the future. Your group won their test, after all. Didn’t they?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve got a point. I’m probably overthinking things. Don’t worry.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps my feelings were nothing more than a premonition. But what if they came true? These might be our first faltering steps toward despair. But I also felt some alien emotion growing inside of me. It was something like excitement.\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 5: Each and Every Difference\",\"volumeId\":\"v4\",\"chapterIndex\":11,\"prevChapter\":{\"volumeId\":\"v4\",\"chapter\":10,\"title\":\"Chapter 4: Double Question\"},\"nextChapter\":{\"volumeId\":\"v4\",\"chapter\":12,\"title\":\"Epilogue: Postscript\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Title Page\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Karuizawa Kei’s Soliloquy\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: The Gentle Days…\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: An Infinite Variety of Wishes\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: Double Question\",\"href\":\"Text/section-0008.html#auto_bookmark_toc_top\",\"index\":10},{\"label\":\"Chapter 5: Each and Every Difference\",\"href\":\"Text/section-0009.html#auto_bookmark_toc_top\",\"index\":11},{\"label\":\"Epilogue: Postscript\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_top\",\"index\":12},{\"label\":\"About the Author and Illustrator\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_top\",\"index\":13}],\"volumeTitle\
