: 1.00em;\"\u003e“Your body, huh? You know, that doesn’t sound too bad.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI ran my fingertips across Karuizawa’s thighs. She felt so incredibly soft that I couldn’t even imagine that she was a person like me. Her skin was silky smooth. The feel of it was incredibly different from my own.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Eek!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe tried to escape my touch. I held her tighter and forced her to look straight at me. “Don’t run. If you try it again, I’ll tell everyone at school what I know about you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThose words were like a magic spell. She stiffened.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You… Grr…” She sputtered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRage, panic, fear, despair: How many negative feelings had Karuizawa been carrying? She now realized that I was completely different from the meek person she knew from school. She probably found it terrifying.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Spread your legs,” I commanded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa slowly opened her legs, tears streaming down her face as she did so. Even if she knew that she was about to be violated, she still wanted to protect her position. The pain she felt from her years of being bullied had won out. I placed my hand on my belt buckle and pretended to rattle it. Even so, Karuizawa didn’t run. She was trying to accept this. She looked at me with empty eyes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no doubt about it. Karuizawa Kei had become a perfect tool for me. I didn’t actually care about her body; I just needed to threaten her to see how far she was willing to go, how much she would do. She probably understood that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRevealing my true self to her was a big risk. If Karuizawa reported me to the school, I’d be in enormous trouble. However, she feared her past and losing her current social status more than anything else. That was why she’d go so far as to offer up her body if someone requested it, if it would protect her secret. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll never bow to you. I won’t be bullied by the likes of you. You just want to mess with me! You think you can do whatever you want, you pervert?!” she shouted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa roared with anger, as if it was welling up from deep within her heart.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e\"Well, whatever. It’s not like this is the first time someone’s used force against me. So. Did you know about \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e too? How do you think I should act in an impossible situation?” She laughed coldly, then looked me right in the eyes with a thin smile. She was still trembling, and there was an intense darkness in her gaze.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“After a while, I gave up trying to resist. That’s right; I was everyone’s victim. I became cold, robotic. I could cry, scream, or thrash around, but it didn’t matter. I couldn’t do anything. All I could do was take it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa, as if accepting it all, lifted her skirt and touched her panties. I grabbed her slender arm and pushed her up against the wall.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What happened to you?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What happened? All sorts of things. Everything and anything. They’d put tacks in my shoes or stuff my desk full of roadkill. When I went to the bathroom, I’d get splashed with dirty water. They wrote words like ‘whore’ on my uniform. They pulled my hair and punched and kicked me. Anything you could imagine, basically. I was bullied in every way. Countless times. What I’ve just told you was just a fraction of what I’ve experienced. Those were the ‘gentler’ ways I’ve been bullied, too. It makes me want to laugh. So, why aren’t \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e laughing? Why don’t you laugh at the pitiful loser who’s been bullied all her life?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven after everything she’d suffered, she still got back up. She seemed ready to fight again. Her resilience had motivated her to enroll in this school. Still…the experiences she’d recounted weren’t enough to explain everything.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What else have you suffered?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Have you told me the whole truth?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI believed that something critical had shattered her spirit before this. There had to be some other reason behind her abnormal fearfulness, something that Karuizawa wanted to hide so much that it was worth giving up her body.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you hiding?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa turned her head from me and lowered her eyes to look down at her left side. I noticed that, of course. I reached over and touched that part of her body, over her uniform.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“S-stop!” she shouted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer shouts echoed within the enclosed walls of the room. I grabbed her uniform and pulled it up. There, on her beautiful skin, was an ugly scar. A deep scar, one that had been created by a sharp blade.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is it? This is your darkness?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“U-ugh!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis wasn’t the result of simple bullying. A serious scar like this had come from a life-threatening attack. Even though she was burdened with that horrible past, she remained tough. She got back on her feet. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOver the past few days, I’d keenly observed Karuizawa Kei. To protect herself, she forced people to become her allies. She protected her status, even if that meant being disliked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Despair comes in many forms. And you’ve experienced despair. Haven’t you?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa’s dark eyes met with mine. People who carry darkness within are attracted to one another. Slowly, they erode each other. Those who conceal a deep darkness will readily embrace the darkness of others. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what are you…you…” she stammered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf her past held her captive, then I had to forcefully free her from her shackles. Even if we weren’t close, I\u0026#160;could feel the darkness from her, through her skin. Yes. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were profoundly dark things left in this world that even Karuizawa didn’t yet know about.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I promise you one thing. From now on, I will protect you from bullying. I will be much more reliable than Hirata or Machida,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait. You meant that \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ecan stop Manabe and her friends?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Right now, you should understand what I’m saying. If the wind blows, a tiny flame goes out. However, a larger flame only grows bigger. It becomes so strong that it won’t go out, not even in the face of wild winds or pouring rain. You will help me, and I will help you. Kindness has nothing to do with it. Do you have any problems with this arrangement?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“First things first. I’ll get rid of your anxieties for you,” I added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI pulled out my phone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have a way to stop Manabe and her friends.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI showed her phone. On the screen was a photo of Karuizawa being bullied in the emergency stairway.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s—” she began.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I send this picture to them, they won’t get carried away anymore. If they still decide to harass you, perhaps by spreading rumors, then I will step in and put a stop to it. With this.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs far as Manabe and her friends were concerned, this incident should have been enough to satisfy them. If they got carried away and tried to hurt Karuizawa further, they would end up causing trouble for Ryuuen. Then they would be in jeopardy themselves. I let go of Karuizawa’s chin, and spoke in a flat, emotionless tone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All I want is for people to cooperate with me. I want you to assist me in the future, doing whatever I need.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What? Assist? What do you want me to do?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If things continue as they are, Class D will never overtake Class A. While the individual students within Class D certainly aren’t incapable, we lack a sense of unity. Our class is scattered. However, if you control the girls for me, the situation will gradually improve.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer social pull made her an even more valuable ally than Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you trying to…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUp until now, she’d only ever seen as me as a lowly, unobtrusive guy. Seeing my true self must’ve terrified her. But I was done explaining. Besides, the less I talked, the more terrifying I would appear. The less she would resist.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now, the first thing I need. We must guide our group to victory in this exam.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How am I supposed to help lead them to—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can, because you’re… Right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough I didn’t articulate the key word in that sentence, Karuizawa seemed to know what it was. She looked me in the eyes. The truth resonated deep within her, in her heart. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe tried to look puzzled, but that was just an act. After all, a parasite couldn’t live without a host. By finding a new host, Karuizawa only had one way to go on living: with me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol4_INTERIORILLUSTRATIONS_11\" src=\"/hola-lector-agua/images/books/v4/OEBPS/Images/ClassroomElite-Vol4_INTERIORILLUSTRATIONS_11.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 4: Double Question\",\"volumeId\":\"v4\",
