[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T34c5d,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 4:\u003cbr/\u003eDouble Question\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003e“Y\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eou’re joking, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe first thing out of Horikita’s mouth sounded very accusatory.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unfortunately, it’s the truth. Kouenji just ended the test for his group,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you an idiot? Why didn’t you stop him? Wasn’t that your responsibility as his roommate?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s an impossible task. Besides, there’s nothing I can do about it now. No use crying over spilt milk.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji’s treasonous act had circulated around the ship, and naturally the classes were in an uproar. Even though we’d chatted yesterday, Horikita wanted to meet face-to-face today. She seemed unconvinced by my words, because she was still shaking her head.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When I see him next time, I’ll reprimand him myself. I’ll make him beg for mercy.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You already know that’s pointless, right? He won’t listen. He’ll just confuse you and waste your time. It’ll be a headache. For the time being, we should concentrate on our own groups.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe’d keep blaming me for Kouenji because he was my roommate. I decided to change the subject.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s true that my group is filled with troublesome opponents, but I’ve no intention of falling behind,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe certainly had an iron will. Well, I supposed I would have to leave the matter to her. I had problems of my own, specifically with Ichinose and the others who’d been secretly sent by Hoshinomiya-sensei to spy on me. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was thinking. You’re a girl, more or less. I wanted to ask you something,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I really don’t like the way you said that. ‘More or less’? I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eam\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e a girl.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita had misunderstood what I’d meant. She looked disgruntled, and turned away from me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, uh, that’s not really what I meant. I meant there was something I wanted to ask you, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eas\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e a girl.” Since she’d probably get angrier no matter what I did, I cut to the chase. “I want information on Karuizawa.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d planned to contact Karuizawa, but had never talked to her before. If Karuizawa ranked the boys in our class, I likely would’ve been last. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You want to talk to \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eme\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e about Karuizawa?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, exactly.” I nodded. “I’d like to know more about the people in my group, but it’s not easy. I should be able find out whatever I need to about the Professor and Yukimura, but I’m at a complete loss with Karuizawa. After the test on the island ended, Karuizawa invited you out to lunch. Right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I turned her down, though. You know that. I have no interest in Karuizawa-san. If you want information on her, why not talk to Hirata-kun? If he’s helping you, you’ll be able to contact her easily.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was certainly true. Unfortunately, prior to the test, I had \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ealso\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e passed on the opportunity to have lunch with Karuizawa. Hirata probably remembered that, so I wanted to avoid asking him about this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you think she’s the VIP? Is that what you’re worried about?” Horikita asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s that. But more than that, I can’t understand Karuizawa’s behavior. That’s why I’m worried.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, isn’t that none of your business? Besides, her behavior isn’t logical. I think it’s a waste of time,” she countered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita, I don’t think it’s good to write people off like that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Write them off? What are you talking about?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You and Karuizawa don’t get along at all because you’re both willful, so you see her as nothing more than a nuisance. You understand that she may also have strong points, too?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eShe\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e has strong points? I can’t really imagine any. Isn’t she just flawed?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn terms of cooperativeness, Horikita was probably at the same level or even worse than Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When you first see someone, you make judgments based on their appearance. You might determine if someone is cool or cute, for instance. Basically, you read people. Call it your first impression; that’s simple enough. Next, you learn about their inner self through conversation and seeing them in action. You’ll see whether they’re sociable, belligerent, passive, etc.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita crossed her arms, acting like my words were obvious. She waited for me to continue.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But that’s still just as superficial as their outside appearance. Their innermost thoughts aren’t going to be immediately apparent from that. For example, take Kushida, Ibuki, or even me. There’s a difference between a person’s outer and inner selves.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So Karuizawa has some secret self?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Almost everyone does. They may not be aware of it themselves. You do, too.” Whenever she came face to face with her older brother, she exposed her fragility.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m still not entirely convinced. However, I imagine you’ll learn more about her by spending time together,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, that was easier said than done. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what are Karuizawa-san’s good points?” Horikita asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I still can’t really describe it, but so far I’d say it’s her ability to assume control. She can take the initiative. In fact, her position in Class D is unshakeable.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, in the Rabbit group, that part of her stayed hidden, which exactly why I needed to uncover Karuizawa’s true nature as quickly as possible.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay. Let’s say for the sake of argument that you’re right, and she has that ability. What do you intend to do? Are you thinking of making her your ally, too?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm, I have to think about that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile I thought about how to answer, Ryuuen approached us. “Hey, you two. Having yourselves a nice date in the shade? Let me in on the fun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe wasn’t with Ibuki, apparently. He drew closer to us, wearing a creepy smile.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems like you have an awful lot of free time. Not that I care, but there’s nothing for you here,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s for me to decide. Well then, have you decided how to find the VIP?” he asked. Ryuuen sat down without bothering to ask permission.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whatever my plans may be, I’ve no intention of telling you,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s too bad. I wanted to get your opinion. However, it looks like you haven’t made any progress at all in your search.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s an interesting thing to say. Are you saying that \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e know who the VIP is?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen smirked slightly at Horikita, as if expecting her to express disbelief. “I’ve already started to discover the VIP’s identity. Would you believe me if I told you that?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I wouldn’t. You don’t have any support like Ichinose-san and Katsuragi-kun do. You only have enemies. I can’t imagine you have reliable information,” she countered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, you’re right that I’m not a professional friend-collector, but making friends has nothing to do with whether or not I can gather information.” He spoke like a teacher rebuking his student for not getting the correct answer. “Unfortunately for you, I’ve already gotten a handle on the fundamentals of this test. Depending on how things go, Class C will win by an overwhelming majority.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, you can’t be…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo, what he was saying was probably true. The school always created tests with fundamental laws or rules at their core. That was true of our midterms, final exams, and even the test on the island. If you understood the logic behind those rules, it would be possible to win. This test was likely no different. He must have noticed that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s an extremely simple matter. All you need to do is find out what class the VIP is from. Then, your next move is to analyze the group,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Anyone could think of that. But are they going to answer honestly? If the school has a rule that guarantees your anonymity, all they need to do is lie and gain 500,000 points, right?” Horikita countered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen appeared calm in the face of Horikita’s doubts. “You just have to make sure it’s a situation where someone \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecan’t \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003elie,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Where someone can’t lie?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I take everyone’s cell phones. So if someone lies to me, all I have to do is check everyone’s email, one by one,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you insane? The school doesn’t allow that. If you were discovered, you’d be expelled,” snapped Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not really a problem at all, actually. I’m here \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ebecause\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e it’s not a problem. Do you get what I mean?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a brute-force method that only he could pull off, because he was an absolute tyrant. If he forcibly looked at another student’s phone, then Ryuuen would be punished. However, even if Ryuuen rampaged through Class C, he believed no one would lodge a complaint against him. And if no one complained to the school, that meant they were practically giving him consent. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen’s calm proved that what he said was true—that he was operating within the rules. His strategy was to forcibly lay bare all of Class C’s secrets. At any rate, if what he was saying was true, Ryuuen had identified three of the VIPs. That was a huge step toward completing this\u0026#160;test.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was comparable to a quiz where you could turn the page over and find the answer written on the back. If you didn’t flip the page, no one would know the answer, but if you flipped it just a little, you could spy the answer. In other words, Ryuuen probably knew the identities of every class’s VIP.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks like you finally understand.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. But you haven’t got the answer yet. If you had, you would’ve sent an email to the school immediately,” answered Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe I’m just playing around?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t know when someone else is going to figure it out. You shouldn’t be so laid-back,” Horikita snapped. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe didn’t have any proof, but Horikita was probably correct. If he already knew the answer, there’d be no benefit to delaying the result. He should have ended it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now, then. Suppose I’m about to reach checkmate?” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ryuuen-kun. While you’re here, I’d like to ask you something. The test ended for the Monkey group yesterday. What do you think about that?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think about it at all. I don’t really care about small fry. See you again, Suzune.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen left. His parting words made me wonder if he planned on reporting back regularly. I flipped him off, and Horikita made a face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know how much of what he said is true,” she\u0026#160;said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile we kept silent, we peeked underneath the chair that Ryuuen had been sitting in. Under the chair was a single cell phone set to record audio. A single chat message had been sent to that phone. There was no sound because the phone had been set to silent. I couldn’t see everything on the screen because of the angle, but I instantly made out the words “Sorry for yesterday!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps there was some kind of drama in their class? I didn’t want to court disaster by continuing to look, so I sat back up. Horikita quickly understood, took out her own phone, and sent me a short message:\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eIf that phone is his, we probably shouldn’t say anything careless.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, she wasn’t wrong, but who knew what the correct answer was? This was difficult, but it would also be suspicious for us to just go silent.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you think what Ryuuen said was true? About finding out the VIPs from every class,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita looked perplexed for a moment. However, she seemed to quickly pick up on what I was getting at. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have to wonder. I can’t say I’m 100% sure. But…there’s a possibility. I don’t think we can keep up this test much longer, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sounds like things are rough for you, too,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve got a lot of work for you to do. I need you to find the group’s VIP as soon as possible,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Easy for you to say. It’s not like \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ecan find them.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I won’t expect too much from you. I just want information about the Rabbit group.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOur conversation only highlighted Horikita’s capability and my incompetence. That way, suspicion would probably be directed away from me. At any rate, Ryuuen was using his own phone to try and find out more. He was looking for anything he could get.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re not expecting too much, I’ll do what I can,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWithout saying anything else, Horikita got up, walked to the elevator, and left. Should I head back to my own room? Or should I come up with a strategy to win the test? I left Ryuuen’s phone alone and walked away. Eventually, I decided to head back to my own room. I\u0026#160;could learn more detailed information about Horikita’s group from Hirata, more or less. Also, Hirata would likely approach this test from a different perspective than Horikita. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Hirata wasn’t in the room when I came in. I only saw Yukimura. He was sitting on the edge of the bed, looking grave.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s the matter?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was my roommate, after all, so I couldn’t just ignore him. Yukimura noticed me, but he didn’t respond. He sighed quietly and muttered something to himself. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For crying out loud, why did we get stuck with this group? Why am I partnered with Karuizawa and Sotomura? We can’t win,” he mumbled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s with you all of a sudden?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Didn’t you hear? There’s a rumor going around saying that they use guidelines to create the groups. When I heard that all the superior students got grouped into the Dragon group, I knew it was true,” he answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo that’s what he was agonizing over. It was certainly true that the Dragon group did seem to feature the best of the best. Considering the conversation I’d overheard between the teachers and what Ryuuen had said, there wasn’t any doubt. Based on pure academic ability, Yukimura certainly wasn’t inferior to Hirata or Horikita. He was probably dissatisfied at being placed in the Rabbit group, which was stuck somewhere in the middle.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYukimura didn’t use a certain person’s name, but when he looked at me it was clear he was thinking about Horikita. Unfortunately, I couldn’t help him. While I continued listening to him, I returned to my bed and laid down on my side. I thought I’d take a nap until Hirata returned.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnfortunately, I felt a disagreeable gaze on me. Yukimura stared at me suspiciously. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji. You aren’t the VIP, are you?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if I did deny it and said you’re wrong, what’s the point in checking?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Cooperation is vital in this test. We need to adhere to that. If we cooperate, we won’t lose.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Unfortunately, I’m not the VIP.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you sure? You’re not being selfish and trying to hoard points, are you?” Yukimura seemed to doubt everyone as a rule, so this didn’t surprise me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not the VIP. Can I believe that you’re not the VIP, Yukimura?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, of course you can. I’m not the VIP. Neither is Sotomura, by the way.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was sort of like a secret handshake, a magic contract between allies.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I checked with Karuizawa, too. She said that she’s not the VIP, but whether I believe her is another issue.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYukimura normally showed disdain for Karuizawa, so he tended not to believe what she said. He’d know the truth for sure if he checked her phone, but given that they had a tenuous relationship, that would be difficult. You could say their relationship was the embodiment of “good fences make good neighbors.” They liked to keep their distance. They wouldn’t flaunt their good fortune to one another.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYukimura seemed satisfied for the time being, because he didn’t press the matter any further. I laid my head on my pillow and closed my eyes. I couldn’t really relax with someone else in the room, but it wasn’t too unpleasant. When I really focused on trying to make friends, I could be as adaptive as a chameleon, and it seemed even Yukimura was starting to warm up to me. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI fell into a light sleep, punctuated by Yukimura’s occasional sighs.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e4.1\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003en the afternoon, I went to the Rabbit group’s discussion room. Despite the fact that it was a bright, sunny day, the atmosphere could completely change depending on the company. I arrived ten minutes before the discussion was set to begin and appeared to be the first one there. The next to arrive was Karuizawa. When she saw me, her expression changed to one of apparent disgust, and she quickly averted her eyes. After that, she moved as far away from me as she could and sat down. She took out her phone and started fiddling with it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol4_INTERIORILLUSTRATIONS_8\" src=\"/hola-lector-agua/images/books/v4/OEBPS/Images/ClassroomElite-Vol4_INTERIORILLUSTRATIONS_8.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe didn’t exactly get along. We didn’t really fight, though. She simply disliked me. But that was actually the most bothersome kind of relationship. If she disliked me for a reason, there was room for improvement. However, if she just instinctively hated me, then there was no chance of a breakthrough. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could’ve killed time out in the hall until Ichinose and the others arrived, but since I was here first, it would look awkward if I left. I decided to adjust my posture to look more manly and dignified. What a bother this test was. Because it centered around conversation, you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehad\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to participate no matter what, which was difficult for me. Even after the first semester ended, I still couldn’t bring myself to strike up a conversation. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa didn’t seem like she planned to pass the time quietly. She put her phone to her ear and started talking. “Oh hi, Rinocchi? How are things with you right now? Me? Ah, things here suck so bad. Like, I’m seriously fed up with everything,” said Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince we were the only two people in the room, I could naturally overhear every bit of Karuizawa’s conversation, including how she skillfully wove together expressions of both joy and melancholy. It was an incredibly awkward situation with only two people in the room. Immediately after her call ended, there came a moment of silence.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That reminds me. So, are you the VIP? It seems like…Yukimura-kun and that Soto…kun aren’t,” said Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWow, she was talking to me. At least she could remember Sotomura’s name. Yukimura had asked me that same question a little while ago. I suppose it made sense that everyone wanted to check.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nope,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, okay. That’s fine.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, unlike Yukimura, she didn’t double-check. “Do you believe me?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? You said you’re not, didn’t you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though we didn’t get along well, she seemed to believe what I said. Well, there really wasn’t any need to press the issue. I wasn’t looking to get more points in this test. What was important was ascertaining whether Karuizawa could be useful to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You two sure are early,” said Ichinose. The three Class B students had arrived together.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nice to see you,” I said. I raised my hand slightly. Ichinose spoke to Karuizawa as well, but Karuizawa was so busy on her phone, she didn’t respond.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone in our group showed up before the start time. However, the situation hadn’t changed at all from yesterday. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass A kept its distance from the rest of us, so the rest of us formed a circle. Then, Karuizawa got up and sat down next to Machida from Class A. Probably a defensive measure against Manabe. Machida didn’t participate in the discussion, but we felt his presence very strongly. There was also a power imbalance, and Class C, which only had girls like Manabe, didn’t really have any charismatic members who could go up against Machida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHad Karuizawa instead gone to someone weak, like me or the Professor, for support, Manabe and the others could have hounded her. Karuizawa had definitely made the correct decision.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry. If anything happens, I’ll help you,” said Machida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you, Machida-kun,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince Karuizawa had started depending on Machida, he seemed very conscious of her. I mean, she was a really cute girl, so it was understandable that he’d want to protect her. Even if they were from different classes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLeaving aside their new (and dangerous) affections, the test was the problem. We all understood that. We understood that what separated victory from defeat was finding out whether your class had the VIP.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now then. I’m sure we all discussed this amongst ourselves last night, but I think we should try and find the VIPs after all,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This again? Don’t you get that some people here won’t go along with it? If we don’t all participate, there’s no way you’ll find the VIP,” said one of the Class A students mockingly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think that’s true, though. It’s a problem of trust. That’s why today, I’d like us all to play cards together. Of course, I won’t force anyone to participate. Only jump in if you want to,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe brought out a deck of cards, all while smiling.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ha ha ha ha! Building trust through playing cards? That’s so stupid!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can say it’s stupid, but if you give it a try you might like it. Besides, spending an hour in complete silence sounds awfully boring. Why not kill some time?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, all the other Class B students agreed to participate.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I shall play as well. I am currently at liberty,” said the Professor.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, the Professor was right. We didn’t have anything else to do right now. No one else was joining, so I slowly raised my hand.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Five people, then. Well, I thought we could play \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eDaifugō\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, but does anyone here not know the rules?” asked Ichinose. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had a grasp on the rules, to a certain extent. I knew about \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eDaifugō\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. No one seemed to have a problem, so we got into a small circle and started playing. The people not playing either chatted amongst themselves, or occasionally shot us an indifferent glance. Ichinose shuffled the deck and divided the cards evenly among the five of us. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had a Joker, a pair of twos, and three other cards. Considering the hand I’d been dealt, I could’ve seemingly overwhelmed the others, but the winner isn’t always the one with the strongest hand. The smallest upset could weaken your hand, and then you’d be defeated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, I clearly had the superior hand. I needed a solid strategy to make use of the cards. This game was more profound than I’d expected. Also, everyone’s idiosyncrasies were on clear display. Ichinose didn’t just concentrate on her own hand; she played her opponents’ as well. Hamaguchi focused on the endgame. He also got rather worked up at times, like the Professor.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Once more!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI would’ve thought that the Professor, who was a huge otaku, would be relatively calm. But when it came to games, he was the type to get fired up easily. At least he was also the type to cool off quickly, since he calmed down as soon as the game ended. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was probably what Ichinose wanted to see. By learning the unique characteristics of our group, she would know how to talk to them. It wasn’t much, but considering that talking was useless at present, it was effective. It also meant that Ichinose was observing my behavior, just as I’d observed the Professor.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wondered how I looked from Ichinose’s perspective. From an objective perspective, I probably looked dull. I pushed ahead when I had a good hand, but turned passive when the situation went downhill. A common kind of person. However, rather than forcibly changing the way I played and confusing Ichinose, it was probably better for me to be consistent. I continued the game as I normally would. We started off playing \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eDaifugō\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, and played about five games before switching to Old Maid. The hour passed. In the end, neither Class A nor Class C joined in, so the five of us played from beginning to end.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh, my my, that was quite enjoyable. Playing a traditional game on occasion is no bad thing,” said the Professor. He seemed to have enjoyed spending the hour playing games rather than talking. However, even after this session of psychological revelation, I still couldn’t understand Class B’s true plan. Only Ichinose had that information.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I suppose I’ll be going now,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Where are you going?” asked Hamaguchi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t let Class A just get away from us like this.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re going to see Katsuragi-kun, then?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo. Ichinose intended to confront the man who’d devised Class A’s “castle gate” strategy. Even though I wasn’t a fundamentally social person, I knew I should take advantage of this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you don’t mind, can I go along with you?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm? Sure, that’s fine with me. Do you want to talk to Katsuragi-kun, too, Ayanokouji?” asked Ichinose. She didn’t seem wary of me. Rather, she looked simply curious. She tilted her head.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, that’s not it. Horikita’s in the same group as Katsuragi.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, okay. Well then, let’s go together. See you later, Hamaguchi-kun,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHamaguchi nodded and watched us walk off. Even though Ichinose had taken the lead, they all seemed to respect one another. That wasn’t at all the type of relationship that Katsuragi and Ryuuen had with their subjects. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf the group discussions were happening at the same time, then each group would be breaking up at about the same time, too. Ichinose walked quickly, hoping to arrive before the Dragon group dispersed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s hurry,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose picked up the pace. At least the rooms were all on the same deck, so it wasn’t too long a walk. Since the discussion had only just ended, there was a scattering of students in the hall. Soon, we arrived at the Dragon group’s room.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe couldn’t hear any voices, but we got the sense that people were still in the room. We stopped right outside the door. They might still be talking in there. I sent Horikita an instant message, but I didn’t think she read it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks like they’re really taking their time,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t imagine Ryuuen and Katsuragi holding a discussion. Maybe Class B is showing off their power?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not sure about that. Kanzaki-kun isn’t the type to take the spotlight. On that note, you have Horikita-san in there with some others from your class, right? She’s a star player in the Class D line-up.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita, Hirata, and Kushida were all star players. Ten minutes passed until, finally, the door opened. The first person to exit the room was Ichinose’s target, Katsuragi. Other Class A students trailed behind him. Katsuragi immediately noticed Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ichinose? What are you doing here?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d like to talk to you, Katsuragi-kun. Do you have a minute?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, the testing period \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eis\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e three days long. I have several minutes available.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe didn’t ignore Ichinose. Rather, he looked happy to engage with her. The other Class A students understood and continued on their way.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s fine if I stay behind alone, yes?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose nodded. They moved out of the way of passersby. I somehow managed to remain in the conversation, so I stood close to Ichinose. From Katsuragi’s perspective, I was nothing more than a single spectator. He didn’t say anything about me being there.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think I know what you’re planning, Katsuragi-kun. You ordered your classmates to refuse to participate in discussions, yes? Would you possibly reconsider? We need communication to get through this test, after all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the three discussions we’d had so far, the Class\u0026#160;A students had passed the time in complete silence. Ichinose couldn’t break down those walls on her own. She needed someone to lower the castle gate and let her in. Now, what would be Katsuragi’s response?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s extremely reasonable. But I’ve heard this question so many times that I feel like my ears are going to fall off. Unfortunately, Ichinose, you’ve wasted your time,” said Katsuragi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently Katsuragi’s strategy had gotten a lot of attention. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have my own situation to deal with. Katsuragi-kun. I don’t think forcing people to be quiet is a good strategy. Would you reconsider?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi, who’d probably been answering the same questions to multiple classes over and over, went straight to the heart of the matter.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The answer will always be the same. I developed that strategy to win. My reasons are good. You think this test requires communication. That’s why you don’t agree with me, but you’re wrong. This test is about \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethinking\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. If you miss that, it’s a big problem. So, in keeping with the theme of the test, I’ve decided to stifle discussion.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But, Katsuragi-kun, your idea is basically a rejection of the test itself,” countered Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What I’ve said might sound bad, but it’s not. I’m looking out for my class, looking for ways to not only preserve our standing in this test, but in tests to come. Do you agree that there’s nothing wrong with me protecting my class?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If this test were a direct competition between the classes, sure. I’d agree. But in this test, when all the classes are blended together, do you really think that’s right?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut Katsuragi’s opinion \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewas\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e correct. There were four possible outcomes in this test. As long as you chose one of those outcomes, it was legitimate. Katsuragi wasn’t interested in small intergroup competitions; he was solely focused on maintaining Class A’s lead.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Any further discussion is meaningless, Ichinose. You can’t change my mind,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So. Like the old saying goes, an immovable object meets an irresistible force?” Ichinose wore a wry, pained smile as she rubbed the back of her head. She didn’t appear disappointed, but she probably understood there was no budging Katsuragi. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you still intend to fight?” asked Katsuragi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course. This is a test,” answered Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose and Katsuragi—two powerful, influential forces—were facing off against each other.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry, but the result’s a foregone conclusion. If Class A doesn’t participate, there’s not much you can do. There shouldn’t be any way for you to win,” said Katsuragi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if the three other classes were united, winning wouldn’t be easy. If they discovered the identity of the VIP, anyone could become a traitor. As long as the potential traitor stood to gain something, it’d be difficult to maintain cooperation until the bitter end. If the reward wasn’t distributed evenly, there’d be no reason to cooperate.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I want to ask you one thing. If you were Class A’s leader, what would you do? Wouldn’t you implement the same strategy?” asked Katsuragi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm…I wonder. Well, I can’t really consider things from Class A’s perspective. If you’re being chased, I imagine it would be better to have experience with chasing. Always running is pretty tough, isn’t it?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi closed his eyes and crossed his arms, as if dismissing her words. He then met Ichinose’s gaze once again.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In my opinion, if you were standing in my position, you would’ve come up with the same strategy I did. If it’s to protect my class, I don’t particularly mind being criticized by others.” Katsuragi locked eyes with Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn response, Ichinose smiled softly. “I’m sorry for taking up your time. I think I understand now. Understand your thoughts and ideas, I mean,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m glad to hear that. Well, if you’ll excuse me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose watched Katsuragi leave.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This test is easier if you’re playing defense. I guess I’ll have to do even more,” she mused.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe lower classes were frantically fumbling around for hints, but that was risky. If you missed the VIP, you’d let down the rest of the class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, Kanzaki-kun and the others haven’t come out yet,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnly Katsuragi and the other Class A students had shown themselves. So far, no one else had left the room. One hour was the minimum requirement, but it was okay to discuss things further.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you going to wait for Kanzaki?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re waiting for Horikita-san, right? I wanted to ask her something, too. Let’s wait together.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe could talk to Kanzaki whenever, but her chances to speak with Horikita were probably limited. Since Katsuragi had brushed her off, Ichinose probably wanted to gather opinions from the other classes. But I couldn’t see how she was planning to break through Katsuragi’s strategy.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe waited for nearly thirty minutes until, finally, the door opened. All of the Class C students left, except for Ryuuen. Kushida and Hirata came out next.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Ayanokouji-kun, what are you doing here? Are you waiting for Horikita-san?” asked Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida approached me, looking puzzled. I remembered the scene from yesterday and quickly stiffened. Unfortunately, Kushida seemed to have gone back to her usual self, as though nothing had changed. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hello, Kushida-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh! Ichinose-san! Hello. Now, this is odd. Well, I should say I didn’t expect to see the two of you together,” said Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently Kushida didn’t know that Ichinose and I knew one another. She couldn’t hide her surprise.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re waiting for Horikita-san and Kanzaki-kun. Are they still talking?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, those two. They’re still discussing things with Ryuuen-kun right now. Maybe you could step inside?” Kushida gestured toward the door, as if inviting us in.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh no, it’s all right. If they’re still in the middle of something, we can wait.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, I think it’s fine. Besides, the test period is only one hour. Any time after that, we’re free to come and go as we please. Besides, they may not be talking about the\u0026#160;test.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida opened the door and called us in. Ichinose and I couldn’t refuse her invitation, so we entered. Hirata and I briefly exchanged looks as we passed each other. Inside, Horikita, Kanzaki, and Ryuuen were sitting slightly apart from one another. It was a three-way deadlock.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough the mood wasn’t necessarily tense, it wasn’t relaxed, either. As we entered, everyone turned their attention toward us. Horikita and Kanzaki didn’t change their expressions, but Ryuuen chuckled, as if we amused him. Then, he raised his hand to Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yo. Did you come all the way here to do some reconnaissance? Don’t be shy. Take a seat.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is a rather interesting group. I want to know what you’re all talking about, especially since the required hour is up,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh. Ah, of course you do. Originally, I thought you would have taken Kanzaki’s place in here. But you ended up in a different group. What’s more, you got shoved into a completely hopeless, hapless group. Or maybe you are a hopeless, hapless kind of person,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, Ryuuen-kun. You know that we can’t understand the school’s strategies. We’re just doing our best with the information we have and the situation we were placed into. But it sounds like you think there’s a reasoning behind the group formations. Do you think the school had some kind of plan in mind?” asked Ichinose. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose pretended she hadn’t noticed anything, but Ryuuen wasn’t the type to believe a woman so easily. Chuckling slightly, he drew closer to Ichinose. He didn’t pay any attention to me. Well, that was okay by me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you haven’t realized it yet, I’ll explain it to you. The teachers intentionally decided how the groups would be divided. It’s obvious, don’t you think? If so, that means you were put into the losers’ group despite being at the head of Class B,” Ryuuen said. “There has to be a reason.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm. So it wasn’t random? They deliberately chose how to split us up? I noticed that \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyour\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e group is full of exceptionally gifted people, Ryuuen, but I suppose the other groups were all made for a reason as well. Thank you for the helpful advice. But should you really give me so much information?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe responded as promptly as expected. I noticed Ryuuen’s face change, though. Normally, when confronted with surprising new information, a person expresses shock, confusion, or perhaps even doubt. However, Ichinose looked completely calm, and thanked Ryuuen for the advice. Not a normal response.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, she might have been purposefully hiding something. Considering how bright and lively Ichinose normally was, you might think she was incapable of deception. I didn’t know how intuitive Ryuuen might be, but he likely recognized that something was going on. It was a brief conversation, but both parties seemed to gain quite a bit of information.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn any case, what Ichinose did or didn’t know about the school’s plans wasn’t really important. What \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewas\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e important was that she was staying quiet about it. Ichinose and Ryuuen were trying to get a read on each other.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even so…” Ryuuen, looking exasperated, turned to me. “You know, I love chasing skirts, but you’re on another level. First Suzune, now Ichinose. You’re always sniffing around some chick, aren’t you?” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t exactly deny what he was saying. Besides, Ryuuen probably wasn’t all that interested in me, since he didn’t say anything more.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, you’ve come at a good time, Ichinose. I have an interesting proposal for you,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A proposal? I suppose I’ll hear you out. What is it?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s completely stupid. Listening to him would just be a waste of time.” Horikita must have already heard this proposal, because she was quick to urge Ichinose to reject it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A proposal to crush Class A. I don’t think that’s such a bad plan. Suzune and Kanzaki seem to disagree, though,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I told Suzune this earlier, but I already know all of the identities of the VIPs from Class C.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere it was. Just as Katsuragi had his own strategy, Ryuuen had come up with a very Ryuuen-like plan. And it seemed like things were evolving beyond where they’d been this morning.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Three classes will share information about all the VIPs. That way, we’ll bypass the school’s rules,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, he wanted the three of us to join forces.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It sounds like a pretty bold idea, but I don’t think it’s realistic. How do we know for sure that you have all the Class C VIPs, Ryuuen-kun?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s natural that you wouldn’t trust me. In that case, why don’t we make a contract? We’ll pledge to share the identities of our three VIPs and go after Class A. That way, our three classes will benefit, but Class A won’t.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Class A’s refusal to engage with us was difficult, this proposal only increased potential school-wide enmity.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A contract is meaningless, since we won’t know who might betray whom. If Class C betrays us, it’ll all be over,” replied Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer flat rejection was completely expected. It seemed that Ryuuen had already been allied with Class A for a while. Also, during the test on the island, Ryuuen had been quick to betray others. That alone was all the proof we needed as to how devious he was. His strategy wasn’t necessarily a bad one, but Ryuuen himself was the issue. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your thinking is solid, Horikita-san. If we don’t have a guarantee that Ryuuen-kun is telling the truth, then this is meaningless,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no point in playing a part anymore, is there? It’s not like you don’t have a handle on all of Class B’s goings-on,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe two were all smiles, but the mood changed. It grew tense, and it felt like we were all on tenterhooks.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re giving me far too much credit. People don’t have that much trust in me. Besides, your proposal is high risk, low return. I can’t agree to it,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Being secretive is prudent, but sometimes you need to act.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe from your perspective. You’re casting a wide net right now, and gathering information. Haven’t you ever dreamed of rising up to Class B?” asked Kanzaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita-san rejected your proposal. Therefore, this plan is off to a bad start,” added Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, there’s no denying that. Even if Suzune wanted to agree, there’s a reason why she can’t,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean by that?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You already know what I’m getting at, don’t you? For this strategy to work, you need to understand your own class perfectly. For Class D, which lacks any spirit of teamwork, this is an impossible undertaking. Right? It’s also impossible for Class A, since they’re split into two factions.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe atmosphere in the room changed again. This time, the air felt heavy, like before a storm. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But I can make this strategy work, since I rule my class. And it’s smart for Ichinose, since she’s incredibly popular within her class. I originally pitched the idea of a three-class alliance, but it’s also possible with just two classes. The chances of a perfect outcome might be lowered, but since it’s me we’re talking about, I can see it through. If we pull this off, Classes A and D will be stripped bare and left with nothing,” Ryuuen said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was willing to leave both Class A and D in the dust.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You really overestimate me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe fact that Ryuuen had openly shared his idea and asked Class B to double-cross us right in front of Horikita, myself, and Kushida was very unsettling. Even if his proposal wasn’t perfect, Ryuuen was actively working to discover each class’ VIPs, and he could get there without too much trouble.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf so, then this was a crucial point for Class D.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I might be overstepping here, but I doubt you’ll be able to pull this off,” Horikita said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI thought it’d be smart to sit and observe silently, but apparently Horikita thought otherwise. Even if Ichinose decided to ally with Class D, we had no idea how much we could trust her. The possibility of Ichinose and Ryuuen teaming up was extremely dangerous.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So do you understand the situation now, tagalong?” Ryuuen mocked me, but I didn’t fall for his cheap tricks. Instead, I offered my honest opinion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Suppose Classes B and C \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e become allies. Wouldn’t that mean that Classes A and D would become allies as well? I admit that Class D is fractured, but if faced with certain defeat, I think we’d come together. I believe Class A would do the same.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ichinose and I haven’t entered into an alliance yet, so you have no way of knowing. Are you sure Katsuragi will cooperate with you?” asked Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi was most definitely cautious. He probably wouldn’t make any moves without evidence. However, since he’d also suffered losses on Ryuuen’s account, there’d be some room for negotiation. After listening to me, Horikita had also realized that we couldn’t afford to let Class B and Class C’s alliance form.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no point continuing this discussion any further. In the end, both parties would just crush each other,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean, Suzune?” asked Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean exactly what Ayanokouji said earlier. If you insist on continuing to act as if this were a strategy meeting, we’ll just have to assume that this is your intent and respond accordingly.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As you wish. I’m looking forward to seeing whether you or not you can get your class to come together,” replied Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite his open hostility, Ryuuen shamelessly extended his hand to ask us to work together. Horikita, meanwhile, was exhibiting her determination to fight to the bitter end. This would also be a determent to Ichinose. If she betrayed Class D right here, right now, she would probably be branded a traitor by all the classes. She’d be seen as someone who’d betray her allies whenever convenient, for the sake of a few points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Ichinose got saddled with that kind of reputation, it would weigh her down for a long time, probably for the rest of her high school days.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry, Ryuuen-kun. But you’ve hurt people in Class
