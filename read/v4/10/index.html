B with your actions. Even if it’s possible for us to get more points, I can’t ally with you on that reason alone,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s unfortunate,” answered Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe didn’t look the least bit disappointed, but rather like he’d guessed that his plan wouldn’t fly from the get-go. Ryuuen got up and left the room, passing us by. As he left, Ryuuen glanced at me one more time. Our eyes happened to meet.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It can’t be,” he muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, I didn’t respond. Ryuuen lightly shook his head.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, I should be going. My friends are calling me,” said Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe quickly retreated from the room. In the end, I was left with my usual partners in crime.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whew. I guess he saw through me,” said Ichinose. Even though Ichinose didn’t look particularly flustered, she sighed deeply.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This will be tough. He’s gunning for us,” Horikita said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ryuuen might think himself a dragon, but he’s really a snake. He’s so tenacious that when he finds his prey, he’ll go to any lengths to bring it down. But don’t you have it worse than me right now, Horikita-san? Ryuuen-kun is naturally wary of Class A, after all. He probably thinks that Class B will one day be his enemy, too. But right now, he’s got you in his sights,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, that was true. Class D had been stuck at the bottom, but the island test had allowed us to climb up a bit. Because of that, Class D might evolve into real competition. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry. Horikita isn’t the type to crack under pressure. Isn’t that right?” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Naturally,” Horikita replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, she appeared that way from the outside. But even if she were just putting on a brave face, it was possible she’d reveal her true, hidden self. I just didn’t know when she would. Maybe today, or maybe in ten years’ time. Most people fall short of becoming the people they were meant to be.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita-san, Ayanokouji-kun. I wanted to ask you something. Do you think this test will create trust between people of different classes?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No one’s looking to make enemies, but bringing people together like that will always be difficult. Even if two classes could become friendlier, it won’t be enough. We’d need unwavering cooperation between everyone in Classes D and B, and I don’t know how we’ll make such an alliance,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. Just like I’d expect of you, Horikita-san. You understand this test very well. Ryuuen-kun’s just full of hot air. I was right to choose your side.” Ichinose seemed happy to be standing with Horikita. “Yes. Ryuuen-kun’s plan will fail. It’s probably best not to worry about it. The real problem is Katsuragi-kun’s iron fortress strategy. What do you think about it now that you’ve spoken to him?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I said this yesterday, but Katsuragi is completely unapproachable. He’ll talk to you, but he won’t give an inch. I doubt he’ll change his mind before the exam ends. At this point, I think all of Class A is taking the same stance. Don’t you?” asked Kanzaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. I think it’s hopeless, too. We have no choice but to find a different way,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe had three discussion periods left. After that, each individual group would have to submit their answers. Did we work in favor of our class, or our group? Or should we take action for our own sake?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’m going to head back to my room,” Horikita said flatly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince everyone else from the Dragon group had left, Horikita walked away without another word. As she made her way out, she met up with Hamaguchi, who appeared to be waiting for her. Ichinose watched Horikita’s back as she left, then turned toward me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Would you walk with me for a little bit?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure. I don’t mind.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI strolled out with Ichinose and two other students from Class B. It felt a little crowded. After we split from Kanzaki and reached the ship’s deck, we slipped into a large crowd of students. Everyone looked as though they’d shaken off the test and were in the mood to have fun.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand what Horikita-san said earlier, but I think there’s still room for cooperation,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Cooperation?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. I was surprised when Class A distanced themselves, but I think we have a chance. But to pull it off, we might have to reveal everything.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Everything?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This entire test boils down to finding the VIP. That’s the point, right? So if we play things by the book, we increase our chances by narrowing down the list and finding out who \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eisn’t\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the target. So, I’ll tell you right now: I’m not the VIP. But I intend to find them and lead my group to victory.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose said that with confidence as she looked me square in the eye. She continued.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You might think that if I’m the target, I could just be hiding my identity. But Ayanokouji-kun, the reason I’m not is simple. Everything I do is for the sake of Class B,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer words held a mystery that was hard to explain. Considering Ichinose’s behavior until now, there was only a fraction of doubt left in my mind. If she wanted my full cooperation, then she needed to take things a step further. If she showed me her phone voluntarily, right now, she would gain all of my trust. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, she didn’t display any signs of doing that. She didn’t even try to take her phone out. Should I accept her statements as the simple, thoughtless pledge of an ordinary girl? Or did I detect a layer of intrigue? I couldn’t tell, and that was why I felt what she said was mysterious. It was probably safer to just accept what she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It must sound strange,” said Ichinose, seemingly a little dissatisfied with my silence.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, no. Sorry. I don’t think it’s strange at all, really. I\u0026#160;was just a little surprised that you came straight out, that’s all. You said that if you were the VIP, you’d choose to lead your class to victory,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not lying. I think that lying might be necessary in competition, but I like to be honest as much as possible. I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edo\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e want my class to win, fair and square. I thought the road to victory lay in narrowing down who the VIP is. Ah, you don’t have to tell me anything if you don’t want to, Ayanokouji-kun. I just wanted to explain my feelings. I thought if I told you, things might be easier.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if perfect cooperation is impossible, trying to form solid relationships is no bad thing. If I don’t answer now, it might hurt our relationship down the line.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, no, I don’t think so.” She sounded flustered, but this wasn’t the time to hide.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat Ichinose was saying was true. Even if she fooled me and lured me into a trap, her reward would be rather small. Breaking the truce with Horikita and\u0026#160;exploiting Class D would be nonsensical. Sure, I couldn’t be\u0026#160;100% certain she wouldn’t betray us, but I couldn’t be 100%\u0026#160;certain I wouldn’t be killed by a meteor, either. No one should spend their time worrying about all the things that could possibly happen. I decided to be honest with her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not the VIP. Neither is Yukimura, I can say that with absolutely certainty. Unfortunately, I don’t really know about Karuizawa or the Professor…err, I mean, Sotomura. It’s not clear yet. Personally, I agree with you on principle.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d heard from Yukimura that Karuizawa and the Professor weren’t VIPs, but I thought it’d be best to leave that part unsaid. If I was careless and one of them turned out to be the VIP, I’d only lose Ichinose’s trust. I’d determined that Yukimura wasn’t the VIP through his actions and attitude. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“S-sorry. It seems like I forced your answer,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose lowered her head, as if burdened by feelings of guilt. She didn’t need to apologize, though. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI’m the one who will need to apologize to you someday,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I thought. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Hamaguchi-kun. Got a minute?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What is it, Ichinose-san?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHamaguchi approached us, looking relaxed. Ichinose filled him in on the current situation. Surprisingly, she concealed her cooperative relationship with Class D. Considering Ichinose’s character, I would have guessed she’d get her class’ approval.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If Ayanokouji’s confirmed it, there’s no reason for me to refuse. I’m not the VIP,” said Hamaguchi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I considered his relationship with Ichinose, I believed him. There’d be little merit in lying. That just risked fracturing the truce with Horikita. However, if we wanted to adopt a strategy without the risk of being exposed, we could do better than this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You haven’t checked with your own class yet,” I observed. Ichinose should have been able to get everyone in her class on board without having to resort to scare tactics like Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I prefer to let my classmates act autonomously. There are people in my class who want points. It’s not like I can arbitrarily transfer the VIP’s rights to myself,” said Ichinose. “This might sound impertinent, but I’ll check with the remaining person myself. If that person answers me honestly, I’ll tell you later, Ayanokouji-kun,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s nice of you, but it’s not like I’ve told you everything about Class D. We still haven’t really established an open and honest relationship yet, and there’s no guarantee I’ve told you the iron-clad truth.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, don’t worry. As long as I just have your cooperation, Ayanokouji-kun, I’m happy,” answered Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, real cooperation in the Rabbit group began. I was sure that neither Ichinose, Hamaguchi, nor I were the VIP. After considering his behavior and attitude, we were convinced that Yukimura wasn’t the VIP, either. Excluding us four, that meant there were ten suspects remaining. One of them was the VIP.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt’d be just as hard as finding the leader on the deserted island, or perhaps an even more difficult task. The VIP would certainly feel the pressure, so he or she would naturally try concealing themselves. Though the test had seemed unreasonable at first, the school found a way to make it balanced.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How do you plan on finding the VIP? Even if we try asking people directly, I can’t imagine that they’ll openly admit to anything. It’ll probably be difficult to persuade them with words alone,” said Hamaguchi. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, isn’t the point of this test for us to figure it out?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was right. This was an exceptionally difficult exam. You needed to extract information from someone who wanted to conceal the truth. With Ichinose making her move, the once-hopeless situation was starting to change.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e4.2\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eU\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003enless you were psychic, finding the VIP wasn’t going to be easy. People are born liars. If a person ever claims to live their life without telling a lie, their life itself is probably a lie. Lies are inescapable parts of us. A kind lie is no exception; it’s still a lie.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSomewhere in this group of students was the VIP. We still had time until the discussion period began. Like last time, I was the first to arrive. I’d come early to observe everyone’s behavior. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA group of Class C girls were the first people to enter. They were chatting loudly, looking like they were enjoying their conversation quite a bit. However, when they saw me, they instantly lowered their voices and sounded disgusted. They made sure to sit a good distance away from me. Next in was Yukimura, who was grinning. We\u0026#160;briefly exchanged glances, and then he sat near me. He didn’t seem particularly different from his usual self.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNext came the Class A group, Machida and Takemoto. Morishige came in by himself. Since they’d decided not to discuss anything, they once again sat at the far end of the room, close to the Class C girls.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Machida-kun. After we’re done here, do you want to hang out with us? The three of us were looking to have some fun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see,” replied Machida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though Machida wouldn’t participate, all the girls noticed him. Apart from Ichinose and Ibuki, they seemed interested in Machida. I wasn’t especially jealous or anything… Okay, I might’ve been a little jealous. The girls were probably inviting Machida to hang out because they’d given up on finding the VIP. Or maybe that was part of their plan. Was this how men and women formed relationships? Machida didn’t seem perturbed by this. In fact, he looked pleased.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNext came the other Class D students: the Professor and Karuizawa. Rather than coming here together, it looked like they’d arrived at the same time by sheer coincidence. Karuizawa appeared openly disgusted by the Professor’s presence. After they entered, she quickly moved toward the back of the room.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, aren’t you sitting in my seat?” asked Karuizawa. Despite being late, she glared at the Class C girls. After seeing them being so friendly with Machida, she seemed even more frustrated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have no idea what you’re talking about. What do you mean, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyour\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e seat? Just sit anywhere. Any spot should be fine.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s the seat I want. That’s my spot. Move,” urged Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? I’m talking to Machida-kun right now. He promised to hang out with me tonight,” said Manabe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Machida-kun. Could you please tell her that you want me next to you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMachida looked a little troubled by the situation, hesitating over which girl he should pick. However, Karuizawa quickly inserted herself between Manabe and Machida, and grabbed his hand.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How about we spend some time together, just the two of us? Or have you promised that girl you’ll go with her? I hate two-timers. If you’re going to mess around with that girl then that’ll be the end of it, I guess,” said Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhoa. I was amazed she could say that with a straight face, given that she was already dating Hirata. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe “just the two of us” part really seemed to strike a chord with Machida. It appeared he’d made his decision.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Excuse me, but would you please move? That’s the seat Karuizawa’s been sitting in,” said Machida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? What the hell? Ugh, this is bull,” Manabe whined.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe girls, looking upset, promptly got up and left. Karuizawa moved into the empty seat. Actually, she scooted so close that she was practically glued to Machida. Seriously, they were right next to each other, their bodies pressed together. Karuizawa’s actions didn’t seem petty or frivolous to me, but that was probably because I already knew what kind of person she was.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa was dating Hirata. Whether or not Machida knew that, it looked like he’d started to fall for her. Appearance-wise, she was most definitely cute. Also, from the perspective of someone with a crush, it made sense that he’d want to protect her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe interesting thing was that, despite how recently our group had formed, we’d already developed our own unique hierarchy, including power dynamics. The loners were loners, and the popular kids were popular. The organizers were organizers. However, not everything was business as usual. For example, if there were two organizers in the same place, one would take charge, and the other would be dropped. It was like a microcosm of the jungle, survival of the fittest. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe person who lost that battle was demoted in terms of social status. In some cases, he or she might drop all the way to the lowest rung on the ladder. They’d be so low that their presence wouldn’t matter to those around them. You could say I was such a person.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe interesting thing about this exam was that it made people who would normally be wary of one another come together and join hands. Ichinose might have been incredibly popular among her friends in her class, but among people who were obviously her enemies, she had a low level of influence. Would Hirata have been able to get us a little more organized?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hello, everyone!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSpeak of the devil. Ichinose arrived, bringing life into the depressing room. I found the air in the room especially heavy today, but thought it best not to speak carelessly. Even so, Karuizawa’s actions seemed overbearing and a little baffling. Even if she really wanted to get to know Machida better, she didn’t need to openly antagonize the Class C girls.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, that weird situation didn’t seem all that important to the exam itself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs someone who knew what Karuizawa was like, I could already see how her personality informed her actions. I wondered if Karuizawa always wanted to be at the very top, whether it was in class or this group. Of course, it wasn’t an easy thing for a girl to stand at the top. I mean, if it was an extremely charismatic girl like Ichinose, that was one thing. But if you didn’t naturally excel, it was impossible. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, in our school lives, relationships determined whether someone placed high or low in the caste system. Through her overbearing behavior, Karuizawa had become a leader for the Class D girls. She’d also gained a lot of influence over both guys and girls by becoming Hirata’s girlfriend. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo if you applied what you knew about Karuizawa’s behavior to how she was acting now, the truth was clear. She’d forcibly pushed herself onto the most confident man, Machida, and with him in the palm of her hand, she’d taken control of the room. That was why the Class C students couldn’t go against Machida, and had reluctantly left their seats.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf you didn’t mind being hated, what did you gain by dominating the field? A sense of superiority? Self-satisfaction? The spotlight? I still couldn’t understand the root cause of her behavior.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This isn’t good.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. If things continue like this, the VIP will get away.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYukimura sat next to me and muttered his concerns. I\u0026#160;opted to just roll with it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now then. Will Class A not participate this time, either?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course we won’t. Feel free to talk amongst yourselves, though. We haven’t changed our policy,” answered Machida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBeside him sat Morishige, who had erased all semblance of human emotion from his expression. I had seen him around before this test. According to rumor, Class A was divided into two different factions, one led by Katsuragi and one by Sakayanagi. Morishige was one of those who’d turned against Katsuragi during the test on the island.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnder normal circumstances, he probably wouldn’t have followed Katsuragi’s orders, but Sakayanagi was sick and thus absent from the trip. Without the presence of his leader, Morishige had no choice but to do as he was\u0026#160;told.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d thought that Katsuragi would’ve lost influence, considering the damage he incurred by failing the island test. However, it looked like he wasn’t going to crumble that easily. Since Morishige had remained silent for two days now, it looked as though even he had no choice but to follow orders.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Since it would be a waste to spend an hour in complete silence, how about we play cards again?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose took out her cards immediately. How you approached your goal was a major aspect of this test. She wanted to narrow down the list of suspects through open, honest conversation. On the other hand, Katsuragi aimed for stability by suppressing all conversation. Then there was Ryuuen, who wanted to turn everyone into his enemy while taking complete control of his class. He said that he’d found the secret logic underlying the test. However, I wasn’t sure.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the end, we became absorbed in playing cards for the hour, and then disbanded. Yukimura frantically searched the area for something, but unfortunately it didn’t seem like he’d gotten any clues as to the VIP’s identity. I’m sure it was the same for all the other students. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if we did talk, it wasn’t as though the VIP was just going to step forward. I watched the order in which all the students left. The Class C students were usually the first out the door, but they hadn’t moved. Meanwhile, the Class A students, typically the last to leave, were the first out the door. Well, not everyone in Class A had left yet. Machida and Karuizawa were exchanging contact information. Yukimura and the Professor got up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think it’s time to head back. You coming, Ayanokouji?” Yukimura asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile we spoke, Karuizawa answered her phone and stood. She exited the room, chatting away on the phone, seemingly talking about something funny or interesting. As she walked away, the three Class C girls brushed past me and made their way out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey. Did you get a weird vibe from those three just now?” asked Yukimura. He turned to me with a slightly puzzled look.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You think so? I can’t say that I noticed anything of the sort,” answered the Professor.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe Professor’s tone was ridiculously pompous. However, I thought Yukimura’s feelings were right on the money. The Class C girls had looked considerably angry. Yukimura and I peered into the hallway to see what was going on. We saw the three girls closely following Karuizawa. Being alone, she was at a disadvantage. The\u0026#160;situation had me worried. Also, Ibuki, who might’ve mitigated the other three, wasn’t around.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You think they have a bone to pick with her?” asked Yukimura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s follow them. I don’t think there’ll be violence, but it could lead to an uproar.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Damn Karuizawa. She’s always making people hate her. I wanted us to spend our precious time finding the VIP,” Yukimura grumbled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile the Professor headed back to his room, Yukimura and I quietly chased the four girls. When we turned the corner, I heard the \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eka-chack\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e sound of an emergency exit door slamming shut. The elevators weren’t even crowded, so it wasn’t like there was any reason to use the stairs. There had to be another reason why they’d gone in there. I opened the door and heard voices.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey. why’d you bring me to a place like this?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Stop playing dumb! You \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e push Rika, didn’t you? Start talking.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-huh? I already told you, you’ve got the wrong person!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe three girls surrounded Karuizawa, forcing her up against the wall. They were preventing her from escaping. However, even surrounded, Karuizawa offered no apologies. She continued to deny what they were saying. Maybe she really was innocent.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Look, I have plans later. Can you please move?” asked Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, let’s confirm it right now. I’m going to call Rika. If it wasn’t you, we’ll forgive you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have no idea what you’re talking about. I’ll call the teacher.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And what will you tell the teacher, exactly? It’s not like we’re being violent with you or anything. Besides, if you talk to the teacher, we’ll tell on you, too. We’ll say you pushed Rika. You’ll also get in trouble.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNeither side intended to back down. Karuizawa tried to escape, but the girls grabbed her arm and pushed her up against the wall. One of the girls took out her phone, probably to call Rika.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-wait!” Karuizawa pleaded with them to not call.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What? Why should we wait?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just remembered something. I bumped into that girl before.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re a total liar. You remembered her from the very beginning, didn’t you? Well, whatever. So, are you going to apologize to Rika properly?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No way. She was in the wrong. She’s a complete airhead.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI would’ve thought Karuizawa would take responsibility for her actions, but instead, she refused. She refused despite knowing it would upset them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re seriously pissing us off. We might’ve forgiven you if you’d actually apologized to Rika. But now, we definitely won’t forgive you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe girl pressed down against Karuizawa’s shoulder.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whatever. You probably never planned on forgiving me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter Karuizawa spat out those words, one of the girls, Yamashita, lost her patience. “Shiho-chan. I’ve had enough. Karuizawa’s unforgivable.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know, right? She should understand exactly how Rika felt. Why don’t we bully her for real?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe struck Karuizawa’s shoulder with a little extra force. Yukimura started to throw the door open, but I grabbed his arm. Even if we stepped in now, Karuizawa would be threatened again at some point. However, if they got even a little violent while we were watching them, it’d be a deterrent for later. Also, depending on how violent they got, we could possibly threaten them, telling them we’d report them to the school. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMore importantly, Karuizawa Kei looked like she was starting to change.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ahh…ahh…” She panted as if she were having a hard time breathing. She held her head in her hands as if she were in pain. When Manabe and the others saw her suffering, they weren’t sympathetic. The opposite, actually. It irritated them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol4_INTERIORILLUSTRATIONS_9\" src=\"/hola-lector-agua/images/books/v4/OEBPS/Images/ClassroomElite-Vol4_INTERIORILLUSTRATIONS_9.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Act as girly as you want, we’re still not going to forgive you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey grabbed Karuizawa’s hair and forcefully yanked her head up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve always hated your face, Karuizawa. I mean, don’t you girls think she’s just butt-ugly?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, for sure. Don’t you just want to cut her face?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“St-stop. Stop it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“‘St-stop it’, she says. What happened to your big attitude?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe more you envied your enemy, the more you hated them, to the point where you wanted to strip away their advantages. If we were talking looks, then Karuizawa had them all beat. But Manabe, Yamashita, and Yabu wouldn’t be satisfied until they’d verbally torn Karuizawa’s pretty face apart. Karuizawa trembled, frightened. She was on the verge of tears, still unable to move. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePeople show their true colors when they’re in jeopardy. A little more pressure, and I’d know who Karuizawa Kei really was. However, Yukimura couldn’t stand by any longer. He threw open the door. The three girls were naturally shocked by his sudden appearance. Karuizawa, on the other hand, looked like he’d saved her life.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you doing?!” Yukimura shouted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What? Nothing. Right? We were just talking to Karuizawa-san. Yeah?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eManabe glared at Karuizawa, as if telling her not to say another word. But Karuizawa wasn’t the sort to shy away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yukimura-kun, these girls just abducted me and started getting all violent. They’re seriously the worst, aren’t they? They were being, like, super annoying, so I told them to get lost,” said Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe’d normally never talk to Yukimura, but she was probably grateful to him now. Meanwhile, the Class C girls glared at Yukimura. Their eyes seemed to say, “This has nothing to do with you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’m just talking with Karuizawa about her problem, what she did to Rika. You heard how Karuizawa slammed into her, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t you think it’s better to just let things go? They bumped into each other. It’s not like Karuizawa was at fault,” Yukimura said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You shut up. This has nothing to do with you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnder the weight of their glares, he fell silent. Karuizawa shot a look at Yukimura, like she thought he was pathetic. She quietly took out her phone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just leave me alone. If you don’t, I’ll call someone.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who are you going to call? Hirata-kun? Machida-kun? I mean, I guess a slut like you has a hundred guys on speed dial, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFights between girls often got dirty, and unlike with men, violence wasn’t really an option. This was painful to watch.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A teacher was just here. I think it’d be better if you left,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had no other choice but to step in and break this up. Class C probably didn’t want to cause a scene.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You better bow your head and apologize to Rika.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe Class C girls kept intimidating Karuizawa, who desperately tried to keep a brave face. But it was obvious that she’d lost her confidence. The other girls seemed to know that. They continued their hostility.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you okay?” asked Yukimura, who seemed unable to leave Karuizawa to their mercy. She was hyperventilating.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just leave me alone!” As Yukimura drew nearer, Karuizawa slapped his hand away. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, what the hell? I only came to check on you because I was worried!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“God, shut up! Nobody asked you!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa’s breathing grew even more ragged. Yukimura stepped back, overpowered. I decided to let sleeping dogs lie and stepped back, too. Karuizawa glared at me as she opened the emergency stairwell door and slammed it as hard as she could after she left.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Jeez, what’s with her? She’s always, always causing trouble for people!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI understood Yukimura’s feelings of resentment. Karuizawa was certainly a troublemaker. Yukimura, seemingly exhausted from the ordeal, left without saying another word. I stood alone in the emergency stairwell and thought about Karuizawa. The leader of the Class D girls had shown her vulnerable side. However, the threats hadn’t frightened her; she’d been terrified for another reason. \u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e4.3\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003et was the middle of the night on the second day. The pool, which was crowded during the daytime, had once again grown silent. There was no one around. I\u0026#160;took out my phone to make a call. Because the phones already had teachers’ contact information stored in them, getting in touch with Chabashira-sensei was a relatively simple task. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough it was the middle of summer, we were still on the ocean, and the night wind that passed over the ship’s deck was quite chilly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry to keep you waiting, Ayanokouji.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s okay. I’m sorry for calling you so late.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“An instructor is obligated to consult with a student. It’s nothing out of the ordinary. Besides, for better or worse, this is the first time you’ve actually called me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei didn’t exactly treat Class D with love. She wasn’t well-liked by the students. Even if someone was having trouble, they probably wouldn’t have gone to her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s something I wanted to ask you, sensei, but… You know, you look pale.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt first I hadn’t noticed because it was dark, but Chabashira-sensei looked so pale that I thought she might be deathly ill.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry about it. Adult issues. Anyway, what did you want to ask?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eConsidering I could smell the alcohol on her breath, I thought I had the situation well figured out. “You told me that we can use our points to buy anything, but there are still some exceptions to that rule. Right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. Exceptions exist, naturally. For example, if you request to buy the life of a teacher or student, we cannot honor that request.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So I was wondering. What’s the most expensive thing that someone has bought with their points?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRight as I was speaking, I felt the presence of someone else nearby.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yoohoo, Sae-chan! How you feeling?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHoshinomiya-sensei arrived. Was it just a coincidence? Unlikely. She’d probably followed Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re drunk, aren’t you?” Chabashira-sensei said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm? Oh no, of course I’m not, I’m not drunk. I was just acting all sleepy, you know?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Jeez. You can really hold your liquor. You handled yourself today, and you’re fine now, too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, Hoshinomiya-sensei had an iron liver.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good evening, Ayanokouji-kun. How are you doing?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHoshinomiya-sensei was acting a little overly familiar with me. She placed her hand on my shoulders, and then hugged me so tight I could smell the alcohol on her body and breath. Of course, a minor such as myself would have no clue, but was alcohol really that delicious? Just the smell of it made me not want to drink it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m fine. If I wasn’t, I wouldn’t be here,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That answer was so not-cute that I’m impressed! So, Ayanokouji-kun, do you love the \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003etsuntsun\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e older sister types, like Sae-chan?” asked Hoshinomiya-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t wrap yourself around a student. You’re getting in the way of my work.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThankfully, Chabashira-sensei grabbed Hoshinomiya-sensei by the nape of her neck and dragged her off. I recalled the teachers’ conversation I’d overheard the other day. Even the instructors were wary of each other, competing with and deceiving others as they aimed for the top class. I didn’t know if it was because getting to a higher class meant an increase in their salaries, or if there was a longstanding rivalry between Chabashira-sensei and Hoshinomiya-sensei from their school days.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had no doubt that the school and the teachers kept things fair. Leaking answers to students would be a huge problem. That meant it was likely that Ichinose had been placed into the Rabbit group without knowing why. She had keen insight and sharp observation skills, though. Sooner or later, she’d probably think something was off. She’d wonder why she was in the Rabbit group.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt’d be nice to write it all off as sheer coincidence, but Hoshinomiya-sensei was bad at hiding her emotions. Ichinose might soon discover that she’d been put into the group to find out about Ayanokouji Kiyotaka. If that happened, how should I respond? While I thought about that, I began to choose my next actions.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So what were you two talking about in the middle of the night? Isn’t that in itself a really big problem?” asked Hoshinomiya-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A big problem? As a teacher, it’s only natural for me to consult my students and soothe their anxieties,” answered Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If that’s true, wouldn’t it be better for you to do it with more people around? If you look like you’re sneaking around, I can’t help but think it’s suspicious.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though Hoshinomiya-sensei was trying to unsettle her, Chabashira-sensei remained calm and collected. “Ayanokouji requested this location. He wanted to consult me in private,” Chabashira-sensei stated matter-of-factly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm. Well, I suppose you’re not violating any rules,” muttered Hoshinomiya-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good. Now hurry up and leave already. I’ll head back soon myself.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, okay. But remember, no sexy times,” teased Hoshinomiya-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe left, with that very unnecessary comment as her parting shot. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry. She’s troublesome.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“’S all right.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei didn’t say anything about being investigated. Well, maybe it was just a personal problem. I didn’t know what there was between them, but it had nothing to do with me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, picking up where we left off. I was wondering, what’s the largest amount of points someone spent in the past?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei nodded, looking like she was lost in thought. “Well, I can only speak from my own experience, but it was when someone wanted to change the school rules. Of course, you’re limited to a certain realistic scope. For example, you could change the class start time in order to avoid being late to class,” she answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira didn’t provide facts, only hypotheticals.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can you give me examples?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you dissatisfied with my answer?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah, I don’t really mind. I understand how the school’s systems operate,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDepending on how you used your points, you could make changes to the system in even the most trivial of ways. In other words, the possibilities were endless. Private points were of incredible significance.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You could have just emailed me that question. I don’t understand why you wanted me to meet you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I sent you an email, there would be a record. I\u0026#160;wanted to avoid that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI decided to leave it at that. I walked away, in a different direction from the way Hoshinomiya-sensei had exited. While I still had more questions, this was good enough for the time being.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll ask you for a favor in the near future,” I called.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I looked back over my shoulder, I saw Chabashira-sensei eyeing me with suspicion. \u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e4.4\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003et was around two in the morning when my roommate quietly woke up. Taking extreme consideration as to not wake the other three people in the room, Hirata slipped out of bed. Since students were required to sleep in their jerseys, he stole out of the room while still wearing it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter I’d confirmed he wasn’t going to the men’s room, I grabbed my keycard and got out of bed myself. There was no guarantee he’d make a move today, but it seemed like my labors had begun to bear fruit. Once he realized that I was awake, we exchanged glances without speaking a word.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWithout looking away, I told him there was something I needed to talk to him about. He said he’d be waiting in the hall. Then, he stepped out. I found him in the hallway, wearing a troubled look.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did I wake you? Or were you already awake?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The latter. I thought you might be leaving the room tonight,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why would you think that? This was the first time I’ve left the room at night.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTrying to deceive him would have a detrimental effect, so I thought it best to just be honest. “Karuizawa contacted you, didn’t she?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata seemed to understand what I was getting at, just as I’d expect. His comprehension skills were flawless. “Do you happen to know something about it?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’m in her group. I don’t know how much she’s told you, but I get the situation.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata waited for me to continue. Well, considering I’d chased him down in the middle of the night, it had to appear urgent.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You said you wanted to act as a bridge between Horikita and the rest of the class, right? This has to do with that,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. So Horikita-san told you to talk to me, Ayanokouji-kun?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe’d saved me a lot of trouble. Now I didn’t have to bother with a lengthy explanation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She asked me to report on everything that happens in the Rabbit group, including Karuizawa’s situation. Once I heard about what happened with Karuizawa, Horikita told me to keep an eye on you, too, Hirata. She told me to follow you. But you said you wanted to be a bridge for her, so I thought this might be the chance to finally make that happen.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What kind of information does she want?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Everything you know about Karuizawa. Also, whatever it was you talked to her about.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata probably didn’t see why I needed information about Karuizawa. However, he seemed to understand the impact this could potentially have.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know what I can tell you, honestly. I have to consider Karuizawa-san’s feelings.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, Hirata started walking away. I decided to just follow him at a slow, unhurried pace. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though I’d been in bed for about two hours, I\u0026#160;didn’t have bedhead. I didn’t really worry about personal grooming most of the time, but I knew I had to take it into consideration when I was with other people. I didn’t want to make them uncomfortable when they looked at\u0026#160;me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun, I’m sure you won’t say anything unnecessary, but what I’m about to tell you is extremely delicate. Also, Karuizawa-san might refuse to talk and head back to her room. Please understand that first,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could always eavesdrop on them, but Hirata probably wouldn’t like that. Since this was something Karuizawa didn’t want others to hear, she’d called for him in the middle of the night. He’d never approve of me listening in from the shadows. My best bet was to just give him a straight, honest answer.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe meeting place was in front of the vending machine near the second-level lounge area. Being in the center of the hallway, it was easy for people to see us, but its placement also meant that we could see them. Its location made eavesdropping difficult.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa was already waiting for Hirata, clad in her jersey and sitting on the sofa. When Karuizawa saw Hirata coming, she instantly smiled, but when she noticed me trailing slightly behind, her joy was replaced with anger. She stood and shouted at me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’re you doing here, Ayanokouji-kun?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I asked him to come,” said Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You did, Hirata-kun? Why? I told you I wanted to talk alone.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know. But Karuizawa-san, I was worried about what you told me earlier. That’s why I thought it might be a good idea to bring Ayanokouji-kun, since he seems to understand the situation. I’m sorry for not telling you first.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa looked upset, but it didn’t seem like she’d snap at Hirata. “But…I said I wanted to talk alone, just the two of us,” she repeated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you want, we can be alone. But when we spoke earlier, you never said anything about it having to be just the two of us.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI already assumed this was related to the trouble she’d had with the Class C girls, but I wondered how Karuizawa would approach the topic. If she just wanted to vent her anger, there’d be no reason for it to be just the two of them. Karuizawa had wanted to talk about something without any third parties present. That meant she wouldn’t talk about it if I were here.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps because he was impatient, or perhaps because he thought silence was pointless, Hirata started talking about their earlier phone call.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You were telling me about a fight with Manabe-san from Class C. Is it true?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa opened her mouth slightly to answer, but said nothing, perhaps because she was still wary of my presence. Hirata once again broke the silence. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun, did you know about the fight with Manabe-san and the others?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sort of.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince this wasn’t working, Hirata attempted to shift the conversation. It looked like he intended to ask me questions. Karuizawa seemed dissatisfied, but she continued to listen. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“From what Karuizawa-san has told me, it seems like the girls were making false accusations. They took her to a deserted spot and started hounding her for answers. They were on the verge of using violence,” Hirata said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. That’s all true. I saw it myself. Yukimura saw it,\u0026#160;too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata looked momentarily lost in thought and closed his eyes. I wondered what he’d do. Would he call Manabe and her friends out and reprimand them? Or would he report them to the school?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If Manabe-san and her friends got violent with you, we definitely need to take action. I absolutely cannot allow violence,” he continued.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen Karuizawa heard Hirata’s just words, she momentarily broke into a smile. But when she saw me looking at her, her expression changed back to anger.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Karuizawa-san, they were so cruel that you were completely overwhelmed, and couldn’t stand it. Right?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa tried to answer, but seemingly couldn’t. She just glared at me without saying anything more. I couldn’t lie, so I just told Hirata what I’d seen. Apparently, Karuizawa and some girl named Rika had some trouble in the past. Manabe and her friends wanted to make Karuizawa apologize. But then they’d almost gotten violent with Karuizawa. Hirata, after hearing the whole story, nodded as if I’d filled in some gaps.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. So that’s why you told me,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Told you what?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Karuizawa-san asked me to take revenge on Manabe-san and her friends.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI hadn’t expected such unsettling words. Then again, from the perspective of someone who’d been physically threatened, it must’ve looked like a kill-or-be-killed situation. After Hirata spoke, Karuizawa finally broke her silence.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why did you tell him?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because this isn’t like you, Karuizawa-san. You aren’t a violent person,” Hirata answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But your girlfriend’s suffering, right? You should want to help me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I do. But I don’t believe in an eye for an eye. You know that, don’t you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTheir core differences were starting to clash. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s think this through. If possible, let’s find a way to get along with Manabe-san and her friends,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s impossible, isn’t it? I mean, they absolutely hate me for practically no reason. Please, you have to understand!” she begged.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No reason? Didn’t this start because you had an issue with Morofuji-san, Karuizawa?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata said Morofuji, but he probably meant Rika. That must’ve been her last name. It was amazing how much information he had.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But that’s… I didn’t have any choice! Shinohara and the others were there, and—” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So because Shinohara was there, you had no choice? What does that mean?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You shut your mouth!” she screamed. Her voice carried all the way down the hallway.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please, I’m begging you. Help me. Hirata-kun. You said you’d protect me, didn’t you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course I’ll protect you. But I can’t just hurt Manabe-san and her friends for no real reason. Let’s try to find a way to resolve things peacefully, through discussion.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan s
