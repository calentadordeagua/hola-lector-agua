tyle=\" font-size: 1.00em;\"\u003e“I’m telling you, it’s not possible! If I could do that, I\u0026#160;wouldn’t need your help!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat she said might have sounded absurd, but I understood how she felt. Karuizawa’s position was more dangerous than I expected. Things might very well end violently. For example, students here weren’t allowed to smoke, much like many other schools around the world. But there were many students worldwide who smoked and got away with it. Not everything could be bound by law or governed by rules, and bullying was one of those\u0026#160;things.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata did seem to be worried about Karuizawa, but he was also worried about Manabe and her friends. Hirata wanted to think of a way to resolve things peacefully for all parties. He wasn’t treating Karuizawa like his treasured girlfriend, but as another friend. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It doesn’t matter what the reason is. I can’t do what you want. You’re one of my classmates, Karuizawa-san. If you’re in trouble, I’ll help you, protect you. But I can’t hurt someone else to do that, even if they’re from Class C,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You liar! You said you’d protect me!” she shouted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“‘Liar’? You’ve known this was my stance since the beginning.” He stood up. The next words out of his mouth would’ve taken all the Class D students by surprise. “I’ve told you from the start that we aren’t really boyfriend and girlfriend. I don’t mind pretending to go out with you, but I definitely won’t fight a war for you.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, their relationship was a huge lie.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?! Wh-why are you saying all of this now?!” Karuizawa was horrified by what she’d just heard. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI understood Hirata’s intentions. He was using Karuizawa to extract information as a tribute to Horikita. That was what it looked like, anyway.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because we need a new option now. I want to help you,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe wasn’t abandoning Karuizawa at all. He was seriously trying to help her, in his own way. He approached Karuizawa, who now looked really upset, but didn’t even try to touch her slender, delicate shoulder. I would’ve expected him to do that much.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So are you saying…it’s better for me to get violent with them?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not what I’m saying. I’ll do what I can to help you. When morning comes, I intend to speak with Manabe-san and her friends. I’ll tell them to stop harassing you, Karuizawa-san. You probably won’t like this, but I’ll tell them that you’ll apologize.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t want to!” Karuizawa had come to Hirata in order to take revenge on Manabe and her friends, and that spoke to her true personality—her real self. More than anything else, Karuizawa was afraid.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If that’s the case, then I can’t help you. I’m sorry.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata was calm. Even now, he was composed. But he was also extremely reliable, and for someone like Karuizawa who needed that reliability, losing it was basically a death sentence. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun, do you have any ideas?” asked Hirata. It seemed like he was trying to make me take a more active role in this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whatever! If you’re not going to listen to me, then I don’t need you!” Karuizawa threw the can of juice she was holding down the hall. The contents spilled all over the place, and the sound echoed down the hall.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Our relationship is over. It’s over!” she shouted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, Karuizawa abandoned us and fled. Hirata seemed annoyed not because the truth of their sham relationship had been revealed, but because he couldn’t help her. He showed no signs of running after her. She wasn’t his priority.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun. I have my limits. I can’t do everything. Please understand that,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d planned to use Hirata to extract information about Karuizawa. However, it appeared that Hirata had used me instead, and used this opportunity to task me with saving Karuizawa from her troubles.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You said that you wanted to be a bridge to connect people, but that’s a lie, isn’t it? You’re everyone’s ally.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. I’m Karuizawa-san’s ally, and I’m your ally as well, Ayanokouji-kun. However, my priorities might change depending on the situation. You’re far more capable than everyone thinks,” Hirata observed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You think way too highly of me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really? I’m good at reading other people. That’s why I understand.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wanted to ask more about this supposed skill but decided that we should resolve this problem first. “Your relationship with Karuizawa sounds like it was all for show. Is that really true?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When you put it that way, it sounds like you already suspected as much.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You and Karuizawa have been dating for almost four months, but your relationship with her hadn’t progressed much. Of course, I considered the possibility that you were maintaining a pure and platonic kind of relationship, but even then, you’ve always kept yourself distant from her. You still call each other by your last names.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if they hadn’t gotten closer physically, they should’ve grown nearer emotionally. But Hirata and Karuizawa’s relationship had showed absolutely no signs of change, for better or for worse. In a romantic relationship, such stagnation was exceptionally odd.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re exactly right. We weren’t really dating. We were going out because we both felt that it was necessary. I suppose you consider that contradictory,” he answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, theirs had been a mutually beneficial relationship. In that case, which one of them had proposed the idea, and which had agreed to it? Well, I suppose that was obvious. Karuizawa had asked Hirata to pretend to go out with her, and Hirata had simply honored her request. With that in mind, her actions made more and more sense.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The rumors started roughly three weeks after school began. From that point onward, Karuizawa’s popularity soared by leaps and bounds,” I observed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA similar phenomenon had occurred in Rabbit Group. By attaching herself to Machida, Karuizawa could assert herself more aggressively than normal, and her level of influence had increased. To Karuizawa, Hirata was basically a host, and she was his parasite. He’d been a tool to enhance her social standing.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You played the part of Karuizawa’s boyfriend so that her social standing would improve.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d arrived at the truth. In response, Hirata simply smiled. I’d thought that was the entire truth, but then I realized that it didn’t explain everything. Besides, Hirata hadn’t admitted that I was right. Karuizawa had used Hirata and Machida to place herself at the top of the school’s caste system? No, that alone wasn’t enough.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter all, why would Hirata have accepted her request so easily? That was a tall order for him. Karuizawa’s aggressive attitude was getting more and more out of hand every day. She was behaving more like a bully. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhy would Hirata approve of this and not criticize her at all? Besides, did Karuizawa really just want to use Hirata and the others to get to the top? I was doubtful. I couldn’t say she’d used Machida \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ejust\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to increase her influence. If anything, she showed no interest in the group. More often than not, she just sat in silence. Maybe she hadn’t planned to use Machida at first.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn that case, what had triggered her to establish contact with Machida? I felt like I was starting to discover Karuizawa Kei’s true self.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s to protect herself?” I asked. That was the only remaining answer. There was no mistaking it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you understand. Honestly, when I heard you say it, I got goosebumps,” Hirata said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I heard about it from Horikita; that’s all. She said Karuizawa had her reasons for clinging to you and to others.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut Hirata wasn’t simple enough to fall for my deception. “Ayanokouji-kun. I have to be very honest, but… Well, this is going to sound very rude, but I honestly find you a little weird. You kind of creep me out. I’m sorry if that offends you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Creep you out? Why do you think that?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve been watching you since school started. The Ayanokouji-kun back then and the Ayanokouji-kun now are like two different people. Your presence, the words you use… It’s like you have two different personalities.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata was frighteningly observant. It was only natural that he would think something was off.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve already told you, it’s all because of Horikita’s advice. I already gave her a detailed report about my group. I’m only following her orders. It’s just like back on the island. Horikita made the right calls and led Class D to victory. She’s why we got so many points. I mean, that’s good for me, too. She’s just so awful at communicating with others that she’s afraid to try, you know? She told me to talk to you and report back.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI spent a lot of time with Horikita. Because of that, Hirata probably wouldn’t doubt my words.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well. I suppose Horikita-san must’ve determined that saving Karuizawa-san will give our class a lead,” he reasoned.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But I do think you’re amazing, Ayanokouji-kun. You’re different from Ike-kun and Yamauchi-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m worse than them.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if you’re just following Horikita-san’s orders, you’re still the one talking to me right now, Ayanokouji-kun. It isn’t as though Horikita gave you a list of prepared responses. I think that you show clear, well-reasoned logic. That’s not something you can pretend to have.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata was smarter than I’d imagined. Although I had some concerns about his desire to constantly save everyone, he had extraordinary abilities.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve already said as much, but I agreed to act like Karuizawa-san’s boyfriend so she could protect herself. That’s what she wanted. She said she wanted me to save her. It might be a little difficult for you to imagine, but throughout her elementary and junior high years, she was viciously bullied.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that really the truth?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo Karuizawa’s hyperventilation had been triggered by memories of her past. If she had suffered such deep trauma, it explained why she couldn’t shake off the earlier encounter.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course, I only met Karuizawa-san after she started school here. But I understood. People who are bullied give off a unique vibe. That’s why I agreed to go out with her. That way, Karuizawa-san would free herself from her past by using her position as my girlfriend. I don’t think that Karuizawa-san has been showing us her real personality. I think she’s just desperately trying to act tough.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was why she couldn’t control her emotions very well. Many people who’ve been bullied tended to have very meek and timid personalities, like Sakura. On the other hand, people who were confident, aggressive, and selfish—those who acted like Karuizawa—were typically the ones doing the bullying.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo Karuizawa’s personality was a façade. A front. That’s why she needed people like Hirata and Machida. With them, she was able to get that assertive personality.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait a minute. What was in it for you?” I asked. High school is one of the prime romantic times of a student’s life. Hirata was popular with girls. If he pretended to go out with Karuizawa, he couldn’t pursue a relationship with anyone else.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What was in it for me? Karuizawa-san wasn’t being bullied. That’s all I needed.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t hypocrisy or love. He didn’t have any selfish impulses.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know you’re not convinced, but that’s the reason I did it,” he continued.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I believe you. But is there some deeper reason as well?” I asked. Hirata wouldn’t hesitate to save a friend, but he considered Manabe and the others friends, too. His concern for others was downright pathological. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince he’d told me this much, Hirata probably felt like he had to see the story through. He bought a couple of drinks from the vending machine and handed one to me, which I gratefully accepted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Until my second year of junior high I was, for lack of a better word, a nobody. I didn’t stand out at all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You, Hirata? I have a hard time imagining that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I wouldn’t say that I was completely invisible. I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e have friends. I had this one friend ever since I was little, a guy named Sugimura-kun. We were in the same class together for six years, throughout elementary school. We were neighbors, too. We walked to and from school together every day.” Hirata spoke like he was recalling some fleeting memory.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When we started junior high, we were put into separate classes for the first time. At first, we kept going to school together just like we always had. Gradually, we walked together less and less. I started to only hang out with other guys from my new class. That story probably sounds normal enough, I suppose.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewas\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e perfectly normal to make new friends in a new environment. Nothing odd about that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But you see, while I had my new friends, Sugimura-kun was getting bullied.” Hirata squeezed the can he was holding. I understood where this was going. “Sugimura-kun sent me SOSs over and over. He’d show up with cuts on his face, or with bruises. But I cared more about hanging out with my friends, and never took him seriously. Sugimura-kun was always headstrong, quick to get into fights. I didn’t think too deeply about what was happening. But when we entered our second year, we reunited. By then, Sugimura-kun’s spirit had shattered. His bright, cheerful personality was gone. That was only natural after being beaten down so much. He’d been punched and kicked so many times. They hounded him so much that he couldn’t even go the bathroom; he ended up having accidents during class.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So you saw that, and…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. I didn’t do anything. I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecouldn’t\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. I was afraid I’d become their next target. I was afraid that my new, fun life would be destroyed. So I pretended not to see Sugimura-kun, my oldest friend. I came up with convenient excuses for myself. I thought someday the bullies would just stop. Maybe once Sugimura-kun stopped going to school, they’d leave him alone. Or maybe someone else would step in to help him.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what happened to Sugimura?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That day’s burned into my memory, even now. After morning soccer practice, I returned to the classroom. When I got near the room, I saw that Sugimura-kun was already there, his face swollen. I decided to wait a bit before going in. To be honest, I felt uncomfortable. We’d\u0026#160;been friends who played together ever since we were little, but right then, it felt like were complete strangers. I\u0026#160;thought, ‘If I get involved with him, I’ll get bullied, too.’ Perhaps Sugimura-kun saw how ugly my heart was. He didn’t say a word, but it was almost like he was sending out a plea for help. That day, he jumped out of the classroom window,” said Hirata. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ejumped\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e? Did he die?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He was declared brain dead. But even now, Sugimura-kun’s parents believe he’ll recover. They’re waiting for him. That day was so surreal, I still wonder if it was a hallucination. I couldn’t believe it. When Sugimura-kun jumped, I realized something. By selfishly focusing so much on my own desires, I helped drive a treasured friend to his death.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat incident had given birth to the man named Hirata Yousuke.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think Sugimura-kun can be saved, but I wanted to atone. I figure the only way for me to do that is to save others,” Hirata said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand what you’re feeling, but the world isn’t that simple, right? At this very moment, there’s someone being bullied somewhere. And they might try to take their own life, just like Sugimura-kun. You can’t stop them.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course I know that. I’m not a hero or anything. But I want to save the people close to me, at the very least. I must help them. That’s my penance for the sin I committed,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So what are you going to do, then? You want to save both Karuizawa and Manabe, but that’s not possible.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand that. It’s probably why you’re here with me right now,” he answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, Hirata knew that he was abnormal himself. At any rate, he was a man on a mission.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I never thought I’d ever tell this story to anyone. Nobody here knows the truth. That’s why I chose this school,” said Hirata. He tossed his empty juice can into the trash. “Will you and Horikita-san keep this confidential?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you promise not to get yourself involved, I’m sure Horikita will stay silent,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then I’ll believe in you two. Our philosophies are similar.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata had pledged not to involve himself in the Karuizawa issue. From this point onward, Hirata would probably come to me for help whenever he was in trouble. I had successfully gained Hirata’s cooperation, a power I’d always wanted. I’m sure he felt he’d gained something as well.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hirata. Since you have a large social network, I have a favor to ask.” I handed Hirata a piece of paper. He read it and accepted my request without so much as a displeased look. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, Ayanokouji-kun. There is one more thing I’ve been hiding from you. I know the identity of the last VIP from Class D.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e4.5\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ehe next day, I decided to make a move, but rather unexpectedly, Sakura called for me. I decided to go talk to her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks like the test is over for the Cow group,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah…” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI checked the email that Sakura, along with the other students, had received from the school. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“The test has now ended for the Cow group. Those in the Cow group are no longer required to participate any further. Please be careful not to disturb the other students.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was exactly the same kind of email we got after the Monkey group finished. It was a brief message, devoid of context. Sakura looked at me with unease in her eyes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Have I done something wrong?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, you haven’t. This just means that someone in the Cow group reported to the school who they think the VIP is.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLeaving aside the time Kouenji got carried away and ended the test for his group, right now it seemed that people were betraying each other for two very different reasons. They were either betraying with certainty, or betraying because they felt impatient.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sakura, were you the VIP? Or was it someone else?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura quickly shook her head. “No, I’m not the VIP. But I’m not sure about Sudou-kun or, um, the others,” she answered. She didn’t seem to have any idea whatsoever.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t overthink it. I don’t know the identity of the VIP in my group, either.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay. Thank you, Ayanokouji-kun. I’m happy you told me that.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How are things with Class A? I heard rumors that none of them are participating in the discussions.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, it’s just like what the others have been saying. None of them have talked at all,” said Sakura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi had been rather thorough in carrying out his plan. If that was true, then Class C had to have been the ones to trigger this new turn of events. But I was still left with doubts. Ryuuen claimed he understood the school’s rules, and I had my own ideas. However, it was still impossible to know whether I was correct or not. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I accidentally misread the rules, the class would self-destruct and take massive damage as a result. So far, the test hadn’t ended for anyone other than the Cow group—proof that Ryuuen still didn’t have a sure answer either. As we neared the end of this mysterious exam, many students were probably feeling perplexed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If there’s anything else, please let me know. You can talk to me anytime,” I told Sakura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you, Ayanokouji-kun. See you later.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI bid farewell to Sakura, who waved her hands adorably. Then I headed toward the ship’s lower levels. I proceeded down to the lowest level, where people didn’t generally go. Although we were prohibited from going there, the area wasn’t locked. The crew was probably using it. Although people could enter areas like the switchboard room if it was necessary, generally speaking, no one went in there.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no one to come if you called, no matter how loud you shouted. Including the regular entrance, there were only two ways in or out of the room. The other way was a door that led to the emergency staircase, but the workers didn’t appear to use that. Judging from the dust, I knew that it hadn’t been used in a long time. If I just kept an eye on the regular entrance, I could monitor the situation completely.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnother convenient thing was that phones had almost no reception here. Though you could occasionally get a little signal, sending emails or chatting was a pain in the neck, and it was next to impossible to make a call. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All the pieces are in place,” I muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAll I had to do was make sure everything happened in the proper order. First, I would contact Hirata, and then he would call Karuizawa. Since I wanted to postpone things a little bit, I’d probably need to have him call Karuizawa an hour or so earlier. I returned to the upper decks to make the call.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter our conversation last night, I thought Hirata might be especially on his guard. But I knew if Hirata called Karuizawa and said he wanted to speak with her alone, she’d respond. Karuizawa had said she was breaking up with Hirata, but she’d be the one to suffer if that happened. With Manabe and her friends on the attack, Karuizawa absolutely needed Hirata to protect her at school.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI got a message from Hirata. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI’ve promised to meet Karuizawa-san at 4:00 p.m. I’ll send you Manabe-san’s info\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs expected, Hirata had fulfilled his role admirably. As a bonus, he even had Manabe’s contact information, never mind that she was from another class. If he hadn’t known it, I would’ve had to risk asking Kushida. That saved me an extraordinary amount of trouble.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe sent me another message.\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e I have to tell you, I don’t want to make Karuizawa-san sad.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t want to make her sad, huh?” If he knew what I was about to do, Hirata would’ve been furious. But that wasn’t my problem. Even if she were to break here, I’d be fine so long as he didn’t find out. This is a rather extreme example, but even if you committed murder, you couldn’t be convicted without proof. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI quickly typed a message and hit send.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHey, you got a minute?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe message was short and sweet, completely harmless. As a rule, chat apps are one account per phone. However, there was a way around that. By creating another primary SNS account, your device could hold another. Of course, not many students split their account into a main and a sub. The benefits of switching between accounts were marginal at best. However, by creating a new account, I was able to contact a third party without revealing my identity.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI needed to proceed delicately. If I didn’t mess up, everything should be fine. Despite the fact that Manabe had received an anonymous message, she immediately responded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWho is this?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnly natural she’d ask that question.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eIs there anyone with you right now?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI’m alone, but who are you?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eDon’t show this to anyone. For your own sake.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eLook, who are you?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eLet’s just say that I hate the same person you do.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough I saw that she’d read my message, Manabe took some time to respond. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eDo you have the wrong number?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eThis isn’t a mistake, Manabe-san. I want to talk about Karuizawa-san, the person you hate. I thought I might be able to talk to you about it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI don’t know what you’re talking about. Please stop sending me messages.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe seemed wary, as if she imagined I might be an enemy. That was natural. First, I needed to win her trust.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI’m a classmate of hers, and it’s been difficult dealing with her for a long time now. I want to get revenge on her, so I thought we could work together. Since I’m in Class D with her, I can’t go after Karuizawa-san directly. That’s why I want your help.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI don’t know what you’re talking about. I’m going to ignore you.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though she was suspicious, she still hadn’t cut off contact. That proved how much Karuizawa made her blood boil. That was why she wanted revenge on behalf of her friend, Rika. From the way Manabe had dragged Karuizawa into the emergency stairwell, her hatred was clear.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eRika-chan is still scared of Karuizawa-san, even now. Don’t you want to help her? Your desire for revenge is written all over your face. But you couldn’t do it even if you wanted to, right? Karuizawa-san is really cautious after what happened yesterday. I’m sure she won’t leave Hirata-kun’s or Machida-kun’s side for a while. And she’ll always be with other girls, so she won’t be alone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI don’t need your help. I just need Karuizawa-san to talk to Rika. Then we’ll know the truth.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI wonder if it’ll be that simple, though? I can’t imagine she’ll admit that she lied. On the contrary, it would probably just hurt Rika-chan if Karuizawa-san says something awful. Oh, and that’s not all. If Karuizawa-san’s holding a grudge, she might bully Rika further.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWhat should I do? Are you saying there’s a way?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eManabe’s intense desire to settle things was evident.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eIf you and I work together, we can safely get our revenge.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWhat guarantee do I have? It feels like you’re trying to lure me into a trap, and then you’ll tattle to the school. This smells like a sub account.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eIf you think I’m trying to sell you out, Manabe-san, then go ahead and show this chat log to the teachers. You can only register accounts on school phones. I’m risking being identified by saying I want revenge on Karuizawa-san. I’m the one risking my neck here. Am I wrong?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’m sure Manabe understood. Even a sub account wasn’t perfectly safe. If I were exposed, I would obviously receive the harshest punishment.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSo if I show this chat log to the school, what then? It’ll be all over for you.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI don’t think you’re the kind of person to do that, Manabe-san. You have to show trust to be trusted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI understand. I’ll hear you out, at least.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter that, I repeated some familiar-sounding stories. Stuff about how much I hated Karuizawa. How I wanted to do something about it but couldn’t. How I’d heard about Manabe’s confrontation with Karuizawa by chance, and that I’d tried to make contact. I played the victim thoroughly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce we returned to land, it would be difficult for me to contact Karuizawa directly. The school buildings and dorms were equipped with security cameras. Even if you tried to bring her into a private area, it was still highly likely that someone would spot you. This ship gave Manabe the perfect opportunity. I made her understand that revenge was only possible while they were here. I slowly but surely roused her anger.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSo, what should I do?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that Manabe understood, I finally started to reveal my plan. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI’ll call Karuizawa-san. Then, you take your time talking with her, and settle things.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter I sent that message, I followed it up by sending a map of the ship’s lowest level. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSince you can’t get any reception down there, she can’t call for help. No one comes down there.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI see, I see. So since you’re her classmate, you can call Karuizawa-san?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI’d like you to tell me right now if you’re going along with my plan. After I call Karuizawa-san, you can decide whether you’ll take your revenge. There won’t be any problems that way, right?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe took a long time to respond, the longest for any response thus far. Finally, I saw her response, and was sure that my plan would succeed. If my attempts to convince her via chat had failed, I had another plan prepared, just in case. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt would have been dangerous, but I would’ve made direct contact with Manabe in person. I had taken pictures when she was threatening Karuizawa in the emergency stairwell; I could’ve blackmailed her with those. However, the risks were great. I wanted to avoid drawing attention to myself as much as humanly possible.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now. Let’s see what Manabe and her friends are capable of.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e4.6\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eS\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eometimes a deep, heavy noise echoed throughout the dark level. Perhaps it was the sound of the ship changing course, or maybe it was because the ship had bumped into something. I wasn’t entirely sure. But a lone girl came here, a place where all you could hear was the sound of machines. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s going on? I can’t connect to… There’s no signal.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were still over ten minutes left before her arranged meeting with Hirata. Maybe she’d arrived a little early to calm herself down. After she realized that she couldn’t use her phone, she put it back in her pocket and leaned against the wall, apparently bored. She closed her eyes and opened her mouth slightly, muttering something to herself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith how quietly she was muttering, I couldn’t hear her at all. What was she talking about? Unfortunately, Hirata wasn’t going to hear it. Once four o’clock rolled around, the door opened. I heard the dull sound of it. Three girls from Class C stepped through—Manabe and her friends. Wait…there was one other person with them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe seemed meek, rather like Sakura. This was probably Rika. “It’s all right,” said Manabe. Then she saw Karuizawa. Naturally, Karuizawa noticed them, too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what are you doing here?!” she asked, trembling.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe passageways inside the ship were narrow, so there weren’t many escape routes. Running away would be difficult. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just happened to see you come in here, that’s all. Well, I suppose this is the perfect opportunity. Let me introduce you. This is Rika. Do you remember her, Karuizawa-san?” asked Manabe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eManabe grabbed Rika, who was hiding behind her, and pulled her forward. She and Karuizawa were now facing each other. Karuizawa averted her eyes, pretending like she didn’t know her, but judging from her behavior it was obvious she remembered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Rika. Karuizawa-san was the one who shoved you, right?” asked Manabe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, she’s the one,” said Rika.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter hearing such a clear answer, Manabe smiled, looking happy as could be. Karuizawa, on the other hand, appeared increasingly anxious and confused. All I could do now was stay quiet and observe the miserable events that were about to unfold. Even if Karuizawa were subjected to an even more wretched ordeal than I could imagine, I had no intention of saving her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Apologize to Rika,” demanded Manabe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-huh? Who’s apologizing? I haven’t done anything wrong,” said Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Still acting tough. You’re a real piece of work, aren’t you? But I think I understand now, more or less,” snapped Manabe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Understand what?” asked Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your behavior. You’re unusually fearful. Karuizawa-san, you were bullied, weren’t you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wha—?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe had been trying to hide the truth, but her past had caught up with her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I hit the nail on the head, didn’t I? I knew it. I could feel it right from the start,” Manabe continued.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, you’re wrong!” Karuizawa denied it, but her words were weak. Even if she’d been an excellent actress, there wasn’t any point. It wasn’t as though Manabe was highly perceptive or anything. She knew because I’d told her everything beforehand. I’d told her that Karuizawa had been cruelly bullied ever since childhood. That she harbored deep trauma. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you get down on your knees and beg right now, I might forgive you. How about it? I mean, you’re good at groveling, right? Being on your knees?” Manabe mocked Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“N-no, I won’t! I’ve never done that kind of thing before!” Karuizawa shouted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa tried to slip past Manabe, but Manabe snatched her long hair and pulled her back, slamming her into the wall. Manabe was assured that the stage had been set for her revenge, so I couldn’t control her here. I’d only promised that she would “meet” with Karuizawa, after all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe should have agonized over whether to use violence. However, when she finally had the chance to be alone with Karuizawa, she let go of all other concerns. Because her friends were expecting her to get back at Karuizawa, I couldn’t imagine that this would end until Manabe had dished out a great deal of punishment. That’s what I’d been aiming for, anyway.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was like the Milgram experiment, a psychological study conducted in the 1960s. The test, also referred to as the Eichmann experiment, had been conducted by two groups of people in an isolated facility. Members of these two groups played the role of either the teacher or the student. First, the person playing the role of teacher—the subject of the experiment—would administer a low electric shock to the student so that they would remember the pain and fear associated with it. The student would be separated from the teacher and placed on the other side of the glass. Then a device was installed on the student’s side, one that would transmit the electric shock, while the switch to administer the shock was entrusted to the teacher. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt that point, the proctor overseeing the experiment instructed the teacher to give the student a series of problems. If the student made a mistake, the teacher was instructed to turn on the electric current. The teacher was told to increase the voltage every time the student answered incorrectly. The switch could administer shocks exceeding 450 volts, powerful enough to prove fatal. On the other hand, though, the shock administered for the first wrong question was only forty-five volts, which amounted to mild itching.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe subject could hear the student’s voice, which meant every time a shock was administered, the teacher could hear the student’s agonizing screams. However, unknown to the subject, the electric shock device installed on the student’s side was a fake. The student only pretended to be electrocuted. The teacher could hear the student’s suffering, though. At first, there wasn’t much of a reaction. As the voltage increased, the agonizing screams of the student grew louder. Eventually, the student fell silent.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe subject, the teacher, wasn’t threatened. They were only told they’d be rewarded and were free to do as they liked. In other words, even if the teacher asked to quit the test, they would be fine. Despite that, nearly 66% of subjects increased the voltage until they administered electric shocks powerful enough to kill someone. The experiment demonstrated that, depending on the circumstances, anyone was capable of incredible cruelty and brutality.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ow, ow! It hurts! Let me go!” screamed Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa wept at having her hair pulled, and pleaded, but Manabe only laughed like she was enjoying it. Right now, they were on the lowest level of the ship, a closed environment. Manabe was the subject, and Karuizawa the student. I’d successfully set the stage for a situation like the Milgram experiment. Even though you could say the conditions weren’t exactly the same, considering the relationship these two had cultivated, the situation was rather like the original experiment. Seeing Karuizawa suffer, especially after her proud behavior, probably felt great to them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Agh!” Karuizawa shouted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoa, Shiho. Don’t you think you’re hitting her a little too much? Wow, you’re harsh.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eManabe continued to drive her knee into Karuizawa’s stomach. Of course, Manabe wasn’t used to hitting someone like that, so her movements were sluggish. It shouldn’t have hurt much. But Karuizawa’s pain was Manabe’s greatest reward. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSeemingly in a great mood, she invited Rika to join in. Rika had been standing some distance away, watching anxiously.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on Rika. You give it a try, too,” urged Manabe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“N-no. I’m okay,” answered Rika.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re doing this for \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyour\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e sake, right? Come on, there’s no one around,” replied Manabe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRika wanted to refuse taking revenge, but that wasn’t allowed right now. If your friend coaxed and cajoled you to join in the fun, it’d be difficult to keep refusing. Rika knew that if Manabe’s anger were redirected at her, she could become the next victim. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“O-okay. I’ll try.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was the sound of a pathetically light slap. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ePap\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“L-Like that?” asked Rika.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, no, that’s no good at all. You need to put more force into it, like this.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWhap\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e! The sound echoed through the room. Karuizawa looked like she was in pain after that hit. Rika slapped Karuizawa again and again, just as she was instructed. Her slaps gradually grew more forceful.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“S-s-s-stop it!” pleaded Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ha ha. This is fun! Ha ha!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, maybe it was more appropriate to think of Rika as the subject of the Milgram experiment. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please, forgive me!” Karuizawa pleaded. Though she put on a brave face, she was clearly in pain.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSeeing her like that must have felt euphoric for Manabe and the others. Rika started to punch and kick rather strongly, to the point where I couldn’t believe she’d ever been scared. Also, even though she left some marks on easy-to-spot places like Karuizawa’s cheeks, Rika focused on hitting places you wouldn’t be able to see normally, like under her uniform or beneath her hair. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa collapsed in fear, tears streaming down her face. I moved without making a sound. I quietly opened the door, taking care that Manabe and her friends wouldn’t see. They would all continue to take out their frustrations on Karuizawa a little longer. I didn’t particularly mind.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter all, if something has been thoroughly destroyed, it saves me time and effort when I need to build it back up. I quietly closed the door and was no longer able to hear Karuizawa’s screams.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e4.7\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003efter I confirmed that Manabe and her friends were gone, I entered the room. Karuizawa should’ve heard the door open, but she continued to cower and cry on the ground. Perhaps she didn’t notice me coming in because she was so overcome by fear. So this was how the leader of the girls, so arrogant and headstrong, really was?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps thanks to the advice I’d given to Manabe and her friends, Karuizawa’s uniform and the parts of her body that you could normally see appeared undamaged. If her uniform had been ripped, or if they’d cut her hair, it would’ve been difficult for the Class C girls to go unpunished. While bullying is common, our school’s unique setup made bullying much more difficult to get away with.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf anything might have been a cause for concern, it was her cheeks, reddened from being slapped over and over. The marks would fade by tomorrow, though.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Karuizawa.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I called her, she finally noticed me. She lifted her head. “Wh-why are…” she stammered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wasn’t supposed to be here. She panicked at being seen like that, but couldn’t just stop crying and act as though nothing had happened. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe would eventually stop crying. She would eventually calm down. If I left right now, what I wanted to happen wouldn’t take place. I continued to wait quietly, without trying to talk to her. After some time passed, Karuizawa gradually stopped bawling, and she started to calm down. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf two people were alone together in a dark, closed room, a sort of natural intimacy occurred. Even if the people normally hated each other, the psychological distance between them would lessen. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Have you calmed down a bit?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A little.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa still didn’t stand. She wiped the tears away with her uniform sleeve. I reached out to help her up, but she didn’t move to take my hand.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Where’s Hirata-kun?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sounds like he was supposed to meet you here. I\u0026#160;would guess that a teacher called him away. I just happened to be with him when he mentioned you, so I came here in his place.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat explanation should have been enough to satisfy her and save me the trouble of further questions. There wasn’t any need to tell her the truth right now. First, I needed to get her to relax, and then fill in the cracks of her heart.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why were you crying?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Manabe and her friends… I absolutely will not let them get away with that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa started trembling as she recalled what they’d done to her. Even if she didn’t want to reveal this pathetic side of herself, the trauma was buried so deep that her pain wasn’t easily hidden.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You have to keep this a secret. If anyone finds out, I’ll never forgive you,” she warned me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa’s weakness was that she couldn’t stand being seen as a victim by the rest of the school. If people found out that Manabe and her friends had used violence, then the school would inevitably expose the details of what had happened and why. To protect her social standing, Karuizawa couldn’t afford to let that happen. That was why she’d planned to use Hirata to stop Manabe and her friends.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know, you could get back at Manabe and the others. Since they’re girls, even someone like you could win,” she suggested to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s an insane request,” I answered flatly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What, are you scared of getting even with Manabe and her friends? And you’re supposed to be a guy,” she chided.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you attack them, it’ll all be over. You should know from what happened with Sudou that this isn’t a simple matter. Don’t you get it? An eye for an eye won’t solve anything. Things will only get further out of hand. The school will carry out an investigation and conduct interviews. You don’t want that, right, Karuizawa?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So you’ll just lie down and take it?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI knew how to respond, but decided to stay silent.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But they would… They’ll continue to do awful things to me,” muttered Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe started shaking again. In truth, there was no guarantee that Manabe and her friends would stop. Karuizawa could find many ways to escape back at school, but she couldn’t continue playing hide-and-seek with Manabe forever. Her classmates would eventually notice a change in Karuizawa’s behavior. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa was caught between a rock and a hard place, desperate to get out of this situation. I’d been waiting for that desperation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would be terrible if things went back to how they were back in the old days. I understand that you want to prevent it,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? What are you talking about?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa should be putting things together by now. Even if it was clear how I knew that Manabe and her friends had bullied her, she should wonder how I knew about her past. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I meant exactly what I said. You’ve managed to escape by getting into this prestigious school and rising through the ranks to reign supreme at the head of Class D. But in the end, you haven’t really changed at all. You’re still that bullied little girl.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-who are you talking about?!” she shouted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You, Karuizawa.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI grabbed her arm and forced her up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-hey, what are you doing?!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI pinned her up against the wall and forced her to look me in the eye. “Manabe tormented you just now, yes? She and her friends pulled your hair and slapped your face. They kicked you in the chest, in your stomach, didn’t they? That’s why you ended up like this: miserable, pathetic, crying on the ground.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol4_INTERIORILLUSTRATIONS_10\" src=\"/hola-lector-agua/images/books/v4/OEBPS/Images/ClassroomElite-Vol4_INTERIORILLUSTRATIONS_10.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wha—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOur eyes met. We stared as if we were being sucked into one another. Of course, there wasn’t any hint of love there. Only darkness.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You were bullied ever since you were little. You were a victim throughout elementary school and junior high. You wanted to act tough so you could stop being bullied. Am I right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“D-did you hear this…from Hirata-kun?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hirata is everyone’s ally, for better or worse. He’ll help you, like he’ll help anyone. Even if you got your position in Class D by pretending to be Hirata’s girlfriend, he won’t be of any use to you in situations like this. He isn’t a good enough host for a parasite like you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa was much smarter than other people thought. She had taken care not to overdo it in the Rabbit group precisely because she understood Hirata’s neutral stance. That was probably why she was so reserved at first. However, as a display of her status, she’d started trouble with Rika, which led to this current predicament. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you… Why are you doing this, huh?!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why? It’s obvious, isn’t it? You need to understand your situation. Don’t you know who’s standing in front of you right now? It’s not Hirata; it’s me. I know everything. I know about your past. I know about your fake relationship with Hirata. I even know that Manabe and her friends tortured you to the point where you started bawling.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI knew everything that Karuizawa Kei wanted to hide.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had her heart in my hands. Right now, I would decide whether she lived or died.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you don’t do as I say, I can expose you,” I added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa understood better than anyone how terrifying that was. “D-don’t screw with me! Who the hell do you think you are?!” she shouted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Someone who knows the truth. Nothing more, nothing less.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI moved in so close to her that our faces almost touched. When she turned her face away and tried to avert her eyes, I grabbed her chin and forced her to look at me. She wanted to look away, but with a man’s strength bearing down on her, she couldn’t move. She closed her eyes, as if trying to escape my gaze.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What, what do you want with me?! You’re just after my body, aren’t you?” she screamed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size
